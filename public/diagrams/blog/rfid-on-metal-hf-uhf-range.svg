<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Read range on metal, log scale: HF/NFC taps at 1-3 cm, UHF with ferrite reaches 30 cm to 12 m</title>
<desc id="d">Log-scale bar chart of read range on metal. A gold HF/NFC bar at 13.56 MHz covers tap distance, 1 to 3 centimetres, where your phone is the reader and no UHF hardware is needed. A teal UHF-plus-ferrite bar starts at 30 centimetres and runs to 5 metres, with a lighter extension to 12 metres for long-range designs. A dashed decision line marks roughly 30 centimetres: need a metre or more on metal and UHF is the only realistic option. A footnote warns that inside a sealed metal enclosure or Faraday cage neither band works — run an external antenna into the box.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHEN TO SWITCH FREQUENCY ENTIRELY</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">How far do you need to read on metal?</text>

<text x="90" y="170" font-size="13" font-weight="800" letter-spacing="1" fill="#6d5a3a">READ RANGE ON METAL · LOG SCALE</text>

<rect x="479" y="190" width="210" height="30" rx="15" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.5"/>
<text x="584" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">≈ 30 cm decision line</text>
<line x1="584" y1="222" x2="584" y2="470" stroke="#4a5568" stroke-width="1.6" stroke-dasharray="6 5"/>

<text x="90" y="238" font-size="15" font-weight="700" fill="#291c0e">HF / NFC (13.56 MHz) — tap distance, 1–3 cm</text>
<rect x="90" y="252" width="160" height="30" rx="15" fill="#c39a5f"/>
<text x="90" y="306" font-size="12.5" fill="#6d5a3a">your phone is the reader — no UHF hardware needed</text>

<text x="594" y="350" font-size="15" font-weight="700" fill="#291c0e">UHF + ferrite — 0.3–5 m (12 m long-range)</text>
<rect x="584" y="364" width="409" height="30" rx="15" fill="#3d6b6b"/>
<rect x="993" y="364" width="127" height="30" rx="15" fill="#c5d3d3"/>
<text x="594" y="418" font-size="12.5" font-weight="700" fill="#2c5454">need ≥ 1 m on metal? UHF is the only realistic option</text>

<line x1="90" y1="470" x2="1120" y2="470" stroke="#9ba2ab" stroke-width="2"/>
<line x1="90" y1="464" x2="90" y2="476" stroke="#9ba2ab" stroke-width="1.5"/>
<line x1="250" y1="464" x2="250" y2="476" stroke="#9ba2ab" stroke-width="1.5"/>
<line x1="425" y1="464" x2="425" y2="476" stroke="#9ba2ab" stroke-width="1.5"/>
<line x1="584" y1="464" x2="584" y2="476" stroke="#9ba2ab" stroke-width="1.5"/>
<line x1="759" y1="464" x2="759" y2="476" stroke="#9ba2ab" stroke-width="1.5"/>
<line x1="919" y1="464" x2="919" y2="476" stroke="#9ba2ab" stroke-width="1.5"/>
<line x1="993" y1="464" x2="993" y2="476" stroke="#9ba2ab" stroke-width="1.5"/>
<line x1="1120" y1="464" x2="1120" y2="476" stroke="#9ba2ab" stroke-width="1.5"/>
<text x="90" y="496" text-anchor="middle" font-size="13" fill="#4f4f4f">1 cm</text>
<text x="250" y="496" text-anchor="middle" font-size="13" fill="#4f4f4f">3 cm</text>
<text x="425" y="496" text-anchor="middle" font-size="13" fill="#4f4f4f">10 cm</text>
<text x="584" y="496" text-anchor="middle" font-size="13" fill="#4f4f4f">30 cm</text>
<text x="759" y="496" text-anchor="middle" font-size="13" fill="#4f4f4f">1 m</text>
<text x="919" y="496" text-anchor="middle" font-size="13" fill="#4f4f4f">3 m</text>
<text x="993" y="496" text-anchor="middle" font-size="13" fill="#4f4f4f">5 m</text>
<text x="1120" y="496" text-anchor="middle" font-size="13" fill="#4f4f4f">12 m</text>

<rect x="90" y="536" width="22" height="22" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<line x1="94" y1="540" x2="108" y2="554" stroke="#8b2d2d" stroke-width="2.5"/>
<text x="124" y="546" font-size="13.5" font-weight="700" fill="#8b2d2d">Sealed metal enclosure or Faraday cage: neither band works.</text>
<text x="124" y="568" font-size="12.5" fill="#4f4f4f">Physics doesn't negotiate — run an external antenna into the box.</text>

<text x="600" y="628" text-anchor="middle" font-size="14" fill="#5c5c5c">Tap-distance job with phones already in pockets → HF. Real distance on steel → UHF with ferrite. That's the whole decision.</text>
</svg>
