<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">What each hotel door-lock LED state means and what to do</title>
<desc id="d">A legend of hotel door-lock LED states with the meaning and the action for each. Solid green means the bolt actuated and the door is open; if it will not push, the fault is mechanical. Green with no motor click means the battery is too low to drive the bolt; replace the batteries, the card is good. Solid red means the card is invalid for that door; re-encode it, do not replace it. Alternating red and green means a firmware error state; power-cycle by pulling one battery for thirty seconds. Amber or yellow is a low-battery warning; schedule replacement within seven days. No light and no sound means the lock is dead; use the mechanical override and call the vendor.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DOOR-LOCK LIGHTS · WHAT THEY MEAN</text>
<text x="600" y="82" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Same state machine across ASSA ABLOY, dormakaba, Salto and Onity — read the pattern, not the colour.</text>

<text x="140" y="126" font-size="12" font-weight="800" letter-spacing="0.6" fill="#6d5a3a">STATE</text>
<text x="392" y="126" font-size="12" font-weight="800" letter-spacing="0.6" fill="#6d5a3a">MEANS</text>
<text x="772" y="126" font-size="12" font-weight="800" letter-spacing="0.6" fill="#6d5a3a">DO THIS</text>

<!-- row 1 solid green -->
<rect x="64" y="140" width="1072" height="58" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<circle cx="104" cy="169" r="15" fill="#1f6f3a"/>
<text x="140" y="174" font-size="15" font-weight="800" fill="#291c0e">Solid green</text>
<text x="392" y="174" font-size="14" fill="#333333">Bolt actuated, door open</text>
<text x="772" y="174" font-size="14" fill="#2c5454">If it won't push, it's mechanical</text>

<!-- row 2 green no click -->
<rect x="64" y="214" width="1072" height="58" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<circle cx="104" cy="243" r="15" fill="#1f6f3a" stroke="#c39a5f" stroke-width="3"/>
<text x="140" y="248" font-size="15" font-weight="800" fill="#291c0e">Green, no click</text>
<text x="392" y="248" font-size="14" fill="#333333">Battery too low to drive the bolt</text>
<text x="772" y="248" font-size="14" fill="#2c5454">Replace batteries — the card is good</text>

<!-- row 3 solid red -->
<rect x="64" y="288" width="1072" height="58" rx="10" fill="#faf1f1" stroke="#ecdada" stroke-width="1.3"/>
<circle cx="104" cy="317" r="15" fill="#8b2d2d"/>
<text x="140" y="322" font-size="15" font-weight="800" fill="#291c0e">Solid red</text>
<text x="392" y="322" font-size="14" fill="#333333">Card invalid for this door</text>
<text x="772" y="322" font-size="14" fill="#2c5454">Re-encode; don't replace the card</text>

<!-- row 4 alternating red/green -->
<rect x="64" y="362" width="1072" height="58" rx="10" fill="#faf1f1" stroke="#ecdada" stroke-width="1.3"/>
<circle cx="104" cy="391" r="15" fill="#1f6f3a"/>
<path d="M104,376 A15,15 0 0 1 104,406 Z" fill="#8b2d2d"/>
<text x="140" y="396" font-size="15" font-weight="800" fill="#291c0e">Alternating red / green</text>
<text x="392" y="396" font-size="14" fill="#333333">Lock firmware in an error state</text>
<text x="772" y="396" font-size="14" fill="#2c5454">Power-cycle: pull one battery 30s</text>

<!-- row 5 amber -->
<rect x="64" y="436" width="1072" height="58" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<circle cx="104" cy="465" r="15" fill="#d4a755"/>
<text x="140" y="470" font-size="15" font-weight="800" fill="#291c0e">Amber / yellow</text>
<text x="392" y="470" font-size="14" fill="#333333">Low-battery warning</text>
<text x="772" y="470" font-size="14" fill="#2c5454">Schedule replacement within 7 days</text>

<!-- row 6 no light -->
<rect x="64" y="510" width="1072" height="58" rx="10" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/>
<circle cx="104" cy="539" r="15" fill="#b9b3a8"/>
<text x="140" y="544" font-size="15" font-weight="800" fill="#291c0e">No light, no sound</text>
<text x="392" y="544" font-size="14" fill="#333333">Lock is fully dead</text>
<text x="772" y="544" font-size="14" fill="#2c5454">Mechanical override; call the vendor</text>

<text x="600" y="606" text-anchor="middle" font-size="15" fill="#4f4f4f">The colour convention varies by vendor; the underlying state — and the fix — does not.</text>
</svg>
