<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="heroT heroD" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <title id="heroT">Scan a HIPAA-safe wristband and the chip returns only an opaque ID</title>
      <desc id="heroD">A left-to-right flow. The Tyvek wristband carries an NTAG 424 DNA chip. A scan returns only a random UUID — no name, no medical record number, no diagnosis. That token is meaningless to a stranger. Only an authenticated clinician session over TLS 1.2+ resolves the UUID to the patient record, which lives in the EHR, not on the band. Footer: opaque ID only on the chip; AES-128 mutual authentication via NTAG 424 DNA; PHI stays in the EHR, retrieved server-side.</desc>
      <defs>
        <radialGradient id="hBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8f2e6"/><stop offset="100%" stop-color="#f1ece0"/></radialGradient>
        <linearGradient id="hDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
        <linearGradient id="hVault" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#245a6b"/><stop offset="100%" stop-color="#18343e"/></linearGradient>
        <marker id="hArrow" markerWidth="11" markerHeight="11" refX="3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c39a5f"/></marker>
      </defs>
      <rect width="1200" height="675" fill="url(#hBg)"/>
      <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
      <text x="600" y="62" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="2.5" fill="#6d5a3a">THE WRISTBAND THAT KNOWS THE LEAST</text>
      <text x="600" y="92" text-anchor="middle" font-size="16.5" fill="#4f4f4f">Sensitive data never rides on the band — only a key that's worthless without the lock</text>

      <!-- Stage A: the band -->
      <g>
        <rect x="58" y="150" width="300" height="300" rx="16" fill="#fbf8f2" stroke="#e4d8bf" stroke-width="2"/>
        <text x="208" y="184" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1.4" fill="#6d5a3a">THE WRISTBAND</text>
        <!-- band -->
        <path d="M96 250 q-14 34 0 68 h224 q14 -34 0 -68 z" fill="#ffffff" stroke="#b9a074" stroke-width="2"/>
        <rect x="120" y="266" width="120" height="36" rx="6" fill="#fbf6ec" stroke="#d8c39a" stroke-width="1.5"/>
        <text x="180" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e" font-family="ui-monospace,Menlo,monospace">PT-7Q2F-4K9</text>
        <!-- chip -->
        <rect x="256" y="262" width="44" height="44" rx="6" fill="#efe0bf" stroke="#c39a5f" stroke-width="2"/>
        <rect x="268" y="274" width="20" height="20" rx="3" fill="#c39a5f"/>
        <path d="M262 270 h-7 M262 284 h-7 M262 298 h-7 M300 270 h7 M300 284 h7 M300 298 h7" stroke="#c39a5f" stroke-width="2"/>
        <text x="208" y="360" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Single-use Tyvek band</text>
        <text x="208" y="382" text-anchor="middle" font-size="14.5" fill="#4f4f4f">+ NTAG 424 DNA chip</text>
        <text x="208" y="420" text-anchor="middle" font-size="13.5" font-style="italic" fill="#8a7a5f">Printed ID for the eye,</text>
        <text x="208" y="438" text-anchor="middle" font-size="13.5" font-style="italic" fill="#8a7a5f">RFID ID for the reader.</text>
      </g>
      <line x1="360" y1="300" x2="418" y2="300" stroke="#c39a5f" stroke-width="3.5" marker-end="url(#hArrow)"/>
      <text x="389" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5a3a">scan</text>

      <!-- Stage B: the opaque token -->
      <g>
        <rect x="432" y="150" width="300" height="300" rx="16" fill="#fbf8f2" stroke="#e4d8bf" stroke-width="2"/>
        <text x="582" y="184" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1.4" fill="#6d5a3a">WHAT THE CHIP HANDS OVER</text>
        <rect x="456" y="212" width="252" height="70" rx="10" fill="#20262e"/>
        <text x="582" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#1fcefb" font-family="ui-monospace,Menlo,monospace">a9f3c1e0-4b2d</text>
        <text x="582" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#1fcefb" font-family="ui-monospace,Menlo,monospace">-47aa-8b7d</text>
        <text x="582" y="312" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">An opaque random UUID</text>
        <text x="582" y="344" text-anchor="middle" font-size="14" fill="#4f4f4f">no name · no MRN</text>
        <text x="582" y="364" text-anchor="middle" font-size="14" fill="#4f4f4f">no diagnosis · no allergies</text>
        <rect x="480" y="392" width="204" height="34" rx="17" fill="#f7ecea"/>
        <text x="582" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">To a stranger: meaningless</text>
      </g>
      <g>
        <line x1="734" y1="300" x2="792" y2="300" stroke="#1fcefb" stroke-width="3.5" marker-end="url(#hArrow)"/>
        <text x="763" y="284" text-anchor="middle" font-size="11.5" font-weight="700" fill="#177a92">clinician</text>
        <text x="763" y="330" text-anchor="middle" font-size="11.5" font-weight="700" fill="#177a92">auth · TLS</text>
      </g>

      <!-- Stage C: the EHR vault -->
      <g>
        <rect x="806" y="150" width="336" height="300" rx="16" fill="url(#hVault)" stroke="#123039" stroke-width="2"/>
        <text x="974" y="184" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1.4" fill="#bfe6f0">THE EHR — WHERE PHI LIVES</text>
        <!-- lock -->
        <rect x="946" y="212" width="56" height="46" rx="8" fill="#1fcefb"/>
        <path d="M956 212 v-10 a18 18 0 0 1 36 0 v10" fill="none" stroke="#bfe6f0" stroke-width="6"/>
        <rect x="970" y="228" width="8" height="16" rx="4" fill="#0d2b34"/>
        <!-- record card -->
        <rect x="846" y="278" width="256" height="150" rx="10" fill="#ffffff" opacity="0.96"/>
        <text x="866" y="308" font-size="14.5" font-weight="700" fill="#18343e">Patient record</text>
        <line x1="866" y1="318" x2="1082" y2="318" stroke="#e0e6ea" stroke-width="1.5"/>
        <text x="866" y="342" font-size="13.5" fill="#3a4a52">Name · MRN</text>
        <text x="866" y="366" font-size="13.5" fill="#3a4a52">Allergies · medications</text>
        <text x="866" y="390" font-size="13.5" fill="#3a4a52">Care team · orders</text>
        <text x="866" y="416" font-size="12.5" font-style="italic" fill="#245a6b">Resolved only after a valid login</text>
      </g>

      <!-- Footer stat strip -->
      <rect x="58" y="486" width="1084" height="150" rx="16" fill="url(#hDark)"/>
      <g text-anchor="middle">
        <text x="245" y="538" font-size="25" font-weight="800" fill="#ffffff">Opaque ID only</text>
        <text x="245" y="566" font-size="14" fill="#e7d8b8">on the chip and over RF</text>
        <text x="600" y="538" font-size="25" font-weight="800" fill="#ffffff">AES-128 mutual auth</text>
        <text x="600" y="566" font-size="14" fill="#e7d8b8">NTAG 424 DNA · tamper-evident</text>
        <text x="955" y="538" font-size="25" font-weight="800" fill="#ffffff">PHI stays in the EHR</text>
        <text x="955" y="566" font-size="14" fill="#e7d8b8">retrieved server-side after scan</text>
        <line x1="423" y1="516" x2="423" y2="588" stroke="#8a6f3e" stroke-width="1.5"/>
        <line x1="778" y1="516" x2="778" y2="588" stroke="#8a6f3e" stroke-width="1.5"/>
        <text x="600" y="616" font-size="14.5" font-style="italic" fill="#8fdcf3">Drop the band in the parking lot and you've leaked exactly one thing: a random number.</text>
      </g>
    </svg>
