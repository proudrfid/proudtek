<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hotel key card cost — the two cards on the quote vs the program stack around them</title>
<desc id="d">Left: the two cards everyone compares — a magstripe card at $0.10-0.25 that lasts 3-6 months and is replaced at 30-50 percent a year, and an RFID card at $0.30-1.00 that lasts 2-5 years and cuts complaints 60-80 percent. Right: the stack around the card that the quote never shows — encoders at $500-1,500 each, integration and firmware at $50-200 per lock, re-encode labor at $15-45K a year and lost cards at $16-32K a year — which together run 3-5x the per-card spend across a 5-year program.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE PRICE ON THE QUOTE vs THE PRICE OF THE PROGRAM</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">The card is the smallest line item in its own program</text>

<rect x="60" y="128" width="560" height="462" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="340" y="166" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">THE TWO CARDS EVERYONE COMPARES</text>

<rect x="100" y="195" width="220" height="138" rx="12" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<rect x="100" y="222" width="220" height="26" fill="#4a5568"/>
<text x="210" y="368" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Magstripe — $0.10-0.25</text>
<text x="210" y="390" text-anchor="middle" font-size="12.5" fill="#4f4f4f">lasts 3-6 months</text>
<text x="210" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">30-50% replaced every year</text>

<rect x="360" y="195" width="220" height="138" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="384" y="236" width="34" height="26" rx="4" fill="#c39a5f"/>
<path d="M 520 258 a 14 14 0 0 1 14 14" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 520 246 a 26 26 0 0 1 26 26" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 520 234 a 38 38 0 0 1 38 38" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<text x="470" y="368" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">RFID — $0.30-1.00</text>
<text x="470" y="390" text-anchor="middle" font-size="12.5" fill="#4f4f4f">lasts 2-5 years</text>
<text x="470" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6f3a">complaints down 60-80%</text>

<text x="340" y="452" text-anchor="middle" font-size="14" font-weight="600" fill="#291c0e">Per-card price: the number everyone compares.</text>
<text x="340" y="474" text-anchor="middle" font-size="13" fill="#4f4f4f">It also decides the least.</text>
<rect x="120" y="492" width="440" height="58" rx="12" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="340" y="516" text-anchor="middle" font-size="13" font-weight="600" fill="#291c0e">Cost-per-stay flips the ranking once replacement</text>
<text x="340" y="536" text-anchor="middle" font-size="13" font-weight="600" fill="#291c0e">rate and lifespan enter the math</text>

<rect x="650" y="128" width="490" height="462" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="895" y="166" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">THE STACK AROUND THE CARD</text>

<rect x="700" y="195" width="390" height="56" rx="10" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="720" y="229" font-size="14" font-weight="700" fill="#291c0e">Cards — the quoted line</text>
<text x="1070" y="229" text-anchor="end" font-size="14.5" font-weight="800" fill="#6d5a3a">$0.10-1.50</text>

<rect x="700" y="263" width="390" height="52" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="720" y="295" font-size="14" font-weight="600" fill="#291c0e">Encoding hardware</text>
<text x="1070" y="295" text-anchor="end" font-size="14" font-weight="800" fill="#2c5454">$500-1,500 each</text>

<rect x="700" y="325" width="390" height="52" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="720" y="357" font-size="14" font-weight="600" fill="#291c0e">Integration &amp; firmware</text>
<text x="1070" y="357" text-anchor="end" font-size="14" font-weight="800" fill="#2c5454">$50-200/lock</text>

<rect x="700" y="387" width="390" height="52" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="720" y="419" font-size="14" font-weight="600" fill="#291c0e">Re-encode labor</text>
<text x="1070" y="419" text-anchor="end" font-size="14" font-weight="800" fill="#2c5454">$15-45K/yr</text>

<rect x="700" y="449" width="390" height="52" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="720" y="481" font-size="14" font-weight="600" fill="#291c0e">Lost &amp; replaced cards</text>
<text x="1070" y="481" text-anchor="end" font-size="14" font-weight="800" fill="#2c5454">$16-32K/yr</text>

<rect x="700" y="513" width="390" height="56" rx="10" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="895" y="537" text-anchor="middle" font-size="15.5" font-weight="800" fill="#1b4332">Stack: 3-5x the per-card spend</text>
<text x="895" y="557" text-anchor="middle" font-size="12.5" fill="#1b4332">across a 5-year program</text>

<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Two cards, one program — the plastic is the smallest number on the invoice.</text>
</svg>
