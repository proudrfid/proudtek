<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="rfTitle rfDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="rfTitle">Five red flags that disqualify a hotel keycard supplier</title>
  <desc id="rfDesc">Five stacked disqualifiers: cannot name the lock's required chip family on a 15-minute call; quotes 'MIFARE-compatible' with no part number, usually a Fudan FM11RF08 clone with a disclosed backdoor; refuses a free 25 to 50 card sample or charges below 5,000 units; has no third-party test reports for ISO 14443, ISO 7810 or ASTM D3359 / ISO 2409; and lets the MOQ creep from 1,000 to 5,000 mid-quote.</desc>

  <defs>
    <radialGradient id="rfBg" cx="50%" cy="16%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#rfBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="66" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="2" fill="#8b2d2d">FIVE RED FLAGS THAT DISQUALIFY</text>

  <!-- Row 1 -->
  <rect x="56" y="96" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="139" r="31" fill="#8b2d2d"/><text x="116" y="148" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">1</text>
  <text x="180" y="132" font-size="23" font-weight="800" fill="#291c0e">Can't name your lock's required chip family</text>
  <text x="180" y="162" font-size="16" fill="#4f4f4f">On a 15-minute call — a generic PVC factory, not a hospitality specialist</text>
  <rect x="910" y="117" width="200" height="44" rx="22" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/><text x="1010" y="145" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1" fill="#8b2d2d">DISQUALIFY</text>

  <!-- Row 2 -->
  <rect x="56" y="192" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="235" r="31" fill="#a3402d"/><text x="116" y="244" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">2</text>
  <text x="180" y="228" font-size="23" font-weight="800" fill="#291c0e">&#8220;MIFARE-compatible&#8221; with no part number</text>
  <text x="180" y="258" font-size="16" fill="#4f4f4f">Usually a Fudan FM11RF08 clone — the publicly disclosed backdoor fails audits</text>
  <rect x="910" y="213" width="200" height="44" rx="22" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/><text x="1010" y="241" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1" fill="#8b2d2d">DISQUALIFY</text>

  <!-- Row 3 -->
  <rect x="56" y="288" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="331" r="31" fill="#b5623f"/><text x="116" y="340" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">3</text>
  <text x="180" y="324" font-size="23" font-weight="800" fill="#291c0e">Refuses a free 25–50 card sample</text>
  <text x="180" y="354" font-size="16" fill="#4f4f4f">Or charges for samples below 5,000 units — margin-strapped, or won't pass your lock test</text>
  <rect x="910" y="309" width="200" height="44" rx="22" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/><text x="1010" y="337" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1" fill="#8b2d2d">DISQUALIFY</text>

  <!-- Row 4 -->
  <rect x="56" y="384" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="427" r="31" fill="#c17d52"/><text x="116" y="436" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">4</text>
  <text x="180" y="420" font-size="23" font-weight="800" fill="#291c0e">No third-party test reports</text>
  <text x="180" y="450" font-size="16" fill="#4f4f4f">ISO 14443 · ISO 7810 · ASTM D3359 / ISO 2409 — ask twice and they don't exist</text>
  <rect x="910" y="405" width="200" height="44" rx="22" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/><text x="1010" y="433" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1" fill="#8b2d2d">DISQUALIFY</text>

  <!-- Row 5 -->
  <rect x="56" y="480" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="523" r="31" fill="#6d5a3a"/><text x="116" y="532" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">5</text>
  <text x="180" y="516" font-size="23" font-weight="800" fill="#291c0e">MOQ creep mid-quote</text>
  <text x="180" y="546" font-size="16" fill="#4f4f4f">1,000 quoted, then 5,000 "because the chip lot is bigger" — walk</text>
  <rect x="910" y="501" width="200" height="44" rx="22" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/><text x="1010" y="529" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1" fill="#8b2d2d">DISQUALIFY</text>

  <text x="600" y="612" text-anchor="middle" font-size="16.5" fill="#6d5a3a">Five ways a supplier removes itself from your shortlist — before you open the sample box.</text>
</svg>
