<rect x="628" y="396" width="508" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="100" cy="431" r="11" fill="#8b2d2d"/><line x1="94" y1="425" x2="106" y2="437" stroke="#ffffff" stroke-width="2.4"/><line x1="106" y1="425" x2="94" y2="437" stroke="#ffffff" stroke-width="2.4"/>
<circle cx="664" cy="431" r="11" fill="#1f6f3a"/><polyline points="659,432 663,436 671,426" fill="none" stroke="#ffffff" stroke-width="2.6"/>
<text x="124" y="436" font-size="14.5" fill="#291c0e">Bibs handed out, never scanned</text>
<text x="688" y="436" font-size="14.5" fill="#234a4a">Scan-on-pickup registers each UID</text>
<line x1="581" y1="431" x2="599" y2="431" stroke="#291c0e" stroke-width="2.3"/><polygon points="599,425 609,431 599,437" fill="#291c0e"/>

<rect x="64" y="478" width="508" height="70" rx="12" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.4"/>
<rect x="628" y="478" width="508" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="100" cy="513" r="11" fill="#8b2d2d"/><line x1="94" y1="507" x2="106" y2="519" stroke="#ffffff" stroke-width="2.4"/><line x1="106" y1="507" x2="94" y2="519" stroke="#ffffff" stroke-width="2.4"/>
<circle cx="664" cy="513" r="11" fill="#1f6f3a"/><polyline points="659,514 663,518 671,508" fill="none" stroke="#ffffff" stroke-width="2.6"/>
<text x="124" y="518" font-size="14.5" fill="#291c0e">No clock-sync race morning</text>
<text x="688" y="518" font-size="14.5" fill="#234a4a">One NTP source for every clock</text>
<line x1="581" y1="513" x2="599" y2="513" stroke="#291c0e" stroke-width="2.3"/><polygon points="599,507 609,513 599,519" fill="#291c0e"/>

<text x="600" y="602" text-anchor="middle" font-size="14.5" fill="#4f4f4f">None of these are technology failures — they're checklist failures.</text>
</svg>
