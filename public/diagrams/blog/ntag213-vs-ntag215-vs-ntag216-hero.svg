<text x="216" y="530" text-anchor="middle" font-size="13.5" fill="#4f4f4f">holds one short URL and a smile</text>
<text x="600" y="530" text-anchor="middle" font-size="13.5" fill="#4f4f4f">several records, a vCard — or an amiibo</text>
<text x="984" y="530" text-anchor="middle" font-size="13.5" fill="#4f4f4f">configs and long text — tag as hard drive</text>

<rect x="140" y="580" width="920" height="52" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="612" text-anchor="middle" font-size="14.5" font-weight="600" fill="#291c0e">Identical radio, security toolkit and phone support — memory is the whole decision.</text>
