<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Repositionable workflow — the tag moves with the fleet</title>
<desc id="d">Four-step loop of a magnet-mount tag being snapped onto an asset, read, pried off and moved to the next asset, contrasted with adhesive and weld mounts.</desc>
<rect width="1200" height="675" fill="#f8f6f1"/>
<text x="60" y="64" font-family="Georgia, serif" font-size="34" fill="#291c0e">The tag moves with the fleet</text>
<text x="60" y="98" font-family="Verdana, sans-serif" font-size="16" fill="#6d5a3a">Rental returns, RTI pools, tool cribs — assets churn, and the tag simply changes seats</text>
<g font-family="Verdana, sans-serif">
<rect x="90" y="160" width="240" height="104" rx="10" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<text x="110" y="192" font-size="16" fill="#291c0e" font-family="Georgia, serif">Snap on</text>
<text x="110" y="216" font-size="12.5" fill="#6d5a3a">no tools, no adhesive cure,</text>
<text x="110" y="235" font-size="12.5" fill="#6d5a3a">no hot-work permit</text>
<rect x="404" y="160" width="240" height="104" rx="10" fill="#eef2f0" stroke="#2c5454" stroke-width="2.5"/>
<text x="424" y="192" font-size="16" fill="#291c0e" font-family="Georgia, serif">Read in place</text>
<text x="424" y="216" font-size="12.5" fill="#2c5454">2-3 m on the N42 low-profile,</text>
<text x="424" y="235" font-size="12.5" fill="#2c5454">4-5 m on the N52 heavy-duty</text>
<rect x="718" y="160" width="240" height="104" rx="10" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<text x="738" y="192" font-size="16" fill="#291c0e" font-family="Georgia, serif">Pry off</text>
<text x="738" y="216" font-size="12.5" fill="#6d5a3a">rated pull-force releases clean —</text>
<text x="738" y="235" font-size="12.5" fill="#6d5a3a">paint stays on the asset</text>
<rect x="90" y="330" width="868" height="72" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<text x="110" y="360" font-size="16" fill="#291c0e" font-family="Georgia, serif">Next asset — GRAI-96 / GIAI-96 re-assignment in the EPCIS record</text>
<text x="110" y="386" font-size="12.5" fill="#6d5a3a">bizStep staging_outbound to staging_inbound — stillages, roll-cages, IBCs, molds, jigs, gauges, rental plant</text>
<path d="M330 212 L396 212" stroke="#6d5a3a" stroke-width="2.5"/>
<path d="M396 212 l-10 -5 v10 z" fill="#6d5a3a"/>
<path d="M644 212 L710 212" stroke="#6d5a3a" stroke-width="2.5"/>
<path d="M710 212 l-10 -5 v10 z" fill="#6d5a3a"/>
<path d="M838 264 Q838 330 700 348" stroke="#6d5a3a" stroke-width="2.5" fill="none"/>
<path d="M700 348 l11 -6 v10 z" fill="#6d5a3a"/>
<path d="M210 330 Q210 300 210 272" stroke="#6d5a3a" stroke-width="2.5" fill="none"/>
<path d="M210 272 l-5 10 h10 z" fill="#6d5a3a"/>
<rect x="60" y="452" width="512" height="88" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="84" y="484" font-size="17" font-family="Georgia, serif" fill="#291c0e">What the alternatives cost</text>
<text x="84" y="510" font-size="13" fill="#6d5a3a">adhesive: one surface, one life, residue on return</text>
<text x="84" y="530" font-size="13" fill="#6d5a3a">weld or bolt-on: hot-work or drilling on a leased asset</text>
<rect x="608" y="452" width="512" height="88" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="632" y="484" font-size="17" font-family="Georgia, serif" fill="#291c0e">Ship it legally</text>
<text x="632" y="510" font-size="13" fill="#6d5a3a">IATA DGR 2.14: field at or under 0.00525 gauss at 4.6 m</text>
<text x="632" y="530" font-size="13" fill="#6d5a3a">flies as ordinary cargo — packaging keeps it under the line</text>
<text x="60" y="600" font-size="13.5" fill="#2c5454">MR suites: ASTM F2503 classification applies — magnet-mount tags stay outside the magnet room.</text>
</g>
</svg>
