<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five drivers of RFID cashless revenue uplift, three obvious and two overlooked</title>
<desc id="d">Two groups of drivers. The obvious three, in teal: payment friction reduction, queue-time reduction giving 2 to 3 times more served per hour, and live spending visibility for organizers. The overlooked two, in gold: breakage, where 5 to 15 percent of loaded credit goes unredeemed and a net 1 to 3 percent of preload is retained, and sponsor integration, where co-branded top-ups create a new revenue line worth 50,000 to 500,000 dollars per major event.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE DRIVERS OF THE LIFT</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Everyone sells the system on the first three; the money hides in the last two.</text>
<text x="338" y="150" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">THE OBVIOUS THREE</text>
<text x="874" y="150" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE OVERLOOKED TWO</text>
<rect x="76" y="172" width="524" height="120" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="76" y="172" width="524" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="120" cy="232" r="20" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="120" y="238" text-anchor="middle" font-size="20" font-weight="800" fill="#2c5454">1</text>
<text x="164" y="222" font-size="17" font-weight="800" fill="#2c5454">Payment friction ↓</text>
<text x="164" y="252" font-size="13.5" fill="#5c5c5c">No cash, no change, no card fumble — each buy gets easier.</text>
<rect x="76" y="308" width="524" height="120" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="76" y="308" width="524" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="120" cy="368" r="20" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="120" y="374" text-anchor="middle" font-size="20" font-weight="800" fill="#2c5454">2</text>
<text x="164" y="358" font-size="17" font-weight="800" fill="#2c5454">Queue time ↓</text>
<text x="164" y="388" font-size="13.5" fill="#5c5c5c">1–2 sec vs 15–30 sec cash; vendors serve 2–3× more per hour.</text>
<rect x="76" y="444" width="524" height="120" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="76" y="444" width="524" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="120" cy="504" r="20" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="120" y="510" text-anchor="middle" font-size="20" font-weight="800" fill="#2c5454">3</text>
<text x="164" y="494" font-size="17" font-weight="800" fill="#2c5454">Spending visibility</text>
<text x="164" y="524" font-size="13.5" fill="#5c5c5c">Live vendor &amp; zone data moves staff and pricing mid-event.</text>
<rect x="624" y="172" width="500" height="188" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="624" y="172" width="500" height="8" rx="4" fill="#c39a5f"/>
<text x="654" y="222" font-size="18" font-weight="800" fill="#6d5a3a">Breakage</text>
<rect x="654" y="238" width="196" height="28" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="752" y="257" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">OFTEN OVERLOOKED</text>
<text x="654" y="296" font-size="14" fill="#291c0e">5–15% of loaded credit is never redeemed.</text>
<text x="654" y="322" font-size="14" fill="#291c0e">Net 1–3% of preload stays as the organizer's.</text>
<rect x="624" y="376" width="500" height="188" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="624" y="376" width="500" height="8" rx="4" fill="#c39a5f"/>
<text x="654" y="426" font-size="18" font-weight="800" fill="#6d5a3a">Sponsor integration</text>
<rect x="654" y="442" width="196" height="28" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="752" y="461" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">OFTEN OVERLOOKED</text>
<text x="654" y="500" font-size="14" fill="#291c0e">Co-branded top-ups &amp; cashback fund new perks.</text>
<text x="654" y="526" font-size="14" fill="#291c0e">Sponsor inventory worth $50K–$500K per major event.</text>
<text x="600" y="618" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The first two sell the system; the last two quietly pay for it.</text>
</svg>
