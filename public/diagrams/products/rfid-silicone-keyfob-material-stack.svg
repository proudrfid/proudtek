<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Platinum-cured silicone — the material compliance stack</title>
  <desc id="d">Compliance ladder for the PDMS body: platinum-cured Si-O backbone with no peroxide by-products, ISO 10993-1/-5/-10 biocompatibility passes, FDA 21 CFR 177.2600 and LFGB section 31 food-contact clearance, IP68 continuous immersion and IP69K high-pressure washdown.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">The fob you can hand to a swimmer, a chef, a nurse</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Platinum-cured PDMS — the compliance stack is the product</text>
  <g transform="translate(70,140)" font-family="Helvetica, Arial, sans-serif" font-size="14">
    <rect x="0" y="0" width="640" height="86" rx="12" fill="#eef2f0" stroke="#2c5454" stroke-width="2.5"/>
    <text x="24" y="34" font-family="Georgia, serif" font-size="17" fill="#2c5454">Chemistry — platinum-cured PDMS</text>
    <text x="24" y="64" fill="#2c5454">Si-O backbone, chemically inert, no peroxide-cure by-products</text>
    <rect x="0" y="100" width="640" height="86" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="134" font-family="Georgia, serif" font-size="17" fill="#2c5454">Biocompatibility — ISO 10993</text>
    <text x="24" y="164" fill="#2c5454">10993-1 framework · 10993-5 cytotoxicity pass · 10993-10 irritation</text>
    <rect x="0" y="200" width="640" height="86" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="234" font-family="Georgia, serif" font-size="17" fill="#291c0e">Food contact — FDA + LFGB</text>
    <text x="24" y="264" fill="#2c5454">FDA 21 CFR 177.2600 repeated-use rubber · LFGB § 31 (Germany)</text>
    <rect x="0" y="300" width="640" height="86" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="334" font-family="Georgia, serif" font-size="17" fill="#2c5454">Water + washdown — IP68 / IP69K</text>
    <text x="24" y="364" fill="#2c5454">continuous immersion ≥ 1 m · ISO 20653 high-pressure washdown</text>
  </g>
  <g transform="translate(770,140)">
    <rect x="0" y="0" width="360" height="386" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="42" font-family="Georgia, serif" font-size="18" fill="#291c0e">Who this unlocks</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">
      <text x="24" y="82">Aquatic centres + swim schools</text>
      <text x="24" y="112">Commercial kitchens + food plants</text>
      <text x="24" y="142">Healthcare + care-home wearers</text>
      <text x="24" y="172">Gym + spa membership programmes</text>
    </g>
    <line x1="24" y1="196" x2="336" y2="196" stroke="#d8cdb8" stroke-width="1.5"/>
    <text x="24" y="228" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">RoHS 3 cleared on pigment + curing-agent</text>
    <text x="24" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">lots; REACH SVHC screened</text>
    <text x="24" y="288" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">5-10 year field life — UV-resistant,</text>
    <text x="24" y="310" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">no plasticiser migration</text>
    <text x="24" y="348" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">304 / 316 stainless split ring moulded in</text>
  </g>
</svg>
