<rect x="64" y="504" width="1072" height="90" rx="11" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="504" width="9" height="90" rx="4" fill="#4a5568"/>
<text x="92" y="538" font-size="15.5" font-weight="800" fill="#291c0e">Glass LF/HF transponder</text>
<text x="92" y="560" font-size="12" fill="#5c5c5c">Schott or NXP HITAG / ICODE</text>
<rect x="92" y="568" width="196" height="20" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="190" y="582" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6d34">2 × 12 mm · read 1–3 cm</text>
<text x="404" y="542" font-size="12.5" fill="#333333">Borosilicate glass capsule: autoclave, livestock implant (ISO 11784/11785),</text>
<text x="404" y="564" font-size="12.5" fill="#333333">high-value embedment; inert to chemicals but fragile to direct impact.</text>
