<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How an RFID RFP turns five incomparable quotes into rankable, apples-to-apples bids</title>
<desc id="d">On the left, five suppliers return scattered quotes with different chips, trade terms and hidden fees that cannot be compared. In the centre, the same 10-question RFP template. On the right, every bid now answers the same fields in the same order, so they can be ranked — and the buyer captures 15 to 25 percent better landed price than a generic price-list request.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DISTRIBUTOR PROGRAMS · RFID RFP</text>
<text x="600" y="99" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">One template, comparable bids</text>
<text x="600" y="131" text-anchor="middle" font-size="16" fill="#4f4f4f">Ask every supplier the same 10 questions and the scattered quotes finally line up.</text>
<rect x="74" y="196" width="440" height="288" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<rect x="74" y="196" width="440" height="8" rx="4" fill="#4a5568"/>
<text x="294" y="236" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">WITHOUT AN RFP</text>
<rect x="94" y="252" width="300" height="30" rx="7" fill="#f3f1ec" stroke="#d9d2c4" stroke-width="1.2"/>
<text x="108" y="272" font-size="12.5" fill="#5c5c5c">'Best price': $0.06 EXW?</text>
<rect x="94" y="290" width="372" height="30" rx="7" fill="#f3f1ec" stroke="#d9d2c4" stroke-width="1.2"/>
<text x="108" y="310" font-size="12.5" fill="#5c5c5c">Price list attached, no volume tiers</text>
<rect x="94" y="328" width="244" height="30" rx="7" fill="#f3f1ec" stroke="#d9d2c4" stroke-width="1.2"/>
<text x="108" y="348" font-size="12.5" fill="#5c5c5c">$0.09 CIF, tooling TBD</text>
<rect x="94" y="366" width="330" height="30" rx="7" fill="#f3f1ec" stroke="#d9d2c4" stroke-width="1.2"/>
<text x="108" y="386" font-size="12.5" fill="#5c5c5c">$0.05 + setup fee billed later</text>
<rect x="94" y="404" width="272" height="30" rx="7" fill="#f3f1ec" stroke="#d9d2c4" stroke-width="1.2"/>
<text x="108" y="424" font-size="12.5" fill="#5c5c5c">DDP, chip 'or similar'</text>
<text x="294" y="462" text-anchor="middle" font-size="12.5" fill="#8b2d2d">Different chips, terms and hidden fees.</text>
<text x="600" y="288" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.3" fill="#6d5a3a">SAME 10-Q</text>
<text x="600" y="306" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.3" fill="#6d5a3a">RFP TEMPLATE</text>
<rect x="578" y="322" width="44" height="56" rx="5" fill="#fffdf7" stroke="#c39a5f" stroke-width="2"/>
<line x1="588" y1="336" x2="612" y2="336" stroke="#c39a5f" stroke-width="1.6"/>
<line x1="588" y1="345" x2="612" y2="345" stroke="#c39a5f" stroke-width="1.6"/>
<line x1="588" y1="354" x2="612" y2="354" stroke="#c39a5f" stroke-width="1.6"/>
<line x1="588" y1="363" x2="606" y2="363" stroke="#c39a5f" stroke-width="1.6"/>
<line x1="524" y1="410" x2="676" y2="410" stroke="#4a5568" stroke-width="4"/>
<polygon points="676,410 662,403 662,417" fill="#4a5568"/>
<rect x="686" y="196" width="440" height="288" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<rect x="686" y="196" width="440" height="8" rx="4" fill="#2d6a4f"/>
<text x="906" y="236" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#2d6a4f">WITH THE RFP</text>
<rect x="706" y="252" width="400" height="30" rx="7" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="722" y="272" font-size="12.5" font-weight="700" fill="#291c0e">Supplier A</text>
<text x="980" y="273" font-size="15" fill="#1f6f3a">✓</text><text x="1030" y="273" font-size="15" fill="#1f6f3a">✓</text><text x="1080" y="273" font-size="15" fill="#1f6f3a">✓</text>
<rect x="706" y="290" width="400" height="30" rx="7" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="722" y="310" font-size="12.5" font-weight="700" fill="#291c0e">Supplier B</text>
<text x="980" y="311" font-size="15" fill="#1f6f3a">✓</text><text x="1030" y="311" font-size="15" fill="#1f6f3a">✓</text><text x="1080" y="311" font-size="15" fill="#1f6f3a">✓</text>
<rect x="706" y="328" width="400" height="30" rx="7" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="722" y="348" font-size="12.5" font-weight="700" fill="#291c0e">Supplier C</text>
<text x="980" y="349" font-size="15" fill="#1f6f3a">✓</text><text x="1030" y="349" font-size="15" fill="#1f6f3a">✓</text><text x="1080" y="349" font-size="15" fill="#1f6f3a">✓</text>
<rect x="706" y="366" width="400" height="30" rx="7" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="722" y="386" font-size="12.5" font-weight="700" fill="#291c0e">Supplier D</text>
<text x="980" y="387" font-size="15" fill="#1f6f3a">✓</text><text x="1030" y="387" font-size="15" fill="#1f6f3a">✓</text><text x="1080" y="387" font-size="15" fill="#1f6f3a">✓</text>
<text x="1030" y="418" text-anchor="middle" font-size="12" letter-spacing="0.3" fill="#8a8172">price · term · cert</text>
<text x="906" y="462" text-anchor="middle" font-size="12.5" fill="#2d6a4f">Same fields, same order — bids you can rank.</text>
<rect x="450" y="500" width="300" height="34" rx="17" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="600" y="522.5" text-anchor="middle" font-size="14" font-weight="800" fill="#6d5a3a">15-25% better landed price</text>
<text x="600" y="602" text-anchor="middle" font-size="13.5" fill="#4f4f4f">An RFP is the discipline that makes every supplier answer the same questions in the same order.</text>
</svg>
