<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="dppTitle dppDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="dppTitle">One EU Digital Product Passport record reached by NFC or UHF RFID</title>
  <desc id="dppDesc">A single EU Digital Product Passport record sits at the centre, addressed by a GS1 Digital Link URL of the form slash 01 slash GTIN slash 21 slash serial. Two carriers resolve to the same record. On the left, a consumer taps with a phone over NFC — there are about 2.2 billion NFC-capable phones, so the tap is friction-free. On the right, a customs officer or recycler scans a sealed pallet over UHF RFID in seconds. A combo NFC plus UHF inlay serves both jobs on one label, and an NTAG 424 DNA TT chip adds tamper-evidence. Governing rules: ESPR Regulation 2024/1781 and EU Battery Regulation 2023/1542.</desc>
  <defs>
    <radialGradient id="dppBg" cx="50%" cy="16%" r="92%"><stop offset="0%" stop-color="#f8f1e2"/><stop offset="100%" stop-color="#f3eee2"/></radialGradient>
    <marker id="dppA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2d6a4f"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#dppBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="1.2" fill="#6d5a3a">ONE DPP RECORD, TWO WAYS IN</text>

  <!-- central hub -->
  <rect x="418" y="92" width="364" height="126" rx="16" fill="#e6f0ea" stroke="#2d6a4f" stroke-width="3"/>
  <text x="600" y="128" text-anchor="middle" font-size="19" font-weight="800" fill="#1f6f3a">EU Digital Product Passport</text>
  <text x="600" y="152" text-anchor="middle" font-size="13.5" fill="#2d6a4f">GS1 Digital Link resolves both carriers</text>
  <rect x="452" y="166" width="296" height="38" rx="10" fill="#ffffff" stroke="#a9cbb8" stroke-width="1.5"/>
  <text x="600" y="191" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6f3a" font-family="ui-monospace, Menlo, Consolas, monospace">/01/{GTIN}/21/{serial}</text>

  <!-- arrows from carriers up into hub -->
  <path d="M300 300 L300 250 L470 250 L470 218" fill="none" stroke="#2d6a4f" stroke-width="2.5" marker-end="url(#dppA)"/>
  <path d="M900 300 L900 250 L730 250 L730 218" fill="none" stroke="#2d6a4f" stroke-width="2.5" marker-end="url(#dppA)"/>

  <!-- left: consumer NFC -->
  <rect x="80" y="300" width="440" height="150" rx="16" fill="#e8f9fe" stroke="#1fcefb" stroke-width="3"/>
  <circle cx="140" cy="340" r="26" fill="#1fcefb"/><rect x="130" y="326" width="20" height="30" rx="4" fill="#ffffff"/>
  <text x="184" y="348" font-size="19" font-weight="800" fill="#0f6d84">Consumer → tap → NFC</text>
  <text x="100" y="386" font-size="15" fill="#12657a">~2.2B NFC-capable phones in pockets.</text>
  <text x="100" y="410" font-size="15" fill="#12657a">A tap opens the passport — no reader to buy,</text>
  <text x="100" y="434" font-size="15" fill="#12657a">no app to install. Friction-free by design.</text>

  <!-- right: customs UHF -->
  <rect x="680" y="300" width="440" height="150" rx="16" fill="#eef1f6" stroke="#4a5568" stroke-width="3"/>
  <circle cx="740" cy="340" r="26" fill="#4a5568"/><rect x="729" y="329" width="22" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="784" y="348" font-size="18" font-weight="800" fill="#1f4e79">Customs / recycler → scan → UHF</text>
  <text x="700" y="386" font-size="15" fill="#3a4a52">A portal reads a sealed pallet of DPP goods</text>
  <text x="700" y="410" font-size="15" fill="#3a4a52">in seconds — no unboxing, no per-item tap.</text>
  <text x="700" y="434" font-size="15" fill="#3a4a52">EU Battery Reg 2023/1542 anticipates this.</text>

  <!-- bottom combo strip -->
  <rect x="80" y="476" width="1040" height="140" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="110" y="512" font-size="18" font-weight="800" fill="#291c0e">One combo NFC + UHF inlay serves both — antenna and substrate are shared.</text>
  <text x="110" y="544" font-size="15.5" fill="#4f4f4f">Avery Dennison Smartrac · NXP UCODE + NTAG · Identiv. Carrier-neutral under ESPR Regulation 2024/1781.</text>
  <rect x="110" y="562" width="470" height="42" rx="21" fill="#e6f0ea" stroke="#2d6a4f" stroke-width="1.5"/><text x="345" y="589" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6f3a">Need tamper-evidence? NTAG 424 DNA TT adds it.</text>
  <rect x="600" y="562" width="510" height="42" rx="21" fill="#e9eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="855" y="589" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">Same backend, two carriers, zero duplicate engineering.</text>
</svg>
