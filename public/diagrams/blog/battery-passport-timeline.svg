<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="timelinet timelined" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="timelinet">Battery Regulation 2023/1542 timeline</title>
  <desc id="timelined">The obligation sequence in Regulation (EU) 2023/1542. From 18 February 2025, EV batteries must declare a carbon footprint per model and plant using the JRC CFB-EV methodology — already live. The EU central Digital Product Passport registry goes live by 19 July 2026. From 18 February 2027, the battery passport becomes mandatory for EV, industrial over-2-kWh and LMT batteries, readable by QR. Due-diligence obligations, originally 18 August 2025, were postponed to 18 August 2027 by Regulation (EU) 2025/1561. From 18 August 2031, recycled-content minimums apply: 16 percent cobalt, 6 percent lithium, 6 percent nickel and 85 percent lead.</desc>
  <defs><radialGradient id="timelinebg" cx="50%" cy="16%" r="95%"><stop offset="0%" stop-color="#f8f0df"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#timelinebg)"/>
