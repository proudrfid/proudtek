<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">UDI is two records that must agree — the device label and the GUDID entry</title>
<desc id="d">Two panels. Left, on the device: a static Device Identifier chip listing device model, manufacturer and version; a variable Production Identifier chip listing lot, serial, manufacturing date and expiry; and a label mock-up with barcode bars, the GS1 application identifiers for GTIN-14, serial and expiry, marked human-readable plus machine-readable. Right, in GUDID: the matching FDA database record with the same Device Identifier, intended use and contraindications, MRI safety and sterilization, and roughly 57 attributes on file. Between the panels, a double-headed arrow labeled MUST MATCH. A flawless label with a missing or mismatched GUDID record is still a compliance failure.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">UDI · TWO RECORDS THAT MUST AGREE</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">The label in your hand, the record in Washington</text>

<rect x="64" y="140" width="470" height="370" rx="16" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="96" y="180" font-size="14" font-weight="800" letter-spacing="1" fill="#6d5a3a">ON THE DEVICE</text>
<text x="96" y="202" font-size="12.5" fill="#4f4f4f">printed + AIDC marking on every unit</text>
<rect x="96" y="224" width="406" height="70" rx="10" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
<text x="116" y="252" font-size="15" font-weight="700" fill="#6d5a3a">DI — static</text>
<text x="116" y="276" font-size="12.5" fill="#4f4f4f">device model · manufacturer · version</text>
<rect x="96" y="308" width="406" height="70" rx="10" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
<text x="116" y="336" font-size="15" font-weight="700" fill="#6d5a3a">PI — variable</text>
<text x="116" y="360" font-size="12.5" fill="#4f4f4f">lot · serial · manufacturing date · expiry</text>
<rect x="96" y="392" width="406" height="86" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<g fill="#291c0e">
<rect x="116" y="408" width="3" height="36"/><rect x="122" y="408" width="2" height="36"/><rect x="127" y="408" width="4" height="36"/><rect x="134" y="408" width="2" height="36"/><rect x="140" y="408" width="3" height="36"/><rect x="146" y="408" width="2" height="36"/><rect x="152" y="408" width="4" height="36"/><rect x="159" y="408" width="2" height="36"/><rect x="165" y="408" width="3" height="36"/>
</g>
<text x="188" y="424" font-size="12.5" font-weight="700" fill="#291c0e">(01) GTIN-14 DI</text>
<text x="188" y="444" font-size="12" fill="#4f4f4f">(21) serial · (17) expiry</text>
<text x="116" y="466" font-size="12" fill="#6d5a3a">human-readable + machine-readable</text>

<rect x="666" y="140" width="470" height="370" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="698" y="180" font-size="14" font-weight="800" letter-spacing="1" fill="#2c5454">IN GUDID</text>
<text x="698" y="202" font-size="12.5" fill="#4f4f4f">the matching FDA database record</text>
<rect x="698" y="224" width="406" height="254" rx="10" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<rect x="698" y="224" width="406" height="40" rx="10" fill="#3d6b6b"/>
<rect x="698" y="248" width="406" height="16" fill="#3d6b6b"/>
