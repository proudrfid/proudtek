<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The POS and PMS stack behind a resort wristband tap, plus lock-vendor door credentials</title>
<desc id="d">The back-end stack that processes a wristband tap, top to bottom. Guest wristband: the tap that starts the whole chain. POS terminal: Lightspeed and outlet tills capture the charge. Cashless platform: Oveit, WristCoin and Synometrix handle spend caps, analytics and per-tap fees. PMS folio: Opera, Mews, Cloudbeds and Protel land the charge on the room. A side panel shows the same band also opens doors, because Salto Space, VingCard Visionline and Saflok Quantum accept MIFARE Classic or DESFire wristbands as valid keys at the lock. On Lightspeed the three-system chain collapses to two, and every partner should be asked about reconciliation cadence, PCI-DSS scope, offline failure mode and per-tap fees of 0.05 to 0.10 dollars.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
