<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Electronic lockout/tagout verification flow for a valve RFID tag</title>
  <desc id="d">A four-step electronic LOTO flow: the handheld loads the isolation plan per OSHA 29 CFR 1910.147 and NFPA 70E Article 120; the technician reads the valve's GS1 GIAI-96 tag at 1-2 m; the reader verifies the tag against the plan; on a match the lock is applied and an EPCIS 2.0 event is logged. A banner notes that a mismatch blocks the lock and logs a near-miss to the CMMS — the wrong-valve control CSB incident reports recommend.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ELECTRONIC LOTO — MATCH BEFORE THE LOCK</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">The reader confirms the physical valve against the isolation plan before a lock goes on</text>

  <rect x="70" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="170" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="187" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1 · PLAN</text>
  <text x="187" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Isolation plan loaded</text>
  <text x="187" y="272" text-anchor="middle" font-size="14" fill="#291c0e">on the handheld</text>
  <text x="187" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">OSHA 29 CFR 1910.147</text>
  <text x="187" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">NFPA 70E Article 120</text>

  <rect x="345" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="345" y="170" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="462" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2 · TAP</text>
  <text x="462" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Read the valve's</text>
  <text x="462" y="272" text-anchor="middle" font-size="14" fill="#291c0e">GIAI-96 tag</text>
  <text x="462" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">1-2 m handheld,</text>
  <text x="462" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">860-960 MHz</text>

  <rect x="620" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="620" y="170" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="737" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3 · VERIFY</text>
  <text x="737" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Tag vs isolation</text>
  <text x="737" y="272" text-anchor="middle" font-size="14" fill="#291c0e">plan — match?</text>
  <text x="737" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">decided at the valve,</text>
  <text x="737" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">not on paper</text>

  <rect x="895" y="170" width="235" height="205" rx="14" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <rect x="895" y="170" width="235" height="42" rx="14" fill="#1f6f3a"/>
  <text x="1012" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4 · LOCK</text>
  <text x="1012" y="250" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6f3a">MATCH — LOCK</text>
  <text x="1012" y="288" text-anchor="middle" font-size="12.5" fill="#5c5c5c">EPCIS 2.0 event</text>
  <text x="1012" y="306" text-anchor="middle" font-size="12.5" fill="#5c5c5c">logged to the CMMS</text>

  <polygon points="308,272 336,272 336,266 350,275 336,284 336,278 308,278" fill="#4a5568"/>
  <polygon points="583,272 611,272 611,266 625,275 611,284 611,278 583,278" fill="#4a5568"/>
  <polygon points="858,272 886,272 886,266 900,275 886,284 886,278 858,278" fill="#4a5568"/>

  <rect x="70" y="418" width="1060" height="66" rx="12" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="1.5"/>
  <text x="90" y="446" font-size="15" font-weight="700" fill="#8b2d2d">Mismatch stops the job</text>
  <text x="90" y="468" font-size="13.5" fill="#8b2d2d">A wrong-valve read blocks the lock step and logs a near-miss to the CMMS — the exact control CSB incident reports keep recommending.</text>

  <text x="600" y="540" text-anchor="middle" font-size="13.5" fill="#5c5c5c">GMP and PSM Tier-1 sites add an NTAG 424 DNA SUN CMAC AES-128 signature per scan for 21 CFR Part 11 / EU Annex 11 records.</text>
</svg>
