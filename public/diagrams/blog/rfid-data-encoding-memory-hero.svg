<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Where your data actually lives — an RFID tag's coil, chip and memory grid talking to a reader</title>
<desc id="d">Hero illustration. An RFID card is drawn open: an antenna coil of nested loops surrounds a strict grid of memory cells — one cell is red and locked, the sector trailer you do not casually overwrite — next to a gold chip die. Radio arcs and a dashed stream of bits (1 0 1 1 0) flow to a reader that verifies the payload with a green check. Strapline: tiny chips, strict floor plans, and a hundred ways to brick a tag before lunch. The floor plans covered are MIFARE sectors, NTAG pages, NDEF containers and EPC Gen2 banks.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE YOUR DATA ACTUALLY LIVES ON AN RFID TAG</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">A filing cabinet the size of a sesame seed</text>

<!-- tag card -->
<rect x="90" y="140" width="560" height="350" rx="24" fill="#f2f7f7" stroke="#3d6b6b" stroke-width="2.5"/>
<!-- antenna coil -->
<rect x="112" y="162" width="516" height="306" rx="18" fill="none" stroke="#7fa3a3" stroke-width="3"/>
<rect x="130" y="180" width="480" height="270" rx="14" fill="none" stroke="#a3bfbf" stroke-width="2.5"/>
<rect x="148" y="198" width="444" height="234" rx="10" fill="none" stroke="#c3d5d5" stroke-width="2"/>

<text x="150" y="242" font-size="13" font-weight="800" letter-spacing="1" fill="#2c5454">MEMORY</text>
<!-- memory grid: 4 cols x 3 rows, last cell locked -->
<g fill="#ffffff" stroke="#7fa3a3" stroke-width="1.5">
<rect x="150" y="258" width="56" height="38" rx="6"/><rect x="216" y="258" width="56" height="38" rx="6"/><rect x="282" y="258" width="56" height="38" rx="6"/><rect x="348" y="258" width="56" height="38" rx="6"/>
<rect x="150" y="306" width="56" height="38" rx="6"/><rect x="216" y="306" width="56" height="38" rx="6"/><rect x="282" y="306" width="56" height="38" rx="6"/><rect x="348" y="306" width="56" height="38" rx="6"/>
<rect x="150" y="354" width="56" height="38" rx="6"/><rect x="216" y="354" width="56" height="38" rx="6"/><rect x="282" y="354" width="56" height="38" rx="6"/>
</g>
<rect x="348" y="354" width="56" height="38" rx="6" fill="#8b2d2d"/>
<path d="M 370 372 v -6 a 6 6 0 0 1 12 0 v 6" fill="none" stroke="#ffffff" stroke-width="2.5"/>
<rect x="366" y="372" width="20" height="14" rx="3" fill="#ffffff"/>
<text x="150" y="420" font-size="13" font-weight="600" fill="#4f4f4f">every byte has an address — and some addresses bite</text>

<!-- chip die -->
<rect x="450" y="250" width="130" height="130" rx="14" fill="#c39a5f"/>
<rect x="468" y="268" width="94" height="94" rx="8" fill="#a87f43"/>
<g stroke="#d4a755" stroke-width="4" stroke-linecap="round">
<line x1="426" y1="270" x2="450" y2="270"/><line x1="426" y1="315" x2="450" y2="315"/><line x1="426" y1="360" x2="450" y2="360"/>
<line x1="580" y1="270" x2="604" y2="270"/><line x1="580" y1="315" x2="604" y2="315"/><line x1="580" y1="360" x2="604" y2="360"/>
</g>
<text x="515" y="324" text-anchor="middle" font-size="24" font-weight="800" fill="#f7edd6">01</text>

<!-- radio arcs -->
<path d="M 664 274 a 30 30 0 0 1 0 60" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 676 262 a 44 44 0 0 1 0 84" fill="none" stroke="#7fa3a3" stroke-width="2"/>
<path d="M 688 250 a 58 58 0 0 1 0 108" fill="none" stroke="#c3d5d5" stroke-width="1.5"/>

<!-- bit stream -->
<text x="736" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#2c5454">1 0 1 1 0</text>
<line x1="660" y1="396" x2="804" y2="396" stroke="#3d6b6b" stroke-width="2" stroke-dasharray="4 7"/>
<path d="M 812 396 l -12 -6 v 12 z" fill="#3d6b6b"/>

<!-- reader -->
<rect x="820" y="200" width="160" height="270" rx="20" fill="#4a5568"/>
<rect x="838" y="222" width="124" height="200" rx="10" fill="#eef1f5"/>
<rect x="852" y="246" width="96" height="10" rx="5" fill="#d3dae3"/>
<rect x="852" y="264" width="72" height="10" rx="5" fill="#d3dae3"/>
<circle cx="900" cy="322" r="28" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="2.5"/>
<path d="M 886 322 l 10 11 l 20 -22" fill="none" stroke="#2d6a4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="900" y="386" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6f3a">read OK</text>
<rect x="880" y="444" width="40" height="6" rx="3" fill="#9aa5b5"/>

<!-- captions -->
<text x="370" y="522" text-anchor="middle" font-size="13.5" fill="#4f4f4f">the tag: coil + chip + a strict little memory grid (red drawer: locked)</text>
<text x="900" y="522" text-anchor="middle" font-size="13.5" fill="#4f4f4f">the reader: trusts the map</text>

<text x="600" y="568" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="22" font-weight="700" fill="#291c0e">Tiny chips, strict floor plans — and a hundred ways to brick a tag before lunch.</text>
<text x="600" y="600" text-anchor="middle" font-size="14" fill="#4f4f4f">MIFARE sectors · NTAG pages · NDEF containers · EPC Gen2 banks — the floor plans this guide walks through</text>
</svg>
