<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Cryptographic tap-to-verify authentication flow for an NFC pharmaceutical label</title>
  <desc id="d">A four-step authentication flow: a pharmacist or patient taps the pack; the NTAG 424 DNA chip emits a per-tap signed URL using an AES-128 CMAC (Secure Dynamic Messaging); the backend verifies the CMAC and a monotonic counter; the result is authentic, or counterfeit or opened is rejected. A note explains this catches the counterfeit-carrier-with-genuine-serial attack that a copied DataMatrix passes, and that NFC sits on top of the regulator-mandated GS1 DataMatrix rather than in place of it.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TAP-TO-VERIFY — AES-128 SDM AUTHENTICATION</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">The check is cryptographic, not visual — the signature is verified, not the barcode</text>

  <rect x="70" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="170" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="187" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1 · TAP</text>
  <text x="187" y="250" text-anchor="middle" font-size="14" fill="#291c0e">Pharmacist or patient</text>
  <text x="187" y="274" text-anchor="middle" font-size="14" fill="#291c0e">taps the pack</text>
  <text x="187" y="310" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Any NFC phone,</text>
  <text x="187" y="328" text-anchor="middle" font-size="12.5" fill="#5c5c5c">no app required</text>

  <rect x="345" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="345" y="170" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="462" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2 · SIGN</text>
  <text x="462" y="250" text-anchor="middle" font-size="14" fill="#291c0e">NTAG 424 DNA emits a</text>
  <text x="462" y="274" text-anchor="middle" font-size="14" fill="#291c0e">per-tap CMAC URL</text>
  <text x="462" y="310" text-anchor="middle" font-size="12.5" fill="#5c5c5c">AES-128 key sealed</text>
  <text x="462" y="328" text-anchor="middle" font-size="12.5" fill="#5c5c5c">in the silicon</text>

  <rect x="620" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="620" y="170" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="737" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3 · VERIFY</text>
  <text x="737" y="250" text-anchor="middle" font-size="14" fill="#291c0e">Backend checks the</text>
  <text x="737" y="274" text-anchor="middle" font-size="14" fill="#291c0e">CMAC + counter</text>
  <text x="737" y="310" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Monotonic counter</text>
  <text x="737" y="328" text-anchor="middle" font-size="12.5" fill="#5c5c5c">rejects a replay</text>

  <rect x="895" y="170" width="235" height="205" rx="14" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <rect x="895" y="170" width="235" height="42" rx="14" fill="#1f6f3a"/>
  <text x="1012" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4 · RESULT</text>
  <text x="1012" y="252" text-anchor="middle" font-size="22" font-weight="800" fill="#1f6f3a">AUTHENTIC</text>
  <text x="1012" y="296" text-anchor="middle" font-size="12.5" fill="#8b2d2d">Counterfeit or opened</text>
  <text x="1012" y="314" text-anchor="middle" font-size="12.5" fill="#8b2d2d">is rejected</text>

  <polygon points="308,272 336,272 336,266 350,275 336,284 336,278 308,278" fill="#4a5568"/>
  <polygon points="583,272 611,272 611,266 625,275 611,284 611,278 583,278" fill="#4a5568"/>
  <polygon points="858,272 886,272 886,266 900,275 886,284 886,278 858,278" fill="#4a5568"/>

  <rect x="70" y="418" width="1060" height="66" rx="12" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="1.5"/>
  <text x="90" y="446" font-size="15" font-weight="700" fill="#8b2d2d">The attack a barcode check cannot catch</text>
  <text x="90" y="468" font-size="13.5" fill="#8b2d2d">A copied DataMatrix passes EMVS and scanner checks; without the genuine chip's AES-128 key it cannot produce a valid signature.</text>

  <text x="600" y="540" text-anchor="middle" font-size="13.5" fill="#5c5c5c">NFC sits on top of the regulator-mandated GS1 DataMatrix — it supplements the serialization carrier, it does not replace it.</text>
</svg>
