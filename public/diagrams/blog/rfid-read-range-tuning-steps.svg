<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five-step UHF RFID read-range tuning, cheapest fix first</title>
<desc id="d">Five ordered steps from cheapest to most expensive. Step one, set reader transmit power to the regional maximum, 36 dBm EIRP in the US or 33 dBm ERP in the EU. Step two, check cable fittings and replace runs over 3 metres with low-loss LMR-400. Step three, confirm tag orientation or use a circular-polarized antenna. Step four, add a 3 to 5 mm standoff spacer off metal or liquid. Step five, test with a known-good reference tag to isolate tag versus environment. Only after these free and cheap wins should new hardware be purchased.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">STEP-BY-STEP TUNING · CHEAPEST FIX FIRST</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Exhaust the free wins before anyone signs a purchase order for new hardware.</text>

<!-- card 1 -->
<rect x="64" y="140" width="208" height="326" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="64" y="140" width="208" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="168" cy="186" r="18" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="168" y="193" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">1</text>
<text x="168" y="234" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Reader power</text>
<text x="168" y="272" text-anchor="middle" font-size="14" fill="#5c5c5c">Max EIRP:</text>
<text x="168" y="294" text-anchor="middle" font-size="14.5" font-weight="800" fill="#2c5454">36 dBm US</text>
<text x="168" y="316" text-anchor="middle" font-size="14.5" font-weight="800" fill="#2c5454">33 dBm EU</text>
<rect x="118" y="420" width="100" height="30" rx="15" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.2"/>
<text x="168" y="440" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f6f3a">free</text>

<!-- card 2 -->
<rect x="288" y="140" width="208" height="326" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="288" y="140" width="208" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="392" cy="186" r="18" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="392" y="193" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">2</text>
<text x="392" y="234" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Cables</text>
<text x="392" y="272" text-anchor="middle" font-size="14" fill="#5c5c5c">Tight fittings;</text>
<text x="392" y="294" text-anchor="middle" font-size="14" fill="#5c5c5c">runs over 3 m →</text>
<text x="392" y="316" text-anchor="middle" font-size="14.5" font-weight="800" fill="#2c5454">LMR-400</text>
<rect x="342" y="420" width="100" height="30" rx="15" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.2"/>
<text x="392" y="440" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">low $</text>

<!-- card 3 -->
<rect x="512" y="140" width="208" height="326" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="512" y="140" width="208" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="616" cy="186" r="18" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="616" y="193" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">3</text>
<text x="616" y="234" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Orientation</text>
<text x="616" y="272" text-anchor="middle" font-size="14" fill="#5c5c5c">Align polarization,</text>
<text x="616" y="294" text-anchor="middle" font-size="14" fill="#5c5c5c">or go circular-</text>
<text x="616" y="316" text-anchor="middle" font-size="14" fill="#5c5c5c">polarized antenna</text>
<rect x="566" y="420" width="100" height="30" rx="15" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.2"/>
<text x="616" y="440" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f6f3a">free</text>

