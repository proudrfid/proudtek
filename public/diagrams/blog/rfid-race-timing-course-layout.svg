<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Where timing mats sit along a marathon course</title>
<desc id="d">A course timeline. A gun-start mat, split mats at 5K, 10K, the half, 30K and 40K, and a dual-redundant finish that runs two mats and two decoders. The split mats power pace tracking, segment leaderboards and course-cut detection. Every mat feeds a decoder and the scoring software behind it, and the finish is duplicated because it is the number that counts.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TIMING POINTS ALONG THE COURSE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">One start, a chain of splits, and a finish that catches everyone.</text>

<line x1="92" y1="346" x2="1108" y2="346" stroke="#d9d2c4" stroke-width="3"/>

<text x="116" y="322" text-anchor="middle" font-size="14" font-weight="800" fill="#6d5a3a">START</text>
<rect x="92" y="366" width="48" height="16" rx="3" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<line x1="104" y1="368" x2="104" y2="380" stroke="#d4a755" stroke-width="1.4"/><line x1="116" y1="368" x2="116" y2="380" stroke="#d4a755" stroke-width="1.4"/><line x1="128" y1="368" x2="128" y2="380" stroke="#d4a755" stroke-width="1.4"/>
<circle cx="116" cy="346" r="13" fill="#c39a5f" stroke="#ffffff" stroke-width="2"/>
<text x="116" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5a3a">gun start</text>

<text x="278" y="322" text-anchor="middle" font-size="14" font-weight="800" fill="#234a4a">5K</text>
<rect x="254" y="366" width="48" height="16" rx="3" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<line x1="266" y1="368" x2="266" y2="380" stroke="#9cc0c0" stroke-width="1.4"/><line x1="278" y1="368" x2="278" y2="380" stroke="#9cc0c0" stroke-width="1.4"/><line x1="290" y1="368" x2="290" y2="380" stroke="#9cc0c0" stroke-width="1.4"/>
<circle cx="278" cy="346" r="11" fill="#3d6b6b" stroke="#ffffff" stroke-width="2"/>

<text x="440" y="322" text-anchor="middle" font-size="14" font-weight="800" fill="#234a4a">10K</text>
<rect x="416" y="366" width="48" height="16" rx="3" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<line x1="428" y1="368" x2="428" y2="380" stroke="#9cc0c0" stroke-width="1.4"/><line x1="440" y1="368" x2="440" y2="380" stroke="#9cc0c0" stroke-width="1.4"/><line x1="452" y1="368" x2="452" y2="380" stroke="#9cc0c0" stroke-width="1.4"/>
<circle cx="440" cy="346" r="11" fill="#3d6b6b" stroke="#ffffff" stroke-width="2"/>

<text x="602" y="322" text-anchor="middle" font-size="14" font-weight="800" fill="#234a4a">HALF</text>
<rect x="578" y="366" width="48" height="16" rx="3" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<line x1="590" y1="368" x2="590" y2="380" stroke="#9cc0c0" stroke-width="1.4"/><line x1="602" y1="368" x2="602" y2="380" stroke="#9cc0c0" stroke-width="1.4"/><line x1="614" y1="368" x2="614" y2="380" stroke="#9cc0c0" stroke-width="1.4"/>
<circle cx="602" cy="346" r="11" fill="#3d6b6b" stroke="#ffffff" stroke-width="2"/>

<text x="764" y="322" text-anchor="middle" font-size="14" font-weight="800" fill="#234a4a">30K</text>
<rect x="740" y="366" width="48" height="16" rx="3" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<line x1="752" y1="368" x2="752" y2="380" stroke="#9cc0c0" stroke-width="1.4"/><line x1="764" y1="368" x2="764" y2="380" stroke="#9cc0c0" stroke-width="1.4"/><line x1="776" y1="368" x2="776" y2="380" stroke="#9cc0c0" stroke-width="1.4"/>
<circle cx="764" cy="346" r="11" fill="#3d6b6b" stroke="#ffffff" stroke-width="2"/>

<text x="926" y="322" text-anchor="middle" font-size="14" font-weight="800" fill="#234a4a">40K</text>
<rect x="902" y="366" width="48" height="16" rx="3" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<line x1="914" y1="368" x2="914" y2="380" stroke="#9cc0c0" stroke-width="1.4"/><line x1="926" y1="368" x2="926" y2="380" stroke="#9cc0c0" stroke-width="1.4"/><line x1="938" y1="368" x2="938" y2="380" stroke="#9cc0c0" stroke-width="1.4"/>
<circle cx="926" cy="346" r="11" fill="#3d6b6b" stroke="#ffffff" stroke-width="2"/>

<text x="1088" y="322" text-anchor="middle" font-size="14" font-weight="800" fill="#1b4332">FINISH</text>
<rect x="1058" y="366" width="60" height="16" rx="3" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.2"/>
<line x1="1073" y1="368" x2="1073" y2="380" stroke="#77b28c" stroke-width="1.4"/><line x1="1088" y1="368" x2="1088" y2="380" stroke="#77b28c" stroke-width="1.4"/><line x1="1103" y1="368" x2="1103" y2="380" stroke="#77b28c" stroke-width="1.4"/>
<circle cx="1088" cy="346" r="13" fill="#1f6f3a" stroke="#ffffff" stroke-width="2"/>
<circle cx="1130" cy="330" r="13" fill="#ffffff" stroke="#1f6f3a" stroke-width="1.6"/><text x="1130" y="334" text-anchor="middle" font-size="12" font-weight="800" fill="#1f6f3a">×2</text>
<text x="1088" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">dual mat</text>

<line x1="278" y1="424" x2="926" y2="424" stroke="#cbb98f" stroke-width="1.6"/>
<line x1="278" y1="424" x2="278" y2="416" stroke="#cbb98f" stroke-width="1.6"/><line x1="926" y1="424" x2="926" y2="416" stroke="#cbb98f" stroke-width="1.6"/>
<text x="602" y="444" text-anchor="middle" font-size="12.5" fill="#4f4f4f">SPLIT MATS · pace · segment leaderboards · course-cut detection</text>

<text x="600" y="500" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Each mat feeds a decoder and the scoring software behind it.</text>
<text x="600" y="526" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The finish runs two mats and two decoders — it's the one number no one forgives you for missing.</text>
</svg>
