<text x="314" y="392" text-anchor="middle" font-size="13.5" fill="#4f4f4f">dock-door portal — the whole pallet answers at once</text>
<rect x="114" y="412" width="400" height="36" rx="18" fill="#eef1f5" stroke="#4a5568"/>
<text x="314" y="435" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4a5568">hundreds of tags per second · 1–12 m</text>
<rect x="114" y="458" width="400" height="36" rx="18" fill="#ffffff" stroke="#e6dfd2"/>
<text x="314" y="481" text-anchor="middle" font-size="14" fill="#4f4f4f">tags from $0.03 — cheapest at retail volume</text>

