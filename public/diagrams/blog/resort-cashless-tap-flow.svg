<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How resort cashless charging works: tap, read UID, match folio, post to room</title>
<desc id="d">Cashless resort charging in four steps. One, the guest taps the wristband at a POS terminal. Two, the NFC reader reads the chip's unique UID. Three, the property management system maps the UID to the guest folio and checks any spend cap. Four, the charge posts to the room and every charge consolidates on one folio at checkout. The payoff band notes per-guest ancillary spend rises 15 to 30 percent because paying stops feeling like paying.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CASHLESS RESORT CHARGING · TAP TO FOLIO</text>
<text x="600" y="90" text-anchor="middle" font-size="16" fill="#4f4f4f">How one tap turns into a single line on the room bill.</text>

<rect x="70" y="150" width="235" height="270" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="70" y="150" width="235" height="8" rx="4" fill="#3d6b6b"/>
<text x="188" y="194" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">1 · TAP</text>
<rect x="142" y="214" width="92" height="64" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<rect x="154" y="236" width="68" height="22" rx="11" fill="#3d6b6b"/>
<rect x="179" y="241" width="18" height="12" rx="2" fill="#ffffff" stroke="#234a4a" stroke-width="1.2"/>
<text x="188" y="320" text-anchor="middle" font-size="13.5" fill="#291c0e">Guest taps the band</text>
<text x="188" y="342" text-anchor="middle" font-size="13" fill="#5c5c5c">at a POS terminal.</text>

<rect x="345" y="150" width="235" height="270" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="345" y="150" width="235" height="8" rx="4" fill="#3d6b6b"/>
<text x="463" y="194" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">2 · READ UID</text>
<rect x="417" y="214" width="92" height="64" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<rect x="437" y="226" width="52" height="40" rx="6" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<text x="463" y="252" text-anchor="middle" font-size="14" font-weight="800" fill="#2c5454">UID</text>
<text x="463" y="320" text-anchor="middle" font-size="13.5" fill="#291c0e">Reader reads the</text>
<text x="463" y="342" text-anchor="middle" font-size="13" fill="#5c5c5c">chip's unique UID.</text>

<rect x="620" y="150" width="235" height="270" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="620" y="150" width="235" height="8" rx="4" fill="#3d6b6b"/>
<text x="738" y="194" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">3 · MATCH FOLIO</text>
<rect x="692" y="214" width="92" height="64" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<rect x="714" y="222" width="48" height="52" rx="4" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<line x1="722" y1="238" x2="754" y2="238" stroke="#4a5568" stroke-width="2"/>
<line x1="722" y1="250" x2="754" y2="250" stroke="#4a5568" stroke-width="2"/>
<line x1="722" y1="262" x2="744" y2="262" stroke="#4a5568" stroke-width="2"/>
<circle cx="756" cy="230" r="6" fill="#1f6f3a"/>
<text x="738" y="320" text-anchor="middle" font-size="13.5" fill="#291c0e">PMS maps UID to the</text>
<text x="738" y="342" text-anchor="middle" font-size="13" fill="#5c5c5c">folio; checks spend cap.</text>

<rect x="895" y="150" width="235" height="270" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="895" y="150" width="235" height="8" rx="4" fill="#3d6b6b"/>
<text x="1013" y="194" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">4 · POST TO ROOM</text>
<rect x="967" y="214" width="92" height="64" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<rect x="995" y="222" width="40" height="52" rx="3" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="1027" cy="250" r="3" fill="#3d6b6b"/>
<text x="1013" y="320" text-anchor="middle" font-size="13.5" fill="#291c0e">Charge posts to room;</text>
<text x="1013" y="342" text-anchor="middle" font-size="13" fill="#5c5c5c">one folio at checkout.</text>

<line x1="307" y1="246" x2="332" y2="246" stroke="#291c0e" stroke-width="3"/>
<polygon points="332,240 344,246 332,252" fill="#291c0e"/>
<line x1="582" y1="246" x2="607" y2="246" stroke="#291c0e" stroke-width="3"/>
<polygon points="607,240 619,246 607,252" fill="#291c0e"/>
<line x1="857" y1="246" x2="882" y2="246" stroke="#291c0e" stroke-width="3"/>
<polygon points="882,240 894,246 882,252" fill="#291c0e"/>

<rect x="70" y="452" width="1060" height="120" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<text x="150" y="530" font-size="56" font-weight="800" fill="#1f6f3a">+15–30%</text>
<line x1="470" y1="470" x2="470" y2="554" stroke="#c9e2d0" stroke-width="2"/>
<text x="506" y="500" font-size="16" font-weight="700" fill="#291c0e">per-guest ancillary spend</text>
<text x="506" y="532" font-size="14" fill="#4f4f4f">when paying stops feeling like paying.</text>

<text x="600" y="612" text-anchor="middle" font-size="14" fill="#4f4f4f">One tap, four hops — the guest never opens a wallet; the folio settles it all at checkout.</text>
</svg>
