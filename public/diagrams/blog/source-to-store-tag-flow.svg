<text x="1014.0" y="276" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">EPC-level exit read</text>
<text x="1014.0" y="306" text-anchor="middle" font-size="12" fill="#5c5c5c">'item X passed the gate</text>
<text x="1014.0" y="332" text-anchor="middle" font-size="12" fill="#5c5c5c">at time Y'</text>
<rect x="88" y="458" width="1024" height="86" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<text x="120" y="502" font-size="30" font-weight="800" fill="#1f6f3a">30–50%</text>
<text x="120" y="526" font-size="12" fill="#8a8a8a">at the dock</text>
<line x1="290" y1="476" x2="290" y2="526" stroke="#ecdcc0" stroke-width="2"/>
<text x="320" y="494" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE RECEIVING-DOCK EFFECT</text>
<text x="320" y="518" font-size="14" fill="#291c0e">Much of the shrinkage reduction lands before a single in-store reader is installed.</text>
<text x="600" y="590" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The cheapest shrinkage win is the tag that arrived already in the box.</text>
