<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The wooden NFC card: FSC-certified veneer around a standard NFC inlay</title>
<desc id="d">A wooden NFC business card with visible grain and a laser-engraved logo, tapping at 13.56 MHz. Four feature chips beneath it: FSC-certified veneer, RF-transparent NFC so the wood does not block the signal, a laser-engraved ink-free mark, and ISO CR80 size at 0.76 to 0.84 mm that fits a standard wallet.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c99a5f"/><stop offset="100%" stop-color="#a97e46"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ECO NFC · WOODEN CARDS</text>
<text x="600" y="100" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">The card recipients actually keep</text>
<text x="600" y="132" text-anchor="middle" font-size="15.5" fill="#4f4f4f">FSC-certified wood veneer around a standard NFC inlay — sustainable branding that survives the bin.</text>

<!-- wooden card -->
<rect x="400" y="182" width="400" height="248" rx="18" fill="url(#wood)" stroke="#8a6636" stroke-width="2.5"/>
<path d="M 420 224 q 190 -14 360 0" fill="none" stroke="#b98b50" stroke-width="2"/>
<path d="M 420 262 q 190 12 360 0" fill="none" stroke="#b98b50" stroke-width="2"/>
<path d="M 420 344 q 190 -12 360 0" fill="none" stroke="#b98b50" stroke-width="2"/>
<path d="M 420 388 q 190 10 360 0" fill="none" stroke="#b98b50" stroke-width="2"/>
<rect x="432" y="238" width="196" height="96" rx="8" fill="#7a552c"/>
<text x="530" y="280" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#f3e6cf">YOUR BRAND</text>
<text x="530" y="306" text-anchor="middle" font-size="12" fill="#d9c3a0">laser-engraved</text>
<path d="M 690 250 a 26 26 0 0 1 0 52" fill="none" stroke="#f3e6cf" stroke-width="2.6"/>
<path d="M 704 240 a 40 40 0 0 1 0 72" fill="none" stroke="#f3e6cf" stroke-width="2.4"/>
<path d="M 718 230 a 54 54 0 0 1 0 92" fill="none" stroke="#f3e6cf" stroke-width="2.2"/>
<text x="628" y="410" font-size="12.5" font-weight="700" fill="#f3e6cf">13.56 MHz · tap</text>

<!-- feature chips -->
<rect x="150" y="470" width="210" height="58" rx="12" fill="#e9f2ec" stroke="#94bfa5" stroke-width="1.8"/>
<circle cx="182" cy="499" r="9" fill="#2d6a4f"/>
<path d="M 177 499 l 3 4 l 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200" y="495" font-size="13.5" font-weight="800" fill="#1b4332">FSC-certified</text>
<text x="200" y="513" font-size="12.5" fill="#3a5a49">wood veneer</text>

<rect x="380" y="470" width="210" height="58" rx="12" fill="#eef5f5" stroke="#8fb6b6" stroke-width="1.8"/>
<circle cx="412" cy="499" r="9" fill="#3d6b6b"/>
<path d="M 407 499 l 3 4 l 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="430" y="495" font-size="13.5" font-weight="800" fill="#234a4a">RF-transparent</text>
<text x="430" y="513" font-size="12.5" fill="#3a5a5a">full NFC, no tuning</text>

<rect x="610" y="470" width="210" height="58" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.8"/>
<circle cx="642" cy="499" r="9" fill="#c39a5f"/>
<path d="M 637 499 l 3 4 l 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="660" y="495" font-size="13.5" font-weight="800" fill="#8a6a2f">Laser-engraved</text>
<text x="660" y="513" font-size="12.5" fill="#6d5a3a">permanent, ink-free</text>

<rect x="840" y="470" width="210" height="58" rx="12" fill="#eef0f4" stroke="#a7afbb" stroke-width="1.8"/>
<circle cx="872" cy="499" r="9" fill="#4a5568"/>
<path d="M 867 499 l 3 4 l 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="890" y="495" font-size="13.5" font-weight="800" fill="#3a4454">ISO CR80</text>
<text x="890" y="513" font-size="12.5" fill="#4a5568">0.76–0.84 mm</text>

<text x="600" y="576" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Wood outside, a standard NFC inlay inside — sustainability you can hand across a table.</text>
</svg>
