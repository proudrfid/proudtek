<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Why 150 reviews at 4.4 stars outrank 30 reviews at 4.8 stars in the Google local pack</title>
<desc id="d">Two restaurants compared. On the left, a restaurant with 150 recent reviews and a 4.4-star average, described as recent and steady velocity, wins the local three-pack. On the right, a restaurant with 30 reviews and a 4.8-star average, described as higher rated but with fewer signals, slips to position four. A note explains that Google weighs review volume and recency alongside rating, and that the gap between the three-pack and position four is 20 to 35 percent of a location's discovery traffic.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY VOLUME BEATS A HIGHER STAR</text>
<text x="600" y="92" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="29" font-weight="700" fill="#291c0e">150 reviews at 4.4 outrank 30 reviews at 4.8</text>

<!-- winner card -->
<rect x="64" y="126" width="512" height="338" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.5"/>
<text x="92" y="172" font-size="22" font-weight="800" fill="#234a4a">Rivoli Trattoria</text>
<text x="92" y="250" font-size="62" font-weight="800" fill="#2c5454">150</text>
<text x="270" y="250" font-size="20" fill="#4f4f4f">recent</text>
<text x="270" y="276" font-size="20" fill="#4f4f4f">reviews</text>
<text x="92" y="312" font-size="21" fill="#d4a755">★</text><text x="118" y="312" font-size="19" font-weight="700" fill="#234a4a">4.4 average</text>
<text x="300" y="312" font-size="15" fill="#3d6b6b">recent &amp; steady velocity</text>
<rect x="92" y="392" width="384" height="48" rx="24" fill="#2c5454"/>
<text x="284" y="422" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.4" fill="#ffffff">WINS THE LOCAL 3-PACK</text>

<!-- vs -->
<circle cx="600" cy="290" r="23" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="296" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">vs</text>

<!-- loser card -->
<rect x="624" y="126" width="512" height="338" rx="16" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.5"/>
<text x="652" y="172" font-size="22" font-weight="800" fill="#33404f">The Quiet Corner</text>
<text x="652" y="250" font-size="62" font-weight="800" fill="#8794a6">30</text>
<text x="742" y="250" font-size="20" fill="#7b8794">reviews</text>
<text x="652" y="312" font-size="21" fill="#d4a755">★</text><text x="678" y="312" font-size="19" font-weight="700" fill="#33404f">4.8 average</text>
<text x="860" y="312" font-size="15" fill="#8794a6">higher rated, fewer signals</text>
<rect x="652" y="392" width="384" height="48" rx="24" fill="#ffffff" stroke="#8794a6" stroke-width="1.6"/>
<text x="844" y="422" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.4" fill="#4a5568">SLIPS TO POSITION 4</text>

<line x1="64" y1="500" x2="1136" y2="500" stroke="#ece5d7" stroke-width="1.5"/>
<text x="600" y="536" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Google weighs review volume and recency alongside rating.</text>
<text x="600" y="566" text-anchor="middle" font-size="14.5" fill="#5c5c5c">The gap between the local 3-pack and position 4 is 20-35% of a location's discovery traffic.</text>
</svg>
