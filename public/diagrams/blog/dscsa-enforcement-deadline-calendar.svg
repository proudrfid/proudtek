<text x="944" y="598" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">risk-based &amp; progressive</text>
<text x="600.0" y="645" text-anchor="middle" font-size="18" font-weight="700" fill="#6d5a3a">Each party runs its own clock — track them separately.</text>
