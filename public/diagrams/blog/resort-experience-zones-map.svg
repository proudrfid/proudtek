<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">GUEST EXPERIENCE ZONES · ONE CREDENTIAL</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Four zones, one wrist — each reader authorizes the band per amenity.</text>

