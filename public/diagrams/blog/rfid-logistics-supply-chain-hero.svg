<!-- capture band -->
<rect x="64" y="470" width="1072" height="70" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<text x="600" y="500" text-anchor="middle" font-size="15.5" font-weight="800" fill="#1f6f3a">Continuous, automatic capture</text>
<text x="600" y="523" text-anchor="middle" font-size="13.5" fill="#2f5d3f">Every read feeds WMS · TMS · ERP in real time — no manual, stop-and-scan barcode checks</text>

<text x="600" y="590" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Barcode asks a person to scan each point. RFID lets the doorway read the whole load.</text>
</svg>
