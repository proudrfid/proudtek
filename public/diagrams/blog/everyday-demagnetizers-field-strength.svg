<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Everyday demagnetizers ranked by erasure risk, showing the phone is rarely the worst offender</title>
<desc id="d">Five everyday magnetic-field sources ranked by erasure risk with a five-square meter each. Handbag magnetic clasps rate five of five, cited by Kisi as the number-one culprit. Magnetic car mounts rate four of five, exposing a card for the whole drive. Novelty and fridge magnets rate three of five, exceeding 2000 oersteds at contact. Retail EAS deactivation gates rate five of five, causing instant full erasure. MRI fringe fields rate five of five, at 5,000 to 50,000 gauss.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BEYOND THE PHONE · WHAT ELSE ERASES A STRIPE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Ranked by real-world erasure risk. The phone is not even the worst thing in the guest's bag.</text>

<text x="622" y="126" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.5" fill="#6d5a3a">ERASURE RISK</text>
<text x="958" y="126" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.5" fill="#6d5a3a">FIELD / EVIDENCE</text>

<!-- row 1 handbag -->
<rect x="64" y="138" width="1072" height="72" rx="12" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.5"/>
<rect x="64" y="138" width="9" height="72" rx="4" fill="#8b2d2d"/>
<text x="96" y="169" font-size="15.5" font-weight="700" fill="#291c0e">Handbag magnetic clasp</text>
<text x="96" y="190" font-size="12.5" fill="#5c5c5c">rare-earth, unshielded; hours of pocket contact</text>
<rect x="560" y="164" width="20" height="20" rx="3" fill="#8b2d2d"/>
<rect x="586" y="164" width="20" height="20" rx="3" fill="#8b2d2d"/>
<rect x="612" y="164" width="20" height="20" rx="3" fill="#8b2d2d"/>
<rect x="638" y="164" width="20" height="20" rx="3" fill="#8b2d2d"/>
<rect x="664" y="164" width="20" height="20" rx="3" fill="#8b2d2d"/>
<rect x="804" y="150" width="308" height="48" rx="10" fill="#ffffff" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="958" y="179" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8b2d2d">Kisi: #1 culprit</text>

<!-- row 2 car mount -->
<rect x="64" y="222" width="1072" height="72" rx="12" fill="#fbf7ee" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="64" y="222" width="9" height="72" rx="4" fill="#6d5a3a"/>
<text x="96" y="253" font-size="15.5" font-weight="700" fill="#291c0e">Magnetic car mount / cradle</text>
<text x="96" y="274" font-size="12.5" fill="#5c5c5c">continuous field for the whole drive</text>
<rect x="560" y="248" width="20" height="20" rx="3" fill="#6d5a3a"/>
<rect x="586" y="248" width="20" height="20" rx="3" fill="#6d5a3a"/>
<rect x="612" y="248" width="20" height="20" rx="3" fill="#6d5a3a"/>
