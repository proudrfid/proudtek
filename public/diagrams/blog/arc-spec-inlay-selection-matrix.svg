<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Auburn ARC inlay Spec selection by product category</title>
<desc id="d">A mapping of Auburn ARC inlay Specs to product categories. Spec A or B for apparel, home textiles and boxed toys, general-purpose dogbone inlays. Spec G for small items, blister packs and linens, miniaturised with shorter range. Spec L for on-metal sporting goods, hardlines and die-cast toys, using a foam or FR-4 spacer at two to three times the cost. Spec M for footwear, a dense rubber and fabric composite. Spec R for packaged electronics with 15 to 30 dB of loss, tagged on the outer box. Spec T for near-metal-tolerant mixed-material packaging. ARC approval is per-Spec, not universal.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INLAY SELECTION · AUBURN ARC SPECS</text>
<text x="600" y="95" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">Match the Spec to the packaging</text>
<text x="600" y="126" text-anchor="middle" font-size="15" fill="#4f4f4f">ARC-approval is per-Spec, not universal — an apparel inlay is not an on-metal inlay.</text>

<text x="188" y="172" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ARC SPEC</text>
<text x="300" y="172" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PRODUCT CATEGORY</text>
<text x="700" y="172" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY IT MATTERS</text>

<rect x="100" y="184" width="1000" height="54" rx="10" fill="#f7f5f1" stroke="#e6dfd2" stroke-width="1.2"/>
<rect x="118" y="193" width="140" height="36" rx="9" fill="#eef1f5" stroke="#c9d2dc" stroke-width="1.2"/><text x="188" y="217" text-anchor="middle" font-size="16" font-weight="800" fill="#3a4453">A / B</text>
<text x="300" y="216" font-size="14.5" font-weight="700" fill="#291c0e">Apparel, home textiles, boxed toys</text>
<text x="700" y="216" font-size="13" fill="#4f4f4f">General-purpose dogbone inlays</text>

<rect x="100" y="244" width="1000" height="54" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.2"/>
<rect x="118" y="253" width="140" height="36" rx="9" fill="#eef1f5" stroke="#c9d2dc" stroke-width="1.2"/><text x="188" y="277" text-anchor="middle" font-size="16" font-weight="800" fill="#3a4453">G</text>
<text x="300" y="276" font-size="14.5" font-weight="700" fill="#291c0e">Small items, blister packs, linens</text>
<text x="700" y="276" font-size="13" fill="#4f4f4f">Miniaturised; shorter range, fine at &lt;2 m</text>

<rect x="100" y="304" width="1000" height="54" rx="10" fill="#f7f5f1" stroke="#e6dfd2" stroke-width="1.2"/>
<rect x="118" y="313" width="140" height="36" rx="9" fill="#eef1f5" stroke="#c9d2dc" stroke-width="1.2"/><text x="188" y="337" text-anchor="middle" font-size="16" font-weight="800" fill="#3a4453">L</text>
<text x="300" y="336" font-size="14.5" font-weight="700" fill="#291c0e">On-metal: sporting, hardlines, die-cast</text>
<text x="700" y="336" font-size="13" fill="#4f4f4f">Foam / FR-4 spacer · 2–3× the cost</text>

<rect x="100" y="364" width="1000" height="54" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.2"/>
<rect x="118" y="373" width="140" height="36" rx="9" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/><text x="188" y="397" text-anchor="middle" font-size="16" font-weight="800" fill="#8a6a2f">M</text>
<text x="300" y="396" font-size="14.5" font-weight="700" fill="#291c0e">Footwear</text>
<text x="700" y="396" font-size="13" fill="#4f4f4f">Dense rubber + fabric composite</text>

<rect x="100" y="424" width="1000" height="54" rx="10" fill="#f7f5f1" stroke="#e6dfd2" stroke-width="1.2"/>
<rect x="118" y="433" width="140" height="36" rx="9" fill="#eef1f5" stroke="#c9d2dc" stroke-width="1.2"/><text x="188" y="457" text-anchor="middle" font-size="16" font-weight="800" fill="#3a4453">R</text>
<text x="300" y="456" font-size="14.5" font-weight="700" fill="#291c0e">Packaged electronics</text>
<text x="700" y="456" font-size="13" fill="#4f4f4f">15–30 dB loss; tag the outer box</text>

<rect x="100" y="484" width="1000" height="54" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.2"/>
<rect x="118" y="493" width="140" height="36" rx="9" fill="#eef1f5" stroke="#c9d2dc" stroke-width="1.2"/><text x="188" y="517" text-anchor="middle" font-size="16" font-weight="800" fill="#3a4453">T</text>
<text x="300" y="516" font-size="14.5" font-weight="700" fill="#291c0e">Near-metal tolerant</text>
<text x="700" y="516" font-size="13" fill="#4f4f4f">Mixed-material packaging</text>

<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#4f4f4f">An inlay approved for apparel is not approved for on-metal — the Spec letter is the contract.</text>
</svg>
