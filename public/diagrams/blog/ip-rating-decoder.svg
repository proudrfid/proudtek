<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How to read an IP code and the IP65 to IP69K ladder for outdoor RFID tags</title>
<desc id="d">An IP code from IEC 60529 has two digits. The first rates protection against solids from 0 to 6, where 6 is dust-tight. The second rates liquids from 0 to 9K, where 7 is temporary immersion in 1 metre for 30 minutes. The ladder: IP65 protects against low-pressure water jets for rain, signage and vehicle tags. IP67 is temporary immersion, 1 metre for 30 minutes, for laundry and wearables. IP68 is continuous immersion beyond 1 metre for marine and submerged use. IP69K is high-pressure, high-temperature wash-down for food, pharmaceutical and dairy.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">IP RATINGS · HOW TO READ THE CODE</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">IEC 60529 splits protection into two digits — solids first, liquids second.</text>

<!-- decoder -->
<text x="474" y="176" font-size="40" font-weight="800" fill="#291c0e">IP</text>
<rect x="524" y="132" width="60" height="66" rx="9" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.4"/>
<text x="554" y="178" text-anchor="middle" font-size="36" font-weight="800" fill="#2c5454">6</text>
<rect x="596" y="132" width="60" height="66" rx="9" fill="#eef5f5" stroke="#4a5568" stroke-width="2.4"/>
<text x="626" y="178" text-anchor="middle" font-size="36" font-weight="800" fill="#3a4456">7</text>

<rect x="118" y="128" width="316" height="74" rx="11" fill="#faf7f0" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="138" y="156" font-size="13" font-weight="800" fill="#2c5454">FIRST DIGIT · SOLIDS (0–6)</text>
<text x="138" y="182" font-size="13.5" fill="#5c5c5c">6 = dust-tight</text>
<line x1="434" y1="165" x2="522" y2="165" stroke="#c8b79a" stroke-width="2"/>

<rect x="746" y="128" width="336" height="74" rx="11" fill="#faf7f0" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="766" y="156" font-size="13" font-weight="800" fill="#3a4456">SECOND DIGIT · LIQUIDS (0–9K)</text>
<text x="766" y="182" font-size="13.5" fill="#5c5c5c">7 = immersion, 1 m / 30 min</text>
<line x1="658" y1="165" x2="744" y2="165" stroke="#c8b79a" stroke-width="2"/>

<!-- ladder -->
<rect x="64" y="238" width="1072" height="58" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="238" width="120" height="58" rx="10" fill="#eef5f5"/>
<text x="124" y="274" text-anchor="middle" font-size="20" font-weight="800" fill="#3d6b6b">IP65</text>
<text x="208" y="266" font-size="14.5" font-weight="700" fill="#291c0e">Low-pressure water jets</text>
<text x="208" y="286" font-size="12.5" fill="#5c5c5c">rain-exposed outdoor signage, toll tags, vehicle-mounted tags</text>

<rect x="64" y="306" width="1072" height="58" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="306" width="120" height="58" rx="10" fill="#e7efef"/>
<text x="124" y="342" text-anchor="middle" font-size="20" font-weight="800" fill="#2c5454">IP67</text>
<text x="208" y="334" font-size="14.5" font-weight="700" fill="#291c0e">Temporary immersion — 1 m for 30 min</text>
<text x="208" y="354" font-size="12.5" fill="#5c5c5c">industrial laundry tags, wearables used near water</text>

<rect x="64" y="374" width="1072" height="58" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="374" width="120" height="58" rx="10" fill="#e9ecf1"/>
<text x="124" y="410" text-anchor="middle" font-size="20" font-weight="800" fill="#4a5568">IP68</text>
<text x="208" y="402" font-size="14.5" font-weight="700" fill="#291c0e">Continuous immersion beyond 1 m</text>
<text x="208" y="422" font-size="12.5" fill="#5c5c5c">underwater asset tracking, marine, permanently submerged sensors</text>

<rect x="64" y="442" width="1072" height="58" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<rect x="64" y="442" width="120" height="58" rx="10" fill="#dcefe2"/>
<text x="124" y="478" text-anchor="middle" font-size="19" font-weight="800" fill="#1f6f3a">IP69K</text>
<text x="208" y="470" font-size="14.5" font-weight="700" fill="#291c0e">High-pressure, high-temperature wash-down</text>
<text x="208" y="490" font-size="12.5" fill="#5c5c5c">food-processing, pharmaceutical and dairy-industry environments</text>

<text x="600" y="548" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Higher is not automatically better — pick the rung that matches the threat, then stop paying for the ones above it.</text>
</svg>
