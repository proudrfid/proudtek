<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">888 bytes — what NTAG216 actually carries</title>
  <desc id="d">Payload panel: URI record up to about 872 characters after overhead, full RFC 6350 vCard with name, photo URL, title, organisation and multiple phone numbers, and multi-record NDEF bundles. 222 pages of 4 bytes make it the biggest Type 2 sticker tier.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">888 bytes — the whole business card, no redirect</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">High-memory tier: 222 pages x 4 bytes, NFC Forum Type 2</text>
  <g transform="translate(70,150)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="640" height="330" rx="14" fill="#ffffff" stroke="#2c5454" stroke-width="2.5"/>
    <text x="26" y="42" font-family="Georgia, serif" font-size="18" fill="#2c5454">A full vCard, on the tag itself (RFC 6350)</text>
    <g font-size="13" fill="#2c5454">
      <rect x="26" y="60" width="588" height="30" rx="5" fill="#eef2f0" stroke="#3d6b6b"/><text x="40" y="80">FN / N — name + nickname</text>
      <rect x="26" y="96" width="588" height="30" rx="5" fill="#eef2f0" stroke="#3d6b6b"/><text x="40" y="116">photo URL · title · organisation · role</text>
      <rect x="26" y="132" width="588" height="30" rx="5" fill="#eef2f0" stroke="#3d6b6b"/><text x="40" y="152">multiple phone numbers (CELL / WORK)</text>
      <rect x="26" y="168" width="588" height="30" rx="5" fill="#eef2f0" stroke="#3d6b6b"/><text x="40" y="188">email · web · postal address</text>
    </g>
    <text x="26" y="234" font-size="13" fill="#6d5a3a">No URL redirect, no hosted profile dependency — the contact record</text>
    <text x="26" y="256" font-size="13" fill="#6d5a3a">lives in the sticker and imports offline</text>
    <text x="26" y="298" font-size="13" fill="#6d5a3a">Or one long URI record: up to ~872 characters after overhead</text>
  </g>
  <g transform="translate(760,150)">
    <rect x="0" y="0" width="370 " height="330" rx="12" fill="#fdf3e3" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="42" font-family="Georgia, serif" font-size="18" fill="#291c0e">Memory ladder, top rung</text>
    <text x="24" y="82" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">NTAG213 — 144 B — one URL</text>
    <text x="24" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">NTAG215 — 504 B — Amiibo / Wi-Fi</text>
    <text x="24" y="142" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#291c0e">NTAG216 — 888 B — vCard + bundles</text>
    <line x1="24" y1="168" x2="346" y2="168" stroke="#d8cdb8" stroke-width="1.5"/>
    <text x="24" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">Sizes: Ø22 · Ø25 · Ø30 mm (extended range)</text>
    <text x="24" y="228" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">White or silver PET face, printable</text>
    <text x="24" y="266" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Smart packaging + business cards are</text>
    <text x="24" y="288" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">the two verticals that fill this tier</text>
  </g>
</svg>
