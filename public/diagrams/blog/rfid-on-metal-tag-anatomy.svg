<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">On-metal tag anatomy: ferrite-backed, ceramic, foam-spacer and conformal cross-sections</title>
<desc id="d">Four cross-section panels, each showing a tag construction sitting on a hatched steel base. Ferrite-backed: a thin dark ferrite sheet between the label antenna and the steel blocks the ground-plane effect and restores 50 to 90 percent of range. Ceramic: the chip lives inside an aluminum-oxide block that is its own non-conductive standoff — works on any metal and is rugged. Foam spacer: a closed-cell foam layer holds a 2 to 5 millimetre air gap between antenna and steel — low cost but thicker. Conformal: a thin on-metal-tuned label sits directly on the steel and recruits the metal as part of its antenna, outreading its own free-air performance.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<pattern id="steel" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#eef1f5"/><path d="M -1 1 L 1 -1 M 0 12 L 12 0 M 11 13 L 13 11" stroke="#d3dae3" stroke-width="3"/></pattern>
<marker id="arrGrn" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1f6f3a"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ON-METAL TAG ANATOMY</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Four constructions that make peace with steel</text>

<rect x="70" y="130" width="250" height="430" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="340" y="130" width="250" height="430" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="610" y="130" width="250" height="430" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="880" y="130" width="250" height="430" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>

<text x="195" y="168" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Ferrite-backed</text>
<rect x="120" y="182" width="150" height="26" rx="13" fill="#eaf3ed" stroke="#1f6f3a" stroke-width="1.4"/>
<text x="195" y="199" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">restores 50–90%</text>
<path d="M 177 298 A 24 24 0 0 1 213 298" fill="none" stroke="#3d6b6b" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 165 306 A 40 40 0 0 1 225 306" fill="none" stroke="#9eb5b5" stroke-width="2.2" stroke-linecap="round"/>
<rect x="103" y="340" width="184" height="30" rx="4" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="117" y="348" width="14" height="14" rx="2" fill="#c39a5f"/>
<path d="M 139 355 H 273" stroke="#8ba6a6" stroke-width="2.5" stroke-linecap="round"/>
<rect x="105" y="370" width="180" height="20" rx="2" fill="#4a5568"/>
<text x="195" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">FERRITE</text>
<rect x="95" y="390" width="200" height="36" fill="url(#steel)" stroke="#4a5568" stroke-width="1.8"/>
<text x="195" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">STEEL</text>
<text x="195" y="468" text-anchor="middle" font-size="12.5" fill="#4f4f4f">thin ferrite sheet blocks</text>
<text x="195" y="486" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the ground-plane effect</text>

<text x="465" y="168" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Ceramic</text>
<rect x="385" y="182" width="160" height="26" rx="13" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="465" y="199" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">any metal · rugged</text>
<path d="M 447 298 A 24 24 0 0 1 483 298" fill="none" stroke="#3d6b6b" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 435 306 A 40 40 0 0 1 495 306" fill="none" stroke="#9eb5b5" stroke-width="2.2" stroke-linecap="round"/>
<rect x="395" y="336" width="140" height="54" rx="10" fill="#eef1f5" stroke="#4a5568" stroke-width="2"/>
<text x="465" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">CERAMIC</text>
<rect x="456" y="364" width="18" height="16" rx="2" fill="#c39a5f"/>
<rect x="365" y="390" width="200" height="36" fill="url(#steel)" stroke="#4a5568" stroke-width="1.8"/>
<text x="465" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">STEEL</text>
<text x="465" y="468" text-anchor="middle" font-size="12.5" fill="#4f4f4f">aluminum-oxide body is its</text>
<text x="465" y="486" text-anchor="middle" font-size="12.5" fill="#4f4f4f">own standoff — tough as a boot</text>

<text x="735" y="168" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Foam spacer</text>
<rect x="655" y="182" width="160" height="26" rx="13" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.4"/>
<text x="735" y="199" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">low cost · thicker</text>
<path d="M 717 298 A 24 24 0 0 1 753 298" fill="none" stroke="#3d6b6b" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 705 306 A 40 40 0 0 1 765 306" fill="none" stroke="#9eb5b5" stroke-width="2.2" stroke-linecap="round"/>
<rect x="643" y="334" width="184" height="26" rx="4" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="657" y="341" width="12" height="12" rx="2" fill="#c39a5f"/>
<path d="M 677 347 H 813" stroke="#8ba6a6" stroke-width="2.5" stroke-linecap="round"/>
<rect x="643" y="360" width="184" height="30" rx="3" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.6" stroke-dasharray="5 4"/>
<circle cx="660" cy="375" r="2" fill="#d4a755"/>
<circle cx="810" cy="375" r="2" fill="#d4a755"/>
<text x="735" y="379" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5a3a">AIR GAP 2–5 mm</text>
<rect x="635" y="390" width="200" height="36" fill="url(#steel)" stroke="#4a5568" stroke-width="1.8"/>
<text x="735" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">STEEL</text>
<text x="735" y="468" text-anchor="middle" font-size="12.5" fill="#4f4f4f">closed-cell foam lifts the</text>
<text x="735" y="486" text-anchor="middle" font-size="12.5" fill="#4f4f4f">antenna off the metal</text>

<text x="1005" y="168" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Conformal</text>
<rect x="930" y="182" width="150" height="26" rx="13" fill="#eaf3ed" stroke="#1f6f3a" stroke-width="1.4"/>
<text x="1005" y="199" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">outreads free air</text>
<path d="M 987 298 A 24 24 0 0 1 1023 298" fill="none" stroke="#1f6f3a" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 975 306 A 40 40 0 0 1 1035 306" fill="none" stroke="#83af92" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 963 314 A 56 56 0 0 1 1047 314" fill="none" stroke="#bbd3c3" stroke-width="2" stroke-linecap="round"/>
<rect x="913" y="368" width="184" height="22" rx="4" fill="#ffffff" stroke="#1f6f3a" stroke-width="2.2"/>
<rect x="925" y="373" width="11" height="11" rx="2" fill="#c39a5f"/>
<text x="1013" y="383" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">ON-METAL TUNED</text>
<rect x="905" y="390" width="200" height="36" fill="url(#steel)" stroke="#4a5568" stroke-width="1.8"/>
<text x="1005" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">STEEL</text>
<path d="M 953 392 Q 945 408 959 416" fill="none" stroke="#1f6f3a" stroke-width="2" marker-end="url(#arrGrn)"/>
<path d="M 1057 392 Q 1065 408 1051 416" fill="none" stroke="#1f6f3a" stroke-width="2" marker-end="url(#arrGrn)"/>
<text x="1005" y="468" text-anchor="middle" font-size="12.5" fill="#4f4f4f">recruits the steel as part</text>
<text x="1005" y="486" text-anchor="middle" font-size="12.5" fill="#4f4f4f">of the antenna itself</text>

<text x="600" y="606" text-anchor="middle" font-size="14.5" font-weight="600" fill="#291c0e">Pick by thickness, budget, and how much range you need back.</text>
<text x="600" y="634" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The conformal label is the overachiever — better range on steel than in free air.</text>
</svg>
