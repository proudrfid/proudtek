<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The RFID market roughly doubles from about $15 billion in 2025 to over $30 billion by 2030</title>
<desc id="d">A market-forecast overview. Two columns show the total addressable RFID market roughly doubling from about $15 billion in 2025 to more than $30 billion by 2030, a gain marked as roughly two times in five years. A gold banner notes more than 50 billion RFID tags shipped per year by 2028. Three demand engines are pulling the growth: retail tagging mandates, the EU Digital Product Passport, and healthcare asset tracking (RTLS).</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID MARKET · 2025–2030 FORECAST</text>
<text x="600" y="99" text-anchor="middle" font-size="36" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">The RFID market roughly doubles by 2030</text>
<text x="600" y="131" text-anchor="middle" font-size="16" fill="#4f4f4f">About $15 billion in 2025 to more than $30 billion by 2030 — three forces do the pulling.</text>
<rect x="385" y="156" width="430" height="34" rx="17" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="600" y="178.5" text-anchor="middle" font-size="14" font-weight="800" fill="#6d5a3a">50 billion+ RFID tags shipped per year by 2028</text>
<line x1="150" y1="540" x2="690" y2="540" stroke="#cfe0e0" stroke-width="2"/>
<rect x="235" y="390" width="120" height="150" rx="8" fill="#3d6b6b"/>
<text x="295" y="375" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454">$15B</text>
<text x="295" y="566" text-anchor="middle" font-size="14" fill="#5c5c5c">2025</text>
<rect x="520" y="240" width="120" height="300" rx="8" fill="#2c5454"/>
<text x="580" y="225" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454">$30B+</text>
<text x="580" y="566" text-anchor="middle" font-size="14" fill="#5c5c5c">2030</text>
<line x1="300" y1="388" x2="575" y2="242" stroke="#c39a5f" stroke-width="3" stroke-dasharray="7 6"/>
<circle cx="437" cy="308" r="23" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="437" y="315" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">2×</text>
<text x="420" y="592" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Total addressable market — tags, readers, software, services</text>
<text x="948" y="232" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT'S PULLING IT</text>
<rect x="762" y="250" width="372" height="92" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="762" y="250" width="8" height="92" rx="4" fill="#3d6b6b"/>
<text x="792" y="288" font-size="16" font-weight="700" fill="#291c0e">Retail tagging mandates</text>
<text x="792" y="314" font-size="13" fill="#5c5c5c">Apparel source-tagging at chain scale</text>
<rect x="762" y="356" width="372" height="92" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="762" y="356" width="8" height="92" rx="4" fill="#4a5568"/>
<text x="792" y="394" font-size="16" font-weight="700" fill="#291c0e">EU Digital Product Passport</text>
<text x="792" y="420" font-size="13" fill="#5c5c5c">Textiles, electronics, batteries</text>
<rect x="762" y="462" width="372" height="92" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="762" y="462" width="8" height="92" rx="4" fill="#2d6a4f"/>
<text x="792" y="500" font-size="16" font-weight="700" fill="#291c0e">Healthcare asset tracking</text>
<text x="792" y="526" font-size="13" fill="#5c5c5c">RTLS across hospital systems</text>
<text x="948" y="590" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Written into law, not pitched in a keynote.</text>
