<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Cross-section of the silicone flex-RFID stack, shown bent</title>
  <desc id="d">A bent cross-section of the flexible RFID tag. An elastomer envelope of platinum-cured VMQ, TPU or FVMQ surrounds a flexible printed-circuit inlay: a polyimide carrier of 25 to 50 micrometres, a rolled-annealed copper antenna of 12 to 35 micrometres and a low-modulus coverlay, with the RFID chip riding the stack uncracked. The assembly bends to a 10 mm static and 15 mm dynamic minimum radius and survives 10,000-plus cycles with under 5 percent antenna-DCR change per IPC-6013 Class 3.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INSIDE THE FLEX-RFID STACK</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#5c5c5c">Elastomer envelope · flexible printed-circuit inlay · bends to 10 mm without detuning</text>

  <!-- bent layer stack (arcs, right tips staggered for callouts) -->
  <path d="M 290 400 A 640 640 0 0 1 910 400" fill="none" stroke="#e4c98f" stroke-width="52"/>
  <path d="M 300 430 A 640 640 0 0 1 900 430" fill="none" stroke="#3d6b6b" stroke-width="13"/>
  <path d="M 304 446 A 640 640 0 0 1 896 446" fill="none" stroke="#d4a755" stroke-width="9"/>
  <path d="M 306 459 A 640 640 0 0 1 894 459" fill="none" stroke="#7fa3a3" stroke-width="8"/>
  <path d="M 310 484 A 640 640 0 0 1 890 484" fill="none" stroke="#e4c98f" stroke-width="26"/>
  <!-- chip at apex -->
  <rect x="580" y="332" width="40" height="22" rx="3" fill="#291c0e"/>

  <!-- left callouts -->
  <text x="80" y="248" font-size="17" font-weight="700" fill="#6d5a3a">Elastomer envelope</text>
  <text x="80" y="272" font-size="13.5" fill="#5c5c5c">platinum-cured VMQ · TPU · FVMQ</text>
  <line x1="86" y1="286" x2="358" y2="352" stroke="#c39a5f" stroke-width="2"/>
  <circle cx="360" cy="353" r="4" fill="#c39a5f"/>

  <text x="80" y="470" font-size="17" font-weight="700" fill="#2c5454">Polyimide carrier</text>
  <text x="80" y="494" font-size="13.5" fill="#3d6b6b">Kapton, 25-50 µm</text>
  <line x1="248" y1="462" x2="308" y2="432" stroke="#3d6b6b" stroke-width="2"/>
  <circle cx="310" cy="431" r="4" fill="#3d6b6b"/>

  <!-- right callouts -->
  <text x="1120" y="248" text-anchor="end" font-size="17" font-weight="700" fill="#291c0e">RFID chip</text>
  <text x="1120" y="272" text-anchor="end" font-size="13.5" fill="#5c5c5c">no cracking · no antenna detuning</text>
  <line x1="1010" y1="284" x2="630" y2="340" stroke="#291c0e" stroke-width="2"/>
  <circle cx="627" cy="341" r="4" fill="#291c0e"/>

  <text x="1120" y="440" text-anchor="end" font-size="17" font-weight="700" fill="#6d5a3a">Rolled-annealed copper</text>
  <text x="1120" y="464" text-anchor="end" font-size="13.5" fill="#5c5c5c">12-35 µm conductor</text>
  <line x1="960" y1="452" x2="902" y2="447" stroke="#d4a755" stroke-width="2"/>
  <circle cx="900" cy="446" r="4" fill="#d4a755"/>

  <text x="1120" y="502" text-anchor="end" font-size="15" font-weight="700" fill="#2c5454">Low-modulus coverlay</text>
  <line x1="950" y1="494" x2="898" y2="462" stroke="#7fa3a3" stroke-width="2"/>
  <circle cx="896" cy="460" r="4" fill="#7fa3a3"/>

  <!-- bend radius annotation -->
  <path d="M 552 560 A 60 60 0 0 1 648 560" fill="none" stroke="#6d5a3a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="600" y="590" text-anchor="middle" font-size="14.5" font-weight="600" fill="#6d5a3a">minimum bend radius: 10 mm static / 15 mm dynamic</text>

  <!-- result band -->
  <rect x="230" y="606" width="740" height="42" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="633" text-anchor="middle" font-size="14.5" font-weight="600" fill="#2c5454">10,000+ cycles at 10 mm · &lt;5 % antenna-DCR change · IPC-6013 Class 3</text>
</svg>
