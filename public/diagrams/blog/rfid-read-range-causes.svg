<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five common causes of short RFID read range and the fix for each</title>
<desc id="d">Five rows pairing a cause with its fix. Metal surfaces reflect and detune RF and cut standard-tag range by 50 to 90 percent; the fix is anti-metal tags with ferrite isolation. Liquid and water absorb UHF energy; the fix is reorienting away from liquid or adding standoff. Tag-orientation mismatch creates a polarization null; the fix is aligning polarization or using a circular antenna. Low reader power ships from the factory below the legal limit; the fix is raising it within regulation. Long coax cable adds loss; the fix is shorter, lower-loss cable or a closer reader.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE CAUSES · AND THE FIX FOR EACH</text>
<text x="600" y="82" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Diagnose in place before you replace a single inlay.</text>

<!-- row 1 -->
<rect x="64" y="110" width="330" height="70" rx="12" fill="#f7ecec" stroke="#e0b9b9" stroke-width="1.6"/>
<text x="82" y="138" font-size="15" font-weight="800" fill="#8b2d2d">Metal surfaces</text>
<text x="82" y="160" font-size="12.5" fill="#9c6a6a">reflects &amp; detunes RF · 50–90% loss</text>
<line x1="404" y1="145" x2="428" y2="145" stroke="#3d6b6b" stroke-width="3"/><polygon points="428,138 444,145 428,152" fill="#3d6b6b"/>
<rect x="454" y="110" width="682" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="454" y="110" width="6" height="70" rx="3" fill="#3d6b6b"/>
<text x="480" y="152" font-size="14.5" fill="#291c0e">Anti-metal tags with a ferrite isolation layer, designed to perform on metal.</text>

<!-- row 2 -->
<rect x="64" y="196" width="330" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="82" y="224" font-size="15" font-weight="800" fill="#2c5454">Liquid &amp; water</text>
<text x="82" y="246" font-size="12.5" fill="#5c7a7a">UHF energy is absorbed</text>
<line x1="404" y1="231" x2="428" y2="231" stroke="#3d6b6b" stroke-width="3"/><polygon points="428,224 444,231 428,238" fill="#3d6b6b"/>
<rect x="454" y="196" width="682" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="454" y="196" width="6" height="70" rx="3" fill="#3d6b6b"/>
<text x="480" y="238" font-size="14.5" fill="#291c0e">Reorient away from direct liquid contact, or use an elevated standoff design.</text>

<!-- row 3 -->
<rect x="64" y="282" width="330" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="82" y="310" font-size="15" font-weight="800" fill="#2c5454">Orientation mismatch</text>
<text x="82" y="332" font-size="12.5" fill="#5c7a7a">polarization null zone</text>
<line x1="404" y1="317" x2="428" y2="317" stroke="#3d6b6b" stroke-width="3"/><polygon points="428,310 444,317 428,324" fill="#3d6b6b"/>
<rect x="454" y="282" width="682" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="454" y="282" width="6" height="70" rx="3" fill="#3d6b6b"/>
<text x="480" y="324" font-size="14.5" fill="#291c0e">Align tag and reader polarization, or switch to a circular-polarized antenna.</text>

<!-- row 4 -->
<rect x="64" y="368" width="330" height="70" rx="12" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.6"/>
<text x="82" y="396" font-size="15" font-weight="800" fill="#6d5a3a">Reader power set low</text>
<text x="82" y="418" font-size="12.5" fill="#8a7550">shipped below the limit</text>
<line x1="404" y1="403" x2="428" y2="403" stroke="#c39a5f" stroke-width="3"/><polygon points="428,396 444,403 428,410" fill="#c39a5f"/>
<rect x="454" y="368" width="682" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="454" y="368" width="6" height="70" rx="3" fill="#c39a5f"/>
<text x="480" y="410" font-size="14.5" fill="#291c0e">Raise transmit power to the maximum your regional regulation allows.</text>

<!-- row 5 -->
<rect x="64" y="454" width="330" height="70" rx="12" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.6"/>
<text x="82" y="482" font-size="15" font-weight="800" fill="#6d5a3a">Antenna cable loss</text>
<text x="82" y="504" font-size="12.5" fill="#8a7550">every metre attenuates</text>
<line x1="404" y1="489" x2="428" y2="489" stroke="#c39a5f" stroke-width="3"/><polygon points="428,482 444,489 428,496" fill="#c39a5f"/>
<rect x="454" y="454" width="682" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="454" y="454" width="6" height="70" rx="3" fill="#c39a5f"/>
<text x="480" y="496" font-size="14.5" fill="#291c0e">Shorter runs, lower-loss cable, or mount the reader closer to the antenna.</text>

<text x="600" y="566" text-anchor="middle" font-size="14" fill="#4f4f4f">Metal is the usual culprit — and the one with the cleanest purpose-built fix.</text>
</svg>
