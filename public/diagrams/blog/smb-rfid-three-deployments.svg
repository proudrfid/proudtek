<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Three real small-business RFID budgets, side by side</title>
<desc id="d">Three deployment profiles with real figures: a boutique apparel retailer of one to three stores spends $15K-25K in year one with $5K-10K recurring and 9-15 month payback; a small distribution warehouse of 10K-50K square feet spends $50K-150K with $10K-25K recurring and 12-24 month payback; a small manufacturer tracking assets and WIP spends $20K-40K with $5K-12K recurring and 10-18 month payback.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT REAL MONEY BUYS AT REAL SCALE</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Three deployments, three budgets, three paybacks</text>

<rect x="52" y="136" width="356" height="440" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="230" y="174" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">Boutique apparel retailer</text>
<text x="230" y="198" text-anchor="middle" font-size="12.5" fill="#4f4f4f">1–3 stores · 2,000–8,000 SKUs</text>
<text x="230" y="266" text-anchor="middle" font-size="30" font-weight="800" fill="#291c0e">$15K–25K</text>
<text x="230" y="292" text-anchor="middle" font-size="13" fill="#4f4f4f">Year 1, all-in</text>
<rect x="92" y="320" width="276" height="2" fill="#cfe0e0"/>
<text x="112" y="352" font-size="12.5" fill="#4f4f4f">2× handheld readers · $7,600</text>
<text x="112" y="376" font-size="12.5" fill="#4f4f4f">50K tags/yr · $3K–5K</text>
<text x="112" y="400" font-size="12.5" fill="#4f4f4f">cloud SaaS · $2K–5K/yr</text>
<text x="112" y="424" font-size="12.5" fill="#4f4f4f">setup &amp; integration · $3K–8K</text>
<text x="112" y="456" font-size="12.5" fill="#4f4f4f">recurring: $5K–10K/yr</text>
<rect x="112" y="486" width="236" height="42" rx="21" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="230" y="513" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1b4332">payback 9–15 months</text>
<text x="230" y="556" text-anchor="middle" font-size="12" fill="#5c5c5c">accuracy 60–70% → 95%+ · counts 6 h → 30 min</text>

<rect x="422" y="136" width="356" height="440" rx="14" fill="#eef1f5" stroke="#4a5568" stroke-width="1.5"/>
<text x="600" y="174" text-anchor="middle" font-size="16" font-weight="800" fill="#4a5568">Small distribution warehouse</text>
<text x="600" y="198" text-anchor="middle" font-size="12.5" fill="#4f4f4f">10K–50K sq ft · 5–15K SKUs</text>
<text x="600" y="266" text-anchor="middle" font-size="30" font-weight="800" fill="#291c0e">$50K–150K</text>
<text x="600" y="292" text-anchor="middle" font-size="13" fill="#4f4f4f">Year 1, all-in</text>
<rect x="462" y="320" width="276" height="2" fill="#d3dae3"/>
<text x="482" y="352" font-size="12.5" fill="#4f4f4f">4–8 fixed readers + 8–16 antennas</text>
<text x="482" y="376" font-size="12.5" fill="#4f4f4f">middleware · $5K–15K</text>
<text x="482" y="400" font-size="12.5" fill="#4f4f4f">ERP integration · $10K–30K</text>
<text x="482" y="424" font-size="12.5" fill="#4f4f4f">tags 100K cases · $8K–15K/yr</text>
<text x="482" y="456" font-size="12.5" fill="#4f4f4f">recurring: $10K–25K/yr</text>
<rect x="482" y="486" width="236" height="42" rx="21" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="600" y="513" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1b4332">payback 12–24 months</text>
<text x="600" y="556" text-anchor="middle" font-size="12" fill="#5c5c5c">receiving labour + pick accuracy</text>

<rect x="792" y="136" width="356" height="440" rx="14" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="970" y="174" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">Small manufacturer</text>
<text x="970" y="198" text-anchor="middle" font-size="12.5" fill="#4f4f4f">50–300 employees · assets + WIP</text>
<text x="970" y="266" text-anchor="middle" font-size="30" font-weight="800" fill="#291c0e">$20K–40K</text>
<text x="970" y="292" text-anchor="middle" font-size="13" fill="#4f4f4f">Year 1, all-in</text>
<rect x="832" y="320" width="276" height="2" fill="#e4c98f"/>
<text x="852" y="352" font-size="12.5" fill="#4f4f4f">1,000 on-metal tags · $1.5K–3.5K</text>
<text x="852" y="376" font-size="12.5" fill="#4f4f4f">2 handhelds $5K + conveyor reader $2,500</text>
<text x="852" y="400" font-size="12.5" fill="#4f4f4f">asset software · $3K–8K/yr</text>
<text x="852" y="424" font-size="12.5" fill="#4f4f4f">tool loss cut 15–30% of replacement</text>
<text x="852" y="456" font-size="12.5" fill="#4f4f4f">recurring: $5K–12K/yr</text>
<rect x="852" y="486" width="236" height="42" rx="21" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="970" y="513" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1b4332">payback 10–18 months</text>
<text x="970" y="556" text-anchor="middle" font-size="12" fill="#5c5c5c">tool loss + WIP visibility</text>

<text x="600" y="628" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Start even smaller: one zone, one process, one month — 500–2,000 tags + a desktop reader proves the case for any of these.</text>
</svg>
