<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="bmTitle bmDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="bmTitle">This 3PL's 99.2% accuracy next to published RFID benchmarks</title>
  <desc id="bmDesc">A horizontal bar chart comparing receiving and inventory accuracy across datasets, on an axis that starts at 86%. Auburn RFID Lab EPC/RFID receiving audits ran above 99.99% (legacy UPC flagged 69% of orders as inaccurate). rfidtaghy engineered UHF systems report 99.7 to 99.95%. Southern Fried Cotton carton-unit accuracy was 99.5%. This 3PL reached a 99.4% peak weekly and a 99.2% sustained accuracy at month 12. The legacy barcode ceiling sits near 87%.</desc>
  <defs>
    <radialGradient id="bmBg" cx="50%" cy="18%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bmBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="1.5" fill="#6d5a3a">OUR 99.2% vs THE PUBLISHED RECORD</text>
  <text x="600" y="84" text-anchor="middle" font-size="14.5" fill="#6d5a3a">Receiving / inventory accuracy — where our number sits among the public datasets</text>

  <!-- gridlines + top axis labels -->
  <g stroke="#efe6d5" stroke-width="1">
    <line x1="468.6" y1="104" x2="468.6" y2="476"/>
    <line x1="577.1" y1="104" x2="577.1" y2="476"/>
    <line x1="685.7" y1="104" x2="685.7" y2="476"/>
    <line x1="794.3" y1="104" x2="794.3" y2="476"/>
    <line x1="902.9" y1="104" x2="902.9" y2="476"/>
    <line x1="1011.4" y1="104" x2="1011.4" y2="476"/>
    <line x1="1120" y1="104" x2="1120" y2="476"/>
  </g>
  <g font-size="12" fill="#a8946c" text-anchor="middle">
    <text x="468.6" y="470">88</text>
    <text x="577.1" y="470">90</text>
    <text x="685.7" y="470">92</text>
    <text x="794.3" y="470">94</text>
    <text x="902.9" y="470">96</text>
    <text x="1011.4" y="470">98</text>
    <text x="1120" y="470">100%</text>
  </g>
  <line x1="360" y1="104" x2="360" y2="476" stroke="#d9cbb0" stroke-width="1.5"/>
  <text x="360" y="494" text-anchor="start" font-size="12" font-style="italic" fill="#a8946c">◤ scale starts at 86%</text>

  <!-- Row 1: Auburn -->
  <text x="340" y="152" text-anchor="end" font-size="15.5" font-weight="700" fill="#291c0e">Auburn RFID Lab</text>
  <text x="340" y="170" text-anchor="end" font-size="12.5" fill="#6d5a3a">EPC/RFID receiving audit</text>
  <rect x="360" y="141" width="759.5" height="30" rx="6" fill="#b98a45"/>
  <text x="1108" y="162" text-anchor="end" font-size="14.5" font-weight="800" fill="#ffffff">&gt;99.99%</text>

  <!-- Row 2: rfidtaghy -->
  <text x="340" y="212" text-anchor="end" font-size="15.5" font-weight="700" fill="#291c0e">rfidtaghy 2026</text>
  <text x="340" y="230" text-anchor="end" font-size="12.5" fill="#6d5a3a">engineered UHF systems</text>
  <rect x="360" y="201" width="743.7" height="30" rx="6" fill="#c39a5f"/>
  <rect x="1103.7" y="201" width="13.6" height="30" fill="#e4c98f"/>
  <text x="1092" y="222" text-anchor="end" font-size="14" font-weight="800" fill="#ffffff">99.7–99.95%</text>

  <!-- Row 3: Southern Fried Cotton -->
  <text x="340" y="272" text-anchor="end" font-size="15.5" font-weight="700" fill="#291c0e">Southern Fried Cotton</text>
  <text x="340" y="290" text-anchor="end" font-size="12.5" fill="#6d5a3a">apparel item-level rollout</text>
  <rect x="360" y="261" width="732.9" height="30" rx="6" fill="#c39a5f"/>
  <text x="1082" y="282" text-anchor="end" font-size="14.5" font-weight="800" fill="#ffffff">99.5%</text>

  <!-- Row 4: ours peak -->
  <text x="340" y="332" text-anchor="end" font-size="15.5" font-weight="800" fill="#177a92">This 3PL — peak weekly</text>
  <text x="340" y="350" text-anchor="end" font-size="12.5" fill="#6d5a3a">best cycle-count week</text>
  <rect x="360" y="321" width="727.4" height="30" rx="6" fill="#6fd9f4"/>
  <text x="1077" y="342" text-anchor="end" font-size="14.5" font-weight="800" fill="#0d3f4d">99.4%</text>

  <!-- Row 5: ours sustained (primary) -->
  <text x="340" y="392" text-anchor="end" font-size="15.5" font-weight="800" fill="#177a92">This 3PL — sustained</text>
  <text x="340" y="410" text-anchor="end" font-size="12.5" fill="#6d5a3a">month-12 verified</text>
  <rect x="360" y="381" width="716.6" height="30" rx="6" fill="#1fcefb" stroke="#0f8fb0" stroke-width="1.5"/>
  <text x="1066" y="402" text-anchor="end" font-size="14.5" font-weight="800" fill="#0d3f4d">99.2%</text>

  <!-- Row 6: barcode -->
  <text x="340" y="452" text-anchor="end" font-size="15.5" font-weight="700" fill="#8a7550">Legacy barcode ceiling</text>
  <text x="340" y="470" text-anchor="end" font-size="12.5" fill="#a8946c">hand-scan, at scale</text>
  <rect x="360" y="441" width="54.3" height="30" rx="6" fill="#e0cfa8"/>
  <text x="426" y="462" text-anchor="start" font-size="14.5" font-weight="800" fill="#8a7550">≈87%</text>

  <!-- Footer notes card -->
  <rect x="56" y="512" width="1088" height="122" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="84" y="546" font-size="15" fill="#291c0e">We land just below the lab ceilings — a 3PL cross-dock receives untagged customer returns. A structural limit, not a deployment defect.</text>
  <text x="84" y="574" font-size="15" fill="#291c0e">On chargebacks we cut 92% ($142K → $11K) vs Southern Fried Cotton's 98% — the residual gap was PO paperwork, not inventory accuracy.</text>
  <text x="84" y="612" font-size="13" fill="#6d5a3a">Sources: Auburn RFID Lab Project Zipper · Southern Fried Cotton · rfidtaghy 2026 · CPCON 2026 enterprise ROI worksheet.</text>
</svg>
