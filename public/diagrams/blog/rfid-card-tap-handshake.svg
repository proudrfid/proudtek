<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The tap handshake: five steps in 50-200 milliseconds</title>
<desc id="d">A five-node flow along a track. Step one, in gold: the reader energises — its field is always broadcasting. Step two, in teal: the card wakes, power arriving by induction. Step three, gold: the reader asks — identify, authenticate, read. Step four, teal: the card replies by load modulation. Step five, green: done — the chip sleeps with its data safe in non-volatile memory. A bracket underneath spans all five steps and reads: about 50 to 200 milliseconds, start to finish.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<marker id="arw" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#5c5c5c"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE TAP, IN GLORIOUS SLOW MOTION</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Five steps, then straight back to sleep</text>

<rect x="455" y="140" width="18" height="18" rx="5" fill="#c39a5f"/>
<text x="481" y="154" font-size="13.5" fill="#4f4f4f">reader's move</text>
<rect x="640" y="140" width="18" height="18" rx="5" fill="#3d6b6b"/>
<text x="666" y="154" font-size="13.5" fill="#4f4f4f">card's move</text>

<line x1="228" y1="300" x2="327" y2="300" stroke="#5c5c5c" stroke-width="2.5" marker-end="url(#arw)"/>
<line x1="443" y1="300" x2="542" y2="300" stroke="#5c5c5c" stroke-width="2.5" marker-end="url(#arw)"/>
<line x1="658" y1="300" x2="757" y2="300" stroke="#5c5c5c" stroke-width="2.5" marker-end="url(#arw)"/>
<line x1="873" y1="300" x2="972" y2="300" stroke="#5c5c5c" stroke-width="2.5" marker-end="url(#arw)"/>

<circle cx="170" cy="300" r="46" fill="#c39a5f"/>
<circle cx="385" cy="300" r="46" fill="#3d6b6b"/>
<circle cx="600" cy="300" r="46" fill="#c39a5f"/>
<circle cx="815" cy="300" r="46" fill="#3d6b6b"/>
<circle cx="1030" cy="300" r="46" fill="#2d6a4f"/>
<text x="170" y="312" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#ffffff">1</text>
<text x="385" y="312" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#ffffff">2</text>
<text x="600" y="312" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#ffffff">3</text>
<text x="815" y="312" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#ffffff">4</text>
<text x="1030" y="312" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#ffffff">5</text>

<text x="170" y="382" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Reader energises</text>
<text x="170" y="406" text-anchor="middle" font-size="13" fill="#4f4f4f">always broadcasting</text>
<text x="385" y="382" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Card wakes</text>
<text x="385" y="406" text-anchor="middle" font-size="13" fill="#4f4f4f">power by induction</text>
<text x="600" y="382" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Reader asks</text>
<text x="600" y="406" text-anchor="middle" font-size="13" fill="#4f4f4f">identify · authenticate</text>
<text x="815" y="382" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Card replies</text>
<text x="815" y="406" text-anchor="middle" font-size="13" fill="#4f4f4f">by load modulation</text>
<text x="1030" y="382" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Done — chip sleeps</text>
<text x="1030" y="406" text-anchor="middle" font-size="13" fill="#4f4f4f">data safe in memory</text>

<path d="M 170 470 v 12 h 860 v -12" fill="none" stroke="#4f4f4f" stroke-width="1.5"/>
<text x="600" y="514" text-anchor="middle" font-size="15" font-weight="600" fill="#291c0e">≈ 50-200 milliseconds, start to finish</text>

<text x="600" y="576" text-anchor="middle" font-size="13.5" fill="#5c5c5c">By step 5 the card is already asleep again — your brain hasn't yet registered that anything happened.</text>
<text x="600" y="602" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The card never transmits: it flexes its power draw, and the reader feels the tugs.</text>
</svg>
