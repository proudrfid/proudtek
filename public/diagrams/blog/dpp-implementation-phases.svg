<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A four-phase DPP implementation roadmap for B2B manufacturers</title>
<desc id="d">Four phases along a timeline arrow. Phase 1, now: audit product data and find the gaps in material, origin, footprint and recyclability. Phase 2, six to twelve months before the mandate: select NFC hardware, establish GS1 Digital Link identifiers and stand up the cloud DPP repository. Phase 3, three to six months before: integrate tag encoding on the production line, pilot one product category and validate the tap experience. Phase 4, go-live: scale to all mandated categories, train supply-chain partners and maintain the data.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DPP IMPLEMENTATION ROADMAP</text>
<text x="600" y="104" text-anchor="middle" font-size="32" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">Four phases that keep it a budget line, not a fire drill</text>

<line x1="90" y1="250" x2="1116" y2="250" stroke="#b9a68e" stroke-width="3"/>
<polygon points="1116,242 1132,250 1116,258" fill="#b9a68e"/>
<line x1="195" y1="250" x2="195" y2="300" stroke="#dfd3bf" stroke-width="2"/>
<line x1="465" y1="250" x2="465" y2="300" stroke="#dfd3bf" stroke-width="2"/>
<line x1="735" y1="250" x2="735" y2="300" stroke="#dfd3bf" stroke-width="2"/>
<line x1="1005" y1="250" x2="1005" y2="300" stroke="#dfd3bf" stroke-width="2"/>
<circle cx="195" cy="250" r="13" fill="#3d6b6b"/><text x="195" y="256" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<circle cx="465" cy="250" r="13" fill="#3d6b6b"/><text x="465" y="256" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<circle cx="735" cy="250" r="13" fill="#2d6a4f"/><text x="735" y="256" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<circle cx="1005" cy="250" r="13" fill="#1f6f3a"/><text x="1005" y="256" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>

<rect x="72" y="300" width="246" height="212" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="195" y="330" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PHASE 1</text>
<rect x="120" y="342" width="150" height="26" rx="13" fill="#eef5f5"/><text x="195" y="360" text-anchor="middle" font-size="13" fill="#2c5454">Now</text>
<text x="195" y="396" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Audit product data</text>
<text x="195" y="426" text-anchor="middle" font-size="13" fill="#4f4f4f">Find gaps in material,</text>
<text x="195" y="446" text-anchor="middle" font-size="13" fill="#4f4f4f">origin, footprint and</text>
<text x="195" y="466" text-anchor="middle" font-size="13" fill="#4f4f4f">recyclability data</text>

<rect x="342" y="300" width="246" height="212" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="465" y="330" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PHASE 2</text>
<rect x="378" y="342" width="174" height="26" rx="13" fill="#eef5f5"/><text x="465" y="360" text-anchor="middle" font-size="13" fill="#2c5454">6–12 months before</text>
<text x="465" y="396" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Select tags &amp; backend</text>
<text x="465" y="426" text-anchor="middle" font-size="13" fill="#4f4f4f">NFC hardware, GS1</text>
<text x="465" y="446" text-anchor="middle" font-size="13" fill="#4f4f4f">Digital Link IDs, cloud</text>
<text x="465" y="466" text-anchor="middle" font-size="13" fill="#4f4f4f">DPP repository</text>

<rect x="612" y="300" width="246" height="212" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="735" y="330" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PHASE 3</text>
<rect x="648" y="342" width="174" height="26" rx="13" fill="#edf3ee"/><text x="735" y="360" text-anchor="middle" font-size="13" fill="#2d6a4f">3–6 months before</text>
<text x="735" y="396" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Integrate &amp; pilot</text>
<text x="735" y="426" text-anchor="middle" font-size="13" fill="#4f4f4f">Encode on the line,</text>
<text x="735" y="446" text-anchor="middle" font-size="13" fill="#4f4f4f">pilot one category,</text>
<text x="735" y="466" text-anchor="middle" font-size="13" fill="#4f4f4f">validate the tap</text>

<rect x="882" y="300" width="246" height="212" rx="14" fill="#ffffff" stroke="#cfe0d6" stroke-width="1.8"/>
<text x="1005" y="330" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2d6a4f">PHASE 4</text>
<rect x="948" y="342" width="114" height="26" rx="13" fill="#e6f2ea"/><text x="1005" y="360" text-anchor="middle" font-size="13" fill="#1f6f3a">Go-live</text>
<text x="1005" y="396" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Scale &amp; sustain</text>
<text x="1005" y="426" text-anchor="middle" font-size="13" fill="#4f4f4f">All mandated categories,</text>
<text x="1005" y="446" text-anchor="middle" font-size="13" fill="#4f4f4f">train partners, keep</text>
<text x="1005" y="466" text-anchor="middle" font-size="13" fill="#4f4f4f">the data maintained</text>

<text x="600" y="560" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Start before the delegated act is final — early costs less and panics no one.</text>
</svg>
