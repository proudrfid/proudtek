<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Four RFID reader settings that silently prevent tag detection, each with its wrong and right value</title>
<desc id="d">A four-row table. Each row names a reader configuration setting, the symptom it produces when set wrong shown in red, and the correct value shown in green. Row one, frequency region: set wrong it transmits on the wrong band or not at all; set right it matches FCC for the US or ETSI for the EU. Row two, air-interface protocol: set wrong the reader and tags speak different languages; set right it is Gen2 for UHF or ISO 14443 and ISO 15693 for HF. Row three, transmit power: set wrong it drops to minimum after a firmware reset; set right it is raised to the region maximum and retested. Row four, session or target: set wrong tags are inventoried incorrectly or not at all; set right the session is matched to the tag population size.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FOUR SETTINGS THAT FAIL SILENTLY</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Nothing's broken — it's configured wrong</text>
<text x="600" y="133" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Each of these returns zero reads with no error message to point at.</text>

<!-- column headers -->
<text x="88" y="172" font-size="13" font-weight="800" letter-spacing="0.5" fill="#5c5c5c">SETTING</text>
<text x="503" y="172" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">SET WRONG</text>
<text x="924" y="172" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">SET RIGHT</text>

<!-- Row 1 -->
<text x="88" y="222" font-size="16" font-weight="700" fill="#291c0e">Frequency region</text>
<text x="88" y="244" font-size="12.5" fill="#6d5a3a">FCC · ETSI</text>
<rect x="312" y="184" width="382" height="76" rx="12" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.5"/>
<circle cx="336" cy="222" r="9" fill="#8b2d2d"/><line x1="331" y1="217" x2="341" y2="227" stroke="#fff" stroke-width="2.2"/><line x1="341" y1="217" x2="331" y2="227" stroke="#fff" stroke-width="2.2"/>
<text x="356" y="227" font-size="13.5" fill="#291c0e">Wrong band, or no transmit at all</text>
<line x1="700" y1="222" x2="706" y2="222" stroke="#8a94a3" stroke-width="2.4"/><polygon points="706,217 714,222 706,227" fill="#8a94a3"/>
<rect x="712" y="184" width="424" height="76" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<circle cx="736" cy="222" r="9" fill="#1f6f3a"/><polyline points="731,222 735,226 742,216" fill="none" stroke="#fff" stroke-width="2.4"/>
<text x="756" y="227" font-size="13.5" fill="#234a4a">Match FCC (US) / ETSI (EU)</text>

<!-- Row 2 -->
<text x="88" y="310" font-size="16" font-weight="700" fill="#291c0e">Air-interface protocol</text>
<text x="88" y="332" font-size="12.5" fill="#6d5a3a">Gen2 · ISO 14443 · ISO 15693</text>
<rect x="312" y="272" width="382" height="76" rx="12" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.5"/>
<circle cx="336" cy="310" r="9" fill="#8b2d2d"/><line x1="331" y1="305" x2="341" y2="315" stroke="#fff" stroke-width="2.2"/><line x1="341" y1="305" x2="331" y2="315" stroke="#fff" stroke-width="2.2"/>
<text x="356" y="315" font-size="13.5" fill="#291c0e">Reader and tags speak different languages</text>
<line x1="700" y1="310" x2="706" y2="310" stroke="#8a94a3" stroke-width="2.4"/><polygon points="706,305 714,310 706,315" fill="#8a94a3"/>
<rect x="712" y="272" width="424" height="76" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<circle cx="736" cy="310" r="9" fill="#1f6f3a"/><polyline points="731,310 735,314 742,304" fill="none" stroke="#fff" stroke-width="2.4"/>
<text x="756" y="315" font-size="13.5" fill="#234a4a">Gen2 for UHF · ISO 14443 / 15693 for HF</text>

<!-- Row 3 -->
<text x="88" y="398" font-size="16" font-weight="700" fill="#291c0e">Transmit power</text>
<text x="88" y="420" font-size="12.5" fill="#6d5a3a">output level</text>
<rect x="312" y="360" width="382" height="76" rx="12" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.5"/>
<circle cx="336" cy="398" r="9" fill="#8b2d2d"/><line x1="331" y1="393" x2="341" y2="403" stroke="#fff" stroke-width="2.2"/><line x1="341" y1="393" x2="331" y2="403" stroke="#fff" stroke-width="2.2"/>
<text x="356" y="403" font-size="13.5" fill="#291c0e">Drops to minimum after a firmware reset</text>
<line x1="700" y1="398" x2="706" y2="398" stroke="#8a94a3" stroke-width="2.4"/><polygon points="706,393 714,398 706,403" fill="#8a94a3"/>
<rect x="712" y="360" width="424" height="76" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<circle cx="736" cy="398" r="9" fill="#1f6f3a"/><polyline points="731,398 735,402 742,392" fill="none" stroke="#fff" stroke-width="2.4"/>
<text x="756" y="403" font-size="13.5" fill="#234a4a">Raise to the region's max, then retest</text>

<!-- Row 4 -->
<text x="88" y="486" font-size="16" font-weight="700" fill="#291c0e">Session / target</text>
<text x="88" y="508" font-size="12.5" fill="#6d5a3a">UHF inventory</text>
<rect x="312" y="448" width="382" height="76" rx="12" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.5"/>
<circle cx="336" cy="486" r="9" fill="#8b2d2d"/><line x1="331" y1="481" x2="341" y2="491" stroke="#fff" stroke-width="2.2"/><line x1="341" y1="481" x2="331" y2="491" stroke="#fff" stroke-width="2.2"/>
<text x="356" y="491" font-size="13.5" fill="#291c0e">Tags inventoried wrong, or not at all</text>
<line x1="700" y1="486" x2="706" y2="486" stroke="#8a94a3" stroke-width="2.4"/><polygon points="706,481 714,486 706,491" fill="#8a94a3"/>
<rect x="712" y="448" width="424" height="76" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<circle cx="736" cy="486" r="9" fill="#1f6f3a"/><polyline points="731,486 735,490 742,480" fill="none" stroke="#fff" stroke-width="2.4"/>
<text x="756" y="491" font-size="13.5" fill="#234a4a">Match session to tag population size</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#5c5c5c">A reader does exactly what its settings tell it to. That is the whole problem.</text>
</svg>
