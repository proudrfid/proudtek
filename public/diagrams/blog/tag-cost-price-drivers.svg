<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five drivers of RFID tag pricing, ranked</title>
<desc id="d">Two-part diagram. On the left, the five price drivers are ranked: order volume (the single biggest driver — moving from 1,000 to 100,000-plus pieces re-prices the same tag), chip selection, form factor and materials, customization, and encoding and programming (complex encoding adds $0.01-0.05 per tag). On the right, a stacked column titled anatomy of a unit price shows where the money sits inside one tag: the chip is the largest single slice, followed by antenna and substrate, printing and encoding, and converter margin. A footnote admits the proportions are illustrative but the ranking is not.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT ACTUALLY MOVES THE NUMBER</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Five dials on every quote — volume is the loudest</text>

<!-- ranked drivers -->
<circle cx="92" cy="203" r="16" fill="#291c0e"/>
<text x="92" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#d4a755">1</text>
<text x="124" y="198" font-size="16.5" font-weight="700" fill="#291c0e">Order volume</text>
<text x="124" y="220" font-size="13.5" fill="#4f4f4f">the single biggest driver — 1,000 → 100,000+ pieces re-prices the same tag</text>
<line x1="64" y1="242" x2="690" y2="242" stroke="#f0e9da" stroke-width="1"/>

<circle cx="92" cy="281" r="16" fill="#291c0e"/>
<text x="92" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#d4a755">2</text>
<text x="124" y="276" font-size="16.5" font-weight="700" fill="#291c0e">Chip selection</text>
<text x="124" y="298" font-size="13.5" fill="#4f4f4f">NTAG213 and Monza R6 money vs. NTAG 424 DNA and DESFire EV3 money</text>
<line x1="64" y1="320" x2="690" y2="320" stroke="#f0e9da" stroke-width="1"/>

<circle cx="92" cy="359" r="16" fill="#291c0e"/>
<text x="92" y="364" text-anchor="middle" font-size="15" font-weight="700" fill="#d4a755">3</text>
<text x="124" y="354" font-size="16.5" font-weight="700" fill="#291c0e">Form factor &amp; materials</text>
<text x="124" y="376" font-size="13.5" fill="#4f4f4f">paper &lt; PVC &lt; silicone &lt; metal-encapsulated — complexity is a surcharge</text>
<line x1="64" y1="398" x2="690" y2="398" stroke="#f0e9da" stroke-width="1"/>

<circle cx="92" cy="437" r="16" fill="#291c0e"/>
<text x="92" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#d4a755">4</text>
<text x="124" y="432" font-size="16.5" font-weight="700" fill="#291c0e">Customization</text>
<text x="124" y="454" font-size="13.5" fill="#4f4f4f">printing, die-cut shapes, adhesives, coatings — each one nudges the unit price</text>
<line x1="64" y1="476" x2="690" y2="476" stroke="#f0e9da" stroke-width="1"/>

<circle cx="92" cy="515" r="16" fill="#291c0e"/>
<text x="92" y="520" text-anchor="middle" font-size="15" font-weight="700" fill="#d4a755">5</text>
<text x="124" y="510" font-size="16.5" font-weight="700" fill="#291c0e">Encoding &amp; programming</text>
<text x="124" y="532" font-size="13.5" fill="#4f4f4f">blanks are cheapest; complex encoding adds $0.01–0.05 per tag</text>

<!-- anatomy stack -->
<text x="948" y="176" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#6d5a3a">ANATOMY OF A UNIT PRICE</text>
<rect x="800" y="230" width="150" height="160" fill="#3d6b6b"/>
<rect x="800" y="390" width="150" height="60" fill="#7fa3a3"/>
<rect x="800" y="450" width="150" height="55" fill="#d4a755"/>
<rect x="800" y="505" width="150" height="55" fill="#d8d0c0"/>
<line x1="952" y1="310" x2="964" y2="310" stroke="#d9cfbc" stroke-width="1.5"/>
<text x="970" y="306" font-size="14.5" font-weight="600" fill="#291c0e">The chip</text>
<text x="970" y="326" font-size="12.5" fill="#4f4f4f">largest single slice of tag cost</text>
<line x1="952" y1="420" x2="964" y2="420" stroke="#d9cfbc" stroke-width="1.5"/>
<text x="970" y="425" font-size="14" fill="#4f4f4f">antenna + substrate</text>
<line x1="952" y1="477" x2="964" y2="477" stroke="#d9cfbc" stroke-width="1.5"/>
<text x="970" y="482" font-size="14" fill="#4f4f4f">printing &amp; encoding</text>
<line x1="952" y1="532" x2="964" y2="532" stroke="#d9cfbc" stroke-width="1.5"/>
<text x="970" y="537" font-size="14" fill="#4f4f4f">converter margin</text>
<text x="948" y="600" text-anchor="middle" font-size="12.5" fill="#5c5c5c">proportions illustrative — the ranking isn't</text>
</svg>
