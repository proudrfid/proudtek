<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">2026 duty math for the four HS codes that cover most RFID products</title>
<desc id="d">A duty comparison across four HS codes. 8542.31 RFID chips: 0 percent in both US and EU. 8523.52 smart cards: US 0 percent most-favoured-nation plus a 25 percent Section 301 List 3 surcharge on China origin, equals 25 percent; EU 0 percent; Mexico and Vietnam origin 0 percent. 8543.70 readers and encoders: US 2.6 percent plus 25 percent Section 301 equals 27.6 percent; EU 3.7 percent. 4911.99 paper-substrate labels: 0 percent in US and EU. Section 301 is the surcharge that applies only to China origin.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HS CODES · 2026 DUTY MATH</text>
<text x="600" y="99" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">Classification decides your margin</text>
<text x="600" y="131" text-anchor="middle" font-size="16" fill="#4f4f4f">Four HS codes cover 95% of RFID products — and Section 301 can add 25% on China origin.</text>
<rect x="76" y="182" width="1048" height="44" rx="8" fill="#4a5568"/>
