<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Published ROI benchmarks for hospital RFID and RTLS deployments</title>
<desc id="d">Four benchmark cards. Equipment search time falls 40 to 70 percent, recovering roughly 20 to 30 minutes per nurse per shift. Rental equipment cost falls 15 to 25 percent with real-time visibility. Patient-identification errors fall 30 to 50 percent versus manual barcode workflows. ROI payback runs 12 to 24 months for asset tracking and 18 to 36 months for full RTLS.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ROI BENCHMARKS · WHAT THE NUMBERS RETURN</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Published multi-site figures — the case a healthcare CFO wants before signing the capex.</text>

<!-- card 1 -->
<rect x="65" y="176" width="248" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="65" y="176" width="248" height="8" rx="4" fill="#3d6b6b"/>
<text x="189" y="224" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">Search time reduced</text>
<text x="189" y="322" text-anchor="middle" font-size="40" font-weight="800" fill="#2c5454">40–70%</text>
<text x="189" y="358" text-anchor="middle" font-size="12.5" fill="#5c5c5c">≈20–30 min/nurse/shift back</text>
<rect x="105" y="408" width="168" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="189" y="430" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">less asset hunting</text>

<!-- card 2 -->
<rect x="339" y="176" width="248" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="339" y="176" width="248" height="8" rx="4" fill="#3d6b6b"/>
<text x="463" y="224" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">Rental cost reduced</text>
<text x="463" y="322" text-anchor="middle" font-size="40" font-weight="800" fill="#2c5454">15–25%</text>
<text x="463" y="358" text-anchor="middle" font-size="12.5" fill="#5c5c5c">with real-time visibility</text>
<rect x="379" y="408" width="168" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="463" y="430" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">own before you rent</text>

<!-- card 3 -->
<rect x="613" y="176" width="248" height="300" rx="14" fill="#ffffff" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="613" y="176" width="248" height="8" rx="4" fill="#c39a5f"/>
<text x="737" y="224" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">ID errors reduced</text>
<text x="737" y="322" text-anchor="middle" font-size="40" font-weight="800" fill="#2c5454">30–50%</text>
<text x="737" y="358" text-anchor="middle" font-size="12.5" fill="#5c5c5c">vs manual barcode workflows</text>
<rect x="653" y="408" width="168" height="34" rx="17" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.2"/>
<text x="737" y="430" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">fewer misreads</text>

<!-- card 4 -->
<rect x="887" y="176" width="248" height="300" rx="14" fill="#ffffff" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="887" y="176" width="248" height="8" rx="4" fill="#c39a5f"/>
<text x="1011" y="224" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">ROI payback</text>
<text x="1011" y="322" text-anchor="middle" font-size="38" font-weight="800" fill="#2c5454">12–24 mo</text>
<text x="1011" y="358" text-anchor="middle" font-size="12.5" fill="#5c5c5c">for asset tracking</text>
<rect x="927" y="408" width="168" height="34" rx="17" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.2"/>
<text x="1011" y="430" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">18–36 mo full RTLS</text>

<text x="600" y="524" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Reductions vary by facility and use case — these are the ranges published deployments report.</text>
</svg>
