<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Bedside verification: where a printed barcode band fails and an RFID wristband reads</title>
<desc id="d">Two columns. A printed barcode band needs a line-of-sight scan, fails when wet, wrinkled or tucked under a blanket, and must be aimed manually at every touchpoint, which produces scan failures and repeat attempts. An RFID wristband reads through fabric and blankets, reads at 5 to 30 cm with HF readers and 1 to 5 m with UHF readers, and verifies hands-free, which produces faster and more reliable verification.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BEDSIDE VERIFICATION · BARCODE vs RFID</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Same patient, same band — the difference is how reliably it reads.</text>

<!-- LEFT · printed barcode -->
<rect x="88" y="116" width="480" height="442" rx="14" fill="#f4f1ea" stroke="#ddd5c6" stroke-width="1.8"/>
<rect x="88" y="116" width="480" height="8" rx="4" fill="#4a5568"/>
<text x="328" y="156" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#3a4457">PRINTED BARCODE</text>
<text x="328" y="178" text-anchor="middle" font-size="12.5" fill="#5c5c5c">line-of-sight, one at a time</text>
<circle cx="128" cy="232" r="15" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.5"/>
<line x1="121" y1="225" x2="135" y2="239" stroke="#8b2d2d" stroke-width="3.2" stroke-linecap="round"/><line x1="121" y1="239" x2="135" y2="225" stroke="#8b2d2d" stroke-width="3.2" stroke-linecap="round"/>
<text x="158" y="237" text-anchor="start" font-size="14.5" fill="#291c0e">Needs a line-of-sight scan</text>
<circle cx="128" cy="296" r="15" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.5"/>
<line x1="121" y1="289" x2="135" y2="303" stroke="#8b2d2d" stroke-width="3.2" stroke-linecap="round"/><line x1="121" y1="303" x2="135" y2="289" stroke="#8b2d2d" stroke-width="3.2" stroke-linecap="round"/>
<text x="158" y="301" text-anchor="start" font-size="14.5" fill="#291c0e">Fails wet, wrinkled or under a blanket</text>
<circle cx="128" cy="360" r="15" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.5"/>
<line x1="121" y1="353" x2="135" y2="367" stroke="#8b2d2d" stroke-width="3.2" stroke-linecap="round"/><line x1="121" y1="367" x2="135" y2="353" stroke="#8b2d2d" stroke-width="3.2" stroke-linecap="round"/>
<text x="158" y="365" text-anchor="start" font-size="14.5" fill="#291c0e">Manual aim at every touchpoint</text>
<rect x="116" y="426" width="424" height="44" rx="10" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.3"/>
<text x="328" y="453" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">Scan failures and repeat attempts.</text>

<!-- RIGHT · RFID wristband -->
<rect x="632" y="116" width="480" height="442" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="632" y="116" width="480" height="8" rx="4" fill="#3d6b6b"/>
<text x="872" y="156" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#2c5454">RFID WRISTBAND</text>
<text x="872" y="178" text-anchor="middle" font-size="12.5" fill="#5c5c5c">reads through fabric, hands-free</text>
<circle cx="672" cy="232" r="15" fill="#ffffff" stroke="#a9cccc" stroke-width="1.5"/>
<polyline points="665,232 670,238 680,225" fill="none" stroke="#3d6b6b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="702" y="237" text-anchor="start" font-size="14.5" fill="#291c0e">Reads through fabric and blankets</text>
<circle cx="672" cy="296" r="15" fill="#ffffff" stroke="#a9cccc" stroke-width="1.5"/>
<polyline points="665,296 670,302 680,289" fill="none" stroke="#3d6b6b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="702" y="301" text-anchor="start" font-size="14.5" fill="#291c0e">5–30 cm with HF readers</text>
<circle cx="672" cy="360" r="15" fill="#ffffff" stroke="#a9cccc" stroke-width="1.5"/>
<polyline points="665,360 670,366 680,353" fill="none" stroke="#3d6b6b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="702" y="365" text-anchor="start" font-size="14.5" fill="#291c0e">1–5 m with UHF readers</text>
<rect x="660" y="426" width="424" height="44" rx="10" fill="#ffffff" stroke="#a9cccc" stroke-width="1.3"/>
<text x="872" y="453" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">Faster, more reliable verification.</text>

<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#4f4f4f">RFID does not replace the printed identifiers — it reads when the printed scan cannot.</text>
</svg>
