<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NTAG 424 DNA SUN messaging: a freshly signed URL on every tap</title>
<desc id="d">On the left, an NTAG 424 DNA tag with an antenna coil, a secure element and an AES-128 CMAC badge; Secure Dynamic Messaging rewrites the URL each tap. On the right, three tap results: tap one emits a URL with fresh PICC data and CMAC and verifies with read counter one; tap two emits different PICC data and CMAC and verifies with counter two; a cloned, replayed URL reuses tap one's values and is rejected because the read counter went backwards. A banner explains the backend recomputes the CMAC with Key 2 and rejects any counter that goes backwards.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NTAG 424 DNA · A NEW SIGNED URL ON EVERY TAP</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">SUN messaging: the tag that never repeats itself</text>

<rect x="70" y="160" width="300" height="330" rx="16" fill="#ffffff" stroke="#cfe0e0" stroke-width="2"/>
<rect x="100" y="190" width="240" height="180" rx="14" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="118" y="208" width="204" height="144" rx="11" fill="none" stroke="#6f9494" stroke-width="2"/>
<rect x="136" y="226" width="168" height="108" rx="8" fill="none" stroke="#a3bfbf" stroke-width="1.5"/>
<rect x="198" y="262" width="44" height="36" rx="5" fill="#2c5454"/>
<rect x="210" y="272" width="20" height="16" rx="2" fill="#c39a5f"/>
<rect x="145" y="394" width="150" height="32" rx="16" fill="#2c5454"/>
<text x="220" y="415" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">AES-128 CMAC</text>
<text x="220" y="455" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">NTAG 424 DNA</text>
<text x="220" y="477" text-anchor="middle" font-size="12.5" fill="#4f4f4f">SDM rewrites the URL each tap</text>

<line x1="378" y1="210" x2="410" y2="210" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 410 210 l -11 -6 v 12 z" fill="#3d6b6b"/>
<line x1="378" y1="315" x2="410" y2="315" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 410 315 l -11 -6 v 12 z" fill="#3d6b6b"/>

<rect x="420" y="170" width="710" height="80" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="450" y="203" font-size="15" font-weight="600" fill="#2c5454">tap #1 → /v?picc=9A3F…&amp;cmac=1D7B</text>
<text x="450" y="230" font-size="12.5" font-weight="700" fill="#1f6f3a">✓ verified · read counter = 1</text>

<rect x="420" y="275" width="710" height="80" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="450" y="308" font-size="15" font-weight="600" fill="#2c5454">tap #2 → /v?picc=C10B…&amp;cmac=8E42</text>
<text x="450" y="335" font-size="12.5" font-weight="700" fill="#1f6f3a">✓ verified · read counter = 2</text>

<rect x="420" y="380" width="710" height="80" rx="12" fill="#f3e3e3" stroke="#8b2d2d" stroke-width="2"/>
<text x="450" y="413" font-size="15" font-weight="600" fill="#8b2d2d">clone → /v?picc=9A3F…&amp;cmac=1D7B (replayed)</text>
<text x="450" y="440" font-size="12.5" font-weight="700" fill="#8b2d2d">✗ rejected · read counter went backwards</text>
<text x="1100" y="413" text-anchor="end" font-size="12.5" fill="#8b2d2d">not from this tag</text>

<rect x="200" y="520" width="800" height="100" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="560" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="21" font-weight="700" fill="#291c0e">Same tag, fresh signature — replays bounce.</text>
<text x="600" y="592" text-anchor="middle" font-size="14" fill="#4f4f4f">The backend recomputes the CMAC with Key 2 and rejects any counter that goes backwards.</text>
</svg>
