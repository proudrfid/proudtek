<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five hidden one-time and recurring fees in an RFID quote</title>
<desc id="d">Five fee cards plus a summary. Tooling and setup is a one-time 500 to 5,000 dollars, amortized into unit price for first orders. Sample fees are 50 to 500 dollars per sample, often waived for serious buyers. Encoding setup is a one-time 200 to 1,500 dollars, with per-batch fees waived after. Quality inspection is a 1 to 3 percent per-order surcharge for third-party inspection. Logo printing setup is 100 to 1,500 dollars per color, reusable for repeat orders. Together these make up the 30 to 40 percent of soft fees, all negotiable.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE FEES THE QUOTE WON'T INTRODUCE</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Five one-time or recurring charges — name each for a real total cost.</text>

<!-- c1 tooling -->
<rect x="64" y="106" width="336" height="212" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="64" y="106" width="336" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="98" cy="150" r="15" fill="#3d6b6b"/>
<text x="98" y="155" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="124" y="156" font-size="15.5" font-weight="800" fill="#291c0e">Tooling &amp; setup</text>
<text x="88" y="222" font-size="27" font-weight="800" fill="#2c5454">$500–5K</text>
<rect x="88" y="238" width="92" height="27" rx="13" fill="#eef5f5" stroke="#8fb6b6" stroke-width="1.4"/>
<text x="134" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">one-time</text>
<text x="88" y="292" font-size="13" fill="#5c5c5c">Amortize into unit price</text>
<text x="88" y="310" font-size="13" fill="#5c5c5c">for first-order volumes.</text>

<!-- c2 sample -->
<rect x="432" y="106" width="336" height="212" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="432" y="106" width="336" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="466" cy="150" r="15" fill="#3d6b6b"/>
<text x="466" y="155" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="492" y="156" font-size="15.5" font-weight="800" fill="#291c0e">Sample fees</text>
<text x="456" y="222" font-size="27" font-weight="800" fill="#2c5454">$50–500</text>
<rect x="456" y="238" width="104" height="27" rx="13" fill="#eef5f5" stroke="#8fb6b6" stroke-width="1.4"/>
<text x="508" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">per sample</text>
<text x="456" y="292" font-size="13" fill="#5c5c5c">Often waived for serious</text>
<text x="456" y="310" font-size="13" fill="#5c5c5c">buyers; credit vs first order.</text>

<!-- c3 encoding -->
<rect x="800" y="106" width="336" height="212" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="800" y="106" width="336" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="834" cy="150" r="15" fill="#3d6b6b"/>
<text x="834" y="155" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
<text x="860" y="156" font-size="15.5" font-weight="800" fill="#291c0e">Encoding setup</text>
<text x="824" y="222" font-size="27" font-weight="800" fill="#2c5454">$200–1500</text>
<rect x="824" y="238" width="92" height="27" rx="13" fill="#eef5f5" stroke="#8fb6b6" stroke-width="1.4"/>
<text x="870" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">one-time</text>
<text x="824" y="292" font-size="13" fill="#5c5c5c">Per-batch fees typically</text>
<text x="824" y="310" font-size="13" fill="#5c5c5c">waived thereafter.</text>

<!-- c4 QC -->
<rect x="64" y="342" width="336" height="212" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="64" y="342" width="336" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="98" cy="386" r="15" fill="#3d6b6b"/>
<text x="98" y="391" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
<text x="124" y="392" font-size="15.5" font-weight="800" fill="#291c0e">Quality inspection</text>
<text x="88" y="458" font-size="27" font-weight="800" fill="#2c5454">1–3%</text>
<rect x="88" y="474" width="96" height="27" rx="13" fill="#eef5f5" stroke="#8fb6b6" stroke-width="1.4"/>
<text x="136" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">per order</text>
<text x="88" y="528" font-size="13" fill="#5c5c5c">Surcharge for buyer-specified</text>
<text x="88" y="546" font-size="13" fill="#5c5c5c">third-party inspection.</text>

<!-- c5 logo -->
<rect x="432" y="342" width="336" height="212" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="432" y="342" width="336" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="466" cy="386" r="15" fill="#3d6b6b"/>
<text x="466" y="391" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">5</text>
<text x="492" y="392" font-size="15.5" font-weight="800" fill="#291c0e">Logo print setup</text>
<text x="456" y="458" font-size="27" font-weight="800" fill="#2c5454">$100–1500</text>
<rect x="456" y="474" width="96" height="27" rx="13" fill="#eef5f5" stroke="#8fb6b6" stroke-width="1.4"/>
<text x="504" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">per color</text>
<text x="456" y="528" font-size="13" fill="#5c5c5c">Charged once per logo color,</text>
<text x="456" y="546" font-size="13" fill="#5c5c5c">reusable for repeat orders.</text>

<!-- c6 takeaway -->
<rect x="800" y="342" width="336" height="212" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
<rect x="800" y="342" width="336" height="8" rx="4" fill="#c39a5f"/>
<text x="968" y="404" text-anchor="middle" font-size="46" font-weight="800" fill="#a07d43">30-40%</text>
<text x="968" y="436" text-anchor="middle" font-size="16" font-weight="800" fill="#8a6a2f">of the quote = soft fees</text>
<text x="968" y="486" text-anchor="middle" font-size="13.5" fill="#6d5a3a">All negotiable. A complete TCO</text>
<text x="968" y="506" text-anchor="middle" font-size="13.5" fill="#6d5a3a">names every one of them —</text>
<text x="968" y="526" text-anchor="middle" font-size="13.5" fill="#6d5a3a">the quote never will.</text>

<text x="600" y="590" text-anchor="middle" font-size="14" fill="#4f4f4f">A tidy "all-in per tag" buries these five — always ask for them itemized.</text>
</svg>
