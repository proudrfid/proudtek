<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How a single badge ID links registration to check-in, leads and session data</title>
<desc id="d">A left-to-right data flow. Registration data from Eventbrite, Cvent, Bizzabo, Hopin and Swoogo — attendee name, company and title — is encoded into one badge ID five to seven days before the show. From that hub, three outcomes branch out: check-in taps update registration status live, exhibitor lead scans sync to CRM within sixty seconds, and session readers log room entries automatically. Everything reconciles to a single attendee record.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE BADGE ID, EVERY SYSTEM</text>
<text x="600" y="86" text-anchor="middle" font-size="15" fill="#4f4f4f">The badge ID is the key each downstream system reads from.</text>
<!-- source box -->
<rect x="64" y="250" width="248" height="176" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<text x="188" y="298" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Registration data</text>
<text x="188" y="330" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Eventbrite · Cvent · Bizzabo</text>
<text x="188" y="352" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Hopin · Swoogo</text>
<text x="188" y="392" text-anchor="middle" font-size="12.5" fill="#8a8272">name · company · title</text>
<!-- arrow to hub -->
<line x1="316" y1="338" x2="380" y2="338" stroke="#b9ae98" stroke-width="3"/>
<polygon points="380,338 368,331 368,345" fill="#b9ae98"/>
<!-- hub -->
<rect x="392" y="252" width="212" height="172" rx="16" fill="#2c5454"/>
<text x="498" y="322" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">BADGE ID</text>
<text x="498" y="352" text-anchor="middle" font-size="13.5" fill="#dfeeeb">one encoded key</text>
<text x="498" y="388" text-anchor="middle" font-size="12.5" fill="#bcdcd6">encoded 5–7 days pre-show</text>
<!-- fan-out arrows -->
<line x1="604" y1="338" x2="672" y2="205" stroke="#b9ae98" stroke-width="3"/>
<polygon points="672,205 660,214 674,218" fill="#b9ae98"/>
<line x1="604" y1="338" x2="672" y2="343" stroke="#b9ae98" stroke-width="3"/>
<polygon points="672,343 660,336 660,350" fill="#b9ae98"/>
<line x1="604" y1="338" x2="672" y2="481" stroke="#b9ae98" stroke-width="3"/>
<polygon points="672,481 674,468 660,472" fill="#b9ae98"/>
<!-- outcome boxes -->
<rect x="684" y="150" width="446" height="110" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="684" y="150" width="8" height="110" rx="4" fill="#3d6b6b"/>
<text x="716" y="192" text-anchor="start" font-size="17" font-weight="800" fill="#291c0e">Check-in</text>
<text x="716" y="222" text-anchor="start" font-size="14" fill="#4f4f4f">Tap updates registration status live.</text>
<rect x="684" y="288" width="446" height="110" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="684" y="288" width="8" height="110" rx="4" fill="#c39a5f"/>
<text x="716" y="330" text-anchor="start" font-size="17" font-weight="800" fill="#291c0e">Lead capture</text>
<text x="716" y="360" text-anchor="start" font-size="14" fill="#4f4f4f">Exhibitor scan → CRM sync in 60 seconds.</text>
<rect x="684" y="426" width="446" height="110" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="684" y="426" width="8" height="110" rx="4" fill="#2d6a4f"/>
<text x="716" y="468" text-anchor="start" font-size="17" font-weight="800" fill="#291c0e">Session attendance</text>
<text x="716" y="498" text-anchor="start" font-size="14" fill="#4f4f4f">Readers log room entries automatically.</text>
<text x="600" y="618" text-anchor="middle" font-size="14" fill="#5c5c5c">Registration, check-in, leads and session data all reconcile to a single attendee record.</text>
</svg>
