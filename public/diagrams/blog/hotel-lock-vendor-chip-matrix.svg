<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hotel lock vendors and the chips they support, with the firmware caveats</title>
<desc id="d">Four major hotel lock vendors and their chip support. ASSA ABLOY (Vingcard, S and G) supports Classic and DESFire EV2/EV3 plus mobile key via NFC and BLE, but firmware version matters on Essence and Visionline. Dormakaba (Saflok, Ilco) supports Classic 1K/4K and DESFire EV2/EV3, defaults to Ultralight C on new installs, and DESFire needs Saflok RT or newer while legacy MT needs a firmware upgrade. Salto (XS4, Space) supports Classic, DESFire EV2/EV3 and SVN plus JustIN mobile, broadest on XS4 2.0 and Space. Onity (Allegion) supports Classic and DESFire on Trillium and DirectKey, but legacy Onity is proprietary magnetic, not RFID. Compatible depends on firmware version and key configuration.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">LOCK VENDOR · CHIP SUPPORT</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">"Compatible" lives in firmware versions and key configs, not the marketing line.</text>

<text x="92" y="122" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">VENDOR</text>
<text x="430" y="122" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">CHIPS SUPPORTED</text>
<text x="762" y="122" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#8a6d34">THE CATCH</text>

<!-- row 1 -->
<rect x="64" y="136" width="1072" height="80" rx="11" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="136" width="9" height="80" rx="4" fill="#3d6b6b"/>
<text x="92" y="172" font-size="15.5" font-weight="800" fill="#291c0e">ASSA ABLOY</text>
<text x="92" y="193" font-size="12" fill="#5c5c5c">Vingcard · S&amp;G</text>
<text x="430" y="170" font-size="13" fill="#333333">Classic · DESFire EV2/EV3</text>
<text x="430" y="192" font-size="12.5" fill="#5c5c5c">mobile key via NFC + BLE</text>
<circle cx="768" cy="176" r="9" fill="#c39a5f"/>
<text x="768" y="181" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">!</text>
<text x="786" y="172" font-size="12.5" fill="#6d5a3a">Firmware version matters on</text>
<text x="786" y="192" font-size="12.5" fill="#6d5a3a">Essence &amp; Visionline</text>

<!-- row 2 -->
<rect x="64" y="224" width="1072" height="80" rx="11" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="224" width="9" height="80" rx="4" fill="#3d6b6b"/>
<text x="92" y="260" font-size="15.5" font-weight="800" fill="#291c0e">Dormakaba</text>
<text x="92" y="281" font-size="12" fill="#5c5c5c">Saflok · Ilco</text>
<text x="430" y="258" font-size="13" fill="#333333">Classic 1K/4K · DESFire EV2/EV3</text>
<text x="430" y="280" font-size="12.5" fill="#5c5c5c">default Ultralight C on new installs</text>
<circle cx="768" cy="264" r="9" fill="#c39a5f"/>
<text x="768" y="269" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">!</text>
<text x="786" y="260" font-size="12.5" fill="#6d5a3a">DESFire needs Saflok RT+;</text>
<text x="786" y="280" font-size="12.5" fill="#6d5a3a">legacy MT needs firmware</text>

<!-- row 3 -->
<rect x="64" y="312" width="1072" height="80" rx="11" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="312" width="9" height="80" rx="4" fill="#3d6b6b"/>
<text x="92" y="348" font-size="15.5" font-weight="800" fill="#291c0e">Salto</text>
<text x="92" y="369" font-size="12" fill="#5c5c5c">XS4 · Space</text>
<text x="430" y="346" font-size="13" fill="#333333">Classic · DESFire EV2/EV3 · SVN</text>
<text x="430" y="368" font-size="12.5" fill="#5c5c5c">mobile key via JustIN</text>
<circle cx="768" cy="352" r="9" fill="#c39a5f"/>
<text x="768" y="357" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">!</text>
<text x="786" y="348" font-size="12.5" fill="#6d5a3a">Broadest on XS4 2.0 and</text>
<text x="786" y="368" font-size="12.5" fill="#6d5a3a">Space platforms</text>

<!-- row 4 -->
<rect x="64" y="400" width="1072" height="80" rx="11" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="400" width="9" height="80" rx="4" fill="#3d6b6b"/>
<text x="92" y="436" font-size="15.5" font-weight="800" fill="#291c0e">Onity</text>
<text x="92" y="457" font-size="12" fill="#5c5c5c">Allegion</text>
<text x="430" y="434" font-size="13" fill="#333333">Classic + DESFire on</text>
<text x="430" y="456" font-size="12.5" fill="#5c5c5c">Trillium &amp; DirectKey</text>
<circle cx="768" cy="440" r="9" fill="#8b2d2d"/>
<text x="768" y="445" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">!</text>
<text x="786" y="436" font-size="12.5" fill="#8b2d2d">Legacy Onity is proprietary</text>
<text x="786" y="456" font-size="12.5" fill="#8b2d2d">magnetic — not RFID</text>

<text x="600" y="524" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Test your card on your lock, at your firmware level, before the volume order.</text>
</svg>
