<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">One EM4305 chip emulates five legacy 125 kHz credential formats</title>
  <desc id="d">A central EM4305 rewritable 125 kHz chip on the left with arrows fanning out to five legacy format cards on the right: EM4100 / EM4200 native 64 or 128-bit read-only ID, HID Prox H10301 26-bit, Indala 26 or 27-bit, AWID legacy Wiegand, and ISO 11784 / 11785 FDX-B animal-ID. A caption notes the 125 kHz LF air interface has no cryptography and the ID can be cloned by any reader.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE EM4305 — EVERY 125 kHz LEGACY FORMAT</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">A single rewritable SKU, programmed on site, replaces a shelf of format-specific fobs</text>

  <!-- central chip -->
  <rect x="118" y="268" width="236" height="150" rx="16" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
  <text x="236" y="326" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff">EM4305</text>
  <text x="236" y="356" text-anchor="middle" font-size="14" fill="#eef5f5">512-bit EEPROM · rewritable</text>
  <text x="236" y="378" text-anchor="middle" font-size="14" fill="#eef5f5">100,000 write cycles</text>
  <text x="236" y="400" text-anchor="middle" font-size="13" fill="#d7e6e6">programmed by any 125 kHz writer</text>

  <!-- arrows -->
  <line x1="358" y1="343" x2="704" y2="150" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="704,150 690,146 692,159" fill="#4a5568"/>
  <line x1="358" y1="343" x2="704" y2="232" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="704,232 690,227 690,240" fill="#4a5568"/>
  <line x1="358" y1="343" x2="704" y2="314" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="704,314 690,309 690,322" fill="#4a5568"/>
  <line x1="358" y1="343" x2="704" y2="396" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="704,396 690,390 690,403" fill="#4a5568"/>
  <line x1="358" y1="343" x2="704" y2="478" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="704,478 690,473 692,486" fill="#4a5568"/>

  <!-- format cards -->
  <rect x="712" y="120" width="452" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="712" y="120" width="8" height="60" rx="4" fill="#3d6b6b"/>
  <text x="736" y="146" font-size="17" font-weight="700" fill="#291c0e">EM4100 / EM4200</text>
  <text x="736" y="167" font-size="13" fill="#5c5c5c">Native 64-bit / 128-bit read-only ID</text>

  <rect x="712" y="202" width="452" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="712" y="202" width="8" height="60" rx="4" fill="#3d6b6b"/>
  <text x="736" y="228" font-size="17" font-weight="700" fill="#291c0e">HID Prox H10301</text>
  <text x="736" y="249" font-size="13" fill="#5c5c5c">26-bit facility code + card number</text>

  <rect x="712" y="284" width="452" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="712" y="284" width="8" height="60" rx="4" fill="#3d6b6b"/>
  <text x="736" y="310" font-size="17" font-weight="700" fill="#291c0e">Indala</text>
  <text x="736" y="331" font-size="13" fill="#5c5c5c">26 / 27-bit legacy Wiegand</text>

  <rect x="712" y="366" width="452" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="712" y="366" width="8" height="60" rx="4" fill="#3d6b6b"/>
  <text x="736" y="392" font-size="17" font-weight="700" fill="#291c0e">AWID</text>
  <text x="736" y="413" font-size="13" fill="#5c5c5c">legacy Wiegand formats</text>

  <rect x="712" y="448" width="452" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="712" y="448" width="8" height="60" rx="4" fill="#3d6b6b"/>
  <text x="736" y="474" font-size="17" font-weight="700" fill="#291c0e">ISO 11784 / 11785 FDX-B</text>
  <text x="736" y="495" font-size="13" fill="#5c5c5c">animal-ID and livestock heritage</text>

  <!-- risk caption -->
  <rect x="118" y="556" width="1046" height="62" rx="12" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="1.5"/>
  <text x="140" y="582" font-size="15" font-weight="700" fill="#8b2d2d">Security posture — 125 kHz LF has no cryptography</text>
  <text x="140" y="604" font-size="13.5" fill="#8b2d2d">Any 125 kHz reader — including a Proxmark 3 or Flipper Zero — reads and clones the ID. Correct for tenant-reuse, not enterprise access.</text>
</svg>
