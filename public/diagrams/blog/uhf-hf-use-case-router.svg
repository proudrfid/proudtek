<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The use-case router — UHF lane, HF lane, and the contested middle</title>
<desc id="d">A router sorts common RFID applications into three lanes. Left lane, UHF with no debate: warehouse dock-door portals, retail item-level counting, pallet and case tracking, vehicle toll collection, airport baggage handling. Right lane, HF/NFC with no debate: contactless payments, hotel key cards and badges, NFC business cards, Digital Product Passports, smartphone interaction. Middle lane, either frequency with a tie-breaker deciding: industrial asset tracking (range favours UHF, security favours HF), laundry tracking (bulk favours UHF, small operations HF), library management (shelf-scanning speed UHF, self-checkout HF), patient wristbands (bedside tap HF, zone tracking UHF). Caption: write the tie-breaker requirement down before the vendor demo — it decides, not the radio.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE USE-CASE ROUTER</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="29" font-weight="700" fill="#291c0e">Most applications sort themselves — the rest negotiate</text>

<rect x="450" y="112" width="300" height="34" rx="17" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#6d5a3a">where does your use case land?</text>
