<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A modern phone's magnet field erases a hotel keycard's magnetic stripe, while an RFID chip stays immune</title>
<desc id="d">On the left, a smartphone radiates a magnetic field labelled 2500 to 3500 oersteds. An arrow marked "erases" crosses to a hotel keycard on the right, whose dark magnetic stripe is drawn scrambled and tagged data erased, with a note that a HiCo stripe rated 2750 oersteds still loses. A green callout below states that an RFID keycard stores its credential on a silicon chip with no magnetic medium, so it is immune at any field strength.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="58" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOTEL TECHNOLOGY · KEYCARD DEMAGNETIZATION</text>
<text x="600" y="104" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#291c0e">Your phone is a magnet. The stripe remembers.</text>
<text x="600" y="140" text-anchor="middle" font-size="16" fill="#4f4f4f">A MagSafe array reaches 2500-3500 Oe — above a HiCo stripe's 2750 Oe. The magnet wins.</text>

<!-- phone -->
<rect x="150" y="238" width="150" height="236" rx="26" fill="#2c2c2c"/>
<rect x="205" y="250" width="40" height="5" rx="2" fill="#4a4a4a"/>
<rect x="166" y="264" width="118" height="160" rx="8" fill="#eef5f5"/>
<circle cx="225" cy="344" r="34" fill="#3a3a3a" stroke="#c39a5f" stroke-width="3"/>
<circle cx="225" cy="344" r="14" fill="#c39a5f"/>
<text x="225" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">PHONE MAGNET ARRAY</text>
<text x="225" y="536" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2d2d">2500-3500 Oe</text>

<!-- field arcs -->
<path d="M 340 300 A 92 92 0 0 1 340 442" fill="none" stroke="#c39a5f" stroke-width="3"/>
<path d="M 372 292 A 108 108 0 0 1 372 450" fill="none" stroke="#d4a755" stroke-width="3"/>
<path d="M 404 286 A 122 122 0 0 1 404 456" fill="none" stroke="#e4c98f" stroke-width="3"/>

<!-- arrow -->
<text x="558" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#8b2d2d">erases</text>
<line x1="470" y1="372" x2="648" y2="372" stroke="#291c0e" stroke-width="3"/>
<polygon points="648,364 666,372 648,380" fill="#291c0e"/>

<!-- keycard -->
<rect x="688" y="286" width="342" height="196" rx="16" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="688" y="316" width="342" height="36" fill="#3a3a3a"/>
<path d="M 712 334 l 22 -11 l 24 21 l 26 -19 l 24 17 l 26 -15 l 24 13 l 26 -11 l 24 9" fill="none" stroke="#8b2d2d" stroke-width="3"/>
<text x="859" y="392" text-anchor="middle" font-size="13" fill="#5c5c5c">HiCo magnetic stripe · 2750 Oe — still loses</text>
<rect x="762" y="410" width="194" height="40" rx="20" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="859" y="435" text-anchor="middle" font-size="15" font-weight="800" fill="#8b2d2d">DATA ERASED</text>

<!-- green immune callout -->
<rect x="336" y="556" width="528" height="74" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<circle cx="382" cy="593" r="16" fill="#1f6f3a"/>
<path d="M 374 593 l 6 7 l 12 -15" fill="none" stroke="#ffffff" stroke-width="3"/>
<text x="632" y="588" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6f3a">RFID keycard: the key lives on a silicon chip</text>
<text x="632" y="611" text-anchor="middle" font-size="13" fill="#4f4f4f">no magnetic medium to erase — immune at any strength</text>
</svg>
