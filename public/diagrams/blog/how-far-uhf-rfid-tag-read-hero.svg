<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="hfTitle hfDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="hfTitle">How far can a UHF RFID tag be read?</title>
  <desc id="hfDesc">A fixed UHF RFID reader antenna on the left emits concentric radar rings labelled 3, 8, 12 and 15 meters. Colored markers on the range line show how the mounting surface caps distance: metal reads only 3 to 4 meters with an anti-metal tag, liquids lose 30 to 60 percent, plastic loses 10 to 20 percent, and cardboard reads the full 8 to 15 meters. Typical real-world range is 3 to 12 meters versus up to 15 meters in free space.</desc>
  <defs>
    <radialGradient id="hfBg" cx="30%" cy="30%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <clipPath id="hfRadar"><rect x="56" y="120" width="1088" height="382"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="url(#hfBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="30" font-weight="800" letter-spacing="1.5" fill="#6d5a3a">HOW FAR CAN A UHF RFID TAG BE READ?</text>
  <text x="600" y="92" text-anchor="middle" font-size="18" font-weight="600" fill="#4f4f4f">Typical real-world range 3–12 m   ·   free-space up to 15 m</text>

  <!-- Radar rings (clipped), origin at reader (150, 360) -->
  <g clip-path="url(#hfRadar)">
    <circle cx="150" cy="360" r="170" fill="none" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="150" cy="360" r="430" fill="none" stroke="#dcc59c" stroke-width="2"/>
    <circle cx="150" cy="360" r="650" fill="none" stroke="#cdb488" stroke-width="2"/>
    <circle cx="150" cy="360" r="800" fill="none" stroke="#c39a5f" stroke-width="2.5"/>
    <path d="M150 360 L1000 150 A870 870 0 0 1 1000 570 Z" fill="#3d6b6b" opacity="0.05"/>
  </g>

  <!-- range line -->
  <line x1="150" y1="360" x2="1000" y2="360" stroke="#e6dfd2" stroke-width="2" stroke-dasharray="3 6"/>

  <!-- distance ticks -->
  <g font-size="15" font-weight="700" fill="#6d5a3a" text-anchor="middle">
    <line x1="320" y1="352" x2="320" y2="368" stroke="#c39a5f" stroke-width="2"/><text x="320" y="392">3 m</text>
    <line x1="580" y1="352" x2="580" y2="368" stroke="#c39a5f" stroke-width="2"/><text x="580" y="392">8 m</text>
    <line x1="800" y1="352" x2="800" y2="368" stroke="#c39a5f" stroke-width="2"/><text x="800" y="392">12 m</text>
    <line x1="950" y1="352" x2="950" y2="368" stroke="#c39a5f" stroke-width="2"/><text x="950" y="392">15 m</text>
  </g>

  <!-- reader / antenna -->
  <rect x="88" y="326" width="64" height="68" rx="12" fill="#291c0e" stroke="#6d5a3a" stroke-width="2"/>
  <rect x="104" y="340" width="32" height="8" rx="4" fill="#c39a5f"/>
  <circle cx="120" cy="368" r="8" fill="#1fcefb"/>
  <path d="M162 344 A34 34 0 0 1 162 396" fill="none" stroke="#1fcefb" stroke-width="3" opacity="0.85"/>
  <path d="M176 336 A46 46 0 0 1 176 404" fill="none" stroke="#1fcefb" stroke-width="3" opacity="0.55"/>
  <path d="M190 328 A58 58 0 0 1 190 412" fill="none" stroke="#1fcefb" stroke-width="3" opacity="0.30"/>
  <text x="120" y="424" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#6d5a3a">READER</text>

  <!-- surface markers: leaders + dots on the line -->
  <g stroke-width="2">
    <line x1="345" y1="360" x2="345" y2="196" stroke="#d9a3a3"/>
    <line x1="520" y1="360" x2="520" y2="470" stroke="#9cbfbc"/>
    <line x1="660" y1="360" x2="660" y2="196" stroke="#c39a5f"/>
    <line x1="860" y1="360" x2="860" y2="470" stroke="#9cccae"/>
  </g>
  <circle cx="345" cy="360" r="8" fill="#8b2d2d"/>
  <circle cx="520" cy="360" r="8" fill="#3d6b6b"/>
  <circle cx="660" cy="360" r="8" fill="#c39a5f"/>
  <circle cx="860" cy="360" r="8" fill="#2d6a4f"/>

  <!-- surface pills (tier A above: metal + plastic) -->
  <g text-anchor="middle">
    <rect x="262" y="150" width="166" height="48" rx="24" fill="#f5e6e6" stroke="#d9a3a3" stroke-width="2"/>
    <text x="345" y="172" font-size="16" font-weight="800" fill="#8b2d2d">Metal *</text>
    <text x="345" y="190" font-size="14" fill="#8b2d2d">3–4 m only</text>

    <rect x="574" y="150" width="172" height="48" rx="24" fill="#efe0bf" stroke="#c39a5f" stroke-width="2"/>
    <text x="660" y="172" font-size="16" font-weight="800" fill="#291c0e">Plastic</text>
    <text x="660" y="190" font-size="14" fill="#6d5a3a">−10 to 20%</text>

    <!-- tier B below: liquids + cardboard -->
    <rect x="434" y="472" width="172" height="48" rx="24" fill="#e7f0ef" stroke="#9cbfbc" stroke-width="2"/>
    <text x="520" y="494" font-size="16" font-weight="800" fill="#2c5454">Liquids</text>
    <text x="520" y="512" font-size="14" fill="#2c5454">−30 to 60%</text>

    <rect x="770" y="472" width="180" height="48" rx="24" fill="#eaf5ec" stroke="#9cccae" stroke-width="2"/>
    <text x="860" y="494" font-size="16" font-weight="800" fill="#1f6f3a">Cardboard</text>
    <text x="860" y="512" font-size="14" fill="#1f6f3a">full 8–15 m</text>
  </g>

  <text x="1120" y="556" text-anchor="end" font-size="13" fill="#8a949c">* standard tags on bare metal lose 80–95% of range</text>
  <text x="600" y="612" text-anchor="middle" font-size="17.5" font-weight="600" fill="#6d5a3a">Read range isn’t a tag spec — it’s a negotiation with the surface, the reader and the regulator.</text>
</svg>
