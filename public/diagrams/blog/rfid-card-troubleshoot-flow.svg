<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A four-step flow to isolate an RFID card failure before replacing it</title>
<desc id="d">Four ordered steps on the left, each with the conclusion it produces on the right. Step one, test on a second reader or door: if it works there, the reader or system is at fault and the card is fine. Step two, scan with a phone NFC app such as NFC Tools or NFC TagInfo: if a UID appears, the chip and antenna are alive. Step three, inspect for cracks and punctures: visible damage means the antenna or chip is broken. Step four, confirm access permissions with the issuer: expired or revoked credentials only need re-encoding. Only if every check fails do you replace the card with a freshly encoded one.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ISOLATE IT IN TWO MINUTES</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Prove whether the chip is alive before anyone orders a replacement.</text>

<!-- STEP 1 -->
<rect x="80" y="132" width="520" height="86" rx="13" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="80" y="132" width="8" height="86" rx="4" fill="#3d6b6b"/>
<circle cx="122" cy="175" r="18" fill="#eef5f5" stroke="#2c5454" stroke-width="1.8"/>
<text x="122" y="181" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">1</text>
<text x="158" y="169" font-size="15.5" font-weight="800" fill="#291c0e">Test on a second reader</text>
<text x="158" y="192" font-size="13" fill="#5c5c5c">or a different door in the building</text>
<line x1="600" y1="175" x2="636" y2="175" stroke="#291c0e" stroke-width="2.6"/>
<polygon points="636,169 650,175 636,181" fill="#291c0e"/>
<rect x="656" y="140" width="480" height="70" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/>
<text x="680" y="170" font-size="13.5" font-weight="700" fill="#1f6f3a">Works there? The reader or system is</text>
<text x="680" y="190" font-size="13.5" font-weight="700" fill="#1f6f3a">at fault — the card is fine.</text>

<!-- arrow down 1->2 -->
<line x1="122" y1="218" x2="122" y2="242" stroke="#b8ae9c" stroke-width="2.4"/>
<polygon points="116,242 122,254 128,242" fill="#b8ae9c"/>

<!-- STEP 2 -->
<rect x="80" y="256" width="520" height="86" rx="13" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="80" y="256" width="8" height="86" rx="4" fill="#3d6b6b"/>
<circle cx="122" cy="299" r="18" fill="#eef5f5" stroke="#2c5454" stroke-width="1.8"/>
<text x="122" y="305" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">2</text>
<text x="158" y="293" font-size="15.5" font-weight="800" fill="#291c0e">Scan with a phone NFC app</text>
<text x="158" y="316" font-size="13" fill="#5c5c5c">NFC Tools or NFC TagInfo, tapped to the back</text>
<line x1="600" y1="299" x2="636" y2="299" stroke="#291c0e" stroke-width="2.6"/>
<polygon points="636,293 650,299 636,305" fill="#291c0e"/>
<rect x="656" y="264" width="480" height="70" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/>
<text x="680" y="294" font-size="13.5" font-weight="700" fill="#1f6f3a">A UID appears? The chip and antenna</text>
<text x="680" y="314" font-size="13.5" font-weight="700" fill="#1f6f3a">are both alive.</text>

<!-- arrow down 2->3 -->
<line x1="122" y1="342" x2="122" y2="366" stroke="#b8ae9c" stroke-width="2.4"/>
<polygon points="116,366 122,378 128,366" fill="#b8ae9c"/>

<!-- STEP 3 -->
<rect x="80" y="380" width="520" height="86" rx="13" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="80" y="380" width="8" height="86" rx="4" fill="#3d6b6b"/>
<circle cx="122" cy="423" r="18" fill="#eef5f5" stroke="#2c5454" stroke-width="1.8"/>
<text x="122" y="429" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">3</text>
<text x="158" y="417" font-size="15.5" font-weight="800" fill="#291c0e">Inspect for cracks</text>
<text x="158" y="440" font-size="13" fill="#5c5c5c">creases, and puncture marks on the card</text>
<line x1="600" y1="423" x2="636" y2="423" stroke="#291c0e" stroke-width="2.6"/>
<polygon points="636,417 650,423 636,429" fill="#291c0e"/>
<rect x="656" y="388" width="480" height="70" rx="12" fill="#eef1f5" stroke="#b3bcc9" stroke-width="1.8"/>
<text x="680" y="418" font-size="13.5" font-weight="700" fill="#3f4a5c">Visible damage? The antenna or</text>
<text x="680" y="438" font-size="13.5" font-weight="700" fill="#3f4a5c">chip is physically broken.</text>

<!-- arrow down 3->4 -->
<line x1="122" y1="466" x2="122" y2="490" stroke="#b8ae9c" stroke-width="2.4"/>
<polygon points="116,490 122,502 128,490" fill="#b8ae9c"/>

<!-- STEP 4 -->
<rect x="80" y="504" width="520" height="86" rx="13" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="80" y="504" width="8" height="86" rx="4" fill="#3d6b6b"/>
<circle cx="122" cy="547" r="18" fill="#eef5f5" stroke="#2c5454" stroke-width="1.8"/>
<text x="122" y="553" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">4</text>
<text x="158" y="541" font-size="15.5" font-weight="800" fill="#291c0e">Confirm permissions</text>
<text x="158" y="564" font-size="13" fill="#5c5c5c">with the card issuer or access-control team</text>
<line x1="600" y1="547" x2="636" y2="547" stroke="#291c0e" stroke-width="2.6"/>
<polygon points="636,541 650,547 636,553" fill="#291c0e"/>
<rect x="656" y="512" width="480" height="70" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.8"/>
<text x="680" y="542" font-size="13.5" font-weight="700" fill="#8a6d2f">Expired or revoked? Re-encode it —</text>
<text x="680" y="562" font-size="13.5" font-weight="700" fill="#8a6d2f">no replacement needed.</text>

<!-- terminal -->
<rect x="656" y="600" width="480" height="44" rx="12" fill="#f7e7e7" stroke="#8b2d2d" stroke-width="1.8"/>
<text x="896" y="627" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">All checks fail → replace with fresh encoding.</text>
<text x="80" y="627" font-size="13" fill="#8a8a8a">Most "dead" cards stop at step 1 or 2.</text>
</svg>
