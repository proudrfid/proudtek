<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID vs manual counting — the three numbers you save</title>
<desc id="d">Three before-and-after panels. Speed: a full retail store count drops from 40 staff-hours by hand to 4-8 hours with RFID. Accuracy: SKU-location accuracy rises from 65-75% manual to 95-99% with RFID. Frequency: full counts go from monthly or quarterly by hand to weekly or daily with RFID. Manual states are shown in muted red, RFID states in green.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID VS MANUAL COUNTING — WHAT YOU SAVE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Three numbers move the moment you stop counting by hand.</text>

<!-- PANEL 1 · SPEED -->
<rect x="48" y="150" width="340" height="384" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="48" y="150" width="340" height="8" rx="4" fill="#c39a5f"/>
<text x="218" y="194" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#a07d43">SPEED</text>
<rect x="78" y="212" width="280" height="94" rx="10" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.6"/>
<text x="96" y="236" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">MANUAL</text>
<text x="218" y="284" text-anchor="middle" font-size="30" font-weight="800" fill="#8b2d2d" font-family="Lora, Georgia, serif">40 staff-hours</text>
<line x1="218" y1="314" x2="218" y2="342" stroke="#4a5568" stroke-width="3"/>
<polygon points="211,340 218,352 225,340" fill="#4a5568"/>
<rect x="78" y="358" width="280" height="94" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="96" y="382" font-size="12" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">WITH RFID</text>
<text x="218" y="430" text-anchor="middle" font-size="30" font-weight="800" fill="#1f6f3a" font-family="Lora, Georgia, serif">4-8 hours</text>
<text x="218" y="492" text-anchor="middle" font-size="13" fill="#5c5c5c">Full retail store count</text>

<!-- PANEL 2 · ACCURACY -->
<rect x="430" y="150" width="340" height="384" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="430" y="150" width="340" height="8" rx="4" fill="#c39a5f"/>
<text x="600" y="194" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#a07d43">ACCURACY</text>
<rect x="460" y="212" width="280" height="94" rx="10" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.6"/>
<text x="478" y="236" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">MANUAL</text>
<text x="600" y="284" text-anchor="middle" font-size="34" font-weight="800" fill="#8b2d2d" font-family="Lora, Georgia, serif">65-75%</text>
<line x1="600" y1="314" x2="600" y2="342" stroke="#4a5568" stroke-width="3"/>
<polygon points="593,340 600,352 607,340" fill="#4a5568"/>
<rect x="460" y="358" width="280" height="94" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="478" y="382" font-size="12" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">WITH RFID</text>
<text x="600" y="430" text-anchor="middle" font-size="34" font-weight="800" fill="#1f6f3a" font-family="Lora, Georgia, serif">95-99%</text>
<text x="600" y="492" text-anchor="middle" font-size="13" fill="#5c5c5c">SKU-location accuracy</text>

<!-- PANEL 3 · FREQUENCY -->
<rect x="812" y="150" width="340" height="384" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="812" y="150" width="340" height="8" rx="4" fill="#c39a5f"/>
<text x="982" y="194" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#a07d43">FREQUENCY</text>
<rect x="842" y="212" width="280" height="94" rx="10" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.6"/>
<text x="860" y="236" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">MANUAL</text>
<text x="982" y="282" text-anchor="middle" font-size="24" font-weight="800" fill="#8b2d2d" font-family="Lora, Georgia, serif">Monthly / quarterly</text>
<line x1="982" y1="314" x2="982" y2="342" stroke="#4a5568" stroke-width="3"/>
<polygon points="975,340 982,352 989,340" fill="#4a5568"/>
<rect x="842" y="358" width="280" height="94" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="860" y="382" font-size="12" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">WITH RFID</text>
<text x="982" y="428" text-anchor="middle" font-size="24" font-weight="800" fill="#1f6f3a" font-family="Lora, Georgia, serif">Weekly / daily</text>
<text x="982" y="492" text-anchor="middle" font-size="13" fill="#5c5c5c">Full-count cadence</text>

<text x="600" y="576" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">The annual all-night count becomes an afternoon — and then a habit.</text>
</svg>
