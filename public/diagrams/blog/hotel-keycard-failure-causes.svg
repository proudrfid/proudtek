<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hotel key-card failures ranked by real-world frequency</title>
<desc id="d">A horizontal bar ranking of hotel key-card failure causes by their share of lockout complaints at magstripe-heavy properties. Demagnetization is the largest cause at about 45 percent, followed by encoding errors at about 20 percent, expired room assignments at about 15 percent, dirty or damaged readers at about 10 percent, physical card damage at about 8 percent, and lock-side issues at about 2 percent. Demagnetization alone accounts for nearly half the complaints, which is why the durable fix targets it first.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOTEL KEYCARD FAILURES · BY FREQUENCY</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Share of lockout complaints at magstripe-heavy properties.</text>

<line x1="430" y1="120" x2="430" y2="494" stroke="#eadfce" stroke-width="2"/>

<!-- row 1 demagnetization 45% (highlight) -->
<text x="92" y="156" font-size="15.5" font-weight="700" fill="#291c0e">Demagnetization</text>
<rect x="430" y="134" width="660" height="32" rx="7" fill="#c39a5f"/>
<text x="1100" y="157" font-size="14" font-weight="800" fill="#8a6d34">45%</text>

<!-- row 2 encoding errors 20% -->
<text x="92" y="222" font-size="15.5" font-weight="700" fill="#291c0e">Encoding errors</text>
<rect x="430" y="200" width="293" height="32" rx="7" fill="#3d6b6b"/>
<text x="733" y="223" font-size="14" font-weight="800" fill="#2c5454">20%</text>

<!-- row 3 expired room assignment 15% -->
<text x="92" y="288" font-size="15.5" font-weight="700" fill="#291c0e">Expired room assignment</text>
<rect x="430" y="266" width="220" height="32" rx="7" fill="#3d6b6b"/>
<text x="660" y="289" font-size="14" font-weight="800" fill="#2c5454">15%</text>

<!-- row 4 dirty / damaged reader 10% -->
<text x="92" y="354" font-size="15.5" font-weight="700" fill="#291c0e">Dirty / damaged reader</text>
<rect x="430" y="332" width="147" height="32" rx="7" fill="#3d6b6b"/>
<text x="587" y="355" font-size="14" font-weight="800" fill="#2c5454">10%</text>

<!-- row 5 physical card damage 8% -->
<text x="92" y="420" font-size="15.5" font-weight="700" fill="#291c0e">Physical card damage</text>
<rect x="430" y="398" width="117" height="32" rx="7" fill="#3d6b6b"/>
<text x="557" y="421" font-size="14" font-weight="800" fill="#2c5454">8%</text>

<!-- row 6 lock-side issues 2% (steel: not a card fault) -->
<text x="92" y="486" font-size="15.5" font-weight="700" fill="#291c0e">Lock-side issues</text>
<rect x="430" y="464" width="30" height="32" rx="7" fill="#4a5568"/>
<text x="470" y="487" font-size="14" font-weight="800" fill="#4a5568">2%</text>

<text x="600" y="556" text-anchor="middle" font-size="15" fill="#4f4f4f">Demagnetization alone drives nearly half of complaints — which is why the durable fix targets it first, not last.</text>
<text x="600" y="600" text-anchor="middle" font-size="13.5" fill="#8b2d2d">Lock-side issues are rare but high-impact: they are lock failures, not card failures, and escalate differently.</text>
</svg>
