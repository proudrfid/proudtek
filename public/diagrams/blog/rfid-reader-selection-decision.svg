<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Picking a reader — who moves, the reader or the tags?</title>
<desc id="d">Decision diagram. The opening question: does a human hold the reader? Yes leads to desktop or handheld; no leads to a fixed reader. Five use-case cards then map jobs to hardware: card enrollment and personalization takes a USB desktop with CCID and SDK support; hotel front-desk check-in takes a USB desktop in keyboard mode that drops into the PMS with no code; a warehouse inventory audit takes a Bluetooth UHF handheld with a rugged tablet; dock-door receiving takes a fixed UHF reader with four antenna ports and LLRP or MQTT; an access-control turnstile takes a fixed HF/NFC reader with Wiegand or OSDP output. Caption: over-buying a reader piles on cost and integration headaches for features you will never switch on.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PICK ONE · MATCH THE BOX TO THE JOB</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Who moves — the reader or the tags?</text>

<rect x="430" y="132" width="340" height="52" rx="26" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="164" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">Does a human hold the reader?</text>

<path d="M 500 184 C 420 214 360 228 316 244" fill="none" stroke="#4f4f4f" stroke-width="2"/>
<path d="M 316 244 l 12 -8 l -7 12 z" fill="#4f4f4f"/>
<path d="M 700 184 C 780 214 840 228 884 244" fill="none" stroke="#4f4f4f" stroke-width="2"/>
<path d="M 884 244 l -12 -8 l 7 12 z" fill="#4f4f4f"/>

<rect x="170" y="248" width="260" height="40" rx="20" fill="#eaf5ec" stroke="#2d6a4f"/>
<text x="300" y="273" text-anchor="middle" font-size="14" font-weight="700" fill="#1b4332">yes → desktop or handheld</text>
<rect x="790" y="248" width="220" height="40" rx="20" fill="#eef1f5" stroke="#4a5568"/>
<text x="900" y="273" text-anchor="middle" font-size="14" font-weight="700" fill="#4a5568">no → fixed reader</text>

<g>
<rect x="46" y="330" width="340" height="120" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="46" y="330" width="6" height="120" rx="3" fill="#c39a5f"/>
<text x="216" y="364" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Card enrollment, personalization</text>
<text x="216" y="392" text-anchor="middle" font-size="13.5" fill="#4f4f4f">USB desktop · CCID + solid SDK</text>
<text x="216" y="420" text-anchor="middle" font-size="12.5" fill="#6d5a3a">encode, verify, repeat</text>
</g>
<g>
<rect x="430" y="330" width="340" height="120" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="430" y="330" width="6" height="120" rx="3" fill="#c39a5f"/>
<text x="600" y="364" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Hotel front-desk check-in</text>
<text x="600" y="392" text-anchor="middle" font-size="13.5" fill="#4f4f4f">USB desktop · keyboard mode</text>
<text x="600" y="420" text-anchor="middle" font-size="12.5" fill="#6d5a3a">drops into the PMS, no code</text>
</g>
<g>
<rect x="814" y="330" width="340" height="120" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="814" y="330" width="6" height="120" rx="3" fill="#3d6b6b"/>
<text x="984" y="364" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Warehouse inventory audit</text>
<text x="984" y="392" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Bluetooth UHF + rugged tablet</text>
<text x="984" y="420" text-anchor="middle" font-size="12.5" fill="#6d5a3a">walk the aisles, count everything</text>
</g>
<g>
<rect x="238" y="470" width="340" height="120" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="238" y="470" width="6" height="120" rx="3" fill="#4a5568"/>
<text x="408" y="504" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Dock-door receiving</text>
<text x="408" y="532" text-anchor="middle" font-size="13.5" fill="#4f4f4f">fixed UHF · four ports · LLRP / MQTT</text>
<text x="408" y="560" text-anchor="middle" font-size="12.5" fill="#6d5a3a">the Bouncer's home turf</text>
</g>
<g>
<rect x="622" y="470" width="340" height="120" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="622" y="470" width="6" height="120" rx="3" fill="#4a5568"/>
<text x="792" y="504" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Access-control turnstile</text>
<text x="792" y="532" text-anchor="middle" font-size="13.5" fill="#4f4f4f">fixed HF/NFC · Wiegand / OSDP</text>
<text x="792" y="560" text-anchor="middle" font-size="12.5" fill="#6d5a3a">wired to the access panel</text>
</g>

<text x="600" y="634" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Over-buying a reader piles on cost and integration headaches for features you'll never switch on.</text>
</svg>
