<rect x="428" y="344" width="344" height="200" rx="14" fill="#fbf8f1" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="428" y="344" width="6" height="200" rx="3" fill="#4a5568"/>
<text x="454" y="382" font-size="16.5" font-weight="700" fill="#291c0e">FCC Part 15 (FCC ID)</text>
<text x="454" y="408" font-size="13.5" fill="#4f4f4f">US radio approval — UHF tags &amp; readers</text>
