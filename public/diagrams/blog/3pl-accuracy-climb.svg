<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="acTitle acDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="acTitle">Inventory accuracy climbing from 87.1% to 99.2% and holding</title>
  <desc id="acDesc">A line chart of cycle-count-verified inventory accuracy over time. It starts at an 87.1% baseline, climbs past 97% by week 12, reaches 99.2% by week 18, and then holds inside a sustained band of 98.9 to 99.4% through month 12. A brief dip to 98.9% in months 8 to 9 was traced to a forklift knocking a dock antenna out of alignment and fixed in 90 minutes. The service-level floor is 98.9%.</desc>
  <defs>
    <radialGradient id="acBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#acBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="62" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="1.5" fill="#6d5a3a">FROM 87.1% TO 99.2% — AND STAYING THERE</text>

  <!-- gridlines + y labels -->
  <g stroke="#efe6d5" stroke-width="1">
    <line x1="140" y1="140" x2="1120" y2="140"/>
    <line x1="140" y1="190" x2="1120" y2="190"/>
    <line x1="140" y1="240" x2="1120" y2="240"/>
    <line x1="140" y1="290" x2="1120" y2="290"/>
    <line x1="140" y1="340" x2="1120" y2="340"/>
    <line x1="140" y1="390" x2="1120" y2="390"/>
    <line x1="140" y1="440" x2="1120" y2="440"/>
    <line x1="140" y1="490" x2="1120" y2="490"/>
  </g>
  <g font-size="13" fill="#6d5a3a" text-anchor="end">
    <text x="126" y="145">100%</text>
    <text x="126" y="195">98%</text>
    <text x="126" y="245">96%</text>
    <text x="126" y="295">94%</text>
    <text x="126" y="345">92%</text>
    <text x="126" y="395">90%</text>
    <text x="126" y="445">88%</text>
    <text x="126" y="495">86%</text>
  </g>

  <!-- sustained band -->
  <rect x="540" y="155" width="540" height="12.5" fill="#d6f2fb"/>
  <text x="1074" y="150" text-anchor="end" font-size="13" font-weight="700" fill="#177a92">sustained 98.9–99.4%</text>

  <!-- SLA floor -->
  <line x1="140" y1="167.5" x2="1120" y2="167.5" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="146" y="184" font-size="12.5" font-weight="700" fill="#b3261e">SLA floor 98.9%</text>

  <!-- axes -->
  <line x1="140" y1="140" x2="140" y2="490" stroke="#d9cbb0" stroke-width="1.5"/>
  <line x1="140" y1="490" x2="1120" y2="490" stroke="#d9cbb0" stroke-width="1.5"/>

  <!-- climb line -->
  <polyline points="140,463 270,340 400,215 540,160 700,157 850,167 1080,160" fill="none" stroke="#b8873f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- markers -->
  <circle cx="140" cy="463" r="7" fill="#c39a5f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="540" cy="160" r="9" fill="#1fcefb" stroke="#ffffff" stroke-width="3"/>
  <circle cx="850" cy="167" r="6" fill="#b3261e" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1080" cy="160" r="7" fill="#1fcefb" stroke="#ffffff" stroke-width="2"/>

  <!-- baseline callout -->
  <text x="150" y="455" font-size="16" font-weight="800" fill="#291c0e">87.1%</text>
  <text x="150" y="478" font-size="13" fill="#6d5a3a">baseline</text>

  <!-- week 18 callout -->
  <rect x="470" y="96" width="300" height="42" rx="12" fill="#eaf9fe" stroke="#1fcefb" stroke-width="2"/>
  <text x="620" y="123" text-anchor="middle" font-size="16" font-weight="700" fill="#177a92">99.2% by week 18</text>
  <line x1="600" y1="138" x2="546" y2="153" stroke="#1fcefb" stroke-width="2"/>

  <!-- forklift annotation -->
  <text x="850" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b3261e">forklift, mo 8–9</text>
  <text x="850" y="217" text-anchor="middle" font-size="12.5" fill="#6d5a3a">fixed in 90 min</text>

  <!-- x labels -->
  <g font-size="13.5" fill="#6d5a3a" text-anchor="middle">
    <text x="140" y="512">Baseline</text>
    <text x="270" y="512">Wk 6</text>
    <text x="400" y="512">Wk 12</text>
    <text x="540" y="512">Wk 18</text>
    <text x="700" y="512">Mo 6</text>
    <text x="850" y="512">Mo 9</text>
    <text x="1080" y="512">Mo 12</text>
  </g>

  <text x="600" y="556" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">The dip in months 8–9? A forklift met a dock antenna. Ninety minutes later, back on plan.</text>
  <text x="600" y="586" text-anchor="middle" font-size="14" fill="#6d5a3a">Cycle-count verified weekly · baseline measured by quarterly full counts · peak weekly accuracy 99.4%.</text>
</svg>
