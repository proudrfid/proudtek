<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ftTitle ftDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ftTitle">The RFID family tree and where NFC sits</title>
  <desc id="ftDesc">RFID is the parent. It branches into three frequency bands: LF at 125 to 134 kilohertz with 1 to 10 centimetre range for legacy access and pet chips; HF at 13.56 megahertz with 1 to 30 centimetre range for library, transit and payment cards; and UHF at 860 to 960 megahertz with 1 to 15 metre range for inventory and logistics. NFC is a child of HF, sharing the same 13.56 megahertz frequency but restricting range to 1 to 4 centimetres and adding NFC Forum data rules for phones.</desc>
  <defs>
    <radialGradient id="ftBg" cx="50%" cy="18%" r="92%"><stop offset="0%" stop-color="#f8f1e2"/><stop offset="100%" stop-color="#f3eee2"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#ftBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="62" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="1.5" fill="#6d5a3a">THE RFID FAMILY TREE — WHERE NFC ACTUALLY SITS</text>

  <!-- connectors -->
  <path d="M600 182 L600 214 M220 236 L220 214 L980 214 L980 236 M600 214 L600 236" fill="none" stroke="#cdbf9f" stroke-width="2.5"/>
  <path d="M600 402 L600 452" fill="none" stroke="#8fdcf3" stroke-width="3"/>

  <!-- root -->
  <rect x="466" y="104" width="268" height="78" rx="14" fill="#291c0e"/>
  <text x="600" y="140" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">RFID</text>
  <text x="600" y="164" text-anchor="middle" font-size="14" fill="#e4c98f">Radio Frequency Identification</text>

  <!-- LF -->
  <rect x="60" y="236" width="320" height="160" rx="14" fill="#fbf8f2" stroke="#c39a5f" stroke-width="2.5"/>
  <text x="220" y="278" text-anchor="middle" font-size="22" font-weight="800" fill="#291c0e">LF</text>
  <text x="220" y="306" text-anchor="middle" font-size="15.5" fill="#4f4f4f">125–134 kHz</text>
  <rect x="150" y="320" width="140" height="34" rx="17" fill="#f1e6cf" stroke="#c39a5f" stroke-width="1.5"/><text x="220" y="343" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">1–10 cm</text>
  <text x="220" y="378" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Legacy access · pet microchips</text>

  <!-- HF -->
  <rect x="440" y="236" width="320" height="160" rx="14" fill="#fbf8f2" stroke="#3d6b6b" stroke-width="2.5"/>
  <text x="600" y="278" text-anchor="middle" font-size="22" font-weight="800" fill="#291c0e">HF</text>
  <text x="600" y="306" text-anchor="middle" font-size="15.5" fill="#4f4f4f">13.56 MHz</text>
  <rect x="530" y="320" width="140" height="34" rx="17" fill="#e6efef" stroke="#3d6b6b" stroke-width="1.5"/><text x="600" y="343" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">1–30 cm</text>
  <text x="600" y="378" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Library · transit · payment cards</text>

  <!-- UHF -->
  <rect x="820" y="236" width="320" height="160" rx="14" fill="#fbf8f2" stroke="#4a5568" stroke-width="2.5"/>
  <text x="980" y="278" text-anchor="middle" font-size="22" font-weight="800" fill="#291c0e">UHF</text>
  <text x="980" y="306" text-anchor="middle" font-size="15.5" fill="#4f4f4f">860–960 MHz</text>
  <rect x="910" y="320" width="140" height="34" rx="17" fill="#e9eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="980" y="343" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">1–15 m</text>
  <text x="980" y="378" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Inventory · logistics · dock doors</text>

  <!-- NFC child of HF -->
  <rect x="440" y="452" width="320" height="164" rx="14" fill="#e8f9fe" stroke="#1fcefb" stroke-width="3"/>
  <text x="600" y="494" text-anchor="middle" font-size="22" font-weight="800" fill="#0f6d84">NFC</text>
  <text x="600" y="520" text-anchor="middle" font-size="15" fill="#12657a">a child of HF · still 13.56 MHz</text>
  <rect x="530" y="534" width="140" height="34" rx="17" fill="#1fcefb"/><text x="600" y="557" text-anchor="middle" font-size="15" font-weight="800" fill="#08323d">1–4 cm</text>
  <text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#12657a">Adds NFC Forum rules + phone reads</text>

  <text x="785" y="500" font-size="15.5" font-style="italic" fill="#6d5a3a">Same radio as HF —</text>
  <text x="785" y="522" font-size="15.5" font-style="italic" fill="#6d5a3a">NFC just minds its</text>
  <text x="785" y="544" font-size="15.5" font-style="italic" fill="#6d5a3a">manners and its range.</text>
</svg>
