<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The cost split — where UHF and HF budgets actually go</title>
<desc id="d">Two panels compare cost structures with indicative bars. Left, UHF economics: inlays cost $0.05 to $0.15 in 100K-plus volumes (short bar), on-metal variants $0.30 to $2.50 (medium bar), and mobile reading needs a $400 to $1,500 sled reader (long bar) — verdict: millions of disposable units favour UHF. Right, HF/NFC economics: tags cost $0.10 to $0.30 for NTAG21x or MIFARE Classic 1K (short bar), smart-card credentials $0.50 to $2.50 for MIFARE DESFire EV3 (medium bar), and mobile reading is the phone already in the pocket (minimal bar) — verdict: tens of thousands of multi-year credentials favour HF. Footnote: same budget, opposite shapes — UHF spends on read points, HF spends on the tags themselves.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE COST SPLIT</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="31" font-weight="700" fill="#291c0e">Cheap tags meet expensive readers</text>

<rect x="64" y="130" width="520" height="360" rx="16" fill="#f4f6f9" stroke="#4a5568" stroke-width="1.5"/>
<text x="324" y="166" text-anchor="middle" font-size="17" font-weight="800" fill="#4a5568">UHF economics</text>
<text x="104" y="205" font-size="13.5" fill="#4f4f4f">per tag</text>
<rect x="104" y="215" width="60" height="26" rx="5" fill="#4a5568"/>
<text x="174" y="233" font-size="13.5" font-weight="700" fill="#291c0e">$0.05-$0.15 inlay (100K+)</text>
<text x="104" y="272" font-size="13.5" fill="#4f4f4f">on-metal variant</text>
<rect x="104" y="282" width="150" height="26" rx="5" fill="#4a5568"/>
<text x="264" y="300" font-size="13.5" font-weight="700" fill="#291c0e">$0.30-$2.50</text>
<text x="104" y="339" font-size="13.5" fill="#4f4f4f">mobile reading</text>
<rect x="104" y="349" width="260" height="26" rx="5" fill="#4a5568"/>
<text x="374" y="367" font-size="13.5" font-weight="700" fill="#291c0e">$400-$1,500 sled reader</text>
<rect x="104" y="415" width="440" height="40" rx="20" fill="#ffffff" stroke="#4a5568"/>
<text x="324" y="440" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a5568">millions of disposable units → UHF wins</text>

<rect x="616" y="130" width="520" height="360" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="876" y="166" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">HF/NFC economics</text>
<text x="656" y="205" font-size="13.5" fill="#4f4f4f">per tag</text>
<rect x="656" y="215" width="110" height="26" rx="5" fill="#3d6b6b"/>
<text x="776" y="233" font-size="13" font-weight="700" fill="#291c0e">$0.10-$0.30 NTAG21x / Classic 1K</text>
<text x="656" y="272" font-size="13.5" fill="#4f4f4f">smart-card credential</text>
<rect x="656" y="282" width="190" height="26" rx="5" fill="#3d6b6b"/>
<text x="856" y="300" font-size="13" font-weight="700" fill="#291c0e">$0.50-$2.50 MIFARE DESFire EV3</text>
<text x="656" y="339" font-size="13.5" fill="#4f4f4f">mobile reading</text>
<rect x="656" y="349" width="14" height="26" rx="4" fill="#3d6b6b"/>
<text x="680" y="367" font-size="13" font-weight="700" fill="#291c0e">the phone in the pocket — already paid for</text>
<rect x="656" y="415" width="440" height="40" rx="20" fill="#ffffff" stroke="#3d6b6b"/>
<text x="876" y="440" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">tens of thousands of multi-year credentials → HF</text>

<text x="600" y="540" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Same budget, opposite shapes: UHF spends on read points, HF spends on the tags themselves.</text>
<text x="600" y="572" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Price the whole system — tags, readers, middleware, integration, maintenance — before comparing unit prices.</text>
<text x="600" y="618" text-anchor="middle" font-size="12" fill="#5c5c5c">bar lengths indicative, not to scale</text>
</svg>
