<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NFC, AI imaging and human authenticators — the layered defence</title>
<desc id="d">Three cards. NFC chip asks: is this the brand's chip? Cryptographic provenance answered in seconds; chip transplants are what NTAG 424 DNA TT is for. AI imaging asks: do the stitches match? Stitching, hardware and leather grain across 20-plus brands with no per-brand setup, covering the pre-NFC back-catalogue. Human expert asks: and the cases machines can't call? Vintage, disputes and missing chips — someone has to make the call. A flow underneath chains NFC at production, AI at intake, human on flagged items: the strongest platforms run all three at once.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
