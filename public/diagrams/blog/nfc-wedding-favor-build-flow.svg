<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Building an NFC wedding favor in five steps</title>
<desc id="d">A five-step flow on a numbered line. Step one, choose the stickers: NTAG213 white or clear, and order ten to twenty percent extra for testing and errors. Step two, create the content: a photo album, playlist or video, then copy its share URL. Step three, program: use the free NFC Tools app, about five seconds per sticker. Step four, attach and hide: peel, stick to the favor, and tuck the tag under a printed label. Step five, add a cue: a small tap-here card so guests know to interact. A banner notes four steps of prep and one five-second write, then test with a real phone before the day.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FOUR STEPS OF PREP · ONE FIVE-SECOND WRITE</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">How a favor tag actually gets made</text>

<line x1="180" y1="182" x2="1020" y2="182" stroke="#e4c98f" stroke-width="2.5"/>

<circle cx="180" cy="182" r="26" fill="#c39a5f"/>
<text x="180" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
<rect x="80" y="230" width="200" height="176" rx="12" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="180" y="262" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Choose stickers</text>
<text x="180" y="290" text-anchor="middle" font-size="12.5" fill="#4f4f4f">NTAG213, white or clear</text>
<text x="180" y="312" text-anchor="middle" font-size="12.5" fill="#4f4f4f">white hides under a label,</text>
<text x="180" y="334" text-anchor="middle" font-size="12.5" fill="#4f4f4f">clear vanishes on packaging</text>
<text x="180" y="384" text-anchor="middle" font-size="12" font-weight="600" fill="#6d5a3a">order 10–20% extra</text>

<circle cx="390" cy="182" r="26" fill="#c39a5f"/>
<text x="390" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
<rect x="290" y="230" width="200" height="176" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="390" y="262" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Create content</text>
<text x="390" y="290" text-anchor="middle" font-size="12.5" fill="#4f4f4f">photo album, playlist</text>
<text x="390" y="312" text-anchor="middle" font-size="12.5" fill="#4f4f4f">or a video message</text>
<text x="390" y="334" text-anchor="middle" font-size="12.5" fill="#4f4f4f">— then copy its URL</text>
<text x="390" y="384" text-anchor="middle" font-size="12" font-weight="600" fill="#6d5a3a">pick a link that will resolve</text>

<circle cx="600" cy="182" r="26" fill="#c39a5f"/>
<text x="600" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
<rect x="500" y="230" width="200" height="176" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="262" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Program</text>
<text x="600" y="290" text-anchor="middle" font-size="12.5" fill="#4f4f4f">free NFC Tools app,</text>
<text x="600" y="312" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Write → URL, paste,</text>
<text x="600" y="334" text-anchor="middle" font-size="12.5" fill="#4f4f4f">tap each sticker</text>
<text x="600" y="384" text-anchor="middle" font-size="12" font-weight="600" fill="#6d5a3a">about 5 seconds each</text>

<circle cx="810" cy="182" r="26" fill="#c39a5f"/>
<text x="810" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">4</text>
<rect x="710" y="230" width="200" height="176" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="810" y="262" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Attach &amp; hide</text>
<text x="810" y="290" text-anchor="middle" font-size="12.5" fill="#4f4f4f">peel and stick to the</text>
<text x="810" y="312" text-anchor="middle" font-size="12.5" fill="#4f4f4f">favor, then tuck it</text>
<text x="810" y="334" text-anchor="middle" font-size="12.5" fill="#4f4f4f">under a printed label</text>
<text x="810" y="384" text-anchor="middle" font-size="12" font-weight="600" fill="#6d5a3a">keep it off metal &amp; foil</text>

<circle cx="1020" cy="182" r="26" fill="#2d6a4f"/>
<text x="1020" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">5</text>
<rect x="920" y="230" width="200" height="176" rx="12" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="1020" y="262" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1b4332">Add a cue</text>
<text x="1020" y="290" text-anchor="middle" font-size="12.5" fill="#4f4f4f">a small card that says</text>
<text x="1020" y="312" text-anchor="middle" font-size="12.5" fill="#4f4f4f">"Tap here with</text>
<text x="1020" y="334" text-anchor="middle" font-size="12.5" fill="#4f4f4f">your phone"</text>
<text x="1020" y="384" text-anchor="middle" font-size="12" font-weight="600" fill="#1b4332">guests shouldn't guess</text>

<rect x="240" y="452" width="720" height="96" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="492" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="20" font-weight="700" fill="#291c0e">Four steps of prep, one five-second write.</text>
<text x="600" y="522" text-anchor="middle" font-size="14" fill="#4f4f4f">Then tap it with a real phone before the big day — "wrote fine" is not "works".</text>

<text x="600" y="606" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The whole batch takes about as long as addressing the envelopes.</text>
</svg>
