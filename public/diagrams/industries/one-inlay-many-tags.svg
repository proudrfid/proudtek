<text x="430" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">+ face stock</text>
<text x="430" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">+ EPC layout</text>
