<text x="236" y="318" font-size="12.5" fill="#4f4f4f">Smart cards (MIFARE, NTAG)</text>
<text x="566" y="311" font-size="12.5" fill="#291c0e">0% MFN</text>
<text x="566" y="330" font-size="12.5" font-weight="800" fill="#8b2d2d">+25% §301 = 25%</text>
<text x="832" y="318" font-size="13" font-weight="700" fill="#2d6a4f">0%</text>
<text x="966" y="318" font-size="12.5" font-weight="700" fill="#2d6a4f">MX / VN 0%</text>
<text x="96" y="374" font-size="14" font-weight="800" fill="#291c0e">8543.70</text>
<text x="236" y="374" font-size="12.5" fill="#4f4f4f">Readers, encoders, active tags</text>
<text x="566" y="367" font-size="12.5" fill="#291c0e">2.6% MFN</text>
<text x="566" y="386" font-size="12.5" font-weight="800" fill="#8b2d2d">+25% §301 = 27.6%</text>
<text x="832" y="374" font-size="13" font-weight="700" fill="#291c0e">3.7%</text>
<text x="966" y="374" font-size="12.5" fill="#8a8172">—</text>
