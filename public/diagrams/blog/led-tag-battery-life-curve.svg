<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">LED tag battery life against activation frequency on a CR2032 cell</title>
<desc id="d">A months-in-service scale runs from 0 to 48 months. Two bars show battery life on a single CR2032 cell. The upper bar, a moderate environment at 20 activations per day, reaches 2 to 4 years, with a marker at the 24-month low end. The lower bar, a high-frequency environment at 50-plus activations per day, reaches only 12 to 18 months. A note explains that a battery-low flag in the RFID response allows on-condition replacement, and a tool-free snap-open housing makes each swap take 10 to 20 seconds. Header note: one CR2032 holds 200 to 300 milliamp-hours and each 15-second flash costs about 0.01 to 0.02 milliamp-hours.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW LONG THE CELL LASTS</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">One CR2032 (200-300 mAh); each 15-second flash costs about 0.01-0.02 mAh.</text>

<!-- axis -->
<line x1="220" y1="430" x2="1090" y2="430" stroke="#c9c1b2" stroke-width="2"/>
<line x1="220" y1="200" x2="220" y2="430" stroke="#c9c1b2" stroke-width="2"/>
<line x1="440" y1="425" x2="440" y2="435" stroke="#c9c1b2" stroke-width="2"/>
<line x1="660" y1="425" x2="660" y2="435" stroke="#c9c1b2" stroke-width="2"/>
<line x1="880" y1="425" x2="880" y2="435" stroke="#c9c1b2" stroke-width="2"/>
<line x1="1090" y1="425" x2="1090" y2="435" stroke="#c9c1b2" stroke-width="2"/>
<text x="220" y="454" text-anchor="middle" font-size="12.5" fill="#8a8a8a">0</text>
<text x="440" y="454" text-anchor="middle" font-size="12.5" fill="#8a8a8a">12</text>
<text x="660" y="454" text-anchor="middle" font-size="12.5" fill="#8a8a8a">24</text>
<text x="880" y="454" text-anchor="middle" font-size="12.5" fill="#8a8a8a">36</text>
<text x="1085" y="454" text-anchor="middle" font-size="12.5" fill="#8a8a8a">48</text>
<text x="655" y="480" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.5" fill="#8a8a8a">MONTHS IN SERVICE</text>

<!-- Row A: 20/day -> 2-4 years (24-48 mo) -->
<rect x="112" y="236" width="70" height="46" rx="6" fill="#eef7f0" stroke="#1f6f3a" stroke-width="2.2"/>
<rect x="182" y="250" width="8" height="18" rx="2" fill="#1f6f3a"/>
<text x="147" y="264" text-anchor="middle" font-size="12" font-weight="800" fill="#1f6f3a">20/day</text>
<rect x="220" y="236" width="870" height="46" rx="6" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.4"/>
<rect x="220" y="236" width="440" height="46" rx="6" fill="#cfe7d7"/>
<line x1="660" y1="230" x2="660" y2="288" stroke="#1f6f3a" stroke-width="2.4" stroke-dasharray="5 4"/>
<text x="875" y="266" text-anchor="middle" font-size="17" font-weight="800" fill="#1f6f3a">2-4 years</text>
<text x="300" y="222" font-size="13" fill="#5c9a6f">moderate pick frequency</text>

<!-- Row B: 50+/day -> 12-18 months -->
<rect x="112" y="330" width="70" height="46" rx="6" fill="#fff3d6" stroke="#c39a5f" stroke-width="2.2"/>
<rect x="182" y="344" width="8" height="18" rx="2" fill="#c39a5f"/>
<text x="147" y="358" text-anchor="middle" font-size="12" font-weight="800" fill="#a07d43">50+/day</text>
<rect x="220" y="330" width="330" height="46" rx="6" fill="#f0c96f" stroke="#c39a5f" stroke-width="1.6"/>
<line x1="440" y1="324" x2="440" y2="382" stroke="#a07d43" stroke-width="2.4" stroke-dasharray="5 4"/>
<text x="640" y="360" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">12-18 months</text>
<text x="300" y="316" font-size="13" fill="#a07d43">high-frequency zone</text>

<!-- note box -->
<rect x="220" y="506" width="870" height="66" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="244" y="536" font-size="14.5" font-weight="800" fill="#2c5454">Don't guess — read the battery-low flag.</text>
<text x="244" y="558" font-size="13.5" fill="#33595a">Most tags expose it in the RFID response, so you swap on-condition; a tool-free housing takes 10-20 s per tag.</text>

<text x="600" y="612" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Boring — right up until a whole facility's worth of cells comes due in the same month.</text>
</svg>
