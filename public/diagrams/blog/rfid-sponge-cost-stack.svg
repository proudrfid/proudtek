<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The cost stack of an RFID sponge-counting program</title>
<desc id="d">Four cost components. The tagged-sponge premium is 0.50 to 1.50 dollars per sponge versus 0.10 to 0.30 for standard, across eight to fifteen sponges per case, adding four to fifteen dollars per case. Scanner hardware is five to twenty-five thousand dollars per scanner, one per two to four operating rooms. Software and integration is a twenty to one hundred thousand dollar one-time cost. Staff training is four to eight hours per operating-room staff member. All in, the program runs five to fifteen dollars per case, and fifty to three hundred thousand dollars in the first year for a ten-OR hospital, dropping to thirty to one hundred fifty thousand per year ongoing.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE THE $5-15 PER CASE GOES</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Four components, from the per-sponge premium to first-year program cost.</text>

<!-- row 1 -->
<rect x="80" y="130" width="1040" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="80" y="130" width="8" height="76" rx="4" fill="#3d6b6b"/>
<text x="112" y="164" font-size="15.5" font-weight="800" fill="#291c0e">Tagged sponge premium</text>
<text x="112" y="188" font-size="12.5" fill="#5c5c5c">$0.50-1.50 per sponge vs $0.10-0.30 standard · 8-15 sponges per case</text>
<rect x="912" y="149" width="190" height="38" rx="19" fill="#eef5f5" stroke="#2c5454" stroke-width="1.4"/>
<text x="1007" y="174" text-anchor="middle" font-size="14.5" font-weight="800" fill="#2c5454">+$4-15 / case</text>

<!-- row 2 -->
<rect x="80" y="222" width="1040" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="80" y="222" width="8" height="76" rx="4" fill="#4a5568"/>
<text x="112" y="256" font-size="15.5" font-weight="800" fill="#291c0e">Scanner hardware</text>
<text x="112" y="280" font-size="12.5" fill="#5c5c5c">$5K-25K per scanner · typically 1 scanner per 2-4 ORs</text>
<rect x="912" y="241" width="190" height="38" rx="19" fill="#eef1f5" stroke="#4a5568" stroke-width="1.4"/>
<text x="1007" y="266" text-anchor="middle" font-size="14.5" font-weight="800" fill="#3f4a5c">$5K-25K each</text>

<!-- row 3 -->
<rect x="80" y="314" width="1040" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="80" y="314" width="8" height="76" rx="4" fill="#4a5568"/>
<text x="112" y="348" font-size="15.5" font-weight="800" fill="#291c0e">Software &amp; integration</text>
<text x="112" y="372" font-size="12.5" fill="#5c5c5c">One-time OR integration; minimal ongoing licence cost</text>
<rect x="912" y="333" width="190" height="38" rx="19" fill="#eef1f5" stroke="#4a5568" stroke-width="1.4"/>
<text x="1007" y="358" text-anchor="middle" font-size="14.5" font-weight="800" fill="#3f4a5c">$20K-100K once</text>

<!-- row 4 -->
<rect x="80" y="406" width="1040" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="80" y="406" width="8" height="76" rx="4" fill="#4a5568"/>
<text x="112" y="440" font-size="15.5" font-weight="800" fill="#291c0e">Staff training</text>
<text x="112" y="464" font-size="12.5" fill="#5c5c5c">4-8 hours per OR staff member, plus periodic refresh</text>
<rect x="912" y="425" width="190" height="38" rx="19" fill="#eef1f5" stroke="#4a5568" stroke-width="1.4"/>
<text x="1007" y="450" text-anchor="middle" font-size="14.5" font-weight="800" fill="#3f4a5c">4-8 hrs / person</text>

<!-- summary -->
<rect x="80" y="502" width="510" height="72" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="112" y="532" font-size="13" font-weight="700" letter-spacing="0.5" fill="#2c5454">PER CASE, ALL-IN</text>
<text x="112" y="558" font-size="19" font-weight="800" fill="#2c5454">$5-15</text>
<text x="300" y="558" font-size="12.5" fill="#5c5c5c">every RFID-counted procedure</text>

<rect x="610" y="502" width="510" height="72" rx="12" fill="#f4f6f8" stroke="#4a5568" stroke-width="2"/>
<text x="642" y="532" font-size="13" font-weight="700" letter-spacing="0.5" fill="#3f4a5c">FIRST YEAR · 10-OR HOSPITAL</text>
<text x="642" y="558" font-size="17" font-weight="800" fill="#3f4a5c">$50K-300K</text>
<text x="812" y="558" font-size="12.5" fill="#5c5c5c">→ $30K-150K / yr ongoing</text>
</svg>
