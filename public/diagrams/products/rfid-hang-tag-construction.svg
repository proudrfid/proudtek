<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Anatomy of a UHF RFID hang tag</title>
  <desc id="d">A printed apparel swing tag shown flat: a coated-paper, polyester or PVC card with a hole punch and string loop on the left, a source-printed brand / size / price / barcode print zone, and a UHF Gen2v2 inlay on the right — an aluminium or copper dipole antenna tuned 860-960 MHz carrying a GS1 SGTIN-96 on an Impinj M730 / M750 / M800, NXP UCODE 9 or Alien Higgs-9 chip. Callouts label the face stock, print zone, UHF inlay and string loop. A band notes the SGTIN is encoded and permalocked at source with the factory TID left read-only. Three card formats are shown: coated-paper swing tag, polyester or PVC card, and a dual-tech UHF plus EAS card carrying an AM 58 kHz or RF 8.2 MHz element.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANATOMY OF A UHF RFID HANG TAG</text>
  <text x="600" y="82" text-anchor="middle" font-size="15" fill="#5c5c5c">A printed swing card, a UHF inlay, and the loop that rides the rack</text>

  <!-- card body -->
  <rect x="210" y="112" width="780" height="170" rx="16" fill="#fdfaf3" stroke="#d8cdb8" stroke-width="2"/>
  <!-- string loop + punched hole -->
  <ellipse cx="246" cy="150" rx="26" ry="15" fill="none" stroke="#6d5a3a" stroke-width="3"/>
  <circle cx="262" cy="171" r="11" fill="url(#bg)" stroke="#a99a7d" stroke-width="2"/>
  <!-- print zone -->
  <rect x="300" y="140" width="300" height="114" rx="8" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.8"/>
  <text x="318" y="176" font-size="20" font-weight="800" fill="#291c0e">BRAND</text>
  <text x="318" y="200" font-size="13.5" fill="#5c5c5c">Style · Size · Price</text>
  <rect x="318" y="212" width="4" height="30" fill="#291c0e"/>
  <rect x="326" y="212" width="2" height="30" fill="#291c0e"/>
  <rect x="332" y="212" width="6" height="30" fill="#291c0e"/>
  <rect x="342" y="212" width="3" height="30" fill="#291c0e"/>
  <rect x="349" y="212" width="5" height="30" fill="#291c0e"/>
  <rect x="358" y="212" width="2" height="30" fill="#291c0e"/>
  <rect x="364" y="212" width="6" height="30" fill="#291c0e"/>
  <rect x="374" y="212" width="3" height="30" fill="#291c0e"/>
  <rect x="381" y="212" width="4" height="30" fill="#291c0e"/>
  <text x="398" y="234" font-size="12" fill="#5c5c5c">SGTIN-96 barcode</text>

  <!-- UHF inlay region -->
  <rect x="640" y="150" width="320" height="94" rx="8" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <rect x="662" y="191" width="104" height="12" rx="3" fill="#4a5568"/>
  <rect x="662" y="178" width="10" height="38" fill="#4a5568"/>
  <rect x="708" y="178" width="10" height="38" fill="#4a5568"/>
  <rect x="754" y="178" width="10" height="38" fill="#4a5568"/>
  <rect x="834" y="191" width="104" height="12" rx="3" fill="#4a5568"/>
  <rect x="834" y="178" width="10" height="38" fill="#4a5568"/>
  <rect x="880" y="178" width="10" height="38" fill="#4a5568"/>
  <rect x="926" y="178" width="10" height="38" fill="#4a5568"/>
  <rect x="772" y="182" width="56" height="30" rx="5" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.5"/>
  <rect x="789" y="187" width="22" height="20" rx="3" fill="#3d6b6b"/>

  <!-- callouts -->
  <text x="60" y="330" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">FACE STOCK</text>
  <text x="60" y="352" font-size="13" fill="#5c5c5c">Coated paper · polyester · PVC</text>

  <text x="330" y="330" font-size="15" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">PRINT ZONE — 30 × 40 mm</text>
  <text x="330" y="352" font-size="13" fill="#5c5c5c">Brand · size · price · barcode</text>

  <text x="640" y="330" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">UHF INLAY</text>
  <text x="640" y="352" font-size="13" fill="#5c5c5c">Al / Cu dipole · 860-960 MHz</text>

  <text x="905" y="330" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">STRING LOOP</text>
  <text x="905" y="352" font-size="13" fill="#5c5c5c">Ø 4-6 mm punch · swiftach</text>

  <!-- encode band -->
  <rect x="56" y="392" width="1088" height="62" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
  <text x="600" y="422" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">GS1 EPC Gen2v2 · SGTIN-96 encoded and permalocked at source</text>
  <text x="600" y="442" text-anchor="middle" font-size="13" fill="#5c5c5c">Chip: Impinj M730 / M750 / M800 · NXP UCODE 9 · Alien Higgs-9 — factory TID left read-only</text>

  <!-- format cards -->
  <text x="600" y="486" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THREE CARD FORMATS</text>
  <rect x="150" y="500" width="290" height="96" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="170" y="532" font-size="16" font-weight="700" fill="#291c0e">Coated-paper swing tag</text>
  <text x="170" y="556" font-size="13" fill="#5c5c5c">FSC / PEFC · recyclable fibre</text>
  <text x="170" y="576" font-size="13" fill="#5c5c5c">stream in separated MRFs</text>

  <rect x="455" y="500" width="290" height="96" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="475" y="532" font-size="16" font-weight="700" fill="#291c0e">Polyester / PVC card</text>
  <text x="475" y="556" font-size="13" fill="#5c5c5c">Small-footprint ≤ 30 × 15 mm</text>
  <text x="475" y="576" font-size="13" fill="#5c5c5c">for footwear / jewellery</text>

  <rect x="760" y="500" width="290" height="96" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="780" y="532" font-size="16" font-weight="700" fill="#291c0e">Dual-tech UHF + EAS</text>
  <text x="780" y="556" font-size="13" fill="#5c5c5c">AM 58 kHz / RF 8.2 MHz element</text>
  <text x="780" y="576" font-size="13" fill="#5c5c5c">bridges legacy pedestals</text>

  <text x="600" y="628" text-anchor="middle" font-size="13.5" fill="#5c5c5c">40-80 mm × 20-40 mm card, 0.3-0.8 mm thick — brand printed and the SGTIN encoded in one pass.</text>
</svg>
