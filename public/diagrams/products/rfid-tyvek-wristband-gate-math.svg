<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Sizes, backer cards and the gate-lane arithmetic</title>
  <desc id="d">Size panel: adult 250 by 19-25 mm, child 175 by 16 mm, with a backer-card option that ships each wristband mounted for box-office handout. Gate panel: NFC tap entry runs at materially higher per-lane throughput than barcode scanning, and UID pre-encoding maps bands to Eventbrite, Universe, ShowClix or Festicket tickets.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Two sizes, one backer card, faster lanes</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">The operational kit around the band matters as much as the band</text>
  <g transform="translate(70,150)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="520" height="300 " rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="17" fill="#2c5454">Sizes + handout kit</text>
    <rect x="24" y="60" width="470" height="34" rx="17" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2"/>
    <text x="36" y="82" font-size="13" fill="#2c5454">adult 250 mm × 19-25 mm</text>
    <rect x="24" y="106" width="330" height="28" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="36" y="125" font-size="13" fill="#2c5454">child 175 mm × 16 mm</text>
    <rect x="24" y="156" width="200" height="120" rx="8" fill="#fdf3e3" stroke="#c39a5f" stroke-width="2"/>
    <rect x="44" y="196" width="160" height="26" rx="13" fill="#ffffff" stroke="#3d6b6b"/>
    <text x="52" y="252" font-size="12" fill="#6d5a3a">backer-card mount</text>
    <text x="248" y="200" font-size="13" fill="#6d5a3a">one-day backer-card option:</text>
    <text x="248" y="222" font-size="13" fill="#6d5a3a">band ships mounted, ready for</text>
    <text x="248" y="244" font-size="13" fill="#6d5a3a">box-office handout</text>
  </g>
  <g transform="translate(640,150)">
    <rect x="0" y="0" width="490" height="300" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="17" fill="#291c0e">Gate-lane arithmetic</text>
    <text x="24" y="76" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">NFC tap entry &gt; barcode scan on</text>
    <text x="24" y="98" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">per-lane throughput — no aiming,</text>
    <text x="24" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">no screen-brightness roulette</text>
    <line x1="24" y1="146" x2="466" y2="146" stroke="#d8cdb8" stroke-width="1.5"/>
    <text x="24" y="178" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">UID pre-encoded to your ticketing platform:</text>
    <text x="24" y="204" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">Eventbrite · Universe · ShowClix · Festicket</text>
    <text x="24" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Cashless option: MIFARE Ultralight C —</text>
    <text x="24" y="262" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">3DES mutual auth (NIST SP 800-67 TDEA)</text>
  </g>
</svg>
