<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Four published warehouse RFID accuracy benchmarks with their sources</title>
<desc id="d">A two-by-two grid of citable accuracy benchmarks. Project Zipper from the Auburn RFID Lab: receiving-order inaccuracy fell from 69 percent of orders under legacy UPC to under 0.01 percent with EPC RFID. GS1 US baseline: inventory accuracy rose from a 63 percent manual count to about 95 percent with item-level RFID. Industry deployment data from rfidtaghy 2026: 99.7 to 99.95 percent real-time inventory accuracy in engineered UHF systems. SLS D-Series spec sheet: 99.99 percent dock-door portal scan-rate accuracy.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ACCURACY BENCHMARKS YOU CAN CITE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Four published numbers to put in front of finance or a customer SLA.</text>

<!-- CARD A · Project Zipper (teal) -->
<rect x="70" y="150" width="508" height="228" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="70" y="150" width="508" height="8" rx="4" fill="#3d6b6b"/>
<text x="98" y="192" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">PROJECT ZIPPER</text>
<text x="98" y="244" font-size="34" font-weight="800" fill="#4a5568" font-family="Lora, Georgia, serif">69%</text>
<line x1="176" y1="234" x2="212" y2="234" stroke="#291c0e" stroke-width="3"/>
<polygon points="212,228 228,234 212,240" fill="#291c0e"/>
<text x="242" y="244" font-size="34" font-weight="800" fill="#1f6f3a" font-family="Lora, Georgia, serif">&lt;0.01%</text>
<text x="98" y="280" font-size="13.5" fill="#5c5c5c">Receiving-order inaccuracy,</text>
<text x="98" y="300" font-size="13.5" fill="#5c5c5c">legacy UPC vs EPC/RFID audits</text>
<rect x="98" y="322" width="12" height="12" rx="3" fill="#3d6b6b"/>
<text x="120" y="332" font-size="12" fill="#8a8a8a">Auburn RFID Lab · 8 brands, 5 retailers, 10 months</text>

<!-- CARD B · GS1 US (steel) -->
<rect x="622" y="150" width="508" height="228" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="622" y="150" width="508" height="8" rx="4" fill="#4a5568"/>
<text x="650" y="192" font-size="13" font-weight="800" letter-spacing="0.5" fill="#3a4453">GS1 US BASELINE</text>
<text x="650" y="244" font-size="34" font-weight="800" fill="#4a5568" font-family="Lora, Georgia, serif">63%</text>
<line x1="728" y1="234" x2="764" y2="234" stroke="#291c0e" stroke-width="3"/>
<polygon points="764,228 780,234 764,240" fill="#291c0e"/>
<text x="794" y="244" font-size="34" font-weight="800" fill="#1f6f3a" font-family="Lora, Georgia, serif">~95%</text>
<text x="650" y="280" font-size="13.5" fill="#5c5c5c">Inventory accuracy, manual</text>
<text x="650" y="300" font-size="13.5" fill="#5c5c5c">count vs item-level RFID</text>
<rect x="650" y="322" width="12" height="12" rx="3" fill="#4a5568"/>
<text x="672" y="332" font-size="12" fill="#8a8a8a">GS1 US · cited in the Walmart RFID supplier program</text>

<!-- CARD C · rfidtaghy (gold) -->
<rect x="70" y="402" width="508" height="228" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="70" y="402" width="508" height="8" rx="4" fill="#c39a5f"/>
<text x="98" y="444" font-size="13" font-weight="800" letter-spacing="0.5" fill="#a07d43">ENGINEERED UHF SYSTEMS</text>
<text x="98" y="498" font-size="32" font-weight="800" fill="#a07d43" font-family="Lora, Georgia, serif">99.7-99.95%</text>
<text x="98" y="532" font-size="13.5" fill="#5c5c5c">Real-time inventory accuracy</text>
<text x="98" y="552" font-size="13.5" fill="#5c5c5c">reported by properly-tuned sites</text>
<rect x="98" y="574" width="12" height="12" rx="3" fill="#c39a5f"/>
<text x="120" y="584" font-size="12" fill="#8a8a8a">Industry deployment data · rfidtaghy, 2026</text>

<!-- CARD D · SLS D-Series (green) -->
<rect x="622" y="402" width="508" height="228" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="622" y="402" width="508" height="8" rx="4" fill="#1f6f3a"/>
<text x="650" y="444" font-size="13" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">DOCK-DOOR PORTAL</text>
<text x="650" y="498" font-size="34" font-weight="800" fill="#1f6f3a" font-family="Lora, Georgia, serif">99.99%</text>
<text x="650" y="532" font-size="13.5" fill="#5c5c5c">Scan-rate accuracy,</text>
<text x="650" y="552" font-size="13.5" fill="#5c5c5c">PoE-only install</text>
<rect x="650" y="574" width="12" height="12" rx="3" fill="#1f6f3a"/>
<text x="672" y="584" font-size="12" fill="#8a8a8a">SLS D-Series spec sheet</text>
</svg>
