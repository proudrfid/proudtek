<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="lmTitle lmDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="lmTitle">RFID laundry management across the industrial wash cycle</title>
  <desc id="lmDesc">An industrial laundry operating on one RFID thread. Smart reading stations at soiled intake, sort-and-count and dispatch feed a management and data layer above — device management, ERP / EPCIS 2.0 integration and live KPI dashboards. Between the read points sit the tunnel washer and the finishing line, where the tags survive 200+ cycles. Outcomes: item-level visibility at every phase, 20–40% less linen loss, automated par-stock and cycle-count retirement.</desc>

  <defs>
    <radialGradient id="lmGlow" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="lmUp" markerWidth="9" markerHeight="9" refX="4.5" refY="1.5" orient="auto">
      <path d="M4.5 0 L9 6 L0 6 Z" fill="#c39a5f"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#lmGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <!-- Eyebrow -->
  <text x="600" y="72" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2.5" fill="#6d5a3a">RFID READING STATIONS ACROSS THE INDUSTRIAL WASH CYCLE</text>

  <!-- ===================== Management & data layer ===================== -->
  <rect x="72" y="96" width="1056" height="104" rx="16" fill="#f1f5f5" stroke="#b9cfcf" stroke-width="2"/>
  <text x="96" y="133" font-size="15" font-weight="700" letter-spacing="1.5" fill="#3d6b6b">MANAGEMENT &amp; DATA LAYER</text>
  <text x="96" y="162" font-size="14.5" fill="#4a5568">Device mgmt · ERP / EPCIS 2.0 · KPI dashboards</text>
  <!-- KPI chips -->
  <g font-size="13.5" font-weight="600" fill="#2c5454" text-anchor="middle">
    <rect x="482" y="124" width="196" height="48" rx="10" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
    <text x="580" y="153">Item-level visibility</text>
    <rect x="690" y="124" width="196" height="48" rx="10" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
    <text x="788" y="153">Linen loss −20–40%</text>
    <rect x="898" y="124" width="214" height="48" rx="10" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
    <text x="1005" y="153">Auto par-stock + retire</text>
  </g>

  <!-- Data lines rising from the three read stations into the management band -->
  <g stroke="#c39a5f" stroke-width="2" stroke-dasharray="4 5" opacity="0.75" marker-end="url(#lmUp)">
    <line x1="166" y1="300" x2="166" y2="204"/>
    <line x1="383" y1="300" x2="383" y2="204"/>
    <line x1="1034" y1="300" x2="1034" y2="204"/>
  </g>
  <g fill="#c39a5f">
    <circle cx="166" cy="300" r="3.5"/>
    <circle cx="383" cy="300" r="3.5"/>
    <circle cx="1034" cy="300" r="3.5"/>
  </g>

  <!-- ===================== Conveyor + flow chevrons ===================== -->
  <g stroke="#c39a5f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M268 398 l12 9 l-12 9"/>
    <path d="M485 398 l12 9 l-12 9"/>
    <path d="M702 398 l12 9 l-12 9"/>
    <path d="M919 398 l12 9 l-12 9"/>
  </g>

  <!-- ===================== Stations ===================== -->
  <!-- reusable station card frame drawn per station -->

  <!-- Station 1: SOILED INTAKE (read) -->
  <g>
    <rect x="72" y="300" width="188" height="210" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <!-- laundry cart -->
    <path d="M132 358 h68 l-8 46 h-52 z" fill="none" stroke="#c39a5f" stroke-width="4" stroke-linejoin="round"/>
    <line x1="140" y1="372" x2="192" y2="372" stroke="#c39a5f" stroke-width="3"/>
    <circle cx="146" cy="416" r="6" fill="#c39a5f"/>
    <circle cx="186" cy="416" r="6" fill="#c39a5f"/>
    <!-- RFID read arcs (cyan) -->
    <g fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round">
      <path d="M206 350 a16 16 0 0 1 0 26"/>
      <path d="M214 344 a26 26 0 0 1 0 38"/>
    </g>
    <circle cx="201" cy="363" r="3.5" fill="#1fcefb"/>
    <text x="166" y="462" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">SOILED INTAKE</text>
    <text x="166" y="486" text-anchor="middle" font-size="12.5" fill="#6d5a3a">RFID cart · read-in count</text>
  </g>

  <!-- Station 2: SORT &amp; COUNT (read) -->
  <g>
    <rect x="289" y="300" width="188" height="210" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <!-- portal frame -->
    <path d="M347 408 v-52 h72 v52" fill="none" stroke="#c39a5f" stroke-width="4" stroke-linejoin="round"/>
    <rect x="360" y="402" width="46" height="10" rx="2" fill="#c39a5f"/>
    <!-- items on belt -->
    <rect x="352" y="416" width="62" height="7" rx="3" fill="#4a5568"/>
    <!-- RFID read arcs -->
    <g fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round">
      <path d="M383 338 a16 16 0 0 1 26 0"/>
      <path d="M377 330 a26 26 0 0 1 38 0"/>
    </g>
    <circle cx="396" cy="345" r="3.5" fill="#1fcefb"/>
    <text x="383" y="462" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">SORT &amp; COUNT</text>
    <text x="383" y="486" text-anchor="middle" font-size="12.5" fill="#6d5a3a">reconcile · route by client</text>
  </g>

  <!-- Station 3: TUNNEL WASH (process) -->
  <g>
    <rect x="506" y="300" width="188" height="210" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <!-- tunnel washer: horizontal cylinder with segments -->
    <rect x="544" y="356" width="112" height="52" rx="14" fill="none" stroke="#4a5568" stroke-width="4"/>
    <line x1="581" y1="356" x2="581" y2="408" stroke="#4a5568" stroke-width="3"/>
    <line x1="618" y1="356" x2="618" y2="408" stroke="#4a5568" stroke-width="3"/>
    <circle cx="562" cy="382" r="7" fill="#4a5568"/>
    <circle cx="600" cy="382" r="7" fill="#4a5568"/>
    <circle cx="638" cy="382" r="7" fill="#4a5568"/>
    <text x="600" y="462" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">TUNNEL WASH</text>
    <text x="600" y="486" text-anchor="middle" font-size="12.5" fill="#6d5a3a">tags survive 200+ cycles</text>
  </g>

  <!-- Station 4: FINISH &amp; FOLD (process) -->
  <g>
    <rect x="723" y="300" width="188" height="210" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <!-- ironer rollers -->
    <circle cx="784" cy="384" r="20" fill="none" stroke="#4a5568" stroke-width="4"/>
    <circle cx="832" cy="384" r="20" fill="none" stroke="#4a5568" stroke-width="4"/>
    <path d="M756 384 h96" stroke="#4a5568" stroke-width="3"/>
    <path d="M760 360 q52 -16 92 0" fill="none" stroke="#c39a5f" stroke-width="3.5"/>
    <text x="817" y="462" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">FINISH &amp; FOLD</text>
    <text x="817" y="486" text-anchor="middle" font-size="12.5" fill="#6d5a3a">ironer · finisher · fold</text>
  </g>

  <!-- Station 5: DISPATCH (read) -->
  <g>
    <rect x="940" y="300" width="188" height="210" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <!-- outbound portal + arrow -->
    <path d="M999 408 v-52 h72 v52" fill="none" stroke="#c39a5f" stroke-width="4" stroke-linejoin="round"/>
    <line x1="1010" y1="392" x2="1058" y2="392" stroke="#c39a5f" stroke-width="4" stroke-linecap="round"/>
    <path d="M1050 384 l10 8 l-10 8" fill="none" stroke="#c39a5f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- RFID read arcs -->
    <g fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round">
      <path d="M1034 338 a16 16 0 0 1 26 0"/>
      <path d="M1028 330 a26 26 0 0 1 38 0"/>
    </g>
    <circle cx="1047" cy="345" r="3.5" fill="#1fcefb"/>
    <text x="1034" y="462" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">DISPATCH</text>
    <text x="1034" y="486" text-anchor="middle" font-size="12.5" fill="#6d5a3a">outbound count · par-stock</text>
  </g>

  <!-- Sequence badges straddling each card top -->
  <g font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">
    <circle cx="166" cy="300" r="17" fill="#c39a5f" stroke="#ffffff" stroke-width="2.5"/><text x="166" y="305.5">1</text>
    <circle cx="383" cy="300" r="17" fill="#c39a5f" stroke="#ffffff" stroke-width="2.5"/><text x="383" y="305.5">2</text>
    <circle cx="600" cy="300" r="17" fill="#c39a5f" stroke="#ffffff" stroke-width="2.5"/><text x="600" y="305.5">3</text>
    <circle cx="817" cy="300" r="17" fill="#c39a5f" stroke="#ffffff" stroke-width="2.5"/><text x="817" y="305.5">4</text>
    <circle cx="1034" cy="300" r="17" fill="#c39a5f" stroke="#ffffff" stroke-width="2.5"/><text x="1034" y="305.5">5</text>
  </g>

  <!-- Bottom caption -->
  <text x="600" y="548" text-anchor="middle" font-size="16" fill="#6d5a3a">Every textile read hands-free at each station — counted, sorted and tracked to par-stock, no bag opened.</text>

  <!-- RFID READ legend pill -->
  <g>
    <rect x="522" y="568" width="156" height="30" rx="15" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.5"/>
    <circle cx="545" cy="583" r="4" fill="#1fcefb"/>
    <path d="M555 583 a7 7 0 0 1 12 0" fill="none" stroke="#1fcefb" stroke-width="2.5" stroke-linecap="round"/>
    <text x="579" y="588" font-size="12.5" font-weight="600" fill="#177a92">RFID read point</text>
  </g>
</svg>
