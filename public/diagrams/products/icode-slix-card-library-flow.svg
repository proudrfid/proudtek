<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Library self-service loop — ISO 28560 data model and the EAS bit</title>
  <desc id="d">Check-out at the self-service kiosk clears the EAS bit so the gate stays quiet; check-in sets it again. ISO 28560-2 defines the data elements — primary item identifier, set information, type of usage — and AFI 0x07 marks the library family, pre-written at the factory.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">One bit runs the exit gate</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Check-out clears EAS, check-in sets it — no separate EM or acousto-magnetic strip</text>
  <g transform="translate(70,160)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="40" width="250" height="120" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="80" font-family="Georgia, serif" font-size="17" fill="#291c0e">Self check-out</text>
    <text x="24" y="108" font-size="13" fill="#2c5454">EAS bit cleared</text>
    <text x="24" y="130" font-size="13" fill="#6d5a3a">gate stays quiet</text>
    <rect x="330" y="40" width="250" height="120" rx="12" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2"/>
    <text x="354" y="80" font-family="Georgia, serif" font-size="17" fill="#2c5454">Exit gate</text>
    <text x="354" y="108" font-size="13" fill="#2c5454">alarms only when EAS set</text>
    <text x="354" y="130" font-size="13" fill="#6d5a3a">15693 read at the door</text>
    <rect x="660" y="40" width="250" height="120" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="684" y="80" font-family="Georgia, serif" font-size="17" fill="#291c0e">Check-in / return</text>
    <text x="684" y="108" font-size="13" fill="#2c5454">EAS bit set again</text>
    <text x="684" y="130" font-size="13" fill="#6d5a3a">back on the shelf, armed</text>
    <path d="M 255 100 L 325 100" stroke="#6d5a3a" stroke-width="2.5" marker-end="url(#a4)"/>
    <path d="M 585 100 L 655 100" stroke="#6d5a3a" stroke-width="2.5" marker-end="url(#a4)"/>
    <defs><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d5a3a"/></marker></defs>
  </g>
  <g transform="translate(70,380)">
    <rect x="0" y="0" width="1040" height="180" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="26" y="40" font-family="Georgia, serif" font-size="18" fill="#2c5454">The data model underneath (ISO 28560-2)</text>
    <text x="26" y="74" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Primary item identifier · set information · type of usage — laid out block by block</text>
    <text x="26" y="102" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">AFI (Application Family Identifier) 0x07 marks the library family — pre-written in bulk at the factory</text>
    <text x="26" y="134" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Same pattern beyond libraries: gas-bottle fleets and document files use the AFI to keep their reads to themselves</text>
    <text x="26" y="160" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Android with NXP NFC controllers reads 15693 natively at 1-3 cm — spot-checks without a dedicated reader</text>
  </g>
</svg>
