<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Per-card carbon footprint of RFID card substrates in grams CO2e</title>
<desc id="d">A horizontal bar chart of per-card carbon footprint in grams CO2e, ISO 14067 cradle-to-gate. Virgin PVC is the baseline at 6.5 to 8.5 grams. Recycled PVC at 50 percent post-consumer content is 4 to 5 grams. Recycled PVC at 80 percent is 3 to 3.5 grams. FSC wood veneer is the lowest at 2 to 4 grams. Each bar shows a solid portion to its minimum and a lighter portion to its maximum. At 5 million cards a year, switching virgin PVC to FSC wood is a 15 to 25 tonne CO2e swing, a Scope 3 line rather than a rounding error.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PER-CARD CARBON, VERIFIED</text>
<text x="600" y="96" text-anchor="middle" font-size="28" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Recycled and wood roughly halve the footprint</text>

<!-- Gridlines -->
<line x1="451" y1="180" x2="451" y2="520" stroke="#efe7d6" stroke-width="1.2"/>
<line x1="602" y1="180" x2="602" y2="520" stroke="#efe7d6" stroke-width="1.2"/>
<line x1="753" y1="180" x2="753" y2="520" stroke="#efe7d6" stroke-width="1.2"/>
<line x1="904" y1="180" x2="904" y2="520" stroke="#efe7d6" stroke-width="1.2"/>
<line x1="300" y1="180" x2="300" y2="520" stroke="#d8cbb2" stroke-width="1.5"/>

<!-- Row 1: Virgin PVC -->
<text x="286" y="214" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">Virgin PVC</text>
<text x="286" y="234" text-anchor="end" font-size="12" fill="#8b2d2d">baseline</text>
<rect x="300" y="190" width="491" height="56" rx="6" fill="#4a5568"/>
<rect x="791" y="190" width="152" height="56" rx="6" fill="#c3cad6"/>
<text x="953" y="224" text-anchor="start" font-size="15" font-weight="700" fill="#3a4453">6.5&#8211;8.5 g</text>

<!-- Row 2: Recycled PVC 50% -->
<text x="286" y="302" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">Recycled PVC</text>
<text x="286" y="322" text-anchor="end" font-size="12" fill="#5c5c5c">50% PCR</text>
<rect x="300" y="278" width="302" height="56" rx="6" fill="#3d6b6b"/>
<rect x="602" y="278" width="76" height="56" rx="6" fill="#bcd4d4"/>
<text x="688" y="312" text-anchor="start" font-size="15" font-weight="700" fill="#2c5454">4&#8211;5 g</text>

<!-- Row 3: Recycled PVC 80% -->
<text x="286" y="390" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">Recycled PVC</text>
<text x="286" y="410" text-anchor="end" font-size="12" fill="#5c5c5c">80% PCR</text>
<rect x="300" y="366" width="227" height="56" rx="6" fill="#2c5454"/>
<rect x="527" y="366" width="38" height="56" rx="6" fill="#bcd4d4"/>
<text x="575" y="400" text-anchor="start" font-size="15" font-weight="700" fill="#2c5454">3&#8211;3.5 g</text>

<!-- Row 4: FSC wood veneer -->
<text x="286" y="478" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">FSC wood veneer</text>
<text x="286" y="498" text-anchor="end" font-size="12" fill="#2d6a4f">lowest verified</text>
<rect x="300" y="454" width="151" height="56" rx="6" fill="#2d6a4f"/>
<rect x="451" y="454" width="151" height="56" rx="6" fill="#bcd8c9"/>
<text x="612" y="488" text-anchor="start" font-size="15" font-weight="700" fill="#1b4332">2&#8211;4 g</text>

<!-- Axis ticks -->
<text x="300" y="540" text-anchor="middle" font-size="12" fill="#8a7a5c">0</text>
<text x="451" y="540" text-anchor="middle" font-size="12" fill="#8a7a5c">2</text>
<text x="602" y="540" text-anchor="middle" font-size="12" fill="#8a7a5c">4</text>
<text x="753" y="540" text-anchor="middle" font-size="12" fill="#8a7a5c">6</text>
<text x="904" y="540" text-anchor="middle" font-size="12" fill="#8a7a5c">8</text>
<text x="600" y="566" text-anchor="middle" font-size="12.5" fill="#8a7a5c">grams CO2e per card &#183; ISO 14067 cradle-to-gate</text>

<text x="600" y="606" text-anchor="middle" font-size="14" fill="#4f4f4f">At 5 million cards a year, virgin PVC to FSC wood is a 15&#8211;25 tonne CO2e swing &#8212; a Scope 3 line, not a rounding error.</text>
</svg>
