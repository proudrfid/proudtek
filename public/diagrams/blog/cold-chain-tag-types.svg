<text x="742" y="376" font-size="12.5" fill="#4f4f4f">real-time, in-transit</text>

<text x="1018" y="322" font-size="15.5" font-weight="700" fill="#291c0e">BLE–RFID hybrid</text>
<text x="1018" y="350" font-size="13.5" font-weight="600" fill="#2c5454">BLE + RFID</text>
<text x="1018" y="376" font-size="12.5" fill="#4f4f4f">live view + audit trail</text>
</g>

