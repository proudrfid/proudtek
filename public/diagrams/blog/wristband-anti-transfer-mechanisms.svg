<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Anti-transfer mechanisms: why the wristband stays on</title>
<desc id="d">Three wristband closure mechanisms and a software backstop. One-way slide lock on fabric bands: a zip-tie style bead that tightens one way and never loosens — removal requires cutting the band. Breakaway closure on silicone bands: snap or detent set to wrist size, with a breakaway section that shows visible damage if the band is forced off, drawn as a red crack. Adhesive void pattern on Tyvek bands: a single-use adhesive closure that reveals a red VOID pattern when peeled. Underneath, the software backstop: the system flags impossible patterns such as two rapid scans at distant gates, shown as two gate posts joined by a dashed line with a red flag; for VIP and cashless-loaded bands, pair the UID with attendee photo ID at registration.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANTI-TRANSFER · WHY THE BAND STAYS ON</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Four ways a wristband refuses to be shared</text>

<!-- P1: one-way slide lock -->
<rect x="64" y="126" width="328" height="252" rx="16" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="228" y="158" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">One-way slide lock</text>
<text x="228" y="180" text-anchor="middle" font-size="12.5" fill="#4f4f4f">fabric bands · zip-tie mechanism</text>
<line x1="180" y1="208" x2="116" y2="208" stroke="#9aa4b5" stroke-width="2.5" stroke-dasharray="6 5"/>
<line x1="102" y1="202" x2="114" y2="214" stroke="#9aa4b5" stroke-width="3"/>
<line x1="102" y1="214" x2="114" y2="202" stroke="#9aa4b5" stroke-width="3"/>
<line x1="252" y1="208" x2="308" y2="208" stroke="#1f6f3a" stroke-width="2.5"/>
<polygon points="308,202 320,208 308,214" fill="#1f6f3a"/>
<text x="284" y="196" text-anchor="middle" font-size="12" fill="#1f6f3a">tighten</text>
<rect x="104" y="232" width="248" height="22" rx="6" fill="#c39a5f"/>
<line x1="110" y1="243" x2="346" y2="243" stroke="#a87f45" stroke-width="2"/>
<rect x="214" y="220" width="26" height="46" rx="7" fill="#6d5a3a"/>
<text x="228" y="304" text-anchor="middle" font-size="13.5" fill="#291c0e">tightens one way; never loosens</text>
<text x="228" y="328" text-anchor="middle" font-size="12.5" fill="#5c5c5c">removal requires cutting the band</text>

<!-- P2: breakaway -->
<rect x="436" y="126" width="328" height="252" rx="16" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="600" y="158" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">Breakaway closure</text>
<text x="600" y="180" text-anchor="middle" font-size="12.5" fill="#4f4f4f">silicone bands · snap or detent</text>
<text x="648" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#8b2d2d">breakaway</text>
<rect x="496" y="224" width="200" height="40" rx="20" fill="#3d6b6b"/>
<circle cx="532" cy="244" r="5" fill="#f4efe4"/>
<circle cx="552" cy="244" r="5" fill="#f4efe4"/>
<rect x="576" y="234" width="36" height="20" rx="5" fill="#5b8a8a"/>
<polyline points="648,218 638,236 652,248 642,270" fill="none" stroke="#8b2d2d" stroke-width="3.5"/>
<text x="600" y="304" text-anchor="middle" font-size="13.5" fill="#291c0e">forced off → visible damage</text>
<text x="600" y="328" text-anchor="middle" font-size="12.5" fill="#5c5c5c">closure set to a specific wrist size</text>

<!-- P3: adhesive void -->
<rect x="808" y="126" width="328" height="252" rx="16" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="972" y="158" text-anchor="middle" font-size="17" font-weight="800" fill="#4a5568">Adhesive void pattern</text>
<text x="972" y="180" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Tyvek bands · tamper-evident</text>
<rect x="848" y="226" width="210" height="30" rx="4" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<rect x="862" y="233" width="14" height="14" rx="2" fill="#c39a5f"/>
<rect x="884" y="233" width="14" height="14" rx="2" fill="#c39a5f"/>
<rect x="906" y="233" width="14" height="14" rx="2" fill="#c39a5f"/>
<text x="1000" y="246" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="2" fill="#8b2d2d">VOID</text>
<polygon points="1058,226 1092,212 1092,242" fill="#f4f6f9" stroke="#4a5568" stroke-width="1.5"/>
<text x="972" y="304" text-anchor="middle" font-size="13.5" fill="#291c0e">peeled → the void pattern shows</text>
<text x="972" y="328" text-anchor="middle" font-size="12.5" fill="#5c5c5c">single-use adhesive closure</text>

<!-- software backstop -->
<rect x="64" y="410" width="1072" height="132" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="96" y="444" font-size="13" font-weight="800" letter-spacing="1" fill="#2c5454">SOFTWARE BACKSTOP · THE CLEVER FOURTH ATTEMPT</text>
<text x="96" y="474" font-size="14.5" fill="#291c0e">The system flags impossible patterns: two rapid scans</text>
<text x="96" y="496" font-size="14.5" fill="#291c0e">at distant gates means a shared band.</text>
<text x="96" y="522" font-size="13" fill="#5c5c5c">VIP and cashless-loaded bands: pair the UID with attendee photo ID.</text>
<rect x="754" y="452" width="10" height="46" fill="#2c5454"/>
<rect x="1020" y="452" width="10" height="46" fill="#2c5454"/>
<line x1="770" y1="476" x2="1014" y2="476" stroke="#9aa4b5" stroke-width="2.5" stroke-dasharray="6 5"/>
<circle cx="770" cy="476" r="5" fill="#2c5454"/>
<circle cx="1014" cy="476" r="5" fill="#2c5454"/>
<line x1="890" y1="442" x2="890" y2="476" stroke="#8b2d2d" stroke-width="2.5"/>
<polygon points="890,442 922,450 890,458" fill="#8b2d2d"/>
<text x="932" y="454" font-size="12.5" font-weight="700" fill="#8b2d2d">flagged</text>
<text x="759" y="522" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Gate A</text>
<text x="1025" y="522" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Gate B</text>

<text x="600" y="590" text-anchor="middle" font-size="14" fill="#5c5c5c">Cutting the band off does work — it just stops being a ticket at that point.</text>
</svg>
