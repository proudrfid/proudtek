<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NFC on a wine bottle: one tap proves it, sells it and files the EPR paperwork</title>
<desc id="d">Hero illustration. A wine bottle with a gold capsule and an NTAG 424 DNA chip hidden under the capsule sends NFC signal arcs to a smartphone showing a verified check mark. Three pills underneath summarise the three jobs of the same chip: PPWR compliance applying from 12 August 2026, tap-to-verify SUN authentication against counterfeits, and consumer engagement with tasting notes, clubs and reorders. Caption: one chip, two bosses, zero re-tagging.</desc>
