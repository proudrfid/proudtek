<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Read range of the anchor bolt tag by inspection mode</title>
  <desc id="d">Range ladder with a compressed distance axis. An NFC tap at 13.56 MHz with a loop antenna reads at 0 to 5 centimetres for NTAG424 DNA forensic signing. Buried or underwater UHF reads at 0 to 10 centimetres for submerged bridge-pier, levee and dam anchors. Handheld UHF at 860 to 960 MHz with a dipole antenna reads bolt clusters at 0.5 to 2 metres on tower flanges, bridge bearings and crane rails. Drive-by and walk-by UHF reads roadway assets at 2 to 4 metres. The rope-access portal reads at 3 to 6 metres at the wind-turbine nacelle and tower base. Every read publishes into the same per-anchor EPCIS 2.0 stream.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">READ RANGE BY INSPECTION MODE</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#5c5c5c">Loop antenna at 13.56 MHz · dipole antennas at 860-960 MHz · axis compressed</text>

  <!-- row 1: NFC tap -->
  <text x="64" y="152" font-size="16" font-weight="700" fill="#291c0e">NFC tap · 13.56 MHz</text>
  <text x="64" y="176" font-size="12.5" fill="#5c5c5c">NTAG424 DNA signing</text>
  <circle cx="268" cy="160" r="15" fill="none" stroke="#3d6b6b" stroke-width="4"/>
  <circle cx="268" cy="160" r="7" fill="none" stroke="#3d6b6b" stroke-width="2"/>
  <rect x="300" y="147" width="72" height="26" rx="13" fill="#3d6b6b"/>
  <text x="384" y="165" font-size="15" font-weight="700" fill="#2c5454">0-5 cm</text>

  <!-- row 2: buried / underwater UHF -->
  <text x="64" y="246" font-size="16" font-weight="700" fill="#291c0e">Buried / underwater UHF</text>
  <text x="64" y="270" font-size="12.5" fill="#5c5c5c">bridge-pier / levee / dam</text>
  <line x1="245" y1="254" x2="291" y2="254" stroke="#4a5568" stroke-width="4"/>
  <rect x="263" y="249" width="10" height="10" fill="#4a5568"/>
  <rect x="300" y="241" width="160" height="26" rx="13" fill="#4a5568"/>
  <text x="472" y="259" font-size="15" font-weight="700" fill="#4a5568">0-10 cm</text>

  <!-- row 3: handheld -->
  <text x="64" y="340" font-size="16" font-weight="700" fill="#291c0e">Handheld · bolt-cluster</text>
  <text x="64" y="364" font-size="12.5" fill="#5c5c5c">flange / bearing / rail</text>
  <line x1="245" y1="348" x2="291" y2="348" stroke="#4a5568" stroke-width="4"/>
  <rect x="263" y="343" width="10" height="10" fill="#4a5568"/>
  <rect x="656" y="335" width="222" height="26" rx="13" fill="#4a5568"/>
  <text x="890" y="353" font-size="15" font-weight="700" fill="#4a5568">0.5-2 m</text>

  <!-- row 4: drive-by -->
  <text x="64" y="434" font-size="16" font-weight="700" fill="#291c0e">Drive-by / walk-by UHF</text>
  <text x="64" y="458" font-size="12.5" fill="#5c5c5c">roadway / highway assets</text>
  <line x1="245" y1="442" x2="291" y2="442" stroke="#4a5568" stroke-width="4"/>
  <rect x="263" y="437" width="10" height="10" fill="#4a5568"/>
  <rect x="878" y="429" width="139" height="26" rx="13" fill="#4a5568"/>
  <text x="1029" y="447" font-size="15" font-weight="700" fill="#4a5568">2-4 m</text>

  <!-- row 5: rope-access portal -->
  <text x="64" y="528" font-size="16" font-weight="700" fill="#291c0e">Rope-access portal</text>
  <text x="64" y="552" font-size="12.5" fill="#5c5c5c">nacelle / tower-base</text>
  <line x1="245" y1="536" x2="291" y2="536" stroke="#4a5568" stroke-width="4"/>
  <rect x="263" y="531" width="10" height="10" fill="#4a5568"/>
  <rect x="960" y="523" width="140" height="26" rx="13" fill="#4a5568"/>
  <text x="948" y="541" text-anchor="end" font-size="15" font-weight="700" fill="#4a5568">3-6 m</text>

  <!-- axis -->
  <line x1="300" y1="574" x2="1100" y2="574" stroke="#e6dfd2" stroke-width="2"/>
  <line x1="300" y1="568" x2="300" y2="580" stroke="#c39a5f" stroke-width="2"/>
  <line x1="460" y1="568" x2="460" y2="580" stroke="#c39a5f" stroke-width="2"/>
  <line x1="740" y1="568" x2="740" y2="580" stroke="#c39a5f" stroke-width="2"/>
  <line x1="1100" y1="568" x2="1100" y2="580" stroke="#c39a5f" stroke-width="2"/>
  <text x="300" y="598" text-anchor="middle" font-size="12.5" fill="#5c5c5c">0</text>
  <text x="460" y="598" text-anchor="middle" font-size="12.5" fill="#5c5c5c">10 cm</text>
  <text x="740" y="598" text-anchor="middle" font-size="12.5" fill="#5c5c5c">1 m</text>
  <text x="1100" y="598" text-anchor="middle" font-size="12.5" fill="#5c5c5c">6 m</text>

  <!-- result band -->
  <rect x="200" y="612" width="800" height="40" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="638" text-anchor="middle" font-size="14.5" font-weight="600" fill="#2c5454">Every read — windshield to rope harness — lands in the same per-anchor EPCIS 2.0 stream</text>
</svg>
