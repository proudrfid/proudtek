<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The recurring evidence on retained surgical items</title>
<desc id="d">Four figures recur across the published sources. First, the count was documented correct in roughly 87 to 95 percent of retained-item cases. Second, the average cost is about 166 to 200 thousand dollars per incident. Third, RFID is the only adjunct that counts, locates and identifies each item, where bar-code only counts and RF only locates. Fourth, AORN treats the count as incomplete until the adjunct confirms it. A footer notes that only about 20 percent of US hospitals currently use any adjunct technology.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE EVIDENCE THAT RECURS</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">The figures that show up across STERIS, AORN, ECRI and the Joint Commission.</text>

<!-- Card A: documented correct (risk) -->
<rect x="52" y="132" width="252" height="356" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="52" y="132" width="252" height="8" rx="4" fill="#8b2d2d"/>
<text x="178" y="178" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">DOCUMENTED "CORRECT"</text>
<text x="178" y="252" text-anchor="middle" font-size="40" font-weight="800" fill="#8b2d2d">87-95%</text>
<text x="178" y="312" text-anchor="middle" font-size="12.5" fill="#5c5c5c">of retained-item cases</text>
<text x="178" y="332" text-anchor="middle" font-size="12.5" fill="#5c5c5c">had a final count that</text>
<text x="178" y="352" text-anchor="middle" font-size="12.5" fill="#5c5c5c">was called correct.</text>
<text x="178" y="392" text-anchor="middle" font-size="12" fill="#8a8a8a">The count alone is not</text>
<text x="178" y="410" text-anchor="middle" font-size="12" fill="#8a8a8a">a sufficient safeguard.</text>

<!-- Card B: cost -->
<rect x="326" y="132" width="252" height="356" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="326" y="132" width="252" height="8" rx="4" fill="#4a5568"/>
<text x="452" y="178" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#4a5568">AVERAGE COST</text>
<text x="452" y="250" text-anchor="middle" font-size="30" font-weight="800" fill="#3f4a5c">$166K-</text>
<text x="452" y="286" text-anchor="middle" font-size="30" font-weight="800" fill="#3f4a5c">200K</text>
<text x="452" y="330" text-anchor="middle" font-size="12.5" fill="#5c5c5c">per incident — legal</text>
<text x="452" y="350" text-anchor="middle" font-size="12.5" fill="#5c5c5c">defence, indemnity and</text>
<text x="452" y="370" text-anchor="middle" font-size="12.5" fill="#5c5c5c">unreimbursed care.</text>
<text x="452" y="410" text-anchor="middle" font-size="12" fill="#8a8a8a">CMS does not reimburse it.</text>

<!-- Card C: capability -->
<rect x="600" y="132" width="252" height="356" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="600" y="132" width="252" height="8" rx="4" fill="#3d6b6b"/>
<text x="726" y="178" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#2c5454">ADJUNCT CAPABILITY</text>
<text x="726" y="246" text-anchor="middle" font-size="34" font-weight="800" fill="#2c5454">Only RFID</text>
<text x="726" y="300" text-anchor="middle" font-size="12.5" fill="#5c5c5c">counts, locates AND</text>
<text x="726" y="320" text-anchor="middle" font-size="12.5" fill="#5c5c5c">identifies each item.</text>
<text x="726" y="360" text-anchor="middle" font-size="12" fill="#8a8a8a">Bar-code only counts;</text>
<text x="726" y="378" text-anchor="middle" font-size="12" fill="#8a8a8a">RF only locates.</text>

<!-- Card D: AORN -->
<rect x="874" y="132" width="252" height="356" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="874" y="132" width="252" height="8" rx="4" fill="#1f6f3a"/>
<text x="1000" y="178" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">STANDARD OF CARE</text>
<text x="1000" y="250" text-anchor="middle" font-size="38" font-weight="800" fill="#1f6f3a">AORN</text>
<text x="1000" y="312" text-anchor="middle" font-size="12.5" fill="#5c5c5c">The count is not</text>
<text x="1000" y="332" text-anchor="middle" font-size="12.5" fill="#5c5c5c">complete until the</text>
<text x="1000" y="352" text-anchor="middle" font-size="12.5" fill="#5c5c5c">adjunct confirms it.</text>
<text x="1000" y="392" text-anchor="middle" font-size="12" fill="#8a8a8a">Counting continues</text>
<text x="1000" y="410" text-anchor="middle" font-size="12" fill="#8a8a8a">alongside the adjunct.</text>

<!-- footer -->
<rect x="230" y="512" width="740" height="60" rx="12" fill="#f7f4ec" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="600" y="548" text-anchor="middle" font-size="14" fill="#4f4f4f">Yet only ~20% of US hospitals use any adjunct sponge-counting technology today (ECRI).</text>
</svg>
