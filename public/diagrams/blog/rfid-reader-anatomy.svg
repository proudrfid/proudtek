<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Inside an RFID reader — the four blocks every form factor shares</title>
<desc id="d">Cutaway anatomy diagram. On the left, a reader body opened to show its stacked internals: an antenna coil on top, then an RF transceiver block, a control processor block and a host interface block, with a cable leaving the bottom. On the right, four numbered callouts: one, the antenna is the ears — it turns electricity into radio waves and back, and bigger, better-tuned ears mean longer read range. Two, the RF transceiver is the voice — it generates the carrier, modulates the outbound commands and decodes the tag's whispered reply. Three, the control processor is the brain — it runs ISO 14443, ISO 15693 and ISO 18000-6C, referees anti-collision and does the crypto for secure chips. Four, the host interface is the tail — USB, Bluetooth or Ethernet, the plug that makes the read actually go somewhere. Caption: reader sensitivity, the faintest reply it can still decode, sets real-world range more than anything printed on the box.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INSIDE THE BOX · FOUR BLOCKS, FOUR JOBS</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Peel the lid: the anatomy never changes, only the costume</text>

