<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Item-level lifecycle of a source-tagged apparel hang-tag, factory to store floor</title>
  <desc id="d">The item-level lifecycle across five checkpoints. Stage one, factory encode: the supplier writes the GS1 SGTIN-96 at the print-and-attach step and uploads a per-carton EPC manifest to the retailer's WMS. Stage two, DC verify: the distribution centre reads a 5% carton sample through a portal reader and reconciles it to the manifest. Stage three, store receiving: cartons arrive pre-encoded with no DC tagging labour, $0.00 incremental. Stage four, floor cycle-count: an MC9300 handheld scans the full floor every 7 days, 35 to 45 minutes per 100,000-unit store instead of 8 hours by eye. Stage five, POS and EAS: the SGTIN flips from sold to returned at the desk, and HF EAS gates at 8.2 MHz coexist with the UHF inlays. An exception path shows that a mismatch at DC verify triggers an automatic supplier chargeback. One identifier serves 11 M units per year across 340 stores.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE ITEM-LEVEL LIFECYCLE — FACTORY ENCODE TO STORE FLOOR</text>
  <text x="600" y="80" text-anchor="middle" font-size="15" fill="#5c5c5c">One SGTIN-96, written once at the factory, read at every checkpoint downstream</text>

  <!-- stage boxes -->
  <g>
    <rect x="52" y="120" width="208" height="212" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
    <rect x="274" y="120" width="208" height="212" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
    <rect x="496" y="120" width="208" height="212" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
    <rect x="718" y="120" width="208" height="212" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
    <rect x="940" y="120" width="208" height="212" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  </g>

  <!-- arrows between stages -->
  <path d="M262 219 l10 7 l-10 7 z" fill="#3d6b6b"/>
  <path d="M484 219 l10 7 l-10 7 z" fill="#3d6b6b"/>
  <path d="M706 219 l10 7 l-10 7 z" fill="#3d6b6b"/>
  <path d="M928 219 l10 7 l-10 7 z" fill="#3d6b6b"/>

  <!-- stage 1 -->
  <circle cx="156" cy="152" r="16" fill="#3d6b6b"/>
  <text x="156" y="157" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
  <text x="156" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#291c0e">FACTORY ENCODE</text>
  <text x="156" y="220" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Supplier writes SGTIN-96</text>
  <text x="156" y="242" text-anchor="middle" font-size="12.5" fill="#5c5c5c">at print-and-attach step</text>
  <text x="156" y="264" text-anchor="middle" font-size="12.5" fill="#5c5c5c">EPC manifest to WMS</text>

  <!-- stage 2 -->
  <circle cx="378" cy="152" r="16" fill="#3d6b6b"/>
  <text x="378" y="157" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
  <text x="378" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#291c0e">DC VERIFY</text>
  <text x="378" y="220" text-anchor="middle" font-size="12.5" fill="#5c5c5c">5% carton sample read</text>
  <text x="378" y="242" text-anchor="middle" font-size="12.5" fill="#5c5c5c">through a portal reader</text>
  <text x="378" y="264" text-anchor="middle" font-size="12.5" fill="#5c5c5c">reconciled to manifest</text>

  <!-- stage 3 -->
  <circle cx="600" cy="152" r="16" fill="#3d6b6b"/>
  <text x="600" y="157" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
  <text x="600" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#291c0e">STORE RECEIVING</text>
  <text x="600" y="220" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Cartons arrive encoded</text>
  <text x="600" y="242" text-anchor="middle" font-size="12.5" fill="#5c5c5c">no DC tagging labour</text>
  <text x="600" y="264" text-anchor="middle" font-size="12.5" fill="#2c5454">$0.00 incremental</text>

  <!-- stage 4 -->
  <circle cx="822" cy="152" r="16" fill="#3d6b6b"/>
  <text x="822" y="157" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
  <text x="822" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#291c0e">FLOOR CYCLE-COUNT</text>
  <text x="822" y="220" text-anchor="middle" font-size="12.5" fill="#5c5c5c">MC9300 handheld scan</text>
  <text x="822" y="242" text-anchor="middle" font-size="12.5" fill="#5c5c5c">every 7 days per store</text>
  <text x="822" y="264" text-anchor="middle" font-size="12.5" fill="#5c5c5c">35–45 min, not 8 hours</text>

  <!-- stage 5 -->
  <circle cx="1044" cy="152" r="16" fill="#3d6b6b"/>
  <text x="1044" y="157" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
  <text x="1044" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#291c0e">POS / EAS</text>
  <text x="1044" y="220" text-anchor="middle" font-size="12.5" fill="#5c5c5c">SGTIN flips sold to</text>
  <text x="1044" y="242" text-anchor="middle" font-size="12.5" fill="#5c5c5c">returned at the desk</text>
  <text x="1044" y="264" text-anchor="middle" font-size="12.5" fill="#5c5c5c">HF EAS 8.2 MHz coexists</text>

  <!-- exception connector + pill (red = failure/exception only) -->
  <line x1="378" y1="332" x2="378" y2="360" stroke="#8b2d2d" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="326" y="360" width="548" height="54" rx="12" fill="#f7e7e2" stroke="#c98a86" stroke-width="2"/>
  <text x="352" y="384" font-size="13" font-weight="800" letter-spacing="0.4" fill="#8b2d2d">EXCEPTION PATH</text>
  <text x="352" y="404" font-size="13" fill="#8b2d2d">Mismatch at DC verify → automatic supplier chargeback</text>

  <!-- summary footer -->
  <rect x="52" y="450" width="1096" height="150" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="490" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">One identifier, encoded once at source, trusted end to end</text>
  <text x="600" y="522" text-anchor="middle" font-size="13.5" fill="#3d6b6b">The SGTIN-96 the factory writes is the same value the floor scan, the endless-aisle order and the</text>
  <text x="600" y="546" text-anchor="middle" font-size="13.5" fill="#3d6b6b">returns desk all read — no re-encode, no re-key across 11 M units / year and 340 stores.</text>
  <text x="600" y="576" text-anchor="middle" font-size="12.5" fill="#6d5a3a">Chip: Monza R6-P · UHF RAIN · 96-bit EPC + 32-bit TID · Autotune-enabled</text>
</svg>
