<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Fair sub-MOQ premium rises as the order shrinks relative to MOQ</title>
<desc id="d">An ascending staircase of four steps. At 10 to 30 percent above MOQ the premium is 0 to 10 percent. At 30 to 50 percent of MOQ the premium is 10 to 25 percent. At 10 to 30 percent of MOQ the premium is 25 to 60 percent. Below 10 percent of MOQ the order is typically declined or accepted only as a sample-pricing run with a 500 to 2,000 dollar minimum order value. A separate small-MOQ tier runs 1 to 5 dollars per tag for prototyping.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FAIR PREMIUM · WHAT SUB-MOQ SHOULD COST</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Below-MOQ pricing is a negotiated premium, not a refusal. It rises as your order shrinks.</text>

<line x1="90" y1="540" x2="1094" y2="540" stroke="#e6dfd2" stroke-width="2"/>
<text x="90" y="128" font-size="13" font-weight="700" fill="#8a8a8a">premium ▲</text>

<!-- step 1 -->
<rect x="110" y="440" width="200" height="100" fill="#9dbdbd"/>
<text x="210" y="424" text-anchor="middle" font-size="24" font-weight="800" fill="#2c5454">0–10%</text>
<text x="210" y="566" text-anchor="middle" font-size="13.5" fill="#291c0e">10–30% above MOQ</text>
<!-- step 2 -->
<rect x="358" y="370" width="200" height="170" fill="#3d6b6b"/>
<text x="458" y="354" text-anchor="middle" font-size="24" font-weight="800" fill="#2c5454">10–25%</text>
<text x="458" y="566" text-anchor="middle" font-size="13.5" fill="#291c0e">30–50% of MOQ</text>
<!-- step 3 -->
<rect x="606" y="300" width="200" height="240" fill="#c39a5f"/>
<text x="706" y="284" text-anchor="middle" font-size="24" font-weight="800" fill="#6d5a3a">25–60%</text>
<text x="706" y="566" text-anchor="middle" font-size="13.5" fill="#291c0e">10–30% of MOQ</text>
<!-- step 4 (risk) -->
<rect x="854" y="240" width="200" height="300" fill="#8b2d2d"/>
<text x="954" y="224" text-anchor="middle" font-size="22" font-weight="800" fill="#8b2d2d">declined?</text>
<text x="954" y="360" text-anchor="middle" font-size="14.5" font-weight="800" fill="#ffffff">sample-pricing run</text>
<text x="954" y="384" text-anchor="middle" font-size="13.5" fill="#ffffff">$500–2,000 min order</text>
<text x="954" y="566" text-anchor="middle" font-size="13.5" fill="#291c0e">below 10% of MOQ</text>

<text x="600" y="606" text-anchor="middle" font-size="14" fill="#4f4f4f">A separate small-MOQ tier runs $1–5 per tag — fine for prototyping, not for volume programs.</text>
</svg>
