<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">What an RFID card is actually made of — the laminated sandwich</title>
<desc id="d">Exploded view of a CR80 card: a clear PVC or PET overlay on top, a printed core sheet of PVC, PET or PC carrying the artwork, the RFID inlay with its antenna coil and chip in the middle, a printed back core, and a clear sealing overlay underneath. Hot lamination fuses the stack, which is then die-cut to CR80 size, 85.6 by 54 millimetres and 0.76 millimetres thick.</desc>
<defs><radialGradient id="normbg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#normbg)"/>
<g transform="translate(36.0,88.0) scale(1.0846)">
        <defs>
          <linearGradient id="a-artG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B54E6"/><stop offset="1" stop-color="#0D9488"/></linearGradient>
        </defs>
        <rect width="1040" height="460" fill="#FFFFFF"/>
        
        

        <!-- ===== layers (drawn bottom-up) ===== -->
        <!-- ⑤ bottom overlay cy=350 -->
        <path d="M90 350 L300 414 L300 424 L90 360 Z" fill="#C4CFDA"/>
        <path d="M300 414 L510 350 L510 360 L300 424 Z" fill="#B2BECB"/>
        <path d="M300 286 L510 350 L300 414 L90 350 Z" fill="#E7EEF4" fill-opacity=".7" stroke="#9DB0C2" stroke-dasharray="4 4"/>
        <!-- ④ back printed core cy=284 -->
        <path d="M90 284 L300 348 L300 358 L90 294 Z" fill="#D8CFC1"/>
        <path d="M300 348 L510 284 L510 294 L300 358 Z" fill="#CBC1B1"/>
        <path d="M300 220 L510 284 L300 348 L90 284 Z" fill="#F3EEE6" stroke="#D6C9B6"/>
        <!-- ③ inlay cy=218 -->
        <path d="M90 218 L300 282 L300 292 L90 228 Z" fill="#EAD6B4"/>
        <path d="M300 282 L510 218 L510 228 L300 292 Z" fill="#DEC9A6"/>
        <path d="M300 154 L510 218 L300 282 L90 218 Z" fill="#FFF6E7" stroke="#E4C98F"/>
        <!-- antenna coil (concentric diamonds) + chip -->
        <g fill="none" stroke="#C8792E" stroke-width="3">
          <path d="M300 176 L448 218 L300 260 L152 218 Z"/>
          <path d="M300 188 L410 218 L300 248 L190 218 Z"/>
          <path d="M300 199 L374 218 L300 237 L226 218 Z"/>
        </g>
        <path d="M300 210 L324 218 L300 226 L276 218 Z" fill="#2A3550"/>
        <!-- ② front printed core cy=152 -->
        <path d="M90 152 L300 216 L300 226 L90 162 Z" fill="#D8CFC1"/>
        <path d="M300 216 L510 152 L510 162 L300 226 Z" fill="#CBC1B1"/>
        <path d="M300 88 L510 152 L300 216 L90 152 Z" fill="#F6F1EA" stroke="#D6C9B6"/>
        <!-- card artwork on front core -->
        <path d="M300 108 L440 150 L300 190 L232 150 Z" fill="url(#a-artG)" opacity=".92"/>
        <path d="M262 150 L300 138 L338 150 L300 162 Z" fill="#fff" opacity=".85"/>
        <!-- ① top overlay cy=86 -->
        <path d="M90 86 L300 150 L300 160 L90 96 Z" fill="#CBD6E0" fill-opacity=".6"/>
        <path d="M300 150 L510 86 L510 96 L300 160 Z" fill="#B9C6D2" fill-opacity=".6"/>
        <path d="M300 22 L510 86 L300 150 L90 86 Z" fill="#EAF0F5" fill-opacity=".55" stroke="#A9B7C6" stroke-dasharray="4 4"/>
        <text x="300" y="90" text-anchor="middle" font-family="Inter" font-size="12" fill="#7C8CA0" opacity=".8">clear</text>

        <!-- ===== labels ===== -->
        <g font-family="Inter" font-weight="700" font-size="15" fill="#0B1220">
          <line x1="510" y1="86" x2="566" y2="86" stroke="#C7D2DE" stroke-width="1.6"/>
          <text x="574" y="82">① Overlay — clear PVC / PET</text>
          <text x="574" y="102" font-family="Inter" font-weight="400" font-size="13" fill="#64748B">Scratch &amp; UV shield. Glossy or matte.</text>

          <line x1="510" y1="152" x2="566" y2="152" stroke="#C7D2DE" stroke-width="1.6"/>
          <text x="574" y="148">② Printed core — PVC / PET / PC</text>
          <text x="574" y="168" font-family="Inter" font-weight="400" font-size="13" fill="#64748B">Your artwork, logo and colour live here.</text>

          <line x1="510" y1="218" x2="566" y2="218" stroke="#C7D2DE" stroke-width="1.6"/>
          <text x="574" y="214">③ Inlay — antenna coil + chip</text>
          <text x="574" y="234" font-family="Inter" font-weight="400" font-size="13" fill="#64748B">The actual RFID part (here, an HF coil).</text>

          <line x1="510" y1="284" x2="566" y2="284" stroke="#C7D2DE" stroke-width="1.6"/>
          <text x="574" y="280">④ Printed core (back)</text>
          <text x="574" y="300" font-family="Inter" font-weight="400" font-size="13" fill="#64748B">Terms, barcode, magstripe if needed.</text>

          <line x1="510" y1="350" x2="566" y2="350" stroke="#C7D2DE" stroke-width="1.6"/>
          <text x="574" y="346">⑤ Overlay — clear</text>
          <text x="574" y="366" font-family="Inter" font-weight="400" font-size="13" fill="#64748B">Seals the back the same way.</text>
        </g>

        <!-- lamination note -->
        <g transform="translate(574,392)">
          <rect width="420" height="46" rx="12" fill="#0B1220"/>
          <text x="18" y="21" font-family="Inter" font-weight="700" font-size="13.5" fill="#fff">🔥 Hot lamination — heat + pressure fuse the stack</text>
          <text x="18" y="38" font-family="Inter" font-size="12.5" fill="#AEBACb">then die-cut to CR80 · 85.6 × 54 mm · 0.76 mm thick</text>
        </g>
      </g>
</svg>
