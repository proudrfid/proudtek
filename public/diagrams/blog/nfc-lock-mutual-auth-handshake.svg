<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five steps an NFC door lock and card run to authenticate, in 100 to 300 milliseconds</title>
<desc id="d">A five-step flow. One, the reader powers the card at 13.56 MHz and reads its UID. Two, the lock issues a fresh random challenge. Three, the card returns an AES-128 response and the key stays on the card. Four, both sides verify each other, not just the card. Five, the lock reads room, validity and access level and grants or denies locally. The whole exchange takes 100 to 300 milliseconds. A note warns that UID-only systems stop at step one, which is why a cloned UID walks straight in.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HANDSHAKE · WHAT ONE TAP ACTUALLY DOES</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">From power-up to grant or deny in 100–300 ms — the secure path proves a key without ever sending it.</text>

<!-- step 1 -->
<rect x="60" y="150" width="200" height="232" rx="13" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<circle cx="90" cy="184" r="16" fill="#c39a5f"/>
<text x="90" y="189" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="120" y="189" font-size="15" font-weight="800" fill="#291c0e">Power + read</text>
<text x="84" y="240" font-size="12.5" fill="#5c5c5c">Reader energizes the</text>
<text x="84" y="260" font-size="12.5" fill="#5c5c5c">card at 13.56 MHz and</text>
<text x="84" y="280" font-size="12.5" fill="#5c5c5c">reads its UID.</text>
<text x="84" y="326" font-size="12" font-weight="700" fill="#8b2d2d">a name, not a secret</text>

<!-- step 2 -->
<rect x="290" y="150" width="200" height="232" rx="13" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="320" cy="184" r="16" fill="#3d6b6b"/>
<text x="320" y="189" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="350" y="189" font-size="15" font-weight="800" fill="#291c0e">Challenge</text>
<text x="314" y="240" font-size="12.5" fill="#5c5c5c">The lock sends a fresh</text>
<text x="314" y="260" font-size="12.5" fill="#5c5c5c">random challenge</text>
<text x="314" y="280" font-size="12.5" fill="#5c5c5c">number.</text>
<text x="314" y="326" font-size="12" font-weight="700" fill="#2c5454">different every tap</text>

<!-- step 3 -->
<rect x="520" y="150" width="200" height="232" rx="13" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="550" cy="184" r="16" fill="#3d6b6b"/>
<text x="550" y="189" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="580" y="189" font-size="15" font-weight="800" fill="#291c0e">Prove key</text>
<text x="544" y="240" font-size="12.5" fill="#5c5c5c">Card returns an</text>
<text x="544" y="260" font-size="12.5" fill="#5c5c5c">AES-128 response —</text>
<text x="544" y="280" font-size="12.5" fill="#5c5c5c">key stays on the card.</text>
<text x="544" y="326" font-size="12" font-weight="700" fill="#2c5454">nothing secret sent</text>

<!-- step 4 -->
<rect x="750" y="150" width="200" height="232" rx="13" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="780" cy="184" r="16" fill="#3d6b6b"/>
<text x="780" y="189" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="810" y="189" font-size="15" font-weight="800" fill="#291c0e">Verify</text>
<text x="774" y="240" font-size="12.5" fill="#5c5c5c">Both sides confirm</text>
<text x="774" y="260" font-size="12.5" fill="#5c5c5c">each other — not just</text>
<text x="774" y="280" font-size="12.5" fill="#5c5c5c">the card.</text>
<text x="774" y="326" font-size="12" font-weight="700" fill="#2c5454">mutual, not one-way</text>

<!-- step 5 -->
<rect x="980" y="150" width="200" height="232" rx="13" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<circle cx="1010" cy="184" r="16" fill="#1f6f3a"/>
<text x="1010" y="189" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
<text x="1040" y="189" font-size="15" font-weight="800" fill="#291c0e">Decide</text>
<text x="1004" y="240" font-size="12.5" fill="#5c5c5c">Lock reads room,</text>
<text x="1004" y="260" font-size="12.5" fill="#5c5c5c">validity, access level →</text>
<text x="1004" y="280" font-size="12.5" fill="#5c5c5c">grant or deny, locally.</text>
<text x="1004" y="326" font-size="12" font-weight="700" fill="#1f6f3a">no server needed</text>

<!-- arrows -->
<polygon points="290,266 274,258 274,274" fill="#c8b79a"/>
<polygon points="520,266 504,258 504,274" fill="#9dc0c0"/>
<polygon points="750,266 734,258 734,274" fill="#9dc0c0"/>
<polygon points="980,266 964,258 964,274" fill="#9dc0c0"/>

<rect x="60" y="430" width="1120" height="72" rx="12" fill="#f7ecec" stroke="#d8a9a9" stroke-width="1.6"/>
<circle cx="98" cy="466" r="15" fill="#8b2d2d"/>
<path d="M 92 460 L 104 472 M 104 460 L 92 472" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
<text x="128" y="462" font-size="14.5" font-weight="700" fill="#8b2d2d">UID-only systems stop at step 1.</text>
<text x="128" y="485" font-size="13.5" fill="#5c5c5c">They never issue a challenge — so a cloned UID walks straight in, no key required.</text>

<text x="600" y="556" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Steps 2–4 are the whole game: the card proves it knows a key without ever revealing it.</text>
</svg>
