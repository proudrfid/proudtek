<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five small-business RFID use cases that pay back fastest</title>
<desc id="d">Five cards: retail counting where a full-store inventory drops from 4 hours to 15 minutes; tool and equipment tracking that stops hundreds of dollars of yearly losses; shipping verification that avoids $50-300 error incidents; checkout tracking for shared and rented equipment; and clinic supply tracking with expiry monitoring. Each attacks a cost already being paid.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FASTEST PAYBACK FIRST</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Aim RFID at a cost you are already paying</text>

<rect x="52" y="136" width="356" height="216" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="230" y="172" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">Retail inventory counting</text>
<text x="230" y="232" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">4 h → 15 min</text>
<text x="230" y="262" text-anchor="middle" font-size="13" fill="#4f4f4f">whole-store count, weekly instead of yearly</text>
<text x="230" y="288" text-anchor="middle" font-size="13" fill="#4f4f4f">shrinkage caught while the trail is warm</text>
<text x="230" y="326" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">boutiques · specialty retail</text>

<rect x="422" y="136" width="356" height="216" rx="14" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="600" y="172" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">Tool &amp; equipment tracking</text>
<text x="600" y="232" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">hundreds $/yr</text>
<text x="600" y="262" text-anchor="middle" font-size="13" fill="#4f4f4f">misplaced and stolen tools, quietly written off</text>
<text x="600" y="288" text-anchor="middle" font-size="13" fill="#4f4f4f">tag the kit, scan the site before leaving</text>
<text x="600" y="326" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">contractors · landscapers · maintenance</text>

<rect x="792" y="136" width="356" height="216" rx="14" fill="#eef1f5" stroke="#4a5568" stroke-width="1.5"/>
<text x="970" y="172" text-anchor="middle" font-size="16" font-weight="800" fill="#4a5568">Receiving &amp; shipping checks</text>
<text x="970" y="232" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">$50–300</text>
<text x="970" y="262" text-anchor="middle" font-size="13" fill="#4f4f4f">cost of ONE shipping error — returns,</text>
<text x="970" y="288" text-anchor="middle" font-size="13" fill="#4f4f4f">re-shipment, customer credits</text>
<text x="970" y="326" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">small warehouses · e-commerce</text>

<rect x="237" y="386" width="356" height="216" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="415" y="422" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">Shared-equipment checkout</text>
<text x="415" y="478" text-anchor="middle" font-size="20" font-weight="800" fill="#291c0e">who · what · when due</text>
<text x="415" y="508" text-anchor="middle" font-size="13" fill="#4f4f4f">check-outs and returns tracked per item</text>
<text x="415" y="534" text-anchor="middle" font-size="13" fill="#4f4f4f">no more "it was here last week"</text>
<text x="415" y="572" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">co-working · maker spaces · rentals</text>

<rect x="607" y="386" width="356" height="216" rx="14" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="785" y="422" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">Clinic supply tracking</text>
<text x="785" y="478" text-anchor="middle" font-size="20" font-weight="800" fill="#291c0e">levels + expiry dates</text>
<text x="785" y="508" text-anchor="middle" font-size="13" fill="#4f4f4f">expensive supplies stop expiring unnoticed</text>
<text x="785" y="534" text-anchor="middle" font-size="13" fill="#4f4f4f">reorder from counts, not guesses</text>
<text x="785" y="572" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">small clinics · dental practices</text>

<text x="600" y="640" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Rule of thumb: the fastest ROI hides inside your most expensive recurring headache — start there.</text>
</svg>
