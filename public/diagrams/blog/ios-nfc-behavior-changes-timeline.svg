<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">iOS NFC behavior changes by version: iOS 14, iOS 17, and iOS 18.1</title>
<desc id="d">A timeline of three iOS releases that changed NFC behavior. iOS 14 removed the Control Center Tag Reader and made background tag reading always-on for iPhone XS and later. iOS 17 let the Shortcuts app write NDEF records via the Write to Tag automation, removing the need for a third-party app. iOS 18.1 opened Host Card Emulation and digital car keys, so an iPhone can act as the tag rather than only read one. Two non-versioned notes: background reading needs the screen on and a valid https URL, and VoiceOver or Guided Access can suppress scans.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">iOS NFC BEHAVIOR CHANGES</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Why a tag that worked last year can suddenly look broken.</text>

<!-- timeline -->
<line x1="150" y1="330" x2="1044" y2="330" stroke="#d8ccb2" stroke-width="3"/>
<polygon points="1044,322 1064,330 1044,338" fill="#c9bfa8"/>

<!-- Node 1: iOS 14 -->
<text x="290" y="298" text-anchor="middle" font-size="23" font-weight="800" fill="#2c5454">iOS 14</text>
<line x1="290" y1="345" x2="290" y2="356" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="290" cy="330" r="15" fill="#3d6b6b" stroke="#ffffff" stroke-width="3"/>
<rect x="140" y="356" width="300" height="176" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="140" y="356" width="300" height="6" rx="3" fill="#3d6b6b"/>
<text x="162" y="398" font-size="13.5" fill="#3a3a3a">Control Center Tag Reader</text>
<text x="162" y="422" font-size="13.5" fill="#3a3a3a">removed. Background reading</text>
<text x="162" y="446" font-size="13.5" fill="#3a3a3a">is always-on (iPhone XS+).</text>

<!-- Node 2: iOS 17 -->
<text x="600" y="298" text-anchor="middle" font-size="23" font-weight="800" fill="#8a6d34">iOS 17</text>
<line x1="600" y1="345" x2="600" y2="356" stroke="#c39a5f" stroke-width="2"/>
<circle cx="600" cy="330" r="15" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/>
<rect x="450" y="356" width="300" height="176" rx="12" fill="#ffffff" stroke="#e4d8bf" stroke-width="1.6"/>
<rect x="450" y="356" width="300" height="6" rx="3" fill="#c39a5f"/>
<text x="472" y="398" font-size="13.5" fill="#3a3a3a">Shortcuts can write NDEF via</text>
<text x="472" y="422" font-size="13.5" fill="#3a3a3a">the 'Write to Tag' automation</text>
<text x="472" y="446" font-size="13.5" fill="#3a3a3a">— no third-party app needed.</text>

<!-- Node 3: iOS 18.1 -->
<text x="910" y="298" text-anchor="middle" font-size="23" font-weight="800" fill="#1f6f3a">iOS 18.1</text>
<line x1="910" y1="345" x2="910" y2="356" stroke="#2d6a4f" stroke-width="2"/>
<circle cx="910" cy="330" r="15" fill="#2d6a4f" stroke="#ffffff" stroke-width="3"/>
<rect x="760" y="356" width="300" height="176" rx="12" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.6"/>
<rect x="760" y="356" width="300" height="6" rx="3" fill="#2d6a4f"/>
<text x="782" y="398" font-size="13.5" fill="#3a3a3a">Host Card Emulation +</text>
<text x="782" y="422" font-size="13.5" fill="#3a3a3a">digital car keys. iPhone can</text>
<text x="782" y="446" font-size="13.5" fill="#3a3a3a">act as the tag, not just read.</text>

<text x="600" y="590" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Also non-versioned: background reading needs screen-on + a valid https URL; VoiceOver or Guided Access can suppress scans.</text>
</svg>
