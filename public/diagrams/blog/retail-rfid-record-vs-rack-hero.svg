<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Barcode inventory drifts to 65-75% accuracy; RFID holds 95-99%, the omnichannel floor</title>
<desc id="d">An accuracy track from 60 to 100 percent. Barcode inventory sits in a red band at 65 to 75 percent; RFID sits in a green band at 95 to 99 percent. A gold line marks the 95 percent omnichannel floor: below it, records mean phantom stock and order cancellations; at or above it, ship-from-store, BOPIS and endless-aisle become reliable. Two stat chips note out-of-stocks fall 50 to 80 percent and same-store sales rise 2 to 10 percent.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RETAIL RFID · INVENTORY ACCURACY</text>
<text x="600" y="98" text-anchor="middle" font-size="38" font-weight="800" font-family="Lora, Georgia, serif" fill="#291c0e">The gap between the record and the rack.</text>
<text x="600" y="128" text-anchor="middle" font-size="16" fill="#4f4f4f">Barcode systems drift to 65–75% accuracy; RFID holds 95–99% — and 95% is where omnichannel starts working.</text>

<!-- accuracy track -->
<rect x="140" y="330" width="920" height="24" rx="12" fill="#efe7d6"/>
<!-- barcode band 65-75 -->
<rect x="255" y="330" width="230" height="24" rx="12" fill="#d98a8a"/>
<text x="370" y="312" text-anchor="middle" font-size="15" font-weight="800" fill="#8b2d2d">BARCODE 65–75%</text>
<!-- rfid band 95-99 -->
<rect x="945" y="330" width="92" height="24" rx="12" fill="#7fbf9a"/>
<text x="991" y="312" text-anchor="middle" font-size="15" font-weight="800" fill="#1f6f3a">RFID 95–99%</text>
<!-- 95% floor line -->
<line x1="945" y1="300" x2="945" y2="452" stroke="#c39a5f" stroke-width="2.4" stroke-dasharray="6 5"/>
<text x="945" y="472" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.3" fill="#6d5a3a">95% OMNICHANNEL FLOOR</text>
<!-- axis ticks -->
<text x="140" y="378" text-anchor="middle" font-size="12.5" fill="#8a8a8a">60%</text>
<text x="370" y="378" text-anchor="middle" font-size="12.5" fill="#8a8a8a">70%</text>
<text x="600" y="378" text-anchor="middle" font-size="12.5" fill="#8a8a8a">80%</text>
<text x="830" y="378" text-anchor="middle" font-size="12.5" fill="#8a8a8a">90%</text>
<text x="1060" y="378" text-anchor="middle" font-size="12.5" fill="#8a8a8a">100%</text>

<!-- zone labels -->
<text x="300" y="428" text-anchor="middle" font-size="14" font-weight="700" fill="#a85a5a">Below 95%: phantom stock,</text>
<text x="300" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#a85a5a">online orders cancelled</text>
<text x="1000" y="512" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">95%+ unlocks:</text>
<text x="1000" y="532" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">BOPIS · ship-from-store</text>
<text x="1000" y="552" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">· endless-aisle</text>

<!-- stat chips -->
<rect x="150" y="500" width="300" height="66" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="176" y="536" font-size="26" font-weight="800" fill="#1f6f3a">−50–80%</text>
<text x="320" y="528" font-size="13.5" font-weight="700" fill="#291c0e">out-of-stocks</text>
<text x="320" y="547" font-size="12.5" fill="#5c5c5c">on tagged items</text>
<rect x="470" y="500" width="300" height="66" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="496" y="536" font-size="26" font-weight="800" fill="#a07d43">+2–10%</text>
<text x="628" y="528" font-size="13.5" font-weight="700" fill="#291c0e">same-store sales</text>
<text x="628" y="547" font-size="12.5" fill="#5c5c5c">from availability</text>

<text x="600" y="612" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Close the record-to-rack gap and the omnichannel revenue is what pays for the tags.</text>
</svg>
