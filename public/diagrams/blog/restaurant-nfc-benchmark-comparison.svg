<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="bcTitle bcDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="bcTitle">This group's 78% tap-to-review completion next to published benchmarks</title>
  <desc id="bcDesc">A horizontal bar chart of tap-to-review completion rate on a 0 to 100% axis. TAPro publishes a 75 to 80% completion band across 11,500-plus SMBs. TAPro's quick-service diner case study reports 75% when a card is handed with every order. This restaurant group measured 78% on tapped sessions — inside the published band. The old email follow-up program completed at 8%. A footer notes the velocity benchmarks: EmbedSocial-style cafe uplift 5x and TAPiTAG and Wiremo 2 to 3x, versus this group's 4.2x week-over-week; and the Map Pack benchmark, TAPro's Luxe Salon reaching a top-3 position on 59 reviews in 30 days against this group's roughly 60 reviews per location per month.</desc>
  <defs>
    <radialGradient id="bcBg" cx="50%" cy="18%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bcBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="1.2" fill="#6d5a3a">OUR 78% vs THE PUBLISHED RECORD</text>
  <text x="600" y="84" text-anchor="middle" font-size="14.5" fill="#6d5a3a">Tap-to-review completion rate — where our number sits among the public datasets</text>

  <!-- gridlines + axis labels -->
  <g stroke="#efe6d5" stroke-width="1">
    <line x1="360" y1="104" x2="360" y2="430"/>
    <line x1="512" y1="104" x2="512" y2="430"/>
    <line x1="664" y1="104" x2="664" y2="430"/>
    <line x1="816" y1="104" x2="816" y2="430"/>
    <line x1="968" y1="104" x2="968" y2="430"/>
    <line x1="1120" y1="104" x2="1120" y2="430"/>
  </g>
  <g font-size="12" fill="#a8946c" text-anchor="middle">
    <text x="360" y="450">0</text>
    <text x="512" y="450">20</text>
    <text x="664" y="450">40</text>
    <text x="816" y="450">60</text>
    <text x="968" y="450">80</text>
    <text x="1120" y="450">100%</text>
  </g>
  <line x1="360" y1="104" x2="360" y2="430" stroke="#d9cbb0" stroke-width="1.5"/>

  <!-- Row 1: TAPro band -->
  <text x="340" y="167" text-anchor="end" font-size="15.5" font-weight="700" fill="#291c0e">TAPro — published band</text>
  <text x="340" y="185" text-anchor="end" font-size="12.5" fill="#6d5a3a">across 11,500+ SMBs</text>
  <rect x="360" y="156" width="570" height="30" rx="6" fill="#c39a5f"/>
  <rect x="930" y="156" width="38" height="30" fill="#e4c98f"/>
  <text x="944" y="177" text-anchor="end" font-size="14" font-weight="800" fill="#ffffff">75–80%</text>

  <!-- Row 2: quick-service diner -->
  <text x="340" y="243" text-anchor="end" font-size="15.5" font-weight="700" fill="#291c0e">TAPro — quick-service diner</text>
  <text x="340" y="261" text-anchor="end" font-size="12.5" fill="#6d5a3a">card handed with every order</text>
  <rect x="360" y="232" width="570" height="30" rx="6" fill="#c39a5f"/>
  <text x="918" y="253" text-anchor="end" font-size="14.5" font-weight="800" fill="#ffffff">75%</text>

  <!-- Row 3: ours (primary) -->
  <text x="340" y="319" text-anchor="end" font-size="15.5" font-weight="800" fill="#177a92">This restaurant group</text>
  <text x="340" y="337" text-anchor="end" font-size="12.5" fill="#6d5a3a">measured on tapped sessions</text>
  <rect x="360" y="308" width="592.8" height="30" rx="6" fill="#1fcefb" stroke="#0f8fb0" stroke-width="1.5"/>
  <text x="941" y="329" text-anchor="end" font-size="14.5" font-weight="800" fill="#0d3f4d">78%</text>

  <!-- Row 4: email -->
  <text x="340" y="395" text-anchor="end" font-size="15.5" font-weight="700" fill="#8a7550">Email follow-up</text>
  <text x="340" y="413" text-anchor="end" font-size="12.5" fill="#a8946c">the program NFC replaced</text>
  <rect x="360" y="384" width="60.8" height="30" rx="6" fill="#d9b8b3"/>
  <text x="432" y="405" text-anchor="start" font-size="14.5" font-weight="800" fill="#8b2d2d">8%</text>

  <!-- Footer notes card -->
  <rect x="56" y="484" width="1088" height="142" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="84" y="518" font-size="14.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">AND ON THE OTHER TWO YARDSTICKS</text>
  <text x="84" y="548" font-size="15" fill="#291c0e"><tspan font-weight="800" fill="#177a92">Velocity —</tspan> EmbedSocial-style cafés report 5x and TAPiTAG / Wiremo put the floor at 2–3x. This group ran 4.2x week-over-week.</text>
  <text x="84" y="578" font-size="15" fill="#291c0e"><tspan font-weight="800" fill="#177a92">Map Pack —</tspan> TAPro's Luxe Salon hit a top-3 slot on 59 reviews in 30 days; this group averages ~60 per location per month.</text>
  <text x="84" y="610" font-size="13" fill="#6d5a3a">A single vendor number is a boast; a number that lands inside the published band is a benchmark. Sources: TAPro · EmbedSocial · TAPiTAG · Wiremo.</text>
</svg>
