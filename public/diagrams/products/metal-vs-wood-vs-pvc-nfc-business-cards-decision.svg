<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Decision guide for choosing an NFC business-card material</title>
  <desc id="d">A three-way decision guide. For executive and high-value external meetings choose metal — daily client-facing use where durability and a 60-75% keep-rate pay back, viable under 100 cards. For team and event rollouts of 50 to 10,000 choose PVC at $1.50-$4 per card with full-colour print and 7-15 day lead time. For eco-led and boutique brands choose wood — FSC bamboo or hardwood, laser-burnt branding, 2-5 year life. The NFC chip is chosen separately: NTAG 213 for a URL, NTAG 215 or 216 for analytics, NTAG 424 DNA for authentication.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHICH MATERIAL — DECIDE BY AUDIENCE AND SCALE</text>
  <text x="600" y="82" text-anchor="middle" font-size="15" fill="#5c5c5c">Match material to recipient psychology and rollout size, not to "premium equals better"</text>

  <rect x="70" y="128" width="330" height="316" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="128" width="330" height="46" rx="14" fill="#4a5568"/>
  <text x="235" y="158" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">EXECUTIVE</text>
  <text x="235" y="222" text-anchor="middle" font-size="30" font-weight="800" fill="#4a5568">METAL</text>
  <text x="235" y="264" text-anchor="middle" font-size="13.5" fill="#5c5c5c">High-value external meetings,</text>
  <text x="235" y="284" text-anchor="middle" font-size="13.5" fill="#5c5c5c">daily client-facing use</text>
  <text x="235" y="318" text-anchor="middle" font-size="13.5" fill="#291c0e">Durability + 60–75% keep-rate</text>
  <text x="235" y="338" text-anchor="middle" font-size="13.5" fill="#291c0e">pays back; viable under 100</text>
  <text x="235" y="372" text-anchor="middle" font-size="13" fill="#8a6d3b">$12–$45 · needs on-metal antenna</text>

  <rect x="435" y="128" width="330" height="316" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="435" y="128" width="330" height="46" rx="14" fill="#3d6b6b"/>
  <text x="600" y="158" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">TEAM / EVENT</text>
  <text x="600" y="222" text-anchor="middle" font-size="30" font-weight="800" fill="#3d6b6b">PVC</text>
  <text x="600" y="264" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Team-wide sales, event staff,</text>
  <text x="600" y="284" text-anchor="middle" font-size="13.5" fill="#5c5c5c">1,000+ card rollouts</text>
  <text x="600" y="318" text-anchor="middle" font-size="13.5" fill="#291c0e">Unit economics dominate;</text>
  <text x="600" y="338" text-anchor="middle" font-size="13.5" fill="#291c0e">full-colour, 7–15 day lead</text>
  <text x="600" y="372" text-anchor="middle" font-size="13" fill="#2c5454">$1.50–$4 · full-spec NFC read</text>

  <rect x="800" y="128" width="330" height="316" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="800" y="128" width="330" height="46" rx="14" fill="#8a6d3b"/>
  <text x="965" y="158" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">ECO / BOUTIQUE</text>
  <text x="965" y="222" text-anchor="middle" font-size="30" font-weight="800" fill="#8a6d3b">WOOD</text>
  <text x="965" y="264" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Eco-led brands, craft and</text>
  <text x="965" y="284" text-anchor="middle" font-size="13.5" fill="#5c5c5c">high-touch small teams</text>
  <text x="965" y="318" text-anchor="middle" font-size="13.5" fill="#291c0e">FSC bamboo / hardwood,</text>
  <text x="965" y="338" text-anchor="middle" font-size="13.5" fill="#291c0e">distinctive grain; 2–5 yr life</text>
  <text x="965" y="372" text-anchor="middle" font-size="13" fill="#8a6d3b">$6–$18 · read range −20–30%</text>

  <rect x="70" y="470" width="1060" height="74" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="92" y="500" font-size="15" font-weight="700" fill="#2c5454">The NFC chip is a separate choice from the material</text>
  <text x="92" y="524" font-size="13.5" fill="#3d6b6b">NTAG 213 for a URL redirect · NTAG 215 / 216 for analytics and tap counts · NTAG 424 DNA for cryptographic authentication.</text>

  <text x="600" y="590" text-anchor="middle" font-size="13" fill="#5c5c5c">Pilot 25–50 cards in the chosen material for 4–6 weeks before a full rollout — feel, read reliability and reactions.</text>
</svg>
