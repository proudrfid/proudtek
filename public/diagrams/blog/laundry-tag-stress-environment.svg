<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The commercial-laundry conditions an RFID tag must survive</title>
<desc id="d">A central RFID tag in a garment hem, attacked from four sides: hot water at 60-85°C with alkaline wash, chemicals including chlorine bleach and detergents, mechanical tumble and spin agitation, and dry heat from pressing or tunnel finishing at 180-220°C — repeated for 200-300 wash cycles.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<marker id="ah" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b9b2a4"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE COMMERCIAL-LAUNDRY GAUNTLET</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">What the tag in the hem has to shrug off, every cycle.</text>

<!-- arrows (drawn first, behind cards/tag) -->
<line x1="360" y1="192" x2="500" y2="312" stroke="#c9c1b2" stroke-width="2" marker-end="url(#ah)"/>
<line x1="840" y1="192" x2="700" y2="312" stroke="#c9c1b2" stroke-width="2" marker-end="url(#ah)"/>
<line x1="360" y1="482" x2="500" y2="374" stroke="#c9c1b2" stroke-width="2" marker-end="url(#ah)"/>
<line x1="840" y1="482" x2="700" y2="374" stroke="#c9c1b2" stroke-width="2" marker-end="url(#ah)"/>

<!-- central tag -->
<rect x="505" y="300" width="190" height="86" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.4"/>
<text x="600" y="336" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">RFID TAG</text>
<text x="600" y="360" text-anchor="middle" font-size="12" fill="#5c5c5c">in the garment hem</text>

<!-- TL hot water -->
<rect x="96" y="150" width="264" height="72" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="118" y="182" font-size="14.5" font-weight="800" fill="#a07d43">HOT WATER</text>
<text x="118" y="204" font-size="12.5" fill="#5c5c5c">60-85°C alkaline wash</text>

<!-- TR chemicals -->
<rect x="840" y="150" width="264" height="72" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="862" y="182" font-size="14.5" font-weight="800" fill="#2c5454">CHEMICALS</text>
<text x="862" y="204" font-size="12.5" fill="#5c5c5c">chlorine bleach + detergents</text>

<!-- BL mechanical -->
<rect x="96" y="452" width="264" height="72" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="118" y="484" font-size="14.5" font-weight="800" fill="#2c5454">MECHANICAL</text>
<text x="118" y="506" font-size="12.5" fill="#5c5c5c">tumble + spin agitation</text>

<!-- BR dry heat -->
<rect x="840" y="452" width="264" height="72" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="862" y="484" font-size="14.5" font-weight="800" fill="#a07d43">DRY HEAT</text>
<text x="862" y="506" font-size="12.5" fill="#5c5c5c">press / tunnel 180-220°C</text>

<text x="600" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">× repeated for 200-300 wash cycles</text>
<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The housing material is the whole game: pick right and it quietly lasts.</text>
</svg>
