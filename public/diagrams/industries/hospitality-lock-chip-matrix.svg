<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="lcTitle lcDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="lcTitle">The lock picks the chip: hotel lock ecosystem to recommended credential</title>
  <desc id="lcDesc">Two bands. Native DESFire-generation locks — ASSA ABLOY VingCard and Visionline, Salto XS4 and KS, Saflok Quantum and Confidant RFID, and Onity Advance — map to MIFARE DESFire EV3 with AES-128, the new-build default. The legacy installed base — Saflok RT and MT, Onity HT, and Be-Tech, TESA and regional OEMs (confirm per property) — maps to MIFARE Classic 1K on CRYPTO-1, which migrates via MIFARE Plus SE, an AES-128 drop-in. The lock's firmware generation decides which credential it accepts.</desc>

  <defs>
    <radialGradient id="lcGlow" cx="50%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#lcGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="64" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2.5" fill="#6d5a3a">THE LOCK PICKS THE CHIP</text>
  <text x="600" y="90" text-anchor="middle" font-size="13.5" fill="#a0895f">A property's lock firmware generation decides which credential it will accept</text>

  <!-- ============ Band A: DESFire-generation ============ -->
  <rect x="72" y="110" width="1056" height="192" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="96" y="142" font-size="13" font-weight="700" letter-spacing="1" fill="#6c5127">NATIVE DESFIRE-GENERATION LOCKS</text>

  <g font-size="14.5" font-weight="600" fill="#291c0e">
    <rect x="96" y="154" width="306" height="36" rx="18" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
    <text x="112" y="177">ASSA ABLOY VingCard / Visionline</text>
    <rect x="416" y="154" width="150" height="36" rx="18" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
    <text x="432" y="177">Salto XS4 / KS</text>
    <rect x="96" y="200" width="296" height="36" rx="18" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
    <text x="112" y="223">Saflok Quantum / Confidant RFID</text>
    <rect x="406" y="200" width="160" height="36" rx="18" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
    <text x="422" y="223">Onity Advance</text>
  </g>

  <path d="M606 204 h34 v-10 l24 16 -24 16 v-10 h-34 z" fill="#c39a5f"/>

  <rect x="700" y="146" width="404" height="120" rx="14" fill="#6c5127"/>
  <text x="902" y="196" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">MIFARE DESFire EV3</text>
  <text x="902" y="228" text-anchor="middle" font-size="15" fill="#e8d9bd">AES-128 · multi-application</text>
  <text x="902" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#d4a755">the new-build default</text>

  <!-- ============ Band B: legacy ============ -->
  <rect x="72" y="318" width="1056" height="192" rx="16" fill="#eef1f4" stroke="#cdd7de" stroke-width="2"/>
  <text x="96" y="350" font-size="13" font-weight="700" letter-spacing="1" fill="#4a5568">LEGACY INSTALLED BASE</text>

  <g font-size="14.5" font-weight="600" fill="#291c0e">
    <rect x="96" y="362" width="160" height="36" rx="18" fill="#ffffff" stroke="#cdd7de" stroke-width="1.5"/>
    <text x="112" y="385">Saflok RT / MT</text>
    <rect x="270" y="362" width="120" height="36" rx="18" fill="#ffffff" stroke="#cdd7de" stroke-width="1.5"/>
    <text x="286" y="385">Onity HT</text>
    <rect x="96" y="408" width="330" height="36" rx="18" fill="#ffffff" stroke="#cdd7de" stroke-width="1.5"/>
    <text x="112" y="431">Be-Tech / TESA / regional OEMs</text>
  </g>
  <text x="112" y="470" font-size="12.5" fill="#55687a">Regional OEMs vary — confirm the chip per property.</text>

  <path d="M606 412 h34 v-10 l24 16 -24 16 v-10 h-34 z" fill="#8a949c"/>

  <rect x="700" y="352" width="404" height="94" rx="14" fill="#4a5568"/>
  <text x="902" y="392" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">MIFARE Classic 1K</text>
  <text x="902" y="422" text-anchor="middle" font-size="14.5" fill="#c7d0da">CRYPTO-1 · legacy fleets only</text>
  <text x="902" y="480" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4a5568">↑ migrate via MIFARE Plus SE (AES-128 drop-in)</text>

  <text x="600" y="556" text-anchor="middle" font-size="15" fill="#6d5a3a">Send the lock model plate, firmware version and a working card — we confirm the chip on a lab-side read.</text>
</svg>
