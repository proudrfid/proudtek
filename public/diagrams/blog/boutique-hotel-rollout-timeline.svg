<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="rtTitle rtDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="rtTitle">Card choice, lock pairing, and the 11-week rollout</title>
  <desc id="rtDesc">The card is MIFARE Classic 1K, 86 by 54 millimetres, 0.76 millimetre PVC, full-color CMYK plus spot UV, 0.34 dollars each at 25,000 minimum order. The lock is the Salto AElement Fusion: battery, no wiring, retrofitting the 1998 mortise — 78 locks at 215 dollars plus 42 dollars labor each. The rollout ran as 11 weekend phases cutting over 6 rooms per weekend, never more than 8 percent of inventory offline, with zero room-revenue downtime. Also: a 90-minute training session for all 14 front-desk associates and 3,500 cards stocked at launch, a 45-day supply, reordered quarterly.</desc>

  <defs>
    <radialGradient id="rtBg" cx="50%" cy="20%" r="88%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#rtBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="62" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#6d5a3a">CARD, LOCK &amp; THE 11-WEEK ROLLOUT</text>

  <!-- Spec card: THE CARD -->
  <rect x="60" y="90" width="540" height="150" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="84" y="124" font-size="14.5" font-weight="700" letter-spacing="1.5" fill="#6d5a3a">THE CARD</text>
  <text x="84" y="160" font-size="26" font-weight="800" fill="#291c0e">MIFARE Classic 1K</text>
  <text x="84" y="190" font-size="16.5" fill="#4f4f4f">86×54mm · 0.76mm PVC · full-color CMYK + spot UV</text>
  <rect x="84" y="204" width="182" height="30" rx="15" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="175" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">$0.34 each · 25K MOQ</text>

  <!-- Spec card: THE LOCK -->
  <rect x="600" y="90" width="540" height="150" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="624" y="124" font-size="14.5" font-weight="700" letter-spacing="1.5" fill="#6d5a3a">THE LOCK</text>
  <text x="624" y="160" font-size="26" font-weight="800" fill="#291c0e">Salto AElement Fusion</text>
  <text x="624" y="190" font-size="16.5" fill="#4f4f4f">Battery · no wiring · retrofits 1998 mortise</text>
  <rect x="624" y="204" width="200" height="30" rx="15" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="724" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">$215 lock + $42 labor</text>

  <!-- Timeline -->
  <text x="600" y="292" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">11 weekend phases · 6 rooms cut over each weekend</text>
  <line x1="120" y1="344" x2="1080" y2="344" stroke="#c39a5f" stroke-width="6" stroke-linecap="round"/>
  <g fill="#c39a5f" stroke="#ffffff" stroke-width="2">
    <circle cx="120" cy="344" r="11"/><circle cx="216" cy="344" r="11"/><circle cx="312" cy="344" r="11"/><circle cx="408" cy="344" r="11"/><circle cx="504" cy="344" r="11"/><circle cx="600" cy="344" r="11"/><circle cx="696" cy="344" r="11"/><circle cx="792" cy="344" r="11"/><circle cx="888" cy="344" r="11"/><circle cx="984" cy="344" r="11"/><circle cx="1080" cy="344" r="11"/>
  </g>
  <text x="120" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">Week 1</text>
  <text x="1080" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">Week 11</text>

  <!-- offline callout -->
  <rect x="404" y="398" width="392" height="46" rx="23" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.5"/>
  <text x="600" y="427" text-anchor="middle" font-size="16.5" font-weight="700" fill="#177a92">Never more than 8% of rooms offline · zero downtime</text>

  <!-- Bottom stat chips -->
  <rect x="60" y="474" width="256" height="78" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="188" y="512" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">78 locks</text>
  <text x="188" y="536" text-anchor="middle" font-size="14" fill="#4f4f4f">installed over 11 weekends</text>
  <rect x="332" y="474" width="256" height="78" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="460" y="512" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">90-min · 14</text>
  <text x="460" y="536" text-anchor="middle" font-size="14" fill="#4f4f4f">training · front-desk associates</text>
  <rect x="604" y="474" width="256" height="78" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="732" y="512" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">3,500 cards</text>
  <text x="732" y="536" text-anchor="middle" font-size="14" fill="#4f4f4f">at launch · 45-day supply</text>
  <rect x="876" y="474" width="264" height="78" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="1008" y="512" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">Quarterly</text>
  <text x="1008" y="536" text-anchor="middle" font-size="14" fill="#4f4f4f">reorder cadence</text>

  <text x="600" y="600" text-anchor="middle" font-size="16.5" fill="#6d5a3a">Six rooms a weekend for eleven weekends — slow enough to be boring, which on a live hotel is the whole point.</text>
</svg>
