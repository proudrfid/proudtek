<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Watch buckle, 6-10 holes — one SKU fits every wrist</title>
  <desc id="d">Stainless-steel watch buckle with 6-10 adjustment holes spans 130-220 mm wrist circumference, replacing the 4-5 fixed-size variants (toddler, child, teen, adult) a fixed-size programme must stock and forecast.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">One band, every wrist in the family</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">6-10 buckle holes cover 130-220 mm — the SKU sheet shrinks to one line</text>
  <g transform="translate(70,160)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="40" width="560" height="70" rx="35" fill="#eef2f0" stroke="#2c5454" stroke-width="3"/>
    <g fill="#2c5454">
      <circle cx="300" cy="75" r="7"/><circle cx="340" cy="75" r="7"/><circle cx="380" cy="75" r="7"/>
      <circle cx="420" cy="75" r="7"/><circle cx="460" cy="75" r="7"/><circle cx="500" cy="75" r="7"/>
    </g>
    <rect x="30" y="52" width="60" height="46" rx="8" fill="#ffffff" stroke="#2c5454" stroke-width="2.5"/>
    <text x="36" y="130" font-size="12" fill="#6d5a3a">steel buckle</text>
    <text x="292" y="140" font-size="12" fill="#6d5a3a">6-10 adjustment holes</text>
    <text x="0" y="190" font-size="14" fill="#2c5454">wrist span: 130-220 mm — toddler to adult on the same band</text>
  </g>
  <g transform="translate(700,150)">
    <rect x="0" y="0" width="430" height="290" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="17" fill="#291c0e">The stockroom before and after</text>
    <text x="24" y="78" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8b2d2d">Fixed-size programme: 4-5 SKUs</text>
    <text x="24" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">toddler / child / teen / adult (+XL) — each</text>
    <text x="24" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">forecast, stocked and re-ordered separately</text>
    <line x1="24" y1="150" x2="406" y2="150" stroke="#d8cdb8" stroke-width="1.5"/>
    <text x="24" y="184" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Adjustable programme: 1 SKU</text>
    <text x="24" y="208" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">one forecast line, one reorder point,</text>
    <text x="24" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">zero size-mismatch returns at the desk</text>
    <text x="24" y="266" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">Family parks, resorts, kids clubs live here</text>
  </g>
</svg>
