<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Lifecycle of an RFID cable seal across the custody chain</title>
  <desc id="d">Five-step flow of a single-use RFID cable seal. Step 1 at the shipper dock: the cable is threaded through the hasp and the one-way lock clicks shut. Step 2 in the shipper TMS: the factory TID and printed serial are paired with the container number and consignment record. Step 3 in transit: portal readers at yard gates, ports and borders capture the seal at 2 to 4 meters with trucks passing at 15 to 20 km/h. Step 4 at the destination: the reader checks the TID against the expected record and confirms a match in under 100 milliseconds. Step 5 close-out: the cable is cut, the seal is retired, and the cut seal is archived as custody evidence. A red band underneath warns that any TID mismatch at any hop raises a substitution alarm before cargo release.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID CABLE SEAL — CUSTODY LIFECYCLE</text>
  <text x="600" y="102" text-anchor="middle" font-size="36" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">One journey, one seal, one story</text>
  <text x="600" y="130" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Every read event lands in the same audit trail — and a cut seal never rides twice</text>

  <!-- phase micro-labels -->
  <text x="161" y="196" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1" fill="#6d5a3a">SHIPPER DOCK</text>
  <text x="391" y="196" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1" fill="#6d5a3a">SHIPPER TMS</text>
  <text x="621" y="196" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1" fill="#6d5a3a">IN TRANSIT</text>
  <text x="851" y="196" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1" fill="#6d5a3a">DESTINATION</text>
  <text x="1081" y="196" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1" fill="#6d5a3a">CLOSE-OUT</text>

  <!-- step cards -->
  <rect x="66" y="210" width="190" height="182" rx="14" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <circle cx="94" cy="240" r="15" fill="#3d6b6b"/>
  <text x="94" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
  <text x="118" y="246" font-size="15.5" font-weight="700" fill="#291c0e">Seal &amp; click</text>
  <text x="82" y="284" font-size="12.5" fill="#4f4f4f">Cable through the</text>
  <text x="82" y="303" font-size="12.5" fill="#4f4f4f">hasp; one-way lock</text>
  <text x="82" y="322" font-size="12.5" fill="#4f4f4f">engages at the dock.</text>
  <text x="82" y="352" font-size="12.5" font-weight="700" fill="#2c5454">Irreversible from</text>
  <text x="82" y="370" font-size="12.5" font-weight="700" fill="#2c5454">the first click.</text>

  <path d="M262 296 h22" stroke="#4a5568" stroke-width="3"/>
  <path d="M290 296 l-10 -6 v12 Z" fill="#4a5568"/>

  <rect x="296" y="210" width="190" height="182" rx="14" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <circle cx="324" cy="240" r="15" fill="#3d6b6b"/>
  <text x="324" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
  <text x="348" y="246" font-size="15.5" font-weight="700" fill="#291c0e">Pair the identity</text>
  <text x="312" y="284" font-size="12.5" fill="#4f4f4f">TID + printed serial</text>
  <text x="312" y="303" font-size="12.5" fill="#4f4f4f">bound to container</text>
  <text x="312" y="322" font-size="12.5" fill="#4f4f4f">and consignment.</text>
  <text x="312" y="352" font-size="12.5" font-weight="700" fill="#2c5454">The master custody</text>
  <text x="312" y="370" font-size="12.5" font-weight="700" fill="#2c5454">record is born.</text>

  <path d="M492 296 h22" stroke="#4a5568" stroke-width="3"/>
  <path d="M520 296 l-10 -6 v12 Z" fill="#4a5568"/>

  <rect x="526" y="210" width="190" height="182" rx="14" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <circle cx="554" cy="240" r="15" fill="#3d6b6b"/>
  <text x="554" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
  <text x="578" y="246" font-size="15.5" font-weight="700" fill="#291c0e">Portal reads</text>
  <text x="542" y="284" font-size="12.5" fill="#4f4f4f">Yard gate, port and</text>
  <text x="542" y="303" font-size="12.5" fill="#4f4f4f">border capture at</text>
  <text x="542" y="322" font-size="12.5" fill="#4f4f4f">2–4 m, in motion.</text>
  <text x="542" y="352" font-size="12.5" font-weight="700" fill="#2c5454">Trucks pass at</text>
  <text x="542" y="370" font-size="12.5" font-weight="700" fill="#2c5454">15–20 km/h.</text>

  <path d="M722 296 h22" stroke="#4a5568" stroke-width="3"/>
  <path d="M750 296 l-10 -6 v12 Z" fill="#4a5568"/>

  <rect x="756" y="210" width="190" height="182" rx="14" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <circle cx="784" cy="240" r="15" fill="#3d6b6b"/>
  <text x="784" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
  <text x="808" y="246" font-size="15.5" font-weight="700" fill="#291c0e">Verify at receiving</text>
  <text x="772" y="284" font-size="12.5" fill="#4f4f4f">TID checked against</text>
  <text x="772" y="303" font-size="12.5" fill="#4f4f4f">the expected record</text>
  <text x="772" y="322" font-size="12.5" fill="#4f4f4f">before release.</text>
  <text x="772" y="352" font-size="12.5" font-weight="700" fill="#2c5454">Match confirmed</text>
  <text x="772" y="370" font-size="12.5" font-weight="700" fill="#2c5454">in sub-100 ms.</text>

  <path d="M952 296 h22" stroke="#4a5568" stroke-width="3"/>
  <path d="M980 296 l-10 -6 v12 Z" fill="#4a5568"/>

  <rect x="986" y="210" width="190" height="182" rx="14" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <circle cx="1014" cy="240" r="15" fill="#4a5568"/>
  <text x="1014" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
  <text x="1038" y="246" font-size="15.5" font-weight="700" fill="#291c0e">Cut, log, retire</text>
  <text x="1002" y="284" font-size="12.5" fill="#4f4f4f">Single use by design:</text>
  <text x="1002" y="303" font-size="12.5" fill="#4f4f4f">cable is cut, seal is</text>
  <text x="1002" y="322" font-size="12.5" fill="#4f4f4f">retired from service.</text>
  <text x="1002" y="352" font-size="12.5" font-weight="700" fill="#2c5454">Cut seal archived</text>
  <text x="1002" y="370" font-size="12.5" font-weight="700" fill="#2c5454">as evidence.</text>

  <!-- custody trail note -->
  <text x="600" y="452" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Four read events write the chain of custody; the ISO 18185 e-Seal frame feeds the customs single window.</text>
  <path d="M120 476 h960" stroke="#d9cfba" stroke-width="1.5"/>
  <circle cx="161" cy="476" r="5" fill="#3d6b6b"/>
  <circle cx="391" cy="476" r="5" fill="#3d6b6b"/>
  <circle cx="621" cy="476" r="5" fill="#3d6b6b"/>
  <circle cx="851" cy="476" r="5" fill="#3d6b6b"/>
  <circle cx="1081" cy="476" r="5" fill="#4a5568"/>
  <text x="161" y="500" text-anchor="middle" font-size="12" fill="#5c5c5c">sealed</text>
  <text x="391" y="500" text-anchor="middle" font-size="12" fill="#5c5c5c">paired</text>
  <text x="621" y="500" text-anchor="middle" font-size="12" fill="#5c5c5c">gate + border reads</text>
  <text x="851" y="500" text-anchor="middle" font-size="12" fill="#5c5c5c">received + verified</text>
  <text x="1081" y="500" text-anchor="middle" font-size="12" fill="#5c5c5c">retired</text>

  <!-- substitution alarm band (risk state) -->
  <rect x="120" y="540" width="960" height="48" rx="12" fill="#faf1f1" stroke="#8b2d2d" stroke-width="2"/>
  <text x="600" y="570" text-anchor="middle" font-size="15" font-weight="700" fill="#8b2d2d">Any TID mismatch at any hop = substitution alarm before cargo release</text>

  <text x="600" y="630" text-anchor="middle" font-size="12.5" fill="#5c5c5c">A swapped seal carries the wrong silicon; the record built in step 2 is the witness that convicts it.</text>
</svg>
