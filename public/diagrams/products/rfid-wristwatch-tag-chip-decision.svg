<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Which chip belongs in an RFID watch tag</title>
  <desc id="d">A decision map with a teal RFID watch-tag node on the left pointing to four chip outcome cards on the right: DESFire EV3 at 13.56 MHz with AES-128 for access and stored value, the resort and cashless reference chip; NTAG213 / NTAG216 at 13.56 MHz for a souvenir NDEF tap-to-URL with no authenticated access control; EM4305 / T5577 at 125 kHz LF for legacy readers during a migration window; and MIFARE Classic 1K shown in red because its CRYPTO-1 cipher has been public since 2008 and is discouraged for new programmes. A red caption at the bottom states that 125 kHz LF and MIFARE Classic carry no usable air-interface cryptography, so stored value and door access should stay on DESFire EV3 AES-128.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHICH CHIP BELONGS IN THE WATCH</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Match the silicon to the money on the wrist — the strap is the easy part</text>

  <!-- left node -->
  <rect x="104" y="238" width="256" height="196" rx="16" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
  <text x="232" y="300" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">RFID WATCH TAG</text>
  <text x="232" y="332" text-anchor="middle" font-size="14" fill="#eef5f5">worn HF credential</text>
  <text x="232" y="356" text-anchor="middle" font-size="14" fill="#eef5f5">13.56 MHz · tap to access</text>
  <text x="232" y="388" text-anchor="middle" font-size="13" fill="#d7e6e6">one strap, four chip choices</text>

  <!-- arrows -->
  <line x1="360" y1="336" x2="704" y2="157" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="704,157 690,153 692,166" fill="#4a5568"/>
  <line x1="360" y1="336" x2="704" y2="249" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="704,249 690,244 690,257" fill="#4a5568"/>
  <line x1="360" y1="336" x2="704" y2="341" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="704,341 690,336 690,349" fill="#4a5568"/>
  <line x1="360" y1="336" x2="704" y2="433" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="704,433 690,428 692,441" fill="#4a5568"/>

  <!-- card 1 DESFire EV3 -->
  <rect x="712" y="118" width="452" height="80" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="712" y="118" width="8" height="80" rx="4" fill="#3d6b6b"/>
  <text x="736" y="146" font-size="17" font-weight="700" fill="#291c0e">DESFire EV3 · 13.56 MHz</text>
  <text x="736" y="168" font-size="13" fill="#5c5c5c">Access + stored value · AES-128</text>
  <text x="736" y="188" font-size="12.5" fill="#5c5c5c">The resort &amp; cashless reference chip</text>

  <!-- card 2 NTAG -->
  <rect x="712" y="210" width="452" height="80" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="712" y="210" width="8" height="80" rx="4" fill="#3d6b6b"/>
  <text x="736" y="238" font-size="17" font-weight="700" fill="#291c0e">NTAG213 / NTAG216 · 13.56 MHz</text>
  <text x="736" y="260" font-size="13" fill="#5c5c5c">Souvenir NDEF tap-to-URL</text>
  <text x="736" y="280" font-size="12.5" fill="#5c5c5c">No authenticated access control</text>

  <!-- card 3 EM4305 / T5577 -->
  <rect x="712" y="302" width="452" height="80" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="712" y="302" width="8" height="80" rx="4" fill="#4a5568"/>
  <text x="736" y="330" font-size="17" font-weight="700" fill="#291c0e">EM4305 / T5577 · 125 kHz LF</text>
  <text x="736" y="352" font-size="13" fill="#5c5c5c">Legacy 125 kHz readers</text>
  <text x="736" y="372" font-size="12.5" fill="#5c5c5c">Drop-in for a migration window</text>

  <!-- card 4 MIFARE Classic (risk) -->
  <rect x="712" y="394" width="452" height="80" rx="12" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="2"/>
  <rect x="712" y="394" width="8" height="80" rx="4" fill="#8b2d2d"/>
  <text x="736" y="422" font-size="17" font-weight="700" fill="#8b2d2d">MIFARE Classic 1K</text>
  <text x="736" y="444" font-size="13" fill="#8b2d2d">CRYPTO-1 public since 2008</text>
  <text x="736" y="464" font-size="12.5" fill="#8b2d2d">Discouraged for new programmes</text>

  <!-- risk caption -->
  <rect x="104" y="508" width="1060" height="66" rx="12" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="1.5"/>
  <text x="126" y="536" font-size="15" font-weight="700" fill="#8b2d2d">125 kHz LF and MIFARE Classic 1K carry no usable air-interface cryptography</text>
  <text x="126" y="558" font-size="13.5" fill="#8b2d2d">Keep any stored value or door access on DESFire EV3 AES-128 — LF and Classic are clone-readable.</text>
</svg>
