<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The read path of a passive UHF windshield tag, from reader to gate</title>
<desc id="d">Left to right: a UHF reader creates an interrogation zone; a windshield tag made of a UHF chip, a glass-tuned antenna and tamper-evident adhesive on glass is energized and backscatters its EPC; the reader passes the EPC to a database for matching; the system authorizes passage or debits a toll. A strip notes passive UHF operation in the 860-960 MHz band with a 4-8 meter read range through glass.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW RFID WINDSHIELD TAGS WORK</text>
<text x="600" y="86" text-anchor="middle" font-size="15" fill="#4f4f4f">Passive UHF: the reader powers the tag, reads its EPC, and matches it to a database.</text>
<!-- Node A reader -->
<rect x="66" y="214" width="196" height="150" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="66" y="214" width="196" height="8" rx="4" fill="#4a5568"/>
<text x="164" y="272" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">UHF reader</text>
<text x="164" y="300" text-anchor="middle" font-size="13.5" fill="#5c5c5c">creates the</text>
<text x="164" y="320" text-anchor="middle" font-size="13.5" fill="#5c5c5c">interrogation zone</text>
<!-- Node B tag anatomy -->
<rect x="330" y="188" width="264" height="204" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="330" y="188" width="264" height="8" rx="4" fill="#3d6b6b"/>
<text x="462" y="226" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">Windshield tag</text>
<rect x="392" y="244" width="34" height="34" rx="5" fill="#4a5568"/>
<line x1="360" y1="261" x2="392" y2="261" stroke="#4a5568" stroke-width="3"/>
<line x1="426" y1="261" x2="560" y2="261" stroke="#4a5568" stroke-width="3"/>
<text x="462" y="304" text-anchor="middle" font-size="13" fill="#291c0e">UHF chip + glass-tuned antenna</text>
<text x="462" y="330" text-anchor="middle" font-size="13" fill="#5c5c5c">tamper-evident adhesive</text>
<text x="462" y="360" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4557">on windshield glass</text>
<!-- A<->B arrows -->
<line x1="266" y1="250" x2="326" y2="250" stroke="#3d6b6b" stroke-width="3"/>
<polygon points="326,250 314,244 314,256" fill="#3d6b6b"/>
<text x="296" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#3d6b6b">energize</text>
<line x1="326" y1="330" x2="266" y2="330" stroke="#b9ae98" stroke-width="3"/>
<polygon points="266,330 278,324 278,336" fill="#b9ae98"/>
<text x="296" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#8a7f68">EPC back</text>
<!-- Node C database -->
<rect x="640" y="214" width="196" height="150" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="640" y="214" width="196" height="8" rx="4" fill="#3d6b6b"/>
<text x="738" y="272" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Match EPC</text>
<text x="738" y="300" text-anchor="middle" font-size="13.5" fill="#5c5c5c">to the vehicle</text>
<text x="738" y="320" text-anchor="middle" font-size="13.5" fill="#5c5c5c">database record</text>
<!-- Node D authorize -->
<rect x="900" y="214" width="230" height="150" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="900" y="214" width="230" height="8" rx="4" fill="#2d6a4f"/>
<text x="1015" y="272" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Authorize</text>
<text x="1015" y="300" text-anchor="middle" font-size="13.5" fill="#5c5c5c">lift the gate ·</text>
<text x="1015" y="320" text-anchor="middle" font-size="13.5" fill="#5c5c5c">debit the toll</text>
<!-- B->C, C->D -->
<line x1="594" y1="289" x2="638" y2="289" stroke="#b9ae98" stroke-width="3"/>
<polygon points="638,289 626,283 626,295" fill="#b9ae98"/>
<line x1="836" y1="289" x2="898" y2="289" stroke="#b9ae98" stroke-width="3"/>
<polygon points="898,289 886,283 886,295" fill="#b9ae98"/>
<!-- spec strip -->
<rect x="300" y="470" width="600" height="40" rx="20" fill="#eef2f5" stroke="#bcc6d4" stroke-width="1.3"/>
<text x="600" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4557">Passive UHF · 860-960 MHz · 4-8 m read range through glass</text>
<text x="600" y="576" text-anchor="middle" font-size="14" fill="#5c5c5c">The tag has no battery — it only answers when a reader's field reaches it.</text>
</svg>
