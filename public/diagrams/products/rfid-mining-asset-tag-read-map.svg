<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Read range and read points for a mining asset RFID tag</title>
  <desc id="d">A diagram in two parts. Top: two read-range bars comparing a clean tag surface, which reads to 4 m, against a heavy mud and ore-dust coating, which reads to 2 to 3 m — showing the read steps down under contamination but does not drop out. Bottom: four read points across the operation — a drift or tunnel portal for access control, a conveyor transfer chute and crusher access, a handheld for the weekly MSHA CFR 75 examination round, and a vehicle-mounted reader on LHDs and personnel carriers. A footer notes read events flow from portal and handheld to the EAM, such as Maximo or SAP PM, and up to the ICMM Critical Control Management dashboard.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">READING ON METAL, THROUGH THE MUCK</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">UHF penetrates mud, ore-dust and thin water — a printed label gets buried, the tag keeps answering</text>

  <text x="600" y="128" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">READ RANGE ON METAL — CLEAN VS CONTAMINATED</text>

  <text x="70" y="193" font-size="14" font-weight="700" fill="#291c0e">Clean tag surface</text>
  <rect x="300" y="174" width="600" height="28" rx="6" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <rect x="300" y="174" width="600" height="28" rx="6" fill="#3d6b6b"/>
  <text x="912" y="196" font-size="16" font-weight="700" fill="#2c5454">4 m</text>

  <text x="70" y="243" font-size="14" font-weight="700" fill="#291c0e">Heavy mud / ore-dust coating</text>
  <rect x="300" y="224" width="600" height="28" rx="6" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <rect x="300" y="224" width="378" height="28" rx="6" fill="#c39a5f"/>
  <text x="690" y="246" font-size="16" font-weight="700" fill="#6d5a3a">2-3 m</text>

  <text x="600" y="290" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Reliable read is maintained through contamination — range steps down from the clean maximum, it does not drop out.</text>

  <text x="600" y="332" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE THE READ HAPPENS</text>

  <rect x="70" y="352" width="253" height="150" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="352" width="253" height="40" rx="14" fill="#4a5568"/>
  <text x="197" y="379" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">DRIFT PORTAL</text>
  <text x="197" y="428" text-anchor="middle" font-size="13.5" fill="#291c0e">Access-control read at</text>
  <text x="197" y="452" text-anchor="middle" font-size="13.5" fill="#291c0e">the drift / tunnel entry</text>
  <text x="197" y="480" text-anchor="middle" font-size="12.5" fill="#5c5c5c">movement + shift handover</text>

  <rect x="339" y="352" width="253" height="150" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="339" y="352" width="253" height="40" rx="14" fill="#4a5568"/>
  <text x="466" y="379" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">CONVEYOR &amp; CRUSHER</text>
  <text x="466" y="428" text-anchor="middle" font-size="13.5" fill="#291c0e">Read at the transfer</text>
  <text x="466" y="452" text-anchor="middle" font-size="13.5" fill="#291c0e">chute and crusher access</text>
  <text x="466" y="480" text-anchor="middle" font-size="12.5" fill="#5c5c5c">at conveyor headroom</text>

  <rect x="608" y="352" width="253" height="150" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="608" y="352" width="253" height="40" rx="14" fill="#4a5568"/>
  <text x="735" y="379" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">HANDHELD</text>
  <text x="735" y="428" text-anchor="middle" font-size="13.5" fill="#291c0e">Weekly examination</text>
  <text x="735" y="452" text-anchor="middle" font-size="13.5" fill="#291c0e">round — MSHA CFR 75</text>
  <text x="735" y="480" text-anchor="middle" font-size="12.5" fill="#5c5c5c">auto-stamp + EAM upload</text>

  <rect x="877" y="352" width="253" height="150" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="877" y="352" width="253" height="40" rx="14" fill="#4a5568"/>
  <text x="1004" y="379" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">VEHICLE-MOUNTED</text>
  <text x="1004" y="428" text-anchor="middle" font-size="13.5" fill="#291c0e">Mobile-fleet inventory</text>
  <text x="1004" y="452" text-anchor="middle" font-size="13.5" fill="#291c0e">on LHDs &amp; carriers</text>
  <text x="1004" y="480" text-anchor="middle" font-size="12.5" fill="#5c5c5c">as-found equipment log</text>

  <rect x="70" y="528" width="1060" height="46" rx="10" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="600" y="557" text-anchor="middle" font-size="14" fill="#2c5454">Read events flow portal / handheld → EAM (Maximo, SAP PM) → ICMM CCM dashboard.</text>
</svg>
