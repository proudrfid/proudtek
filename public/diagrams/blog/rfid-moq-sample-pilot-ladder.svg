<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five sample and pilot structures from evaluation to first RFID deployment</title>
<desc id="d">Five stages left to right. One, free sample of 1 to 50 pieces, zero cost plus 25 to 80 dollars shipping. Two, paid sample run of 100 to 500 pieces at 50 to 500 dollars total. Three, stocked-SKU small order of 500 to 5,000 pieces at a 10 to 25 percent premium with 1 to 3 day lead time. Four, bundling a small custom order into a larger production run to share setup. Five, paying tooling separately, which drops MOQ to 1,000 to 2,000 units. The arrow beneath runs from evaluate to first deployment.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SAMPLE &amp; PILOT LADDER · TO FIRST DEPLOYMENT</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Evaluate quality and run a real pilot without committing to full MOQ.</text>

<!-- card 1 -->
<rect x="64" y="140" width="208" height="330" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="64" y="140" width="208" height="8" rx="4" fill="#9dbdbd"/>
<circle cx="168" cy="188" r="18" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="168" y="195" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">1</text>
<text x="168" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Free sample</text>
<rect x="98" y="270" width="140" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="168" y="292" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2c5454">1–50 pc</text>
<text x="168" y="342" text-anchor="middle" font-size="13" fill="#5c5c5c">$0 · maybe</text>
<text x="168" y="362" text-anchor="middle" font-size="13" fill="#5c5c5c">$25–80 shipping</text>
<text x="168" y="424" text-anchor="middle" font-size="12.5" fill="#8a8a8a">hand-evaluation</text>
<text x="168" y="442" text-anchor="middle" font-size="12.5" fill="#8a8a8a">only</text>

<!-- card 2 -->
<rect x="288" y="140" width="208" height="330" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="288" y="140" width="208" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="392" cy="188" r="18" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="392" y="195" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">2</text>
<text x="392" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Paid sample run</text>
<rect x="322" y="270" width="140" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="392" y="292" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2c5454">100–500 pc</text>
<text x="392" y="342" text-anchor="middle" font-size="13" fill="#5c5c5c">$50–500 total</text>
<text x="392" y="362" text-anchor="middle" font-size="13" fill="#5c5c5c">$0.50–5 / unit</text>
<text x="392" y="424" text-anchor="middle" font-size="12.5" fill="#8a8a8a">credited to first</text>
<text x="392" y="442" text-anchor="middle" font-size="12.5" fill="#8a8a8a">order in 90 days</text>

<!-- card 3 -->
<rect x="512" y="140" width="208" height="330" rx="14" fill="#ffffff" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="512" y="140" width="208" height="8" rx="4" fill="#c39a5f"/>
<circle cx="616" cy="188" r="18" fill="#fffdf7" stroke="#c39a5f" stroke-width="1.8"/>
<text x="616" y="195" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">3</text>
<text x="616" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Stocked-SKU order</text>
<rect x="546" y="270" width="140" height="34" rx="17" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.2"/>
<text x="616" y="292" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6d5a3a">500–5K pc</text>
<text x="616" y="342" text-anchor="middle" font-size="13" fill="#5c5c5c">10–25% premium</text>
<text x="616" y="362" text-anchor="middle" font-size="13" fill="#5c5c5c">1–3 day lead</text>
<text x="616" y="424" text-anchor="middle" font-size="12.5" fill="#8a8a8a">no setup fee</text>

<!-- card 4 -->
<rect x="736" y="140" width="208" height="330" rx="14" fill="#ffffff" stroke="#c4dccb" stroke-width="1.8"/>
<rect x="736" y="140" width="208" height="8" rx="4" fill="#2d6a4f"/>
<circle cx="840" cy="188" r="18" fill="#eaf3ec" stroke="#2d6a4f" stroke-width="1.8"/>
<text x="840" y="195" text-anchor="middle" font-size="17" font-weight="800" fill="#1b4332">4</text>
<text x="840" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Bundle into a run</text>
<rect x="770" y="270" width="140" height="34" rx="17" fill="#eaf3ec" stroke="#c4dccb" stroke-width="1.2"/>
<text x="840" y="292" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1b4332">ride-along</text>
<text x="840" y="342" text-anchor="middle" font-size="13" fill="#5c5c5c">same chip + antenna</text>
<text x="840" y="362" text-anchor="middle" font-size="13" fill="#5c5c5c">within 30 days</text>
<text x="840" y="424" text-anchor="middle" font-size="12.5" fill="#8a8a8a">shares the setup</text>

<!-- card 5 -->
<rect x="960" y="140" width="176" height="330" rx="14" fill="#ffffff" stroke="#c4dccb" stroke-width="1.8"/>
<rect x="960" y="140" width="176" height="8" rx="4" fill="#1b4332"/>
<circle cx="1048" cy="188" r="18" fill="#eaf3ec" stroke="#1b4332" stroke-width="1.8"/>
<text x="1048" y="195" text-anchor="middle" font-size="17" font-weight="800" fill="#1b4332">5</text>
<text x="1048" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Pay tooling</text>
<rect x="982" y="270" width="132" height="34" rx="17" fill="#eaf3ec" stroke="#c4dccb" stroke-width="1.2"/>
<text x="1048" y="292" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1b4332">one-time</text>
<text x="1048" y="342" text-anchor="middle" font-size="13" fill="#5c5c5c">drops MOQ to</text>
<text x="1048" y="362" text-anchor="middle" font-size="15" font-weight="800" fill="#1b4332">1K–2K</text>
<text x="1048" y="424" text-anchor="middle" font-size="12.5" fill="#8a8a8a">for repeat plans</text>

<line x1="80" y1="512" x2="1090" y2="512" stroke="#c4b896" stroke-width="3"/><polygon points="1090,504 1108,512 1090,520" fill="#c4b896"/>
<text x="90" y="502" font-size="13" font-weight="700" fill="#8a7550">evaluate</text>
<text x="1070" y="502" text-anchor="end" font-size="13" font-weight="700" fill="#8a7550">first deployment</text>
</svg>
