<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Three ways to program an NFC business card</title>
<desc id="d">Three routes to a written card. Route one, phone app: NFC Tools or NXP TagWriter on iPhone XS and later or Android, write a URL record card by card. Route two, USB desktop writer: ACR122U or ACR1252U for batch programming of large orders. Route three, dynamic platform: the card stores a fixed cloud-redirect URL and the destination is changed any time in a dashboard. Footer reminder: lock the tag with password-protected write access only after final approval.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NO SOLDERING IRON · NO IT TICKET</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Three ways to put your link on the chip</text>

<rect x="52" y="136" width="356" height="360" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="230" y="174" text-anchor="middle" font-size="15.5" font-weight="800" fill="#2c5454">PHONE APP</text>
<rect x="185" y="196" width="90" height="160" rx="14" fill="#ffffff" stroke="#2c5454" stroke-width="2.5"/>
<rect x="197" y="214" width="66" height="110" rx="5" fill="#eef5f5"/>
<circle cx="230" cy="340" r="6" fill="#2c5454"/>
<text x="230" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">NFC Tools · NXP TagWriter</text>
<text x="230" y="416" text-anchor="middle" font-size="12" fill="#4f4f4f">iPhone XS+ (tap the top edge)</text>
<text x="230" y="438" text-anchor="middle" font-size="12" fill="#4f4f4f">and NFC Androids</text>
<text x="230" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">one card at a time · free</text>

<rect x="422" y="136" width="356" height="360" rx="14" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="600" y="174" text-anchor="middle" font-size="15.5" font-weight="800" fill="#6d5a3a">DESKTOP WRITER</text>
<rect x="510" y="230" width="180" height="34" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<path d="M 600 264 v 30" stroke="#6d5a3a" stroke-width="2.5"/>
<rect x="520" y="294" width="160" height="60" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="2"/>
<text x="600" y="330" text-anchor="middle" font-size="12" fill="#4f4f4f">card stack</text>
<text x="600" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">ACR122U · ACR1252U</text>
<text x="600" y="416" text-anchor="middle" font-size="12" fill="#4f4f4f">USB, sits by the keyboard</text>
<text x="600" y="438" text-anchor="middle" font-size="12" fill="#4f4f4f">scripts through the whole box</text>
<text x="600" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">batch programming for big orders</text>

<rect x="792" y="136" width="356" height="360" rx="14" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="970" y="174" text-anchor="middle" font-size="15.5" font-weight="800" fill="#1b4332">DYNAMIC PLATFORM</text>
<rect x="850" y="210" width="240" height="44" rx="10" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="970" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">card URL: never changes</text>
<path d="M 970 254 v 34" stroke="#2d6a4f" stroke-width="2.5"/>
<path d="M 970 288 l -6 -10 h 12 z" fill="#2d6a4f"/>
<rect x="850" y="292" width="240" height="44" rx="10" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="970" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">destination: changes any time</text>
<text x="970" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Popl · Linq · custom platforms</text>
<text x="970" y="416" text-anchor="middle" font-size="12" fill="#4f4f4f">cloud redirect, dashboard edits</text>
<text x="970" y="438" text-anchor="middle" font-size="12" fill="#4f4f4f">new role → new page, same card</text>
<text x="970" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">update without touching the card</text>

<rect x="240" y="530" width="720" height="60" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="558" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Then lock it — password-protected write, read stays open.</text>
<text x="600" y="580" text-anchor="middle" font-size="12" fill="#4f4f4f">but only after final approval: a typo locked in forever costs a whole batch</text>
<text x="600" y="630" text-anchor="middle" font-size="13" fill="#5c5c5c">Any team member can do this. The ceremony is optional.</text>
</svg>
