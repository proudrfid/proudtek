<path d="M946 265 a24 24 0 0 1 0 40" fill="none" stroke="#1fcefb" stroke-width="3.5" stroke-linecap="round"/>
<path d="M958 255 a36 36 0 0 1 0 60" fill="none" stroke="#1fcefb" stroke-width="3.5" stroke-linecap="round"/>
<path d="M970 245 a48 48 0 0 1 0 80" fill="none" stroke="#1fcefb" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="1030" cy="285" r="10" fill="#3d6b6b"/>
<text x="876" y="392" text-anchor="middle" font-size="13.5" fill="#2c5454">tap, gate opens, next</text>
<text x="876" y="446" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#2c5454">15-20</text>
<text x="876" y="474" text-anchor="middle" font-size="13.5" fill="#4f4f4f">attendees per minute</text>

<!-- verdict -->
<rect x="64" y="524" width="1072" height="84" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="558" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Scaled across a whole arrival, that gap is an entrance versus a bottleneck.</text>
<text x="600" y="586" text-anchor="middle" font-size="13" fill="#5c5c5c">RFID-enabled gates process 15-20 attendees per minute versus 4-6 with manual scanning.</text>
</svg>
