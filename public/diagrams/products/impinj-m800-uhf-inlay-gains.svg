<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">What the Impinj M700 to M800 upgrade buys</title>
  <desc id="d">Four gains from moving to the next-generation M800 silicon on the same antenna and readers: read sensitivity improves 1 to 2 dB over the M700 floor of minus 22.7 to minus 22.1 dBm; read range grows 10 to 20 percent so a 10 m read becomes 11 to 12 m; chip power drops about 30 percent so smaller on-metal and on-liquid inlays read; and the Gen2X protocol sustains 1,000-plus tags per minute on printer-applicator lines. A footer notes five billion-plus units shipped since launch per Impinj, March 2025.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT THE M700 TO M800 JUMP BUYS</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Same antenna, same readers — four gains from the next-gen silicon</text>

  <rect x="70" y="118" width="512" height="196" rx="14" fill="#f8ead0" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="70" y="118" width="10" height="196" rx="5" fill="#c39a5f"/>
  <text x="106" y="158" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a5568">READ SENSITIVITY</text>
  <text x="106" y="212" font-size="40" font-weight="800" fill="#6d5a3a">+1-2 dB</text>
  <text x="106" y="250" font-size="14" fill="#5c5c5c">Better than the M700 floor of</text>
  <text x="106" y="272" font-size="14" fill="#5c5c5c">-22.7 to -22.1 dBm (ARC reference)</text>

  <rect x="618" y="118" width="512" height="196" rx="14" fill="#f8ead0" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="618" y="118" width="10" height="196" rx="5" fill="#3d6b6b"/>
  <text x="654" y="158" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a5568">READ RANGE</text>
  <text x="654" y="212" font-size="40" font-weight="800" fill="#3d6b6b">+10-20%</text>
  <text x="654" y="250" font-size="14" fill="#5c5c5c">Same antenna design — a 10 m read</text>
  <text x="654" y="272" font-size="14" fill="#5c5c5c">becomes 11-12 m free-air</text>

  <rect x="70" y="334" width="512" height="196" rx="14" fill="#f8ead0" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="70" y="334" width="10" height="196" rx="5" fill="#c39a5f"/>
  <text x="106" y="374" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a5568">CHIP POWER</text>
  <text x="106" y="428" font-size="40" font-weight="800" fill="#6d5a3a">-30%</text>
  <text x="106" y="466" font-size="14" fill="#5c5c5c">Smaller, on-metal and on-liquid</text>
  <text x="106" y="488" font-size="14" fill="#5c5c5c">inlays that struggled now read</text>

  <rect x="618" y="334" width="512" height="196" rx="14" fill="#f8ead0" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="618" y="334" width="10" height="196" rx="5" fill="#3d6b6b"/>
  <text x="654" y="374" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a5568">INVENTORY THROUGHPUT</text>
  <text x="654" y="428" font-size="40" font-weight="800" fill="#3d6b6b">Gen2X</text>
  <text x="654" y="466" font-size="14" fill="#5c5c5c">1,000+ tags / minute on high-speed</text>
  <text x="654" y="488" font-size="14" fill="#5c5c5c">printer-applicator lines</text>

  <rect x="70" y="554" width="1060" height="74" rx="14" fill="#2c5454"/>
  <text x="600" y="588" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">5B+ units shipped since launch — the volume next-gen RAIN floor</text>
  <text x="600" y="613" text-anchor="middle" font-size="13.5" fill="#e4c98f">Impinj M800 series, March 2025 · pin- and protocol-compatible with M700 antennas</text>
</svg>
