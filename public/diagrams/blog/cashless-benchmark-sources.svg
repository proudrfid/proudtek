<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Named cashless-RFID revenue benchmarks buyers can cite to a CFO</title>
<desc id="d">Four sourced benchmark cards. Glownet reports up to 30 percent higher revenue per guest across its festival client base. Tappit cites a 22 percent average increase in event takings across multi-year deployments. RFIDhy reports 12 to 18 month payback on RFID infrastructure from its Coachella, Lollapalooza and Bonnaroo analysis. Closed-loop refund rate runs below 0.5 percent versus 1.5 to 3 percent open-loop, worth about 12,500 to 31,250 dollars saved per event. A footer notes Bonnaroo's 2025 program seeded a 15 dollar cashless credit at registration.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BENCHMARKS THAT SURVIVE A BUDGET MEETING</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Named, sourced numbers for the moment someone asks “where did 30% come from?”</text>
<rect x="76" y="168" width="500" height="150" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="76" y="168" width="500" height="8" rx="4" fill="#3d6b6b"/>
<text x="110" y="254" font-size="42" font-weight="800" fill="#2c5454">up to 30%</text>
<text x="110" y="284" font-size="14.5" font-weight="700" fill="#291c0e">higher revenue per guest</text>
<text x="110" y="306" font-size="12.5" fill="#8a8a8a">Glownet — published festival client data</text>
<rect x="624" y="168" width="500" height="150" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="624" y="168" width="500" height="8" rx="4" fill="#3d6b6b"/>
<text x="658" y="254" font-size="42" font-weight="800" fill="#2c5454">22%</text>
<text x="658" y="284" font-size="14.5" font-weight="700" fill="#291c0e">average lift in event takings</text>
<text x="658" y="306" font-size="12.5" fill="#8a8a8a">Tappit — averaged across multi-year rollouts</text>
<rect x="76" y="334" width="500" height="150" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="76" y="334" width="500" height="8" rx="4" fill="#3d6b6b"/>
<text x="110" y="420" font-size="42" font-weight="800" fill="#2c5454">12–18 mo</text>
<text x="110" y="450" font-size="14.5" font-weight="700" fill="#291c0e">payback on RFID infrastructure</text>
<text x="110" y="472" font-size="12.5" fill="#8a8a8a">RFIDhy — Coachella / Lollapalooza / Bonnaroo</text>
<rect x="624" y="334" width="500" height="150" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="624" y="334" width="500" height="8" rx="4" fill="#c39a5f"/>
<text x="658" y="420" font-size="42" font-weight="800" fill="#1f6f3a">&lt;0.5%</text>
<text x="658" y="450" font-size="14.5" font-weight="700" fill="#291c0e">closed-loop refund vs 1.5–3% open-loop</text>
<text x="658" y="472" font-size="12.5" fill="#8a8a8a">≈ $12,500–$31,250 saved per event*</text>
<rect x="76" y="500" width="1048" height="80" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="100" y="522" width="150" height="30" rx="15" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="175" y="542" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BONNAROO 2025</text>
<text x="272" y="532" font-size="13.5" fill="#291c0e">Seeded a $15 cashless credit at registration (PayPal / Venmo) — organizers only front $15 a head</text>
<text x="272" y="556" font-size="12.5" fill="#5c5c5c">once they've modeled the lift to beat it.   *At $50 per-cap, 25,000 attendees, before the spending lift.</text>
</svg>
