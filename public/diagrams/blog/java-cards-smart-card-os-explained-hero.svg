<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Java Card under the magnifier — the OS stack hiding inside a smart card chip</title>
<desc id="d">A teal smart card with a gold contact chip sits on the left. Dashed zoom lines lead from the chip to a large gold magnifying lens on the right, which reveals the software stack inside the silicon: a row of three isolated applets (key, payment card and door icons) at the top, then the GlobalPlatform card manager layer, then the Java Card virtual machine, and the secure element silicon at the base. A caption reads: zoom into the gold square and you find a full software stack — and a small crowd of applets that refuse to talk to each other.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE COMPUTERS IN YOUR WALLET · ZOOMED IN</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Java Card — a tiny OS with serious trust issues</text>

