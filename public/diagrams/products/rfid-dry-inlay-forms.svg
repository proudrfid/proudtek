<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">One RFID inlay, three finish states — dry is this SKU</title>
  <desc id="d">The same chip and antenna shipped in three finish states. A dry inlay — this SKU — is the bare core of chip, etched antenna and PET film with no adhesive or liner. A wet inlay adds a pressure-sensitive adhesive layer and a silicone-coated PET release liner. A converted inlay is laminated into printed face stock to become a finished card or label. Which state is ordered is decided by the downstream process.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3d6b6b"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THREE FINISH STATES — DRY IS THIS SKU</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#5c5c5c">Same chip and antenna — this SKU ships dry, bare, with no adhesive</text>

  <!-- DRY highlight + badge -->
  <rect x="120" y="158" width="260" height="244" rx="14" fill="#fbf4e6" stroke="#c39a5f" stroke-width="2.5"/>
  <rect x="196" y="122" width="108" height="28" rx="14" fill="#c39a5f"/>
  <text x="250" y="141" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.5" fill="#ffffff">THIS SKU</text>

  <!-- Column 1: DRY -->
  <text x="250" y="188" text-anchor="middle" font-size="20" font-weight="800" fill="#2c5454">DRY</text>
  <text x="250" y="210" text-anchor="middle" font-size="13" fill="#5c5c5c">bare core</text>
  <rect x="140" y="242" width="220" height="28" rx="5" fill="#dfeaea" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="250" y="261" text-anchor="middle" font-size="13" fill="#2c5454">chip + etched antenna</text>
  <rect x="140" y="274" width="220" height="28" rx="5" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="250" y="293" text-anchor="middle" font-size="13" fill="#6d5a3a">bare PET film</text>
  <text x="250" y="348" text-anchor="middle" font-size="14" font-weight="600" fill="#291c0e">No adhesive, no liner, no face stock</text>
  <text x="250" y="372" text-anchor="middle" font-size="12.5" fill="#5c5c5c">for cards · hard tags · wristbands · RTI</text>

  <!-- Column 2: WET -->
  <text x="600" y="150" text-anchor="middle" font-size="20" font-weight="800" fill="#6d5a3a">WET</text>
  <text x="600" y="172" text-anchor="middle" font-size="13" fill="#5c5c5c">+ adhesive + liner</text>
  <rect x="490" y="190" width="220" height="28" rx="5" fill="#dfeaea" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="600" y="209" text-anchor="middle" font-size="13" fill="#2c5454">chip + etched antenna</text>
  <rect x="490" y="222" width="220" height="28" rx="5" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="600" y="241" text-anchor="middle" font-size="13" fill="#6d5a3a">PET film</text>
  <rect x="490" y="254" width="220" height="28" rx="5" fill="#f2e2c4" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="600" y="273" text-anchor="middle" font-size="13" fill="#6d5a3a">PSA adhesive</text>
  <rect x="490" y="286" width="220" height="28" rx="5" fill="#e9edf1" stroke="#4a5568" stroke-width="1.5"/>
  <text x="600" y="305" text-anchor="middle" font-size="13" fill="#4a5568">release liner</text>
  <text x="600" y="352" text-anchor="middle" font-size="14" font-weight="600" fill="#291c0e">PSA + release liner</text>
  <text x="600" y="376" text-anchor="middle" font-size="12.5" fill="#5c5c5c">for label converters</text>

  <!-- Column 3: CONVERTED -->
  <text x="950" y="150" text-anchor="middle" font-size="20" font-weight="800" fill="#4a5568">CONVERTED</text>
  <text x="950" y="172" text-anchor="middle" font-size="13" fill="#5c5c5c">+ card body / print</text>
  <rect x="840" y="190" width="220" height="28" rx="5" fill="#ffffff" stroke="#cdb79a" stroke-width="1.5"/>
  <text x="950" y="209" text-anchor="middle" font-size="13" fill="#291c0e">printed card / face stock</text>
  <rect x="840" y="222" width="220" height="28" rx="5" fill="#dfeaea" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="950" y="241" text-anchor="middle" font-size="13" fill="#2c5454">chip + etched antenna</text>
  <rect x="840" y="254" width="220" height="28" rx="5" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="950" y="273" text-anchor="middle" font-size="13" fill="#6d5a3a">PET film</text>
  <rect x="840" y="286" width="220" height="28" rx="5" fill="#f2e2c4" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="950" y="305" text-anchor="middle" font-size="13" fill="#6d5a3a">lamination / housing</text>
  <text x="950" y="352" text-anchor="middle" font-size="14" font-weight="600" fill="#291c0e">into a card body or housing</text>
  <text x="950" y="376" text-anchor="middle" font-size="12.5" fill="#5c5c5c">now a card or tag, not a component</text>

  <!-- arrows -->
  <line x1="392" y1="252" x2="484" y2="252" stroke="#3d6b6b" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="718" y1="252" x2="834" y2="252" stroke="#3d6b6b" stroke-width="3" marker-end="url(#ar)"/>

  <!-- band -->
  <rect x="270" y="556" width="660" height="76" rx="16" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="588" text-anchor="middle" font-size="16" font-weight="600" fill="#2c5454">This SKU ships dry — the bare core</text>
  <text x="600" y="613" text-anchor="middle" font-size="15" fill="#3d6b6b">add adhesive for wet, or laminate it into a finished card or tag</text>
</svg>
