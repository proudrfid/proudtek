<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ifTitle ifDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ifTitle">From zero to a compliant apparel DPP in five steps</title>
  <desc id="ifDesc">Five implementation steps. Step one, choose the data carrier: most brands settle on an NFC-plus-QR combo — tap-to-read in store, QR for non-NFC phones. Step two, select the chip for security needs: NTAG 424 DNA with SUN/CMAC gives cryptographic tamper-evidence for anti-counterfeit. Step three, design the backend data architecture: a public CIRPASS-compatible JSON schema behind each DPP URL, built on GS1 EPCIS 2.0. Step four, integrate ERP and PLM: SKU-level data flows from PLM, serialized-unit data from ERP or MES, both reaching the DPP backend before the garment leaves the factory. Step five, pilot three to six SKU lines for six to twelve months to validate read rates, consumer engagement and data quality before scaling. A footer note reads: each phase proves itself against KPIs before the next gets funded.</desc>

  <defs>
    <radialGradient id="ifGlow" cx="50%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#f9eed6"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="ifSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#3a4656"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#ifGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="3" fill="#b0894c">PHYSICAL TAG + BACKEND DATA SYSTEM</text>
  <text x="600" y="92" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">Five steps from zero to a compliant DPP</text>

  <!-- connecting spine -->
  <line x1="130" y1="300" x2="1070" y2="300" stroke="#e4c98f" stroke-width="3"/>
  <path d="M1070 300 l-14 -7 v14 z" fill="#e4c98f"/>

  <!-- Step cards -->
  <!-- 1 -->
  <g>
    <rect x="52" y="150" width="200" height="300" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="152" cy="300" r="26" fill="#2d6a4f"/><text x="152" y="309" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">1</text>
    <text x="152" y="196" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Choose the</text>
    <text x="152" y="215" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">data carrier</text>
    <text x="152" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2d6a4f">NFC + QR combo</text>
    <text x="152" y="360" text-anchor="middle" font-size="11.5" fill="#6d5a3a">tap-to-read in store,</text>
    <text x="152" y="376" text-anchor="middle" font-size="11.5" fill="#6d5a3a">QR for non-NFC phones</text>
    <text x="152" y="392" text-anchor="middle" font-size="11.5" fill="#6d5a3a">and printed fallback</text>
  </g>
  <!-- 2 -->
  <g>
    <rect x="282" y="150" width="200" height="300" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="382" cy="300" r="26" fill="#4a5568"/><text x="382" y="309" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">2</text>
    <text x="382" y="196" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Select the chip</text>
    <text x="382" y="215" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">for security</text>
    <text x="382" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">NTAG 424 DNA</text>
    <text x="382" y="360" text-anchor="middle" font-size="11.5" fill="#6d5a3a">SUN / CMAC gives</text>
    <text x="382" y="376" text-anchor="middle" font-size="11.5" fill="#6d5a3a">cryptographic tamper-</text>
    <text x="382" y="392" text-anchor="middle" font-size="11.5" fill="#6d5a3a">evidence (anti-counterfeit)</text>
  </g>
  <!-- 3 -->
  <g>
    <rect x="512" y="150" width="200" height="300" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="612" cy="300" r="26" fill="#c39a5f"/><text x="612" y="309" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">3</text>
    <text x="612" y="196" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Design the</text>
    <text x="612" y="215" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">backend schema</text>
    <text x="612" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a97f3f">CIRPASS-compatible</text>
    <text x="612" y="360" text-anchor="middle" font-size="11.5" fill="#6d5a3a">a public JSON schema</text>
    <text x="612" y="376" text-anchor="middle" font-size="11.5" fill="#6d5a3a">behind each DPP URL,</text>
    <text x="612" y="392" text-anchor="middle" font-size="11.5" fill="#6d5a3a">on GS1 EPCIS 2.0</text>
  </g>
  <!-- 4 -->
  <g>
    <rect x="742" y="150" width="200" height="300" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="842" cy="300" r="26" fill="#3d6b6b"/><text x="842" y="309" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">4</text>
    <text x="842" y="196" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Integrate</text>
    <text x="842" y="215" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">ERP + PLM</text>
    <text x="842" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3d6b6b">before it ships</text>
    <text x="842" y="360" text-anchor="middle" font-size="11.5" fill="#6d5a3a">SKU data from PLM,</text>
    <text x="842" y="376" text-anchor="middle" font-size="11.5" fill="#6d5a3a">serialized data from</text>
    <text x="842" y="392" text-anchor="middle" font-size="11.5" fill="#6d5a3a">ERP / MES</text>
  </g>
  <!-- 5 -->
  <g>
    <rect x="972" y="150" width="200" height="300" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="1072" cy="300" r="26" fill="#6c5127"/><text x="1072" y="309" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">5</text>
    <text x="1072" y="196" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Pilot, then</text>
    <text x="1072" y="215" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">scale</text>
    <text x="1072" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6c5127">3–6 SKU lines</text>
    <text x="1072" y="360" text-anchor="middle" font-size="11.5" fill="#6d5a3a">6–12 months to test</text>
    <text x="1072" y="376" text-anchor="middle" font-size="11.5" fill="#6d5a3a">read rates &amp; find the</text>
    <text x="1072" y="392" text-anchor="middle" font-size="11.5" fill="#6d5a3a">data-quality gaps</text>
  </g>

  <!-- footer -->
  <path d="M20 556 h1160 v77 a22 22 0 0 1 -22 22 h-1116 a22 22 0 0 1 -22 -22 z" fill="url(#ifSteel)"/>
  <text x="600" y="600" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Fund it phase by phase.</text>
  <text x="600" y="625" text-anchor="middle" font-size="13" fill="#c9d2df">Early movers (Bestseller, Zalando, H&amp;M) let each phase prove itself against KPIs before the next one got budget.</text>
</svg>
