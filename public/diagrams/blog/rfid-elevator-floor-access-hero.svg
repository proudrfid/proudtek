<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How RFID elevator floor access works: a credential enables only its authorized floors</title>
<desc id="d">Left, a card or fob taps an in-car RFID reader. Center, the access-control system reads the credential ID, fetches its authorized floor list, and enables only those buttons. Right, an elevator floor panel where the lobby, parking, floor 2, floor 5 and floor 8 buttons are authorized and lit, while the R and D lab on floor 3, the executive floor 12 and the data center on level B stay locked.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID ELEVATOR FLOOR ACCESS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">A credential enables only its authorized floors — every other button stays locked.</text>

<!-- LEFT: card taps reader -->
<rect x="70" y="286" width="92" height="58" rx="8" fill="#f7edd6" stroke="#d9b45f" stroke-width="2"/>
<text x="116" y="311" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a07d43">CARD</text>
<text x="116" y="330" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a07d43">/ FOB</text>
<path d="M 176 292 a 26 26 0 0 1 0 52" fill="none" stroke="#3d6b6b" stroke-width="2.4"/>
<path d="M 188 300 a 18 18 0 0 1 0 36" fill="none" stroke="#79a3a3" stroke-width="2.2"/>
<rect x="208" y="262" width="150" height="120" rx="14" fill="#ffffff" stroke="#291c0e" stroke-width="2.5"/>
<rect x="228" y="284" width="110" height="46" rx="8" fill="#eef5f5" stroke="#8fb6b6" stroke-width="2"/>
<text x="283" y="312" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">READER</text>
<text x="283" y="360" text-anchor="middle" font-size="13.5" fill="#291c0e">In-car RFID reader</text>

<!-- arrow reader -> ACS -->
<line x1="360" y1="322" x2="424" y2="322" stroke="#4a5568" stroke-width="2.4"/>
<polygon points="424,316 438,322 424,328" fill="#4a5568"/>

<!-- CENTER: ACS -->
<rect x="440" y="250" width="252" height="168" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.4"/>
<text x="566" y="284" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#234a4a">ACCESS-CONTROL SYSTEM</text>
<text x="462" y="322" font-size="13.5" fill="#291c0e">1 · Read the credential ID</text>
<text x="462" y="352" font-size="13.5" fill="#291c0e">2 · Fetch its authorized floors</text>
<text x="462" y="382" font-size="13.5" fill="#291c0e">3 · Enable only those buttons</text>

<!-- arrow ACS -> panel -->
<line x1="692" y1="334" x2="760" y2="334" stroke="#4a5568" stroke-width="2.4"/>
<polygon points="760,328 774,334 760,340" fill="#4a5568"/>

<!-- RIGHT: floor panel -->
<rect x="778" y="150" width="352" height="474" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="778" y="150" width="352" height="9" rx="4" fill="#3d6b6b"/>
<text x="954" y="192" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FLOOR BUTTONS · ONE CREDENTIAL</text>

<!-- Left column (authorized) -->
<rect x="800" y="236" width="142" height="66" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.2"/>
<text x="818" y="276" font-size="20" font-weight="800" fill="#291c0e">L</text>
<text x="818" y="293" font-size="12" fill="#5c5c5c">Lobby</text>
<circle cx="916" cy="269" r="13" fill="#3d6b6b"/>
<path d="M 910 269 l 4 5 l 8 -10" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="800" y="320" width="142" height="66" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.2"/>
<text x="818" y="360" font-size="20" font-weight="800" fill="#291c0e">2</text>
<text x="818" y="377" font-size="12" fill="#5c5c5c">Offices</text>
<circle cx="916" cy="353" r="13" fill="#3d6b6b"/>
<path d="M 910 353 l 4 5 l 8 -10" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="800" y="404" width="142" height="66" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.2"/>
<text x="818" y="444" font-size="20" font-weight="800" fill="#291c0e">5</text>
<text x="818" y="461" font-size="12" fill="#5c5c5c">Offices</text>
<circle cx="916" cy="437" r="13" fill="#3d6b6b"/>
<path d="M 910 437 l 4 5 l 8 -10" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="800" y="488" width="142" height="66" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.2"/>
<text x="818" y="528" font-size="20" font-weight="800" fill="#291c0e">P</text>
<text x="818" y="545" font-size="12" fill="#5c5c5c">Parking</text>
<circle cx="916" cy="521" r="13" fill="#3d6b6b"/>
<path d="M 910 521 l 4 5 l 8 -10" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Right column (mixed) -->
<rect x="978" y="236" width="142" height="66" rx="12" fill="#f1f0ec" stroke="#b8bdc4" stroke-width="2"/>
<text x="996" y="276" font-size="20" font-weight="800" fill="#7c7c7c">3</text>
<text x="996" y="293" font-size="12" fill="#8a8a8a">R&amp;D lab</text>
<rect x="1082" y="266" width="24" height="19" rx="3" fill="#9aa3ad"/>
<path d="M 1086 266 a 8 9 0 0 1 16 0" fill="none" stroke="#9aa3ad" stroke-width="3"/>

<rect x="978" y="320" width="142" height="66" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.2"/>
<text x="996" y="360" font-size="20" font-weight="800" fill="#291c0e">8</text>
<text x="996" y="377" font-size="12" fill="#5c5c5c">Guest floor</text>
<circle cx="1094" cy="353" r="13" fill="#3d6b6b"/>
<path d="M 1088 353 l 4 5 l 8 -10" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="978" y="404" width="142" height="66" rx="12" fill="#f1f0ec" stroke="#b8bdc4" stroke-width="2"/>
<text x="996" y="444" font-size="20" font-weight="800" fill="#7c7c7c">12</text>
<text x="996" y="461" font-size="12" fill="#8a8a8a">Executive</text>
<rect x="1082" y="434" width="24" height="19" rx="3" fill="#9aa3ad"/>
<path d="M 1086 434 a 8 9 0 0 1 16 0" fill="none" stroke="#9aa3ad" stroke-width="3"/>

<rect x="978" y="488" width="142" height="66" rx="12" fill="#f1f0ec" stroke="#b8bdc4" stroke-width="2"/>
<text x="996" y="528" font-size="20" font-weight="800" fill="#7c7c7c">B</text>
<text x="996" y="545" font-size="12" fill="#8a8a8a">Data center</text>
<rect x="1082" y="518" width="24" height="19" rx="3" fill="#9aa3ad"/>
<path d="M 1086 518 a 8 9 0 0 1 16 0" fill="none" stroke="#9aa3ad" stroke-width="3"/>

<text x="404" y="648" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Opens L, P, 2, 5 and 8 — lab, executive and data-center floors stay locked.</text>
</svg>
