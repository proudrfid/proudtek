<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">SDM per-tap signature — a URL that can't be photocopied</title>
  <desc id="d">Flow: tap generates a URL with UID, incrementing counter and AES-128 CMAC per NIST SP 800-38B; the brand server recomputes the CMAC with the diversified key and accepts or flags. Mutual authentication runs per ISO/IEC 14443-4 and ISO/IEC 9798.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Every tap mints a fresh, signed URL</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Copy the link and it is already stale — the counter moved on</text>
  <g transform="translate(70,160)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="30" width="240" height="130" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="70" font-family="Georgia, serif" font-size="16" fill="#291c0e">Phone taps seal</text>
    <text x="24" y="98" font-size="13" fill="#6d5a3a">no app — the URL</text>
    <text x="24" y="120" font-size="13" fill="#6d5a3a">opens in the browser</text>
    <rect x="300" y="10" width="360" height="170" rx="12" fill="#eef2f0" stroke="#2c5454" stroke-width="2.5"/>
    <text x="324" y="48" font-family="Georgia, serif" font-size="16" fill="#2c5454">Tag composes the URL</text>
    <text x="324" y="80" font-size="13" fill="#2c5454">UID + incrementing tap counter</text>
    <text x="324" y="104" font-size="13" fill="#2c5454">AES-128 CMAC (NIST SP 800-38B)</text>
    <text x="324" y="128" font-size="13" fill="#2c5454">tamper status baked in</text>
    <text x="324" y="158" font-size="12" fill="#6d5a3a">mutual auth: ISO/IEC 14443-4 + ISO/IEC 9798</text>
    <rect x="720" y="30" width="330" height="130" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="744" y="66" font-family="Georgia, serif" font-size="16" fill="#2c5454">Brand server verifies</text>
    <text x="744" y="94" font-size="13" fill="#2c5454">recomputes CMAC with diversified key</text>
    <text x="744" y="118" font-size="13" fill="#2c5454">accepts — or flags the anomaly</text>
    <path d="M 245 105 L 293 105" stroke="#6d5a3a" stroke-width="2.5" marker-end="url(#a6)"/>
    <path d="M 665 105 L 713 105" stroke="#6d5a3a" stroke-width="2.5" marker-end="url(#a6)"/>
    <defs><marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d5a3a"/></marker></defs>
  </g>
  <g transform="translate(70,420)">
    <rect x="0" y="0" width="1050" height="130" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="18" fill="#291c0e">Provisioned here, verified anywhere</text>
    <text x="24" y="72" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Per-tag diversified AES-128 keys loaded on our secure encoding line; open-source Python / Node / Go reference libraries verify the SDM signature server-side</text>
    <text x="24" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Counter-anomaly analytics catch replayed URLs and cloned QR fallbacks</text>
  </g>
</svg>
