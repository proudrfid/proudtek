<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The six cost lines of a hotel keycard program — only the first appears on the quote</title>
<desc id="d">Receipt-style breakdown of a hotel keycard program: line one, card consumable at $0.10-1.50 per card, is the quoted line. Below it: encoding hardware at $500-1,500 per encoder refreshed every 3-5 years, lock integration and SAM modules at $50-150 per lock with migration firmware at $50-200 per lock, front-desk re-encode labor at $15-45K a year from 2-3 minutes per incident and 30-90 hours a month at magstripe rates, lost-and-replaced cards at $16-32K a year from 3-5 percent of cards lost per stay, and end-of-life certified destruction at $0.05-0.10 per card. The full stack typically runs 3-5x the per-card unit price across a 5-year program.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE FULL COST STACK — WHAT THE QUOTE LEAVES OUT</text>
<text x="600" y="92" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="27" font-weight="700" fill="#291c0e">Six line items, one of which fits on a purchase order</text>

<rect x="90" y="118" width="1020" height="64" rx="12" fill="#f9f1e2" stroke="#c39a5f" stroke-width="2"/>
<circle cx="126" cy="150" r="16" fill="#c39a5f"/>
<text x="126" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="156" y="145" font-size="15" font-weight="700" fill="#291c0e">Card consumable — the line suppliers quote</text>
<text x="156" y="167" font-size="12.5" fill="#4f4f4f">chip + body + printing, by technology, encryption and finish</text>
<text x="1070" y="156" text-anchor="end" font-size="16" font-weight="800" fill="#6d5a3a">$0.10-1.50 per card</text>

<rect x="90" y="192" width="1020" height="64" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<circle cx="126" cy="224" r="16" fill="#3d6b6b"/>
<text x="126" y="230" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="156" y="219" font-size="15" font-weight="700" fill="#291c0e">Encoding hardware</text>
<text x="156" y="241" font-size="12.5" fill="#4f4f4f">front-desk encoders &amp; kiosks, refreshed every 3-5 years</text>
<text x="1070" y="230" text-anchor="end" font-size="16" font-weight="800" fill="#2c5454">$500-1,500 each</text>

<rect x="90" y="266" width="1020" height="64" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<circle cx="126" cy="298" r="16" fill="#3d6b6b"/>
<text x="126" y="304" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
<text x="156" y="293" font-size="15" font-weight="700" fill="#291c0e">Lock integration &amp; SAM modules</text>
<text x="156" y="315" font-size="12.5" fill="#4f4f4f">SDK licensing · SAM swaps $50-150/lock · migration firmware</text>
<text x="1070" y="304" text-anchor="end" font-size="16" font-weight="800" fill="#2c5454">$50-200/lock</text>

<rect x="90" y="340" width="1020" height="64" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<circle cx="126" cy="372" r="16" fill="#3d6b6b"/>
<text x="126" y="378" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
<text x="156" y="367" font-size="15" font-weight="700" fill="#291c0e">Front-desk re-encode labor</text>
<text x="156" y="389" font-size="12.5" fill="#4f4f4f">2-3 min per incident · 30-90 h/month at magstripe-typical rates</text>
<text x="1070" y="378" text-anchor="end" font-size="16" font-weight="800" fill="#2c5454">$15-45K/yr</text>

<rect x="90" y="414" width="1020" height="64" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<circle cx="126" cy="446" r="16" fill="#3d6b6b"/>
<text x="126" y="452" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">5</text>
<text x="156" y="441" font-size="15" font-weight="700" fill="#291c0e">Lost &amp; replaced cards</text>
<text x="156" y="463" font-size="12.5" fill="#4f4f4f">3-5% of cards lost per stay — 200 rooms at 70% occupancy</text>
<text x="1070" y="452" text-anchor="end" font-size="16" font-weight="800" fill="#2c5454">$16-32K/yr</text>

<rect x="90" y="488" width="1020" height="64" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<circle cx="126" cy="520" r="16" fill="#3d6b6b"/>
<text x="126" y="526" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">6</text>
<text x="156" y="515" font-size="15" font-weight="700" fill="#291c0e">End-of-life destruction</text>
<text x="156" y="537" font-size="12.5" fill="#4f4f4f">GDPR/PCI-scope cards need certified shredding</text>
<text x="1070" y="526" text-anchor="end" font-size="16" font-weight="800" fill="#2c5454">$0.05-0.10 per card</text>

<rect x="90" y="566" width="1020" height="48" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="600" y="596" text-anchor="middle" font-size="15.5" font-weight="800" fill="#2c5454">Full stack: typically 3-5x the per-card unit price across a 5-year program</text>

<text x="600" y="642" text-anchor="middle" font-size="13" fill="#5c5c5c">Line 1 is what the quote shows. The other five arrive later, on invoices with different vendor names.</text>
</svg>
