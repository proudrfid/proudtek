<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Line-of-sight barcode scanning versus RFID bulk capture at the dock door</title>
<desc id="d">A split comparison at one dock door. On the left, barcode scanning is line-of-sight and one carton at a time, taking 15 to 30 seconds per item by hand. On the right, a UHF RFID portal reads a whole pallet load hands-free in 2 to 3 seconds at 200 to 500 tags per second as it rolls through the read zone. The closing line notes the tag was never the cost — the searching and scanning were.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">LINE-OF-SIGHT VS BULK CAPTURE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">One dock door, two economics — the cost was never the tag, it was the searching.</text>

<line x1="600" y1="120" x2="600" y2="556" stroke="#e6dfd2" stroke-width="2"/>

<!-- LEFT · BARCODE (the slow state → red is a genuine bottleneck state) -->
<text x="310" y="150" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.3" fill="#8b2d2d">BARCODE — ONE AT A TIME</text>
<rect x="190" y="214" width="54" height="44" rx="4" fill="#f7ecec" stroke="#8b2d2d" stroke-width="2"/>
<rect x="252" y="214" width="54" height="44" rx="4" fill="#f3f1ec" stroke="#b9b2a4" stroke-width="1.6"/>
<rect x="190" y="266" width="54" height="44" rx="4" fill="#f3f1ec" stroke="#b9b2a4" stroke-width="1.6"/>
<rect x="252" y="266" width="54" height="44" rx="4" fill="#f3f1ec" stroke="#b9b2a4" stroke-width="1.6"/>
<line x1="202" y1="224" x2="202" y2="248" stroke="#4a5568" stroke-width="1.6"/>
<line x1="208" y1="224" x2="208" y2="248" stroke="#4a5568" stroke-width="2.6"/>
<line x1="215" y1="224" x2="215" y2="248" stroke="#4a5568" stroke-width="1.6"/>
<line x1="221" y1="224" x2="221" y2="248" stroke="#4a5568" stroke-width="2.6"/>
<line x1="228" y1="224" x2="228" y2="248" stroke="#4a5568" stroke-width="1.6"/>
<rect x="356" y="232" width="26" height="46" rx="4" fill="#4a5568"/>
<line x1="356" y1="255" x2="314" y2="238" stroke="#8b2d2d" stroke-width="2" stroke-dasharray="4 4"/>
<text x="310" y="356" text-anchor="middle" font-size="40" font-weight="800" fill="#8b2d2d" font-family="Lora, Georgia, serif">15-30 sec</text>
<text x="310" y="384" text-anchor="middle" font-size="15" fill="#5c5c5c">per item, scanned by hand</text>
<rect x="215" y="404" width="190" height="32" rx="16" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.4"/>
<text x="310" y="425" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">line-of-sight required</text>
<text x="310" y="470" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Each carton read individually.</text>

<!-- RIGHT · RFID PORTAL (bulk) -->
<text x="890" y="150" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.3" fill="#2c5454">RFID PORTAL — ALL AT ONCE</text>
<rect x="806" y="206" width="168" height="12" fill="#4a5568"/>
<rect x="806" y="206" width="12" height="96" fill="#4a5568"/>
<rect x="962" y="206" width="12" height="96" fill="#4a5568"/>
<rect x="822" y="226" width="140" height="72" fill="#eef5f5"/>
<rect x="852" y="242" width="80" height="44" rx="4" fill="#e7eaef" stroke="#9aa3ad" stroke-width="1.6"/>
<circle cx="868" cy="256" r="4" fill="#2c5454"/>
<circle cx="892" cy="256" r="4" fill="#2c5454"/>
<circle cx="916" cy="256" r="4" fill="#2c5454"/>
<circle cx="880" cy="274" r="4" fill="#2c5454"/>
<circle cx="904" cy="274" r="4" fill="#2c5454"/>
<line x1="828" y1="264" x2="848" y2="264" stroke="#291c0e" stroke-width="3"/>
<polygon points="848,258 864,264 848,270" fill="#291c0e"/>
<path d="M 946 244 A 14 14 0 0 1 946 284" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<path d="M 954 236 A 22 22 0 0 1 954 292" fill="none" stroke="#9ac0c0" stroke-width="2"/>
<text x="890" y="356" text-anchor="middle" font-size="40" font-weight="800" fill="#2c5454" font-family="Lora, Georgia, serif">2-3 sec</text>
<text x="890" y="384" text-anchor="middle" font-size="15" fill="#5c5c5c">per pallet load, hands-free</text>
<rect x="795" y="404" width="190" height="32" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="890" y="425" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">200-500 tags/sec</text>
<text x="890" y="470" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Whole pallet read on the roll.</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">The tag is cheap. The afternoon spent hunting a mis-scanned pallet is not.</text>
</svg>
