<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Standard RFID wood card — FSC chain of custody from forest to end of life</title>
  <desc id="d">Five-step flow: an FSC-certified forest supplies audited wood; a veneer mill continues the chain-of-custody paper trail; the card factory embeds the 13.56 MHz inlay, engraves and encodes the card; the card then serves 18–24 months of daily hotel or membership use; at end of life the path forks — the wood body biodegrades while the RFID inlay is routed through standard e-waste channels. A panel lists what ships with the order: FSC chain-of-custody documentation, EUDR Regulation (EU) 2023/1115 due-diligence support, and the inlay BOM for end-of-life processing.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c39a5f"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FROM FOREST TO FRONT DESK — AND AFTER</text>
  <text x="600" y="100" text-anchor="middle" font-size="36" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">The FSC chain of custody, end to end</text>

  <!-- ============ step nodes ============ -->
  <!-- node 1: forest -->
  <rect x="70" y="150" width="212" height="180" rx="16" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
  <circle cx="94" cy="174" r="13" fill="#2d6a4f"/>
  <text x="94" y="179" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text>
  <path d="M160 216 L176 190 L192 216 z" fill="#2d6a4f"/>
  <path d="M186 220 L202 192 L218 220 z" fill="#40916c"/>
  <rect x="184" y="220" width="6" height="10" fill="#6d5a3a"/>
  <text x="176" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">FSC-certified forest</text>
  <text x="176" y="284" text-anchor="middle" font-size="12.5" fill="#5c5c5c">managed source,</text>
  <text x="176" y="301" text-anchor="middle" font-size="12.5" fill="#5c5c5c">third-party audited</text>

  <!-- node 2: veneer mill -->
  <rect x="322" y="150" width="212" height="180" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="346" cy="174" r="13" fill="#2d6a4f"/>
  <text x="346" y="179" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text>
  <rect x="396" y="196" width="70" height="9" rx="3" fill="#c39a5f"/>
  <rect x="404" y="209" width="70" height="9" rx="3" fill="#d4a755"/>
  <rect x="396" y="222" width="70" height="9" rx="3" fill="#b98d54"/>
  <text x="428" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Veneer mill</text>
  <text x="428" y="284" text-anchor="middle" font-size="12.5" fill="#5c5c5c">chain-of-custody</text>
  <text x="428" y="301" text-anchor="middle" font-size="12.5" fill="#5c5c5c">paper trail continues</text>

  <!-- node 3: card factory -->
  <rect x="574" y="150" width="212" height="180" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="598" cy="174" r="13" fill="#2d6a4f"/>
  <text x="598" y="179" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text>
  <rect x="644" y="194" width="72" height="45" rx="7" fill="#ecd9ae" stroke="#c39a5f" stroke-width="1.6"/>
  <rect x="652" y="201" width="12" height="12" rx="2" fill="#4a5568"/>
  <rect x="650" y="199" width="60" height="35" rx="5" fill="none" stroke="#3d6b6b" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="680" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Card factory</text>
  <text x="680" y="284" text-anchor="middle" font-size="12.5" fill="#5c5c5c">inlay embedded, laser</text>
  <text x="680" y="301" text-anchor="middle" font-size="12.5" fill="#5c5c5c">engraved, encoded</text>

  <!-- node 4: in service -->
  <rect x="826" y="150" width="212" height="180" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="850" cy="174" r="13" fill="#2d6a4f"/>
  <text x="850" y="179" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text>
  <rect x="888" y="194" width="16" height="46" rx="3" fill="#4a5568"/>
  <circle cx="900" cy="217" r="3" fill="#f4efe4"/>
  <rect x="914" y="204" width="54" height="34" rx="6" fill="#ecd9ae" stroke="#c39a5f" stroke-width="1.4" transform="rotate(-8 941 221)"/>
  <text x="932" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">In service</text>
  <text x="932" y="284" text-anchor="middle" font-size="12.5" fill="#5c5c5c">18–24 months of daily</text>
  <text x="932" y="301" text-anchor="middle" font-size="12.5" fill="#5c5c5c">hotel or member use</text>

  <!-- arrows between nodes -->
  <line x1="286" y1="240" x2="316" y2="240" stroke="#c39a5f" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="538" y1="240" x2="568" y2="240" stroke="#c39a5f" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="790" y1="240" x2="820" y2="240" stroke="#c39a5f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ============ end-of-life fork ============ -->
  <line x1="900" y1="334" x2="790" y2="416" stroke="#c39a5f" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="964" y1="334" x2="1030" y2="416" stroke="#c39a5f" stroke-width="3" marker-end="url(#arr)"/>
  <text x="906" y="384" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">END OF LIFE</text>

  <rect x="648" y="424" width="250" height="120" rx="16" fill="#eef5f0" stroke="#2d6a4f" stroke-width="2"/>
  <text x="773" y="459" text-anchor="middle" font-size="15" font-weight="700" fill="#1b4332">Wood body</text>
  <text x="773" y="483" text-anchor="middle" font-size="12.5" fill="#2d6a4f">degrades naturally — PVC</text>
  <text x="773" y="500" text-anchor="middle" font-size="12.5" fill="#2d6a4f">persists for decades</text>

  <rect x="926" y="424" width="212" height="120" rx="16" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <text x="1032" y="459" text-anchor="middle" font-size="15" font-weight="700" fill="#4a5568">RFID inlay</text>
  <text x="1032" y="483" text-anchor="middle" font-size="12.5" fill="#5c5c5c">chip + antenna routed to</text>
  <text x="1032" y="500" text-anchor="middle" font-size="12.5" fill="#5c5c5c">standard e-waste channel</text>

  <!-- ============ ships-with-order panel ============ -->
  <rect x="70" y="424" width="540" height="150" rx="16" fill="#f7edd6"/>
  <text x="94" y="458" font-size="13" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">WHAT SHIPS WITH THE ORDER</text>
  <text x="94" y="486" font-size="13.5" fill="#291c0e">· FSC chain-of-custody documentation, per order</text>
  <text x="94" y="511" font-size="13.5" fill="#291c0e">· EUDR — Regulation (EU) 2023/1115 — due-diligence support</text>
  <text x="94" y="536" font-size="13.5" fill="#291c0e">· Inlay BOM for end-of-life processing, on request</text>

  <text x="600" y="622" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Verify any FSC claim — including ours — on the FSC public certificate search before you order.</text>
</svg>
