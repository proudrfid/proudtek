<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five warehouse processes where RFID returns labor minutes</title>
<desc id="d">A five-step flow across one warehouse shift: receiving, where a dock portal verifies a 50-case pallet in 3-5 seconds versus 15-30 minutes by hand; put-away, where location tracking confirms the right bin at placement; picking, verified by the tag rather than the operator's scan at 99.5-99.9% accuracy versus 97-98% manual; pack and ship, where order contents are verified complete before the truck and errors drop 80-95%; and cycle counting, continuous at 98-99% accuracy with no shutdown. Each process verifies the previous one, so errors stop cascading downstream.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE PALLET'S SHIFT — FIVE PROCESSES</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Where RFID hands the minutes back</text>

<rect x="60" y="140" width="196" height="310" rx="14" fill="#fdfbf7" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="158" cy="180" r="17" fill="#3d6b6b"/>
<text x="158" y="186" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="158" y="226" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Receiving</text>
<text x="158" y="254" text-anchor="middle" font-size="12.5" fill="#4f4f4f">dock portal verifies</text>
<text x="158" y="273" text-anchor="middle" font-size="12.5" fill="#4f4f4f">a 50-case pallet</text>
<text x="158" y="292" text-anchor="middle" font-size="12.5" fill="#4f4f4f">against the PO</text>
<rect x="72" y="316" width="172" height="56" rx="9" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="158" y="339" text-anchor="middle" font-size="13.5" font-weight="700" fill="#234a4a">3-5 s at the door</text>
<text x="158" y="359" text-anchor="middle" font-size="12" fill="#2c5454">vs 15-30 min by hand</text>
<text x="158" y="400" text-anchor="middle" font-size="12" fill="#4f4f4f">discrepancies alert</text>
<text x="158" y="418" text-anchor="middle" font-size="12" fill="#4f4f4f">immediately</text>

<line x1="258" y1="295" x2="272" y2="295" stroke="#c39a5f" stroke-width="2.5"/>
<polygon points="271,289 281,295 271,301" fill="#c39a5f"/>

<rect x="281" y="140" width="196" height="310" rx="14" fill="#fdfbf7" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="379" cy="180" r="17" fill="#3d6b6b"/>
<text x="379" y="186" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="379" y="226" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Put-away</text>
<text x="379" y="254" text-anchor="middle" font-size="12.5" fill="#4f4f4f">location tracking</text>
<text x="379" y="273" text-anchor="middle" font-size="12.5" fill="#4f4f4f">confirms the bin</text>
<text x="379" y="292" text-anchor="middle" font-size="12.5" fill="#4f4f4f">at placement</text>
<rect x="293" y="316" width="172" height="56" rx="9" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="379" y="339" text-anchor="middle" font-size="13.5" font-weight="700" fill="#234a4a">right bin, confirmed</text>
<text x="379" y="359" text-anchor="middle" font-size="12" fill="#2c5454">no 'close enough' slots</text>
<text x="379" y="400" text-anchor="middle" font-size="12" fill="#4f4f4f">misplacements stop</text>
<text x="379" y="418" text-anchor="middle" font-size="12" fill="#4f4f4f">cascading downstream</text>

<line x1="479" y1="295" x2="493" y2="295" stroke="#c39a5f" stroke-width="2.5"/>
<polygon points="492,289 502,295 492,301" fill="#c39a5f"/>

<rect x="502" y="140" width="196" height="310" rx="14" fill="#fdfbf7" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="600" cy="180" r="17" fill="#3d6b6b"/>
<text x="600" y="186" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="600" y="226" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Picking</text>
<text x="600" y="254" text-anchor="middle" font-size="12.5" fill="#4f4f4f">each pick verified by</text>
<text x="600" y="273" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the tag, not by the</text>
<text x="600" y="292" text-anchor="middle" font-size="12.5" fill="#4f4f4f">operator's scan</text>
<rect x="514" y="316" width="172" height="56" rx="9" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="600" y="339" text-anchor="middle" font-size="13.5" font-weight="700" fill="#234a4a">99.5-99.9% accuracy</text>
<text x="600" y="359" text-anchor="middle" font-size="12" fill="#2c5454">vs 97-98% manual</text>
<text x="600" y="400" text-anchor="middle" font-size="12" fill="#4f4f4f">correct item, correct</text>
<text x="600" y="418" text-anchor="middle" font-size="12" fill="#4f4f4f">quantity, every location</text>

<line x1="700" y1="295" x2="714" y2="295" stroke="#c39a5f" stroke-width="2.5"/>
<polygon points="713,289 723,295 713,301" fill="#c39a5f"/>

<rect x="723" y="140" width="196" height="310" rx="14" fill="#fdfbf7" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="821" cy="180" r="17" fill="#3d6b6b"/>
<text x="821" y="186" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="821" y="226" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Pack &amp; ship</text>
<text x="821" y="254" text-anchor="middle" font-size="12.5" fill="#4f4f4f">order contents</text>
<text x="821" y="273" text-anchor="middle" font-size="12.5" fill="#4f4f4f">verified complete</text>
<text x="821" y="292" text-anchor="middle" font-size="12.5" fill="#4f4f4f">before the truck</text>
<rect x="735" y="316" width="172" height="56" rx="9" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="821" y="339" text-anchor="middle" font-size="13.5" font-weight="700" fill="#234a4a">errors down 80-95%</text>
<text x="821" y="359" text-anchor="middle" font-size="12" fill="#2c5454">short-ships, wrong items</text>
<text x="821" y="400" text-anchor="middle" font-size="12" fill="#4f4f4f">returns and re-ships</text>
<text x="821" y="418" text-anchor="middle" font-size="12" fill="#4f4f4f">never get created</text>

<line x1="921" y1="295" x2="935" y2="295" stroke="#c39a5f" stroke-width="2.5"/>
<polygon points="934,289 944,295 934,301" fill="#c39a5f"/>

<rect x="944" y="140" width="196" height="310" rx="14" fill="#fdfbf7" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="1042" cy="180" r="17" fill="#3d6b6b"/>
<text x="1042" y="186" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
<text x="1042" y="226" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Cycle counting</text>
<text x="1042" y="254" text-anchor="middle" font-size="12.5" fill="#4f4f4f">continuous counts,</text>
<text x="1042" y="273" text-anchor="middle" font-size="12.5" fill="#4f4f4f">overhead readers or</text>
<text x="1042" y="292" text-anchor="middle" font-size="12.5" fill="#4f4f4f">handheld walks</text>
<rect x="956" y="316" width="172" height="56" rx="9" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="1042" y="339" text-anchor="middle" font-size="13.5" font-weight="700" fill="#234a4a">98-99% accuracy</text>
<text x="1042" y="359" text-anchor="middle" font-size="12" fill="#2c5454">no shutdown needed</text>
<text x="1042" y="400" text-anchor="middle" font-size="12" fill="#4f4f4f">the count weekend</text>
<text x="1042" y="418" text-anchor="middle" font-size="12" fill="#4f4f4f">quietly disappears</text>

<rect x="60" y="490" width="1080" height="72" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="600" y="520" text-anchor="middle" font-size="15" font-weight="700" fill="#234a4a">Each process verifies the one before it</text>
<text x="600" y="544" text-anchor="middle" font-size="13" fill="#2c5454">a wrong bin caught at put-away never becomes a mis-pick, a mis-pick caught at pack never becomes a return</text>

<text x="600" y="606" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The minutes hide inside 'how receiving works' and 'how picking works' — until each step starts checking itself.</text>
</svg>
