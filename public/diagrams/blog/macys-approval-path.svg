<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five-step Macy's approved-supplier path</title>
<desc id="d">Five sequential steps to Macy's RFID supplier approval, shown as cards joined by arrows. Step 1: get your Vendor ID, assigned at vendor onboarding and required for every EDI move and scorecard entry. Step 2: file a compliance plan — 2-3 pages covering chips, encoding, placement and EDI readiness via the Vendor Portal. Step 3: pass the first-shipment audit — 200-500 units graded on read rate, encoding accuracy and label placement. Step 4: live on the monthly scorecard — track chargeback exposure and fix any category under 95% within 30 days. Step 5: re-validate inlays every quarter and re-qualify substitutions. Skipping a step idles the first shipment for 4-8 weeks.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE STEPS TO APPROVED-SUPPLIER STATUS</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">The Macy's approval path</text>

<rect x="53" y="150" width="206" height="320" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="53" y="150" width="206" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="156" cy="204" r="25" fill="#3d6b6b"/>
<text x="156" y="212" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
<text x="156" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Get your</text>
<text x="156" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Vendor ID</text>
<text x="156" y="320" text-anchor="middle" font-size="13" fill="#4f4f4f">Assigned at vendor</text>
<text x="156" y="342" text-anchor="middle" font-size="13" fill="#4f4f4f">onboarding — required</text>
<text x="156" y="364" text-anchor="middle" font-size="13" fill="#4f4f4f">for every EDI move</text>
<text x="156" y="386" text-anchor="middle" font-size="13" fill="#4f4f4f">and scorecard entry.</text>

<path d="M265 302 L276 310 L265 318" fill="none" stroke="#c39a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="281" y="150" width="206" height="320" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="281" y="150" width="206" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="384" cy="204" r="25" fill="#3d6b6b"/>
<text x="384" y="212" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
<text x="384" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">File a compliance</text>
<text x="384" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">plan</text>
<text x="384" y="320" text-anchor="middle" font-size="13" fill="#4f4f4f">2-3 pages: chips,</text>
<text x="384" y="342" text-anchor="middle" font-size="13" fill="#4f4f4f">encoding, placement,</text>
<text x="384" y="364" text-anchor="middle" font-size="13" fill="#4f4f4f">EDI readiness. Via</text>
<text x="384" y="386" text-anchor="middle" font-size="13" fill="#4f4f4f">the Vendor Portal.</text>

<path d="M493 302 L504 310 L493 318" fill="none" stroke="#c39a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="509" y="150" width="206" height="320" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="509" y="150" width="206" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="612" cy="204" r="25" fill="#3d6b6b"/>
<text x="612" y="212" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
<text x="612" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Pass the first-</text>
<text x="612" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">shipment audit</text>
<text x="612" y="320" text-anchor="middle" font-size="13" fill="#4f4f4f">200-500 units, graded</text>
<text x="612" y="342" text-anchor="middle" font-size="13" fill="#4f4f4f">on read rate, encoding</text>
<text x="612" y="364" text-anchor="middle" font-size="13" fill="#4f4f4f">accuracy and label</text>
<text x="612" y="386" text-anchor="middle" font-size="13" fill="#4f4f4f">placement.</text>

<path d="M721 302 L732 310 L721 318" fill="none" stroke="#c39a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="737" y="150" width="206" height="320" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="737" y="150" width="206" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="840" cy="204" r="25" fill="#3d6b6b"/>
<text x="840" y="212" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">4</text>
<text x="840" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Live on the</text>
<text x="840" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">monthly scorecard</text>
<text x="840" y="320" text-anchor="middle" font-size="13" fill="#4f4f4f">Track chargeback</text>
<text x="840" y="342" text-anchor="middle" font-size="13" fill="#4f4f4f">exposure; fix any</text>
<text x="840" y="364" text-anchor="middle" font-size="13" fill="#4f4f4f">category under 95%</text>
<text x="840" y="386" text-anchor="middle" font-size="13" fill="#4f4f4f">within 30 days.</text>

<path d="M949 302 L960 310 L949 318" fill="none" stroke="#c39a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="965" y="150" width="206" height="320" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="965" y="150" width="206" height="8" rx="4" fill="#2d6a4f"/>
<circle cx="1068" cy="204" r="25" fill="#2d6a4f"/>
<text x="1068" y="212" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">5</text>
<text x="1068" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Re-validate inlays</text>
<text x="1068" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">every quarter</text>
<text x="1068" y="320" text-anchor="middle" font-size="13" fill="#4f4f4f">The approved list</text>
<text x="1068" y="342" text-anchor="middle" font-size="13" fill="#4f4f4f">moves. Confirm your</text>
<text x="1068" y="364" text-anchor="middle" font-size="13" fill="#4f4f4f">SKU made the cut;</text>
<text x="1068" y="386" text-anchor="middle" font-size="13" fill="#4f4f4f">re-qualify swaps.</text>

<text x="600" y="540" text-anchor="middle" font-size="16" font-weight="700" fill="#6d5a3a">Skip a step and your first shipment idles in limbo for 4-8 weeks.</text>
<text x="600" y="570" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Which is a very long time to explain to your boss.</text>
</svg>
