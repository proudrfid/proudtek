<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five-line warehouse labor ledger RFID rewrites</title>
<desc id="d">A ledger of the five lines where warehouse payroll hides, each with its RFID impact: receiving dock labor drops 60-80% as pallet verification moves from minutes to seconds; picker travel falls 15-30% when workers are directed to the exact location; error rework at $10-50 per incident is 80-95% prevented by pick verification; cycle counting shrinks from 2-5 FTEs to 0.5-1 FTE as continuous counting replaces periodic counts; and the 20-40% of worker time spent searching is largely recovered for tagged inventory. The combined effect reaches 25-40% of total warehouse labor costs.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE LABOR LEDGER</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Five lines where the payroll hides</text>

<rect x="60" y="132" width="1080" height="70" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="84" y="162" font-size="15.5" font-weight="700" fill="#291c0e">Receiving dock</text>
<text x="84" y="186" font-size="12.5" fill="#4f4f4f">pallet verification moves from minutes to seconds</text>
<line x1="470" y1="168" x2="880" y2="168" stroke="#d8d0c0" stroke-width="1.5" stroke-dasharray="2 5"/>
<text x="1116" y="174" text-anchor="end" font-size="16" font-weight="800" fill="#2c5454">60-80% fewer hours</text>

<rect x="60" y="212" width="1080" height="70" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="84" y="242" font-size="15.5" font-weight="700" fill="#291c0e">Picker travel</text>
<text x="84" y="266" font-size="12.5" fill="#4f4f4f">directed to the exact location — the largest slice of picking labor</text>
<line x1="530" y1="248" x2="895" y2="248" stroke="#d8d0c0" stroke-width="1.5" stroke-dasharray="2 5"/>
<text x="1116" y="254" text-anchor="end" font-size="16" font-weight="800" fill="#2c5454">15-30% less travel</text>

<rect x="60" y="292" width="1080" height="70" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="84" y="322" font-size="15.5" font-weight="700" fill="#291c0e">Error rework</text>
<text x="84" y="346" font-size="12.5" fill="#4f4f4f">$10-50 per incident: return processing, re-pick, re-ship, customer service</text>
<line x1="580" y1="328" x2="900" y2="328" stroke="#d8d0c0" stroke-width="1.5" stroke-dasharray="2 5"/>
<text x="1116" y="334" text-anchor="end" font-size="16" font-weight="800" fill="#2c5454">80-95% prevented</text>

<rect x="60" y="372" width="1080" height="70" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="84" y="402" font-size="15.5" font-weight="700" fill="#291c0e">Cycle counting</text>
<text x="84" y="426" font-size="12.5" fill="#4f4f4f">continuous counting replaces disruptive periodic counts</text>
<line x1="510" y1="408" x2="850" y2="408" stroke="#d8d0c0" stroke-width="1.5" stroke-dasharray="2 5"/>
<text x="1116" y="414" text-anchor="end" font-size="16" font-weight="800" fill="#2c5454">2-5 FTEs down to 0.5-1</text>

<rect x="60" y="452" width="1080" height="70" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="84" y="482" font-size="15.5" font-weight="700" fill="#291c0e">Search time</text>
<text x="84" y="506" font-size="12.5" fill="#4f4f4f">20-40% of worker hours goes to hunting inventory</text>
<line x1="470" y1="488" x2="890" y2="488" stroke="#d8d0c0" stroke-width="1.5" stroke-dasharray="2 5"/>
<text x="1116" y="494" text-anchor="end" font-size="16" font-weight="800" fill="#2c5454">largely recovered</text>

<rect x="60" y="536" width="1080" height="64" rx="12" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="84" y="574" font-size="14" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COMBINED EFFECT</text>
<text x="1116" y="576" text-anchor="end" font-size="18" font-weight="800" fill="#291c0e">25-40% of total warehouse labor costs</text>

<text x="600" y="634" text-anchor="middle" font-size="13.5" fill="#5c5c5c">None of these lines says 'waste' on the P&amp;L — which is exactly how they survive every budget review.</text>
</svg>
