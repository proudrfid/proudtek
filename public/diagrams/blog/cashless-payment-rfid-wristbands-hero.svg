<rect x="812" y="196" width="300" height="8" rx="4" fill="#1f6f3a"/>
<text x="962" y="240" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">3 · THE LIFT</text>
<text x="962" y="330" text-anchor="middle" font-size="52" font-weight="800" fill="#1f6f3a">+15-30%</text>
<text x="962" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">per-attendee spend</text>
<text x="962" y="414" text-anchor="middle" font-size="12.5" fill="#5c5c5c">vs cash-and-card operations</text>

