<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="siRollTitle siRollDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="siRollTitle">The five-step instrument RFID rollout, in the order that holds up</title>
  <desc id="siRollDesc">Five steps on a timeline: pilot one high-volume tray family in 30 to 90 days; integrate with OR scheduling and the EHR (Epic, Cerner, Meditech) before scaling; wire the sterile workflow with readers at the washer-disinfector, autoclave and tray-pack stations; train SPD and OR staff 4 to 8 hours per role; then roll out tray-by-tray at 5 to 10 trays a month across 50 to 300 tray families. Full rollout runs 12 to 24 months.</desc>

  <defs>
    <radialGradient id="siRollBg" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f1ece0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#siRollBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="0.3" fill="#291c0e">The five-step rollout — in the order that holds up</text>
  <text x="600" y="89" text-anchor="middle" font-size="15" fill="#3d6b6b">Tagging one instrument is a hardware problem. Tagging a whole hospital is choreography.</text>

  <!-- rail -->
  <line x1="162" y1="150" x2="1038" y2="150" stroke="#d9c39a" stroke-width="3"/>
  <path d="M266 145 l11 5 l-11 5 z" fill="#c39a5f"/>
  <path d="M485 145 l11 5 l-11 5 z" fill="#c39a5f"/>
  <path d="M704 145 l11 5 l-11 5 z" fill="#c39a5f"/>
  <path d="M923 145 l11 5 l-11 5 z" fill="#c39a5f"/>

  <!-- STEP 1 -->
  <circle cx="162" cy="150" r="24" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
  <text x="162" y="158" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">1</text>
  <rect x="62" y="186" width="200" height="232" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <rect x="62" y="186" width="200" height="7" rx="3.5" fill="#3d6b6b"/>
  <text x="162" y="222" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Pilot one</text>
  <text x="162" y="242" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">tray family</text>
  <text x="162" y="285" text-anchor="middle" font-size="17" font-weight="800" fill="#3d6b6b">30–90 days</text>
  <text x="162" y="320" text-anchor="middle" font-size="12" fill="#4f4f4f">a high-volume tray</text>
  <text x="162" y="339" text-anchor="middle" font-size="12" fill="#4f4f4f">(general / ortho) —</text>
  <text x="162" y="358" text-anchor="middle" font-size="12" fill="#4f4f4f">prove the workflow</text>

  <!-- STEP 2 -->
  <circle cx="381" cy="150" r="24" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
  <text x="381" y="158" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">2</text>
  <rect x="281" y="186" width="200" height="232" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <rect x="281" y="186" width="200" height="7" rx="3.5" fill="#3d6b6b"/>
  <text x="381" y="222" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Integrate EHR</text>
  <text x="381" y="242" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">&amp; scheduling</text>
  <text x="381" y="285" text-anchor="middle" font-size="17" font-weight="800" fill="#3d6b6b">Plan first</text>
  <text x="381" y="320" text-anchor="middle" font-size="12" fill="#4f4f4f">Epic, Cerner, Meditech</text>
  <text x="381" y="339" text-anchor="middle" font-size="12" fill="#4f4f4f">tray-level tracking —</text>
  <text x="381" y="358" text-anchor="middle" font-size="12" fill="#4f4f4f">wire before you scale</text>

  <!-- STEP 3 -->
  <circle cx="600" cy="150" r="24" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
  <text x="600" y="158" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">3</text>
  <rect x="500" y="186" width="200" height="232" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <rect x="500" y="186" width="200" height="7" rx="3.5" fill="#3d6b6b"/>
  <text x="600" y="222" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Wire the</text>
  <text x="600" y="242" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">sterile workflow</text>
  <text x="600" y="285" text-anchor="middle" font-size="17" font-weight="800" fill="#3d6b6b">3 reader points</text>
  <text x="600" y="320" text-anchor="middle" font-size="12" fill="#4f4f4f">washer-disinfector,</text>
  <text x="600" y="339" text-anchor="middle" font-size="12" fill="#4f4f4f">autoclave, tray-pack —</text>
  <text x="600" y="358" text-anchor="middle" font-size="12" fill="#4f4f4f">each scan logged</text>

  <!-- STEP 4 -->
  <circle cx="819" cy="150" r="24" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
  <text x="819" y="158" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">4</text>
  <rect x="719" y="186" width="200" height="232" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <rect x="719" y="186" width="200" height="7" rx="3.5" fill="#3d6b6b"/>
  <text x="819" y="222" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Train SPD</text>
  <text x="819" y="242" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">&amp; OR staff</text>
  <text x="819" y="285" text-anchor="middle" font-size="17" font-weight="800" fill="#3d6b6b">4–8 hrs / role</text>
  <text x="819" y="320" text-anchor="middle" font-size="12" fill="#4f4f4f">paper → RFID is a</text>
  <text x="819" y="339" text-anchor="middle" font-size="12" fill="#4f4f4f">culture change —</text>
  <text x="819" y="358" text-anchor="middle" font-size="12" fill="#4f4f4f">30–60 day overlap</text>

  <!-- STEP 5 -->
  <circle cx="1038" cy="150" r="24" fill="#1f6f3a" stroke="#155a2c" stroke-width="2"/>
  <text x="1038" y="158" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">5</text>
  <rect x="938" y="186" width="200" height="232" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <rect x="938" y="186" width="200" height="7" rx="3.5" fill="#1f6f3a"/>
  <text x="1038" y="222" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Roll out</text>
  <text x="1038" y="242" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">tray-by-tray</text>
  <text x="1038" y="285" text-anchor="middle" font-size="17" font-weight="800" fill="#1f6f3a">5–10 trays / mo</text>
  <text x="1038" y="320" text-anchor="middle" font-size="12" fill="#4f4f4f">50–300 tray families</text>
  <text x="1038" y="339" text-anchor="middle" font-size="12" fill="#4f4f4f">in total —</text>
  <text x="1038" y="358" text-anchor="middle" font-size="12" fill="#4f4f4f">manage the change</text>

  <!-- span bracket -->
  <rect x="62" y="442" width="1076" height="48" rx="24" fill="#e9f1f0" stroke="#bcd3d3" stroke-width="2"/>
  <path d="M96 466 l14 -8 v16 z" fill="#2c5454"/>
  <path d="M1104 466 l-14 -8 v16 z" fill="#2c5454"/>
  <text x="600" y="472" text-anchor="middle" font-size="15.5" font-weight="800" fill="#2c5454">Full rollout: 12–24 months, end to end — 6–12 at high-volume teaching hospitals</text>

  <!-- footer takeaway -->
  <rect x="70" y="512" width="1060" height="84" rx="14" fill="#2a1d0f"/>
  <text x="100" y="550" font-size="15.5" font-weight="700" fill="#f0c98a">The order matters:</text>
  <text x="286" y="550" font-size="15" fill="#f3ecdd">most instrument-RFID projects stall on integration and training, not on the chips.</text>
  <text x="286" y="574" font-size="15" fill="#f3ecdd">Pilot small, wire the back end early, and let the culture change keep pace with the tags.</text>
</svg>
