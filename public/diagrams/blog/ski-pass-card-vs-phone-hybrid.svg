<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">One lift gate, two credentials: physical RFID card and phone BLE</title>
<desc id="d">A single lift gate antenna stack reads whichever credential is presented: a physical RFID card on the left or a phone using Bluetooth Low Energy on the right. The physical card has no battery to drain and no screen to wake, so it is best in deep cold around minus 20 Celsius. The phone is convenient in mild conditions but its battery drains in the cold. The guidance is to order physical cards at 60 to 80 percent of pass-holder count.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TWO CREDENTIALS, ONE GATE</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">For 2026-2027, plan for the phone — but keep the card for the cold.</text>

<rect x="120" y="150" width="170" height="106" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.8"/>
<rect x="120" y="150" width="170" height="26" rx="8" fill="#eef1f5"/>
<text x="205" y="205" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4657">RFID card</text>
<text x="205" y="228" text-anchor="middle" font-size="12" fill="#8a8a8a">physical · no battery</text>

<rect x="910" y="140" width="96" height="126" rx="12" fill="#ffffff" stroke="#177a92" stroke-width="1.8"/>
<rect x="946" y="150" width="24" height="4" rx="2" fill="#c3ccd8"/>
<text x="958" y="200" text-anchor="middle" font-size="14" font-weight="800" fill="#177a92">phone</text>
<text x="958" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#177a92">BLE</text>

<rect x="470" y="150" width="260" height="120" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="600" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#234a4a">LIFT GATE</text>
<text x="600" y="220" text-anchor="middle" font-size="12.5" fill="#5c5c5c">one antenna stack</text>
<text x="600" y="246" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">reads whichever is presented</text>

<line x1="292" y1="205" x2="462" y2="205" stroke="#4a5568" stroke-width="2.4"/><polygon points="462,199 472,205 462,211" fill="#4a5568"/>
<line x1="908" y1="205" x2="738" y2="205" stroke="#177a92" stroke-width="2.4"/><polygon points="738,199 728,205 738,211" fill="#177a92"/>

<rect x="90" y="322" width="490" height="212" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="90" y="322" width="490" height="46" rx="14" fill="#3d6b6b"/>
<text x="335" y="352" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">PHYSICAL CARD</text>
<circle cx="130" cy="404" r="4" fill="#3d6b6b"/><text x="146" y="409" font-size="14.5" fill="#291c0e">No battery to drain</text>
<circle cx="130" cy="442" r="4" fill="#3d6b6b"/><text x="146" y="447" font-size="14.5" fill="#291c0e">No screen to wake</text>
<circle cx="130" cy="480" r="4" fill="#3d6b6b"/><text x="146" y="485" font-size="14.5" fill="#291c0e">Best in deep cold, around -20°C</text>

<rect x="620" y="322" width="490" height="212" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="620" y="322" width="490" height="46" rx="14" fill="#4a5568"/>
<text x="865" y="352" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">PHONE · BLE</text>
<circle cx="660" cy="404" r="4" fill="#177a92"/><text x="676" y="409" font-size="14.5" fill="#291c0e">No card to carry</text>
<circle cx="660" cy="442" r="4" fill="#177a92"/><text x="676" y="447" font-size="14.5" fill="#291c0e">Great in mild conditions</text>
<circle cx="660" cy="480" r="4" fill="#177a92"/><text x="676" y="485" font-size="14.5" fill="#291c0e">Battery drains in the cold</text>

<text x="600" y="586" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Order physical cards at 60-80% of pass-holders — on a frozen lift, the card is still the one that just works.</text>
</svg>
