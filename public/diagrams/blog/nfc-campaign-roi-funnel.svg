<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How NFC campaign ROI is calculated, stage by stage</title>
<desc id="d">A three-stage funnel. Stage one, total campaign cost equals hardware plus programming plus redirect platform plus creative. Stage two, divide by verified taps to get cost per engagement, typically 5 to 15 US cents per tap. Stage three, multiply through the conversion rate to get cost per conversion, targeting 15 to 30 percent tap-to-action. Then benchmark cost-per-conversion against QR, SMS keyword, and printed-URL campaigns running in the same locations.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NFC CAMPAIGN ROI</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Cost per tap, then cost per conversion — measured against what else runs there.</text>

<!-- Stage 1 -->
<polygon points="180,150 1020,150 960,248 240,248" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="600" y="192" text-anchor="middle" font-size="17" font-weight="800" fill="#234a4a">TOTAL CAMPAIGN COST</text>
<text x="600" y="220" text-anchor="middle" font-size="13.5" fill="#3d6b6b">hardware + programming + redirect platform + creative</text>

<!-- Stage 2 -->
<polygon points="240,258 960,258 900,356 300,356" fill="#e6efec" stroke="#2c5454" stroke-width="2"/>
<text x="600" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#234a4a">÷ verified taps  =  cost per engagement</text>
<text x="600" y="326" text-anchor="middle" font-size="13.5" fill="#3d6b6b">typically $0.05-$0.15 per tap at scale</text>

<!-- Stage 3 -->
<polygon points="300,366 900,366 840,464 360,464" fill="#eef7f0" stroke="#1f6f3a" stroke-width="2"/>
<text x="600" y="408" text-anchor="middle" font-size="16" font-weight="800" fill="#1f6f3a">× conversion rate  =  cost per conversion</text>
<text x="600" y="434" text-anchor="middle" font-size="13.5" fill="#4f6a5a">target 15-30% tap-to-action on a good landing page</text>

<!-- compare footer -->
<rect x="180" y="486" width="840" height="74" rx="13" fill="#faf6ee" stroke="#e4c98f" stroke-width="1.8"/>
<text x="600" y="518" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Benchmark that number against QR, SMS keyword, and printed-URL campaigns</text>
<text x="600" y="540" text-anchor="middle" font-size="13.5" fill="#7a6636">running in the same locations — the only comparison that means anything.</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Reusing stickers across campaigns drops amortized cost per engagement 50-70%.</text>
</svg>
