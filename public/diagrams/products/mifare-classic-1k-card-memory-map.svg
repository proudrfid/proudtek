<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">MIFARE Classic 1K memory map — 16 sectors of 4 blocks, keys and MAD</title>
  <desc id="d">Grid of 16 sectors, each 4 blocks of 16 bytes. Sector 0 block 0 is the read-only manufacturer block with the UID. Each sector trailer holds 48-bit Key A, access bits and 48-bit Key B. MAD v1 lives in sector 0; the directory maps sectors to applications.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">1 KB, carved into 16 sectors</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">16 sectors x 4 blocks x 16 bytes — every sector guards itself with two keys</text>
  <g transform="translate(60,130)">
    <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2c5454">
      <rect x="0" y="0" width="150" height="104" rx="8" fill="#fdf3e3" stroke="#c39a5f" stroke-width="2.5"/>
      <text x="12" y="22" font-size="14" fill="#6d5a3a">Sector 0</text>
      <rect x="10" y="32" width="130" height="14" fill="#c39a5f" opacity="0.55"/>
      <text x="14" y="43" font-size="12" fill="#291c0e">B0 UID — read-only</text>
      <rect x="10" y="50" width="130" height="14" fill="#ffffff" stroke="#d8cdb8"/>
      <rect x="10" y="68" width="130" height="14" fill="#ffffff" stroke="#d8cdb8"/>
      <rect x="10" y="86" width="130" height="12" fill="#3d6b6b" opacity="0.85"/>
      <text x="14" y="96" font-size="12" fill="#f8f6f1">Key A · bits · Key B</text>
    </g>
    <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2c5454">
      <rect x="170" y="0" width="150" height="104" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
      <text x="182" y="22" font-size="14" fill="#2c5454">Sector 1</text>
      <rect x="180" y="32" width="130" height="14" fill="#ffffff" stroke="#d8cdb8"/>
      <rect x="180" y="50" width="130" height="14" fill="#ffffff" stroke="#d8cdb8"/>
      <rect x="180" y="68" width="130" height="14" fill="#ffffff" stroke="#d8cdb8"/>
      <rect x="180" y="86" width="130" height="12" fill="#3d6b6b" opacity="0.85"/>
      <text x="184" y="96" font-size="12" fill="#f8f6f1">Key A · bits · Key B</text>
    </g>
    <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">
      <rect x="340" y="0" width="150" height="104" rx="8" fill="#ffffff" stroke="#d8cdb8" stroke-width="1.5"/>
      <text x="352" y="22" font-size="14">Sector 2</text>
      <text x="352" y="60" font-size="12">4 blocks x 16 B</text>
      <rect x="510" y="0" width="150" height="104" rx="8" fill="#ffffff" stroke="#d8cdb8" stroke-width="1.5"/>
      <text x="522" y="22" font-size="14">Sector 3</text>
      <text x="522" y="60" font-size="12">4 blocks x 16 B</text>
      <rect x="680" y="0" width="150" height="104" rx="8" fill="#ffffff" stroke="#d8cdb8" stroke-width="1.5"/>
      <text x="692" y="22" font-size="14">Sectors 4-14</text>
      <text x="692" y="60" font-size="12">same shape, app data</text>
      <rect x="850" y="0" width="150" height="104" rx="8" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2"/>
      <text x="862" y="22" font-size="14" fill="#2c5454">Sector 15</text>
      <text x="862" y="60" font-size="12" fill="#2c5454">last of 16</text>
    </g>
  </g>
  <g transform="translate(60,300)">
    <rect x="0" y="0" width="1040" height="120" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="28" y="40" font-family="Georgia, serif" font-size="19" fill="#291c0e">Two 48-bit keys per sector</text>
    <text x="28" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Key A and Key B are independent; access-condition bits decide which key authorises each block operation</text>
    <text x="28" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">Fleet practice: diversified per-card keys via the pre-encoding bureau, never transport defaults</text>
  </g>
  <g transform="translate(60,450)">
    <rect x="0" y="0" width="1040" height="120" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="28" y="40" font-family="Georgia, serif" font-size="19" fill="#2c5454">MAD — the card index</text>
    <text x="28" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">MAD v1 (sector 0) and MAD v2 (sector 16 on larger parts) map sectors to applications</text>
    <text x="28" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">Lets one card carry access + cafeteria + attendance without the readers colliding</text>
  </g>
  <text x="60" y="628" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Gold = read-only manufacturer block · teal bars = sector trailers holding the keys</text>
</svg>
