<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A blood unit RFID-verified at six chain-of-custody checkpoints</title>
<desc id="d">A single blood unit moves through six checkpoints — collection, testing, labeling, storage, crossmatch and bedside — and RFID verifies identity at each handoff, shown by a green check under every step. Left panel: every checkpoint answers one question, is this the right unit for this patient; wrong-blood-in-tube is caught before the lab, wrong-patient transfusion at the bedside, and contaminated-unit look-back drops from days to minutes. Right panel: perishable stock is tracked to the hour — red cells last 35 to 42 days, platelets 5 days — and RFID temperature-logging tags flag a cold-chain excursion outside the 1 to 6 degrees Celsius band in real time, shown by a red zone on a temperature strip.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">VERIFIED AT EVERY HANDOFF</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">One unit, six checkpoints, no unverified handoff</text>

<!-- connector -->
<line x1="150" y1="200" x2="1050" y2="200" stroke="#e4c98f" stroke-width="2.5"/>

<!-- nodes -->
<g text-anchor="middle">
<!-- 1 collection -->
<circle cx="150" cy="200" r="34" fill="#3d6b6b"/>
<rect x="141" y="182" width="18" height="40" rx="5" fill="#ffffff"/><rect x="141" y="204" width="18" height="18" fill="#cfe0e0"/><rect x="139" y="178" width="22" height="7" rx="2" fill="#ffffff"/>
<circle cx="150" cy="252" r="11" fill="#1f6f3a"/><path d="M 145 252 l 4 5 7 -9" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="150" y="290" font-size="14" font-weight="700" fill="#291c0e">Collection</text>
<!-- 2 testing -->
<circle cx="330" cy="200" r="34" fill="#3d6b6b"/>
<path d="M330 182 C 340 196 344 202 344 210 a 14 14 0 1 1 -28 0 C 316 202 320 196 330 182 Z" fill="#ffffff"/>
<circle cx="330" cy="252" r="11" fill="#1f6f3a"/><path d="M 325 252 l 4 5 7 -9" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="330" y="290" font-size="14" font-weight="700" fill="#291c0e">Testing</text>
<!-- 3 labeling -->
<circle cx="510" cy="200" r="34" fill="#3d6b6b"/>
<g fill="#ffffff"><rect x="494" y="186" width="3" height="28"/><rect x="500" y="186" width="2" height="28"/><rect x="505" y="186" width="4" height="28"/><rect x="512" y="186" width="2" height="28"/><rect x="517" y="186" width="3" height="28"/><rect x="523" y="186" width="4" height="28"/></g>
<circle cx="510" cy="252" r="11" fill="#1f6f3a"/><path d="M 505 252 l 4 5 7 -9" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="510" y="290" font-size="14" font-weight="700" fill="#291c0e">Labeling</text>
<!-- 4 storage -->
<circle cx="690" cy="200" r="34" fill="#3d6b6b"/>
<g stroke="#ffffff" stroke-width="3" stroke-linecap="round"><path d="M690 182 v36"/><path d="M674 191 l32 18"/><path d="M706 191 l-32 18"/></g>
<circle cx="690" cy="252" r="11" fill="#1f6f3a"/><path d="M 685 252 l 4 5 7 -9" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="690" y="290" font-size="14" font-weight="700" fill="#291c0e">Storage</text>
<!-- 5 crossmatch -->
<circle cx="870" cy="200" r="34" fill="#3d6b6b"/>
<circle cx="862" cy="200" r="11" fill="none" stroke="#ffffff" stroke-width="3"/><circle cx="878" cy="200" r="11" fill="none" stroke="#ffffff" stroke-width="3"/>
<circle cx="870" cy="252" r="11" fill="#1f6f3a"/><path d="M 865 252 l 4 5 7 -9" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="870" y="290" font-size="14" font-weight="700" fill="#291c0e">Crossmatch</text>
<!-- 6 bedside -->
<circle cx="1050" cy="200" r="34" fill="#3d6b6b"/>
<rect x="1028" y="187" width="44" height="26" rx="13" fill="none" stroke="#ffffff" stroke-width="3.5"/><circle cx="1050" cy="200" r="4" fill="#ffffff"/>
<circle cx="1050" cy="252" r="11" fill="#1f6f3a"/><path d="M 1045 252 l 4 5 7 -9" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1050" y="290" font-size="14" font-weight="700" fill="#291c0e">Bedside</text>
</g>

<!-- left info box -->
<rect x="64" y="330" width="566" height="256" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="90" y="368" font-size="16" font-weight="700" fill="#291c0e">Every checkpoint answers one question</text>
<rect x="90" y="384" width="514" height="40" rx="8" fill="#eef5f5"/>
<text x="112" y="410" font-size="16" font-weight="700" fill="#2c5454">Is this the right unit for this patient?</text>
<g font-size="14" fill="#291c0e">
<circle cx="102" cy="454" r="10" fill="#1f6f3a"/><path d="M 97 454 l 4 5 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="122" y="459">Wrong-blood-in-tube (WBIT) caught before the lab</text>
<circle cx="102" cy="494" r="10" fill="#1f6f3a"/><path d="M 97 494 l 4 5 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="122" y="499">Wrong-patient transfusion caught at the bedside</text>
<circle cx="102" cy="534" r="10" fill="#1f6f3a"/><path d="M 97 534 l 4 5 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="122" y="539">Contaminated-unit look-back in minutes, not days</text>
</g>

<!-- right info box -->
<rect x="650" y="330" width="486" height="256" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="676" y="368" font-size="16" font-weight="700" fill="#291c0e">Perishable stock, tracked to the hour</text>
<text x="676" y="400" font-size="14.5" font-weight="600" fill="#291c0e">Red cells 35-42 days · platelets 5 days</text>
<text x="676" y="438" font-size="13.5" fill="#4f4f4f">An excursion is flagged the moment it happens.</text>
<!-- temperature strip -->
<rect x="676" y="452" width="300" height="26" rx="6" fill="#3d6b6b"/>
<rect x="976" y="452" width="134" height="26" rx="6" fill="#8b2d2d"/>
<path d="M1043 430 l 12 20 h -24 z" fill="#8b2d2d"/><rect x="1041" y="437" width="4" height="8" fill="#ffffff"/><rect x="1041" y="446" width="4" height="3" fill="#ffffff"/>
<text x="826" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1-6 °C · in range</text>
<text x="1043" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">excursion</text>
<text x="676" y="512" font-size="13" fill="#4f4f4f">RFID temperature-logging tags prove the chain held —</text>
<text x="676" y="532" font-size="13" fill="#4f4f4f">from collection to transfusion.</text>
</svg>
