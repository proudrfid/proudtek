<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Real-time gate validation: read the UID, decide, and lock every other gate</title>
<desc id="d">Top band, the decision loop: a gate reader reads the chip UID and sends it to a validation server, which checks that the UID is on the whitelist and has not been scanned before, then returns accept — on list and first scan — or reject — clone or reused UID — almost instantly. Bottom band, multi-gate lockout: the central whitelist fans out to every gate, so a UID accepted at Gate A is locked at Gates B, C and D within a second or two, and a locally cached whitelist keeps gates running if the network drops.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">REAL-TIME GATE VALIDATION</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">Read the UID, decide in a fraction of a second, lock every other gate.</text>

<!-- reader -->
<rect x="88" y="150" width="180" height="112" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="88" y="150" width="180" height="7" rx="3.5" fill="#3d6b6b"/>
<text x="178" y="186" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Gate reader</text>
<text x="178" y="207" text-anchor="middle" font-size="12" fill="#5c5c5c">reads chip UID</text>
<rect x="150" y="222" width="56" height="26" rx="13" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<rect x="170" y="228" width="16" height="14" rx="2" fill="#d4a755"/>

<!-- arrow reader -> server -->
<text x="298" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5a3a">UID</text>
<line x1="272" y1="206" x2="316" y2="206" stroke="#291c0e" stroke-width="3"/>
<polygon points="316,200 328,206 316,212" fill="#291c0e"/>

<!-- server -->
<rect x="332" y="146" width="286" height="120" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="332" y="146" width="286" height="7" rx="3.5" fill="#3d6b6b"/>
<text x="475" y="180" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Validation server</text>
<circle cx="368" cy="208" r="9" fill="#1f6f3a"/>
<polyline points="363,208 367,212 373,204" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="386" y="213" font-size="12.5" fill="#333333">on the whitelist</text>
<circle cx="368" cy="238" r="9" fill="#1f6f3a"/>
<polyline points="363,238 367,242 373,234" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="386" y="243" font-size="12.5" fill="#333333">not scanned before</text>

<!-- branch -->
<line x1="618" y1="206" x2="640" y2="206" stroke="#291c0e" stroke-width="3"/>
<line x1="640" y1="192" x2="640" y2="256" stroke="#291c0e" stroke-width="3"/>
<line x1="640" y1="192" x2="670" y2="192" stroke="#1f6f3a" stroke-width="3"/>
<polygon points="670,186 682,192 670,198" fill="#1f6f3a"/>
<line x1="640" y1="256" x2="670" y2="256" stroke="#8b2d2d" stroke-width="3"/>
<polygon points="670,250 682,256 670,262" fill="#8b2d2d"/>

<!-- accept -->
<rect x="682" y="166" width="180" height="52" rx="10" fill="#e7f2ea" stroke="#a9cfb5" stroke-width="1.5"/>
<text x="708" y="190" font-size="15" font-weight="800" fill="#1f6f3a">ACCEPT</text>
<text x="708" y="208" font-size="12" fill="#5c5c5c">on list · first scan</text>
<!-- reject -->
<rect x="682" y="230" width="180" height="52" rx="10" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.5"/>
<text x="708" y="254" font-size="15" font-weight="800" fill="#8b2d2d">REJECT</text>
<text x="708" y="272" font-size="12" fill="#5c5c5c">clone or reused UID</text>

<text x="960" y="200" text-anchor="middle" font-size="13" fill="#5c5c5c">returns to the</text>
<text x="960" y="220" text-anchor="middle" font-size="13" fill="#5c5c5c">gate almost</text>
<text x="960" y="240" text-anchor="middle" font-size="13" fill="#5c5c5c">instantly</text>

<line x1="120" y1="322" x2="1080" y2="322" stroke="#eadfce" stroke-width="2"/>
<text x="600" y="356" text-anchor="middle" font-size="14.5" font-weight="800" fill="#6d5a3a">ONE UID, EVERY GATE — MULTI-GATE LOCKOUT</text>

<!-- central whitelist -->
<rect x="506" y="376" width="188" height="46" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="600" y="405" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2c5454">central whitelist</text>

<!-- fan lines -->
<line x1="600" y1="422" x2="200" y2="470" stroke="#b9a68e" stroke-width="2"/>
<line x1="600" y1="422" x2="460" y2="470" stroke="#b9a68e" stroke-width="2"/>
<line x1="600" y1="422" x2="740" y2="470" stroke="#b9a68e" stroke-width="2"/>
<line x1="600" y1="422" x2="1000" y2="470" stroke="#b9a68e" stroke-width="2"/>

<!-- gate A (accepted) -->
<rect x="100" y="472" width="200" height="76" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<rect x="100" y="472" width="9" height="76" rx="4" fill="#3d6b6b"/>
<text x="128" y="504" font-size="14.5" font-weight="800" fill="#291c0e">Gate A</text>
<circle cx="132" cy="524" r="8" fill="#1f6f3a"/>
<polyline points="127,524 131,528 137,520" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="148" y="529" font-size="12" fill="#1f6f3a">first scan — admitted</text>

<!-- gate B -->
<rect x="360" y="472" width="200" height="76" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.5"/>
<rect x="360" y="472" width="9" height="76" rx="4" fill="#8b2d2d"/>
<text x="388" y="504" font-size="14.5" font-weight="800" fill="#291c0e">Gate B</text>
<text x="388" y="528" font-size="12" fill="#8b2d2d">same UID · locked</text>
<!-- gate C -->
<rect x="640" y="472" width="200" height="76" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.5"/>
<rect x="640" y="472" width="9" height="76" rx="4" fill="#8b2d2d"/>
<text x="668" y="504" font-size="14.5" font-weight="800" fill="#291c0e">Gate C</text>
<text x="668" y="528" font-size="12" fill="#8b2d2d">same UID · locked</text>
<!-- gate D -->
<rect x="900" y="472" width="200" height="76" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.5"/>
<rect x="900" y="472" width="9" height="76" rx="4" fill="#8b2d2d"/>
<text x="928" y="504" font-size="14.5" font-weight="800" fill="#291c0e">Gate D</text>
<text x="928" y="528" font-size="12" fill="#8b2d2d">same UID · locked</text>

<text x="600" y="596" text-anchor="middle" font-size="14" fill="#5c5c5c">A UID accepted at Gate A is locked at every other gate within a second or two — and a cached whitelist keeps gates running if the network drops.</text>
</svg>
