<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="cfTitle cfDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="cfTitle">How tap-to-verify NFC authentication works on a cosmetic package</title>
  <desc id="cfDesc">A four-step flow. Step one: a shopper taps a phone on the package. Step two: the phone reads a small NFC chip hidden under the bottom label. Step three: the chip generates a fresh cryptographic value — a SUN/CMAC signed with a per-tag AES-128 key over a per-tap counter — appended to a unique URL. Step four: the brand's backend verifies the code and counter in under 100 milliseconds and returns an authentic-or-not verdict. A cloned tag reuses an old counter and fails on the second tap.</desc>
  <defs>
    <radialGradient id="cfBg" cx="50%" cy="12%" r="95%"><stop offset="0%" stop-color="#f8f1e2"/><stop offset="100%" stop-color="#f2ece0"/></radialGradient>
    <linearGradient id="cfGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9c084"/><stop offset="1" stop-color="#8f7d54"/></linearGradient>
    <linearGradient id="cfJar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7ee"/><stop offset="1" stop-color="#ecd3c2"/></linearGradient>
    <marker id="cfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a8a66"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#cfBg)"/>
  <text x="600" y="56" text-anchor="middle" font-size="15" letter-spacing="3" fill="#9a8a66">TAP-TO-VERIFY · ONE SECOND, ONE VERDICT</text>
  <text x="600" y="92" text-anchor="middle" font-size="29" font-weight="700" fill="#291c0e">A new secret handshake on every single tap</text>

  <g font-size="15" font-weight="700" letter-spacing="1.5" fill="#b79a52">
    <text x="150" y="168" text-anchor="middle">1 · TAP</text>
    <text x="450" y="168" text-anchor="middle">2 · HIDDEN CHIP</text>
    <text x="770" y="168" text-anchor="middle">3 · UNIQUE CODE</text>
    <text x="1055" y="168" text-anchor="middle">4 · VERDICT</text>
  </g>

  <!-- 1 phone tapping -->
  <g>
    <rect x="96" y="250" width="118" height="210" rx="22" fill="#291c0e" stroke="#9a8a66" stroke-width="2"/>
    <rect x="110" y="266" width="90" height="178" rx="12" fill="#3b2f1c"/>
    <path d="M232 292 a56 56 0 0 1 0 126" fill="none" stroke="url(#cfGold)" stroke-width="5" stroke-linecap="round"/>
    <path d="M256 276 a84 84 0 0 1 0 158" fill="none" stroke="url(#cfGold)" stroke-width="4" stroke-linecap="round" opacity=".5"/>
  </g>

  <!-- 2 jar with hidden chip -->
  <g>
    <rect x="342" y="262" width="216" height="168" rx="22" fill="url(#cfJar)" stroke="#d8b49e" stroke-width="2"/>
    <rect x="342" y="262" width="216" height="46" rx="22" fill="#f4e2d5"/>
    <rect x="362" y="392" width="176" height="30" rx="8" fill="#ebd6c9"/>
    <rect x="410" y="392" width="80" height="46" rx="6" fill="none" stroke="#a96b58" stroke-dasharray="5 4"/>
    <rect x="424" y="402" width="52" height="26" rx="4" fill="url(#cfGold)"/>
    <path d="M432 402v-8M446 402v-8M460 402v-8M432 428v8M446 428v8M460 428v8" stroke="#7d6a3f" stroke-width="2"/>
    <text x="450" y="472" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="19" fill="#a96b58">tucked under the label</text>
  </g>
  <line x1="574" y1="346" x2="628" y2="346" stroke="#9a8a66" stroke-width="2.5" marker-end="url(#cfArrow)"/>

  <!-- 3 unique code token -->
  <g>
    <rect x="644" y="288" width="252" height="116" rx="14" fill="#291c0e"/>
    <text x="770" y="332" text-anchor="middle" font-family="'SFMono-Regular', ui-monospace, Menlo, monospace" font-size="20" fill="#e4ce9e">…/v?e=A7F3C…</text>
    <text x="770" y="366" text-anchor="middle" font-size="14" letter-spacing="1.5" fill="#c9a96a">FRESH CMAC + COUNTER</text>
    <text x="770" y="446" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#6b6259">clone it once, it fails on tap two</text>
  </g>
  <line x1="912" y1="346" x2="966" y2="346" stroke="#9a8a66" stroke-width="2.5" marker-end="url(#cfArrow)"/>

  <!-- 4 verdict -->
  <g transform="translate(1055,346)">
    <circle r="58" fill="#ffffff" stroke="url(#cfGold)" stroke-width="3.5"/>
    <circle r="46" fill="none" stroke="#9a8a66" stroke-opacity=".4" stroke-dasharray="2 7"/>
    <path d="M-20 3 l13 14 25 -30" fill="none" stroke="#2d6a4f" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1055" y="452" text-anchor="middle" font-size="15" letter-spacing="1.5" fill="#2d6a4f" font-weight="600">VERIFIED &lt;100ms</text>

  <rect x="150" y="536" width="900" height="70" rx="14" fill="#fdf6ea" stroke="#e3d3b3"/>
  <text x="600" y="570" text-anchor="middle" font-size="16" fill="#4f4535">Placement reads through 0.5–1&#8202;mm of plastic. On aluminium tubes and metallised labels,</text>
  <text x="600" y="592" text-anchor="middle" font-size="16" fill="#4f4535">use ferrite-backed on-metal inlays — budget a $0.05–0.10 chip premium.</text>
</svg>
