<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five retail RFID rollout stall patterns paired with the fix for each</title>
<desc id="d">A two-column risk map with five rows. Scoping readers as count-and-go leaves handheld-only programs unable to answer whether an item is on the shelf right now; the fix is adding fixed readers at the back-room exit, fitting room and POS. POS deduction lag, when a tag is not detuned, drifts the record back to barcode-era accuracy within weeks; the fix is closed-loop deduction at POS or RFID-aware EAS gates. Claiming an 85 to 97 percent BOPIS gain with no control store is indefensible; the fix is matched-pair pilot stores. A source-tag enforcement gap leaves a long tail of vendors shipping untagged; the fix is driving vendor compliance to 95 percent or more, the Auburn threshold. Treating RFID as IT-only yields a clean install nobody operationalizes; the fix is putting store ops, loss prevention, merchandising and IT in the room from week one.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE ROLLOUTS UNDER-DELIVER — AND THE FIX</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">The stall patterns SML, Avery Dennison and Checkpoint integrators flag in retrospectives.</text>

<text x="92" y="118" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#a85a5a">THE STALL PATTERN</text>
<text x="672" y="118" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#3a6a4a">THE FIX</text>

<!-- row 1 -->
<rect x="64" y="130" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="130" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="162" font-size="15.5" font-weight="800" fill="#291c0e">Scoped &apos;count-and-go&apos;</text>
<text x="92" y="185" font-size="12.5" fill="#7a5555">Handheld-only can&apos;t answer &apos;on shelf right now?&apos;</text>
<polyline points="576,163 594,171 576,179" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="130" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="170" r="12" fill="#1f6f3a"/><polyline points="634,170 638,175 646,164" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="176" font-size="14" font-weight="700" fill="#26543a">Add fixed readers at back-room exit, fitting room, POS.</text>

<!-- row 2 -->
<rect x="64" y="220" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="220" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="252" font-size="15.5" font-weight="800" fill="#291c0e">POS deduction lag</text>
<text x="92" y="275" font-size="12.5" fill="#7a5555">Tag not detuned → record drifts back in weeks.</text>
<polyline points="576,253 594,261 576,269" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="220" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="260" r="12" fill="#1f6f3a"/><polyline points="634,260 638,265 646,254" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="266" font-size="14" font-weight="700" fill="#26543a">Closed-loop deduction at POS, or RFID-aware EAS gates.</text>

<!-- row 3 -->
<rect x="64" y="310" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="310" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="342" font-size="15.5" font-weight="800" fill="#291c0e">No matched-pair control</text>
<text x="92" y="365" font-size="12.5" fill="#7a5555">&apos;85% → 97%&apos; with no control store is indefensible.</text>
<polyline points="576,343 594,351 576,359" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="310" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="350" r="12" fill="#1f6f3a"/><polyline points="634,350 638,355 646,344" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="356" font-size="14" font-weight="700" fill="#26543a">Run matched-pair pilot stores to isolate the effect.</text>

<!-- row 4 -->
<rect x="64" y="400" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="400" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="432" font-size="15.5" font-weight="800" fill="#291c0e">Source-tag enforcement gap</text>
<text x="92" y="455" font-size="12.5" fill="#7a5555">A long tail of vendors ship un-tagged inventory.</text>
<polyline points="576,433 594,441 576,449" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="400" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="440" r="12" fill="#1f6f3a"/><polyline points="634,440 638,445 646,434" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="446" font-size="14" font-weight="700" fill="#26543a">Drive vendor compliance to 95%+ (Auburn threshold).</text>

<!-- row 5 -->
<rect x="64" y="490" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="490" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="522" font-size="15.5" font-weight="800" fill="#291c0e">Treating RFID as IT-only</text>
<text x="92" y="545" font-size="12.5" fill="#7a5555">A clean install nobody operationalizes.</text>
<polyline points="576,523 594,531 576,539" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="490" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="530" r="12" fill="#1f6f3a"/><polyline points="634,530 638,535 646,524" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="536" font-size="14" font-weight="700" fill="#26543a">Store ops, LP, merch &amp; IT in the room from week 1.</text>

<text x="600" y="612" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Every one is an operating decision, not a hardware limit.</text>
</svg>
