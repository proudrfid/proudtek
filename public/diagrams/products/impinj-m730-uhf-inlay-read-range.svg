<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Impinj M730 read range by mounting surface</title>
  <desc id="d">A horizontal bar chart of M730 UHF inlay read range by mounting surface, measured on an Impinj R700 reader at +30 dBm EIRP. A free-air paper hangtag reads 8-10 m, an apparel hangtag 6-8 m, on-metal with a foam spacer 1.5-2.5 m, and on-liquid with a foam-isolated label 1.0-2.0 m. A note records that pallet and carton portals read 98-99% on dense mixed loads, where read rate rather than distance is the metric.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">M730 READ RANGE — SET BY THE SURFACE</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Same 96-bit die; the mounting surface decides the metres. Impinj R700 at +30 dBm EIRP.</text>

  <!-- axis baseline -->
  <line x1="360" y1="150" x2="360" y2="466" stroke="#e6dfd2" stroke-width="2"/>

  <!-- Row 1: free-air hangtag 8-10 m -->
  <text x="345" y="190" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">Free-air paper hangtag</text>
  <rect x="360" y="164" width="660" height="42" rx="6" fill="#3d6b6b"/>
  <text x="1034" y="192" font-size="16" font-weight="800" fill="#2c5454">8-10 m</text>

  <!-- Row 2: apparel hangtag 6-8 m -->
  <text x="345" y="272" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">Apparel hangtag on garment</text>
  <rect x="360" y="246" width="528" height="42" rx="6" fill="#3d6b6b"/>
  <text x="902" y="274" font-size="16" font-weight="800" fill="#2c5454">6-8 m</text>

  <!-- Row 3: on-metal 1.5-2.5 m -->
  <text x="345" y="354" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">On metal (foam spacer)</text>
  <rect x="360" y="328" width="165" height="42" rx="6" fill="#4a5568"/>
  <text x="539" y="356" font-size="16" font-weight="800" fill="#4a5568">1.5-2.5 m</text>

  <!-- Row 4: on-liquid 1.0-2.0 m -->
  <text x="345" y="436" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">On liquid (foam-isolated)</text>
  <rect x="360" y="410" width="132" height="42" rx="6" fill="#4a5568"/>
  <text x="506" y="438" font-size="16" font-weight="800" fill="#4a5568">1.0-2.0 m</text>

  <!-- footnote -->
  <rect x="120" y="512" width="960" height="94" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="142" y="546" font-size="15" font-weight="700" fill="#2c5454">Dock doors are measured in read rate, not distance</text>
  <text x="142" y="571" font-size="13.5" fill="#3d6b6b">Pallet and carton portals read 98-99% on dense mixed loads — throughput, not metres, is the retail</text>
  <text x="142" y="591" font-size="13.5" fill="#3d6b6b">number that matters, and the reason M730 volume tags exist. Confirm every surface with a site pilot.</text>
</svg>
