<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The three RFID reader form factors — USB desktop, Bluetooth handheld, fixed</title>
<desc id="d">Family portrait of the three RFID reader form factors. The Homebody: a USB desktop reader on a desk reads one card held about five centimetres above it, wired to a monitor — for enrollment, check-in and encoding, at 30 to 80 dollars. The Field Agent: a Bluetooth handheld sweeps tagged cartons on a shelf and streams reads to a phone — for inventory and audits, 150 to 500 dollars, 4 to 12 hours per charge. The Bouncer: a fixed portal reader on a dock door reads a tagged pallet passing through — dock doors, gates and conveyors, 500 to over 3000 dollars, hundreds of tags a second, hands-free. A footer notes all three share the same four blocks: antenna, transceiver, processor, host interface.</desc>
