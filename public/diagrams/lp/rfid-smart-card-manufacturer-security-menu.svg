<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Proud Tek secure smart-card menu: four AES-128 platforms and one keyed, verified card program</title>
  <desc id="d">A left-to-right map. On the left, a card labelled YOUR SECURITY PROGRAM (threat model, readers, keys). In the centre, four secure-card platform lanes: MIFARE Plus EV1 / EV2 (AES-128, MIFARE Classic-compatible, SL1 to SL3, EV2 IC Common Criteria EAL5+); MIFARE DESFire EV3 (AES-128, transaction MAC, proximity check, IC Common Criteria EAL5+); Java Card dual-interface (contact plus contactless, applets and PKI, ISO/IEC 7816 with ISO/IEC 14443); and NTAG 424 DNA (AES-128 SUN authentication, tap-to-verify, ISO/IEC 14443 Type 4). Below the lanes a red legacy-risk strip warns that MIFARE Classic with the CRYPTO-1 cipher is broken and value systems should migrate to AES-128. On the right, a card reads ONE SECURE CARD PROGRAM: diversified keys, 100% verified, documented issuance.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PROUD TEK SECURE CARD MENU</text>
  <text x="600" y="99" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">One program, four secure platforms</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">AES-128 platforms to ISO/IEC 14443 — the chip sets the security ceiling.</text>

  <!-- connectors: program to lanes -->
  <path d="M258,375 L300,202" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,375 L300,320" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,375 L300,438" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,375 L300,556" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <!-- connectors: lanes to program -->
  <path d="M900,202 L946,387" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,320 L946,387" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,438 L946,387" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,556 L946,387" stroke="#3d6b6b" stroke-width="2" fill="none"/>

  <!-- program card -->
  <rect x="48" y="300" width="210" height="150" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="153" y="342" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">YOUR SECURITY</text>
  <text x="153" y="365" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">PROGRAM</text>
  <text x="153" y="400" text-anchor="middle" font-size="13" fill="#5c5c5c">threat model,</text>
  <text x="153" y="420" text-anchor="middle" font-size="13" fill="#5c5c5c">readers, keys</text>

  <!-- lane 1: MIFARE Plus EV1/EV2 -->
  <rect x="300" y="150" width="600" height="104" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="150" width="7" height="104" rx="3" fill="#c39a5f"/>
  <text x="324" y="182" font-size="18" font-weight="700" fill="#291c0e">MIFARE Plus EV1 / EV2</text>
  <text x="324" y="210" font-size="14" fill="#5c5c5c">AES-128 · MIFARE Classic-compatible · SL1 to SL3</text>
  <text x="324" y="238" font-size="14" font-weight="700" fill="#2c5454">EV2 IC: Common Criteria EAL5+</text>

  <!-- lane 2: MIFARE DESFire EV3 -->
  <rect x="300" y="268" width="600" height="104" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="268" width="7" height="104" rx="3" fill="#4a5568"/>
  <text x="324" y="300" font-size="18" font-weight="700" fill="#291c0e">MIFARE DESFire EV3</text>
  <text x="324" y="328" font-size="14" fill="#5c5c5c">AES-128 · transaction MAC · proximity check</text>
  <text x="324" y="356" font-size="14" font-weight="700" fill="#2c5454">IC: Common Criteria EAL5+</text>

  <!-- lane 3: Java Card dual-interface -->
  <rect x="300" y="386" width="600" height="104" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="386" width="7" height="104" rx="3" fill="#3d6b6b"/>
  <text x="324" y="418" font-size="18" font-weight="700" fill="#291c0e">Java Card dual-interface</text>
  <text x="324" y="446" font-size="14" fill="#5c5c5c">Contact + contactless · applets and PKI</text>
  <text x="324" y="474" font-size="14" font-weight="700" fill="#2c5454">ISO/IEC 7816 + ISO/IEC 14443</text>

  <!-- lane 4: NTAG 424 DNA -->
  <rect x="300" y="504" width="600" height="104" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="504" width="7" height="104" rx="3" fill="#6d5a3a"/>
  <text x="324" y="536" font-size="18" font-weight="700" fill="#291c0e">NTAG 424 DNA</text>
  <text x="324" y="564" font-size="14" fill="#5c5c5c">AES-128 · SUN authentication · tap-to-verify</text>
  <text x="324" y="592" font-size="14" font-weight="700" fill="#2c5454">ISO/IEC 14443 Type 4</text>

  <!-- legacy risk strip -->
  <rect x="300" y="622" width="600" height="32" rx="8" fill="#f9ece9" stroke="#8b2d2d" stroke-width="1.5"/>
  <text x="600" y="643" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">LEGACY RISK — MIFARE Classic (CRYPTO-1) is broken; migrate to AES-128.</text>

  <!-- secure program card -->
  <rect x="946" y="300" width="214" height="174" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="1053" y="338" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">ONE SECURE</text>
  <text x="1053" y="360" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">CARD PROGRAM</text>
  <text x="1053" y="394" text-anchor="middle" font-size="14" fill="#291c0e">Diversified keys</text>
  <text x="1053" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">100% verified</text>
  <text x="1053" y="446" text-anchor="middle" font-size="14" fill="#291c0e">Documented issuance</text>
</svg>
