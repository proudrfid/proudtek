<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Walmart RFID supplier qualification workflow, seven steps plus ongoing monitoring</title>
<desc id="d">A serpentine workflow. Step one, register the GS1 Company Prefix. Step two, register the item master in Item 360. Step three, sample two to three candidate inlays on the real product. Step four, integrate SGTIN-96 encoding. Step five, a 100 percent read-back verification gate. Step six, a pilot shipment verified at 99 percent or better. Step seven, production rollout stabilising above 99 percent. Then ongoing monthly review and annual recertification. The full path runs 10 to 16 weeks under Supplier Standard SS2-004 section 6.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SUPPLIER ONBOARDING · SS2-004 §6</text>
<text x="600" y="95" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">Ten to sixteen weeks, mostly queue time</text>
<text x="600" y="126" text-anchor="middle" font-size="15" fill="#4f4f4f">A defined path from GS1 prefix to full production — the delays are registrations and pilot slots, not the tech.</text>

<!-- top row L to R: 1..4 -->
<rect x="64" y="176" width="250" height="120" rx="12" fill="#ffffff" stroke="#d3dae3" stroke-width="1.6"/><rect x="64" y="176" width="250" height="8" rx="4" fill="#4a5568"/>
<circle cx="98" cy="214" r="16" fill="#4a5568"/><text x="98" y="219" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="126" y="211" font-size="14.5" font-weight="800" fill="#291c0e">GS1 prefix</text>
<text x="126" y="230" font-size="14.5" font-weight="800" fill="#291c0e">register</text>
<text x="84" y="270" font-size="12.5" fill="#5c5c5c">GS1 US · GCP active, not shared</text>

<rect x="338" y="176" width="250" height="120" rx="12" fill="#ffffff" stroke="#d3dae3" stroke-width="1.6"/><rect x="338" y="176" width="250" height="8" rx="4" fill="#4a5568"/>
<circle cx="372" cy="214" r="16" fill="#4a5568"/><text x="372" y="219" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="400" y="211" font-size="14.5" font-weight="800" fill="#291c0e">Item-master</text>
<text x="400" y="230" font-size="14.5" font-weight="800" fill="#291c0e">registration</text>
<text x="358" y="270" font-size="12.5" fill="#5c5c5c">Every GTIN into Item 360</text>

<rect x="612" y="176" width="250" height="120" rx="12" fill="#ffffff" stroke="#d3dae3" stroke-width="1.6"/><rect x="612" y="176" width="250" height="8" rx="4" fill="#4a5568"/>
<circle cx="646" cy="214" r="16" fill="#4a5568"/><text x="646" y="219" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
<text x="674" y="211" font-size="14.5" font-weight="800" fill="#291c0e">Inlay</text>
<text x="674" y="230" font-size="14.5" font-weight="800" fill="#291c0e">sampling</text>
<text x="632" y="270" font-size="12.5" fill="#5c5c5c">2–3 candidates on real product</text>

<rect x="886" y="176" width="250" height="120" rx="12" fill="#ffffff" stroke="#d3dae3" stroke-width="1.6"/><rect x="886" y="176" width="250" height="8" rx="4" fill="#4a5568"/>
<circle cx="920" cy="214" r="16" fill="#4a5568"/><text x="920" y="219" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
<text x="948" y="211" font-size="14.5" font-weight="800" fill="#291c0e">Encoding</text>
<text x="948" y="230" font-size="14.5" font-weight="800" fill="#291c0e">integration</text>
<text x="906" y="270" font-size="12.5" fill="#5c5c5c">SGTIN-96, seeded serial ranges</text>

<!-- bottom row R to L: 5..7 + ongoing -->
<rect x="886" y="360" width="250" height="120" rx="12" fill="#ffffff" stroke="#d3dae3" stroke-width="1.6"/><rect x="886" y="360" width="250" height="8" rx="4" fill="#4a5568"/>
<circle cx="920" cy="398" r="16" fill="#4a5568"/><text x="920" y="403" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">5</text>
<text x="948" y="395" font-size="14.5" font-weight="800" fill="#291c0e">Verification</text>
<text x="948" y="414" font-size="14.5" font-weight="800" fill="#291c0e">gate</text>
<text x="906" y="454" font-size="12.5" fill="#5c5c5c">100% read-back, &lt;0.5% reject</text>

<rect x="612" y="360" width="250" height="120" rx="12" fill="#ffffff" stroke="#d3dae3" stroke-width="1.6"/><rect x="612" y="360" width="250" height="8" rx="4" fill="#4a5568"/>
<circle cx="646" cy="398" r="16" fill="#4a5568"/><text x="646" y="403" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">6</text>
<text x="674" y="395" font-size="14.5" font-weight="800" fill="#291c0e">Pilot</text>
<text x="674" y="414" font-size="14.5" font-weight="800" fill="#291c0e">shipment</text>
<text x="632" y="454" font-size="12.5" fill="#5c5c5c">DC lane / sandbox, ≥99% read</text>

<rect x="338" y="360" width="250" height="120" rx="12" fill="#ffffff" stroke="#d3dae3" stroke-width="1.6"/><rect x="338" y="360" width="250" height="8" rx="4" fill="#4a5568"/>
<circle cx="372" cy="398" r="16" fill="#4a5568"/><text x="372" y="403" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">7</text>
<text x="400" y="395" font-size="14.5" font-weight="800" fill="#291c0e">Production</text>
<text x="400" y="414" font-size="14.5" font-weight="800" fill="#291c0e">rollout</text>
<text x="358" y="454" font-size="12.5" fill="#5c5c5c">Stabilise above 99%</text>

<rect x="64" y="360" width="250" height="120" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.8"/><rect x="64" y="360" width="250" height="8" rx="4" fill="#c39a5f"/>
<circle cx="98" cy="398" r="16" fill="#c39a5f"/><text x="98" y="404" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">✓</text>
<text x="126" y="395" font-size="14.5" font-weight="800" fill="#291c0e">Ongoing</text>
<text x="126" y="414" font-size="14.5" font-weight="800" fill="#291c0e">monitoring</text>
<text x="84" y="454" font-size="12.5" fill="#8a6a2f">Monthly review · annual recert</text>

