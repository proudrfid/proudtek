<circle cx="400" cy="256" r="12" fill="#ffffff" stroke="#b9b2a4" stroke-width="1.8"/>
<text x="400" y="261" text-anchor="middle" font-size="14" font-weight="800" fill="#b9b2a4">?</text>
<rect x="200" y="326" width="220" height="34" rx="17" fill="#eef1f5" stroke="#c4ccd6" stroke-width="1.5"/>
<text x="310" y="348" text-anchor="middle" font-size="14" font-weight="800" fill="#3a4453">1/3 – 1/5 of RTLS capex</text>
<circle cx="128" cy="392" r="3.5" fill="#4a5568"/>
<text x="146" y="397" font-size="14" fill="#4f4f4f">Position captured only at each crossing</text>
<circle cx="128" cy="424" r="3.5" fill="#4a5568"/>
<text x="146" y="429" font-size="14" fill="#4f4f4f">The right starting point for most sites</text>

