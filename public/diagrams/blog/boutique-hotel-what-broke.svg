<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="wbTitle wbDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="wbTitle">What broke during the rollout, and what we changed</title>
  <desc id="wbDesc">Four stumbles and their fixes. Week 2, encoder firmware mismatch: the serial-port encoder could not handle Classic 1K, caught only when the first batch failed; fix, a 340 dollar USB PC/SC encoder was overnighted and compatibility is now verified on day one. Week 4, door 14B: 30 percent read failures versus 99 percent-plus elsewhere from a metal kick-plate 8 millimetres behind the reader; fix, a Salto metal-tolerant antenna spacer and always pilot a metal-furniture door. Week 6, Mews PMS consent: a tenant-level consent for the Salto API IT had not anticipated cost a two-day delay; fix, review OAuth scopes in week 1. Week 8, guests kept swiping instead of tapping; fix, a 10-second check-in coaching line, nominal within 30 days.</desc>

  <defs>
    <radialGradient id="wbBg" cx="50%" cy="20%" r="88%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#wbBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="62" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#6d5a3a">WHAT BROKE (AND WHAT WE CHANGED)</text>

  <!-- Card 1 : WEEK 2 -->
  <rect x="60" y="96" width="530" height="210" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="84" y="118" width="94" height="30" rx="15" fill="#f0ece2" stroke="#c39a5f" stroke-width="1.5"/><text x="131" y="138" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1" fill="#6d5a3a">WEEK 2</text>
  <circle cx="544" cy="130" r="22" fill="#c39a5f"/><text x="544" y="138" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
  <text x="84" y="186" font-size="22" font-weight="800" fill="#291c0e">Encoder firmware mismatch</text>
  <text x="84" y="216" font-size="15.5" fill="#4f4f4f">The serial-port encoder couldn't handle Classic 1K —</text>
  <text x="84" y="238" font-size="15.5" fill="#4f4f4f">caught only when the first card batch failed to encode.</text>
  <line x1="84" y1="258" x2="566" y2="258" stroke="#e4c98f" stroke-width="1.5"/>
  <rect x="84" y="272" width="46" height="24" rx="12" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="1.5"/><text x="107" y="289" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f6f3a">FIX</text>
  <text x="140" y="289" font-size="15" fill="#3f6b4e">$340 USB PC/SC encoder · verify on day one.</text>

  <!-- Card 2 : WEEK 4 -->
  <rect x="610" y="96" width="530" height="210" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="634" y="118" width="94" height="30" rx="15" fill="#f0ece2" stroke="#c39a5f" stroke-width="1.5"/><text x="681" y="138" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1" fill="#6d5a3a">WEEK 4</text>
  <circle cx="1094" cy="130" r="22" fill="#3d6b6b"/><text x="1094" y="138" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
  <text x="634" y="186" font-size="22" font-weight="800" fill="#291c0e">Door 14B — the one prima donna</text>
  <text x="634" y="216" font-size="15.5" fill="#4f4f4f">30% read failures vs 99%+ elsewhere: a metal kick-plate</text>
  <text x="634" y="238" font-size="15.5" fill="#4f4f4f">8mm behind the reader was detuning the antenna.</text>
  <line x1="634" y1="258" x2="1116" y2="258" stroke="#e4c98f" stroke-width="1.5"/>
  <rect x="634" y="272" width="46" height="24" rx="12" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="1.5"/><text x="657" y="289" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f6f3a">FIX</text>
  <text x="690" y="289" font-size="15" fill="#3f6b4e">Salto metal-tolerant spacer · pilot a metal door.</text>

  <!-- Card 3 : WEEK 6 -->
  <rect x="60" y="326" width="530" height="210" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="84" y="348" width="94" height="30" rx="15" fill="#f0ece2" stroke="#c39a5f" stroke-width="1.5"/><text x="131" y="368" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1" fill="#6d5a3a">WEEK 6</text>
  <circle cx="544" cy="360" r="22" fill="#4a5568"/><text x="544" y="368" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
  <text x="84" y="416" font-size="22" font-weight="800" fill="#291c0e">Mews PMS consent flow</text>
  <text x="84" y="446" font-size="15.5" fill="#4f4f4f">The cloud PMS needed a tenant-level consent for the Salto</text>
  <text x="84" y="468" font-size="15.5" fill="#4f4f4f">API that IT hadn't anticipated — a two-day delay.</text>
  <line x1="84" y1="488" x2="566" y2="488" stroke="#e4c98f" stroke-width="1.5"/>
  <rect x="84" y="502" width="46" height="24" rx="12" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="1.5"/><text x="107" y="519" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f6f3a">FIX</text>
  <text x="140" y="519" font-size="15" fill="#3f6b4e">Review OAuth scopes in week 1 with PMS support.</text>

  <!-- Card 4 : WEEK 8 -->
  <rect x="610" y="326" width="530" height="210" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="634" y="348" width="94" height="30" rx="15" fill="#f0ece2" stroke="#c39a5f" stroke-width="1.5"/><text x="681" y="368" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1" fill="#6d5a3a">WEEK 8</text>
  <circle cx="1094" cy="360" r="22" fill="#2d6a4f"/><text x="1094" y="368" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">4</text>
  <text x="634" y="416" font-size="22" font-weight="800" fill="#291c0e">Guests kept swiping</text>
  <text x="634" y="446" font-size="15.5" fill="#4f4f4f">Two decades of muscle memory: a few guests swiped</text>
  <text x="634" y="468" font-size="15.5" fill="#4f4f4f">the card as if it were still a magstripe.</text>
  <line x1="634" y1="488" x2="1116" y2="488" stroke="#e4c98f" stroke-width="1.5"/>
  <rect x="634" y="502" width="46" height="24" rx="12" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="1.5"/><text x="657" y="519" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f6f3a">FIX</text>
  <text x="690" y="519" font-size="15" fill="#3f6b4e">A 10-second check-in line · nominal within 30 days.</text>

  <text x="600" y="576" text-anchor="middle" font-size="16.5" fill="#6d5a3a">None fatal — each now lives on a pre-flight checklist so the next site steps over it, not onto it.</text>
</svg>
