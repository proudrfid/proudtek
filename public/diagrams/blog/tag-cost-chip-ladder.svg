<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">2026 chip-only prices by vendor family, on one log scale</title>
<desc id="d">Log-scale ladder of published 2026 chip-only prices in three lanes. UHF Gen2v2 lane at 1M-plus volume: NXP UCODE 8 at $0.010-$0.018, Impinj M730 at $0.012-$0.020, Alien Higgs-9 at $0.012-$0.020. NFC NTAG lane at 10K volume: NTAG 213 at $0.08-$0.15, NTAG 216 at $0.15-$0.30, NTAG 424 DNA at $0.30-$0.60. MIFARE lane at 10K volume: MIFARE Classic 1K at $0.10-$0.20, DESFire EV3 2K at $0.50-$1.20, DESFire EV3 8K at $1.50-$2.50. A subtitle notes that antenna, conversion and encoding stack on top of every chip price.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SILICON SETS THE FLOOR</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Chip-only pricing, before anyone adds their margin</text>
<text x="600" y="124" text-anchor="middle" font-size="14" fill="#4f4f4f">UHF prices at 1M+ volume · NTAG and MIFARE at 10K — antenna, conversion and encoding stack on top.</text>

