<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five-phase ISO 14443 handshake between a hotel card and lock, tap to bolt</title>
<desc id="d">A five-phase timeline of the contactless handshake, running roughly 200 to 500 milliseconds end to end. Phase one, zero to fifty milliseconds, field activation: the chip rectifies the 13.56 MHz carrier to 3.3 volts and powers up with no battery. Phase two, fifty to one hundred fifty milliseconds, anti-collision: the lock walks the UID bit-tree to isolate a single card, and three or more stacked cards may fail. Phase three, one hundred fifty to two hundred milliseconds, select and ATS: the card returns its Answer To Select frame announcing whether it is Classic, Plus or DESFire. Phase four, two hundred to four hundred milliseconds, mutual authentication: a three-pass challenge using Crypto-1 on Classic or AES-128 on DESFire. Phase five, four hundred to four hundred fifty milliseconds, read and validate: the lock decrypts the room data, checks its secure access module and fires the bolt.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE 450 ms HANDSHAKE · TAP TO BOLT</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">What happens the instant you tap</text>
<text x="600" y="138" text-anchor="middle" font-size="16" fill="#4f4f4f">The ISO 14443 Type A sequence every MIFARE hotel lock runs.</text>

<!-- Phase 1 -->
<rect x="64" y="210" width="196" height="298" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="64" y="210" width="196" height="8" rx="4" fill="#3d6b6b"/>
<rect x="90" y="232" width="144" height="30" rx="15" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="162" y="252" text-anchor="middle" font-size="14" font-weight="800" fill="#2c5454">0–50 ms</text>
<text x="162" y="292" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Field activation</text>
<line x1="88" y1="308" x2="236" y2="308" stroke="#eadfce" stroke-width="1.4"/>
<text x="84" y="334" font-size="13" fill="#4f4f4f">Chip rectifies the</text>
<text x="84" y="355" font-size="13" fill="#4f4f4f">13.56 MHz carrier</text>
<text x="84" y="376" font-size="13" fill="#4f4f4f">to 3.3 V, no battery</text>

<!-- Phase 2 -->
<rect x="283" y="210" width="196" height="298" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="283" y="210" width="196" height="8" rx="4" fill="#3d6b6b"/>
<rect x="309" y="232" width="144" height="30" rx="15" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="381" y="252" text-anchor="middle" font-size="14" font-weight="800" fill="#2c5454">50–150 ms</text>
<text x="381" y="292" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Anti-collision</text>
<line x1="307" y1="308" x2="455" y2="308" stroke="#eadfce" stroke-width="1.4"/>
<text x="303" y="334" font-size="13" fill="#4f4f4f">Lock walks the UID</text>
<text x="303" y="355" font-size="13" fill="#4f4f4f">tree to isolate one</text>
<text x="303" y="376" font-size="13" fill="#4f4f4f">card; 3+ may fail</text>

<!-- Phase 3 -->
<rect x="502" y="210" width="196" height="298" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="502" y="210" width="196" height="8" rx="4" fill="#3d6b6b"/>
<rect x="528" y="232" width="144" height="30" rx="15" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="600" y="252" text-anchor="middle" font-size="14" font-weight="800" fill="#2c5454">150–200 ms</text>
<text x="600" y="292" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Select + ATS</text>
<line x1="526" y1="308" x2="674" y2="308" stroke="#eadfce" stroke-width="1.4"/>
<text x="522" y="334" font-size="13" fill="#4f4f4f">Card returns its ATS</text>
<text x="522" y="355" font-size="13" fill="#4f4f4f">frame — announces</text>
<text x="522" y="376" font-size="13" fill="#4f4f4f">Classic/Plus/DESFire</text>

<!-- Phase 4 (auth, gold) -->
<rect x="721" y="210" width="196" height="298" rx="14" fill="#fffaf0" stroke="#e4c98f" stroke-width="2"/>
<rect x="721" y="210" width="196" height="8" rx="4" fill="#c39a5f"/>
<rect x="747" y="232" width="144" height="30" rx="15" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<text x="819" y="252" text-anchor="middle" font-size="14" font-weight="800" fill="#8a6d34">200–400 ms</text>
<text x="819" y="292" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Mutual auth</text>
<line x1="745" y1="308" x2="893" y2="308" stroke="#eadfce" stroke-width="1.4"/>
<text x="741" y="334" font-size="13" fill="#4f4f4f">3-pass challenge:</text>
<text x="741" y="355" font-size="13" fill="#4f4f4f">Crypto-1 (Classic)</text>
<text x="741" y="376" font-size="13" fill="#4f4f4f">or AES-128 (DESFire)</text>

<!-- Phase 5 (success, green) -->
<rect x="940" y="210" width="196" height="298" rx="14" fill="#f0f6f1" stroke="#bcd8c4" stroke-width="2"/>
<rect x="940" y="210" width="196" height="8" rx="4" fill="#1f6f3a"/>
<rect x="966" y="232" width="144" height="30" rx="15" fill="#e8f2ea" stroke="#bcd8c4" stroke-width="1.3"/>
<text x="1038" y="252" text-anchor="middle" font-size="14" font-weight="800" fill="#1b5e2a">400–450 ms</text>
<text x="1038" y="292" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Read + validate</text>
<line x1="964" y1="308" x2="1112" y2="308" stroke="#d6e6da" stroke-width="1.4"/>
<text x="960" y="334" font-size="13" fill="#4f4f4f">Decrypts room data,</text>
<text x="960" y="355" font-size="13" fill="#4f4f4f">checks the SAM,</text>
<text x="960" y="376" font-size="13" font-weight="700" fill="#1b5e2a">fires the bolt</text>

<!-- chevrons between phases -->
<path d="M 267 284 L 275 290 L 267 296" fill="none" stroke="#c8bda8" stroke-width="2.6"/>
<path d="M 486 284 L 494 290 L 486 296" fill="none" stroke="#c8bda8" stroke-width="2.6"/>
<path d="M 705 284 L 713 290 L 705 296" fill="none" stroke="#c8bda8" stroke-width="2.6"/>
<path d="M 924 284 L 932 290 L 924 296" fill="none" stroke="#c8bda8" stroke-width="2.6"/>

<text x="600" y="548" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">End to end: about 200–500 ms between tap and unlock.</text>
<text x="600" y="580" text-anchor="middle" font-size="14" fill="#4f4f4f">Capture the full exchange with a Proxmark3 when intermittent failures surface.</text>
</svg>
