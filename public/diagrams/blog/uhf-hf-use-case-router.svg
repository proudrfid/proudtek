<text x="966" y="228" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">HF/NFC — no debate</text>
<text x="966" y="250" text-anchor="middle" font-size="12.5" fill="#4f4f4f">trust, taps, phones</text>
<rect x="816" y="268" width="300" height="34" rx="17" fill="#ffffff" stroke="#3d6b6b"/>
<text x="966" y="290" text-anchor="middle" font-size="13.5" fill="#291c0e">contactless payments</text>
<rect x="816" y="312" width="300" height="34" rx="17" fill="#ffffff" stroke="#3d6b6b"/>
<text x="966" y="334" text-anchor="middle" font-size="13.5" fill="#291c0e">hotel key cards &amp; badges</text>
<rect x="816" y="356" width="300" height="34" rx="17" fill="#ffffff" stroke="#3d6b6b"/>
<text x="966" y="378" text-anchor="middle" font-size="13.5" fill="#291c0e">NFC business cards</text>
<rect x="816" y="400" width="300" height="34" rx="17" fill="#ffffff" stroke="#3d6b6b"/>
<text x="966" y="422" text-anchor="middle" font-size="13.5" fill="#291c0e">Digital Product Passports</text>
<rect x="816" y="444" width="300" height="34" rx="17" fill="#ffffff" stroke="#3d6b6b"/>
<text x="966" y="466" text-anchor="middle" font-size="13.5" fill="#291c0e">smartphone interaction</text>

<text x="600" y="616" text-anchor="middle" font-size="13.5" fill="#5c5c5c">In the middle lane, write the tie-breaker requirement down before the vendor demo — it decides, not the radio.</text>
