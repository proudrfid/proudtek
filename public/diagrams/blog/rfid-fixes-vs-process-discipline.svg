<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">What RFID eliminates outright versus what still needs facility discipline</title>
<desc id="d">Two columns. RFID eliminates: optical and scratch damage because the read is RF not visual; dirt or grime over the code; UV fading of the printed barcode; and reading through a scuffed surface because the data sits on the chip. You still must: match the adhesive to the surface since steel, PVC and shrink-wrap differ; specify freezer-grade adhesive for cold-storage zones; solvent-clean and prep before applying; and remember a tag that will not bond still falls off. RFID changes the consequences of damage, not the physics of adhesion.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">AFTER ROLLOUT · WHAT CHANGES, WHAT DOESN'T</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">RFID changes the consequences of damage — not the physics of adhesion.</text>

<!-- left panel: RFID eliminates -->
<rect x="64" y="108" width="520" height="414" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="64" y="108" width="520" height="8" rx="4" fill="#3d6b6b"/>
<text x="98" y="152" font-size="16" font-weight="800" fill="#2c5454">RFID ELIMINATES</text>

<circle cx="102" cy="200" r="13" fill="#3d6b6b"/>
<polyline points="95,200 100,206 110,193" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="197" font-size="14.5" font-weight="700" fill="#291c0e">Optical &amp; scratch damage</text>
<text x="128" y="217" font-size="12.5" fill="#4f6a6a">the read is RF, not visual</text>

<circle cx="102" cy="266" r="13" fill="#3d6b6b"/>
<polyline points="95,266 100,272 110,259" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="263" font-size="14.5" font-weight="700" fill="#291c0e">Dirt or grime over the code</text>
<text x="128" y="283" font-size="12.5" fill="#4f6a6a">no line-of-sight required</text>

<circle cx="102" cy="332" r="13" fill="#3d6b6b"/>
<polyline points="95,332 100,338 110,325" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="329" font-size="14.5" font-weight="700" fill="#291c0e">UV fading of the barcode</text>
<text x="128" y="349" font-size="12.5" fill="#4f6a6a">RF read has no contrast to lose</text>

<circle cx="102" cy="398" r="13" fill="#3d6b6b"/>
<polyline points="95,398 100,404 110,391" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="395" font-size="14.5" font-weight="700" fill="#291c0e">Reading a scuffed surface</text>
<text x="128" y="415" font-size="12.5" fill="#4f6a6a">the data sits below the surface</text>

<text x="98" y="480" font-size="12.5" fill="#4f6a6a">Biggest day-to-day operational win.</text>

<!-- right panel: you still must -->
<rect x="616" y="108" width="520" height="414" rx="14" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.6"/>
<rect x="616" y="108" width="520" height="8" rx="4" fill="#c39a5f"/>
<text x="650" y="152" font-size="16" font-weight="800" fill="#8a6d34">YOU STILL MUST</text>

<circle cx="654" cy="197" r="13" fill="#c39a5f"/>
<text x="654" y="202" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">!</text>
<text x="680" y="195" font-size="14.5" font-weight="700" fill="#291c0e">Match adhesive to the surface</text>
<text x="680" y="215" font-size="12.5" fill="#6d5a3a">steel, PVC, shrink-wrap all differ</text>

<circle cx="654" cy="263" r="13" fill="#c39a5f"/>
<text x="654" y="268" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">!</text>
<text x="680" y="261" font-size="14.5" font-weight="700" fill="#291c0e">Freezer-grade adhesive for cold</text>
<text x="680" y="281" font-size="12.5" fill="#6d5a3a">apply at or above vendor temp</text>

<circle cx="654" cy="329" r="13" fill="#c39a5f"/>
<text x="654" y="334" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">!</text>
<text x="680" y="327" font-size="14.5" font-weight="700" fill="#291c0e">Solvent-clean &amp; prep first</text>
<text x="680" y="347" font-size="12.5" fill="#6d5a3a">even new racking carries dust</text>

<circle cx="654" cy="395" r="13" fill="#8b2d2d"/>
<text x="654" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">!</text>
<text x="680" y="393" font-size="14.5" font-weight="700" fill="#291c0e">A tag that won't bond falls off</text>
<text x="680" y="413" font-size="12.5" fill="#8b2d2d">and then even RF can't read it</text>

<text x="650" y="480" font-size="12.5" fill="#6d5a3a">RFID inherits the adhesion problem at install.</text>

<text x="600" y="556" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Migrate the assets RFID clearly fixes first — then bring process discipline to the rest.</text>
</svg>
