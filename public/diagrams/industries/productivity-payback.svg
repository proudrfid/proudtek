<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID productivity gains that justify the ROI</title>
<desc id="d">Item-level RFID lifts inventory accuracy from 65-75 percent to 95-99 percent, eliminates 50-80 percent of manual labor, survives 200-300 laundry wash cycles, and pays back in 6-24 months.</desc>
<defs><radialGradient id="bg" cx="50%" cy="28%" r="82%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="60" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2" fill="#6d5a3a">THE ROI HAS TO STAND ON ITS OWN</text>
<line x1="600" y1="140" x2="600" y2="560" stroke="#e6dfd2" stroke-width="2"/>
<line x1="120" y1="350" x2="1080" y2="350" stroke="#e6dfd2" stroke-width="2"/>
<text x="345" y="235" text-anchor="middle" font-size="52" font-weight="800" fill="#2d6a4f">95–99%</text><text x="345" y="269" text-anchor="middle" font-size="16.5" fill="#4f4f4f">item-level inventory</text><text x="345" y="293" text-anchor="middle" font-size="16.5" fill="#4f4f4f">accuracy (from 65–75%)</text>
<text x="855" y="235" text-anchor="middle" font-size="52" font-weight="800" fill="#1f4e79">50–80%</text><text x="855" y="269" text-anchor="middle" font-size="16.5" fill="#4f4f4f">manual sorting / desk</text><text x="855" y="293" text-anchor="middle" font-size="16.5" fill="#4f4f4f">labor eliminated</text>
<text x="345" y="470" text-anchor="middle" font-size="52" font-weight="800" fill="#6d5a3a">6–24 mo</text><text x="345" y="504" text-anchor="middle" font-size="16.5" fill="#4f4f4f">typical payback</text><text x="345" y="528" text-anchor="middle" font-size="16.5" fill="#4f4f4f">across deployments</text>
<text x="855" y="470" text-anchor="middle" font-size="52" font-weight="800" fill="#3d6b6b">200–300</text><text x="855" y="504" text-anchor="middle" font-size="16.5" fill="#4f4f4f">laundry wash cycles</text><text x="855" y="528" text-anchor="middle" font-size="16.5" fill="#4f4f4f">one tag survives</text>
<text x="600" y="632" text-anchor="middle" font-size="16" font-weight="600" fill="#4f4f4f">A productivity play — the numbers carry the business case on their own.</text>
</svg>