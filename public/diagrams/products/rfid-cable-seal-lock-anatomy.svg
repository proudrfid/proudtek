<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Cross-section anatomy of an RFID cable seal lock body</title>
  <desc id="d">Cut-away diagram of an RFID cable seal. A 1.8 mm steel cable loops through a container door hasp and enters a self-locking aluminum-alloy body. Inside the body a one-way ratchet grips the cable, a UHF RFID inlay is embedded in the housing, and the front face carries a laser-engraved serial number and QR code. A detail at lower left shows a cut cable with frayed strands, the visible tamper evidence. Callouts on the right explain the 1.8 mm galvanized or 316 stainless cable, the one-way ratchet, the embedded Monza R6-P or UCODE 9 inlay, the serial and QR panel, and the factory-locked 96-bit TID with 48-bit unique serial. Three status chips along the bottom read: locked, identity live at 2 to 4 m portals; cut, identity retired and physical evidence kept; swapped, TID mismatch flags in sub-100 ms.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID CABLE SEAL — LOCK BODY ANATOMY</text>
  <text x="600" y="100" text-anchor="middle" font-size="36" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">One-way in. No way back.</text>
  <text x="600" y="128" text-anchor="middle" font-size="14.5" fill="#4f4f4f">What locks at the click — and what breaks, visibly, on any trip backwards</text>

  <!-- hasp bar -->
  <text x="320" y="168" text-anchor="middle" font-size="12.5" fill="#5c5c5c">container door hasp / meter ring / valve handwheel</text>
  <rect x="210" y="178" width="220" height="24" rx="10" fill="#4a5568"/>

  <!-- cable loop through hasp: outer strand + braid hint -->
  <path d="M292 336 C 282 268, 262 232, 286 202 C 302 182, 338 182, 354 202 C 378 232, 358 268, 348 336" fill="none" stroke="#4a5568" stroke-width="10" stroke-linecap="round"/>
  <path d="M292 336 C 282 268, 262 232, 286 202 C 302 182, 338 182, 354 202 C 378 232, 358 268, 348 336" fill="none" stroke="#9aa5b5" stroke-width="3.5" stroke-dasharray="7 5" stroke-linecap="round"/>

  <!-- lock body cross-section -->
  <rect x="230" y="336" width="220" height="176" rx="14" fill="#e8ebf0" stroke="#4a5568" stroke-width="2.5"/>
  <!-- cable channel -->
  <rect x="280" y="336" width="24" height="120" fill="#ffffff" stroke="#cbd2dc" stroke-width="1.5"/>
  <!-- one-way ratchet teeth gripping the channel -->
  <path d="M304 356 L322 348 L322 364 Z" fill="#4a5568"/>
  <path d="M304 384 L322 376 L322 392 Z" fill="#4a5568"/>
  <path d="M304 412 L322 404 L322 420 Z" fill="#4a5568"/>
  <path d="M280 370 L260 362 L260 378 Z" fill="#4a5568"/>
  <!-- serial plate -->
  <rect x="330" y="352" width="104" height="26" rx="5" fill="#ffffff" stroke="#cbd2dc" stroke-width="1.5"/>
  <text x="382" y="370" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">0488123456</text>
  <!-- QR mini-grid -->
  <rect x="336" y="392" width="34" height="34" rx="4" fill="#ffffff" stroke="#cbd2dc" stroke-width="1.5"/>
  <rect x="341" y="397" width="8" height="8" fill="#291c0e"/>
  <rect x="357" y="397" width="8" height="8" fill="#291c0e"/>
  <rect x="341" y="413" width="8" height="8" fill="#291c0e"/>
  <rect x="355" y="411" width="6" height="6" fill="#291c0e"/>
  <text x="403" y="414" font-size="12.5" fill="#5c5c5c">QR</text>
  <!-- embedded inlay -->
  <rect x="252" y="452" width="176" height="40" rx="8" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <rect x="264" y="462" width="20" height="20" rx="3" fill="#c39a5f"/>
  <path d="M292 472 h16 l8 -8 l10 16 l8 -8 h72" fill="none" stroke="#c39a5f" stroke-width="2.5"/>

  <!-- pull arrow: one-way direction -->
  <path d="M292 522 v34" stroke="#3d6b6b" stroke-width="3.5" fill="none"/>
  <path d="M292 566 l-7 -12 h14 Z" fill="#3d6b6b"/>
  <text x="308" y="548" font-size="12.5" fill="#2c5454">pull = tighter, never back</text>

  <!-- cut-cable evidence detail -->
  <text x="120" y="546" font-size="13" font-weight="700" fill="#8b2d2d">the only exit:</text>
  <path d="M78 590 C 100 582, 120 580, 140 584" fill="none" stroke="#4a5568" stroke-width="9" stroke-linecap="round"/>
  <path d="M146 583 l26 -14 M148 586 l30 -4 M147 589 l26 10 M145 586 l20 20" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round" fill="none"/>
  <text x="196" y="596" font-size="12.5" fill="#8b2d2d">cut strands fray — evidence you cannot undo</text>

  <!-- callouts, right column -->
  <line x1="452" y1="200" x2="672" y2="180" stroke="#d9cfba" stroke-width="1.5"/>
  <text x="690" y="178" font-size="16.5" font-weight="700" fill="#291c0e">Steel cable — 1.8 mm</text>
  <text x="690" y="199" font-size="13" fill="#4f4f4f">Galvanized or 316 stainless; loop lengths 250 / 300 / 500 mm.</text>

  <line x1="452" y1="380" x2="672" y2="256" stroke="#d9cfba" stroke-width="1.5"/>
  <text x="690" y="254" font-size="16.5" font-weight="700" fill="#291c0e">One-way ratchet body</text>
  <text x="690" y="275" font-size="13" fill="#4f4f4f">Self-locking aluminum alloy. Engages with an audible click;</text>
  <text x="690" y="293" font-size="13" fill="#4f4f4f">pulling tightens the loop — reverse travel never pays out.</text>

  <line x1="452" y1="472" x2="672" y2="348" stroke="#d9cfba" stroke-width="1.5"/>
  <text x="690" y="346" font-size="16.5" font-weight="700" fill="#291c0e">Embedded UHF inlay</text>
  <text x="690" y="367" font-size="13" fill="#4f4f4f">Monza R6-P or UCODE 9 sealed inside the housing —</text>
  <text x="690" y="385" font-size="13" fill="#4f4f4f">no label to peel off, no chip to quietly swap.</text>

  <text x="690" y="438" font-size="16.5" font-weight="700" fill="#291c0e">Serial + QR panel</text>
  <text x="690" y="459" font-size="13" fill="#4f4f4f">Laser-engraved 9- or 10-digit serial plus smartphone QR</text>
  <text x="690" y="477" font-size="13" fill="#4f4f4f">check — two of the seal's three identity factors.</text>

  <text x="690" y="530" font-size="16.5" font-weight="700" fill="#291c0e">TID in silicon — the third factor</text>
  <text x="690" y="551" font-size="13" fill="#4f4f4f">96-bit Tag Identifier with 48-bit unique serial, locked at</text>
  <text x="690" y="569" font-size="13" fill="#4f4f4f">chip manufacture. Clone-proof, and checked on every read.</text>

  <!-- bottom status chips -->
  <rect x="70" y="606" width="340" height="36" rx="18" fill="#3d6b6b"/>
  <text x="240" y="629" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">LOCKED — identity live at 2–4 m portals</text>
  <rect x="428" y="606" width="360" height="36" rx="18" fill="#4a5568"/>
  <text x="608" y="629" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">CUT — identity retired, evidence kept</text>
  <rect x="806" y="606" width="324" height="36" rx="18" fill="#8b2d2d"/>
  <text x="968" y="629" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">SWAPPED — TID mismatch in sub-100 ms</text>
</svg>
