<text x="996" y="201" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1b4332">"Where's my audit trail?"</text>
<circle cx="996" cy="290" r="32" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>
<path d="M 936 392 a 60 60 0 0 1 120 0 Z" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>
<text x="996" y="432" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1" fill="#291c0e">SUSTAINABILITY OFFICER</text>
<text x="996" y="456" text-anchor="middle" font-size="13" fill="#4f4f4f">EPR reports that survive audits</text>

<circle cx="600" cy="315" r="88" fill="#f7edd6"/>
<circle cx="600" cy="315" r="64" fill="#f0e2cb"/>
<line x1="404" y1="315" x2="546" y2="315" stroke="#c39a5f" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
