<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five mechanisms by which RFID surfaces retail loss</title>
<desc id="d">Five detection mechanisms shown as cards. One, inventory-accuracy deterrent: every item tracked and counted often, so opportunistic theft drops. Two, exception-based alerts: automatic flags when specific items vanish between counts. Three, fitting-room analytics: items counted in versus out, with enter-but-not-sold flagged. Four, point-of-sale verification: items in the transaction equal items scanned, catching sweethearting. Five, receiving verification: advance-ship-notice match at the dock catches short-ships and mislabels.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE WAYS RFID SURFACES LOSS</text>
<text x="600" y="88" text-anchor="middle" font-size="15.5" fill="#4f4f4f">It prevents little; it makes loss impossible to ignore and easy to timestamp.</text>
<rect x="76" y="172" width="340" height="150" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="76" y="172" width="340" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="118" cy="230" r="19" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<text x="118" y="236" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454">1</text>
<text x="150" y="224" font-size="15.5" font-weight="800" fill="#2c5454">Accuracy deterrent</text>
<text x="106" y="268" font-size="13" fill="#291c0e">Every item tracked and counted</text>
<text x="106" y="292" font-size="13" fill="#5c5c5c">often — opportunistic theft drops.</text>
<rect x="430" y="172" width="340" height="150" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="430" y="172" width="340" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="472" cy="230" r="19" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<text x="472" y="236" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454">2</text>
<text x="504" y="224" font-size="15.5" font-weight="800" fill="#2c5454">Exception alerts</text>
<text x="460" y="268" font-size="13" fill="#291c0e">Auto-flag when specific items</text>
<text x="460" y="292" font-size="13" fill="#5c5c5c">vanish between two counts.</text>
<rect x="784" y="172" width="340" height="150" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="784" y="172" width="340" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="826" cy="230" r="19" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<text x="826" y="236" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454">3</text>
<text x="858" y="224" font-size="15.5" font-weight="800" fill="#2c5454">Fitting-room analytics</text>
<text x="814" y="268" font-size="13" fill="#291c0e">Items counted in vs out;</text>
<text x="814" y="292" font-size="13" fill="#5c5c5c">enter-but-not-sold gets flagged.</text>
<rect x="252" y="340" width="340" height="150" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="252" y="340" width="340" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="294" cy="398" r="19" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<text x="294" y="404" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454">4</text>
<text x="326" y="392" font-size="15.5" font-weight="800" fill="#2c5454">POS verification</text>
<text x="282" y="436" font-size="13" fill="#291c0e">Items in the sale = items scanned</text>
<text x="282" y="460" font-size="13" fill="#5c5c5c">— catches sweethearting.</text>
<rect x="606" y="340" width="340" height="150" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="606" y="340" width="340" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="648" cy="398" r="19" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<text x="648" y="404" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454">5</text>
<text x="680" y="392" font-size="15.5" font-weight="800" fill="#2c5454">Receiving verification</text>
<text x="636" y="436" font-size="13" fill="#291c0e">ASN match at the dock catches</text>
<text x="636" y="460" font-size="13" fill="#5c5c5c">short-ships and mislabels.</text>
<text x="600" y="608" text-anchor="middle" font-size="14.5" fill="#4f4f4f">A system that technically prevents nothing still changes the math of getting caught.</text>
</svg>
