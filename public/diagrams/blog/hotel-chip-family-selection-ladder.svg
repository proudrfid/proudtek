<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hotel chip family selection ladder</title>
<desc id="d">A ranked ladder of hotel key card chip families. MIFARE DESFire EV3 with AES-128 is the 2026 default across major lock vendors and the layer mobile-key SDKs derive from. MIFARE Plus SL3 is the AES-based fallback with slightly less multi-application flexibility. NTAG424 DNA is a boutique niche offering verifiable tap URLs via SUN, with lock support still patchy. MIFARE Ultralight C serves chain-branded volume cards as the cost-optimised tier. MIFARE Classic 1K is legacy support only, its Crypto1 cipher publicly broken since 2008, so plan the exit. LF 125 kHz cards are trivially cloneable; the real project there is lock replacement. Red marks the genuine security-risk rungs.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CHIP FAMILY SELECTION</text>
<text x="600" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">The menu, ranked</text>
<text x="600" y="124" text-anchor="middle" font-size="15" fill="#4f4f4f">Lock firmware on one side, encryption posture on the other — the intersection is short.</text>

<!-- rung 1: DESFire EV3 -->
<rect x="90" y="150" width="1020" height="66" rx="12" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
<text x="118" y="178" font-size="17" font-weight="800" fill="#ffffff">MIFARE DESFire EV3 · AES-128</text>
<text x="118" y="200" font-size="13" fill="#e8f1f1">2026 default across major lock vendors — and the key tree mobile-key SDKs derive from</text>
<rect x="972" y="167" width="112" height="32" rx="16" fill="#ffffff"/>
<text x="1028" y="188" text-anchor="middle" font-size="13" font-weight="800" fill="#234a4a">DEFAULT</text>

<!-- rung 2: Plus SL3 -->
<rect x="90" y="228" width="1020" height="60" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<text x="118" y="253" font-size="16" font-weight="700" fill="#291c0e">MIFARE Plus SL3</text>
<text x="118" y="275" font-size="13" fill="#4f4f4f">AES-based fallback for tight budgets — slightly less multi-application flexibility</text>
<rect x="972" y="242" width="112" height="32" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="1028" y="263" text-anchor="middle" font-size="13" font-weight="800" fill="#234a4a">FALLBACK</text>

<!-- rung 3: NTAG424 DNA -->
<rect x="90" y="300" width="1020" height="60" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<text x="118" y="325" font-size="16" font-weight="700" fill="#291c0e">NTAG424 DNA</text>
<text x="118" y="347" font-size="13" fill="#4f4f4f">boutique niche: verifiable tap URLs (SUN) on the guest card — lock-vendor support still patchy</text>
<rect x="972" y="314" width="112" height="32" rx="16" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.5"/>
<text x="1028" y="335" text-anchor="middle" font-size="13" font-weight="800" fill="#6d5a3a">NICHE</text>

<!-- rung 4: Ultralight C -->
<rect x="90" y="372" width="1020" height="60" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<text x="118" y="397" font-size="16" font-weight="700" fill="#291c0e">MIFARE Ultralight C</text>
<text x="118" y="419" font-size="13" fill="#4f4f4f">chain-branded volume tier — cost-optimised for large fleets, lower memory ceiling</text>
<rect x="972" y="386" width="112" height="32" rx="16" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.5"/>
<text x="1028" y="407" text-anchor="middle" font-size="13" font-weight="800" fill="#6d5a3a">VOLUME</text>

<!-- rung 5: Classic 1K -->
<rect x="90" y="444" width="1020" height="60" rx="12" fill="#ffffff" stroke="#8b2d2d" stroke-width="2"/>
<text x="118" y="469" font-size="16" font-weight="700" fill="#291c0e">MIFARE Classic 1K</text>
<text x="118" y="491" font-size="13" fill="#4f4f4f">legacy locks only — Crypto1 publicly broken since 2008; plan a DESFire migration within 2–3 years</text>
<rect x="972" y="458" width="112" height="32" rx="16" fill="#ffffff" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="1028" y="479" text-anchor="middle" font-size="13" font-weight="800" fill="#8b2d2d">LEGACY</text>

<!-- rung 6: LF -->
<rect x="90" y="516" width="1020" height="60" rx="12" fill="#fdf3f3" stroke="#8b2d2d" stroke-width="2"/>
<text x="118" y="541" font-size="16" font-weight="700" fill="#291c0e">LF 125 kHz (EM4100 · TK4100 · HID Prox)</text>
<text x="118" y="563" font-size="13" fill="#4f4f4f">trivially cloneable — if this is still in service, the real project is lock replacement</text>
<rect x="944" y="530" width="140" height="32" rx="16" fill="#8b2d2d"/>
<text x="1014" y="551" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">REPLACE LOCKS</text>

<!-- caption -->
<text x="600" y="620" text-anchor="middle" font-size="14" fill="#5c5c5c">Red means an auditor will find it before you do. Verify every rung against your lock firmware before committing.</text>
</svg>
