<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Barcode versus RFID: where the identifier lives changes what can break the read</title>
<desc id="d">A five-row capability comparison. Line-of-sight to scan: a barcode requires it, RFID does not. Reads when dirty or hidden: barcode no, RFID yes. Reads facing any direction: barcode no, RFID yes. Survives surface damage: barcode no, RFID yes. Bulk-scan hundreds at once: barcode no, RFID yes. The difference is that a barcode carries its data on the printed surface while RFID keeps it on an encapsulated chip read by radio.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BARCODE vs RFID · WHERE THE DATA LIVES</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">The identifier lives on a chip, not on a printed surface.</text>

<text x="90" y="126" font-size="13" font-weight="800" letter-spacing="1" fill="#6d5a3a">CAPABILITY</text>
<text x="672" y="126" font-size="13" font-weight="800" letter-spacing="1" fill="#8b2d2d">BARCODE</text>
<text x="952" y="126" font-size="13" font-weight="800" letter-spacing="1" fill="#2c5454">RFID</text>

<!-- row 1 -->
<rect x="64" y="140" width="1072" height="64" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<text x="90" y="179" font-size="15" font-weight="700" fill="#291c0e">Line-of-sight to scan</text>
<circle cx="656" cy="173" r="5" fill="#8b2d2d"/>
<text x="672" y="179" font-size="14.5" font-weight="700" fill="#8b2d2d">required</text>
<circle cx="936" cy="173" r="5" fill="#3d6b6b"/>
<text x="952" y="179" font-size="14.5" font-weight="700" fill="#2c5454">not needed</text>

<!-- row 2 -->
<rect x="64" y="212" width="1072" height="64" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<text x="90" y="251" font-size="15" font-weight="700" fill="#291c0e">Reads when dirty or hidden</text>
<circle cx="656" cy="245" r="5" fill="#8b2d2d"/>
<text x="672" y="251" font-size="14.5" font-weight="700" fill="#8b2d2d">no</text>
<circle cx="936" cy="245" r="5" fill="#3d6b6b"/>
<text x="952" y="251" font-size="14.5" font-weight="700" fill="#2c5454">yes</text>

<!-- row 3 -->
<rect x="64" y="284" width="1072" height="64" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<text x="90" y="323" font-size="15" font-weight="700" fill="#291c0e">Reads facing any direction</text>
<circle cx="656" cy="317" r="5" fill="#8b2d2d"/>
<text x="672" y="323" font-size="14.5" font-weight="700" fill="#8b2d2d">no</text>
<circle cx="936" cy="317" r="5" fill="#3d6b6b"/>
<text x="952" y="323" font-size="14.5" font-weight="700" fill="#2c5454">yes</text>

<!-- row 4 -->
<rect x="64" y="356" width="1072" height="64" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<text x="90" y="395" font-size="15" font-weight="700" fill="#291c0e">Survives surface damage</text>
<circle cx="656" cy="389" r="5" fill="#8b2d2d"/>
<text x="672" y="395" font-size="14.5" font-weight="700" fill="#8b2d2d">no</text>
<circle cx="936" cy="389" r="5" fill="#3d6b6b"/>
<text x="952" y="395" font-size="14.5" font-weight="700" fill="#2c5454">yes</text>

<!-- row 5 -->
<rect x="64" y="428" width="1072" height="64" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<text x="90" y="467" font-size="15" font-weight="700" fill="#291c0e">Bulk-scan hundreds at once</text>
<circle cx="656" cy="461" r="5" fill="#8b2d2d"/>
<text x="672" y="467" font-size="14.5" font-weight="700" fill="#8b2d2d">no</text>
<circle cx="936" cy="461" r="5" fill="#3d6b6b"/>
<text x="952" y="467" font-size="14.5" font-weight="700" fill="#2c5454">yes</text>

<text x="600" y="540" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Everything that breaks a barcode is an attack on its printed surface — which is exactly what RFID stops using.</text>
</svg>
