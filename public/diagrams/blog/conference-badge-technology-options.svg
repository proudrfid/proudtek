<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five conference badge technologies compared by chip, read method and cost</title>
<desc id="d">Five rows compare conference badge options. NFC PVC badge card: CR80 PVC with NTAG213 or MIFARE Ultralight, tap read, 0.40 to 0.80 dollars. NFC paper badge: printed inlay in a holder, tap read, 0.15 to 0.30 dollars. UHF RFID badge: passive long-range inlay auto-detected at doors. NFC plus UHF dual-chip: tap interactions plus passive analytics, 0.60 to 1.20 dollars. E-ink smart badge: reusable updatable display with NFC, tap read.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BADGE TECHNOLOGY OPTIONS</text>
<text x="600" y="86" text-anchor="middle" font-size="15" fill="#4f4f4f">Five ways to put a chip on a lanyard — pick by cost, durability and read range.</text>
<!-- column labels -->
<text x="92" y="128" text-anchor="start" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#6d5a3a">BADGE TYPE</text>
<text x="820" y="128" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#6d5a3a">READ METHOD</text>
<text x="1025" y="128" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#6d5a3a">COST / NOTE</text>
<!-- row 1 -->
<rect x="60" y="146" width="1080" height="82" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="60" y="146" width="6" height="82" rx="3" fill="#3d6b6b"/>
<text x="92" y="182" text-anchor="start" font-size="17" font-weight="800" fill="#291c0e">NFC PVC badge card</text>
<text x="92" y="208" text-anchor="start" font-size="13.5" fill="#5c5c5c">CR80 PVC · NTAG213 / MIFARE Ultralight · printed, lanyard-punched</text>
<rect x="762" y="171" width="116" height="32" rx="16" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="820" y="192" text-anchor="middle" font-size="13" font-weight="800" fill="#6d5a3a">TAP</text>
<rect x="928" y="171" width="194" height="32" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="1025" y="192" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">$0.40–0.80</text>
<!-- row 2 -->
<rect x="60" y="240" width="1080" height="82" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="60" y="240" width="6" height="82" rx="3" fill="#c39a5f"/>
<text x="92" y="276" text-anchor="start" font-size="17" font-weight="800" fill="#291c0e">NFC paper badge</text>
<text x="92" y="302" text-anchor="start" font-size="13.5" fill="#5c5c5c">Printed inlay in a standard holder · lightweight, single-day</text>
<rect x="762" y="265" width="116" height="32" rx="16" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="820" y="286" text-anchor="middle" font-size="13" font-weight="800" fill="#6d5a3a">TAP</text>
<rect x="928" y="265" width="194" height="32" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="1025" y="286" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">$0.15–0.30</text>
<!-- row 3 -->
<rect x="60" y="334" width="1080" height="82" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="60" y="334" width="6" height="82" rx="3" fill="#4a5568"/>
<text x="92" y="370" text-anchor="start" font-size="17" font-weight="800" fill="#291c0e">UHF RFID badge</text>
<text x="92" y="396" text-anchor="start" font-size="13.5" fill="#5c5c5c">Passive long-range inlay · auto-detected at room entrances</text>
<rect x="748" y="359" width="144" height="32" rx="16" fill="#eef2f5" stroke="#bcc6d4" stroke-width="1.2"/>
<text x="820" y="380" text-anchor="middle" font-size="13" font-weight="800" fill="#3a4557">PASSIVE</text>
