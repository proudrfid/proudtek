<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Why a metal keyfob needs a ferrite layer — anti-metal antenna construction</title>
  <desc id="d">Two-panel comparison. Left panel, the failure case: a bare RFID inlay with a free-air antenna tune sits directly against the metal shell of a keyfob. The reader field at 13.56 MHz is blocked — the shell shifts the antenna resonance off 13.56 MHz and absorbs field power, so tap range is effectively zero and the tag is silent. Physics per STMicroelectronics AN2866 and Texas Instruments HF Antenna Design Notes section 4.3. Right panel, the production stack: an engraved metal upper shell, the HF or LF inlay with antenna and chip, a ferrite sheet 0.3-0.5 mm thick, and a laser-welded metal lower shell. The ferrite gives the magnetic flux a return path that bypasses the metal, and the anti-metal antenna is tuned in its final in-shell position. Outcome: HF 13.56 MHz tap range 0-30 mm and LF 125 kHz tap range 0-40 mm, versus 0-50 mm for the same chip in a non-metal shell.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="fluxArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d6b6b"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ON-METAL ANTENNA ENGINEERING</text>
  <text x="600" y="96" text-anchor="middle" font-size="33" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Why a metal keyfob needs a ferrite layer</text>

  <!-- ── LEFT: failure case ─────────────────────────────────────────── -->
  <rect x="52" y="126" width="532" height="430" rx="16" fill="#fdf4f2" stroke="#ddc2bc" stroke-width="1.5"/>
  <text x="318" y="162" text-anchor="middle" font-size="18" font-weight="700" fill="#8b2d2d">Bare inlay against the shell</text>
  <text x="318" y="184" text-anchor="middle" font-size="12.5" fill="#5c5c5c">free-air antenna tune, no ferrite</text>

  <text x="318" y="208" text-anchor="middle" font-size="12.5" fill="#2c5454">reader field — 13.56 MHz</text>
  <rect x="132" y="216" width="372" height="16" rx="5" fill="#3d6b6b"/>
  <line x1="214" y1="240" x2="214" y2="286" stroke="#3d6b6b" stroke-width="2" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="318" y1="240" x2="318" y2="286" stroke="#3d6b6b" stroke-width="2" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="422" y1="240" x2="422" y2="286" stroke="#3d6b6b" stroke-width="2" stroke-dasharray="4 5" opacity="0.55"/>
  <text x="318" y="274" text-anchor="middle" font-size="26" font-weight="700" fill="#8b2d2d">✕</text>

  <rect x="200" y="296" width="236" height="26" rx="6" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="318" y="314" text-anchor="middle" font-size="12.5" fill="#6d5a3a">inlay antenna + chip</text>
  <rect x="132" y="330" width="372" height="48" rx="8" fill="#4a5568"/>
  <text x="318" y="359" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.5" fill="#ffffff">METAL SHELL</text>

  <text x="318" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="#8b2d2d">✕ resonance shifts off 13.56 MHz</text>
  <text x="318" y="444" text-anchor="middle" font-size="14" font-weight="600" fill="#8b2d2d">✕ shell absorbs field power</text>
  <rect x="140" y="464" width="356" height="42" rx="10" fill="#f6e4e1" stroke="#8b2d2d" stroke-width="1.5"/>
  <text x="318" y="490" text-anchor="middle" font-size="14" font-weight="700" fill="#8b2d2d">tap range ≈ zero — tag is silent</text>
  <text x="318" y="536" text-anchor="middle" font-size="12.5" fill="#5c5c5c">ST AN2866 · TI HF Antenna Design Notes §4.3</text>

  <!-- ── RIGHT: production stack ────────────────────────────────────── -->
  <rect x="616" y="126" width="532" height="430" rx="16" fill="#eef5f5" stroke="#c2d6d6" stroke-width="1.5"/>
  <text x="882" y="162" text-anchor="middle" font-size="18" font-weight="700" fill="#234a4a">Production stack — ferrite-decoupled</text>
  <text x="882" y="184" text-anchor="middle" font-size="12.5" fill="#5c5c5c">anti-metal antenna, tuned in-shell</text>

  <rect x="660" y="212" width="280" height="36" rx="8" fill="#4a5568"/>
  <text x="800" y="235" text-anchor="middle" font-size="12.5" fill="#ffffff">engraved upper shell</text>
  <rect x="660" y="262" width="280" height="28" rx="6" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="800" y="281" text-anchor="middle" font-size="12.5" fill="#6d5a3a">HF / LF inlay — antenna + chip</text>
  <rect x="660" y="304" width="280" height="24" rx="5" fill="#37404e" stroke="#c39a5f" stroke-width="2"/>
  <text x="800" y="321" text-anchor="middle" font-size="12.5" fill="#ffffff">ferrite sheet 0.3-0.5 mm</text>
  <rect x="660" y="342" width="280" height="44" rx="8" fill="#4a5568"/>
  <text x="800" y="369" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.5" fill="#ffffff">METAL LOWER SHELL</text>

  <path d="M 660 272 C 618 280 618 330 656 320" fill="none" stroke="#3d6b6b" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#fluxArrow)"/>

  <line x1="940" y1="228" x2="972" y2="228" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="980" y="224" font-size="12.5" fill="#4f4f4f">laser engraving</text>
  <text x="980" y="241" font-size="12.5" fill="#4f4f4f">serial + logo</text>
  <line x1="940" y1="316" x2="972" y2="316" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="980" y="312" font-size="12.5" fill="#4f4f4f">flux return path</text>
  <text x="980" y="329" font-size="12.5" fill="#4f4f4f">bypasses the shell</text>
  <line x1="940" y1="364" x2="972" y2="364" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="980" y="360" font-size="12.5" fill="#4f4f4f">laser-welded</text>
  <text x="980" y="377" font-size="12.5" fill="#4f4f4f">seam</text>

  <rect x="660" y="428" width="225" height="48" rx="10" fill="#e8f1ea" stroke="#1f6f3a" stroke-width="1.5"/>
  <text x="772" y="448" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6f3a">HF 13.56 MHz</text>
  <text x="772" y="467" text-anchor="middle" font-size="13" fill="#1f6f3a">tap 0-30 mm</text>
  <rect x="905" y="428" width="225" height="48" rx="10" fill="#e8f1ea" stroke="#1f6f3a" stroke-width="1.5"/>
  <text x="1017" y="448" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6f3a">LF 125 kHz</text>
  <text x="1017" y="467" text-anchor="middle" font-size="13" fill="#1f6f3a">tap 0-40 mm</text>
  <text x="882" y="508" text-anchor="middle" font-size="12.5" fill="#5c5c5c">non-metal shell reference: 0-50 mm tap</text>

  <text x="600" y="606" text-anchor="middle" font-size="14" fill="#4f4f4f">The ferrite gives the flux a return path that skips the metal — the antenna keeps its tune inside the shell.</text>
</svg>
