<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Read distance on metal, by sticker size</title>
  <desc id="d">Ladder of on-metal read distances: 13 by 13 mm reads at 1-2 cm on phones and 2-3 cm on readers; 20 by 20 mm at 2-3 cm phone and 3-4 cm reader; 25 by 25 mm at 2-4 cm phone and up to 5 cm reader. Chemical resistance covers isopropyl alcohol and common workshop fluids across steel, aluminium, stainless and powder-coated surfaces.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">On metal, size buys centimetres</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Phone and fixed-reader distances, measured on the metal itself</text>
  <g transform="translate(80,160)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="120" width="300" height="150" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <rect x="24" y="144" width="46" height="46" rx="4" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2"/>
    <text x="86" y="168" font-family="Georgia, serif" font-size="16" fill="#291c0e">13 x 13 mm</text>
    <text x="24" y="222" font-size="13" fill="#2c5454">phone 1-2 cm · reader 2-3 cm</text>
    <text x="24" y="246" font-size="13" fill="#6d5a3a">small electronic enclosures</text>
    <rect x="360" y="70" width="300" height="200" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <rect x="384" y="94" width="64" height="64" rx="4" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2"/>
    <text x="462" y="122" font-family="Georgia, serif" font-size="16" fill="#291c0e">20 x 20 mm</text>
    <text x="384" y="192" font-size="13" fill="#2c5454">phone 2-3 cm · reader 3-4 cm</text>
    <text x="384" y="216" font-size="13" fill="#6d5a3a">standard small equipment</text>
    <text x="384" y="240" font-size="13" fill="#6d5a3a">the volume workhorse</text>
    <rect x="720" y="20" width="300" height="250" rx="12" fill="#eef2f0" stroke="#2c5454" stroke-width="2.5"/>
    <rect x="744" y="44" width="80" height="80" rx="4" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
    <text x="838" y="80" font-family="Georgia, serif" font-size="16" fill="#2c5454">25 x 25 mm</text>
    <text x="744" y="158" font-size="13" fill="#2c5454">phone 2-4 cm · reader up to 5 cm</text>
    <text x="744" y="182" font-size="13" fill="#2c5454">racks, machinery, large assets</text>
    <text x="744" y="206" font-size="13" fill="#6d5a3a">headroom for gloved hands</text>
  </g>
  <g transform="translate(80,470)">
    <rect x="0" y="0" width="1040" height="90" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="36" font-family="Georgia, serif" font-size="16" fill="#291c0e">Survives the workshop</text>
    <text x="24" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">Steel · aluminium · stainless · galvanised · powder-coated — resists isopropyl alcohol and common workshop fluids</text>
  </g>
</svg>
