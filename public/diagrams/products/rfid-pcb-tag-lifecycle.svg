<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">IT-asset lifecycle of an RFID PCB tag on one permalocked EPC</title>
  <desc id="d">A four-step IT-asset lifecycle: commission by encoding and permalocking the EPC and mapping it to the CMDB CI with the factory TID read-only per ISO 18000-63; deploy the tag flat on the server or switch chassis with rack moves auto-logged to DCIM; audit with a handheld UHF sweep reading a full 42U rack in 30-60 seconds at 99 percent-plus capture that publishes an EPCIS 2.0 event; and decommission by logging a retirement event to the CMDB. A banner notes one audit feed serves ISO/IEC 19770-1, NIST SP 800-53 CM-8, CIS Control 1 and PCI DSS v4.0 Req. 9.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE EPC ACROSS THE ASSET LIFECYCLE</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Commissioned once, then swept in seconds at every audit — no re-labelling</text>

  <rect x="70" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="170" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="187" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1 · COMMISSION</text>
  <text x="187" y="248" text-anchor="middle" font-size="14" fill="#291c0e">EPC encoded and</text>
  <text x="187" y="272" text-anchor="middle" font-size="14" fill="#291c0e">permalocked</text>
  <text x="187" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">factory TID read-only</text>
  <text x="187" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">per ISO 18000-63</text>

  <rect x="345" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="345" y="170" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="462" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2 · DEPLOY</text>
  <text x="462" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Flat on the server /</text>
  <text x="462" y="272" text-anchor="middle" font-size="14" fill="#291c0e">switch chassis</text>
  <text x="462" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">rack moves auto-log</text>
  <text x="462" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">to DCIM</text>

  <rect x="620" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="620" y="170" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="737" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3 · AUDIT</text>
  <text x="737" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Handheld sweep —</text>
  <text x="737" y="272" text-anchor="middle" font-size="14" fill="#291c0e">a full 42U rack</text>
  <text x="737" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">30-60 seconds,</text>
  <text x="737" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">99 %+ capture</text>

  <rect x="895" y="170" width="235" height="205" rx="14" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <rect x="895" y="170" width="235" height="42" rx="14" fill="#1f6f3a"/>
  <text x="1012" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4 · DECOMMISSION</text>
  <text x="1012" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Retire event closes</text>
  <text x="1012" y="272" text-anchor="middle" font-size="14" fill="#291c0e">the chain of custody</text>
  <text x="1012" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">one more EPCIS 2.0</text>
  <text x="1012" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">event to the CMDB</text>

  <polygon points="310,267 334,267 334,261 346,273 334,285 334,279 310,279" fill="#4a5568"/>
  <polygon points="584,267 606,267 606,261 618,273 606,285 606,279 584,279" fill="#4a5568"/>
  <polygon points="859,267 881,267 881,261 893,273 881,285 881,279 859,279" fill="#4a5568"/>

  <rect x="70" y="418" width="1060" height="66" rx="12" fill="#eef5ee" stroke="#9ec4a6" stroke-width="1.5"/>
  <text x="90" y="446" font-size="15" font-weight="700" fill="#1f6f3a">One audit feed, every framework</text>
  <text x="90" y="468" font-size="13.5" fill="#234a4a">ISO/IEC 19770-1 · NIST SP 800-53 CM-8 · CIS Control 1 · PCI DSS v4.0 Req. 9 — all read the same EPCIS 2.0 event stream.</text>

  <text x="600" y="540" text-anchor="middle" font-size="13.5" fill="#5c5c5c">≤ ±0.5 dB read-range variance keeps the 99 %+ capture honest across a 10,000-unit estate.</text>
</svg>
