<text x="92" y="462" font-size="12" fill="#5c5c5c">on-metal UHF · Steam / Survivor</text>
<rect x="92" y="470" width="200" height="20" rx="10" fill="#eef1f4" stroke="#c3ccd8" stroke-width="1.2"/>
<text x="192" y="484" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4456">IP68/IP69K · −40 to +85 °C</text>
<text x="404" y="444" font-size="12.5" fill="#333333">Steam cleaning, autoclave-class sterilization, freeze–thaw cycling;</text>
<text x="404" y="466" font-size="12.5" fill="#333333">food &amp; beverage CIP, healthcare textile, rail asset tracking.</text>

