<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="memTitle memDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="memTitle">EM4100 vs T5577 memory model</title>
  <desc id="memDesc">Side-by-side memory maps. EM4100 is a fixed 64-bit frame: a 9-bit header, a 40-bit unique ID (10 hex characters, laser-trimmed and immutable), 14 parity bits and 1 stop bit. T5577 is a 330-bit EEPROM organised as seven 32-bit blocks plus a configuration block: block 0 holds the modulator configuration (which protocol to emulate, bit rate, encoding), blocks 1 to 6 hold the ID data padded to the emulated format, and block 7 is an optional password lock. Blocks are re-writable 100,000-plus times, so the same silicon can be re-encoded in the field.</desc>

  <defs>
    <radialGradient id="memGlow" cx="50%" cy="24%" r="88%">
      <stop offset="0%" stop-color="#f9ecd2"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#memGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="66" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2.5" fill="#6d5a3a">WHAT'S ACTUALLY ON EACH CHIP · THE MEMORY MAP</text>
  <text x="600" y="96" text-anchor="middle" font-size="16" fill="#4a5568">EM4100 hands you a sealed ID card. T5577 hands you a notebook.</text>

  <!-- ===================== EM4100 · 64-bit frame ===================== -->
  <g>
    <rect x="64" y="132" width="516" height="452" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <path d="M64 148 a16 16 0 0 1 16 -16 h484 a16 16 0 0 1 16 16 v38 h-516 z" fill="#4a5568"/>
    <text x="322" y="173" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">EM4100 · 64-BIT FRAME · READ-ONLY</text>

    <text x="322" y="222" text-anchor="middle" font-size="13.5" fill="#6d5a3a">One fixed frame. No blocks, no config, no crypto.</text>

    <!-- segmented frame bar -->
    <g>
      <rect x="96" y="250" width="63" height="52" fill="#cdd5de" stroke="#ffffff" stroke-width="2"/>
      <rect x="159" y="250" width="280" height="52" fill="#c39a5f" stroke="#ffffff" stroke-width="2"/>
      <rect x="439" y="250" width="98" height="52" fill="#cdd5de" stroke="#ffffff" stroke-width="2"/>
      <rect x="537" y="250" width="7" height="52" fill="#9fb0c0" stroke="#ffffff" stroke-width="1.5"/>
      <text x="299" y="281" text-anchor="middle" font-size="15" font-weight="800" fill="#3a2c17">40-bit UNIQUE ID</text>
      <text x="127" y="322" text-anchor="middle" font-size="10.5" fill="#7a8690">9 hdr</text>
      <text x="488" y="322" text-anchor="middle" font-size="10.5" fill="#7a8690">14 parity</text>
      <text x="551" y="322" text-anchor="start" font-size="10.5" fill="#7a8690">1 stop</text>
    </g>

    <!-- legend -->
    <g font-size="13">
      <rect x="96" y="352" width="18" height="18" rx="3" fill="#c39a5f"/>
      <text x="124" y="366" fill="#291c0e" font-weight="700">40-bit UID —</text>
      <text x="124" y="386" fill="#6d5a3a" font-size="12.5">the 10-hex number every reader sees. Laser-</text>
      <text x="124" y="404" fill="#6d5a3a" font-size="12.5">trimmed at the factory and immutable.</text>
      <rect x="96" y="424" width="18" height="18" rx="3" fill="#cdd5de"/>
      <text x="124" y="438" fill="#291c0e" font-weight="700">24 framing bits —</text>
      <text x="124" y="458" fill="#6d5a3a" font-size="12.5">header, parity and stop. Housekeeping, not</text>
      <text x="124" y="476" fill="#6d5a3a" font-size="12.5">payload.</text>
    </g>

    <!-- padlock note -->
    <g transform="translate(96,506)">
      <rect x="0" y="14" width="30" height="24" rx="5" fill="#4a5568"/>
      <path d="M5 14 v-6 a10 10 0 0 1 20 0 v6" fill="none" stroke="#4a5568" stroke-width="4"/>
      <rect x="13" y="22" width="4" height="8" rx="2" fill="#f9ecd2"/>
    </g>
    <text x="140" y="524" font-size="13" font-weight="700" fill="#8b2d2d">Zero write cycles.</text>
    <text x="140" y="544" font-size="12.5" fill="#6d5a3a">What ships is what you keep — for the life of the card.</text>
  </g>

  <!-- ===================== T5577 · 330-bit EEPROM ===================== -->
  <g>
    <rect x="620" y="132" width="516" height="452" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <path d="M620 148 a16 16 0 0 1 16 -16 h484 a16 16 0 0 1 16 16 v38 h-516 z" fill="#3d6b6b"/>
    <text x="878" y="173" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">T5577 · 330-BIT EEPROM · REWRITABLE</text>

    <text x="878" y="222" text-anchor="middle" font-size="13.5" fill="#6d5a3a">Seven 32-bit blocks + a config block you control.</text>

    <!-- block stack -->
    <g font-size="12.5">
      <!-- Block 0 config -->
      <rect x="652" y="240" width="452" height="32" rx="7" fill="#3d6b6b"/>
      <text x="668" y="261" font-size="11" font-weight="800" letter-spacing="0.5" fill="#ffffff">BLOCK 0</text>
      <text x="1088" y="261" text-anchor="end" font-weight="700" fill="#ffffff">Config · modulator — protocol, bit rate, encoding</text>
      <!-- Blocks 1-6 data -->
      <rect x="652" y="278" width="452" height="30" rx="7" fill="#ffffff" stroke="#e9dfca" stroke-width="1.5"/>
      <text x="668" y="298" font-size="11" font-weight="800" letter-spacing="0.5" fill="#8a7a5a">BLOCK 1</text>
      <text x="1088" y="298" text-anchor="end" fill="#291c0e">ID data — the emulated UID lands here</text>
      <rect x="652" y="313" width="452" height="30" rx="7" fill="#ffffff" stroke="#e9dfca" stroke-width="1.5"/>
      <text x="668" y="333" font-size="11" font-weight="800" letter-spacing="0.5" fill="#8a7a5a">BLOCK 2</text>
      <text x="1088" y="333" text-anchor="end" fill="#291c0e">ID data (continued)</text>
      <rect x="652" y="348" width="452" height="30" rx="7" fill="#ffffff" stroke="#e9dfca" stroke-width="1.5"/>
      <text x="668" y="368" font-size="11" font-weight="800" letter-spacing="0.5" fill="#8a7a5a">BLOCKS 3–6</text>
      <text x="1088" y="368" text-anchor="end" fill="#291c0e">ID / user data — padded to the format</text>
      <!-- Block 7 password -->
      <rect x="652" y="383" width="452" height="30" rx="7" fill="#efe7dc" stroke="#d9cdb8" stroke-width="1.5"/>
      <text x="668" y="403" font-size="11" font-weight="800" letter-spacing="0.5" fill="#8a7a5a">BLOCK 7</text>
      <text x="1088" y="403" text-anchor="end" fill="#6d5a3a">Password — optional 32-bit lock</text>
    </g>

    <!-- callout -->
    <rect x="652" y="428" width="452" height="60" rx="10" fill="#eef4f4" stroke="#bcdada" stroke-width="1.5"/>
    <text x="672" y="453" font-size="13" font-weight="700" fill="#2c5454">Block 0 is the costume department.</text>
    <text x="672" y="475" font-size="12.5" fill="#3d6b6b">Rewrite it → the same chip becomes EM4100, HID Prox, Indala or AWID.</text>

    <!-- pencil note -->
    <g transform="translate(652,508)">
      <rect x="2" y="24" width="26" height="8" rx="2" fill="#eef4f4" stroke="#3d6b6b" stroke-width="2"/>
      <path d="M4 4 l10 0 l14 14 l-10 10 l-14 -14 z" fill="#3d6b6b"/>
      <path d="M14 20 l4 4 -6 2 z" fill="#291c0e"/>
    </g>
    <text x="690" y="524" font-size="13" font-weight="700" fill="#1f6f3a">100,000+ write cycles.</text>
    <text x="690" y="544" font-size="12.5" fill="#6d5a3a">Re-encode it in the field as often as the policy demands.</text>
  </g>

  <text x="600" y="614" text-anchor="middle" font-size="15" fill="#4a5568">Both are 125 kHz ASK/Manchester on the air — everything above hides behind the same antenna and the same reader.</text>
</svg>
