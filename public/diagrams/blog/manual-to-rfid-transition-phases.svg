<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Three-phase transition from manual counting to RFID cycle counts</title>
<desc id="d">Three panels connected by arrows. Phase 1, Tag: high-value and fast-moving SKUs get UHF RFID labels applied at source or your receiving dock — tagged at the source. Phase 2, Equip and integrate: handheld UHF readers for counters, with counts flowing to the WMS via middleware or API — reads land in the WMS. Phase 3, Perpetual: zones scanned on a rotating weekly schedule with no annual wall-to-wall physical count — counts every week. Each phase stands alone, so a stalled pilot never strands the whole floor.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MANUAL → RFID · THREE-PHASE ROLLOUT</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Tag what matters, hand your counters readers, then change the cadence.</text>

<rect x="88" y="150" width="300" height="316" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="88" y="150" width="300" height="8" rx="4" fill="#4a5568"/>
<circle cx="238" cy="212" r="28" fill="#4a5568"/>
<text x="238" y="222" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">1</text>
<text x="238" y="268" text-anchor="middle" font-size="15.5" font-weight="800" letter-spacing="0.5" fill="#4a5568">TAG</text>
<text x="238" y="312" text-anchor="middle" font-size="13.5" fill="#4f4f4f">High-value &amp; fast-moving SKUs</text>
<text x="238" y="336" text-anchor="middle" font-size="13.5" fill="#4f4f4f">get UHF RFID labels applied</text>
<text x="238" y="360" text-anchor="middle" font-size="13.5" fill="#4f4f4f">at source or your receiving dock</text>
<rect x="120" y="402" width="236" height="38" rx="19" fill="#eef0f3" stroke="#d5dae2" stroke-width="1.3"/>
<text x="238" y="427" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">tagged at the source</text>

<rect x="450" y="150" width="300" height="316" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="450" y="150" width="300" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="600" cy="212" r="28" fill="#3d6b6b"/>
<text x="600" y="222" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">2</text>
<text x="600" y="268" text-anchor="middle" font-size="15.5" font-weight="800" letter-spacing="0.5" fill="#2c5454">EQUIP + INTEGRATE</text>
<text x="600" y="312" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Handheld UHF readers for</text>
<text x="600" y="336" text-anchor="middle" font-size="13.5" fill="#4f4f4f">counters; counts flow to the</text>
<text x="600" y="360" text-anchor="middle" font-size="13.5" fill="#4f4f4f">WMS via middleware or API</text>
<rect x="482" y="402" width="236" height="38" rx="19" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="600" y="427" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">reads land in the WMS</text>

<rect x="812" y="150" width="300" height="316" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<rect x="812" y="150" width="300" height="8" rx="4" fill="#1f6f3a"/>
<circle cx="962" cy="212" r="28" fill="#1f6f3a"/>
<text x="962" y="222" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">3</text>
<text x="962" y="268" text-anchor="middle" font-size="15.5" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">PERPETUAL</text>
<text x="962" y="312" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Zones scanned on a rotating</text>
<text x="962" y="336" text-anchor="middle" font-size="13.5" fill="#4f4f4f">weekly schedule — no annual</text>
<text x="962" y="360" text-anchor="middle" font-size="13.5" fill="#4f4f4f">wall-to-wall physical count</text>
<rect x="844" y="402" width="236" height="38" rx="19" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.3"/>
<text x="962" y="427" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">counts every week</text>

<line x1="398" y1="230" x2="440" y2="230" stroke="#291c0e" stroke-width="3.5"/>
<polygon points="440,223 458,230 440,237" fill="#291c0e"/>
<line x1="760" y1="230" x2="802" y2="230" stroke="#291c0e" stroke-width="3.5"/>
<polygon points="802,223 820,230 802,237" fill="#291c0e"/>

<text x="600" y="524" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Each phase stands alone, so a stalled pilot never strands the whole floor.</text>
</svg>
