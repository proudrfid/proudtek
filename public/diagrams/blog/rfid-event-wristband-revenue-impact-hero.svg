<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Why cashless RFID wristbands lift event revenue</title>
<desc id="d">A before-and-after of event payments. On the left, cash and card take 15 to 30 seconds per sale and create queues that get abandoned. On the right, RFID tap-to-pay takes under 2 seconds, shortening queues so guests buy more rounds. The result band shows a 15 to 30 percent rise in per-attendee spend, transactions per guest of 1.5 to 2 times, vendor throughput 2 to 3 times higher, and 5 to 15 percent of preloaded credit left unredeemed.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CASHLESS EVENT REVENUE</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Delete the slowest line on site, and paying stops feeling like paying.</text>
<rect x="88" y="150" width="470" height="250" rx="14" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.8"/>
<rect x="88" y="150" width="470" height="8" rx="4" fill="#4a5568"/>
<text x="323" y="198" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#4a5568">CASH &amp; CARD</text>
<text x="323" y="222" text-anchor="middle" font-size="13" fill="#8a8a8a">the old way</text>
<text x="323" y="290" text-anchor="middle" font-size="38" font-weight="800" fill="#4a5568">15–30 sec</text>
<text x="323" y="318" text-anchor="middle" font-size="13.5" fill="#5c5c5c">per cash transaction</text>
<text x="323" y="354" text-anchor="middle" font-size="13.5" fill="#291c0e">Change-counting at peak F&amp;B</text>
<text x="323" y="380" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">Abandoned queues = lost rounds</text>
<rect x="642" y="150" width="470" height="250" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="642" y="150" width="470" height="8" rx="4" fill="#3d6b6b"/>
<text x="877" y="198" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#2c5454">RFID TAP-TO-PAY</text>
<text x="877" y="222" text-anchor="middle" font-size="13" fill="#6a8a8a">the wristband is the wallet</text>
<text x="877" y="290" text-anchor="middle" font-size="38" font-weight="800" fill="#2c5454">under 2 sec</text>
<text x="877" y="318" text-anchor="middle" font-size="13.5" fill="#5c5c5c">per tap transaction</text>
<text x="877" y="354" text-anchor="middle" font-size="13.5" fill="#291c0e">Shorter queues, more served per hour</text>
<text x="877" y="380" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6f3a">More rounds sold per guest</text>
<line x1="572" y1="275" x2="626" y2="275" stroke="#c39a5f" stroke-width="5"/>
<polygon points="638,275 620,265 620,285" fill="#c39a5f"/>
<rect x="88" y="428" width="1024" height="150" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<text x="150" y="512" font-size="60" font-weight="800" fill="#2c5454">+15–30%</text>
<text x="152" y="548" font-size="16" font-weight="700" fill="#291c0e">per-attendee spend, cash → cashless</text>
<line x1="470" y1="452" x2="470" y2="554" stroke="#ecdcc0" stroke-width="2"/>
<text x="506" y="480" font-size="15" font-weight="700" fill="#291c0e">Transactions per guest:  ×1.5–2</text>
<text x="506" y="516" font-size="15" font-weight="700" fill="#291c0e">Vendor throughput:  2–3× per hour</text>
<text x="506" y="552" font-size="15" font-weight="700" fill="#291c0e">Unredeemed credit:  5–15% of preload</text>
<text x="600" y="618" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The wristband is the wallet — the line it deletes is the drink that finally gets sold.</text>
</svg>
