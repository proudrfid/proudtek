<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How an RFID windshield tag is read hands-free by an overhead gantry</title>
<desc id="d">A vehicle windshield with a UHF tag sits under an overhead gantry reader that beams a signal cone onto it. A three-step flow on the right shows the reader energizing the passive tag, the tag backscattering its EPC identifier, and the system matching it to a database to lift the barrier or debit a toll. Three chips note up to 200 km/h, passive UHF with no battery, and no driver interaction.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">VEHICLE RFID</text>
<text x="600" y="104" text-anchor="middle" font-size="34" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">Identified hands-free, at speed</text>
<!-- left scene: gantry + windshield -->
<rect x="110" y="182" width="400" height="13" rx="3" fill="#4a5568"/>
<rect x="110" y="195" width="13" height="150" fill="#4a5568"/>
<rect x="497" y="195" width="13" height="150" fill="#4a5568"/>
<rect x="250" y="156" width="150" height="30" rx="6" fill="#2c5454"/>
<text x="325" y="176" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">UHF READER</text>
<polygon points="305,188 350,188 332,352" fill="#dbe8e8"/>
<polygon points="160,470 250,330 470,330 420,470" fill="#e8f0f0" stroke="#9fb8b8" stroke-width="2"/>
<rect x="300" y="322" width="16" height="14" rx="3" fill="#b9c6c6"/>
<rect x="312" y="344" width="26" height="13" rx="3" fill="#3d6b6b"/>
<path d="M346,342 a16,16 0 0 1 0,22" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<path d="M352,336 a24,24 0 0 1 0,34" fill="none" stroke="#8fb0b0" stroke-width="2"/>
<text x="300" y="502" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">UHF windshield tag</text>
<!-- right flow -->
<rect x="600" y="196" width="540" height="58" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<circle cx="636" cy="225" r="18" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="636" y="231" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">1</text>
<text x="672" y="231" text-anchor="start" font-size="15.5" font-weight="600" fill="#291c0e">Reader energizes the passive tag</text>
<rect x="600" y="270" width="540" height="58" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<circle cx="636" cy="299" r="18" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="636" y="305" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">2</text>
<text x="672" y="305" text-anchor="start" font-size="15.5" font-weight="600" fill="#291c0e">Tag backscatters its EPC identifier</text>
<rect x="600" y="344" width="540" height="58" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<circle cx="636" cy="373" r="18" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="636" y="379" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">3</text>
<text x="672" y="379" text-anchor="start" font-size="15.5" font-weight="600" fill="#291c0e">Match database — lift barrier, debit toll</text>
<!-- stat pills -->
<rect x="150" y="528" width="270" height="34" rx="17" fill="#eef2f5" stroke="#bcc6d4" stroke-width="1.3"/>
<text x="285" y="550" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4557">up to 200 km/h</text>
<rect x="466" y="528" width="270" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="601" y="550" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">passive UHF · no battery</text>
<rect x="782" y="528" width="270" height="34" rx="17" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<text x="917" y="550" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d5a3a">no driver interaction</text>
<text x="600" y="606" text-anchor="middle" font-size="14" fill="#5c5c5c">When it works, nobody touches the brake — the gate lifts, the toll debits, the tag is never noticed.</text>
</svg>
