<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How an RFID tag read becomes clinical action across four hops</title>
<desc id="d">A four-step flow across the page. Step one, read: an RFID tag is read at the bedside or a chokepoint. Step two, middleware: HL7 and FHIR APIs normalize each event. Step three, systems: the event lands in Epic, Cerner, Meditech and CMMS platforms. Step four, workflow: it drives positive patient identification context, RTLS dashboards and automated alerts. Hardware delivers raw reads; the value is the integration.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FROM TAG READ TO CLINICAL ACTION</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Raw tag reads become clinical action in four hops.</text>

<!-- box 1 READ -->
<rect x="70" y="188" width="220" height="288" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="2"/>
<rect x="70" y="188" width="220" height="8" rx="4" fill="#3d6b6b"/>
<text x="180" y="234" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">1 · READ</text>
<rect x="150" y="266" width="60" height="56" rx="7" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<line x1="150" y1="282" x2="138" y2="282" stroke="#2c5454" stroke-width="2.4"/>
<line x1="150" y1="306" x2="138" y2="306" stroke="#2c5454" stroke-width="2.4"/>
<line x1="210" y1="282" x2="222" y2="282" stroke="#2c5454" stroke-width="2.4"/>
<line x1="210" y1="306" x2="222" y2="306" stroke="#2c5454" stroke-width="2.4"/>
<text x="180" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">RFID</text>
<text x="180" y="392" text-anchor="middle" font-size="14" fill="#5c5c5c">Tag read at</text>
<text x="180" y="414" text-anchor="middle" font-size="14" fill="#5c5c5c">bedside or chokepoint</text>

<!-- box 2 MIDDLEWARE -->
<rect x="350" y="188" width="220" height="288" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="2"/>
<rect x="350" y="188" width="220" height="8" rx="4" fill="#3d6b6b"/>
<text x="460" y="234" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">2 · MIDDLEWARE</text>
<rect x="422" y="262" width="76" height="60" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="443" cy="292" r="7" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<circle cx="477" cy="292" r="7" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<line x1="450" y1="292" x2="470" y2="292" stroke="#3d6b6b" stroke-width="2"/>
<text x="460" y="392" text-anchor="middle" font-size="14" fill="#5c5c5c">HL7 / FHIR APIs</text>
<text x="460" y="414" text-anchor="middle" font-size="14" fill="#5c5c5c">normalize each event</text>

<!-- box 3 EHR and CMMS -->
<rect x="630" y="188" width="220" height="288" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="2"/>
<rect x="630" y="188" width="220" height="8" rx="4" fill="#3d6b6b"/>
<text x="740" y="234" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">3 · EHR &amp; CMMS</text>
<rect x="708" y="260" width="64" height="64" rx="8" fill="#ffffff" stroke="#291c0e" stroke-width="2"/>
<line x1="720" y1="282" x2="760" y2="282" stroke="#cfe0e0" stroke-width="3"/>
<line x1="720" y1="294" x2="760" y2="294" stroke="#cfe0e0" stroke-width="3"/>
<line x1="720" y1="306" x2="748" y2="306" stroke="#cfe0e0" stroke-width="3"/>
<text x="740" y="392" text-anchor="middle" font-size="14" fill="#5c5c5c">Epic, Cerner,</text>
<text x="740" y="414" text-anchor="middle" font-size="14" fill="#5c5c5c">Meditech, CMMS</text>

<!-- box 4 WORKFLOW -->
<rect x="910" y="188" width="220" height="288" rx="14" fill="#eaf3ec" stroke="#c4dccb" stroke-width="2"/>
<rect x="910" y="188" width="220" height="8" rx="4" fill="#2d6a4f"/>
<text x="1020" y="234" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#1b4332">4 · WORKFLOW</text>
<circle cx="1020" cy="292" r="30" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
<polyline points="1004,292 1015,304 1038,278" fill="none" stroke="#2d6a4f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1020" y="392" text-anchor="middle" font-size="14" fill="#33595a">PPID, RTLS maps,</text>
<text x="1020" y="414" text-anchor="middle" font-size="14" fill="#33595a">automated alerts</text>

<!-- arrows -->
<line x1="300" y1="332" x2="338" y2="332" stroke="#291c0e" stroke-width="3"/>
<polygon points="338,325 356,332 338,339" fill="#291c0e"/>
<line x1="580" y1="332" x2="618" y2="332" stroke="#291c0e" stroke-width="3"/>
<polygon points="618,325 636,332 618,339" fill="#291c0e"/>
<line x1="860" y1="332" x2="898" y2="332" stroke="#291c0e" stroke-width="3"/>
<polygon points="898,325 916,332 898,339" fill="#291c0e"/>

<text x="600" y="548" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Hardware delivers raw reads; the value is the integration.</text>
<text x="600" y="586" text-anchor="middle" font-size="14" fill="#5c5c5c">No PHI travels on the tag — only an identifier that resolves to the record server-side.</text>
</svg>
