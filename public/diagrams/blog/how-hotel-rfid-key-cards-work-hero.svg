<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How an RFID hotel key card and lock exchange data across a 13.56 MHz field</title>
<desc id="d">Anatomy of a contactless hotel key-card exchange. On the left, a PVC key card holds an embedded antenna coil wound around a small silicon chip module. On the right, the door lock houses a reader coil, a controller with a secure access module, and the bolt motor. Between them a 13.56 MHz radio field carries the handshake across a 1 to 4 centimetre gap. The card is energy-harvesting and needs no battery. Specifications: 13.56 MHz high frequency, read range 1 to 4 centimetres, ISO 14443 Type A air interface, no battery. The chip family chosen — Classic, Plus or DESFire — decides which locks the card opens.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="58" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOTEL RFID KEY CARDS · HOW THEY WORK</text>
<text x="600" y="106" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="38" font-weight="700" fill="#291c0e">A card, a coil, and a 13.56 MHz handshake</text>
<text x="600" y="142" text-anchor="middle" font-size="16" fill="#4f4f4f">The contactless exchange that opens the door — no swipe, no battery, no contact.</text>

