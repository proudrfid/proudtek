<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID tag failure-mode taxonomy with early-warning signs</title>
<desc id="d">A table of five RFID tag failure modes, their frequency, and the early-warning sign to audit for. One, antenna trace fracture from bending and flex cycles, the number one mode: read range drops below 30 percent of a new tag, then sudden death. Two, adhesive failure from heat, humidity, oil and dust, the number two mode: the tag falls off within 6 to 18 months. Three, encapsulation cracking from UV, thermal shock and impact on outdoor hard tags: a visible crack lets water in and kills the chip. Four, chip die failure, rare at under 0.1 percent per year: dead on arrival. Five, ESD damage from an ungrounded applicator during deployment: dead on arrival or failure within the first 30 days.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT ACTUALLY KILLS TAGS</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Five failure modes, each with an early-warning sign you can audit for.</text>

<!-- header -->
<text x="90" y="126" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8a8a8a">FAILURE MODE</text>
<text x="620" y="126" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8a8a8a">FREQUENCY</text>
<text x="815" y="126" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8a8a8a">EARLY-WARNING SIGN</text>
<line x1="80" y1="138" x2="1120" y2="138" stroke="#e6dfd2" stroke-width="2"/>

<!-- row 1 -->
<text x="90" y="176" font-size="16" font-weight="800" fill="#291c0e">Antenna trace fracture</text>
<text x="90" y="197" font-size="12.5" fill="#8a8a8a">bending / flex cycles</text>
<rect x="620" y="160" width="150" height="26" rx="13" fill="#8b2d2d"/>
<text x="695" y="178" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">#1 most common</text>
<text x="815" y="184" font-size="13.5" fill="#5c5c5c">read range &lt;30% of new, then sudden death</text>
<line x1="80" y1="212" x2="1120" y2="212" stroke="#f0ece2" stroke-width="1.4"/>

<!-- row 2 -->
<text x="90" y="250" font-size="16" font-weight="800" fill="#291c0e">Adhesive failure</text>
<text x="90" y="271" font-size="12.5" fill="#8a8a8a">heat, humidity, oil, dust</text>
<rect x="620" y="234" width="120" height="26" rx="13" fill="#b0453f"/>
<text x="680" y="252" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">#2 common</text>
<text x="815" y="258" font-size="13.5" fill="#5c5c5c">tag falls off within 6-18 months</text>
<line x1="80" y1="286" x2="1120" y2="286" stroke="#f0ece2" stroke-width="1.4"/>

<!-- row 3 -->
<text x="90" y="324" font-size="16" font-weight="800" fill="#291c0e">Encapsulation cracking</text>
<text x="90" y="345" font-size="12.5" fill="#8a8a8a">UV, thermal shock, impact</text>
<rect x="620" y="308" width="130" height="26" rx="13" fill="#c39a5f"/>
<text x="685" y="326" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">outdoor / hard</text>
<text x="815" y="332" font-size="13.5" fill="#5c5c5c">visible crack, then water kills the chip</text>
<line x1="80" y1="360" x2="1120" y2="360" stroke="#f0ece2" stroke-width="1.4"/>

<!-- row 4 -->
<text x="90" y="398" font-size="16" font-weight="800" fill="#291c0e">Chip die failure</text>
<text x="90" y="419" font-size="12.5" fill="#8a8a8a">silicon damage (ESD, handling)</text>
<rect x="620" y="382" width="130" height="26" rx="13" fill="#8aa0a0"/>
<text x="685" y="400" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">rare &lt;0.1%/yr</text>
<text x="815" y="406" font-size="13.5" fill="#5c5c5c">dead on arrival (yield 99.5%+)</text>
<line x1="80" y1="434" x2="1120" y2="434" stroke="#f0ece2" stroke-width="1.4"/>

<!-- row 5 -->
<text x="90" y="472" font-size="16" font-weight="800" fill="#291c0e">ESD damage on deploy</text>
<text x="90" y="493" font-size="12.5" fill="#8a8a8a">ungrounded applicator / scanner</text>
<rect x="620" y="456" width="130" height="26" rx="13" fill="#c39a5f"/>
<text x="685" y="474" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">deployment</text>
<text x="815" y="480" font-size="13.5" fill="#5c5c5c">DOA or dies in the first 30 days</text>
<line x1="80" y1="508" x2="1120" y2="508" stroke="#f0ece2" stroke-width="1.4"/>

<text x="600" y="556" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">The top two — trace fracture and adhesive — are where a read-range audit pays off first.</text>
<text x="600" y="586" text-anchor="middle" font-size="14" fill="#5c5c5c">Only chip die failure touches the silicon itself, and it is the rarest of the five.</text>
</svg>
