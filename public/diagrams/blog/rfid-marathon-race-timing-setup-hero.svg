<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How a race timing point turns a runner's crossing into a timestamp</title>
<desc id="d">A four-stage loop. One, a race bib carries a disposable passive UHF RFID inlay with a unique tag ID. Two, the runner crosses a timing mat and overhead antenna that power the passive chip and read its ID. Three, a decoder timestamps the read to hundredth-of-a-second resolution. Four, scoring software matches the ID to the runner and publishes a live split or finish result in real time.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RACE TIMING POINT · CROSSING TO TIMESTAMP</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">A passive UHF chip, a mat, a decoder, a result — the same loop, thousands of times a morning.</text>

<rect x="40" y="150" width="250" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/><rect x="40" y="150" width="250" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="165" cy="198" r="18" fill="#3d6b6b"/><text x="165" y="205" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
<text x="165" y="252" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Bib + UHF chip</text>
<text x="165" y="279" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Disposable inlay,</text>
<text x="165" y="297" text-anchor="middle" font-size="12.5" fill="#5c5c5c">a unique tag ID</text>
<rect x="89" y="322" width="152" height="30" rx="15" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/><text x="165" y="341" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">UHF · passive</text>

<rect x="336" y="150" width="250" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/><rect x="336" y="150" width="250" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="461" cy="198" r="18" fill="#3d6b6b"/><text x="461" y="205" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
<text x="461" y="252" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Mat + antenna</text>
<text x="461" y="279" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Powers the chip,</text>
<text x="461" y="297" text-anchor="middle" font-size="12.5" fill="#5c5c5c">reads its ID</text>
<rect x="385" y="322" width="152" height="30" rx="15" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/><text x="461" y="341" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">at each timing point</text>

<rect x="632" y="150" width="250" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/><rect x="632" y="150" width="250" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="757" cy="198" r="18" fill="#3d6b6b"/><text x="757" y="205" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
<text x="757" y="252" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Decoder</text>
<text x="757" y="279" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Timestamps</text>
<text x="757" y="297" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the read</text>
<rect x="681" y="322" width="152" height="30" rx="15" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/><text x="757" y="341" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">0.01 s resolution</text>

<rect x="928" y="150" width="250" height="300" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/><rect x="928" y="150" width="250" height="8" rx="4" fill="#c39a5f"/>
<circle cx="1053" cy="198" r="18" fill="#c39a5f"/><text x="1053" y="205" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">4</text>
<text x="1053" y="252" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Live result</text>
<text x="1053" y="279" text-anchor="middle" font-size="12.5" fill="#5c5c5c">ID matched to runner,</text>
<text x="1053" y="297" text-anchor="middle" font-size="12.5" fill="#5c5c5c">published</text>
<rect x="977" y="322" width="152" height="30" rx="15" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/><text x="1053" y="341" text-anchor="middle" font-size="12" font-weight="800" fill="#6d5a3a">in real time</text>

<line x1="298" y1="300" x2="318" y2="300" stroke="#291c0e" stroke-width="2.5"/><polygon points="318,293 327,300 318,307" fill="#291c0e"/>
<line x1="594" y1="300" x2="614" y2="300" stroke="#291c0e" stroke-width="2.5"/><polygon points="614,293 623,300 614,307" fill="#291c0e"/>
<line x1="890" y1="300" x2="910" y2="300" stroke="#291c0e" stroke-width="2.5"/><polygon points="910,293 919,300 910,307" fill="#291c0e"/>

<text x="600" y="512" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Four stages, one loop — and every one has to fire for a clean time.</text>
<text x="600" y="538" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Miss a single read and the time comes back blank, which is why the finish line runs everything in duplicate.</text>
</svg>
