<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Cross-section of a wooden NFC card: veneer, NFC inlay, veneer</title>
<desc id="d">An edge-on cross-section of a wooden NFC card in three layers. A phone taps from above at 13.56 MHz. The top layer is a wood veneer of 0.3 to 0.6 mm — the face you see, carrying the grain, laser engraving and print. The middle layer is the NFC inlay, an antenna and chip on a flexible PET or paper core. The bottom layer is another wood veneer. Because wood is RF-transparent, the antenna runs at full performance with no shielding or tuning. Total thickness is 0.76 to 0.84 mm, matching ISO CR80. Rounded, sealed edges stop delamination and moisture.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="woodH" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#cf9f63"/><stop offset="100%" stop-color="#b3854b"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW A WOODEN NFC CARD IS BUILT</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Two wood veneers around an NFC inlay — and the wood is RF-transparent.</text>

<!-- phone tapping -->
<rect x="372" y="104" width="156" height="38" rx="10" fill="#ffffff" stroke="#291c0e" stroke-width="2.5"/>
<text x="450" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">phone / reader</text>
<path d="M 408 158 a 42 30 0 0 1 84 0" fill="none" stroke="#3d6b6b" stroke-width="2.4"/>
<path d="M 420 160 a 30 22 0 0 1 60 0" fill="none" stroke="#79a3a3" stroke-width="2.2"/>
<text x="556" y="160" font-size="12.5" font-weight="700" fill="#2c5454">13.56 MHz</text>

<!-- layer stack -->
<rect x="210" y="188" width="480" height="60" rx="8" fill="url(#woodH)" stroke="#8a6636" stroke-width="2"/>
<text x="450" y="224" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a2f16">WOOD VENEER · 0.3–0.6 mm</text>
<rect x="210" y="256" width="480" height="60" rx="8" fill="#eef5f5" stroke="#8fb6b6" stroke-width="2.4"/>
<text x="450" y="292" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#234a4a">NFC INLAY — ANTENNA + CHIP ON PET</text>
<rect x="210" y="324" width="480" height="60" rx="8" fill="url(#woodH)" stroke="#8a6636" stroke-width="2"/>
<text x="450" y="360" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a2f16">WOOD VENEER · 0.3–0.6 mm</text>

<!-- thickness brace (left) -->
<line x1="188" y1="188" x2="188" y2="384" stroke="#a7afbb" stroke-width="2"/>
<line x1="182" y1="188" x2="194" y2="188" stroke="#a7afbb" stroke-width="2"/>
<line x1="182" y1="384" x2="194" y2="384" stroke="#a7afbb" stroke-width="2"/>
<text x="172" y="276" text-anchor="end" font-size="13" font-weight="800" fill="#3a4454">0.76–0.84 mm</text>
<text x="172" y="296" text-anchor="end" font-size="12.5" fill="#6b6b6b">ISO CR80</text>

<!-- callouts -->
<line x1="690" y1="218" x2="724" y2="218" stroke="#c3b48f" stroke-width="2"/><circle cx="724" cy="218" r="3.4" fill="#a07d43"/>
<text x="736" y="214" font-size="14.5" font-weight="700" fill="#291c0e">The face you see — grain, laser</text>
<text x="736" y="233" font-size="14.5" font-weight="700" fill="#291c0e">engraving and print.</text>
<line x1="690" y1="286" x2="724" y2="286" stroke="#9cc0c0" stroke-width="2"/><circle cx="724" cy="286" r="3.4" fill="#2c5454"/>
<text x="736" y="282" font-size="14.5" font-weight="700" fill="#234a4a">RF-transparent wood: full NFC,</text>
<text x="736" y="301" font-size="14.5" font-weight="700" fill="#234a4a">no shielding or tuning. PET/paper core.</text>
<line x1="690" y1="354" x2="724" y2="354" stroke="#c3b48f" stroke-width="2"/><circle cx="724" cy="354" r="3.4" fill="#a07d43"/>
<text x="736" y="350" font-size="14.5" font-weight="700" fill="#291c0e">Rounded, sealed edges stop</text>
<text x="736" y="369" font-size="14.5" font-weight="700" fill="#291c0e">delamination and moisture.</text>

<rect x="210" y="430" width="780" height="70" rx="12" fill="#e9f2ec" stroke="#94bfa5" stroke-width="1.8"/>
<text x="600" y="460" text-anchor="middle" font-size="15" font-weight="800" fill="#1b4332">The NFC inlay is laminated between the veneers during pressing.</text>
<text x="600" y="483" text-anchor="middle" font-size="13.5" fill="#3a5a49">Thicker 1.0–1.5 mm builds feel more substantial but may not fit every card slot.</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Wood is RF-transparent — the antenna runs at full performance without shielding or tuning.</text>
</svg>
