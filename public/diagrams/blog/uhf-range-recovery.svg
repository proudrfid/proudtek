<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="rcTitle rcDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="rcTitle">Five field-tested ways to recover UHF read range</title>
  <desc id="rcDesc">Five practices that claw back 30 to 60 percent of lost range. One, use tag-on-metal inlays on any conductive surface to recover most of the 80 to 95 percent loss. Two, set reader transmit power to the regional maximum, 4 watts in the US or 2 watts in the EU, for 30 to 50 percent more range. Three, use circular-polarized antennas, trading about 3 dB of gain for any-orientation reads. Four, clear metal and water from the antenna near field to kill multipath nulls. Five, range-test with the actual tagged product, since bottled water can cost 6 to 10 dB.</desc>
  <defs>
    <radialGradient id="rcBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#rcBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="27" font-weight="800" letter-spacing="1.2" fill="#6d5a3a">RECOVER 30–60% OF LOST RANGE</text>
  <text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Five field-tested moves that survive contact with an actual warehouse</text>

  <!-- Row 1 -->
  <rect x="56" y="106" width="1088" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="112" cy="146" r="28" fill="#8b2d2d"/><text x="112" y="155" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">1</text>
  <text x="170" y="139" font-size="22" font-weight="800" fill="#291c0e">Use tag-on-metal inlays on any conductive surface</text>
  <text x="170" y="168" font-size="16.5" fill="#4f4f4f">A standard inlay on metal detunes and loses 80–95% of range</text>
  <rect x="912" y="124" width="204" height="44" rx="22" fill="#f5e6e6" stroke="#d9a3a3" stroke-width="1.5"/><text x="1014" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#8b2d2d">recovers most</text>

  <!-- Row 2 -->
  <rect x="56" y="194" width="1088" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="112" cy="234" r="28" fill="#1f4e79"/><text x="112" y="243" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">2</text>
  <text x="170" y="227" font-size="22" font-weight="800" fill="#291c0e">Set reader power to the regional maximum</text>
  <text x="170" y="256" font-size="16.5" fill="#4f4f4f">Most readers ship at 25–27 dBm; 30–33 dBm reaches farther</text>
  <rect x="912" y="212" width="204" height="44" rx="22" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.5"/><text x="1014" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#177a92">+30–50%</text>

  <!-- Row 3 -->
  <rect x="56" y="282" width="1088" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="112" cy="322" r="28" fill="#3d6b6b"/><text x="112" y="331" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">3</text>
  <text x="170" y="315" font-size="22" font-weight="800" fill="#291c0e">Use circular-polarized antennas</text>
  <text x="170" y="344" font-size="16.5" fill="#4f4f4f">Reads any tag orientation instead of one matching alignment</text>
  <rect x="912" y="300" width="204" height="44" rx="22" fill="#e7f0ef" stroke="#9cbfbc" stroke-width="1.5"/><text x="1014" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">−3 dB, +coverage</text>

  <!-- Row 4 -->
  <rect x="56" y="370" width="1088" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="112" cy="410" r="28" fill="#4a5568"/><text x="112" y="419" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">4</text>
  <text x="170" y="403" font-size="22" font-weight="800" fill="#291c0e">Clear metal and water from the near field</text>
  <text x="170" y="432" font-size="16.5" fill="#4f4f4f">Forklifts, coolers and steel columns cancel the radiation pattern</text>
  <rect x="912" y="388" width="204" height="44" rx="22" fill="#eef1f4" stroke="#c3ccd6" stroke-width="1.5"/><text x="1014" y="416" text-anchor="middle" font-size="15" font-weight="700" fill="#3a4a52">kills nulls</text>

  <!-- Row 5 -->
  <rect x="56" y="458" width="1088" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="112" cy="498" r="28" fill="#2d6a4f"/><text x="112" y="507" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">5</text>
  <text x="170" y="491" font-size="22" font-weight="800" fill="#291c0e">Range-test with the actual tagged product</text>
  <text x="170" y="520" font-size="16.5" fill="#4f4f4f">A pallet of bottled water attenuates the signal 6–10 dB</text>
  <rect x="912" y="476" width="204" height="44" rx="22" fill="#eaf5ec" stroke="#9cccae" stroke-width="1.5"/><text x="1014" y="504" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6f3a">test worst-case</text>

  <text x="600" y="590" text-anchor="middle" font-size="17" font-weight="600" fill="#6d5a3a">Lab says 10–15 m. The floor says “prove it.” These five moves are the proof.</text>
</svg>
