<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">The wrist is a UHF hostile zone — and how the band fights back</title>
  <desc id="d">The human body absorbs UHF energy strongly: a bare 902-928 MHz inlay on a wrist loses most of its range. The wristband answers with body-tuned antenna design and substrate standoff, restoring workable portal read distance governed by reader power, gain and polarisation.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Your arm is the antenna's worst neighbour</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Water-rich tissue drinks 900 MHz — the band is engineered around the wearer</text>
  <g transform="translate(70,160)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="500" height="300" rx="14" fill="#ffffff" stroke="#8b2d2d" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="17" fill="#8b2d2d">Bare inlay on skin</text>
    <rect x="60" y="80" width="200" height="120" rx="60" fill="#d8cdb8"/>
    <rect x="110" y="70" width="110" height="20" rx="6" fill="#eef2f0" stroke="#8b2d2d" stroke-width="2"/>
    <g stroke="#8b2d2d" stroke-width="2" opacity="0.8">
      <path d="M 300 80 C 320 78 335 76 350 74" fill="none" stroke-dasharray="5 6"/>
    </g>
    <text x="24" y="240" font-size="14" fill="#8b2d2d">902-928 MHz on the wrist: most of the</text>
    <text x="24" y="262" font-size="14" fill="#8b2d2d">read range is simply absorbed</text>
    <rect x="560" y="0" width="500" height="300" rx="14" fill="#ffffff" stroke="#2c5454" stroke-width="2.5"/>
    <text x="584" y="40" font-family="Georgia, serif" font-size="17" fill="#2c5454">Body-tuned band</text>
    <rect x="620" y="80" width="200" height="120" rx="60" fill="#d8cdb8"/>
    <rect x="660" y="60" width="130" height="30" rx="10" fill="#eef2f0" stroke="#2c5454" stroke-width="2.5"/>
    <g stroke="#c39a5f" stroke-width="2.5" fill="none" opacity="0.9">
      <path d="M 860 70 C 900 60 940 52 980 46"/>
      <path d="M 860 90 C 905 88 950 84 1000 80"/>
      <path d="M 860 110 C 900 116 945 120 990 124"/>
    </g>
    <text x="584" y="240" font-size="14" fill="#2c5454">tuned-on-body antenna + substrate standoff</text>
    <text x="584" y="262" font-size="14" fill="#2c5454">restore workable portal range</text>
  </g>
  <text x="70" y="540" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Range in the field is set by the reader math: transmit power, antenna gain, polarisation — the chip sensitivity caps the floor</text>
</svg>
