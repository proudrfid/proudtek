<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="srT srD" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <title id="srT">Five HIPAA Security Rule controls a wristband program is scored against</title>
      <desc id="srD">Five controls with their CFR citations. Access control, section 164.312(a)(1): role-based access; RFID is one factor inside the EHR's authentication flow. Audit controls, 164.312(b): every read or write tied to staff identity, reader ID and timestamp. Integrity controls, 164.312(c)(1): tamper-evident ID via NTAG 424 DNA SUN message authentication and AES-128 mutual auth. Transmission security, 164.312(e)(1): TLS 1.2 or higher and ideally HSTS. Person or entity authentication, 164.312(d): the clinician must already be authenticated; EPCS requires two factors.</desc>
      <defs><radialGradient id="srBg" cx="50%" cy="16%" r="92%"><stop offset="0%" stop-color="#f8f2e6"/><stop offset="100%" stop-color="#f1ece0"/></radialGradient></defs>
      <rect width="1200" height="675" fill="url(#srBg)"/>
      <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
      <text x="600" y="60" text-anchor="middle" font-size="20.5" font-weight="800" letter-spacing="1.6" fill="#6d5a3a">THE SECURITY-RULE RUBRIC · 45 CFR 164.312</text>
      <g>
        <!-- Row 1 -->
        <rect x="70" y="98" width="196" height="72" rx="10" fill="#291c0e"/>
        <text x="168" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#e7d8b8" font-family="ui-monospace,Menlo,monospace">§164.312</text>
        <text x="168" y="154" text-anchor="middle" font-size="17" font-weight="700" fill="#1fcefb" font-family="ui-monospace,Menlo,monospace">(a)(1)</text>
        <text x="288" y="128" font-size="21" font-weight="800" fill="#291c0e">Access control</text>
        <text x="288" y="156" font-size="15.5" fill="#4f4f4f">Role-based; RFID is one factor inside the EHR's auth flow.</text>
        <!-- Row 2 -->
        <rect x="70" y="188" width="196" height="72" rx="10" fill="#291c0e"/>
        <text x="168" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#e7d8b8" font-family="ui-monospace,Menlo,monospace">§164.312</text>
        <text x="168" y="244" text-anchor="middle" font-size="17" font-weight="700" fill="#1fcefb" font-family="ui-monospace,Menlo,monospace">(b)</text>
        <text x="288" y="218" font-size="21" font-weight="800" fill="#291c0e">Audit controls</text>
        <text x="288" y="246" font-size="15.5" fill="#4f4f4f">Every read/write tied to staff ID, reader ID and timestamp.</text>
        <!-- Row 3 -->
        <rect x="70" y="278" width="196" height="72" rx="10" fill="#291c0e"/>
        <text x="168" y="312" text-anchor="middle" font-size="17" font-weight="700" fill="#e7d8b8" font-family="ui-monospace,Menlo,monospace">§164.312</text>
        <text x="168" y="334" text-anchor="middle" font-size="17" font-weight="700" fill="#1fcefb" font-family="ui-monospace,Menlo,monospace">(c)(1)</text>
        <text x="288" y="308" font-size="21" font-weight="800" fill="#291c0e">Integrity controls</text>
        <text x="288" y="336" font-size="15.5" fill="#4f4f4f">Tamper-evident: NTAG 424 DNA SUN + AES-128 mutual auth.</text>
        <!-- Row 4 -->
        <rect x="70" y="368" width="196" height="72" rx="10" fill="#291c0e"/>
        <text x="168" y="402" text-anchor="middle" font-size="17" font-weight="700" fill="#e7d8b8" font-family="ui-monospace,Menlo,monospace">§164.312</text>
        <text x="168" y="424" text-anchor="middle" font-size="17" font-weight="700" fill="#1fcefb" font-family="ui-monospace,Menlo,monospace">(e)(1)</text>
        <text x="288" y="398" font-size="21" font-weight="800" fill="#291c0e">Transmission security</text>
        <text x="288" y="426" font-size="15.5" fill="#4f4f4f">TLS 1.2+ and ideally HSTS — most scrutiny lands on the API calls.</text>
        <!-- Row 5 -->
        <rect x="70" y="458" width="196" height="72" rx="10" fill="#291c0e"/>
        <text x="168" y="492" text-anchor="middle" font-size="17" font-weight="700" fill="#e7d8b8" font-family="ui-monospace,Menlo,monospace">§164.312</text>
        <text x="168" y="514" text-anchor="middle" font-size="17" font-weight="700" fill="#1fcefb" font-family="ui-monospace,Menlo,monospace">(d)</text>
        <text x="288" y="488" font-size="21" font-weight="800" fill="#291c0e">Person / entity auth</text>
        <text x="288" y="516" font-size="15.5" fill="#4f4f4f">Clinician already authenticated; EPCS adds a second factor.</text>
      </g>
      <rect x="70" y="556" width="1060" height="72" rx="14" fill="#f4efe4"/>
      <text x="600" y="588" text-anchor="middle" font-size="16" font-weight="700" fill="#6d5a3a">The wristband is never the whole answer — it's one factor in a flow.</text>
      <text x="600" y="612" text-anchor="middle" font-size="14.5" font-style="italic" fill="#8a7a5f">"Something the patient has," standing next to "someone the clinician is."</text>
    </svg>
