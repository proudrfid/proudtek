<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">EM4100 64-bit frame — header, customer code, 40-bit ID, parity</title>
  <desc id="d">The card broadcasts one fixed 64-bit Manchester-encoded frame: 9-bit header, 10-bit customer/version field, 40-bit unique ID, row and column parity and a stop bit. Every tap produces exactly the same frame — no rolling counter, no nonce, no handshake.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">One sentence, repeated forever</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">The whole protocol is a fixed 64-bit broadcast — that is both the charm and the caveat</text>
  <g transform="translate(60,170)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="150" height="80" rx="8" fill="#fdf3e3" stroke="#c39a5f" stroke-width="2"/>
    <text x="16" y="34" font-size="14" fill="#6d5a3a">9-bit</text>
    <text x="16" y="58" font-size="14" fill="#291c0e">header</text>
    <rect x="160" y="0" width="190" height="80" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="176" y="34" font-size="14" fill="#2c5454">10-bit</text>
    <text x="176" y="58" font-size="14" fill="#2c5454">customer / version</text>
    <rect x="360" y="0" width="470" height="80" rx="8" fill="#eef2f0" stroke="#3d6b6b" stroke-width="3"/>
    <text x="380" y="34" font-size="15" fill="#2c5454">40-bit unique ID</text>
    <text x="380" y="58" font-size="13" fill="#6d5a3a">the operational identifier readers act on</text>
    <rect x="840" y="0" width="240" height="80" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="856" y="34" font-size="14" fill="#291c0e">row + column parity</text>
    <text x="856" y="58" font-size="14" fill="#6d5a3a">+ stop bit</text>
    <text x="0" y="120" font-size="13" fill="#6d5a3a">Manchester-encoded at 125 kHz — total 64 bits</text>
  </g>
  <g transform="translate(60,340)">
    <rect x="0" y="0" width="500" height="150" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="38" font-family="Georgia, serif" font-size="18" fill="#2c5454">What the frame never contains</text>
    <text x="24" y="72" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">No rolling counter · no nonce · no handshake</text>
    <text x="24" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Every tap emits exactly the same bits</text>
    <text x="24" y="128" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Cryptographic posture: none, by design</text>
  </g>
  <g transform="translate(600,340)">
    <rect x="0" y="0" width="500" height="150" rx="12" fill="#fdf3e3" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="38" font-family="Georgia, serif" font-size="18" fill="#291c0e">What that buys you</text>
    <text x="24" y="72" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Lowest-cost credential that a reader can act on</text>
    <text x="24" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Customer/version field carries factory-code allocation</text>
    <text x="24" y="128" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Right where churn is high and the threat model is a lost card</text>
  </g>
  <text x="60" y="580" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Pair with a writable T5577 only on the encoding bench — production cards ship read-only</text>
</svg>
