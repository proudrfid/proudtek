<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">One credential spans both reader-to-panel eras</title>
  <desc id="d">One dual-frequency fob in the centre bridges two reader-to-panel generations: a legacy Wiegand 26 / 34 five-wire panel on the left and a modern SIA OSDP v2.2 RS-485 Secure Channel link on the right. The OSDP retrofit proceeds independently of the credential, and one issuance carries a site across the 12-24 month migration.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="aleg" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a7a5f"/></marker>
    <marker id="amod" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3d6b6b"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SPANS BOTH READER ERAS</text>
  <text x="600" y="94" text-anchor="middle" font-size="16" fill="#5c5c5c">One credential, both reader-to-panel generations</text>

  <!-- legacy panel -->
  <rect x="80" y="230" width="300" height="170" rx="14" fill="#ffffff" stroke="#cdb79a" stroke-width="2"/>
  <text x="230" y="266" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#8a7a5f">LEGACY</text>
  <text x="230" y="300" text-anchor="middle" font-size="20" font-weight="700" fill="#6d5a3a">Wiegand 26 / 34</text>
  <text x="230" y="330" text-anchor="middle" font-size="16" fill="#8a7a5f">5-wire</text>
  <text x="230" y="362" text-anchor="middle" font-size="15" fill="#5c5c5c">incumbent fleet</text>

  <!-- modern panel -->
  <rect x="820" y="230" width="300" height="170" rx="14" fill="#ffffff" stroke="#9fb8c2" stroke-width="2"/>
  <text x="970" y="266" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#2c5454">MODERN</text>
  <text x="970" y="298" text-anchor="middle" font-size="20" font-weight="700" fill="#2c5454">SIA OSDP v2.2</text>
  <text x="970" y="328" text-anchor="middle" font-size="15" fill="#3d6b6b">RS-485 Secure Channel</text>
  <text x="970" y="360" text-anchor="middle" font-size="15" fill="#5c5c5c">modernised link</text>

  <!-- fob -->
  <circle cx="600" cy="315" r="72" fill="#f4efe4" stroke="#c39a5f" stroke-width="2.5"/>
  <text x="600" y="308" text-anchor="middle" font-size="17" font-weight="700" fill="#6d5a3a">one</text>
  <text x="600" y="332" text-anchor="middle" font-size="17" font-weight="700" fill="#6d5a3a">fob</text>

  <!-- bridge arrows -->
  <line x1="524" y1="315" x2="386" y2="315" stroke="#8a7a5f" stroke-width="3" marker-end="url(#aleg)"/>
  <line x1="676" y1="315" x2="814" y2="315" stroke="#3d6b6b" stroke-width="3" marker-end="url(#amod)"/>

  <!-- retrofit band -->
  <rect x="270" y="458" width="660" height="162" rx="18" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="500" text-anchor="middle" font-size="19" font-weight="700" fill="#2c5454">OSDP retrofit proceeds independently of the credential</text>
  <text x="600" y="534" text-anchor="middle" font-size="15" fill="#3d6b6b">the reader-to-panel upgrade runs on its own schedule —</text>
  <text x="600" y="558" text-anchor="middle" font-size="15" fill="#3d6b6b">the dual-frequency fob already spans both eras</text>
  <text x="600" y="592" text-anchor="middle" font-size="14" fill="#5c5c5c">one issuance carries a site across the 12-24 month migration</text>
</svg>
