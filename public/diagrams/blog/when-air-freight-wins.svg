<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five scenarios where air freight earns its premium for RFID tags</title>
<desc id="d">Five numbered scenarios that justify paying the 10-20 times air premium. One, urgent customer deadline sea cannot meet — weigh the air premium against the account. Two, first-order validation: air a 200-2,000 unit batch to test the supplier before committing to a sea container. Three, high-velocity inventory where 30-45 days of sea-transit stock ties up too much working capital. Four, tariff timing: early arrival locks in the pre-tariff customs rate. Five, low-volume specialty SKUs of single-digit kilograms, where LCL minimums make air competitive.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHEN AIR FREIGHT EARNS THE PREMIUM</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Five times paying 10-20× for speed is the right call.</text>

<!-- row 1 -->
<rect x="80" y="150" width="1040" height="64" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="138" cy="182" r="22" fill="#3d6b6b"/>
<text x="138" y="190" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">1</text>
<line x1="192" y1="162" x2="192" y2="202" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="220" y="180" font-size="17" font-weight="800" fill="#291c0e">Urgent customer deadline</text>
<text x="220" y="200" font-size="13" fill="#5c5c5c">sea won't arrive in time — weigh the air premium against the account</text>

<!-- row 2 -->
<rect x="80" y="224" width="1040" height="64" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="138" cy="256" r="22" fill="#3d6b6b"/>
<text x="138" y="264" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">2</text>
<line x1="192" y1="236" x2="192" y2="276" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="220" y="254" font-size="17" font-weight="800" fill="#291c0e">First-order validation</text>
<text x="220" y="274" font-size="13" fill="#5c5c5c">air a 200-2,000-unit batch to test the supplier before a sea container</text>

<!-- row 3 -->
<rect x="80" y="298" width="1040" height="64" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="138" cy="330" r="22" fill="#3d6b6b"/>
<text x="138" y="338" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">3</text>
<line x1="192" y1="310" x2="192" y2="350" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="220" y="328" font-size="17" font-weight="800" fill="#291c0e">High-velocity inventory</text>
<text x="220" y="348" font-size="13" fill="#5c5c5c">30-45 days of sea-transit stock ties up too much working capital</text>

<!-- row 4 -->
<rect x="80" y="372" width="1040" height="64" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="138" cy="404" r="22" fill="#3d6b6b"/>
<text x="138" y="412" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">4</text>
<line x1="192" y1="384" x2="192" y2="424" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="220" y="402" font-size="17" font-weight="800" fill="#291c0e">Tariff timing</text>
<text x="220" y="422" font-size="13" fill="#5c5c5c">early arrival locks in the pre-tariff customs rate</text>

<!-- row 5 -->
<rect x="80" y="446" width="1040" height="64" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="138" cy="478" r="22" fill="#3d6b6b"/>
<text x="138" y="486" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">5</text>
<line x1="192" y1="458" x2="192" y2="498" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="220" y="476" font-size="17" font-weight="800" fill="#291c0e">Low-volume specialty SKUs</text>
<text x="220" y="496" font-size="13" fill="#5c5c5c">single-digit kilograms — LCL minimums make air competitive</text>

<text x="600" y="556" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Everywhere else, sea does the job for a fraction of the price.</text>
</svg>
