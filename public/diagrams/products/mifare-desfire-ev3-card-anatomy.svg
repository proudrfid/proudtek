<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">MIFARE DESFire EV3 card — CR80 body and the ISO/IEC 14443-4 conversation</title>
  <desc id="d">CR80 card layers with chip and planar loop, next to the interface facts: ISO/IEC 14443-1/-2/-3/-4 Type A at 13.56 MHz, T=CL block transfer, 106-848 kbit/s, ISO/IEC 7816 APDU framing, AES-128 mutual authentication with no clear-text UID after auth.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Same CR80 shell — a smartcard conversation inside</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">The loop looks like Classic; what travels over it is an authenticated APDU session</text>
  <g transform="translate(90,150)">
    <rect x="0" y="0" width="520" height="300" rx="16" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
    <rect x="36" y="40" width="448" height="220" rx="12" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2"/>
    <rect x="66" y="70" width="368" height="150" rx="8" fill="none" stroke="#3d6b6b" stroke-width="3"/>
    <rect x="82" y="84" width="336" height="122" rx="6" fill="none" stroke="#3d6b6b" stroke-width="2"/>
    <rect x="98" y="98" width="304" height="94" rx="5" fill="none" stroke="#3d6b6b" stroke-width="1.5"/>
    <rect x="376" y="150" width="30" height="26" rx="4" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>
    <text x="66" y="248" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">planar 13.56 MHz loop — gold block is the secure MCU</text>
    <text x="36" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">ISO/IEC 7810 ID-1 CR80 — 85.60 x 53.98 x 0.76 mm</text>
  </g>
  <g transform="translate(680,140)">
    <rect x="0" y="0" width="440" height="360" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="28" y="44" font-family="Georgia, serif" font-size="20" fill="#2c5454">The conversation, layer by layer</text>
    <text x="28" y="86" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2c5454">ISO/IEC 14443-1/-2/-3/-4 Type A · 13.56 MHz</text>
    <text x="28" y="114" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2c5454">T=CL block transfer · 106-848 kbit/s envelope</text>
    <text x="28" y="142" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2c5454">ISO/IEC 7816 APDU framing</text>
    <line x1="28" y1="168" x2="412" y2="168" stroke="#d8cdb8" stroke-width="1.5"/>
    <text x="28" y="200" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#291c0e">AES-128 mutual authentication (NIST FIPS 197)</text>
    <text x="28" y="228" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">Session-fresh IVs — card and reader prove keys first</text>
    <text x="28" y="256" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">No clear-text UID exchange after authentication</text>
    <line x1="28" y1="282" x2="412" y2="282" stroke="#d8cdb8" stroke-width="1.5"/>
    <text x="28" y="314" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Common Criteria EAL5+ silicon</text>
    <text x="28" y="340" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">AVA_VAN.5 high attack-potential analysis</text>
  </g>
</svg>
