<rect x="816" y="440" width="284" height="34" rx="17" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="958" y="462" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a6d34">transfer = flagged</text>

<text x="600" y="548" text-anchor="middle" font-size="14.5" fill="#5c5c5c">The common thread: UID-bound database validation replaces optical-pattern checks anyone can copy —</text>
<text x="600" y="570" text-anchor="middle" font-size="14.5" fill="#5c5c5c">hard to clone, easy to detect.</text>
