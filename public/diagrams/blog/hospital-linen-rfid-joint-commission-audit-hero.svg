<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="hlHeroTitle hlHeroDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="hlHeroTitle">Every hospital linen carries its own RFID paper trail</title>
  <desc id="hlHeroDesc">A five-stage linen journey — soiled intake, thermal wash, sterilization, clean-zone storage, and issue and patient use — with one RFID read logged at each zone. The reads build an audit trail that is ready on demand for a Joint Commission surveyor, replacing a loading-dock scale that could only tell you the cart got lighter.</desc>

  <defs>
    <radialGradient id="hlBg" cx="50%" cy="16%" r="95%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f0ebdf"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#hlBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="0.3" fill="#291c0e">Every hospital linen carries its own paper trail</text>
  <text x="600" y="90" text-anchor="middle" font-size="15.5" fill="#2d6a4f">One RFID read per zone — from soiled intake to the surveyor's toughest question, logged.</text>

  <!-- ===== journey: 5 stage cards ===== -->
  <!-- cards at x = 62, 282, 502, 722, 942 ; width 196 ; y 150 h 236 -->
  <g font-size="14.5">
    <!-- chevrons between cards -->
    <g fill="#c39a5f">
      <path d="M262 268 l14 8 l-14 8 z"/>
      <path d="M482 268 l14 8 l-14 8 z"/>
      <path d="M702 268 l14 8 l-14 8 z"/>
      <path d="M922 268 l14 8 l-14 8 z"/>
    </g>

    <!-- Card 1: Soiled intake -->
    <rect x="62" y="150" width="196" height="236" rx="14" fill="#f6f0e6" stroke="#e2d3b4" stroke-width="2"/>
    <rect x="62" y="150" width="196" height="8" rx="4" fill="#8a6d33"/>
    <circle cx="90" cy="186" r="13" fill="#8a6d33"/>
    <text x="90" y="191" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
    <path d="M132 210 h56 l-8 44 h-40 z" fill="#ffffff" stroke="#8a6d33" stroke-width="2.5"/>
    <line x1="140" y1="222" x2="180" y2="222" stroke="#8a6d33" stroke-width="2"/>
    <text x="160" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Soiled intake</text>
    <text x="160" y="314" text-anchor="middle" font-size="13" fill="#6c5127">tagged &amp; counted in</text>
    <rect x="104" y="340" width="112" height="26" rx="13" fill="#e8f1e9" stroke="#a9c8b2" stroke-width="1.5"/>
    <text x="160" y="357" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">✓ logged</text>

    <!-- Card 2: Thermal wash -->
    <rect x="282" y="150" width="196" height="236" rx="14" fill="#eef4f6" stroke="#bcd4dd" stroke-width="2"/>
    <rect x="282" y="150" width="196" height="8" rx="4" fill="#1f4e79"/>
    <circle cx="310" cy="186" r="13" fill="#1f4e79"/>
    <text x="310" y="191" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
    <rect x="348" y="206" width="64" height="52" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="2.5"/>
    <circle cx="380" cy="232" r="16" fill="none" stroke="#1f4e79" stroke-width="2.5"/>
    <circle cx="380" cy="232" r="6" fill="#1fcefb"/>
    <text x="380" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Thermal wash</text>
    <text x="380" y="314" text-anchor="middle" font-size="13" fill="#4a5568">cycle recorded per item</text>
    <rect x="324" y="340" width="112" height="26" rx="13" fill="#e8f1e9" stroke="#a9c8b2" stroke-width="1.5"/>
    <text x="380" y="357" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">✓ logged</text>

    <!-- Card 3: Sterilize -->
    <rect x="502" y="150" width="196" height="236" rx="14" fill="#f0f6f1" stroke="#a9c8b2" stroke-width="2"/>
    <rect x="502" y="150" width="196" height="8" rx="4" fill="#2d6a4f"/>
    <circle cx="530" cy="186" r="13" fill="#2d6a4f"/>
    <text x="530" y="191" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
    <rect x="568" y="208" width="64" height="50" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>
    <path d="M584 224 q6 -8 0 -16 M600 224 q6 -8 0 -16 M616 224 q6 -8 0 -16" fill="none" stroke="#2d6a4f" stroke-width="2" stroke-linecap="round"/>
    <text x="600" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Sterilize</text>
    <text x="600" y="314" text-anchor="middle" font-size="13" fill="#3c5c46">surgical linens verified</text>
    <rect x="544" y="340" width="112" height="26" rx="13" fill="#e8f1e9" stroke="#a9c8b2" stroke-width="1.5"/>
    <text x="600" y="357" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">✓ logged</text>

    <!-- Card 4: Clean-zone store -->
    <rect x="722" y="150" width="196" height="236" rx="14" fill="#f0f6f1" stroke="#a9c8b2" stroke-width="2"/>
    <rect x="722" y="150" width="196" height="8" rx="4" fill="#2d6a4f"/>
    <circle cx="750" cy="186" r="13" fill="#2d6a4f"/>
    <text x="750" y="191" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
    <rect x="788" y="210" width="64" height="14" rx="3" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
    <rect x="788" y="228" width="64" height="14" rx="3" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
    <rect x="788" y="246" width="64" height="14" rx="3" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
    <text x="820" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Clean-zone store</text>
    <text x="820" y="314" text-anchor="middle" font-size="13" fill="#3c5c46">alert if it drifts out</text>
    <rect x="764" y="340" width="112" height="26" rx="13" fill="#e8f1e9" stroke="#a9c8b2" stroke-width="1.5"/>
    <text x="820" y="357" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">✓ logged</text>

    <!-- Card 5: Issue & use -->
    <rect x="942" y="150" width="196" height="236" rx="14" fill="#f6f0e6" stroke="#e2d3b4" stroke-width="2"/>
    <rect x="942" y="150" width="196" height="8" rx="4" fill="#8a6d33"/>
    <circle cx="970" cy="186" r="13" fill="#8a6d33"/>
    <text x="970" y="191" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">5</text>
    <path d="M1006 246 v-20 h20 a12 12 0 0 1 12 12 v8 z" fill="#ffffff" stroke="#8a6d33" stroke-width="2.5"/>
    <line x1="1006" y1="246" x2="1074" y2="246" stroke="#8a6d33" stroke-width="2.5"/>
    <line x1="1010" y1="246" x2="1010" y2="256" stroke="#8a6d33" stroke-width="2.5"/>
    <line x1="1070" y1="246" x2="1070" y2="256" stroke="#8a6d33" stroke-width="2.5"/>
    <text x="1040" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Issue &amp; use</text>
    <text x="1040" y="314" text-anchor="middle" font-size="13" fill="#6c5127">tied to patient care</text>
    <rect x="984" y="340" width="112" height="26" rx="13" fill="#e8f1e9" stroke="#a9c8b2" stroke-width="1.5"/>
    <text x="1040" y="357" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">✓ logged</text>
  </g>

  <!-- ===== bottom: audit trail vs the old scale ===== -->
  <rect x="62" y="424" width="700" height="192" rx="16" fill="#fbf8f2" stroke="#e6dbc4" stroke-width="2"/>
  <text x="86" y="456" font-size="13" font-weight="800" letter-spacing="1.5" fill="#8a6d33">THE AUDIT TRAIL — READY ON DEMAND</text>
  <g font-size="14">
    <rect x="86" y="470" width="652" height="34" rx="8" fill="#ffffff" stroke="#eadfca"/>
    <circle cx="106" cy="487" r="5" fill="#1f6f3a"/>
    <text x="122" y="492" fill="#291c0e" font-weight="600">GOWN-4471</text>
    <text x="300" y="492" fill="#5c5c5c">sterile zone · verified · 07:41</text>
    <text x="720" y="492" text-anchor="end" fill="#1f6f3a" font-weight="700">✓</text>

    <rect x="86" y="510" width="652" height="34" rx="8" fill="#ffffff" stroke="#eadfca"/>
    <circle cx="106" cy="527" r="5" fill="#1f6f3a"/>
    <text x="122" y="532" fill="#291c0e" font-weight="600">SHEET-2093</text>
    <text x="300" y="532" fill="#5c5c5c">ward 5B · issued · 09:12</text>
    <text x="720" y="532" text-anchor="end" fill="#1f6f3a" font-weight="700">✓</text>

    <rect x="86" y="550" width="652" height="34" rx="8" fill="#ffffff" stroke="#eadfca"/>
    <circle cx="106" cy="567" r="5" fill="#c39a5f"/>
    <text x="122" y="572" fill="#291c0e" font-weight="600">DRAPE-0088</text>
    <text x="300" y="572" fill="#5c5c5c">retired at cycle limit · before it failed</text>
    <text x="720" y="572" text-anchor="end" fill="#8a6d33" font-weight="700">✓</text>
  </g>
  <text x="86" y="605" font-size="12.5" fill="#8a6d33">Every row is a defensible record — no binder assembled the night before.</text>

  <!-- the old way -->
  <rect x="778" y="424" width="360" height="192" rx="16" fill="#f7ecea" stroke="#dcb6b0" stroke-width="2"/>
  <text x="958" y="456" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1" fill="#8b2d2d">THE OLD WAY: A SCALE</text>
  <!-- scale glyph -->
  <line x1="958" y1="482" x2="958" y2="556" stroke="#8b2d2d" stroke-width="3"/>
  <path d="M898 500 h120" stroke="#8b2d2d" stroke-width="3"/>
  <path d="M878 500 a20 20 0 0 0 40 0 z" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5"/>
  <path d="M998 500 a20 20 0 0 0 40 0 z" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5"/>
  <rect x="928" y="556" width="60" height="12" rx="4" fill="#8b2d2d"/>
  <text x="958" y="592" text-anchor="middle" font-size="13.5" fill="#734040">It only knew the cart</text>
  <text x="958" y="610" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">got lighter.</text>
</svg>
