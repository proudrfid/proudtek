<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Paper band closure — peel, loop, bond, and the tamper tell</title>
  <desc id="d">The band end carries a peel-and-stick adhesive; the band loops back on itself and bonds, and removal attempts tear the paper visibly. Substrate panel: coated paper for lowest-cost indoor single-day use, synthetic paper (Yupo / PP) for wet or outdoor day events.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Loop it, bond it — tearing it tells on you</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">The cheapest tamper-evident closure in the wristband family</text>
  <g transform="translate(70,150)" font-family="Helvetica, Arial, sans-serif">
    <path d="M 60 120 Q 200 20 340 120 Q 200 220 60 120 Z" fill="#ffffff" stroke="#3d6b6b" stroke-width="3"/>
    <rect x="286" y="96" width="72" height="46" rx="6" fill="#fdf3e3" stroke="#c39a5f" stroke-width="2"/>
    <text x="294" y="124" font-size="12" fill="#6d5a3a">adhesive</text>
    <rect x="150" y="104" width="34" height="30" rx="4" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2"/>
    <text x="120" y="160" font-size="12" fill="#2c5454">NFC inlay</text>
    <text x="60" y="250" font-size="14" fill="#2c5454">peel → loop back → bond — done in two seconds at the gate</text>
    <path d="M 470 90 L 560 60" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round"/>
    <path d="M 470 110 L 560 140" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round"/>
    <text x="440" y="190" font-size="13" fill="#8b2d2d">removal attempt tears the paper —</text>
    <text x="440" y="212" font-size="13" fill="#8b2d2d">visibly, irreversibly</text>
  </g>
  <g transform="translate(720,140)">
    <rect x="0" y="0" width="410" height="250 " rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="18" fill="#291c0e">Two papers, two duty cycles</text>
    <text x="24" y="80" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Coated paper — lowest cost, indoor /</text>
    <text x="24" y="102" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">sheltered single-day use</text>
    <text x="24" y="140" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Synthetic paper (Yupo / PP) — wet or</text>
    <text x="24" y="162" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">outdoor day events</text>
    <text x="24" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Full-colour flexo (volume) or digital print</text>
    <text x="24" y="222" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">(short runs, variable data)</text>
  </g>
  <text x="70" y="580" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">HF 13.56 MHz, ISO/IEC 14443-A — NTAG213 default for tap-to-URL day events</text>
</svg>
