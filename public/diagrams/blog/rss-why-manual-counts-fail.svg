<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The conditions under which a manual sponge count fails</title>
<desc id="d">Five conditions feed a failed count: an emergency or urgent case, high blood loss with dark saturated sponges, staff handoffs and turnover mid-procedure, a long or complex procedure, and multiple surgical teams. Together they lead to the outcome shown at the bottom: a count documented correct while a sponge is still retained. The failure is systemic, not a lapse by any individual.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY A CORRECT COUNT STILL MISSES</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">The count fails under the hardest conditions — not through any individual lapse.</text>

<!-- 5 factor cards -->
<rect x="52" y="132" width="212" height="196" rx="13" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="52" y="132" width="212" height="8" rx="4" fill="#4a5568"/>
<circle cx="158" cy="182" r="20" fill="#eef1f5" stroke="#4a5568" stroke-width="2"/>
<text x="158" y="188" text-anchor="middle" font-size="17" font-weight="800" fill="#4a5568">!</text>
<text x="158" y="238" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Emergency case</text>
<text x="158" y="268" text-anchor="middle" font-size="12" fill="#5c5c5c">Urgent, unplanned</text>
<text x="158" y="286" text-anchor="middle" font-size="12" fill="#5c5c5c">starts raise the risk</text>
<text x="158" y="304" text-anchor="middle" font-size="12" fill="#5c5c5c">of a miscount.</text>

<rect x="288" y="132" width="212" height="196" rx="13" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="288" y="132" width="212" height="8" rx="4" fill="#4a5568"/>
<circle cx="394" cy="182" r="20" fill="#eef1f5" stroke="#4a5568" stroke-width="2"/>
<circle cx="394" cy="182" r="9" fill="#8b2d2d"/>
<text x="394" y="238" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">High blood loss</text>
<text x="394" y="268" text-anchor="middle" font-size="12" fill="#5c5c5c">A saturated sponge</text>
<text x="394" y="286" text-anchor="middle" font-size="12" fill="#5c5c5c">darkens and blends</text>
<text x="394" y="304" text-anchor="middle" font-size="12" fill="#5c5c5c">into the field.</text>

<rect x="524" y="132" width="212" height="196" rx="13" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="524" y="132" width="212" height="8" rx="4" fill="#4a5568"/>
<circle cx="614" cy="176" r="13" fill="none" stroke="#4a5568" stroke-width="2"/>
<circle cx="646" cy="176" r="13" fill="none" stroke="#8a94a3" stroke-width="2"/>
<path d="M 636 186 L 624 196" stroke="#4a5568" stroke-width="2"/>
<text x="630" y="238" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Staff handoffs</text>
<text x="630" y="268" text-anchor="middle" font-size="12" fill="#5c5c5c">Shift changes break</text>
<text x="630" y="286" text-anchor="middle" font-size="12" fill="#5c5c5c">the chain of who</text>
<text x="630" y="304" text-anchor="middle" font-size="12" fill="#5c5c5c">counted what.</text>

<rect x="760" y="132" width="212" height="196" rx="13" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="760" y="132" width="212" height="8" rx="4" fill="#4a5568"/>
<circle cx="866" cy="182" r="20" fill="none" stroke="#4a5568" stroke-width="2"/>
<line x1="866" y1="182" x2="866" y2="170" stroke="#4a5568" stroke-width="2"/>
<line x1="866" y1="182" x2="876" y2="188" stroke="#4a5568" stroke-width="2"/>
<text x="866" y="238" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Long procedure</text>
<text x="866" y="268" text-anchor="middle" font-size="12" fill="#5c5c5c">Duration and</text>
<text x="866" y="286" text-anchor="middle" font-size="12" fill="#5c5c5c">fatigue erode</text>
<text x="866" y="304" text-anchor="middle" font-size="12" fill="#5c5c5c">count accuracy.</text>

<rect x="996" y="132" width="152" height="196" rx="13" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="996" y="132" width="152" height="8" rx="4" fill="#4a5568"/>
<circle cx="1058" cy="176" r="9" fill="none" stroke="#4a5568" stroke-width="2"/>
<circle cx="1044" cy="192" r="9" fill="none" stroke="#8a94a3" stroke-width="2"/>
<circle cx="1072" cy="192" r="9" fill="none" stroke="#8a94a3" stroke-width="2"/>
<text x="1072" y="238" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Multiple</text>
<text x="1072" y="256" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">teams</text>
<text x="1072" y="284" text-anchor="middle" font-size="12" fill="#5c5c5c">More hands,</text>
<text x="1072" y="302" text-anchor="middle" font-size="12" fill="#5c5c5c">more handoffs.</text>

<!-- converging arrows -->
<line x1="158" y1="338" x2="590" y2="398" stroke="#cbb99a" stroke-width="2" opacity="0.5"/>
<line x1="394" y1="338" x2="600" y2="398" stroke="#cbb99a" stroke-width="2" opacity="0.5"/>
<line x1="630" y1="338" x2="610" y2="398" stroke="#cbb99a" stroke-width="2" opacity="0.5"/>
<line x1="866" y1="338" x2="620" y2="398" stroke="#cbb99a" stroke-width="2" opacity="0.5"/>
<line x1="1072" y1="338" x2="630" y2="398" stroke="#cbb99a" stroke-width="2" opacity="0.5"/>
<polygon points="600,398 612,406 624,398 612,414" fill="#8b2d2d"/>

<!-- outcome bar -->
<rect x="230" y="430" width="740" height="150" rx="16" fill="#fbf1f1" stroke="#8b2d2d" stroke-width="2"/>
<text x="600" y="474" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">COUNT DOCUMENTED "CORRECT" — SPONGE STILL RETAINED</text>
<text x="600" y="512" text-anchor="middle" font-size="14" fill="#5c5c5c">In the large majority of retained-item cases, the final count was called correct.</text>
<text x="600" y="540" text-anchor="middle" font-size="14" fill="#5c5c5c">The manual count is the foundation; it is not, by itself, a sufficient safeguard.</text>
</svg>
