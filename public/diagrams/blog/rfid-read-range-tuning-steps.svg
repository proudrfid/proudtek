<text x="840" y="234" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Standoff</text>
<text x="840" y="272" text-anchor="middle" font-size="14" fill="#5c5c5c">Add a spacer</text>
<text x="840" y="294" text-anchor="middle" font-size="14.5" font-weight="800" fill="#2c5454">3–5 mm</text>
<text x="840" y="316" text-anchor="middle" font-size="14" fill="#5c5c5c">off metal / liquid</text>
<rect x="790" y="420" width="100" height="30" rx="15" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.2"/>
<text x="840" y="440" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">low $</text>

<!-- card 5 -->
<rect x="960" y="140" width="176" height="326" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="960" y="140" width="176" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="1048" cy="186" r="18" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="1048" y="193" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">5</text>
<text x="1048" y="234" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Reference tag</text>
<text x="1048" y="272" text-anchor="middle" font-size="14" fill="#5c5c5c">Known-good tag</text>
<text x="1048" y="294" text-anchor="middle" font-size="14" fill="#5c5c5c">at read position</text>
<text x="1048" y="316" text-anchor="middle" font-size="13" fill="#5c5c5c">isolates tag vs env.</text>
<rect x="998" y="420" width="100" height="30" rx="15" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.2"/>
<text x="1048" y="440" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f6f3a">free</text>

<line x1="80" y1="502" x2="1042" y2="502" stroke="#c4b896" stroke-width="3"/><polygon points="1042,494 1060,502 1042,510" fill="#c4b896"/>
<text x="90" y="492" font-size="13" font-weight="700" fill="#8a7550">cheapest fixes</text>
<text x="1030" y="492" text-anchor="end" font-size="13" font-weight="700" fill="#8a7550">only then buy hardware</text>
</svg>
