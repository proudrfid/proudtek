<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="vmTitle vmDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="vmTitle">EAS retrofit paths for the four incumbents</title>
  <desc id="vmDesc">Four vendor cards. Sensormatic, the AM leader: its Synergy overlay adds UHF readers onto existing AM pedestals for roughly 1,500 to 4,000 dollars per gate as an add-on, versus 8,000 to 15,000 dollars for full replacement. Checkpoint, RF at 8.2 megahertz: EVOLVE iRange plus HALO RFID, with a factory Source Tagging Service. Nedap Retail, RFID-only EAS: the !D Top, !D Cloud and iSense family needs no dual tag, saving 0.04 to 0.08 dollars per item. Tyco and Hytek, hybrid RF plus UHF second-tier systems where integration depth varies. Bottom: at self-checkout, scan-avoidance shrink runs 1.5 to 3 percent without RFID and falls to 0.3 to 0.6 percent with an RFID-EAS hybrid.</desc>
  <defs>
    <radialGradient id="vmBg" cx="50%" cy="22%" r="88%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="vmArrow" markerWidth="10" markerHeight="10" refX="3" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#177a92"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#vmBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="2.5" fill="#6d5a3a">EAS RETROFIT · FOUR INCUMBENTS, FOUR PATHS</text>
  <text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">the brand already on your doors sets the retrofit math</text>

  <!-- Card A: Sensormatic -->
  <rect x="60" y="104" width="530" height="150" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="84" y="146" font-size="21" font-weight="800" fill="#291c0e">Sensormatic</text>
  <rect x="428" y="122" width="140" height="30" rx="15" fill="#eef1f4" stroke="#4a5568" stroke-width="1.3"/>
  <text x="498" y="142" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a5568">AM leader</text>
  <text x="84" y="180" font-size="14.5" fill="#4f4f4f">Synergy overlay — UHF onto AM pedestals</text>
  <rect x="80" y="198" width="490" height="38" rx="9" fill="#f3ede2"/>
  <text x="100" y="223" font-size="15.5" font-weight="800" fill="#291c0e">$1.5K–4K add-on</text>
  <text x="286" y="223" font-size="14.5" fill="#6d5a3a">vs  $8K–15K full replace</text>

  <!-- Card B: Checkpoint -->
  <rect x="610" y="104" width="530" height="150" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="634" y="146" font-size="21" font-weight="800" fill="#291c0e">Checkpoint</text>
  <rect x="978" y="122" width="140" height="30" rx="15" fill="#e9f3f3" stroke="#3d6b6b" stroke-width="1.3"/>
  <text x="1048" y="142" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3d6b6b">RF · 8.2 MHz</text>
  <text x="634" y="180" font-size="14.5" fill="#4f4f4f">EVOLVE iRange + HALO RFID at the gate</text>
  <rect x="630" y="198" width="490" height="38" rx="9" fill="#f3ede2"/>
  <text x="650" y="223" font-size="15" font-weight="700" fill="#291c0e">Source Tagging Service — factory RFID + RF labels</text>

  <!-- Card C: Nedap -->
  <rect x="60" y="274" width="530" height="150" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="84" y="316" font-size="21" font-weight="800" fill="#291c0e">Nedap Retail</text>
  <rect x="448" y="292" width="120" height="30" rx="15" fill="#e9f2ec" stroke="#2d6a4f" stroke-width="1.3"/>
  <text x="508" y="312" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2d6a4f">RFID-only</text>
  <text x="84" y="350" font-size="14.5" fill="#4f4f4f">!D Top · !D Cloud · iSense — chip is the event</text>
  <rect x="80" y="368" width="490" height="38" rx="9" fill="#f3ede2"/>
  <text x="100" y="393" font-size="15" font-weight="700" fill="#291c0e">no dual tag — saves</text>
  <text x="300" y="393" font-size="15.5" font-weight="800" fill="#2d6a4f">$0.04–0.08/item</text>

  <!-- Card D: Tyco / Hytek -->
  <rect x="610" y="274" width="530" height="150" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="634" y="316" font-size="21" font-weight="800" fill="#291c0e">Tyco / Hytek</text>
  <rect x="946" y="292" width="172" height="30" rx="15" fill="#f6efe0" stroke="#c39a5f" stroke-width="1.3"/>
  <text x="1032" y="312" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a6d3b">hybrid RF + UHF</text>
  <text x="634" y="350" font-size="14.5" fill="#4f4f4f">second-tier · regional department chains</text>
  <rect x="630" y="368" width="490" height="38" rx="9" fill="#f3ede2"/>
  <text x="650" y="393" font-size="14.5" fill="#291c0e">integration depth varies (Manhattan / SAP / Oracle)</text>

  <!-- Self-checkout strip -->
  <rect x="60" y="470" width="1080" height="126" rx="16" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="2"/>
  <text x="104" y="516" font-size="14" font-weight="800" letter-spacing="1.2" fill="#177a92">SELF-CHECKOUT</text>
  <text x="104" y="548" font-size="15" fill="#4f4f4f">scan-avoidance shrink,</text>
  <text x="104" y="568" font-size="15" fill="#4f4f4f">per lane volume</text>
  <rect x="520" y="500" width="180" height="66" rx="12" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
  <text x="610" y="530" text-anchor="middle" font-size="26" font-weight="800" fill="#8b2d2d">1.5–3%</text>
  <text x="610" y="552" text-anchor="middle" font-size="13" fill="#7a4242">without RFID</text>
  <line x1="712" y1="533" x2="778" y2="533" stroke="#177a92" stroke-width="4" stroke-linecap="round" marker-end="url(#vmArrow)"/>
  <rect x="790" y="500" width="200" height="66" rx="12" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="1.5"/>
  <text x="890" y="530" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6f3a">0.3–0.6%</text>
  <text x="890" y="552" text-anchor="middle" font-size="13" fill="#3f6b4e">with RFID-EAS hybrid</text>
</svg>
