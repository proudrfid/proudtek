<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Which tag materials the major laundry operators standardise on</title>
<desc id="d">A usage matrix of five operator groups against three materials. Cintas: PPS primary, silicone secondary, textile none. UniFirst: PPS and silicone primary, textile none. Aramark/Vestis: PPS and silicone primary, textile secondary. Sodexo and hotel chains: silicone and textile primary, PPS secondary. European operators (Elis, Berendsen, Lindström): PPS primary, silicone and textile none. PPS carries the heavy industrial load, silicone the comfort garments, textile the light hospitality linens.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHO DEPLOYS WHAT</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The big operators have converged on a few material patterns.</text>

<!-- column headers -->
<text x="560" y="182" text-anchor="middle" font-size="14" font-weight="800" fill="#3f4657">PPS</text>
<text x="760" y="182" text-anchor="middle" font-size="14" font-weight="800" fill="#2c5454">Silicone</text>
<text x="960" y="182" text-anchor="middle" font-size="14" font-weight="800" fill="#a07d43">Textile</text>
<line x1="90" y1="192" x2="1030" y2="192" stroke="#e6dfd2" stroke-width="1.5"/>

<!-- Row 1 Cintas -->
<text x="96" y="222" font-size="13.5" font-weight="700" fill="#291c0e">Cintas</text>
<rect x="500" y="200" width="120" height="34" rx="8" fill="#4a5568"/><text x="560" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">primary</text>
<rect x="700" y="200" width="120" height="34" rx="8" fill="#d7e8e8"/><text x="760" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">secondary</text>
<rect x="900" y="200" width="120" height="34" rx="8" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.3" stroke-dasharray="4 3"/><text x="960" y="221" text-anchor="middle" font-size="12" fill="#a8a8a8">—</text>

<!-- Row 2 UniFirst -->
<text x="96" y="272" font-size="13.5" font-weight="700" fill="#291c0e">UniFirst</text>
<rect x="500" y="250" width="120" height="34" rx="8" fill="#4a5568"/><text x="560" y="271" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">primary</text>
<rect x="700" y="250" width="120" height="34" rx="8" fill="#3d6b6b"/><text x="760" y="271" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">primary</text>
<rect x="900" y="250" width="120" height="34" rx="8" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.3" stroke-dasharray="4 3"/><text x="960" y="271" text-anchor="middle" font-size="12" fill="#a8a8a8">—</text>

<!-- Row 3 Aramark/Vestis -->
<text x="96" y="322" font-size="13.5" font-weight="700" fill="#291c0e">Aramark / Vestis</text>
<rect x="500" y="300" width="120" height="34" rx="8" fill="#4a5568"/><text x="560" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">primary</text>
<rect x="700" y="300" width="120" height="34" rx="8" fill="#3d6b6b"/><text x="760" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">primary</text>
<rect x="900" y="300" width="120" height="34" rx="8" fill="#f1e4cc"/><text x="960" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="#a07d43">secondary</text>

<!-- Row 4 Sodexo + hotels -->
<text x="96" y="372" font-size="13.5" font-weight="700" fill="#291c0e">Sodexo + hotel chains</text>
<rect x="500" y="350" width="120" height="34" rx="8" fill="#dbe0e6"/><text x="560" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#3f4657">secondary</text>
<rect x="700" y="350" width="120" height="34" rx="8" fill="#3d6b6b"/><text x="760" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">primary</text>
<rect x="900" y="350" width="120" height="34" rx="8" fill="#c39a5f"/><text x="960" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">primary</text>

<!-- Row 5 European -->
<text x="96" y="422" font-size="13.5" font-weight="700" fill="#291c0e">European (Elis, Berendsen, Lindström)</text>
<rect x="500" y="400" width="120" height="34" rx="8" fill="#4a5568"/><text x="560" y="421" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">primary</text>
<rect x="700" y="400" width="120" height="34" rx="8" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.3" stroke-dasharray="4 3"/><text x="760" y="421" text-anchor="middle" font-size="12" fill="#a8a8a8">—</text>
<rect x="900" y="400" width="120" height="34" rx="8" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.3" stroke-dasharray="4 3"/><text x="960" y="421" text-anchor="middle" font-size="12" fill="#a8a8a8">—</text>

<text x="600" y="474" text-anchor="middle" font-size="12.5" fill="#8a8a8a">solid = primary material · tint = secondary · dashed — = not used</text>
<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">PPS carries the heavy industrial load; silicone the comfort garments; textile the light linens.</text>
</svg>
