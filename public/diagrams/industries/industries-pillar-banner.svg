<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ibTitle ibDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ibTitle">RFID and NFC hardware organized by industry</title>
  <desc id="ibDesc">Six outcome families — Retail &amp; Brand Protection, Hospitality &amp; Experience, Healthcare &amp; Life Sciences, Industrial &amp; Logistics, Public &amp; Cultural, and Primary Production — each shown as a card with its icon, the sectors it covers, the RFID or NFC approach it uses, and the governing mandate or chip. Footer notes 20 industry verticals, 10-plus active mandates, 95 to 99 percent inventory accuracy and single-vendor procurement.</desc>

  <defs>
    <radialGradient id="ibGlow" cx="50%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#ibGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="62" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="2.5" fill="#6d5a3a">RFID &amp; NFC HARDWARE — ORGANIZED BY INDUSTRY</text>

