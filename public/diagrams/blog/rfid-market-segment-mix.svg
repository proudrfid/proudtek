<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Four RFID market segments and the different role each one plays</title>
<desc id="d">A two-by-two breakdown of the RFID market. UHF passive tags are the largest unit-volume segment at 60 to 70 percent of global tag demand, driven by apparel, footwear and logistics. HF and NFC tags are the fastest-growing segment by revenue, driven by authentication, Digital Product Passport and consumer engagement. Active RFID and RTLS grow at 15 to 18 percent CAGR in healthcare and industrial IoT. Reader and infrastructure revenue grows at 12 to 15 percent CAGR.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MARKET COMPOSITION · WHERE GROWTH SITS</text>
<text x="600" y="99" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">Four segments, four different jobs</text>
<text x="600" y="131" text-anchor="middle" font-size="16" fill="#4f4f4f">One market, four segments — a volume engine, a revenue engine, two steady climbers.</text>
<rect x="90" y="170" width="500" height="182" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<rect x="90" y="170" width="500" height="8" rx="4" fill="#3d6b6b"/>
<text x="118" y="214" font-size="17" font-weight="700" fill="#291c0e">UHF passive tags</text>
<text x="118" y="274" font-size="38" font-weight="800" fill="#2c5454">60–70%</text>
<text x="118" y="302" font-size="14" fill="#5c5c5c">of global tag unit volume</text>
<text x="118" y="332" font-size="13.5" fill="#4f4f4f">Apparel, footwear, logistics — the volume engine.</text>
<rect x="610" y="170" width="500" height="182" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<rect x="610" y="170" width="500" height="8" rx="4" fill="#c39a5f"/>
<text x="638" y="214" font-size="17" font-weight="700" fill="#291c0e">HF / NFC tags</text>
<text x="638" y="270" font-size="28" font-weight="800" fill="#6d5a3a">Fastest-growing</text>
<text x="638" y="298" font-size="14" fill="#5c5c5c">segment by revenue percentage</text>
<text x="638" y="332" font-size="13.5" fill="#4f4f4f">Authentication, DPP, consumer engagement.</text>
<rect x="90" y="372" width="500" height="182" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<rect x="90" y="372" width="500" height="8" rx="4" fill="#4a5568"/>
<text x="118" y="416" font-size="17" font-weight="700" fill="#291c0e">Active RFID &amp; RTLS</text>
<text x="118" y="476" font-size="38" font-weight="800" fill="#4a5568">15–18%</text>
<text x="118" y="504" font-size="14" fill="#5c5c5c">CAGR through 2030</text>
<text x="118" y="534" font-size="13.5" fill="#4f4f4f">Healthcare asset tracking, industrial IoT.</text>
<rect x="610" y="372" width="500" height="182" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<rect x="610" y="372" width="500" height="8" rx="4" fill="#3d6b6b"/>
<text x="638" y="416" font-size="17" font-weight="700" fill="#291c0e">Readers &amp; infrastructure</text>
<text x="638" y="476" font-size="38" font-weight="800" fill="#2c5454">12–15%</text>
<text x="638" y="504" font-size="14" fill="#5c5c5c">CAGR — portals, handhelds, middleware</text>
<text x="638" y="534" font-size="13.5" fill="#4f4f4f">New deployments pull hardware and software.</text>
</svg>
