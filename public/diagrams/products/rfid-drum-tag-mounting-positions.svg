<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">RFID drum tag mounting positions on a 200-litre steel drum and an IBC tote</title>
  <desc id="d">Annotated front view of a 200-litre steel drum showing three proven RFID tag positions: A on the top head inside the chime, where overhead readers see the tag at any rotation and the chime shelters it from drum-clamp jaws; B on the side wall in the recessed band between the two rolling hoops, which stand proud of the wall and absorb rolling abrasion; C threaded into the 2-inch NPT bung for closed-head drums that cannot be drilled or welded. Two red cross markers show where not to mount: on the rolling hoops themselves and across the vertical body weld seam, where the housing cannot sit flush. A side panel shows an IBC tote with the tag band-strapped to the top cage rail beside the label plate rather than on the swappable bottle, and a second panel contrasts read geometry: a side-mounted tag radiates toward portal antennas flanking the lane, while a head-mounted tag reads from overhead at any rotation. Caption: weld-stud and rivet mounts survive the reconditioner; adhesive suits new-drum tagging and plastic drums.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c39a5f"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE THE TAG LIVES ON THE DRUM</text>
  <text x="600" y="96" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">Mounting positions that survive drum handling</text>

  <!-- ============ steel drum, front view ============ -->
  <!-- body -->
  <rect x="130" y="185" width="260" height="390" fill="#e7eaef" stroke="#4a5568" stroke-width="2.5"/>
  <!-- vertical body weld seam (neutral) -->
  <line x1="330" y1="205" x2="330" y2="560" stroke="#4a5568" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.7"/>
  <!-- top head -->
  <ellipse cx="260" cy="185" rx="130" ry="24" fill="#f0f2f5" stroke="#4a5568" stroke-width="2.5"/>
  <path d="M130 197 A130 24 0 0 0 390 197" fill="none" stroke="#4a5568" stroke-width="1.6" opacity="0.65"/>
  <!-- bungs on the head -->
  <ellipse cx="215" cy="181" rx="14" ry="7" fill="#cdd3dd" stroke="#4a5568" stroke-width="1.6"/>
  <ellipse cx="312" cy="190" rx="9" ry="5" fill="#cdd3dd" stroke="#4a5568" stroke-width="1.4"/>
  <!-- rolling hoops (stand proud of the wall) -->
  <rect x="122" y="300" width="276" height="16" rx="7" fill="#cdd3dd" stroke="#4a5568" stroke-width="1.8"/>
  <rect x="122" y="430" width="276" height="16" rx="7" fill="#cdd3dd" stroke="#4a5568" stroke-width="1.8"/>
  <!-- bottom chime -->
  <rect x="126" y="564" width="268" height="13" rx="6" fill="#cdd3dd" stroke="#4a5568" stroke-width="1.8"/>

  <!-- tag bodies at positions A and B -->
  <rect x="336" y="158" width="30" height="13" rx="3" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.2"/>
  <rect x="243" y="362" width="34" height="16" rx="3" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.2"/>

  <!-- position markers -->
  <circle cx="351" cy="140" r="14" fill="#c39a5f"/>
  <text x="351" y="145" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">A</text>
  <circle cx="260" cy="345" r="14" fill="#c39a5f"/>
  <text x="260" y="350" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">B</text>
  <circle cx="182" cy="150" r="14" fill="#c39a5f"/>
  <text x="182" y="155" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">C</text>
  <line x1="193" y1="159" x2="208" y2="176" stroke="#c39a5f" stroke-width="2"/>

  <!-- red X: on the hoop -->
  <line x1="150" y1="298" x2="172" y2="318" stroke="#8b2d2d" stroke-width="3.5"/>
  <line x1="172" y1="298" x2="150" y2="318" stroke="#8b2d2d" stroke-width="3.5"/>
  <!-- red X: across the weld seam -->
  <line x1="319" y1="382" x2="341" y2="402" stroke="#8b2d2d" stroke-width="3.5"/>
  <line x1="341" y1="382" x2="319" y2="402" stroke="#8b2d2d" stroke-width="3.5"/>

  <!-- ============ callout column ============ -->
  <line x1="366" y1="146" x2="448" y2="186" stroke="#c39a5f" stroke-width="1.6"/>
  <text x="456" y="184" font-size="15" font-weight="700" fill="#291c0e">A · Top head, inside the chime</text>
  <text x="456" y="206" font-size="12.5" fill="#5c5c5c">Overhead readers see it at any rotation;</text>
  <text x="456" y="223" font-size="12.5" fill="#5c5c5c">the chime shelters it from clamp jaws.</text>

  <line x1="276" y1="345" x2="448" y2="290" stroke="#c39a5f" stroke-width="1.6"/>
  <text x="456" y="288" font-size="15" font-weight="700" fill="#291c0e">B · Side wall, between the hoops</text>
  <text x="456" y="310" font-size="12.5" fill="#5c5c5c">The hoops stand proud of the wall and</text>
  <text x="456" y="327" font-size="12.5" fill="#5c5c5c">take the rolling abrasion. The tag doesn't.</text>

  <line x1="188" y1="136" x2="240" y2="112" stroke="#c39a5f" stroke-width="1.6"/>
  <text x="456" y="392" font-size="15" font-weight="700" fill="#291c0e">C · Bung-cap, in the 2″ NPT bung</text>
  <text x="456" y="414" font-size="12.5" fill="#5c5c5c">For closed-head drums nobody may drill</text>
  <text x="456" y="431" font-size="12.5" fill="#5c5c5c">or weld — identity rides the closure.</text>
  <line x1="246" y1="110" x2="452" y2="386" stroke="#c39a5f" stroke-width="1.2" opacity="0.55"/>

  <rect x="448" y="470" width="270" height="118" rx="12" fill="#fdf4f4" stroke="#8b2d2d" stroke-width="1.6"/>
  <text x="464" y="500" font-size="14" font-weight="800" fill="#8b2d2d">Not on the hoops. Not on the weld.</text>
  <text x="464" y="524" font-size="12.5" fill="#5c5c5c">Hoops grind on rails and floors; a</text>
  <text x="464" y="541" font-size="12.5" fill="#5c5c5c">weld bead stops the housing from</text>
  <text x="464" y="558" font-size="12.5" fill="#5c5c5c">sitting flush on the curved wall.</text>

  <!-- ============ right panel 1: IBC ============ -->
  <rect x="750" y="140" width="400" height="215" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="770" y="172" font-size="15" font-weight="700" fill="#291c0e">IBC totes: strap to the cage, not the bottle</text>
  <!-- cage -->
  <rect x="782" y="196" width="150" height="112" fill="none" stroke="#4a5568" stroke-width="2"/>
  <line x1="820" y1="196" x2="820" y2="308" stroke="#4a5568" stroke-width="1.3"/>
  <line x1="858" y1="196" x2="858" y2="308" stroke="#4a5568" stroke-width="1.3"/>
  <line x1="896" y1="196" x2="896" y2="308" stroke="#4a5568" stroke-width="1.3"/>
  <line x1="782" y1="233" x2="932" y2="233" stroke="#4a5568" stroke-width="1.3"/>
  <line x1="782" y1="270" x2="932" y2="270" stroke="#4a5568" stroke-width="1.3"/>
  <rect x="790" y="204" width="134" height="96" fill="#f0f2f5" opacity="0.75"/>
  <rect x="778" y="308" width="158" height="14" fill="#cdd3dd" stroke="#4a5568" stroke-width="1.6"/>
  <!-- tag banded to top rail -->
  <rect x="842" y="188" width="36" height="15" rx="3" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.2"/>
  <line x1="848" y1="188" x2="848" y2="203" stroke="#6d5a3a" stroke-width="1.4"/>
  <line x1="872" y1="188" x2="872" y2="203" stroke="#6d5a3a" stroke-width="1.4"/>
  <text x="952" y="222" font-size="12.5" fill="#5c5c5c">Banding strap on the top cage</text>
  <text x="952" y="239" font-size="12.5" fill="#5c5c5c">rail, beside the label plate.</text>
  <text x="952" y="256" font-size="12.5" fill="#5c5c5c">The bottle flexes — and gets</text>
  <text x="952" y="273" font-size="12.5" fill="#5c5c5c">swapped at rebottling. The</text>
  <text x="952" y="290" font-size="12.5" fill="#5c5c5c">cage is the asset that returns.</text>

  <!-- ============ right panel 2: read geometry ============ -->
  <rect x="750" y="378" width="400" height="210" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="770" y="410" font-size="15" font-weight="700" fill="#291c0e">Which way does the tag talk?</text>
  <!-- left mini: side tag to portal -->
  <rect x="782" y="440" width="70" height="96" rx="8" fill="#e7eaef" stroke="#4a5568" stroke-width="1.8"/>
  <circle cx="852" cy="488" r="6" fill="#c39a5f"/>
  <path d="M866 476 A18 18 0 0 1 866 500" fill="none" stroke="#3d6b6b" stroke-width="2"/>
  <path d="M876 468 A30 30 0 0 1 876 508" fill="none" stroke="#3d6b6b" stroke-width="2"/>
  <rect x="898" y="436" width="10" height="104" rx="4" fill="#4a5568"/>
  <text x="845" y="562" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Side tag: reads via portal</text>
  <text x="845" y="579" text-anchor="middle" font-size="12.5" fill="#5c5c5c">antennas flanking the lane</text>
  <!-- right mini: head tag to overhead -->
  <rect x="980" y="466" width="70" height="70" rx="8" fill="#e7eaef" stroke="#4a5568" stroke-width="1.8"/>
  <circle cx="1015" cy="466" r="6" fill="#c39a5f"/>
  <path d="M1003 452 A18 18 0 0 1 1027 452" fill="none" stroke="#3d6b6b" stroke-width="2"/>
  <path d="M996 442 A30 30 0 0 1 1034 442" fill="none" stroke="#3d6b6b" stroke-width="2"/>
  <rect x="972" y="420" width="86" height="10" rx="4" fill="#4a5568"/>
  <text x="1015" y="562" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Head tag: overhead read,</text>
  <text x="1015" y="579" text-anchor="middle" font-size="12.5" fill="#5c5c5c">any drum rotation</text>

  <text x="600" y="634" text-anchor="middle" font-size="13" fill="#5c5c5c">Weld-stud and rivet mounts survive the reconditioner; adhesive suits new-drum tagging and plastic drums.</text>
</svg>
