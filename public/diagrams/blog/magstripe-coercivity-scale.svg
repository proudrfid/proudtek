<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A coercivity scale in oersteds showing a phone's field bracketing and exceeding consumer HiCo magstripe</title>
<desc id="d">A horizontal scale measured in oersteds. LoCo magstripe is marked at 300 oersteds, described as cheap and erasing easily. Consumer HiCo is marked at 2750 oersteds, the standard hotel keycard. Military-spec HiCo is marked at 4000 oersteds but still loses on direct contact. A shaded red band spanning 2500 to 3500 oersteds represents a phone magnet field, which overlaps and exceeds the 2750 oersted HiCo rating.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MAGNETIC COERCIVITY · MEASURED IN OERSTEDS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Any field above a stripe's coercivity rewrites it — and a modern phone clears every consumer rating.</text>

<!-- phone field band -->
<rect x="590" y="262" width="192" height="190" rx="8" fill="#f8ecec" stroke="#8b2d2d" stroke-width="2" stroke-dasharray="6 5"/>
<text x="686" y="228" text-anchor="middle" font-size="15" font-weight="800" fill="#8b2d2d">PHONE MAGNET FIELD</text>
<text x="686" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#8b2d2d">2500-3500 Oe</text>

<!-- axis -->
<line x1="110" y1="452" x2="1074" y2="452" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="1074,445 1092,452 1074,459" fill="#291c0e"/>
<text x="110" y="476" text-anchor="middle" font-size="12.5" fill="#9a8f7c">0</text>
<text x="1070" y="476" text-anchor="middle" font-size="12.5" fill="#9a8f7c">5,000 Oe</text>

<!-- LoCo 300 -->
<line x1="168" y1="452" x2="168" y2="406" stroke="#6d5a3a" stroke-width="2"/>
<circle cx="168" cy="406" r="6" fill="#6d5a3a"/>
<text x="168" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">LoCo · 300 Oe</text>
<text x="168" y="374" text-anchor="middle" font-size="12.5" fill="#5c5c5c">cheap, erases easily</text>

<!-- Mil-spec 4000 -->
<line x1="878" y1="452" x2="878" y2="374" stroke="#6d5a3a" stroke-width="2"/>
<circle cx="878" cy="374" r="6" fill="#6d5a3a"/>
<text x="878" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Mil-spec HiCo · 4000 Oe</text>
<text x="878" y="342" text-anchor="middle" font-size="12.5" fill="#8b2d2d">still loses on direct contact</text>

<!-- HiCo 2750 (below axis, inside band) -->
<line x1="638" y1="452" x2="638" y2="474" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="638" cy="452" r="7" fill="#3d6b6b"/>
<text x="638" y="492" text-anchor="middle" font-size="13.5" font-weight="700" fill="#234a4a">HiCo · 2750 Oe</text>
<text x="638" y="510" text-anchor="middle" font-size="12.5" fill="#5c5c5c">standard hotel keycard</text>

<text x="600" y="566" text-anchor="middle" font-size="14.5" fill="#4f4f4f">A phone's field brackets and tops consumer HiCo — which is why no "better stripe" ends the problem.</text>
</svg>
