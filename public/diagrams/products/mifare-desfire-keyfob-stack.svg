<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">A smartcard stack in a keyring fob — DESFire's protocol layers</title>
  <desc id="d">Layer diagram: ISO/IEC 14443-3 Type A anticollision at 13.56 MHz, ISO/IEC 14443-4 T=CL block framing, ISO/IEC 7816-4 APDU commands with the DESFire native command set, AES-128 per NIST FIPS 197 with CMAC per SP 800-38B on every command, on Common Criteria EAL5+ silicon.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">The whole smartcard stack, hanging on a keyring</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Same silicon discipline as the DESFire card — teardrop packaging</text>
  <g transform="translate(70,140)" font-family="Helvetica, Arial, sans-serif" font-size="14">
    <rect x="0" y="0" width="660" height="76" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="30" font-family="Georgia, serif" font-size="16" fill="#291c0e">Radio — ISO/IEC 14443-3 Type A</text>
    <text x="24" y="58" fill="#2c5454">anticollision at 13.56 MHz</text>
    <rect x="0" y="90" width="660" height="76" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="120" font-family="Georgia, serif" font-size="16" fill="#2c5454">Framing — ISO/IEC 14443-4 T=CL</text>
    <text x="24" y="148" fill="#2c5454">block transfer, the smartcard transport</text>
    <rect x="0" y="180" width="660" height="76" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="210" font-family="Georgia, serif" font-size="16" fill="#2c5454">Commands — ISO/IEC 7816-4 APDU</text>
    <text x="24" y="238" fill="#2c5454">DESFire native set: CreateApplication, SelectApplication, files</text>
    <rect x="0" y="270" width="660" height="76" rx="12" fill="#2c5454"/>
    <text x="24" y="300" font-family="Georgia, serif" font-size="16" fill="#f8f6f1">Crypto — AES-128 (NIST FIPS 197)</text>
    <text x="24" y="328" fill="#dfe9e7">CMAC per NIST SP 800-38B on every command</text>
    <rect x="0" y="360" width="660" height="66" rx="12" fill="#fdf3e3" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="388" font-family="Georgia, serif" font-size="15" fill="#291c0e">Silicon — Common Criteria EAL5+ (BSI TR-02102 aligned)</text>
  </g>
  <g transform="translate(790,140)">
    <rect x="0" y="0" width="340" height="426" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="42" font-family="Georgia, serif" font-size="18" fill="#2c5454">Why a fob, not a card</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">
      <text x="24" y="80">Lives on the keyring — never left</text>
      <text x="24" y="102">in a jacket at the gym</text>
      <text x="24" y="136">ABS or silicone housings, 10+</text>
      <text x="24" y="158">pantone colours, keyring-moulded</text>
      <text x="24" y="192">EV3 for greenfield 2026 estates,</text>
      <text x="24" y="214">EV2 for legacy migration</text>
    </g>
    <line x1="24" y1="240" x2="316" y2="240" stroke="#d8cdb8" stroke-width="1.5"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">
      <text x="24" y="272">Reader estates: HID iCLASS SE /</text>
      <text x="24" y="294">multiCLASS SE / Signo carry the</text>
      <text x="24" y="316">Corporate 1000 or UUID payload</text>
      <text x="24" y="350">Dual-application builds: access +</text>
      <text x="24" y="372">transit in one fob</text>
      <text x="24" y="404">MOQ 200 stock ABS · 300 personalised</text>
    </g>
  </g>
</svg>
