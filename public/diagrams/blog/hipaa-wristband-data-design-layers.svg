<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ddT ddD" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <title id="ddT">Three layers of HIPAA-safe wristband data design</title>
      <desc id="ddD">Three stacked layers. On the chip: only an opaque pseudonymous UUID, made tamper-evident by NTAG 424 DNA secure messaging that signs each scan with a rotating cryptographic challenge, so cloned bands fail authentication. On the wire: wristband-to-EHR queries use TLS 1.2 or higher with server-side lookup and no plaintext patient identifiers. In the EHR: clinicians authenticate before the scan, and the wristband ID plus clinician identity together produce the audit-log entry.</desc>
      <defs>
        <radialGradient id="ddBg" cx="50%" cy="16%" r="92%"><stop offset="0%" stop-color="#f8f2e6"/><stop offset="100%" stop-color="#f1ece0"/></radialGradient>
        <marker id="ddArrow" markerWidth="12" markerHeight="12" refX="4" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c39a5f"/></marker>
      </defs>
      <rect width="1200" height="675" fill="url(#ddBg)"/>
      <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
      <text x="600" y="60" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="2" fill="#6d5a3a">THREE PLACES THE DATA HAS TO BE SAFE</text>

      <!-- Layer 1: the chip -->
      <rect x="70" y="92" width="1060" height="140" rx="16" fill="#fbf5ea" stroke="#e4c98f" stroke-width="2.5"/>
      <rect x="94" y="120" width="150" height="84" rx="10" fill="#efe0bf" stroke="#c39a5f" stroke-width="2"/>
      <rect x="130" y="146" width="78" height="32" rx="4" fill="#c39a5f"/>
      <text x="169" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,monospace">UUID</text>
      <text x="280" y="138" font-size="20" font-weight="800" letter-spacing="1" fill="#6d5a3a">ON THE CHIP</text>
      <text x="280" y="170" font-size="17.5" fill="#291c0e" font-weight="600">Pseudonymous by design — a random UUID, never the patient's MRN.</text>
      <text x="280" y="198" font-size="16" fill="#4f4f4f">Tamper-evident: NTAG 424 DNA signs each scan with a rotating challenge, so clones fail auth.</text>

      <line x1="600" y1="234" x2="600" y2="268" stroke="#c39a5f" stroke-width="3" marker-end="url(#ddArrow)"/>

      <!-- Layer 2: the wire -->
      <rect x="70" y="272" width="1060" height="120" rx="16" fill="#eef6f7" stroke="#a9cdd0" stroke-width="2.5"/>
      <g transform="translate(118,332)"><path d="M-24 0 a24 24 0 0 1 48 0" fill="none" stroke="#3d6b6b" stroke-width="5"/><rect x="-30" y="0" width="60" height="34" rx="7" fill="#3d6b6b"/><rect x="-4" y="12" width="8" height="14" rx="4" fill="#eef6f7"/></g>
      <text x="280" y="316" font-size="20" font-weight="800" letter-spacing="1" fill="#2c5454">ON THE WIRE</text>
      <text x="280" y="348" font-size="17.5" fill="#18343e" font-weight="600">TLS 1.2+ with server-side patient lookup.</text>
      <text x="280" y="376" font-size="16" fill="#3a4a52">No plain-text patient identifiers ever transit the network.</text>

      <line x1="600" y1="394" x2="600" y2="428" stroke="#c39a5f" stroke-width="3" marker-end="url(#ddArrow)"/>

      <!-- Layer 3: the EHR -->
      <rect x="70" y="432" width="1060" height="130" rx="16" fill="#eaf1ec" stroke="#a9c8b2" stroke-width="2.5"/>
      <g transform="translate(118,497)"><circle r="30" fill="#2d6a4f"/><circle cy="-6" r="10" fill="#eaf1ec"/><path d="M-16 16 a16 18 0 0 1 32 0" fill="#eaf1ec"/></g>
      <text x="280" y="476" font-size="20" font-weight="800" letter-spacing="1" fill="#1b4332">IN THE EHR</text>
      <text x="280" y="508" font-size="17.5" fill="#173a2b" font-weight="600">Per-user access: the clinician authenticates before the scan.</text>
      <text x="280" y="536" font-size="16" fill="#3c5c46">Wristband ID + clinician identity together become one audit-log entry.</text>

      <rect x="70" y="586" width="1060" height="42" rx="12" fill="#f4efe4"/>
      <text x="600" y="613" text-anchor="middle" font-size="15" font-style="italic" fill="#6d5a3a">The UUID only becomes a person after a valid login. Steal the number, keep the mystery.</text>
    </svg>
