<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID tag lifespan in years by product type</title>
<desc id="d">A years-in-service scale from 0 to 30 with range bars for six tag types. Paper labels last 1 to 3 years, silicone wristbands 2 to 5, PVC cards 3 to 5, synthetic PET or PP labels 3 to 7, rugged industrial tags 10 to 20-plus, and embedded tags 10 to 30. A green marker notes the silicon chip itself lasts 50-plus years, off the right edge of the chart. A separate note explains laundry tags are measured in wash cycles rather than years: PPS 300 to 500, textile 200 to 300, silicone 50 to 100.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">LIFESPAN BY TAG TYPE</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Years in service — set by the housing, not the chip that outlasts them all.</text>

<!-- axis -->
<line x1="260" y1="150" x2="260" y2="474" stroke="#c9c1b2" stroke-width="2"/>
<line x1="260" y1="474" x2="1120" y2="474" stroke="#c9c1b2" stroke-width="2"/>
<line x1="543" y1="150" x2="543" y2="474" stroke="#efe7d6" stroke-width="1.4"/>
<line x1="826" y1="150" x2="826" y2="474" stroke="#efe7d6" stroke-width="1.4"/>
<text x="260" y="497" text-anchor="middle" font-size="12.5" fill="#8a8a8a">0</text>
<text x="543" y="497" text-anchor="middle" font-size="12.5" fill="#8a8a8a">10</text>
<text x="826" y="497" text-anchor="middle" font-size="12.5" fill="#8a8a8a">20</text>
<text x="1110" y="497" text-anchor="middle" font-size="12.5" fill="#8a8a8a">30</text>
<text x="690" y="518" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.5" fill="#8a8a8a">YEARS IN SERVICE</text>

<!-- rows -->
<text x="240" y="185" text-anchor="end" font-size="14.5" font-weight="700" fill="#33404f">Paper label</text>
<rect x="288" y="170" width="57" height="30" rx="5" fill="#dfe3e9" stroke="#9aa3ad" stroke-width="1.6"/>
<text x="357" y="190" font-size="13" fill="#5c5c5c">1-3 yr</text>

<text x="240" y="240" text-anchor="end" font-size="14.5" font-weight="700" fill="#33404f">Silicone band</text>
<rect x="317" y="225" width="85" height="30" rx="5" fill="#dfe3e9" stroke="#9aa3ad" stroke-width="1.6"/>
<text x="414" y="245" font-size="13" fill="#5c5c5c">2-5 yr</text>

<text x="240" y="295" text-anchor="end" font-size="14.5" font-weight="700" fill="#33404f">PVC card</text>
<rect x="345" y="280" width="57" height="30" rx="5" fill="#dfe3e9" stroke="#9aa3ad" stroke-width="1.6"/>
<text x="414" y="300" font-size="13" fill="#5c5c5c">3-5 yr</text>

<text x="240" y="350" text-anchor="end" font-size="14.5" font-weight="700" fill="#33404f">Synthetic PET/PP</text>
<rect x="345" y="335" width="113" height="30" rx="5" fill="#cfe0e0" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="470" y="355" font-size="13" fill="#2c5454">3-7 yr</text>

<text x="240" y="405" text-anchor="end" font-size="14.5" font-weight="700" fill="#33404f">Rugged industrial</text>
<rect x="543" y="390" width="283" height="30" rx="5" fill="#cfe7d7" stroke="#1f6f3a" stroke-width="1.6"/>
<polygon points="826,390 848,405 826,420" fill="#cfe7d7" stroke="#1f6f3a" stroke-width="1.6"/>
<text x="860" y="410" font-size="13" fill="#1f6f3a">10-20+ yr</text>

<text x="240" y="460" text-anchor="end" font-size="14.5" font-weight="700" fill="#33404f">Embedded</text>
<rect x="543" y="445" width="567" height="30" rx="5" fill="#cfe7d7" stroke="#1f6f3a" stroke-width="1.6"/>
<text x="835" y="465" font-size="13" font-weight="700" fill="#1f6f3a">10-30 yr (host-product life)</text>

<!-- chip reference -->
<text x="1120" y="185" text-anchor="end" font-size="13.5" font-weight="800" fill="#1f6f3a">chip: 50+ yr</text>
<text x="1120" y="205" text-anchor="end" font-size="12" fill="#5c9a6f">off the chart, right</text>

<!-- laundry note -->
<rect x="260" y="548" width="850" height="60" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="284" y="576" font-size="14" font-weight="800" fill="#2c5454">Laundry tags are counted in wash cycles, not years.</text>
<text x="284" y="597" font-size="13.5" fill="#33595a">PPS 300-500 cycles · textile 200-300 · silicone 50-100 (roughly 1-3 years at daily commercial washing).</text>
</svg>
