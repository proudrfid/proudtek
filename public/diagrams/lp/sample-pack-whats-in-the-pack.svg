<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">What is in a Proud Tek RFID and NFC sample pack: six sample categories and what each one tests</title>
  <desc id="d">A grid of six sample categories in one pack. LF 125 kHz cards and fobs (EM4100, T5577) test 125 kHz panel compatibility. HF 13.56 MHz access cards (MIFARE Classic 1K, MIFARE DESFire EV3) test lock and access-panel reads. NFC tags and stickers (NTAG213, NTAG215) test phone tap range and material feel. Secure NFC (NTAG424 DNA) tests tap-to-verify SUN authentication. HF vicinity long-range labels (ICODE SLIX2) test longer HF read range. UHF 860 to 960 MHz inlays and hard tags (Monza R6-P, UCODE 9, Higgs-9) test read range on your substrate and on metal. Every sample is production-grade silicon.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT'S IN THE PACK</text>
  <text x="600" y="96" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">One box, every band you need to test</text>
  <text x="600" y="125" text-anchor="middle" font-size="14" fill="#5c5c5c">8–12 production-grade SKUs across LF, HF and UHF — read, range-test and stress them on your own bench.</text>

  <!-- Row 1, card 1: LF cards and fobs -->
  <rect x="60" y="168" width="320" height="182" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="60" y="168" width="7" height="182" rx="3" fill="#c39a5f"/>
  <text x="84" y="202" font-size="13" font-weight="700" letter-spacing="0.4" fill="#6d5a3a">LF · 125 kHz</text>
  <text x="84" y="228" font-size="18" font-weight="700" fill="#291c0e">Cards &amp; fobs</text>
  <text x="84" y="262" font-size="12.5" letter-spacing="0.5" fill="#5c5c5c">CHIPS</text>
  <text x="84" y="283" font-size="14" fill="#291c0e">EM4100 · T5577</text>
  <text x="84" y="312" font-size="12.5" letter-spacing="0.5" fill="#5c5c5c">TEST</text>
  <text x="84" y="333" font-size="13" font-weight="700" fill="#2c5454">125 kHz panel compatibility</text>

  <!-- Row 1, card 2: HF access cards -->
  <rect x="425" y="168" width="320" height="182" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="425" y="168" width="7" height="182" rx="3" fill="#3d6b6b"/>
  <text x="449" y="202" font-size="13" font-weight="700" letter-spacing="0.4" fill="#2c5454">HF · 13.56 MHz</text>
  <text x="449" y="228" font-size="18" font-weight="700" fill="#291c0e">Access cards</text>
  <text x="449" y="262" font-size="12.5" letter-spacing="0.5" fill="#5c5c5c">CHIPS</text>
  <text x="449" y="283" font-size="14" fill="#291c0e">MIFARE Classic 1K · DESFire EV3</text>
  <text x="449" y="312" font-size="12.5" letter-spacing="0.5" fill="#5c5c5c">TEST</text>
  <text x="449" y="333" font-size="13" font-weight="700" fill="#2c5454">Lock &amp; access-panel reads</text>

  <!-- Row 1, card 3: NFC tags and stickers -->
  <rect x="790" y="168" width="320" height="182" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="790" y="168" width="7" height="182" rx="3" fill="#3d6b6b"/>
  <text x="814" y="202" font-size="13" font-weight="700" letter-spacing="0.4" fill="#2c5454">NFC · 13.56 MHz</text>
  <text x="814" y="228" font-size="18" font-weight="700" fill="#291c0e">Tags &amp; stickers</text>
  <text x="814" y="262" font-size="12.5" letter-spacing="0.5" fill="#5c5c5c">CHIPS</text>
  <text x="814" y="283" font-size="14" fill="#291c0e">NTAG213 · NTAG215</text>
  <text x="814" y="312" font-size="12.5" letter-spacing="0.5" fill="#5c5c5c">TEST</text>
  <text x="814" y="333" font-size="13" font-weight="700" fill="#2c5454">Phone tap range &amp; feel</text>

  <!-- Row 2, card 4: Secure NFC -->
  <rect x="60" y="390" width="320" height="182" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="60" y="390" width="7" height="182" rx="3" fill="#4a5568"/>
  <text x="84" y="424" font-size="13" font-weight="700" letter-spacing="0.4" fill="#4a5568">SECURE NFC</text>
  <text x="84" y="450" font-size="18" font-weight="700" fill="#291c0e">Tamper-evident</text>
  <text x="84" y="484" font-size="12.5" letter-spacing="0.5" fill="#5c5c5c">CHIPS</text>
  <text x="84" y="505" font-size="14" fill="#291c0e">NTAG424 DNA</text>
  <text x="84" y="534" font-size="12.5" letter-spacing="0.5" fill="#5c5c5c">TEST</text>
  <text x="84" y="555" font-size="13" font-weight="700" fill="#2c5454">Tap-to-verify SUN auth</text>

  <!-- Row 2, card 5: HF vicinity labels -->
  <rect x="425" y="390" width="320" height="182" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="425" y="390" width="7" height="182" rx="3" fill="#c39a5f"/>
  <text x="449" y="424" font-size="13" font-weight="700" letter-spacing="0.4" fill="#6d5a3a">HF VICINITY</text>
  <text x="449" y="450" font-size="18" font-weight="700" fill="#291c0e">Long-range labels</text>
  <text x="449" y="484" font-size="12.5" letter-spacing="0.5" fill="#5c5c5c">CHIPS</text>
  <text x="449" y="505" font-size="14" fill="#291c0e">ICODE SLIX2</text>
  <text x="449" y="534" font-size="12.5" letter-spacing="0.5" fill="#5c5c5c">TEST</text>
  <text x="449" y="555" font-size="13" font-weight="700" fill="#2c5454">Longer HF read range</text>

  <!-- Row 2, card 6: UHF RAIN -->
  <rect x="790" y="390" width="320" height="182" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="790" y="390" width="7" height="182" rx="3" fill="#2d6a4f"/>
  <text x="814" y="424" font-size="13" font-weight="700" letter-spacing="0.4" fill="#2d6a4f">UHF · 860–960 MHz</text>
  <text x="814" y="450" font-size="18" font-weight="700" fill="#291c0e">Inlays &amp; hard tags</text>
  <text x="814" y="484" font-size="12.5" letter-spacing="0.5" fill="#5c5c5c">CHIPS</text>
  <text x="814" y="505" font-size="14" fill="#291c0e">Monza R6-P · UCODE 9 · Higgs-9</text>
  <text x="814" y="534" font-size="12.5" letter-spacing="0.5" fill="#5c5c5c">TEST</text>
  <text x="814" y="555" font-size="13" font-weight="700" fill="#2c5454">Read range on metal</text>

  <text x="600" y="612" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Every sample is production-grade — the same silicon that ships in volume.</text>
</svg>
