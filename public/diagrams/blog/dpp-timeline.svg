<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="dppTitle dppDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="dppTitle">Mapping NFC anti-counterfeit onto the EU Digital Product Passport timeline</title>
  <desc id="dppDesc">A timeline. In 2024 the ESPR Regulation 2024/1781 was adopted, making the Digital Product Passport mandatory on a rolling schedule. In 2026 you are here: specify NTAG 424 DNA with GS1 Digital Link 1.4.x now. In the 2027 to 2030 window, leather-goods and textiles DPP delegated acts land. One secure NFC chip can carry it all: SUN/CMAC authentication, a GS1 Digital Link URL, EPCIS 2.0 events, and a TT tamper-evident form factor. Specifying it correctly in 2026 avoids a forced re-tag when the rules arrive.</desc>
  <defs>
    <radialGradient id="dppBg" cx="50%" cy="22%" r="86%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="dppDark" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#dppBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="1.5" fill="#6d5a3a">SPEC ONCE FOR ANTI-COUNTERFEIT + EU DPP</text>

  <!-- Timeline axis -->
  <line x1="150" y1="210" x2="1050" y2="210" stroke="#c39a5f" stroke-width="5"/>
  <!-- node 2024 -->
  <circle cx="230" cy="210" r="15" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/>
  <text x="230" y="168" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">2024</text>
  <!-- node 2026 (you are here) -->
  <circle cx="600" cy="210" r="22" fill="#1fcefb" stroke="#ffffff" stroke-width="4"/>
  <text x="600" y="164" text-anchor="middle" font-size="26" font-weight="800" fill="#177a92">2026</text>
  <text x="600" y="188" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1.5" fill="#177a92">YOU ARE HERE</text>
  <!-- node 2027-2030 -->
  <circle cx="970" cy="210" r="15" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/>
  <text x="970" y="168" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">2027–2030</text>

  <!-- Cards under nodes -->
  <rect x="96" y="248" width="286" height="150" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="239" y="290" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">ESPR adopted</text>
  <text x="239" y="322" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Regulation 2024/1781 —</text>
  <text x="239" y="345" text-anchor="middle" font-size="15.5" fill="#4f4f4f">DPP mandatory on a</text>
  <text x="239" y="368" text-anchor="middle" font-size="15.5" fill="#4f4f4f">rolling delegated-act schedule</text>

  <rect x="440" y="240" width="320" height="166" rx="14" fill="#eaf9fe" stroke="#1fcefb" stroke-width="2.5"/>
  <text x="600" y="284" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Specify it now</text>
  <text x="600" y="316" text-anchor="middle" font-size="15.5" fill="#177a92">NTAG 424 DNA +</text>
  <text x="600" y="339" text-anchor="middle" font-size="15.5" fill="#177a92">GS1 Digital Link 1.4.x</text>
  <text x="600" y="374" text-anchor="middle" font-size="14.5" font-style="italic" fill="#4f4f4f">carrier-neutral, but NFC is the</text>
  <text x="600" y="394" text-anchor="middle" font-size="14.5" font-style="italic" fill="#4f4f4f">only tap + tamper-evident carrier</text>

  <rect x="818" y="248" width="286" height="150" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="961" y="290" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Leather-goods DPP</text>
  <text x="961" y="322" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Textiles &amp; leather-goods</text>
  <text x="961" y="345" text-anchor="middle" font-size="15.5" fill="#4f4f4f">delegated acts land in</text>
  <text x="961" y="368" text-anchor="middle" font-size="15.5" fill="#4f4f4f">this window</text>

  <!-- Payload strip -->
  <rect x="56" y="430" width="1088" height="96" rx="16" fill="url(#dppDark)"/>
  <text x="90" y="470" font-size="17" font-weight="700" fill="#ffffff">One secure NFC chip carries it all</text>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#291c0e">
    <rect x="90" y="484" width="220" height="30" rx="15" fill="#e9d9b8"/><text x="200" y="504">SUN / CMAC auth</text>
    <rect x="326" y="484" width="230" height="30" rx="15" fill="#e9d9b8"/><text x="441" y="504">GS1 Digital Link</text>
    <rect x="572" y="484" width="200" height="30" rx="15" fill="#e9d9b8"/><text x="672" y="504">EPCIS 2.0 events</text>
    <rect x="788" y="484" width="266" height="30" rx="15" fill="#8fdcf3"/><text x="921" y="504">TT tamper-evident</text>
  </g>

  <text x="600" y="580" text-anchor="middle" font-size="17.5" font-weight="700" fill="#291c0e">Spec it right in 2026 → no forced re-tag in 2027–2030.</text>
  <text x="600" y="612" text-anchor="middle" font-size="15" fill="#6d5a3a">~2.2B NFC-capable smartphones already in active use.</text>
</svg>
