<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="chTitle chDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="chTitle">How LVMH, Estée Lauder and Kering deploy NFC authentication on cosmetics</title>
  <desc id="chDesc">Three luxury houses on pedestals, each with a different product and approach. LVMH's Aura consortium embeds a per-item NFC tag under the label or carton; a tap reveals a provenance hash anchored on the Aura blockchain, across Dior, Givenchy and Guerlain limited editions. Estée Lauder Companies place an NXP NTAG 424 DNA under the carton flap that opens a page with batch number, manufacturing date and ingredient transparency, across La Mer, Tom Ford Beauty and Aveda. Kering runs hybrid NFC plus blockchain and moves the tag to suit each package — under the base for fragrance, behind the label for compacts, inside the cap for lipstick — across YSL Beauté and Boucheron.</desc>
  <defs>
    <radialGradient id="chBg" cx="50%" cy="12%" r="95%"><stop offset="0%" stop-color="#f8f1e2"/><stop offset="100%" stop-color="#f2ece0"/></radialGradient>
    <linearGradient id="chGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c084"/><stop offset="1" stop-color="#8f7d54"/></linearGradient>
    <linearGradient id="chGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbeee4"/><stop offset="1" stop-color="#dcae94"/></linearGradient>
    <linearGradient id="chPlinth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2e0d1"/><stop offset="1" stop-color="#ddbfa9"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#chBg)"/>
  <text x="600" y="56" text-anchor="middle" font-size="15" letter-spacing="3" fill="#9a8a66">THE PLAYBOOK · WHAT THE BIG HOUSES ACTUALLY DO</text>
  <text x="600" y="92" text-anchor="middle" font-size="29" font-weight="700" fill="#291c0e">Same chip family, three house styles</text>
  <line x1="80" y1="512" x2="1120" y2="512" stroke="#d9c39c" stroke-width="1.5"/>

  <!-- House 1: LVMH / fragrance -->
  <g>
    <rect x="150" y="512" width="220" height="42" rx="6" fill="url(#chPlinth)"/>
    <rect x="216" y="330" width="88" height="182" rx="14" fill="url(#chGlass)" stroke="#c88f70" stroke-width="2"/>
    <rect x="240" y="272" width="40" height="60" rx="6" fill="#e7d3c2" stroke="#c88f70"/>
    <rect x="244" y="248" width="32" height="28" rx="6" fill="url(#chGold)"/>
    <g transform="translate(260,410)" stroke="#8f7d54" fill="none" stroke-width="4" stroke-linecap="round"><path d="M-12 -12 a17 17 0 0 1 0 24"/><path d="M-2 -7 a9 9 0 0 1 0 14"/></g>
    <text x="260" y="588" text-anchor="middle" font-size="22" font-weight="700" font-family="Georgia, serif" fill="#291c0e">LVMH · Aura</text>
    <text x="260" y="616" text-anchor="middle" font-size="14" fill="#6b6259">Dior · Givenchy · Guerlain</text>
    <text x="260" y="642" text-anchor="middle" font-size="13.5" fill="#9a8a66">Provenance hash on the Aura blockchain</text>
  </g>

  <!-- House 2: Estée Lauder / jar -->
  <g>
    <rect x="490" y="512" width="220" height="42" rx="6" fill="url(#chPlinth)"/>
    <rect x="520" y="384" width="160" height="128" rx="18" fill="url(#chGlass)" stroke="#c88f70" stroke-width="2"/>
    <rect x="520" y="384" width="160" height="40" rx="18" fill="#f6e3d6"/>
    <rect x="540" y="352" width="120" height="36" rx="9" fill="url(#chGold)"/>
    <g transform="translate(600,462)" stroke="#8f7d54" fill="none" stroke-width="4" stroke-linecap="round"><path d="M-12 -12 a17 17 0 0 1 0 24"/><path d="M-2 -7 a9 9 0 0 1 0 14"/></g>
    <text x="600" y="588" text-anchor="middle" font-size="22" font-weight="700" font-family="Georgia, serif" fill="#291c0e">Estée Lauder</text>
    <text x="600" y="616" text-anchor="middle" font-size="14" fill="#6b6259">La Mer · Tom Ford · Aveda</text>
    <text x="600" y="642" text-anchor="middle" font-size="13.5" fill="#9a8a66">Batch + ingredient transparency on tap</text>
  </g>

  <!-- House 3: Kering / lipstick -->
  <g>
    <rect x="830" y="512" width="220" height="42" rx="6" fill="url(#chPlinth)"/>
    <rect x="916" y="336" width="48" height="176" rx="8" fill="url(#chGlass)" stroke="#c88f70" stroke-width="2"/>
    <rect x="920" y="276" width="40" height="66" rx="4" fill="url(#chGold)"/>
    <rect x="930" y="276" width="22" height="66" rx="3" fill="#bd8a79"/>
    <g transform="translate(940,462)" stroke="#8f7d54" fill="none" stroke-width="4" stroke-linecap="round"><path d="M-12 -12 a17 17 0 0 1 0 24"/><path d="M-2 -7 a9 9 0 0 1 0 14"/></g>
    <text x="940" y="588" text-anchor="middle" font-size="22" font-weight="700" font-family="Georgia, serif" fill="#291c0e">Kering</text>
    <text x="940" y="616" text-anchor="middle" font-size="14" fill="#6b6259">YSL Beauté · Boucheron</text>
    <text x="940" y="642" text-anchor="middle" font-size="13.5" fill="#9a8a66">Tag placed to suit each package</text>
  </g>
</svg>
