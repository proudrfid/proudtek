<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">DESFire security model — each generation layers new controls on the last</title>
<desc id="d">A stacked-layer diagram. EV1 (2006) is the base: AES-128 mutual authentication and file-level access control with 14 keys per application, replacing the broken Crypto-1 cipher. EV2 (2016) keeps those and adds a transaction MAC (CMAC) and a proximity check to stop replay and relay attacks. EV3 (2020) keeps all of the above and adds Secure Dynamic Messaging for phone tap-verify and LRP leakage-resilient authentication to resist DPA and EMA side-channel attacks. AES-CMAC key diversification, a unique key per card, underpins every generation.</desc>
<defs>
<radialGradient id="bg2" cx="50%" cy="22%" r="88%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg2)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#6d5a3a">DESFIRE SECURITY — LAYERS THAT ACCUMULATE, EV1 &#8594; EV3</text>

<!-- ============ EV1 column (base, steel) ============ -->
<text x="210" y="478" text-anchor="middle" font-size="22" font-weight="800" fill="#4a5568">DESFire EV1 &#183; 2006</text>
<text x="210" y="462" text-anchor="middle" font-size="13" font-weight="600" fill="#8a7a5f">replaces broken Crypto-1</text>
<g>
<rect x="80" y="539" width="260" height="36" rx="9" fill="#e8ecf1" stroke="#4a5568" stroke-width="1.6"/><text x="210" y="562" text-anchor="middle" font-size="15" font-weight="700" fill="#26303c">AES-128 mutual auth</text>
<rect x="80" y="495" width="260" height="36" rx="9" fill="#e8ecf1" stroke="#4a5568" stroke-width="1.6"/><text x="210" y="518" text-anchor="middle" font-size="15" font-weight="700" fill="#26303c">File-level access &#183; 14 keys</text>
</g>

<!-- ============ EV2 column (adds integrity + anti-relay, teal) ============ -->
<text x="590" y="390" text-anchor="middle" font-size="22" font-weight="800" fill="#3d6b6b">DESFire EV2 &#183; 2016</text>
<text x="590" y="374" text-anchor="middle" font-size="13" font-weight="600" fill="#8a7a5f">stops replay &amp; relay attacks</text>
<g>
<rect x="460" y="539" width="260" height="36" rx="9" fill="#f3ece0" stroke="#e3d8c4" stroke-width="1.2"/><text x="590" y="562" text-anchor="middle" font-size="15" fill="#7a6a4f">AES-128 mutual auth</text>
<rect x="460" y="495" width="260" height="36" rx="9" fill="#f3ece0" stroke="#e3d8c4" stroke-width="1.2"/><text x="590" y="518" text-anchor="middle" font-size="15" fill="#7a6a4f">File-level access &#183; 14 keys</text>
<rect x="460" y="451" width="260" height="36" rx="9" fill="#e2eeee" stroke="#3d6b6b" stroke-width="1.6"/><text x="590" y="474" text-anchor="middle" font-size="15" font-weight="700" fill="#234a4a">+ Transaction MAC (CMAC)</text>
<rect x="460" y="407" width="260" height="36" rx="9" fill="#e2eeee" stroke="#3d6b6b" stroke-width="1.6"/><text x="590" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#234a4a">+ Proximity check (anti-relay)</text>
</g>

<!-- ============ EV3 column (adds phone-verify + hardening, gold) ============ -->
<text x="970" y="302" text-anchor="middle" font-size="22" font-weight="800" fill="#6d5a3a">DESFire EV3 &#183; 2020</text>
<text x="970" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#8a7a5f">resists DPA / EMA side-channel</text>
<g>
<rect x="840" y="539" width="260" height="36" rx="9" fill="#f3ece0" stroke="#e3d8c4" stroke-width="1.2"/><text x="970" y="562" text-anchor="middle" font-size="15" fill="#7a6a4f">AES-128 mutual auth</text>
<rect x="840" y="495" width="260" height="36" rx="9" fill="#f3ece0" stroke="#e3d8c4" stroke-width="1.2"/><text x="970" y="518" text-anchor="middle" font-size="15" fill="#7a6a4f">File-level access &#183; 14 keys</text>
<rect x="840" y="451" width="260" height="36" rx="9" fill="#f3ece0" stroke="#e3d8c4" stroke-width="1.2"/><text x="970" y="474" text-anchor="middle" font-size="15" fill="#7a6a4f">Transaction MAC (CMAC)</text>
<rect x="840" y="407" width="260" height="36" rx="9" fill="#f3ece0" stroke="#e3d8c4" stroke-width="1.2"/><text x="970" y="430" text-anchor="middle" font-size="15" fill="#7a6a4f">Proximity check (anti-relay)</text>
<rect x="840" y="363" width="260" height="36" rx="9" fill="#f0e2c2" stroke="#c39a5f" stroke-width="1.6"/><text x="970" y="386" text-anchor="middle" font-size="15" font-weight="700" fill="#4a3a1c">+ SDM &#8212; phone tap-verify</text>
<rect x="840" y="319" width="260" height="36" rx="9" fill="#f0e2c2" stroke="#c39a5f" stroke-width="1.6"/><text x="970" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#4a3a1c">+ LRP &#8212; leakage-resilient</text>
</g>

<!-- rising baseline connecting the stack tops -->
<path d="M210 489 L590 401 L970 313" fill="none" stroke="#c39a5f" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round" opacity="0.7"/>

<!-- ============ foundation: key diversification spans all ============ -->
<rect x="80" y="590" width="1020" height="44" rx="12" fill="#6d5a3a"/>
<text x="590" y="617" text-anchor="middle" font-size="15.5" font-weight="700" letter-spacing="0.5" fill="#ffffff">AES-CMAC KEY DIVERSIFICATION &#8212; A UNIQUE KEY PER CARD, ACROSS EVERY GENERATION</text>

<text x="590" y="652" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4f4f4f">Solid blocks = added that generation &#183; faded = inherited. Nothing is ever removed &#8212; the model only builds up.</text>
</svg>
