<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Mode-selection decision matrix for RFID freight</title>
<desc id="d">Four decision cards plus a contingency strip. Default to sea when order volume exceeds 300 kg or 2-3 CBM with tolerance over 25-35 days: a 20-foot container is $1,800-3,500, a 40-foot $3,000-5,500, holding 2-3M inlays or 800K-1M labels. Switch to air when stockout is imminent, unit value exceeds $0.40, or the order is under 200 kg: express courier $5-12/kg in 4-7 days, consolidated forwarder $3-7/kg in 6-10 days. Use ocean LCL for 50-300 kg at $80-200 per CBM in 30-45 days. Consider rail or sea-air: China-Europe rail 18-22 days at $4,500-7,500 per 40-foot, or sea-air via Dubai or Singapore 12-18 days at 60-70% of air cost. Contingency: keep two blanket-priced forwarders and, at 25 days of inventory left against a 35-day sea lead, auto-issue an air mini-order.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MODE-SELECTION DECISION MATRIX</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">A 70/30 sea/air default, with clear triggers to flex toward air.</text>

<!-- DEFAULT SEA -->
<rect x="80" y="118" width="520" height="150" rx="13" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.8"/>
<rect x="80" y="118" width="520" height="8" rx="4" fill="#4a5568"/>
<text x="108" y="156" font-size="15" font-weight="800" fill="#3f4657">DEFAULT · SEA</text>
<text x="108" y="186" font-size="12.5" fill="#5c5c5c">&gt;300 kg / 2-3 CBM · tolerance &gt;25-35 days · recurring</text>
<text x="108" y="212" font-size="12.5" font-weight="700" fill="#291c0e">20ft $1,800-3,500 · 40ft $3,000-5,500</text>
<text x="108" y="234" font-size="12.5" fill="#5c5c5c">holds 2-3M inlays or 800K-1M printed labels</text>

<!-- SWITCH AIR -->
<rect x="620" y="118" width="500" height="150" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="620" y="118" width="500" height="8" rx="4" fill="#3d6b6b"/>
<text x="648" y="156" font-size="15" font-weight="800" fill="#2c5454">SWITCH · AIR</text>
<text x="648" y="186" font-size="12.5" fill="#5c5c5c">stockout imminent · unit value &gt;$0.40 · &lt;200 kg</text>
<text x="648" y="212" font-size="12.5" font-weight="700" fill="#291c0e">express $5-12/kg · 4-7 days</text>
<text x="648" y="234" font-size="12.5" fill="#5c5c5c">consolidated forwarder $3-7/kg · 6-10 days</text>

<!-- OCEAN LCL -->
<rect x="80" y="284" width="520" height="150" rx="13" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.8"/>
<rect x="80" y="284" width="520" height="8" rx="4" fill="#7c8794"/>
<text x="108" y="322" font-size="15" font-weight="800" fill="#3f4657">USE · OCEAN LCL</text>
<text x="108" y="352" font-size="12.5" fill="#5c5c5c">50-300 kg shipments, between LCL and a full container</text>
<text x="108" y="378" font-size="12.5" font-weight="700" fill="#291c0e">$80-200/CBM · 30-45 days</text>
<text x="108" y="400" font-size="12.5" fill="#5c5c5c">consolidation handling adds transit time</text>

<!-- RAIL / SEA-AIR -->
<rect x="620" y="284" width="500" height="150" rx="13" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="620" y="284" width="500" height="8" rx="4" fill="#c39a5f"/>
<text x="648" y="322" font-size="15" font-weight="800" fill="#6d5a3a">CONSIDER · RAIL / SEA-AIR</text>
<text x="648" y="352" font-size="12.5" fill="#8a6f3c">China-EU rail (Yiwu-Madrid) · sea-air via Dubai/Singapore</text>
<text x="648" y="378" font-size="12.5" font-weight="700" fill="#291c0e">rail 18-22 days · $4,500-7,500/40ft</text>
<text x="648" y="400" font-size="12.5" fill="#5c5c5c">sea-air 12-18 days · 60-70% of air cost</text>

<!-- contingency strip -->
<rect x="80" y="452" width="1040" height="86" rx="13" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="108" y="486" font-size="14" font-weight="800" fill="#2c5454">CONTINGENCY PLAN</text>
<text x="108" y="510" font-size="13" fill="#291c0e">Lock blanket pricing with two forwarders — one sea-lean, one air-lean.</text>
<text x="108" y="530" font-size="13" fill="#291c0e">At 25 days of inventory left against a 35-day sea lead → auto-issue an air mini-order.</text>

<text x="600" y="586" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Set the default and the triggers once; stop re-deciding the same order every month.</text>
</svg>
