<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">One vaccine vial, five hand-offs, one continuous temperature record</title>
<desc id="d">A vaccine cold-chain journey monitored end to end by a semi-passive UHF RFID temperature logger. Five nodes run left to right: manufacturer (tag applied and activated), freight (hand-off scan), air freight (unwatched hours), regional depot (data downloaded) and clinic (point of care). Below, a temperature chart shows the plus two to plus eight degrees Celsius safe band. A continuous logged trace holds inside the band except for one flagged excursion, drawn in red, that rises above plus eight degrees for roughly eleven minutes. The logger records every one to fifteen minutes for six to twenty-four months on a coin cell.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COLD CHAIN · RFID TEMPERATURE LOGGING</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">One vial, five hand-offs, one continuous record</text>

<line x1="150" y1="170" x2="1050" y2="170" stroke="#cfe0e0" stroke-width="2.5" stroke-dasharray="2 9"/>

<g fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5">
<circle cx="150" cy="170" r="28"/>
<circle cx="375" cy="170" r="28"/>
<circle cx="600" cy="170" r="28"/>
<circle cx="825" cy="170" r="28"/>
<circle cx="1050" cy="170" r="28"/>
</g>

<g fill="none" stroke="#2c5454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<g transform="translate(150,170)"><rect x="-16" y="-2" width="30" height="16" rx="1"/><path d="M-16 -2 l6 -9 l0 9 M-4 -2 l6 -9 l0 9"/><line x1="10" y1="-2" x2="10" y2="-12"/></g>
<g transform="translate(375,170)"><rect x="-16" y="-9" width="20" height="17" rx="1"/><path d="M4 -3 h6 l6 6 v5 h-12 z"/><circle cx="-6" cy="11" r="3"/><circle cx="10" cy="11" r="3"/></g>
<g transform="translate(600,170)"><path d="M-15 2 L9 -5 L16 -11 L7 2 L16 9 L9 6 L-15 5 Z"/><path d="M-3 3 L-9 -7 L-5 -7 L2 2"/></g>
<g transform="translate(825,170)"><path d="M-14 13 V-3 L0 -13 L14 -3 V13 Z"/><rect x="-4" y="3" width="8" height="10"/></g>
<g transform="translate(1050,170)"><rect x="-13" y="-11" width="26" height="24" rx="1"/><path d="M0 -6 v11 M-6 0 h12" stroke-width="3"/></g>
</g>

<g text-anchor="middle">
<text x="150" y="228" font-size="14.5" font-weight="700" fill="#291c0e">MANUFACTURER</text>
<text x="150" y="248" font-size="12.5" fill="#4f4f4f">tag applied &amp; activated</text>
<text x="375" y="228" font-size="14.5" font-weight="700" fill="#291c0e">FREIGHT</text>
<text x="375" y="248" font-size="12.5" fill="#4f4f4f">hand-off scan</text>
<text x="600" y="228" font-size="14.5" font-weight="700" fill="#291c0e">AIR FREIGHT</text>
<text x="600" y="248" font-size="12.5" fill="#4f4f4f">unwatched hours</text>
<text x="825" y="228" font-size="14.5" font-weight="700" fill="#291c0e">REGIONAL DEPOT</text>
<text x="825" y="248" font-size="12.5" fill="#4f4f4f">data downloaded</text>
<text x="1050" y="228" font-size="14.5" font-weight="700" fill="#291c0e">CLINIC</text>
<text x="1050" y="248" font-size="12.5" fill="#4f4f4f">point of care</text>
</g>

<rect x="300" y="272" width="600" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="600" y="294" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2c5454">SEMI-PASSIVE UHF LOGGER · records every 1–15 min · 6–24 months on a coin cell</text>

<text x="640" y="348" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">TEMPERATURE EXCURSION · ≈ 11 min above +8°C</text>

<rect x="130" y="398" width="945" height="72" fill="#eef5f5"/>
<line x1="130" y1="398" x2="1075" y2="398" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="5 6"/>
<line x1="130" y1="470" x2="1075" y2="470" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="5 6"/>
<text x="118" y="403" text-anchor="end" font-size="13.5" fill="#2c5454">+8°C</text>
<text x="118" y="475" text-anchor="end" font-size="13.5" fill="#2c5454">+2°C</text>

<polyline points="132,442 200,438 270,444 340,438 410,442 480,440 545,438 575,420 605,390 635,364 665,390 695,420 730,440 800,443 870,438 940,443 1010,440 1073,441" fill="none" stroke="#3d6b6b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="562,430 575,420 605,390 635,364 665,390 695,420 708,430" fill="none" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="635" y1="358" x2="635" y2="470" stroke="#8b2d2d" stroke-width="1.5" stroke-dasharray="4 6"/>
<circle cx="635" cy="364" r="5" fill="#8b2d2d"/>

<rect x="132" y="516" width="18" height="4" rx="2" fill="#3d6b6b"/>
<text x="160" y="524" font-size="13.5" fill="#4f4f4f">in-range logging</text>
<rect x="300" y="516" width="18" height="4" rx="2" fill="#8b2d2d"/>
<text x="328" y="524" font-size="13.5" fill="#4f4f4f">flagged excursion, on the record</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#291c0e">Custody changes hands at every stage — the temperature record does not.</text>
<text x="600" y="628" text-anchor="middle" font-size="13" fill="#5c5c5c">The old chemical monitor reports only "exposed or not"; the logger hands over the whole timeline, with timestamps.</text>
</svg>
