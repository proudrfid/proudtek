<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Torque traceability flow — from tightening tool to screw ID</title>
<desc id="d">Four-step flow showing a DC tightening tool binding its torque signature to the screw serial, then audit reads and LRU swaps, with the IEC 60947-7-1 terminal torque table.</desc>
<rect width="1200" height="675" fill="#f8f6f1"/>
<text x="60" y="64" font-family="Georgia, serif" font-size="34" fill="#291c0e">Torque, logged to the screw that felt it</text>
<text x="60" y="98" font-family="Verdana, sans-serif" font-size="16" fill="#6d5a3a">DC-electric tools speak Open Protocol — the screw serial gives that data somewhere permanent to live</text>
<g font-family="Verdana, sans-serif">
<rect x="60" y="150" width="240" height="110" rx="10" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<text x="80" y="182" font-size="16" fill="#291c0e" font-family="Georgia, serif">1 · Tighten</text>
<text x="80" y="208" font-size="12.5" fill="#6d5a3a">Atlas Copco / Ingersoll Rand class</text>
<text x="80" y="227" font-size="12.5" fill="#6d5a3a">DC tool — torque, angle, yield</text>
<text x="80" y="246" font-size="12.5" fill="#6d5a3a">strategies per VDI 2230</text>
<rect x="356" y="150" width="240" height="110" rx="10" fill="#eef2f0" stroke="#2c5454" stroke-width="2.5"/>
<text x="376" y="182" font-size="16" fill="#291c0e" font-family="Georgia, serif">2 · Bind</text>
<text x="376" y="208" font-size="12.5" fill="#2c5454">torque signature + date written</text>
<text x="376" y="227" font-size="12.5" fill="#2c5454">to EPCIS against this GIAI-96</text>
<text x="376" y="246" font-size="12.5" fill="#2c5454">bizStep: assembling</text>
<rect x="652" y="150" width="240" height="110" rx="10" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<text x="672" y="182" font-size="16" fill="#291c0e" font-family="Georgia, serif">3 · Audit</text>
<text x="672" y="208" font-size="12.5" fill="#6d5a3a">handheld sweep at 1-3 m —</text>
<text x="672" y="227" font-size="12.5" fill="#6d5a3a">every joint answers with its</text>
<text x="672" y="246" font-size="12.5" fill="#6d5a3a">serial and last torque event</text>
<rect x="948" y="150" width="192" height="110" rx="10" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<text x="968" y="182" font-size="16" fill="#291c0e" font-family="Georgia, serif">4 · Swap</text>
<text x="968" y="208" font-size="12.5" fill="#6d5a3a">LRU change logs</text>
<text x="968" y="227" font-size="12.5" fill="#6d5a3a">disassembling —</text>
<text x="968" y="246" font-size="12.5" fill="#6d5a3a">history stays whole</text>
<path d="M300 205 L348 205" stroke="#6d5a3a" stroke-width="2.5" fill="none"/>
<path d="M348 205 l-9 -5 v10 z" fill="#6d5a3a"/>
<path d="M596 205 L644 205" stroke="#6d5a3a" stroke-width="2.5" fill="none"/>
<path d="M644 205 l-9 -5 v10 z" fill="#6d5a3a"/>
<path d="M892 205 L940 205" stroke="#6d5a3a" stroke-width="2.5" fill="none"/>
<path d="M940 205 l-9 -5 v10 z" fill="#6d5a3a"/>
<text x="60" y="340" font-size="17" fill="#291c0e" font-family="Georgia, serif">The numbers the auditor asks for — IEC 60947-7-1 Table 4 terminal torque</text>
<g font-size="14" fill="#291c0e">
<rect x="60" y="362" width="200" height="92" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="160" y="400" font-size="24" font-family="Georgia, serif" text-anchor="middle" fill="#6d5a3a">0.5 Nm</text>
<text x="160" y="430" font-size="13" text-anchor="middle" fill="#6d5a3a">M3 terminal screw</text>
<rect x="286" y="362" width="200" height="92" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="386" y="400" font-size="24" font-family="Georgia, serif" text-anchor="middle" fill="#6d5a3a">1.2 Nm</text>
<text x="386" y="430" font-size="13" text-anchor="middle" fill="#6d5a3a">M4 terminal screw</text>
<rect x="512" y="362" width="200" height="92" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="612" y="400" font-size="24" font-family="Georgia, serif" text-anchor="middle" fill="#6d5a3a">2.5 Nm</text>
<text x="612" y="430" font-size="13" text-anchor="middle" fill="#6d5a3a">M5 terminal screw</text>
<rect x="738" y="362" width="200" height="92" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="838" y="400" font-size="24" font-family="Georgia, serif" text-anchor="middle" fill="#6d5a3a">3.0 Nm</text>
<text x="838" y="430" font-size="13" text-anchor="middle" fill="#6d5a3a">M6 terminal screw</text>
</g>
<text x="60" y="510" font-size="13.5" fill="#6d5a3a">Switchgear and panel workflows: IEC 60947 compliance + NFPA 70E arc-flash pre-task verification read the same serial.</text>
<rect x="60" y="546" width="1080" height="66" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="84" y="574" font-size="17" fill="#291c0e" font-family="Georgia, serif">Counterfeit fasteners enter through paperwork gaps. A serialised screw closes the gap it rode in on.</text>
<text x="84" y="598" font-size="13.5" fill="#6d5a3a">GS1 GIAI-96 pedigree separates genuine OEM stock from grey-market lookalikes at receiving, not after failure.</text>
</g>
</svg>
