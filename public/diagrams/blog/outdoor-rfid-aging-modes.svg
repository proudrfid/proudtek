<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Four ways outdoor conditions age an RFID tag, and the design fix for each</title>
<desc id="d">Four failure modes and their fixes. UV radiation causes yellowing and chalking that is cosmetic and micro-cracking that is functional; the fix is UV-stabilized silicone or epoxy and a vendor that publishes ASTM G154 or G155 weathering data. Freeze-thaw cycling lets trapped moisture expand and delaminate the encapsulant; the fix is to verify IP68 immersion testing across the full temperature range. Chemical exposure from fertilizer, road salt and emissions crazes the wrong shell, and ABS fails in solvents within months; the fix is to match encapsulant chemistry, since silicone and PPS resist most cleaners. Mounting and vibration delaminate rigid adhesive on metal; the fix is flexible silicone adhesive or mechanical mounting by cable-tie, rivet or bolt-through.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">OUTDOORS · HOW A TAG AGES, AND HOW TO STOP IT</text>
<text x="600" y="80" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Design for the worst threat, not the average — that's the line between a tag that lasts and a warranty claim.</text>

<!-- TL: UV -->
<rect x="64" y="104" width="524" height="238" rx="13" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<rect x="64" y="104" width="524" height="8" rx="4" fill="#8b2d2d"/>
<text x="88" y="142" font-size="16" font-weight="800" fill="#8b2d2d">UV RADIATION</text>
<text x="88" y="172" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">FAILS</text>
<text x="88" y="193" font-size="13.5" fill="#333333">Yellowing &amp; chalking (cosmetic); surface micro-</text>
<text x="88" y="213" font-size="13.5" fill="#333333">cracking that lets moisture in (functional).</text>
<rect x="88" y="230" width="476" height="94" rx="9" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="106" cy="256" r="8" fill="#1f6f3a"/><path d="M101 256 L105 261 L112 251" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="122" y="261" font-size="12.5" font-weight="800" fill="#1f6f3a">FIX</text>
<text x="106" y="288" font-size="13" fill="#333333">Specify UV-stabilized silicone or epoxy; pick a</text>
<text x="106" y="308" font-size="13" fill="#333333">vendor publishing ASTM G154 / G155 data.</text>

<!-- TR: freeze-thaw -->
<rect x="612" y="104" width="524" height="238" rx="13" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<rect x="612" y="104" width="524" height="8" rx="4" fill="#8b2d2d"/>
<text x="636" y="142" font-size="16" font-weight="800" fill="#8b2d2d">FREEZE–THAW CYCLING</text>
<text x="636" y="172" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">FAILS</text>
<text x="636" y="193" font-size="13.5" fill="#333333">Trapped moisture penetrates, then expands on</text>
<text x="636" y="213" font-size="13.5" fill="#333333">freezing and delaminates the encapsulant.</text>
<rect x="636" y="230" width="476" height="94" rx="9" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="654" cy="256" r="8" fill="#1f6f3a"/><path d="M649 256 L653 261 L660 251" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="670" y="261" font-size="12.5" font-weight="800" fill="#1f6f3a">FIX</text>
<text x="654" y="288" font-size="13" fill="#333333">Verify IP68 immersion testing across the full</text>
<text x="654" y="308" font-size="13" fill="#333333">expected temperature range — not just at 20 °C.</text>

<!-- BL: chemical -->
<rect x="64" y="358" width="524" height="238" rx="13" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<rect x="64" y="358" width="524" height="8" rx="4" fill="#8b2d2d"/>
<text x="88" y="396" font-size="16" font-weight="800" fill="#8b2d2d">CHEMICAL EXPOSURE</text>
<text x="88" y="426" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">FAILS</text>
<text x="88" y="447" font-size="13.5" fill="#333333">Fertilizer, road salt &amp; emissions craze the wrong</text>
<text x="88" y="467" font-size="13.5" fill="#333333">shell — ABS can fail in solvents within months.</text>
<rect x="88" y="484" width="476" height="94" rx="9" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="106" cy="510" r="8" fill="#1f6f3a"/><path d="M101 510 L105 515 L112 505" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="122" y="515" font-size="12.5" font-weight="800" fill="#1f6f3a">FIX</text>
<text x="106" y="542" font-size="13" fill="#333333">Match encapsulant chemistry to the wash —</text>
<text x="106" y="562" font-size="13" fill="#333333">silicone and PPS resist most cleaners.</text>

<!-- BR: mounting -->
<rect x="612" y="358" width="524" height="238" rx="13" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<rect x="612" y="358" width="524" height="8" rx="4" fill="#8b2d2d"/>
<text x="636" y="396" font-size="16" font-weight="800" fill="#8b2d2d">MOUNTING &amp; VIBRATION</text>
<text x="636" y="426" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">FAILS</text>
<text x="636" y="447" font-size="13.5" fill="#333333">Rigid adhesive on metal delaminates under</text>
<text x="636" y="467" font-size="13.5" fill="#333333">thermal cycling and harsh vibration.</text>
<rect x="636" y="484" width="476" height="94" rx="9" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="654" cy="510" r="8" fill="#1f6f3a"/><path d="M649 510 L653 515 L660 505" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="670" y="515" font-size="12.5" font-weight="800" fill="#1f6f3a">FIX</text>
<text x="654" y="542" font-size="13" fill="#333333">Flexible silicone adhesive, or mechanical mount:</text>
<text x="654" y="562" font-size="13" fill="#333333">cable-tie, rivet or bolt-through.</text>
</svg>
