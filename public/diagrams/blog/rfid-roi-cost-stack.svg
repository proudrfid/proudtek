<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five cost lines in an RFID inventory ROI model</title>
<desc id="d">Five stacked cost rows in a steel-grey ledger. One, tags at 0.03 to 0.15 dollars per item, multiplied by items tagged per year including replenishment. Two, handheld readers at 1,500 to 3,500 dollars each for cycle counting. Three, optional fixed readers at 800 to 2,000 dollars each for dock-door and fitting-room scanning. Four, integration and deployment at 15 to 25 percent of first-year cost for ERP integration, install, training and process design. Five, highlighted in gold, the ongoing year-two-plus spend: software licensing, tag refills and reader maintenance — the line most models omit.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE THE MONEY GOES</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Five cost lines — the last one is the one models forget.</text>

<!-- row 1 -->
<rect x="80" y="150" width="1040" height="64" rx="12" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.6"/>
<text x="100" y="184" font-size="26" font-weight="800" fill="#4a5568">$0.03-0.15</text>
<text x="100" y="204" font-size="12" fill="#5c5c5c">per item</text>
<line x1="310" y1="162" x2="310" y2="202" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="340" y="182" font-size="17" font-weight="800" fill="#291c0e">Tags</text>
<text x="340" y="202" font-size="13" fill="#5c5c5c">× items tagged per year, incl. replenishment</text>

<!-- row 2 -->
<rect x="80" y="224" width="1040" height="64" rx="12" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.6"/>
<text x="100" y="258" font-size="24" font-weight="800" fill="#4a5568">$1,500-3,500</text>
<text x="100" y="278" font-size="12" fill="#5c5c5c">each</text>
<line x1="310" y1="236" x2="310" y2="276" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="340" y="256" font-size="17" font-weight="800" fill="#291c0e">Handheld readers</text>
<text x="340" y="276" font-size="13" fill="#5c5c5c">for cycle counting and audits</text>

<!-- row 3 -->
<rect x="80" y="298" width="1040" height="64" rx="12" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.6"/>
<text x="100" y="332" font-size="24" font-weight="800" fill="#4a5568">$800-2,000</text>
<text x="100" y="352" font-size="12" fill="#5c5c5c">each</text>
<line x1="310" y1="310" x2="310" y2="350" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="340" y="330" font-size="17" font-weight="800" fill="#291c0e">Fixed readers (optional)</text>
<text x="340" y="350" font-size="13" fill="#5c5c5c">dock door / fitting-room scanning</text>

<!-- row 4 -->
<rect x="80" y="372" width="1040" height="64" rx="12" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.6"/>
<text x="100" y="408" font-size="30" font-weight="800" fill="#4a5568">15-25%</text>
<text x="100" y="426" font-size="12" fill="#5c5c5c">of first-year cost</text>
<line x1="310" y1="384" x2="310" y2="424" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="340" y="404" font-size="17" font-weight="800" fill="#291c0e">Integration + deployment</text>
<text x="340" y="424" font-size="13" fill="#5c5c5c">ERP integration, install, training, process design</text>

<!-- row 5 (the forgotten one) -->
<rect x="80" y="446" width="1040" height="64" rx="12" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<text x="100" y="482" font-size="24" font-weight="800" fill="#a07d43">ongoing</text>
<text x="100" y="500" font-size="12" fill="#8a6f3c">year 2+</text>
<line x1="310" y1="458" x2="310" y2="498" stroke="#ecdcbb" stroke-width="1.4"/>
<text x="340" y="478" font-size="17" font-weight="800" fill="#291c0e">Licensing + consumables</text>
<text x="340" y="498" font-size="13" fill="#6d5a3a">software, tag refills, reader maintenance — often omitted</text>

<text x="600" y="556" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Understate the recurring line and year-two economics quietly fall apart.</text>
</svg>
