<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID event access control: one wristband tap, one gate decision</title>
<desc id="d">An attendee's RFID wristband, encoded with zone permissions, taps a 13.56 MHz gate reader at 3 to 8 cm. The reader relays the credential and the access-control software returns ACCESS GRANTED for a valid, permitted credential. A stat band summarises the headline numbers: entry runs 3 to 5 times faster than barcode scanning, each gate lane processes 15 to 20 attendees per minute, the tap-to-decision round trip takes 200 to 500 milliseconds, and gates are sized to a read-rate target above 99.7 percent.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EVENT ACCESS CONTROL · WRISTBAND TAP TO OPEN GATE</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Encode the zone permission once; the gate decides in a few hundred milliseconds.</text>

<!-- wristband credential -->
<ellipse cx="230" cy="256" rx="58" ry="84" fill="none" stroke="#3d6b6b" stroke-width="20"/>
<ellipse cx="230" cy="256" rx="58" ry="84" fill="none" stroke="#5b8a8a" stroke-width="6" opacity="0.5"/>
<rect x="210" y="150" width="40" height="30" rx="6" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
<rect x="219" y="158" width="22" height="14" rx="2" fill="#c39a5f"/>
<text x="230" y="372" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">RFID wristband</text>
<text x="230" y="394" text-anchor="middle" font-size="13.5" fill="#4f4f4f">zone permission encoded</text>

<!-- tap coupling -->
<g fill="none" stroke="#1fcefb" stroke-width="4" stroke-linecap="round">
<path d="M312 216 a52 52 0 0 1 0 80"/>
<path d="M332 200 a70 70 0 0 1 0 112"/>
<path d="M352 186 a88 88 0 0 1 0 140"/>
</g>

<!-- gate reader -->
<rect x="560" y="272" width="16" height="76" fill="#4a5568"/>
<rect x="506" y="176" width="120" height="96" rx="14" fill="#ffffff" stroke="#291c0e" stroke-width="3"/>
<rect x="522" y="192" width="88" height="44" rx="6" fill="#eef5f5"/>
<circle cx="566" cy="252" r="8" fill="#1f6f3a"/>
<text x="566" y="372" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">HF gate reader</text>
<text x="566" y="394" text-anchor="middle" font-size="13.5" fill="#4f4f4f">13.56 MHz · 3–8 cm tap</text>

<!-- reader to verdict -->
<text x="722" y="238" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d5a3a">200–500 ms</text>
<line x1="642" y1="252" x2="798" y2="252" stroke="#c39a5f" stroke-width="4"/>
<path d="M798 252 l-16 -8 v16 z" fill="#c39a5f"/>

<!-- verdict -->
<rect x="808" y="206" width="288" height="92" rx="16" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2.5"/>
<circle cx="850" cy="252" r="22" fill="#1f6f3a"/>
<path d="M840 252 l7 8 l14 -17" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="884" y="246" font-size="22" font-weight="800" fill="#1f6f3a">ACCESS GRANTED</text>
<text x="884" y="272" font-size="14" fill="#3f6b4e">valid credential · zone permitted</text>

<!-- stat band -->
<rect x="64" y="452" width="1072" height="150" rx="16" fill="url(#dark)"/>
<text x="198" y="522" text-anchor="middle" font-size="34" font-weight="800" fill="#d4a755">3–5×</text>
<text x="198" y="552" text-anchor="middle" font-size="14.5" fill="#f4efe4">faster than barcode entry</text>
<text x="466" y="522" text-anchor="middle" font-size="33" font-weight="800" fill="#d4a755">15–20 / min</text>
<text x="466" y="552" text-anchor="middle" font-size="14.5" fill="#f4efe4">attendees per gate lane</text>
<text x="734" y="522" text-anchor="middle" font-size="33" font-weight="800" fill="#d4a755">200–500 ms</text>
<text x="734" y="552" text-anchor="middle" font-size="14.5" fill="#f4efe4">tap to gate decision</text>
<text x="1002" y="522" text-anchor="middle" font-size="34" font-weight="800" fill="#d4a755">&gt;99.7%</text>
<text x="1002" y="552" text-anchor="middle" font-size="14.5" fill="#f4efe4">peak read-rate target</text>
<line x1="332" y1="480" x2="332" y2="574" stroke="#c39a5f" stroke-width="1.5" opacity="0.45"/>
<line x1="600" y1="480" x2="600" y2="574" stroke="#c39a5f" stroke-width="1.5" opacity="0.45"/>
<line x1="868" y1="480" x2="868" y2="574" stroke="#c39a5f" stroke-width="1.5" opacity="0.45"/>

<text x="600" y="636" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Encode the permission once at fulfillment; the gate reads it in a single tap.</text>
</svg>
