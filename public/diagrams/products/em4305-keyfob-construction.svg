<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Cutaway anatomy of a 125 kHz LF RFID keyfob</title>
  <desc id="d">A cutaway of a 125 kHz LF keyfob showing five parts, labelled with leader lines: the housing (ABS, silicone rated IP68, or epoxy drop); a many-turn copper LF coil antenna tuned to 125 kHz; the EM4305 die carrying 512-bit EEPROM and a 32-bit password-lock cell; the 304 or 316 stainless split ring at the key-ring lug; and the potting that seals the cavity.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANATOMY OF A 125 kHz LF KEYFOB</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">The copper coil does the work; the housing decides how much abuse it survives</text>

  <!-- key-ring lug -->
  <circle cx="452" cy="352" r="46" fill="#f1e6cd" stroke="#c39a5f" stroke-width="3"/>
  <circle cx="452" cy="352" r="20" fill="#ffffff" stroke="#4a5568" stroke-width="6"/>

  <!-- fob body -->
  <rect x="470" y="228" width="352" height="248" rx="70" fill="#f7edd6" stroke="#e4c98f" stroke-width="3"/>
  <!-- coil turns -->
  <rect x="506" y="262" width="280" height="180" rx="54" fill="none" stroke="#c39a5f" stroke-width="4"/>
  <rect x="524" y="280" width="244" height="144" rx="44" fill="none" stroke="#c39a5f" stroke-width="3"/>
  <rect x="542" y="298" width="208" height="108" rx="36" fill="none" stroke="#c39a5f" stroke-width="3"/>
  <!-- chip die -->
  <rect x="616" y="326" width="60" height="52" rx="6" fill="#4a5568" stroke="#2f394a" stroke-width="2"/>
  <text x="646" y="357" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">die</text>

  <!-- left labels -->
  <text x="96" y="250" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">SPLIT RING</text>
  <text x="96" y="271" font-size="13.5" fill="#5c5c5c">304 / 316 stainless key-ring</text>
  <line x1="96" y1="284" x2="430" y2="332" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="96" y="440" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">POTTING</text>
  <text x="96" y="461" font-size="13.5" fill="#5c5c5c">seals cavity — silicone to IP68</text>
  <line x1="96" y1="452" x2="474" y2="430" stroke="#b9c0cc" stroke-width="1.5"/>

  <!-- right labels -->
  <text x="866" y="238" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">HOUSING</text>
  <text x="866" y="259" font-size="13.5" fill="#5c5c5c">ABS · silicone (IP68) · epoxy drop</text>
  <line x1="820" y1="252" x2="858" y2="248" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="866" y="352" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">LF COIL ANTENNA</text>
  <text x="866" y="373" font-size="13.5" fill="#5c5c5c">many-turn copper, tuned 125 kHz</text>
  <line x1="786" y1="352" x2="858" y2="360" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="866" y="452" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">EM4305 DIE</text>
  <text x="866" y="473" font-size="13.5" fill="#5c5c5c">512-bit EEPROM · 32-bit password lock</text>
  <line x1="676" y1="368" x2="858" y2="462" stroke="#b9c0cc" stroke-width="1.5"/>

  <!-- footnote -->
  <text x="600" y="614" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Off-metal the coil reads freely; on a metal surface it needs a spacer or an anti-metal variant.</text>
</svg>
