<text x="1041" y="392" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8b2d2d">sunset risk</text>

<!-- row White-label (recommended) -->
<rect x="64" y="426" width="1072" height="62" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<rect x="64" y="426" width="9" height="62" rx="4" fill="#1f6f3a"/>
<text x="94" y="456" font-size="15.5" font-weight="800" fill="#291c0e">White-label metal</text>
<text x="94" y="476" font-size="12" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">★ RECOMMENDED</text>
<text x="300" y="461" font-size="12.5" fill="#33595a">Enterprises, full control</text>
<text x="560" y="461" font-size="12.5" fill="#33595a">Own the URL; any NFC writer</text>
<rect x="966" y="441" width="150" height="32" rx="16" fill="#e7f2ea" stroke="#a9cfb5" stroke-width="1.2"/>
<text x="1041" y="462" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f6f3a">no lock-in</text>

<text x="600" y="548" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Own the profile URL and you own the risk profile.</text>
<text x="600" y="586" text-anchor="middle" font-size="14" fill="#5c5c5c">No per-seat fees, no platform sunset — any NFC writer updates the card in seconds.</text>
</svg>
