<text x="1034" y="278" text-anchor="middle" font-size="12.5" fill="#8b2d2d">no audit dates ✗</text>
<line x1="931" y1="321" x2="947" y2="321" stroke="#d9a89e" stroke-width="1.5"/>
<rect x="947" y="306" width="175" height="30" rx="15" fill="#ffffff" stroke="#d9a89e"/>
