<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A blank NFC tag and a working NFC tag are one NDEF write apart</title>
<desc id="d">Before-and-after panels. Before the write: a phone taps a blank NFC tag with a dormant antenna coil and nothing happens — the screen shows a stalled spinner and the caption reads technically flawless, spiritually a sticker. After the write: the same tag now carries a URI record, the phone opens the URL and shows a green check. A badge between the panels reads one NDEF write, confirmed in under 500 milliseconds.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW TO PROGRAM NFC TAGS · THE ONE STEP THAT DECIDES THE TAP</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">A blank tag and a working tag are one NDEF write apart</text>

<rect x="46" y="130" width="531" height="380" rx="16" fill="#f6f2e9" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="623" y="130" width="531" height="380" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="311" y="164" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BEFORE THE WRITE</text>
<text x="888" y="164" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#2c5454">AFTER THE WRITE</text>

<rect x="90" y="200" width="150" height="120" rx="14" fill="#ffffff" stroke="#d8d0c0" stroke-width="2"/>
<rect x="112" y="218" width="106" height="84" rx="10" fill="none" stroke="#b7cccc" stroke-width="2.5"/>
<rect x="124" y="230" width="82" height="60" rx="8" fill="none" stroke="#b7cccc" stroke-width="2"/>
<rect x="136" y="242" width="58" height="36" rx="6" fill="none" stroke="#b7cccc" stroke-width="1.5"/>
<rect x="157" y="252" width="16" height="16" rx="3" fill="#d8d0c0"/>
<text x="165" y="348" text-anchor="middle" font-size="13" fill="#5c5c5c">blank_tag.ndef — 0 bytes</text>

<path d="M 268 236 a 24 24 0 0 1 0 48" fill="none" stroke="#9db4b4" stroke-width="3" stroke-linecap="round"/>
<path d="M 284 224 a 36 36 0 0 1 0 72" fill="none" stroke="#b7cccc" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 8"/>
<path d="M 300 212 a 48 48 0 0 1 0 96" fill="none" stroke="#d3e0e0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 8"/>

<rect x="368" y="185" width="124" height="180" rx="18" fill="#4a5568"/>
<rect x="378" y="197" width="104" height="156" rx="10" fill="#ffffff"/>
<rect x="412" y="203" width="36" height="6" rx="3" fill="#4a5568"/>
<circle cx="430" cy="258" r="18" fill="none" stroke="#d8d0c0" stroke-width="5"/>
<path d="M 430 240 a 18 18 0 0 1 18 18" fill="none" stroke="#c39a5f" stroke-width="5" stroke-linecap="round"/>
<text x="430" y="308" text-anchor="middle" font-size="22" fill="#9a9284">· · ·</text>
<text x="430" y="386" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5c5c5c">Nothing happened.</text>

<rect x="216" y="420" width="190" height="32" rx="16" fill="#ffffff" stroke="#d8d0c0" stroke-width="1.5"/>
<text x="311" y="441" text-anchor="middle" font-size="13.5" font-weight="600" fill="#5c5c5c">tap → nothing</text>
<text x="311" y="486" text-anchor="middle" font-size="14" fill="#4f4f4f">Technically flawless. Spiritually, a sticker.</text>

<rect x="667" y="200" width="150" height="120" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="2"/>
<rect x="689" y="218" width="106" height="84" rx="10" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="701" y="230" width="82" height="60" rx="8" fill="none" stroke="#6f9494" stroke-width="2"/>
<rect x="713" y="242" width="58" height="36" rx="6" fill="none" stroke="#a3bfbf" stroke-width="1.5"/>
<rect x="734" y="252" width="16" height="16" rx="3" fill="#c39a5f"/>
<text x="742" y="348" text-anchor="middle" font-size="13" fill="#2c5454">one NDEF URI record on board</text>

<path d="M 845 236 a 24 24 0 0 1 0 48" fill="none" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round"/>
<path d="M 861 224 a 36 36 0 0 1 0 72" fill="none" stroke="#6f9494" stroke-width="2.5" stroke-linecap="round"/>
<path d="M 877 212 a 48 48 0 0 1 0 96" fill="none" stroke="#a3bfbf" stroke-width="2.5" stroke-linecap="round"/>

<rect x="945" y="185" width="124" height="180" rx="18" fill="#2c5454"/>
<rect x="955" y="197" width="104" height="156" rx="10" fill="#ffffff"/>
<rect x="989" y="203" width="36" height="6" rx="3" fill="#2c5454"/>
<rect x="963" y="218" width="88" height="20" rx="10" fill="#eef5f5"/>
<text x="1007" y="232" text-anchor="middle" font-size="12" fill="#2c5454">https://…</text>
<circle cx="1007" cy="277" r="17" fill="#1f6f3a"/>
<path d="M 999 277 l 6 6 l 11 -12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1007" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#291c0e">Menu opened</text>

<rect x="793" y="420" width="190" height="32" rx="16" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="888" y="441" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6f3a">tap → URL opens</text>
<text x="888" y="486" text-anchor="middle" font-size="14" fill="#291c0e">Same sticker. Now it does the thing.</text>

<rect x="536" y="228" width="128" height="84" rx="14" fill="#c39a5f"/>
<text x="600" y="258" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">ONE NDEF</text>
<text x="600" y="278" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">WRITE</text>
<text x="600" y="300" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f9f1e2">&lt; 500 ms</text>

<text x="600" y="560" text-anchor="middle" font-size="14" fill="#4f4f4f">NFC tags ship blank — writing NDEF data to the chip's EEPROM is the step that makes the tap do something.</text>
<text x="600" y="590" text-anchor="middle" font-size="13" fill="#5c5c5c">Everything downstream — menus, authentication, check-ins — rides on that one write.</text>
</svg>
