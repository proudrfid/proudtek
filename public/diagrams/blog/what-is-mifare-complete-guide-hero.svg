<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">One MIFARE brand name covers five different chips</title>
<desc id="d">A hero panel making the core point of the guide: a purchase order that says only "MIFARE" could deliver any of five different chips. On the left, a drawn contactless card labeled MIFARE, 13.56 MHz, ISO 14443-A, under a magnifier with a question mark, captioned "one card, one label — the chip inside could be any of the five." On the right, five colour-coded rows: MIFARE Ultralight EV1 with 48 / 128 bytes and UID or OTP only; MIFARE Classic EV1 1K/4K with 1 KB / 4 KB and the broken Crypto-1 cipher marked in red; MIFARE Plus EV2 with 2 KB / 4 KB and AES-128 across Security Levels 1 to 3; MIFARE DESFire EV3 with 2, 4 or 8 KB and AES-128 at EAL5+ marked green for secure; and MIFARE DESFire Light with 640 bytes and single-application AES-128. A footer notes they share one 13.56 MHz radio but differ wildly in memory, security and price.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="16%" r="94%">
    <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
  </radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MIFARE</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="36" font-weight="700" fill="#291c0e">One brand name, five different chips</text>
<text x="600" y="130" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Order "MIFARE" and you might get any of these — the specs are what differ.</text>

<!-- LEFT: the question -->
<rect x="60" y="166" width="356" height="396" rx="16" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="238" y="203" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ON THE PURCHASE ORDER</text>
<rect x="104" y="224" width="268" height="150" rx="12" fill="#ffffff" stroke="#4a5568" stroke-width="1.8"/>
<rect x="130" y="258" width="44" height="34" rx="5" fill="#d4a755" stroke="#c39a5f" stroke-width="1.4"/>
<line x1="130" y1="269" x2="174" y2="269" stroke="#b98f4e" stroke-width="1"/>
<line x1="130" y1="281" x2="174" y2="281" stroke="#b98f4e" stroke-width="1"/>
<line x1="152" y1="258" x2="152" y2="292" stroke="#b98f4e" stroke-width="1"/>
<path d="M 190 262 q 12 13 0 26" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<path d="M 200 255 q 18 20 0 40" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<text x="286" y="284" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="23" font-weight="800" fill="#291c0e">MIFARE</text>
<text x="286" y="312" text-anchor="middle" font-size="12.5" fill="#5c5c5c">13.56 MHz · ISO 14443-A</text>
<text x="286" y="352" text-anchor="middle" font-size="34" font-weight="800" fill="#e6dfd2">? ? ?</text>
<circle cx="349" cy="356" r="29" fill="#ffffff" fill-opacity="0.65" stroke="#234a4a" stroke-width="5"/>
<line x1="369" y1="377" x2="392" y2="400" stroke="#234a4a" stroke-width="6" stroke-linecap="round"/>
<text x="349" y="366" text-anchor="middle" font-size="26" font-weight="800" fill="#234a4a">?</text>
<text x="238" y="432" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">One card. One label.</text>
<text x="238" y="458" text-anchor="middle" font-size="14" fill="#4f4f4f">The chip inside could be any of</text>
<text x="238" y="478" text-anchor="middle" font-size="14" fill="#4f4f4f">the five on the right — and they</text>
<text x="238" y="498" text-anchor="middle" font-size="14" fill="#4f4f4f">are not interchangeable.</text>

<!-- RIGHT: the five lines -->
<!-- Row 0: Ultralight -->
<rect x="440" y="176" width="700" height="64" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="458" y="191" width="36" height="36" rx="9" fill="#eef1f5" stroke="#4a5568" stroke-width="1.6"/>
<text x="510" y="204" font-size="17" font-weight="700" fill="#291c0e">MIFARE Ultralight EV1</text>
<text x="510" y="226" font-size="13" fill="#5c5c5c">48 / 128 bytes</text>
<rect x="904" y="193" width="220" height="30" rx="15" fill="#eef1f5" stroke="#4a5568" stroke-width="1.3"/>
<text x="1014" y="213" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">UID / OTP · no crypto</text>

<!-- Row 1: Classic (broken) -->
<rect x="440" y="255" width="700" height="64" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="458" y="270" width="36" height="36" rx="9" fill="#fbeeee" stroke="#8b2d2d" stroke-width="1.6"/>
<text x="510" y="283" font-size="17" font-weight="700" fill="#291c0e">MIFARE Classic EV1 (1K/4K)</text>
<text x="510" y="305" font-size="13" fill="#5c5c5c">1 KB / 4 KB</text>
<rect x="904" y="272" width="220" height="30" rx="15" fill="#fbeeee" stroke="#8b2d2d" stroke-width="1.3"/>
<text x="1014" y="292" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">Crypto-1 · broken</text>

<!-- Row 2: Plus -->
<rect x="440" y="334" width="700" height="64" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="458" y="349" width="36" height="36" rx="9" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="510" y="362" font-size="17" font-weight="700" fill="#291c0e">MIFARE Plus EV2</text>
<text x="510" y="384" font-size="13" fill="#5c5c5c">2 KB / 4 KB</text>
<rect x="904" y="351" width="220" height="30" rx="15" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.3"/>
<text x="1014" y="371" text-anchor="middle" font-size="12.5" font-weight="700" fill="#234a4a">AES-128 · SL1–SL3</text>

<!-- Row 3: DESFire EV3 (secure) -->
<rect x="440" y="413" width="700" height="64" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="458" y="428" width="36" height="36" rx="9" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.6"/>
<text x="510" y="441" font-size="17" font-weight="700" fill="#291c0e">MIFARE DESFire EV3</text>
<text x="510" y="463" font-size="13" fill="#5c5c5c">2 / 4 / 8 KB</text>
<rect x="904" y="430" width="220" height="30" rx="15" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.3"/>
<text x="1014" y="450" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">AES-128 · EAL5+</text>

<!-- Row 4: DESFire Light -->
<rect x="440" y="492" width="700" height="64" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="458" y="507" width="36" height="36" rx="9" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="510" y="520" font-size="17" font-weight="700" fill="#291c0e">MIFARE DESFire Light</text>
<text x="510" y="542" font-size="13" fill="#5c5c5c">640 bytes</text>
<rect x="904" y="509" width="220" height="30" rx="15" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.3"/>
<text x="1014" y="529" text-anchor="middle" font-size="12.5" font-weight="700" fill="#234a4a">AES-128 · single-app</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Same 13.56 MHz radio and ISO 14443 Type A — wildly different memory, security and price.</text>
</svg>
