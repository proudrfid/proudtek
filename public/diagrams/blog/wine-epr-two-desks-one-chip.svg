<text x="600" y="548" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Two vocabularies, one chip quietly doing both jobs.</text>
<text x="600" y="578" text-anchor="middle" font-size="13.5" fill="#5c5c5c">That's how NFC graduated from cute gimmick to budget line item.</text>
