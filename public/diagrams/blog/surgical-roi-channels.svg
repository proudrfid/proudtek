<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="siRoiTitle siRoiDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="siRoiTitle">The three channels behind instrument RFID ROI, and the payback window</title>
  <desc id="siRoiDesc">Instrument RFID ROI comes from three channels: instrument-loss reduction worth 200 to 700 thousand dollars a year for a 10-OR hospital, retained-object prevention worth 200 thousand to 1 million dollars per avoided event, and faster OR turnover worth 400 thousand to 1.2 million dollars a year — plus 50 to 200 thousand dollars a year in sterilisation audit savings. Payback runs 12 to 24 months, or 6 to 12 at high-volume teaching hospitals.</desc>

  <defs>
    <radialGradient id="siRoiBg" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f1ece0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#siRoiBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="0.3" fill="#291c0e">Three unglamorous places the money comes from</text>
  <text x="600" y="89" text-anchor="middle" font-size="15" fill="#3d6b6b">Benchmarks from public ASHE and AORN reporting plus 2024–2026 case studies — numbers a CFO can check</text>

  <!-- channel 1 -->
  <rect x="62" y="118" width="696" height="98" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <circle cx="112" cy="167" r="26" fill="#e5f0ea" stroke="#1f6f3a" stroke-width="2"/>
  <path d="M100 175 l8 8 l16 -20" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="154" y="162" font-size="17.5" font-weight="800" fill="#291c0e">Instrument loss reduction</text>
  <text x="154" y="187" font-size="12.5" fill="#4f4f4f">5–15% → 1–2% on a $5M inventory (10-OR hospital)</text>
  <text x="738" y="176" text-anchor="end" font-size="25" font-weight="800" fill="#1f6f3a">$200K–700K/yr</text>

  <!-- channel 2 -->
  <rect x="62" y="228" width="696" height="98" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <circle cx="112" cy="277" r="26" fill="#e5f0ea" stroke="#1f6f3a" stroke-width="2"/>
  <path d="M112 262 v18 M112 288 v.5" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="112" cy="277" r="14" fill="none" stroke="#1f6f3a" stroke-width="2.4"/>
  <text x="154" y="272" font-size="17.5" font-weight="800" fill="#291c0e">Retained-object prevention</text>
  <text x="154" y="297" font-size="12.5" fill="#4f4f4f">per avoided event · 1–3 events / 10 ORs / yr baseline</text>
  <text x="738" y="286" text-anchor="end" font-size="25" font-weight="800" fill="#1f6f3a">$200K–1M</text>

  <!-- channel 3 -->
  <rect x="62" y="338" width="696" height="98" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <circle cx="112" cy="387" r="26" fill="#e5f0ea" stroke="#1f6f3a" stroke-width="2"/>
  <path d="M112 373 a14 14 0 1 1 -10 4" fill="none" stroke="#1f6f3a" stroke-width="2.4"/>
  <path d="M112 373 v8 h7" fill="none" stroke="#1f6f3a" stroke-width="2.4" stroke-linecap="round"/>
  <text x="154" y="382" font-size="17.5" font-weight="800" fill="#291c0e">Faster OR turnover</text>
  <text x="154" y="407" font-size="12.5" fill="#4f4f4f">5–15 min/case · 10 ORs × 6 cases/day × $30 staff cost</text>
  <text x="738" y="396" text-anchor="end" font-size="25" font-weight="800" fill="#1f6f3a">$400K–1.2M/yr</text>

  <!-- audit strip -->
  <rect x="62" y="448" width="696" height="60" rx="12" fill="#f7efdf" stroke="#e6d3a8" stroke-width="2"/>
  <text x="88" y="476" font-size="14.5" font-weight="700" fill="#7a5a1e">Plus sterilisation audit savings</text>
  <text x="88" y="497" font-size="12" fill="#8a6a2e">less manual logging + audit-ready records, fewer findings</text>
  <text x="738" y="486" text-anchor="end" font-size="19" font-weight="800" fill="#a9781f">$50K–200K/yr</text>

  <!-- payback gauge panel -->
  <rect x="782" y="118" width="356" height="390" rx="16" fill="#e9f1f0" stroke="#bcd3d3" stroke-width="2"/>
  <text x="960" y="158" text-anchor="middle" font-size="16.5" font-weight="800" letter-spacing="0.5" fill="#2c5454">PAYBACK PERIOD</text>

  <circle cx="960" cy="288" r="98" fill="none" stroke="#cfe0df" stroke-width="26"/>
  <path d="M960 190 a98 98 0 0 1 84.9 147" fill="none" stroke="#3d6b6b" stroke-width="26" stroke-linecap="round"/>
  <text x="960" y="286" text-anchor="middle" font-size="44" font-weight="800" fill="#2c5454">12–24</text>
  <text x="960" y="316" text-anchor="middle" font-size="15" fill="#4f6b6b">months, typical</text>

  <rect x="812" y="410" width="296" height="72" rx="12" fill="#ffffff" stroke="#cfe0df" stroke-width="1.5"/>
  <text x="960" y="440" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f6f3a">6–12 months</text>
  <text x="960" y="463" text-anchor="middle" font-size="12.5" fill="#4f4f4f">at high-volume teaching hospitals</text>

  <!-- footer takeaway -->
  <rect x="70" y="532" width="1060" height="104" rx="14" fill="#2a1d0f"/>
  <text x="100" y="570" font-size="15.5" font-weight="700" fill="#f0c98a">The business case:</text>
  <text x="272" y="570" font-size="15" fill="#f3ecdd">no single line carries it — the savings stack from loss, safety, turnover and audit prep.</text>
  <text x="100" y="602" font-size="15" fill="#f3ecdd">A single avoided retained-object event can cover much of the program on its own; the rest is</text>
  <text x="100" y="624" font-size="15" fill="#f3ecdd">recurring, year after year, once the tags are on.</text>
</svg>
