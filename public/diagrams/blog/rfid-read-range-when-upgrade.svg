<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">When tuning stops paying off, upgrade the tag: three levers and their gains</title>
<desc id="d">Three upgrade levers. Moving from an older-generation chip to a current-generation chip gains 2 to 4 dB of sensitivity, which translates to 30 to 50 percent more read range in the same environment. Moving from a compact tag to a larger antenna area captures more RF energy. Moving from adhesive-spacer workarounds to a purpose-built on-metal tag should be specified from the start. Proud Tek ships sample tags for in-environment range testing before a production order.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHEN TUNING STOPS PAYING · UPGRADE THE TAG</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Reach this conclusion before the purchase order, not after a warehouse full of inlays.</text>

<!-- row 1 -->
<rect x="64" y="130" width="1072" height="96" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="92" y="172" font-size="15.5" font-weight="700" fill="#5c5c5c">Older-generation chip</text>
<text x="92" y="196" font-size="12.5" fill="#8a8a8a">prior-gen sensitivity</text>
<line x1="300" y1="178" x2="330" y2="178" stroke="#291c0e" stroke-width="3"/><polygon points="330,171 348,178 330,185" fill="#291c0e"/>
<text x="366" y="172" font-size="15.5" font-weight="800" fill="#291c0e">Current-generation chip</text>
<text x="366" y="196" font-size="12.5" fill="#5c5c5c">2–4 dB more sensitive</text>
<rect x="820" y="152" width="290" height="52" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="965" y="184" text-anchor="middle" font-size="16" font-weight="800" fill="#1f6f3a">+2–4 dB → +30–50% range</text>

<!-- row 2 -->
<rect x="64" y="242" width="1072" height="96" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="92" y="284" font-size="15.5" font-weight="700" fill="#5c5c5c">Compact tag</text>
<text x="92" y="308" font-size="12.5" fill="#8a8a8a">small antenna area</text>
<line x1="300" y1="290" x2="330" y2="290" stroke="#291c0e" stroke-width="3"/><polygon points="330,283 348,290 330,297" fill="#291c0e"/>
<text x="366" y="284" font-size="15.5" font-weight="800" fill="#291c0e">Larger antenna area</text>
<text x="366" y="308" font-size="12.5" fill="#5c5c5c">captures more RF energy</text>
<rect x="820" y="264" width="290" height="52" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="965" y="296" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">more range, no system change</text>

<!-- row 3 -->
<rect x="64" y="354" width="1072" height="96" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="92" y="396" font-size="15.5" font-weight="700" fill="#5c5c5c">Adhesive-spacer workaround</text>
<text x="92" y="420" font-size="12.5" fill="#8a8a8a">general tag on metal</text>
<line x1="360" y1="402" x2="390" y2="402" stroke="#291c0e" stroke-width="3"/><polygon points="390,395 408,402 390,409" fill="#291c0e"/>
<text x="426" y="396" font-size="15.5" font-weight="800" fill="#291c0e">Purpose-built on-metal tag</text>
<text x="426" y="420" font-size="12.5" fill="#5c5c5c">designed for the surface</text>
<rect x="820" y="376" width="290" height="52" rx="12" fill="#eef0f4" stroke="#d4dae2" stroke-width="1.4"/>
<text x="965" y="408" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4457">specify from the start</text>

<rect x="64" y="474" width="1072" height="70" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.6"/>
<text x="600" y="506" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">Validate before you commit</text>
<text x="600" y="530" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Proud Tek ships sample tags for range testing in the exact conditions where they will be deployed.</text>
</svg>
