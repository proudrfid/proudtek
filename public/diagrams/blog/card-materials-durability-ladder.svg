<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Typical RFID card lifespan by material, in normal wallet use</title>
<desc id="d">Horizontal bar chart of typical card lifespan in years. PC reads ten plus years, ABS five to eight, PETG five to eight, PET five to seven, PVC three to five, wood veneer one to three, and paper under one year. Caption: the more heat and chemicals a material laughs off, the longer it lasts — polycarbonate is a decade-plus commitment.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">A BACK POCKET IS AN ACCELERATED-AGING LAB</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">How long each material survives real life</text>

<line x1="230" y1="140" x2="230" y2="585" stroke="#e6dfd2" stroke-width="1.5"/>
<line x1="385" y1="140" x2="385" y2="585" stroke="#e6dfd2" stroke-width="1.5"/>
<line x1="539" y1="140" x2="539" y2="585" stroke="#e6dfd2" stroke-width="1.5"/>
<line x1="694" y1="140" x2="694" y2="585" stroke="#e6dfd2" stroke-width="1.5"/>
<line x1="848" y1="140" x2="848" y2="585" stroke="#e6dfd2" stroke-width="1.5"/>
<line x1="1003" y1="140" x2="1003" y2="585" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="230" y="608" text-anchor="middle" font-size="12.5" fill="#5c5c5c">0</text>
<text x="385" y="608" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2</text>
<text x="539" y="608" text-anchor="middle" font-size="12.5" fill="#5c5c5c">4</text>
<text x="694" y="608" text-anchor="middle" font-size="12.5" fill="#5c5c5c">6</text>
<text x="848" y="608" text-anchor="middle" font-size="12.5" fill="#5c5c5c">8</text>
<text x="1003" y="608" text-anchor="middle" font-size="12.5" fill="#5c5c5c">10 yrs</text>

<text x="214" y="171" text-anchor="end" font-size="15" font-weight="600" fill="#291c0e">PC</text>
<rect x="230" y="150" width="773" height="30" rx="7" fill="#234a4a"/>
<text x="1015" y="171" font-size="13" font-weight="700" fill="#234a4a">10+ yrs</text>

<text x="214" y="233" text-anchor="end" font-size="15" font-weight="600" fill="#291c0e">ABS</text>
<rect x="230" y="212" width="618" height="30" rx="7" fill="#a97f43"/>
<text x="860" y="233" font-size="13" font-weight="700" fill="#a97f43">5–8 yrs</text>

<text x="214" y="295" text-anchor="end" font-size="15" font-weight="600" fill="#291c0e">PETG</text>
<rect x="230" y="274" width="618" height="30" rx="7" fill="#2d6a4f"/>
<text x="860" y="295" font-size="13" font-weight="700" fill="#2d6a4f">5–8 yrs</text>

<text x="214" y="357" text-anchor="end" font-size="15" font-weight="600" fill="#291c0e">PET</text>
<rect x="230" y="336" width="541" height="30" rx="7" fill="#4a5568"/>
<text x="783" y="357" font-size="13" font-weight="700" fill="#4a5568">5–7 yrs</text>

<text x="214" y="419" text-anchor="end" font-size="15" font-weight="600" fill="#291c0e">PVC</text>
<rect x="230" y="398" width="386" height="30" rx="7" fill="#3d6b6b"/>
<text x="628" y="419" font-size="13" font-weight="700" fill="#3d6b6b">3–5 yrs</text>

<text x="214" y="481" text-anchor="end" font-size="15" font-weight="600" fill="#291c0e">Wood veneer</text>
<rect x="230" y="460" width="232" height="30" rx="7" fill="#7a5636"/>
<text x="474" y="481" font-size="13" font-weight="700" fill="#7a5636">1–3 yrs</text>

<text x="214" y="543" text-anchor="end" font-size="15" font-weight="600" fill="#291c0e">Paper</text>
<rect x="230" y="522" width="39" height="30" rx="7" fill="#7d7060"/>
<text x="281" y="543" font-size="13" font-weight="700" fill="#7d7060">&lt;1 yr</text>

<text x="600" y="640" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The more heat and chemicals a material laughs off, the longer it lasts — polycarbonate is a decade-plus commitment.</text>
</svg>
