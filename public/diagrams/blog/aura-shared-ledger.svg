<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="auTitle auDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="auTitle">How the Aura Blockchain Consortium separates shared ledger from brand-private keys</title>
  <desc id="auDesc">The Aura Blockchain Consortium — co-founded by LVMH, Prada Group and Richemont, joined by OTB and Mercedes-Benz — runs a permissioned Ethereum-derivative network. Each brand keeps its own tag keys and customer data private, which matters for GDPR posture and for competitors sharing one ledger. The blockchain anchors only immutable proof-of-existence and chain-of-custody events. Aura publicly reported crossing 40 million encrypted products across member brands by 2024.</desc>
  <defs>
    <radialGradient id="auBg" cx="50%" cy="22%" r="86%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="auDark" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#auBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="1.5" fill="#6d5a3a">AURA: SHARED LEDGER, BRAND-PRIVATE KEYS</text>

  <!-- Members band -->
  <rect x="56" y="88" width="1088" height="86" rx="14" fill="#f4efe4" stroke="#e6dcc6" stroke-width="2"/>
  <text x="600" y="122" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="2" fill="#6d5a3a">CO-FOUNDERS &amp; MEMBERS</text>
  <text x="600" y="153" text-anchor="middle" font-size="23" font-weight="700" fill="#291c0e">LVMH · Prada Group · Richemont · OTB · Mercedes-Benz</text>

  <!-- Two boxes -->
  <!-- Left: brand keeps private -->
  <rect x="56" y="196" width="524" height="176" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2.5"/>
  <!-- padlock -->
  <g transform="translate(96,240)">
    <path d="M8 20 v-8 a18 18 0 0 1 36 0 v8" fill="none" stroke="#c39a5f" stroke-width="6"/>
    <rect x="0" y="20" width="52" height="42" rx="8" fill="#c39a5f"/>
    <circle cx="26" cy="40" r="6" fill="#ffffff"/>
  </g>
  <text x="176" y="256" font-size="23" font-weight="800" fill="#291c0e">Brand keeps private</text>
  <text x="176" y="292" font-size="18" fill="#4f4f4f">· Tag keys (set per chip)</text>
  <text x="176" y="322" font-size="18" fill="#4f4f4f">· Customer data — GDPR-safe</text>
  <text x="80" y="356" font-size="15" font-style="italic" fill="#6d5a3a">Competitors never see each other's data.</text>

  <!-- Right: ledger anchors only -->
  <rect x="620" y="196" width="524" height="176" rx="16" fill="#f1f5f5" stroke="#b9cfcf" stroke-width="2.5"/>
  <!-- chain links -->
  <g transform="translate(660,250)" fill="none" stroke="#3d6b6b" stroke-width="6">
    <rect x="0" y="6" width="34" height="22" rx="11"/>
    <rect x="24" y="6" width="34" height="22" rx="11"/>
  </g>
  <text x="740" y="256" font-size="23" font-weight="800" fill="#3d6b6b">Ledger anchors only</text>
  <text x="740" y="292" font-size="18" fill="#3f5b5b">· Proof-of-existence</text>
  <text x="740" y="322" font-size="18" fill="#3f5b5b">· Chain-of-custody events</text>
  <text x="644" y="356" font-size="15" font-style="italic" fill="#3d6b6b">Immutable — but no private keys on-chain.</text>

  <!-- Network bar -->
  <rect x="56" y="392" width="1088" height="82" rx="16" fill="url(#auDark)"/>
  <text x="600" y="430" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Permissioned Ethereum-derivative network</text>
  <text x="600" y="457" text-anchor="middle" font-size="15.5" fill="#e9d9b8">one shared trust anchor · brands compete on the same ledger</text>

  <!-- Coverage metric -->
  <text x="600" y="524" text-anchor="middle" font-size="42" font-weight="800" fill="#6d5a3a">40M+</text>
  <text x="600" y="556" text-anchor="middle" font-size="18" fill="#4f4f4f">encrypted products across member brands by 2024</text>

  <text x="600" y="612" text-anchor="middle" font-size="15.5" fill="#6d5a3a">Licensable to non-member maisons — the shared anchor without standing up a private chain.</text>
</svg>
