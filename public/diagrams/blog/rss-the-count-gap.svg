<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="gapTitle gapDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="gapTitle">A 96.8% compliant count still leaves a 3.2% gap</title>
  <desc id="gapDesc">A full-width bar shows manual sponge-count compliance at 96.8%, leaving a thin 3.2% gap that carries effectively all retained-sponge risk. Supporting figures: this trauma center had 2 retained-sponge events in the prior 12 months, one requiring reoperation with an $850K settlement; national retained-surgical-item incidence is about 1 in 5,500 operations, roughly 1,500 cases a year in US operating rooms.</desc>
  <defs>
    <radialGradient id="gapBg" cx="50%" cy="18%" r="95%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#gapBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="62" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="1.2" fill="#6d5a3a">A 96.8% COUNT STILL LEAVES A 3.2% GAP</text>

  <!-- scale -->
  <text x="110" y="150" font-size="13" fill="#6d5a3a">0%</text>
  <text x="1090" y="150" text-anchor="end" font-size="13" fill="#6d5a3a">100% of surgical counts</text>

  <!-- the bar -->
  <rect x="110" y="164" width="949" height="72" rx="8" fill="#c39a5f"/>
  <rect x="1059" y="164" width="31" height="72" rx="4" fill="#8b2d2d"/>
  <text x="584" y="208" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">COUNT LOGGED COMPLIANT — 96.8%</text>

  <!-- gap callout -->
  <line x1="1074" y1="236" x2="1074" y2="286" stroke="#8b2d2d" stroke-width="2"/>
  <rect x="628" y="286" width="452" height="46" rx="12" fill="#f6e7e6" stroke="#8b2d2d" stroke-width="1.5"/>
  <text x="854" y="314" text-anchor="middle" font-size="16" font-weight="700" fill="#8b2d2d">3.2% gap — carries effectively all RSS risk</text>

  <!-- supporting stat cards -->
  <rect x="110" y="372" width="455" height="205" rx="16" fill="#faf6ee" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="138" y="410" font-size="15" font-weight="800" letter-spacing="1.1" fill="#6d5a3a">THIS TRAUMA CENTER, PRIOR YEAR</text>
  <text x="196" y="512" text-anchor="middle" font-size="104" font-weight="800" fill="#8b2d2d">2</text>
  <text x="300" y="470" font-size="20" font-weight="700" fill="#291c0e">retained-sponge</text>
  <text x="300" y="497" font-size="20" fill="#291c0e">events in 12 months</text>
  <text x="300" y="536" font-size="15.5" fill="#6d5a3a">1 reoperation · $850K settlement</text>

  <rect x="625" y="372" width="465" height="205" rx="16" fill="#eef8fb" stroke="#cfe9f2" stroke-width="1.5"/>
  <text x="653" y="410" font-size="15" font-weight="800" letter-spacing="1.1" fill="#177a92">NATIONAL RSI INCIDENCE</text>
  <text x="857" y="482" text-anchor="middle" font-size="62" font-weight="800" fill="#291c0e">1 in 5,500</text>
  <text x="857" y="516" text-anchor="middle" font-size="16" fill="#291c0e">operations — about 1,500 cases a year in US ORs</text>
  <text x="857" y="542" text-anchor="middle" font-size="14" fill="#6d5a3a" font-style="italic">Mayo Clinic study, cited by STERIS</text>

  <text x="600" y="624" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Retained surgical items are CMS "never events" — yet still occur about 1 in 5,500 operations nationally.</text>
</svg>
