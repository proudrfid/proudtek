<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Anatomy of a wrist-worn RFID watch tag</title>
  <desc id="d">A watch-style RFID tag drawn front-on with a vertical silicone strap above and below a round watch-head case, labelled with leader lines: the watch-head case (38 to 42 mm ABS or zinc-alloy, IP67 or IP68 sealed); the many-turn copper HF inlay coil tuned so the worn watch resonates at 13.56 plus or minus 0.3 MHz; the chip (DESFire EV3 or NTAG213 / NTAG216); an anti-metal ferrite backing that isolates the coil from a zinc-alloy case; the ISO 10993-5 platinum-cured silicone band; and the 316L stainless buckle to EN 1811. A footnote states the antenna is tuned on an ASTM F2182 phantom wrist and re-checked live on-wrist, giving a worn read range of 2 to 4 cm.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANATOMY OF A WRIST-WORN RFID WATCH TAG</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">A sealed case, a body-tuned coil, and a band a guest will wear for a fortnight</text>

  <!-- straps (drawn first, tucked behind the head) -->
  <rect x="548" y="150" width="104" height="160" rx="26" fill="#f7edd6" stroke="#e4c98f" stroke-width="3"/>
  <rect x="548" y="404" width="104" height="168" rx="26" fill="#f7edd6" stroke="#e4c98f" stroke-width="3"/>
  <circle cx="600" cy="470" r="6" fill="#e4c98f"/>
  <circle cx="600" cy="498" r="6" fill="#e4c98f"/>
  <circle cx="600" cy="526" r="6" fill="#e4c98f"/>
  <!-- buckle -->
  <rect x="560" y="446" width="80" height="40" rx="7" fill="none" stroke="#4a5568" stroke-width="5"/>

  <!-- watch head -->
  <circle cx="600" cy="356" r="118" fill="#f1e6cd" stroke="#c39a5f" stroke-width="3"/>
  <circle cx="600" cy="356" r="104" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <!-- coil turns -->
  <circle cx="600" cy="356" r="94" fill="none" stroke="#c39a5f" stroke-width="4"/>
  <circle cx="600" cy="356" r="80" fill="none" stroke="#c39a5f" stroke-width="3"/>
  <circle cx="600" cy="356" r="66" fill="none" stroke="#c39a5f" stroke-width="3"/>
  <!-- chip die -->
  <rect x="574" y="332" width="52" height="48" rx="6" fill="#4a5568" stroke="#2f394a" stroke-width="2"/>
  <text x="600" y="362" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">chip</text>

  <!-- LEFT labels -->
  <text x="72" y="192" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">WATCH-HEAD CASE</text>
  <text x="72" y="213" font-size="13.5" fill="#5c5c5c">38-42 mm ABS · IP67 / IP68</text>
  <line x1="300" y1="202" x2="500" y2="300" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="72" y="350" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">HF INLAY COIL</text>
  <text x="72" y="371" font-size="13.5" fill="#5c5c5c">copper · tuned 13.56 ± 0.3 MHz</text>
  <line x1="300" y1="360" x2="506" y2="356" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="72" y="486" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">ANTI-METAL FERRITE</text>
  <text x="72" y="507" font-size="13.5" fill="#5c5c5c">isolates coil from zinc case</text>
  <line x1="300" y1="478" x2="506" y2="414" stroke="#b9c0cc" stroke-width="1.5"/>

  <!-- RIGHT labels -->
  <text x="838" y="192" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">CHIP</text>
  <text x="838" y="213" font-size="13.5" fill="#5c5c5c">DESFire EV3 · NTAG213 / NTAG216</text>
  <line x1="836" y1="204" x2="660" y2="344" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="838" y="350" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">SILICONE BAND</text>
  <text x="838" y="371" font-size="13.5" fill="#5c5c5c">ISO 10993-5 · latex-free</text>
  <line x1="836" y1="360" x2="654" y2="250" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="838" y="486" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">316L BUCKLE</text>
  <text x="838" y="507" font-size="13.5" fill="#5c5c5c">EN 1811 nickel-safe</text>
  <line x1="836" y1="478" x2="644" y2="466" stroke="#b9c0cc" stroke-width="1.5"/>

  <!-- footnote -->
  <text x="600" y="622" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Tuned on an ASTM F2182 phantom wrist, then re-checked live on-wrist — worn read range 2-4 cm.</text>
</svg>
