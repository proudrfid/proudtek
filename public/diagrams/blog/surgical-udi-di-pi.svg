<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="siUdiTitle siUdiDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="siUdiTitle">The FDA UDI on a reusable instrument splits into a Device Identifier and a Production Identifier</title>
  <desc id="siUdiDesc">The full UDI is a Device Identifier plus a Production Identifier. The DI identifies the model and is permanently marked on the device under 21 CFR 801.45, carried by laser-marked 2D DataMatrix or embedded RFID — both AIDC carriers — and resolved through AccessGUDID. The PI carries lot, serial, manufacture date and expiry, and for a reusable instrument lives in the hospital SPD record. GS1 application identifiers 01, 21, 17 and 10 feed the SPD system directly.</desc>

  <defs>
    <radialGradient id="siUdiBg" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f1ece0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#siUdiBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="0.3" fill="#291c0e">One identifier, two halves: UDI = DI + PI</text>
  <text x="600" y="89" text-anchor="middle" font-size="15" fill="#3d6b6b">Link the device ID to your SPD record and the chain runs from GUDID to a single procedure</text>
  <text x="600" y="122" text-anchor="middle" font-size="13.5" fill="#7a7060">The full UDI on a reusable surgical instrument is made of two parts:</text>

  <!-- DI box -->
  <rect x="80" y="146" width="486" height="286" rx="16" fill="#e9f1f0" stroke="#bcd3d3" stroke-width="2"/>
  <rect x="104" y="166" width="52" height="52" rx="10" fill="#3d6b6b"/>
  <text x="130" y="201" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">DI</text>
  <text x="172" y="188" font-size="18" font-weight="800" fill="#291c0e">Device Identifier</text>
  <text x="172" y="210" font-size="13" fill="#4f6b6b">identifies the model — stays on the device</text>
  <text x="104" y="252" font-size="13.5" fill="#33484a">Permanently marked on the device,</text>
  <text x="104" y="272" font-size="13.5" fill="#33484a">21 CFR 801.45 Direct Part Marking.</text>
  <text x="104" y="302" font-size="12" font-weight="700" letter-spacing="0.5" fill="#2c5454">AIDC CARRIERS — ONE OR BOTH</text>
  <rect x="104" y="312" width="196" height="40" rx="20" fill="#ffffff" stroke="#cfe0df" stroke-width="1.5"/>
  <text x="202" y="337" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">Laser 2D DataMatrix</text>
  <rect x="312" y="312" width="160" height="40" rx="20" fill="#ffffff" stroke="#cfe0df" stroke-width="1.5"/>
  <text x="392" y="337" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">Embedded RFID</text>
  <text x="104" y="386" font-size="13" fill="#4f6b6b">Resolves via AccessGUDID (NLM) → manufacturer</text>
  <text x="104" y="405" font-size="13" fill="#4f6b6b">attributes: sterilisation method, MR safety, reuse.</text>

  <!-- plus -->
  <text x="600" y="300" text-anchor="middle" font-size="40" font-weight="800" fill="#6c5127">+</text>

  <!-- PI box -->
  <rect x="634" y="146" width="486" height="286" rx="16" fill="#f7efdf" stroke="#e6d3a8" stroke-width="2"/>
  <rect x="658" y="166" width="52" height="52" rx="10" fill="#c39a5f"/>
  <text x="684" y="201" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">PI</text>
  <text x="726" y="188" font-size="18" font-weight="800" fill="#291c0e">Production Identifier</text>
  <text x="726" y="210" font-size="13" fill="#8a6a2e">identifies the unit — travels in records</text>
  <text x="658" y="252" font-size="13.5" fill="#5a4620">Lot · serial · manufacture date · expiry.</text>
  <text x="658" y="286" font-size="13.5" fill="#5a4620">For a reusable instrument the PI lives in the</text>
  <text x="658" y="306" font-size="13.5" fill="#5a4620">hospital record — scan history &amp; repair log,</text>
  <text x="658" y="326" font-size="13.5" fill="#5a4620">held in the SPD WMS.</text>
  <text x="658" y="386" font-size="13" fill="#8a6a2e">The RFID tag memory holds an opaque</text>
  <text x="658" y="405" font-size="13" fill="#8a6a2e">cross-reference to that record.</text>

  <!-- GS1 strip -->
  <rect x="80" y="452" width="1040" height="52" rx="12" fill="#2c5454"/>
  <text x="600" y="484" text-anchor="middle" font-size="14.5" font-weight="700" fill="#eaf3f2">GS1 GTIN feeds SPD directly — AI 01 GTIN · AI 21 serial · AI 17 expiry · AI 10 lot/batch</text>

  <!-- footer takeaway -->
  <rect x="70" y="524" width="1060" height="112" rx="14" fill="#2a1d0f"/>
  <text x="100" y="562" font-size="15.5" font-weight="700" fill="#f0c98a">The payoff:</text>
  <text x="208" y="562" font-size="15" fill="#f3ecdd">get the linkage right and every instrument tells its own story on demand — from the</text>
  <text x="100" y="586" font-size="15" fill="#f3ecdd">manufacturer's GUDID record all the way to one procedure. Get it wrong and you have merely</text>
  <text x="100" y="610" font-size="15" fill="#f3ecdd">built a faster, better-organized way to fail an audit.</text>
</svg>
