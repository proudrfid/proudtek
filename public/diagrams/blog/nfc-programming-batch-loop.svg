<rect x="996" y="170" width="140" height="34" rx="12" fill="#4a5568"/>
<rect x="996" y="190" width="140" height="14" fill="#4a5568"/>
<text x="1066" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">write_log</text>
<text x="1010" y="234" font-size="12" fill="#4f4f4f">04:2A ✓ /a1</text>
<text x="1010" y="258" font-size="12" fill="#4f4f4f">B1:7F ✓ /a2</text>
<text x="1010" y="282" font-size="12" fill="#4f4f4f">C9:03 ✓ /a3</text>
<text x="1010" y="306" font-size="12" fill="#4f4f4f">D2:88 ✓ /a4</text>
<line x1="1010" y1="322" x2="1122" y2="322" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="1010" y="348" font-size="13" font-weight="700" fill="#1f6f3a">200–400 / hour</text>
<text x="1010" y="372" font-size="12" fill="#5c5c5c">audit trail: happy</text>

<rect x="200" y="450" width="800" height="104" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="492" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="21" font-weight="700" fill="#291c0e">The operator's whole job: hear beep, swap tag, repeat.</text>
<text x="600" y="526" text-anchor="middle" font-size="14" fill="#4f4f4f">The script never mistypes and never asks for a raise — 200–400 tags per hour.</text>

<text x="600" y="606" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Past 1,000+ tags per day: conveyor-fed inline encoder, or let the tag supplier encode at the factory.</text>
</svg>
