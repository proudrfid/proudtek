<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Four RFID branding tiers compared: white-label, private label, OEM, ODM</title>
<desc id="d">A four-row comparison table. White-label changes only the logo, print and packaging on a stock tag, at a typical 1K to 10K MOQ and a 5 to 15 percent premium — the recommended starting tier. Private label adds catalog numbers, EAN or UPC barcodes and certification documents at a low premium. OEM commissions a custom antenna, chip combination or form factor at a 50K to 500K MOQ, a 10 to 30 percent premium and a 12 to 16 week lead time. ODM has the factory design the product while the distributor brings brand and channel — the highest investment, reserved for top SKUs.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FOUR BRANDING TIERS</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">From logo-on-a-stock-tag to a factory-designed exclusive — cost and control climb with each step.</text>

<!-- column headers -->
<text x="92" y="126" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">TIER</text>
<text x="300" y="126" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">WHAT CHANGES</text>
<text x="1116" y="126" text-anchor="end" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">MOQ · PREMIUM · LEAD</text>

<!-- row 1 white-label (recommended) -->
<rect x="64" y="140" width="1072" height="84" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/>
<rect x="64" y="140" width="9" height="84" rx="4" fill="#1f6f3a"/>
<text x="92" y="176" font-size="16.5" font-weight="800" fill="#291c0e">White-label</text>
<text x="92" y="200" font-size="12" font-weight="800" letter-spacing="0.4" fill="#1f6f3a">★ START HERE</text>
<text x="300" y="188" font-size="14" fill="#33595a">Logo, print &amp; packaging on a stock tag — same chip, same antenna.</text>
<text x="1116" y="176" text-anchor="end" font-size="15" font-weight="800" fill="#1f6f3a">MOQ 1K–10K · +5–15%</text>
<text x="1116" y="200" text-anchor="end" font-size="12.5" fill="#33595a">fastest turnaround</text>

<!-- row 2 private label -->
<rect x="64" y="236" width="1072" height="84" rx="12" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.3"/>
<rect x="64" y="236" width="9" height="84" rx="4" fill="#3d6b6b"/>
<text x="92" y="272" font-size="16.5" font-weight="800" fill="#291c0e">Private label</text>
<text x="92" y="296" font-size="12" fill="#8a8a8a">volume graduate</text>
<text x="300" y="284" font-size="14" fill="#4f4f4f">White-label + catalog numbering, EAN/UPC barcode, cert documents.</text>
<text x="1116" y="272" text-anchor="end" font-size="15" font-weight="800" fill="#2c5454">low premium</text>
<text x="1116" y="296" text-anchor="end" font-size="12.5" fill="#5c5c5c">integrates with your ERP/PIM</text>

<!-- row 3 OEM -->
<rect x="64" y="332" width="1072" height="84" rx="12" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.3"/>
<rect x="64" y="332" width="9" height="84" rx="4" fill="#4a5568"/>
<text x="92" y="368" font-size="16.5" font-weight="800" fill="#291c0e">OEM</text>
<text x="92" y="392" font-size="12" fill="#8a8a8a">distributor-exclusive SKU</text>
<text x="300" y="380" font-size="14" fill="#4f4f4f">Factory builds to your spec — custom antenna, chip combo or form factor.</text>
<text x="1116" y="368" text-anchor="end" font-size="15" font-weight="800" fill="#3a4453">MOQ 50K–500K · +10–30%</text>
<text x="1116" y="392" text-anchor="end" font-size="12.5" fill="#5c5c5c">12–16 week lead</text>

<!-- row 4 ODM -->
<rect x="64" y="428" width="1072" height="84" rx="12" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.3"/>
<rect x="64" y="428" width="9" height="84" rx="4" fill="#c39a5f"/>
<text x="92" y="464" font-size="16.5" font-weight="800" fill="#291c0e">ODM</text>
<text x="92" y="488" font-size="12" fill="#8a8a8a">design + build</text>
<text x="300" y="476" font-size="14" fill="#4f4f4f">Factory designs the product; you contribute brand and channel.</text>
<text x="1116" y="464" text-anchor="end" font-size="15" font-weight="800" fill="#6d5a3a">highest investment</text>
<text x="1116" y="488" text-anchor="end" font-size="12.5" fill="#5c5c5c">reserve for top-3 SKUs</text>

<text x="600" y="560" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">One word, four invoices — agree which tier you mean before the quote.</text>
<text x="600" y="596" text-anchor="middle" font-size="14" fill="#5c5c5c">Most programs start white-label and climb only when a SKU's volume earns the tooling.</text>
</svg>
