<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="wbTitle wbDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="wbTitle">Guest RFID wristbands by the job they do</title>
  <desc id="wbDesc">Four wristband types, all IP67-rated. PVC wristband for day-guest water parks, pools and events, using NTAG 213 or MIFARE Classic 1K. Silicone wristband for multi-day resorts and spa programs, using MIFARE Classic 1K or DESFire EV3. All-inclusive band for all-inclusive resorts and cashless food and beverage, using MIFARE DESFire EV3. Cashless payment band for resort spending and phone-tap top-up, using NTAG 424 DNA or DESFire EV3. The choice is driven by band material, water exposure and wear-time, not the chip alone.</desc>

  <defs>
    <radialGradient id="wbGlow" cx="50%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#wbGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="64" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2.5" fill="#6d5a3a">GUEST WRISTBANDS, BY THE JOB THEY DO</text>
  <text x="600" y="90" text-anchor="middle" font-size="13.5" fill="#a0895f">Less about the chip, more about material, water exposure and wear-time</text>

  <!-- shared icon macro drawn per card -->
  <!-- Card 1: PVC -->
  <g>
    <rect x="72" y="120" width="240" height="384" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="192" cy="188" r="34" fill="#6c5127"/>
    <ellipse cx="192" cy="188" rx="16" ry="22" fill="none" stroke="#ffffff" stroke-width="5"/>
    <rect x="184" y="199" width="16" height="12" rx="2" fill="#c39a5f"/>
    <path d="M211 178 a14 14 0 0 1 0 20" fill="none" stroke="#1fcefb" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="164" y="240" width="56" height="26" rx="13" fill="#1fcefb"/>
    <text x="192" y="258" text-anchor="middle" font-size="13" font-weight="800" fill="#06323d">IP67</text>
    <text x="192" y="304" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">PVC wristband</text>
    <text x="192" y="334" text-anchor="middle" font-size="12.5" fill="#6d5a3a">Day-guest water parks,</text>
    <text x="192" y="352" text-anchor="middle" font-size="12.5" fill="#6d5a3a">pools &amp; events</text>
    <line x1="96" y1="380" x2="288" y2="380" stroke="#e5e9ed" stroke-width="1.5"/>
    <text x="192" y="404" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1" fill="#a0895f">TYPICAL CHIP</text>
    <text x="192" y="428" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6c5127">NTAG 213 /</text>
    <text x="192" y="447" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6c5127">MIFARE Classic 1K</text>
  </g>

  <!-- Card 2: Silicone -->
  <g>
    <rect x="344" y="120" width="240" height="384" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="464" cy="188" r="34" fill="#6c5127"/>
    <ellipse cx="464" cy="188" rx="16" ry="22" fill="none" stroke="#ffffff" stroke-width="5"/>
    <rect x="456" y="199" width="16" height="12" rx="2" fill="#c39a5f"/>
    <path d="M483 178 a14 14 0 0 1 0 20" fill="none" stroke="#1fcefb" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="436" y="240" width="56" height="26" rx="13" fill="#1fcefb"/>
    <text x="464" y="258" text-anchor="middle" font-size="13" font-weight="800" fill="#06323d">IP67</text>
    <text x="464" y="304" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Silicone wristband</text>
    <text x="464" y="334" text-anchor="middle" font-size="12.5" fill="#6d5a3a">Multi-day resorts,</text>
    <text x="464" y="352" text-anchor="middle" font-size="12.5" fill="#6d5a3a">spa programs · long-wear</text>
    <line x1="368" y1="380" x2="560" y2="380" stroke="#e5e9ed" stroke-width="1.5"/>
    <text x="464" y="404" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1" fill="#a0895f">TYPICAL CHIP</text>
    <text x="464" y="428" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6c5127">MIFARE Classic 1K /</text>
    <text x="464" y="447" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6c5127">DESFire EV3</text>
  </g>

  <!-- Card 3: All-inclusive -->
  <g>
    <rect x="616" y="120" width="240" height="384" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="736" cy="188" r="34" fill="#6c5127"/>
    <ellipse cx="736" cy="188" rx="16" ry="22" fill="none" stroke="#ffffff" stroke-width="5"/>
    <rect x="728" y="199" width="16" height="12" rx="2" fill="#c39a5f"/>
    <path d="M755 178 a14 14 0 0 1 0 20" fill="none" stroke="#1fcefb" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="708" y="240" width="56" height="26" rx="13" fill="#1fcefb"/>
    <text x="736" y="258" text-anchor="middle" font-size="13" font-weight="800" fill="#06323d">IP67</text>
    <text x="736" y="304" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">All-inclusive band</text>
    <text x="736" y="334" text-anchor="middle" font-size="12.5" fill="#6d5a3a">All-inclusive resorts,</text>
    <text x="736" y="352" text-anchor="middle" font-size="12.5" fill="#6d5a3a">cashless F&amp;B</text>
    <line x1="640" y1="380" x2="832" y2="380" stroke="#e5e9ed" stroke-width="1.5"/>
    <text x="736" y="404" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1" fill="#a0895f">TYPICAL CHIP</text>
    <text x="736" y="435" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6c5127">MIFARE DESFire EV3</text>
  </g>

  <!-- Card 4: Cashless -->
  <g>
    <rect x="888" y="120" width="240" height="384" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="1008" cy="188" r="34" fill="#6c5127"/>
    <ellipse cx="1008" cy="188" rx="16" ry="22" fill="none" stroke="#ffffff" stroke-width="5"/>
    <rect x="1000" y="199" width="16" height="12" rx="2" fill="#c39a5f"/>
    <path d="M1027 178 a14 14 0 0 1 0 20" fill="none" stroke="#1fcefb" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="980" y="240" width="56" height="26" rx="13" fill="#1fcefb"/>
    <text x="1008" y="258" text-anchor="middle" font-size="13" font-weight="800" fill="#06323d">IP67</text>
    <text x="1008" y="304" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Cashless payment</text>
    <text x="1008" y="334" text-anchor="middle" font-size="12.5" fill="#6d5a3a">Resort spending,</text>
    <text x="1008" y="352" text-anchor="middle" font-size="12.5" fill="#6d5a3a">phone-tap top-up</text>
    <line x1="912" y1="380" x2="1104" y2="380" stroke="#e5e9ed" stroke-width="1.5"/>
    <text x="1008" y="404" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1" fill="#a0895f">TYPICAL CHIP</text>
    <text x="1008" y="428" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6c5127">NTAG 424 DNA /</text>
    <text x="1008" y="447" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6c5127">DESFire EV3</text>
  </g>

  <text x="600" y="556" text-anchor="middle" font-size="15" fill="#6d5a3a">Every band ships IP67-rated — the chip is matched to how the guest pays and how long they wear it.</text>
</svg>
