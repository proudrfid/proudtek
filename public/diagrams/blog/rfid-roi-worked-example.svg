<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Worked RFID ROI example for a mid-size distribution center</title>
<desc id="d">A worked example for a mid-size distribution center of about 25,000 SKUs across 5 sites. Two bars compare annual count cost: 180 thousand dollars manual versus 35 thousand dollars post-RFID, an annual labor saving of 145 thousand dollars. Three cards on the right: first-year investment of 120 thousand dollars for tags, readers, middleware and integration; a one-time ghost-asset cleanup worth 50 to 100 thousand dollars in year one; and a full payback in under 12 months. Savings clear the outlay inside the first year, before the one-time cleanup even lands.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WORKED EXAMPLE · MID-SIZE DC</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">~25,000 SKUs across 5 sites — the numbers a controller checks.</text>

<!-- left: cost bars -->
<text x="310" y="150" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANNUAL COUNT COST</text>
<line x1="120" y1="470" x2="500" y2="470" stroke="#d9d2c4" stroke-width="2"/>
<rect x="150" y="200" width="130" height="270" rx="6" fill="#4a5568"/>
<text x="215" y="190" text-anchor="middle" font-size="22" font-weight="800" fill="#4a5568">$180K</text>
<text x="215" y="490" text-anchor="middle" font-size="13" fill="#5c5c5c">Manual / yr</text>
<rect x="340" y="418" width="130" height="52" rx="6" fill="#3d6b6b"/>
<text x="405" y="408" text-anchor="middle" font-size="22" font-weight="800" fill="#2c5454">$35K</text>
<text x="405" y="490" text-anchor="middle" font-size="13" fill="#5c5c5c">Post-RFID / yr</text>
<text x="310" y="524" text-anchor="middle" font-size="15" font-weight="800" fill="#1f6f3a">annual labor saving: $145K</text>

<!-- right: stacked cards -->
<rect x="540" y="150" width="580" height="108" rx="14" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.8"/>
<rect x="540" y="150" width="580" height="8" rx="4" fill="#4a5568"/>
<text x="566" y="196" font-size="14" font-weight="800" fill="#3f4657">FIRST-YEAR INVESTMENT</text>
<text x="1094" y="208" text-anchor="end" font-size="34" font-weight="800" fill="#4a5568">$120K</text>
<text x="566" y="232" font-size="12.5" fill="#5c5c5c">tags + readers + middleware + integration</text>

<rect x="540" y="278" width="580" height="108" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="540" y="278" width="580" height="8" rx="4" fill="#3d6b6b"/>
<text x="566" y="324" font-size="14" font-weight="800" fill="#2c5454">GHOST-ASSET CLEANUP</text>
<text x="1094" y="336" text-anchor="end" font-size="34" font-weight="800" fill="#2c5454">$50-100K</text>
<text x="566" y="360" font-size="12.5" fill="#5c5c5c">one-time, year 1 — depreciation write-off</text>

<rect x="540" y="406" width="580" height="108" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="540" y="406" width="580" height="8" rx="4" fill="#c39a5f"/>
<text x="566" y="452" font-size="14" font-weight="800" fill="#6d5a3a">FULL PAYBACK</text>
<text x="1094" y="464" text-anchor="end" font-size="34" font-weight="800" fill="#1f6f3a">&lt; 12 months</text>
<text x="566" y="488" font-size="12.5" fill="#6d5a3a">labor savings alone clear the investment</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Savings clear the outlay inside year one — before the one-time cleanup even lands.</text>
</svg>
