<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">HF at 13.56 MHz — the band your phone speaks</title>
<desc id="d">Hub diagram. A central 13.56 MHz badge connects to four everyday uses: an NFC phone, a hotel key card, a transit and payment smart card, and a library tag. Two protocol notes underneath: ISO 14443 runs up to 848 kbit/s and covers the NTAG and MIFARE chips every phone reads; ISO 15693 runs at 26 kbit/s and gives ICODE library tags up to one-metre reads on big antennas. Caption: NFC is a subset of HF RFID — the flavour your phone speaks.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HF · 13.56 MHz · THE DIPLOMAT BAND</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">One frequency, everything you tap in a normal day</text>

<line x1="600" y1="300" x2="330" y2="200" stroke="#cfe0e0" stroke-width="2.5"/>
<line x1="600" y1="300" x2="870" y2="200" stroke="#cfe0e0" stroke-width="2.5"/>
<line x1="600" y1="300" x2="330" y2="410" stroke="#cfe0e0" stroke-width="2.5"/>
<line x1="600" y1="300" x2="870" y2="410" stroke="#cfe0e0" stroke-width="2.5"/>

<circle cx="600" cy="300" r="74" fill="#3d6b6b" stroke="#2c5454" stroke-width="3"/>
<text x="600" y="292" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">13.56</text>
<text x="600" y="318" text-anchor="middle" font-size="16" font-weight="600" fill="#eef5f5">MHz</text>

<rect x="180" y="150" width="300" height="90" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<rect x="205" y="167" width="34" height="56" rx="6" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<circle cx="222" cy="212" r="3" fill="#2c5454"/>
<text x="256" y="188" font-size="16" font-weight="700" fill="#291c0e">NFC phone</text>
<text x="256" y="212" font-size="13" fill="#4f4f4f">reads ISO 14443A out of the box</text>

<rect x="720" y="150" width="300" height="90" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<rect x="745" y="172" width="72" height="46" rx="6" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<circle cx="766" cy="195" r="9" fill="none" stroke="#c39a5f" stroke-width="2"/>
<text x="832" y="188" font-size="16" font-weight="700" fill="#291c0e">Hotel key card</text>
<text x="832" y="212" font-size="13" fill="#4f4f4f">MIFARE Classic / Plus / DESFire</text>

<rect x="180" y="370" width="300" height="90" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<rect x="205" y="392" width="72" height="46" rx="6" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<path d="M 214 415 h 54" stroke="#c39a5f" stroke-width="3"/>
<text x="292" y="408" font-size="16" font-weight="700" fill="#291c0e">Transit &amp; payment</text>
<text x="292" y="432" font-size="13" fill="#4f4f4f">tap-to-pay, metro gates, ID badges</text>

<rect x="720" y="370" width="300" height="90" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<rect x="745" y="388" width="52" height="56" rx="4" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<line x1="757" y1="400" x2="757" y2="432" stroke="#c39a5f" stroke-width="2.5"/>
<text x="812" y="408" font-size="16" font-weight="700" fill="#291c0e">Library tag</text>
<text x="812" y="432" font-size="13" fill="#4f4f4f">ICODE · up to 1 m on big antennas</text>

<g font-size="14">
<rect x="120" y="505" width="460" height="62" rx="12" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="350" y="530" text-anchor="middle" font-weight="700" fill="#6d5a3a">ISO 14443 · up to 848 kbit/s</text>
<text x="350" y="552" text-anchor="middle" fill="#4f4f4f">NTAG · MIFARE — the chips every phone reads</text>
<rect x="620" y="505" width="460" height="62" rx="12" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="850" y="530" text-anchor="middle" font-weight="700" fill="#6d5a3a">ISO 15693 · 26 kbit/s</text>
<text x="850" y="552" text-anchor="middle" fill="#4f4f4f">ICODE — slower, but reads farther on library antennas</text>
</g>
<text x="600" y="620" text-anchor="middle" font-size="14" fill="#5c5c5c">"Should we use NFC or HF?" is like asking for a beverage or a coffee — NFC is HF, just the flavour your phone speaks.</text>
</svg>
