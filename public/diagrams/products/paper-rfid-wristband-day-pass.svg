<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">One-day duty roster — where a USD 0.10-0.25 band earns its keep</title>
  <desc id="d">Four day-use scenes: hospital outpatient and emergency arrivals, construction and campus day visitors, school field trips and camps, and beer or food festival light-cashless colour coding — all priced at roughly USD 0.10-0.25 per band at MOQ 200-10,000 with chip and print.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Costs like a coffee lid, works like a credential</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Roughly USD 0.10-0.25 per band at MOQ 200-10,000, chip and print included</text>
  <g transform="translate(70,150)" font-family="Helvetica, Arial, sans-serif" font-size="13">
    <rect x="0" y="0" width="500" height="150" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="16" fill="#2c5454">🏥 Hospital day-use</text>
    <text x="24" y="72" fill="#2c5454">Outpatient surgery · emergency arrivals ·</text>
    <text x="24" y="94" fill="#2c5454">ambulatory clinic day-visits</text>
    <text x="24" y="126" fill="#6d5a3a">ID that lives exactly as long as the visit</text>
    <rect x="550" y="0" width="500" height="150" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="574" y="40" font-family="Georgia, serif" font-size="16" fill="#291c0e">🏗️ Visitor management</text>
    <text x="574" y="72" fill="#2c5454">Construction-site day visitors · corporate-</text>
    <text x="574" y="94" fill="#2c5454">campus contractors · secure-facility passes</text>
    <text x="574" y="126" fill="#6d5a3a">issue at the gate, expire at sundown</text>
    <rect x="0" y="180" width="500" height="150" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="220" font-family="Georgia, serif" font-size="16" fill="#291c0e">🎒 Schools + camps</text>
    <text x="24" y="252" fill="#2c5454">Field trips · sports days · summer camps ·</text>
    <text x="24" y="274" fill="#2c5454">university orientation</text>
    <text x="24" y="306" fill="#6d5a3a">headcount that taps instead of shouts</text>
    <rect x="550" y="180" width="500" height="150" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="574" y="220" font-family="Georgia, serif" font-size="16" fill="#2c5454">🍺 Light cashless + loyalty</text>
    <text x="574" y="252" fill="#2c5454">Beer festivals · wine tastings · food events —</text>
    <text x="574" y="274" fill="#2c5454">colour-coded bands track consumption</text>
    <text x="574" y="306" fill="#6d5a3a">tap for tokens, no cash box</text>
  </g>
  <text x="70" y="560" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Single-event lifecycle by design — coated paper composts in industrial streams where infrastructure exists</text>
</svg>
