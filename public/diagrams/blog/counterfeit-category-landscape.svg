<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="caTitle caDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="caTitle">Which categories drive anti-counterfeit RFID/NFC adoption</title>
  <desc id="caDesc">Five counterfeit categories ranked by what drives RFID/NFC investment. Apparel and footwear lead seizure volume per US CBP FY2023 reports and use NTAG 424 DNA plus UHF inlays. Watches and jewellery are highest unit value at roughly 10 percent of CBP IPR seizure value and use NTAG 424 DNA with Aura provenance. Beauty and personal care drive the most consumer engagement with NTAG 424 DNA and loyalty apps. Wine, spirits and pharma are regulated under EU FMD and US DSCSA Phase 3, using NTAG 424 or 213 TT tamper chips. Electronics, automotive parts and toys are fastest-growing and B2B-only, using NFC and UHF with CE mark and ASTM F963.</desc>
  <defs>
    <radialGradient id="caBg" cx="50%" cy="18%" r="92%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#caBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="56" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2" fill="#6d5a3a">WHERE THE ANTI-COUNTERFEIT BUDGET GOES</text>
  <text x="600" y="84" text-anchor="middle" font-size="15.5" fill="#4f4f4f">It follows the seizure data — and each category leans on a different secure chip.</text>

  <!-- Row 1 -->
  <rect x="56" y="104" width="1088" height="82" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="92" cy="145" r="20" fill="#c39a5f"/><text x="92" y="152" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">1</text>
  <g transform="translate(150,145)" fill="none" stroke="#6d5a3a" stroke-width="3" stroke-linejoin="round"><path d="M-14 -12 l7 -5 l7 4 l7 -4 l7 5 l-4 8 l-4 -2 v18 h-16 v-18 l-4 2 Z" fill="#efe0bf"/></g>
  <text x="186" y="139" font-size="20" font-weight="800" fill="#291c0e">Apparel &amp; footwear</text>
  <text x="186" y="163" font-size="14" fill="#4f4f4f">Highest seizure volume — US CBP FY2023 IPR reports (Nike · Adidas · LVMH)</text>
  <rect x="852" y="123" width="276" height="44" rx="22" fill="#ffffff" stroke="#c39a5f" stroke-width="1.6"/><text x="990" y="150" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">NTAG 424 DNA + UHF inlays</text>

  <!-- Row 2 -->
  <rect x="56" y="196" width="1088" height="82" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="92" cy="237" r="20" fill="#c39a5f"/><text x="92" y="244" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">2</text>
  <g transform="translate(150,237)" fill="none" stroke="#6d5a3a" stroke-width="3"><circle cx="0" cy="0" r="13" fill="#efe0bf"/><path d="M0 0 v-7 M0 0 l6 4" stroke-linecap="round"/><path d="M-5 -14 l10 0 M-5 14 l10 0" stroke-width="4" stroke-linecap="round"/></g>
  <text x="186" y="231" font-size="20" font-weight="800" fill="#291c0e">Watches &amp; jewellery</text>
  <text x="186" y="255" font-size="14" fill="#4f4f4f">Highest unit value · ~10% of CBP IPR seizure value (Vacheron Constantin · Hublot)</text>
  <rect x="852" y="215" width="276" height="44" rx="22" fill="#ffffff" stroke="#c39a5f" stroke-width="1.6"/><text x="990" y="242" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">NTAG 424 DNA + Aura ledger</text>

  <!-- Row 3 -->
  <rect x="56" y="288" width="1088" height="82" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="92" cy="329" r="20" fill="#c39a5f"/><text x="92" y="336" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">3</text>
  <g transform="translate(150,329)" stroke="#6d5a3a" stroke-width="3" stroke-linejoin="round"><rect x="-9" y="-4" width="18" height="22" rx="3" fill="#efe0bf"/><rect x="-5" y="-12" width="10" height="8" fill="#efe0bf"/><line x1="-9" y1="4" x2="9" y2="4" stroke-width="2.5"/></g>
  <text x="186" y="323" font-size="20" font-weight="800" fill="#291c0e">Beauty &amp; personal care</text>
  <text x="186" y="347" font-size="14" fill="#4f4f4f">Highest consumer engagement · mobile loyalty apps (Estée Lauder · L'Oréal · Dior)</text>
  <rect x="852" y="307" width="276" height="44" rx="22" fill="#ffffff" stroke="#c39a5f" stroke-width="1.6"/><text x="990" y="334" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">NTAG 424 DNA + loyalty app</text>

  <!-- Row 4 -->
  <rect x="56" y="380" width="1088" height="82" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="92" cy="421" r="20" fill="#c39a5f"/><text x="92" y="428" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">4</text>
  <g transform="translate(150,421)" stroke="#6d5a3a" stroke-width="3" stroke-linejoin="round" fill="#efe0bf"><path d="M-5 -14 h10 v6 l3 6 v18 a3 3 0 0 1 -3 3 h-10 a3 3 0 0 1 -3 -3 v-18 l3 -6 Z"/></g>
  <text x="186" y="415" font-size="20" font-weight="800" fill="#291c0e">Wine, spirits &amp; pharma</text>
  <text x="186" y="439" font-size="14" fill="#4f4f4f">Regulated · EU FMD serialisation · US DSCSA Phase 3 (Hennessy · Pernod Ricard)</text>
  <rect x="852" y="399" width="276" height="44" rx="22" fill="#ffffff" stroke="#c39a5f" stroke-width="1.6"/><text x="990" y="426" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">NTAG 424 / 213 TT tamper</text>

  <!-- Row 5 -->
  <rect x="56" y="472" width="1088" height="82" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="92" cy="513" r="20" fill="#c39a5f"/><text x="92" y="520" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">5</text>
  <g transform="translate(150,513)" stroke="#6d5a3a" stroke-width="3" stroke-linejoin="round"><rect x="-11" y="-11" width="22" height="22" rx="3" fill="#efe0bf"/><g stroke-width="2.5" stroke-linecap="round"><line x1="-6" y1="-15" x2="-6" y2="-11"/><line x1="0" y1="-15" x2="0" y2="-11"/><line x1="6" y1="-15" x2="6" y2="-11"/><line x1="-6" y1="11" x2="-6" y2="15"/><line x1="0" y1="11" x2="0" y2="15"/><line x1="6" y1="11" x2="6" y2="15"/><line x1="-15" y1="-6" x2="-11" y2="-6"/><line x1="-15" y1="0" x2="-11" y2="0"/><line x1="11" y1="-6" x2="15" y2="-6"/><line x1="11" y1="0" x2="15" y2="0"/></g></g>
  <text x="186" y="507" font-size="20" font-weight="800" fill="#291c0e">Electronics, auto &amp; toys</text>
  <text x="186" y="531" font-size="14" fill="#4f4f4f">Fastest-growing · B2B-only · CE mark · ASTM F963 (Cisco · Intel · Disney)</text>
  <rect x="852" y="491" width="276" height="44" rx="22" fill="#ffffff" stroke="#c39a5f" stroke-width="1.6"/><text x="990" y="518" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">NFC / UHF authentication</text>

  <text x="600" y="600" text-anchor="middle" font-size="14.5" font-style="italic" fill="#6d5a3a">The counterfeit trade was ~$464B in 2019 (OECD) — investment intensity tracks each category's seizure data.</text>
</svg>
