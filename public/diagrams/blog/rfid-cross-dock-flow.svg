<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID cross-docking flow from inbound read to outbound door</title>
<desc id="d">A left-to-right cross-docking flow. An inbound trailer's cases are read by a UHF portal on entry. A routing node applies the warehouse system's destination rules and assigns an outbound door. Conveyor divert readers send each case to one of three outbound doors. Two stat chips beneath report that error rates fall from one to three percent with manual barcode handling to under 0.1 percent with RFID, and throughput rises 20 to 40 percent.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CROSS-DOCK: INBOUND TO OUTBOUND</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Read once, divert to the right door</text>
<text x="600" y="136" text-anchor="middle" font-size="15.5" fill="#4f4f4f">No putaway — a case routes straight from inbound to outbound in a single pass.</text>

<!-- INBOUND -->
<rect x="64" y="214" width="220" height="150" rx="14" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.6"/>
<text x="174" y="248" text-anchor="middle" font-size="14.5" font-weight="800" letter-spacing="0.4" fill="#3a4658">INBOUND</text>
<rect x="92" y="268" width="70" height="64" rx="5" fill="#cdb58a" stroke="#8a6d3b" stroke-width="1.6"/>
<line x1="92" y1="300" x2="162" y2="300" stroke="#8a6d3b" stroke-width="1.3"/>
<rect x="196" y="266" width="14" height="68" fill="#2c5454"/>
<rect x="248" y="266" width="14" height="68" fill="#2c5454"/>
<circle cx="229" cy="288" r="3" fill="#2c5454"/>
<path d="M219 284 A 14 14 0 0 1 239 284" stroke="#2c5454" stroke-width="2.2" fill="none"/>
<text x="187" y="352" text-anchor="middle" font-size="12.5" fill="#5c5c5c">UHF read on entry</text>

<!-- arrow to routing -->
<g stroke="#8a94a3" stroke-width="2.6" fill="#8a94a3">
<line x1="284" y1="289" x2="330" y2="289"/><polygon points="330,283 340,289 330,295"/>
</g>

<!-- ROUTING node -->
<rect x="348" y="230" width="230" height="120" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="463" y="272" text-anchor="middle" font-size="14.5" font-weight="800" letter-spacing="0.3" fill="#234a4a">WMS ROUTING</text>
<text x="463" y="298" text-anchor="middle" font-size="12.5" fill="#4f4f4f">assigns outbound door</text>
<text x="463" y="318" text-anchor="middle" font-size="12.5" fill="#4f4f4f">by destination rules</text>

<!-- fan arrows to doors -->
<g stroke="#8a94a3" stroke-width="2.4" fill="#8a94a3">
<line x1="578" y1="278" x2="812" y2="250"/><polygon points="806,243 820,249 809,257"/>
<line x1="578" y1="290" x2="812" y2="333"/><polygon points="806,326 820,332 808,340"/>
<line x1="578" y1="304" x2="812" y2="416"/><polygon points="805,410 819,415 807,423"/>
</g>
<text x="463" y="374" text-anchor="middle" font-size="12" fill="#8a8a8a">divert readers verify each case</text>

<!-- OUTBOUND doors -->
<rect x="822" y="222" width="314" height="56" rx="10" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.5"/>
<text x="852" y="256" font-size="14" font-weight="800" fill="#3a4658">DOOR A</text>
<text x="1116" y="256" text-anchor="end" font-size="12.5" fill="#5c5c5c">destination 1</text>
<rect x="822" y="305" width="314" height="56" rx="10" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.5"/>
<text x="852" y="339" font-size="14" font-weight="800" fill="#3a4658">DOOR B</text>
<text x="1116" y="339" text-anchor="end" font-size="12.5" fill="#5c5c5c">destination 2</text>
<rect x="822" y="388" width="314" height="56" rx="10" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.5"/>
<text x="852" y="422" font-size="14" font-weight="800" fill="#3a4658">DOOR C</text>
<text x="1116" y="422" text-anchor="end" font-size="12.5" fill="#5c5c5c">destination 3</text>

<!-- stat chips -->
<rect x="64" y="480" width="524" height="96" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="92" y="516" font-size="13" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">ROUTING ERRORS</text>
<text x="92" y="552" font-size="26" font-weight="800" fill="#8b2d2d">1–3%</text>
<text x="176" y="552" font-size="15" fill="#4f4f4f">manual</text>
<text x="300" y="552" font-size="20" font-weight="800" fill="#8a94a3">→</text>
<text x="340" y="552" font-size="26" font-weight="800" fill="#1f6f3a">&lt;0.1%</text>
<text x="432" y="552" font-size="15" fill="#4f4f4f">RFID</text>
<rect x="612" y="480" width="524" height="96" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="640" y="516" font-size="13" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">THROUGHPUT</text>
<text x="640" y="554" font-size="30" font-weight="800" fill="#2c5454">+20–40%</text>
<text x="820" y="546" font-size="15" fill="#4f4f4f">in high-volume cross-dock</text>
<text x="820" y="566" font-size="15" fill="#4f4f4f">operations vs barcode</text>

<text x="600" y="614" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Nobody stops to aim a barcode gun while a case rides the belt at full tilt.</text>
</svg>
