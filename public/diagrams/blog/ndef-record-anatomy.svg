<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Anatomy of an NDEF message — records, each with a header and a payload</title>
<desc id="d">An NDEF message is one or more NDEF records. Each record has a header — record type, payload length, and ID — followed by the payload itself. The four most common record types in B2B use are: URI, which uses a prefix byte to compress schemes like https, tel and mailto and save 5 to 10 bytes; Text, which carries a language code such as en or de so one tag can hold multiple languages; vCard, which stores contact information in MIME format; and the Android Application Record, which forces a specific app to handle the tag and is silently ignored by iOS.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="1.2" fill="#6d5a3a">WHAT A TAG ACTUALLY STORES &#8212; THE NDEF MESSAGE</text>

<!-- message = records -->
<text x="120" y="100" font-size="14.5" font-weight="800" fill="#291c0e">NDEF MESSAGE</text>
<text x="256" y="100" font-size="13.5" font-weight="600" fill="#4f4f4f">= one or more records, read in order</text>
<g>
<rect x="120" y="112" width="280" height="48" rx="9" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/><text x="260" y="141" text-anchor="middle" font-size="14.5" font-weight="700" fill="#234a4a">Record 1</text>
<rect x="412" y="112" width="280" height="48" rx="9" fill="#faf3e4" stroke="#e3d8c4" stroke-width="1.4"/><text x="552" y="141" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">Record 2</text>
<rect x="704" y="112" width="280" height="48" rx="9" fill="#faf3e4" stroke="#e3d8c4" stroke-width="1.4"/><text x="844" y="141" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">Record 3</text>
<text x="1040" y="141" text-anchor="middle" font-size="22" font-weight="800" fill="#c39a5f">&#8230;</text>
</g>
<path d="M260 168 l-8 0 0 24 -80 0 0 18 176 0 0 -18 -80 0 0 -24 z" fill="#3d6b6b" opacity="0.5"/>

<!-- one record, zoomed -->
<text x="120" y="238" font-size="14.5" font-weight="800" fill="#291c0e">INSIDE ONE RECORD</text>
<rect x="120" y="252" width="440" height="30" rx="6" fill="#6d5a3a"/><text x="340" y="273" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="1" fill="#ffffff">HEADER</text>
<rect x="572" y="252" width="508" height="30" rx="6" fill="#3d6b6b"/><text x="826" y="273" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="1" fill="#ffffff">PAYLOAD</text>

<g>
<rect x="120" y="290" width="140" height="86" rx="9" fill="#faf3e4" stroke="#c39a5f" stroke-width="1.6"/><text x="190" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Record</text><text x="190" y="348" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">type</text>
<rect x="268" y="290" width="150" height="86" rx="9" fill="#faf3e4" stroke="#c39a5f" stroke-width="1.6"/><text x="343" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Payload</text><text x="343" y="348" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">length</text>
<rect x="426" y="290" width="134" height="86" rx="9" fill="#faf3e4" stroke="#c39a5f" stroke-width="1.6"/><text x="493" y="338" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">ID</text>
<rect x="572" y="290" width="508" height="86" rx="9" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/><text x="826" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#234a4a">the actual bytes: a URL, some text, a contact&#8230;</text><text x="826" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="#4f4f4f">length declared in the header, so the parser knows where it ends</text>
</g>

<!-- record types -->
<text x="120" y="436" font-size="14.5" font-weight="800" fill="#291c0e">THE FOUR YOU'LL ACTUALLY USE</text>
<g>
<rect x="90" y="452" width="250" height="132" rx="12" fill="#faf6ec" stroke="#e3d8c4" stroke-width="1.6"/>
<text x="112" y="486" font-size="17" font-weight="800" fill="#6d5a3a">URI</text><text x="112" y="514" font-size="13.5" font-weight="600" fill="#4f4f4f">a web link. A prefix byte</text><text x="112" y="534" font-size="13.5" font-weight="600" fill="#4f4f4f">compresses https:// tel:</text><text x="112" y="554" font-size="13.5" font-weight="600" fill="#4f4f4f">mailto: &#8212; saves 5&#8211;10 bytes</text>

<rect x="356" y="452" width="250" height="132" rx="12" fill="#faf6ec" stroke="#e3d8c4" stroke-width="1.6"/>
<text x="378" y="486" font-size="17" font-weight="800" fill="#6d5a3a">Text</text><text x="378" y="514" font-size="13.5" font-weight="600" fill="#4f4f4f">plain text + a language</text><text x="378" y="534" font-size="13.5" font-weight="600" fill="#4f4f4f">code (en, de). One tag,</text><text x="378" y="554" font-size="13.5" font-weight="600" fill="#4f4f4f">many languages</text>

<rect x="622" y="452" width="250" height="132" rx="12" fill="#faf6ec" stroke="#e3d8c4" stroke-width="1.6"/>
<text x="644" y="486" font-size="17" font-weight="800" fill="#6d5a3a">vCard</text><text x="644" y="514" font-size="13.5" font-weight="600" fill="#4f4f4f">a contact card, stored</text><text x="644" y="534" font-size="13.5" font-weight="600" fill="#4f4f4f">in MIME format</text>

<rect x="888" y="452" width="250" height="132" rx="12" fill="#f2f7f7" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="910" y="486" font-size="17" font-weight="800" fill="#3d6b6b">AAR</text><text x="910" y="514" font-size="13.5" font-weight="600" fill="#4f4f4f">forces a specific Android</text><text x="910" y="534" font-size="13.5" font-weight="600" fill="#4f4f4f">app &#8212; and is silently</text><text x="910" y="554" font-size="13.5" font-weight="600" fill="#8b2d2d">ignored by iOS</text>
</g>
<text x="600" y="618" text-anchor="middle" font-size="13.5" font-weight="600" fill="#5c5c5c">Smart Poster records add a title + icon for a preview; custom MIME records hold binary only your app understands.</text>
</svg>
