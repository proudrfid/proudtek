<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The 2024 to 2026 mobile-credential wave that reshaped NFC door-lock procurement</title>
<desc id="d">A timeline of four milestones. Apple Home Key and Wallet store digital keys for homes, hotels and offices, and Express Mode unlocks even on a black screen. Apple's iOS 18.1 opened NFC and Secure Element access to third-party credential issuers. Google Wallet keys arrived bundled with hotel apps such as Hilton Honors and Marriott Bonvoy and lock vendors August, Yale and Schlage. Aliro 1.0 from the Connectivity Standards Alliance, released 26 February 2026, is a cross-vendor standard that works even without network coverage. The takeaway strip says a lock spec'd in 2026 should require AES-128 mutual auth, OSDP, and an Aliro, Apple Home Key or Google Wallet roadmap.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MOBILE CREDENTIALS · 2024–2026</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">A lock spec'd today must read physical RFID cards and at least one mobile-key framework.</text>

<!-- spine -->
<line x1="120" y1="300" x2="1080" y2="300" stroke="#c8b79a" stroke-width="3"/>
<circle cx="230" cy="300" r="11" fill="#3d6b6b"/>
<circle cx="470" cy="300" r="11" fill="#3d6b6b"/>
<circle cx="710" cy="300" r="11" fill="#3d6b6b"/>
<circle cx="950" cy="300" r="11" fill="#c39a5f"/>

<!-- node 1 above -->
<line x1="230" y1="300" x2="230" y2="196" stroke="#c8b79a" stroke-width="2"/>
<rect x="112" y="112" width="236" height="84" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<text x="230" y="140" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">Apple Home Key + Wallet</text>
<text x="230" y="162" text-anchor="middle" font-size="12.5" fill="#5c5c5c">keys for homes, hotels, offices</text>
<text x="230" y="181" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Express Mode works on a dead screen</text>

<!-- node 2 below -->
<line x1="470" y1="300" x2="470" y2="404" stroke="#c8b79a" stroke-width="2"/>
<rect x="352" y="404" width="236" height="84" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<text x="470" y="432" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">iOS 18.1</text>
<text x="470" y="454" text-anchor="middle" font-size="12.5" fill="#5c5c5c">NFC + Secure Element opened to</text>
<text x="470" y="473" text-anchor="middle" font-size="12.5" fill="#5c5c5c">third-party credential issuers</text>

<!-- node 3 above -->
<line x1="710" y1="300" x2="710" y2="196" stroke="#c8b79a" stroke-width="2"/>
<rect x="592" y="112" width="236" height="84" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<text x="710" y="140" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">Google Wallet keys</text>
<text x="710" y="162" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Hilton Honors, Marriott Bonvoy;</text>
<text x="710" y="181" text-anchor="middle" font-size="12.5" fill="#5c5c5c">August / Yale, Schlage</text>

<!-- node 4 below -->
<line x1="950" y1="300" x2="950" y2="404" stroke="#c8b79a" stroke-width="2"/>
<rect x="832" y="404" width="248" height="96" rx="12" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
<text x="956" y="432" text-anchor="middle" font-size="15" font-weight="800" fill="#6d4d17">Aliro 1.0 (CSA)</text>
<text x="956" y="454" text-anchor="middle" font-size="12.5" fill="#6d5a3a">released 26 February 2026</text>
<text x="956" y="473" text-anchor="middle" font-size="12.5" fill="#6d5a3a">cross-vendor; works without</text>
<text x="956" y="491" text-anchor="middle" font-size="12.5" fill="#6d5a3a">network coverage</text>

<!-- takeaway -->
<rect x="120" y="536" width="960" height="82" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<text x="146" y="568" font-size="14.5" font-weight="800" fill="#1f6f3a">SPEC IN 2026</text>
<text x="146" y="596" font-size="13.5" fill="#333333">Require AES-128 mutual auth (DESFire EV2/EV3), OSDP reader-to-panel encryption, and a roadmap for Aliro and/or Apple Home Key + Google Wallet.</text>
</svg>
