<path d="M 842.5 281 l 2.5 2.5 l 5 -5.5" fill="none" stroke="#6d5a3a" stroke-width="2"/>
<text x="866" y="286" text-anchor="start" font-size="13" fill="#4f4f4f">Per-applet security domains</text>
<circle cx="846" cy="319" r="8" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<path d="M 842.5 319 l 2.5 2.5 l 5 -5.5" fill="none" stroke="#6d5a3a" stroke-width="2"/>
<text x="866" y="324" text-anchor="start" font-size="13" fill="#4f4f4f">'Sensitive Result' anti-fault API</text>
<rect x="838" y="356" width="292" height="148" rx="10" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="856" y="384" text-anchor="start" font-size="12" font-weight="700" letter-spacing="1" fill="#6d5a3a">COMPATIBILITY</text>
<text x="856" y="410" text-anchor="start" font-size="14" font-weight="600" fill="#291c0e">Classic 2.2.2 CAP still loads</text>
<text x="856" y="434" text-anchor="start" font-size="12.5" fill="#4f4f4f">runs on a 3.1 card without</text>
<text x="856" y="458" text-anchor="start" font-size="12.5" fill="#4f4f4f">recompilation — it just works</text>

<text x="600" y="592" text-anchor="middle" font-size="13.5" fill="#4f4f4f">The 4-to-5 jump re-platforms the crypto library, the secure-channel stack and the certifiable footprint on your PO.</text>
<text x="600" y="626" text-anchor="middle" font-size="14" fill="#5c5c5c">Order by OS-and-chip pair — 'JCOP 4 P71 144K' — never just 'a Java Card.'</text>
