<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID laundry tags — the linen that comes back</title>
<desc id="d">A tagged towel stack rides a cart through a tunnel reader that counts every piece. Beside it, the buyer's three decisions: pick the form factor — PPS, silicone or textile at $0.10-0.40 per tag at 10K — match it to the process, up to 200 degrees Celsius and 200-plus cycles, and expect payback in 6-12 months as linen loss falls from 10-15 percent to under 5 percent.</desc>
