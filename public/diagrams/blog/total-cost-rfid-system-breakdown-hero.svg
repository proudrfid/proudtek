<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Where the RFID budget actually goes: tags are only 30-50% of year one</title>
<desc id="d">First-year RFID cost splits three ways: tags are 30 to 50 percent, hardware such as readers and antennas is 20 to 30 percent, and software plus integration is 20 to 30 percent. A note below explains that by year two to three, as hardware and software amortize, tags grow to 60 to 80 percent of ongoing annual cost.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TOTAL RFID SYSTEM COST</text>
<text x="600" y="104" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="39" font-weight="700" fill="#291c0e">Where the budget actually goes</text>
<text x="600" y="140" text-anchor="middle" font-size="16.5" fill="#4f4f4f">Tags get the debate — they are only a third to a half of year one.</text>

<rect x="88" y="182" width="300" height="214" rx="14" fill="#eef1f5" stroke="#b3bcc9" stroke-width="2"/>
<rect x="88" y="182" width="300" height="8" rx="4" fill="#4a5568"/>
<text x="238" y="224" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a5568">TAGS</text>
<text x="238" y="300" text-anchor="middle" font-size="46" font-weight="800" fill="#4a5568">30-50%</text>
<text x="238" y="336" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">of year-1 cost</text>
<text x="238" y="366" text-anchor="middle" font-size="13" fill="#5c5c5c">UHF, NFC, PVC, industrial</text>

<rect x="450" y="182" width="300" height="214" rx="14" fill="#eef5f5" stroke="#9fc2c2" stroke-width="2"/>
<rect x="450" y="182" width="300" height="8" rx="4" fill="#3d6b6b"/>
<text x="600" y="224" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">HARDWARE</text>
<text x="600" y="300" text-anchor="middle" font-size="46" font-weight="800" fill="#2c5454">20-30%</text>
<text x="600" y="336" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">of year-1 cost</text>
<text x="600" y="366" text-anchor="middle" font-size="13" fill="#5c5c5c">readers + antennas</text>

<rect x="812" y="182" width="300" height="214" rx="14" fill="#f7edd6" stroke="#e0c084" stroke-width="2"/>
<rect x="812" y="182" width="300" height="8" rx="4" fill="#c39a5f"/>
<text x="962" y="224" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#8a6d34">SOFTWARE + INTEGRATION</text>
<text x="962" y="300" text-anchor="middle" font-size="46" font-weight="800" fill="#8a6d34">20-30%</text>
<text x="962" y="336" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">of year-1 cost</text>
<text x="962" y="366" text-anchor="middle" font-size="13" fill="#5c5c5c">middleware + ERP/WMS</text>

<rect x="88" y="430" width="1024" height="70" rx="14" fill="#eef1f5" stroke="#b3bcc9" stroke-width="1.6"/>
<text x="130" y="465" font-size="30" font-weight="800" fill="#4a5568">60-80%</text>
<text x="270" y="459" font-size="15" font-weight="700" fill="#291c0e">By year 2-3, as hardware and software amortize,</text>
<text x="270" y="481" font-size="15" font-weight="700" fill="#291c0e">tags become 60-80% of ongoing annual cost.</text>

<text x="600" y="556" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Budget the whole system in year one.</text>
<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Then budget for the tag stream every year after — it is the line that never stops.</text>
</svg>
