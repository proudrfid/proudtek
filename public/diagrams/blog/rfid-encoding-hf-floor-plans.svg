<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">HF memory floor plans — MIFARE Classic 1K sectors vs NTAG pages</title>
<desc id="d">Side-by-side comparison. Left panel: MIFARE Classic 1K organizes 1,024 bytes as 16 sectors of 4 blocks of 16 bytes; a zoomed sector shows three teal data blocks and a red Block 3 — the sector trailer holding Key A, the access bits and Key B — plus a 4-by-4 mini-map of all 16 sectors, each with a thin red trailer strip. Right panel: NTAG 213, 215 and 216 stack 4-byte pages — pages 0 to 1 hold the UID, page 2 the lock bits and capability container, pages 3 to N the user data, and the last 5 pages the dynamic locks, mirror, auth settings and 32-bit password. User memory pills read 213 = 144 B, 215 = 504 B, 216 = 888 B. Caption: mind the red drawer — the trailer locks the sector, and there is no undo.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HF MEMORY — TWO TRIBES, TWO FLOOR PLANS</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">MIFARE rents sectors; NTAG stacks pages</text>

<!-- LEFT: MIFARE -->
<rect x="64" y="124" width="530" height="472" rx="16" fill="#f2f7f7" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="92" y="164" font-size="20" font-weight="800" fill="#291c0e">MIFARE Classic 1K</text>
<text x="92" y="190" font-size="13.5" fill="#4f4f4f">1,024 bytes · 16 sectors × 4 blocks × 16 bytes</text>

<text x="92" y="226" font-size="12.5" font-weight="800" letter-spacing="1" fill="#2c5454">ONE SECTOR, UP CLOSE</text>
<rect x="92" y="236" width="440" height="34" rx="7" fill="#3d6b6b"/>
<text x="108" y="258" font-size="13.5" font-weight="600" fill="#ffffff">Block 0 · data · 16 bytes</text>
<rect x="92" y="276" width="440" height="34" rx="7" fill="#3d6b6b"/>
<text x="108" y="298" font-size="13.5" font-weight="600" fill="#ffffff">Block 1 · data · 16 bytes</text>
<rect x="92" y="316" width="440" height="34" rx="7" fill="#3d6b6b"/>
<text x="108" y="338" font-size="13.5" font-weight="600" fill="#ffffff">Block 2 · data · 16 bytes</text>
<rect x="92" y="356" width="440" height="48" rx="7" fill="#8b2d2d"/>
<text x="108" y="376" font-size="13.5" font-weight="800" fill="#ffffff">Block 3 — sector trailer</text>
<text x="108" y="394" font-size="12.5" fill="#f7e3e3">Key A · access bits · Key B</text>

<text x="92" y="442" font-size="12.5" font-weight="800" letter-spacing="1" fill="#2c5454">ALL 16 SECTORS</text>
<rect x="240" y="432" width="10" height="10" fill="#8b2d2d"/>
<text x="258" y="442" font-size="12.5" fill="#4f4f4f">= sector trailer (handle with care)</text>
