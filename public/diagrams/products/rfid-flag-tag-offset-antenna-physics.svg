<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Why the RFID flag tag reads on metal: off-surface antenna physics</title>
  <desc id="d">Two-panel comparison. Left panel: a flat UHF tag pressed directly onto a carbon-steel host. The steel mirrors the antenna current in anti-phase, the radiated fields cancel at the boundary, the tag detunes, and read range collapses to 0.5 to 1.5 metres, shown on a red range gauge. Right panel: an RFID flag tag strapped to a pipe. A rigid stalk lifts the flag face 25 to 40 millimetres off the host surface, placing the antenna in free air where the steel cannot detune it. The flag face radiates from both sides and holds 3 to 5 metres of portal read range, shown on a green range gauge over the same 0 to 6 metre scale. Bottom caption: the stalk lifts the antenna out of the steel's near field — no ferrite pad, no adhesive, no surface prep.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#291c0e"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b2d2d"/>
    </marker>
    <marker id="arrGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d5a3a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID FLAG TAG — OFF-SURFACE ANTENNA PHYSICS</text>
  <text x="600" y="94" text-anchor="middle" font-size="34" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">25–40 mm of air is the anti-metal design</text>

  <line x1="600" y1="122" x2="600" y2="566" stroke="#e6dfd2" stroke-width="2"/>

  <!-- ══ LEFT: flat tag on steel (failure) ══ -->
  <text x="308" y="142" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.4" fill="#4a5568">FLAT TAG PRESSED ON STEEL</text>

  <text x="308" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">fields cancel — the tag detunes and goes quiet</text>
  <path d="M 258 344 q 50 -22 100 0" fill="none" stroke="#8b2d2d" stroke-width="2" opacity="0.55"/>
  <path d="M 273 352 q 35 -14 70 0" fill="none" stroke="#8b2d2d" stroke-width="2" opacity="0.35"/>
  <line x1="292" y1="328" x2="324" y2="354" stroke="#8b2d2d" stroke-width="2.5"/>
  <line x1="324" y1="328" x2="292" y2="354" stroke="#8b2d2d" stroke-width="2.5"/>

  <!-- flat tag -->
  <rect x="238" y="362" width="140" height="18" rx="4" fill="#ffffff" stroke="#291c0e" stroke-width="1.5"/>
  <line x1="248" y1="371" x2="296" y2="371" stroke="#291c0e" stroke-width="2" marker-end="url(#arrInk)"/>
  <rect x="303" y="366" width="10" height="10" fill="#291c0e"/>
  <line x1="368" y1="371" x2="320" y2="371" stroke="#291c0e" stroke-width="2"/>
  <text x="230" y="376" text-anchor="end" font-size="12.5" fill="#4f4f4f">antenna current</text>

  <!-- steel host -->
  <rect x="88" y="380" width="440" height="48" rx="6" fill="#4a5568"/>
  <text x="308" y="409" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">carbon steel host — a conductive mirror</text>

  <!-- image current -->
  <rect x="238" y="440" width="140" height="18" rx="4" fill="none" stroke="#8b2d2d" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.8"/>
  <line x1="368" y1="449" x2="320" y2="449" stroke="#8b2d2d" stroke-width="2" marker-end="url(#arrRed)" opacity="0.8"/>
  <text x="308" y="480" text-anchor="middle" font-size="12.5" fill="#8b2d2d">mirror current in the steel — anti-phase</text>

  <!-- left range gauge -->
  <text x="308" y="514" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">0.5–1.5 m read range on curved pipe</text>
  <line x1="128" y1="534" x2="488" y2="534" stroke="#5c5c5c" stroke-width="1.5"/>
  <rect x="158" y="524" width="60" height="20" rx="4" fill="#8b2d2d"/>
  <line x1="128" y1="528" x2="128" y2="540" stroke="#5c5c5c" stroke-width="1.5"/>
  <line x1="308" y1="528" x2="308" y2="540" stroke="#5c5c5c" stroke-width="1.5"/>
  <line x1="488" y1="528" x2="488" y2="540" stroke="#5c5c5c" stroke-width="1.5"/>
  <text x="128" y="560" text-anchor="middle" font-size="12" fill="#5c5c5c">0 m</text>
  <text x="308" y="560" text-anchor="middle" font-size="12" fill="#5c5c5c">3 m</text>
  <text x="488" y="560" text-anchor="middle" font-size="12" fill="#5c5c5c">6 m</text>

  <!-- ══ RIGHT: flag tag (free air) ══ -->
  <text x="892" y="142" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.4" fill="#4a5568">FLAG TAG — ANTENNA IN FREE AIR</text>

  <text x="892" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">radiates from both sides of the flag face</text>

  <!-- radiation arcs, both sides -->
  <path d="M 838 210 q -22 40 0 80" fill="none" stroke="#3d6b6b" stroke-width="2.5" opacity="0.85"/>
  <path d="M 818 202 q -32 48 0 96" fill="none" stroke="#3d6b6b" stroke-width="2" opacity="0.5"/>
  <path d="M 798 194 q -42 56 0 112" fill="none" stroke="#3d6b6b" stroke-width="2" opacity="0.28"/>
  <path d="M 946 210 q 22 40 0 80" fill="none" stroke="#3d6b6b" stroke-width="2.5" opacity="0.85"/>
  <path d="M 966 202 q 32 48 0 96" fill="none" stroke="#3d6b6b" stroke-width="2" opacity="0.5"/>
  <path d="M 986 194 q 42 56 0 112" fill="none" stroke="#3d6b6b" stroke-width="2" opacity="0.28"/>

  <!-- flag face -->
  <rect x="856" y="196" width="72" height="96" rx="8" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
  <path d="M 866 226 h 12 v 14 h -12 M 918 226 h -12 v 14 h 12" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="886" y="238" width="12" height="12" fill="#ffffff"/>
  <text x="892" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">UHF chip</text>

  <!-- stalk + base + pipe -->
  <rect x="885" y="292" width="14" height="58" rx="3" fill="#d4a755" stroke="#c39a5f" stroke-width="1.5"/>
  <rect x="868" y="350" width="48" height="18" rx="4" fill="#4a5568"/>
  <circle cx="892" cy="430" r="62" fill="#e8ebf0" stroke="#4a5568" stroke-width="2.5"/>
  <circle cx="892" cy="430" r="70" fill="none" stroke="#6d5a3a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="892" y="435" text-anchor="middle" font-size="12" fill="#4f4f4f">20 – 300 mm OD</text>

  <!-- offset dimension -->
  <line x1="954" y1="292" x2="954" y2="350" stroke="#6d5a3a" stroke-width="1.5" marker-start="url(#arrGold)" marker-end="url(#arrGold)"/>
  <text x="966" y="316" font-size="13" font-weight="700" fill="#291c0e">25–40 mm</text>
  <text x="966" y="334" font-size="12.5" fill="#4f4f4f">rigid stalk</text>
  <text x="806" y="376" text-anchor="end" font-size="12.5" fill="#4f4f4f">cable tie or</text>
  <text x="806" y="393" text-anchor="end" font-size="12.5" fill="#4f4f4f">band clamp</text>

  <!-- right range gauge -->
  <text x="892" y="514" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6f3a">3–5 m portal read range — any host geometry</text>
  <line x1="712" y1="534" x2="1072" y2="534" stroke="#5c5c5c" stroke-width="1.5"/>
  <rect x="892" y="524" width="120" height="20" rx="4" fill="#1f6f3a"/>
  <line x1="712" y1="528" x2="712" y2="540" stroke="#5c5c5c" stroke-width="1.5"/>
  <line x1="892" y1="528" x2="892" y2="540" stroke="#5c5c5c" stroke-width="1.5"/>
  <line x1="1072" y1="528" x2="1072" y2="540" stroke="#5c5c5c" stroke-width="1.5"/>
  <text x="712" y="560" text-anchor="middle" font-size="12" fill="#5c5c5c">0 m</text>
  <text x="892" y="560" text-anchor="middle" font-size="12" fill="#5c5c5c">3 m</text>
  <text x="1072" y="560" text-anchor="middle" font-size="12" fill="#5c5c5c">6 m</text>

  <!-- footer -->
  <line x1="64" y1="586" x2="1136" y2="586" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="600" y="622" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The stalk lifts the antenna out of the steel's near field — no ferrite pad, no adhesive, no surface prep.</text>
</svg>
