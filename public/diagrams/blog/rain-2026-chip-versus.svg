<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Impinj M800 vs NXP UCODE X — the 2026 chip matchup</title>
<desc id="d">A corner-versus-corner comparison card. In the teal corner, Impinj M800: read sensitivity around -25.5 dBm, 5B+ lifetime shipments by end of 2025, superpower the fastest ramp in Impinj history, and the catch is single-source supply. In the gold corner, NXP UCODE X: read sensitivity around -26.2 dBm claimed, announced February 2026, superpower multi-source plus security, and the catch is that volume inlays arrive in the second half of 2026. A footer band notes the real referee is ARC certification — Walmart, Target and Macy's gate on Cat 6 / 7 — so verify the specific inlay SKU holds current ARC status; a fancy chip in an uncertified inlay is expensive confetti.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE MAIN EVENT · YOU ARE PICKING A ROOMMATE FOR 3-5 YEARS</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Impinj M800 vs NXP UCODE X</text>

<!-- left card: Impinj -->
<rect x="60" y="128" width="505" height="382" rx="18" fill="#eef5f5" stroke="#cfe0e0" stroke-width="2"/>
<text x="312" y="160" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="2" fill="#2c5454">IN THE TEAL CORNER</text>
<text x="312" y="196" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="27" font-weight="700" fill="#291c0e">Impinj M800</text>
<text x="312" y="222" text-anchor="middle" font-size="13" fill="#4f4f4f">the volume king of the Walmart era</text>
<line x1="90" y1="242" x2="535" y2="242" stroke="#cfe0e0" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="90" y="274" font-size="13.5" fill="#4f4f4f">Read sensitivity</text>
<text x="535" y="274" text-anchor="end" font-size="17" font-weight="700" fill="#291c0e">~ -25.5 dBm</text>
<line x1="90" y1="298" x2="535" y2="298" stroke="#cfe0e0" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="90" y="330" font-size="13.5" fill="#4f4f4f">Lifetime shipments</text>
<text x="535" y="330" text-anchor="end" font-size="17" font-weight="700" fill="#291c0e">5B+ by end 2025</text>
<line x1="90" y1="354" x2="535" y2="354" stroke="#cfe0e0" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="90" y="386" font-size="13.5" fill="#4f4f4f">Superpower</text>
<text x="535" y="386" text-anchor="end" font-size="17" font-weight="700" fill="#291c0e">Fastest ramp in Impinj history</text>
<line x1="90" y1="410" x2="535" y2="410" stroke="#cfe0e0" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="90" y="442" font-size="13.5" fill="#4f4f4f">The catch</text>
<text x="535" y="442" text-anchor="end" font-size="17" font-weight="700" fill="#291c0e">Single-source supply</text>
<rect x="185" y="462" width="255" height="32" rx="16" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="312" y="483" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.5" fill="#2c5454">ALL OVER WALMART HANGTAGS</text>

<!-- right card: NXP -->
<rect x="635" y="128" width="505" height="382" rx="18" fill="#f9f1e2" stroke="#e4c98f" stroke-width="2"/>
<text x="887" y="160" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="2" fill="#8a6a2f">IN THE GOLD CORNER</text>
<text x="887" y="196" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="27" font-weight="700" fill="#291c0e">NXP UCODE X</text>
<text x="887" y="222" text-anchor="middle" font-size="13" fill="#4f4f4f">the challenger with the security kit</text>
<line x1="665" y1="242" x2="1110" y2="242" stroke="#e4c98f" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="665" y="274" font-size="13.5" fill="#4f4f4f">Read sensitivity</text>
<text x="1110" y="274" text-anchor="end" font-size="17" font-weight="700" fill="#291c0e">~ -26.2 dBm (claimed)</text>
<line x1="665" y1="298" x2="1110" y2="298" stroke="#e4c98f" stroke-width="1.5" stroke-dasharray="5 5"/>
