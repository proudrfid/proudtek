<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">An LED RFID tag lights up the one correct bin in a rack of identical bins</title>
<desc id="d">A warehouse rack holds nine identical steel bins across three shelves. Eight sit dark; one bin in the middle shelf glows amber with a flashing LED, marked as the picked item, so the operator walks straight to the light instead of reading labels. An inset on the right, titled Inside the tag, shows the three parts that make this work: a UHF chip and antenna for passive identification, a CR2032 coin-cell battery, and the LED. The caption notes the tag uses passive UHF to answer what is it and a battery-powered LED to answer where is it.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#ffe6a8"/><stop offset="70%" stop-color="#f4d48a"/><stop offset="100%" stop-color="#f0c96f"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIND IT BY LIGHT</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">An LED RFID tag turns the right shelf into the only one that is lit.</text>

<!-- RACK: outer frame + 3 shelves, 9 identical bins -->
<rect x="80" y="150" width="524" height="402" rx="10" fill="#eef0f3" stroke="#4a5568" stroke-width="3"/>
<line x1="80" y1="284" x2="604" y2="284" stroke="#4a5568" stroke-width="3"/>
<line x1="80" y1="418" x2="604" y2="418" stroke="#4a5568" stroke-width="3"/>

<!-- row 1 (dark bins) -->
<rect x="98" y="166" width="150" height="104" rx="7" fill="#dfe3e9" stroke="#9aa3ad" stroke-width="2"/>
<rect x="98" y="182" width="150" height="16" fill="#cfd5dd"/>
<rect x="262" y="166" width="150" height="104" rx="7" fill="#dfe3e9" stroke="#9aa3ad" stroke-width="2"/>
<rect x="262" y="182" width="150" height="16" fill="#cfd5dd"/>
<rect x="426" y="166" width="150" height="104" rx="7" fill="#dfe3e9" stroke="#9aa3ad" stroke-width="2"/>
<rect x="426" y="182" width="150" height="16" fill="#cfd5dd"/>

<!-- row 2 : LIT BIN in the middle -->
<rect x="98" y="300" width="150" height="104" rx="7" fill="#dfe3e9" stroke="#9aa3ad" stroke-width="2"/>
<rect x="98" y="316" width="150" height="16" fill="#cfd5dd"/>
<circle cx="337" cy="352" r="98" fill="url(#glow)" opacity="0.55"/>
<rect x="262" y="300" width="150" height="104" rx="7" fill="#fff7e6" stroke="#c39a5f" stroke-width="3"/>
<rect x="262" y="316" width="150" height="16" fill="#f0d59a"/>
<circle cx="337" cy="368" r="15" fill="#d4a755" stroke="#ffffff" stroke-width="2"/>
<circle cx="331" cy="362" r="4.5" fill="#fff2cf"/>
<line x1="337" y1="330" x2="337" y2="342" stroke="#c39a5f" stroke-width="3"/>
<line x1="366" y1="356" x2="378" y2="352" stroke="#c39a5f" stroke-width="3"/>
<line x1="308" y1="356" x2="296" y2="352" stroke="#c39a5f" stroke-width="3"/>
<rect x="426" y="300" width="150" height="104" rx="7" fill="#dfe3e9" stroke="#9aa3ad" stroke-width="2"/>
<rect x="426" y="316" width="150" height="16" fill="#cfd5dd"/>

<!-- row 3 (dark bins) -->
<rect x="98" y="434" width="150" height="104" rx="7" fill="#dfe3e9" stroke="#9aa3ad" stroke-width="2"/>
<rect x="98" y="450" width="150" height="16" fill="#cfd5dd"/>
<rect x="262" y="434" width="150" height="104" rx="7" fill="#dfe3e9" stroke="#9aa3ad" stroke-width="2"/>
<rect x="262" y="450" width="150" height="16" fill="#cfd5dd"/>
<rect x="426" y="434" width="150" height="104" rx="7" fill="#dfe3e9" stroke="#9aa3ad" stroke-width="2"/>
<rect x="426" y="450" width="150" height="16" fill="#cfd5dd"/>

<!-- PICKED callout -->
<rect x="292" y="252" width="90" height="26" rx="13" fill="#2c5454"/>
<text x="337" y="270" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#ffffff">PICKED</text>

<!-- INSET: inside the tag -->
<rect x="668" y="150" width="452" height="402" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="668" y="150" width="452" height="8" rx="4" fill="#c39a5f"/>
<text x="894" y="196" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INSIDE THE TAG</text>

<!-- tag body -->
<rect x="720" y="228" width="348" height="150" rx="12" fill="#f7edd6" stroke="#c39a5f" stroke-width="2.4"/>
<!-- antenna coil -->
<rect x="742" y="250" width="150" height="106" rx="8" fill="none" stroke="#4a5568" stroke-width="2.4"/>
<rect x="762" y="270" width="110" height="66" rx="6" fill="none" stroke="#4a5568" stroke-width="2"/>
<rect x="796" y="290" width="42" height="26" rx="3" fill="#4a5568"/>
<text x="817" y="309" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">IC</text>
<!-- coin cell -->
<circle cx="960" cy="278" r="30" fill="#e7eaef" stroke="#9aa3ad" stroke-width="2.4"/>
<text x="960" y="282" text-anchor="middle" font-size="12" font-weight="800" fill="#4a5568">CR2032</text>
<!-- LED -->
<circle cx="1006" cy="340" r="16" fill="#d4a755" stroke="#ffffff" stroke-width="2"/>
<circle cx="1000" cy="334" r="4.5" fill="#fff2cf"/>

<text x="742" y="416" font-size="14.5" font-weight="800" fill="#4a5568">1  UHF chip + antenna</text>
<text x="742" y="440" font-size="13.5" fill="#5c5c5c">passive ID — answers "what is it?"</text>
<text x="742" y="472" font-size="14.5" font-weight="800" fill="#6d5a3a">2  CR2032 cell + LED</text>
<text x="742" y="496" font-size="13.5" fill="#5c5c5c">battery light — answers "where is it?"</text>

<text x="600" y="600" text-anchor="middle" font-size="15" fill="#4f4f4f">Eight identical bins stay dark; the one you need flashes — no label-reading required.</text>
</svg>
