<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The Physical AI stack shown at NRF 2026</title>
<desc id="d">Three sensing layers feed one AI inference layer. Sense one, RFID: item identity plus zone location via Impinj Gen2X reads and EPCIS 2.0 event streams, with faster read rates and richer per-item context. Sense two, computer vision: the shelf reality check from Honeywell shelf cameras, Trax, Pensa and Standard AI — on the planogrammed shelf, or knocked behind a display. Sense three, ambient IoT: always-on item telemetry from Wiliot battery-free IoT pixels with Vertex AI alerting, location and temperature with no reader pass needed. All three converge in an AI inference layer — one brain, three senses, cross-validating every read — for combined precision above 99.5%, ready for autonomous checkout and BOPIS picking. Caption: plan middleware budget for the integration layer, not just readers and tags; technically solid but commercially obsolete inside 24 months is a real failure mode.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
