<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">MIFARE chips share an RF layer but diverge at the application layer</title>
<desc id="d">A two-layer diagram. The lower band is the RF layer: 13.56 MHz and ISO 14443-3A anti-collision, tinted green to show that every MIFARE chip interoperates at this radio level. The upper band is the application layer, holding two boxes: MIFARE Classic, built on sectors, blocks and Crypto-1 keys A and B, and MIFARE DESFire, built on files, application directories and AES-128 with up to 28 apps and mutual authentication. A red cross between them marks that the two data structures are not mutually readable. A footer states that RF-interoperable is not application-compatible: a DESFire reader cannot parse Classic sectors without firmware changes.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="16%" r="94%">
    <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
  </radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RF LAYER vs APPLICATION LAYER</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Interoperable on radio, incompatible on data</text>
<text x="600" y="130" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Every MIFARE chip answers the same RF handshake. What it says next is where the family splits.</text>

<!-- APPLICATION LAYER -->
<rect x="64" y="176" width="1072" height="196" rx="16" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="88" y="194" width="214" height="30" rx="8" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<text x="195" y="214" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">APPLICATION LAYER</text>

<rect x="112" y="244" width="440" height="108" rx="12" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/>
<text x="332" y="274" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">MIFARE Classic</text>
<text x="332" y="300" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Sectors · blocks · Crypto-1</text>
<text x="332" y="322" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Key A / Key B per sector</text>

<rect x="648" y="244" width="440" height="108" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="868" y="274" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">MIFARE DESFire</text>
<text x="868" y="300" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Files · app directories · AES-128</text>
<text x="868" y="322" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Up to 28 apps · mutual auth</text>

<circle cx="600" cy="290" r="26" fill="#fbeeee" stroke="#8b2d2d" stroke-width="2"/>
<line x1="591" y1="281" x2="609" y2="299" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/>
<line x1="609" y1="281" x2="591" y2="299" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/>
<text x="600" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#8b2d2d">not mutually</text>
<text x="600" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#8b2d2d">readable</text>

<!-- down connectors -->
<line x1="332" y1="352" x2="332" y2="388" stroke="#b7c0cc" stroke-width="2.4"/>
<polygon points="326,384 332,394 338,384" fill="#b7c0cc"/>
<line x1="868" y1="352" x2="868" y2="388" stroke="#9cbcae" stroke-width="2.4"/>
<polygon points="862,384 868,394 874,384" fill="#9cbcae"/>

<!-- RF LAYER -->
<rect x="64" y="394" width="1072" height="150" rx="16" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<rect x="88" y="412" width="150" height="30" rx="8" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.3"/>
<text x="163" y="432" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">RF LAYER</text>
<text x="600" y="472" text-anchor="middle" font-size="20" font-weight="700" fill="#1b4332">13.56 MHz · ISO 14443-3A anti-collision</text>
<text x="600" y="504" text-anchor="middle" font-size="14.5" fill="#2d6a4f">All five MIFARE lines interoperate here — the radio handshake is identical across the family.</text>

<text x="600" y="586" text-anchor="middle" font-size="14.5" fill="#5c5c5c">RF-interoperable is not application-compatible: a DESFire reader cannot parse Classic's sectors without firmware changes.</text>
</svg>
