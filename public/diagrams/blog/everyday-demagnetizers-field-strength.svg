<rect x="664" y="248" width="20" height="20" rx="3" fill="#e9e2d5"/>
<rect x="804" y="234" width="308" height="48" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="958" y="263" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">whole-drive exposure</text>

<!-- row 3 novelty magnets -->
<rect x="64" y="306" width="1072" height="72" rx="12" fill="#fbf7ee" stroke="#e6dfd2" stroke-width="1.5"/>
