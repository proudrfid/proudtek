<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="siCrackTitle siCrackDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="siCrackTitle">Three cracks in the manual count — and the RFID control that seals each</title>
  <desc id="siCrackDesc">A manual count-and-record system fails three ways. One, instruments walk out of the OR unnoticed; the RFID control is a zone-exit alert. Two, a tray comes up short and a miscount can slip through; the RFID control is count-in and count-out verification before closing. Three, a paper log fails a Joint Commission audit; the RFID control is a time-stamped electronic record.</desc>

  <defs>
    <radialGradient id="siCrackBg" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f1ece0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#siCrackBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="62" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="0.3" fill="#291c0e">Three cracks in the clipboard — and what seals each</text>
  <text x="600" y="91" text-anchor="middle" font-size="15" fill="#8b2d2d">Careful people, fragile system: the count only holds if no one is ever tired, rushed, or interrupted</text>

  <!-- column headers -->
  <text x="240" y="132" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="3" fill="#8b2d2d">LOSS</text>
  <text x="600" y="132" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="3" fill="#8b2d2d">MISCOUNT</text>
  <text x="960" y="132" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="3" fill="#8b2d2d">THE AUDIT</text>

  <!-- PROBLEM CARDS (red) -->
  <!-- col 1 -->
  <rect x="80" y="146" width="320" height="150" rx="14" fill="#f9edea" stroke="#e3c4bd" stroke-width="2"/>
  <circle cx="130" cy="192" r="21" fill="#f4e0db" stroke="#8b2d2d" stroke-width="2"/>
  <path d="M122 200 l16 -16 M122 184 l16 16" stroke="#8b2d2d" stroke-width="2.6" stroke-linecap="round"/>
  <text x="168" y="188" font-size="17" font-weight="800" fill="#291c0e">Instruments</text>
  <text x="168" y="209" font-size="17" font-weight="800" fill="#291c0e">walk out</text>
  <text x="104" y="246" font-size="13" fill="#5c4a45">Misplaced trays, transport carts</text>
  <text x="104" y="266" font-size="13" fill="#5c4a45">and rough handling quietly carry</text>
  <text x="104" y="286" font-size="13" fill="#5c4a45">instruments out the door.</text>

  <!-- col 2 -->
  <rect x="440" y="146" width="320" height="150" rx="14" fill="#f9edea" stroke="#e3c4bd" stroke-width="2"/>
  <circle cx="490" cy="192" r="21" fill="#f4e0db" stroke="#8b2d2d" stroke-width="2"/>
  <text x="490" y="199" text-anchor="middle" font-size="22" font-weight="800" fill="#8b2d2d">?</text>
  <text x="528" y="188" font-size="17" font-weight="800" fill="#291c0e">A tray comes</text>
  <text x="528" y="209" font-size="17" font-weight="800" fill="#291c0e">up short</text>
  <text x="464" y="246" font-size="13" fill="#5c4a45">A hand-tally is one number against</text>
  <text x="464" y="266" font-size="13" fill="#5c4a45">a busy, interrupted shift — a miss</text>
  <text x="464" y="286" font-size="13" fill="#5c4a45">can slip past unnoticed.</text>

  <!-- col 3 -->
  <rect x="800" y="146" width="320" height="150" rx="14" fill="#f9edea" stroke="#e3c4bd" stroke-width="2"/>
  <circle cx="850" cy="192" r="21" fill="#f4e0db" stroke="#8b2d2d" stroke-width="2"/>
  <path d="M841 182 h14 v20 h-14 z" fill="none" stroke="#8b2d2d" stroke-width="2"/>
  <path d="M844 188 h8 M844 193 h8 M844 198 h5" stroke="#8b2d2d" stroke-width="1.6"/>
  <text x="888" y="188" font-size="17" font-weight="800" fill="#291c0e">Paper fails</text>
  <text x="888" y="209" font-size="17" font-weight="800" fill="#291c0e">the audit</text>
  <text x="824" y="246" font-size="13" fill="#5c4a45">Joint Commission wants sterilisation</text>
  <text x="824" y="266" font-size="13" fill="#5c4a45">evidence on demand; a binder of</text>
  <text x="824" y="286" font-size="13" fill="#5c4a45">logs is increasingly rejected.</text>

  <!-- arrows down -->
  <path d="M240 306 v40 M228 336 l12 14 l12 -14" fill="none" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M600 306 v40 M588 336 l12 14 l12 -14" fill="none" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M960 306 v40 M948 336 l12 14 l12 -14" fill="none" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- FIX CARDS (teal) -->
  <!-- col 1 -->
  <rect x="80" y="360" width="320" height="150" rx="14" fill="#e9f1f0" stroke="#bcd3d3" stroke-width="2"/>
  <rect x="80" y="360" width="320" height="8" rx="4" fill="#3d6b6b"/>
  <text x="240" y="404" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">Zone-exit alert</text>
  <text x="240" y="438" text-anchor="middle" font-size="13" fill="#3d5a5a">A tracked instrument announces</text>
  <text x="240" y="458" text-anchor="middle" font-size="13" fill="#3d5a5a">itself the moment it crosses a</text>
  <text x="240" y="478" text-anchor="middle" font-size="13" fill="#3d5a5a">boundary it should not.</text>

  <!-- col 2 -->
  <rect x="440" y="360" width="320" height="150" rx="14" fill="#e9f1f0" stroke="#bcd3d3" stroke-width="2"/>
  <rect x="440" y="360" width="320" height="8" rx="4" fill="#3d6b6b"/>
  <text x="600" y="404" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">Count-in / count-out</text>
  <text x="600" y="438" text-anchor="middle" font-size="13" fill="#3d5a5a">A tray scan at OR entry and exit</text>
  <text x="600" y="458" text-anchor="middle" font-size="13" fill="#3d5a5a">reconciles every item — flagging a</text>
  <text x="600" y="478" text-anchor="middle" font-size="13" fill="#3d5a5a">shortfall before the patient closes.</text>

  <!-- col 3 -->
  <rect x="800" y="360" width="320" height="150" rx="14" fill="#e9f1f0" stroke="#bcd3d3" stroke-width="2"/>
  <rect x="800" y="360" width="320" height="8" rx="4" fill="#3d6b6b"/>
  <text x="960" y="404" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">Time-stamped records</text>
  <text x="960" y="438" text-anchor="middle" font-size="13" fill="#3d5a5a">Every cycle logged electronically,</text>
  <text x="960" y="458" text-anchor="middle" font-size="13" fill="#3d5a5a">producing the defensible trail an</text>
  <text x="960" y="478" text-anchor="middle" font-size="13" fill="#3d5a5a">inspector can pull on demand.</text>

  <!-- footer takeaway -->
  <rect x="70" y="556" width="1060" height="78" rx="14" fill="#2a1d0f"/>
  <text x="100" y="592" font-size="15.5" font-weight="700" fill="#f0c98a">The point:</text>
  <text x="192" y="592" font-size="15" fill="#f3ecdd">RFID does not ask the technician to be more careful — the count-and-record work is already careful.</text>
  <text x="192" y="616" font-size="15" fill="#f3ecdd">It just moves the safety-critical record off the one place a tired human can drop it.</text>
</svg>
