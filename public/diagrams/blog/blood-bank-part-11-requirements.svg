<!-- summary bar -->
<rect x="64" y="492" width="1072" height="92" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="530" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="20" font-weight="700" fill="#291c0e">Satisfy all five and RFID scan data becomes a valid electronic record.</text>
<text x="600" y="560" text-anchor="middle" font-size="14" fill="#4f4f4f">The same scan that speeds the shift is the one that audits cleanly during an FDA inspection.</text>
</svg>
