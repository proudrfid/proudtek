<text x="190" y="341" text-anchor="middle" font-size="12.5" fill="#5c5c5c">URL written to the tag</text>
<rect x="92.0" y="358" width="196" height="32" rx="16.0" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/><text x="190" y="378.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">Google review link</text>
<rect x="346" y="196" width="236" height="240" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/><rect x="346" y="196" width="236" height="8" rx="4" fill="#3d6b6b"/>
