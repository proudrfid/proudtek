  <title id="dst">Walmart's RFID department scope keeps expanding</title>
  <desc id="dsd">A map of Walmart's expanding item-level RFID scope. Softlines already mandated: department 30 bras and shapewear, 31 accessories, 32 jewelry and sunglasses, 33 girls wear, 34 misses and outerwear, 41 team sports. Hardline departments added between 2024 and 2026: 03 stationery, 05 media and gaming, 06 cameras, 07 toys, 09 sporting goods, 10 automotive, 11 hardware, 12 paint, 14 kitchen and dining, 16 outdoor living, 17 home decor, 19 crafts, 20 bath and shower, 21 books, 22 bedding, 42 automotive tires, 71 furniture, 72 electronics, 74 closet and organization, 87 wireless. The same audit thresholds apply.</desc>
