<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The silicon chip outlives its housing</title>
<desc id="d">A cutaway of an RFID tag on the left shows three layers — face stock or label on top, the inlay with antenna and chip in the middle, and adhesive on the bottom. The chip is highlighted as lasting 50-plus years and never failing first, while the surrounding housing layers are marked as what wears out. On the right, a years scale compares two bars: the silicon chip spans the full 50-plus years, while a typical housing bar ends early somewhere between 1 and 20 years. The gap between them is labeled as the lifespan you actually get, set by the housing rather than the chip.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE CHIP OUTLIVES ITS HOUSING</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Passive silicon lasts 50+ years — what wears out is the label, adhesive and shell.</text>

<!-- tag cutaway (left) -->
<text x="108" y="150" font-size="14" font-weight="800" letter-spacing="0.5" fill="#4a5568">TAG CROSS-SECTION</text>
<rect x="108" y="168" width="380" height="66" rx="6" fill="#dfe3e9" stroke="#9aa3ad" stroke-width="2"/>
<text x="128" y="207" font-size="15" font-weight="700" fill="#33404f">Face stock / label</text>
<text x="470" y="207" text-anchor="end" font-size="12.5" fill="#8a8a8a">wears out</text>

<rect x="108" y="242" width="380" height="96" rx="6" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
<rect x="128" y="262" width="150" height="56" rx="6" fill="none" stroke="#4a5568" stroke-width="2"/>
<rect x="160" y="278" width="86" height="26" rx="4" fill="#1f6f3a"/>
<text x="203" y="296" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">CHIP</text>
<text x="300" y="284" font-size="15" font-weight="800" fill="#1f6f3a">Silicon: 50+ years</text>
<text x="300" y="306" font-size="12.5" fill="#5c9a6f">no battery, never fails first</text>

<rect x="108" y="346" width="380" height="60" rx="6" fill="#dfe3e9" stroke="#9aa3ad" stroke-width="2"/>
<text x="128" y="382" font-size="15" font-weight="700" fill="#33404f">Adhesive</text>
<text x="470" y="382" text-anchor="end" font-size="12.5" fill="#8a8a8a">wears out</text>

<text x="108" y="452" font-size="14.5" fill="#4f4f4f">The silicon is usually pristine when a tag</text>
<text x="108" y="474" font-size="14.5" fill="#4f4f4f">"dies" — the cheaper layers around it quit first.</text>

<!-- lifespan bars (right) -->
<text x="600" y="150" font-size="14" font-weight="800" letter-spacing="0.5" fill="#4a5568">YEARS IN SERVICE</text>
<line x1="600" y1="176" x2="600" y2="420" stroke="#c9c1b2" stroke-width="2"/>
<line x1="600" y1="420" x2="1110" y2="420" stroke="#c9c1b2" stroke-width="2"/>
<text x="600" y="444" text-anchor="middle" font-size="12.5" fill="#8a8a8a">0</text>
<text x="855" y="444" text-anchor="middle" font-size="12.5" fill="#8a8a8a">25</text>
<text x="1100" y="444" text-anchor="middle" font-size="12.5" fill="#8a8a8a">50+</text>

<rect x="600" y="210" width="510" height="52" rx="6" fill="#cfe7d7" stroke="#1f6f3a" stroke-width="2"/>
<text x="620" y="242" font-size="15.5" font-weight="800" fill="#1f6f3a">SILICON CHIP — 50+ years</text>

<rect x="600" y="300" width="205" height="52" rx="6" fill="#c3cad3" stroke="#4a5568" stroke-width="2"/>
<text x="620" y="332" font-size="15.5" font-weight="800" fill="#33404f">HOUSING — 1 to 20 yr</text>
<line x1="805" y1="292" x2="805" y2="360" stroke="#8b2d2d" stroke-width="2.4" stroke-dasharray="5 4"/>

<text x="600" y="392" font-size="14.5" font-weight="700" fill="#8b2d2d">The housing is the real clock —</text>
<text x="600" y="414" font-size="14.5" font-weight="700" fill="#8b2d2d">it decides the lifespan you actually get.</text>

<text x="600" y="520" text-anchor="middle" font-size="15" fill="#4f4f4f">So "how long does an RFID tag last?" is really "how long does its housing survive your environment?"</text>
</svg>
