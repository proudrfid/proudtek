<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">RFID coin tag mounting matrix — five ways one disc stays attached</title>
  <desc id="d">Five side-view cross-sections show how an RFID coin disc mounts to a host surface. Screw: an M3 or M4 stainless cap screw passes through the disc's central bore into a drilled and tapped host — removable and re-issuable. Rivet: a blind rivet sets through the same bore from one side — permanent, drill out to remove. Adhesive: a 3M VHB 4910F or 5952 pad bonds the disc to coated metal, glass or ABS with no drilling. Weld carrier: a 316L stainless carrier plate is tack-welded to bare structural steel and the disc is retained by screw or epoxy, keeping weld heat away from the chip. Recess embed: the disc sits flush inside a drilled recess in wood, plastic or composite, potted in structural adhesive. A decision strip underneath: metal hosts take the on-metal UHF spacer variant fixed by screw, rivet or weld with 0.3-1.5 m read on steel; non-metal hosts accept any of the five mounts. Footer: the service envelope is unchanged by mount — IP67 / IP68 housing, -25 to +85 degrees C, 2-4 mm disc.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID COIN TAG · MOUNTING MATRIX</text>
  <text x="600" y="98" text-anchor="middle" font-size="34" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">Five ways one disc stays attached</text>

  <!-- ── card 1 · SCREW ─────────────────────────────────────────── -->
  <rect x="55" y="124" width="205" height="296" rx="14" fill="#eef1f5" stroke="#d8dee6" stroke-width="1.5"/>
  <text x="157.5" y="152" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a5568">SCREW</text>
  <rect x="77" y="252" width="161" height="36" fill="#dfe3ea" stroke="#b9c2cf" stroke-width="1.5"/>
  <rect x="109.5" y="232" width="96" height="20" rx="6" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
  <rect x="154" y="212" width="7" height="70" fill="#4a5568"/>
  <rect x="143.5" y="204" width="28" height="10" rx="2" fill="#4a5568"/>
  <text x="157.5" y="318" text-anchor="middle" font-size="12.5" fill="#4f4f4f">M3 / M4 via central bore</text>
  <text x="157.5" y="338" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Tool handles, jigs, racks</text>
  <text x="157.5" y="358" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Removable, re-issuable</text>
  <rect x="118.5" y="376" width="78" height="24" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1"/>
  <text x="157.5" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">REUSABLE</text>

  <!-- ── card 2 · RIVET ─────────────────────────────────────────── -->
  <rect x="276" y="124" width="205" height="296" rx="14" fill="#eef1f5" stroke="#d8dee6" stroke-width="1.5"/>
  <text x="378.5" y="152" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a5568">RIVET</text>
  <rect x="298" y="252" width="161" height="36" fill="#dfe3ea" stroke="#b9c2cf" stroke-width="1.5"/>
  <rect x="330.5" y="232" width="96" height="20" rx="6" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
  <ellipse cx="378.5" cy="228" rx="16" ry="8" fill="#4a5568"/>
  <rect x="374.5" y="232" width="8" height="46" fill="#4a5568"/>
  <rect x="369.5" y="274" width="18" height="6" rx="3" fill="#4a5568"/>
  <text x="378.5" y="318" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Blind rivet, one-side fit</text>
  <text x="378.5" y="338" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Bins, totes, sheet metal</text>
  <text x="378.5" y="358" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Drill out to remove</text>
  <rect x="333.5" y="376" width="90" height="24" rx="12" fill="#f4f6f8" stroke="#4a5568" stroke-width="1"/>
  <text x="378.5" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">PERMANENT</text>

  <!-- ── card 3 · ADHESIVE ──────────────────────────────────────── -->
  <rect x="497" y="124" width="205" height="296" rx="14" fill="#eef1f5" stroke="#d8dee6" stroke-width="1.5"/>
  <text x="599.5" y="152" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a5568">ADHESIVE</text>
  <rect x="519" y="252" width="161" height="36" fill="#dfe3ea" stroke="#b9c2cf" stroke-width="1.5"/>
  <rect x="551.5" y="245" width="96" height="7" fill="#d4a755"/>
  <rect x="551.5" y="225" width="96" height="20" rx="6" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
  <text x="599.5" y="318" text-anchor="middle" font-size="12.5" fill="#4f4f4f">3M VHB 4910F / 5952 pad</text>
  <text x="599.5" y="338" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Coated metal, glass, ABS</text>
  <text x="599.5" y="358" text-anchor="middle" font-size="12.5" fill="#4f4f4f">No drilling, degrease</text>
  <rect x="559.5" y="376" width="80" height="24" rx="12" fill="#fbf4e4" stroke="#c39a5f" stroke-width="1"/>
  <text x="599.5" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5a3a">NO-DRILL</text>

  <!-- ── card 4 · WELD CARRIER ──────────────────────────────────── -->
  <rect x="718" y="124" width="205" height="296" rx="14" fill="#eef1f5" stroke="#d8dee6" stroke-width="1.5"/>
  <text x="820.5" y="152" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a5568">WELD CARRIER</text>
  <rect x="740" y="252" width="161" height="36" fill="#dfe3ea" stroke="#b9c2cf" stroke-width="1.5"/>
  <rect x="758.5" y="244" width="124" height="8" fill="#8b95a5" stroke="#6e7889" stroke-width="1"/>
  <path d="M 758.5 252 l -12 0 l 12 -9 z" fill="#c39a5f"/>
  <path d="M 882.5 252 l 12 0 l -12 -9 z" fill="#c39a5f"/>
  <rect x="772.5" y="224" width="96" height="20" rx="6" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
  <rect x="810.5" y="217" width="20" height="7" rx="2" fill="#4a5568"/>
  <text x="820.5" y="318" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Tack-welded 316L plate</text>
  <text x="820.5" y="338" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Bare structural steel</text>
  <text x="820.5" y="358" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Disc held by screw / epoxy</text>
  <rect x="761.5" y="376" width="118" height="24" rx="12" fill="#f4f6f8" stroke="#4a5568" stroke-width="1"/>
  <text x="820.5" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">NO-DRILL STEEL</text>

  <!-- ── card 5 · RECESS EMBED ──────────────────────────────────── -->
  <rect x="939" y="124" width="205" height="296" rx="14" fill="#eef1f5" stroke="#d8dee6" stroke-width="1.5"/>
  <text x="1041.5" y="152" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a5568">RECESS EMBED</text>
  <rect x="961" y="236" width="161" height="52" fill="#dfe3ea" stroke="#b9c2cf" stroke-width="1.5"/>
  <rect x="991.5" y="236" width="100" height="26" fill="#f8fafb" stroke="#b9c2cf" stroke-width="1"/>
  <rect x="993.5" y="258" width="96" height="3" fill="#d4a755"/>
  <rect x="993.5" y="238" width="96" height="20" rx="6" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
  <text x="1041.5" y="318" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Recess + adhesive pot</text>
  <text x="1041.5" y="338" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Wood, plastic, composite</text>
  <text x="1041.5" y="358" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Flush and snag-free</text>
  <rect x="1004.5" y="376" width="74" height="24" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1"/>
  <text x="1041.5" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">FLUSH</text>

  <!-- ── decision strip ─────────────────────────────────────────── -->
  <rect x="55" y="436" width="1089" height="64" rx="12" fill="#eef1f5" stroke="#d8dee6" stroke-width="1.5"/>
  <text x="84" y="474" font-size="13" font-weight="800" letter-spacing="0.5" fill="#4a5568">METAL HOST</text>
  <text x="250" y="474" font-size="14" fill="#291c0e">On-metal UHF spacer variant — fix by screw, rivet or weld · 0.3-1.5 m on steel · tap-range HF also fine</text>
  <rect x="55" y="510" width="1089" height="64" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
  <text x="84" y="548" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">NON-METAL HOST</text>
  <text x="250" y="548" font-size="14" fill="#291c0e">Any of the five mounts, standard disc — adhesive is the no-drill path, recess embed is the flush path</text>

  <text x="600" y="614" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Service envelope unchanged by mount: IP67 / IP68 housing, -25 °C to +85 °C, 2-4 mm disc</text>
</svg>
