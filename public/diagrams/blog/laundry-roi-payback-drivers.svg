<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">When does it go cash-positive? Scale decides most of it</title>
<desc id="d">Payback by scale and segment: under 5,000 linens expect 18-24 months as fixed costs stay heavy per piece; mid-size 5,000-50,000 linens land at 9-15 months; large operations above 50,000 linens reach 6-9 months as tag amortization drops below 10 cents per linen; uniform rental is the fastest segment at 4-7 months because each lost uniform costs $20-80; hospital surgical linen pays back in 6-12 months on compliance value. Warning cutoff: below roughly 2,000 pounds a day, self-deploying rarely pays back inside 36 months — buy tracked third-party laundry service instead.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE BREAKEVEN DIAL</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Scale turns the dial; segment fine-tunes it</text>

<rect x="52" y="136" width="356" height="190" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="230" y="176" text-anchor="middle" font-size="15" font-weight="800" fill="#4a5568">SMALL · &lt;5K linens</text>
<text x="230" y="226" text-anchor="middle" font-size="26" font-weight="800" fill="#4a5568">18–24 mo</text>
<text x="230" y="262" text-anchor="middle" font-size="12.5" fill="#4f4f4f">tag + reader cost per linen stays high</text>
<text x="230" y="290" text-anchor="middle" font-size="12.5" fill="#4f4f4f">savings mostly from loss reduction</text>

<rect x="422" y="136" width="356" height="190" rx="14" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="600" y="176" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">MID · 5K–50K linens</text>
<text x="600" y="226" text-anchor="middle" font-size="26" font-weight="800" fill="#6d5a3a">9–15 mo</text>
<text x="600" y="262" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the typical commercial band</text>
<text x="600" y="290" text-anchor="middle" font-size="12.5" fill="#4f4f4f">high baseline loss → the fast end</text>

<rect x="792" y="136" width="356" height="190" rx="14" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="970" y="176" text-anchor="middle" font-size="15" font-weight="800" fill="#1b4332">LARGE · 50K+ linens</text>
<text x="970" y="226" text-anchor="middle" font-size="26" font-weight="800" fill="#1b4332">6–9 mo</text>
<text x="970" y="262" text-anchor="middle" font-size="12.5" fill="#4f4f4f">tag amortization under $0.10/linen</text>
<text x="970" y="290" text-anchor="middle" font-size="12.5" fill="#4f4f4f">tunnels do 10K linens/hour, unattended</text>

<rect x="237" y="360" width="356" height="150" rx="14" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="2"/>
<text x="415" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#1b4332">FASTEST: uniform rental</text>
<text x="415" y="444" text-anchor="middle" font-size="24" font-weight="800" fill="#1b4332">4–7 mo</text>
<text x="415" y="480" text-anchor="middle" font-size="12.5" fill="#4f4f4f">each lost uniform costs $20–80 to replace</text>

<rect x="607" y="360" width="356" height="150" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="785" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">COMPLIANCE-DRIVEN: surgical linen</text>
<text x="785" y="444" text-anchor="middle" font-size="24" font-weight="800" fill="#2c5454">6–12 mo</text>
<text x="785" y="480" text-anchor="middle" font-size="12.5" fill="#4f4f4f">autoclave-cycle proof for Joint Commission audits</text>

<rect x="150" y="540" width="900" height="52" rx="14" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="600" y="572" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">Cutoff: below ~2,000 lbs/day, self-deploying rarely pays back inside 36 months — buy tracked third-party service instead.</text>
<text x="600" y="632" text-anchor="middle" font-size="13" fill="#5c5c5c">Multi-property groups amortize readers across sites (12–18 mo); standalone properties run 18–30.</text>
</svg>
