<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">What NFC review cards return: volume, cost, and the staff-training multiplier</title>
<desc id="d">Three comparisons from restaurant, salon and clinic deployments. One, monthly reviews per active card: 5 to 15 for NFC versus 1 to 3 for passive QR signage. Two, the staff hand-off effect: 8 to 15 reviews when staff hand the card versus 0.5 to 1.5 left on the counter. Three, cost per acquired review of 5 to 10 cents once amortized over twelve months.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE NUMBERS THAT MOVE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Three comparisons from restaurant, salon and clinic deployments.</text>
<rect x="76" y="168" width="336" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/><rect x="76" y="168" width="336" height="8" rx="4" fill="#3d6b6b"/>
<text x="244" y="208" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">Reviews / month per card</text>
<text x="104" y="242" text-anchor="start" font-size="12.5" font-weight="700" fill="#291c0e">NFC card</text>
<rect x="104" y="250" width="250.0" height="26" rx="6" fill="#3d6b6b"/>
<text x="344.0" y="268" text-anchor="end" font-size="13" font-weight="800" fill="#ffffff">5-15</text>
<text x="104" y="316" text-anchor="start" font-size="12.5" font-weight="700" fill="#291c0e">Paper QR</text>
<rect x="104" y="324" width="50.0" height="26" rx="6" fill="#cdc4b4"/>
<text x="164.0" y="342" text-anchor="start" font-size="13" font-weight="800" fill="#291c0e">1-3</text>
<rect x="432" y="168" width="336" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/><rect x="432" y="168" width="336" height="8" rx="4" fill="#3d6b6b"/>
<text x="600" y="208" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">When staff hand the card</text>
<text x="460" y="242" text-anchor="start" font-size="12.5" font-weight="700" fill="#291c0e">Staff-handed</text>
<rect x="460" y="250" width="250.0" height="26" rx="6" fill="#3d6b6b"/>
<text x="700.0" y="268" text-anchor="end" font-size="13" font-weight="800" fill="#ffffff">8-15</text>
<text x="460" y="316" text-anchor="start" font-size="12.5" font-weight="700" fill="#291c0e">Left on counter</text>
<rect x="460" y="324" width="25.0" height="26" rx="6" fill="#cdc4b4"/>
<text x="495.0" y="342" text-anchor="start" font-size="13" font-weight="800" fill="#291c0e">0.5-1.5</text>
<rect x="788" y="168" width="336" height="300" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/><rect x="788" y="168" width="336" height="8" rx="4" fill="#c39a5f"/>
<text x="956" y="208" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">Cost per acquired review</text>
<text x="956" y="300" text-anchor="middle" font-size="44" font-weight="800" fill="#2c5454">$0.05-0.10</text>
<text x="956" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">per Google review</text>
<rect x="820.0" y="378" width="272" height="32" rx="16.0" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/><text x="956" y="398.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">amortized · ~10 reviews / month</text>
<text x="600" y="516" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The card is cheap; the script is decisive — a handed card converts many times harder than one left out.</text>
</svg>
