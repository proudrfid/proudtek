<text x="701" y="476" font-size="12" fill="#8b2d2d">missing logos</text>
<circle cx="887" cy="440" r="26" fill="#d4a755" stroke="#b98a45" stroke-width="2"/>
<circle cx="931" cy="196" r="15" fill="#8b2d2d"/>
<text x="931" y="202" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">?</text>

