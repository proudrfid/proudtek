<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="acF3Title acF3Desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="acF3Title">Five evidence checkpoints for autoclave RFID validation</title>
  <desc id="acF3Desc">Five non-negotiable evidence checkpoints. One, an independent test-lab validation report citing ISO 17665-1 with the exact cycle parameters tested. Two, a real cycle count: minimum 1000 for general surgical use, 3000 plus for high-volume trays, and 5000 plus for a 10 year instrument life. Three, a published read-range degradation curve where graceful decline is acceptable but sudden failure is not. Four, biocompatibility to ISO 10993-5 cytotoxicity for any tag making clinical contact, which the FDA requires for tissue contact. Five, failure-mode disclosure so a tag does not silently fail. A side chart contrasts a graceful read-range decline against a sudden cliff to zero.</desc>

  <defs>
    <radialGradient id="f3Bg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f1ece0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#f3Bg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="60" y="66" font-size="23" font-weight="800" letter-spacing="0.5" fill="#291c0e">Ask for evidence, not adjectives</text>
  <text x="60" y="94" font-size="15.5" fill="#3d6b6b">Five checkpoints a real autoclave tag can prove — and a marketing claim can&apos;t</text>

  <!-- Left: 5 checklist rows -->
  <g>
    <!-- row 1 -->
    <rect x="58" y="126" width="620" height="82" rx="12" fill="#eef4f4" stroke="#bcd4d4" stroke-width="1.5"/>
    <rect x="76" y="150" width="34" height="34" rx="7" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
    <path d="M83 168 l6 7 l13 -15" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="158" font-size="17" font-weight="800" fill="#291c0e">Independent validation report</text>
    <text x="128" y="182" font-size="13.5" fill="#4f4f4f">Third-party test lab, citing ISO 17665-1 — with the exact cycle it tested</text>
    <text x="128" y="200" font-size="13.5" fill="#4f4f4f">(temperature, pressure, exposure time).</text>

    <!-- row 2 -->
    <rect x="58" y="216" width="620" height="82" rx="12" fill="#eef4f4" stroke="#bcd4d4" stroke-width="1.5"/>
    <rect x="76" y="240" width="34" height="34" rx="7" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
    <path d="M83 258 l6 7 l13 -15" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="248" font-size="17" font-weight="800" fill="#291c0e">A real cycle count</text>
    <text x="128" y="272" font-size="13.5" fill="#4f4f4f">1000 min for general surgical use · 3000+ for high-volume trays ·</text>
    <text x="128" y="290" font-size="13.5" fill="#4f4f4f">5000+ to reuse across a 10+ year instrument lifespan.</text>

    <!-- row 3 -->
    <rect x="58" y="306" width="620" height="82" rx="12" fill="#eef4f4" stroke="#bcd4d4" stroke-width="1.5"/>
    <rect x="76" y="330" width="34" height="34" rx="7" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
    <path d="M83 348 l6 7 l13 -15" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="338" font-size="17" font-weight="800" fill="#291c0e">Read-range degradation curve</text>
    <text x="128" y="362" font-size="13.5" fill="#4f4f4f">Published read range vs. cycle count. A graceful fade is fine;</text>
    <text x="128" y="380" font-size="13.5" fill="#4f4f4f">a sudden cliff to zero is not (see right).</text>

    <!-- row 4 -->
    <rect x="58" y="396" width="620" height="82" rx="12" fill="#eef4f4" stroke="#bcd4d4" stroke-width="1.5"/>
    <rect x="76" y="420" width="34" height="34" rx="7" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
    <path d="M83 438 l6 7 l13 -15" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="428" font-size="17" font-weight="800" fill="#291c0e">Biocompatibility</text>
    <text x="128" y="452" font-size="13.5" fill="#4f4f4f">ISO 10993-5 cytotoxicity for any tag making clinical contact —</text>
    <text x="128" y="470" font-size="13.5" fill="#4f4f4f">FDA-required for instruments touching patient tissue.</text>

    <!-- row 5 -->
    <rect x="58" y="486" width="620" height="82" rx="12" fill="#eef4f4" stroke="#bcd4d4" stroke-width="1.5"/>
    <rect x="76" y="510" width="34" height="34" rx="7" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
    <path d="M83 528 l6 7 l13 -15" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="518" font-size="17" font-weight="800" fill="#291c0e">Failure-mode disclosure</text>
    <text x="128" y="542" font-size="13.5" fill="#4f4f4f">What happens at end-of-life? A silent fail is the worst case.</text>
    <text x="128" y="560" font-size="13.5" fill="#4f4f4f">Demand a vendor with a transparent failure mode.</text>
  </g>

  <!-- Right: read-range vs cycles chart -->
  <g>
    <rect x="702" y="126" width="440" height="442" rx="14" fill="#fbf9f4" stroke="#e6dcc8" stroke-width="2"/>
    <text x="922" y="162" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Read range vs. cycles</text>
    <!-- axes -->
    <line x1="760" y1="200" x2="760" y2="470" stroke="#9a8f7d" stroke-width="2"/>
    <line x1="760" y1="470" x2="1104" y2="470" stroke="#9a8f7d" stroke-width="2"/>
    <text x="748" y="206" text-anchor="end" font-size="11.5" fill="#8a7a5f">100%</text>
    <text x="748" y="474" text-anchor="end" font-size="11.5" fill="#8a7a5f">0</text>
    <text x="932" y="494" text-anchor="middle" font-size="12" fill="#8a7a5f">autoclave cycles →</text>
    <text x="726" y="340" text-anchor="middle" font-size="12" fill="#8a7a5f" transform="rotate(-90 726 340)">read range</text>
    <!-- graceful (green) -->
    <path d="M760 214 C 880 226, 990 300, 1104 402" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linecap="round"/>
    <!-- sudden (red) -->
    <path d="M760 222 L 968 244 L 1006 468" fill="none" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- legend -->
    <line x1="792" y1="516" x2="826" y2="516" stroke="#1f6f3a" stroke-width="4"/>
    <text x="834" y="521" font-size="13.5" font-weight="700" fill="#1f6f3a">graceful ✓</text>
    <line x1="960" y1="516" x2="994" y2="516" stroke="#8b2d2d" stroke-width="4"/>
    <text x="1002" y="521" font-size="13.5" font-weight="700" fill="#8b2d2d">sudden ✗</text>
    <text x="922" y="548" text-anchor="middle" font-size="12" fill="#5c5c5c">A curve you can plan replacements around beats a surprise.</text>
  </g>
</svg>
