<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five RFID benefits mapped to the auditable line each one produces</title>
<desc id="d">Five benefit categories, each mapped to the auditable metric a finance team can check. Audit labor maps to a 70 to 90 percent cut in audit time. Search time maps to the 30 to 60 minutes a day staff lose hunting for equipment. Loss and theft maps to an annual asset loss rate of 3 to 10 percent that RFID helps avoid. Utilization maps to a 10 to 25 percent smaller asset pool through better sharing. Compliance maps to always-audit-ready records that avoid penalties in regulated sectors.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FROM BENEFIT TO AUDITABLE LINE</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Each benefit only counts if it lands as a number an auditor could check.</text>

<text x="90" y="128" font-size="13" font-weight="800" letter-spacing="0.6" fill="#8a8a8a">BENEFIT</text>
<text x="928" y="128" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.6" fill="#8a8a8a">THE AUDITABLE LINE</text>

<!-- Row 1: audit labor (teal) -->
<text x="90" y="184" font-size="18" font-weight="700" fill="#291c0e">Audit labor</text>
<text x="90" y="206" font-size="13" fill="#5c5c5c">audit hours times fully loaded labor cost</text>
<text x="676" y="196" font-size="26" fill="#b6ac97">&#8594;</text>
<rect x="720" y="158" width="416" height="54" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="744" y="192" font-size="22" font-weight="800" fill="#2c5454">70-90%</text>
<text x="1112" y="191" text-anchor="end" font-size="13.5" fill="#5c5c5c">less audit time</text>

<!-- Row 2: search time (steel) -->
<text x="90" y="262" font-size="18" font-weight="700" fill="#291c0e">Search time</text>
<text x="90" y="284" font-size="13" fill="#5c5c5c">minutes a day lost hunting for equipment</text>
<text x="676" y="274" font-size="26" fill="#b6ac97">&#8594;</text>
<rect x="720" y="236" width="416" height="54" rx="14" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.4"/>
<text x="744" y="270" font-size="22" font-weight="800" fill="#4a5568">30-60 min/day</text>
<text x="1112" y="269" text-anchor="end" font-size="13.5" fill="#5c5c5c">removed for tagged assets</text>

<!-- Row 3: loss & theft (red = genuine loss state) -->
<text x="90" y="340" font-size="18" font-weight="700" fill="#291c0e">Loss and theft</text>
<text x="90" y="362" font-size="13" fill="#5c5c5c">replacement cost of assets gone missing</text>
<text x="676" y="352" font-size="26" fill="#b6ac97">&#8594;</text>
<rect x="720" y="314" width="416" height="54" rx="14" fill="#f7ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="744" y="348" font-size="22" font-weight="800" fill="#8b2d2d">3-10% / yr</text>
<text x="1112" y="347" text-anchor="end" font-size="13.5" fill="#5c5c5c">loss rate you stop paying</text>

<!-- Row 4: utilization (forest) -->
<text x="90" y="418" font-size="18" font-weight="700" fill="#291c0e">Utilization</text>
<text x="90" y="440" font-size="13" fill="#5c5c5c">right-size the pool through sharing</text>
<text x="676" y="430" font-size="26" fill="#b6ac97">&#8594;</text>
<rect x="720" y="392" width="416" height="54" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="744" y="426" font-size="22" font-weight="800" fill="#1f6f3a">10-25%</text>
<text x="1112" y="425" text-anchor="end" font-size="13.5" fill="#5c5c5c">smaller asset inventory</text>

<!-- Row 5: compliance (gold, qualitative) -->
<text x="90" y="496" font-size="18" font-weight="700" fill="#291c0e">Compliance</text>
<text x="90" y="518" font-size="13" fill="#5c5c5c">healthcare, defense and government audits</text>
<text x="676" y="508" font-size="26" fill="#b6ac97">&#8594;</text>
<rect x="720" y="470" width="416" height="54" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="744" y="504" font-size="20" font-weight="800" fill="#a07d43">Audit-ready</text>
<text x="1112" y="503" text-anchor="end" font-size="13.5" fill="#5c5c5c">penalties and prep avoided</text>

<text x="600" y="590" text-anchor="middle" font-size="14" fill="#4f4f4f">Lead the business case with audit labor and loss; keep utilization and compliance as upside.</text>
</svg>
