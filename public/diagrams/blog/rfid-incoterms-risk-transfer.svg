<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Incoterms 2020 risk transfer — how far the RFID supplier's responsibility extends under EXW, FOB, CIF and DDP</title>
<desc id="d">A shipping journey from factory to buyer warehouse with stops at the origin port, ocean transit and destination port. Four bars show where the seller's cost and risk end: EXW at the factory door, FOB when goods are on board at the origin port, CIF at the destination port with freight and insurance paid, and DDP at the buyer's warehouse with duties paid. Solid marks the seller's cost and risk; dashed marks the buyer's.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INCOTERMS 2020 · WHO PAYS HOW FAR</text>
<text x="600" y="99" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">Where the supplier's job ends</text>
<text x="600" y="131" text-anchor="middle" font-size="16" fill="#4f4f4f">Lock the term or quotes vary 15-30% on landed cost. Four terms, four handoff points.</text>
<line x1="150" y1="286" x2="150" y2="508" stroke="#e6dfd2" stroke-width="1.4" stroke-dasharray="4 5"/>
<line x1="390" y1="286" x2="390" y2="508" stroke="#e6dfd2" stroke-width="1.4" stroke-dasharray="4 5"/>
<line x1="850" y1="286" x2="850" y2="508" stroke="#e6dfd2" stroke-width="1.4" stroke-dasharray="4 5"/>
<line x1="1080" y1="286" x2="1080" y2="508" stroke="#e6dfd2" stroke-width="1.4" stroke-dasharray="4 5"/>
<line x1="150" y1="250" x2="1080" y2="250" stroke="#cfd6de" stroke-width="2"/>
<circle cx="150" cy="250" r="6" fill="#4a5568"/><circle cx="390" cy="250" r="6" fill="#4a5568"/><circle cx="620" cy="250" r="6" fill="#4a5568"/><circle cx="850" cy="250" r="6" fill="#4a5568"/><circle cx="1080" cy="250" r="6" fill="#4a5568"/>
<text x="150" y="228" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">Factory</text>
<text x="390" y="228" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">Origin port</text>
<text x="620" y="228" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">Ocean</text>
<text x="850" y="228" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">Dest. port</text>
<text x="1080" y="228" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">Buyer DC</text>
<line x1="190" y1="315" x2="204" y2="315" stroke="#b9c2cc" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="442" y1="315" x2="1080" y2="315" stroke="#b9c2cc" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="150" y="300" width="40" height="30" rx="6" fill="#4a5568"/>
<polygon points="190,300 184,291 196,291" fill="#c39a5f"/>
<text x="80" y="319" font-size="14" font-weight="800" fill="#4a5568">EXW</text>
<text x="210" y="319" font-size="12" fill="#5c5c5c">buyer takes it at the factory door</text>
<line x1="390" y1="371" x2="400" y2="371" stroke="#b9c2cc" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="676" y1="371" x2="1080" y2="371" stroke="#b9c2cc" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="150" y="356" width="240" height="30" rx="6" fill="#3d6b6b"/>
<polygon points="390,356 384,347 396,347" fill="#c39a5f"/>
<text x="80" y="375" font-size="14" font-weight="800" fill="#2c5454">FOB</text>
<text x="404" y="375" font-size="12" fill="#5c5c5c">seller loads on board at the origin port</text>
<line x1="850" y1="427" x2="1080" y2="427" stroke="#b9c2cc" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="150" y="412" width="700" height="30" rx="6" fill="#c39a5f"/>
<polygon points="850,412 844,403 856,403" fill="#6d5a3a"/>
<text x="80" y="431" font-size="14" font-weight="800" fill="#6d5a3a">CIF</text>
<text x="165" y="431" font-size="12" font-weight="700" fill="#ffffff">seller pays freight + insurance to the destination port</text>
<rect x="150" y="468" width="930" height="30" rx="6" fill="#2d6a4f"/>
<polygon points="1080,468 1074,459 1086,459" fill="#6d5a3a"/>
<text x="80" y="487" font-size="14" font-weight="800" fill="#2d6a4f">DDP</text>
<text x="165" y="487" font-size="12" font-weight="700" fill="#ffffff">seller delivers duty-paid all the way to your warehouse</text>
<line x1="150" y1="536" x2="184" y2="536" stroke="#4a5568" stroke-width="6"/>
<text x="192" y="540" font-size="12" fill="#5c5c5c">seller's cost &amp; risk</text>
<line x1="360" y1="536" x2="394" y2="536" stroke="#b9c2cc" stroke-width="3" stroke-dasharray="5 5"/>
<text x="402" y="540" font-size="12" fill="#5c5c5c">buyer's cost &amp; risk</text>
<text x="600" y="600" text-anchor="middle" font-size="13.5" fill="#4f4f4f">'FOB China' is not specific enough — name the port and reference the HTS code in the PO.</text>
</svg>
