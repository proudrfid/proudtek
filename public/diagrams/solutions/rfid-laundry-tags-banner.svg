<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ltTitle ltDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ltTitle">RFID laundry tag material decision matrix — PPS, silicone and sewn-in textile</title>
  <desc id="ltDesc">Three washable RFID laundry tag families mapped to the wash profile. PPS hard-shell (Syensqo Ryton) survives 200–500+ industrial cycles to 200 °C and is autoclave-capable; silicone overmold (Wacker ELASTOSIL) flexes with the garment across 150–300 cycles to 225 °C; sewn-in woven textile carriers hide in the hem for 100–200 cycles at the lowest cost per use. A durability axis runs from ISO 6330 domestic to ISO 15797 industrial wash. One chip family — UHF UCODE 9, Impinj Monza or Alien Higgs, or HF ICODE SLIX2 — can span the programme once the polymer and attachment match each textile.</desc>

  <defs>
    <radialGradient id="ltGlow" cx="50%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="ltHeat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e7eeee"/>
      <stop offset="48%" stop-color="#efd9b2"/>
      <stop offset="100%" stop-color="#c39a5f"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="675" fill="url(#ltGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <!-- Eyebrow + deck -->
  <text x="600" y="64" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2.5" fill="#6d5a3a">RFID LAUNDRY TAG · MATERIAL DECISION MATRIX</text>
  <text x="600" y="93" text-anchor="middle" font-size="15.5" fill="#4a5568">Wash profile + attachment decide the tag family — before the chip.</text>

  <!-- Durability axis -->
  <rect x="96" y="116" width="1008" height="24" rx="12" fill="url(#ltHeat)" stroke="#e0d3ba" stroke-width="1"/>
  <text x="98" y="159" font-size="13" fill="#6d5a3a">ISO 6330 domestic · 40–60 °C</text>
  <text x="600" y="159" text-anchor="middle" font-size="12" fill="#8a949c">increasing wash severity →</text>
  <text x="1102" y="159" text-anchor="end" font-size="13" fill="#6d5a3a">ISO 15797 industrial · 75–95 °C · pH 11–12</text>

  <!-- ===================== CARD 1 · PPS HARD-SHELL ===================== -->
  <g>
    <rect x="72" y="190" width="332" height="370" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <path d="M72 206 a16 16 0 0 1 16 -16 h300 a16 16 0 0 1 16 16 v38 h-332 z" fill="#4a5568"/>
    <text x="238" y="223" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">PPS HARD-SHELL</text>
    <text x="238" y="263" text-anchor="middle" font-size="13" fill="#6d5a3a">Syensqo Ryton PPS</text>

    <!-- rigid button icon -->
    <rect x="208" y="272" width="60" height="46" rx="10" fill="#eef1f4" stroke="#4a5568" stroke-width="3"/>
    <rect x="229" y="288" width="18" height="14" rx="3" fill="#4a5568"/>
    <circle cx="218" cy="295" r="3" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
    <circle cx="258" cy="295" r="3" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
    <!-- RFID read -->
    <g fill="none" stroke="#1fcefb" stroke-width="2.6" stroke-linecap="round">
      <path d="M272 280 a10 10 0 0 1 10 11"/>
      <path d="M272 273 a17 17 0 0 1 17 18"/>
    </g>
    <circle cx="272" cy="284" r="3" fill="#1fcefb"/>

    <!-- stat rows -->
    <g>
      <rect x="90" y="344" width="296" height="32" rx="8" fill="#ffffff" stroke="#efe6d5" stroke-width="1.5"/>
      <text x="104" y="365" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#8a7a5a">WASH LIFE</text>
      <text x="372" y="365" text-anchor="end" font-size="15" font-weight="800" fill="#291c0e">200–500+ cyc</text>
      <rect x="90" y="384" width="296" height="32" rx="8" fill="#ffffff" stroke="#efe6d5" stroke-width="1.5"/>
      <text x="104" y="405" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#8a7a5a">MAX TEMP</text>
      <text x="372" y="405" text-anchor="end" font-size="15" font-weight="800" fill="#291c0e">200 °C</text>
      <rect x="90" y="424" width="296" height="32" rx="8" fill="#ffffff" stroke="#efe6d5" stroke-width="1.5"/>
      <text x="104" y="445" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#8a7a5a">COST / TAG</text>
      <text x="372" y="445" text-anchor="end" font-size="15" font-weight="800" fill="#291c0e">$0.80–3.00</text>
    </g>

    <text x="238" y="480" text-anchor="middle" font-size="12.5" fill="#6d5a3a">Surgical textiles · heavy workwear</text>
    <text x="238" y="497" text-anchor="middle" font-size="12.5" fill="#6d5a3a">hospital scrubs</text>
    <text x="238" y="528" text-anchor="middle" font-size="12" fill="#9a8f7a">Button-snap · autoclave-capable (ST79)</text>
  </g>

  <!-- ===================== CARD 2 · SILICONE OVERMOLD ===================== -->
  <g>
    <rect x="434" y="190" width="332" height="370" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <path d="M434 206 a16 16 0 0 1 16 -16 h300 a16 16 0 0 1 16 16 v38 h-332 z" fill="#3d6b6b"/>
    <text x="600" y="223" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">SILICONE OVERMOLD</text>
    <text x="600" y="263" text-anchor="middle" font-size="13" fill="#6d5a3a">Wacker ELASTOSIL HTV</text>

    <!-- flexible pill icon -->
    <rect x="568" y="278" width="64" height="34" rx="17" fill="#eef4f4" stroke="#3d6b6b" stroke-width="3"/>
    <path d="M576 295 q12 -8 24 0 t24 0" fill="none" stroke="#3d6b6b" stroke-width="2"/>
    <rect x="592" y="288" width="16" height="14" rx="3" fill="#3d6b6b"/>
    <!-- RFID read -->
    <g fill="none" stroke="#1fcefb" stroke-width="2.6" stroke-linecap="round">
      <path d="M636 280 a10 10 0 0 1 10 11"/>
      <path d="M636 273 a17 17 0 0 1 17 18"/>
    </g>
    <circle cx="636" cy="284" r="3" fill="#1fcefb"/>

    <g>
      <rect x="452" y="344" width="296" height="32" rx="8" fill="#ffffff" stroke="#efe6d5" stroke-width="1.5"/>
      <text x="466" y="365" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#8a7a5a">WASH LIFE</text>
      <text x="734" y="365" text-anchor="end" font-size="15" font-weight="800" fill="#291c0e">150–300 cyc</text>
      <rect x="452" y="384" width="296" height="32" rx="8" fill="#ffffff" stroke="#efe6d5" stroke-width="1.5"/>
      <text x="466" y="405" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#8a7a5a">MAX TEMP</text>
      <text x="734" y="405" text-anchor="end" font-size="15" font-weight="800" fill="#291c0e">225 °C</text>
      <rect x="452" y="424" width="296" height="32" rx="8" fill="#ffffff" stroke="#efe6d5" stroke-width="1.5"/>
      <text x="466" y="445" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#8a7a5a">COST / TAG</text>
      <text x="734" y="445" text-anchor="end" font-size="15" font-weight="800" fill="#291c0e">$0.30–1.20</text>
    </g>

    <text x="600" y="480" text-anchor="middle" font-size="12.5" fill="#6d5a3a">Terry towels · knit garments</text>
    <text x="600" y="497" text-anchor="middle" font-size="12.5" fill="#6d5a3a">sport jerseys</text>
    <text x="600" y="528" text-anchor="middle" font-size="12" fill="#9a8f7a">Heat-seal / sew-in · −55 to +225 °C</text>
  </g>

  <!-- ===================== CARD 3 · SEWN-IN TEXTILE ===================== -->
  <g>
    <rect x="796" y="190" width="332" height="370" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <path d="M796 206 a16 16 0 0 1 16 -16 h300 a16 16 0 0 1 16 16 v38 h-332 z" fill="#6d5a3a"/>
    <text x="962" y="223" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">SEWN-IN TEXTILE</text>
    <text x="962" y="263" text-anchor="middle" font-size="13" fill="#6d5a3a">Woven laminate carrier</text>

    <!-- woven label icon -->
    <rect x="932" y="274" width="60" height="48" rx="4" fill="#f7efdd" stroke="#6d5a3a" stroke-width="3"/>
    <line x1="938" y1="282" x2="986" y2="282" stroke="#6d5a3a" stroke-width="1.6" stroke-dasharray="3 3"/>
    <line x1="938" y1="314" x2="986" y2="314" stroke="#6d5a3a" stroke-width="1.6" stroke-dasharray="3 3"/>
    <rect x="954" y="290" width="16" height="14" rx="2" fill="#6d5a3a"/>
    <!-- RFID read -->
    <g fill="none" stroke="#1fcefb" stroke-width="2.6" stroke-linecap="round">
      <path d="M996 280 a10 10 0 0 1 10 11"/>
      <path d="M996 273 a17 17 0 0 1 17 18"/>
    </g>
    <circle cx="996" cy="284" r="3" fill="#1fcefb"/>

    <g>
      <rect x="814" y="344" width="296" height="32" rx="8" fill="#ffffff" stroke="#efe6d5" stroke-width="1.5"/>
      <text x="828" y="365" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#8a7a5a">WASH LIFE</text>
      <text x="1096" y="365" text-anchor="end" font-size="15" font-weight="800" fill="#291c0e">100–200 cyc</text>
      <rect x="814" y="384" width="296" height="32" rx="8" fill="#ffffff" stroke="#efe6d5" stroke-width="1.5"/>
      <text x="828" y="405" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#8a7a5a">MAX TEMP</text>
      <text x="1096" y="405" text-anchor="end" font-size="15" font-weight="800" fill="#291c0e">moderate</text>
      <rect x="814" y="424" width="296" height="32" rx="8" fill="#ffffff" stroke="#efe6d5" stroke-width="1.5"/>
      <text x="828" y="445" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#8a7a5a">COST / TAG</text>
      <text x="1096" y="445" text-anchor="end" font-size="15" font-weight="800" fill="#291c0e">$0.15–0.45</text>
    </g>

    <text x="962" y="480" text-anchor="middle" font-size="12.5" fill="#6d5a3a">Chef coats · hotel linen</text>
    <text x="962" y="497" text-anchor="middle" font-size="12.5" fill="#6d5a3a">uniform rental</text>
    <text x="962" y="528" text-anchor="middle" font-size="12" fill="#9a8f7a">Sewn into the hem · lowest cost / use</text>
  </g>

  <!-- Bottom caption -->
  <text x="600" y="596" text-anchor="middle" font-size="15.5" fill="#6d5a3a">One chip family can span the programme — the polymer and attachment must match each textile and its wash profile.</text>

  <!-- Legend + chip note -->
  <g>
    <rect x="96" y="616" width="150" height="30" rx="15" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.5"/>
    <circle cx="118" cy="631" r="3.5" fill="#1fcefb"/>
    <path d="M127 631 a8 8 0 0 1 13 0" fill="none" stroke="#1fcefb" stroke-width="2.4" stroke-linecap="round"/>
    <text x="150" y="636" font-size="12.5" font-weight="600" fill="#177a92">RFID read</text>
  </g>
  <text x="1104" y="636" text-anchor="end" font-size="12.5" fill="#6d5a3a">UHF: UCODE 9 · Monza · Higgs   ·   HF: ICODE SLIX2</text>
</svg>
