<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">On-metal construction of a thin RFID PCB tag on a server chassis</title>
  <desc id="d">A cross-section stack showing how a thin PCB RFID tag reads on metal: a metal server chassis at the base, a 3M VHB 4910F / 5952 adhesive or M2 / M3 screw mount, an FR-4 or Rogers RO4350B dielectric with a ground plane at 1.0-2.0 mm, an etched copper UHF antenna with ENIG or HASL finish at 860-960 MHz, a reflowed Monza R6-P / M730 / M750 / M800 / UCODE 9 chip, and a solder-masked IP65 face reflowed per IPC-A-610 Class 2 / 3. Below, four qualification chips: 1-3 m on-metal read range, plus or minus 0.5 dB unit variance, minus 40 to plus 85 degrees C, and IPC-A-610 workmanship.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW A THIN PCB TAG READS ON A METAL CHASSIS</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">The FR-4 / Rogers dielectric and its ground plane restore the read a foam label loses</text>

  <!-- server chassis icon -->
  <rect x="110" y="300" width="210" height="100" rx="8" fill="#dfe4ea" stroke="#9aa4b2" stroke-width="2"/>
  <rect x="104" y="330" width="10" height="40" rx="3" fill="#9aa4b2"/>
  <rect x="316" y="330" width="10" height="40" rx="3" fill="#9aa4b2"/>
  <rect x="128" y="316" width="120" height="7" rx="3" fill="#c3ccd6"/>
  <rect x="128" y="330" width="90" height="7" rx="3" fill="#c3ccd6"/>
  <rect x="250" y="352" width="52" height="30" rx="4" fill="#e4c98f" stroke="#c39a5f" stroke-width="2"/>
  <text x="276" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5a3a">TAG</text>
  <text x="215" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">The tag sits flat on the chassis</text>
  <polygon points="330,369 418,369 418,363 436,375 418,387 418,381 330,381" fill="#9aa4b2"/>

  <!-- layer stack -->
  <text x="700" y="120" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">THE ON-METAL STACK (bottom → top)</text>
  <rect x="440" y="356" width="520" height="38" rx="6" fill="#dfe4ea" stroke="#9aa4b2" stroke-width="2"/>
  <text x="460" y="380" font-size="13.5" fill="#291c0e">Metal chassis — the surface a bare inlay goes silent on</text>
  <rect x="440" y="312" width="520" height="38" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="460" y="336" font-size="13.5" fill="#291c0e">3M VHB 4910F / 5952 adhesive — or an M2 / M3 screw</text>
  <rect x="440" y="268" width="520" height="38" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="460" y="292" font-size="13.5" fill="#2c5454">FR-4 / Rogers RO4350B dielectric + ground plane — 1.0-2.0 mm</text>
  <rect x="440" y="224" width="520" height="38" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="460" y="248" font-size="13.5" fill="#291c0e">Etched copper UHF antenna — ENIG / HASL, 860-960 MHz</text>
  <rect x="440" y="180" width="520" height="38" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="460" y="204" font-size="13.5" fill="#2c5454">Reflowed chip — Monza R6-P / M730 / M750 / M800 / UCODE 9</text>
  <rect x="440" y="136" width="520" height="34" rx="6" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <text x="460" y="158" font-size="12.5" fill="#5c5c5c">Solder-masked IP65 face — reflowed per IPC-A-610 Class 2 / 3</text>

  <!-- qualification chips -->
  <text x="600" y="452" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">QUALIFIED FOR THE DATA-CENTRE AISLE</text>
  <rect x="70" y="470" width="250" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="90" y="497" font-size="15" font-weight="700" fill="#291c0e">1-3 m on metal</text>
  <text x="90" y="517" font-size="12.5" fill="#5c5c5c">painted / anodised metal</text>
  <rect x="340" y="470" width="250" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="360" y="497" font-size="15" font-weight="700" fill="#291c0e">≤ ±0.5 dB variance</text>
  <text x="360" y="517" font-size="12.5" fill="#5c5c5c">across a 10,000-unit order</text>
  <rect x="610" y="470" width="250" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="630" y="497" font-size="15" font-weight="700" fill="#291c0e">-40 °C to +85 °C</text>
  <text x="630" y="517" font-size="12.5" fill="#5c5c5c">IP65 solder-masked face</text>
  <rect x="880" y="470" width="250" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="900" y="497" font-size="15" font-weight="700" fill="#291c0e">IPC-A-610 Class 2 / 3</text>
  <text x="900" y="517" font-size="12.5" fill="#5c5c5c">J-STD-001 · JEDEC MSL 3</text>

  <text x="600" y="576" text-anchor="middle" font-size="13.5" fill="#5c5c5c">One EPC per tag, permalocked to the CMDB CI — the authoritative physical-inventory artefact.</text>
</svg>
