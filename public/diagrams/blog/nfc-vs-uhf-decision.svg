<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="dcTitle dcDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="dcTitle">Decision flow for choosing NFC or UHF RFID</title>
  <desc id="dcDesc">Start with what the tag is for. First question: will a person hold a phone to it? If yes, choose NFC for marketing, payment, authentication and one-item-at-a-time use. If no, ask the second question: do you need to read many items at once, hands-free, across a room? If yes, choose UHF RFID for inventory, dock doors and vehicle identification. If you need both consumer tap and warehouse scanning, choose a combo NFC plus UHF label. Rough cost: NFC 5 to 40 cents, UHF 3 to 15 cents, and the gap narrows at volume.</desc>
  <defs>
    <radialGradient id="dcBg" cx="50%" cy="16%" r="92%"><stop offset="0%" stop-color="#f8f1e2"/><stop offset="100%" stop-color="#f3eee2"/></radialGradient>
    <marker id="dcArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a8a66"/></marker>
    <marker id="dcArrowCy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1fcefb"/></marker>
    <marker id="dcArrowSt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a5568"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#dcBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="1.5" fill="#6d5a3a">NFC OR UHF RFID? JUST FOLLOW THE ARROWS</text>

  <!-- start -->
  <rect x="452" y="90" width="296" height="56" rx="14" fill="#291c0e"/>
  <text x="600" y="125" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">What is the tag actually for?</text>
  <line x1="600" y1="146" x2="600" y2="186" stroke="#9a8a66" stroke-width="2.5" marker-end="url(#dcArrow)"/>

  <!-- Q1 -->
  <rect x="392" y="188" width="416" height="74" rx="14" fill="#fbf8f2" stroke="#c9bb98" stroke-width="2.5"/>
  <text x="600" y="222" text-anchor="middle" font-size="18.5" font-weight="700" fill="#291c0e">Will a person hold a phone to it?</text>
  <text x="600" y="247" text-anchor="middle" font-size="14.5" fill="#6d5a3a">one item, on purpose, up close</text>
  <!-- Q1 yes -> NFC -->
  <line x1="808" y1="225" x2="874" y2="225" stroke="#1fcefb" stroke-width="3" marker-end="url(#dcArrowCy)"/>
  <text x="840" y="214" text-anchor="middle" font-size="14" font-weight="800" fill="#0f6d84">YES</text>
  <!-- Q1 no down -->
  <line x1="600" y1="262" x2="600" y2="306" stroke="#9a8a66" stroke-width="2.5" marker-end="url(#dcArrow)"/>
  <text x="620" y="290" font-size="14" font-weight="800" fill="#6d5a3a">NO</text>

  <!-- NFC outcome -->
  <rect x="880" y="182" width="268" height="130" rx="14" fill="#e8f9fe" stroke="#1fcefb" stroke-width="3"/>
  <text x="900" y="216" font-size="20" font-weight="800" fill="#0f6d84">→ NFC</text>
  <text x="900" y="244" font-size="14.5" fill="#12657a">Marketing, payment, access,</text>
  <text x="900" y="266" font-size="14.5" fill="#12657a">business cards, authentication.</text>
  <text x="900" y="294" font-size="14" font-weight="700" fill="#0f6d84">Any modern phone reads it.</text>

  <!-- Q2 -->
  <rect x="392" y="308" width="416" height="74" rx="14" fill="#fbf8f2" stroke="#c9bb98" stroke-width="2.5"/>
  <text x="600" y="342" text-anchor="middle" font-size="18.5" font-weight="700" fill="#291c0e">Many items at once, hands-free?</text>
  <text x="600" y="367" text-anchor="middle" font-size="14.5" fill="#6d5a3a">across a room, no human tapping</text>
  <!-- Q2 yes -> UHF -->
  <line x1="808" y1="345" x2="874" y2="345" stroke="#4a5568" stroke-width="3" marker-end="url(#dcArrowSt)"/>
  <text x="840" y="334" text-anchor="middle" font-size="14" font-weight="800" fill="#1f4e79">YES</text>
  <!-- Q2 no down -->
  <line x1="600" y1="382" x2="600" y2="426" stroke="#9a8a66" stroke-width="2.5" marker-end="url(#dcArrow)"/>
  <text x="620" y="410" font-size="14" font-weight="800" fill="#6d5a3a">BOTH?</text>

  <!-- UHF outcome -->
  <rect x="880" y="302" width="268" height="130" rx="14" fill="#eef1f6" stroke="#4a5568" stroke-width="3"/>
  <text x="900" y="336" font-size="20" font-weight="800" fill="#1f4e79">→ UHF RFID</text>
  <text x="900" y="364" font-size="14.5" fill="#3a4a52">Inventory counts, dock-door</text>
  <text x="900" y="386" font-size="14.5" fill="#3a4a52">portals, vehicle ID.</text>
  <text x="900" y="414" font-size="14" font-weight="700" fill="#1f4e79">Needs a dedicated reader.</text>

  <!-- Combo -->
  <rect x="360" y="428" width="480" height="96" rx="14" fill="#e6f0ea" stroke="#2d6a4f" stroke-width="3"/>
  <text x="600" y="464" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6f3a">→ One combo NFC + UHF label</text>
  <text x="600" y="494" text-anchor="middle" font-size="15" fill="#2d6a4f">Consumer tap AND warehouse scan on a single tag</text>
  <text x="600" y="514" text-anchor="middle" font-size="14" fill="#2d6a4f">(hello, EU Digital Product Passport)</text>

  <!-- cost strip -->
  <rect x="120" y="556" width="960" height="70" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="150" y="586" font-size="15.5" font-weight="800" fill="#6d5a3a">BALLPARK COST</text>
  <text x="150" y="610" font-size="15.5" fill="#4f4f4f">NFC $0.05–0.40 · UHF $0.03–0.15 — the gap narrows at volume. Spec for the job, not the sticker price.</text>
</svg>
