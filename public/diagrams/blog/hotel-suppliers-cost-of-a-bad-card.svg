<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="cbTitle cbDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="cbTitle">The cost of one bad key card</title>
  <desc id="cbDesc">A cascade: a card fails at the lock, the front desk re-encodes while a line forms, a guest is stuck in the hallway, a complaint follows at checkout, and finally a public review. A side panel contrasts the tiny card unit price against the far larger true cost of the failure.</desc>

  <defs>
    <radialGradient id="cbBg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="cbDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/>
    </linearGradient>
    <marker id="cbArrow" markerWidth="9" markerHeight="9" refX="3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b5623f"/></marker>
  </defs>

  <rect width="1200" height="675" fill="url(#cbBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="64" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2" fill="#6d5a3a">THE COST OF ONE BAD CARD</text>
  <text x="600" y="94" text-anchor="middle" font-size="16" fill="#4f4f4f">A cheap card is only cheap until the lock says no</text>

  <!-- ===== Staircase cascade ===== -->
  <g>
    <line x1="404" y1="196" x2="424" y2="212" stroke="#b5623f" stroke-width="3" marker-end="url(#cbArrow)"/>
    <line x1="458" y1="268" x2="478" y2="284" stroke="#b5623f" stroke-width="3" marker-end="url(#cbArrow)"/>
    <line x1="512" y1="340" x2="532" y2="356" stroke="#b5623f" stroke-width="3" marker-end="url(#cbArrow)"/>
    <line x1="566" y1="412" x2="586" y2="428" stroke="#b5623f" stroke-width="3" marker-end="url(#cbArrow)"/>

    <rect x="64" y="140" width="340" height="56" rx="13" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="96" cy="168" r="15" fill="#c39a5f"/><text x="96" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">1</text>
    <text x="122" y="174" font-size="16.5" font-weight="700" fill="#291c0e">Card fails at the lock</text>

    <rect x="118" y="212" width="340" height="56" rx="13" fill="#fbf8f2" stroke="#dcb083" stroke-width="2"/>
    <circle cx="150" cy="240" r="15" fill="#cf9d6f"/><text x="150" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">2</text>
    <text x="176" y="246" font-size="16.5" font-weight="700" fill="#291c0e">Front desk re-encodes, a line forms</text>

    <rect x="172" y="284" width="340" height="56" rx="13" fill="#fbf8f2" stroke="#d09a6a" stroke-width="2"/>
    <circle cx="204" cy="312" r="15" fill="#c17d52"/><text x="204" y="318" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">3</text>
    <text x="230" y="318" font-size="16.5" font-weight="700" fill="#291c0e">Guest stuck in the hallway</text>

    <rect x="226" y="356" width="340" height="56" rx="13" fill="#fbf3ee" stroke="#c06a44" stroke-width="2"/>
    <circle cx="258" cy="384" r="15" fill="#a94b30"/><text x="258" y="390" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">4</text>
    <text x="284" y="390" font-size="16.5" font-weight="700" fill="#291c0e">Complaint at checkout</text>

    <rect x="280" y="428" width="360" height="56" rx="13" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2.5"/>
    <circle cx="312" cy="456" r="15" fill="#8b2d2d"/><text x="312" y="462" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">5</text>
    <text x="338" y="462" font-size="16.5" font-weight="800" fill="#8b2d2d">The review no rate plan can buy back</text>
  </g>

  <!-- ===== Cost comparison ===== -->
  <rect x="700" y="150" width="436" height="392" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="918" y="188" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">What you actually pay</text>

  <!-- unit price small -->
  <rect x="744" y="470" width="120" height="34" rx="8" fill="#c39a5f"/>
  <text x="804" y="524" text-anchor="middle" font-size="13.5" fill="#6d5a3a">Card unit price</text>
  <text x="804" y="460" text-anchor="middle" font-size="12.5" fill="#6d5a3a">pennies</text>

  <!-- true cost tall stack -->
  <g>
    <rect x="948" y="322" width="150" height="46" rx="6" fill="#e2b06a"/><text x="1023" y="350" text-anchor="middle" font-size="12.5" font-weight="600" fill="#291c0e">re-encode time</text>
    <rect x="948" y="372" width="150" height="46" rx="6" fill="#cf8f57"/><text x="1023" y="400" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">front-desk delay</text>
    <rect x="948" y="422" width="150" height="46" rx="6" fill="#a94b30"/><text x="1023" y="450" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">lost goodwill</text>
    <rect x="948" y="472" width="150" height="32" rx="6" fill="#8b2d2d"/><text x="1023" y="493" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">public review</text>
  </g>
  <text x="1023" y="524" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">True cost of the failure</text>
  <text x="918" y="238" text-anchor="middle" font-size="13.5" fill="#4f4f4f">The cost far exceeds the card itself.</text>

  <text x="600" y="596" text-anchor="middle" font-size="16.5" fill="#6d5a3a">The card costs pennies. The complaint it triggers does not.</text>
</svg>
