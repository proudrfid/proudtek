<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The coconut-shell RFID wristband value loop, from waste stream to keepsake</title>
<desc id="d">A four-stage loop. One, a discarded coconut shell — an oil-and-water byproduct that would otherwise be burned. Two, it is hand-carved into a bead and an NFC inlay is sealed inside with food-grade epoxy. Three, the finished band taps for payment and access at the event, reading at 2 to 5 centimetres like any plastic band. Four, afterward it is kept as a souvenir rather than binned. Sixty to eighty percent of attendees keep it, versus under ten percent for vinyl, and the NFC chip is recovered either way.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COCONUT-SHELL RFID WRISTBANDS</text>
<text x="600" y="92" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Designed to be kept, not swept up</text>

<!-- card 1 : waste-stream shell -->
<rect x="72" y="210" width="236" height="240" rx="13" fill="#ffffff" stroke="#cfe3d6" stroke-width="1.6"/>
<rect x="72" y="210" width="236" height="7" rx="3.5" fill="#2d6a4f"/>
<circle cx="102" cy="248" r="15" fill="#2d6a4f"/>
<text x="102" y="254" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="190" y="318" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Waste-stream shell</text>
<text x="190" y="342" text-anchor="middle" font-size="12" fill="#5c5c5c">oil &amp; water byproduct</text>
<rect x="94" y="372" width="192" height="34" rx="17" fill="#e9f3ec" stroke="#cfe3d6" stroke-width="1.2"/>
<text x="190" y="394" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1b4332">would be burned</text>

<!-- card 2 : carved bead + NFC -->
<rect x="346" y="210" width="236" height="240" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="346" y="210" width="236" height="7" rx="3.5" fill="#3d6b6b"/>
<circle cx="376" cy="248" r="15" fill="#3d6b6b"/>
<text x="376" y="254" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="464" y="318" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Carved bead + NFC</text>
<text x="464" y="342" text-anchor="middle" font-size="12" fill="#5c5c5c">food-grade epoxy seal</text>
<rect x="368" y="372" width="192" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="464" y="394" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">artisanal, unique</text>

<!-- card 3 : tap at the event -->
<rect x="620" y="210" width="236" height="240" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="620" y="210" width="236" height="7" rx="3.5" fill="#3d6b6b"/>
<circle cx="650" cy="248" r="15" fill="#3d6b6b"/>
<text x="650" y="254" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="738" y="318" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Tap at the event</text>
<text x="738" y="342" text-anchor="middle" font-size="12" fill="#5c5c5c">payment &#183; access &#183; engage</text>
<rect x="642" y="372" width="192" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="738" y="394" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">2-5 cm read range</text>

<!-- card 4 : kept, not binned -->
<rect x="894" y="210" width="236" height="240" rx="13" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="894" y="210" width="236" height="7" rx="3.5" fill="#c39a5f"/>
<circle cx="924" cy="248" r="15" fill="#c39a5f"/>
<text x="924" y="254" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="1012" y="318" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Kept, not binned</text>
<text x="1012" y="342" text-anchor="middle" font-size="12" fill="#6d5a3a">souvenir &#8212; or composted</text>
<rect x="916" y="372" width="192" height="34" rx="17" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="1012" y="394" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8a6d34">60-80% kept</text>

<!-- arrows -->
<line x1="312" y1="330" x2="338" y2="330" stroke="#291c0e" stroke-width="3"/>
<polygon points="338,324 346,330 338,336" fill="#291c0e"/>
<line x1="586" y1="330" x2="612" y2="330" stroke="#291c0e" stroke-width="3"/>
<polygon points="612,324 620,330 612,336" fill="#291c0e"/>
<line x1="860" y1="330" x2="886" y2="330" stroke="#291c0e" stroke-width="3"/>
<polygon points="886,324 894,330 886,336" fill="#291c0e"/>

<text x="600" y="516" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">The band that used to be teardown litter becomes the thing attendees take home.</text>
<text x="600" y="548" text-anchor="middle" font-size="14" fill="#5c5c5c">60-80% keep it as a souvenir, versus under 10% for vinyl &#8212; and the NFC chip is recovered either way.</text>
</svg>
