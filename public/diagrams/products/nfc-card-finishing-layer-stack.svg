<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Finishing layer stack of a custom-printed NFC card</title>
  <desc id="d">Exploded cross-section of a custom-printed NFC card shown as six stacked layers. From top to bottom: an embellishment pass with spot UV and hot foil accents; the protective overlay laminate in gloss, matte or anti-scratch; the CMYK printed front artwork; the white PVC core carrying the antenna coil and chip laminated between inner layers, leaving both faces free for full-bleed print; the printed back artwork where magnetic stripe and signature panel options live; and the back protective laminate. A caption notes that each finish is a separate machine pass, so designs should pick the one or two finishes that carry the design.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FINISHING LAYER STACK</text>
  <text x="600" y="100" text-anchor="middle" font-size="36" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">The physics of a premium card</text>

  <!-- Layer 1: embellishment -->
  <rect x="70" y="150" width="560" height="52" rx="10" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="94" y="182" font-size="15" font-weight="700" fill="#291c0e">Spot UV + hot foil accents</text>
  <rect x="520" y="163" width="66" height="26" rx="6" fill="#d4a755"/>
  <rect x="448" y="167" width="48" height="18" rx="4" fill="none" stroke="#c39a5f" stroke-width="2"/>
  <line x1="630" y1="176" x2="676" y2="176" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="690" y="170" font-size="15" font-weight="700" fill="#6d5a3a">Embellishment pass</text>
  <text x="690" y="190" font-size="13" fill="#5c5c5c">Foil, spot UV, emboss — keep clear of the chip footprint</text>

  <!-- Layer 2: overlay laminate -->
  <rect x="70" y="214" width="560" height="52" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="94" y="246" font-size="15" font-weight="700" fill="#2c5454">Protective overlay laminate</text>
  <line x1="630" y1="240" x2="676" y2="240" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="690" y="234" font-size="15" font-weight="700" fill="#2c5454">Overlay laminate</text>
  <text x="690" y="254" font-size="13" fill="#5c5c5c">Gloss, matte or anti-scratch — extends wallet life</text>

  <!-- Layer 3: front artwork -->
  <rect x="70" y="278" width="560" height="52" rx="10" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
  <text x="94" y="310" font-size="15" font-weight="700" fill="#291c0e">CMYK artwork — front face, full bleed</text>
  <circle cx="510" cy="304" r="8" fill="#3d6b6b"/>
  <circle cx="534" cy="304" r="8" fill="#c39a5f"/>
  <circle cx="558" cy="304" r="8" fill="#4a5568"/>
  <circle cx="582" cy="304" r="8" fill="#291c0e"/>
  <line x1="630" y1="304" x2="676" y2="304" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="690" y="298" font-size="15" font-weight="700" fill="#2c5454">Front artwork</text>
  <text x="690" y="318" font-size="13" fill="#5c5c5c">Offset 175-200 lpi or UV digital 600-1200 dpi</text>

  <!-- Layer 4: PVC core with inlay (taller) -->
  <rect x="70" y="342" width="560" height="84" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2.5"/>
  <text x="94" y="374" font-size="15" font-weight="700" fill="#291c0e">White PVC core</text>
  <text x="94" y="396" font-size="13" fill="#5c5c5c">antenna + chip laminated inside</text>
  <rect x="330" y="356" width="256" height="56" rx="8" fill="none" stroke="#c39a5f" stroke-width="3"/>
  <rect x="342" y="366" width="232" height="36" rx="6" fill="none" stroke="#c39a5f" stroke-width="2"/>
  <rect x="354" y="375" width="208" height="18" rx="4" fill="none" stroke="#e4c98f" stroke-width="1.5"/>
  <rect x="560" y="370" width="22" height="22" rx="3" fill="#291c0e"/>
  <line x1="630" y1="384" x2="676" y2="384" stroke="#4a5568" stroke-width="1.5"/>
  <text x="690" y="368" font-size="15" font-weight="700" fill="#4a5568">The RF heart</text>
  <text x="690" y="388" font-size="13" fill="#5c5c5c">Chip and coil sit between inner layers, so both</text>
  <text x="690" y="406" font-size="13" fill="#5c5c5c">faces stay free for print — no dead zones</text>

  <!-- Layer 5: back artwork -->
  <rect x="70" y="438" width="560" height="52" rx="10" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
  <text x="94" y="470" font-size="15" font-weight="700" fill="#291c0e">CMYK artwork — back face</text>
  <rect x="420" y="452" width="166" height="10" rx="3" fill="#4a5568"/>
  <rect x="420" y="468" width="110" height="8" rx="3" fill="#e6dfd2"/>
  <line x1="630" y1="464" x2="676" y2="464" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="690" y="458" font-size="15" font-weight="700" fill="#2c5454">Back artwork</text>
  <text x="690" y="478" font-size="13" fill="#5c5c5c">Magstripe (HiCo / LoCo) and signature panel live here</text>

  <!-- Layer 6: back laminate -->
  <rect x="70" y="502" width="560" height="52" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="94" y="534" font-size="15" font-weight="700" fill="#2c5454">Protective laminate — back</text>
  <line x1="630" y1="528" x2="676" y2="528" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="690" y="522" font-size="15" font-weight="700" fill="#2c5454">Base laminate</text>
  <text x="690" y="542" font-size="13" fill="#5c5c5c">Same protection for the wallet side</text>

  <line x1="70" y1="586" x2="1130" y2="586" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="622" text-anchor="middle" font-size="14" fill="#4f4f4f">Each finish is a separate machine pass — pick the one or two that carry the design.</text>
</svg>
