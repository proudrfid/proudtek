<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Production vehicle-RFID systems benchmarked by scale and platform</title>
<desc id="d">Five rows. EZ-Pass: about 30 million transponders, TransCore eGo Plus at 915 MHz across 18 states since 1993. FasTrak: about 6 million transponders on Title 21, migrating to eGo Plus for interoperability. ParkMobile and ParkPlus: parking gates with 3 to 5 meter range, UHF Gen2 windshield tags and app payment. Cintas fleet: 10,000-plus vehicles with UHF windshield tags and depot readers. Toyota and Tesla dealer lots: 1,000-plus vehicles read beyond 12 meters, whole-lot scan in 30 to 60 minutes.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">IN PRODUCTION AT SCALE</text>
<text x="600" y="86" text-anchor="middle" font-size="15" fill="#4f4f4f">The mature systems that set the chip, antenna and adhesive bar.</text>
<!-- row 1 EZ-Pass -->
<rect x="60" y="150" width="1080" height="84" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="60" y="150" width="6" height="84" rx="3" fill="#4a5568"/>
<text x="92" y="184" text-anchor="start" font-size="17" font-weight="800" fill="#291c0e">EZ-Pass</text>
<text x="92" y="210" text-anchor="start" font-size="13" fill="#5c5c5c">US Northeast · multi-state</text>
<text x="512" y="190" text-anchor="middle" font-size="23" font-weight="800" fill="#3a4557">~30M</text>
<text x="512" y="213" text-anchor="middle" font-size="12" fill="#8a8272">transponders</text>
<line x1="612" y1="168" x2="612" y2="216" stroke="#ece5d6" stroke-width="1.5"/>
<text x="636" y="184" text-anchor="start" font-size="14" font-weight="600" fill="#291c0e">TransCore eGo Plus · 915 MHz</text>
<text x="636" y="210" text-anchor="start" font-size="13" fill="#5c5c5c">18 states · dominant since 1993</text>
<!-- row 2 FasTrak -->
<rect x="60" y="244" width="1080" height="84" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="60" y="244" width="6" height="84" rx="3" fill="#4a5568"/>
<text x="92" y="278" text-anchor="start" font-size="17" font-weight="800" fill="#291c0e">FasTrak</text>
<text x="92" y="304" text-anchor="start" font-size="13" fill="#5c5c5c">California, Washington</text>
<text x="512" y="284" text-anchor="middle" font-size="23" font-weight="800" fill="#3a4557">~6M</text>
<text x="512" y="307" text-anchor="middle" font-size="12" fill="#8a8272">transponders</text>
<line x1="612" y1="262" x2="612" y2="310" stroke="#ece5d6" stroke-width="1.5"/>
<text x="636" y="278" text-anchor="start" font-size="14" font-weight="600" fill="#291c0e">FasTrak Flex · Title 21 protocol</text>
<text x="636" y="304" text-anchor="start" font-size="13" fill="#5c5c5c">migrating to eGo Plus for IAG</text>
<!-- row 3 ParkMobile -->
<rect x="60" y="338" width="1080" height="84" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="60" y="338" width="6" height="84" rx="3" fill="#3d6b6b"/>
<text x="92" y="372" text-anchor="start" font-size="17" font-weight="800" fill="#291c0e">ParkMobile · ParkPlus</text>
<text x="92" y="398" text-anchor="start" font-size="13" fill="#5c5c5c">parking access platforms</text>
<text x="512" y="378" text-anchor="middle" font-size="23" font-weight="800" fill="#2c5454">3-5 m</text>
<text x="512" y="401" text-anchor="middle" font-size="12" fill="#8a8272">gate range</text>
<line x1="612" y1="356" x2="612" y2="404" stroke="#ece5d6" stroke-width="1.5"/>
<text x="636" y="372" text-anchor="start" font-size="14" font-weight="600" fill="#291c0e">UHF Gen2 windshield tags</text>
<text x="636" y="398" text-anchor="start" font-size="13" fill="#5c5c5c">integrated with app payment</text>
<!-- row 4 Cintas -->
<rect x="60" y="432" width="1080" height="84" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="60" y="432" width="6" height="84" rx="3" fill="#3d6b6b"/>
<text x="92" y="466" text-anchor="start" font-size="17" font-weight="800" fill="#291c0e">Cintas fleet</text>
<text x="92" y="492" text-anchor="start" font-size="13" fill="#5c5c5c">commercial delivery fleet</text>
<text x="512" y="472" text-anchor="middle" font-size="23" font-weight="800" fill="#2c5454">10,000+</text>
<text x="512" y="495" text-anchor="middle" font-size="12" fill="#8a8272">vans / trucks</text>
<line x1="612" y1="450" x2="612" y2="498" stroke="#ece5d6" stroke-width="1.5"/>
<text x="636" y="466" text-anchor="start" font-size="14" font-weight="600" fill="#291c0e">UHF windshield + depot-gate readers</text>
<text x="636" y="492" text-anchor="start" font-size="13" fill="#5c5c5c">driver-credential cross-check</text>
<!-- row 5 dealer lots -->
<rect x="60" y="526" width="1080" height="84" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="60" y="526" width="6" height="84" rx="3" fill="#c39a5f"/>
<text x="92" y="560" text-anchor="start" font-size="17" font-weight="800" fill="#291c0e">Toyota · Tesla dealer lots</text>
<text x="92" y="586" text-anchor="start" font-size="13" fill="#5c5c5c">whole-lot inventory tracking</text>
<text x="512" y="566" text-anchor="middle" font-size="23" font-weight="800" fill="#6d5a3a">1,000+</text>
<text x="512" y="589" text-anchor="middle" font-size="12" fill="#8a8272">vehicles / lot</text>
<line x1="612" y1="544" x2="612" y2="592" stroke="#ece5d6" stroke-width="1.5"/>
<text x="636" y="560" text-anchor="start" font-size="14" font-weight="600" fill="#291c0e">read beyond 12 m · handheld or drone</text>
<text x="636" y="586" text-anchor="start" font-size="13" fill="#5c5c5c">whole-lot scan in 30-60 minutes</text>
</svg>
