<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Shenzhen to Africa — lanes, bands and landed cost</title>
  <desc id="d">Freight from Shenzhen to African markets: express air via DHL or FedEx reaches African capital cities in 5-10 business days; sea freight serves bulk orders to the major ports of Lagos, Mombasa, Dar es Salaam, Tema and Durban. RFID cards and inlays classify under HS 8523.52; import duty and VAT are set by the destination country, so they are quoted per country, with DDP offered where the lane allows and CIF or DAP otherwise. UHF inlays are tuned to the destination band (865-868 MHz for most of the continent, 915.4-919 MHz for South Africa); HF cards at 13.56 MHz are global.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SHENZHEN &#8594; AFRICA &#8212; LANES, BANDS AND LANDED COST</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Air to capitals in 5-10 business days; sea to major ports; UHF tuned per destination country</text>

  <rect x="70" y="198" width="182" height="92" rx="12" fill="#4a5568"/>
  <text x="161" y="234" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">SHENZHEN</text>
  <text x="161" y="258" text-anchor="middle" font-size="12.5" fill="#dfe4ea">one production line,</text>
  <text x="161" y="276" text-anchor="middle" font-size="12.5" fill="#dfe4ea">band-tuned per country</text>

  <line x1="252" y1="220" x2="474" y2="220" stroke="#3d6b6b" stroke-width="3"/>
  <polygon points="474,220 460,214 460,226" fill="#3d6b6b"/>
  <text x="363" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#3d6b6b">Air &#183; DHL / FedEx &#183; 5-10 days</text>
  <line x1="252" y1="268" x2="474" y2="268" stroke="#8a6d3b" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="474,268 460,262 460,274" fill="#8a6d3b"/>
  <text x="363" y="290" text-anchor="middle" font-size="13" fill="#8a6d3b">Sea &#183; bulk to major ports</text>

  <rect x="484" y="150" width="268" height="196" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="618" y="180" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">AFRICAN MARKETS</text>
  <text x="618" y="208" text-anchor="middle" font-size="13.5" fill="#291c0e">Capitals &#8212; express air freight</text>
  <text x="618" y="234" text-anchor="middle" font-size="13.5" fill="#291c0e">Ports &#8212; sea freight for bulk:</text>
  <text x="618" y="256" text-anchor="middle" font-size="13" fill="#5c5c5c">Lagos &#183; Mombasa &#183; Durban</text>
  <text x="618" y="276" text-anchor="middle" font-size="13" fill="#5c5c5c">Dar es Salaam &#183; Tema</text>
  <text x="618" y="312" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Free sample kits ship first,</text>
  <text x="618" y="330" text-anchor="middle" font-size="12.5" fill="#5c5c5c">UHF tuned to your band</text>

  <rect x="762" y="150" width="368" height="196" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="782" y="182" font-size="15" font-weight="800" letter-spacing="0.3" fill="#6d5a3a">AT IMPORT &amp; ON THE PO</text>
  <text x="782" y="212" font-size="13.5" fill="#291c0e">Classification &#8212; HS 8523.52 &#8220;smart cards&#8221;</text>
  <text x="782" y="240" font-size="13.5" fill="#291c0e">Duty + VAT &#8212; set by destination country</text>
  <text x="782" y="268" font-size="13.5" fill="#291c0e">Incoterms &#8212; DDP per lane; else CIF / DAP</text>
  <text x="782" y="296" font-size="13.5" fill="#291c0e">Band &#8212; UHF per country; HF 13.56 MHz global</text>
  <text x="782" y="320" font-size="12.5" fill="#5c5c5c">865-868 / 915.4-919 MHz &#8212; tuned per country</text>

  <rect x="70" y="400" width="1060" height="88" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="92" y="430" font-size="15" font-weight="700" fill="#2c5454">No single African duty rate &#8212; or band</text>
  <text x="92" y="453" font-size="13.5" fill="#3d6b6b">Duty and VAT are set by the destination country and its trade regime; we quote them per country and offer DDP where we can settle them.</text>
  <text x="92" y="473" font-size="13.5" fill="#5c5c5c">Free sample kits ship first &#8212; UHF samples tuned to your country&#8217;s band so the read test reflects real field conditions.</text>

  <text x="600" y="536" text-anchor="middle" font-size="12.5" fill="#9aa4b2">Transit, duty and band vary by country; confirm exact lead time, Incoterm and UHF band on your quote.</text>
</svg>
