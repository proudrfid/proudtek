<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five-step conference RFID badge rollout, in the order the show clock forces</title>
<desc id="d">Five sequential steps. One, encode early: badge ID and session permissions loaded five to seven days out. Two, readers doubled: a primary and backup at every gate and door, buffering offline. Three, reissue desk: a USB encoder and fast reissue flow for the two to five percent who lose a badge. Four, test the day before: walk each room with five test badges. Five, exhibitor dashboard: deliver leads self-serve in under thirty minutes.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE-STEP ROLLOUT</text>
<text x="600" y="86" text-anchor="middle" font-size="15" fill="#4f4f4f">Most of the pain is front-loaded — the show clock forces this order.</text>
<line x1="164" y1="232" x2="1036" y2="232" stroke="#d9cdb6" stroke-width="3"/>
<!-- step 1 -->
<rect x="70" y="168" width="188" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<circle cx="164" cy="232" r="30" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
<text x="164" y="241" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">1</text>
<text x="164" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Encode early</text>
<text x="164" y="330" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Badge ID + session</text>
<text x="164" y="350" text-anchor="middle" font-size="13.5" fill="#5c5c5c">permissions loaded</text>
<rect x="86" y="386" width="156" height="30" rx="15" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="164" y="406" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">5–7 days out</text>
<!-- step 2 -->
<rect x="288" y="168" width="188" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<circle cx="382" cy="232" r="30" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
<text x="382" y="241" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">2</text>
<text x="382" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Readers, doubled</text>
<text x="382" y="330" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Primary + backup at</text>
<text x="382" y="350" text-anchor="middle" font-size="13.5" fill="#5c5c5c">every gate and door</text>
<rect x="304" y="386" width="156" height="30" rx="15" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="382" y="406" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">buffer offline</text>
<!-- step 3 -->
<rect x="506" y="168" width="188" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<circle cx="600" cy="232" r="30" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
<text x="600" y="241" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">3</text>
<text x="600" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Reissue desk</text>
<text x="600" y="330" text-anchor="middle" font-size="13.5" fill="#5c5c5c">USB encoder + a</text>
<text x="600" y="350" text-anchor="middle" font-size="13.5" fill="#5c5c5c">30-second reissue</text>
<rect x="522" y="386" width="156" height="30" rx="15" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="600" y="406" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">2–5% lose badges</text>
<!-- step 4 -->
<rect x="724" y="168" width="188" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<circle cx="818" cy="232" r="30" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
<text x="818" y="241" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">4</text>
<text x="818" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Test day before</text>
<text x="818" y="330" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Walk each room with</text>
<text x="818" y="350" text-anchor="middle" font-size="13.5" fill="#5c5c5c">5 test badges</text>
<rect x="740" y="386" width="156" height="30" rx="15" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="818" y="406" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">fixes get hard</text>
<!-- step 5 -->
<rect x="942" y="168" width="188" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<circle cx="1036" cy="232" r="30" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
<text x="1036" y="241" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">5</text>
<text x="1036" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Exhibitor dashboard</text>
<text x="1036" y="330" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Deliver leads fast,</text>
<text x="1036" y="350" text-anchor="middle" font-size="13.5" fill="#5c5c5c">self-serve access</text>
<rect x="958" y="386" width="156" height="30" rx="15" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="1036" y="406" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">under 30 minutes</text>
<text x="600" y="512" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Skip a step and it shows on day one — as a badge failure at the gate or an exhibitor with no leads.</text>
</svg>
