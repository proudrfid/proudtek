<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Chip selection for event wristbands: match the chip to the job</title>
<desc id="d">Four RFID chip options for event wristbands, each mapped to its job. Phone interaction and social: NTAG213, HF NFC, 144 bytes, phone-readable, 3-5 cm tap range, for attendees tapping the band on a phone for social sharing, contacts or the event app. Access control default: MIFARE Ultralight EV1, HF, 80 bytes total with about 48 user-accessible, fast anti-collision, the most common event access chip. Vehicles, VIP lanes and zones: Monza R6, UHF, 1-4 metres on-body with portal readers, long-range bulk scanning with body absorption trimming range. Cashless and multi-application: DESFire EV2 and EV3, HF, AES-128 encryption and a multi-application file system, required when payments, hotel room access or transit share one wristband. The override rule underneath: the platform provider — Glownet, PlayPass or Tappit — specifies chip and encoding; confirm before ordering stock.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CHIP SELECTION · MATCH THE CHIP TO THE JOB</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Four chips, four different wristbands</text>

<!-- NTAG213 -->
<rect x="64" y="126" width="520" height="176" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<rect x="512" y="150" width="44" height="34" rx="6" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<rect x="524" y="159" width="20" height="16" rx="2" fill="#3d6b6b"/>
<text x="90" y="158" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">PHONE INTERACTION &amp; SOCIAL</text>
<text x="90" y="190" font-size="20" font-weight="800" fill="#291c0e">NTAG213 (HF/NFC)</text>
<text x="90" y="222" font-size="15.5" font-weight="700" fill="#2c5454">144 bytes · phone-readable · 3-5 cm tap range</text>
<text x="90" y="248" font-size="13.5" fill="#4f4f4f">attendees tap the band on their phone for social</text>
<text x="90" y="270" font-size="13.5" fill="#4f4f4f">sharing, contact exchange or the event app</text>

<!-- Ultralight EV1 -->
<rect x="616" y="126" width="520" height="176" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<rect x="1064" y="150" width="44" height="34" rx="6" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.5"/>
<rect x="1076" y="159" width="20" height="16" rx="2" fill="#c39a5f"/>
<text x="642" y="158" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">ACCESS CONTROL DEFAULT</text>
<text x="642" y="190" font-size="20" font-weight="800" fill="#291c0e">MIFARE Ultralight EV1 (HF)</text>
<text x="642" y="222" font-size="15.5" font-weight="700" fill="#6d5a3a">80 bytes total (~48 user) · fast anti-collision</text>
<text x="642" y="248" font-size="13.5" fill="#4f4f4f">the most common event access chip — low cost,</text>
<text x="642" y="270" font-size="13.5" fill="#4f4f4f">fast reads, supported by all major platforms</text>

<!-- Monza R6 -->
<rect x="64" y="318" width="520" height="176" rx="14" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<rect x="512" y="342" width="44" height="34" rx="6" fill="#f4f6f9" stroke="#4a5568" stroke-width="1.5"/>
<rect x="524" y="351" width="20" height="16" rx="2" fill="#4a5568"/>
<text x="90" y="350" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">VEHICLES, VIP LANES &amp; ZONES</text>
<text x="90" y="382" font-size="20" font-weight="800" fill="#291c0e">Monza R6 (UHF)</text>
<text x="90" y="414" font-size="15.5" font-weight="700" fill="#4a5568">1-4 metres on-body with fixed portal readers</text>
<text x="90" y="440" font-size="13.5" fill="#4f4f4f">long-range bulk scanning for vehicle access;</text>
<text x="90" y="462" font-size="13.5" fill="#4f4f4f">body absorption trims range on the wrist</text>

<!-- DESFire -->
<rect x="616" y="318" width="520" height="176" rx="14" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
<rect x="1064" y="342" width="44" height="34" rx="6" fill="#e8f2ec" stroke="#2d6a4f" stroke-width="1.5"/>
<rect x="1076" y="351" width="20" height="16" rx="2" fill="#2d6a4f"/>
<text x="642" y="350" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">CASHLESS &amp; MULTI-APPLICATION</text>
<text x="642" y="382" font-size="20" font-weight="800" fill="#291c0e">DESFire EV2/EV3 (HF)</text>
<text x="642" y="414" font-size="15.5" font-weight="700" fill="#2d6a4f">AES-128 encryption · multi-application files</text>
<text x="642" y="440" font-size="13.5" fill="#4f4f4f">required when payments, hotel room access or</text>
<text x="642" y="462" font-size="13.5" fill="#4f4f4f">transit ticketing share the same wristband</text>

<!-- override rule -->
<rect x="64" y="522" width="1072" height="88" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="556" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE OVERRIDE RULE</text>
<text x="600" y="586" text-anchor="middle" font-size="15" fill="#291c0e">Your platform — Glownet, PlayPass or Tappit — specifies the chip and encoding. Confirm before ordering stock.</text>
</svg>
