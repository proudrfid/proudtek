<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Cross-section anatomy of an RFID coin keyfob</title>
  <desc id="d">A cutaway of a round RFID coin keyfob, labelled with leader lines: the moulded ABS or two-part epoxy housing; an IP67 seal to IEC 60529; a many-turn copper HF coil tuned to 13.56 MHz; the secure die carrying MIFARE DESFire EV2 / EV3 with AES-128; the 2.5 mm keyring lug; and the Ø 25 / 30 mm, 3-4 mm-thick disc body.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANATOMY OF A STORED-VALUE COIN KEYFOB</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">A copper coil and a secure die, potted under a moulded disc</text>

  <!-- coin body -->
  <circle cx="600" cy="398" r="152" fill="#f7edd6" stroke="#e4c98f" stroke-width="3"/>
  <circle cx="600" cy="398" r="136" fill="none" stroke="#3d6b6b" stroke-width="3"/>
  <!-- coil turns -->
  <circle cx="600" cy="398" r="116" fill="none" stroke="#c39a5f" stroke-width="4"/>
  <circle cx="600" cy="398" r="100" fill="none" stroke="#c39a5f" stroke-width="3"/>
  <circle cx="600" cy="398" r="84" fill="none" stroke="#c39a5f" stroke-width="3"/>
  <!-- secure die -->
  <rect x="572" y="372" width="56" height="52" rx="6" fill="#4a5568" stroke="#2f394a" stroke-width="2"/>
  <text x="600" y="403" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">die</text>
  <!-- keyring lug -->
  <rect x="584" y="230" width="32" height="28" rx="8" fill="#f7edd6" stroke="#e4c98f" stroke-width="3"/>
  <circle cx="600" cy="214" r="34" fill="#f1e6cd" stroke="#c39a5f" stroke-width="3"/>
  <circle cx="600" cy="214" r="15" fill="#ffffff" stroke="#4a5568" stroke-width="6"/>

  <!-- left labels (steel) -->
  <text x="86" y="258" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">HOUSING</text>
  <text x="86" y="279" font-size="13.5" fill="#5c5c5c">ABS or two-part epoxy dome</text>
  <line x1="468" y1="326" x2="330" y2="270" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="86" y="398" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">IP67 SEAL</text>
  <text x="86" y="419" font-size="13.5" fill="#5c5c5c">IEC 60529 — laundry + car-wash spray</text>
  <line x1="464" y1="398" x2="330" y2="400" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="86" y="520" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">HF COIL ANTENNA</text>
  <text x="86" y="541" font-size="13.5" fill="#5c5c5c">many-turn copper, tuned 13.56 MHz</text>
  <line x1="515" y1="468" x2="330" y2="520" stroke="#b9c0cc" stroke-width="1.5"/>

  <!-- right labels (teal) -->
  <text x="872" y="238" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">KEYRING LUG</text>
  <text x="872" y="259" font-size="13.5" fill="#5c5c5c">2.5 mm hole — pocket or keychain</text>
  <line x1="634" y1="210" x2="864" y2="242" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="872" y="372" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">SECURE DIE</text>
  <text x="872" y="393" font-size="13.5" fill="#5c5c5c">MIFARE DESFire EV2 / EV3 · AES-128</text>
  <line x1="630" y1="398" x2="864" y2="378" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="872" y="508" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">DISC DIAMETER</text>
  <text x="872" y="529" font-size="13.5" fill="#5c5c5c">Ø 25 / 30 mm · 3-4 mm thick</text>
  <line x1="700" y1="505" x2="864" y2="512" stroke="#b9c0cc" stroke-width="1.5"/>

  <!-- footnote -->
  <text x="600" y="628" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Sealed to IP67 (IEC 60529) — no seam and no adhesive layer; the moulded housing is the seal.</text>
</svg>
