<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="hsTitle hsDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="hsTitle">Hospitality on RFID, mapped across the guest journey</title>
  <desc id="hsDesc">A guest-journey map. Three stages, one per RFID product line: check-in uses the key card to open the door; pool, spa and food-and-beverage use the wristband to tap for access and cashless payment; back-of-house counts linen tags through the wash. Below, the credential tiers shipped — MIFARE Classic 1K, MIFARE Plus SE, MIFARE DESFire EV3 and NTAG 424 DNA, each matched to the installed lock. A dark footer states what RFID delivers here: 85 to 95 percent fewer key-card re-issues, 15 to 30 percent higher cashless spend, cash reconciliation from 90 to 8 minutes, and 20 to 40 percent less linen loss.</desc>

  <defs>
    <radialGradient id="hsGlow" cx="50%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="hsDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#291c0e"/>
      <stop offset="100%" stop-color="#6c5127"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#hsGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="66" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2.5" fill="#6d5a3a">HOSPITALITY ON RFID, MAPPED</text>
  <text x="600" y="90" text-anchor="middle" font-size="13.5" fill="#a0895f">One supplier for the card, the wristband and the linen tag — verified against your locks</text>

  <!-- ===================== Guest journey ===================== -->
  <text x="72" y="124" font-size="14" font-weight="700" letter-spacing="1.5" fill="#6c5127">THE GUEST JOURNEY, ON RFID</text>
  <line x1="366" y1="119" x2="1128" y2="119" stroke="#e5e9ed" stroke-width="2"/>

  <!-- Card 1: Key card -->
  <g>
    <rect x="72" y="140" width="332" height="168" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="238" y="170" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#a0895f">1 · CHECK-IN</text>
    <circle cx="238" cy="206" r="30" fill="#6c5127"/>
    <rect x="220" y="193" width="36" height="26" rx="4" fill="#ffffff"/>
    <rect x="226" y="200" width="11" height="9" rx="1.5" fill="#c39a5f"/>
    <path d="M247 197 a11 11 0 0 1 0 17" fill="none" stroke="#1fcefb" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M252 193 a17 17 0 0 1 0 25" fill="none" stroke="#1fcefb" stroke-width="2.4" stroke-linecap="round"/>
    <text x="238" y="270" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Key card</text>
    <text x="238" y="293" text-anchor="middle" font-size="13" fill="#6d5a3a">opens the door</text>
  </g>

  <!-- Card 2: Wristband -->
  <g>
    <rect x="434" y="140" width="332" height="168" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="600" y="170" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#a0895f">2 · POOL · SPA · F&amp;B</text>
    <circle cx="600" cy="206" r="30" fill="#6c5127"/>
    <ellipse cx="600" cy="206" rx="15" ry="20" fill="none" stroke="#ffffff" stroke-width="5"/>
    <rect x="593" y="216" width="14" height="11" rx="2" fill="#c39a5f"/>
    <path d="M617 197 a13 13 0 0 1 0 18" fill="none" stroke="#1fcefb" stroke-width="2.4" stroke-linecap="round"/>
    <text x="600" y="270" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Wristband</text>
    <text x="600" y="293" text-anchor="middle" font-size="13" fill="#6d5a3a">taps to enter &amp; pay</text>
  </g>

  <!-- Card 3: Linen tag -->
  <g>
    <rect x="796" y="140" width="332" height="168" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="962" y="170" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#a0895f">3 · BACK-OF-HOUSE</text>
    <circle cx="962" cy="206" r="30" fill="#6c5127"/>
    <rect x="946" y="195" width="32" height="6" rx="2" fill="#ffffff"/>
    <rect x="946" y="205" width="32" height="6" rx="2" fill="#ffffff"/>
    <rect x="946" y="215" width="32" height="6" rx="2" fill="#ffffff"/>
    <path d="M984 197 a13 13 0 0 1 0 18" fill="none" stroke="#1fcefb" stroke-width="2.4" stroke-linecap="round"/>
    <text x="962" y="270" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Linen tag</text>
    <text x="962" y="293" text-anchor="middle" font-size="13" fill="#6d5a3a">counted through the wash</text>
  </g>

  <!-- journey arrows (left → right) -->
  <path d="M406 219 h14 v-6 l14 11 -14 11 v-6 h-14 z" fill="#c39a5f"/>
  <path d="M768 219 h14 v-6 l14 11 -14 11 v-6 h-14 z" fill="#c39a5f"/>

  <!-- ===================== Credential tiers ===================== -->
  <text x="72" y="352" font-size="14" font-weight="700" letter-spacing="1.5" fill="#6c5127">CREDENTIAL TIERS WE SHIP</text>
  <line x1="330" y1="347" x2="1128" y2="347" stroke="#e5e9ed" stroke-width="2"/>

  <g font-size="15" font-weight="700" fill="#291c0e" text-anchor="middle">
    <rect x="72" y="368" width="196" height="40" rx="20" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="170" y="393">MIFARE Classic 1K</text>
    <rect x="284" y="368" width="150" height="40" rx="20" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="359" y="393">MIFARE Plus SE</text>
    <rect x="450" y="368" width="212" height="40" rx="20" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="556" y="393">MIFARE DESFire EV3</text>
    <rect x="678" y="368" width="184" height="40" rx="20" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="770" y="393">NTAG 424 DNA</text>
  </g>
  <text x="886" y="393" font-size="13" fill="#6d5a3a">each matched to your installed lock</text>

  <!-- ===================== Outcomes footer ===================== -->
  <rect x="72" y="440" width="1056" height="158" rx="16" fill="url(#hsDark)"/>
  <text x="600" y="476" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#d4a755">WHAT RFID DELIVERS HERE</text>
  <g text-anchor="middle">
    <text x="204" y="528" font-size="25" font-weight="800" fill="#ffffff">−85–95%</text>
    <text x="204" y="556" font-size="13" fill="#cbb489">key-card re-issue</text>
    <text x="468" y="528" font-size="25" font-weight="800" fill="#ffffff">+15–30%</text>
    <text x="468" y="556" font-size="13" fill="#cbb489">cashless per-cap spend</text>
    <text x="732" y="528" font-size="25" font-weight="800" fill="#ffffff">90→8 min</text>
    <text x="732" y="556" font-size="13" fill="#cbb489">cash reconciliation</text>
    <text x="996" y="528" font-size="25" font-weight="800" fill="#ffffff">−20–40%</text>
    <text x="996" y="556" font-size="13" fill="#cbb489">linen loss / theft</text>
  </g>

  <text x="600" y="632" text-anchor="middle" font-size="14.5" fill="#6d5a3a">Send us the lock model — we verify the chip on a lab-side read before we quote.</text>
</svg>
