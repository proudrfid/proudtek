<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Sewn-in and riveted leather-patch construction of an NFC luxury handbag tag</title>
  <desc id="d">Left: a handbag lining panel with a leather NFC patch stitched and riveted into the seam, where extraction breaks the antenna. Centre: the layer stack — leather patch face with embossed logo, an antenna coil with the NTAG 424 DNA die at 13.56 MHz with AES-128 SUN, a PET substrate with polyurethane encapsulant, and a stitch or rivet anchor that breaks on removal. Right: an anti-transplant panel noting the UID is bound to the bag serial, sewn-in tags self-destruct, heat-sealed leather tears, and a monotonic counter stops replay. Bottom: four factory-integrated form factors — woven fabric label 40 by 20 mm, thin PET inlay 25 by 15 mm, embedded leather logo patch, and NFC inside a metal hardware plate. Woven-label variants are ISO 6330 60 C wash and ISO 3175 dry-clean qualified.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SEWN IN, RIVETED DOWN, DESTROYED ON REMOVAL</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">A durable NFC inlay inside a leather patch, anchored into the lining seam — pulling it out breaks the antenna</text>

  <!-- left: lining + patch -->
  <text x="230" y="176" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.4" fill="#6d5a3a">LINING SEAM</text>
  <rect x="130" y="188" width="200" height="164" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <rect x="170" y="222" width="120" height="86" rx="10" fill="#c39a5f" stroke="#6d5a3a" stroke-width="2"/>
  <rect x="178" y="230" width="104" height="70" rx="7" fill="none" stroke="#6d5a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="230" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Leather</text>
  <text x="230" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">NFC patch</text>
  <circle cx="184" cy="236" r="4" fill="#291c0e"/>
  <circle cx="276" cy="236" r="4" fill="#291c0e"/>
  <circle cx="184" cy="294" r="4" fill="#291c0e"/>
  <circle cx="276" cy="294" r="4" fill="#291c0e"/>
  <text x="230" y="374" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Stitched and riveted into the seam</text>
  <text x="230" y="392" text-anchor="middle" font-size="12.5" fill="#8b2d2d">Extraction breaks the antenna</text>

  <!-- centre: layer stack -->
  <text x="635" y="150" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">THE LEATHER-PATCH STACK</text>
  <rect x="460" y="170" width="350" height="42" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="478" y="196" font-size="13.5" fill="#291c0e">Leather patch face — embossed logo</text>
  <rect x="460" y="218" width="350" height="54" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="478" y="240" font-size="13.5" fill="#291c0e">Antenna coil + NTAG 424 DNA die</text>
  <text x="478" y="259" font-size="12" fill="#5c5c5c">13.56 MHz · AES-128 SUN</text>
  <rect x="460" y="278" width="350" height="42" rx="6" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <text x="478" y="304" font-size="13.5" fill="#291c0e">PET substrate + PU encapsulant</text>
  <rect x="460" y="326" width="350" height="42" rx="6" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="2"/>
  <text x="478" y="352" font-size="13.5" fill="#8b2d2d">Stitch / rivet anchor — breaks on removal</text>

  <!-- right: anti-transplant -->
  <rect x="850" y="170" width="280" height="198" rx="12" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <text x="870" y="200" font-size="14" font-weight="800" letter-spacing="0.3" fill="#4a5568">WHY IT CAN'T TRANSPLANT</text>
  <text x="870" y="234" font-size="13" fill="#291c0e">UID bound to the bag serial</text>
  <text x="870" y="262" font-size="13" fill="#291c0e">Sewn-in tag self-destructs</text>
  <text x="870" y="290" font-size="13" fill="#291c0e">Heat-sealed leather tears</text>
  <text x="870" y="318" font-size="13" fill="#291c0e">Monotonic counter stops replay</text>
  <text x="870" y="348" font-size="12.5" fill="#5c5c5c">Same defense on every variant</text>

  <!-- bottom: form factors -->
  <text x="600" y="418" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FOUR FACTORY-INTEGRATED FORM FACTORS</text>
  <rect x="64" y="438" width="250" height="86" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="84" y="468" font-size="15" font-weight="700" fill="#291c0e">Woven fabric label</text>
  <text x="84" y="490" font-size="12.5" fill="#5c5c5c">40 × 20 mm</text>
  <text x="84" y="510" font-size="12.5" fill="#3d6b6b">sewn into lining seam</text>
  <rect x="338" y="438" width="250" height="86" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="358" y="468" font-size="15" font-weight="700" fill="#291c0e">Thin PET inlay</text>
  <text x="358" y="490" font-size="12.5" fill="#5c5c5c">25 × 15 mm</text>
  <text x="358" y="510" font-size="12.5" fill="#3d6b6b">under a leather patch</text>
  <rect x="612" y="438" width="250" height="86" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="632" y="468" font-size="15" font-weight="700" fill="#291c0e">Leather logo patch</text>
  <text x="632" y="490" font-size="12.5" fill="#5c5c5c">heat-sealed</text>
  <text x="632" y="510" font-size="12.5" fill="#3d6b6b">outlasts the bag</text>
  <rect x="886" y="438" width="250" height="86" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="906" y="468" font-size="15" font-weight="700" fill="#291c0e">Metal hardware plate</text>
  <text x="906" y="490" font-size="12.5" fill="#5c5c5c">NFC inside metal</text>
  <text x="906" y="510" font-size="12.5" fill="#3d6b6b">fully hidden</text>

  <text x="600" y="562" text-anchor="middle" font-size="13" fill="#5c5c5c">ISO 6330 60 °C wash and ISO 3175 dry-clean qualified · Martindale 20,000+ rubs · 200,000 write cycles, 50-year retention.</text>
</svg>
