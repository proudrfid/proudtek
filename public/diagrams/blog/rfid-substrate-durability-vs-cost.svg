<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Sustainable RFID substrates plotted by durability against cost premium versus PVC</title>
<desc id="d">A scatter map placing five substrates on two axes: durability left to right, and cost versus standard PVC bottom to top. Paper sits bottom-left: fragile and single-use but cheaper than PVC. Wood veneer sits top-left: fragile but a 40 to 60 percent premium. Bio-based PLA sits mid-map: moderate durability, a 20 to 30 percent premium, compostable. Recycled PVC sits lower-right: durable, only a 5 to 15 percent premium. Recycled PET sits far right: the toughest, a 10 to 20 percent premium. Recycled PVC and PET occupy the value corner; wood is premium and fragile; paper is cheap and disposable by design.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MATCH MATERIAL TO CARD LIFESPAN</text>
<text x="600" y="96" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Durability vs. cost: where each substrate lands</text>

<!-- Axes -->
<line x1="220" y1="130" x2="220" y2="520" stroke="#cbb89a" stroke-width="1.6"/>
<line x1="220" y1="520" x2="1090" y2="520" stroke="#cbb89a" stroke-width="1.6"/>
<line x1="220" y1="330" x2="1090" y2="330" stroke="#efe7d6" stroke-width="1.2"/>

<!-- Y guide labels (cost vs PVC) -->
<text x="206" y="150" text-anchor="end" font-size="12.5" fill="#8a7a5c">+60%</text>
<text x="206" y="334" text-anchor="end" font-size="12.5" fill="#8a7a5c">+20%</text>
<text x="206" y="516" text-anchor="end" font-size="12.5" fill="#8a7a5c">&#8722;20%</text>
<text x="150" y="120" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d5a3a">COST vs PVC &#8593;</text>

<!-- X guide labels (durability) -->
<text x="300" y="546" text-anchor="middle" font-size="12.5" fill="#8a7a5c">fragile / single-use</text>
<text x="1000" y="546" text-anchor="middle" font-size="12.5" fill="#8a7a5c">most durable</text>
<text x="655" y="574" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">DURABILITY &#8594;</text>

<!-- Paper -->
<circle cx="338" cy="496" r="12" fill="#6d5a3a" stroke="#ffffff" stroke-width="2"/>
<text x="356" y="492" text-anchor="start" font-size="14" font-weight="700" fill="#291c0e">Paper</text>
<text x="356" y="510" text-anchor="start" font-size="12" fill="#5c5c5c">cheap, single-use</text>

<!-- Wood veneer -->
<circle cx="388" cy="187" r="12" fill="#1b4332" stroke="#ffffff" stroke-width="2"/>
<text x="406" y="183" text-anchor="start" font-size="14" font-weight="700" fill="#291c0e">Wood veneer</text>
<text x="406" y="201" text-anchor="start" font-size="12" fill="#5c5c5c">premium, fragile</text>

<!-- Bio-based PLA -->
<circle cx="650" cy="306" r="12" fill="#2d6a4f" stroke="#ffffff" stroke-width="2"/>
<text x="668" y="302" text-anchor="start" font-size="14" font-weight="700" fill="#291c0e">Bio-based PLA</text>
<text x="668" y="320" text-anchor="start" font-size="12" fill="#5c5c5c">compostable</text>

<!-- Recycled PVC -->
<circle cx="912" cy="377" r="12" fill="#4a5568" stroke="#ffffff" stroke-width="2"/>
<text x="895" y="373" text-anchor="end" font-size="14" font-weight="700" fill="#291c0e">Recycled PVC</text>
<text x="895" y="391" text-anchor="end" font-size="12" fill="#2d6a4f">value corner</text>

<!-- Recycled PET -->
<circle cx="994" cy="354" r="12" fill="#3d6b6b" stroke="#ffffff" stroke-width="2"/>
<text x="1012" y="350" text-anchor="start" font-size="14" font-weight="700" fill="#291c0e">Recycled PET</text>
<text x="1012" y="368" text-anchor="start" font-size="12" fill="#5c5c5c">toughest</text>

<text x="600" y="616" text-anchor="middle" font-size="14" fill="#4f4f4f">Recycled PVC and PET sit in the value corner &#8212; durable, barely a premium. Wood buys prestige at a</text>
<text x="600" y="638" text-anchor="middle" font-size="14" fill="#4f4f4f">durability cost; paper is cheap and disposable by design.</text>
</svg>
