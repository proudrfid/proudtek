<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="scTitle scDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="scTitle">Build a weighted supplier scorecard</title>
  <desc id="scDesc">Score each supplier one to five across seven categories: chip compatibility, print quality, encoding support, MOQ and pricing, lead time, responsiveness and certifications. Weight by priority: a luxury resort weights print quality at 30 percent, a budget chain weights unit price at 40 percent. Re-score annually.</desc>

  <defs>
    <radialGradient id="scBg" cx="50%" cy="18%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="scDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#scBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="62" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2" fill="#6d5a3a">BUILD A WEIGHTED SCORECARD</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#4f4f4f">Subjectivity out, documentation in — a rubric a procurement audit can point at</text>

  <!-- scorecard panel -->
  <rect x="64" y="120" width="672" height="428" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="96" y="156" font-size="15" font-weight="800" letter-spacing="1" fill="#291c0e">CATEGORY</text>
  <text x="612" y="156" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#291c0e">SCORE 1–5</text>
  <g fill="#6d5a3a" font-size="12" text-anchor="middle">
    <text x="512" y="182">1</text><text x="552" y="182">2</text><text x="592" y="182">3</text><text x="632" y="182">4</text><text x="672" y="182">5</text>
  </g>
  <line x1="88" y1="192" x2="712" y2="192" stroke="#e4c98f" stroke-width="1.5"/>

  <!-- rows -->
  <g font-size="16" font-weight="700" fill="#291c0e">
    <text x="96" y="224">Chip compatibility</text>
    <text x="96" y="268">Print quality</text>
    <text x="96" y="312">Encoding support</text>
    <text x="96" y="356">MOQ / pricing</text>
    <text x="96" y="400">Lead time</text>
    <text x="96" y="444">Responsiveness</text>
    <text x="96" y="488">Certifications</text>
  </g>
  <!-- dot tracks -->
  <g fill="#ffffff" stroke="#c39a5f" stroke-width="2">
    <circle cx="512" cy="219" r="10"/><circle cx="552" cy="219" r="10"/><circle cx="592" cy="219" r="10"/><circle cx="632" cy="219" r="10"/><circle cx="672" cy="219" r="10"/>
    <circle cx="512" cy="263" r="10"/><circle cx="552" cy="263" r="10"/><circle cx="592" cy="263" r="10"/><circle cx="632" cy="263" r="10"/><circle cx="672" cy="263" r="10"/>
    <circle cx="512" cy="307" r="10"/><circle cx="552" cy="307" r="10"/><circle cx="592" cy="307" r="10"/><circle cx="632" cy="307" r="10"/><circle cx="672" cy="307" r="10"/>
    <circle cx="512" cy="351" r="10"/><circle cx="552" cy="351" r="10"/><circle cx="592" cy="351" r="10"/><circle cx="632" cy="351" r="10"/><circle cx="672" cy="351" r="10"/>
    <circle cx="512" cy="395" r="10"/><circle cx="552" cy="395" r="10"/><circle cx="592" cy="395" r="10"/><circle cx="632" cy="395" r="10"/><circle cx="672" cy="395" r="10"/>
    <circle cx="512" cy="439" r="10"/><circle cx="552" cy="439" r="10"/><circle cx="592" cy="439" r="10"/><circle cx="632" cy="439" r="10"/><circle cx="672" cy="439" r="10"/>
    <circle cx="512" cy="483" r="10"/><circle cx="552" cy="483" r="10"/><circle cx="592" cy="483" r="10"/><circle cx="632" cy="483" r="10"/><circle cx="672" cy="483" r="10"/>
  </g>
  <text x="400" y="524" text-anchor="middle" font-size="12.5" font-style="italic" fill="#6d5a3a">Seven categories, one 1–5 rubric — the same card for every supplier</text>

  <!-- weight panel -->
  <text x="936" y="156" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#6d5a3a">WEIGHT BY PRIORITY</text>

  <rect x="760" y="176" width="352" height="126" rx="14" fill="url(#scDark)"/>
  <text x="786" y="212" font-size="15.5" font-weight="700" fill="#f4efe4">Luxury resort</text>
  <text x="786" y="266" font-size="46" font-weight="800" fill="#d4a755">30%</text>
  <text x="1088" y="248" text-anchor="end" font-size="14" fill="#f4efe4">weight on</text>
  <text x="1088" y="270" text-anchor="end" font-size="15.5" font-weight="700" fill="#f4efe4">print quality</text>

  <rect x="760" y="316" width="352" height="126" rx="14" fill="#3d6b6b"/>
  <text x="786" y="352" font-size="15.5" font-weight="700" fill="#eaf3f3">Budget chain</text>
  <text x="786" y="406" font-size="46" font-weight="800" fill="#ffffff">40%</text>
  <text x="1088" y="388" text-anchor="end" font-size="14" fill="#eaf3f3">weight on</text>
  <text x="1088" y="410" text-anchor="end" font-size="15.5" font-weight="700" fill="#ffffff">unit price</text>

  <rect x="760" y="456" width="352" height="92" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="936" y="490" text-anchor="middle" font-size="14" font-weight="800" fill="#291c0e">Re-score annually</text>
  <text x="936" y="514" text-anchor="middle" font-size="12.5" fill="#4f4f4f">defect rate · on-time delivery ·</text>
  <text x="936" y="532" text-anchor="middle" font-size="12.5" fill="#4f4f4f">guest complaint correlation</text>

  <text x="600" y="596" text-anchor="middle" font-size="16.5" fill="#6d5a3a">Same rubric, different weights — score once, then let the numbers argue.</text>
</svg>
