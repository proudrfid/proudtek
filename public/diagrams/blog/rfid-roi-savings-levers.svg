<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five RFID inventory savings levers that survive a finance review</title>
<desc id="d">Five stacked rows, each a savings lever with its headline figure. One, labor removed: 70 to 90 percent less count time across cycle counts, annual inventory and spot checks. Two, inventory accuracy of 95 to 99 percent, up from a 65 to 75 percent manual baseline, recovering out-of-stock revenue. Three, shrinkage reduction of 50 to 80 percent from faster loss detection and deterrence. Four, out-of-stock recovery of 2 to 8 percent sales lift; a 5 million dollar store at plus 3 percent recovers 150 thousand dollars. Five, markdown and overstock cut worth 15 to 25 percent of gross margin in fashion retail.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE SAVINGS LEVERS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Only the benefits that survive a finance review belong in the model.</text>

<!-- row 1 -->
<rect x="80" y="150" width="1040" height="64" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="100" y="186" font-size="30" font-weight="800" fill="#2c5454">70-90%</text>
<text x="100" y="204" font-size="12" fill="#5c5c5c">less count time</text>
<line x1="300" y1="162" x2="300" y2="202" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="330" y="182" font-size="17" font-weight="800" fill="#291c0e">Labor removed</text>
<text x="330" y="202" font-size="13" fill="#5c5c5c">cycle counts, annual inventory, spot checks</text>

<!-- row 2 -->
<rect x="80" y="224" width="1040" height="64" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="100" y="260" font-size="30" font-weight="800" fill="#2c5454">95-99%</text>
<text x="100" y="278" font-size="12" fill="#5c5c5c">from 65-75%</text>
<line x1="300" y1="236" x2="300" y2="276" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="330" y="256" font-size="17" font-weight="800" fill="#291c0e">Inventory accuracy</text>
<text x="330" y="276" font-size="13" fill="#5c5c5c">recovers out-of-stock revenue via better replenishment</text>

<!-- row 3 -->
<rect x="80" y="298" width="1040" height="64" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="100" y="334" font-size="30" font-weight="800" fill="#2c5454">50-80%</text>
<text x="100" y="352" font-size="12" fill="#5c5c5c">less shrink</text>
<line x1="300" y1="310" x2="300" y2="350" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="330" y="330" font-size="17" font-weight="800" fill="#291c0e">Shrinkage reduction</text>
<text x="330" y="350" font-size="13" fill="#5c5c5c">faster loss detection and theft deterrence</text>

<!-- row 4 -->
<rect x="80" y="372" width="1040" height="64" rx="12" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="100" y="408" font-size="30" font-weight="800" fill="#1f6f3a">2-8%</text>
<text x="100" y="426" font-size="12" fill="#5c5c5c">sales lift</text>
<line x1="300" y1="384" x2="300" y2="424" stroke="#d7e8db" stroke-width="1.4"/>
<text x="330" y="404" font-size="17" font-weight="800" fill="#291c0e">Out-of-stock recovery</text>
<text x="330" y="424" font-size="13" fill="#5c5c5c">a $5M store at +3% = $150K recovered sales</text>

<!-- row 5 -->
<rect x="80" y="446" width="1040" height="64" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="100" y="482" font-size="30" font-weight="800" fill="#2c5454">15-25%</text>
<text x="100" y="500" font-size="12" fill="#5c5c5c">margin saved</text>
<line x1="300" y1="458" x2="300" y2="498" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="330" y="478" font-size="17" font-weight="800" fill="#291c0e">Markdown / overstock cut</text>
<text x="330" y="498" font-size="13" fill="#5c5c5c">of gross margin in fashion retail</text>

<text x="600" y="556" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Five levers, one rule: count only the savings you can defend line by line.</text>
</svg>
