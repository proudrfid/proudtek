<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Cost crossover between LED tags and overhead RTLS as tracked locations grow</title>
<desc id="d">A total-cost versus tracked-locations chart with two rising lines. The LED-tag line starts cheap and climbs steeply because each tag costs 3 to 8 dollars. The overhead-RTLS line starts high, carrying the up-front cost of ceiling readers at about 8 to 15 thousand dollars each, then rises slowly because its tags are standard UHF inlays at 5 to 50 cents. The lines cross in a shaded band at roughly 5,000 to 10,000 tracked locations. Left of the band, LED tags are cheaper; right of it, overhead RTLS is cheaper. Both run the same WMS pick-to-light workflow.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE THE COST LINES CROSS</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">LED tags stay cheaper until roughly 5,000-10,000 tracked locations.</text>

<!-- crossover band -->
<rect x="467" y="150" width="287" height="320" fill="#f3ede0" opacity="0.75"/>
<text x="610" y="140" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">CROSSOVER: 5,000-10,000 LOCATIONS</text>

<!-- axes -->
<line x1="180" y1="150" x2="180" y2="470" stroke="#c9c1b2" stroke-width="2"/>
<line x1="180" y1="470" x2="1040" y2="470" stroke="#c9c1b2" stroke-width="2"/>
<text x="150" y="170" font-size="12.5" fill="#8a8a8a">cost</text>
<polygon points="180,146 176,158 184,158" fill="#c9c1b2"/>
<text x="180" y="492" text-anchor="middle" font-size="12.5" fill="#8a8a8a">0</text>
<text x="467" y="492" text-anchor="middle" font-size="12.5" fill="#8a8a8a">5k</text>
<text x="754" y="492" text-anchor="middle" font-size="12.5" fill="#8a8a8a">10k</text>
<text x="1040" y="492" text-anchor="middle" font-size="12.5" fill="#8a8a8a">15k</text>
<text x="610" y="514" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.5" fill="#8a8a8a">TRACKED LOCATIONS</text>

<!-- RTLS line (shallow, teal) -->
<line x1="180" y1="360" x2="1040" y2="300" stroke="#3d6b6b" stroke-width="4"/>
<!-- LED line (steep, gold) -->
<line x1="180" y1="470" x2="1040" y2="175" stroke="#c39a5f" stroke-width="4"/>

<!-- crossover dot -->
<circle cx="582" cy="332" r="8" fill="#291c0e"/>

<!-- line labels -->
<text x="1006" y="168" text-anchor="end" font-size="14.5" font-weight="800" fill="#a07d43">LED tags</text>
<text x="1006" y="288" text-anchor="end" font-size="14.5" font-weight="800" fill="#2c5454">overhead RTLS</text>

<!-- region labels -->
<text x="322" y="212" text-anchor="middle" font-size="14.5" font-weight="800" fill="#a07d43">LED TAGS WIN</text>
<text x="898" y="212" text-anchor="middle" font-size="14.5" font-weight="800" fill="#2c5454">RTLS WINS</text>

<!-- cost-driver chips -->
<rect x="180" y="536" width="430" height="60" rx="12" fill="#fffaf0" stroke="#e4c98f" stroke-width="1.6"/>
<text x="204" y="562" font-size="14" font-weight="800" fill="#6d5a3a">LED tags</text>
<text x="204" y="583" font-size="13" fill="#7a6533">$3-8 per tag · standard zone readers · no ceiling infra</text>
<rect x="628" y="536" width="462" height="60" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="652" y="562" font-size="14" font-weight="800" fill="#2c5454">Overhead RTLS</text>
<text x="652" y="583" font-size="13" fill="#33595a">readers ~$8-15K each · tags $0.05-0.50 · continuous coverage</text>

<text x="600" y="628" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Same WMS pick-to-light workflow either way — only the physical-layer cost curve differs.</text>
</svg>
