<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Year-one cost anatomy of a 200-door enterprise access refresh</title>
<desc id="d">A stacked horizontal bar breaking the roughly 420 thousand dollar year-one budget of a typical 200-door enterprise access control refresh into its slices: PACS software licence and SMA at 150 thousand dollars, 200 OSDP readers at 80 thousand, 25 controller panels at 62 thousand, installation labour at 60 thousand, integration services at 50 thousand, and 5000 DESFire EV3 credentials at 20 thousand — about 2.1 thousand dollars per door. A strip underneath notes the year-two-onward steady state of roughly 33 thousand dollars per year across software maintenance, credential replacement and mobile subscriptions.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PROGRAMME ECONOMICS</text>
<text x="600" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Where the money actually goes</text>
<text x="600" y="124" text-anchor="middle" font-size="15" fill="#4f4f4f">Credentials are the smallest slice — negotiate hardest where the slices are wide.</text>

<text x="90" y="184" font-size="15" font-weight="700" fill="#291c0e">Year-1 spend — typical 200-door enterprise refresh</text>
<text x="1110" y="184" text-anchor="end" font-size="15" font-weight="800" fill="#6d5a3a">~$420K total · ~$2.1K per door</text>

<!-- stacked bar: px = $K x 2.417 -->
<rect x="90" y="204" width="363" height="104" fill="#4a5568"/>
<rect x="453" y="204" width="193" height="104" fill="#3d6b6b"/>
<rect x="646" y="204" width="150" height="104" fill="#6b7a90"/>
<rect x="796" y="204" width="145" height="104" fill="#c39a5f"/>
<rect x="941" y="204" width="121" height="104" fill="#2c5454"/>
<rect x="1062" y="204" width="48" height="104" fill="#d4a755"/>
<rect x="90" y="204" width="1020" height="104" rx="10" fill="none" stroke="#3a4353" stroke-width="2"/>
<text x="271" y="250" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">$150K</text>
<text x="271" y="272" text-anchor="middle" font-size="12" fill="#e6e9ee">PACS software Y1</text>
<text x="549" y="250" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">$80K</text>
<text x="549" y="272" text-anchor="middle" font-size="12" fill="#e8f1f1">readers</text>
<text x="721" y="250" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">$62K</text>
<text x="721" y="272" text-anchor="middle" font-size="12" fill="#e6e9ee">panels</text>
<text x="868" y="250" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">$60K</text>
<text x="868" y="272" text-anchor="middle" font-size="12" fill="#f7edd6">labour</text>
<text x="1001" y="250" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">$50K</text>
<text x="1001" y="272" text-anchor="middle" font-size="12" fill="#e8f1f1">integration</text>
<text x="1086" y="250" text-anchor="middle" font-size="13" font-weight="800" fill="#5c4a26">$20K</text>

<!-- legend -->
<rect x="90" y="348" width="16" height="16" fill="#4a5568"/>
<text x="114" y="361" font-size="13" fill="#291c0e">PACS software licence + SMA — $150K</text>
<rect x="460" y="348" width="16" height="16" fill="#3d6b6b"/>
<text x="484" y="361" font-size="13" fill="#291c0e">200 OSDP readers — $80K</text>
<rect x="790" y="348" width="16" height="16" fill="#6b7a90"/>
<text x="814" y="361" font-size="13" fill="#291c0e">25 controller panels — $62K</text>
<rect x="90" y="384" width="16" height="16" fill="#c39a5f"/>
<text x="114" y="397" font-size="13" fill="#291c0e">Installation labour — $60K</text>
<rect x="460" y="384" width="16" height="16" fill="#2c5454"/>
<text x="484" y="397" font-size="13" fill="#291c0e">Integration services — $50K</text>
<rect x="790" y="384" width="16" height="16" fill="#d4a755"/>
<text x="814" y="397" font-size="13" fill="#291c0e">5,000 DESFire EV3 cards — $20K</text>

<!-- recurring strip -->
<rect x="90" y="448" width="1020" height="66" rx="12" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.5"/>
<text x="600" y="476" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">Year 2 onward: ~$33K per year steady state</text>
<text x="600" y="499" text-anchor="middle" font-size="12.5" fill="#5c5c5c">software maintenance + annual credential replacement + mobile-credential subscriptions</text>

<text x="600" y="580" text-anchor="middle" font-size="14" fill="#5c5c5c">SKU consolidation and multi-year commitment claw back double digits before anyone starts discounting hardware.</text>
<text x="600" y="604" text-anchor="middle" font-size="14" fill="#5c5c5c">The security incident you avoid is priced in a different column entirely.</text>
</svg>
