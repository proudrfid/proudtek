<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Physical band + Wallet pass — one membership, two credentials</title>
  <desc id="d">The NFC wristband pairs with an Apple Wallet or Google Wallet pass on the same membership record: the band covers the workout where phones stay in lockers, the wallet pass covers arrival and off-peak visits — one member profile behind both.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">The band for the workout, the pass for the pocket</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Same membership record answers from either credential</text>
  <g transform="translate(80,170)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="20" width="400" height="220" rx="14" fill="#eef2f0" stroke="#2c5454" stroke-width="2.5"/>
    <text x="24" y="58" font-family="Georgia, serif" font-size="17" fill="#2c5454">Silicone NFC band</text>
    <text x="24" y="94" font-size="13" fill="#2c5454">on the wrist through the session —</text>
    <text x="24" y="116" font-size="13" fill="#2c5454">phone stays in the locker</text>
    <text x="24" y="150" font-size="13" fill="#6d5a3a">NTAG213 UID check-in default ·</text>
    <text x="24" y="172" font-size="13" fill="#6d5a3a">NTAG216 / DESFire for richer builds</text>
    <text x="24" y="206" font-size="13" fill="#6d5a3a">survives sweat, showers, chlorine</text>
    <rect x="640" y="20" width="400" height="220" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="664" y="58" font-family="Georgia, serif" font-size="17" fill="#291c0e">Apple / Google Wallet pass</text>
    <text x="664" y="94" font-size="13" fill="#2c5454">digital twin of the same membership —</text>
    <text x="664" y="116" font-size="13" fill="#2c5454">arrival scans, off-peak drop-ins</text>
    <text x="664" y="150" font-size="13" fill="#6d5a3a">issued from the same member record,</text>
    <text x="664" y="172" font-size="13" fill="#6d5a3a">revoked together on cancellation</text>
    <path d="M 405 130 L 635 130" stroke="#6d5a3a" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="462" y="118" font-size="12" fill="#6d5a3a">one member profile</text>
  </g>
  <text x="80" y="560" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Boutique studios run the band across locations; hotel fitness ties it to the room key ecosystem</text>
</svg>
