<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five error sources that cap manual inventory-counting accuracy</title>
<desc id="d">Five stacked rows naming the error sources in manual counting. One, counting fatigue: focus and accuracy fall after the first 30-60 minutes, causing late-shift errors. Two, visual misidentification: look-alike SKUs in adjacent bins are counted under the wrong code. Three, barcode line-of-sight: sealed cartons and blocked items are missed unless every box is opened. Four, double-count and skip: items at zone boundaries are counted twice or skipped by overlapping counters. Five, transcription: clipboard and spreadsheet figures are re-keyed by hand into the WMS. Together they cap manual accuracy at 65-85%.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE A MANUAL COUNT LEAKS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Five error sources, none of them carelessness — the method asks a tired human to do a machine's job.</text>

<rect x="64" y="132" width="1072" height="72" rx="11" fill="#f7f6f3" stroke="#e2ddd2" stroke-width="1.4"/>
<rect x="64" y="132" width="9" height="72" rx="4" fill="#4a5568"/>
<circle cx="112" cy="168" r="17" fill="#4a5568"/>
<text x="112" y="174" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
<text x="150" y="163" font-size="15.5" font-weight="800" fill="#291c0e">Counting fatigue</text>
<text x="150" y="187" font-size="13" fill="#5c5c5c">focus and accuracy fall after the first 30-60 minutes</text>
<rect x="860" y="148" width="196" height="40" rx="20" fill="#eef0f3" stroke="#d5dae2" stroke-width="1.3"/>
<text x="958" y="173" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">late-shift errors</text>

<rect x="64" y="214" width="1072" height="72" rx="11" fill="#f7f6f3" stroke="#e2ddd2" stroke-width="1.4"/>
<rect x="64" y="214" width="9" height="72" rx="4" fill="#4a5568"/>
<circle cx="112" cy="250" r="17" fill="#4a5568"/>
<text x="112" y="256" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<text x="150" y="245" font-size="15.5" font-weight="800" fill="#291c0e">Visual misidentification</text>
<text x="150" y="269" font-size="13" fill="#5c5c5c">look-alike SKUs in adjacent bins, counted under the wrong code</text>
<rect x="860" y="230" width="196" height="40" rx="20" fill="#eef0f3" stroke="#d5dae2" stroke-width="1.3"/>
<text x="958" y="255" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">wrong SKU</text>

<rect x="64" y="296" width="1072" height="72" rx="11" fill="#f7f6f3" stroke="#e2ddd2" stroke-width="1.4"/>
<rect x="64" y="296" width="9" height="72" rx="4" fill="#4a5568"/>
<circle cx="112" cy="332" r="17" fill="#4a5568"/>
<text x="112" y="338" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<text x="150" y="327" font-size="15.5" font-weight="800" fill="#291c0e">Barcode line-of-sight</text>
<text x="150" y="351" font-size="13" fill="#5c5c5c">sealed cartons and blocked items are missed unless every box is opened</text>
<rect x="860" y="312" width="196" height="40" rx="20" fill="#eef0f3" stroke="#d5dae2" stroke-width="1.3"/>
<text x="958" y="337" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">missed items</text>

<rect x="64" y="378" width="1072" height="72" rx="11" fill="#f7f6f3" stroke="#e2ddd2" stroke-width="1.4"/>
<rect x="64" y="378" width="9" height="72" rx="4" fill="#4a5568"/>
<circle cx="112" cy="414" r="17" fill="#4a5568"/>
<text x="112" y="420" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4</text>
<text x="150" y="409" font-size="15.5" font-weight="800" fill="#291c0e">Double-count &amp; skip</text>
<text x="150" y="433" font-size="13" fill="#5c5c5c">items at zone boundaries counted twice or skipped by overlapping counters</text>
<rect x="860" y="394" width="196" height="40" rx="20" fill="#eef0f3" stroke="#d5dae2" stroke-width="1.3"/>
<text x="958" y="419" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">overlap error</text>

<rect x="64" y="460" width="1072" height="72" rx="11" fill="#f7f6f3" stroke="#e2ddd2" stroke-width="1.4"/>
<rect x="64" y="460" width="9" height="72" rx="4" fill="#4a5568"/>
<circle cx="112" cy="496" r="17" fill="#4a5568"/>
<text x="112" y="502" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">5</text>
<text x="150" y="491" font-size="15.5" font-weight="800" fill="#291c0e">Transcription</text>
<text x="150" y="515" font-size="13" fill="#5c5c5c">clipboard and spreadsheet figures re-keyed by hand into the WMS/ERP</text>
<rect x="860" y="476" width="196" height="40" rx="20" fill="#eef0f3" stroke="#d5dae2" stroke-width="1.3"/>
<text x="958" y="501" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">keying error</text>

<text x="600" y="578" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Stack all five and manual accuracy tops out around 65-85% — which is why the annual count never quite reconciles.</text>
</svg>
