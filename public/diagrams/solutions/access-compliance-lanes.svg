<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Three compliance lanes for access-control procurement</title>
<desc id="d">Three vertical procurement lanes, each a stack of standards. The federal lane runs from FICAM and the GSA Approved Products List through FIPS 201-3, NIST SP 800-116 Rev 1, NDAA Section 889 and TAA down to UL 1610 and UL 2050 for SCIF areas. The commercial lane runs from UL 294 through AHJ approval, ADA 2010 and GDPR Article 28 with CCPA and CPRA. The international lane runs from IEC 60839-11-1 and -11-2 through EU member-state certification to ISO/IEC 27001 controls A.7.2 and A.8.10 feeding SOC-2 audit evidence.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COMPLIANCE + STANDARDS</text>
<text x="600" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Three procurement lanes, three audit stacks</text>
<text x="600" y="124" text-anchor="middle" font-size="15" fill="#4f4f4f">Start in the lane your estate lives in — every stack ends at the same door.</text>

<!-- ─────────── Lane 1: Federal (steel) ─────────── -->
<rect x="56" y="152" width="344" height="44" rx="10" fill="#4a5568"/>
<text x="228" y="180" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">FEDERAL</text>
<line x1="228" y1="196" x2="228" y2="622" stroke="#c8cfda" stroke-width="2"/>

<rect x="76" y="212" width="304" height="66" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="94" y="238" font-size="14.5" font-weight="800" fill="#291c0e">FICAM · GSA APL</text>
<text x="94" y="260" font-size="12" fill="#5c5c5c">buy only from the Approved Products List</text>

<rect x="76" y="294" width="304" height="66" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="94" y="320" font-size="14.5" font-weight="800" fill="#291c0e">FIPS 201-3 (2022) + FIPS 140-3</text>
<text x="94" y="342" font-size="12" fill="#5c5c5c">PIV credential format · validated HSM</text>

<rect x="76" y="376" width="304" height="66" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="94" y="402" font-size="14.5" font-weight="800" fill="#291c0e">NIST SP 800-116 Rev 1</text>
<text x="94" y="424" font-size="12" fill="#5c5c5c">PKI-AUTH at high-assurance doors · AES-128</text>

<rect x="76" y="458" width="304" height="66" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="94" y="484" font-size="14.5" font-weight="800" fill="#291c0e">NDAA §889 + TAA</text>
<text x="94" y="506" font-size="12" fill="#8b2d2d">bars Huawei · ZTE · Hytera · Hikvision · Dahua</text>

<rect x="76" y="540" width="304" height="66" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="94" y="566" font-size="14.5" font-weight="800" fill="#291c0e">UL 1610 / UL 2050</text>
<text x="94" y="588" font-size="12" fill="#5c5c5c">SCIF + closed areas — DoD-spec integration</text>

<!-- ─────────── Lane 2: Commercial (gold) ─────────── -->
<rect x="428" y="152" width="344" height="44" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="2"/>
<text x="600" y="180" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">COMMERCIAL + STATE</text>
<line x1="600" y1="196" x2="600" y2="622" stroke="#e0d5bd" stroke-width="2"/>

<rect x="448" y="212" width="304" height="66" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="2"/>
<text x="466" y="238" font-size="14.5" font-weight="800" fill="#291c0e">UL 294 — 8th edition (2023)</text>
<text x="466" y="260" font-size="12" fill="#5c5c5c">Levels I–IV · enterprise ships at Level IV</text>

<rect x="448" y="294" width="304" height="66" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="2"/>
<text x="466" y="320" font-size="14.5" font-weight="800" fill="#291c0e">AHJ approval</text>
<text x="466" y="342" font-size="12" fill="#5c5c5c">jurisdiction may add UL 1076 / UL 681</text>

<rect x="448" y="376" width="304" height="66" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="2"/>
<text x="466" y="402" font-size="14.5" font-weight="800" fill="#291c0e">ADA 2010</text>
<text x="466" y="424" font-size="12" fill="#5c5c5c">≤5 lbf force · reader 15–48 in · A/V feedback</text>

<rect x="448" y="458" width="304" height="66" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="2"/>
<text x="466" y="484" font-size="14.5" font-weight="800" fill="#291c0e">GDPR Art. 28 · CCPA / CPRA</text>
<text x="466" y="506" font-size="12" fill="#5c5c5c">cardholder data + logs · DPA with cloud PACS</text>

<rect x="448" y="540" width="304" height="66" rx="10" fill="#faf7f0" stroke="#e0d5bd" stroke-width="2"/>
<text x="466" y="566" font-size="14.5" font-weight="700" fill="#6d5a3a">Why it matters</text>
<text x="466" y="588" font-size="12" fill="#5c5c5c">no UL 294 listing → no occupancy sign-off</text>

<!-- ─────────── Lane 3: International (teal) ─────────── -->
<rect x="800" y="152" width="344" height="44" rx="10" fill="#2c5454"/>
<text x="972" y="180" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">INTERNATIONAL + EU</text>
<line x1="972" y1="196" x2="972" y2="622" stroke="#cfdede" stroke-width="2"/>

<rect x="820" y="212" width="304" height="66" rx="10" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<text x="838" y="238" font-size="14.5" font-weight="800" fill="#291c0e">IEC 60839-11-1 / -11-2</text>
<text x="838" y="260" font-size="12" fill="#5c5c5c">functional + environmental requirements</text>

<rect x="820" y="294" width="304" height="66" rx="10" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<text x="838" y="320" font-size="14.5" font-weight="800" fill="#291c0e">EU member-state certification</text>
<text x="838" y="342" font-size="12" fill="#5c5c5c">national schemes build on the IEC 60839 base</text>

<rect x="820" y="376" width="304" height="66" rx="10" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<text x="838" y="402" font-size="14.5" font-weight="800" fill="#291c0e">ISO/IEC 27001 — A.7.2 + A.8.10</text>
<text x="838" y="424" font-size="12" fill="#5c5c5c">physical access + secure disposal controls</text>

<rect x="820" y="458" width="304" height="66" rx="10" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<text x="838" y="484" font-size="14.5" font-weight="800" fill="#291c0e">SOC-2 / audit evidence</text>
<text x="838" y="506" font-size="12" fill="#5c5c5c">PACS logs + disposal records in audit scope</text>

<rect x="820" y="540" width="304" height="66" rx="10" fill="#eef5f5" stroke="#cfdede" stroke-width="2"/>
<text x="838" y="566" font-size="14.5" font-weight="700" fill="#234a4a">Why it matters</text>
<text x="838" y="588" font-size="12" fill="#5c5c5c">quarterly evidence pulls — plan the log trail</text>

<text x="600" y="646" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Federal buyers start at FICAM and FIPS 201-3 · commercial buyers at UL 294 · everyone meets the ADA at the door.</text>
</svg>
