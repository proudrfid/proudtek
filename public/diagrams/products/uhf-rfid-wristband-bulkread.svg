<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Hundreds through the portal — Gen2v2 anti-collision at work</title>
  <desc id="d">A crowd walks a portal while EPC Gen2v2 slotted-Aloha with the Q-algorithm sorts hundreds of wristbands in the field, the mechanism race-timing operators like MyLaps, MultiSport Timing, Race Result and ChronoTrack standardised on for mass finish-line capture.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">The finish line reads everyone at once</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Slotted-Aloha with the Q-algorithm — hundreds of bands, one portal, no queue</text>
  <g transform="translate(80,150)" font-family="Helvetica, Arial, sans-serif">
    <rect x="330" y="0" width="26" height="260" fill="#6d5a3a"/>
    <rect x="620" y="0" width="26" height="260" fill="#6d5a3a"/>
    <rect x="330" y="0" width="316" height="22" fill="#2c5454"/>
    <text x="418" y="16" font-size="12" fill="#f8f6f1">portal readers</text>
    <g fill="#eef2f0" stroke="#3d6b6b" stroke-width="2">
      <circle cx="420" cy="120" r="26"/><circle cx="500" cy="90" r="26"/><circle cx="560" cy="160" r="26"/>
      <circle cx="452" cy="200" r="26"/><circle cx="530" cy="230" r="26"/>
    </g>
    <g fill="#c39a5f">
      <rect x="404" y="140" width="14" height="8" rx="3"/><rect x="484" y="110" width="14" height="8" rx="3"/>
      <rect x="544" y="180" width="14" height="8" rx="3"/><rect x="436" y="220" width="14" height="8" rx="3"/>
    </g>
    <text x="368" y="300" font-size="13" fill="#6d5a3a">every gold dot is a wristband answering in its own slot</text>
  </g>
  <g transform="translate(770,150)">
    <rect x="0" y="0" width="360" height="300" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="17" fill="#291c0e">Who runs on this</text>
    <text x="24" y="78" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Race timing: MyLaps · MultiSport ·</text>
    <text x="24" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Race Result · ChronoTrack</text>
    <text x="24" y="134" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">mass finish-line capture is exactly</text>
    <text x="24" y="156" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">this mechanism</text>
    <line x1="24" y1="182" x2="336" y2="182" stroke="#d8cdb8" stroke-width="1.5"/>
    <text x="24" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">Conference session logging: portal at</text>
    <text x="24" y="236" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">the room door writes CEU / CPE credit</text>
    <text x="24" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">ISO/IEC 18000-63 Type C — same protocol</text>
    <text x="24" y="292" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">as apparel retail logistics</text>
  </g>
</svg>
