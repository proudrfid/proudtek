<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Four-day festival results — gate throughput, cashless coverage and integrity outcomes</title>
  <desc id="d">The four-day scoreboard, using the festival's own measured results. Gate throughput held at 14 attendees per lane per minute versus 9 on the barcode lane. Cashless payment reached 71% of on-site spend by day 4, up from 52% on the previous barcode-and-token system. The event moved 4.8 million dollars in cashless volume at a 0.04% transaction-fail rate, 47 cloned-credential entries were caught at the gate, and under 0.3% of genuine entries needed a retry. Average top-up was 34 euros and average on-site spend 87 euros per attendee.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE FOUR-DAY SCOREBOARD</text>
  <text x="600" y="80" text-anchor="middle" font-size="15" fill="#5c5c5c">Every number is the festival's own measured result</text>

  <!-- gate throughput -->
  <text x="60" y="120" font-size="13" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">GATE THROUGHPUT · PER LANE PER MINUTE</text>
  <text x="60" y="160" font-size="14" font-weight="700" fill="#291c0e">UHF walk-through</text>
  <rect x="300" y="132" width="560" height="44" rx="6" fill="#3d6b6b"/>
  <text x="320" y="160" font-size="15" font-weight="700" fill="#ffffff">14 attendees / minute</text>
  <text x="60" y="214" font-size="14" font-weight="700" fill="#291c0e">Barcode lane</text>
  <rect x="300" y="186" width="360" height="44" rx="6" fill="#4a5568"/>
  <text x="320" y="214" font-size="15" font-weight="700" fill="#ffffff">9 attendees / minute</text>

  <!-- cashless coverage -->
  <text x="60" y="268" font-size="13" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">CASHLESS SHARE OF ON-SITE SPEND</text>
  <rect x="300" y="280" width="740" height="44" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <rect x="300" y="280" width="525" height="44" rx="6" fill="#3d6b6b"/>
  <text x="320" y="308" font-size="15" font-weight="700" fill="#ffffff">71% by day 4</text>
  <line x1="685" y1="280" x2="685" y2="324" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="685" y1="324" x2="685" y2="342" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="685" y="358" text-anchor="middle" font-size="12" fill="#4a5568">52% before</text>
  <text x="60" y="308" font-size="14" font-weight="700" fill="#291c0e">Share of spend</text>

  <!-- stat tiles -->
  <rect x="66" y="374" width="248" height="104" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="190" y="422" text-anchor="middle" font-size="30" font-weight="800" fill="#2c5454">$4.8M</text>
  <text x="190" y="448" text-anchor="middle" font-size="12.5" fill="#5c5c5c">cashless volume</text>
  <text x="190" y="466" text-anchor="middle" font-size="12.5" fill="#5c5c5c">across the 4-day event</text>

  <rect x="336" y="374" width="248" height="104" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="460" y="422" text-anchor="middle" font-size="30" font-weight="800" fill="#2c5454">0.04%</text>
  <text x="460" y="448" text-anchor="middle" font-size="12.5" fill="#5c5c5c">transaction-fail</text>
  <text x="460" y="466" text-anchor="middle" font-size="12.5" fill="#5c5c5c">rate at the POS</text>

  <rect x="606" y="374" width="248" height="104" rx="12" fill="#fbeeee" stroke="#d8b3b3" stroke-width="2"/>
  <text x="730" y="422" text-anchor="middle" font-size="30" font-weight="800" fill="#8b2d2d">47</text>
  <text x="730" y="448" text-anchor="middle" font-size="12.5" fill="#5c5c5c">cloned-credential</text>
  <text x="730" y="466" text-anchor="middle" font-size="12.5" fill="#5c5c5c">entries caught at the gate</text>

  <rect x="876" y="374" width="248" height="104" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="1000" y="422" text-anchor="middle" font-size="30" font-weight="800" fill="#2c5454">0.3%</text>
  <text x="1000" y="448" text-anchor="middle" font-size="12.5" fill="#5c5c5c">genuine entries</text>
  <text x="1000" y="466" text-anchor="middle" font-size="12.5" fill="#5c5c5c">that needed a retry</text>

  <!-- footer -->
  <rect x="66" y="498" width="1058" height="100" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="88" y="530" font-size="15" font-weight="700" fill="#2c5454">Cashless covered 71% of all on-site spend by day 4 — up from 52% on the old barcode-and-token system.</text>
  <text x="88" y="558" font-size="13.5" fill="#3d6b6b">The event moved $4.8M in total volume at a 0.04% transaction-fail rate.</text>
  <text x="88" y="582" font-size="13.5" fill="#3d6b6b">Average top-up was €34 and average on-site spend €87 per attendee across food, beverage and merch.</text>
</svg>
