<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The 2026 healthcare RTLS and RFID market: two overlapping growth curves</title>
<desc id="d">Two panels. Left, RTLS in healthcare per Grand View Research: 2.46 billion dollars in 2024 growing to 9.94 billion dollars by 2033 at a 16.87 percent CAGR. Right, RFID in healthcare per industry-published guides: 4.64 billion dollars in 2023 growing to 14.65 billion dollars by 2030 at a 17.85 percent CAGR. Both curves show hospitals moving from pilots to operational backbone.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HEALTHCARE RTLS &amp; RFID MARKET · 2026 VIEW</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Two market definitions, one direction — both roughly triple within the decade.</text>

<!-- LEFT panel · RTLS -->
<rect x="88" y="136" width="480" height="392" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="88" y="136" width="480" height="8" rx="4" fill="#3d6b6b"/>
<text x="328" y="178" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.5" fill="#2c5454">RTLS IN HEALTHCARE</text>
<rect x="228" y="192" width="200" height="30" rx="15" fill="#ffffff" stroke="#a9cccc" stroke-width="1.3"/>
<text x="328" y="212" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2c5454">CAGR 16.87% → 2033</text>
<line x1="128" y1="476" x2="528" y2="476" stroke="#cfe0e0" stroke-width="2"/>
<rect x="178" y="437" width="104" height="39" fill="#9dbdbd"/>
<text x="230" y="427" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">$2.46B</text>
<text x="230" y="498" text-anchor="middle" font-size="13.5" fill="#5c5c5c">2024</text>
<rect x="362" y="320" width="104" height="156" fill="#3d6b6b"/>
<text x="414" y="310" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">$9.94B</text>
<text x="414" y="498" text-anchor="middle" font-size="13.5" fill="#5c5c5c">2033</text>
<text x="328" y="518" text-anchor="middle" font-size="12" fill="#8a8a8a">Source: Grand View Research</text>

<!-- RIGHT panel · RFID -->
<rect x="632" y="136" width="480" height="392" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="632" y="136" width="480" height="8" rx="4" fill="#c39a5f"/>
<text x="872" y="178" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID IN HEALTHCARE</text>
<rect x="772" y="192" width="200" height="30" rx="15" fill="#ffffff" stroke="#e4c98f" stroke-width="1.3"/>
<text x="872" y="212" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6d5a3a">CAGR 17.85% → 2030</text>
<line x1="672" y1="476" x2="1072" y2="476" stroke="#e4c98f" stroke-width="2"/>
<rect x="722" y="403" width="104" height="73" fill="#dcc38f"/>
<text x="774" y="393" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">$4.64B</text>
<text x="774" y="498" text-anchor="middle" font-size="13.5" fill="#5c5c5c">2023</text>
<rect x="906" y="246" width="104" height="230" fill="#c39a5f"/>
<text x="958" y="236" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">$14.65B</text>
<text x="958" y="498" text-anchor="middle" font-size="13.5" fill="#5c5c5c">2030</text>
<text x="872" y="518" text-anchor="middle" font-size="12" fill="#8a8a8a">Source: industry-published guides</text>

<text x="600" y="576" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">For buyers in 2026 the question is no longer whether, but which use cases first.</text>
<text x="600" y="606" text-anchor="middle" font-size="13" fill="#5c5c5c">RTLS and RFID-in-healthcare are overlapping market definitions, not competing forecasts.</text>
</svg>
