<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Inside the Proud Tek Shenzhen floor: six in-house line families from materials to export</title>
  <desc id="d">A left-to-right process flow in six stages. Stage 1, materials in: chips, antennas and PVC and PET substrates sourced locally. Stage 2, inlay bonding: chip-to-antenna for HF 13.56 MHz and UHF 860-960 MHz inlays. Stage 3, laminate and print: PVC, ABS and PET stock, offset, screen and laser. Stage 4, encoding: UID, NDEF and GS1 SGTIN-96, with MIFARE Plus and DESFire keys. Stage 5, QC read-test: 100% functional read test plus AQL sampling. Stage 6, export packing: FOB, CIF or DDP by DHL, FedEx or sea to 50+ countries. A footer notes every value-added step is in-house across 2 Shenzhen sites and 10 automated lines.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INSIDE THE SHENZHEN FLOOR</text>
  <text x="600" y="92" text-anchor="middle" font-size="29" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Six line families, every step in-house</text>
  <text x="600" y="118" text-anchor="middle" font-size="14" fill="#5c5c5c">The operators who build your pilot lot run the production order.</text>

  <!-- stage 1 -->
  <rect x="40" y="180" width="170" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="125" cy="219" r="17" fill="#3d6b6b"/>
  <text x="125" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
  <text x="125" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Materials in</text>
  <text x="125" y="322" text-anchor="middle" font-size="13" fill="#5c5c5c">Chips, antennas,</text>
  <text x="125" y="343" text-anchor="middle" font-size="13" fill="#5c5c5c">PVC &amp; PET stock</text>
  <rect x="55" y="398" width="140" height="34" rx="8" fill="#eef5f5"/>
  <text x="125" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">Shenzhen-sourced</text>

  <!-- stage 2 -->
  <rect x="228" y="180" width="170" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="313" cy="219" r="17" fill="#4a5568"/>
  <text x="313" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
  <text x="313" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Inlay bonding</text>
  <text x="313" y="322" text-anchor="middle" font-size="13" fill="#5c5c5c">Chip-to-antenna,</text>
  <text x="313" y="343" text-anchor="middle" font-size="13" fill="#5c5c5c">HF &amp; UHF inlays</text>
  <rect x="243" y="398" width="140" height="34" rx="8" fill="#eef1f5"/>
  <text x="313" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">13.56 &amp; 860-960 MHz</text>

  <!-- stage 3 -->
  <rect x="416" y="180" width="170" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="501" cy="219" r="17" fill="#4a5568"/>
  <text x="501" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
  <text x="501" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Laminate &amp; print</text>
  <text x="501" y="322" text-anchor="middle" font-size="13" fill="#5c5c5c">PVC / ABS / PET,</text>
  <text x="501" y="343" text-anchor="middle" font-size="13" fill="#5c5c5c">offset &amp; laser</text>
  <rect x="431" y="398" width="140" height="34" rx="8" fill="#eef1f5"/>
  <text x="501" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">In-house converting</text>

  <!-- stage 4 -->
  <rect x="604" y="180" width="170" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="689" cy="219" r="17" fill="#3d6b6b"/>
  <text x="689" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
  <text x="689" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Encoding</text>
  <text x="689" y="322" text-anchor="middle" font-size="13" fill="#5c5c5c">UID · NDEF · GS1,</text>
  <text x="689" y="343" text-anchor="middle" font-size="13" fill="#5c5c5c">MIFARE Plus keys</text>
  <rect x="619" y="398" width="140" height="34" rx="8" fill="#eef5f5"/>
  <text x="689" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">SGTIN-96 · DESFire</text>

  <!-- stage 5 (QC — gold attention) -->
  <rect x="792" y="180" width="170" height="290" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
  <circle cx="877" cy="219" r="17" fill="#c39a5f"/>
  <text x="877" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
  <text x="877" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">QC read-test</text>
  <text x="877" y="322" text-anchor="middle" font-size="13" fill="#5c5c5c">Functional test</text>
  <text x="877" y="343" text-anchor="middle" font-size="13" fill="#5c5c5c">+ AQL sampling</text>
  <rect x="807" y="398" width="140" height="34" rx="8" fill="#f7edd6"/>
  <text x="877" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">100% verified</text>

  <!-- stage 6 -->
  <rect x="980" y="180" width="170" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="1065" cy="219" r="17" fill="#2c5454"/>
  <text x="1065" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text>
  <text x="1065" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Export packing</text>
  <text x="1065" y="322" text-anchor="middle" font-size="13" fill="#5c5c5c">FOB / CIF / DDP,</text>
  <text x="1065" y="343" text-anchor="middle" font-size="13" fill="#5c5c5c">DHL, FedEx, sea</text>
  <rect x="995" y="398" width="140" height="34" rx="8" fill="#eef5f5"/>
  <text x="1065" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">To 50+ countries</text>

  <!-- chevrons between stages -->
  <polygon points="212,318 224,328 212,338" fill="#c39a5f"/>
  <polygon points="400,318 412,328 400,338" fill="#c39a5f"/>
  <polygon points="588,318 600,328 588,338" fill="#c39a5f"/>
  <polygon points="776,318 788,328 776,338" fill="#c39a5f"/>
  <polygon points="964,318 976,328 964,338" fill="#c39a5f"/>

  <!-- footer -->
  <line x1="100" y1="540" x2="1100" y2="540" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="576" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Every value-added step in-house — no subcontracted production.</text>
  <text x="600" y="606" text-anchor="middle" font-size="14" fill="#5c5c5c">2 Shenzhen sites · 10 automated lines · records retained seven years</text>
</svg>
