<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Timeline of EU sustainability regulations affecting RFID card sourcing, 2024 to 2027</title>
<desc id="d">A timeline from 2024 to 2027 of EU regulations that turn sustainability claims into compliance. Green Claims Directive, proposed 2024 to 2025, bans vague eco-friendly claims unless backed by EU Ecolabel or an EPD. Packaging and Packaging Waste Regulation (PPWR), 2025, caps virgin plastic in packaging and requires item-level recycled content. ESPR, Regulation EU 2024/1781, rolls out from 2026 with a Digital Product Passport carried by NFC, QR or UHF. EU Battery Passport, Regulation EU 2023/1542, requires a battery passport via QR and NFC from February 2027. Eco-friendly stops being a marketing word and becomes a documented, chip-carried claim.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SUSTAINABILITY BECOMES COMPLIANCE</text>
<text x="600" y="94" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Which EU rule bites when</text>

<!-- Tier 1 card: Green Claims -->
<rect x="221" y="118" width="252" height="120" rx="12" fill="#ffffff" stroke="#e4c98f" stroke-width="1.6"/>
<rect x="221" y="118" width="252" height="7" rx="3.5" fill="#6d5a3a"/>
<text x="237" y="150" text-anchor="start" font-size="16" font-weight="800" fill="#291c0e">Green Claims Directive</text>
<text x="237" y="176" text-anchor="start" font-size="13.5" font-weight="700" fill="#6d5a3a">proposed 2024&#8211;2025</text>
<text x="237" y="204" text-anchor="start" font-size="13" fill="#333333">Bans vague 'eco-friendly' claims</text>
<text x="237" y="226" text-anchor="start" font-size="12" fill="#5c5c5c">unless backed by EU Ecolabel / EPD</text>

<!-- Tier 1 card: ESPR -->
<rect x="661" y="118" width="252" height="120" rx="12" fill="#ffffff" stroke="#a9cbb8" stroke-width="1.6"/>
<rect x="661" y="118" width="252" height="7" rx="3.5" fill="#2d6a4f"/>
<text x="677" y="150" text-anchor="start" font-size="16" font-weight="800" fill="#291c0e">ESPR &#183; Product Passport</text>
<text x="677" y="176" text-anchor="start" font-size="13.5" font-weight="700" fill="#2d6a4f">rollout from 2026</text>
<text x="677" y="204" text-anchor="start" font-size="13" fill="#333333">DPP carrier: NFC, QR or UHF</text>
<text x="677" y="226" text-anchor="start" font-size="12" fill="#5c5c5c">Reg (EU) 2024/1781</text>

<!-- Tier 2 card: PPWR -->
<rect x="367" y="252" width="252" height="120" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="367" y="252" width="252" height="7" rx="3.5" fill="#3d6b6b"/>
<text x="383" y="284" text-anchor="start" font-size="16" font-weight="800" fill="#291c0e">Packaging Reg &#183; PPWR</text>
<text x="383" y="310" text-anchor="start" font-size="13.5" font-weight="700" fill="#2c5454">2025</text>
<text x="383" y="338" text-anchor="start" font-size="13" fill="#333333">Caps virgin plastic in packaging</text>
<text x="383" y="360" text-anchor="start" font-size="12" fill="#5c5c5c">recycled content at item level</text>

<!-- Tier 2 card: Battery Passport -->
<rect x="856" y="252" width="252" height="120" rx="12" fill="#ffffff" stroke="#8fbaa2" stroke-width="1.6"/>
<rect x="856" y="252" width="252" height="7" rx="3.5" fill="#1b4332"/>
<text x="872" y="284" text-anchor="start" font-size="16" font-weight="800" fill="#291c0e">EU Battery Passport</text>
<text x="872" y="310" text-anchor="start" font-size="13.5" font-weight="700" fill="#1b4332">Feb 2027</text>
<text x="872" y="338" text-anchor="start" font-size="13" fill="#333333">Passport via QR + NFC</text>
<text x="872" y="360" text-anchor="start" font-size="12" fill="#5c5c5c">Reg (EU) 2023/1542</text>

<!-- Connectors -->
<line x1="347" y1="238" x2="347" y2="400" stroke="#6d5a3a" stroke-width="2"/>
