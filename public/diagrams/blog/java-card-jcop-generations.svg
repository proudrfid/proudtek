<path d="M 74.5 319 l 2.5 2.5 l 5 -5.5" fill="none" stroke="#2c5454" stroke-width="2"/>
<text x="98" y="324" text-anchor="start" font-size="13" fill="#4f4f4f">MIFARE Plus + DESFire bundles</text>
<rect x="70" y="356" width="292" height="148" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="88" y="384" text-anchor="start" font-size="12" font-weight="700" letter-spacing="1" fill="#2c5454">CERTIFIED</text>
<text x="88" y="410" text-anchor="start" font-size="14" font-weight="600" fill="#291c0e">Common Criteria EAL6+</text>
<text x="88" y="434" text-anchor="start" font-size="12.5" fill="#4f4f4f">composite cert with SmartMX3 P71</text>
<text x="88" y="458" text-anchor="start" font-size="12.5" fill="#4f4f4f">EMV payment · USIM/SIM · gov eID</text>

