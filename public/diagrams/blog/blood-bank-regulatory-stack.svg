<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The blood-bank regulatory stack that one validated RFID record must satisfy</title>
<desc id="d">A layered stack, widest at the base. Bottom to top: 21 CFR Part 606, Good Manufacturing Practice for blood and components; 21 CFR Part 610, biological product standards; 21 CFR Part 630 and 640, source plasma and final product; 21 CFR Part 11, electronic records and signatures, highlighted in gold as the pivot layer; AABB Standards, 33rd edition; and ICCBBA ISBT 128, encoded via ST-021. Resting on top is one validated RFID record, and the same dataset satisfies every layer below. A side panel notes: 606 records count only when the system meets Part 11; AABB accepts electronic crossmatch once validated; ISBT 128 via ST-021 keeps the Donation Identification Number identical across barcode, DataMatrix and RFID; blood for transfusion sits outside DSCSA while plasma-derived therapeutics fall inside it; and look-back under 610.46-48 drops from days to minutes.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE DATASET · MANY REGULATIONS</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Where FDA, AABB and ICCBBA intersect</text>

<!-- capstone -->
<rect x="190" y="120" width="360" height="62" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="214" y="138" width="26" height="26" rx="4" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/><rect x="220" y="144" width="8" height="8" fill="#3d6b6b"/><path d="M 236 143 a 7 7 0 0 1 0 18" fill="none" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="392" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">One validated RFID record</text>
<text x="392" y="168" text-anchor="middle" font-size="12" fill="#4f4f4f">the same dataset satisfies every layer below</text>

<!-- stack bars (base widest) -->
<g text-anchor="middle" font-weight="700" font-size="15" fill="#ffffff">
<rect x="150" y="196" width="440" height="54" rx="9" fill="#1b4332"/><text x="370" y="229">ICCBBA ISBT 128 — encoded via ST-021</text>
<rect x="134" y="254" width="472" height="54" rx="9" fill="#2d6a4f"/><text x="370" y="287">AABB Standards, 33rd edition</text>
<rect x="118" y="312" width="504" height="54" rx="9" fill="#c39a5f"/><text x="370" y="345" fill="#3a2600">21 CFR Part 11 — electronic records &amp; signatures</text>
<rect x="102" y="370" width="536" height="54" rx="9" fill="#3d6b6b"/><text x="370" y="403">21 CFR Part 630 / 640 — source plasma &amp; product</text>
<rect x="86" y="428" width="568" height="54" rx="9" fill="#2c5454"/><text x="370" y="461">21 CFR Part 610 — biological product standards</text>
<rect x="70" y="486" width="600" height="60" rx="9" fill="#234a4a"/><text x="370" y="522">21 CFR Part 606 — GMP for blood &amp; components</text>
</g>
<ellipse cx="370" cy="556" rx="316" ry="10" fill="#efe6d6"/>

<!-- right callouts -->
<text x="712" y="158" font-size="17" font-weight="700" fill="#291c0e">Why the whole stack matters</text>
<g font-size="14" fill="#291c0e">
<circle cx="722" cy="204" r="10" fill="#3d6b6b"/><path d="M 717 204 l 4 5 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="742" y="209">606 records count only when the system meets Part 11.</text>
<circle cx="722" cy="264" r="10" fill="#3d6b6b"/><path d="M 717 264 l 4 5 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="742" y="269">AABB accepts electronic crossmatch — once validated.</text>
<circle cx="722" cy="324" r="10" fill="#3d6b6b"/><path d="M 717 324 l 4 5 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="742" y="329">ISBT 128 via ST-021 keeps the DIN identical across</text>
<text x="742" y="351">the barcode, DataMatrix and RFID carriers.</text>
<circle cx="722" cy="404" r="10" fill="#c39a5f"/><path d="M 717 404 l 4 5 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="742" y="409">Blood for transfusion sits outside DSCSA; plasma-</text>
<text x="742" y="431">derived therapeutics fall inside it.</text>
<circle cx="722" cy="484" r="10" fill="#c39a5f"/><path d="M 717 484 l 4 5 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="742" y="489">Look-back under 610.46-48 drops from days to minutes.</text>
</g>
</svg>
