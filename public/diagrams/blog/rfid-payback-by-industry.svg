<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Average RFID payback period by industry sector, in months</title>
<desc id="d">A horizontal range-bar chart of average payback in months across five sectors on a nought-to-twenty-month axis. Retail apparel pays back in 8 to 14 months. General merchandise retail in 10 to 18 months, the longest. Warehouse and distribution in 6 to 12 months. Manufacturing work-in-progress in 8 to 15 months. Asset-intensive industries in 4 to 10 months, the fastest, shown in green. Asset-intensive and warehouse deployments recover fastest; general-merchandise retail takes longest.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PAYBACK BY SECTOR</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Published payback bands in months — match your sector, not the flattering one.</text>

<!-- gridlines -->
<line x1="320" y1="140" x2="320" y2="470" stroke="#e6dfd2" stroke-width="2"/>
<line x1="520" y1="140" x2="520" y2="470" stroke="#efe7d6" stroke-width="1.4"/>
<line x1="720" y1="140" x2="720" y2="470" stroke="#efe7d6" stroke-width="1.4"/>
<line x1="920" y1="140" x2="920" y2="470" stroke="#efe7d6" stroke-width="1.4"/>
<line x1="1120" y1="140" x2="1120" y2="470" stroke="#efe7d6" stroke-width="1.4"/>
<text x="320" y="492" text-anchor="middle" font-size="12.5" fill="#8a8a8a">0</text>
<text x="520" y="492" text-anchor="middle" font-size="12.5" fill="#8a8a8a">5</text>
<text x="720" y="492" text-anchor="middle" font-size="12.5" fill="#8a8a8a">10</text>
<text x="920" y="492" text-anchor="middle" font-size="12.5" fill="#8a8a8a">15</text>
<text x="1120" y="492" text-anchor="middle" font-size="12.5" fill="#8a8a8a">20</text>
<text x="720" y="516" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">months to full payback</text>

<!-- rows -->
<text x="96" y="190" font-size="14" font-weight="700" fill="#291c0e">Retail apparel</text>
<rect x="640" y="168" width="240" height="34" rx="7" fill="#3d6b6b"/>
<text x="760" y="190" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">8-14</text>

<text x="96" y="253" font-size="14" font-weight="700" fill="#291c0e">General merchandise</text>
<rect x="720" y="231" width="320" height="34" rx="7" fill="#3d6b6b"/>
<text x="880" y="253" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">10-18</text>

<text x="96" y="316" font-size="14" font-weight="700" fill="#291c0e">Warehouse &amp; distribution</text>
<rect x="560" y="294" width="240" height="34" rx="7" fill="#3d6b6b"/>
<text x="680" y="316" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">6-12</text>

<text x="96" y="379" font-size="14" font-weight="700" fill="#291c0e">Manufacturing WIP</text>
<rect x="640" y="357" width="280" height="34" rx="7" fill="#3d6b6b"/>
<text x="780" y="379" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">8-15</text>

<text x="96" y="442" font-size="14" font-weight="700" fill="#291c0e">Asset-intensive</text>
<rect x="480" y="420" width="240" height="34" rx="7" fill="#1f6f3a"/>
<text x="600" y="442" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">4-10</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Asset-intensive and warehouse pay back fastest; general-merchandise retail takes longest.</text>
</svg>
