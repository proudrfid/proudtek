<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Event wristband materials: silicone, fabric and Tyvek compared</title>
<desc id="d">Three event wristband materials in columns. Silicone, the reusable one: multi-year durability, snap or slide removable closure, fully waterproof, $0.80 to $1.50 per unit at MOQ 1K, best for water parks, VIP and recurring venues. Fabric, the festival standard: multi-day single-event durability, one-way slide lock closure, water resistant, $0.50 to $1.00 per unit, best for multi-day music festivals. Tyvek, the one-day workhorse: single-day durability, tamper-evident adhesive closure, splash resistant, $0.15 to $0.35 per unit, best for conferences and expos. A footer notes customization options and that the closure is also the anti-transfer mechanism.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WRISTBAND MATERIALS · PICK BY EVENT DURATION</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Silicone, fabric or Tyvek?</text>

<!-- SILICONE -->
<rect x="64" y="128" width="328" height="400" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="228" y="164" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454">Silicone</text>
<text x="228" y="186" text-anchor="middle" font-size="13" fill="#4f4f4f">the reusable one</text>
<rect x="128" y="212" width="200" height="44" rx="22" fill="#3d6b6b"/>
<rect x="158" y="222" width="36" height="24" rx="5" fill="#5b8a8a"/>
<circle cx="282" cy="234" r="5" fill="#f4efe4"/>
<circle cx="302" cy="234" r="5" fill="#f4efe4"/>
<text x="88" y="300" font-size="14" fill="#4f4f4f">Durability · multi-year, reusable</text>
<text x="88" y="330" font-size="14" fill="#4f4f4f">Closure · snap or slide (removable)</text>
<text x="88" y="360" font-size="14" fill="#4f4f4f">Water · fully waterproof</text>
<text x="88" y="394" font-size="15.5" font-weight="700" fill="#2c5454">$0.80 – $1.50 per unit at MOQ 1K</text>
<text x="88" y="424" font-size="13.5" fill="#5c5c5c">Best for · water parks, VIP, venues</text>
<text x="88" y="484" font-size="12.5" fill="#5c5c5c">Customization · embossed, debossed,</text>
<text x="88" y="504" font-size="12.5" fill="#5c5c5c">colour moulding</text>

<!-- FABRIC -->
<rect x="436" y="128" width="328" height="400" rx="16" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.5"/>
<text x="600" y="164" text-anchor="middle" font-size="19" font-weight="800" fill="#6d5a3a">Fabric (woven)</text>
<text x="600" y="186" text-anchor="middle" font-size="13" fill="#4f4f4f">the festival standard</text>
<rect x="500" y="216" width="200" height="36" rx="6" fill="#c39a5f"/>
<line x1="506" y1="228" x2="694" y2="228" stroke="#a87f45" stroke-width="2"/>
<line x1="506" y1="240" x2="694" y2="240" stroke="#a87f45" stroke-width="2"/>
<rect x="642" y="208" width="22" height="52" rx="7" fill="#6d5a3a"/>
<text x="460" y="300" font-size="14" fill="#4f4f4f">Durability · multi-day, one event</text>
<text x="460" y="330" font-size="14" fill="#4f4f4f">Closure · one-way slide lock</text>
<text x="460" y="360" font-size="14" fill="#4f4f4f">Water · water resistant</text>
<text x="460" y="394" font-size="15.5" font-weight="700" fill="#6d5a3a">$0.50 – $1.00 per unit at MOQ 1K</text>
<text x="460" y="424" font-size="13.5" fill="#5c5c5c">Best for · multi-day music festivals</text>
<text x="460" y="484" font-size="12.5" fill="#5c5c5c">Customization · full-colour</text>
<text x="460" y="504" font-size="12.5" fill="#5c5c5c">sublimation printing</text>

<!-- TYVEK -->
<rect x="808" y="128" width="328" height="400" rx="16" fill="#f4f6f9" stroke="#4a5568" stroke-width="1.5"/>
<text x="972" y="164" text-anchor="middle" font-size="19" font-weight="800" fill="#4a5568">Tyvek / paper</text>
<text x="972" y="186" text-anchor="middle" font-size="13" fill="#4f4f4f">the one-day workhorse</text>
<rect x="872" y="220" width="200" height="26" rx="4" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<rect x="886" y="227" width="14" height="12" rx="2" fill="#c39a5f"/>
<rect x="908" y="227" width="14" height="12" rx="2" fill="#c39a5f"/>
<rect x="930" y="227" width="14" height="12" rx="2" fill="#c39a5f"/>
<rect x="1032" y="214" width="40" height="38" rx="4" fill="#d7dbe2" stroke="#4a5568" stroke-width="1.5"/>
<text x="832" y="300" font-size="14" fill="#4f4f4f">Durability · single day</text>
<text x="832" y="330" font-size="14" fill="#4f4f4f">Closure · adhesive, tamper-evident</text>
<text x="832" y="360" font-size="14" fill="#4f4f4f">Water · splash resistant</text>
<text x="832" y="394" font-size="15.5" font-weight="700" fill="#4a5568">$0.15 – $0.35 per unit at MOQ 1K</text>
<text x="832" y="424" font-size="13.5" fill="#5c5c5c">Best for · conferences and expos</text>
<text x="832" y="484" font-size="12.5" fill="#5c5c5c">Customization · full-colour thermal</text>
<text x="832" y="504" font-size="12.5" fill="#5c5c5c">or offset print</text>

<!-- footer -->
<text x="600" y="576" text-anchor="middle" font-size="14.5" fill="#291c0e">Unit costs at MOQ 1K. Silicone is the only band designed to outlive the event.</text>
<text x="600" y="604" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Read the closure line twice — it is also the anti-transfer mechanism.</text>
</svg>
