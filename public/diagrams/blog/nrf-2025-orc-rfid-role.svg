<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NRF 2025 reframes RFID from inventory tool to loss-prevention forensic layer</title>
<desc id="d">Three stat cards from the NRF Impact of Retail Theft &amp; Violence 2025 report: 67 percent of retailers report transnational organized-retail-crime involvement; violence during theft events rose 17 percent year over year; and 44 percent of retailers increased advanced security-technology spend, with RFID among the top three categories. Below, a role shift from knowing what is missing to holding EPC-level forensic data on what was taken and when, and a note that RFID combined with AI video and EAS gates produces the case files that CORCA prosecutions rely on.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NRF 2025: RFID BECOMES A FORENSIC LAYER</text>
<text x="600" y="88" text-anchor="middle" font-size="15.5" fill="#4f4f4f">The Impact of Retail Theft &amp; Violence 2025 changes what RFID is for.</text>
<rect x="88" y="158" width="336" height="150" rx="14" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.8"/>
<rect x="88" y="158" width="336" height="8" rx="4" fill="#8b2d2d"/>
<text x="256" y="232" text-anchor="middle" font-size="46" font-weight="800" fill="#8b2d2d">67%</text>
<text x="256" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">transnational ORC</text>
<text x="256" y="290" text-anchor="middle" font-size="12.5" fill="#5c5c5c">involvement reported</text>
<rect x="432" y="158" width="336" height="150" rx="14" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.8"/>
<rect x="432" y="158" width="336" height="8" rx="4" fill="#8b2d2d"/>
<text x="600" y="232" text-anchor="middle" font-size="46" font-weight="800" fill="#8b2d2d">+17%</text>
<text x="600" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">violence in theft events</text>
<text x="600" y="290" text-anchor="middle" font-size="12.5" fill="#5c5c5c">year over year</text>
<rect x="776" y="158" width="336" height="150" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="776" y="158" width="336" height="8" rx="4" fill="#3d6b6b"/>
<text x="944" y="232" text-anchor="middle" font-size="46" font-weight="800" fill="#3d6b6b">44%</text>
<text x="944" y="268" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">raised security-tech spend</text>
<text x="944" y="290" text-anchor="middle" font-size="12.5" fill="#5c5c5c">RFID a top-3 category</text>
<rect x="88" y="336" width="1024" height="150" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<text x="300" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#4a5568">know what's missing</text>
<line x1="470" y1="372" x2="600" y2="372" stroke="#c39a5f" stroke-width="5"/>
<polygon points="610,372 596,364 596,380" fill="#c39a5f"/>
<text x="858" y="378" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">EPC-level: what was taken, when</text>
<text x="600" y="430" text-anchor="middle" font-size="13.5" fill="#291c0e">RFID alone won't stop a flash mob. RFID + AI video + RFID-aware EAS gates produces the</text>
<text x="600" y="452" text-anchor="middle" font-size="13.5" fill="#291c0e">chain-of-custody case files that CORCA-class prosecutions rely on.</text>
<text x="600" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">Loss-prevention budget owners now sign off on RFID alongside the CFO.</text>
<text x="600" y="560" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The buyer set widened: RFID moved from an inventory line item to a loss-prevention one.</text>
</svg>
