<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Tap-to-earn POS flow — how one NFC tap becomes loyalty points</title>
<desc id="d">A four-step left-to-right flow on a warm cream card. Step one, tap: the customer taps the loyalty card on the point-of-sale NFC reader. Step two, read: the reader captures the chip UID in under 100 milliseconds at 13.56 megahertz. Step three, resolve: the loyalty engine maps the UID to the member record — examples given are Yotpo, Smile.io or a custom back-end. Step four, reward: points, tier and promotions post, and the receipt prints inside the normal transaction envelope. Teal arrows connect the four steps. Below the flow, a gold-bordered branch shows phone-tap self-service with no app install: the customer taps the same card on an iPhone running iOS 12 or later, or an Android phone, and the pre-programmed NDEF URL opens their loyalty dashboard — a hybrid physical and digital card with zero download. A teal takeaway bar at the bottom reads: one tap, under a second — no app download and no barcode alignment, and points post inside the normal POS transaction envelope.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TAP-TO-EARN AT THE POS</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">How a tap becomes points</text>

<!-- STEP 1 -->
<rect x="54" y="150" width="236" height="150" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="54" y="150" width="236" height="40" rx="14" fill="#3d6b6b"/>
<rect x="54" y="176" width="236" height="14" fill="#3d6b6b"/>
<text x="172" y="177" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1 · TAP</text>
<text x="172" y="228" text-anchor="middle" font-size="13" fill="#291c0e">Customer taps the loyalty</text>
<text x="172" y="250" text-anchor="middle" font-size="13" fill="#291c0e">card on the POS NFC reader</text>
<text x="172" y="280" text-anchor="middle" font-size="12.5" fill="#4f4f4f">no barcode, no app</text>

<!-- STEP 2 -->
<rect x="340" y="150" width="236" height="150" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="340" y="150" width="236" height="40" rx="14" fill="#3d6b6b"/>
<rect x="340" y="176" width="236" height="14" fill="#3d6b6b"/>
<text x="458" y="177" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2 · READ</text>
<text x="458" y="228" text-anchor="middle" font-size="13" fill="#291c0e">Reader captures the UID</text>
<text x="458" y="250" text-anchor="middle" font-size="13" fill="#291c0e">in &lt; 100 ms at 13.56 MHz</text>
<text x="458" y="280" text-anchor="middle" font-size="12.5" fill="#4f4f4f">unique chip ID, not clonable</text>

<!-- STEP 3 -->
<rect x="626" y="150" width="236" height="150" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="626" y="150" width="236" height="40" rx="14" fill="#3d6b6b"/>
<rect x="626" y="176" width="236" height="14" fill="#3d6b6b"/>
<text x="744" y="177" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3 · RESOLVE</text>
<text x="744" y="222" text-anchor="middle" font-size="13" fill="#291c0e">Loyalty engine maps</text>
<text x="744" y="244" text-anchor="middle" font-size="13" fill="#291c0e">UID → member record</text>
<text x="744" y="274" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Yotpo · Smile.io · custom</text>

<!-- STEP 4 -->
<rect x="912" y="150" width="236" height="150" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<rect x="912" y="150" width="236" height="40" rx="14" fill="#c39a5f"/>
<rect x="912" y="176" width="236" height="14" fill="#c39a5f"/>
<text x="1030" y="177" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4 · REWARD</text>
<text x="1030" y="222" text-anchor="middle" font-size="13" fill="#291c0e">Points, tier and promo post</text>
<text x="1030" y="244" text-anchor="middle" font-size="13" fill="#291c0e">receipt in the normal</text>
<text x="1030" y="266" text-anchor="middle" font-size="13" fill="#291c0e">transaction envelope</text>

<!-- arrows -->
<path d="M 296 225 H 334" stroke="#3d6b6b" stroke-width="3" fill="none"/>
<path d="M 334 225 l -12 -6 v 12 z" fill="#3d6b6b"/>
<path d="M 582 225 H 620" stroke="#3d6b6b" stroke-width="3" fill="none"/>
<path d="M 620 225 l -12 -6 v 12 z" fill="#3d6b6b"/>
<path d="M 868 225 H 906" stroke="#c39a5f" stroke-width="3" fill="none"/>
<path d="M 906 225 l -12 -6 v 12 z" fill="#c39a5f"/>

<!-- phone-tap branch -->
<rect x="54" y="340" width="1094" height="112" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.8"/>
<rect x="1000" y="360" width="72" height="72" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="2"/>
<rect x="1012" y="372" width="48" height="48" rx="4" fill="none" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="80" y="378" font-size="15" font-weight="800" fill="#6d5a3a">PHONE-TAP SELF-SERVICE — NO APP INSTALL</text>
<text x="80" y="406" font-size="13.5" fill="#291c0e">Customer taps the same card on an iPhone (iOS 12+) or Android phone; the pre-programmed</text>
<text x="80" y="428" font-size="13.5" fill="#291c0e">NDEF URL opens their loyalty dashboard — a hybrid physical + digital card, zero download.</text>

<!-- takeaway -->
<rect x="54" y="478" width="1094" height="82" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="600" y="512" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">One tap, under a second</text>
<text x="600" y="538" text-anchor="middle" font-size="13.5" fill="#4f4f4f">No app download, no barcode alignment — points post inside the normal POS transaction envelope</text>

<text x="600" y="612" text-anchor="middle" font-size="13" fill="#4f4f4f">The card is a UID carrier; points, tier and member data live in the loyalty engine, not on the card</text>
</svg>
