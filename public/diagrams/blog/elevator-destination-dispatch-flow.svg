<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Conventional elevator access versus destination dispatch</title>
<desc id="d">Two flows compared. Conventional access: the rider boards any available car, presses a floor button inside the cab, and the car stops floor by floor. Destination dispatch: the rider taps a credential at the hall-call panel, the system assigns a specific car, and the rider rides direct with no button inside the cab. Destination dispatch lowers average wait time by 25 to 40 percent during peak hours by grouping riders heading to the same floor and sending the nearest available car, with the credential feeding the destination before boarding.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CONVENTIONAL vs DESTINATION DISPATCH</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Declaring the floor before boarding groups riders and cuts the wait.</text>

<!-- Row A: conventional -->
<text x="64" y="116" font-size="13" font-weight="800" letter-spacing="0.5" fill="#4a5568">CONVENTIONAL ACCESS</text>
<rect x="64" y="128" width="300" height="96" rx="12" fill="#eef0f4" stroke="#a7afbb" stroke-width="2"/>
<circle cx="94" cy="158" r="15" fill="#4a5568"/>
<text x="94" y="163" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="86" y="192" font-size="14.5" font-weight="700" fill="#291c0e">Board any</text>
<text x="86" y="212" font-size="14.5" font-weight="700" fill="#291c0e">available car</text>
<line x1="368" y1="176" x2="444" y2="176" stroke="#a7afbb" stroke-width="2.4"/>
<polygon points="444,170 458,176 444,182" fill="#a7afbb"/>
<rect x="450" y="128" width="300" height="96" rx="12" fill="#eef0f4" stroke="#a7afbb" stroke-width="2"/>
<circle cx="480" cy="158" r="15" fill="#4a5568"/>
<text x="480" y="163" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="472" y="192" font-size="14.5" font-weight="700" fill="#291c0e">Press your floor</text>
<text x="472" y="212" font-size="14.5" font-weight="700" fill="#291c0e">inside the cab</text>
<line x1="754" y1="176" x2="830" y2="176" stroke="#a7afbb" stroke-width="2.4"/>
<polygon points="830,170 844,176 830,182" fill="#a7afbb"/>
<rect x="836" y="128" width="300" height="96" rx="12" fill="#ffffff" stroke="#cdd3da" stroke-width="1.8"/>
<circle cx="866" cy="158" r="15" fill="#4a5568"/>
<text x="866" y="163" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
<text x="858" y="192" font-size="14.5" font-weight="700" fill="#291c0e">Car stops</text>
<text x="858" y="212" font-size="14.5" font-weight="700" fill="#291c0e">floor by floor</text>

<!-- Row B: destination dispatch -->
<text x="64" y="262" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">DESTINATION DISPATCH (DD)</text>
<rect x="64" y="274" width="300" height="96" rx="12" fill="#eef5f5" stroke="#8fb6b6" stroke-width="2"/>
<circle cx="94" cy="304" r="15" fill="#3d6b6b"/>
<text x="94" y="309" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="86" y="338" font-size="14.5" font-weight="700" fill="#291c0e">Tap credential at</text>
<text x="86" y="358" font-size="14.5" font-weight="700" fill="#291c0e">the hall-call panel</text>
<line x1="368" y1="322" x2="444" y2="322" stroke="#8fb6b6" stroke-width="2.4"/>
<polygon points="444,316 458,322 444,328" fill="#8fb6b6"/>
<rect x="450" y="274" width="300" height="96" rx="12" fill="#eef5f5" stroke="#8fb6b6" stroke-width="2"/>
<circle cx="480" cy="304" r="15" fill="#3d6b6b"/>
<text x="480" y="309" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="472" y="338" font-size="14.5" font-weight="700" fill="#291c0e">System assigns</text>
<text x="472" y="358" font-size="14.5" font-weight="700" fill="#291c0e">you a specific car</text>
<line x1="754" y1="322" x2="830" y2="322" stroke="#8fb6b6" stroke-width="2.4"/>
<polygon points="830,316 844,322 830,328" fill="#8fb6b6"/>
<rect x="836" y="274" width="300" height="96" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.2"/>
<circle cx="866" cy="304" r="15" fill="#3d6b6b"/>
<text x="866" y="309" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
<text x="858" y="338" font-size="14.5" font-weight="700" fill="#291c0e">Ride direct —</text>
<text x="858" y="358" font-size="14.5" font-weight="700" fill="#291c0e">no button inside</text>

<!-- stat band -->
<rect x="64" y="408" width="1072" height="176" rx="16" fill="#eef7f5" stroke="#cfe3dd" stroke-width="2"/>
<text x="300" y="486" text-anchor="middle" font-size="60" font-weight="800" fill="#234a4a">25-40%</text>
<text x="300" y="524" text-anchor="middle" font-size="16" font-weight="700" fill="#2c5454">lower average wait</text>
<text x="300" y="548" text-anchor="middle" font-size="14" fill="#4f4f4f">during peak hours</text>
<line x1="560" y1="432" x2="560" y2="560" stroke="#cfe3dd" stroke-width="2"/>
<text x="600" y="452" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">WHY IT'S FASTER</text>
<circle cx="608" cy="486" r="6" fill="#3d6b6b"/>
<text x="626" y="491" font-size="15" fill="#291c0e">Groups riders heading to the same floor</text>
<circle cx="608" cy="518" r="6" fill="#3d6b6b"/>
<text x="626" y="523" font-size="15" fill="#291c0e">Sends the nearest available car</text>
<circle cx="608" cy="550" r="6" fill="#3d6b6b"/>
<text x="626" y="555" font-size="15" fill="#291c0e">Credential feeds the floor before boarding</text>

<text x="600" y="632" text-anchor="middle" font-size="14" fill="#4f4f4f">RFID or mobile credentials declare the destination; the system does the routing.</text>
</svg>
