<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="cgTitle cgDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="cgTitle">Genuine cosmetic unit versus a counterfeit, from the outside</title>
  <desc id="cgDesc">Two visually identical serum bottles sit side by side. The genuine unit on the left carries an item-level NFC tag: a phone tap returns a verified result, shown by a green check and an "authentic" badge. The counterfeit on the right is a perfect physical copy — same box, same foil, same weight — but has nothing to tap, so it can only answer with a question mark. Packaging is the easy part to fake; the proof of authenticity has to move off the outside of the box.</desc>
  <defs>
    <radialGradient id="cgBg" cx="50%" cy="14%" r="95%"><stop offset="0%" stop-color="#f8f1e2"/><stop offset="100%" stop-color="#f2ece0"/></radialGradient>
    <linearGradient id="cgGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbeee4"/><stop offset="1" stop-color="#dcae94"/></linearGradient>
    <linearGradient id="cgGlassF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecebe7"/><stop offset="1" stop-color="#bdb6ad"/></linearGradient>
    <linearGradient id="cgGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9c084"/><stop offset="1" stop-color="#9a8a66"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#cgBg)"/>
  <text x="600" y="58" text-anchor="middle" font-size="15" letter-spacing="3" fill="#9a8a66">ITEM-LEVEL NFC · BRAND PROTECTION</text>
  <text x="600" y="94" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e">Same box. Only one of them can prove it.</text>
  <line x1="600" y1="150" x2="600" y2="560" stroke="#c9b48c" stroke-width="1.5" stroke-dasharray="2 9"/>

  <!-- LEFT: genuine -->
  <text x="300" y="182" text-anchor="middle" font-size="16" letter-spacing="2.5" font-weight="600" fill="#5a4a2e">THE REAL DEAL</text>
  <g>
    <ellipse cx="300" cy="512" rx="118" ry="22" fill="#e4c6ac" opacity=".6"/>
    <rect x="232" y="250" width="136" height="262" rx="26" fill="url(#cgGlass)" stroke="#c88f70" stroke-width="2"/>
    <rect x="250" y="316" width="24" height="168" rx="12" fill="#fff" opacity=".4"/>
    <rect x="244" y="196" width="112" height="58" rx="12" fill="url(#cgGold)"/>
    <rect x="278" y="132" width="44" height="70" rx="8" fill="#e7d3c2" stroke="#c88f70"/>
    <ellipse cx="300" cy="132" rx="28" ry="12" fill="url(#cgGold)"/>
    <text x="300" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#8a5b43">sérum</text>
  </g>
  <g stroke="url(#cgGold)" fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M384 300 a62 62 0 0 1 0 112"/>
    <path d="M410 280 a96 96 0 0 1 0 152" opacity=".55"/>
  </g>
  <g transform="translate(452,300)">
    <circle r="42" fill="#ffffff" stroke="url(#cgGold)" stroke-width="3"/>
    <path d="M-16 3 l11 12 21 -26" fill="none" stroke="#2d6a4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="300" y="576" text-anchor="middle" font-size="19" font-weight="600" fill="#2d6a4f">AUTHENTIC</text>
  <text x="300" y="606" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="19" fill="#4f4535">Taps back. Proves itself. Sleeps well.</text>

  <!-- RIGHT: counterfeit -->
  <text x="900" y="182" text-anchor="middle" font-size="16" letter-spacing="2.5" font-weight="600" fill="#8a7f76">THE PERFECT COPY</text>
  <g opacity=".95">
    <ellipse cx="900" cy="512" rx="118" ry="22" fill="#d8d2ca" opacity=".7"/>
    <rect x="832" y="250" width="136" height="262" rx="26" fill="url(#cgGlassF)" stroke="#a8a199" stroke-width="2"/>
    <rect x="850" y="316" width="24" height="168" rx="12" fill="#fff" opacity=".3"/>
    <rect x="844" y="196" width="112" height="58" rx="12" fill="#b3a99b"/>
    <rect x="878" y="132" width="44" height="70" rx="8" fill="#d6d0c8" stroke="#a8a199"/>
    <ellipse cx="900" cy="132" rx="28" ry="12" fill="#b3a99b"/>
    <text x="900" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#8a7f76">sérum</text>
  </g>
  <g transform="translate(1000,300)">
    <circle r="42" fill="#f7ede8" stroke="#c0837a" stroke-width="3"/>
    <text y="15" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="#a96b58">?</text>
  </g>
  <text x="900" y="576" text-anchor="middle" font-size="19" font-weight="600" fill="#a96b58">UNVERIFIED</text>
  <text x="900" y="606" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="19" fill="#6b6259">Looks identical. Says nothing. Hides plenty.</text>
</svg>
