<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Proud Tek NFC menu: four 13.56 MHz families bonded and encoded on one in-house Shenzhen line</title>
  <desc id="d">A left-to-right map. On the left, a card labelled YOUR NFC SPEC (surface, data, volume, MOQ). In the centre, four NFC product-family lanes we manufacture: NFC stickers and inlays (NTAG 213, NTAG 215, NTAG 216 at 13.56 MHz to ISO/IEC 14443); secure and tamper-evident (NTAG 424 DNA with AES-128 SUN at 13.56 MHz to ISO/IEC 14443); ticketing and transit (MIFARE Ultralight EV1 at 13.56 MHz, single-use); and HF long-range labels (ICODE SLIX2 at 13.56 MHz to ISO/IEC 15693). All four converge on the right into MADE IN-HOUSE: bonded and converted, encoded to spec, 100% read-tested, with documents and certificates.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT OUR SHENZHEN NFC LINE MAKES</text>
  <text x="600" y="99" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Four NFC families, one in-house line</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">Every family bonded, converted and encoded at 13.56 MHz to a published standard.</text>

  <!-- connectors: spec to lanes -->
  <path d="M258,393 L300,204" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,393 L300,330" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,393 L300,456" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,393 L300,582" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <!-- connectors: lanes to made-in-house -->
  <path d="M900,204 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,330 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,456 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,582 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>

  <!-- spec card -->
  <rect x="48" y="318" width="210" height="150" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="153" y="360" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">YOUR</text>
  <text x="153" y="383" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">NFC SPEC</text>
  <text x="153" y="416" text-anchor="middle" font-size="13" fill="#5c5c5c">surface, data,</text>
  <text x="153" y="436" text-anchor="middle" font-size="13" fill="#5c5c5c">volume, MOQ</text>

  <!-- lane 1: stickers and inlays -->
  <rect x="300" y="150" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="150" width="7" height="108" rx="3" fill="#c39a5f"/>
  <text x="324" y="182" font-size="18" font-weight="700" fill="#291c0e">NFC stickers &amp; inlays</text>
  <text x="324" y="210" font-size="14" fill="#5c5c5c">NTAG 213 · NTAG 215 · NTAG 216</text>
  <text x="324" y="238" font-size="14" font-weight="700" fill="#2c5454">13.56 MHz · ISO/IEC 14443</text>

  <!-- lane 2: secure / tamper-evident -->
  <rect x="300" y="276" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="276" width="7" height="108" rx="3" fill="#4a5568"/>
  <text x="324" y="308" font-size="18" font-weight="700" fill="#291c0e">Secure / tamper-evident</text>
  <text x="324" y="336" font-size="14" fill="#5c5c5c">NTAG 424 DNA · AES-128 SUN</text>
  <text x="324" y="364" font-size="14" font-weight="700" fill="#2c5454">13.56 MHz · ISO/IEC 14443</text>

  <!-- lane 3: ticketing and transit -->
  <rect x="300" y="402" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="402" width="7" height="108" rx="3" fill="#3d6b6b"/>
  <text x="324" y="434" font-size="18" font-weight="700" fill="#291c0e">Ticketing &amp; transit</text>
  <text x="324" y="462" font-size="14" fill="#5c5c5c">MIFARE Ultralight EV1</text>
  <text x="324" y="490" font-size="14" font-weight="700" fill="#2c5454">13.56 MHz · single-use</text>

  <!-- lane 4: HF long-range labels -->
  <rect x="300" y="528" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="528" width="7" height="108" rx="3" fill="#6d5a3a"/>
  <text x="324" y="560" font-size="18" font-weight="700" fill="#291c0e">HF long-range labels</text>
  <text x="324" y="588" font-size="14" fill="#5c5c5c">ICODE SLIX2</text>
  <text x="324" y="616" font-size="14" font-weight="700" fill="#2c5454">13.56 MHz · ISO/IEC 15693</text>

  <!-- made in-house card -->
  <rect x="946" y="300" width="214" height="186" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="1053" y="338" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">MADE IN-HOUSE</text>
  <text x="1053" y="372" text-anchor="middle" font-size="14" fill="#291c0e">Bonded &amp; converted</text>
  <text x="1053" y="398" text-anchor="middle" font-size="14" fill="#291c0e">Encoded to spec</text>
  <text x="1053" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">100% read-tested</text>
  <text x="1053" y="450" text-anchor="middle" font-size="14" fill="#291c0e">Docs + certificates</text>
  <text x="1053" y="476" text-anchor="middle" font-size="13" fill="#5c5c5c">Straight to your dock</text>
</svg>
