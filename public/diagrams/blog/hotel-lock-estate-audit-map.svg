<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Lock estate audit map in constraint order</title>
<desc id="d">A four-step audit map for hotel card projects, ordered by constraint. Step one, lock inventory: every brand, model and firmware, including lifts, pool, garage and minibar doors; it constrains the chip family. Step two, encoder fleet: model, firmware and connection for desk and mobile encoders; it constrains write speed and chip support. Step three, PMS bridge: Opera, Mews or Shiji plus the lock-vendor middleware, online or batch; it constrains the issue and re-issue flow. Step four, exceptions and chain rules: master cards, overrides, spares and loyalty credential standards; they constrain everything above. The outcome bar reads: one chip family plus one viable fallback, signed off by operations, IT, security and the lock vendor.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">LOCK ESTATE AUDIT</text>
<text x="600" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Audit in constraint order</text>
<text x="600" y="124" text-anchor="middle" font-size="15" fill="#4f4f4f">Each layer narrows the next — skip one and the chip choice is a guess.</text>

<!-- row 1 -->
<rect x="120" y="156" width="740" height="82" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="164" cy="197" r="20" fill="#3d6b6b"/>
<text x="164" y="203" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">1</text>
<text x="200" y="190" font-size="16.5" font-weight="700" fill="#291c0e">Lock inventory</text>
<text x="200" y="216" font-size="13.5" fill="#4f4f4f">every brand, model, firmware — incl. lifts, pool, garage, safes, minibar</text>
<rect x="884" y="176" width="204" height="42" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="986" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#234a4a">constrains chip family</text>

<!-- arrow -->
<line x1="164" y1="238" x2="164" y2="266" stroke="#c39a5f" stroke-width="3"/>
<path d="M 164 270 l -6 -9 h 12 z" fill="#c39a5f"/>

<!-- row 2 -->
<rect x="120" y="272" width="740" height="82" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="164" cy="313" r="20" fill="#3d6b6b"/>
<text x="164" y="319" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">2</text>
<text x="200" y="306" font-size="16.5" font-weight="700" fill="#291c0e">Encoder fleet</text>
<text x="200" y="332" font-size="13.5" fill="#4f4f4f">model, firmware, connection — every desk, plus the housekeeping mobiles</text>
<rect x="884" y="292" width="204" height="42" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="986" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#234a4a">constrains write speed</text>
<text x="986" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#234a4a">+ chip support</text>

<!-- arrow -->
<line x1="164" y1="354" x2="164" y2="382" stroke="#c39a5f" stroke-width="3"/>
<path d="M 164 386 l -6 -9 h 12 z" fill="#c39a5f"/>

<!-- row 3 -->
<rect x="120" y="388" width="740" height="82" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="164" cy="429" r="20" fill="#3d6b6b"/>
<text x="164" y="435" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">3</text>
<text x="200" y="422" font-size="16.5" font-weight="700" fill="#291c0e">PMS bridge</text>
<text x="200" y="448" font-size="13.5" fill="#4f4f4f">Opera / Mews / Shiji + lock-vendor middleware — online vs batch issue</text>
<rect x="884" y="408" width="204" height="42" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="986" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#234a4a">constrains issue</text>
<text x="986" y="444" text-anchor="middle" font-size="13" font-weight="700" fill="#234a4a">+ re-issue flow</text>

<!-- arrow -->
<line x1="164" y1="470" x2="164" y2="498" stroke="#c39a5f" stroke-width="3"/>
<path d="M 164 502 l -6 -9 h 12 z" fill="#c39a5f"/>

<!-- row 4 -->
<rect x="120" y="504" width="740" height="82" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="164" cy="545" r="20" fill="#3d6b6b"/>
<text x="164" y="551" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">4</text>
<text x="200" y="538" font-size="16.5" font-weight="700" fill="#291c0e">Exceptions &amp; chain rules</text>
<text x="200" y="564" font-size="13.5" fill="#4f4f4f">masters, overrides, spares, fire-drill mode — plus the loyalty credential standard</text>
<rect x="884" y="524" width="204" height="42" rx="10" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.5"/>
<text x="986" y="550" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">constrain everything</text>

<!-- outcome -->
<rect x="120" y="606" width="968" height="40" rx="10" fill="#3d6b6b"/>
<text x="604" y="631" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Outcome: one chip family + one viable fallback — signed off by ops, IT, security and the lock vendor</text>
</svg>
