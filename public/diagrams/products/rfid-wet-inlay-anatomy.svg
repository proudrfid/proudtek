<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Anatomy of a wet UHF RFID inlay</title>
  <desc id="d">A wet UHF RFID inlay drawn as an annotated anatomy. A UHF chip on a metal strap sits at the centre of an etched-aluminium dipole antenna, all carried on a 23-50 µm PET web. The inlay is a sub-component, not a finished label, and it is tuned across the global UHF RAIN band of 860-960 MHz. The permanent acrylic PSA and release liner that make it a wet inlay are added beneath this core.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANATOMY OF A WET UHF INLAY</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#5c5c5c">Chip on a strap · etched-aluminium dipole · 23-50 µm PET web</text>

  <!-- PET web -->
  <rect x="310" y="250" width="580" height="150" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>

  <!-- dogbone dipole antenna -->
  <ellipse cx="400" cy="323" rx="60" ry="42" fill="none" stroke="#3d6b6b" stroke-width="10"/>
  <ellipse cx="800" cy="323" rx="60" ry="42" fill="none" stroke="#3d6b6b" stroke-width="10"/>
  <rect x="460" y="317" width="120" height="12" fill="#3d6b6b"/>
  <rect x="620" y="317" width="120" height="12" fill="#3d6b6b"/>

  <!-- chip on strap -->
  <rect x="572" y="304" width="56" height="38" rx="5" fill="#e9edf1" stroke="#4a5568" stroke-width="2"/>
  <rect x="590" y="311" width="20" height="24" rx="2" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>

  <!-- chip callout (top) -->
  <text x="600" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#2c5454">UHF chip on a strap</text>
  <text x="600" y="200" text-anchor="middle" font-size="13.5" fill="#5c5c5c">flip-chip bonded to the antenna</text>
  <line x1="600" y1="214" x2="600" y2="300" stroke="#4a5568" stroke-width="2"/>
  <circle cx="600" cy="300" r="4" fill="#4a5568"/>

  <!-- antenna callout (left) -->
  <text x="300" y="300" text-anchor="end" font-size="16" font-weight="700" fill="#2c5454">Etched-aluminium</text>
  <text x="300" y="322" text-anchor="end" font-size="16" font-weight="700" fill="#2c5454">dipole antenna</text>
  <text x="300" y="344" text-anchor="end" font-size="13" fill="#5c5c5c">two bones + centre arms</text>
  <line x1="308" y1="320" x2="338" y2="323" stroke="#3d6b6b" stroke-width="2"/>
  <circle cx="340" cy="323" r="4" fill="#3d6b6b"/>

  <!-- PET callout (bottom) -->
  <line x1="600" y1="400" x2="600" y2="436" stroke="#c39a5f" stroke-width="2"/>
  <circle cx="600" cy="400" r="4" fill="#c39a5f"/>
  <text x="600" y="456" text-anchor="middle" font-size="16" font-weight="700" fill="#6d5a3a">23-50 µm PET web</text>
  <text x="600" y="478" text-anchor="middle" font-size="13" fill="#5c5c5c">the carrier film — a sub-component, not a label</text>

  <!-- band -->
  <rect x="300" y="556" width="600" height="76" rx="16" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="588" text-anchor="middle" font-size="16" font-weight="600" fill="#2c5454">Sub-component: chip + antenna on film</text>
  <text x="600" y="613" text-anchor="middle" font-size="15" fill="#3d6b6b">tuned across the global UHF RAIN band · 860-960 MHz</text>
</svg>
