<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Which printing method cooperates with which card material</title>
<desc id="d">Selection guide with four method cards. Dye-sublimation: photo-quality, edge-to-edge colour, the hotel-key and membership standard — prints happily on PVC. Retransfer: grips smooth surfaces beautifully at a slightly higher cost per card — PET, PETG and ABS. Laser engraving: tamper-evident marks that cannot be reprinted or altered, secure-ID grade — PC, PVC and ABS. UV inkjet: low heat, full colour, no tooling charges for small runs — wood and paper. Footnote: PET and PETG want corona or plasma prep first; ABS warps if retransfer runs hot — send the printer model with the RFQ.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PRINTING &amp; PERSONALIZATION</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Which printer will actually cooperate</text>

<rect x="76" y="140" width="520" height="200" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="100" y="180" font-size="18" font-weight="700" fill="#291c0e">Dye-sublimation</text>
<text x="100" y="208" font-size="13.5" fill="#4f4f4f">Photo-quality, edge-to-edge colour —</text>
<text x="100" y="228" font-size="13.5" fill="#4f4f4f">the hotel-key and membership standard.</text>
<text x="100" y="262" font-size="12" font-weight="800" letter-spacing="1" fill="#6d5a3a">PRINTS HAPPILY ON</text>
<rect x="100" y="276" width="70" height="30" rx="15" fill="#3d6b6b"/>
<text x="135" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">PVC</text>

<rect x="604" y="140" width="520" height="200" rx="14" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.5"/>
<text x="628" y="180" font-size="18" font-weight="700" fill="#291c0e">Retransfer (reverse-transfer)</text>
<text x="628" y="208" font-size="13.5" fill="#4f4f4f">Grips smooth surfaces beautifully,</text>
<text x="628" y="228" font-size="13.5" fill="#4f4f4f">at a slightly higher cost per card.</text>
<text x="628" y="262" font-size="12" font-weight="800" letter-spacing="1" fill="#6d5a3a">PRINTS HAPPILY ON</text>
<rect x="628" y="276" width="70" height="30" rx="15" fill="#4a5568"/>
<text x="663" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">PET</text>
<rect x="708" y="276" width="82" height="30" rx="15" fill="#2d6a4f"/>
<text x="749" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">PETG</text>
<rect x="800" y="276" width="70" height="30" rx="15" fill="#a97f43"/>
<text x="835" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">ABS</text>

<rect x="76" y="368" width="520" height="200" rx="14" fill="#e8efef" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="100" y="408" font-size="18" font-weight="700" fill="#291c0e">Laser engraving</text>
<text x="100" y="436" font-size="13.5" fill="#4f4f4f">Tamper-evident marks that can't be</text>
<text x="100" y="456" font-size="13.5" fill="#4f4f4f">reprinted or altered — secure-ID grade.</text>
<text x="100" y="490" font-size="12" font-weight="800" letter-spacing="1" fill="#6d5a3a">PRINTS HAPPILY ON</text>
<rect x="100" y="504" width="62" height="30" rx="15" fill="#234a4a"/>
<text x="131" y="524" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">PC</text>
<rect x="172" y="504" width="70" height="30" rx="15" fill="#3d6b6b"/>
<text x="207" y="524" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">PVC</text>
<rect x="252" y="504" width="70" height="30" rx="15" fill="#a97f43"/>
<text x="287" y="524" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">ABS</text>

<rect x="604" y="368" width="520" height="200" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="628" y="408" font-size="18" font-weight="700" fill="#291c0e">UV inkjet</text>
<text x="628" y="436" font-size="13.5" fill="#4f4f4f">Low heat, full colour, no tooling</text>
<text x="628" y="456" font-size="13.5" fill="#4f4f4f">charges for small runs.</text>
<text x="628" y="490" font-size="12" font-weight="800" letter-spacing="1" fill="#6d5a3a">PRINTS HAPPILY ON</text>
<rect x="628" y="504" width="84" height="30" rx="15" fill="#7a5636"/>
<text x="670" y="524" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">WOOD</text>
<rect x="722" y="504" width="86" height="30" rx="15" fill="#7d7060"/>
<text x="765" y="524" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">PAPER</text>

<text x="600" y="628" text-anchor="middle" font-size="13.5" fill="#5c5c5c">PET and PETG want corona or plasma prep first; ABS warps if retransfer runs hot — send the printer model with the RFQ.</text>
</svg>
