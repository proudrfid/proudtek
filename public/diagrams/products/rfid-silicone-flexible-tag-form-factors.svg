<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The six silicone flex-RFID form factors with their dimensions</title>
  <desc id="d">Lineup of the six flexible form factors: cable-wrap loop of 5 to 60 mm diameter and 30 to 150 mm length, flat flexible patch of 30 by 20 by 2 mm, hose-ID wrap band of 50 by 15 by 3 mm with a 316L buckle, sew-on soft badge of 40 by 20 by 3 mm with 1.5 mm sew holes, adjustable wristband loop of 25 by 150 mm, and an overmoulded flush button of 18 by 5 mm. All six share the same IPC-6013 Class 3 / A flex-qualified inlay.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SIX FORM FACTORS, ONE STACK</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#5c5c5c">Wrap it, patch it, sew it, wear it — or bury it flush</text>

  <!-- row 1 -->
  <rect x="76" y="122" width="340" height="222" rx="14" fill="#faf6ec" stroke="#e6dfd2" stroke-width="1.5"/>
  <ellipse cx="246" cy="204" rx="64" ry="38" fill="none" stroke="#3d6b6b" stroke-width="11"/>
  <rect x="298" y="192" width="22" height="24" rx="3" fill="#4a5568"/>
  <text x="246" y="292" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Cable-wrap loop</text>
  <text x="246" y="318" text-anchor="middle" font-size="13" fill="#3d6b6b">Ø 5-60 mm · 30-150 mm length</text>

  <rect x="430" y="122" width="340" height="222" rx="14" fill="#faf6ec" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="536" y="168" width="128" height="74" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="5"/>
  <rect x="586" y="196" width="28" height="16" rx="2" fill="#291c0e"/>
  <text x="600" y="292" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Flat flexible patch</text>
  <text x="600" y="318" text-anchor="middle" font-size="13" fill="#3d6b6b">30 × 20 × 2 mm</text>

  <rect x="784" y="122" width="340" height="222" rx="14" fill="#faf6ec" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="834" y="188" width="220" height="34" rx="16" fill="#ffffff" stroke="#3d6b6b" stroke-width="5"/>
  <rect x="1032" y="182" width="26" height="46" rx="4" fill="#4a5568"/>
  <text x="954" y="292" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Hose-ID wrap band</text>
  <text x="954" y="318" text-anchor="middle" font-size="13" fill="#3d6b6b">50 × 15 × 3 mm · 316L buckle</text>

  <!-- row 2 -->
  <rect x="76" y="362" width="340" height="222" rx="14" fill="#faf6ec" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="166" y="408" width="160" height="84" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="5"/>
  <circle cx="182" cy="424" r="5" fill="none" stroke="#6d5a3a" stroke-width="2.5"/>
  <circle cx="310" cy="424" r="5" fill="none" stroke="#6d5a3a" stroke-width="2.5"/>
  <circle cx="182" cy="476" r="5" fill="none" stroke="#6d5a3a" stroke-width="2.5"/>
  <circle cx="310" cy="476" r="5" fill="none" stroke="#6d5a3a" stroke-width="2.5"/>
  <text x="246" y="532" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Sew-on soft badge</text>
  <text x="246" y="558" text-anchor="middle" font-size="13" fill="#3d6b6b">40 × 20 × 3 mm · 1.5 mm sew holes</text>

  <rect x="430" y="362" width="340" height="222" rx="14" fill="#faf6ec" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="516" y="404" width="168" height="96" rx="42" fill="none" stroke="#3d6b6b" stroke-width="13"/>
  <circle cx="600" cy="404" r="11" fill="#4a5568"/>
  <text x="600" y="532" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Wristband loop</text>
  <text x="600" y="558" text-anchor="middle" font-size="13" fill="#3d6b6b">25 × 150 mm · adjustable snap-lock</text>

  <rect x="784" y="362" width="340" height="222" rx="14" fill="#faf6ec" stroke="#e6dfd2" stroke-width="1.5"/>
  <circle cx="954" cy="452" r="44" fill="#ffffff" stroke="#3d6b6b" stroke-width="6"/>
  <circle cx="954" cy="452" r="17" fill="none" stroke="#6d5a3a" stroke-width="3"/>
  <text x="954" y="532" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Overmoulded button</text>
  <text x="954" y="558" text-anchor="middle" font-size="13" fill="#3d6b6b">18 × 5 mm · flush-mount</text>

  <text x="600" y="628" text-anchor="middle" font-size="14" fill="#6d5a3a">All six carry the same flex-qualified inlay — IPC-6013 Class 3 / A</text>
</svg>
