<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Six reasons an NFC tag fails to scan on iPhone, sorted into four groups</title>
<desc id="d">A two-by-two map of iPhone NFC scan failures. Chip compatibility: the wrong frequency, such as a 125 kHz LF or UHF tag iOS cannot detect, or a tag locked with Crypto-1 as MIFARE Classic uses. Data: a missing or malformed NDEF message that iOS ignores. Position and interference: the tag tapped away from the top antenna, or a metal surface detuning the antenna, which ferrite anti-metal tags fix. Physical damage: a cracked antenna or broken chip bond, usually from bending or a puncture.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY A TAG FAILS TO SCAN ON iPHONE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Six causes, four groups — clear a whole group at a glance.</text>

<!-- TL: CHIP -->
<rect x="64" y="120" width="520" height="184" rx="13" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<rect x="64" y="120" width="520" height="8" rx="4" fill="#3d6b6b"/>
<text x="92" y="174" font-size="17" font-weight="800" letter-spacing="0.3" fill="#2c5454">CHIP COMPATIBILITY</text>
<text x="92" y="216" font-size="14" fill="#5c5c5c">• Wrong frequency — 125 kHz LF/UHF tags iOS can't read</text>
<text x="92" y="250" font-size="14" fill="#5c5c5c">• Locked with Crypto-1 (MIFARE Classic) — unsupported</text>

<!-- TR: DATA -->
<rect x="616" y="120" width="520" height="184" rx="13" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<rect x="616" y="120" width="520" height="8" rx="4" fill="#c39a5f"/>
<text x="644" y="174" font-size="17" font-weight="800" letter-spacing="0.3" fill="#8a6d34">DATA</text>
<text x="644" y="216" font-size="14" fill="#5c5c5c">• Missing or malformed NDEF message</text>
<text x="644" y="250" font-size="14" fill="#5c5c5c">• iOS ignores a blank or badly formatted tag</text>

<!-- BL: POSITION -->
<rect x="64" y="328" width="520" height="184" rx="13" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<rect x="64" y="328" width="520" height="8" rx="4" fill="#4a5568"/>
<text x="92" y="382" font-size="17" font-weight="800" letter-spacing="0.3" fill="#3b4557">POSITION &amp; INTERFERENCE</text>
<text x="92" y="424" font-size="14" fill="#5c5c5c">• Tapped mid-phone, away from the top antenna</text>
<text x="92" y="458" font-size="14" fill="#5c5c5c">• Metal detunes it — use ferrite anti-metal tags</text>

<!-- BR: DAMAGE (genuine failure state) -->
<rect x="616" y="328" width="520" height="184" rx="13" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.8"/>
<rect x="616" y="328" width="520" height="8" rx="4" fill="#8b2d2d"/>
<text x="644" y="382" font-size="17" font-weight="800" letter-spacing="0.3" fill="#8b2d2d">PHYSICAL DAMAGE</text>
<text x="644" y="424" font-size="14" fill="#5c5c5c">• Cracked antenna or broken chip bond</text>
<text x="644" y="458" font-size="14" fill="#5c5c5c">• Usually from sharp bending or a puncture</text>

<text x="600" y="566" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Work the cheap causes first — position and NDEF outrank a truly dead chip.</text>
</svg>
