<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Layered access-control defenses beyond swapping the card</title>
<desc id="d">Five defensive layers wrapping a protected asset. OSDP v2 Secure Channel puts AES-128 on the reader-to-panel link and ends Wiegand sniffing. Mobile credentials keep keys in the phone's Secure Element, released only after a biometric. Two-factor at sensitive doors pairs a card with a PIN or biometric. Anti-passback and analytics flag the same badge in two places or entries at odd hours. Program hygiene means revoking lost cards fast, refusing tailgating and rotating shared cards. At the center sit the protected assets: server rooms, executive areas, cash rooms and pharmacy storage.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">LAYERS BEYOND THE CREDENTIAL</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Assume a card will eventually be compromised, then add layers that detect or contain it.</text>

<!-- layer 1 -->
<rect x="90" y="120" width="1020" height="58" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<rect x="90" y="120" width="10" height="58" rx="4" fill="#6fa3a3"/>
<text x="120" y="155" font-size="15" font-weight="800" fill="#234a4a">OSDP v2 Secure Channel</text>
<text x="470" y="155" font-size="13" fill="#333333">AES-128 on the reader-to-panel link — ends Wiegand cable sniffing</text>

<!-- layer 2 -->
<rect x="90" y="190" width="1020" height="58" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<rect x="90" y="190" width="10" height="58" rx="4" fill="#4d8686"/>
<text x="120" y="225" font-size="15" font-weight="800" fill="#234a4a">Mobile credentials</text>
<text x="470" y="225" font-size="13" fill="#333333">keys in the phone's Secure Element, released only after a biometric</text>

<!-- layer 3 -->
<rect x="90" y="260" width="1020" height="58" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<rect x="90" y="260" width="10" height="58" rx="4" fill="#3d6b6b"/>
<text x="120" y="295" font-size="15" font-weight="800" fill="#234a4a">Two-factor at sensitive doors</text>
<text x="470" y="295" font-size="13" fill="#333333">card plus PIN or biometric where the stakes are highest</text>

<!-- layer 4 -->
<rect x="90" y="330" width="1020" height="58" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<rect x="90" y="330" width="10" height="58" rx="4" fill="#2c5454"/>
<text x="120" y="365" font-size="15" font-weight="800" fill="#234a4a">Anti-passback + analytics</text>
<text x="470" y="365" font-size="13" fill="#333333">flags the same badge in two places, or entries at impossible hours</text>

<!-- layer 5 -->
<rect x="90" y="400" width="1020" height="58" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<rect x="90" y="400" width="10" height="58" rx="4" fill="#234a4a"/>
<text x="120" y="435" font-size="15" font-weight="800" fill="#234a4a">Program hygiene</text>
<text x="470" y="435" font-size="13" fill="#333333">revoke lost cards fast, refuse tailgating, rotate shared cards</text>

<!-- protected asset -->
<rect x="90" y="472" width="1020" height="66" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<rect x="90" y="472" width="10" height="66" rx="4" fill="#6d5a3a"/>
<text x="120" y="511" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PROTECTED ASSET</text>
<text x="470" y="511" font-size="13" fill="#333333">server rooms · executive areas · cash rooms · pharmacy storage</text>

<text x="600" y="576" text-anchor="middle" font-size="14" fill="#5c5c5c">Clone-resistant cards close the biggest hole; these layers catch what still slips through.</text>
</svg>
