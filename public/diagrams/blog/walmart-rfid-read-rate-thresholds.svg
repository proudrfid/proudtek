<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Walmart DC first-pass read-rate thresholds and their financial consequences</title>
<desc id="d">Four tiers of first-pass read rate at DC receiving, from best to worst. At or above ninety-eight percent is the target and a clean pass with no deduction. Ninety-five to ninety-eight percent logs a warning but no chargeback. Below ninety-five percent begins per-unit chargebacks. Below eighty-five percent escalates to a Supplier Quality Review under Supplier Standard SS2-004 section 5.3.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DC VERIFICATION · READ-RATE THRESHOLDS</text>
<text x="600" y="95" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">What the tunnel reader decides</text>
<text x="600" y="126" text-anchor="middle" font-size="15" fill="#4f4f4f">First-pass read rate at DC receiving sets the financial outcome — thresholds per SS2-004 §5.3.</text>

<rect x="110" y="166" width="980" height="82" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<rect x="110" y="166" width="12" height="82" rx="6" fill="#1f6f3a"/>
<text x="150" y="218" font-size="31" font-weight="800" fill="#1f6f3a">≥ 98.0%</text>
<text x="470" y="203" font-size="17" font-weight="700" fill="#291c0e">Target — clean pass</text>
<text x="470" y="227" font-size="14.5" fill="#4f4f4f">Shipment clears receiving with no deduction.</text>

<rect x="110" y="258" width="980" height="82" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<rect x="110" y="258" width="12" height="82" rx="6" fill="#c39a5f"/>
<text x="150" y="310" font-size="31" font-weight="800" fill="#8a6a2f">95 – 98%</text>
<text x="470" y="295" font-size="17" font-weight="700" fill="#291c0e">Warning logged — no chargeback yet</text>
<text x="470" y="319" font-size="14.5" fill="#4f4f4f">A shot across the bow; fix it before the next pallet.</text>

<rect x="110" y="350" width="980" height="82" rx="14" fill="#fbf3f3" stroke="#e6c9c9" stroke-width="1.6"/>
<rect x="110" y="350" width="12" height="82" rx="6" fill="#b3564a"/>
<text x="150" y="402" font-size="31" font-weight="800" fill="#8b2d2d">&lt; 95%</text>
<text x="470" y="387" font-size="17" font-weight="700" fill="#291c0e">Per-unit chargebacks begin</text>
<text x="470" y="411" font-size="14.5" fill="#4f4f4f">Deductions post to the invoice within the billing cycle.</text>

<rect x="110" y="442" width="980" height="82" rx="14" fill="#f7ecec" stroke="#e0b9b9" stroke-width="1.6"/>
<rect x="110" y="442" width="12" height="82" rx="6" fill="#8b2d2d"/>
<text x="150" y="494" font-size="31" font-weight="800" fill="#7a2323">&lt; 85%</text>
<text x="470" y="479" font-size="17" font-weight="700" fill="#291c0e">Supplier Quality Review escalation</text>
<text x="470" y="503" font-size="14.5" fill="#4f4f4f">Non-compliant with the mandate; formal remediation.</text>

<text x="600" y="574" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Two points of read rate separate a clean pass from a deduction — which is why inlay quality pays back fast.</text>
</svg>
