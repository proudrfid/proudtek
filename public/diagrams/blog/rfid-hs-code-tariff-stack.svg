<text x="236" y="210" font-size="13" font-weight="800" letter-spacing="0.3" fill="#ffffff">PRODUCT</text>
<text x="566" y="210" font-size="13" font-weight="800" letter-spacing="0.3" fill="#ffffff">US · CHINA ORIGIN</text>
<text x="832" y="210" font-size="13" font-weight="800" letter-spacing="0.3" fill="#ffffff">EU</text>
<text x="966" y="210" font-size="13" font-weight="800" letter-spacing="0.3" fill="#ffffff">FTA 0% PATH</text>
<rect x="76" y="228" width="1048" height="56" fill="#ffffff"/>
