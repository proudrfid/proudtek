<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How RFID and QR credentials fail under degraded venue conditions</title>
<desc id="d">Five real-world venue conditions compared. In bright sunlight RFID is unaffected while QR sees 5 to 15 percent scan-fail rates. In rain and wet venues RFID stays waterproof and scanning while QR paper smudges and wet screens fail. With a dead phone battery RFID has no battery to die while the QR ticket becomes useless. During a network outage RFID keeps validating from cached identifiers while QR needs live connectivity. For screenshot and counterfeit sharing RFID is bound to the wristband while a QR code is screenshot-shareable.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW EACH FAILS IN THE REAL WORLD</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">Happy-path throughput is close; the gap opens when conditions degrade.</text>

<text x="64" y="126" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8a8a8a">CONDITION</text>
<text x="486" y="126" font-size="13" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">RFID</text>
<text x="838" y="126" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">QR</text>
<line x1="64" y1="138" x2="1136" y2="138" stroke="#e6dfd2" stroke-width="1.6"/>

<!-- Row 1: sunlight (center 178) -->
<text x="64" y="184" font-size="16" font-weight="700" fill="#291c0e">Bright sunlight</text>
<rect x="470" y="154" width="300" height="48" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<path d="M486 178 l7 8 l13 -17" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="516" y="183" font-size="14" font-weight="600" fill="#1f6f3a">Unaffected</text>
<rect x="820" y="154" width="300" height="48" rx="10" fill="#f7ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<path d="M836 172 l14 14 M850 172 l-14 14" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/>
<text x="866" y="183" font-size="14" font-weight="700" fill="#8b2d2d">5-15% scan-fail</text>

<!-- Row 2: rain (center 248) -->
<text x="64" y="254" font-size="16" font-weight="700" fill="#291c0e">Rain &amp; wet venues</text>
<rect x="470" y="224" width="300" height="48" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<path d="M486 248 l7 8 l13 -17" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="516" y="253" font-size="14" font-weight="600" fill="#1f6f3a">Waterproof — keeps scanning</text>
<rect x="820" y="224" width="300" height="48" rx="10" fill="#f7ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<path d="M836 242 l14 14 M850 242 l-14 14" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/>
<text x="866" y="253" font-size="14" font-weight="700" fill="#8b2d2d">Smudges; wet screens fail</text>

<!-- Row 3: dead battery (center 318) -->
<text x="64" y="324" font-size="16" font-weight="700" fill="#291c0e">Dead phone battery</text>
<rect x="470" y="294" width="300" height="48" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<path d="M486 318 l7 8 l13 -17" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="516" y="323" font-size="14" font-weight="600" fill="#1f6f3a">No battery to die</text>
<rect x="820" y="294" width="300" height="48" rx="10" fill="#f7ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<path d="M836 312 l14 14 M850 312 l-14 14" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/>
<text x="866" y="323" font-size="14" font-weight="700" fill="#8b2d2d">Ticket becomes useless</text>

<!-- Row 4: network (center 388) -->
<text x="64" y="394" font-size="16" font-weight="700" fill="#291c0e">Network outage</text>
<rect x="470" y="364" width="300" height="48" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<path d="M486 388 l7 8 l13 -17" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="516" y="393" font-size="14" font-weight="600" fill="#1f6f3a">Cached UIDs keep validating</text>
<rect x="820" y="364" width="300" height="48" rx="10" fill="#f7ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<path d="M836 382 l14 14 M850 382 l-14 14" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/>
<text x="866" y="393" font-size="14" font-weight="700" fill="#8b2d2d">Needs live connectivity</text>

<!-- Row 5: sharing (center 458) -->
<text x="64" y="464" font-size="16" font-weight="700" fill="#291c0e">Screenshot / sharing</text>
<rect x="470" y="434" width="300" height="48" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<path d="M486 458 l7 8 l13 -17" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="516" y="463" font-size="14" font-weight="600" fill="#1f6f3a">Bound to the wristband</text>
<rect x="820" y="434" width="300" height="48" rx="10" fill="#f7ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<path d="M836 452 l14 14 M850 452 l-14 14" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/>
<text x="866" y="463" font-size="14" font-weight="700" fill="#8b2d2d">Screenshot-shareable</text>

<text x="600" y="524" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The failure modes matter most at large or outdoor events — sun, rain, dead phones and dead networks.</text>
<text x="600" y="556" text-anchor="middle" font-size="13" fill="#8a8a8a">Sunlight scan-fail rate per this article; other outcomes are the documented behaviours of each credential.</text>
</svg>
