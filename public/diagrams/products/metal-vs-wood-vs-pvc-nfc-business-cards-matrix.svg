<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">PVC vs metal vs wood NFC business card comparison matrix</title>
  <desc id="d">A comparison matrix across three NFC business-card materials. PVC: $1.50-$4 per card at a 500 run, 5-6 g, 10-25% twelve-month keep-rate, full-spec NFC read, full-colour print, 12-18 month lifetime, best for team rollouts of 50 to 10,000. Metal: $12-$45, 20-30 g, 60-75% keep-rate, needs an on-metal antenna adding 15-30%, laser-etch and PVD finishing, employee-tenure lifetime, best for executive and durability. Wood: $6-$18, light, mid keep-rate, read range reduced 20-30%, laser-burnt branding, 2-5 year lifetime, best for eco and boutique.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PVC vs METAL vs WOOD — NFC BUSINESS CARDS</text>
  <text x="600" y="82" text-anchor="middle" font-size="15" fill="#5c5c5c">Material reshapes cost, read range, retention and the sustainability story — pick to the recipient</text>

  <!-- column headers -->
  <rect x="60" y="104" width="284" height="40" rx="6" fill="#ffffff"/>
  <rect x="348" y="104" width="264" height="40" rx="6" fill="#3d6b6b"/>
  <text x="480" y="130" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">PVC</text>
  <rect x="616" y="104" width="264" height="40" rx="6" fill="#4a5568"/>
  <text x="748" y="130" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">METAL</text>
  <rect x="884" y="104" width="256" height="40" rx="6" fill="#8a6d3b"/>
  <text x="1012" y="130" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">WOOD</text>

  <!-- rows -->
  <!-- helper: label col x=72; PVC 356; METAL 624; WOOD 892 (left-aligned +12) -->
  <rect x="60" y="150" width="1080" height="52" rx="6" fill="#f7f4ec"/>
  <text x="72" y="181" font-size="14" font-weight="700" fill="#291c0e">Cost · 500-card run</text>
  <text x="360" y="181" font-size="14" fill="#291c0e">$1.50–$4</text>
  <text x="628" y="181" font-size="14" fill="#291c0e">$12–$45</text>
  <text x="896" y="181" font-size="14" fill="#291c0e">$6–$18</text>

  <rect x="60" y="206" width="1080" height="52" rx="6" fill="#ffffff"/>
  <text x="72" y="237" font-size="14" font-weight="700" fill="#291c0e">Weight in the hand</text>
  <text x="360" y="237" font-size="14" fill="#291c0e">5–6 g</text>
  <text x="628" y="237" font-size="14" fill="#291c0e">20–30 g</text>
  <text x="896" y="237" font-size="14" fill="#291c0e">Light, warm</text>

  <rect x="60" y="262" width="1080" height="52" rx="6" fill="#f7f4ec"/>
  <text x="72" y="293" font-size="14" font-weight="700" fill="#291c0e">12-month keep-rate</text>
  <text x="360" y="293" font-size="14" fill="#291c0e">10–25%</text>
  <text x="628" y="293" font-size="14" font-weight="700" fill="#1f6f3a">60–75%</text>
  <text x="896" y="293" font-size="14" fill="#291c0e">In between</text>

  <rect x="60" y="318" width="1080" height="52" rx="6" fill="#ffffff"/>
  <text x="72" y="349" font-size="14" font-weight="700" fill="#291c0e">NFC read range</text>
  <text x="360" y="349" font-size="14" font-weight="700" fill="#1f6f3a">Full spec</text>
  <text x="628" y="349" font-size="14" fill="#291c0e">On-metal inlay +15–30%</text>
  <text x="896" y="349" font-size="14" fill="#291c0e">−20–30%</text>

  <rect x="60" y="374" width="1080" height="52" rx="6" fill="#f7f4ec"/>
  <text x="72" y="405" font-size="14" font-weight="700" fill="#291c0e">Personalisation</text>
  <text x="360" y="405" font-size="14" fill="#291c0e">Full-colour print</text>
  <text x="628" y="405" font-size="14" fill="#291c0e">Laser etch · PVD</text>
  <text x="896" y="405" font-size="14" fill="#291c0e">Laser burn</text>

  <rect x="60" y="430" width="1080" height="52" rx="6" fill="#ffffff"/>
  <text x="72" y="461" font-size="14" font-weight="700" fill="#291c0e">Lifetime</text>
  <text x="360" y="461" font-size="14" fill="#291c0e">12–18 months</text>
  <text x="628" y="461" font-size="14" font-weight="700" fill="#1f6f3a">Employee tenure</text>
  <text x="896" y="461" font-size="14" fill="#291c0e">2–5 years</text>

  <rect x="60" y="486" width="1080" height="56" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="72" y="519" font-size="14" font-weight="800" fill="#6d5a3a">Best for</text>
  <text x="360" y="519" font-size="13.5" fill="#3a2f1c">Team rollouts 50–10k</text>
  <text x="628" y="519" font-size="13.5" fill="#3a2f1c">Executive · durability</text>
  <text x="896" y="519" font-size="13.5" fill="#3a2f1c">Eco · boutique</text>

  <text x="600" y="576" text-anchor="middle" font-size="13" fill="#5c5c5c">Metal is recyclable (30–60% recycled content); FSC wood is renewable; PVC is petrochemical — align the claim to the evidence.</text>
</svg>
