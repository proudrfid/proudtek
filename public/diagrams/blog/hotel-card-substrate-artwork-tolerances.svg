<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hotel card artwork tolerances by substrate</title>
<desc id="d">A table of artwork tolerances by substrate. PVC, the reference, holds 5 pt type (4 pt with sacrifice), 0.1 mm registration drift and 0.5 mm emboss depth, and is the most forgiving. Wood gives 0.1 mm laser line fidelity but laser adds no colour and a UV white base hides the grain. PLA has 0.2 mm drift and must cure below 60 C and laminate below 120 C. rPET prints like PVC with 0.3 mm emboss and a 140 to 160 C foil window. Bio-composite needs 7 pt minimum type because fibres break letterforms, and halftones at or below 133 lpi. Stone paper takes no gloss lamination and only a muted palette.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ARTWORK TOLERANCES BY SUBSTRATE</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">PVC forgives almost anything — the rest need the design built for them.</text>

<!-- header -->
<rect x="64" y="104" width="1072" height="36" rx="8" fill="#f3ede0"/>
<text x="82" y="128" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">SUBSTRATE</text>
<text x="252" y="128" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">MIN TYPE</text>
<text x="402" y="128" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">REG. DRIFT</text>
<text x="542" y="128" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">EMBOSS</text>
<text x="692" y="128" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">WATCH-OUT AT ARTWORK</text>
<line x1="240" y1="104" x2="240" y2="536" stroke="#efe9dc" stroke-width="1.3"/>
<line x1="390" y1="104" x2="390" y2="536" stroke="#efe9dc" stroke-width="1.3"/>
<line x1="530" y1="104" x2="530" y2="536" stroke="#efe9dc" stroke-width="1.3"/>
<line x1="680" y1="104" x2="680" y2="536" stroke="#efe9dc" stroke-width="1.3"/>

<!-- PVC (reference, highlighted) -->
<rect x="64" y="144" width="1072" height="60" rx="8" fill="#eef5f5"/>
<circle cx="88" cy="174" r="6" fill="#4a5568"/><text x="102" y="179" font-size="14.5" font-weight="800" fill="#291c0e">PVC</text>
<text x="252" y="179" font-size="13" fill="#3a2f20">5 pt (4 pt sacrifice)</text>
<text x="402" y="179" font-size="13" fill="#3a2f20">0.1 mm</text>
<text x="542" y="179" font-size="13" fill="#3a2f20">0.5 mm</text>
<text x="692" y="179" font-size="13" font-weight="700" fill="#234a4a">Reference — most forgiving</text>

<!-- Wood -->
<circle cx="88" cy="234" r="6" fill="#a07d43"/><text x="102" y="239" font-size="14.5" font-weight="800" fill="#291c0e">Wood</text>
<text x="252" y="239" font-size="13" fill="#3a2f20">0.1 mm laser line</text>
<text x="402" y="239" font-size="13" fill="#8a8a8a">—</text>
<text x="542" y="239" font-size="13" fill="#8a8a8a">—</text>
<text x="692" y="239" font-size="13" fill="#3a2f20">Laser = no colour; UV white base hides grain</text>
<line x1="64" y1="264" x2="1136" y2="264" stroke="#efe9dc" stroke-width="1.2"/>

<!-- PLA -->
<circle cx="88" cy="294" r="6" fill="#2d6a4f"/><text x="102" y="299" font-size="14.5" font-weight="800" fill="#291c0e">PLA</text>
<text x="252" y="299" font-size="13" fill="#8a8a8a">—</text>
<text x="402" y="299" font-size="13" fill="#3a2f20">0.2 mm</text>
<text x="542" y="299" font-size="13" fill="#8a8a8a">—</text>
<text x="692" y="299" font-size="13" fill="#3a2f20">Cure &lt; 60°C · laminate &lt; 120°C; no heavy dark areas</text>
<line x1="64" y1="324" x2="1136" y2="324" stroke="#efe9dc" stroke-width="1.2"/>

<!-- rPET -->
<circle cx="88" cy="354" r="6" fill="#4a5568"/><text x="102" y="359" font-size="14.5" font-weight="800" fill="#291c0e">rPET</text>
<text x="252" y="359" font-size="13" fill="#3a2f20">≈ PVC</text>
<text x="402" y="359" font-size="13" fill="#3a2f20">≈ PVC</text>
<text x="542" y="359" font-size="13" fill="#3a2f20">0.3 mm</text>
<text x="692" y="359" font-size="13" fill="#3a2f20">Narrow foil window 140–160°C; recycled credentials</text>
<line x1="64" y1="384" x2="1136" y2="384" stroke="#efe9dc" stroke-width="1.2"/>

<!-- Bio-composite -->
<circle cx="88" cy="414" r="6" fill="#2d6a4f"/><text x="102" y="419" font-size="14.5" font-weight="800" fill="#291c0e">Bio-composite</text>
<text x="252" y="419" font-size="13" fill="#3a2f20">7 pt minimum</text>
<text x="402" y="419" font-size="13" fill="#8a8a8a">—</text>
<text x="542" y="419" font-size="13" fill="#8a8a8a">—</text>
<text x="692" y="419" font-size="13" fill="#3a2f20">Fibres break small type; halftones ≤ 133 lpi</text>
<line x1="64" y1="444" x2="1136" y2="444" stroke="#efe9dc" stroke-width="1.2"/>

<!-- Stone paper -->
<circle cx="88" cy="474" r="6" fill="#4a5568"/><text x="102" y="479" font-size="14.5" font-weight="800" fill="#291c0e">Stone paper</text>
<text x="252" y="479" font-size="13" fill="#8a8a8a">—</text>
<text x="402" y="479" font-size="13" fill="#8a8a8a">—</text>
<text x="542" y="479" font-size="13" fill="#8a8a8a">—</text>
<text x="692" y="479" font-size="13" fill="#3a2f20">No gloss lamination; muted palette only</text>
<line x1="64" y1="509" x2="1136" y2="509" stroke="#efe9dc" stroke-width="1.2"/>

<text x="600" y="560" text-anchor="middle" font-size="14" fill="#4f4f4f">Design for the substrate — a substrate-driven change at proof stage forces a full revision, not a tweak.</text>
</svg>
