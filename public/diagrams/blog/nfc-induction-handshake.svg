<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The NFC handshake — borrow power, then answer by load modulation</title>
<desc id="d">A three-step sequence. Step one: the smartphone generates an alternating 13.56 MHz magnetic field. Step two: the tag's antenna coil induces a current from that field, which powers the tag's integrated circuit — 10 to 30 mW, and no battery. Step three: the chip switches a resistive load on and off across its antenna, creating small amplitude dips the phone decodes as data at 106 kbit/s. Power flows in; data flows back over the very same field.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="18%" r="92%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="58" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">THE HANDSHAKE &#8212; BORROW POWER, THEN ANSWER</text>

<!-- Panel 1 -->
<rect x="60" y="112" width="332" height="392" rx="16" fill="#faf6ec" stroke="#e3d8c4" stroke-width="1.6"/>
<circle cx="96" cy="150" r="17" fill="#c39a5f"/><text x="96" y="156" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
<text x="130" y="156" font-size="19" font-weight="800" fill="#291c0e">Phone makes a field</text>
<g fill="none" stroke="#c39a5f" stroke-linecap="round">
<path d="M300 300 A70 70 0 0 1 300 400" stroke-width="5" opacity="0.85"/>
<path d="M300 276 A105 105 0 0 1 300 424" stroke-width="4.5" opacity="0.55"/>
<path d="M300 252 A140 140 0 0 1 300 448" stroke-width="4" opacity="0.32"/>
</g>
<rect x="120" y="250" width="86" height="200" rx="16" fill="#291c0e" stroke="#c39a5f" stroke-width="2"/>
<rect x="132" y="266" width="62" height="168" rx="9" fill="#2a91c4" opacity="0.85"/>
<text x="226" y="484" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4f4f4f">alternating field &#183; 13.56 MHz</text>

<!-- arrow 1->2 -->
<path d="M400 300 h56" stroke="#6d5a3a" stroke-width="3" fill="none"/><path d="M452 292 l14 8 -14 8" fill="#6d5a3a"/>
<text x="428" y="285" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">power</text>

<!-- Panel 2 -->
<rect x="472" y="112" width="256" height="392" rx="16" fill="#faf6ec" stroke="#e3d8c4" stroke-width="1.6"/>
<circle cx="508" cy="150" r="17" fill="#c39a5f"/><text x="508" y="156" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
<text x="542" y="156" font-size="19" font-weight="800" fill="#291c0e">Tag steals power</text>
<g fill="none" stroke="#6d5a3a" stroke-width="4" opacity="0.9">
<circle cx="600" cy="330" r="74"/><circle cx="600" cy="330" r="60"/><circle cx="600" cy="330" r="46"/>
</g>
<rect x="580" y="310" width="40" height="40" rx="6" fill="#291c0e"/><text x="600" y="336" text-anchor="middle" font-size="12" font-weight="800" fill="#d4a755">IC</text>
<path d="M636 250 l-16 34 12 0 -16 34" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="600" y="452" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f6f3a">powers the IC &#183; 10&#8211;30 mW</text>
<text x="600" y="476" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4f4f4f">no battery required</text>

<!-- arrow 2->3 -->
<path d="M736 300 h56" stroke="#3d6b6b" stroke-width="3" fill="none"/><path d="M788 292 l14 8 -14 8" fill="#3d6b6b"/>
<text x="764" y="285" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3d6b6b">data</text>

<!-- Panel 3 -->
<rect x="808" y="112" width="332" height="392" rx="16" fill="#f2f7f7" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="844" cy="150" r="17" fill="#3d6b6b"/><text x="844" y="156" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
<text x="878" y="156" font-size="19" font-weight="800" fill="#291c0e">Tag blinks its load</text>
<!-- carrier with amplitude dips -->
<path d="M852 330 q14 -46 28 0 q14 46 28 0 q14 -46 28 0 q14 46 28 0 q14 -22 28 0 q14 22 28 0 q14 -46 28 0 q14 46 28 0 q14 -46 28 0 q14 46 28 0" fill="none" stroke="#234a4a" stroke-width="3.5" stroke-linecap="round"/>
<rect x="972" y="286" width="56" height="88" rx="6" fill="#3d6b6b" opacity="0.14"/>
<text x="1000" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#3d6b6b">dip = bit</text>
<path d="M1090 340 l-16 -8 0 5 -40 0 0 6 40 0 0 5 z" fill="#3d6b6b"/>
<text x="974" y="452" text-anchor="middle" font-size="14.5" font-weight="700" fill="#234a4a">load modulation</text>
<text x="974" y="476" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4f4f4f">106 kbit/s back to the reader</text>

<line x1="60" y1="540" x2="1140" y2="540" stroke="#efe7d8" stroke-width="1.5"/>
<text x="600" y="576" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Power flows one way; data rides back on the same field. The tag never needs a battery of its own.</text>
<text x="600" y="606" text-anchor="middle" font-size="13.5" font-weight="600" fill="#5c5c5c">Higher rates (212 / 424 kbit/s) are reserved for card-emulation mode &#183; delivered power won't drive external sensors or LEDs.</text>
</svg>
