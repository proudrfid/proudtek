<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NTAG213, NTAG215 and NTAG216 compared for gift tags, with MIFARE Classic flagged to avoid</title>
<desc id="d">A comparison of NFC chips for gift tags. NTAG213 has 144 bytes of user memory, fits URLs up to 130 characters, is the default choice, and reads on iPhone with no app. NTAG215 has 504 bytes, holds a URL plus greeting text plus WiFi credentials in one tap, and reads with no app. NTAG216 has 888 bytes, suits very long URLs past 250 characters, and reads with no app. MIFARE Classic is flagged to avoid for consumer gift tags because it needs an app on iPhone.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHICH CHIP GOES INSIDE THE TAG</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">NTAG213 is the default; move up on demand</text>
<text x="600" y="130" text-anchor="middle" font-size="15.5" fill="#4f4f4f">More memory only earns its keep when the payload actually needs it.</text>

<text x="92" y="174" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">CHIP</text>
<text x="380" y="174" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">USER MEMORY</text>
<text x="558" y="174" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">BEST FIT FOR A GIFT TAG</text>
<text x="980" y="174" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">ON iPHONE</text>

<!-- NTAG213 default highlight -->
<rect x="64" y="188" width="1072" height="62" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<rect x="64" y="188" width="9" height="62" rx="4" fill="#c39a5f"/>
<text x="92" y="219" font-size="15" font-weight="800" fill="#291c0e">NTAG213</text>
<text x="92" y="238" font-size="12" fill="#8a6d34">default</text>
<text x="380" y="225" font-size="13.5" fill="#333333">144 bytes</text>
<text x="558" y="225" font-size="13" fill="#333333">URLs up to 130 characters</text>
<text x="980" y="225" font-size="13" font-weight="700" fill="#1f6f3a">Reads, no app</text>

<!-- NTAG215 -->
<rect x="64" y="258" width="1072" height="62" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<rect x="64" y="258" width="9" height="62" rx="4" fill="#3d6b6b"/>
<text x="92" y="295" font-size="15" font-weight="800" fill="#291c0e">NTAG215</text>
<text x="380" y="295" font-size="13.5" fill="#333333">504 bytes</text>
<text x="558" y="295" font-size="13" fill="#333333">URL + greeting + WiFi in one tap</text>
<text x="980" y="295" font-size="13" font-weight="700" fill="#1f6f3a">Reads, no app</text>

<!-- NTAG216 -->
<rect x="64" y="328" width="1072" height="62" rx="10" fill="#e4f0f0" stroke="#bcdcdc" stroke-width="1.3"/>
<rect x="64" y="328" width="9" height="62" rx="4" fill="#234a4a"/>
<text x="92" y="365" font-size="15" font-weight="800" fill="#291c0e">NTAG216</text>
<text x="380" y="365" font-size="13.5" fill="#333333">888 bytes</text>
<text x="558" y="365" font-size="13" fill="#333333">Very long URLs, 250+ characters</text>
<text x="980" y="365" font-size="13" font-weight="700" fill="#1f6f3a">Reads, no app</text>

<!-- MIFARE Classic avoid -->
<rect x="64" y="398" width="1072" height="62" rx="10" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.3"/>
<rect x="64" y="398" width="9" height="62" rx="4" fill="#8b2d2d"/>
<text x="92" y="429" font-size="15" font-weight="800" fill="#291c0e">MIFARE Classic</text>
<text x="92" y="448" font-size="12" fill="#8b2d2d">avoid</text>
<text x="380" y="435" font-size="13.5" fill="#9a7a7a">—</text>
<text x="558" y="435" font-size="13" fill="#333333">Skip for consumer gift tags</text>
<text x="980" y="435" font-size="13" font-weight="700" fill="#8b2d2d">Needs an app</text>

<text x="600" y="506" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Every NTAG here reads on an unlocked iPhone with no app — the one reason consumer tags stick to the family.</text>
<text x="600" y="534" text-anchor="middle" font-size="13.5" fill="#8a8a8a">Memory figures are NXP NTAG21x user-memory specs; a wrong chip is what makes a tap quietly fail.</text>
</svg>
