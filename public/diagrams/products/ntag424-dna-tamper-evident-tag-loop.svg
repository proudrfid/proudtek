<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Tamper-evident bridge antenna — peel it and the tag confesses</title>
  <desc id="d">The RF coil routes through a breakable trace at the sticker edge. Peeling severs the trace, the chip's CTTES register latches the event permanently, and every subsequent SDM tap URL carries the tamper status — the seal reports its own violation.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">A seal that files its own incident report</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Peel once and every future tap says so — permanently</text>
  <g transform="translate(70,150)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="20" width="480" height="220" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
    <text x="24" y="56" font-family="Georgia, serif" font-size="17" fill="#2c5454">Intact — loop closed</text>
    <ellipse cx="240" cy="150" rx="170" ry="60" fill="none" stroke="#3d6b6b" stroke-width="3.5"/>
    <rect x="218" y="82" width="44" height="24" rx="4" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>
    <text x="180" y="238" font-size="13" fill="#2c5454">bridge trace at the sticker edge</text>
    <rect x="570" y="20" width="480" height="220" rx="14" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5"/>
    <text x="594" y="56" font-family="Georgia, serif" font-size="17" fill="#8b2d2d">Peeled — trace severed</text>
    <path d="M 640 175 A 170 58 0 1 1 940 145" fill="none" stroke="#8b2d2d" stroke-width="3.5" stroke-dasharray="14 10"/>
    <rect x="788" y="82" width="44" height="24" rx="4" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>
    <text x="700" y="238" font-size="13" fill="#8b2d2d">CTTES register latches — permanent</text>
  </g>
  <g transform="translate(70,430)">
    <rect x="0" y="0" width="1050" height="130" rx="12" fill="#eef2f0" stroke="#2c5454" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="18" fill="#2c5454">The tap tells the backend</text>
    <text x="24" y="72" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Every SDM tap URL carries the tamper status alongside the AES-128 CMAC signature — the server sees "seal broken" the moment anyone checks</text>
    <text x="24" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Wine capsules, pharma cartons, cosmetics seals — placement decides whether opening the product must break the loop</text>
  </g>
</svg>
