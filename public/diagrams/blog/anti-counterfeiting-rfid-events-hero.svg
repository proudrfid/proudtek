<rect x="286" y="336" width="2" height="34" fill="#291c0e"/>
<text x="246" y="392" text-anchor="middle" font-size="12" fill="#8a8a8a">ticket #A-2231</text>
<text x="122" y="460" font-size="13.5" font-weight="700" fill="#8b2d2d">Unlimited duplicates</text>

<!-- Panel B: RFID wristband -->
<rect x="450" y="206" width="300" height="268" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
