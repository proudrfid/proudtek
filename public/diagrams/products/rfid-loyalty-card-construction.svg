<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID loyalty card construction — lamination stack and the embedded NFC inlay</title>
<desc id="d">Two panels on a warm cream card. Left, the lamination stack exploded top to bottom: a printed front overlay carrying the artwork, spot UV and metallic foil; a white PVC core holding the embedded antenna coil and NFC chip module; and a printed back overlay carrying the fallback barcode and the sequential card number. A bracket marks 0.76 millimetre assembled thickness, and the footprint is 85.60 by 53.98 by 0.76 millimetres, ISO/IEC 7810 ID-1, the CR80 wallet geometry. A green note lists the finishes that earn a wallet slot: spot UV, metallic foil, soft-touch lamination and embossing. Right, the embedded inlay in detail: a many-turn copper antenna coil tuned to 13.56 megahertz surrounds the chip module, which reads its UID over ISO/IEC 14443-A as an NFC Forum Type 2 tag, phone-readable with no app. Three chip options are shown: NTAG213 with 144 bytes of user memory for URL or UID lookup, NTAG216 with 888 bytes for an NDEF payload, and MIFARE Classic 1K with sixteen sectors. Footer: one PVC body, contactless NFC plus a printed barcode fallback, so the card earns on every lane from day one.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
