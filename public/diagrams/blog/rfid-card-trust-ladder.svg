<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The trust ladder: from MIFARE Classic 1K to bank-grade secure elements</title>
<desc id="d">Four columns of increasing height form a staircase of clone-resistance. Lowest: MIFARE Classic 1K, its Crypto-1 cipher broken since 2008, cloneable with about 20 dollars of hardware. Next: MIFARE Ultralight C with 3DES authentication and 192 bytes of user memory — a cheap step up. Then: MIFARE DESFire EV3 with AES-128 and EAL5+ certification, joined by NTAG 424 DNA with SUN, running hotels, transit, payment and corporate badges. Highest: EMV secure elements, bank-grade and EAL5+ certified, behind Visa, Mastercard, Apple Pay and Google Wallet. A gold staircase arrow rises across the tops, labelled security and clone-resistance.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<marker id="agold" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#c39a5f"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">OUT IN THE WILD, 2026</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">The trust ladder: what it costs to clone each rung</text>

<path d="M 110 446 H 340 V 366 H 600 V 276 H 860 V 186 H 1110" fill="none" stroke="#c39a5f" stroke-width="3" marker-end="url(#agold)"/>
<text x="118" y="428" font-size="13" font-weight="600" fill="#6d5a3a">security &amp; clone-resistance →</text>

<rect x="110" y="460" width="230" height="120" rx="10" fill="#f6e7e7" stroke="#c99a9a" stroke-width="1.5"/>
<text x="225" y="492" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8b2d2d">MIFARE Classic 1K</text>
<text x="225" y="514" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Crypto-1 · broken since 2008</text>
<text x="225" y="548" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">~$20 of hardware to clone</text>

<rect x="370" y="380" width="230" height="200" rx="10" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="485" y="412" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">MIFARE Ultralight C</text>
<text x="485" y="434" text-anchor="middle" font-size="12.5" fill="#4f4f4f">3DES authentication</text>
<text x="485" y="456" text-anchor="middle" font-size="12.5" fill="#4f4f4f">192 bytes user memory</text>
<text x="485" y="490" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6d5a3a">a cheap step up</text>

<rect x="630" y="290" width="230" height="290" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="745" y="322" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">MIFARE DESFire EV3</text>
<text x="745" y="344" text-anchor="middle" font-size="12.5" fill="#4f4f4f">AES-128 · EAL5+ certified</text>
<text x="745" y="368" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2c5454">+ NTAG 424 DNA (SUN)</text>
<text x="745" y="400" text-anchor="middle" font-size="12.5" fill="#4f4f4f">hotels · transit · payment</text>
<text x="745" y="422" text-anchor="middle" font-size="12.5" fill="#4f4f4f">corporate badges</text>

<rect x="890" y="200" width="230" height="380" rx="10" fill="#e9f3ec" stroke="#2d6a4f" stroke-width="2"/>
<text x="1005" y="232" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1b4332">EMV / Secure Element</text>
<text x="1005" y="254" text-anchor="middle" font-size="12.5" fill="#4f4f4f">bank-grade · EAL5+ certified</text>
<text x="1005" y="278" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Visa · Mastercard · Amex</text>
<text x="1005" y="302" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Apple Pay · Google Wallet</text>

<line x1="90" y1="580" x2="1130" y2="580" stroke="#4f4f4f" stroke-width="2"/>

<text x="600" y="622" text-anchor="middle" font-size="14" font-weight="600" fill="#291c0e">The floor is “photocopy me for $20 of hardware”; the ceiling is the silicon your bank trusts with your money.</text>
</svg>
