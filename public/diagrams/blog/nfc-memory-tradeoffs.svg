<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NFC chip memory traded against price, security and tag type across five chips</title>
<desc id="d">A five-row matrix. NTAG213 has 144 bytes at 0.04 to 0.08 dollars with 32-bit password protection on NFC Forum Type 2. NTAG215 has 504 bytes at 0.06 to 0.12 dollars, same 32-bit password, Type 2. NTAG216 has 888 bytes at 0.08 to 0.15 dollars, 32-bit password, Type 2. NTAG 424 DNA has 416 bytes at 0.15 to 0.40 dollars with AES-128 SUN authentication on Type 4. MIFARE DESFire EV3 has 2 to 8 KB at 0.40 to 1.50 dollars with AES on a card. A note warns that 32-bit password protection is brute-forceable in seconds, so anti-counterfeit needs AES, not more memory.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MEMORY IS ONE OF FOUR VARIABLES</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">How capacity trades against price, security and reader compatibility (at 10K MOQ).</text>

<!-- headers -->
<text x="92" y="122" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a7a55">CHIP</text>
<text x="450" y="122" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a7a55">USER MEMORY</text>
<text x="650" y="122" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a7a55">PRICE @10K</text>
<text x="855" y="122" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a7a55">SECURITY</text>
<text x="1112" y="122" text-anchor="end" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a7a55">TAG TYPE</text>

<!-- row 1 -->
<rect x="64" y="134" width="1072" height="74" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<rect x="64" y="134" width="9" height="74" rx="4" fill="#3d6b6b"/>
<text x="92" y="178" font-size="16" font-weight="800" fill="#291c0e">NTAG213</text>
<text x="450" y="179" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">144 B</text>
<text x="650" y="179" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">$0.04–0.08</text>
<text x="855" y="179" text-anchor="middle" font-size="14" font-weight="800" fill="#a85a5a">32-bit pw</text>
<text x="1112" y="179" text-anchor="end" font-size="14" font-weight="700" fill="#4f4f4f">Type 2</text>

<!-- row 2 -->
<rect x="64" y="216" width="1072" height="74" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<rect x="64" y="216" width="9" height="74" rx="4" fill="#3d6b6b"/>
<text x="92" y="260" font-size="16" font-weight="800" fill="#291c0e">NTAG215</text>
<text x="450" y="261" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">504 B</text>
<text x="650" y="261" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">$0.06–0.12</text>
<text x="855" y="261" text-anchor="middle" font-size="14" font-weight="800" fill="#a85a5a">32-bit pw</text>
<text x="1112" y="261" text-anchor="end" font-size="14" font-weight="700" fill="#4f4f4f">Type 2</text>

<!-- row 3 -->
<rect x="64" y="298" width="1072" height="74" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<rect x="64" y="298" width="9" height="74" rx="4" fill="#3d6b6b"/>
<text x="92" y="342" font-size="16" font-weight="800" fill="#291c0e">NTAG216</text>
<text x="450" y="343" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">888 B</text>
<text x="650" y="343" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">$0.08–0.15</text>
<text x="855" y="343" text-anchor="middle" font-size="14" font-weight="800" fill="#a85a5a">32-bit pw</text>
<text x="1112" y="343" text-anchor="end" font-size="14" font-weight="700" fill="#4f4f4f">Type 2</text>

<!-- row 4 -->
<rect x="64" y="380" width="1072" height="74" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<rect x="64" y="380" width="9" height="74" rx="4" fill="#1f6f3a"/>
<text x="92" y="424" font-size="16" font-weight="800" fill="#291c0e">NTAG 424 DNA</text>
<text x="450" y="425" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">416 B</text>
<text x="650" y="425" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">$0.15–0.40</text>
<text x="855" y="425" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">AES-128 SUN</text>
<text x="1112" y="425" text-anchor="end" font-size="14" font-weight="700" fill="#4f4f4f">Type 4</text>

<!-- row 5 -->
<rect x="64" y="462" width="1072" height="74" rx="11" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.4"/>
<rect x="64" y="462" width="9" height="74" rx="4" fill="#c39a5f"/>
<text x="92" y="506" font-size="16" font-weight="800" fill="#291c0e">MIFARE DESFire EV3</text>
<text x="450" y="507" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">2–8 KB</text>
<text x="650" y="507" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">$0.40–1.50</text>
<text x="855" y="507" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">AES</text>
<text x="1112" y="507" text-anchor="end" font-size="14" font-weight="700" fill="#4f4f4f">card</text>

<text x="600" y="576" text-anchor="middle" font-size="14" fill="#4f4f4f">32-bit password protection is brute-forceable in seconds — for anti-counterfeit choose AES, not more memory.</text>
<text x="600" y="600" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Higher memory also needs more silicon area and sustained write power — tiny inlays and marginal range favour NTAG213.</text>
</svg>
