<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">EU Battery Regulation 2023/1542 passport timeline and recycled-content minimums</title>
<desc id="d">A timeline of the EU Battery Regulation 2023/1542. From February 2027 a battery passport is mandatory for industrial batteries over 2 kWh and EV batteries, accessible via a QR code plus NFC tag. Recycled-content minimums then ratchet up: cobalt from 6 percent in 2031 to 26 percent in 2036, lead from 65 to 85 percent, lithium from 0.5 to 12 percent, and nickel from 6 to 15 percent. RFID and NFC item-level tracking is the practical way to verify recycled content.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EU BATTERY REGULATION 2023/1542</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">The most concrete circular mandate to date</text>
<text x="600" y="124" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Battery passport via QR + NFC, then recycled-content minimums that ratchet up.</text>

<!-- timeline axis -->
<line x1="200" y1="228" x2="1000" y2="228" stroke="#cbb89a" stroke-width="2.4"/>
<circle cx="300" cy="228" r="9" fill="#1b4332" stroke="#ffffff" stroke-width="2"/>
<circle cx="600" cy="228" r="9" fill="#2d6a4f" stroke="#ffffff" stroke-width="2"/>
<circle cx="900" cy="228" r="9" fill="#2d6a4f" stroke="#ffffff" stroke-width="2"/>
<!-- milestone cards -->
<rect x="180" y="150" width="240" height="60" rx="10" fill="#ffffff" stroke="#8fbaa2" stroke-width="1.6"/>
<rect x="180" y="150" width="240" height="7" rx="3.5" fill="#1b4332"/>
<text x="196" y="180" font-size="15" font-weight="800" fill="#1b4332">Feb 2027</text>
<text x="196" y="200" font-size="12.5" fill="#333333">passport mandatory · &gt;2 kWh + EV</text>
<rect x="480" y="150" width="240" height="60" rx="10" fill="#ffffff" stroke="#a9cbb8" stroke-width="1.6"/>
<rect x="480" y="150" width="240" height="7" rx="3.5" fill="#2d6a4f"/>
<text x="496" y="180" font-size="15" font-weight="800" fill="#1b4332">2031</text>
<text x="496" y="200" font-size="12.5" fill="#333333">recycled-content minimums start</text>
<rect x="780" y="150" width="240" height="60" rx="10" fill="#ffffff" stroke="#a9cbb8" stroke-width="1.6"/>
<rect x="780" y="150" width="240" height="7" rx="3.5" fill="#2d6a4f"/>
<text x="796" y="180" font-size="15" font-weight="800" fill="#1b4332">2036</text>
<text x="796" y="200" font-size="12.5" fill="#333333">minimums step up</text>

<!-- data carrier pill -->
<rect x="1030" y="186" width="86" height="34" rx="17" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.4"/>
<text x="1073" y="208" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b4332">QR + NFC</text>

<!-- recycled-content block -->
<text x="600" y="288" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.4" fill="#4f4f4f">RECYCLED-CONTENT MINIMUM · 2031 → 2036</text>

<!-- 4 metal cards -->
<rect x="64" y="312" width="250" height="212" rx="14" fill="#eef5f0" stroke="#a9cbb8" stroke-width="1.6"/>
<text x="189" y="348" text-anchor="middle" font-size="17" font-weight="800" fill="#1b4332">Cobalt</text>
<text x="189" y="398" text-anchor="middle" font-size="34" font-weight="800" fill="#8a94a3">6%</text>
<text x="189" y="424" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2031</text>
<path d="M150 446 L228 446" stroke="#2d6a4f" stroke-width="2.4"/><polygon points="228,441 238,446 228,451" fill="#2d6a4f"/>
<text x="189" y="490" text-anchor="middle" font-size="34" font-weight="800" fill="#1f6f3a">26%</text>
<text x="189" y="512" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2036</text>

<rect x="330" y="312" width="250" height="212" rx="14" fill="#eef5f0" stroke="#a9cbb8" stroke-width="1.6"/>
<text x="455" y="348" text-anchor="middle" font-size="17" font-weight="800" fill="#1b4332">Lead</text>
<text x="455" y="398" text-anchor="middle" font-size="34" font-weight="800" fill="#8a94a3">65%</text>
<text x="455" y="424" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2031</text>
<path d="M416 446 L494 446" stroke="#2d6a4f" stroke-width="2.4"/><polygon points="494,441 504,446 494,451" fill="#2d6a4f"/>
<text x="455" y="490" text-anchor="middle" font-size="34" font-weight="800" fill="#1f6f3a">85%</text>
<text x="455" y="512" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2036</text>

<rect x="596" y="312" width="250" height="212" rx="14" fill="#eef5f0" stroke="#a9cbb8" stroke-width="1.6"/>
<text x="721" y="348" text-anchor="middle" font-size="17" font-weight="800" fill="#1b4332">Lithium</text>
<text x="721" y="398" text-anchor="middle" font-size="34" font-weight="800" fill="#8a94a3">0.5%</text>
<text x="721" y="424" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2031</text>
<path d="M682 446 L760 446" stroke="#2d6a4f" stroke-width="2.4"/><polygon points="760,441 770,446 760,451" fill="#2d6a4f"/>
<text x="721" y="490" text-anchor="middle" font-size="34" font-weight="800" fill="#1f6f3a">12%</text>
<text x="721" y="512" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2036</text>

<rect x="862" y="312" width="250" height="212" rx="14" fill="#eef5f0" stroke="#a9cbb8" stroke-width="1.6"/>
<text x="987" y="348" text-anchor="middle" font-size="17" font-weight="800" fill="#1b4332">Nickel</text>
<text x="987" y="398" text-anchor="middle" font-size="34" font-weight="800" fill="#8a94a3">6%</text>
<text x="987" y="424" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2031</text>
<path d="M948 446 L1026 446" stroke="#2d6a4f" stroke-width="2.4"/><polygon points="1026,441 1036,446 1026,451" fill="#2d6a4f"/>
<text x="987" y="490" text-anchor="middle" font-size="34" font-weight="800" fill="#1f6f3a">15%</text>
<text x="987" y="512" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2036</text>

<text x="600" y="560" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Item-level RFID/NFC is the only practical way to verify recycled content at scale.</text>
</svg>
