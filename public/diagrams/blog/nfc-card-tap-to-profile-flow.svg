<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">One NFC tap: card to chip to profile to CRM</title>
<desc id="d">A four-step flow across the page. Step one, tap: hold the card to a phone. Step two, chip: the NTAG213 stores a single NDEF URL. Step three, profile: the URL opens a digital profile with a vCard, links, headshot and booking. Step four, CRM: the captured contact syncs into Salesforce, HubSpot and similar systems. The chip stores a URL, not the details, so updating the page updates every future tap.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="steel4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e7eaef"/><stop offset="100%" stop-color="#c3cad3"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE TAP, CARD TO CRM</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The chip carries a URL, not your details — so the contact travels in seconds.</text>

<!-- box 1 TAP -->
<rect x="70" y="176" width="220" height="288" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="70" y="176" width="220" height="8" rx="4" fill="#3d6b6b"/>
<text x="180" y="222" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">1 · TAP</text>
<rect x="130" y="256" width="100" height="64" rx="9" fill="url(#steel4)" stroke="#9aa3ad" stroke-width="2"/>
<rect x="196" y="266" width="26" height="20" rx="4" fill="none" stroke="#c39a5f" stroke-width="2"/>
<text x="180" y="386" text-anchor="middle" font-size="14" fill="#5c5c5c">Hold the card</text>
<text x="180" y="408" text-anchor="middle" font-size="14" fill="#5c5c5c">to a phone</text>

<!-- box 2 CHIP -->
<rect x="350" y="176" width="220" height="288" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="350" y="176" width="220" height="8" rx="4" fill="#3d6b6b"/>
<text x="460" y="222" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">2 · CHIP</text>
<rect x="430" y="258" width="60" height="56" rx="7" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<line x1="430" y1="272" x2="418" y2="272" stroke="#2c5454" stroke-width="2.4"/>
<line x1="430" y1="300" x2="418" y2="300" stroke="#2c5454" stroke-width="2.4"/>
<line x1="490" y1="272" x2="502" y2="272" stroke="#2c5454" stroke-width="2.4"/>
<line x1="490" y1="300" x2="502" y2="300" stroke="#2c5454" stroke-width="2.4"/>
<text x="460" y="291" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">NFC</text>
<text x="460" y="386" text-anchor="middle" font-size="14" fill="#5c5c5c">NTAG213 stores</text>
<text x="460" y="408" text-anchor="middle" font-size="14" fill="#5c5c5c">one NDEF URL</text>

<!-- box 3 PROFILE -->
<rect x="630" y="176" width="220" height="288" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="630" y="176" width="220" height="8" rx="4" fill="#3d6b6b"/>
<text x="740" y="222" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">3 · PROFILE</text>
<rect x="708" y="248" width="64" height="80" rx="10" fill="#ffffff" stroke="#291c0e" stroke-width="2"/>
<circle cx="740" cy="272" r="10" fill="#dfe3e8" stroke="#9aa3ad" stroke-width="1.4"/>
<line x1="720" y1="294" x2="760" y2="294" stroke="#cfe0e0" stroke-width="3"/>
<line x1="720" y1="304" x2="752" y2="304" stroke="#cfe0e0" stroke-width="3"/>
<line x1="720" y1="314" x2="756" y2="314" stroke="#cfe0e0" stroke-width="3"/>
<text x="740" y="386" text-anchor="middle" font-size="14" fill="#5c5c5c">vCard, links,</text>
<text x="740" y="408" text-anchor="middle" font-size="14" fill="#5c5c5c">headshot, booking</text>

<!-- box 4 CRM -->
<rect x="910" y="176" width="220" height="288" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<rect x="910" y="176" width="220" height="8" rx="4" fill="#1f6f3a"/>
<text x="1020" y="222" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">4 · CRM</text>
<ellipse cx="1020" cy="262" rx="34" ry="11" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<path d="M 986 262 v 46 a 34 11 0 0 0 68 0 v -46" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<path d="M 986 285 a 34 11 0 0 0 68 0" fill="none" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="1020" y="386" text-anchor="middle" font-size="14" fill="#33595a">Salesforce,</text>
<text x="1020" y="408" text-anchor="middle" font-size="14" fill="#33595a">HubSpot &amp; more</text>

<!-- arrows -->
<line x1="300" y1="320" x2="338" y2="320" stroke="#291c0e" stroke-width="3"/>
<polygon points="338,313 356,320 338,327" fill="#291c0e"/>
<line x1="580" y1="320" x2="618" y2="320" stroke="#291c0e" stroke-width="3"/>
<polygon points="618,313 636,320 618,327" fill="#291c0e"/>
<line x1="860" y1="320" x2="898" y2="320" stroke="#291c0e" stroke-width="3"/>
<polygon points="898,313 916,320 898,327" fill="#291c0e"/>

<text x="600" y="536" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Update the profile page once, and every future tap shows the new details.</text>
<text x="600" y="576" text-anchor="middle" font-size="14" fill="#5c5c5c">No reprint, no re-issue — the physical card never changes.</text>
</svg>
