<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID implementation costs: one-time CapEx versus recurring OpEx</title>
<desc id="d">Two columns. One-time capital costs: site survey and design 2,000 to 10,000 dollars; installation 500 to 2,000 dollars per fixed reader; training 1,000 to 5,000 dollars per session; and initial tag application at 500 to 2,000 items per person per day. Recurring operating costs: ongoing tag replenishment is the largest recurring cost, high-turnover retail consumes tags equal to 3 to 5 times standing inventory a year, plus refresher training as staff turn over.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE-TIME vs RECURRING</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The install bill arrives once; the tag bill arrives forever.</text>

<rect x="80" y="120" width="470" height="446" rx="16" fill="#ffffff" stroke="#b3bcc9" stroke-width="2"/>
<rect x="80" y="120" width="470" height="8" rx="4" fill="#4a5568"/>
<text x="315" y="166" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#4a5568">ONE-TIME · CAPEX</text>
<circle cx="120" cy="222" r="6" fill="#7a8598"/>
<text x="140" y="216" font-size="15.5" font-weight="700" fill="#291c0e">Site survey &amp; system design</text>
<text x="140" y="238" font-size="13.5" font-weight="800" fill="#4a5568">$2,000-10,000</text>
<circle cx="120" cy="292" r="6" fill="#7a8598"/>
<text x="140" y="286" font-size="15.5" font-weight="700" fill="#291c0e">Installation, per fixed reader</text>
<text x="140" y="308" font-size="13.5" font-weight="800" fill="#4a5568">$500-2,000</text>
<circle cx="120" cy="362" r="6" fill="#7a8598"/>
<text x="140" y="356" font-size="15.5" font-weight="700" fill="#291c0e">Training, per session</text>
<text x="140" y="378" font-size="13.5" font-weight="800" fill="#4a5568">$1,000-5,000</text>
<circle cx="120" cy="432" r="6" fill="#7a8598"/>
<text x="140" y="426" font-size="15.5" font-weight="700" fill="#291c0e">Initial tag application (labor)</text>
<text x="140" y="448" font-size="13.5" font-weight="800" fill="#4a5568">500-2,000 items / person / day</text>
<text x="315" y="524" text-anchor="middle" font-size="13" fill="#7a828e">Paid once, at the start of the program.</text>

<rect x="650" y="120" width="470" height="446" rx="16" fill="#ffffff" stroke="#e0c084" stroke-width="2"/>
<rect x="650" y="120" width="470" height="8" rx="4" fill="#c39a5f"/>
<text x="885" y="166" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#8a6d34">RECURRING · OPEX</text>
<circle cx="690" cy="232" r="6" fill="#c39a5f"/>
<text x="710" y="226" font-size="15.5" font-weight="700" fill="#291c0e">Ongoing tag replenishment</text>
<text x="710" y="248" font-size="13.5" font-weight="800" fill="#8a6d34">the largest recurring cost</text>
<circle cx="690" cy="322" r="6" fill="#c39a5f"/>
<text x="710" y="316" font-size="15.5" font-weight="700" fill="#291c0e">High-turnover retail tag use</text>
<text x="710" y="338" font-size="13.5" font-weight="800" fill="#8a6d34">3-5x standing inventory / year</text>
<circle cx="690" cy="412" r="6" fill="#c39a5f"/>
<text x="710" y="406" font-size="15.5" font-weight="700" fill="#291c0e">Refresher training</text>
<text x="710" y="428" font-size="13.5" font-weight="800" fill="#8a6d34">as staff turn over</text>
<text x="885" y="524" text-anchor="middle" font-size="13" fill="#7a828e">Paid again every year the program runs.</text>

<text x="600" y="606" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Tag replenishment scales with inventory turnover — the faster you turn stock, the more tags you burn.</text>
</svg>
