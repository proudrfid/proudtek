<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="cbTitle cbDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="cbTitle">Break-even timeline for a cosmetics item-level NFC program</title>
  <desc id="cbDesc">A line chart over 24 months. Program cost per unit stays roughly flat — tag plus application labor plus middleware at 0.40 to 0.90 dollars incremental, against a 25 to 80 dollar average selling price, landing at 1 to 3 percent of revenue. Cumulative recovered value climbs steadily from recovered gray-market sales, reduced enforcement spend, CRM and loyalty lift, and protected retail listings. The two lines cross between month 12 and month 24, the payback window for brands with more than 50 million dollars in segment revenue.</desc>
  <defs>
    <radialGradient id="cbBg" cx="50%" cy="12%" r="95%"><stop offset="0%" stop-color="#f8f1e2"/><stop offset="100%" stop-color="#f2ece0"/></radialGradient>
    <linearGradient id="cbFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c084" stop-opacity=".5"/><stop offset="1" stop-color="#d9c084" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#cbBg)"/>
  <text x="600" y="56" text-anchor="middle" font-size="15" letter-spacing="3" fill="#9a8a66">THE MODEL THAT SURVIVES FINANCE REVIEW</text>
  <text x="600" y="92" text-anchor="middle" font-size="29" font-weight="700" fill="#291c0e">Cost stays flat. Value keeps climbing.</text>

  <!-- axes -->
  <line x1="150" y1="150" x2="150" y2="540" stroke="#d3bd94" stroke-width="1.5"/>
  <line x1="150" y1="540" x2="1080" y2="540" stroke="#d3bd94" stroke-width="1.5"/>
  <g stroke="#ece0c8" stroke-width="1">
    <line x1="150" y1="450" x2="1080" y2="450"/>
    <line x1="150" y1="360" x2="1080" y2="360"/>
    <line x1="150" y1="270" x2="1080" y2="270"/>
    <line x1="150" y1="180" x2="1080" y2="180"/>
  </g>
  <g font-size="14" fill="#6b6259" text-anchor="middle">
    <text x="150" y="566">0</text><text x="382" y="566">6 mo</text><text x="615" y="566">12 mo</text><text x="847" y="566">18 mo</text><text x="1080" y="566">24 mo</text>
  </g>
  <text transform="rotate(-90 92 345)" x="92" y="345" text-anchor="middle" font-size="14" letter-spacing="2" fill="#9a8a66">CUMULATIVE $</text>
  <text x="615" y="600" text-anchor="middle" font-size="14" letter-spacing="2" fill="#9a8a66">TIME →</text>

  <!-- recovered value area + curve -->
  <path d="M150 512 C 380 486, 520 360, 720 250 S 980 156, 1080 150 L1080 540 L150 540 Z" fill="url(#cbFill)"/>
  <path d="M150 512 C 380 486, 520 360, 720 250 S 980 156, 1080 150" fill="none" stroke="#b79a52" stroke-width="4"/>
  <!-- cost line (flat, dashed) -->
  <path d="M150 486 C 450 470, 760 462, 1080 452" fill="none" stroke="#a96b58" stroke-width="3.5" stroke-dasharray="8 6"/>

  <!-- break-even marker -->
  <circle cx="632" cy="336" r="8" fill="#291c0e"/>
  <line x1="632" y1="336" x2="632" y2="540" stroke="#291c0e" stroke-dasharray="3 5" stroke-width="1"/>
  <rect x="512" y="286" width="240" height="40" rx="9" fill="#291c0e"/>
  <text x="632" y="312" text-anchor="middle" font-size="15" letter-spacing="1" fill="#e4ce9e">BREAK-EVEN · 12–24 MONTHS</text>

  <!-- legend -->
  <g font-size="15" fill="#4f4535">
    <line x1="760" y1="196" x2="798" y2="196" stroke="#b79a52" stroke-width="4"/><text x="808" y="201">Recovered value (climbs)</text>
    <line x1="760" y1="226" x2="798" y2="226" stroke="#a96b58" stroke-width="3.5" stroke-dasharray="8 6"/><text x="808" y="231">Program cost (stays flat)</text>
  </g>

  <!-- footnote -->
  <text x="150" y="640" font-size="14.5" fill="#4f4535">$0.40–0.90 incremental cost per unit vs a $25–80 ASP → ~1–3% of revenue, for brands north of $50M segment revenue.</text>
</svg>
