<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The RFID integration stack from readers to enterprise systems</title>
<desc id="d">A four-layer stack showing how raw RFID reads become business events. At the bottom, readers — fixed portals and handhelds — produce raw EPC reads. Above them, middleware filters duplicate reads, applies business rules and publishes. Above that, EPCIS events record what, when, where and why, following the GS1 standard. At the top, enterprise systems WMS, TMS and ERP act on the clean events. Upward chevrons show data rising and noise falling as it moves up the stack.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FROM ANTENNA TO ENTERPRISE RECORD</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Turning raw reads into business events</text>
<text x="600" y="134" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Raw reads enter at the bottom; clean, deduplicated events rise to the top.</text>

<!-- LAYER 4: enterprise (top) -->
<rect x="200" y="168" width="936" height="76" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<circle cx="140" cy="206" r="17" fill="#3d6b6b"/><text x="140" y="212" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="228" y="200" font-size="15.5" font-weight="800" letter-spacing="0.3" fill="#234a4a">ENTERPRISE</text>
<text x="228" y="224" font-size="13.5" fill="#4f4f4f">WMS · TMS · ERP act on clean, business-ready events</text>

<path d="M618 260 L630 248 L642 260" stroke="#3d6b6b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

<!-- LAYER 3: EPCIS -->
<rect x="200" y="266" width="936" height="76" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<circle cx="140" cy="304" r="17" fill="#3d6b6b"/><text x="140" y="310" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="228" y="298" font-size="15.5" font-weight="800" letter-spacing="0.3" fill="#234a4a">EPCIS EVENTS</text>
<text x="228" y="322" font-size="13.5" fill="#4f4f4f">what · when · where · why — the GS1 event-sharing standard</text>

<path d="M618 358 L630 346 L642 358" stroke="#3d6b6b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

<!-- LAYER 2: middleware -->
<rect x="200" y="364" width="936" height="76" rx="14" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.6"/>
<circle cx="140" cy="402" r="17" fill="#4a5568"/><text x="140" y="408" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="228" y="396" font-size="15.5" font-weight="800" letter-spacing="0.3" fill="#3a4658">MIDDLEWARE</text>
<text x="228" y="420" font-size="13.5" fill="#4f4f4f">filter duplicate reads · apply business rules · publish via REST / EPCIS</text>

<path d="M618 456 L630 444 L642 456" stroke="#4a5568" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

<!-- LAYER 1: readers (bottom) -->
<rect x="200" y="462" width="936" height="76" rx="14" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.6"/>
<circle cx="140" cy="500" r="17" fill="#4a5568"/><text x="140" y="506" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="228" y="494" font-size="15.5" font-weight="800" letter-spacing="0.3" fill="#3a4658">READERS</text>
<text x="228" y="518" font-size="13.5" fill="#4f4f4f">fixed portals + handhelds → high-volume raw EPC reads</text>

<text x="600" y="592" text-anchor="middle" font-size="14.5" fill="#4f4f4f">A fixed reader repeats the same pallet endlessly — middleware is what turns that into one event.</text>
</svg>
