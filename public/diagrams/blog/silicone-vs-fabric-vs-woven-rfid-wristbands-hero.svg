<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Silicone vs fabric vs woven RFID wristbands — three different wear-and-water bets</title>
<desc id="d">Three RFID wristband materials compared. Silicone (VMQ or LSR, reusable) runs 15 to 30 reuse cycles, 3 to 10 day wear, waterproof to IP67+, at $0.55 to $1.40 FOB, best for resorts, waterparks, cruises and gyms. Fabric (Tyvek or PVC-coated paper, single-use) is disposable, 1 to 3 day wear, water-resistant, at $0.18 to $0.45 FOB, best for festivals, concerts and day events. Woven polyester (premium branded) is single-use or 1 to 3 cycles, 1 to 7 day wear, water-resistant, at $0.60 to $1.20 FOB, best for multi-day festivals, corporate events and premium hospitality. The same chips — MIFARE Classic 1K, NTAG213 and DESFire EV3 — fit all three, so the material is the wear-and-water decision.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID WRISTBANDS · SILICONE vs FABRIC vs WOVEN</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Three different bets, not three prices for one thing</text>
<text x="600" y="128" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Pick by wear-time and water exposure, not by material preference.</text>

<!-- SILICONE (teal) -->
<rect x="64" y="150" width="344" height="404" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="64" y="150" width="344" height="8" rx="4" fill="#3d6b6b"/>
<text x="88" y="192" font-size="20" font-weight="800" fill="#2c5454">Silicone</text>
<text x="88" y="214" font-size="12.5" fill="#5c5c5c">VMQ · LSR · reusable</text>
<rect x="286" y="176" width="100" height="30" rx="15" fill="#3d6b6b"/><rect x="322" y="184" width="28" height="14" rx="3" fill="#7fa6a6"/>
<text x="88" y="256" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">REUSE</text>
<text x="88" y="276" font-size="14.5" fill="#291c0e">15–30 cycles</text>
<text x="88" y="308" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">WEAR · WATER</text>
<text x="88" y="328" font-size="14.5" fill="#291c0e">3–10 days · waterproof IP67+</text>
<text x="88" y="360" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">COST FOB (10k+)</text>
<text x="88" y="382" font-size="20" font-weight="800" fill="#2c5454">$0.55–1.40</text>
<text x="88" y="404" font-size="12" fill="#5c5c5c">amortized ~$0.08–0.10 / guest</text>
<text x="88" y="454" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">BEST FOR</text>
<text x="88" y="476" font-size="13" fill="#333333">Resorts, waterparks,</text>
<text x="88" y="496" font-size="13" fill="#333333">cruises, gyms, spas</text>

<!-- FABRIC (steel) -->
<rect x="428" y="150" width="344" height="404" rx="14" fill="#eef1f4" stroke="#c3ccd8" stroke-width="1.6"/>
<rect x="428" y="150" width="344" height="8" rx="4" fill="#4a5568"/>
<text x="452" y="192" font-size="20" font-weight="800" fill="#3a4456">Fabric</text>
<text x="452" y="214" font-size="12.5" fill="#5c5c5c">Tyvek · PVC · single-use</text>
<rect x="650" y="178" width="100" height="26" rx="4" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="662" y="184" width="16" height="14" rx="2" fill="#94a0b0"/>
<text x="452" y="256" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">REUSE</text>
<text x="452" y="276" font-size="14.5" fill="#291c0e">Disposable, 1 use</text>
<text x="452" y="308" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">WEAR · WATER</text>
<text x="452" y="328" font-size="14.5" fill="#291c0e">1–3 days · water-resistant</text>
<text x="452" y="360" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">COST FOB (10k+)</text>
<text x="452" y="382" font-size="20" font-weight="800" fill="#3a4456">$0.18–0.45</text>
<text x="452" y="404" font-size="12" fill="#5c5c5c">direct = unit cost, ~$0.30 / guest</text>
<text x="452" y="454" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">BEST FOR</text>
<text x="452" y="476" font-size="13" fill="#333333">Festivals, concerts,</text>
<text x="452" y="496" font-size="13" fill="#333333">day events, short-stay</text>

<!-- WOVEN (gold) -->
<rect x="792" y="150" width="344" height="404" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<rect x="792" y="150" width="344" height="8" rx="4" fill="#c39a5f"/>
<text x="816" y="192" font-size="20" font-weight="800" fill="#8a6d34">Woven</text>
<text x="816" y="214" font-size="12.5" fill="#5c5c5c">polyester · premium brand</text>
<rect x="1014" y="178" width="100" height="26" rx="4" fill="#e8d3a6"/><rect x="1026" y="184" width="76" height="3" rx="1" fill="#b6934f"/><rect x="1026" y="192" width="76" height="3" rx="1" fill="#b6934f"/>
<text x="816" y="256" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">REUSE</text>
<text x="816" y="276" font-size="14.5" fill="#291c0e">Single-use (1–3 cycles)</text>
<text x="816" y="308" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">WEAR · WATER</text>
<text x="816" y="328" font-size="14.5" fill="#291c0e">1–7 days · water-resistant</text>
<text x="816" y="360" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">COST FOB (10k+)</text>
<text x="816" y="382" font-size="20" font-weight="800" fill="#8a6d34">$0.60–1.20</text>
<text x="816" y="404" font-size="12" fill="#5c5c5c">direct = unit cost, ~$0.90 / guest</text>
<text x="816" y="454" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">BEST FOR</text>
<text x="816" y="476" font-size="13" fill="#333333">Multi-day festivals,</text>
<text x="816" y="496" font-size="13" fill="#333333">corporate, premium hospitality</text>

<text x="600" y="592" text-anchor="middle" font-size="14.5" fill="#291c0e">The same chips (MIFARE Classic 1K, NTAG213, DESFire EV3) fit all three —</text>
<text x="600" y="614" text-anchor="middle" font-size="14.5" fill="#4f4f4f">so the material is the wear-and-water decision, not the chip decision.</text>
</svg>
