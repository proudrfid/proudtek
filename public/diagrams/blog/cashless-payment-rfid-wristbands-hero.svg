<circle cx="300" cy="300" r="16" fill="#1f6f3a"/>
<text x="300" y="306" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">+</text>
<text x="238" y="392" text-anchor="middle" font-size="13" fill="#5c5c5c">online · kiosk ·</text>
<text x="238" y="412" text-anchor="middle" font-size="13" fill="#5c5c5c">cash-to-credit</text>

