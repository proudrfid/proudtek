<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The tap-to-review path for the restaurant NFC card program</title>
  <desc id="d">A three-step flow. Step one: a guest taps their phone to the NTAG215 NFC Forum Type 2 card at a booth or takeout counter, read natively with no app. Step two: the phone opens the store's per-store Google Review URL, g.page/r/store-id/review. Step three: the guest leaves a rating and the review posts to the store's profile. A QR code on the card reverse is the fallback for phones without a tap path. Tabletop conversion rose from 0.7% on a QR code to 2.1% on an NFC tap.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE TAP-TO-REVIEW PATH</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">One tap — no camera, no app, no typing a search</text>

  <!-- Panel A: TAP -->
  <rect x="70" y="150" width="300" height="250" rx="14" fill="#fbf7ee" stroke="#e6dfd2" stroke-width="2"/>
  <text x="220" y="188" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#3d6b6b">1 · TAP</text>
  <rect x="150" y="212" width="56" height="98" rx="11" fill="#4a5568"/>
  <rect x="160" y="224" width="36" height="66" rx="3" fill="#dfe4ea"/>
  <rect x="238" y="238" width="86" height="54" rx="8" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <rect x="300" y="250" width="16" height="12" rx="2" fill="#4a5568"/>
  <path d="M214 250 q16 15 0 30" fill="none" stroke="#3d6b6b" stroke-width="2"/>
  <path d="M222 244 q22 21 0 42" fill="none" stroke="#3d6b6b" stroke-width="2"/>
  <text x="220" y="350" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Phone to the NTAG215 card</text>
  <text x="220" y="372" text-anchor="middle" font-size="12.5" fill="#5c5c5c">NFC Forum Type 2 — read natively</text>

  <!-- arrow A to B -->
  <line x1="384" y1="275" x2="440" y2="275" stroke="#c39a5f" stroke-width="3"/>
  <path d="M440 267 L456 275 L440 283 Z" fill="#c39a5f"/>

  <!-- Panel B: OPEN -->
  <rect x="470" y="150" width="300" height="250" rx="14" fill="#fbf7ee" stroke="#e6dfd2" stroke-width="2"/>
  <text x="620" y="188" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#3d6b6b">2 · OPEN</text>
  <rect x="580" y="210" width="80" height="112" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <rect x="592" y="224" width="56" height="16" rx="4" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
  <rect x="592" y="250" width="56" height="6" rx="3" fill="#dfe4ea"/>
  <rect x="592" y="264" width="44" height="6" rx="3" fill="#dfe4ea"/>
  <rect x="592" y="278" width="52" height="6" rx="3" fill="#dfe4ea"/>
  <text x="620" y="350" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Opens the per-store review URL</text>
  <text x="620" y="372" text-anchor="middle" font-size="12.5" fill="#3d6b6b">g.page/r/&lt;store-id&gt;/review</text>

  <!-- arrow B to C -->
  <line x1="784" y1="275" x2="840" y2="275" stroke="#c39a5f" stroke-width="3"/>
  <path d="M840 267 L856 275 L840 283 Z" fill="#c39a5f"/>

  <!-- Panel C: POST -->
  <rect x="870" y="150" width="300" height="250" rx="14" fill="#fbf7ee" stroke="#e6dfd2" stroke-width="2"/>
  <text x="1020" y="188" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#3d6b6b">3 · POST</text>
  <text x="1020" y="272" text-anchor="middle" font-size="40" fill="#d4a755">★★★★★</text>
  <text x="1020" y="350" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Rating posts to the store</text>
  <text x="1020" y="372" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Google review published</text>

  <!-- summary card -->
  <rect x="70" y="430" width="1060" height="170" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="466" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">ONE TAP, THREE STEPS — WITH A QR FALLBACK</text>
  <text x="600" y="500" text-anchor="middle" font-size="16" font-weight="700" fill="#2c5454">Tabletop conversion rose from 0.7% (QR code) to 2.1% (NFC tap)</text>
  <text x="600" y="530" text-anchor="middle" font-size="13.5" fill="#3d6b6b">Chip: NXP NTAG215 · NFC Forum Type 2 · 504 bytes user memory</text>
  <text x="600" y="558" text-anchor="middle" font-size="13.5" fill="#3d6b6b">Fallback: QR code on the card reverse for iPhone 7–X and non-NFC Android</text>
</svg>
