<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="esct escd" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="esct">How DSCSA non-compliance escalates</title>
<desc id="escd">DSCSA non-compliance escalates in five rising steps: a Form FDA-483 observation, an FDA warning letter within about six months if uncorrected and made public, an enforcement action such as injunction, consent decree or import alert, exclusion by trading partners as top-10 manufacturers stop shipping, and finally counterfeit liability carrying civil and criminal exposure plus insurance premium increases of 20 to 40 percent.</desc>
<defs><radialGradient id="escbg" cx="50%" cy="18%" r="95%"><stop offset="0%" stop-color="#f8f0df"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#escbg)"/>
<rect x="20" y="20" width="1160" height="635" rx="24" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600.0" y="58" text-anchor="middle" font-size="25" font-weight="800" fill="#6d5a3a" letter-spacing="1.3">THE COST OF FAILURE ESCALATES</text>
