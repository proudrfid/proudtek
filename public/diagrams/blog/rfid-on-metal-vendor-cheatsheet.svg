<text x="382" y="166" text-anchor="end" font-size="12.5" fill="#6d5a3a">Finland</text>
<rect x="66" y="182" width="226" height="26" rx="13" fill="#eaf3ed" stroke="#1f6f3a" stroke-width="1.4"/>
<text x="179" y="199" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">$1.20–$3.50 / tag · MOQ 5K–25K</text>
<text x="66" y="234" font-size="13" font-weight="600" fill="#291c0e">Survivor B · Ironside Slim &amp; Steam</text>
<text x="66" y="256" font-size="13" font-weight="600" fill="#291c0e">Steelwave (long-range rail &amp; container)</text>
<text x="66" y="284" font-size="12.5" fill="#4f4f4f">NXP UCODE 9 or Impinj M730 inside</text>
<text x="66" y="306" font-size="12.5" fill="#4f4f4f">sweet spot: IT assets, RTI, rail</text>

<rect x="419" y="130" width="356" height="212" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
