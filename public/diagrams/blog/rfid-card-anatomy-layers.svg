<text x="716" y="513" font-size="13.5" fill="#4f4f4f">more artwork, if you insist</text>

<text x="600" y="586" text-anchor="middle" font-size="14.5" font-weight="600" fill="#291c0e">Fused under heat and pressure into 0.76mm — about 8 sheets of paper</text>
<text x="600" y="612" text-anchor="middle" font-size="13" fill="#5c5c5c">The chip itself is 1-2mm square: genuinely smaller than a grain of rice</text>
