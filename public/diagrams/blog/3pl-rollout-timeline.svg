<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="rtTitle rtDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="rtTitle">The 24-week RFID rollout in four KPI-gated phases</title>
  <desc id="rtDesc">A four-phase timeline. Phase 1 (weeks 1 to 4): tag 100% of inbound cases for two top-volume brands with 73 by 23 millimeter labels at $0.09 each, 580,000 labels in year one. Phase 2 (weeks 5 to 10): install 12 fixed dock-door portals using Impinj R420 readers and Times-7 A5020 antennas with tuned read zones. Phase 3 (weeks 11 to 16): roll Zebra RFD8500 handhelds for cycle counts and exception picking, lifting throughput from 180 to 1,400 cases per hour. Phase 4 (weeks 17 to 24): add 800 reusable on-metal pallet tags at $1.40 and integrate with SAP EWM. Total capex $187K, annual opex $58K.</desc>
  <defs>
    <radialGradient id="rtBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="rtDark" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#rtBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="1.2" fill="#6d5a3a">24 WEEKS · 4 PHASES · EACH ONE GATED ON A KPI</text>

  <!-- Axis -->
  <line x1="188" y1="214" x2="1052" y2="214" stroke="#c39a5f" stroke-width="5"/>
  <text x="188" y="180" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">WEEKS 1–4</text>
  <text x="476" y="180" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">WEEKS 5–10</text>
  <text x="764" y="180" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">WEEKS 11–16</text>
  <text x="1052" y="180" text-anchor="middle" font-size="16.5" font-weight="800" fill="#177a92">WEEKS 17–24</text>
  <circle cx="188" cy="214" r="15" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/>
  <circle cx="476" cy="214" r="15" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/>
  <circle cx="764" cy="214" r="15" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/>
  <circle cx="1052" cy="214" r="18" fill="#1fcefb" stroke="#ffffff" stroke-width="4"/>

  <!-- Phase 1 -->
  <rect x="56" y="248" width="264" height="284" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="126" y="268" width="124" height="30" rx="15" fill="#efe0bf"/>
  <text x="188" y="289" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">PHASE 1</text>
  <text x="188" y="336" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Tag the cases</text>
  <text x="188" y="374" text-anchor="middle" font-size="14.5" fill="#4f4f4f">100% inbound cases,</text>
  <text x="188" y="396" text-anchor="middle" font-size="14.5" fill="#4f4f4f">2 top-volume brands</text>
  <text x="188" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">73×23 mm labels @ $0.09</text>
  <text x="188" y="452" text-anchor="middle" font-size="14.5" fill="#4f4f4f">580K labels in year one</text>

  <!-- Phase 2 -->
  <rect x="344" y="248" width="264" height="284" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="414" y="268" width="124" height="30" rx="15" fill="#efe0bf"/>
  <text x="476" y="289" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">PHASE 2</text>
  <text x="476" y="336" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Frame the doors</text>
  <text x="476" y="374" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">12 fixed dock-door portals</text>
  <text x="476" y="402" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Impinj R420 readers +</text>
  <text x="476" y="424" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Times-7 A5020 antennas</text>
  <text x="476" y="452" text-anchor="middle" font-size="14.5" fill="#4f4f4f">tuned zones, no cross-reads</text>

  <!-- Phase 3 -->
  <rect x="632" y="248" width="264" height="284" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="702" y="268" width="124" height="30" rx="15" fill="#efe0bf"/>
  <text x="764" y="289" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">PHASE 3</text>
  <text x="764" y="336" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Arm the counters</text>
  <text x="764" y="372" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Zebra RFD8500 handhelds,</text>
  <text x="764" y="394" text-anchor="middle" font-size="14.5" fill="#4f4f4f">cycle counts + exceptions</text>
  <rect x="664" y="414" width="200" height="40" rx="20" fill="#eaf9fe"/>
  <text x="764" y="441" text-anchor="middle" font-size="17.5" font-weight="800" fill="#177a92">180 → 1,400 /hr</text>

  <!-- Phase 4 -->
  <rect x="920" y="248" width="264" height="284" rx="16" fill="#fbf8f2" stroke="#1fcefb" stroke-width="2.5"/>
  <rect x="990" y="268" width="124" height="30" rx="15" fill="#eaf9fe"/>
  <text x="1052" y="289" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1" fill="#177a92">PHASE 4</text>
  <text x="1052" y="336" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Tag the pallets</text>
  <text x="1052" y="374" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">800 reusable pallet tags</text>
  <text x="1052" y="398" text-anchor="middle" font-size="14.5" fill="#4f4f4f">@ $1.40, on-metal hard tag</text>
  <text x="1052" y="426" text-anchor="middle" font-size="14.5" fill="#4f4f4f">staged-pallet tracking,</text>
  <text x="1052" y="448" text-anchor="middle" font-size="14.5" fill="#4f4f4f">integrated with SAP EWM</text>

  <!-- Footer strip -->
  <rect x="56" y="552" width="1088" height="86" rx="16" fill="url(#rtDark)"/>
  <text x="88" y="590" font-size="16" font-weight="700" fill="#ffffff">Total capex $187K — readers + antennas + middleware.</text>
  <text x="88" y="617" font-size="15" fill="#e9d9b8">Annual opex $58K — consumable labels + tag breakage.</text>
  <text x="1112" y="595" text-anchor="end" font-size="15" font-style="italic" font-weight="700" fill="#8fdcf3">Next time? Pallet tags in Phase 2.</text>
  <text x="1112" y="617" text-anchor="end" font-size="14" font-style="italic" fill="#e9d9b8">Hindsight ships fast.</text>
</svg>
