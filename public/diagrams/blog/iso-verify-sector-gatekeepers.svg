<rect x="454" y="484" width="150" height="28" rx="14" fill="#eef5f5" stroke="#cfe0e0"/>
<text x="529" y="503" text-anchor="middle" font-size="12.5" fill="#2c5454">per-market testing</text>

<!-- tile 6: radio marks -->
<rect x="784" y="344" width="344" height="200" rx="14" fill="#fbf8f1" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="784" y="344" width="6" height="200" rx="3" fill="#2d6a4f"/>
<text x="810" y="382" font-size="16.5" font-weight="700" fill="#291c0e">CE RED · SRRC · RCM · ICASA</text>
<text x="810" y="408" font-size="13.5" fill="#4f4f4f">EU · China · AU/NZ · South Africa</text>
<text x="810" y="436" font-size="12.5" fill="#5c5c5c">radio marks for each market</text>
<text x="810" y="456" font-size="12.5" fill="#8b2d2d">no mark — customs cannot clear it</text>
<rect x="810" y="484" width="150" height="28" rx="14" fill="#eef5f5" stroke="#cfe0e0"/>
<text x="885" y="503" text-anchor="middle" font-size="12.5" fill="#2c5454">per-market testing</text>

<text x="600" y="584" text-anchor="middle" font-size="15" fill="#4f4f4f">6-12 months of audit prep per standard — there is no expedite fee on an audit calendar</text>
<text x="600" y="608" text-anchor="middle" font-size="13.5" fill="#5c5c5c">match the gatekeeper to your customers before the PO, not after</text>
</svg>
