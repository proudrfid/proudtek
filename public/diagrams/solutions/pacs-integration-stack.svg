<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">PACS integration stack from credential to head-end</title>
<desc id="d">Five numbered layers of a physical access control system, stacked top to bottom: the credential (DESFire EV3, Seos, MIFARE Classic, 125 kHz LF), the reader (HID Signo, multiCLASS SE, OMNIKEY), the reader-to-panel wiring (OSDP v2.2 Secure Channel over RS-485, with legacy Wiegand still common in walls), the controller panel (Mercury LP, Lenel LNL-X, iSTAR Ultra) and the PACS head-end software (Genetec Synergis, OnGuard, Pro-Watch, C·CURE 9000, Symmetry, Command Centre). Credentials must be encoded to match every layer above them.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PACS INTEGRATION STACK</text>
<text x="600" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Five layers between a tap and an open door</text>
<text x="600" y="124" text-anchor="middle" font-size="15" fill="#4f4f4f">The credential is layer one of five — its encoding has to match everything above it.</text>

<line x1="72" y1="185" x2="72" y2="521" stroke="#c8cfda" stroke-width="3"/>

<circle cx="72" cy="185" r="17" fill="#d4a755"/>
<text x="72" y="190.5" text-anchor="middle" font-size="14" font-weight="800" fill="#291c0e">1</text>
<rect x="104" y="150" width="1000" height="70" rx="12" fill="#4a5568" stroke="#3a4353" stroke-width="2"/>
<text x="130" y="180" font-size="15.5" font-weight="800" fill="#ffffff">Credential</text>
<text x="1078" y="180" text-anchor="end" font-size="13" fill="#e6e9ee">DESFire EV3 · iCLASS Seos · MIFARE Classic · 125 kHz LF</text>
<text x="130" y="203" font-size="12.5" fill="#c8cfda">card, fob, wristband — the layer you buy here</text>

<circle cx="72" cy="269" r="17" fill="#d4a755"/>
<text x="72" y="274.5" text-anchor="middle" font-size="14" font-weight="800" fill="#291c0e">2</text>
<rect x="104" y="234" width="1000" height="70" rx="12" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="130" y="264" font-size="15.5" font-weight="700" fill="#291c0e">Reader</text>
<text x="1078" y="264" text-anchor="end" font-size="13" fill="#4f4f4f">HID Signo · multiCLASS SE · OMNIKEY 5427CK</text>
<text x="130" y="287" font-size="12.5" fill="#5c5c5c">multi-frequency at the door — LF and HF during migrations</text>

<circle cx="72" cy="353" r="17" fill="#d4a755"/>
<text x="72" y="358.5" text-anchor="middle" font-size="14" font-weight="800" fill="#291c0e">3</text>
<rect x="104" y="318" width="1000" height="70" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="130" y="348" font-size="15.5" font-weight="700" fill="#234a4a">Wiring</text>
<text x="1078" y="348" text-anchor="end" font-size="13" fill="#2c5454">OSDP v2.2 Secure Channel · RS-485 multi-drop</text>
<text x="130" y="371" font-size="12.5" fill="#5c5c5c">legacy Wiegand still lives in many walls — see the migration section</text>

<circle cx="72" cy="437" r="17" fill="#d4a755"/>
<text x="72" y="442.5" text-anchor="middle" font-size="14" font-weight="800" fill="#291c0e">4</text>
<rect x="104" y="402" width="1000" height="70" rx="12" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="130" y="432" font-size="15.5" font-weight="700" fill="#291c0e">Controller panel</text>
<text x="1078" y="432" text-anchor="end" font-size="13" fill="#4f4f4f">Mercury LP-series · Lenel LNL-X · iSTAR Ultra</text>
<text x="130" y="455" font-size="12.5" fill="#5c5c5c">the door decision happens here, online or off</text>

<circle cx="72" cy="521" r="17" fill="#d4a755"/>
<text x="72" y="526.5" text-anchor="middle" font-size="14" font-weight="800" fill="#291c0e">5</text>
<rect x="104" y="486" width="1000" height="70" rx="12" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="130" y="516" font-size="15.5" font-weight="700" fill="#291c0e">PACS head-end</text>
<text x="1078" y="516" text-anchor="end" font-size="13" fill="#4f4f4f">Genetec · OnGuard · Pro-Watch · C·CURE 9000 · Symmetry · Command Centre</text>
<text x="130" y="539" font-size="12.5" fill="#5c5c5c">enrolment, hot-lists, audit logs — where compliance evidence comes from</text>

<text x="600" y="608" text-anchor="middle" font-size="14" fill="#5c5c5c">Send a sample credential or the reader model — chip and encoding format are confirmed against this stack before production.</text>
</svg>
