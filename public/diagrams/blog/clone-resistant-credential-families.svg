<text x="96" y="280" font-size="17" font-weight="800" fill="#291c0e">HID Seos</text>
<text x="96" y="304" font-size="12.5" font-weight="700" fill="#234a4a">open standard</text>
<text x="452" y="277" font-size="14" fill="#333333">AES-128 + ECC key exchange</text>
<text x="452" y="301" font-size="12.5" fill="#5c5c5c">SIO portable data wrapper</text>
<text x="812" y="289" font-size="14" fill="#333333">HID estates: card, mobile, IT logon</text>

