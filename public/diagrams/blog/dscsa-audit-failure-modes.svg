<line x1="265.0" y1="326" x2="279.0" y2="326" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<line x1="272.0" y1="319" x2="272.0" y2="333" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<text x="300.0" y="332" text-anchor="start" font-size="17.5" font-weight="800" fill="#291c0e">AS2 / EPCIS drift</text>
<text x="262.0" y="358" text-anchor="start" font-size="13" font-weight="500" fill="#4f4f4f">Cert expiries and 1.2 -&gt; 2.0 skew cause 1-5%</text>
<text x="262.0" y="376" text-anchor="start" font-size="13" font-weight="500" fill="#4f4f4f">silent message failures.</text>
<rect x="256.0" y="390" width="314" height="30" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.4" stroke-opacity="0.5"/>
<text x="413.0" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">Fix: dashboard, 24-hour alerting</text>
<rect x="612.0" y="286" width="350" height="150" rx="18" fill="#eef5ef" stroke="#2d6a4f" stroke-width="2" stroke-opacity="0.35"/><rect x="612.0" y="286" width="350" height="8" rx="4" fill="#2d6a4f"/>
<circle cx="646.0" cy="326" r="17" fill="#2d6a4f"/>
<line x1="639.0" y1="326" x2="653.0" y2="326" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<line x1="646.0" y1="319" x2="646.0" y2="333" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<text x="674.0" y="332" text-anchor="start" font-size="17.5" font-weight="800" fill="#291c0e">Suspect-product handling</text>
<text x="636.0" y="358" text-anchor="start" font-size="13" font-weight="500" fill="#4f4f4f">Quarantine within hours; investigate within</text>
<text x="636.0" y="376" text-anchor="start" font-size="13" font-weight="500" fill="#4f4f4f">6-7 days; report to FDA.</text>
<rect x="630.0" y="390" width="314" height="30" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.4" stroke-opacity="0.5"/>
<text x="787.0" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#2d6a4f">Fix: one stitched case file</text>
<text x="600.0" y="645" text-anchor="middle" font-size="18" font-weight="700" fill="#6d5a3a">Five traps cause most findings — each has a durable, boring fix.</text>
