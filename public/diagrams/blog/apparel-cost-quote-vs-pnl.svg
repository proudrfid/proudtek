<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The vendor quote vs the P&amp;L: five hidden costs that add 8-15% to program spend</title>
<desc id="d">Side-by-side comparison of two documents. Left, the vendor quote — tidy, five lines, technically true: UHF inlay at $0.04-0.08, application at source $0.01-0.03, encoding stations $5K-15K, tunnel reader $15K-50K, EDI 856 ASN setup $8K-25K. Right, the P&amp;L twelve months later — the same program plus five extra guests: tag yield loss where 1-3% fail QC and never ship, re-encoding for SKU changes at 5-10% of encoded volume a year, read-rate scorecard penalties of $5K-30K a year in chargebacks near the 95% line, EDI re-transmission and reconciliation at 2-4 hours a week per major retailer, and audit fees of $10K-25K a year for third-party verification. A dark stamp between them reads plus 8-15% of total program spend.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE COSTS NOBODY QUOTES YOU</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Five gremlins the vendor quote leaves out</text>

<!-- left: the quote -->
<rect x="80" y="130" width="480" height="410" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="320" y="166" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#6d5a3a">THE VENDOR QUOTE</text>
<text x="320" y="188" text-anchor="middle" font-size="12.5" fill="#5c5c5c">tidy · five lines · technically true</text>
<line x1="116" y1="206" x2="524" y2="206" stroke="#eee6d6" stroke-width="1.5"/>
<text x="116" y="244" font-size="14.5" fill="#291c0e">UHF inlay (ARC-certified)</text>
<text x="524" y="244" text-anchor="end" font-size="14.5" font-weight="700" fill="#2c5454">$0.04–0.08</text>
<text x="116" y="292" font-size="14.5" fill="#291c0e">Application at source</text>
<text x="524" y="292" text-anchor="end" font-size="14.5" font-weight="700" fill="#2c5454">$0.01–0.03</text>
<text x="116" y="340" font-size="14.5" fill="#291c0e">Encoding stations</text>
<text x="524" y="340" text-anchor="end" font-size="14.5" font-weight="700" fill="#2c5454">$5K–15K</text>
<text x="116" y="388" font-size="14.5" fill="#291c0e">Tunnel reader</text>
<text x="524" y="388" text-anchor="end" font-size="14.5" font-weight="700" fill="#2c5454">$15K–50K</text>
<text x="116" y="436" font-size="14.5" fill="#291c0e">EDI 856 ASN setup</text>
<text x="524" y="436" text-anchor="end" font-size="14.5" font-weight="700" fill="#2c5454">$8K–25K</text>
<line x1="116" y1="464" x2="524" y2="464" stroke="#eee6d6" stroke-width="1.5"/>
<text x="320" y="500" text-anchor="middle" font-size="13" fill="#5c5c5c">the version that gets screenshotted for the board deck</text>

<!-- plus -->
<circle cx="600" cy="335" r="24" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<text x="600" y="345" text-anchor="middle" font-size="26" font-weight="700" fill="#8a6b3c">+</text>

<!-- right: the P&L -->
<rect x="640" y="130" width="480" height="410" rx="14" fill="#fbf6ec" stroke="#e4c98f" stroke-width="2"/>
<text x="880" y="166" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#6d5a3a">THE P&amp;L, TWELVE MONTHS LATER</text>
<text x="880" y="188" text-anchor="middle" font-size="12.5" fill="#5c5c5c">same program · five extra guests</text>
<line x1="676" y1="206" x2="1084" y2="206" stroke="#e6dcc8" stroke-width="1.5"/>
<rect x="676" y="227" width="12" height="12" rx="3" fill="#2c5454"/>
<text x="700" y="238" font-size="14.5" font-weight="700" fill="#291c0e">Tag yield loss</text>
<text x="700" y="257" font-size="12.5" fill="#4f4f4f">1–3% fail QC and never ship — buffer 2%</text>
<rect x="676" y="289" width="12" height="12" rx="3" fill="#2c5454"/>
<text x="700" y="300" font-size="14.5" font-weight="700" fill="#291c0e">Re-encoding for SKU changes</text>
<text x="700" y="319" font-size="12.5" fill="#4f4f4f">5–10% of encoded volume, every year</text>
<rect x="676" y="351" width="12" height="12" rx="3" fill="#8b2d2d"/>
<text x="700" y="362" font-size="14.5" font-weight="700" fill="#291c0e">Read-rate scorecard penalties</text>
<text x="700" y="381" font-size="12.5" fill="#4f4f4f">$5K–30K / yr in chargebacks near the 95% line</text>
<rect x="676" y="413" width="12" height="12" rx="3" fill="#2c5454"/>
<text x="700" y="424" font-size="14.5" font-weight="700" fill="#291c0e">EDI re-transmit &amp; reconcile</text>
<text x="700" y="443" font-size="12.5" fill="#4f4f4f">2–4 hr / week per major retailer</text>
<rect x="676" y="475" width="12" height="12" rx="3" fill="#2c5454"/>
<text x="700" y="486" font-size="14.5" font-weight="700" fill="#291c0e">Audit fees &amp; consulting</text>
<text x="700" y="505" font-size="12.5" fill="#4f4f4f">$10K–25K / yr third-party verification</text>

<!-- stamp -->
<rect x="488" y="566" width="224" height="64" rx="12" fill="#291c0e"/>
<text x="600" y="596" text-anchor="middle" font-size="22" font-weight="700" fill="#d4a755">+8–15%</text>
<text x="600" y="618" text-anchor="middle" font-size="12" fill="#cbbfa5">of total program spend</text>
</svg>
