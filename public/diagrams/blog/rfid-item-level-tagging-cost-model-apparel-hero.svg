<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How a $0.05 apparel RFID tag becomes a $5M-8M three-year program</title>
<desc id="d">Hero banner for the apparel item-level RFID cost model. On the left, a paper hangtag holds an RFID inlay — spiral antenna coil and gold chip — with a dark price coin reading $0.05 per tag. Arrows carry it rightward through three additive steps: times 10M units a year, plus hardware and integration, plus operating costs and people. On the right, a dark panel shows where it lands: $5M-8M of cumulative three-year program spend for a tier-1 supplier shipping 10M units a year, fully compliant with Walmart and Target mandates. A caption notes the tag is the appetizer; the program around it is the bill.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">APPAREL ITEM-LEVEL RFID · THE COST MODEL</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">How a $0.05 tag becomes a $5M line item</text>
<text x="600" y="130" text-anchor="middle" font-size="15" fill="#4f4f4f">Tags, hardware, integration and the operating costs nobody screenshots for the board deck.</text>

<!-- hangtag -->
<path d="M210 244 C210 220 180 210 150 206" fill="none" stroke="#c9bda6" stroke-width="5" stroke-linecap="round"/>
<rect x="110" y="230" width="200" height="250" rx="18" fill="#fdf9f0" stroke="#e4c98f" stroke-width="2"/>
<circle cx="210" cy="265" r="11" fill="#ffffff" stroke="#d9c9a8" stroke-width="5"/>
<rect x="140" y="300" width="140" height="110" rx="9" fill="none" stroke="#3d6b6b" stroke-width="4"/>
<rect x="156" y="316" width="108" height="78" rx="7" fill="none" stroke="#6f9494" stroke-width="3"/>
<rect x="172" y="332" width="76" height="46" rx="5" fill="none" stroke="#a4c0c0" stroke-width="2.5"/>
<rect x="194" y="342" width="32" height="26" rx="5" fill="#c39a5f" stroke="#8a6b3c" stroke-width="1.5"/>
<line x1="194" y1="350" x2="180" y2="350" stroke="#6d5a3a" stroke-width="2.5"/>
<line x1="194" y1="360" x2="180" y2="360" stroke="#6d5a3a" stroke-width="2.5"/>
<line x1="226" y1="350" x2="240" y2="350" stroke="#6d5a3a" stroke-width="2.5"/>
<line x1="226" y1="360" x2="240" y2="360" stroke="#6d5a3a" stroke-width="2.5"/>
<rect x="140" y="428" width="100" height="8" rx="4" fill="#e6dcc8"/>
<rect x="140" y="444" width="64" height="8" rx="4" fill="#eee6d6"/>

<!-- price coin -->
<circle cx="320" cy="460" r="44" fill="#291c0e"/>
<circle cx="320" cy="460" r="50" fill="none" stroke="#d4a755" stroke-width="2" stroke-dasharray="4 5"/>
<text x="320" y="456" text-anchor="middle" font-size="20" font-weight="700" fill="#d4a755">$0.05</text>
<text x="320" y="478" text-anchor="middle" font-size="12" letter-spacing="1" fill="#b9a67e">PER TAG</text>

<!-- arrow 1 -->
<line x1="378" y1="360" x2="424" y2="360" stroke="#6d5a3a" stroke-width="2.5"/>
<polygon points="434,360 420,353 420,367" fill="#6d5a3a"/>

<!-- multiplier chips -->
<rect x="446" y="270" width="264" height="46" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="578" y="299" text-anchor="middle" font-size="15" font-weight="600" fill="#291c0e">× 10M units a year</text>
<rect x="446" y="338" width="264" height="46" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="578" y="367" text-anchor="middle" font-size="15" font-weight="600" fill="#291c0e">+ hardware &amp; integration</text>
<rect x="446" y="406" width="264" height="46" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="578" y="435" text-anchor="middle" font-size="15" font-weight="600" fill="#291c0e">+ operating costs &amp; people</text>

<!-- arrow 2 -->
<line x1="722" y1="360" x2="768" y2="360" stroke="#6d5a3a" stroke-width="2.5"/>
<polygon points="778,360 764,353 764,367" fill="#6d5a3a"/>

<!-- program panel -->
<rect x="786" y="240" width="348" height="240" rx="18" fill="#291c0e"/>
<text x="960" y="290" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#d4a755">3-YEAR PROGRAM SPEND</text>
<text x="960" y="360" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="48" font-weight="700" fill="#d4a755">$5M–8M</text>
<text x="960" y="404" text-anchor="middle" font-size="14" fill="#cbbfa5">tier-1 supplier · 10M units a year</text>
<text x="960" y="428" text-anchor="middle" font-size="14" fill="#cbbfa5">fully compliant Walmart + Target</text>

<text x="600" y="576" text-anchor="middle" font-size="13.5" fill="#4f4f4f">The tag is the appetizer. The program around it is the bill — nine cost lines, modeled over three years, before the CFO models them for you.</text>
</svg>
