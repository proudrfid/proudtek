<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="hlS1Title hlS1Desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="hlS1Title">A scale weighs the cart; RFID reads the linen</title>
  <desc id="hlS1Desc">A side-by-side comparison. Weight-based tracking weighs a cart in and out and can only tell you the cart got lighter — it cannot say which sheet went missing or whether a gown skipped a cycle. Per-item RFID keeps a zone-and-timestamp log that names the department losing linen, counts each linen's 50 to 100 wash cycles, and confirms sterile status within the past 24 to 72 hours.</desc>

  <defs>
    <radialGradient id="s1Bg" cx="50%" cy="16%" r="95%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f0ebdf"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#s1Bg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="25" font-weight="800" fill="#291c0e">A scale weighs the cart. RFID reads the linen.</text>
  <text x="600" y="90" text-anchor="middle" font-size="15.5" fill="#2d6a4f">Same laundry, two very different answers to a surveyor's question.</text>

  <!-- LEFT: weight-based -->
  <rect x="62" y="126" width="520" height="502" rx="16" fill="#f7ecea" stroke="#dcb6b0" stroke-width="2"/>
  <rect x="62" y="126" width="520" height="8" rx="4" fill="#8b2d2d"/>
  <text x="322" y="168" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#8b2d2d">WEIGHT-BASED · THE EDUCATED GUESS</text>

  <!-- scale glyph -->
  <line x1="322" y1="200" x2="322" y2="272" stroke="#8b2d2d" stroke-width="3.5"/>
  <path d="M256 216 h132" stroke="#8b2d2d" stroke-width="3.5"/>
  <path d="M232 216 a24 24 0 0 0 48 0 z" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5"/>
  <path d="M364 216 a24 24 0 0 0 48 0 z" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5"/>
  <rect x="288" y="272" width="68" height="14" rx="4" fill="#8b2d2d"/>
  <text x="322" y="314" text-anchor="middle" font-size="14" fill="#734040">Weighs the cart in, weighs it out.</text>

  <g font-size="14.5" fill="#734040">
    <g>
      <circle cx="104" cy="352" r="12" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5"/>
      <line x1="98" y1="346" x2="110" y2="358" stroke="#8b2d2d" stroke-width="2.5"/>
      <line x1="98" y1="358" x2="110" y2="346" stroke="#8b2d2d" stroke-width="2.5"/>
      <text x="128" y="357">Which sheet went missing? <tspan font-weight="700" fill="#8b2d2d">unknown</tspan></text>
    </g>
    <g>
      <circle cx="104" cy="398" r="12" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5"/>
      <line x1="98" y1="392" x2="110" y2="404" stroke="#8b2d2d" stroke-width="2.5"/>
      <line x1="98" y1="404" x2="110" y2="392" stroke="#8b2d2d" stroke-width="2.5"/>
      <text x="128" y="403">Did a gown skip a cycle? <tspan font-weight="700" fill="#8b2d2d">unknown</tspan></text>
    </g>
    <g>
      <circle cx="104" cy="444" r="12" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5"/>
      <line x1="98" y1="438" x2="110" y2="450" stroke="#8b2d2d" stroke-width="2.5"/>
      <line x1="98" y1="450" x2="110" y2="438" stroke="#8b2d2d" stroke-width="2.5"/>
      <text x="128" y="449">Where is the loss coming from? <tspan font-weight="700" fill="#8b2d2d">unknown</tspan></text>
    </g>
  </g>

  <rect x="92" y="536" width="460" height="66" rx="12" fill="#ffffff" stroke="#dcb6b0" stroke-width="1.5"/>
  <text x="322" y="565" text-anchor="middle" font-size="14" fill="#734040">It knows exactly one thing:</text>
  <text x="322" y="588" text-anchor="middle" font-size="17" font-weight="800" fill="#8b2d2d">the cart got lighter.</text>

  <!-- RIGHT: per-item RFID -->
  <rect x="618" y="126" width="520" height="502" rx="16" fill="#f0f6f1" stroke="#a9c8b2" stroke-width="2"/>
  <rect x="618" y="126" width="520" height="8" rx="4" fill="#2d6a4f"/>
  <text x="878" y="168" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#1f6f3a">PER-ITEM RFID · THE RECORD</text>

  <!-- mini log -->
  <rect x="648" y="192" width="460" height="34" rx="8" fill="#ffffff" stroke="#cfe0d4"/>
  <circle cx="670" cy="209" r="5" fill="#1f6f3a"/>
  <text x="686" y="214" font-size="13.5" font-weight="600" fill="#291c0e">GOWN-4471</text>
  <text x="878" y="214" font-size="13.5" fill="#5c5c5c">sterile zone · 07:41</text>
  <text x="1090" y="214" text-anchor="end" font-size="13.5" font-weight="700" fill="#1f6f3a">✓</text>
  <rect x="648" y="232" width="460" height="34" rx="8" fill="#ffffff" stroke="#cfe0d4"/>
  <circle cx="670" cy="249" r="5" fill="#1f6f3a"/>
  <text x="686" y="254" font-size="13.5" font-weight="600" fill="#291c0e">SHEET-2093</text>
  <text x="878" y="254" font-size="13.5" fill="#5c5c5c">ward 5B · 09:12</text>
  <text x="1090" y="254" text-anchor="end" font-size="13.5" font-weight="700" fill="#1f6f3a">✓</text>

  <g font-size="14.5" fill="#3c5c46">
    <g>
      <circle cx="670" cy="316" r="12" fill="#e8f1e9" stroke="#1f6f3a" stroke-width="2"/>
      <path d="M664 316 l4 5 l9 -11" fill="none" stroke="#1f6f3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="694" y="321">Names the department losing linen</text>
    </g>
    <g>
      <circle cx="670" cy="362" r="12" fill="#e8f1e9" stroke="#1f6f3a" stroke-width="2"/>
      <path d="M664 362 l4 5 l9 -11" fill="none" stroke="#1f6f3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="694" y="367">Counts each linen's <tspan font-weight="700" fill="#1f6f3a">50-100 wash cycles</tspan></text>
    </g>
    <g>
      <circle cx="670" cy="408" r="12" fill="#e8f1e9" stroke="#1f6f3a" stroke-width="2"/>
      <path d="M664 408 l4 5 l9 -11" fill="none" stroke="#1f6f3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="694" y="413">Confirms sterile within <tspan font-weight="700" fill="#1f6f3a">24-72 hours</tspan></text>
    </g>
    <g>
      <circle cx="670" cy="454" r="12" fill="#e8f1e9" stroke="#1f6f3a" stroke-width="2"/>
      <path d="M664 454 l4 5 l9 -11" fill="none" stroke="#1f6f3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="694" y="459">Flags a linen that drifts out of zone</text>
    </g>
  </g>

  <rect x="648" y="536" width="460" height="66" rx="12" fill="#ffffff" stroke="#a9c8b2" stroke-width="1.5"/>
  <text x="878" y="565" text-anchor="middle" font-size="14" fill="#3c5c46">A defensible answer, per item:</text>
  <text x="878" y="588" text-anchor="middle" font-size="17" font-weight="800" fill="#1f6f3a">the zone log, with timestamps.</text>
</svg>
