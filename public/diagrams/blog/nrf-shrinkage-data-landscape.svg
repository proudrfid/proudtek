<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The US retail shrinkage data landscape after the NRF survey pause</title>
<desc id="d">A timeline and a composition bar. Timeline: the 2023 National Retail Security Survey reported $112B in shrink, an $18B year-over-year rise, at a 1.4 to 1.6 percent rate — the last full survey. In 2024 NRF paused the 30-plus-year survey to refocus on theft and violence. In 2025 NRF released the Impact of Retail Theft &amp; Violence report. Replacement sources are the Loss Prevention Research Council, retailer 10-K disclosures and ORC enforcement reports. A composition bar shows the last-known shrink split: external theft about 36 percent, employee theft about 29 percent, administrative and other about 35 percent.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE US SHRINKAGE DATA LANDSCAPE</text>
<text x="600" y="88" text-anchor="middle" font-size="15.5" fill="#4f4f4f">The headline survey paused — here's what still anchors the business case.</text>
<line x1="150" y1="200" x2="1050" y2="200" stroke="#c3c9d4" stroke-width="3"/>
<circle cx="250" cy="200" r="11" fill="#4a5568" stroke="#fff" stroke-width="3"/>
<text x="250" y="174" text-anchor="middle" font-size="20" font-weight="800" fill="#4a5568">2023</text>
<text x="250" y="242" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">NRSS: last full survey</text>
<text x="250" y="264" text-anchor="middle" font-size="12.5" fill="#5c5c5c">$112B shrink · +$18B YoY</text>
<text x="250" y="284" text-anchor="middle" font-size="12.5" fill="#5c5c5c">1.4–1.6% shrink rate</text>
<circle cx="600" cy="200" r="11" fill="#8b2d2d" stroke="#fff" stroke-width="3"/>
<text x="600" y="174" text-anchor="middle" font-size="20" font-weight="800" fill="#8b2d2d">2024</text>
<text x="600" y="242" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Survey paused</text>
<text x="600" y="264" text-anchor="middle" font-size="12.5" fill="#5c5c5c">30+-yr NRSS on hold —</text>
<text x="600" y="284" text-anchor="middle" font-size="12.5" fill="#5c5c5c">refocus on theft &amp; violence</text>
<circle cx="950" cy="200" r="11" fill="#3d6b6b" stroke="#fff" stroke-width="3"/>
<text x="950" y="174" text-anchor="middle" font-size="20" font-weight="800" fill="#3d6b6b">2025</text>
<text x="950" y="242" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Impact report (Oct)</text>
<text x="950" y="264" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Theft &amp; Violence 2025 —</text>
<text x="950" y="284" text-anchor="middle" font-size="12.5" fill="#5c5c5c">RFID as forensic layer</text>
<text x="600" y="320" text-anchor="middle" font-size="13" fill="#6d5a3a">Replacement sources: Loss Prevention Research Council · retailer 10-K disclosures · state ORC enforcement reports</text>
<text x="88" y="378" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">LAST-KNOWN SHRINK COMPOSITION</text>
<rect x="88" y="392" width="368.64" height="54" fill="#8b2d2d"/>
<text x="272.32" y="418" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">~36%</text>
<text x="272.32" y="438" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">External theft / shoplifting</text>
<rect x="456.64" y="392" width="296.96" height="54" rx="0" fill="#4a5568"/>
<text x="605.12" y="418" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">~29%</text>
<text x="605.12" y="438" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Employee theft</text>
<rect x="753.5999999999999" y="392" width="358.4" height="54" rx="0" fill="#cdc4b4"/>
<text x="932.8" y="418" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">~35%</text>
<text x="932.8" y="438" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Administrative &amp; other</text>
<rect x="88" y="392" width="1024" height="54" rx="10" fill="none" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="560" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Cite NRF figures with a vintage — the survey behind the big number is on pause.</text>
</svg>
