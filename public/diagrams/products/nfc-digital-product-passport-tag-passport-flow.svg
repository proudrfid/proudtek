<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">One tap resolves and authenticates a Digital Product Passport on an NTAG 424 DNA tag</title>
  <desc id="d">A four-step flow: a phone taps the tag at 13.56 MHz; the NTAG 424 DNA chip signs a fresh per-tap CMAC URL with its AES-128 key (Secure Unique NFC message); the registry verifies the signature and the GS1 Digital Link identifier resolves; the passport opens. The passport data model then shows five fields resolved from one tap — origin (GTIN and serial per ISO/IEC 15459), materials and REACH SVHC, recyclability and end-of-life, carbon footprint by PEF method, and repairability under Directive 2024/1799. Three access tiers (consumer, recycler, regulator) authenticate to different AES-128 keys via SDM, and a copied link is caught by the tap counter as a counterfeit.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="48" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TAP TO PASSPORT — NTAG 424 DNA SUN</text>
  <text x="600" y="80" text-anchor="middle" font-size="15" fill="#5c5c5c">One tap authenticates the tag and opens every data field the delegated act asks for</text>

  <!-- step 1 -->
  <rect x="70" y="104" width="235" height="170" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="104" width="235" height="40" rx="14" fill="#3d6b6b"/>
  <text x="187" y="131" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1 &#183; TAP</text>
  <text x="187" y="180" text-anchor="middle" font-size="14" fill="#291c0e">Phone taps the tag</text>
  <text x="187" y="204" text-anchor="middle" font-size="14" fill="#291c0e">at 13.56 MHz</text>
  <text x="187" y="236" text-anchor="middle" font-size="12.5" fill="#5c5c5c">No app — the OS opens</text>
  <text x="187" y="254" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the returned URL</text>

  <!-- step 2 -->
  <rect x="345" y="104" width="235" height="170" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="345" y="104" width="235" height="40" rx="14" fill="#3d6b6b"/>
  <text x="462" y="131" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2 &#183; SUN</text>
  <text x="462" y="180" text-anchor="middle" font-size="14" fill="#291c0e">Chip signs a fresh</text>
  <text x="462" y="204" text-anchor="middle" font-size="14" fill="#291c0e">per-tap CMAC URL</text>
  <text x="462" y="236" text-anchor="middle" font-size="12.5" fill="#5c5c5c">AES-128 key sealed</text>
  <text x="462" y="254" text-anchor="middle" font-size="12.5" fill="#5c5c5c">in the silicon</text>

  <!-- step 3 -->
  <rect x="620" y="104" width="235" height="170" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="620" y="104" width="235" height="40" rx="14" fill="#3d6b6b"/>
  <text x="737" y="131" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3 &#183; VERIFY</text>
  <text x="737" y="180" text-anchor="middle" font-size="14" fill="#291c0e">Registry checks the</text>
  <text x="737" y="204" text-anchor="middle" font-size="14" fill="#291c0e">CMAC signature</text>
  <text x="737" y="236" text-anchor="middle" font-size="12.5" fill="#5c5c5c">GS1 Digital Link</text>
  <text x="737" y="254" text-anchor="middle" font-size="12.5" fill="#5c5c5c">resolves the ID</text>

  <!-- step 4 -->
  <rect x="895" y="104" width="235" height="170" rx="14" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <rect x="895" y="104" width="235" height="40" rx="14" fill="#1f6f3a"/>
  <text x="1012" y="131" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4 &#183; PASSPORT</text>
  <text x="1012" y="192" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6f3a">VERIFIED</text>
  <text x="1012" y="228" text-anchor="middle" font-size="13" fill="#291c0e">The passport opens</text>
  <text x="1012" y="250" text-anchor="middle" font-size="12.5" fill="#5c5c5c">five fields, shown below</text>

  <!-- arrows -->
  <polygon points="309,186 337,186 337,180 351,189 337,198 337,192 309,192" fill="#4a5568"/>
  <polygon points="584,186 612,186 612,180 626,189 612,198 612,192 584,192" fill="#4a5568"/>
  <polygon points="859,186 887,186 887,180 901,189 887,198 887,192 859,192" fill="#4a5568"/>

  <!-- data model -->
  <text x="600" y="316" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE PASSPORT DATA MODEL — ONE TAP RESOLVES ALL FIVE</text>

  <rect x="70" y="340" width="196" height="132" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="340" width="196" height="34" rx="12" fill="#6d5a3a"/>
  <text x="168" y="363" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">ORIGIN</text>
  <text x="168" y="408" text-anchor="middle" font-size="13.5" fill="#291c0e">GTIN + serial</text>
  <text x="168" y="436" text-anchor="middle" font-size="12.5" fill="#3d6b6b">ISO/IEC 15459</text>

  <rect x="286" y="340" width="196" height="132" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="286" y="340" width="196" height="34" rx="12" fill="#6d5a3a"/>
  <text x="384" y="363" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">MATERIALS</text>
  <text x="384" y="408" text-anchor="middle" font-size="13.5" fill="#291c0e">Composition</text>
  <text x="384" y="436" text-anchor="middle" font-size="12.5" fill="#3d6b6b">REACH SVHC</text>

  <rect x="502" y="340" width="196" height="132" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="502" y="340" width="196" height="34" rx="12" fill="#6d5a3a"/>
  <text x="600" y="363" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">RECYCLABILITY</text>
  <text x="600" y="408" text-anchor="middle" font-size="13.5" fill="#291c0e">End-of-life path</text>
  <text x="600" y="436" text-anchor="middle" font-size="12.5" fill="#3d6b6b">Recoverable materials</text>

  <rect x="718" y="340" width="196" height="132" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="718" y="340" width="196" height="34" rx="12" fill="#6d5a3a"/>
  <text x="816" y="363" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">CARBON</text>
  <text x="816" y="408" text-anchor="middle" font-size="13.5" fill="#291c0e">PEF footprint</text>
  <text x="816" y="436" text-anchor="middle" font-size="12.5" fill="#3d6b6b">Per category</text>

  <rect x="934" y="340" width="196" height="132" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="934" y="340" width="196" height="34" rx="12" fill="#6d5a3a"/>
  <text x="1032" y="363" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">REPAIR / EoL</text>
  <text x="1032" y="408" text-anchor="middle" font-size="13.5" fill="#291c0e">Repairability</text>
  <text x="1032" y="436" text-anchor="middle" font-size="12.5" fill="#3d6b6b">Directive 2024/1799</text>

  <!-- banner -->
  <rect x="70" y="496" width="1060" height="60" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="90" y="522" font-size="15" font-weight="700" fill="#2c5454">Three access tiers, one physical tag</text>
  <text x="90" y="544" font-size="13.5" fill="#3d6b6b">Consumer, recycler and regulator each authenticate to a different AES-128 key via SDM — same tag, role-appropriate data.</text>

  <text x="600" y="590" text-anchor="middle" font-size="13.5" fill="#5c5c5c">A copied link works once — the tap counter flags the replay, so a cloned passport reports itself as counterfeit.</text>
</svg>
