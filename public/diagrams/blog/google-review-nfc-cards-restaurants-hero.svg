<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">From a six-step Google review to a one-tap NFC card, and the review-velocity flywheel</title>
<desc id="d">Left panel, "the old ask" at about 1 to 3 percent conversion, lists six manual steps: unlock the phone, open Google or Maps, search for the restaurant, open the reviews tab, tap the star rating, write and submit. Right panel, "the NFC card" at about 8 to 15 percent conversion, shows one tap opening the review form and posting a review with no app, no QR and no search. A flywheel across the bottom loops from more taps to more fresh reviews to a higher local-pack rank to more covers and bookings, then compounds back to more taps.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">GOOGLE REVIEW NFC CARDS FOR RESTAURANTS</text>
<text x="600" y="90" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Six steps of friction, or a single tap</text>

<!-- LEFT: old ask -->
<rect x="64" y="116" width="520" height="300" rx="14" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.5"/>
<text x="88" y="150" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">THE OLD ASK</text>
<text x="560" y="150" text-anchor="end" font-size="14" font-weight="700" fill="#4a5568">~1-3% convert</text>
<circle cx="92" cy="184" r="12" fill="#8794a6"/><text x="92" y="188" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">1</text><text x="118" y="188" font-size="14.5" fill="#33404f">Unlock the phone</text>
<circle cx="92" cy="222" r="12" fill="#8794a6"/><text x="92" y="226" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">2</text><text x="118" y="226" font-size="14.5" fill="#33404f">Open Google or Maps</text>
<circle cx="92" cy="260" r="12" fill="#8794a6"/><text x="92" y="264" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">3</text><text x="118" y="264" font-size="14.5" fill="#33404f">Search for the restaurant</text>
<circle cx="92" cy="298" r="12" fill="#8794a6"/><text x="92" y="302" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">4</text><text x="118" y="302" font-size="14.5" fill="#33404f">Open the reviews tab</text>
<circle cx="92" cy="336" r="12" fill="#8794a6"/><text x="92" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">5</text><text x="118" y="340" font-size="14.5" fill="#33404f">Tap the star rating</text>
<circle cx="92" cy="374" r="12" fill="#8794a6"/><text x="92" y="378" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">6</text><text x="118" y="378" font-size="14.5" fill="#33404f">Write and submit</text>

<!-- RIGHT: nfc card -->
<rect x="616" y="116" width="520" height="300" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="640" y="150" font-size="15" font-weight="800" letter-spacing="0.4" fill="#2c5454">THE NFC CARD</text>
<text x="1112" y="150" text-anchor="end" font-size="14" font-weight="700" fill="#2c5454">~8-15% convert</text>
<!-- step boxes -->
<rect x="640" y="182" width="140" height="120" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<rect x="678" y="210" width="50" height="74" rx="9" fill="#234a4a"/><rect x="685" y="218" width="36" height="50" rx="3" fill="#eef5f5"/><circle cx="703" cy="276" r="3.4" fill="#eef5f5"/><path d="M740 232 a20 20 0 0 1 0 30 M748 224 a31 31 0 0 1 0 46" fill="none" stroke="#c39a5f" stroke-width="2.2" stroke-linecap="round"/>
<text x="703" y="323" text-anchor="middle" font-size="14.5" font-weight="700" fill="#234a4a">One tap</text>
<path d="M788 242 l22 0 m-8 -7 l8 7 -8 7" fill="none" stroke="#c39a5f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="818" y="182" width="140" height="120" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<rect x="850" y="210" width="76" height="58" rx="6" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.4"/><rect x="850" y="210" width="76" height="15" rx="6" fill="#3d6b6b"/><text x="888" y="252" text-anchor="middle" font-size="20" font-weight="800" fill="#3d6b6b">G</text>
<text x="888" y="323" text-anchor="middle" font-size="14.5" font-weight="700" fill="#234a4a">Form opens</text>
<path d="M966 242 l22 0 m-8 -7 l8 7 -8 7" fill="none" stroke="#c39a5f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="996" y="182" width="116" height="120" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="1054" y="238" text-anchor="middle" font-size="26" fill="#d4a755">★★★★★</text>
<circle cx="1054" cy="266" r="15" fill="#1f6f3a"/><path d="M1047 266 l5 5 9 -11" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1054" y="323" text-anchor="middle" font-size="14.5" font-weight="700" fill="#234a4a">Review posted</text>
<text x="876" y="372" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">No app  ·  no QR  ·  no search</text>

<!-- FLYWHEEL -->
<text x="600" y="452" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.6" fill="#6d5a3a">THE REVIEW-VELOCITY FLYWHEEL</text>
<rect x="76" y="472" width="232" height="58" rx="29" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/><text x="192" y="507" text-anchor="middle" font-size="15" font-weight="700" fill="#234a4a">More taps</text>
<path d="M314 501 l20 0 m-8 -7 l8 7 -8 7" fill="none" stroke="#c39a5f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="340" y="472" width="232" height="58" rx="29" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/><text x="456" y="507" text-anchor="middle" font-size="15" font-weight="700" fill="#234a4a">More fresh reviews</text>
<path d="M578 501 l20 0 m-8 -7 l8 7 -8 7" fill="none" stroke="#c39a5f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="604" y="472" width="232" height="58" rx="29" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/><text x="720" y="507" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">Higher local-pack rank</text>
<path d="M842 501 l20 0 m-8 -7 l8 7 -8 7" fill="none" stroke="#c39a5f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="868" y="472" width="232" height="58" rx="29" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/><text x="984" y="507" text-anchor="middle" font-size="15" font-weight="700" fill="#234a4a">More covers &amp; bookings</text>
<path d="M984 530 C 984 576, 192 576, 192 532" fill="none" stroke="#c39a5f" stroke-width="2.2" stroke-dasharray="5 5"/>
<path d="M192 540 l-7 -10 14 0 z" fill="#c39a5f"/>
<text x="588" y="570" text-anchor="middle" font-size="12.5" font-style="italic" fill="#6d5a3a">compounds every service</text>
<text x="600" y="616" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Each tap feeds the review velocity Google rewards — which brings the next guest in.</text>
</svg>
