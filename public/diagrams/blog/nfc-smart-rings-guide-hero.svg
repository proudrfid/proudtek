<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The NFC smart ring — always worn, always ready, never charged</title>
<desc id="d">A passive NFC ring taps a reader at 1-3 centimetres. Beside it, the buyer's facts: no battery and 10-plus years of data retention; $8-30 per ring depending on the chip inside; and the one field rule — present the side of the ring, not the face, because the antenna wraps around the band. Footnote: it will not count steps, and that is rather the point.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ALWAYS WORN · ALWAYS READY · NEVER CHARGED</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">The credential that's already on your hand</text>

<circle cx="230" cy="300" r="86" fill="none" stroke="#2c5454" stroke-width="26"/>
<circle cx="230" cy="300" r="86" fill="none" stroke="#3d6b6b" stroke-width="8"/>
<rect x="196" y="196" width="68" height="26" rx="13" fill="#c39a5f"/>
<text x="230" y="214" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">chip</text>
<path d="M 214 262 a 52 52 0 0 1 32 0" fill="none" stroke="#e4c98f" stroke-width="3"/>
<text x="230" y="430" text-anchor="middle" font-size="14" font-weight="600" fill="#291c0e">antenna wraps the band</text>
<text x="230" y="456" text-anchor="middle" font-size="12.5" fill="#4f4f4f">15–22 mm coil · ceramic, titanium or resin</text>

<path d="M 344 282 a 26 26 0 0 1 0 40" fill="none" stroke="#3d6b6b" stroke-width="3"/>
<path d="M 360 268 a 44 44 0 0 1 0 68" fill="none" stroke="#3d6b6b" stroke-width="2.5" opacity="0.6"/>
<path d="M 376 254 a 62 62 0 0 1 0 96" fill="none" stroke="#3d6b6b" stroke-width="2" opacity="0.35"/>
<rect x="410" y="240" width="150" height="120" rx="14" fill="#ffffff" stroke="#2c5454" stroke-width="2.5"/>
<circle cx="485" cy="288" r="18" fill="none" stroke="#2c5454" stroke-width="2.5"/>
<circle cx="485" cy="288" r="7" fill="#2c5454"/>
<text x="485" y="336" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">reader</text>
<rect x="410" y="380" width="150" height="34" rx="17" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="485" y="402" text-anchor="middle" font-size="13" font-weight="800" fill="#1b4332">1–3 cm · done</text>
<text x="485" y="456" text-anchor="middle" font-size="12.5" fill="#4f4f4f">door · POS · phone</text>

<g font-weight="700">
<rect x="640" y="170" width="480" height="88" rx="14" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="672" y="206" font-size="15.5" fill="#1b4332">No battery, no charging — ever</text>
<text x="672" y="232" font-size="12.5" font-weight="400" fill="#4f4f4f">powered by the reader's field · 10+ years data retention</text>
<rect x="640" y="274" width="480" height="88" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="672" y="310" font-size="15.5" fill="#291c0e">$8–30 per ring, chip decides</text>
<text x="672" y="336" font-size="12.5" font-weight="400" fill="#4f4f4f">NTAG213 from $8 · DESFire EV2 up to $30 · one wearable</text>
<rect x="640" y="378" width="480" height="88" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="672" y="414" font-size="15.5" fill="#2c5454">The one field rule: tap the SIDE</text>
<text x="672" y="440" font-size="12.5" font-weight="400" fill="#4f4f4f">the coil wraps the band — the "gemstone spot" reads worst</text>
</g>

<rect x="640" y="490" width="480" height="72" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="880" y="520" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="17" font-weight="700" fill="#291c0e">No screen, no step count, no nagging —</text>
<text x="880" y="546" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="17" font-weight="700" fill="#291c0e">just a tap that always works.</text>
<text x="600" y="628" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Passive NFC in a ring: the same chip family as cards and stickers, in the one form factor nobody forgets at home.</text>
</svg>
