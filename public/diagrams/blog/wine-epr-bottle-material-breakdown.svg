<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A wine bottle exploded into its four EU EPR reporting lines</title>
<desc id="d">A wine bottle is exploded into its packaging components, each linked to an EPR reporting card: the aluminum capsule (recyclable, faces lightweighting rules under PPWR), the natural cork (organic material, separate recycling stream), the glass body (the heavy hitter and biggest EPR fee driver) and the paper label with laminate (reported by weight, per SKU, per market). A strip underneath notes that the eco-modulation fee is a function of material mix, recyclability and recycled content, and the caption says NFC plus a backend turns "which spreadsheet was that in?" into one tap.</desc>
