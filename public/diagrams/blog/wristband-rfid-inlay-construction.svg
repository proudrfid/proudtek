<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How the RFID inlay is bonded into silicone, fabric and woven wristbands</title>
<desc id="d">The same PET RFID inlay is integrated three ways. In silicone it is overmolded in the center of the band, injected into a mold cavity so the chip is fully encapsulated with no seams. In fabric (Tyvek or PVC-coated paper) the inlay sits in a laminated PET pouch about 40 by 15 millimetres, sewn or glued into the band and converted to a roll. In woven polyester the inlay sits in a welded or sewn pouch about 30 by 15 millimetres on the reverse side, RF-welded or heat-sealed.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CONSTRUCTION · WHERE THE INLAY LIVES</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">Same PET inlay and chip — how it's bonded into the band is what differs by material.</text>

<!-- Silicone panel -->
<rect x="64" y="120" width="344" height="454" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="64" y="120" width="344" height="8" rx="4" fill="#3d6b6b"/>
<text x="236" y="160" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">Silicone</text>
<text x="236" y="182" text-anchor="middle" font-size="12.5" fill="#5c5c5c">overmolded in center</text>
<rect x="104" y="238" width="264" height="72" rx="36" fill="#3d6b6b"/>
<rect x="210" y="262" width="52" height="24" rx="4" fill="#20302f"/>
<rect x="222" y="268" width="28" height="12" rx="2" fill="#7fa6a6"/>
<text x="236" y="342" text-anchor="middle" font-size="12" fill="#4f4f4f">chip fully encapsulated</text>
<text x="236" y="360" text-anchor="middle" font-size="12" fill="#4f4f4f">in the silicone body</text>
<text x="88" y="410" font-size="13" fill="#333333">• Inlay set in a mold cavity;</text>
<text x="88" y="434" font-size="13" fill="#333333">silicone injected around it.</text>
<text x="88" y="466" font-size="13" fill="#333333">• No seams, no exposed edges.</text>
<text x="88" y="498" font-size="13" fill="#333333">• Survives pool, shower, sweat.</text>

<!-- Fabric panel -->
<rect x="428" y="120" width="344" height="454" rx="14" fill="#eef1f4" stroke="#c3ccd8" stroke-width="1.6"/>
<rect x="428" y="120" width="344" height="8" rx="4" fill="#4a5568"/>
<text x="600" y="160" text-anchor="middle" font-size="17" font-weight="800" fill="#3a4456">Fabric (Tyvek / PVC)</text>
<text x="600" y="182" text-anchor="middle" font-size="12.5" fill="#5c5c5c">laminated pouch</text>
<rect x="468" y="256" width="264" height="36" rx="5" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<rect x="556" y="262" width="88" height="24" rx="3" fill="#dfe4ea" stroke="#4a5568" stroke-width="1.5"/>
<rect x="576" y="268" width="30" height="12" rx="2" fill="#94a0b0"/>
<text x="600" y="330" text-anchor="middle" font-size="12" fill="#4f4f4f">PET inlay in a laminated pouch</text>
<text x="452" y="410" font-size="13" fill="#333333">• Inlay in a ~40 × 15 mm pouch,</text>
<text x="452" y="434" font-size="13" fill="#333333">sewn or glued into the band.</text>
<text x="452" y="466" font-size="13" fill="#333333">• Converted to a roll for</text>
<text x="452" y="490" font-size="13" fill="#333333">event-day application.</text>

<!-- Woven panel -->
<rect x="792" y="120" width="344" height="454" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<rect x="792" y="120" width="344" height="8" rx="4" fill="#c39a5f"/>
<text x="964" y="160" text-anchor="middle" font-size="17" font-weight="800" fill="#8a6d34">Woven (polyester)</text>
<text x="964" y="182" text-anchor="middle" font-size="12.5" fill="#5c5c5c">welded pouch on reverse</text>
<rect x="832" y="252" width="264" height="44" rx="6" fill="#e8d3a6"/>
<line x1="840" y1="262" x2="1088" y2="262" stroke="#b6934f" stroke-width="2"/>
<line x1="840" y1="272" x2="1088" y2="272" stroke="#b6934f" stroke-width="2"/>
<line x1="840" y1="282" x2="1088" y2="282" stroke="#b6934f" stroke-width="2"/>
<rect x="908" y="298" width="112" height="26" rx="4" fill="#cbb98f" stroke="#8a6d34" stroke-width="1.5"/>
<text x="964" y="352" text-anchor="middle" font-size="12" fill="#4f4f4f">pouch bonded to the reverse face</text>
<text x="816" y="410" font-size="13" fill="#333333">• Inlay in a ~30 × 15 mm pouch,</text>
<text x="816" y="434" font-size="13" fill="#333333">welded or sewn on the reverse.</text>
<text x="816" y="466" font-size="13" fill="#333333">• RF-welded / heat-sealed;</text>
<text x="816" y="490" font-size="13" fill="#333333">water-resistant, not pool-proof.</text>
</svg>
