<text x="180.0" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Form FDA-483</text>
<text x="180.0" y="472" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">observation</text>
<text x="180.0" y="500" text-anchor="middle" font-size="12.6" font-weight="500" fill="#4f4f4f">Inspection findings logged</text>
<text x="180.0" y="518" text-anchor="middle" font-size="12.6" font-weight="500" fill="#4f4f4f">at the dock.</text>
<rect x="295.0" y="322" width="190" height="234" rx="14" fill="#fdf8ef" stroke="#b48a3a" stroke-width="2" stroke-opacity="0.5"/>
<rect x="295.0" y="322" width="190" height="7" rx="4" fill="#b48a3a"/>
<circle cx="325.0" cy="358" r="15" fill="#b48a3a"/>
<text x="325.0" y="364" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<text x="390.0" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">FDA warning</text>
<text x="390.0" y="472" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">letter</text>
<text x="390.0" y="500" text-anchor="middle" font-size="12.6" font-weight="500" fill="#4f4f4f">Public within ~6 months if</text>
<text x="390.0" y="518" text-anchor="middle" font-size="12.6" font-weight="500" fill="#4f4f4f">uncorrected.</text>
<rect x="505.0" y="258" width="190" height="298" rx="14" fill="#f3e7d4" stroke="#6d5a3a" stroke-width="2" stroke-opacity="0.5"/>
<rect x="505.0" y="258" width="190" height="7" rx="4" fill="#6d5a3a"/>
<circle cx="535.0" cy="294" r="15" fill="#6d5a3a"/>
<text x="535.0" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<text x="600.0" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Enforcement</text>
<text x="600.0" y="472" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">action</text>
<text x="600.0" y="500" text-anchor="middle" font-size="12.6" font-weight="500" fill="#4f4f4f">Injunction, consent decree</text>
<text x="600.0" y="518" text-anchor="middle" font-size="12.6" font-weight="500" fill="#4f4f4f">or import alert.</text>
<rect x="715.0" y="194" width="190" height="362" rx="14" fill="#f6e9e9" stroke="#8b2d2d" stroke-width="2" stroke-opacity="0.5"/>
