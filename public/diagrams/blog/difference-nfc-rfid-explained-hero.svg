<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="heroTitle heroDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="heroTitle">NFC versus RFID: the same radio family with different day jobs</title>
  <desc id="heroDesc">RFID is one family with three frequency bands: LF at 125 to 134 kilohertz reads 1 to 10 centimetres, HF at 13.56 megahertz reads 1 to 30 centimetres, and UHF at 860 to 960 megahertz reads 1 to 15 metres. NFC is a branch nested inside HF: 13.56 megahertz, 1 to 4 centimetres, readable by any modern phone. Two day jobs are shown: NFC is a close tap that any phone reads, while UHF is a hands-free scan across a room that needs a dedicated reader. A read-range chart at the bottom plots all three bands on a log scale from 1 centimetre to 15 metres.</desc>
  <defs>
    <radialGradient id="heroBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8f1e2"/><stop offset="100%" stop-color="#f3eee2"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#heroBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NFC vs. RFID — ONE FAMILY, DIFFERENT DAY JOBS</text>
  <text x="600" y="86" text-anchor="middle" font-size="17.5" fill="#4f4f4f">All NFC is RFID. Not all RFID is NFC. That one sentence prevents most wrong orders.</text>

  <!-- LEFT: RFID nesting container -->
  <rect x="52" y="112" width="672" height="356" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="76" y="146" font-size="22" font-weight="800" fill="#291c0e">RFID</text>
  <text x="150" y="146" font-size="15.5" fill="#6d5a3a">one family · three frequency bands</text>

  <!-- LF chip -->
  <rect x="72" y="160" width="632" height="66" rx="12" fill="#ffffff" stroke="#d9c290" stroke-width="2"/>
  <text x="92" y="190" font-size="19" font-weight="800" fill="#291c0e">LF</text>
  <text x="128" y="190" font-size="16.5" fill="#4f4f4f">125–134 kHz · legacy access, pet chips</text>
  <rect x="560" y="176" width="124" height="34" rx="17" fill="#f1e6cf" stroke="#c39a5f" stroke-width="1.5"/><text x="622" y="199" text-anchor="middle" font-size="15.5" font-weight="700" fill="#6d5a3a">1–10 cm</text>

  <!-- HF chip (holds nested NFC) -->
  <rect x="72" y="234" width="632" height="150" rx="12" fill="#ffffff" stroke="#9cc0c0" stroke-width="2"/>
  <text x="92" y="264" font-size="19" font-weight="800" fill="#291c0e">HF</text>
  <text x="128" y="264" font-size="16.5" fill="#4f4f4f">13.56 MHz · library, transit, tap-to-verify</text>
  <rect x="560" y="248" width="124" height="34" rx="17" fill="#e6efef" stroke="#3d6b6b" stroke-width="1.5"/><text x="622" y="271" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2c5454">1–30 cm</text>
  <!-- nested NFC -->
  <rect x="92" y="286" width="592" height="82" rx="12" fill="#e8f9fe" stroke="#1fcefb" stroke-width="2.5"/>
  <text x="112" y="322" font-size="19" font-weight="800" fill="#0f6d84">NFC</text>
  <text x="112" y="348" font-size="15.5" fill="#12657a">a branch of HF · 13.56 MHz · NFC Forum manners</text>
  <rect x="540" y="304" width="128" height="46" rx="23" fill="#1fcefb"/><text x="604" y="333" text-anchor="middle" font-size="16" font-weight="800" fill="#08323d">1–4 cm</text>

  <!-- UHF chip -->
  <rect x="72" y="392" width="632" height="66" rx="12" fill="#ffffff" stroke="#9fb2cc" stroke-width="2"/>
  <text x="92" y="422" font-size="19" font-weight="800" fill="#291c0e">UHF</text>
  <text x="148" y="422" font-size="16.5" fill="#4f4f4f">860–960 MHz · inventory, dock doors</text>
  <rect x="560" y="408" width="124" height="34" rx="17" fill="#e9eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="622" y="431" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f4e79">1–15 m</text>

  <!-- RIGHT: two day-job cards -->
  <rect x="744" y="112" width="404" height="170" rx="16" fill="#e8f9fe" stroke="#1fcefb" stroke-width="2.5"/>
  <circle cx="792" cy="160" r="26" fill="#1fcefb"/><rect x="782" y="146" width="20" height="30" rx="4" fill="#ffffff"/>
  <text x="836" y="156" font-size="20" font-weight="800" fill="#0f6d84">NFC · the close tap</text>
  <text x="772" y="212" font-size="16.5" fill="#12657a">Hold a phone within a few centimetres</text>
  <text x="772" y="238" font-size="16.5" fill="#12657a">and it just reads. One item, on purpose.</text>
  <text x="772" y="264" font-size="15" font-weight="700" fill="#0f6d84">Marketing · payment · authentication</text>

  <rect x="744" y="298" width="404" height="170" rx="16" fill="#eef1f6" stroke="#4a5568" stroke-width="2.5"/>
  <circle cx="792" cy="346" r="26" fill="#4a5568"/><rect x="781" y="335" width="22" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="836" y="342" font-size="20" font-weight="800" fill="#1f4e79">UHF · the room scan</text>
  <text x="772" y="398" font-size="16.5" fill="#3a4a52">Read hundreds of tags across a room,</text>
  <text x="772" y="424" font-size="16.5" fill="#3a4a52">hands-free — with a dedicated reader.</text>
  <text x="772" y="450" font-size="15" font-weight="700" fill="#1f4e79">Inventory · logistics · asset tracking</text>

  <!-- BOTTOM: log-scale read-range chart -->
  <text x="76" y="512" font-size="15.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">READ RANGE (LOG SCALE)</text>
  <line x1="140" y1="600" x2="1108" y2="600" stroke="#d8cdb3" stroke-width="2"/>
  <!-- ticks -->
  <g font-size="13.5" fill="#6d5a3a" text-anchor="middle">
    <line x1="140" y1="596" x2="140" y2="604" stroke="#d8cdb3" stroke-width="2"/><text x="140" y="622">1 cm</text>
    <line x1="442" y1="596" x2="442" y2="604" stroke="#d8cdb3" stroke-width="2"/><text x="442" y="622">10 cm</text>
    <line x1="744" y1="596" x2="744" y2="604" stroke="#d8cdb3" stroke-width="2"/><text x="744" y="622">1 m</text>
    <line x1="1099" y1="596" x2="1099" y2="604" stroke="#d8cdb3" stroke-width="2"/><text x="1099" y="622">15 m</text>
  </g>
  <!-- lanes -->
  <rect x="140" y="528" width="182" height="16" rx="8" fill="#1fcefb"/><text x="330" y="541" font-size="14" font-weight="700" fill="#0f6d84">NFC 1–4 cm</text>
  <rect x="140" y="551" width="446" height="16" rx="8" fill="#3d6b6b"/><text x="594" y="564" font-size="14" font-weight="700" fill="#2c5454">HF 1–30 cm</text>
  <rect x="744" y="574" width="355" height="16" rx="8" fill="#4a5568"/><text x="726" y="587" font-size="14" font-weight="700" fill="#1f4e79" text-anchor="end">UHF 1–15 m</text>
</svg>
