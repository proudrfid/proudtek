<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="scTitle scDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="scTitle">Typical real-world UHF read range by scenario</title>
  <desc id="scDesc">Horizontal bars on a 0 to 15 meter scale. Retail apparel hang tags read 4 to 8 meters. Warehouse case labels read 5 to 10 meters. Anti-metal asset tags read 1 to 5 meters. Vehicle windshield tags read 6 to 12 meters. Laundry tags read only 1 to 3 meters because of water absorption.</desc>
  <defs>
    <radialGradient id="scBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#scBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="62" text-anchor="middle" font-size="27" font-weight="800" letter-spacing="1.2" fill="#6d5a3a">READ RANGE BY SCENARIO</text>
  <text x="600" y="90" text-anchor="middle" font-size="16" fill="#4f4f4f">Typical distances real hardware hits — not free-space datasheet numbers</text>

  <!-- gridlines + axis -->
  <g stroke="#efe7d9" stroke-width="1.5">
    <line x1="300" y1="120" x2="300" y2="524"/>
    <line x1="462" y1="120" x2="462" y2="524"/>
    <line x1="624" y1="120" x2="624" y2="524"/>
    <line x1="786" y1="120" x2="786" y2="524"/>
    <line x1="948" y1="120" x2="948" y2="524"/>
    <line x1="1110" y1="120" x2="1110" y2="524"/>
  </g>

  <!-- bars -->
  <!-- Retail apparel 4-8 -->
  <text x="286" y="156" text-anchor="end" font-size="18" font-weight="700" fill="#291c0e">Retail apparel hang tags</text>
  <rect x="516" y="134" width="216" height="42" rx="10" fill="#c39a5f"/>
  <text x="744" y="161" font-size="16" font-weight="700" fill="#6d5a3a">4–8 m</text>

  <!-- Warehouse case 5-10 -->
  <text x="286" y="238" text-anchor="end" font-size="18" font-weight="700" fill="#291c0e">Warehouse case labels</text>
  <rect x="570" y="216" width="270" height="42" rx="10" fill="#4a5568"/>
  <text x="852" y="243" font-size="16" font-weight="700" fill="#4a5568">5–10 m</text>

  <!-- Anti-metal 1-5 -->
  <text x="286" y="320" text-anchor="end" font-size="18" font-weight="700" fill="#291c0e">Anti-metal asset tags</text>
  <rect x="354" y="298" width="216" height="42" rx="10" fill="#8b2d2d"/>
  <text x="582" y="325" font-size="16" font-weight="700" fill="#8b2d2d">1–5 m</text>

  <!-- Windshield 6-12 -->
  <text x="286" y="402" text-anchor="end" font-size="18" font-weight="700" fill="#291c0e">Vehicle windshield tags</text>
  <rect x="624" y="380" width="324" height="42" rx="10" fill="#3d6b6b"/>
  <text x="960" y="407" font-size="16" font-weight="700" fill="#2c5454">6–12 m</text>

  <!-- Laundry 1-3 -->
  <text x="286" y="484" text-anchor="end" font-size="18" font-weight="700" fill="#291c0e">Laundry tags (wet textile)</text>
  <rect x="354" y="462" width="108" height="42" rx="10" fill="#2d6a4f"/>
  <text x="474" y="489" font-size="16" font-weight="700" fill="#1f6f3a">1–3 m</text>

  <!-- axis labels -->
  <g font-size="15" fill="#8a949c" text-anchor="middle">
    <text x="300" y="548">0 m</text>
    <text x="462" y="548">3 m</text>
    <text x="624" y="548">6 m</text>
    <text x="786" y="548">9 m</text>
    <text x="948" y="548">12 m</text>
    <text x="1110" y="548">15 m</text>
  </g>

  <text x="600" y="606" text-anchor="middle" font-size="17" font-weight="600" fill="#6d5a3a">Match your expectation to the row that looks like your doorway — not the biggest number on the page.</text>
</svg>
