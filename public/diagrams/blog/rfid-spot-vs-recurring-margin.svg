<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Moving RFID distributor revenue from spot orders to recurring structures</title>
<desc id="d">A before-and-after with two bars: spot orders carry a lower margin, recurring structures a higher one, with a bracket showing a plus 8-15 percentage point lift. A caption explains the lift comes from amortizing customer-acquisition cost across 24-36 month relationships when 50-70% of revenue shifts off spot. Five structure cards follow, ordered easiest to hardest to sell: annual blanket order at a 5-8% discount locking 12-month volume, vendor-managed inventory at a 5-10% premium, RFID-as-a-service at 50-70% margin over 36-60 months, a recurring encoding line at 60-80% margin charging $0.05-$0.50 per tag plus a $500-$3K monthly minimum, and channel commissions of 10-15% to system-integrator partners.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SPOT vs RECURRING</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="33" font-weight="700" fill="#291c0e">Spot is a transaction. Recurring is a business.</text>
<text x="600" y="133" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Moving revenue off spot lifts margin without raising a single price.</text>

<!-- bars -->
<line x1="150" y1="336" x2="556" y2="336" stroke="#d8cdb8" stroke-width="1.6"/>
<rect x="204" y="276" width="86" height="60" rx="5" fill="#d6cbb3" stroke="#a08a5f" stroke-width="1.4"/>
<rect x="404" y="206" width="86" height="130" rx="5" fill="#3d6b6b" stroke="#234a4a" stroke-width="1.4"/>
<line x1="316" y1="300" x2="392" y2="300" stroke="#8a94a3" stroke-width="2.4"/><polygon points="392,294 402,300 392,306" fill="#8a94a3"/>
<line x1="508" y1="206" x2="524" y2="206" stroke="#2d6a4f" stroke-width="1.6"/><line x1="508" y1="276" x2="524" y2="276" stroke="#2d6a4f" stroke-width="1.6"/><line x1="524" y1="206" x2="524" y2="276" stroke="#2d6a4f" stroke-width="1.6"/>
<text x="534" y="245" font-size="15" font-weight="800" fill="#2d6a4f">+8-15 pts</text>
<text x="247" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#6d5a3a">SPOT</text>
<text x="247" y="379" text-anchor="middle" font-size="12" fill="#8a8a8a">one-off orders</text>
<text x="447" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#234a4a">RECURRING</text>
<text x="447" y="379" text-anchor="middle" font-size="12" fill="#8a8a8a">annual + recurring</text>

<!-- caption -->
<rect x="612" y="198" width="524" height="150" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="636" y="236" font-size="15.5" font-weight="700" fill="#234a4a">Same prices — the lift is structural.</text>
<text x="636" y="268" font-size="13.5" fill="#4f4f4f">Shift 50-70% of revenue off spot and margin rises 8-15</text>
<text x="636" y="290" font-size="13.5" fill="#4f4f4f">points — because customer-acquisition cost amortizes</text>
<text x="636" y="312" font-size="13.5" fill="#4f4f4f">across 24-36 month relationships, not single orders.</text>

<!-- structures -->
<text x="64" y="392" font-size="13" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">FIVE STRUCTURES — EASIEST TO HARDEST TO SELL</text>

<rect x="64" y="404" width="188" height="132" rx="12" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="158" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Blanket order</text>
<text x="158" y="468" text-anchor="middle" font-size="21" font-weight="800" fill="#3d6b6b">5-8% off</text>
<text x="158" y="494" text-anchor="middle" font-size="12" fill="#5c5c5c">locks 12-month</text>
<text x="158" y="512" text-anchor="middle" font-size="12" fill="#5c5c5c">volume band</text>

<rect x="285" y="404" width="188" height="132" rx="12" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="379" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">VMI</text>
<text x="379" y="468" text-anchor="middle" font-size="21" font-weight="800" fill="#3d6b6b">+5-10%</text>
<text x="379" y="494" text-anchor="middle" font-size="12" fill="#5c5c5c">premium; customer</text>
<text x="379" y="512" text-anchor="middle" font-size="12" fill="#5c5c5c">outsources carry</text>

<rect x="506" y="404" width="188" height="132" rx="12" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">RaaS</text>
<text x="600" y="468" text-anchor="middle" font-size="21" font-weight="800" fill="#3d6b6b">50-70%</text>
<text x="600" y="494" text-anchor="middle" font-size="12" fill="#5c5c5c">margin; hardware</text>
<text x="600" y="512" text-anchor="middle" font-size="12" fill="#5c5c5c">over 36-60 months</text>

<rect x="727" y="404" width="188" height="132" rx="12" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="821" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Encoding line</text>
<text x="821" y="468" text-anchor="middle" font-size="21" font-weight="800" fill="#3d6b6b">60-80%</text>
<text x="821" y="494" text-anchor="middle" font-size="12" fill="#5c5c5c">$0.05-$0.50/tag</text>
<text x="821" y="512" text-anchor="middle" font-size="12" fill="#5c5c5c">+ $500-$3K/mo</text>

<rect x="948" y="404" width="188" height="132" rx="12" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="1042" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">SI commissions</text>
<text x="1042" y="468" text-anchor="middle" font-size="21" font-weight="800" fill="#3d6b6b">10-15%</text>
<text x="1042" y="494" text-anchor="middle" font-size="12" fill="#5c5c5c">to SI partners;</text>
<text x="1042" y="512" text-anchor="middle" font-size="12" fill="#5c5c5c">better-qualified leads</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Every structure trades a little headline price for revenue that shows up again next quarter.</text>
</svg>
