<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NFC tap versus QR scan: one gesture against four steps</title>
<desc id="d">A side-by-side friction comparison. The NFC lane is a single step: tap the sticker and the URL opens instantly. The QR lane is four steps before anything opens: open the camera app, frame and aim the code, wait for recognition, then tap the link that appears. Every extra step is another place the customer quietly gives up.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TAP VS SCAN · THE FRICTION GAP</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">One gesture versus four — the difference retail conversion is made of.</text>

<!-- LEFT: NFC -->
<rect x="72" y="132" width="512" height="452" rx="16" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<text x="328" y="176" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">NFC · 1 STEP</text>
<text x="328" y="202" text-anchor="middle" font-size="13" fill="#3f6a52">one physical gesture</text>
<rect x="120" y="248" width="416" height="120" rx="12" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<circle cx="172" cy="308" r="24" fill="#1f6f3a"/>
<text x="172" y="316" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
<text x="214" y="300" font-size="18" font-weight="800" fill="#291c0e">Tap the sticker</text>
<text x="214" y="328" font-size="14" fill="#4f6a5a">the URL opens instantly</text>
<rect x="120" y="404" width="416" height="120" rx="12" fill="#e7f2ea" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="328" y="452" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6f3a">Done — nothing else to do</text>
<text x="328" y="482" text-anchor="middle" font-size="13.5" fill="#4f6a5a">no camera, no aiming, no waiting</text>

<!-- RIGHT: QR -->
<rect x="616" y="132" width="512" height="452" rx="16" fill="#faf6ee" stroke="#e4c98f" stroke-width="2"/>
<text x="872" y="176" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#8a6d34">QR · 4 STEPS</text>
<text x="872" y="202" text-anchor="middle" font-size="13" fill="#7a6636">four steps before anything opens</text>
<rect x="664" y="242" width="416" height="66" rx="11" fill="#ffffff" stroke="#e4c98f" stroke-width="1.6"/>
<circle cx="702" cy="275" r="18" fill="#c39a5f"/>
<text x="702" y="281" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="736" y="281" font-size="15.5" fill="#291c0e">Open the camera app</text>
<rect x="664" y="316" width="416" height="66" rx="11" fill="#ffffff" stroke="#e4c98f" stroke-width="1.6"/>
<circle cx="702" cy="349" r="18" fill="#c39a5f"/>
<text x="702" y="355" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="736" y="355" font-size="15.5" fill="#291c0e">Frame and aim the code</text>
<rect x="664" y="390" width="416" height="66" rx="11" fill="#ffffff" stroke="#e4c98f" stroke-width="1.6"/>
<circle cx="702" cy="423" r="18" fill="#c39a5f"/>
<text x="702" y="429" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="736" y="429" font-size="15.5" fill="#291c0e">Wait for recognition</text>
<rect x="664" y="464" width="416" height="66" rx="11" fill="#ffffff" stroke="#e4c98f" stroke-width="1.6"/>
<circle cx="702" cy="497" r="18" fill="#c39a5f"/>
<text x="702" y="503" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="736" y="503" font-size="15.5" fill="#291c0e">Tap the link that appears</text>

<text x="600" y="626" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Every extra step is another place the customer quietly gives up.</text>
</svg>
