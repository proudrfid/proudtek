<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">UHF vs HF — two radios, two different jobs</title>
<desc id="d">The buying decision as two panels. Left, UHF at 860–960 MHz: a dock-door portal reads a row of tagged cartons at once — hundreds of tags per second at 1–12 metres, with tags from $0.03 at retail volume. Right, HF/NFC at 13.56 MHz: a card taps a reader deliberately at 0–30 cm — AES-128 smart cards, read natively by every smartphone, under one global regulation. A verdict strip underneath gives the one-line rule: 100 or more tags at 3 or more metres means UHF; smartphone interaction or single-card security means HF/NFC.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
