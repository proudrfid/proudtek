<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Air and sea freight rate card for RFID cargo from China</title>
<desc id="d">Two rate cards. Air freight: standard $4-8/kg in 3-7 days; express DHL or FedEx $7-15/kg door-to-door. Sea freight: LCL $80-250 per cubic meter for 1-15 CBM; FCL 20-foot $1,500-4,500; FCL 40-foot $2,500-7,500 for 20-plus CBM. Below: per-tag freight for 100K UHF tags (about 80-150 kg, 0.3-0.6 CBM) is $0.005-0.012 by air versus $0.0008-0.002 by sea; duty and tariff under HS 8543.70 add 7.5-25% of landed cost, often more than the freight itself.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">AIR vs SEA — THE RATE CARD</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Per-kg, per-CBM and per-container — where each mode wins.</text>

<!-- AIR card -->
<rect x="80" y="132" width="520" height="230" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="80" y="132" width="520" height="8" rx="4" fill="#3d6b6b"/>
<text x="108" y="176" font-size="16" font-weight="800" fill="#2c5454">AIR FREIGHT</text>
<line x1="108" y1="196" x2="572" y2="196" stroke="#eef5f5" stroke-width="1.4"/>
<text x="108" y="232" font-size="15" font-weight="700" fill="#291c0e">Standard</text>
<text x="572" y="232" text-anchor="end" font-size="15" font-weight="800" fill="#2c5454">$4-8/kg · 3-7 days</text>
<line x1="108" y1="256" x2="572" y2="256" stroke="#eef5f5" stroke-width="1.2"/>
<text x="108" y="292" font-size="15" font-weight="700" fill="#291c0e">Express (DHL/FedEx)</text>
<text x="572" y="292" text-anchor="end" font-size="15" font-weight="800" fill="#2c5454">$7-15/kg</text>
<line x1="108" y1="316" x2="572" y2="316" stroke="#eef5f5" stroke-width="1.2"/>
<text x="108" y="344" font-size="13.5" fill="#5c5c5c">door-to-door · best for small, urgent lots</text>

<!-- SEA card -->
<rect x="620" y="132" width="500" height="230" rx="14" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.8"/>
<rect x="620" y="132" width="500" height="8" rx="4" fill="#4a5568"/>
<text x="648" y="176" font-size="16" font-weight="800" fill="#3f4657">SEA FREIGHT</text>
<line x1="648" y1="196" x2="1092" y2="196" stroke="#eee9df" stroke-width="1.4"/>
<text x="648" y="228" font-size="15" font-weight="700" fill="#291c0e">LCL</text>
<text x="1092" y="228" text-anchor="end" font-size="15" font-weight="800" fill="#4a5568">$80-250/CBM · 1-15 CBM</text>
<line x1="648" y1="248" x2="1092" y2="248" stroke="#eee9df" stroke-width="1.2"/>
<text x="648" y="280" font-size="15" font-weight="700" fill="#291c0e">FCL 20-ft</text>
<text x="1092" y="280" text-anchor="end" font-size="15" font-weight="800" fill="#4a5568">$1,500-4,500</text>
<line x1="648" y1="300" x2="1092" y2="300" stroke="#eee9df" stroke-width="1.2"/>
<text x="648" y="332" font-size="15" font-weight="700" fill="#291c0e">FCL 40-ft</text>
<text x="1092" y="332" text-anchor="end" font-size="15" font-weight="800" fill="#4a5568">$2,500-7,500 · 20+ CBM</text>

<!-- per-tag callout -->
<rect x="80" y="386" width="520" height="132" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="108" y="420" font-size="14" font-weight="800" fill="#2c5454">PER-TAG FREIGHT</text>
<text x="108" y="442" font-size="12.5" fill="#5c5c5c">100K UHF tags ≈ 80-150 kg, ≈ 0.3-0.6 CBM</text>
<text x="108" y="478" font-size="15" font-weight="700" fill="#291c0e">By air</text>
<text x="572" y="478" text-anchor="end" font-size="16" font-weight="800" fill="#2c5454">$0.005-0.012</text>
<text x="108" y="504" font-size="15" font-weight="700" fill="#291c0e">By sea</text>
<text x="572" y="504" text-anchor="end" font-size="16" font-weight="800" fill="#4a5568">$0.0008-0.002</text>

<!-- duty callout -->
<rect x="620" y="386" width="500" height="132" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.6"/>
<text x="648" y="420" font-size="14" font-weight="800" fill="#6d5a3a">DUTY &amp; TARIFF</text>
<text x="648" y="442" font-size="12.5" fill="#8a6f3c">HS code 8543.70 for RFID</text>
<text x="870" y="484" text-anchor="middle" font-size="34" font-weight="800" fill="#a07d43">7.5-25%</text>
<text x="870" y="506" text-anchor="middle" font-size="12.5" fill="#6d5a3a">of landed cost — often more than freight</text>

<text x="600" y="560" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Sea wins on price; air wins on the calendar — and tariffs can dwarf both.</text>
</svg>
