<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Anatomy of an Impinj M800 UHF RAIN inlay</title>
  <desc id="d">A UHF RAIN inlay shown flat: a copper or aluminium dipole antenna tuned to 860-960 MHz on a PET or paper substrate, with a flip-chip strap carrying the M830 or M850 die at the centre. Below, three delivery forms are labelled: dry inlay for converters, wet inlay with adhesive on a release liner, and converted label with printed face stock.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANATOMY OF AN M800 UHF RAIN INLAY</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">A copper dipole, a grain-of-sand die on a strap, and the next-gen silicon you pay for</text>

  <rect x="150" y="196" width="900" height="150" rx="10" fill="#f8ead0" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="196" y="262" width="330" height="18" rx="4" fill="#4a5568"/>
  <rect x="196" y="238" width="14" height="66" fill="#4a5568"/>
  <rect x="300" y="238" width="14" height="66" fill="#4a5568"/>
  <rect x="404" y="238" width="14" height="66" fill="#4a5568"/>
  <rect x="674" y="262" width="330" height="18" rx="4" fill="#4a5568"/>
  <rect x="786" y="238" width="14" height="66" fill="#4a5568"/>
  <rect x="890" y="238" width="14" height="66" fill="#4a5568"/>
  <rect x="994" y="238" width="14" height="66" fill="#4a5568"/>
  <rect x="540" y="250" width="120" height="42" rx="6" fill="#e4c98f" stroke="#c39a5f" stroke-width="2"/>
  <rect x="582" y="258" width="36" height="26" rx="4" fill="#3d6b6b"/>

  <text x="196" y="384" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">DIPOLE ANTENNA</text>
  <text x="196" y="405" font-size="13.5" fill="#5c5c5c">Copper / aluminium, tuned 860-960 MHz</text>
  <line x1="360" y1="330" x2="360" y2="372" stroke="#c39a5f" stroke-width="1.5"/>

  <text x="600" y="150" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">FLIP-CHIP STRAP</text>
  <text x="600" y="171" text-anchor="middle" font-size="13.5" fill="#5c5c5c">M830 or M850 die bonded to a strap</text>
  <line x1="600" y1="178" x2="600" y2="248" stroke="#c39a5f" stroke-width="1.5"/>

  <text x="1004" y="384" text-anchor="end" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">PET / PAPER SUBSTRATE</text>
  <text x="1004" y="405" text-anchor="end" font-size="13.5" fill="#5c5c5c">Carrier the antenna prints onto</text>
  <line x1="900" y1="346" x2="900" y2="372" stroke="#c39a5f" stroke-width="1.5"/>

  <text x="600" y="470" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THREE DELIVERY FORMS</text>
  <rect x="150" y="492" width="290" height="96" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="170" y="524" font-size="16" font-weight="700" fill="#291c0e">Dry inlay</text>
  <text x="170" y="548" font-size="13" fill="#5c5c5c">Bare antenna + chip, no adhesive</text>
  <text x="170" y="568" font-size="13" fill="#5c5c5c">— for label converters</text>

  <rect x="455" y="492" width="290" height="96" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="475" y="524" font-size="16" font-weight="700" fill="#291c0e">Wet inlay</text>
  <text x="475" y="548" font-size="13" fill="#5c5c5c">Adhesive on a release liner</text>
  <text x="475" y="568" font-size="13" fill="#5c5c5c">— ready to apply</text>

  <rect x="760" y="492" width="290" height="96" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="780" y="524" font-size="16" font-weight="700" fill="#291c0e">Converted label</text>
  <text x="780" y="548" font-size="13" fill="#5c5c5c">Printed face stock + adhesive</text>
  <text x="780" y="568" font-size="13" fill="#5c5c5c">— finished branded label</text>

  <text x="600" y="626" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The M830 / M850 die is identical — the M700-compatible antenna sets read range, from 20 × 5 mm to 95 × 25 mm.</text>
</svg>
