<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">AI on RFID inventory: same model, two data diets</title>
<desc id="d">Two lanes flow through the same AI model. Lane one: RFID item-level reads at 99%+ accuracy, daily or real-time, with location and live event streams, produce predictions that earn the label — out-of-stock incidents down 30-50%, forecast error down 15-25%, shrink flagged in under 24 hours instead of 30 days. Lane two: a nightly manual count, a barcode scan from last Tuesday typed in at closing time, produces confident, beautifully charted nonsense — the same errors, now wearing the authority of a prediction.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">AI × RFID INVENTORY — RETAIL AND WAREHOUSE</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">The model is only as good as the reads</text>

<rect x="60" y="140" width="320" height="150" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="84" y="172" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">FEED A</text>
<text x="84" y="200" font-size="17" font-weight="700" fill="#291c0e">RFID item-level reads</text>
<text x="84" y="226" font-size="13.5" fill="#4f4f4f">99%+ accuracy, daily or real-time</text>
<text x="84" y="248" font-size="13.5" fill="#4f4f4f">location + live event stream</text>

<line x1="386" y1="215" x2="442" y2="215" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 454 215 l -12 -6 v 12 z" fill="#3d6b6b"/>
<rect x="454" y="160" width="180" height="110" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<text x="544" y="200" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">AI MODEL</text>
<text x="544" y="226" text-anchor="middle" font-size="12.5" fill="#6d5a3a">arithmetic at scale</text>
<text x="544" y="246" text-anchor="middle" font-size="12.5" fill="#6d5a3a">on whatever you feed it</text>
<line x1="634" y1="215" x2="690" y2="215" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 702 215 l -12 -6 v 12 z" fill="#3d6b6b"/>

<rect x="708" y="140" width="432" height="150" rx="14" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="732" y="172" font-size="13" font-weight="800" letter-spacing="0.5" fill="#1b4332">PREDICTIONS THAT EARN THE LABEL</text>
<text x="732" y="202" font-size="15" font-weight="700" fill="#1f6f3a">out-of-stock incidents down 30-50%</text>
<text x="732" y="228" font-size="15" font-weight="700" fill="#1f6f3a">forecast error down 15-25%</text>
<text x="732" y="254" font-size="15" font-weight="700" fill="#1f6f3a">shrink flagged in hours, not 30 days</text>

<line x1="60" y1="336" x2="470" y2="336" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="341" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">same model — different diet</text>
<line x1="730" y1="336" x2="1140" y2="336" stroke="#e6dfd2" stroke-width="1.5"/>

<rect x="60" y="380" width="320" height="150" rx="14" fill="#eef1f5" stroke="#4a5568" stroke-width="1.5"/>
<text x="84" y="412" font-size="13" font-weight="800" letter-spacing="0.5" fill="#4a5568">FEED B</text>
<text x="84" y="440" font-size="17" font-weight="700" fill="#291c0e">Nightly manual count</text>
<text x="84" y="466" font-size="13.5" fill="#4f4f4f">a barcode scan from last Tuesday</text>
<text x="84" y="488" font-size="13.5" fill="#4f4f4f">typed in at closing time</text>

<line x1="386" y1="455" x2="442" y2="455" stroke="#4a5568" stroke-width="2.5"/>
<path d="M 454 455 l -12 -6 v 12 z" fill="#4a5568"/>
<rect x="454" y="400" width="180" height="110" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<text x="544" y="440" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">AI MODEL</text>
<text x="544" y="466" text-anchor="middle" font-size="12.5" fill="#6d5a3a">same arithmetic</text>
<text x="544" y="486" text-anchor="middle" font-size="12.5" fill="#6d5a3a">different diet</text>
<line x1="634" y1="455" x2="690" y2="455" stroke="#8b2d2d" stroke-width="2.5"/>
<path d="M 702 455 l -12 -6 v 12 z" fill="#8b2d2d"/>

<rect x="708" y="380" width="432" height="150" rx="14" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="732" y="412" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">CONFIDENT, BEAUTIFULLY CHARTED NONSENSE</text>
<text x="732" y="442" font-size="14.5" fill="#291c0e">the same errors you already had,</text>
<text x="732" y="464" font-size="14.5" fill="#291c0e">now wearing the authority of a prediction</text>
<polyline points="1000,512 1030,488 1050,500 1080,470 1110,478" fill="none" stroke="#8b2d2d" stroke-width="2"/>

<text x="600" y="610" text-anchor="middle" font-size="14" fill="#5c5c5c">AI does not replace knowing what sits on your shelves — it does arithmetic at scale on whatever data you hand it.</text>
</svg>
