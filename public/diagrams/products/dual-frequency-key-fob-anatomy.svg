<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Two coils in one dual-frequency key-fob housing</title>
  <desc id="d">A cutaway of one 40 by 32 by 6 mm ABS key-fob housing. A small planar 13.56 MHz HF coil forms the outer loop and a heavier-wound 125 kHz LF coil sits on the inner ring, routed orthogonally, so cross-coupling stays under 1 dB, verified per unit.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TWO COILS, ONE HOUSING</text>
  <text x="600" y="96" text-anchor="middle" font-size="16" fill="#5c5c5c">One 40 × 32 × 6 mm ABS housing · ultrasonic-welded · IP65</text>

  <!-- split ring -->
  <circle cx="600" cy="132" r="30" fill="none" stroke="#4a5568" stroke-width="9"/>
  <rect x="590" y="160" width="20" height="16" fill="#4a5568"/>

  <!-- housing -->
  <rect x="430" y="180" width="340" height="360" rx="40" fill="#f4efe4" stroke="#c39a5f" stroke-width="2.5"/>

  <!-- HF coil (small planar, OUTER loop) -->
  <ellipse cx="600" cy="360" rx="140" ry="128" fill="none" stroke="#6d5a3a" stroke-width="7"/>
  <ellipse cx="600" cy="360" rx="128" ry="116" fill="none" stroke="#6d5a3a" stroke-width="3" opacity="0.4"/>

  <!-- LF coil (heavier multi-turn, INNER ring) -->
  <ellipse cx="600" cy="360" rx="78" ry="70" fill="none" stroke="#3d6b6b" stroke-width="20"/>
  <ellipse cx="600" cy="360" rx="62" ry="55" fill="none" stroke="#3d6b6b" stroke-width="5" opacity="0.45"/>
  <ellipse cx="600" cy="360" rx="49" ry="43" fill="none" stroke="#3d6b6b" stroke-width="5" opacity="0.32"/>

  <!-- LF callout (left → inner ring) -->
  <line x1="300" y1="344" x2="524" y2="356" stroke="#3d6b6b" stroke-width="2"/>
  <circle cx="524" cy="356" r="4" fill="#3d6b6b"/>
  <text x="92" y="330" font-size="17" font-weight="700" fill="#2c5454">LF coil — 125 kHz</text>
  <text x="92" y="354" font-size="14" fill="#3d6b6b">inner ring</text>
  <text x="92" y="376" font-size="13" fill="#5c5c5c">heavier multi-turn winding</text>

  <!-- HF callout (right → outer loop) -->
  <line x1="740" y1="372" x2="905" y2="372" stroke="#6d5a3a" stroke-width="2"/>
  <circle cx="740" cy="372" r="4" fill="#6d5a3a"/>
  <text x="1108" y="358" text-anchor="end" font-size="17" font-weight="700" fill="#6d5a3a">HF coil — 13.56 MHz</text>
  <text x="1108" y="382" text-anchor="end" font-size="14" fill="#6d5a3a">outer planar loop</text>
  <text x="1108" y="404" text-anchor="end" font-size="13" fill="#5c5c5c">orthogonal routing</text>

  <!-- result band -->
  <rect x="360" y="566" width="480" height="74" rx="16" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="598" text-anchor="middle" font-size="16" font-weight="600" fill="#2c5454">Orthogonal routing keeps the coils apart</text>
  <text x="600" y="623" text-anchor="middle" font-size="15" fill="#3d6b6b">&lt; 1 dB cross-coupling · verified per unit</text>
</svg>
