<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="slTitle slDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="slTitle">The starting point: an 87.1%-accurate barcode warehouse</title>
  <desc id="slDesc">The 3PL's baseline before RFID: 87.1% perpetual-inventory accuracy measured by quarterly full counts, a 4.2% miss-pick rate, 2.1% phantom-stock write-offs, and a single $42K chargeback in Q3. The site is 110,000 square feet with 22 dock doors and about 3,200 SKUs across 9 brand customers, run by 38 associates across 2 shifts.</desc>
  <defs>
    <radialGradient id="slBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="slDark" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#slBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="62" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#6d5a3a">WHERE THIS WAREHOUSE STARTED</text>

  <!-- Left hero: 87.1% baseline -->
  <rect x="56" y="100" width="512" height="324" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="84" y="126" width="214" height="34" rx="17" fill="#efe0bf"/>
  <text x="191" y="149" text-anchor="middle" font-size="14.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">BASELINE ACCURACY</text>
  <text x="312" y="272" text-anchor="middle" font-size="100" font-weight="800" fill="#291c0e">87.1%</text>
  <text x="312" y="312" text-anchor="middle" font-size="16.5" fill="#4f4f4f">perpetual-inventory accuracy</text>
  <text x="312" y="335" text-anchor="middle" font-size="14.5" fill="#6d5a3a">measured by quarterly full counts</text>
  <rect x="84" y="366" width="456" height="20" rx="10" fill="#efe0bf"/>
  <rect x="84" y="366" width="397" height="20" rx="10" fill="#c39a5f"/>
  <text x="312" y="411" text-anchor="middle" font-size="13.5" font-style="italic" fill="#6d5a3a">the realistic ceiling for hand-scan workflows at scale</text>

  <!-- Right: three pain cards -->
  <rect x="600" y="100" width="544" height="96" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="636" y="167" font-size="46" font-weight="800" fill="#291c0e">4.2%</text>
  <text x="800" y="146" font-size="20" font-weight="700" fill="#291c0e">miss-pick rate</text>
  <text x="800" y="173" font-size="15" fill="#4f4f4f">roughly 1 in 24 picks shipped wrong</text>

  <rect x="600" y="210" width="544" height="96" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="636" y="277" font-size="46" font-weight="800" fill="#291c0e">2.1%</text>
  <text x="800" y="256" font-size="20" font-weight="700" fill="#291c0e">phantom-stock write-offs</text>
  <text x="800" y="283" font-size="15" fill="#4f4f4f">inventory the system swore it still had</text>

  <rect x="600" y="320" width="544" height="96" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="636" y="387" font-size="46" font-weight="800" fill="#b3261e">$42K</text>
  <text x="800" y="366" font-size="20" font-weight="700" fill="#291c0e">single Q3 chargeback</text>
  <text x="800" y="393" font-size="15" fill="#4f4f4f">the one that made it the CFO's problem</text>

  <!-- Bottom dark strip -->
  <rect x="56" y="444" width="1088" height="96" rx="16" fill="url(#slDark)"/>
  <text x="88" y="486" font-size="18" font-weight="700" fill="#ffffff">Barcodes were doing their honest best.</text>
  <text x="88" y="516" font-size="18" font-weight="800" fill="#f0d9a8">Their honest best was 87.1%.</text>
  <text x="1112" y="484" text-anchor="end" font-size="14.5" font-weight="700" fill="#e9d9b8">110,000 sq ft  ·  22 dock doors</text>
  <text x="1112" y="510" text-anchor="end" font-size="14.5" font-weight="700" fill="#e9d9b8">~3,200 SKUs  ·  9 brand customers</text>

  <text x="600" y="582" text-anchor="middle" font-size="14" fill="#6d5a3a">US-Midwest 3PL · apparel + consumer-electronics brands · 38 associates across 2 shifts · SAP EWM, no RFID anywhere yet.</text>
</svg>
