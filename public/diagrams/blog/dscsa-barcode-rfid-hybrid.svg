<text x="918.0" y="293" text-anchor="middle" font-size="21" font-weight="800" fill="#2c5454">Barcode is the truth.</text>
<text x="918.0" y="325" text-anchor="middle" font-size="21" font-weight="800" fill="#6d5a3a">RFID is the speed.</text>
