<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">HF magnetic near-field coupling versus UHF electromagnetic far-field backscatter</title>
<desc id="d">Two panels explain why the read ranges differ. HF at 13.56 MHz uses magnetic induction in the near field: the reader couples to a tag only within about 1 to 10 cm, so you read it close. UHF at 860 to 960 MHz uses electromagnetic backscatter in the far field: the reader radiates wavefronts that reach a tag at 1 to 10 m and read 100 or more tags per second, and the tag backscatters a reply. HF must be close because induction dies fast; UHF reaches across the room because it radiates — the same reach that can read the wrong band.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY THE RANGE DIFFERS</text>
<text x="600" y="98" text-anchor="middle" font-size="29" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Near-field tap vs far-field backscatter</text>

<!-- LEFT · HF near field -->
<rect x="88" y="124" width="480" height="372" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="88" y="124" width="480" height="8" rx="4" fill="#3d6b6b"/>
<text x="328" y="166" text-anchor="middle" font-size="17.5" font-weight="800" fill="#2c5454">HF &#183; magnetic near field</text>
<text x="328" y="188" text-anchor="middle" font-size="12.5" fill="#5c5c5c">couples only up close</text>
<text x="252" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">~1&#8211;10 cm</text>
<rect x="150" y="270" width="50" height="76" rx="6" fill="#3d6b6b"/>
<text x="175" y="366" text-anchor="middle" font-size="12.5" fill="#5c5c5c">reader</text>
<path d="M 208,278 Q 232,308 208,338" fill="none" stroke="#3d6b6b" stroke-width="2.4"/>
<path d="M 220,268 Q 252,308 220,348" fill="none" stroke="#3d6b6b" stroke-width="2.4"/>
<path d="M 232,258 Q 276,308 232,358" fill="none" stroke="#6fa3a3" stroke-width="2.4"/>
<rect x="300" y="292" width="36" height="32" rx="6" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="318" y="313" text-anchor="middle" font-size="12" fill="#2c5454">tag</text>
<text x="328" y="432" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">Magnetic induction</text>
<text x="328" y="454" text-anchor="middle" font-size="13" fill="#5c5c5c">field dies fast &#8594; read it close</text>

<!-- RIGHT · UHF far field -->
<rect x="632" y="124" width="480" height="372" rx="14" fill="#eef0f4" stroke="#d4dae2" stroke-width="1.8"/>
<rect x="632" y="124" width="480" height="8" rx="4" fill="#4a5568"/>
<text x="872" y="166" text-anchor="middle" font-size="17.5" font-weight="800" fill="#3a4457">UHF &#183; electromagnetic far field</text>
<text x="872" y="188" text-anchor="middle" font-size="12.5" fill="#5c5c5c">radiates across the room</text>
<text x="872" y="242" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4457">1&#8211;10 m &#183; 100+ tags/sec</text>
<rect x="656" y="270" width="44" height="76" rx="6" fill="#4a5568"/>
<text x="678" y="366" text-anchor="middle" font-size="12.5" fill="#5c5c5c">reader</text>
<path d="M 708,272 Q 736,308 708,344" fill="none" stroke="#4a5568" stroke-width="2.4"/>
<path d="M 730,262 Q 768,308 730,354" fill="none" stroke="#4a5568" stroke-width="2.4"/>
<path d="M 758,254 Q 806,308 758,362" fill="none" stroke="#7a869a" stroke-width="2.4"/>
<path d="M 790,248 Q 846,308 790,368" fill="none" stroke="#9aa4b4" stroke-width="2.4"/>
<line x1="700" y1="262" x2="1030" y2="262" stroke="#b7bfca" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="1030" y="292" width="36" height="32" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="1.8"/>
<text x="1048" y="313" text-anchor="middle" font-size="12" fill="#3a4457">tag</text>
<line x1="1030" y1="336" x2="726" y2="352" stroke="#8b2d2d" stroke-width="1.8" stroke-dasharray="4 4"/>
<polygon points="726,352 741,345 740,357" fill="#8b2d2d"/>
<text x="900" y="384" text-anchor="middle" font-size="12" fill="#8b2d2d">backscatter reply</text>
<text x="872" y="432" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4457">Electromagnetic backscatter</text>
<text x="872" y="454" text-anchor="middle" font-size="13" fill="#5c5c5c">reads many, from a distance</text>

<rect x="88" y="516" width="1024" height="58" rx="12" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="551" text-anchor="middle" font-size="13.5" fill="#4f4f4f">HF must be close because induction dies fast; UHF reaches across the room because it radiates &#8212; the same reach that can read the wrong band.</text>
</svg>
