<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">UHF passive RFID tag prices falling from 2020 to 2030, with NFC and specialty tags holding their ground</title>
<desc id="d">A pricing trajectory. UHF passive tag prices per high-volume inlay fall from 10 to 15 cents in 2020, to 3 to 6 cents in 2025, and toward 2 to 3 cents by 2028 to 2030, driven by manufacturing scale and falling chip costs. Two side cards note that NFC tags hold stable at 8 to 25 cents because of smaller volumes and higher-cost 13.56 megahertz chips, and specialty tags carry a 3 to 10 times premium. Reader hardware falls about 5 to 8 percent per year.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PRICING · COST TRAJECTORY</text>
<text x="600" y="99" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">UHF tags keep getting cheaper</text>
<text x="600" y="131" text-anchor="middle" font-size="16" fill="#4f4f4f">Passive UHF inlays down by more than half since 2020 — NFC and specialty tags hold their ground.</text>
<rect x="74" y="175" width="612" height="388" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<text x="380" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">UHF passive tag price — per high-volume inlay</text>
<polygon points="190,280 395,410 610,462 610,500 190,500" fill="#eef5f5"/>
<line x1="150" y1="500" x2="650" y2="500" stroke="#e6dfd2" stroke-width="1.5"/>
<polyline points="190,280 395,410 610,462" fill="none" stroke="#3d6b6b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="190" cy="280" r="8" fill="#2c5454"/>
<circle cx="395" cy="410" r="8" fill="#2c5454"/>
<circle cx="610" cy="462" r="8" fill="#2c5454"/>
<text x="190" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">$0.10–0.15</text>
<text x="395" y="392" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">$0.03–0.06</text>
<text x="610" y="444" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">$0.02–0.03</text>
<text x="190" y="525" text-anchor="middle" font-size="13.5" fill="#5c5c5c">2020</text>
<text x="395" y="525" text-anchor="middle" font-size="13.5" fill="#5c5c5c">2025</text>
<text x="610" y="525" text-anchor="middle" font-size="13.5" fill="#5c5c5c">2028–30</text>
<text x="380" y="550" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Driven by manufacturing scale and falling chip costs.</text>
<rect x="708" y="180" width="428" height="180" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<rect x="708" y="180" width="428" height="8" rx="4" fill="#c39a5f"/>
<text x="736" y="228" font-size="17" font-weight="700" fill="#291c0e">NFC tags</text>
<text x="736" y="286" font-size="34" font-weight="800" fill="#6d5a3a">$0.08–0.25</text>
<text x="736" y="318" font-size="13.5" fill="#5c5c5c">Held stable — smaller volumes and</text>
<text x="736" y="339" font-size="13.5" fill="#5c5c5c">higher-cost 13.56 MHz chips.</text>
<rect x="708" y="384" width="428" height="180" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<rect x="708" y="384" width="428" height="8" rx="4" fill="#4a5568"/>
<text x="736" y="432" font-size="17" font-weight="700" fill="#291c0e">Specialty tags</text>
<text x="736" y="490" font-size="34" font-weight="800" fill="#4a5568">3–10× premium</text>
<text x="736" y="522" font-size="13.5" fill="#5c5c5c">On-metal, laundry, autoclavable,</text>
<text x="736" y="543" font-size="13.5" fill="#5c5c5c">high-temperature builds.</text>
<text x="600" y="592" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Reader hardware slides too — about 5–8% cheaper per year as UHF reader chips commoditize.</text>
</svg>
