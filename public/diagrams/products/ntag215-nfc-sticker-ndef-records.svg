<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">NDEF record types NTAG215 carries — URI, text, Wi-Fi, and combinations</title>
  <desc id="d">Record type tiles: URI record for URLs up to about 492 characters after overhead, Text records in multiple languages, Wi-Fi credential records for instant network join, and multi-record combinations that 504 bytes accommodates comfortably.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">One tap, four kinds of payload</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">504 bytes is where NDEF stops feeling cramped</text>
  <g transform="translate(70,150)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="500" height="150" rx="12" fill="#eef2f0" stroke="#2c5454" stroke-width="2.5"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="17" fill="#2c5454">URI record</text>
    <text x="24" y="72" font-size="14" fill="#2c5454">URL up to ~492 characters after overhead</text>
    <text x="24" y="98" font-size="13" fill="#6d5a3a">deep links with UTM parameters that would</text>
    <text x="24" y="120" font-size="13" fill="#6d5a3a">never squeeze into 144 bytes</text>
    <rect x="550" y="0" width="500" height="150" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="574" y="40" font-family="Georgia, serif" font-size="17" fill="#2c5454">Wi-Fi credential record</text>
    <text x="574" y="72" font-size="14" fill="#2c5454">instant network join on tap</text>
    <text x="574" y="98" font-size="13" fill="#6d5a3a">guest Wi-Fi at cafes, venues and rentals —</text>
    <text x="574" y="120" font-size="13" fill="#6d5a3a">no password on the chalkboard</text>
    <rect x="0" y="180" width="500" height="150" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="220" font-family="Georgia, serif" font-size="17" fill="#2c5454">Text record</text>
    <text x="24" y="252" font-size="14" fill="#2c5454">multi-language plain text</text>
    <text x="24" y="278" font-size="13" fill="#6d5a3a">instructions, IDs and notes readable by</text>
    <text x="24" y="300" font-size="13" fill="#6d5a3a">any NDEF app</text>
    <rect x="550" y="180" width="500" height="150" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="574" y="220" font-family="Georgia, serif" font-size="17" fill="#291c0e">Multi-record combinations</text>
    <text x="574" y="252" font-size="14" fill="#2c5454">URL + text + credential in one tag</text>
    <text x="574" y="278" font-size="13" fill="#6d5a3a">504 bytes holds the bundle without the</text>
    <text x="574" y="300" font-size="13" fill="#6d5a3a">truncation gymnastics</text>
  </g>
  <text x="70" y="560" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Encoded at the factory to your record layout — NDEF written and locked before shipment on request</text>
</svg>
