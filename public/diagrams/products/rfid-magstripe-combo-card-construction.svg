<text x="295" y="392" text-anchor="middle" font-size="12.5" fill="#4f4f4f">PVC core carries the antenna coil + chip module</text>
<text x="295" y="412" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the stripe rides the back overlay's outer face</text>

<text x="320" y="452" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">85.60 × 53.98 mm — ISO/IEC 7810 ID-1 (CR80)</text>

<text x="320" y="512" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f6f3a">Keep the stripe read surface unlaminated —</text>
<text x="320" y="532" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f6f3a">no spot UV, foil, or overlaminate on the band</text>

