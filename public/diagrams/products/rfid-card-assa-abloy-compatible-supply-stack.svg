<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The hotel access stack — a card-supplier switch touches one layer</title>
  <desc id="d">Four-layer diagram of a hotel access-control stack. From top: the property management system (Oracle Opera, Mews, Cloudbeds) with card-agnostic integrations; the Assa Abloy access software and front-desk encoder layer, where site keys stay with operator IT; the lock hardware layer of VingCard Classic, Essence, Allure, Signature RFID and Vostio-managed locks reading ISO/IEC 14443-A at 13.56 MHz; and at the bottom the key card layer, MIFARE Classic 1K/4K or MIFARE DESFire EV2/EV3, shipped blank or UID-pre-allocated and encoded at the front desk. The top three layers are marked UNCHANGED when switching card supplier; only the card layer is marked YOUR DECISION — the only consumable in the stack.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ASSA ABLOY-COMPATIBLE KEY CARDS &#183; THE SUPPLY STACK</text>
  <text x="600" y="102" text-anchor="middle" font-size="34" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">A card-supplier switch touches one layer</text>

  <!-- right rail header -->
  <text x="972" y="140" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHEN YOU SWITCH SUPPLIER</text>

  <!-- Layer 1: PMS -->
  <rect x="80" y="152" width="730" height="88" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="108" y="189" font-size="17" font-weight="700" fill="#291c0e">Property management system</text>
  <text x="108" y="216" font-size="13" fill="#4f4f4f">Oracle Opera &#183; Mews &#183; Cloudbeds &#8212; integrations are card-agnostic</text>
  <line x1="810" y1="196" x2="866" y2="196" stroke="#c9c2b4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="870" y="176" width="204" height="40" rx="20" fill="#f2f7f2" stroke="#1f6f3a" stroke-width="1.5"/>
  <text x="972" y="201" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.5" fill="#1f6f3a">UNCHANGED</text>

  <!-- connector -->
  <line x1="445" y1="240" x2="445" y2="256" stroke="#c9c2b4" stroke-width="2"/>
  <path d="M 439 250 L 445 258 L 451 250" fill="none" stroke="#c9c2b4" stroke-width="2"/>

  <!-- Layer 2: access software + encoder -->
  <rect x="80" y="262" width="730" height="88" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="108" y="299" font-size="17" font-weight="700" fill="#291c0e">Access software + front-desk encoder</text>
  <text x="108" y="326" font-size="13" fill="#4f4f4f">VingCard / Vostio software &#8212; site keys stay with operator IT</text>
  <line x1="810" y1="306" x2="866" y2="306" stroke="#c9c2b4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="870" y="286" width="204" height="40" rx="20" fill="#f2f7f2" stroke="#1f6f3a" stroke-width="1.5"/>
  <text x="972" y="311" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.5" fill="#1f6f3a">UNCHANGED</text>

  <!-- connector -->
  <line x1="445" y1="350" x2="445" y2="366" stroke="#c9c2b4" stroke-width="2"/>
  <path d="M 439 360 L 445 368 L 451 360" fill="none" stroke="#c9c2b4" stroke-width="2"/>

  <!-- Layer 3: lock hardware -->
  <rect x="80" y="372" width="730" height="100" rx="14" fill="#eef0f4" stroke="#4a5568" stroke-width="1.5"/>
  <text x="108" y="407" font-size="17" font-weight="700" fill="#291c0e">Lock hardware</text>
  <text x="108" y="432" font-size="13" fill="#4f4f4f">VingCard Classic &#183; Essence &#183; Allure &#183; Signature RFID &#183; Vostio-managed locks</text>
  <text x="108" y="452" font-size="13" fill="#4f4f4f">read ISO/IEC 14443-A at 13.56 MHz &#8212; an open standard, not a licence</text>
  <line x1="810" y1="422" x2="866" y2="422" stroke="#c9c2b4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="870" y="402" width="204" height="40" rx="20" fill="#f2f7f2" stroke="#1f6f3a" stroke-width="1.5"/>
  <text x="972" y="427" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.5" fill="#1f6f3a">UNCHANGED</text>

  <!-- connector -->
  <line x1="445" y1="472" x2="445" y2="488" stroke="#c9c2b4" stroke-width="2"/>
  <path d="M 439 482 L 445 490 L 451 482" fill="none" stroke="#c9c2b4" stroke-width="2"/>

  <!-- Layer 4: the card (highlighted) -->
  <rect x="80" y="494" width="730" height="104" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.5"/>
  <text x="108" y="531" font-size="17" font-weight="700" fill="#234a4a">The key card &#8212; the consumable</text>
  <text x="108" y="556" font-size="13" fill="#2c5454">MIFARE Classic 1K / 4K or MIFARE DESFire EV2 / EV3</text>
  <text x="108" y="576" font-size="13" fill="#2c5454">ships blank or UID-pre-allocated &#8212; encoded at your front desk</text>
  <line x1="810" y1="546" x2="866" y2="546" stroke="#3d6b6b" stroke-width="1.5"/>
  <rect x="870" y="526" width="204" height="40" rx="20" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
  <text x="972" y="551" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.5" fill="#ffffff">YOUR DECISION</text>
  <text x="972" y="586" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the only consumable in the stack</text>

  <text x="600" y="637" text-anchor="middle" font-size="13" fill="#5c5c5c">A correctly chipped, correctly encoded card is indistinguishable from OEM stock at the lock (ISO/IEC 14443-A).</text>
</svg>
