<text x="636" y="278" text-anchor="start" font-size="14" font-weight="600" fill="#291c0e">NFC + UHF dual-chip · Tappit + Cvent</text>
<text x="636" y="304" text-anchor="start" font-size="13" fill="#5c5c5c">syncs HubSpot, Salesforce, Marketo</text>
