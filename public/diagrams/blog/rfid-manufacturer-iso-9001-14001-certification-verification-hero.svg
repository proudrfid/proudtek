<line x1="931" y1="369" x2="947" y2="369" stroke="#d9a89e" stroke-width="1.5"/>
<rect x="947" y="354" width="175" height="30" rx="15" fill="#ffffff" stroke="#d9a89e"/>
<text x="1034" y="374" text-anchor="middle" font-size="12.5" fill="#8b2d2d">issuer not accredited ✗</text>

<rect x="678" y="505" width="410" height="34" rx="17" fill="#f7e3df" stroke="#d9a89e"/>
<text x="883" y="527" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">✗ No record on the issuer's portal — walk away</text>

<!-- magnifier -->
<circle cx="600" cy="330" r="48" fill="none" stroke="#c39a5f" stroke-width="9"/>
<line x1="634" y1="364" x2="676" y2="406" stroke="#c39a5f" stroke-width="13" stroke-linecap="round"/>

<text x="600" y="596" text-anchor="middle" font-size="15" fill="#4f4f4f">5-15% of certificates in factory RFPs are fake, expired or issued by a body nobody accredited</text>
<text x="600" y="622" text-anchor="middle" font-size="13.5" fill="#5c5c5c">the five-minute check: portal record · accreditation directory · tri-logo · audit dates · scope</text>
