<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Clone-resistant credential families, a 2026 short-list</title>
<desc id="d">Four mainstream successors to a cloned legacy card, compared on cryptography and best fit. MIFARE DESFire EV3 from NXP uses AES-128 with three-pass mutual authentication and Common Criteria EAL5+ certification, and is the broadest 13.56 MHz upgrade path. HID Seos uses AES-128 plus ECC key exchange in a portable SIO data wrapper, best for HID reader estates spanning card, mobile and IT logon. MIFARE Plus uses AES-128 and upgrades from Security Level 1 to 3 without reissuing cards, suiting transit and education phased swaps. Mobile and FIDO2 credentials add a Secure Element plus biometric unlock as an additive layer for visitors and contractors.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CLONE-RESISTANT CREDENTIALS · 2026 SHORT-LIST</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Match encryption and portability to the building you actually operate.</text>

<text x="96" y="140" font-size="13" font-weight="800" letter-spacing="1" fill="#6d5a3a">FAMILY</text>
<text x="452" y="140" font-size="13" font-weight="800" letter-spacing="1" fill="#6d5a3a">CRYPTO / CERTS</text>
<text x="812" y="140" font-size="13" font-weight="800" letter-spacing="1" fill="#6d5a3a">BEST FIT</text>

