<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Proud Tek card encoding menu: one card program resolved into four encoding types and one verified deliverable</title>
  <desc id="d">A left-to-right map. On the left, a card labelled YOUR CARD PROGRAM (chip, data file, keys, reader fleet). In the centre, four encoding-type lanes, each pairing a chip family with its key or lock service: Sector encoding (MIFARE Classic 1K / 4K, Key A / Key B plus access conditions); Application encoding (MIFARE DESFire EV2 / EV3, AES-128 application keys and files); NDEF encoding (NTAG 213 / 215 / 216 and NTAG 424 DNA, URL or vCard with a 32-bit password or SUN); and EPC / SGTIN encoding (UHF UCODE card, SGTIN-96 to the GS1 EPC Tag Data Standard plus permalock). All four converge on the right into ONE DELIVERABLE: 100% read-verified, encoding database included, locked to spec, straight to your dock.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PROUD TEK ENCODING MENU</text>
  <text x="600" y="99" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">One program, four encoding types, one deliverable</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">Chip family, encoding type and key or lock service — written on the line and read-verified.</text>

  <!-- connectors: program to lanes -->
  <path d="M262,393 L300,204" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M262,393 L300,330" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M262,393 L300,456" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M262,393 L300,582" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <!-- connectors: lanes to deliverable -->
  <path d="M900,204 L944,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,330 L944,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,456 L944,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,582 L944,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>

  <!-- program card -->
  <rect x="44" y="300" width="216" height="186" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="152" y="344" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">YOUR CARD</text>
  <text x="152" y="367" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">PROGRAM</text>
  <text x="152" y="404" text-anchor="middle" font-size="13" fill="#5c5c5c">chip · data file,</text>
  <text x="152" y="425" text-anchor="middle" font-size="13" fill="#5c5c5c">keys, reader fleet</text>

  <!-- lane 1: sector encoding -->
  <rect x="300" y="150" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="150" width="7" height="108" rx="3" fill="#c39a5f"/>
  <text x="324" y="182" font-size="18" font-weight="700" fill="#291c0e">Sector encoding</text>
  <text x="324" y="210" font-size="14" fill="#5c5c5c">MIFARE Classic 1K / 4K</text>
  <text x="324" y="238" font-size="14" font-weight="700" fill="#2c5454">Key A / Key B + access conditions</text>

  <!-- lane 2: application encoding -->
  <rect x="300" y="276" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="276" width="7" height="108" rx="3" fill="#4a5568"/>
  <text x="324" y="308" font-size="18" font-weight="700" fill="#291c0e">Application encoding</text>
  <text x="324" y="336" font-size="14" fill="#5c5c5c">MIFARE DESFire EV2 / EV3</text>
  <text x="324" y="364" font-size="14" font-weight="700" fill="#2c5454">AES-128 application keys + files</text>

  <!-- lane 3: NDEF encoding -->
  <rect x="300" y="402" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="402" width="7" height="108" rx="3" fill="#3d6b6b"/>
  <text x="324" y="434" font-size="18" font-weight="700" fill="#291c0e">NDEF encoding</text>
  <text x="324" y="462" font-size="14" fill="#5c5c5c">NTAG 213 / 215 / 216 · NTAG 424 DNA</text>
  <text x="324" y="490" font-size="14" font-weight="700" fill="#2c5454">URL / vCard + 32-bit password or SUN</text>

  <!-- lane 4: EPC / SGTIN encoding -->
  <rect x="300" y="528" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="528" width="7" height="108" rx="3" fill="#2d6a4f"/>
  <text x="324" y="560" font-size="18" font-weight="700" fill="#291c0e">EPC / SGTIN encoding</text>
  <text x="324" y="588" font-size="14" fill="#5c5c5c">UHF UCODE card</text>
  <text x="324" y="616" font-size="14" font-weight="700" fill="#2c5454">SGTIN-96 to GS1 EPC TDS + permalock</text>

  <!-- deliverable card -->
  <rect x="944" y="300" width="216" height="186" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="1052" y="340" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">ONE DELIVERABLE</text>
  <text x="1052" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">100% read-verified</text>
  <text x="1052" y="400" text-anchor="middle" font-size="14" fill="#291c0e">Encoding database</text>
  <text x="1052" y="426" text-anchor="middle" font-size="14" fill="#291c0e">Locked to spec</text>
  <text x="1052" y="452" text-anchor="middle" font-size="13" fill="#5c5c5c">Straight to your dock</text>
</svg>
