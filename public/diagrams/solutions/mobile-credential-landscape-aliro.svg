<text x="929" y="518" text-anchor="middle" font-size="12.5" fill="#c8cfda">specify Aliro-certified readers on greenfield builds</text>

<!-- plastic note -->
<rect x="90" y="570" width="1020" height="48" rx="12" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.5"/>
<text x="600" y="600" text-anchor="middle" font-size="14" font-weight="700" fill="#6d5a3a">Plastic stays primary through the transition — mobile is an opt-in complement for ~10–25% of a typical workforce.</text>
</svg>
