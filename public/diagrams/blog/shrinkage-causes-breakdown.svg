<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Where warehouse shrinkage leaks out</title>
<desc id="d">A recorded-stock bar at the top and a smaller physical-stock bar at the bottom, with five red leak arrows between them: receiving errors, misplacement, internal theft, administrative and data-entry errors, and damage or spoilage.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT CAUSES SHRINKAGE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Five leaks drain recorded stock down to what's physically on the racks.</text>
<rect x="90" y="172" width="1020" height="46" rx="8" fill="#4a5568"/>
<text x="600" y="201" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">RECORDED IN WMS  —  what the system says you own</text>
<rect x="150" y="486" width="900" height="46" rx="8" fill="#9aa6b5"/>
<text x="600" y="515" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">PHYSICAL ON THE RACKS  —  what's actually there</text>
<line x1="210" y1="224" x2="210" y2="471" stroke="#8b2d2d" stroke-width="3"/><polygon points="203,471 210,480 217,471" fill="#8b2d2d"/>
<rect x="126" y="300" width="168" height="96" rx="12" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.6"/>
<rect x="126" y="300" width="168" height="7" rx="3" fill="#8b2d2d"/>
<text x="210" y="338" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Receiving</text>
<text x="210" y="357" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">errors</text>
<text x="210" y="381" text-anchor="middle" font-size="12" fill="#5c5c5c">miscount at dock</text>
<line x1="405" y1="224" x2="405" y2="471" stroke="#8b2d2d" stroke-width="3"/><polygon points="398,471 405,480 412,471" fill="#8b2d2d"/>
<rect x="321" y="300" width="168" height="96" rx="12" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.6"/>
<rect x="321" y="300" width="168" height="7" rx="3" fill="#8b2d2d"/>
<text x="405" y="338" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Mis-</text>
<text x="405" y="357" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">placement</text>
<text x="405" y="381" text-anchor="middle" font-size="12" fill="#5c5c5c">wrong bin/zone</text>
<line x1="600" y1="224" x2="600" y2="471" stroke="#8b2d2d" stroke-width="3"/><polygon points="593,471 600,480 607,471" fill="#8b2d2d"/>
<rect x="516" y="300" width="168" height="96" rx="12" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.6"/>
<rect x="516" y="300" width="168" height="7" rx="3" fill="#8b2d2d"/>
<text x="600" y="338" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Internal</text>
<text x="600" y="357" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">theft</text>
<text x="600" y="381" text-anchor="middle" font-size="12" fill="#5c5c5c">high-value pilferage</text>
<line x1="795" y1="224" x2="795" y2="471" stroke="#8b2d2d" stroke-width="3"/><polygon points="788,471 795,480 802,471" fill="#8b2d2d"/>
<rect x="711" y="300" width="168" height="96" rx="12" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.6"/>
<rect x="711" y="300" width="168" height="7" rx="3" fill="#8b2d2d"/>
<text x="795" y="338" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Admin &amp; data</text>
<text x="795" y="357" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">errors</text>
<text x="795" y="381" text-anchor="middle" font-size="12" fill="#5c5c5c">mis-keyed in WMS</text>
<line x1="990" y1="224" x2="990" y2="471" stroke="#8b2d2d" stroke-width="3"/><polygon points="983,471 990,480 997,471" fill="#8b2d2d"/>
<rect x="906" y="300" width="168" height="96" rx="12" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.6"/>
<rect x="906" y="300" width="168" height="7" rx="3" fill="#8b2d2d"/>
<text x="990" y="338" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Damage &amp;</text>
<text x="990" y="357" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">spoilage</text>
<text x="990" y="381" text-anchor="middle" font-size="12" fill="#5c5c5c">not written off</text>
<text x="600" y="590" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Most of the leak is mundane — a mistyped count or a misfiled pallet, not the loading-dock door.</text>
</svg>
