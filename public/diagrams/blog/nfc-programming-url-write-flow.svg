<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Writing a URL to an NFC tag in five steps</title>
<desc id="d">Five-step flow on a numbered line. Step one, plug the ACR122U into USB — Windows recognizes it instantly, macOS and Linux need the ACR driver package first. Step two, open the writing software: NXP TagXplorer or the open-source NDEF library with a Python or Java wrapper. Step three, place the tag on the reader, which announces its UID, chip type and free memory. Step four, create an NDEF URI record and type the full URL including the https prefix; the URI prefix byte is selected automatically. Step five, write and verify — the write confirms in under 500 milliseconds, then test with a real phone. A banner notes that four of the five steps are setup.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE FIVE-STEP RITUAL · FOUR OF THEM ARE SETUP</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Writing a URL record with an ACR122U</text>

<line x1="180" y1="180" x2="1020" y2="180" stroke="#e4c98f" stroke-width="2.5"/>

<circle cx="180" cy="180" r="26" fill="#c39a5f"/>
<text x="180" y="188" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
<rect x="80" y="228" width="200" height="170" rx="12" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="180" y="258" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Plug in USB</text>
<text x="180" y="286" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Windows: instant</text>
<text x="180" y="308" text-anchor="middle" font-size="12.5" fill="#4f4f4f">macOS &amp; Linux:</text>
<text x="180" y="330" text-anchor="middle" font-size="12.5" fill="#4f4f4f">ACR driver first</text>
<text x="180" y="374" text-anchor="middle" font-size="12" fill="#6d5a3a">a drawer near you has one</text>

<circle cx="390" cy="180" r="26" fill="#c39a5f"/>
<text x="390" y="188" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
<rect x="290" y="228" width="200" height="170" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="390" y="258" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Open software</text>
<text x="390" y="286" text-anchor="middle" font-size="12.5" fill="#4f4f4f">NXP TagXplorer, or the</text>
<text x="390" y="308" text-anchor="middle" font-size="12.5" fill="#4f4f4f">NDEF library with a</text>
<text x="390" y="330" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Python / Java wrapper</text>
<text x="390" y="374" text-anchor="middle" font-size="12" fill="#6d5a3a">no judgment</text>

<circle cx="600" cy="180" r="26" fill="#c39a5f"/>
<text x="600" y="188" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
<rect x="500" y="228" width="200" height="170" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="258" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Place the tag</text>
<text x="600" y="286" text-anchor="middle" font-size="12.5" fill="#4f4f4f">reader announces UID,</text>
<text x="600" y="308" text-anchor="middle" font-size="12.5" fill="#4f4f4f">chip type and</text>
<text x="600" y="330" text-anchor="middle" font-size="12.5" fill="#4f4f4f">available memory</text>
<text x="600" y="374" text-anchor="middle" font-size="12" fill="#6d5a3a">a very boring dating profile</text>

<circle cx="810" cy="180" r="26" fill="#c39a5f"/>
<text x="810" y="188" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">4</text>
<rect x="710" y="228" width="200" height="170" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="810" y="258" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Add URI record</text>
<text x="810" y="286" text-anchor="middle" font-size="12.5" fill="#4f4f4f">type the full URL,</text>
<text x="810" y="308" text-anchor="middle" font-size="12.5" fill="#4f4f4f">https:// included —</text>
<text x="810" y="330" text-anchor="middle" font-size="12.5" fill="#4f4f4f">prefix byte auto-set</text>
<text x="810" y="374" text-anchor="middle" font-size="12" fill="#6d5a3a">a favor you'll never notice</text>

<circle cx="1020" cy="180" r="26" fill="#2d6a4f"/>
<text x="1020" y="188" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">5</text>
<rect x="920" y="228" width="200" height="170" rx="12" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="1020" y="258" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1b4332">Write &amp; verify</text>
<text x="1020" y="286" text-anchor="middle" font-size="12.5" fill="#4f4f4f">confirms in &lt; 500 ms,</text>
<text x="1020" y="308" text-anchor="middle" font-size="12.5" fill="#4f4f4f">then tap it with</text>
<text x="1020" y="330" text-anchor="middle" font-size="12.5" fill="#4f4f4f">a real phone</text>
<text x="1020" y="374" text-anchor="middle" font-size="12" fill="#1b4332">"wrote fine" is not "works"</text>

<rect x="240" y="460" width="720" height="100" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="502" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="21" font-weight="700" fill="#291c0e">Four of the five steps are setup.</text>
<text x="600" y="534" text-anchor="middle" font-size="14" fill="#4f4f4f">The write takes under half a second — then test with an actual phone.</text>

<text x="600" y="610" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Works with any NDEF-capable reader — the ACR122U is just the one in everybody's drawer.</text>
</svg>
