<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ccTitle ccDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ccTitle">Chip compatibility, step by step</title>
  <desc id="ccDesc">A four-step path: provide the lock brand, model and firmware; the supplier confirms the required chip family and ISO standard; test 25 to 50 sample cards on locks across floors and wings; verify chips from authorized NXP distributors. A mapping strip shows VingCard Visionline expecting DESFire EV2/EV3 and Saflok defaulting to Ultralight C.</desc>

  <defs>
    <radialGradient id="ccBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="ccDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
    <marker id="ccArrow" markerWidth="9" markerHeight="9" refX="3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c39a5f"/></marker>
  </defs>

  <rect width="1200" height="675" fill="url(#ccBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="64" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2" fill="#6d5a3a">CHIP COMPATIBILITY, STEP BY STEP</text>
  <text x="600" y="94" text-anchor="middle" font-size="16" fill="#4f4f4f">The first filter: can the supplier source and configure the exact chip your locks need?</text>

  <!-- 4 steps -->
  <g>
    <line x1="316" y1="250" x2="352" y2="250" stroke="#c39a5f" stroke-width="3.5" marker-end="url(#ccArrow)"/>
    <line x1="592" y1="250" x2="628" y2="250" stroke="#c39a5f" stroke-width="3.5" marker-end="url(#ccArrow)"/>
    <line x1="868" y1="250" x2="904" y2="250" stroke="#c39a5f" stroke-width="3.5" marker-end="url(#ccArrow)"/>

    <rect x="66" y="150" width="250" height="200" rx="16" fill="#fbf8f2" stroke="#d9b98a" stroke-width="2"/>
    <circle cx="191" cy="196" r="24" fill="#291c0e"/><text x="191" y="204" text-anchor="middle" font-size="22" font-weight="800" fill="#d4a755">1</text>
    <text x="191" y="252" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">You provide</text>
    <text x="191" y="284" text-anchor="middle" font-size="13.5" fill="#4f4f4f">lock brand, model</text>
    <text x="191" y="304" text-anchor="middle" font-size="13.5" fill="#4f4f4f">&amp; firmware version</text>

    <rect x="342" y="150" width="250" height="200" rx="16" fill="#fbf8f2" stroke="#d9b98a" stroke-width="2"/>
    <circle cx="467" cy="196" r="24" fill="#3d6b6b"/><text x="467" y="204" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">2</text>
    <text x="467" y="252" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Supplier confirms</text>
    <text x="467" y="284" text-anchor="middle" font-size="13.5" fill="#4f4f4f">required chip family</text>
    <text x="467" y="304" text-anchor="middle" font-size="13.5" fill="#4f4f4f">&amp; ISO standard</text>

    <rect x="618" y="150" width="250" height="200" rx="16" fill="#fbf8f2" stroke="#d9b98a" stroke-width="2"/>
    <circle cx="743" cy="196" r="24" fill="#4a5568"/><text x="743" y="204" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">3</text>
    <text x="743" y="252" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Test samples</text>
    <text x="743" y="284" text-anchor="middle" font-size="13.5" fill="#4f4f4f">25–50 cards, on locks</text>
    <text x="743" y="304" text-anchor="middle" font-size="13.5" fill="#4f4f4f">across floors &amp; wings</text>

    <rect x="894" y="150" width="240" height="200" rx="16" fill="#fbf8f2" stroke="#c39a5f" stroke-width="2.5"/>
    <circle cx="1014" cy="196" r="24" fill="#1f6f3a"/><text x="1014" y="204" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">4</text>
    <text x="1014" y="252" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Verify sourcing</text>
    <text x="1014" y="284" text-anchor="middle" font-size="13.5" fill="#4f4f4f">authorized NXP</text>
    <text x="1014" y="304" text-anchor="middle" font-size="13.5" fill="#4f4f4f">distributors only</text>
  </g>

  <!-- mapping band -->
  <rect x="66" y="392" width="1068" height="150" rx="16" fill="url(#ccDark)"/>
  <text x="600" y="430" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.5" fill="#d4a755">KNOW THE MAPPING BEFORE YOU QUOTE</text>
  <rect x="140" y="452" width="420" height="60" rx="12" fill="#3a2c18"/>
  <text x="350" y="480" text-anchor="middle" font-size="16" font-weight="700" fill="#f4efe4">VingCard Visionline</text>
  <text x="350" y="501" text-anchor="middle" font-size="14" fill="#d4a755">expects DESFire EV2/EV3</text>
  <rect x="640" y="452" width="420" height="60" rx="12" fill="#3a2c18"/>
  <text x="850" y="480" text-anchor="middle" font-size="16" font-weight="700" fill="#f4efe4">Saflok</text>
  <text x="850" y="501" text-anchor="middle" font-size="14" fill="#d4a755">defaults to Ultralight C</text>

  <text x="600" y="592" text-anchor="middle" font-size="16.5" fill="#6d5a3a">Grey-market chips mean counterfeit silicon — insist on authorized-distributor invoices.</text>
</svg>
