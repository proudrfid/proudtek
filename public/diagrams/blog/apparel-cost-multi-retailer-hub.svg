<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Multi-retailer RFID: one shared core, duplicated EDI, scorecard and audit per retailer</title>
<desc id="d">Hub-and-spoke diagram of a multi-retailer apparel RFID program. A dark central hub is the shared core, bought once: the tag SKU (one ARC-certified UHF inlay), the encoder, the label printer, the tunnel reader and the GS1 company prefix. Dashed spokes lead to four retailer cards — Walmart, Target, Macy's and Kohl's — and each card carries the lines that duplicate with every retailer: its own EDI VAN feed, scorecard monitoring and placement audit. A note under the hub prices each added VAN at $5K-25K one-time plus $2K-8K a year. The footer: one inlay and one set of hardware serve every retailer; the paperwork multiplies with each logo you add.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE CORE, MANY SCORECARDS</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Share the hardware, duplicate the paperwork</text>

<!-- spokes (under hub and cards) -->
<line x1="600" y1="390" x2="245" y2="187" stroke="#c39a5f" stroke-width="2.5" stroke-dasharray="6 5"/>
<line x1="600" y1="390" x2="955" y2="187" stroke="#c39a5f" stroke-width="2.5" stroke-dasharray="6 5"/>
<line x1="600" y1="390" x2="245" y2="557" stroke="#c39a5f" stroke-width="2.5" stroke-dasharray="6 5"/>
<line x1="600" y1="390" x2="955" y2="557" stroke="#c39a5f" stroke-width="2.5" stroke-dasharray="6 5"/>

<!-- hub -->
<circle cx="600" cy="390" r="118" fill="#291c0e"/>
<circle cx="600" cy="390" r="126" fill="none" stroke="#d4a755" stroke-width="2" stroke-dasharray="3 5"/>
<text x="600" y="344" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#d4a755">SHARED CORE</text>
<text x="600" y="368" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">buy once</text>
<text x="600" y="398" text-anchor="middle" font-size="12.5" fill="#ded6c4">Tag SKU · Encoder</text>
<text x="600" y="418" text-anchor="middle" font-size="12.5" fill="#ded6c4">Label printer · Tunnel reader</text>
<text x="600" y="438" text-anchor="middle" font-size="12.5" fill="#ded6c4">GS1 company prefix</text>

<!-- retailer cards -->
<rect x="140" y="150" width="210" height="74" rx="12" fill="#ffffff" stroke="#e4c98f" stroke-width="2"/>
<text x="245" y="182" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="18" font-weight="700" fill="#291c0e">Walmart</text>
<text x="245" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6b3c">+ EDI · scorecard · audit</text>
<rect x="850" y="150" width="210" height="74" rx="12" fill="#ffffff" stroke="#e4c98f" stroke-width="2"/>
<text x="955" y="182" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="18" font-weight="700" fill="#291c0e">Target</text>
<text x="955" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6b3c">+ EDI · scorecard · audit</text>
<rect x="140" y="520" width="210" height="74" rx="12" fill="#ffffff" stroke="#e4c98f" stroke-width="2"/>
<text x="245" y="552" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="18" font-weight="700" fill="#291c0e">Macy's</text>
<text x="245" y="576" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6b3c">+ EDI · scorecard · audit</text>
<rect x="850" y="520" width="210" height="74" rx="12" fill="#ffffff" stroke="#e4c98f" stroke-width="2"/>
<text x="955" y="552" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="18" font-weight="700" fill="#291c0e">Kohl's</text>
<text x="955" y="576" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6b3c">+ EDI · scorecard · audit</text>

<text x="600" y="550" text-anchor="middle" font-size="12.5" fill="#5c5c5c">each added VAN: $5K–25K one-time + $2K–8K / yr</text>
<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#4f4f4f">One ARC-certified inlay and one set of hardware serve every retailer — the EDI feed, scorecard and audit multiply with each logo you add.</text>
</svg>
