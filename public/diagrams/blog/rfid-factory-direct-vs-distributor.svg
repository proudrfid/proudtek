<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Buying RFID factory-direct versus through a value-added distributor</title>
<desc id="d">A two-panel comparison. Buying factory-direct wins only on unit price: lead time is 6-12 weeks, support is 12 hours delayed, and payment is prepayment or letter of credit. Buying through a distributor ships in 2-5 days for a 15-25% premium, delivers pre-encoded tags at a $0.05-0.50 per tag service charge, provides local same-time-zone support, and offers net-30 or net-60 terms. The distributor's margin lives in the difference between the two offers.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FACTORY-DIRECT vs THE DISTRIBUTOR</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">What a shipping container can't sell</text>
<text x="600" y="134" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Same tag, very different offer — the distributor's margin lives in the difference.</text>

<!-- LEFT panel: factory-direct -->
<rect x="64" y="164" width="520" height="392" rx="16" fill="#ffffff" stroke="#e3b8b8" stroke-width="1.8"/>
<rect x="64" y="164" width="520" height="52" rx="16" fill="#fbeeee"/>
<rect x="64" y="196" width="520" height="20" fill="#fbeeee"/>
<text x="88" y="197" font-size="17" font-weight="800" fill="#8b2d2d">BUY FACTORY-DIRECT</text>

<rect x="80" y="236" width="488" height="50" rx="9" fill="#eef7f0" stroke="#cfe6d6" stroke-width="1.3"/>
<circle cx="102" cy="261" r="6" fill="#1f6f3a"/><text x="120" y="266" font-size="14" fill="#291c0e">Unit price</text><text x="552" y="266" text-anchor="end" font-size="14.5" font-weight="700" fill="#1f6f3a">Lowest</text>
<rect x="80" y="298" width="488" height="50" rx="9" fill="#fbf3f3" stroke="#ecd2d2" stroke-width="1.3"/>
<circle cx="102" cy="323" r="6" fill="#8b2d2d"/><text x="120" y="328" font-size="14" fill="#291c0e">Lead time</text><text x="552" y="328" text-anchor="end" font-size="14.5" font-weight="700" fill="#8b2d2d">6-12 weeks</text>
<rect x="80" y="360" width="488" height="50" rx="9" fill="#fbf3f3" stroke="#ecd2d2" stroke-width="1.3"/>
<circle cx="102" cy="385" r="6" fill="#8b2d2d"/><text x="120" y="390" font-size="14" fill="#291c0e">Support</text><text x="552" y="390" text-anchor="end" font-size="14.5" font-weight="700" fill="#8b2d2d">12-hr delayed</text>
<rect x="80" y="422" width="488" height="50" rx="9" fill="#fbf3f3" stroke="#ecd2d2" stroke-width="1.3"/>
<circle cx="102" cy="447" r="6" fill="#8b2d2d"/><text x="120" y="452" font-size="14" fill="#291c0e">Payment</text><text x="552" y="452" text-anchor="end" font-size="14.5" font-weight="700" fill="#8b2d2d">Prepay / LC</text>
<text x="324" y="516" text-anchor="middle" font-size="13" fill="#8b2d2d">Wins on unit price. That's the whole pitch.</text>

<!-- RIGHT panel: distributor -->
<rect x="616" y="164" width="520" height="392" rx="16" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.8"/>
<rect x="616" y="164" width="520" height="52" rx="16" fill="#eef7f0"/>
<rect x="616" y="196" width="520" height="20" fill="#eef7f0"/>
<text x="640" y="197" font-size="17" font-weight="800" fill="#1f6f3a">BUY THROUGH A DISTRIBUTOR</text>

<rect x="632" y="236" width="488" height="50" rx="9" fill="#eef7f0" stroke="#cfe6d6" stroke-width="1.3"/>
<circle cx="654" cy="261" r="6" fill="#1f6f3a"/><text x="672" y="266" font-size="14" fill="#291c0e">Speed</text><text x="1104" y="266" text-anchor="end" font-size="14.5" font-weight="700" fill="#1f6f3a">Ships in 2-5 days</text>
<rect x="632" y="298" width="488" height="50" rx="9" fill="#eef7f0" stroke="#cfe6d6" stroke-width="1.3"/>
<circle cx="654" cy="323" r="6" fill="#1f6f3a"/><text x="672" y="328" font-size="14" fill="#291c0e">Premium it earns</text><text x="1104" y="328" text-anchor="end" font-size="14.5" font-weight="700" fill="#1f6f3a">15-25%</text>
<rect x="632" y="360" width="488" height="50" rx="9" fill="#eef7f0" stroke="#cfe6d6" stroke-width="1.3"/>
<circle cx="654" cy="385" r="6" fill="#1f6f3a"/><text x="672" y="390" font-size="14" fill="#291c0e">Pre-encoded</text><text x="1104" y="390" text-anchor="end" font-size="14.5" font-weight="700" fill="#1f6f3a">$0.05-0.50/tag</text>
<rect x="632" y="422" width="488" height="50" rx="9" fill="#eef7f0" stroke="#cfe6d6" stroke-width="1.3"/>
<circle cx="654" cy="447" r="6" fill="#1f6f3a"/><text x="672" y="452" font-size="14" fill="#291c0e">Terms</text><text x="1104" y="452" text-anchor="end" font-size="14.5" font-weight="700" fill="#1f6f3a">Net-30 / net-60</text>
<text x="876" y="516" text-anchor="middle" font-size="13" fill="#1f6f3a">Local support, in the customer's time zone and language.</text>

<text x="600" y="345" text-anchor="middle" font-size="19" font-weight="800" fill="#a8a29a">vs</text>
<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#5c5c5c">The factory wins on unit price. The distributor wins on everything the buyer needs after the pallet lands.</text>
</svg>
