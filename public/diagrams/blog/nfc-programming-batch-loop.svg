<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The batch encoding loop: CSV in, encoded tags out, every write logged</title>
<desc id="d">Pipeline diagram. A data.csv card with rows of sequence numbers and URLs feeds an encoding script driving a desktop reader. The script writes a unique URL to each tag in a queue — one done with a green check, one being written, two waiting — and beeps on every success. A write log on the right records UID, status and URL for each tag at a sustained 200 to 400 tags per hour. A banner reads: the operator's whole job is hear beep, swap tag, repeat. A footnote adds that past 1,000-plus tags per day you move to a conveyor-fed inline encoder or let the supplier encode at the factory.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CSV IN · ENCODED TAGS OUT · EVERY WRITE LOGGED</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">The batch loop: hear beep, swap tag, repeat</text>

<rect x="64" y="170" width="180" height="230" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="64" y="170" width="180" height="34" rx="12" fill="#3d6b6b"/>
<rect x="64" y="190" width="180" height="14" fill="#3d6b6b"/>
