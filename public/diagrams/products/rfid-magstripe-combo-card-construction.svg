<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID + magstripe combo card — lamination stack and the two independent rails</title>
<desc id="d">Two panels. Left, the lamination stack exploded: a printed front overlay on top; a PVC core carrying the embedded antenna coil and chip module in the middle; a back overlay at the bottom with the high-coercivity magnetic stripe on its outer face and a signature panel. A bracket marks 0.76 to 0.84 millimetres assembled thickness, and the footprint is 85.60 by 53.98 millimetres, ISO/IEC 7810 ID-1, the CR80 geometry. A green note says to keep the stripe read surface unlaminated — no spot UV, foil, or overlaminate across the band. Right, the two rails compared: the RFID rail couples inductively with a wall reader at 13.56 megahertz, contactless and powered by the reader field; the magnetic rail stores flux reversals that a swipe head reads by contact. Bottom takeaway: different physics, no cross-coupling in normal use. Footer: one body, both rails always active — chip options from MIFARE Classic 1K to DESFire EV3 to HID iCLASS SE.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID + MAGSTRIPE COMBO CARD</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Two credentials, one lamination stack</text>

