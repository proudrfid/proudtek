<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID product classes ranked by distributor gross margin</title>
<desc id="d">A horizontal bar chart of five RFID product classes ranked by gross margin. Standard UHF labels carry 25-35%, RFID readers and hardware 25-40%, custom-printed cards 30-45%, specialty wristbands 40-55%, and custom OEM programs 35-60%. Bars lengthen and shift from tan toward green as margin rises, and a tick on each bar marks the low end of its range. The takeaway is that margin tracks how hard the product is to copy, not how many units move.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MARGIN BY PRODUCT CLASS</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">From commodity floor to custom ceiling</text>
<text x="600" y="134" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Five product classes, ranked by the gross margin they realistically carry.</text>

<!-- gridlines -->
<line x1="380" y1="168" x2="380" y2="500" stroke="#efe9db" stroke-width="1.4"/>
<line x1="591" y1="168" x2="591" y2="500" stroke="#efe9db" stroke-width="1.4"/>
<line x1="803" y1="168" x2="803" y2="500" stroke="#efe9db" stroke-width="1.4"/>
<line x1="1014" y1="168" x2="1014" y2="500" stroke="#efe9db" stroke-width="1.4"/>
<text x="380" y="520" text-anchor="middle" font-size="12" fill="#9a9a9a">0%</text>
<text x="591" y="520" text-anchor="middle" font-size="12" fill="#9a9a9a">20%</text>
<text x="803" y="520" text-anchor="middle" font-size="12" fill="#9a9a9a">40%</text>
<text x="1014" y="520" text-anchor="middle" font-size="12" fill="#9a9a9a">60%</text>

<!-- Row 1: Standard UHF labels 25-35% -->
<text x="72" y="203" font-size="14.5" fill="#291c0e">Standard UHF labels</text>
<rect x="380" y="178" width="370" height="40" rx="6" fill="#d6cbb3" stroke="#a08a5f" stroke-width="1.4"/>
<line x1="644" y1="180" x2="644" y2="216" stroke="#8a6d3b" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="762" y="203" font-size="14.5" font-weight="700" fill="#6d5a3a">25-35%</text>

<!-- Row 2: RFID readers 25-40% -->
<text x="72" y="271" font-size="14.5" fill="#291c0e">RFID readers / hardware</text>
<rect x="380" y="246" width="423" height="40" rx="6" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.4"/>
<line x1="644" y1="248" x2="644" y2="284" stroke="#5a4a2c" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="815" y="271" font-size="14.5" font-weight="700" fill="#6d5a3a">25-40%</text>

<!-- Row 3: Custom-printed cards 30-45% -->
<text x="72" y="339" font-size="14.5" fill="#291c0e">Custom-printed cards</text>
<rect x="380" y="314" width="476" height="40" rx="6" fill="#9dbfa9" stroke="#3d6b6b" stroke-width="1.4"/>
<line x1="697" y1="316" x2="697" y2="352" stroke="#2c5454" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="868" y="339" font-size="14.5" font-weight="700" fill="#2c5454">30-45%</text>

<!-- Row 4: Specialty wristbands 40-55% -->
<text x="72" y="407" font-size="14.5" fill="#291c0e">Specialty wristbands</text>
<rect x="380" y="382" width="581" height="40" rx="6" fill="#5f9b83" stroke="#2d6a4f" stroke-width="1.4"/>
<line x1="803" y1="384" x2="803" y2="420" stroke="#1b4332" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="973" y="407" font-size="14.5" font-weight="700" fill="#1b4332">40-55%</text>

<!-- Row 5: Custom OEM programs 35-60% -->
<text x="72" y="475" font-size="14.5" fill="#291c0e">Custom OEM programs</text>
<rect x="380" y="450" width="634" height="40" rx="6" fill="#2d6a4f" stroke="#1b4332" stroke-width="1.4"/>
<line x1="750" y1="452" x2="750" y2="488" stroke="#eaf2ec" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="1026" y="475" font-size="14.5" font-weight="700" fill="#1b4332">35-60%</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Margin tracks how hard the product is to copy — not how many units move. The tick marks each range's floor.</text>
</svg>
