<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">The one-way slider — multi-day anti-transfer in one part</title>
  <desc id="d">The wearer threads the woven band through an aluminium or plastic sliding lock that only travels one direction — tightening is easy, loosening requires cutting the band. Aluminium variant takes embossed logos; sequential numbering and security print ride the band.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Slides on, never slides back</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">The one-way lock is the entire multi-day security model — and it works</text>
  <g transform="translate(70,160)" font-family="Helvetica, Arial, sans-serif">
    <path d="M 40 100 C 200 40 420 40 580 100" fill="none" stroke="#3d6b6b" stroke-width="16" stroke-linecap="round"/>
    <path d="M 40 140 C 200 200 420 200 580 140" fill="none" stroke="#3d6b6b" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
    <rect x="280" y="88" width="70" height="66" rx="10" fill="#c39a5f" stroke="#6d5a3a" stroke-width="2.5"/>
    <text x="288" y="180" font-size="13" fill="#6d5a3a">one-way slider</text>
    <path d="M 385 118 L 445 118" stroke="#2c5454" stroke-width="3" marker-end="url(#a9)"/>
    <text x="392" y="106" font-size="12" fill="#2c5454">tighten</text>
    <path d="M 262 132 L 218 132" stroke="#8b2d2d" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="160" y="120" font-size="12" fill="#8b2d2d">loosen: no</text>
    <defs><marker id="a9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c5454"/></marker></defs>
  </g>
  <g transform="translate(720,150)">
    <rect x="0" y="0" width="410" height="300" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="17" fill="#291c0e">Lock + band options</text>
    <text x="24" y="78" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Aluminium slider — premium, takes an</text>
    <text x="24" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">embossed / debossed logo</text>
    <text x="24" y="134" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Plastic slider — the volume default</text>
    <line x1="24" y1="162" x2="386" y2="162" stroke="#d8cdb8" stroke-width="1.5"/>
    <text x="24" y="194" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Woven polyester 15-16 mm soft-touch —</text>
    <text x="24" y="216" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">breathable across 3-7 festival days</text>
    <text x="24" y="248" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Sequential numbering + security print</text>
    <text x="24" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">alongside the NFC chip</text>
  </g>
</svg>
