<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five procurement inputs that decide the RFID wristband material</title>
<desc id="d">Five event requirements mapped to a recommended material for each condition. Event duration: 24 hours or less favours Tyvek, 2 to 5 days favours fabric, recurring use favours silicone. Water exposure: pool or waterpark needs silicone rated IP67 or better, rain risk suits quick-dry fabric, indoor dry allows any material. Skin sensitivity: fabric is the safest hypoallergenic default, keep medical silicone as a reaction backup, and Tyvek adhesive can irritate after 12 to 24 hours. Branding: photo-quality needs fabric sublimation, a simple logo suits Tyvek or PVC, debossed-only suits silicone. MOQ and lead time: a rush of 5 to 10 days favours Tyvek, fabric runs 10 to 20 days, silicone 15 to 25 days.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE INPUTS THAT PICK THE MATERIAL</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">Walk each event's requirements through these, in order.</text>

<text x="64" y="126" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a8a8a">REQUIREMENT</text>
<text x="344" y="126" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a8a8a">BEST MATERIAL BY CONDITION</text>

<!-- Row 1 duration (top 138) -->
<text x="64" y="180" font-size="15.5" font-weight="700" fill="#291c0e">Event duration</text>
<rect x="344" y="148" width="250" height="54" rx="10" fill="#fbf4e6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="360" y="172" font-size="12" fill="#5c5c5c">24 hours or less</text>
<text x="360" y="192" font-size="14" font-weight="800" fill="#a07d43">Tyvek</text>
<rect x="610" y="148" width="250" height="54" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="626" y="172" font-size="12" fill="#5c5c5c">2-5 days</text>
<text x="626" y="192" font-size="14" font-weight="800" fill="#2c5454">Woven fabric</text>
<rect x="876" y="148" width="250" height="54" rx="10" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.4"/>
<text x="892" y="172" font-size="12" fill="#5c5c5c">recurring / season</text>
<text x="892" y="192" font-size="14" font-weight="800" fill="#4a5568">Silicone</text>

<!-- Row 2 water (top 216) -->
<text x="64" y="258" font-size="15.5" font-weight="700" fill="#291c0e">Water exposure</text>
<rect x="344" y="226" width="250" height="54" rx="10" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.4"/>
<text x="360" y="250" font-size="12" fill="#5c5c5c">pool / waterpark</text>
<text x="360" y="270" font-size="14" font-weight="800" fill="#4a5568">Silicone IP67+</text>
<rect x="610" y="226" width="250" height="54" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="626" y="250" font-size="12" fill="#5c5c5c">outdoor rain risk</text>
<text x="626" y="270" font-size="14" font-weight="800" fill="#2c5454">Fabric (quick-dry)</text>
<rect x="876" y="226" width="250" height="54" rx="10" fill="#f4f2ec" stroke="#e0d9c9" stroke-width="1.4"/>
<text x="892" y="250" font-size="12" fill="#5c5c5c">indoor, dry only</text>
<text x="892" y="270" font-size="14" font-weight="800" fill="#6a6a6a">any material</text>

<!-- Row 3 skin (top 294) -->
<text x="64" y="336" font-size="15.5" font-weight="700" fill="#291c0e">Skin sensitivity</text>
<rect x="344" y="304" width="250" height="54" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="360" y="328" font-size="12" fill="#5c5c5c">hypoallergenic default</text>
<text x="360" y="348" font-size="14" font-weight="800" fill="#2c5454">Woven fabric</text>
<rect x="610" y="304" width="250" height="54" rx="10" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.4"/>
<text x="626" y="328" font-size="12" fill="#5c5c5c">reaction backup stock</text>
<text x="626" y="348" font-size="14" font-weight="800" fill="#4a5568">Medical silicone</text>
<rect x="876" y="304" width="250" height="54" rx="10" fill="#fbf4e6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="892" y="328" font-size="12" fill="#5c5c5c">adhesive 12-24h</text>
<text x="892" y="348" font-size="14" font-weight="800" fill="#a07d43">Tyvek can irritate</text>

<!-- Row 4 branding (top 372) -->
<text x="64" y="414" font-size="15.5" font-weight="700" fill="#291c0e">Branding need</text>
<rect x="344" y="382" width="250" height="54" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="360" y="406" font-size="12" fill="#5c5c5c">photo-quality artwork</text>
<text x="360" y="426" font-size="14" font-weight="800" fill="#2c5454">Fabric sublimation</text>
<rect x="610" y="382" width="250" height="54" rx="10" fill="#fbf4e6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="626" y="406" font-size="12" fill="#5c5c5c">logo + 1-2 colors</text>
<text x="626" y="426" font-size="14" font-weight="800" fill="#a07d43">Tyvek / PVC</text>
<rect x="876" y="382" width="250" height="54" rx="10" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.4"/>
<text x="892" y="406" font-size="12" fill="#5c5c5c">debossed / embossed</text>
<text x="892" y="426" font-size="14" font-weight="800" fill="#4a5568">Silicone</text>

<!-- Row 5 lead time (top 450) -->
<text x="64" y="492" font-size="15.5" font-weight="700" fill="#291c0e">MOQ / lead time</text>
<rect x="344" y="460" width="250" height="54" rx="10" fill="#fbf4e6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="360" y="484" font-size="12" fill="#5c5c5c">rush, MOQ from 100</text>
<text x="360" y="504" font-size="14" font-weight="800" fill="#a07d43">Tyvek 5-10 days</text>
<rect x="610" y="460" width="250" height="54" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="626" y="484" font-size="12" fill="#5c5c5c">MOQ ~500</text>
<text x="626" y="504" font-size="14" font-weight="800" fill="#2c5454">Fabric 10-20 days</text>
<rect x="876" y="460" width="250" height="54" rx="10" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.4"/>
<text x="892" y="484" font-size="12" fill="#5c5c5c">MOQ 500-1000</text>
<text x="892" y="504" font-size="14" font-weight="800" fill="#4a5568">Silicone 15-25 days</text>

<text x="600" y="556" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Duration is the biggest lever; the rest fine-tune. Over-spec'ing a single-day event just burns budget.</text>
</svg>
