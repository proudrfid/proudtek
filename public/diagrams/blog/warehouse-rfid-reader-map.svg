<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Where each RFID reader type lives on the warehouse floor</title>
<desc id="d">A schematic warehouse plan with a yard strip on the left and the building on the right. Five numbered reader placements are marked: dock door for receiving and shipping, conveyor line for sortation, pick zone for pick verification and cycle counts, yard gate for trailer identification, and an overhead ceiling area for zone-level location. A legend on the right maps each number to its reader type and primary workflow.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">READER PLACEMENT ON THE FLOOR</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="33" font-weight="700" fill="#291c0e">Where each reader lives in the building</text>
<text x="600" y="134" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Five reader types, five jobs — the table below carries the antenna counts.</text>

<!-- YARD strip -->
<rect x="64" y="196" width="104" height="360" rx="10" fill="#eef1ec" stroke="#b7c0b0" stroke-width="1.6"/>
<text x="116" y="224" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.4" fill="#4a5568">YARD</text>
<rect x="158" y="352" width="12" height="48" fill="#4a5568"/>
<circle cx="116" cy="384" r="15" fill="#4a5568" stroke="#ffffff" stroke-width="2"/>
<text x="116" y="389" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>

<!-- BUILDING -->
<rect x="176" y="196" width="628" height="360" rx="10" fill="#f4f6f8" stroke="#4a5568" stroke-width="2"/>
<text x="196" y="226" font-size="12.5" font-weight="800" letter-spacing="0.3" fill="#5c5c5c">RECEIVING / SHIPPING</text>
<!-- dock doors on left edge -->
<rect x="176" y="250" width="10" height="52" fill="#4a5568"/>
<rect x="176" y="330" width="10" height="52" fill="#4a5568"/>
<rect x="176" y="410" width="10" height="52" fill="#4a5568"/>
<circle cx="214" cy="276" r="15" fill="#4a5568" stroke="#ffffff" stroke-width="2"/>
<text x="214" y="281" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>

<!-- conveyor line -->
<rect x="300" y="300" width="320" height="26" rx="13" fill="#dfe4ea" stroke="#b3bcc7" stroke-width="1.5"/>
<line x1="330" y1="300" x2="330" y2="326" stroke="#b3bcc7" stroke-width="1.3"/>
<line x1="370" y1="300" x2="370" y2="326" stroke="#b3bcc7" stroke-width="1.3"/>
<line x1="410" y1="300" x2="410" y2="326" stroke="#b3bcc7" stroke-width="1.3"/>
<line x1="450" y1="300" x2="450" y2="326" stroke="#b3bcc7" stroke-width="1.3"/>
<line x1="490" y1="300" x2="490" y2="326" stroke="#b3bcc7" stroke-width="1.3"/>
<line x1="530" y1="300" x2="530" y2="326" stroke="#b3bcc7" stroke-width="1.3"/>
<line x1="570" y1="300" x2="570" y2="326" stroke="#b3bcc7" stroke-width="1.3"/>
<text x="370" y="290" font-size="12.5" font-weight="700" fill="#5c5c5c">CONVEYOR LINE</text>
<circle cx="600" cy="313" r="15" fill="#4a5568" stroke="#ffffff" stroke-width="2"/>
<text x="600" y="318" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>

<!-- pick zone shelves -->
<text x="300" y="404" font-size="12.5" font-weight="700" fill="#5c5c5c">PICK ZONE</text>
<rect x="300" y="416" width="150" height="14" rx="3" fill="#cdd4dd"/>
<rect x="300" y="440" width="150" height="14" rx="3" fill="#cdd4dd"/>
<rect x="300" y="464" width="150" height="14" rx="3" fill="#cdd4dd"/>
<circle cx="486" cy="450" r="15" fill="#4a5568" stroke="#ffffff" stroke-width="2"/>
<text x="486" y="455" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>

<!-- overhead area -->
<rect x="628" y="360" width="150" height="150" rx="8" fill="#eef1f4" stroke="#4a5568" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="703" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#5c5c5c">OVERHEAD AREA</text>
<line x1="668" y1="392" x2="668" y2="420" stroke="#4a5568" stroke-width="1.6"/><polygon points="664,414 668,422 672,414" fill="#4a5568"/>
<line x1="738" y1="392" x2="738" y2="420" stroke="#4a5568" stroke-width="1.6"/><polygon points="734,414 738,422 742,414" fill="#4a5568"/>
<circle cx="703" cy="450" r="15" fill="#4a5568" stroke="#ffffff" stroke-width="2"/>
<text x="703" y="455" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">5</text>

<!-- LEGEND -->
<rect x="832" y="196" width="304" height="360" rx="14" fill="#fbf8f1" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="984" y="228" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">READER TYPES</text>
<circle cx="862" cy="272" r="13" fill="#4a5568"/><text x="862" y="277" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text>
<text x="886" y="268" font-size="13.5" font-weight="700" fill="#291c0e">Dock door</text>
<text x="886" y="286" font-size="12" fill="#5c5c5c">receiving &amp; shipping verify</text>
<circle cx="862" cy="328" r="13" fill="#4a5568"/><text x="862" y="333" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text>
<text x="886" y="324" font-size="13.5" font-weight="700" fill="#291c0e">Conveyor line</text>
<text x="886" y="342" font-size="12" fill="#5c5c5c">sortation, merge &amp; divert</text>
<circle cx="862" cy="384" r="13" fill="#4a5568"/><text x="862" y="389" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text>
<text x="886" y="380" font-size="13.5" font-weight="700" fill="#291c0e">Pick zone</text>
<text x="886" y="398" font-size="12" fill="#5c5c5c">pick verify, cycle counts</text>
<circle cx="862" cy="440" r="13" fill="#4a5568"/><text x="862" y="445" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text>
<text x="886" y="436" font-size="13.5" font-weight="700" fill="#291c0e">Yard gate</text>
<text x="886" y="454" font-size="12" fill="#5c5c5c">trailer ID, gate access</text>
<circle cx="862" cy="496" r="13" fill="#4a5568"/><text x="862" y="501" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">5</text>
<text x="886" y="492" font-size="13.5" font-weight="700" fill="#291c0e">Overhead area</text>
<text x="886" y="510" font-size="12" fill="#5c5c5c">zone location, WIP tracking</text>

<text x="600" y="592" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Put the wrong reader in a spot and you've installed an expensive motion detector.</text>
</svg>
