<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five wood species for NFC cards compared</title>
<desc id="d">Five wood species shown as swatches. Bamboo is light tan, very hard, rapidly renewable on a 3 to 5 year harvest, best for high-volume budget programs. Cherry is warm reddish-brown, medium hardness, FSC-certified sources, best for luxury and executive cards. Walnut is dark brown with pronounced grain, medium-hard, FSC-certified sources, best for premium corporate branding. Maple is pale cream, hard, widely available and FSC-certified, best for light designs and high-contrast engraving. Beech is light pink-tan, hard, from European FSC sources, best for a clean minimalist aesthetic.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CHOOSING A WOOD SPECIES</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Grain, hardness and certification vary — match the species to the program.</text>

<!-- Bamboo -->
<rect x="64" y="118" width="200" height="452" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="74" y="130" width="180" height="92" rx="8" fill="#d9c08a"/>
<path d="M 84 156 q 90 -8 160 0" fill="none" stroke="#c0a56e" stroke-width="2"/>
<path d="M 84 190 q 90 8 160 0" fill="none" stroke="#c0a56e" stroke-width="2"/>
<text x="80" y="256" font-size="16" font-weight="800" fill="#291c0e">Bamboo</text>
<rect x="80" y="268" width="128" height="26" rx="13" fill="#e9f2ec" stroke="#94bfa5" stroke-width="1.3"/>
<text x="144" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#1b4332">Very hard</text>
<text x="80" y="330" font-size="12" font-weight="800" fill="#2d6a4f">SUSTAINABILITY</text>
<text x="80" y="350" font-size="12.5" fill="#3a2f20">Rapidly renewable</text>
<text x="80" y="368" font-size="12.5" fill="#3a2f20">3–5 yr harvest</text>
<text x="80" y="420" font-size="12" font-weight="800" fill="#8a6a2f">BEST FOR</text>
<text x="80" y="440" font-size="12.5" fill="#3a2f20">High-volume,</text>
<text x="80" y="458" font-size="12.5" fill="#3a2f20">budget-friendly</text>

<!-- Cherry -->
<rect x="282" y="118" width="200" height="452" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="292" y="130" width="180" height="92" rx="8" fill="#b0693e"/>
<path d="M 302 156 q 90 -8 160 0" fill="none" stroke="#8f5330" stroke-width="2"/>
<path d="M 302 190 q 90 8 160 0" fill="none" stroke="#8f5330" stroke-width="2"/>
<text x="298" y="256" font-size="16" font-weight="800" fill="#291c0e">Cherry</text>
<rect x="298" y="268" width="100" height="26" rx="13" fill="#eef0f4" stroke="#a7afbb" stroke-width="1.3"/>
<text x="348" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4454">Medium</text>
<text x="298" y="330" font-size="12" font-weight="800" fill="#2d6a4f">SUSTAINABILITY</text>
<text x="298" y="350" font-size="12.5" fill="#3a2f20">FSC-certified</text>
<text x="298" y="368" font-size="12.5" fill="#3a2f20">sources available</text>
<text x="298" y="420" font-size="12" font-weight="800" fill="#8a6a2f">BEST FOR</text>
<text x="298" y="440" font-size="12.5" fill="#3a2f20">Luxury &amp;</text>
<text x="298" y="458" font-size="12.5" fill="#3a2f20">executive cards</text>

<!-- Walnut -->
<rect x="500" y="118" width="200" height="452" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="510" y="130" width="180" height="92" rx="8" fill="#6b4a2c"/>
<path d="M 520 156 q 90 -8 160 0" fill="none" stroke="#523620" stroke-width="2"/>
<path d="M 520 190 q 90 8 160 0" fill="none" stroke="#523620" stroke-width="2"/>
<text x="516" y="256" font-size="16" font-weight="800" fill="#291c0e">Walnut</text>
<rect x="516" y="268" width="130" height="26" rx="13" fill="#eef0f4" stroke="#a7afbb" stroke-width="1.3"/>
<text x="581" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4454">Medium-hard</text>
<text x="516" y="330" font-size="12" font-weight="800" fill="#2d6a4f">SUSTAINABILITY</text>
<text x="516" y="350" font-size="12.5" fill="#3a2f20">FSC-certified</text>
<text x="516" y="368" font-size="12.5" fill="#3a2f20">sources available</text>
<text x="516" y="420" font-size="12" font-weight="800" fill="#8a6a2f">BEST FOR</text>
<text x="516" y="440" font-size="12.5" fill="#3a2f20">Premium</text>
<text x="516" y="458" font-size="12.5" fill="#3a2f20">corporate branding</text>

<!-- Maple -->
<rect x="718" y="118" width="200" height="452" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="728" y="130" width="180" height="92" rx="8" fill="#e6d4a6"/>
<path d="M 738 156 q 90 -8 160 0" fill="none" stroke="#d2bd85" stroke-width="2"/>
<path d="M 738 190 q 90 8 160 0" fill="none" stroke="#d2bd85" stroke-width="2"/>
<text x="734" y="256" font-size="16" font-weight="800" fill="#291c0e">Maple</text>
<rect x="734" y="268" width="80" height="26" rx="13" fill="#e9f2ec" stroke="#94bfa5" stroke-width="1.3"/>
<text x="774" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#1b4332">Hard</text>
<text x="734" y="330" font-size="12" font-weight="800" fill="#2d6a4f">SUSTAINABILITY</text>
<text x="734" y="350" font-size="12.5" fill="#3a2f20">Widely available,</text>
<text x="734" y="368" font-size="12.5" fill="#3a2f20">FSC-certified</text>
<text x="734" y="420" font-size="12" font-weight="800" fill="#8a6a2f">BEST FOR</text>
<text x="734" y="440" font-size="12.5" fill="#3a2f20">Light designs,</text>
<text x="734" y="458" font-size="12.5" fill="#3a2f20">high-contrast</text>

<!-- Beech -->
<rect x="936" y="118" width="200" height="452" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="946" y="130" width="180" height="92" rx="8" fill="#d6b489"/>
<path d="M 956 156 q 90 -8 160 0" fill="none" stroke="#c19d72" stroke-width="2"/>
<path d="M 956 190 q 90 8 160 0" fill="none" stroke="#c19d72" stroke-width="2"/>
<text x="952" y="256" font-size="16" font-weight="800" fill="#291c0e">Beech</text>
<rect x="952" y="268" width="80" height="26" rx="13" fill="#e9f2ec" stroke="#94bfa5" stroke-width="1.3"/>
<text x="992" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#1b4332">Hard</text>
<text x="952" y="330" font-size="12" font-weight="800" fill="#2d6a4f">SUSTAINABILITY</text>
<text x="952" y="350" font-size="12.5" fill="#3a2f20">European FSC</text>
<text x="952" y="368" font-size="12.5" fill="#3a2f20">sources</text>
<text x="952" y="420" font-size="12" font-weight="800" fill="#8a6a2f">BEST FOR</text>
<text x="952" y="440" font-size="12.5" fill="#3a2f20">Clean, minimalist</text>
<text x="952" y="458" font-size="12.5" fill="#3a2f20">aesthetic</text>

<text x="600" y="602" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Most cards use a 0.3–0.6 mm veneer over a core — so any species above holds ISO CR80 thickness.</text>
</svg>
