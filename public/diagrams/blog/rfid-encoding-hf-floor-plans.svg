<!-- RIGHT: NTAG -->
<rect x="606" y="124" width="530" height="472" rx="16" fill="#faf6ec" stroke="#e3d8c4" stroke-width="1.5"/>
<text x="634" y="164" font-size="20" font-weight="800" fill="#291c0e">NTAG 213 / 215 / 216</text>
<text x="634" y="190" font-size="13.5" fill="#4f4f4f">page-based · 4 bytes per page</text>

<rect x="634" y="212" width="474" height="52" rx="8" fill="#4a5568"/>
<text x="652" y="234" font-size="13.5" font-weight="800" fill="#ffffff">Pages 0–1 — UID</text>
<text x="652" y="252" font-size="12.5" fill="#d3dae3">the tag's serial, burned in at the factory</text>

<rect x="634" y="272" width="474" height="52" rx="8" fill="#6d5a3a"/>
<text x="652" y="294" font-size="13.5" font-weight="800" fill="#ffffff">Page 2 — lock bits + capability container</text>
<text x="652" y="312" font-size="12.5" fill="#e8ddca">the CC: the tag declaring its own house rules</text>

<rect x="634" y="332" width="474" height="120" rx="8" fill="#3d6b6b"/>
<text x="652" y="358" font-size="14" font-weight="800" fill="#ffffff">Pages 3 … N — your data</text>
<text x="652" y="378" font-size="12.5" fill="#cfe0e0">the whole point of the tag</text>
<rect x="652" y="394" width="380" height="12" rx="6" fill="#5b8888"/>
<rect x="652" y="416" width="300" height="12" rx="6" fill="#6f9797"/>

<rect x="634" y="460" width="474" height="52" rx="8" fill="#c39a5f"/>
<text x="652" y="482" font-size="13.5" font-weight="800" fill="#291c0e">Last 5 pages — the back office</text>
<text x="652" y="500" font-size="12.5" fill="#52401f">dynamic lock bits · mirror config · auth · 32-bit password</text>

<text x="634" y="544" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">USER MEMORY BY MODEL</text>
<rect x="634" y="554" width="140" height="28" rx="14" fill="#ffffff" stroke="#e3d8c4"/>
<text x="704" y="573" text-anchor="middle" font-size="13" font-weight="700" fill="#291c0e">213 · 144 B</text>
<rect x="786" y="554" width="140" height="28" rx="14" fill="#ffffff" stroke="#e3d8c4"/>
<text x="856" y="573" text-anchor="middle" font-size="13" font-weight="700" fill="#291c0e">215 · 504 B</text>
<rect x="938" y="554" width="140" height="28" rx="14" fill="#ffffff" stroke="#e3d8c4"/>
<text x="1008" y="573" text-anchor="middle" font-size="13" font-weight="700" fill="#291c0e">216 · 888 B</text>

<text x="600" y="632" text-anchor="middle" font-size="14" fill="#4f4f4f">Mind the red drawer: writing the trailer wrong locks the sector — there is no undo.</text>
</svg>
