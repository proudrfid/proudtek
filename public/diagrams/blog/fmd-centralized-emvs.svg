<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="s1Title s1Desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="s1Title">EU FMD — the centralized model</title>
  <desc id="s1Desc">A left-to-right pipeline: the manufacturer serializes and registers each pack, the EMVO European Hub holds the central registry, national NMVS systems mirror it per member state, and the pharmacy scans before dispensing. The FMD signature is a single verify-and-decommission scan at the point of dispensing. Every pack carries a 2D DataMatrix (GTIN, serial, batch, expiry, plus a national reimbursement number where required) and a tamper-evident seal; a suspect scan triggers a joint investigation by the National Competent Authority and the marketing authorization holder.</desc>
  <defs>
    <radialGradient id="s1Bg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <marker id="s1Gold" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c39a5f"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#s1Bg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="2" fill="#6d5a3a">EU FMD — THE CENTRALIZED MODEL</text>
  <text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Register centrally · verify and decommission at the pharmacy</text>

  <!-- pipeline -->
  <g>
    <rect x="56" y="112" width="248" height="118" rx="14" fill="#f2f7f7" stroke="#b8d4d4" stroke-width="2"/>
    <circle cx="84" cy="142" r="16" fill="#3d6b6b"/><text x="84" y="148" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
    <text x="112" y="148" font-size="16" font-weight="800" fill="#1f3b3b">Manufacturer</text>
    <text x="76" y="180" font-size="13.5" fill="#4f4f4f">Serialize + register</text>
    <text x="76" y="199" font-size="13.5" fill="#4f4f4f">every pack</text>

    <rect x="336" y="112" width="248" height="118" rx="14" fill="#f2f7f7" stroke="#b8d4d4" stroke-width="2"/>
    <circle cx="364" cy="142" r="16" fill="#3d6b6b"/><text x="364" y="148" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
    <text x="392" y="148" font-size="16" font-weight="800" fill="#1f3b3b">EMVO Hub</text>
    <text x="356" y="180" font-size="13.5" fill="#4f4f4f">Central registry</text>
    <text x="356" y="199" font-size="13.5" fill="#4f4f4f">for all EU packs</text>

    <rect x="616" y="112" width="248" height="118" rx="14" fill="#f2f7f7" stroke="#b8d4d4" stroke-width="2"/>
    <circle cx="644" cy="142" r="16" fill="#3d6b6b"/><text x="644" y="148" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
    <text x="672" y="148" font-size="16" font-weight="800" fill="#1f3b3b">National NMVS</text>
    <text x="636" y="180" font-size="13.5" fill="#4f4f4f">One per member</text>
    <text x="636" y="199" font-size="13.5" fill="#4f4f4f">state (30+)</text>

    <rect x="896" y="112" width="248" height="118" rx="14" fill="#e3efef" stroke="#3d6b6b" stroke-width="2"/>
    <circle cx="924" cy="142" r="16" fill="#3d6b6b"/><text x="924" y="148" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4</text>
    <text x="952" y="148" font-size="16" font-weight="800" fill="#1f3b3b">Pharmacy</text>
    <text x="916" y="180" font-size="13.5" fill="#2c5454">Scan before</text>
    <text x="916" y="199" font-size="13.5" fill="#2c5454">dispensing</text>
  </g>
  <path d="M306 171 L332 171" fill="none" stroke="#c39a5f" stroke-width="2.4" marker-end="url(#s1Gold)"/>
  <path d="M586 171 L612 171" fill="none" stroke="#c39a5f" stroke-width="2.4" marker-end="url(#s1Gold)"/>
  <path d="M866 171 L892 171" fill="none" stroke="#c39a5f" stroke-width="2.4" marker-end="url(#s1Gold)"/>
  <path d="M1020 230 L1020 259" fill="none" stroke="#c39a5f" stroke-width="2.4" marker-end="url(#s1Gold)"/>

  <!-- signature band -->
  <rect x="56" y="262" width="1088" height="64" rx="12" fill="#3d6b6b"/>
  <text x="600" y="291" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">The FMD signature: a single verify-and-decommission scan</text>
  <text x="600" y="313" text-anchor="middle" font-size="14" fill="#cfe4e4">performed at the point of dispensing</text>

  <!-- bottom left: on every pack -->
  <rect x="56" y="352" width="532" height="252" rx="14" fill="#f2f7f7" stroke="#b8d4d4" stroke-width="2"/>
  <text x="84" y="388" font-size="16" font-weight="800" fill="#1f3b3b">On every prescription pack</text>
  <line x1="84" y1="401" x2="560" y2="401" stroke="#b8d4d4" stroke-width="1.5"/>
  <rect x="84" y="416" width="42" height="42" rx="6" fill="#ffffff" stroke="#291c0e" stroke-width="1.5"/>
  <g fill="#291c0e"><rect x="90" y="422" width="7" height="7"/><rect x="104" y="422" width="7" height="7"/><rect x="97" y="429" width="7" height="7"/><rect x="111" y="429" width="7" height="7"/><rect x="90" y="436" width="7" height="7"/><rect x="111" y="443" width="7" height="7"/><rect x="97" y="443" width="7" height="7"/></g>
  <text x="140" y="432" font-size="14.5" font-weight="800" fill="#291c0e">2D DataMatrix</text>
  <text x="140" y="452" font-size="13" fill="#4f4f4f">GTIN · serial · batch · expiry</text>
  <text x="140" y="470" font-size="12.5" fill="#6d5a3a">(+ national reimbursement no. where required)</text>
  <circle cx="105" cy="524" r="21" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/><path d="M96 524 l7 7 l12 -14" fill="none" stroke="#c39a5f" stroke-width="2.4"/>
  <text x="140" y="516" font-size="14.5" font-weight="800" fill="#291c0e">Tamper-evident seal</text>
  <text x="140" y="536" font-size="13" fill="#4f4f4f">visibly fails once the pack is opened</text>
  <text x="140" y="562" font-size="12.5" fill="#6d5a3a">RFID NTAG 424 DNA can serve as the electronic equivalent</text>

  <!-- bottom right: investigation flow -->
  <rect x="612" y="352" width="532" height="252" rx="14" fill="#faf6ef" stroke="#e4c98f" stroke-width="2"/>
  <text x="640" y="388" font-size="16" font-weight="800" fill="#6d5a3a">When a scan looks wrong</text>
  <line x1="640" y1="401" x2="1116" y2="401" stroke="#e4c98f" stroke-width="1.5"/>
  <rect x="640" y="416" width="476" height="42" rx="8" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="878" y="442" text-anchor="middle" font-size="14" fill="#291c0e">Suspect event flagged at verification</text>
  <path d="M878 458 L878 472" fill="none" stroke="#c39a5f" stroke-width="2.2" marker-end="url(#s1Gold)"/>
  <rect x="640" y="474" width="230" height="56" rx="8" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="755" y="498" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">National Competent</text>
  <text x="755" y="516" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Authority (NCA)</text>
  <rect x="886" y="474" width="230" height="56" rx="8" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="1001" y="498" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Marketing Auth.</text>
  <text x="1001" y="516" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Holder (MAH)</text>
  <path d="M755 530 L755 544" fill="none" stroke="#c39a5f" stroke-width="2.2"/>
  <path d="M1001 530 L1001 544" fill="none" stroke="#c39a5f" stroke-width="2.2"/>
  <rect x="640" y="546" width="476" height="44" rx="8" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="878" y="573" text-anchor="middle" font-size="14" font-weight="800" fill="#6d5a3a">Joint investigation</text>

  <text x="600" y="636" text-anchor="middle" font-size="14.5" fill="#6d5a3a">One central hub, one scan that matters — Europe's centralized verification model.</text>
</svg>
