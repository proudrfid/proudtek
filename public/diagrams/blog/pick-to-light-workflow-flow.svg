<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five-step pick-to-light loop, from WMS pick list to confirmed pick</title>
<desc id="d">Five numbered stages run left to right. One: the WMS sends the next pick. Two: middleware translates the item into a tag EPC plus an LED-activation command. Three: the zone reader activates the LED on the target, which flashes. Four: the operator sees the flash and picks the item. Five: the operator confirms on a handheld, the LED switches off. A curved return arrow runs from stage five back to stage two, advancing to the next item, so the loop repeats.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PICK-TO-LIGHT, ONE LOOP</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">The WMS turns a pick list into a blinking light, then back into a confirmed pick.</text>

<!-- connecting arrows (drawn first, under nodes) -->
<line x1="200" y1="300" x2="325" y2="300" stroke="#291c0e" stroke-width="3"/>
<polygon points="325,293 343,300 325,307" fill="#291c0e"/>
<line x1="425" y1="300" x2="550" y2="300" stroke="#291c0e" stroke-width="3"/>
<polygon points="550,293 568,300 550,307" fill="#291c0e"/>
<line x1="650" y1="300" x2="775" y2="300" stroke="#291c0e" stroke-width="3"/>
<polygon points="775,293 793,300 775,307" fill="#291c0e"/>
<line x1="900" y1="300" x2="1025" y2="300" stroke="#291c0e" stroke-width="3"/>
<polygon points="1025,293 1043,300 1025,307" fill="#291c0e"/>

<!-- node 1 WMS -->
<circle cx="150" cy="300" r="50" fill="#eef5f5" stroke="#3d6b6b" stroke-width="3"/>
<text x="150" y="294" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">1</text>
<text x="150" y="314" text-anchor="middle" font-size="14" font-weight="800" fill="#2c5454">WMS</text>
<text x="150" y="384" text-anchor="middle" font-size="13.5" fill="#5c5c5c">sends the</text>
<text x="150" y="403" text-anchor="middle" font-size="13.5" fill="#5c5c5c">next pick</text>

<!-- node 2 MIDDLEWARE -->
<circle cx="375" cy="300" r="50" fill="#eef5f5" stroke="#3d6b6b" stroke-width="3"/>
<text x="375" y="294" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">2</text>
<text x="375" y="314" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">MIDDLEWARE</text>
<text x="375" y="384" text-anchor="middle" font-size="13.5" fill="#5c5c5c">item → EPC +</text>
<text x="375" y="403" text-anchor="middle" font-size="13.5" fill="#5c5c5c">LED command</text>

<!-- node 3 ZONE READER (the light moment) -->
<circle cx="600" cy="300" r="50" fill="#fff3d6" stroke="#c39a5f" stroke-width="3.4"/>
<text x="600" y="294" text-anchor="middle" font-size="13" font-weight="800" fill="#6d5a3a">3</text>
<text x="600" y="314" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">ZONE READER</text>
<text x="600" y="384" text-anchor="middle" font-size="13.5" fill="#7a6533">LED lights on</text>
<text x="600" y="403" text-anchor="middle" font-size="13.5" fill="#7a6533">the target</text>

<!-- node 4 OPERATOR -->
<circle cx="825" cy="300" r="50" fill="#eef5f5" stroke="#3d6b6b" stroke-width="3"/>
<text x="825" y="294" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">4</text>
<text x="825" y="314" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2c5454">OPERATOR</text>
<text x="825" y="384" text-anchor="middle" font-size="13.5" fill="#5c5c5c">sees flash,</text>
<text x="825" y="403" text-anchor="middle" font-size="13.5" fill="#5c5c5c">picks item</text>

<!-- node 5 CONFIRM -->
<circle cx="1050" cy="300" r="50" fill="#eef7f0" stroke="#1f6f3a" stroke-width="3"/>
<text x="1050" y="294" text-anchor="middle" font-size="13" font-weight="800" fill="#1f6f3a">5</text>
<text x="1050" y="314" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f6f3a">CONFIRM</text>
<text x="1050" y="384" text-anchor="middle" font-size="13.5" fill="#33595a">handheld,</text>
<text x="1050" y="403" text-anchor="middle" font-size="13.5" fill="#33595a">LED off</text>

<!-- loop back 5 -> 2 -->
<path d="M 1050 470 L 1050 500 Q 1050 520 1030 520 L 395 520 Q 375 520 375 500 L 375 470" fill="none" stroke="#1f6f3a" stroke-width="2.6" stroke-dasharray="7 6"/>
<polygon points="368,470 375,452 382,470" fill="#1f6f3a"/>
<text x="712" y="512" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">advance to the next item</text>

<text x="600" y="600" text-anchor="middle" font-size="15" fill="#4f4f4f">The operator stops navigating by location code and starts following the light.</text>
</svg>
