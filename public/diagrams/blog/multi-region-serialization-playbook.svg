<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="s3Title s3Desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="s3Title">The multi-region serialization playbook — five moves</title>
  <desc id="s3Desc">Five stacked steps for a design-once, adapt-at-the-edge program. One, a common 2D DataMatrix satisfies both DSCSA and FMD with identical fields and encoding. Two, region-specific data — country prefix, NDC for the US, PC for the EU — is encoded at the packaging line. Three, a single ERP backbone such as TraceLink, Optel or Antares Vision is the one source of truth for all markets. Four, one tamper-evident pack design covers FMD's requirement and DSCSA best practice. Five, middleware region-adapter layers absorb each country's NMVS quirks with minimal ERP change.</desc>
  <defs>
    <radialGradient id="s3Bg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#s3Bg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="2" fill="#6d5a3a">MULTI-REGION SERIALIZATION PLAYBOOK</text>
  <text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Design once, adapt at the edge — five moves</text>

  <!-- Row 1 -->
  <rect x="56" y="104" width="1088" height="84" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="146" r="31" fill="#c39a5f"/><text x="116" y="155" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">1</text>
  <text x="180" y="141" font-size="23" font-weight="800" fill="#291c0e">Common 2D barcode</text>
  <text x="180" y="169" font-size="16" fill="#4f4f4f">One DataMatrix satisfies both DSCSA and FMD — identical fields &amp; encoding</text>
  <rect x="902" y="124" width="214" height="44" rx="22" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="1009" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">one barcode</text>

  <!-- Row 2 -->
  <rect x="56" y="192" width="1088" height="84" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="234" r="31" fill="#3d6b6b"/><text x="116" y="243" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">2</text>
  <text x="180" y="229" font-size="23" font-weight="800" fill="#291c0e">Region-specific data</text>
  <text x="180" y="257" font-size="16" fill="#4f4f4f">Country prefix, NDC (US) / PC (EU), encoded at the packaging line</text>
  <rect x="902" y="212" width="214" height="44" rx="22" fill="#e3efef" stroke="#3d6b6b" stroke-width="1.5"/><text x="1009" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#2c5454">NDC · PC</text>

  <!-- Row 3 -->
  <rect x="56" y="280" width="1088" height="84" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="322" r="31" fill="#1f4e79"/><text x="116" y="331" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">3</text>
  <text x="180" y="317" font-size="23" font-weight="800" fill="#291c0e">Single ERP backbone</text>
  <text x="180" y="345" font-size="16" fill="#4f4f4f">TraceLink, Optel or Antares Vision — one source of truth for all markets</text>
  <rect x="902" y="300" width="214" height="44" rx="22" fill="#e6eef6" stroke="#1f4e79" stroke-width="1.5"/><text x="1009" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">one ERP</text>

  <!-- Row 4 -->
  <rect x="56" y="368" width="1088" height="84" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="410" r="31" fill="#2d6a4f"/><text x="116" y="419" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">4</text>
  <text x="180" y="405" font-size="23" font-weight="800" fill="#291c0e">Tamper-evident by design</text>
  <text x="180" y="433" font-size="16" fill="#4f4f4f">One pack design covers FMD's requirement and DSCSA best practice</text>
  <rect x="902" y="388" width="214" height="44" rx="22" fill="#e6f0ea" stroke="#1f6f3a" stroke-width="1.5"/><text x="1009" y="416" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6f3a">one pack</text>

  <!-- Row 5 -->
  <rect x="56" y="456" width="1088" height="84" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="498" r="31" fill="#4a5568"/><text x="116" y="507" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">5</text>
  <text x="180" y="493" font-size="23" font-weight="800" fill="#291c0e">Per-region adapters</text>
  <text x="180" y="521" font-size="16" fill="#4f4f4f">Middleware layers absorb each country's NMVS quirks with minimal ERP change</text>
  <rect x="902" y="476" width="214" height="44" rx="22" fill="#eceef1" stroke="#4a5568" stroke-width="1.5"/><text x="1009" y="504" text-anchor="middle" font-size="16" font-weight="700" fill="#3a4a52">edge adapters</text>

  <text x="600" y="600" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">Build the platform once; let a thin adapter layer handle each new country.</text>
</svg>
