<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Durable NFC Digital Product Passport inlay construction and mounting by product category</title>
  <desc id="d">Left: the inlay layer stack — printed protective face, aluminium antenna coil with the NTAG 424 DNA die operating at 13.56 MHz with AES-128 SUN, a PET or woven-textile substrate, a tamper-evident adhesive that leaves VOID on removal, and the bond to the product surface. Right: four mounting methods matched to the product category — adhesive label or hang tag for packaging and retail, sewn-in woven tag for garments and footwear rated to ISO 6330 50+ wash cycles and ISO 3175 dry-clean, embedded heat- and chemical-resistant inlay for electronics and batteries, and a battery pole label or shrink-sleeve for EV and industrial cells over 2 kWh. Bottom: the NTAG 424 DNA chip holds its data 10+ years versus 2-3 year QR fade, surviving the 10-15 year service life of an EV battery.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="48" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DURABLE DPP INLAY — LAYER STACK &amp; MOUNTING</text>
  <text x="600" y="80" text-anchor="middle" font-size="15" fill="#5c5c5c">Glued, sewn or laminated to outlast the product — and it voids if it is peeled</text>

  <!-- layer stack -->
  <text x="300" y="124" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">THE LAYER STACK</text>
  <rect x="90" y="142" width="420" height="44" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="110" y="169" font-size="13.5" fill="#291c0e">Printed face + protective overlay</text>
  <rect x="90" y="192" width="420" height="58" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="110" y="218" font-size="13.5" fill="#291c0e">Aluminium antenna coil + NTAG 424 DNA die</text>
  <text x="110" y="238" font-size="12.5" fill="#5c5c5c">13.56 MHz · AES-128 SUN</text>
  <rect x="90" y="256" width="420" height="44" rx="6" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <text x="110" y="283" font-size="13.5" fill="#291c0e">PET or woven-textile substrate</text>
  <rect x="90" y="306" width="420" height="44" rx="6" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="2"/>
  <text x="110" y="333" font-size="13.5" fill="#8b2d2d">Tamper-evident adhesive — leaves VOID on removal</text>
  <rect x="90" y="356" width="420" height="34" rx="6" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <text x="110" y="378" font-size="13.5" fill="#291c0e">Bonded / embedded into the product surface</text>

  <!-- mounting cards -->
  <text x="845" y="124" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">MOUNTING BY PRODUCT CATEGORY</text>
  <rect x="560" y="142" width="270" height="98" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="580" y="176" font-size="15.5" font-weight="700" fill="#291c0e">Adhesive label / hang tag</text>
  <text x="580" y="200" font-size="13" fill="#5c5c5c">Packaging, cartons &amp; retail</text>
  <text x="580" y="220" font-size="13" fill="#3d6b6b">point-of-sale display</text>

  <rect x="850" y="142" width="270" height="98" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="870" y="176" font-size="15.5" font-weight="700" fill="#291c0e">Sewn-in woven tag</text>
  <text x="870" y="200" font-size="13" fill="#5c5c5c">Garments &amp; footwear</text>
  <text x="870" y="220" font-size="13" fill="#3d6b6b">ISO 6330 50+ wash · ISO 3175</text>

  <rect x="560" y="260" width="270" height="98" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="580" y="294" font-size="15.5" font-weight="700" fill="#291c0e">Embedded inlay</text>
  <text x="580" y="318" font-size="13" fill="#5c5c5c">Electronics &amp; batteries —</text>
  <text x="580" y="338" font-size="13" fill="#3d6b6b">heat / chemical-resistant</text>

  <rect x="850" y="260" width="270" height="98" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="870" y="294" font-size="15.5" font-weight="700" fill="#291c0e">Battery pole label / sleeve</text>
  <text x="870" y="318" font-size="13" fill="#5c5c5c">EV &amp; industrial cells</text>
  <text x="870" y="338" font-size="13" fill="#3d6b6b">&gt; 2 kWh packs</text>

  <!-- retention band -->
  <rect x="70" y="430" width="1060" height="80" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="90" y="458" font-size="15" font-weight="700" fill="#2c5454">Why NFC, not printed QR, carries the passport</text>
  <text x="90" y="482" font-size="13.5" fill="#3d6b6b">The NTAG 424 DNA chip holds its data for 10+ years; a printed QR fades within 2-3 years.</text>
  <text x="90" y="502" font-size="13.5" fill="#3d6b6b">The DPP link has to survive the 10-15 year service life of an EV battery — ink does not.</text>

  <text x="600" y="548" text-anchor="middle" font-size="13.5" fill="#5c5c5c">One inlay platform, five mountings — the chip and its AES-128 key stay identical across every form factor.</text>
</svg>
