<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Rigid tag versus conformable silicone flex-tag on a curved, flexing asset</title>
  <desc id="d">Side-by-side comparison. Left: a flat rigid FR-4 RFID tag mounted on a curved hose touches only at its centre, stress concentrates at the interface and the tag cracks and debonds within 2,000-5,000 service-cycles. Right: a conformable silicone flex-tag follows the same curve in full contact and stays readable past 10,000 flex cycles at a 10 mm bend radius with at least 99.5 percent post-cycle read-rate, flex-qualified per IPC-TM-650 2.4.3 and JEDEC JESD22-B108.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY RIGID TAGS FAIL ON CURVES</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#5c5c5c">Same hose, same duty cycle — two mechanical contracts</text>

  <!-- left panel: rigid -->
  <rect x="56" y="118" width="520" height="384" rx="16" fill="#faf6ec" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="316" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">Rigid FR-4 / epoxy tag</text>
  <text x="316" y="196" text-anchor="middle" font-size="13.5" fill="#5c5c5c">flat tag on a curved surface —</text>
  <text x="316" y="218" text-anchor="middle" font-size="13.5" fill="#5c5c5c">edges lift, stress concentrates</text>

  <!-- hose (curved surface) -->
  <path d="M 96 462 Q 316 268 536 462" fill="none" stroke="#4a5568" stroke-width="24" stroke-linecap="round"/>
  <path d="M 96 462 Q 316 268 536 462" fill="none" stroke="#5d6b80" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  <!-- flat rigid tag, tangent at apex, edges lifted -->
  <rect x="236" y="330" width="160" height="20" rx="3" fill="#ffffff" stroke="#291c0e" stroke-width="2.5"/>
  <!-- gap markers under lifted edges -->
  <path d="M 244 354 L 244 366" stroke="#8b2d2d" stroke-width="2"/>
  <path d="M 388 354 L 388 366" stroke="#8b2d2d" stroke-width="2"/>
  <!-- crack -->
  <path d="M 384 330 L 372 342 L 382 350 L 370 362 L 380 372" fill="none" stroke="#8b2d2d" stroke-width="3"/>
  <!-- stress arrows -->
  <path d="M 236 316 L 222 300" stroke="#8b2d2d" stroke-width="2.5"/>
  <path d="M 222 300 L 228 312 M 222 300 L 234 304" stroke="#8b2d2d" stroke-width="2.5" fill="none"/>
  <path d="M 396 316 L 410 300" stroke="#8b2d2d" stroke-width="2.5"/>
  <path d="M 410 300 L 404 312 M 410 300 L 398 304" stroke="#8b2d2d" stroke-width="2.5" fill="none"/>
  <text x="316" y="478" text-anchor="middle" font-size="15" font-weight="600" fill="#8b2d2d">cracks + debonds in 2,000-5,000 service-cycles</text>

  <!-- right panel: flex -->
  <rect x="624" y="118" width="520" height="384" rx="16" fill="#faf6ec" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="884" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">Conformable silicone flex-tag</text>
  <text x="884" y="196" text-anchor="middle" font-size="13.5" fill="#5c5c5c">full-contact wrap —</text>
  <text x="884" y="218" text-anchor="middle" font-size="13.5" fill="#5c5c5c">the elastomer takes the bending</text>

  <path d="M 664 462 Q 884 268 1104 462" fill="none" stroke="#4a5568" stroke-width="24" stroke-linecap="round"/>
  <path d="M 664 462 Q 884 268 1104 462" fill="none" stroke="#5d6b80" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  <!-- conformal band following the curve -->
  <path d="M 784 388 Q 884 300 984 388" fill="none" stroke="#3d6b6b" stroke-width="20" stroke-linecap="round"/>
  <path d="M 784 388 Q 884 300 984 388" fill="none" stroke="#6fa3a3" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- chip mark on band -->
  <rect x="872" y="316" width="24" height="14" rx="2" fill="#291c0e"/>
  <text x="884" y="478" text-anchor="middle" font-size="15" font-weight="600" fill="#2c5454">10,000+ flex cycles at 10 mm · ≥99.5 % read-rate</text>

  <!-- result band -->
  <rect x="150" y="530" width="900" height="66" rx="16" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="558" text-anchor="middle" font-size="15.5" font-weight="600" fill="#2c5454">Flex-qualified per IPC-TM-650 2.4.3 + JEDEC JESD22-B108</text>
  <text x="600" y="582" text-anchor="middle" font-size="14" fill="#3d6b6b">the elastomer takes the bending, so the electronics never do</text>

  <text x="600" y="636" text-anchor="middle" font-size="12.5" fill="#8a949c">Proud Tek · conformable silicone / TPU flex-RFID</text>
</svg>
