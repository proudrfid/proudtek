<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">HF or UHF for laundry — one at a time, or two hundred a second</title>
<desc id="d">Left panel, HF at 13.56 MHz: a check-in station reads one garment at 5-15 centimetres — individual accountability, ideal for uniform dispensers. Right panel, UHF at 860-960 MHz: a tunnel reads a whole cart at 1-8 metres, 50-200 items per second under the EPC Gen2 air interface — which is why high-volume laundries default to UHF. Footnote: dual-frequency tags exist but are rarely cost-justified for laundry.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TWO COUNTING STYLES</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">One garment at arm's length, or a whole cart at once</text>

<rect x="60" y="130" width="530" height="440" rx="16" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="325" y="172" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">HF · 13.56 MHz · CHECK-IN STATION</text>
<rect x="130" y="230" width="150" height="110" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
<text x="205" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">reader pad</text>
<path d="M 296 268 a 24 24 0 0 1 0 34" fill="none" stroke="#c39a5f" stroke-width="2.5"/>
<path d="M 308 258 a 38 38 0 0 1 0 54" fill="none" stroke="#c39a5f" stroke-width="2" opacity="0.6"/>
<rect x="340" y="244" width="120" height="82" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="2"/>
<circle cx="400" cy="285" r="9" fill="none" stroke="#c39a5f" stroke-width="2"/>
<text x="400" y="356" text-anchor="middle" font-size="12.5" fill="#4f4f4f">one garment</text>
<rect x="130" y="400" width="380" height="38" rx="19" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="320" y="424" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d5a3a">reads at 5–15 cm · one at a time</text>
<text x="325" y="474" text-anchor="middle" font-size="12.5" fill="#4f4f4f">individual accountability — who took which uniform</text>
<text x="325" y="498" text-anchor="middle" font-size="12.5" fill="#4f4f4f">e.g. nurse uniform dispensers, point-of-use check-out</text>
<text x="325" y="540" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">pick when accountability beats speed</text>

<rect x="610" y="130" width="530" height="440" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="875" y="172" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">UHF · 860–960 MHz · TUNNEL</text>
<path d="M 700 220 v 150 M 1050 220 v 150 M 700 220 h 350" stroke="#2c5454" stroke-width="3"/>
<rect x="760 " y="270" width="230" height="86" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="782" y="288" width="54" height="24" rx="4" fill="#eef5f5" stroke="#cfe0e0"/>
<rect x="848" y="288" width="54" height="24" rx="4" fill="#eef5f5" stroke="#cfe0e0"/>
<rect x="914" y="288" width="54" height="24" rx="4" fill="#eef5f5" stroke="#cfe0e0"/>
<rect x="782" y="320" width="54" height="24" rx="4" fill="#eef5f5" stroke="#cfe0e0"/>
<rect x="848" y="320" width="54" height="24" rx="4" fill="#eef5f5" stroke="#cfe0e0"/>
<rect x="914" y="320" width="54" height="24" rx="4" fill="#eef5f5" stroke="#cfe0e0"/>
<circle cx="875" cy="382" r="8" fill="#4a5568"/>
<circle cx="805" cy="382" r="8" fill="#4a5568"/>
<circle cx="945" cy="382" r="8" fill="#4a5568"/>
<path d="M 730 250 a 30 30 0 0 1 26 -20" fill="none" stroke="#3d6b6b" stroke-width="2" opacity="0.7"/>
<path d="M 1020 250 a 30 30 0 0 0 -26 -20" fill="none" stroke="#3d6b6b" stroke-width="2" opacity="0.7"/>
<rect x="700" y="400" width="350" height="38" rx="19" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="875" y="424" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">1–8 m range · 50–200 items/second</text>
<text x="875" y="474" text-anchor="middle" font-size="12.5" fill="#4f4f4f">bulk carts straight through the gate — EPC Gen2 (ISO 18000-63)</text>
<text x="875" y="498" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Impinj · Zebra · Alien fixed readers</text>
<text x="875" y="540" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">the default for high-volume throughput</text>

<text x="600" y="626" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Dual-frequency tags exist, but for laundry they're a solution shopping for a problem — pick one counting style.</text>
</svg>
