<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Six sector-gatekeeper certifications for RFID factories in 2026</title>
<desc id="d">Six cards, one per gatekeeper certification. IATF 16949:2016 gates automotive Tier 1 supply for Toyota, VW, GM, Ford and Stellantis, mandates PPAP and 8D corrective actions, takes 12-18 months and costs $15K-$50K. ISO 13485:2016 gates medical devices under FDA 21 CFR 820 and EU MDR 2017/745 for instrument, asset and specimen tags, with an annual audit and $8K-$30K cost. ISO 27001:2022 gates information security work on PII, payments and government IDs such as LVMH Aura and Estonian eID, taking 12 months and $15K per year. UL 60950-1 / UL 62368-1 gates US electrical equipment — readers, encoders, active tags — covering electrical safety and EMC at $10K-$40K plus $5K per year. FCC Part 15 with an FCC ID gates US radio approval for UHF tags and readers, tested via CCIC, Sporton or Bay Area Compliance Lab. CE RED, SRRC, RCM and ICASA are the radio marks for the EU, China, Australia/NZ and South Africa — without the mark, customs cannot clear the product. A footnote notes 6-12 months of audit prep per standard: there is no expedite fee on an audit calendar.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE VELVET ROPES · SECTOR CERTIFICATIONS IN 2026</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Six gatekeepers, one market apiece</text>

<!-- tile 1: IATF -->
