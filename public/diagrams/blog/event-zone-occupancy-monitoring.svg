<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Bi-directional zone counting drives an 80 / 90 / 100 percent alert ladder</title>
<desc id="d">On the left, a zone bounded by bi-directional readers: an IN reader adds one to the live count for each entry and an OUT reader subtracts one for each exit, so taps in minus taps out equals the live occupancy. That live number is compared against permit capacity to drive an escalating alert ladder on the right: at 80 percent, notify the supervisor and dispatch crowd staff; at 90 percent, close inbound entry and redirect to overflow; at 100 percent, lock the zone until occupancy drops below 90 percent.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">REAL-TIME MONITORING · COUNT IN, COUNT OUT, ACT</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Bi-directional readers keep a live headcount; thresholds turn it into action.</text>

<!-- zone -->
<rect x="88" y="176" width="316" height="250" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="246" y="212" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">ZONE OCCUPANCY</text>
<text x="246" y="232" text-anchor="middle" font-size="13" fill="#4f4f4f">live headcount</text>
<g fill="#3d6b6b" opacity="0.55">
<circle cx="150" cy="262" r="6"/><circle cx="196" cy="262" r="6"/><circle cx="242" cy="262" r="6"/><circle cx="288" cy="262" r="6"/><circle cx="334" cy="262" r="6"/>
<circle cx="150" cy="296" r="6"/><circle cx="196" cy="296" r="6"/><circle cx="242" cy="296" r="6"/><circle cx="288" cy="296" r="6"/><circle cx="334" cy="296" r="6"/>
<circle cx="150" cy="330" r="6"/><circle cx="196" cy="330" r="6"/><circle cx="242" cy="330" r="6"/><circle cx="288" cy="330" r="6"/><circle cx="334" cy="330" r="6"/>
</g>
<!-- IN reader -->
<rect x="70" y="248" width="22" height="40" rx="4" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>
<line x1="96" y1="268" x2="138" y2="268" stroke="#1f6f3a" stroke-width="4"/><path d="M138 268 l-14 -7 v14 z" fill="#1f6f3a"/>
<text x="66" y="242" font-size="12.5" font-weight="800" fill="#1f6f3a">IN +1</text>
<!-- OUT reader -->
<rect x="70" y="336" width="22" height="40" rx="4" fill="#4a5568" stroke="#33404f" stroke-width="1.5"/>
<line x1="138" y1="356" x2="96" y2="356" stroke="#5c5c5c" stroke-width="4"/><path d="M96 356 l14 -7 v14 z" fill="#5c5c5c"/>
<text x="62" y="400" font-size="12.5" font-weight="800" fill="#5c5c5c">OUT −1</text>

<!-- live readout -->
<rect x="88" y="440" width="316" height="52" rx="10" fill="url(#dark)"/>
<text x="246" y="466" text-anchor="middle" font-size="14" font-weight="700" fill="#f4efe4">taps in − taps out = live count</text>
<text x="246" y="483" text-anchor="middle" font-size="12.5" fill="#e9ddc4">updates on every gate tap</text>

<!-- connector -->
<line x1="410" y1="430" x2="470" y2="430" stroke="#c39a5f" stroke-width="3"/><path d="M470 430 l-14 -7 v14 z" fill="#c39a5f"/>

<!-- alert ladder -->
<text x="478" y="204" font-size="13" font-weight="800" letter-spacing="1" fill="#6d5a3a">CAPACITY ALERT LADDER</text>
<rect x="478" y="224" width="612" height="60" rx="12" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2"/>
<text x="498" y="262" font-size="26" font-weight="800" fill="#8b2d2d">100%</text>
<line x1="594" y1="236" x2="594" y2="272" stroke="#e2c4c4" stroke-width="1.5"/>
<text x="610" y="260" font-size="15" font-weight="700" fill="#291c0e">Lock the zone until it drops below 90%</text>
<rect x="478" y="300" width="612" height="60" rx="12" fill="#efe3cf" stroke="#6d5a3a" stroke-width="2"/>
<text x="500" y="338" font-size="26" font-weight="800" fill="#6d5a3a">90%</text>
<line x1="594" y1="312" x2="594" y2="348" stroke="#e4c98f" stroke-width="1.5"/>
<text x="610" y="336" font-size="15" font-weight="700" fill="#291c0e">Close inbound entry, redirect to overflow</text>
<rect x="478" y="376" width="612" height="60" rx="12" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
<text x="500" y="414" font-size="26" font-weight="800" fill="#6d5a3a">80%</text>
<line x1="594" y1="388" x2="594" y2="424" stroke="#e4c98f" stroke-width="1.5"/>
<text x="610" y="412" font-size="15" font-weight="700" fill="#291c0e">Notify supervisor, dispatch crowd staff</text>
<!-- escalation arrow -->
<line x1="1112" y1="432" x2="1112" y2="232" stroke="#c39a5f" stroke-width="3"/><path d="M1112 224 l-8 14 h16 z" fill="#c39a5f"/>
<text x="1136" y="330" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a" transform="rotate(-90 1136 330)">occupancy rising</text>

<text x="600" y="540" text-anchor="middle" font-size="15" fill="#5c5c5c">The live number matters only for the action wired to it — set thresholds with the fire marshal, not on the day.</text>
</svg>
