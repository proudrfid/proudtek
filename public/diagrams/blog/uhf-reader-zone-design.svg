<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">UHF reader zone design — portal panels versus overhead ceiling beam</title>
<desc id="d">Two approaches to defining a UHF read zone. Left, portal readers: two vertical antenna panels flank a walkway, creating a tight, defined read zone that a person passes through without overshoot into adjacent areas. Right, overhead readers: a ceiling-mounted antenna projects a downward beam that covers a wide open floor but needs more power. Tune power and angle on-site — too much reads the next lane, too little misses the zone; directional antennas with a 30 to 60 degree beam keep reads inside the line.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DRAWING THE ZONE IN THE AIR</text>
<text x="600" y="98" text-anchor="middle" font-size="29" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Portal vs overhead: aim is 80% of the job</text>

<!-- LEFT · portal -->
<rect x="88" y="124" width="480" height="372" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="88" y="124" width="480" height="8" rx="4" fill="#3d6b6b"/>
<text x="328" y="166" text-anchor="middle" font-size="16.5" font-weight="800" fill="#2c5454">Portal readers</text>
<rect x="214" y="250" width="228" height="176" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8" stroke-dasharray="7 6"/>
<text x="328" y="280" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.6" fill="#2c5454">READ ZONE</text>
<rect x="168" y="242" width="34" height="192" rx="5" fill="#3d6b6b"/>
<rect x="454" y="242" width="34" height="192" rx="5" fill="#3d6b6b"/>
<circle cx="328" cy="356" r="13" fill="#4a5568"/>
<rect x="315" y="372" width="26" height="40" rx="8" fill="#4a5568"/>
<text x="328" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">two panels &#183; tight, defined zone</text>

<!-- RIGHT · overhead -->
<rect x="632" y="124" width="480" height="372" rx="14" fill="#eef0f4" stroke="#d4dae2" stroke-width="1.8"/>
<rect x="632" y="124" width="480" height="8" rx="4" fill="#4a5568"/>
<text x="872" y="166" text-anchor="middle" font-size="16.5" font-weight="800" fill="#3a4457">Overhead readers</text>
<polygon points="852,250 892,250 1016,430 728,430" fill="#e2e7ee" stroke="#4a5568" stroke-width="1.6" stroke-dasharray="7 6"/>
<rect x="830" y="226" width="84" height="24" rx="5" fill="#4a5568"/>
<text x="872" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">antenna</text>
<line x1="700" y1="430" x2="1044" y2="430" stroke="#cbb89a" stroke-width="1.6"/>
<circle cx="806" cy="386" r="12" fill="#4a5568"/>
<rect x="794" y="400" width="24" height="30" rx="7" fill="#4a5568"/>
<circle cx="940" cy="386" r="12" fill="#4a5568"/>
<rect x="928" y="400" width="24" height="30" rx="7" fill="#4a5568"/>
<text x="872" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4457">ceiling beam &#183; wide area, more power</text>

<rect x="88" y="516" width="1024" height="58" rx="12" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="551" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Tune power and angle on-site: too much reads the next lane, too little misses the zone. Directional antennas (30&#8211;60&#176; beam) keep reads inside the line.</text>
</svg>
