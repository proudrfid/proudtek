<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The RFID inventory ROI model: investment versus annual savings, netting to payback</title>
<desc id="d">A balance model. On the left, first-year investment: tags at 0.03 to 0.15 dollars per item, handheld readers at 1,500 to 3,500 dollars, software and middleware licensing, and integration and training at 15 to 25 percent of cost. On the right, annual savings: labor down 60 to 80 percent, inventory accuracy rising from 65 percent to 95 percent or better, shrinkage 50 to 80 percent lower, and out-of-stock sales lifting 2 to 8 percent. Net annual benefit divided by investment gives a typical full ROI payback of 6 to 18 months.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID INVENTORY ROI MODEL</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">What goes in, what comes back, and when it pays for itself.</text>

<!-- INVESTMENT panel -->
<rect x="76" y="130" width="470" height="310" rx="14" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.8"/>
<rect x="76" y="130" width="470" height="8" rx="4" fill="#4a5568"/>
<text x="311" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#3f4657">INVESTMENT · first year</text>
<line x1="104" y1="196" x2="518" y2="196" stroke="#efe7d6" stroke-width="1.4"/>
<text x="104" y="228" font-size="15" font-weight="700" fill="#291c0e">Tags</text>
<text x="518" y="228" text-anchor="end" font-size="14" font-weight="800" fill="#4a5568">$0.03-0.15 / item</text>
<line x1="104" y1="250" x2="518" y2="250" stroke="#efe7d6" stroke-width="1.2"/>
<text x="104" y="282" font-size="15" font-weight="700" fill="#291c0e">Handheld readers</text>
<text x="518" y="282" text-anchor="end" font-size="14" font-weight="800" fill="#4a5568">$1,500-3,500</text>
<line x1="104" y1="304" x2="518" y2="304" stroke="#efe7d6" stroke-width="1.2"/>
<text x="104" y="336" font-size="15" font-weight="700" fill="#291c0e">Software + middleware</text>
<text x="518" y="336" text-anchor="end" font-size="14" font-weight="800" fill="#4a5568">licensing + ERP</text>
<line x1="104" y1="358" x2="518" y2="358" stroke="#efe7d6" stroke-width="1.2"/>
<text x="104" y="390" font-size="15" font-weight="700" fill="#291c0e">Integration + training</text>
<text x="518" y="390" text-anchor="end" font-size="14" font-weight="800" fill="#4a5568">15-25% of cost</text>

<!-- SAVINGS panel -->
<rect x="654" y="130" width="470" height="310" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="654" y="130" width="470" height="8" rx="4" fill="#3d6b6b"/>
<text x="889" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">ANNUAL SAVINGS</text>
<line x1="682" y1="196" x2="1096" y2="196" stroke="#eef5f5" stroke-width="1.4"/>
<text x="682" y="228" font-size="15" font-weight="700" fill="#291c0e">Labor / counting</text>
<text x="1096" y="228" text-anchor="end" font-size="14" font-weight="800" fill="#2c5454">60-80% less</text>
<line x1="682" y1="250" x2="1096" y2="250" stroke="#eef5f5" stroke-width="1.2"/>
<text x="682" y="282" font-size="15" font-weight="700" fill="#291c0e">Inventory accuracy</text>
<text x="1096" y="282" text-anchor="end" font-size="14" font-weight="800" fill="#2c5454">65% &#8594; 95%+</text>
<line x1="682" y1="304" x2="1096" y2="304" stroke="#eef5f5" stroke-width="1.2"/>
<text x="682" y="336" font-size="15" font-weight="700" fill="#291c0e">Shrinkage</text>
<text x="1096" y="336" text-anchor="end" font-size="14" font-weight="800" fill="#2c5454">50-80% lower</text>
<line x1="682" y1="358" x2="1096" y2="358" stroke="#eef5f5" stroke-width="1.2"/>
<text x="682" y="390" font-size="15" font-weight="700" fill="#291c0e">Out-of-stock sales</text>
<text x="1096" y="390" text-anchor="end" font-size="14" font-weight="800" fill="#1f6f3a">2-8% lift</text>

<!-- formula + payback band -->
<text x="600" y="463" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">net annual benefit  &#247;  investment  =</text>
<rect x="360" y="478" width="480" height="86" rx="18" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<text x="600" y="528" text-anchor="middle" font-size="40" font-weight="800" fill="#2c5454">6-18 months</text>
<text x="600" y="552" text-anchor="middle" font-size="14" font-weight="700" fill="#6d5a3a">typical full ROI payback</text>

<text x="600" y="606" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Start from your own count hours and shrink rate — not a vendor's best-case slide.</text>
</svg>
