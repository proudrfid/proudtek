<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How a credential maps to a set of authorized elevator floors</title>
<desc id="d">One card or fob on the left fans out to five mapping-rule types on the right, each resolving to an example floor list. Static assignment gives a fixed set of floors at enrollment. A role-based group inherits floors from an access level, such as engineering on floors 3 to 5 or executive on floors 8 to 10. A time-based rule changes floors by time of day, such as cleaning staff getting all floors between 6 PM and 6 AM. A hotel dynamic rule encodes the guest floor onto the card at check-in. A visitor pass allows the destination floor plus the lobby and then auto-expires.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE CREDENTIAL → AUTHORIZED FLOORS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The access-control system maps each card or fob to a floor list.</text>

<text x="486" y="128" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a8a8a">MAPPING RULE</text>
<text x="922" y="128" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a8a8a">AUTHORIZED FLOORS</text>

<!-- credential node -->
<rect x="70" y="300" width="152" height="92" rx="12" fill="#f7edd6" stroke="#d9b45f" stroke-width="2.2"/>
<text x="146" y="336" text-anchor="middle" font-size="15" font-weight="800" fill="#a07d43">CARD / FOB</text>
<text x="146" y="360" text-anchor="middle" font-size="12.5" fill="#6d5a3a">credential ID</text>

<!-- fan connectors -->
<line x1="222" y1="346" x2="300" y2="188" stroke="#c3b48f" stroke-width="1.8"/>
<line x1="222" y1="346" x2="300" y2="278" stroke="#c3b48f" stroke-width="1.8"/>
<line x1="222" y1="346" x2="300" y2="368" stroke="#c3b48f" stroke-width="1.8"/>
<line x1="222" y1="346" x2="300" y2="458" stroke="#c3b48f" stroke-width="1.8"/>
<line x1="222" y1="346" x2="300" y2="548" stroke="#c3b48f" stroke-width="1.8"/>
<circle cx="222" cy="346" r="4" fill="#a07d43"/>

<!-- Row 1: static -->
<rect x="300" y="150" width="372" height="76" rx="10" fill="#ffffff" stroke="#cdd3da" stroke-width="1.8"/>
<text x="318" y="182" font-size="15" font-weight="800" fill="#291c0e">Static assignment</text>
<text x="318" y="205" font-size="12.5" fill="#5c5c5c">Fixed floors set at enrollment</text>
<line x1="676" y1="188" x2="704" y2="188" stroke="#4a5568" stroke-width="2.2"/>
<polygon points="704,183 716,188 704,193" fill="#4a5568"/>
<rect x="716" y="150" width="414" height="76" rx="10" fill="#eef5f5" stroke="#8fb6b6" stroke-width="2"/>
<rect x="734" y="171" width="52" height="34" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="760" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">L</text>
<rect x="796" y="171" width="52" height="34" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="822" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">4</text>

<!-- Row 2: role-based -->
<rect x="300" y="240" width="372" height="76" rx="10" fill="#ffffff" stroke="#cdd3da" stroke-width="1.8"/>
<text x="318" y="272" font-size="15" font-weight="800" fill="#291c0e">Role-based group</text>
<text x="318" y="295" font-size="12.5" fill="#5c5c5c">Floors inherited from access level</text>
<line x1="676" y1="278" x2="704" y2="278" stroke="#4a5568" stroke-width="2.2"/>
<polygon points="704,273 716,278 704,283" fill="#4a5568"/>
<rect x="716" y="240" width="414" height="76" rx="10" fill="#eef5f5" stroke="#8fb6b6" stroke-width="2"/>
<rect x="734" y="261" width="122" height="34" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="795" y="283" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">Eng · 3–5</text>
<rect x="866" y="261" width="140" height="34" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="936" y="283" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">Exec · 8–10</text>

<!-- Row 3: time-based -->
<rect x="300" y="330" width="372" height="76" rx="10" fill="#ffffff" stroke="#cdd3da" stroke-width="1.8"/>
<text x="318" y="362" font-size="15" font-weight="800" fill="#291c0e">Time-based rule</text>
<text x="318" y="385" font-size="12.5" fill="#5c5c5c">Floors change by time of day</text>
<line x1="676" y1="368" x2="704" y2="368" stroke="#4a5568" stroke-width="2.2"/>
<polygon points="704,363 716,368 704,373" fill="#4a5568"/>
<rect x="716" y="330" width="414" height="76" rx="10" fill="#eef5f5" stroke="#8fb6b6" stroke-width="2"/>
<rect x="734" y="351" width="330" height="34" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="899" y="373" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">Cleaning · all floors 6 PM – 6 AM</text>

<!-- Row 4: hotel dynamic -->
<rect x="300" y="420" width="372" height="76" rx="10" fill="#ffffff" stroke="#cdd3da" stroke-width="1.8"/>
<text x="318" y="452" font-size="15" font-weight="800" fill="#291c0e">Hotel dynamic (PMS)</text>
<text x="318" y="475" font-size="12.5" fill="#5c5c5c">Guest floor encoded at check-in</text>
<line x1="676" y1="458" x2="704" y2="458" stroke="#4a5568" stroke-width="2.2"/>
<polygon points="704,453 716,458 704,463" fill="#4a5568"/>
<rect x="716" y="420" width="414" height="76" rx="10" fill="#eef5f5" stroke="#8fb6b6" stroke-width="2"/>
<rect x="734" y="441" width="52" height="34" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="760" y="463" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">L</text>
<rect x="796" y="441" width="130" height="34" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="861" y="463" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">8 · guest</text>

<!-- Row 5: visitor -->
<rect x="300" y="510" width="372" height="76" rx="10" fill="#ffffff" stroke="#cdd3da" stroke-width="1.8"/>
<text x="318" y="542" font-size="15" font-weight="800" fill="#291c0e">Visitor pass</text>
<text x="318" y="565" font-size="12.5" fill="#5c5c5c">Destination + lobby, auto-expires</text>
<line x1="676" y1="548" x2="704" y2="548" stroke="#4a5568" stroke-width="2.2"/>
<polygon points="704,543 716,548 704,553" fill="#4a5568"/>
<rect x="716" y="510" width="414" height="76" rx="10" fill="#eef5f5" stroke="#8fb6b6" stroke-width="2"/>
<rect x="734" y="531" width="52" height="34" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="760" y="553" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">L</text>
<rect x="796" y="531" width="52" height="34" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="822" y="553" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">5</text>
<rect x="858" y="531" width="104" height="34" rx="8" fill="#f7edd6" stroke="#d9b45f" stroke-width="1.8"/>
<text x="910" y="553" text-anchor="middle" font-size="13" font-weight="700" fill="#a07d43">expires</text>

<text x="600" y="632" text-anchor="middle" font-size="14" fill="#4f4f4f">Static lists ride on the card; dynamic lists live in the database and revoke instantly.</text>
</svg>
