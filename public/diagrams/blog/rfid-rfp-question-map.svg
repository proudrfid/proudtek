<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The ten RFID RFP questions grouped into five themes they protect</title>
<desc id="d">Ten RFP questions sorted into five columns. Pricing and fees: volume-tier pricing, tooling and setup fees, payment terms. Product: chip SKU plus approved alternates, white-label and OEM capability. Certification: ARC or industry certification, and ISO 9001, ISO 14001, BSCI, RoHS and REACH. Operations: lead time, and quality-control process and yield. References: three comparable reference customers.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE 10-QUESTION RFP · GROUPED</text>
<text x="600" y="99" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">Ten questions, five things they protect</text>
<text x="600" y="131" text-anchor="middle" font-size="16" fill="#4f4f4f">Each one closes a door a supplier would otherwise be glad to leave open.</text>
<rect x="74" y="180" width="198" height="384" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="74" y="180" width="198" height="8" rx="4" fill="#c39a5f"/>
<text x="173" y="216" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.3" fill="#6d5a3a">PRICING &amp; FEES</text>
<circle cx="102" cy="280" r="13" fill="#c39a5f"/><text x="102" y="284.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">1</text>
<text x="124" y="284.5" font-size="12.5" fill="#291c0e">Volume-tier pricing</text>
<circle cx="102" cy="358" r="13" fill="#c39a5f"/><text x="102" y="362.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">4</text>
<text x="124" y="354" font-size="12.5" fill="#291c0e">Tooling &amp; setup</text>
<text x="124" y="371" font-size="12.5" fill="#291c0e">fees</text>
<circle cx="102" cy="440" r="13" fill="#c39a5f"/><text x="102" y="444.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">8</text>
<text x="124" y="444.5" font-size="12.5" fill="#291c0e">Payment terms</text>
<rect x="288" y="180" width="198" height="384" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="288" y="180" width="198" height="8" rx="4" fill="#3d6b6b"/>
<text x="387" y="216" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.3" fill="#2c5454">PRODUCT</text>
<circle cx="316" cy="310" r="13" fill="#3d6b6b"/><text x="316" y="314.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">2</text>
<text x="338" y="306" font-size="12.5" fill="#291c0e">Chip SKU +</text>
<text x="338" y="323" font-size="12.5" fill="#291c0e">approved alternates</text>
<circle cx="316" cy="404" r="13" fill="#3d6b6b"/><text x="316" y="408.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">7</text>
<text x="338" y="408.5" font-size="12.5" fill="#291c0e">White-label / OEM</text>
<rect x="502" y="180" width="198" height="384" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="502" y="180" width="198" height="8" rx="4" fill="#2d6a4f"/>
<text x="601" y="216" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.3" fill="#2d6a4f">CERTIFICATION</text>
<circle cx="530" cy="310" r="13" fill="#2d6a4f"/><text x="530" y="314.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">3</text>
<text x="552" y="314.5" font-size="12.5" fill="#291c0e">ARC / industry cert</text>
<circle cx="530" cy="404" r="13" fill="#2d6a4f"/><text x="530" y="408.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">9</text>
<text x="552" y="400" font-size="12.5" fill="#291c0e">ISO 9001/14001,</text>
<text x="552" y="417" font-size="12.5" fill="#291c0e">BSCI, RoHS, REACH</text>
<rect x="716" y="180" width="198" height="384" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="716" y="180" width="198" height="8" rx="4" fill="#4a5568"/>
<text x="815" y="216" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.3" fill="#4a5568">OPERATIONS</text>
<circle cx="744" cy="310" r="13" fill="#4a5568"/><text x="744" y="314.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">5</text>
<text x="766" y="314.5" font-size="12.5" fill="#291c0e">Lead time</text>
<circle cx="744" cy="404" r="13" fill="#4a5568"/><text x="744" y="408.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">6</text>
<text x="766" y="404" font-size="12.5" fill="#291c0e">QC process &amp;</text>
<text x="766" y="421" font-size="12.5" fill="#291c0e">yield rate</text>
<rect x="930" y="180" width="198" height="384" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="930" y="180" width="198" height="8" rx="4" fill="#2c5454"/>
<text x="1029" y="216" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.3" fill="#2c5454">REFERENCES</text>
<circle cx="958" cy="356" r="13" fill="#2c5454"/><text x="958" y="360.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">10</text>
<text x="980" y="352" font-size="12.5" fill="#291c0e">3 reference</text>
<text x="980" y="369" font-size="12.5" fill="#291c0e">customers</text>
<text x="600" y="600" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Keep all ten — a missing question is a fee, a substitution or a slipped deadline you meet later.</text>
</svg>
