<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The CFO ROI worksheet for a 25,000-asset RFID deployment</title>
<desc id="d">A worked ROI calculation for 25,000 fixed assets across 5 locations, the CPCON canonical example. The current annual physical count costs 180,000 dollars per year; with RFID it costs 35,000 dollars per year; the difference is 145,000 dollars of annual labor saved. Adding a ghost-asset write-down of 50,000 to 100,000 dollars per year and subtracting a first-year RFID investment of 120,000 dollars, the deployment reaches payback in under 12 months.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE CFO ROI WORKSHEET</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">One auditable page: 25,000 fixed assets across 5 locations (the CPCON canonical example).</text>

<!-- Band 1: count cost now - rfid = labor saved -->
<rect x="80" y="140" width="252" height="124" rx="14" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.6"/>
<text x="206" y="176" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#4a5568">COUNT COST — NOW</text>
<text x="206" y="224" text-anchor="middle" font-size="30" font-weight="800" font-family="Lora, Georgia, serif" fill="#4a5568">$180,000</text>
<text x="206" y="250" text-anchor="middle" font-size="13" fill="#5c5c5c">per year, manual count</text>

<text x="357" y="215" text-anchor="middle" font-size="34" font-weight="800" fill="#b6ac97">&#8722;</text>

<rect x="382" y="140" width="252" height="124" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="508" y="176" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#2c5454">COUNT COST — RFID</text>
<text x="508" y="224" text-anchor="middle" font-size="30" font-weight="800" font-family="Lora, Georgia, serif" fill="#2c5454">$35,000</text>
<text x="508" y="250" text-anchor="middle" font-size="13" fill="#5c5c5c">per year, faster counts</text>

<text x="659" y="215" text-anchor="middle" font-size="34" font-weight="800" fill="#b6ac97">=</text>

<rect x="684" y="140" width="436" height="124" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2.4"/>
<text x="902" y="176" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">ANNUAL LABOR SAVED</text>
<text x="902" y="226" text-anchor="middle" font-size="34" font-weight="800" font-family="Lora, Georgia, serif" fill="#1f6f3a">$145,000</text>
<text x="902" y="251" text-anchor="middle" font-size="13" fill="#5c5c5c">recovered every year</text>

<!-- Band 2: + ghost savings and - investment -->
<rect x="80" y="300" width="520" height="120" rx="14" fill="#f2f8f3" stroke="#c4e0cd" stroke-width="1.6"/>
<text x="112" y="336" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">+ GHOST-ASSET WRITE-DOWN</text>
<text x="112" y="382" font-size="27" font-weight="800" font-family="Lora, Georgia, serif" fill="#1f6f3a">$50,000-100,000</text>
<text x="112" y="406" font-size="12.5" fill="#5c5c5c">per year — corrects depreciation, property tax and insurance</text>

<rect x="640" y="300" width="480" height="120" rx="14" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.6"/>
<text x="672" y="336" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#4a5568">&#8722; FIRST-YEAR RFID INVESTMENT</text>
<text x="672" y="382" font-size="27" font-weight="800" font-family="Lora, Georgia, serif" fill="#4a5568">$120,000</text>
<text x="672" y="406" font-size="12.5" fill="#5c5c5c">tags, readers, software and services</text>

<!-- Result banner -->
<rect x="80" y="452" width="1040" height="76" rx="20" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
<text x="140" y="486" font-size="14" font-weight="800" letter-spacing="0.6" fill="#6d5a3a">PAYBACK</text>
<text x="140" y="508" font-size="12.5" fill="#8a7a53">labor + ghost assets alone</text>
<text x="700" y="502" text-anchor="middle" font-size="32" font-weight="800" font-family="Lora, Georgia, serif" fill="#1f6f3a">Under 12 months</text>

<text x="600" y="576" text-anchor="middle" font-size="14" fill="#4f4f4f">Finance accepts the format because every line ties to the depreciation schedule and the labor rate.</text>
</svg>
