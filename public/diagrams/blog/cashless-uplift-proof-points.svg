<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Published cashless RFID spending-uplift benchmarks buyers can cite</title>
<desc id="d">Three published benchmarks. Glownet reports up to 30% higher revenue per guest. Tappit cites a 22% average increase in event takings. Finn's Beach Club in Bali reported 30% more spend per head. Plus the breakage bonus: 5 to 15 percent of preloaded credit goes unredeemed, netting the organiser roughly 1 to 3 percent incremental revenue even after refunds, before the per-transaction lift is counted.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PUBLISHED UPLIFT BENCHMARKS</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">What platforms and venues actually report — for the CFO who wants more than marketing.</text>

<!-- card 1 Glownet -->
<rect x="88" y="152" width="330" height="248" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="88" y="152" width="330" height="8" rx="4" fill="#3d6b6b"/>
<text x="253" y="206" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">REPORTS</text>
<text x="253" y="268" text-anchor="middle" font-size="42" font-weight="800" fill="#1f6f3a">up to 30%</text>
<text x="253" y="312" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Glownet</text>
<text x="253" y="340" text-anchor="middle" font-size="12.5" fill="#5c5c5c">higher revenue per guest</text>

<!-- card 2 Tappit -->
<rect x="435" y="152" width="330" height="248" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="435" y="152" width="330" height="8" rx="4" fill="#234a4a"/>
<text x="600" y="206" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">REPORTS</text>
<text x="600" y="270" text-anchor="middle" font-size="46" font-weight="800" fill="#1f6f3a">22%</text>
<text x="600" y="312" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Tappit</text>
<text x="600" y="340" text-anchor="middle" font-size="12.5" fill="#5c5c5c">avg increase in event takings</text>

<!-- card 3 Finn's -->
<rect x="782" y="152" width="330" height="248" rx="14" fill="#ffffff" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="782" y="152" width="330" height="8" rx="4" fill="#c39a5f"/>
<text x="947" y="206" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">REPORTS</text>
<text x="947" y="270" text-anchor="middle" font-size="46" font-weight="800" fill="#1f6f3a">30%</text>
<text x="947" y="312" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Finn's Beach Club</text>
<text x="947" y="340" text-anchor="middle" font-size="12.5" fill="#5c5c5c">more spend per head · Bali</text>

<!-- breakage callout -->
<rect x="100" y="424" width="1000" height="104" rx="12" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.6"/>
<rect x="100" y="424" width="9" height="104" rx="4" fill="#c39a5f"/>
<text x="132" y="456" font-size="14" font-weight="800" letter-spacing="0.5" fill="#8a6d34">THE BREAKAGE BONUS</text>
<text x="132" y="482" font-size="13" fill="#5c5c5c">5-15% of preloaded credit goes unredeemed — netting the organiser roughly 1-3% incremental revenue</text>
<text x="132" y="504" font-size="13" fill="#5c5c5c">even after refund processing, before the per-transaction lift is counted.</text>

<text x="600" y="566" text-anchor="middle" font-size="14" fill="#5c5c5c">Different sources, same direction: the tap reliably moves per-guest spend by double digits.</text>
</svg>
