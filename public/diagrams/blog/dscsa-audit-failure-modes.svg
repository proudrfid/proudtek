<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="failt faild" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="failt">Where wholesalers actually fail DSCSA Phase 3 audits</title>
<desc id="faild">Five failure modes account for most post-2025 wholesaler audit findings: EPCIS data-quality drift fixed by daily GTIN-versus-NDC and lot-versus-expiry reconciliation; trading-partner authorization gaps fixed by an in-house ATP master refreshed every 90 days or sooner; the 24-hour saleable-returns clock at 5,000 to 50,000 units per day fixed by automated Verification Router Service integration; AS2 and EPCIS connectivity drift causing 1 to 5 percent silent message failures fixed by a dashboard with 24-hour alerting; and suspect-product handling requiring quarantine within hours, investigation within 6 to 7 days, and reporting to the FDA.</desc>
<defs><radialGradient id="failbg" cx="50%" cy="18%" r="95%"><stop offset="0%" stop-color="#f8f0df"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#failbg)"/>
<rect x="20" y="20" width="1160" height="635" rx="24" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600.0" y="58" text-anchor="middle" font-size="25" font-weight="800" fill="#6d5a3a" letter-spacing="1.3">WHERE WHOLESALERS FAIL PHASE 3 AUDITS</text>
<line x1="150" y1="74" x2="1050" y2="74" stroke="#c39a5f" stroke-width="1.4" stroke-linecap="round"/><g opacity="0.4"><line x1="150" y1="74" x2="1050" y2="74" stroke="#c39a5f" stroke-width="1.4" stroke-linecap="round"/></g>
<rect x="51.0" y="112" width="350" height="150" rx="18" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2" stroke-opacity="0.35"/><rect x="51.0" y="112" width="350" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="85.0" cy="152" r="17" fill="#3d6b6b"/>
<line x1="78.0" y1="152" x2="92.0" y2="152" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<line x1="85.0" y1="145" x2="85.0" y2="159" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<text x="113.0" y="158" text-anchor="start" font-size="17.5" font-weight="800" fill="#291c0e">EPCIS data-quality drift</text>
<text x="75.0" y="184" text-anchor="start" font-size="13" font-weight="500" fill="#4f4f4f">GTIN, lot or expiry mismatch between the</text>
<text x="75.0" y="202" text-anchor="start" font-size="13" font-weight="500" fill="#4f4f4f">EPCIS event and the printed case.</text>
<rect x="69.0" y="216" width="314" height="30" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.4" stroke-opacity="0.5"/>
<text x="226.0" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#3d6b6b">Fix: reconcile GTIN-vs-NDC daily</text>
<rect x="425.0" y="112" width="350" height="150" rx="18" fill="#faf4e8" stroke="#c39a5f" stroke-width="2" stroke-opacity="0.35"/><rect x="425.0" y="112" width="350" height="8" rx="4" fill="#c39a5f"/>
<circle cx="459.0" cy="152" r="17" fill="#c39a5f"/>
<line x1="452.0" y1="152" x2="466.0" y2="152" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<line x1="459.0" y1="145" x2="459.0" y2="159" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<text x="487.0" y="158" text-anchor="start" font-size="17.5" font-weight="800" fill="#291c0e">Trading-partner ATP gaps</text>
<text x="449.0" y="184" text-anchor="start" font-size="13" font-weight="500" fill="#4f4f4f">Receiving from a non-Authorized Trading</text>
<text x="449.0" y="202" text-anchor="start" font-size="13" font-weight="500" fill="#4f4f4f">Partner inherits their violation.</text>
<rect x="443.0" y="216" width="314" height="30" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.4" stroke-opacity="0.5"/>
<text x="600.0" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#c39a5f">Fix: ATP master, refresh &lt;=90 days</text>
<rect x="799.0" y="112" width="350" height="150" rx="18" fill="#fbeeee" stroke="#8b2d2d" stroke-width="2" stroke-opacity="0.35"/><rect x="799.0" y="112" width="350" height="8" rx="4" fill="#8b2d2d"/>
