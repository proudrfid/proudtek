<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How an RFID card works: coil, chip, and a borrowed jolt of power</title>
<desc id="d">A card containing an antenna coil and a small gold chip sits opposite a reader. A gold arrow from reader to card is labelled power, borrowed at tap time; a teal arrow from card to reader is labelled reply, by load modulation. Three stat pills underneath read: 0 batteries on the card, 2 parts — coil plus chip, and 50 to 200 milliseconds per complete tap.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<marker id="agold" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#c39a5f"/></marker>
<marker id="ateal" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#3d6b6b"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NO BATTERY · TWO PARTS · ONE INVISIBLE HANDSHAKE</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">How an RFID card actually works</text>

<rect x="100" y="210" width="380" height="240" rx="18" fill="#f9f1e2" stroke="#c39a5f" stroke-width="2.5"/>
<rect x="126" y="236" width="328" height="188" rx="12" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="148" y="258" width="284" height="144" rx="10" fill="none" stroke="#6f9b9b" stroke-width="2"/>
<rect x="170" y="280" width="240" height="100" rx="8" fill="none" stroke="#a3c0c0" stroke-width="2"/>
<rect x="272" y="308" width="52" height="42" rx="6" fill="#d4a755" stroke="#6d5a3a" stroke-width="1.5"/>
<line x1="258" y1="318" x2="272" y2="318" stroke="#6d5a3a" stroke-width="2"/>
<line x1="258" y1="330" x2="272" y2="330" stroke="#6d5a3a" stroke-width="2"/>
<line x1="258" y1="342" x2="272" y2="342" stroke="#6d5a3a" stroke-width="2"/>
<line x1="324" y1="318" x2="338" y2="318" stroke="#6d5a3a" stroke-width="2"/>
<line x1="324" y1="330" x2="338" y2="330" stroke="#6d5a3a" stroke-width="2"/>
<line x1="324" y1="342" x2="338" y2="342" stroke="#6d5a3a" stroke-width="2"/>

<path d="M 524 300 a 30 30 0 0 1 0 60" fill="none" stroke="#7ea6a6" stroke-width="2.5"/>
<path d="M 546 285 a 45 45 0 0 1 0 90" fill="none" stroke="#b7cfcf" stroke-width="2"/>

<line x1="840" y1="265" x2="516" y2="265" stroke="#c39a5f" stroke-width="3" marker-end="url(#agold)"/>
<text x="678" y="246" text-anchor="middle" font-size="14" font-weight="600" fill="#6d5a3a">power, borrowed at tap time</text>
<line x1="516" y1="395" x2="840" y2="395" stroke="#3d6b6b" stroke-width="3" marker-end="url(#ateal)"/>
<text x="678" y="426" text-anchor="middle" font-size="14" font-weight="600" fill="#2c5454">reply, by load modulation</text>

<rect x="860" y="195" width="230" height="270" rx="16" fill="#ffffff" stroke="#4a5568" stroke-width="2.5"/>
<rect x="884" y="222" width="182" height="110" rx="8" fill="#eef1f5"/>
<circle cx="948" cy="277" r="5" fill="#3d6b6b"/>
<path d="M 964 257 a 20 20 0 0 1 0 40" fill="none" stroke="#3d6b6b" stroke-width="3"/>
<path d="M 980 247 a 30 30 0 0 1 0 60" fill="none" stroke="#7ea6a6" stroke-width="3"/>
<rect x="884" y="356" width="182" height="12" rx="6" fill="#d3dae3"/>
<rect x="884" y="384" width="120" height="10" rx="5" fill="#e3e8ee"/>
<circle cx="1058" cy="428" r="7" fill="#1f6f3a"/>

<text x="290" y="494" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">The card: a coil, a chip, and nothing else</text>
<text x="975" y="494" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">The reader does all the shouting</text>

<rect x="105" y="534" width="300" height="66" rx="14" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
<rect x="450" y="534" width="300" height="66" rx="14" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
<rect x="795" y="534" width="300" height="66" rx="14" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
<text x="255" y="564" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="22" font-weight="700" fill="#6d5a3a">0</text>
<text x="255" y="588" text-anchor="middle" font-size="13" fill="#4f4f4f">batteries on the card</text>
<text x="600" y="564" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="22" font-weight="700" fill="#2c5454">2</text>
<text x="600" y="588" text-anchor="middle" font-size="13" fill="#4f4f4f">parts: coil + chip</text>
<text x="945" y="564" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="22" font-weight="700" fill="#2c5454">50–200 ms</text>
<text x="945" y="588" text-anchor="middle" font-size="13" fill="#4f4f4f">per complete tap</text>

<text x="600" y="640" text-anchor="middle" font-size="13" fill="#5c5c5c">Every joule the card uses is borrowed from the reader's electromagnetic field, the instant you tap.</text>
</svg>
