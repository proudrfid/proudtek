<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five credential families on 2026 key fob quotes and where each belongs</title>
<desc id="d">Five rows, one per credential family. HID Prox at 125 kHz: no encryption, clonable with a $15 duplicator — legacy installs on a known migration timeline only. HID iCLASS SE at 13.56 MHz: AES-128 with Secure Identity Object (SIO) — the middle ground for buildings already on multiCLASS SE readers. HID Seos at 13.56 MHz: AES-128 with Diffie-Hellman ECC — mobile access on iPhone and Android, standardized on HID Signo readers. MIFARE DESFire EV2/EV3 at 13.56 MHz: AES-128 and vendor-neutral from NXP — multi-source procurement and multi-application programs. NTAG 213/215/216 at 13.56 MHz NFC: no AES authentication — marketing, branding and loyalty only, with NTAG 424 DNA as the security-grade NFC option.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE 2026 QUOTE SHEET</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Five credential families and where each belongs</text>

<rect x="60" y="140" width="1080" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="72" y="150" width="6" height="56" rx="3" fill="#4a5568"/>
<text x="92" y="173" font-size="15.5" font-weight="800" fill="#291c0e">HID Prox</text>
<text x="92" y="195" font-size="12.5" fill="#6d5a3a">125 kHz</text>
<text x="420" y="183" font-size="13.5" font-weight="700" fill="#8b2d2d">No encryption — clonable with a $15 duplicator</text>
<text x="1116" y="173" text-anchor="end" font-size="12.5" fill="#4f4f4f">legacy installs on a known migration</text>
<text x="1116" y="193" text-anchor="end" font-size="12.5" fill="#4f4f4f">timeline — never the long-term choice</text>

<rect x="60" y="228" width="1080" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="72" y="238" width="6" height="56" rx="3" fill="#3d6b6b"/>
<text x="92" y="261" font-size="15.5" font-weight="800" fill="#291c0e">HID iCLASS SE</text>
<text x="92" y="283" font-size="12.5" fill="#6d5a3a">13.56 MHz</text>
<text x="420" y="271" font-size="13.5" font-weight="600" fill="#234a4a">AES-128 + Secure Identity Object (SIO)</text>
<text x="1116" y="261" text-anchor="end" font-size="12.5" fill="#4f4f4f">the middle ground for buildings</text>
<text x="1116" y="281" text-anchor="end" font-size="12.5" fill="#4f4f4f">already on multiCLASS SE readers</text>

<rect x="60" y="316" width="1080" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="72" y="326" width="6" height="56" rx="3" fill="#2c5454"/>
<text x="92" y="349" font-size="15.5" font-weight="800" fill="#291c0e">HID Seos</text>
<text x="92" y="371" font-size="12.5" fill="#6d5a3a">13.56 MHz</text>
<text x="420" y="359" font-size="13.5" font-weight="600" fill="#234a4a">AES-128 + Diffie-Hellman ECC, SIO wrapper</text>
<text x="1116" y="349" text-anchor="end" font-size="12.5" fill="#4f4f4f">mobile access on iPhone and Android,</text>
<text x="1116" y="369" text-anchor="end" font-size="12.5" fill="#4f4f4f">standardized on HID Signo readers</text>

<rect x="60" y="404" width="1080" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="72" y="414" width="6" height="56" rx="3" fill="#2d6a4f"/>
<text x="92" y="437" font-size="15.5" font-weight="800" fill="#291c0e">MIFARE DESFire EV2/EV3</text>
<text x="92" y="459" font-size="12.5" fill="#6d5a3a">13.56 MHz</text>
<text x="420" y="447" font-size="13.5" font-weight="600" fill="#234a4a">AES-128, vendor-neutral (NXP)</text>
<text x="1116" y="437" text-anchor="end" font-size="12.5" fill="#4f4f4f">multi-source procurement and</text>
<text x="1116" y="457" text-anchor="end" font-size="12.5" fill="#4f4f4f">multi-application programs</text>

<rect x="60" y="492" width="1080" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="72" y="502" width="6" height="56" rx="3" fill="#c39a5f"/>
<text x="92" y="525" font-size="15.5" font-weight="800" fill="#291c0e">NTAG 213/215/216</text>
<text x="92" y="547" font-size="12.5" fill="#6d5a3a">13.56 MHz NFC</text>
<text x="420" y="535" font-size="13.5" font-weight="700" fill="#8b2d2d">No AES authentication</text>
<text x="1116" y="525" text-anchor="end" font-size="12.5" fill="#4f4f4f">marketing, branding, loyalty only —</text>
<text x="1116" y="545" text-anchor="end" font-size="12.5" fill="#4f4f4f">NTAG 424 DNA for security-grade NFC</text>

<text x="600" y="620" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Same keyring, five very different conversations with the reader.</text>
</svg>
