<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five first-year RFID anti-counterfeiting pitfalls, each paired with its fix</title>
<desc id="d">Five failure states and their remedies. One, treating UID uniqueness as the whole defense — fix with a server-side whitelist tying UID to ticket to first scan. Two, no cryptographic authentication on high-value tickets — fix with SUN or mutual authentication on VIP credentials. Three, un-encoded wristbands shipped loose — fix by encoding in-house and sealing the chain of custody. Four, gate readers synced too slowly to lock out a clone — fix by locking the clone out in a second or two, not minutes. Five, no tamper-evident closure on the band — fix with one-way locks or breakaway clasps.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIRST-YEAR PITFALLS · RFID ALONE ISN'T ENOUGH</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">Five ways events still get counterfeited — and the fix for each.</text>

<text x="92" y="126" font-size="13" font-weight="800" letter-spacing="1" fill="#8b2d2d">COMMON PITFALL</text>
<text x="648" y="126" font-size="13" font-weight="800" letter-spacing="1" fill="#2c5454">THE FIX</text>

<!-- row 1 -->
<rect x="64" y="138" width="512" height="76" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="138" width="9" height="76" rx="4" fill="#8b2d2d"/>
<circle cx="100" cy="176" r="15" fill="#8b2d2d"/>
<text x="100" y="182" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="128" y="181" font-size="14" font-weight="700" fill="#291c0e">UID uniqueness treated as the whole defense</text>
<line x1="584" y1="176" x2="606" y2="176" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="606,171 616,176 606,181" fill="#291c0e"/>
<rect x="616" y="138" width="520" height="76" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="616" y="138" width="9" height="76" rx="4" fill="#3d6b6b"/>
<text x="648" y="181" font-size="14" font-weight="700" fill="#291c0e">Server-side whitelist: UID → ticket → first scan</text>

<!-- row 2 -->
<rect x="64" y="222" width="512" height="76" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="222" width="9" height="76" rx="4" fill="#8b2d2d"/>
<circle cx="100" cy="260" r="15" fill="#8b2d2d"/>
<text x="100" y="266" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="128" y="265" font-size="14" font-weight="700" fill="#291c0e">No cryptographic auth on high-value tickets</text>
<line x1="584" y1="260" x2="606" y2="260" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="606,255 616,260 606,265" fill="#291c0e"/>
<rect x="616" y="222" width="520" height="76" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="616" y="222" width="9" height="76" rx="4" fill="#3d6b6b"/>
<text x="648" y="265" font-size="14" font-weight="700" fill="#291c0e">SUN or mutual auth on VIP credentials</text>

<!-- row 3 -->
<rect x="64" y="306" width="512" height="76" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="306" width="9" height="76" rx="4" fill="#8b2d2d"/>
<circle cx="100" cy="344" r="15" fill="#8b2d2d"/>
<text x="100" y="350" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="128" y="349" font-size="14" font-weight="700" fill="#291c0e">Un-encoded wristbands shipped loose</text>
<line x1="584" y1="344" x2="606" y2="344" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="606,339 616,344 606,349" fill="#291c0e"/>
<rect x="616" y="306" width="520" height="76" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="616" y="306" width="9" height="76" rx="4" fill="#3d6b6b"/>
<text x="648" y="349" font-size="14" font-weight="700" fill="#291c0e">Encode in-house; seal the chain of custody</text>

<!-- row 4 -->
<rect x="64" y="390" width="512" height="76" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="390" width="9" height="76" rx="4" fill="#8b2d2d"/>
<circle cx="100" cy="428" r="15" fill="#8b2d2d"/>
<text x="100" y="434" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="128" y="433" font-size="14" font-weight="700" fill="#291c0e">Gate readers synced too slowly</text>
<line x1="584" y1="428" x2="606" y2="428" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="606,423 616,428 606,433" fill="#291c0e"/>
<rect x="616" y="390" width="520" height="76" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="616" y="390" width="9" height="76" rx="4" fill="#3d6b6b"/>
<text x="648" y="433" font-size="14" font-weight="700" fill="#291c0e">Lock the clone out in a second or two, not minutes</text>

<!-- row 5 -->
<rect x="64" y="474" width="512" height="76" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="474" width="9" height="76" rx="4" fill="#8b2d2d"/>
<circle cx="100" cy="512" r="15" fill="#8b2d2d"/>
<text x="100" y="518" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
<text x="128" y="517" font-size="14" font-weight="700" fill="#291c0e">No tamper-evident closure on the band</text>
<line x1="584" y1="512" x2="606" y2="512" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="606,507 616,512 606,517" fill="#291c0e"/>
<rect x="616" y="474" width="520" height="76" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="616" y="474" width="9" height="76" rx="4" fill="#3d6b6b"/>
<text x="648" y="517" font-size="14" font-weight="700" fill="#291c0e">One-way locks or breakaway clasps</text>

<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#5c5c5c">RFID shifts the attack surface; it doesn't remove it. Each fix closes a gap the chip alone leaves open.</text>
</svg>
