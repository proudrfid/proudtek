<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The two-part design brief for a circular-economy RFID tag</title>
<desc id="d">Two constraint panels. First, survive the life: the tag must stay readable through years of consumer use, washing and wearing so it can still be read for end-of-life decisions. Second, exit cleanly: the tag should be paper-based or bio-based and must not contaminate the host product's recycling stream. A footer shows the dual-technology split — UHF for supply chain and recycling sortation, NFC for consumer information and Digital Product Passport access, with GS1 EPCIS for interoperability.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE TAG'S SECOND BRIEF</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="33" font-weight="700" fill="#291c0e">Survive the whole life, then leave cleanly</text>
<text x="600" y="134" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Circular RFID must not contaminate the very product it was meant to help recycle.</text>

<!-- PANEL 1: survive -->
<rect x="64" y="168" width="524" height="336" rx="16" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.8"/>
<circle cx="104" cy="208" r="18" fill="#2d6a4f"/><text x="104" y="214" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">1</text>
<text x="136" y="204" font-size="17" font-weight="800" letter-spacing="0.3" fill="#1b4332">SURVIVE THE LIFE</text>
<text x="136" y="226" font-size="12.5" fill="#3f7d55">stay readable end to end</text>
<line x1="88" y1="248" x2="564" y2="248" stroke="#cfe0d6" stroke-width="1.4"/>
<rect x="96" y="270" width="140" height="34" rx="17" fill="#ffffff" stroke="#a9cbb8" stroke-width="1.4"/>
<text x="166" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#1b4332">years of use</text>
<rect x="250" y="270" width="120" height="34" rx="17" fill="#ffffff" stroke="#a9cbb8" stroke-width="1.4"/>
<text x="310" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#1b4332">washing</text>
<rect x="384" y="270" width="120" height="34" rx="17" fill="#ffffff" stroke="#a9cbb8" stroke-width="1.4"/>
<text x="444" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#1b4332">wearing</text>
<text x="96" y="344" font-size="14" font-weight="700" fill="#291c0e">Readable across the product's entire useful life —</text>
<text x="96" y="366" font-size="14" font-weight="700" fill="#291c0e">years, not seasons.</text>
<text x="96" y="404" font-size="13.5" fill="#4f4f4f">If the tag dies mid-life, the end-of-life routing</text>
<text x="96" y="424" font-size="13.5" fill="#4f4f4f">decision dies with it.</text>
<text x="96" y="470" font-size="12.5" fill="#3f7d55">durability = the recycling read still works years later</text>

<!-- PANEL 2: exit cleanly -->
<rect x="612" y="168" width="524" height="336" rx="16" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.8"/>
<circle cx="652" cy="208" r="18" fill="#2d6a4f"/><text x="652" y="214" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">2</text>
<text x="684" y="204" font-size="17" font-weight="800" letter-spacing="0.3" fill="#1b4332">EXIT CLEANLY</text>
<text x="684" y="226" font-size="12.5" fill="#3f7d55">get out of the way at end of life</text>
<line x1="636" y1="248" x2="1112" y2="248" stroke="#cfe0d6" stroke-width="1.4"/>
<!-- paper tag glyph -->
<path d="M660 276 L740 276 L740 340 L660 340 Z" fill="#ffffff" stroke="#a9cbb8" stroke-width="1.6"/>
<circle cx="672" cy="288" r="4.5" fill="none" stroke="#a9cbb8" stroke-width="1.5"/>
<text x="700" y="316" text-anchor="middle" font-size="12" fill="#3f7d55">paper /</text>
<text x="700" y="332" text-anchor="middle" font-size="12" fill="#3f7d55">bio-based</text>
<text x="770" y="300" font-size="14" font-weight="700" fill="#291c0e">Paper-based or bio-based tag</text>
<text x="770" y="322" font-size="14" font-weight="700" fill="#291c0e">materials, not mixed plastics.</text>
<text x="660" y="384" font-size="14" font-weight="700" fill="#291c0e">Must not contaminate the host product's</text>
<text x="660" y="406" font-size="14" font-weight="700" fill="#291c0e">recycling stream.</text>
<text x="660" y="452" font-size="12.5" fill="#3f7d55">a tag that fouls the recycling stream is worse than none</text>

<!-- dual-tech footer -->
<rect x="64" y="524" width="1072" height="72" rx="14" fill="#fbf8f1" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="92" y="552" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DUAL-TECHNOLOGY</text>
<text x="92" y="578" font-size="14.5" font-weight="800" fill="#1b4332">UHF</text>
<text x="140" y="578" font-size="13.5" fill="#4f4f4f">supply chain + recycling sortation</text>
<line x1="470" y1="540" x2="470" y2="582" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="500" y="578" font-size="14.5" font-weight="800" fill="#1b4332">NFC</text>
<text x="548" y="578" font-size="13.5" fill="#4f4f4f">consumer info + DPP access</text>
<line x1="838" y1="540" x2="838" y2="582" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="868" y="578" font-size="13.5" fill="#4f4f4f">GS1 EPCIS = interoperability</text>
</svg>
