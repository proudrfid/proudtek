<circle cx="600" cy="319" r="33" fill="#291c0e" stroke="#d4a755" stroke-width="3"/>
<text x="600" y="328" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="24" font-weight="700" fill="#ffffff">VS</text>

