<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="tuTitle tuDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="tuTitle">Proud Tek website terms — an informational RFID site versus the binding sales contract</title>
  <desc id="tuDesc">Two panels. On the left, THIS SITE: an RFID reader scanning a smart card, standing for the product specs and prices published to help buyers scope a project — an invitation to inquire, not a binding offer. On the right, YOUR ORDER: a signed sales contract or proforma invoice, which is what actually governs price, specifications, delivery and warranty. A central divider marked "not the same" separates them. Footer: confirm any spec that matters in writing before ordering; site content is Proud Tek's, third-party marks are credited, and these terms are governed by the laws of the People's Republic of China.</desc>

  <defs>
    <radialGradient id="tuGlow" cx="50%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="tuWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a755"/>
      <stop offset="100%" stop-color="#c39a5f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#tuGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="74" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="3" fill="#6d5a3a">WEBSITE TERMS  ·  WHAT THIS SITE PROMISES  ·  GOVERNING LAW</text>

  <!-- ===================== LEFT: THIS SITE (RFID) ===================== -->
  <rect x="70" y="118" width="468" height="384" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <!-- header -->
  <circle cx="126" cy="182" r="33" fill="#c39a5f"/>
  <!-- rfid waves glyph -->
  <circle cx="119" cy="194" r="2.6" fill="#ffffff"/>
  <path d="M119 186 a8 8 0 0 1 8 8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M119 180 a14 14 0 0 1 14 14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M119 174 a20 20 0 0 1 20 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="178" y="176" font-size="26" font-weight="800" fill="#291c0e">THIS SITE</text>
  <text x="178" y="203" font-size="15.5" fill="#6d5a3a">Informational — helps you scope</text>
  <line x1="94" y1="228" x2="514" y2="228" stroke="#ece5d8" stroke-width="2"/>

  <!-- RFID scene: card -> scan waves -> reader -->
  <!-- smart card -->
  <rect x="104" y="300" width="140" height="92" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
  <rect x="112" y="308" width="124" height="76" rx="8" fill="none" stroke="#eddcbb" stroke-width="1.4"/>
  <rect x="120" y="322" width="32" height="26" rx="4" fill="#e4c98f" stroke="#b8935a" stroke-width="1.5"/>
  <line x1="120" y1="331" x2="152" y2="331" stroke="#b8935a" stroke-width="1.3"/>
  <line x1="136" y1="322" x2="136" y2="348" stroke="#b8935a" stroke-width="1.3"/>
  <rect x="120" y="360" width="104" height="7" rx="3.5" fill="#f0e3c6"/>
  <!-- scan waves emanating from the card -->
  <path d="M269.3 330.6 A26 26 0 0 1 269.3 365.4" fill="none" stroke="#c39a5f" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M279.7 321.2 A40 40 0 0 1 279.7 374.8" fill="none" stroke="#c39a5f" stroke-width="4" stroke-linecap="round" opacity="0.78"/>
  <path d="M290.1 311.9 A54 54 0 0 1 290.1 384.1" fill="none" stroke="#c39a5f" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <!-- reader -->
  <rect x="360" y="300" width="112" height="96" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
  <rect x="374" y="315" width="84" height="46" rx="6" fill="#f5e8ca" stroke="#e4c98f" stroke-width="1.5"/>
  <path d="M406 338 l6 6 l12 -14" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="416" cy="379" r="8" fill="#c39a5f"/>

  <text x="104" y="432" font-size="16.5" font-weight="600" fill="#291c0e">Specs &amp; prices help you scope a project —</text>
  <text x="104" y="458" font-size="16.5" fill="#6d5a3a">an invitation to inquire, not a binding offer.</text>

  <!-- ===================== CENTER: NOT THE SAME ===================== -->
  <rect x="588" y="118" width="24" height="384" rx="12" fill="url(#tuWall)"/>
  <circle cx="600" cy="300" r="52" fill="#fbf5ea" stroke="#e4c98f" stroke-width="2"/>
  <text x="600" y="318" text-anchor="middle" font-size="52" font-weight="800" fill="#291c0e">&#8800;</text>
  <rect x="522" y="359" width="156" height="30" rx="15" fill="#291c0e"/>
  <text x="600" y="379" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#ffffff">NOT THE SAME</text>

  <!-- ===================== RIGHT: YOUR ORDER (CONTRACT) ===================== -->
  <rect x="662" y="118" width="468" height="384" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <!-- header -->
  <circle cx="718" cy="182" r="33" fill="#3d6b6b"/>
  <!-- document glyph -->
  <path d="M706 168 H726 L734 176 V198 H706 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M726 168 V176 H734" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M712 182 H728 M712 188 H728 M712 194 H723" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="770" y="176" font-size="26" font-weight="800" fill="#291c0e">YOUR ORDER</text>
  <text x="770" y="203" font-size="15.5" fill="#6d5a3a">Binding — what you sign</text>
  <line x1="686" y1="228" x2="1106" y2="228" stroke="#ece5d8" stroke-width="2"/>

  <!-- contract document -->
  <path d="M744 288 H912 L940 316 V410 H744 Z" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M912 288 L940 316 L912 316 Z" fill="#eef3f1"/>
  <path d="M912 288 V316 H940" fill="none" stroke="#3d6b6b" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="768" y="324" font-size="16" font-weight="700" letter-spacing="1" fill="#3d6b6b">SALES CONTRACT</text>
  <path d="M768 346 H916 M768 364 H916 M768 382 H872" stroke="#d3ddda" stroke-width="5" stroke-linecap="round"/>
  <path d="M772 399 c 9 -14 17 11 26 -2 c 7 -10 13 8 21 -3 c 6 -8 15 6 23 -2" fill="none" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="903" cy="390" r="19" fill="#eaf3ec" stroke="#1f6f3a" stroke-width="2"/>
  <path d="M893 390 l7 7 l12 -14" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="696" y="432" font-size="16.5" font-weight="600" fill="#291c0e">Price, specs, delivery &amp; warranty are set by</text>
  <text x="696" y="458" font-size="16.5" fill="#6d5a3a">the sales contract or proforma invoice you sign.</text>

  <!-- ===================== FOOTER ===================== -->
  <text x="600" y="556" text-anchor="middle" font-size="18" fill="#4f4f4f">The website scopes your project. The contract you sign governs the purchase —</text>
  <text x="600" y="582" text-anchor="middle" font-size="18" fill="#4f4f4f">so confirm any spec that matters in writing before you order.</text>
  <text x="600" y="614" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1" fill="#8a7a5a">SITE CONTENT © PROUD TEK   ·   THIRD-PARTY MARKS CREDITED   ·   GOVERNED BY THE LAWS OF THE P.R. CHINA</text>
</svg>
