<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Pallet pool cycle — one nail, 100-150 trips</title>
<desc id="d">Circular flow of a pooled pallet: encode, dock-door portal, field trip, return and re-issue, annotated with capture rate and service life.</desc>
<rect width="1200" height="675" fill="#f8f6f1"/>
<text x="60" y="64" font-family="Georgia, serif" font-size="34" fill="#291c0e">One nail outlasts 100-150 trips</text>
<text x="60" y="98" font-family="Verdana, sans-serif" font-size="16" fill="#6d5a3a">The pool pallet loop — 5-7 years of service on a single driven serial</text>
<g font-family="Verdana, sans-serif">
<rect x="130" y="170" width="250" height="96" rx="10" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<text x="150" y="200" font-size="16" fill="#291c0e" font-family="Georgia, serif">Encode + drive</text>
<text x="150" y="224" font-size="12.5" fill="#6d5a3a">GRAI-96 returnable-asset serial</text>
<text x="150" y="243" font-size="12.5" fill="#6d5a3a">nailed at the stringer</text>
<rect x="700" y="170" width="290" height="96" rx="10" fill="#eef2f0" stroke="#2c5454" stroke-width="2.5"/>
<text x="720" y="200" font-size="16" fill="#291c0e" font-family="Georgia, serif">Dock-door portal</text>
<text x="720" y="224" font-size="12.5" fill="#2c5454">99 percent capture at forklift</text>
<text x="720" y="243" font-size="12.5" fill="#2c5454">speeds up to 10 km/h</text>
<rect x="700" y="420" width="290" height="96" rx="10" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<text x="720" y="450" font-size="16" fill="#291c0e" font-family="Georgia, serif">Trip + return</text>
<text x="720" y="474" font-size="12.5" fill="#6d5a3a">EPCIS: shipping, receiving,</text>
<text x="720" y="493" font-size="12.5" fill="#6d5a3a">returning — per-trip history</text>
<rect x="130" y="420" width="250" height="96" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<text x="150" y="450" font-size="16" fill="#291c0e" font-family="Georgia, serif">Re-issue</text>
<text x="150" y="474" font-size="12.5" fill="#6d5a3a">same serial, next load —</text>
<text x="150" y="493" font-size="12.5" fill="#6d5a3a">no relabelling station</text>
<path d="M380 218 L692 218" stroke="#6d5a3a" stroke-width="2.5" fill="none"/>
<path d="M692 218 l-10 -5 v10 z" fill="#6d5a3a"/>
<path d="M845 266 L845 412" stroke="#6d5a3a" stroke-width="2.5" fill="none"/>
<path d="M845 412 l-5 -10 h10 z" fill="#6d5a3a"/>
<path d="M700 468 L388 468" stroke="#6d5a3a" stroke-width="2.5" fill="none"/>
<path d="M388 468 l10 -5 v10 z" fill="#6d5a3a"/>
<path d="M255 420 L255 274" stroke="#6d5a3a" stroke-width="2.5" fill="none"/>
<path d="M255 274 l-5 10 h10 z" fill="#6d5a3a"/>
<rect x="60" y="560" width="512" height="76" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="84" y="592" font-size="24" font-family="Georgia, serif" fill="#6d5a3a">300M+ pallets</text>
<text x="84" y="618" font-size="13" fill="#6d5a3a">circulate in global pools — CHEP, EPAL, iGPS, PECO class fleets</text>
<rect x="608" y="560" width="512" height="76" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="632" y="592" font-size="17" font-family="Georgia, serif" fill="#291c0e">Beyond pallets</text>
<text x="632" y="618" font-size="13" fill="#6d5a3a">railroad ties, utility poles, sawmill logs, whiskey barrels — same nail, different forest</text>
</g>
</svg>
