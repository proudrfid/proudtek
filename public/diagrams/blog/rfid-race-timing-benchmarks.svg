<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Published major-marathon timing benchmarks</title>
<desc id="d">Six benchmark tiles drawn from published major-marathon timing figures. Detection rate above 99.8 percent on the MYLAPS BibTag decoder. Timing resolution of 0.01 seconds. Maximum passing speed of 40 kilometres per hour, or 25 miles per hour. Split-mat coverage at 5K, 10K, the half, 30K and 40K at major marathons. Cost of 0.10 to 0.30 dollars per disposable UHF chip-on-bib tag. Timing as under 2 percent of the race budget.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MAJOR-MARATHON BENCHMARKS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Published numbers you can hold a vendor to — and hit at sub-elite scale.</text>

<rect x="40" y="160" width="348" height="150" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="434" y="160" width="348" height="150" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="828" y="160" width="348" height="150" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="40" y="336" width="348" height="150" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="434" y="336" width="348" height="150" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="828" y="336" width="348" height="150" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>

<text x="214" y="238" text-anchor="middle" font-size="40" font-weight="800" fill="#3d6b6b">&gt;99.8%</text>
<text x="214" y="270" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Detection rate</text>
<text x="214" y="290" text-anchor="middle" font-size="12.5" fill="#8a8a8a">MYLAPS BibTag decoder</text>

<text x="608" y="238" text-anchor="middle" font-size="40" font-weight="800" fill="#3d6b6b">0.01 s</text>
<text x="608" y="270" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Timing resolution</text>
<text x="608" y="290" text-anchor="middle" font-size="12.5" fill="#8a8a8a">a hundredth of a second</text>

<text x="1002" y="238" text-anchor="middle" font-size="40" font-weight="800" fill="#3d6b6b">40 km/h</text>
<text x="1002" y="270" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Max passing speed</text>
<text x="1002" y="290" text-anchor="middle" font-size="12.5" fill="#8a8a8a">(25 mph)</text>

<text x="214" y="416" text-anchor="middle" font-size="21" font-weight="800" fill="#3d6b6b">5K·10K·Half·30K·40K</text>
<text x="214" y="446" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Split-mat coverage</text>
<text x="214" y="466" text-anchor="middle" font-size="12.5" fill="#8a8a8a">at major marathons</text>

<text x="608" y="414" text-anchor="middle" font-size="38" font-weight="800" fill="#1f6f3a">$0.10–$0.30</text>
<text x="608" y="446" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Per disposable</text>
<text x="608" y="466" text-anchor="middle" font-size="12.5" fill="#8a8a8a">UHF chip-on-bib tag</text>

<text x="1002" y="414" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6f3a">&lt; 2%</text>
<text x="1002" y="446" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Timing as a share</text>
<text x="1002" y="466" text-anchor="middle" font-size="12.5" fill="#8a8a8a">of race budget</text>

<text x="600" y="538" text-anchor="middle" font-size="14.5" fill="#4f4f4f">If a timer can't match these on your course, ask why — this is table stakes, not a stretch goal.</text>
</svg>
