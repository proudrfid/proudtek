<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Three race-timing tag formats compared</title>
<desc id="d">A comparison table of three tag formats across four attributes. Disposable chip-on-bib UHF costs 0.10 to 0.30 dollars per runner, reads above 99.8 percent, is disposable, and suits big road races. Active shoe transponders cost 3 to 8 dollars, read 99.9 percent or better, are reusable, and suit professional or premium events. Passive HF shoe chips are reusable, read very high on established systems, and suit legacy setups.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THREE TAG FORMATS, THREE TRADE-OFFS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The format is the real choice — the mat and reader barely change.</text>

<rect x="270" y="150" width="290" height="380" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="582" y="150" width="290" height="380" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="894" y="150" width="290" height="380" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="270" y="150" width="290" height="54" rx="12" fill="#3d6b6b"/>
<rect x="582" y="150" width="290" height="54" rx="12" fill="#c39a5f"/>
<rect x="894" y="150" width="290" height="54" rx="12" fill="#4a5568"/>
<text x="415" y="184" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">CHIP-ON-BIB UHF</text>
<text x="727" y="184" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">ACTIVE SHOE TAG</text>
<text x="1039" y="184" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">PASSIVE HF SHOE</text>

<line x1="270" y1="300" x2="1184" y2="300" stroke="#efe7d6" stroke-width="1.5"/>
<line x1="270" y1="378" x2="1184" y2="378" stroke="#efe7d6" stroke-width="1.5"/>
<line x1="270" y1="456" x2="1184" y2="456" stroke="#efe7d6" stroke-width="1.5"/>

<text x="242" y="268" text-anchor="end" font-size="12.5" font-weight="700" fill="#6d5a3a">COST / RUNNER</text>
<text x="242" y="346" text-anchor="end" font-size="12.5" font-weight="700" fill="#6d5a3a">READ RATE</text>
<text x="242" y="424" text-anchor="end" font-size="12.5" font-weight="700" fill="#6d5a3a">TAG LIFE</text>
<text x="242" y="502" text-anchor="end" font-size="12.5" font-weight="700" fill="#6d5a3a">BEST FOR</text>

<text x="415" y="268" text-anchor="middle" font-size="17" font-weight="800" fill="#1f6f3a">$0.10–$0.30</text>
<text x="727" y="268" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">$3–$8</text>
<text x="1039" y="268" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">reusable</text>
<text x="415" y="346" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">&gt;99.8%</text>
<text x="727" y="346" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">99.9%+</text>
<text x="1039" y="346" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">very high</text>
<text x="415" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#4f4f4f">disposable</text>
<text x="727" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#4f4f4f">reusable</text>
<text x="1039" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#4f4f4f">reusable</text>
<text x="415" y="502" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">big road races</text>
<text x="727" y="502" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">pro / premium</text>
<text x="1039" y="502" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">legacy setups</text>

<text x="600" y="574" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Most road races run chip-on-bib UHF on price; shoe transponders buy reliability where the unit cost earns it.</text>
</svg>
