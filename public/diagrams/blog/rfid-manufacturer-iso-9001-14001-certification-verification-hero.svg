<rect x="947" y="210" width="175" height="30" rx="15" fill="#ffffff" stroke="#d9a89e"/>
<text x="1034" y="230" text-anchor="middle" font-size="12.5" fill="#8b2d2d">no portal record ✗</text>
<line x1="931" y1="273" x2="947" y2="273" stroke="#d9a89e" stroke-width="1.5"/>
