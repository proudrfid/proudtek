<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="csTitle csDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="csTitle">What an apparel DPP program costs, by component and over time</title>
  <desc id="csDesc">A DPP program has four cost components. Physical tag: 5 to 15 cents per garment for basic NFC or QR labels, plus 20 to 50 cents each for NTAG 424 DNA secure tags. Backend platform: half a cent to two cents per active DPP per month, or a flat license of 30 to 200 thousand dollars a year. PLM and ERP integration: 50 to 300 thousand dollars one-time, plus half to two full-time staff for ongoing data governance. Audit and certification: 20 to 80 thousand dollars a year. The all-in cost per DPP starts at 30 to 80 cents in the first two years and trends down to 10 to 25 cents by year three as fixed costs amortize. Premium and luxury programs run higher because of advanced chips and deeper traceability.</desc>

  <defs>
    <radialGradient id="csGlow" cx="50%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#f9eed6"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="csSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#3a4656"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#csGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="3" fill="#b0894c">TAG + DATA + INTEGRATION LABOUR</text>
  <text x="600" y="92" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">What an apparel DPP program costs</text>

  <!-- LEFT: four cost components -->
  <text x="72" y="140" font-size="13" font-weight="700" letter-spacing="1.5" fill="#4a5568">FOUR COST COMPONENTS</text>

  <!-- 1 tag -->
  <g>
    <rect x="72" y="156" width="560" height="76" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="112" cy="194" r="19" fill="#2d6a4f"/><text x="112" y="200" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
    <text x="146" y="188" font-size="15" font-weight="800" fill="#291c0e">Physical tag</text>
    <text x="146" y="212" font-size="12" fill="#6d5a3a">basic NFC/QR label · +secure NTAG 424 DNA</text>
    <text x="612" y="184" text-anchor="end" font-size="15.5" font-weight="800" fill="#2d6a4f">$0.05–0.15</text>
    <text x="612" y="212" text-anchor="end" font-size="12.5" fill="#6d5a3a">+$0.20–0.50 secure</text>
  </g>
  <!-- 2 backend -->
  <g>
    <rect x="72" y="242" width="560" height="76" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="112" cy="280" r="19" fill="#4a5568"/><text x="112" y="286" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
    <text x="146" y="274" font-size="15" font-weight="800" fill="#291c0e">Backend platform</text>
    <text x="146" y="298" font-size="12" fill="#6d5a3a">SaaS per active DPP · or flat license</text>
    <text x="612" y="270" text-anchor="end" font-size="15.5" font-weight="800" fill="#4a5568">$0.005–0.02</text>
    <text x="612" y="298" text-anchor="end" font-size="12.5" fill="#6d5a3a">or $30K–200K / yr</text>
  </g>
  <!-- 3 integration -->
  <g>
    <rect x="72" y="328" width="560" height="76" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="112" cy="366" r="19" fill="#c39a5f"/><text x="112" y="372" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
    <text x="146" y="360" font-size="15" font-weight="800" fill="#291c0e">PLM / ERP integration</text>
    <text x="146" y="384" font-size="12" fill="#6d5a3a">first-time build · + 0.5–2 FTE governance</text>
    <text x="612" y="356" text-anchor="end" font-size="15.5" font-weight="800" fill="#a97f3f">$50K–300K</text>
    <text x="612" y="384" text-anchor="end" font-size="12.5" fill="#6d5a3a">one-time</text>
  </g>
  <!-- 4 audit -->
  <g>
    <rect x="72" y="414" width="560" height="76" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="112" cy="452" r="19" fill="#6c5127"/><text x="112" y="458" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4</text>
    <text x="146" y="446" font-size="15" font-weight="800" fill="#291c0e">Audit &amp; certification</text>
    <text x="146" y="470" font-size="12" fill="#6d5a3a">third-party data audit · EU submissions</text>
    <text x="612" y="442" text-anchor="end" font-size="15.5" font-weight="800" fill="#6c5127">$20K–80K</text>
    <text x="612" y="470" text-anchor="end" font-size="12.5" fill="#6d5a3a">per year</text>
  </g>

  <!-- RIGHT: all-in per-DPP trend -->
  <rect x="672" y="156" width="456" height="334" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="900" y="188" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">All-in cost per DPP</text>
  <text x="900" y="208" text-anchor="middle" font-size="11.5" fill="#6d5a3a">tier-1 benchmark · fixed costs amortize</text>

  <!-- trend arrow down -->
  <line x1="742" y1="270" x2="1058" y2="380" stroke="#c8b688" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round"/>
  <!-- node year 1-2 -->
  <circle cx="742" cy="270" r="12" fill="#8b5e2a"/>
  <text x="742" y="248" text-anchor="middle" font-size="19" font-weight="800" fill="#8b5e2a">$0.30–0.80</text>
  <text x="742" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#291c0e">Year 1–2</text>
  <!-- node year 3 -->
  <circle cx="1058" cy="380" r="12" fill="#1f6f3a"/>
  <text x="1058" y="358" text-anchor="middle" font-size="19" font-weight="800" fill="#1f6f3a">$0.10–0.25</text>
  <text x="1058" y="410" text-anchor="middle" font-size="12" font-weight="700" fill="#291c0e">Year 3</text>

  <rect x="700" y="430" width="400" height="44" rx="9" fill="#f5efe4"/>
  <text x="900" y="450" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6c5127">PREMIUM &amp; LUXURY RUN HIGHER</text>
  <text x="900" y="466" text-anchor="middle" font-size="11" fill="#6d5a3a">advanced chip + deeper traceability</text>

  <!-- footer -->
  <path d="M20 556 h1160 v77 a22 22 0 0 1 -22 22 h-1116 a22 22 0 0 1 -22 -22 z" fill="url(#csSteel)"/>
  <text x="600" y="600" text-anchor="middle" font-size="15.5" font-weight="800" fill="#ffffff">A 5-million-unit brand spends $250K–$2.5M a year on tags alone.</text>
  <text x="600" y="625" text-anchor="middle" font-size="12.5" fill="#c9d2df">The tag is the cheap part — data infrastructure and integration labour are where the budget actually goes.</text>
</svg>
