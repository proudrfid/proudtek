<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How a blank RFID card is encoded into a hotel room key at the front desk</title>
<desc id="d">A four-step front-desk encoding flow. Step one: the guest checks in and the Property Management System opens a reservation. Step two: the PMS sends an encode command to the desktop encoder over USB, serial or TCP/IP. Step three: the encoder writes an encrypted payload — room number, check-in and check-out time, access zones — to a sector or application on the chip. Step four: the card is ready in under 500 milliseconds. The lock later reads and authenticates that payload to grant or deny access, and each card can be re-encoded thousands of times.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FRONT-DESK ENCODING · CHECK-IN TO CREDENTIAL</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">How a blank card becomes a room key</text>
<text x="600" y="138" text-anchor="middle" font-size="16" fill="#4f4f4f">The PMS writes an encrypted payload to the chip in under half a second.</text>

<!-- Step 1 -->
<rect x="64" y="196" width="252" height="192" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="64" y="196" width="252" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="98" cy="238" r="17" fill="#3d6b6b"/>
<text x="98" y="243" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
<text x="128" y="243" font-size="16" font-weight="800" fill="#291c0e">Check-in</text>
<text x="88" y="292" font-size="13.5" fill="#4f4f4f">Guest arrives; the PMS</text>
<text x="88" y="312" font-size="13.5" fill="#4f4f4f">opens the reservation and</text>
<text x="88" y="332" font-size="13.5" fill="#4f4f4f">assigns a room.</text>

<!-- Step 2 -->
<rect x="356" y="196" width="252" height="192" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="356" y="196" width="252" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="390" cy="238" r="17" fill="#3d6b6b"/>
<text x="390" y="243" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<text x="420" y="243" font-size="16" font-weight="800" fill="#291c0e">Encode command</text>
<text x="380" y="292" font-size="13.5" fill="#4f4f4f">PMS signals the desktop</text>
<text x="380" y="312" font-size="13.5" fill="#4f4f4f">encoder over USB, serial</text>
<text x="380" y="332" font-size="13.5" fill="#4f4f4f">or TCP/IP.</text>

<!-- Step 3 -->
<rect x="648" y="196" width="252" height="192" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="648" y="196" width="252" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="682" cy="238" r="17" fill="#3d6b6b"/>
<text x="682" y="243" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<text x="712" y="243" font-size="16" font-weight="800" fill="#291c0e">Write payload</text>
<text x="672" y="292" font-size="13.5" fill="#4f4f4f">Encrypted room, time and</text>
<text x="672" y="312" font-size="13.5" fill="#4f4f4f">access data written to a</text>
<text x="672" y="332" font-size="13.5" fill="#4f4f4f">sector or application.</text>

<!-- Step 4 (highlight) -->
<rect x="940" y="196" width="196" height="192" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
<rect x="940" y="196" width="196" height="8" rx="4" fill="#c39a5f"/>
<circle cx="974" cy="238" r="17" fill="#c39a5f"/>
<text x="974" y="243" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4</text>
<text x="1004" y="243" font-size="16" font-weight="800" fill="#291c0e">Card ready</text>
<text x="1038" y="300" text-anchor="middle" font-size="26" font-weight="800" fill="#8a6d34">&lt; 500 ms</text>
<text x="1038" y="330" text-anchor="middle" font-size="13" fill="#8a6d34">per card</text>

<!-- arrows -->
<path d="M 320 292 L 350 292" fill="none" stroke="#c8bda8" stroke-width="2.4"/>
<path d="M 344 286 L 354 292 L 344 298 Z" fill="#c8bda8"/>
<path d="M 612 292 L 642 292" fill="none" stroke="#c8bda8" stroke-width="2.4"/>
<path d="M 636 286 L 646 292 L 636 298 Z" fill="#c8bda8"/>
<path d="M 904 292 L 934 292" fill="none" stroke="#c8bda8" stroke-width="2.4"/>
<path d="M 928 286 L 938 292 L 928 298 Z" fill="#c8bda8"/>

<!-- lock read-back band -->
<rect x="64" y="436" width="1072" height="72" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<circle cx="112" cy="472" r="20" fill="none" stroke="#3d6b6b" stroke-width="3"/>
<circle cx="112" cy="472" r="10" fill="none" stroke="#9dc0c0" stroke-width="2"/>
<text x="152" y="466" font-size="15" font-weight="800" fill="#2c5454">At the door</text>
<text x="152" y="490" font-size="13.5" fill="#4f4f4f">The lock reads the card, authenticates the encrypted payload, and grants or denies access.</text>

<text x="600" y="574" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Re-encodable thousands of times — the same blank becomes a new key every stay.</text>
</svg>
