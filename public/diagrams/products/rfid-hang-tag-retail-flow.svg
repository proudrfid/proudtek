<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Item-level RFID hang-tag lifecycle — sewing floor to store exit</title>
  <desc id="d">A five-step left-to-right flow following one SGTIN. Step one, source-tag at the Tier-2 sewing floor: print brand, size and price and encode the SGTIN-96 in one pass at 100-150 millimetres per second. Step two, carton and DC: items aggregate into a carton with an ASN and an EPCIS 2.0 event, then ship to store. Step three, store receiving: a portal reads the cartons in at plus 33 dBm with a 6 dBic antenna and stock is confirmed. Step four, floor cycle-count: a handheld sweep of 5,000 to 15,000 items in 45 to 60 minutes holds 98 percent-plus first-pass accuracy. Step five, POS and exit: an overhead UHF exit reader at 3-4 metres raises an SGTIN-level shrink alert while the OMS runs BOPIS and ship-from-store on accurate stock. A bottom band notes first-pass inventory accuracy rises from 65-75 percent to 98 percent-plus, out-of-stock falls 30 to 60 percent in RAIN RFID retail pilots, and the same SGTIN is read at every stage without re-tagging.</desc>
  <defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ITEM-LEVEL HANG-TAG LIFECYCLE</text>
  <text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="28" font-weight="700" fill="#291c0e">One SGTIN, read at every stage</text>

  <!-- STEP 1 -->
  <rect x="57" y="150" width="198" height="228" rx="14" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.8"/>
  <circle cx="156" cy="196" r="21" fill="#6d5a3a"/>
  <text x="156" y="203" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
  <text x="156" y="250" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">SOURCE-TAG</text>
  <text x="156" y="288" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Print + encode SGTIN-96</text>
  <text x="156" y="314" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Tier-2 sewing floor</text>
  <text x="156" y="340" text-anchor="middle" font-size="12.5" fill="#4f4f4f">One pass · 100-150 mm/s</text>

  <!-- STEP 2 -->
  <rect x="279" y="150" width="198" height="228" rx="14" fill="#eef1f4" stroke="#4a5568" stroke-width="1.8"/>
  <circle cx="378" cy="196" r="21" fill="#4a5568"/>
  <text x="378" y="203" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
  <text x="378" y="250" text-anchor="middle" font-size="15" font-weight="800" fill="#4a5568">CARTON / DC</text>
  <text x="378" y="288" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Aggregate to carton</text>
  <text x="378" y="314" text-anchor="middle" font-size="12.5" fill="#4f4f4f">ASN + EPCIS 2.0 event</text>
  <text x="378" y="340" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Ship to store</text>

  <!-- STEP 3 -->
  <rect x="501" y="150" width="198" height="228" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
  <circle cx="600" cy="196" r="21" fill="#3d6b6b"/>
  <text x="600" y="203" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
  <text x="600" y="250" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">RECEIVING</text>
  <text x="600" y="288" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Portal read-in</text>
  <text x="600" y="314" text-anchor="middle" font-size="12.5" fill="#4f4f4f">+33 dBm · 6 dBic</text>
  <text x="600" y="340" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Stock confirmed</text>

  <!-- STEP 4 -->
  <rect x="723" y="150" width="198" height="228" rx="14" fill="#eef1f4" stroke="#4a5568" stroke-width="1.8"/>
  <circle cx="822" cy="196" r="21" fill="#4a5568"/>
  <text x="822" y="203" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">4</text>
  <text x="822" y="250" text-anchor="middle" font-size="15" font-weight="800" fill="#4a5568">CYCLE-COUNT</text>
  <text x="822" y="288" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Handheld sweep</text>
  <text x="822" y="314" text-anchor="middle" font-size="12.5" fill="#4f4f4f">5,000-15,000 items</text>
  <text x="822" y="340" text-anchor="middle" font-size="12.5" fill="#4f4f4f">45-60 min · 98 %+</text>

  <!-- STEP 5 -->
  <rect x="945" y="150" width="198" height="228" rx="14" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
  <circle cx="1044" cy="196" r="21" fill="#2c5454"/>
  <text x="1044" y="203" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">5</text>
  <text x="1044" y="250" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">POS / EXIT</text>
  <text x="1044" y="288" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Overhead exit · 3-4 m</text>
  <text x="1044" y="314" text-anchor="middle" font-size="12.5" fill="#4f4f4f">SGTIN shrink alert</text>
  <text x="1044" y="340" text-anchor="middle" font-size="12.5" fill="#4f4f4f">OMS: BOPIS ready</text>

  <!-- arrows -->
  <path d="M 259 264 H 275 l -4 -7 m 4 7 l -4 7" fill="none" stroke="#6d5a3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 481 264 H 497 l -4 -7 m 4 7 l -4 7" fill="none" stroke="#4a5568" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 703 264 H 719 l -4 -7 m 4 7 l -4 7" fill="none" stroke="#3d6b6b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 925 264 H 941 l -4 -7 m 4 7 l -4 7" fill="none" stroke="#4a5568" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="600" y="416" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The SGTIN is encoded once at source and read at every stage — merchandise is never re-tagged.</text>

  <!-- bottom band -->
  <rect x="56" y="440" width="1088" height="164" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
  <rect x="80" y="466" width="216" height="112" rx="12" fill="#1f6f3a"/>
  <text x="188" y="512" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">65-75 % → 98 %+</text>
  <text x="188" y="548" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">first-pass accuracy</text>
  <rect x="312" y="466" width="184" height="112" rx="12" fill="#6d5a3a"/>
  <text x="404" y="512" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">-30-60 %</text>
  <text x="404" y="548" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">out-of-stock</text>
  <text x="520" y="500" font-size="14.5" font-weight="700" fill="#291c0e">Item-level accuracy is what makes BOPIS and ship-from-store</text>
  <text x="520" y="524" font-size="14.5" font-weight="700" fill="#291c0e">promises reliable — the OMS runs on real store stock.</text>
  <text x="520" y="556" font-size="13" fill="#5c5c5c">30-60 % out-of-stock reduction and 2-10 % sales lift in RAIN RFID retail pilots.</text>
</svg>
