<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Flexible-PET NFC cosmetics inlay construction and curved-surface fit</title>
  <desc id="d">Left: a cosmetics bottle with a flexible-PET NFC label conforming to its curved surface without detuning. Centre: the label layer stack — transparent PET overlay, aluminium antenna coil with the NTAG 424 DNA die, flexible PET substrate, and clear or tamper-evident adhesive that leaves a VOID pattern on removal. Bottom: three standard inlay sizes and their smartphone read distances — 22 mm round 25-35 mm, 18 mm round 20-30 mm, 12 by 19 mm 15-25 mm.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FLEXIBLE PET INLAY ON A CURVED SURFACE</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Conforms to bottle, jar and tube without detuning — and voids if it is peeled</text>

  <!-- bottle -->
  <rect x="160" y="205" width="140" height="158" rx="24" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <rect x="205" y="166" width="50" height="46" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <path d="M160 275 Q230 289 300 275 L300 320 Q230 334 160 320 Z" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <rect x="210" y="286" width="40" height="24" rx="4" fill="#3d6b6b"/>
  <text x="230" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">Label conforms to the curve</text>
  <text x="230" y="406" text-anchor="middle" font-size="12" fill="#5c5c5c">rigid inlays detune here</text>

  <!-- layer stack -->
  <text x="640" y="150" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">THE LAYER STACK</text>
  <rect x="470" y="170" width="340" height="40" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="490" y="195" font-size="13.5" fill="#291c0e">Transparent PET overlay — near-invisible</text>
  <rect x="470" y="216" width="340" height="52" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="490" y="238" font-size="13.5" fill="#291c0e">Aluminium antenna coil + NTAG 424 DNA die</text>
  <text x="490" y="257" font-size="12" fill="#5c5c5c">13.56 MHz, AES-128 SUN</text>
  <rect x="470" y="274" width="340" height="40" rx="6" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <text x="490" y="299" font-size="13.5" fill="#291c0e">Flexible PET substrate — bends, no detune</text>
  <rect x="470" y="320" width="340" height="40" rx="6" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="2"/>
  <text x="490" y="345" font-size="13.5" fill="#8b2d2d">Tamper-evident adhesive — leaves VOID on removal</text>

  <!-- size chips -->
  <text x="600" y="418" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">STANDARD SIZES — SMARTPHONE READ DISTANCE</text>
  <rect x="150" y="438" width="290" height="86" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="170" y="468" font-size="16" font-weight="700" fill="#291c0e">Ø 22 mm round</text>
  <text x="170" y="492" font-size="13" fill="#5c5c5c">Fragrance bottle, outer box</text>
  <text x="170" y="512" font-size="13" fill="#3d6b6b">25-35 mm read</text>
  <rect x="455" y="438" width="290" height="86" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="475" y="468" font-size="16" font-weight="700" fill="#291c0e">Ø 18 mm round</text>
  <text x="475" y="492" font-size="13" fill="#5c5c5c">Serum, jar, compact base</text>
  <text x="475" y="512" font-size="13" fill="#3d6b6b">20-30 mm read</text>
  <rect x="760" y="438" width="290" height="86" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="780" y="468" font-size="16" font-weight="700" fill="#291c0e">12 × 19 mm</text>
  <text x="780" y="492" font-size="13" fill="#5c5c5c">Compact, tube, lipstick</text>
  <text x="780" y="512" font-size="13" fill="#3d6b6b">15-25 mm read</text>

  <text x="600" y="566" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Below Ø 12 mm, first-tap reliability drops under 95% — move the tag to the outer carton instead.</text>
</svg>
