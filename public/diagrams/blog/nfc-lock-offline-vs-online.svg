<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Offline card-centric versus online server-centric NFC lock architectures, side by side</title>
<desc id="d">Two architectures compared. On the left, offline or card-centric: the door lock stands alone with no network, the authorization is encoded on the card, the battery lasts 2 to 4 years, and a lost card is revoked at the next encoder visit. On the right, online or server-centric: the lock is wired or wireless to a central server that pushes authorization to it, the battery lasts 6 to 18 months because the radio is active, and a lost card is revoked immediately.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ARCHITECTURE · WHERE THE AUTHORIZATION LIVES</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">Offline keeps the rules on the card; online keeps them on a server and pushes to every lock.</text>

<!-- OFFLINE panel -->
<rect x="72" y="118" width="492" height="500" rx="16" fill="#faf7f0" stroke="#eadfce" stroke-width="1.8"/>
<rect x="72" y="118" width="492" height="9" rx="4" fill="#3d6b6b"/>
<text x="318" y="162" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">OFFLINE · card-centric</text>

<!-- offline scene: card -> lone door -->
<rect x="120" y="196" width="132" height="86" rx="11" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.4"/>
<rect x="140" y="218" width="34" height="26" rx="4" fill="#d4a755"/>
<text x="188" y="236" font-size="12" font-weight="700" fill="#2c5454">rules</text>
<text x="188" y="253" font-size="12" font-weight="700" fill="#2c5454">on card</text>
<line x1="256" y1="239" x2="330" y2="239" stroke="#3d6b6b" stroke-width="2.4" stroke-dasharray="6 6"/>
<polygon points="330,239 314,232 314,246" fill="#3d6b6b"/>
<rect x="336" y="182" width="118" height="118" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2.4"/>
<circle cx="432" cy="241" r="8" fill="#4a5568"/>
<text x="395" y="330" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">standalone door</text>
<rect x="466" y="195" width="82" height="27" rx="13" fill="#f7ecec" stroke="#d8a9a9" stroke-width="1.4"/>
<text x="507" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#8b2d2d">no network</text>

<text x="120" y="392" font-size="14" fill="#333333">• No network drop at the door</text>
<text x="120" y="428" font-size="14" fill="#333333">• Authorization encoded on the card</text>
<text x="120" y="464" font-size="14" fill="#333333">• Battery 2–4 years (no radio)</text>
<text x="120" y="500" font-size="14" fill="#333333">• Revoke at next encoder visit</text>
<rect x="120" y="536" width="360" height="52" rx="10" fill="#eef5f5"/>
<text x="138" y="558" font-size="12.5" font-weight="700" fill="#2c5454">Best for: hotels, dormitories,</text>
<text x="138" y="577" font-size="12.5" font-weight="700" fill="#2c5454">remote facilities without wiring</text>

<!-- ONLINE panel -->
<rect x="636" y="118" width="492" height="500" rx="16" fill="#faf7f0" stroke="#eadfce" stroke-width="1.8"/>
<rect x="636" y="118" width="492" height="9" rx="4" fill="#3d6b6b"/>
<text x="882" y="162" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">ONLINE · server-centric</text>

<!-- online scene: server -> door -->
<rect x="684" y="188" width="104" height="108" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.4"/>
<rect x="700" y="206" width="72" height="16" rx="3" fill="#3d6b6b"/>
<rect x="700" y="230" width="72" height="16" rx="3" fill="#7fa6a6"/>
<rect x="700" y="254" width="72" height="16" rx="3" fill="#7fa6a6"/>
<text x="736" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">server</text>
<line x1="790" y1="242" x2="864" y2="242" stroke="#1f6f3a" stroke-width="3"/>
<polygon points="864,242 848,235 848,249" fill="#1f6f3a"/>
<text x="827" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">push</text>
<rect x="870" y="184" width="118" height="118" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2.4"/>
<circle cx="966" cy="243" r="8" fill="#4a5568"/>
<text x="929" y="332" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">wired door</text>

<text x="684" y="392" font-size="14" fill="#333333">• Wired or wireless to each lock</text>
<text x="684" y="428" font-size="14" fill="#333333">• Server database pushed to lock</text>
<text x="684" y="464" font-size="14" fill="#333333">• Battery 6–18 months (radio active)</text>
<text x="684" y="500" font-size="14" fill="#333333">• Revoke immediately, server-side</text>
<rect x="684" y="536" width="360" height="52" rx="10" fill="#eef5f5"/>
<text x="702" y="558" font-size="12.5" font-weight="700" fill="#2c5454">Best for: corporate offices, data</text>
<text x="702" y="577" font-size="12.5" font-weight="700" fill="#2c5454">centers, government buildings</text>
</svg>
