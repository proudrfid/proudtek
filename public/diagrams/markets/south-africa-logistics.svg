<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Shenzhen to South Africa — freight lanes and landed cost</title>
  <desc id="d">Freight from Shenzhen to South Africa: express air via DHL or FedEx reaches Johannesburg (OR Tambo), Cape Town, Durban (King Shaka) and Pretoria in 5-8 business days; sea freight serves bulk orders of 50,000 cards and up. At import, 15% VAT applies on the added-tax value, import duty follows the SARS tariff for the goods under HS 8523.52 (there is no China-South Africa preference reducing South African import duty), and radio equipment needs ICASA type approval plus an NRCS Letter of Authority. DDP is available so the landed cost is quoted up front.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SHENZHEN &#8594; SOUTH AFRICA &#8212; LANES AND LANDED COST</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Air in 5-8 business days; 15% VAT at import; ICASA + NRCS handled at the equipment level</text>

  <!-- origin -->
  <rect x="70" y="200" width="180" height="90" rx="12" fill="#4a5568"/>
  <text x="160" y="238" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">SHENZHEN</text>
  <text x="160" y="262" text-anchor="middle" font-size="12.5" fill="#dfe4ea">one production line,</text>
  <text x="160" y="280" text-anchor="middle" font-size="12.5" fill="#dfe4ea">South-Africa-spec sheets</text>

  <!-- air lane -->
  <line x1="250" y1="222" x2="470" y2="222" stroke="#3d6b6b" stroke-width="3"/>
  <polygon points="470,222 456,216 456,228" fill="#3d6b6b"/>
  <text x="360" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#3d6b6b">Air &#183; DHL / FedEx &#183; 5-8 days</text>
  <!-- sea lane -->
  <line x1="250" y1="268" x2="470" y2="268" stroke="#8a6d3b" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="470,268 456,262 456,274" fill="#8a6d3b"/>
  <text x="360" y="290" text-anchor="middle" font-size="13" fill="#8a6d3b">Sea &#183; bulk 50,000+ cards</text>

  <!-- destinations -->
  <rect x="480" y="150" width="230" height="196" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="595" y="180" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">SOUTH AFRICA</text>
  <text x="595" y="208" text-anchor="middle" font-size="13.5" fill="#291c0e">Johannesburg &#183; OR Tambo</text>
  <text x="595" y="230" text-anchor="middle" font-size="13.5" fill="#291c0e">Cape Town Intl</text>
  <text x="595" y="252" text-anchor="middle" font-size="13.5" fill="#291c0e">Durban &#183; King Shaka</text>
  <text x="595" y="274" text-anchor="middle" font-size="13.5" fill="#291c0e">Pretoria</text>
  <text x="595" y="302" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Free sample kits ship</text>
  <text x="595" y="320" text-anchor="middle" font-size="12.5" fill="#5c5c5c">to ZA addresses first</text>

  <!-- landed cost -->
  <rect x="740" y="150" width="390" height="196" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="760" y="182" font-size="15" font-weight="800" letter-spacing="0.3" fill="#6d5a3a">AT IMPORT</text>
  <text x="760" y="212" font-size="13.5" fill="#291c0e">VAT &#8212; 15% on the added-tax value</text>
  <text x="760" y="240" font-size="13.5" fill="#291c0e">Duty &#8212; per SARS tariff (HS 8523.52)</text>
  <text x="760" y="262" font-size="12.5" fill="#5c5c5c">no China-South-Africa import preference</text>
  <text x="760" y="292" font-size="13.5" fill="#291c0e">Type approval &#8212; ICASA + NRCS LOA</text>
  <text x="760" y="320" font-size="13.5" fill="#291c0e">Incoterms &#8212; EXW, or DDP up front</text>

  <rect x="70" y="400" width="1060" height="86" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="92" y="430" font-size="15" font-weight="700" fill="#2c5454">Time zones work in your favour</text>
  <text x="92" y="453" font-size="13.5" fill="#3d6b6b">Shenzhen (GMT+8) runs six hours ahead of South Africa (GMT+2), so an RFQ sent late afternoon is usually quoted by the next morning.</text>
  <text x="92" y="473" font-size="13.5" fill="#5c5c5c">DDP means the price includes freight, the 15% VAT and clearance &#8212; no surprise line items at the border.</text>

  <text x="600" y="536" text-anchor="middle" font-size="13" fill="#9aa4b2">Transit, tax and duty figures are indicative; confirm exact lead time, duty line and Incoterm on your quote.</text>
</svg>
