<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The seven RFID card materials — personality, best fit and one weakness each</title>
<desc id="d">Comparison matrix. PVC, the people's plastic, is best for loyalty, events and hotel keys but acetone or MEK takes it apart. PET, the sensible one, suits transit and rPET recycled programs but wants corona or plasma prep before ink. PETG, PET finishing-school edition, suits durable ID and premium clear cards but costs more than the PVC it replaces. PC, the bank vault, suits government ID and ten-year cards but the budget will feel it. ABS, the gym rat, suits industrial and rugged access but warps if retransfer printing runs hot. Wood veneer, the artisan, suits luxury and NFC business cards but hates hot laminators and moisture. Paper, the sprinter, suits event badges and transit tickets but a glass of water ends it.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SEVEN MATERIALS · SEVEN PERSONALITIES</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Same sample pack, very different careers</text>

