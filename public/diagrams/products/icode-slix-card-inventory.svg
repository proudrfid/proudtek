<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">ICODE SLIX vicinity inventory — ISO/IEC 15693 reads a whole stack at once</title>
  <desc id="d">A reader inventories a stack of 30 cards in about 300 ms using slotted ALOHA anti-collision with 16 slots per round at a 26 kbps data rate, per ISO/IEC 15693 parts 1-3. Memory panel: 28 blocks of 32 bits giving 896 bits user memory plus 64-bit UID, AFI, DSFID, EAS bit and password-protected writes.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Reads the stack, not the card</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Vicinity protocol: hold up a pile and let anti-collision sort them out</text>
  <g transform="translate(80,150)">
    <g stroke="#c39a5f" stroke-width="2" fill="#ffffff">
      <rect x="24" y="96" width="240" height="150" rx="12" transform="rotate(-6 144 171)"/>
      <rect x="12" y="84" width="240" height="150" rx="12" transform="rotate(-3 132 159)"/>
      <rect x="0" y="72" width="240" height="150" rx="12"/>
    </g>
    <text x="28" y="140" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">a stack of 30 cards</text>
    <text x="28" y="164" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">books, files, gas-fleet tokens</text>
    <path d="M 280 150 L 400 150" stroke="#3d6b6b" stroke-width="3" marker-end="url(#a3)"/>
    <defs><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d6b6b"/></marker></defs>
    <rect x="410" y="90" width="250" height="130" rx="12" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2.5"/>
    <text x="434" y="128" font-family="Georgia, serif" font-size="18" fill="#2c5454">Reader pad</text>
    <text x="434" y="156" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">inventory ~300 ms</text>
    <text x="434" y="178" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">26 kbps data rate</text>
    <rect x="120" y="300" width="440" height="70 " rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="142" y="328" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#291c0e">Slotted ALOHA anti-collision — 16 slots per round</text>
    <text x="142" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">ISO/IEC 15693 parts 1-3: physical, anti-collision, protocol</text>
  </g>
  <g transform="translate(740,140)">
    <rect x="0" y="0" width="390" height="330" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="18" fill="#2c5454">What each card carries</text>
    <text x="24" y="76" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">28 blocks x 32 bits = 896 bits user memory</text>
    <text x="24" y="104" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">64-bit UID · AFI · DSFID</text>
    <text x="24" y="132" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">EAS bit + password-protected writes</text>
    <line x1="24" y1="158" x2="366" y2="158" stroke="#d8cdb8" stroke-width="1.5"/>
    <text x="24" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">SLIX (SL2S2002) and SLIX2 (SL2S2602) —</text>
    <text x="24" y="212" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">the dominant 15693 chips in library and</text>
    <text x="24" y="234" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">document programmes</text>
    <text x="24" y="274" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">Password-based posture — inventory and</text>
    <text x="24" y="296" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">library work, not payment crypto</text>
  </g>
</svg>
