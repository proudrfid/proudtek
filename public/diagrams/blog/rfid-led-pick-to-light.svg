<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How LED pick-to-light RFID tags guide an operator to the exact item</title>
<desc id="d">A three-step flow. Step one, query: the warehouse management system sends the tag ID to the reader. Step two, LED flashes: the target tag's on-board LED lights on the shelf. Step three, pick: the operator walks straight to the lit item. Below, three facts: 70 to 90 percent less search time, 2 to 4 year battery life, and 10,000 to 50,000 LED activations per tag.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">LED PICK-TO-LIGHT</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The tag tells you which shelf, so you stop reading labels down the wrong aisle.</text>

<!-- BOX 1 · QUERY (teal) -->
<rect x="90" y="160" width="300" height="250" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="90" y="160" width="300" height="8" rx="4" fill="#3d6b6b"/>
<text x="240" y="200" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">1 · QUERY</text>
<rect x="196" y="224" width="88" height="52" rx="7" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<text x="240" y="256" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">ID</text>
<path d="M 292 236 A 12 12 0 0 1 292 264" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<path d="M 300 230 A 18 18 0 0 1 300 270" fill="none" stroke="#9ac0c0" stroke-width="2"/>
<text x="240" y="352" text-anchor="middle" font-size="14" fill="#5c5c5c">The WMS sends the tag ID</text>
<text x="240" y="374" text-anchor="middle" font-size="14" fill="#5c5c5c">to the reader on approach</text>

<!-- BOX 2 · LED FLASHES (gold) -->
<rect x="450" y="160" width="300" height="250" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="450" y="160" width="300" height="8" rx="4" fill="#c39a5f"/>
<text x="600" y="200" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#a07d43">2 · LED FLASHES</text>
<rect x="548" y="220" width="104" height="72" rx="5" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.8"/>
<line x1="548" y1="246" x2="652" y2="246" stroke="#d9d2c4" stroke-width="1.6"/>
<line x1="548" y1="268" x2="652" y2="268" stroke="#d9d2c4" stroke-width="1.6"/>
<rect x="556" y="226" width="34" height="16" rx="3" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.6"/>
<circle cx="573" cy="234" r="5" fill="#c39a5f"/>
<line x1="595" y1="226" x2="606" y2="220" stroke="#c39a5f" stroke-width="2"/>
<line x1="595" y1="234" x2="608" y2="234" stroke="#c39a5f" stroke-width="2"/>
<line x1="595" y1="242" x2="606" y2="248" stroke="#c39a5f" stroke-width="2"/>
<text x="600" y="352" text-anchor="middle" font-size="14" fill="#5c5c5c">The target tag's LED lights</text>
<text x="600" y="374" text-anchor="middle" font-size="14" fill="#5c5c5c">on the exact shelf location</text>

<!-- BOX 3 · PICK (green) -->
<rect x="810" y="160" width="300" height="250" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<rect x="810" y="160" width="300" height="8" rx="4" fill="#1f6f3a"/>
<text x="960" y="200" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">3 · PICK</text>
<circle cx="936" cy="238" r="11" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<path d="M 924 292 v -22 a 12 12 0 0 1 24 0 v 22" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<circle cx="988" cy="262" r="16" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<polyline points="980,262 986,269 997,255" fill="none" stroke="#1f6f3a" stroke-width="2.6"/>
<text x="960" y="352" text-anchor="middle" font-size="14" fill="#33595a">The operator walks straight</text>
<text x="960" y="374" text-anchor="middle" font-size="14" fill="#33595a">to the item, no aisle search</text>

<!-- flow arrows -->
<line x1="392" y1="285" x2="444" y2="285" stroke="#291c0e" stroke-width="3"/>
<polygon points="444,278 462,285 444,292" fill="#291c0e"/>
<line x1="752" y1="285" x2="804" y2="285" stroke="#291c0e" stroke-width="3"/>
<polygon points="804,278 822,285 804,292" fill="#291c0e"/>

<!-- stat chips -->
<rect x="90" y="452" width="300" height="44" rx="22" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="240" y="479" text-anchor="middle" font-size="14.5" font-weight="800" fill="#2c5454">70-90% less search time</text>
<rect x="450" y="452" width="300" height="44" rx="22" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="479" text-anchor="middle" font-size="14.5" font-weight="800" fill="#a07d43">2-4 year battery life</text>
<rect x="810" y="452" width="300" height="44" rx="22" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<text x="960" y="479" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f6f3a">10,000-50,000 activations</text>

<text x="600" y="556" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Guides the picker to the item — not down the wrong aisle first.</text>
<text x="600" y="586" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Best for high-value assets and deep racking where label visibility is poor.</text>
</svg>
