<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Source-tagging at the factory costs $0.01-0.03 per garment; DC retrofit costs 3-5x more</title>
<desc id="d">Supply-chain flow with three stations. Left, a sawtooth-roofed factory: source-tagging at the cut-make-trim finishing line costs $0.01-0.03 per garment, and source-tagged goods read 1-2 percentage points higher at the retailer DC. Between factory and warehouse an annotation warns the cost is 3-5x if you wait. Center, a distribution center: DC retrofit re-tagging costs $0.05-0.12 per garment. Right, the retail dock where the read rate is graded against the 95% threshold. The caption: same tag, different zip code — the earlier you tag, the cheaper it is and the better it reads.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE YOU TAG CHANGES THE MATH</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Tag at the factory, or pay 3–5× at the dock</text>

<!-- factory -->
<rect x="170" y="280" width="180" height="110" rx="6" fill="#e7f0f0" stroke="#3d6b6b" stroke-width="2"/>
<path d="M170 280 L215 246 L215 280 L260 246 L260 280 L305 246 L305 280 L350 246 L350 280" fill="none" stroke="#3d6b6b" stroke-width="2" stroke-linejoin="round"/>
<rect x="192" y="310" width="26" height="26" fill="#bcd6d4"/>
<rect x="232" y="310" width="26" height="26" fill="#bcd6d4"/>
<rect x="296" y="330" width="34" height="60" fill="#a9c8c6"/>
<circle cx="340" cy="268" r="15" fill="#2d6a4f"/>
<path d="M333 270 a7 7 0 0 1 14 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<path d="M336.5 270 a3.5 3.5 0 0 1 7 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<text x="260" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Source-tagging</text>
<text x="260" y="449" text-anchor="middle" font-size="12.5" fill="#5c5c5c">at the cut-make-trim finishing line</text>
<rect x="190" y="462" width="140" height="34" rx="10" fill="#2d6a4f"/>
<text x="260" y="484" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">$0.01–0.03</text>
<text x="260" y="522" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2d6a4f">+ reads 1–2 pts higher at the retailer DC</text>

<!-- multiplier -->
<text x="430" y="320" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#8a6b3c">3–5×</text>
<text x="430" y="344" text-anchor="middle" font-size="12.5" fill="#5c5c5c">cost if you wait</text>
<line x1="392" y1="362" x2="464" y2="362" stroke="#c39a5f" stroke-width="2" stroke-dasharray="4 4"/>
<polygon points="476,362 462,356 462,368" fill="#c39a5f"/>

<!-- distribution center -->
<rect x="510" y="272" width="180" height="118" rx="6" fill="#fdf3e2" stroke="#c39a5f" stroke-width="2"/>
<path d="M510 272 L600 240 L690 272" fill="none" stroke="#c39a5f" stroke-width="2" stroke-linejoin="round"/>
<rect x="572" y="318" width="56" height="72" fill="#ecd9b0"/>
<line x1="572" y1="336" x2="628" y2="336" stroke="#c39a5f" stroke-width="1.5"/>
<line x1="572" y1="354" x2="628" y2="354" stroke="#c39a5f" stroke-width="1.5"/>
<line x1="572" y1="372" x2="628" y2="372" stroke="#c39a5f" stroke-width="1.5"/>
<rect x="528" y="318" width="24" height="18" fill="#ecd9b0"/>
<rect x="646" y="318" width="24" height="18" fill="#ecd9b0"/>
<text x="600" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">DC retrofit</text>
<text x="600" y="449" text-anchor="middle" font-size="12.5" fill="#5c5c5c">re-tag at the distribution center</text>
<rect x="530" y="462" width="140" height="34" rx="10" fill="#8a6b3c"/>
<text x="600" y="484" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">$0.05–0.12</text>

<!-- connector -->
<line x1="700" y1="340" x2="836" y2="340" stroke="#d9cfbc" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
<polygon points="850,340 836,334 836,346" fill="#d9cfbc"/>

<!-- retail -->
<rect x="860" y="280" width="160" height="110" rx="6" fill="#eceef2" stroke="#4a5568" stroke-width="2"/>
<path d="M848 280 L1032 280 L1020 254 L860 254 Z" fill="#dfe3ea" stroke="#4a5568" stroke-width="2" stroke-linejoin="round"/>
<rect x="920" y="330" width="40" height="60" fill="#c6cdd9"/>
<rect x="878" y="306" width="30" height="20" fill="#c6cdd9"/>
<rect x="972" y="306" width="30" height="20" fill="#c6cdd9"/>
<text x="940" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Retail dock</text>
<text x="940" y="449" text-anchor="middle" font-size="12.5" fill="#5c5c5c">where the read rate is graded</text>
<rect x="870" y="462" width="140" height="34" rx="10" fill="#4a5568"/>
<text x="940" y="484" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">95% threshold</text>

<text x="600" y="590" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Same tag, different zip code — the earlier you tag, the cheaper it is and the better it reads at the retailer's dock.</text>
</svg>
