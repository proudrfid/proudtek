<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Why a magnetic stripe can be erased but an RFID card cannot, shown as a side-by-side comparison</title>
<desc id="d">A two-panel comparison. The left panel, magnetic stripe, is marked erasable: data is stored as magnetized iron-oxide cells on a dark stripe, any field above coercivity rewrites it, and no stronger stripe escapes the physics. The right panel, RFID contactless, is marked immune: data lives on a silicon chip and radio antenna coil, there is no magnetic medium to disturb, and most locks accept the same card stock with no new hardware.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY ONE CARD ERASES AND THE OTHER DOES NOT</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Same magnet, opposite outcome — because the data lives on different media.</text>

<!-- LEFT: magstripe -->
<rect x="80" y="128" width="488" height="458" rx="16" fill="#f8ecec" stroke="#e6c9c9" stroke-width="2"/>
<rect x="80" y="128" width="488" height="10" rx="5" fill="#8b2d2d"/>
<text x="324" y="176" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">MAGNETIC STRIPE</text>
<rect x="252" y="196" width="144" height="34" rx="17" fill="#ffffff" stroke="#c98a8a" stroke-width="1.5"/>
<text x="324" y="219" text-anchor="middle" font-size="14" font-weight="800" fill="#8b2d2d">ERASABLE</text>
<!-- mini card with stripe -->
<rect x="140" y="264" width="368" height="118" rx="12" fill="#ffffff" stroke="#c7a86a" stroke-width="2"/>
<rect x="140" y="292" width="368" height="34" fill="#3a3a3a"/>
<rect x="152" y="292" width="30" height="34" fill="#4a4a4a"/>
<rect x="212" y="292" width="30" height="34" fill="#4a4a4a"/>
<rect x="272" y="292" width="30" height="34" fill="#4a4a4a"/>
<rect x="332" y="292" width="30" height="34" fill="#4a4a4a"/>
<rect x="392" y="292" width="30" height="34" fill="#4a4a4a"/>
<rect x="452" y="292" width="30" height="34" fill="#4a4a4a"/>
<path d="M 150 309 l 26 -13 l 28 26 l 30 -24 l 28 22 l 30 -20 l 28 18 l 30 -16 l 26 13" fill="none" stroke="#8b2d2d" stroke-width="3.5"/>
<text x="324" y="364" text-anchor="middle" font-size="13" fill="#5c5c5c">iron-oxide flux cells — a magnet flips them</text>
<text x="324" y="430" text-anchor="middle" font-size="14" fill="#291c0e">Data = magnetized iron-oxide particles</text>
<text x="324" y="462" text-anchor="middle" font-size="14" fill="#291c0e">Any field &gt; coercivity rewrites it</text>
<text x="324" y="494" text-anchor="middle" font-size="14" fill="#291c0e">No "stronger stripe" escapes the physics</text>
<text x="324" y="544" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8b2d2d">Outcome: dead card, angry guest</text>

<!-- RIGHT: RFID -->
<rect x="632" y="128" width="488" height="458" rx="16" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<rect x="632" y="128" width="488" height="10" rx="5" fill="#1f6f3a"/>
<text x="876" y="176" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">RFID CONTACTLESS</text>
<rect x="804" y="196" width="144" height="34" rx="17" fill="#ffffff" stroke="#8fbf9f" stroke-width="1.5"/>
<text x="876" y="219" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">IMMUNE</text>
<!-- mini card with chip + antenna -->
<rect x="692" y="264" width="368" height="118" rx="12" fill="#ffffff" stroke="#a9cfb5" stroke-width="2"/>
<rect x="726" y="292" width="176" height="66" rx="10" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="710" y="282" width="208" height="86" rx="14" fill="none" stroke="#6a9a9a" stroke-width="2"/>
<rect x="836" y="300" width="52" height="50" rx="8" fill="#f7edd6" stroke="#c39a5f" stroke-width="2.5"/>
<line x1="836" y1="315" x2="820" y2="315" stroke="#c39a5f" stroke-width="2"/>
<line x1="836" y1="335" x2="820" y2="335" stroke="#c39a5f" stroke-width="2"/>
<line x1="888" y1="315" x2="904" y2="315" stroke="#c39a5f" stroke-width="2"/>
<line x1="888" y1="335" x2="904" y2="335" stroke="#c39a5f" stroke-width="2"/>
<circle cx="984" cy="325" r="20" fill="#3a3a3a" stroke="#8b2d2d" stroke-width="2.5"/>
<path d="M 970 342 A 24 24 0 0 0 998 342" fill="none" stroke="#1f6f3a" stroke-width="3"/>
<text x="876" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Data = silicon chip + RF antenna</text>
<text x="876" y="462" text-anchor="middle" font-size="14" fill="#291c0e">No magnetic medium to disturb</text>
<text x="876" y="494" text-anchor="middle" font-size="14" fill="#291c0e">Same stock, most locks — no new hardware</text>
<text x="876" y="544" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f6f3a">Outcome: opens every time</text>

<text x="600" y="622" text-anchor="middle" font-size="14" fill="#4f4f4f">The magnet never touches the credential on an RFID card — there is nothing magnetic to reach.</text>
</svg>
