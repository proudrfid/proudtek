<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Tap rate versus post-tap completion: the same card measured at two different denominators</title>
<desc id="d">Two gates side by side. Gate one, the table-occupant tap rate: of everyone seated, taken as 100 percent, about 8 to 15 percent tap the card. Gate two, the post-tap completion rate: of only the guests who tapped, taken as 100 percent, about 75 to 80 percent finish and submit the review. The takeaway is that 8 to 15 percent is the share of all guests while 75 to 80 percent is the share of the guests who actually tapped, so the same card can be described by two very different numbers.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE CARD, TWO DENOMINATORS</text>
<text x="600" y="92" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Why 8-15% and 75-80% both fit</text>

<!-- Gate 1 -->
<rect x="64" y="132" width="512" height="368" rx="16" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="92" y="172" font-size="15" font-weight="800" letter-spacing="0.4" fill="#2c5454">GATE 1 · TABLE-OCCUPANT TAP RATE</text>
<text x="92" y="212" font-size="13.5" fill="#5c5c5c">Everyone seated = 100%</text>
<rect x="92" y="224" width="456" height="44" rx="9" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/>
<rect x="92" y="224" width="59" height="44" rx="9" fill="#3d6b6b"/>
<text x="92" y="342" font-size="56" font-weight="800" fill="#2c5454">8-15%</text>
<text x="92" y="380" font-size="16" fill="#4f4f4f">of everyone at the table taps the card</text>
<text x="92" y="452" font-size="13.5" font-style="italic" fill="#6d5a3a">This is the figure in the comparison table.</text>

<!-- Gate 2 -->
<rect x="624" y="132" width="512" height="368" rx="16" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="652" y="172" font-size="15" font-weight="800" letter-spacing="0.4" fill="#a9782f">GATE 2 · POST-TAP COMPLETION RATE</text>
<text x="652" y="212" font-size="13.5" fill="#5c5c5c">Only those who tapped = 100%</text>
<rect x="652" y="224" width="456" height="44" rx="9" fill="#f4efe4" stroke="#e4c98f" stroke-width="1.3"/>
<rect x="652" y="224" width="352" height="44" rx="9" fill="#c39a5f"/>
<text x="652" y="342" font-size="56" font-weight="800" fill="#a9782f">75-80%</text>
<text x="652" y="380" font-size="16" fill="#4f4f4f">of those who tap finish and submit</text>
<text x="652" y="452" font-size="13.5" font-style="italic" fill="#6d5a3a">This is the completion rate vendors report.</text>

<line x1="64" y1="536" x2="1136" y2="536" stroke="#ece5d7" stroke-width="1.5"/>
<text x="600" y="566" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Same card, two gates — two different denominators.</text>
<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#5c5c5c">8-15% is the share of all guests; 75-80% is the share of the guests who actually tapped.</text>
</svg>
