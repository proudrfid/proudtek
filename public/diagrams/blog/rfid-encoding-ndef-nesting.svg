<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How NDEF sits on the tag — a TLV wrapper, a message, a record, then just bytes</title>
<desc id="d">Nested-container diagram. An outer TLV wrapper opens with the green type byte 0x03 and closes with the terminator byte 0xFE. Inside it sits the NDEF message, and inside that an NDEF record with four fields: the header (MB, ME, CF, SR, IL and TNF flags), the type and payload lengths, the type — here 'U' for URI — and the gold payload, https://proudtek.com. Below, the same structure is flattened into the byte sequence actually written to the tag: 03, len, D1, 01, 55, the URL payload bytes, then FE. Caption: the reader unwraps each layer until it hits your URL — hand-rolling this works right up until one byte is wrong, so use a library.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DATA, GIFT-WRAPPED — THE NDEF CONTAINER</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Russian dolls, but every layer is bytes</text>

<!-- TLV wrapper -->
<rect x="72" y="124" width="1056" height="300" rx="16" fill="#faf6ec" stroke="#e4c98f" stroke-width="2"/>
<rect x="96" y="148" width="76" height="30" rx="8" fill="#1f6f3a"/>
<text x="134" y="168" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">0x03</text>
<text x="188" y="162" font-size="15" font-weight="800" fill="#291c0e">TLV wrapper</text>
<text x="188" y="180" font-size="12.5" fill="#4f4f4f">type byte, then a length field</text>
<rect x="1028" y="148" width="76" height="30" rx="8" fill="#4a5568"/>
<text x="1066" y="168" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">0xFE</text>
<text x="1066" y="198" text-anchor="middle" font-size="12" fill="#4f4f4f">terminator</text>

<!-- NDEF message -->
<rect x="104" y="210" width="992" height="190" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="126" y="238" font-size="14" font-weight="800" fill="#234a4a">NDEF message</text>
<text x="262" y="238" font-size="12.5" fill="#4f4f4f">= one or more records</text>

<!-- NDEF record -->
<rect x="126" y="252" width="948" height="128" rx="10" fill="#3d6b6b"/>
<text x="148" y="278" font-size="14" font-weight="800" fill="#ffffff">NDEF record</text>
<rect x="148" y="292" width="190" height="72" rx="8" fill="#2c5454" stroke="#5b8888"/>
<text x="243" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Header</text>
<text x="243" y="340" text-anchor="middle" font-size="12" fill="#cfe0e0">MB · ME · CF · SR · IL · TNF</text>
<rect x="350" y="292" width="170" height="72" rx="8" fill="#2c5454" stroke="#5b8888"/>
<text x="435" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Type length</text>
<text x="435" y="340" text-anchor="middle" font-size="12" fill="#cfe0e0">+ payload length</text>
<rect x="532" y="292" width="130" height="72" rx="8" fill="#2c5454" stroke="#5b8888"/>
<text x="597" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Type</text>
<text x="597" y="340" text-anchor="middle" font-size="12" fill="#cfe0e0">'U' = URI</text>
<rect x="674" y="292" width="376" height="72" rx="8" fill="#c39a5f"/>
<text x="862" y="320" text-anchor="middle" font-size="13.5" font-weight="800" fill="#291c0e">Payload</text>
<text x="862" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#52401f">https://proudtek.com</text>

<!-- byte strip -->
<text x="72" y="462" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">ON THE WIRE, IT'S JUST BYTES</text>
<rect x="72" y="478" width="84" height="44" rx="8" fill="#eaf5ec" stroke="#2d6a4f"/>
<text x="114" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6f3a">03</text>
<rect x="168" y="478" width="84" height="44" rx="8" fill="#f2f7f7" stroke="#cfe0e0"/>
<text x="210" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#234a4a">len</text>
<rect x="264" y="478" width="84" height="44" rx="8" fill="#f2f7f7" stroke="#cfe0e0"/>
<text x="306" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#234a4a">D1</text>
<rect x="360" y="478" width="84" height="44" rx="8" fill="#f2f7f7" stroke="#cfe0e0"/>
<text x="402" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#234a4a">01</text>
<rect x="456" y="478" width="84" height="44" rx="8" fill="#f2f7f7" stroke="#cfe0e0"/>
<text x="498" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#234a4a">55</text>
<rect x="552" y="478" width="460" height="44" rx="8" fill="#faf3e4" stroke="#e4c98f"/>
<text x="782" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#6d5a3a">… URL payload bytes …</text>
<rect x="1024" y="478" width="84" height="44" rx="8" fill="#eef1f5" stroke="#d3dae3"/>
<text x="1066" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#4a5568">FE</text>
<text x="72" y="552" font-size="12.5" fill="#4f4f4f">D1 · 01 · 55 = record header · payload length · type 'U' (URI)</text>

<text x="600" y="606" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="20" font-weight="700" fill="#291c0e">The reader unwraps each layer until it hits your URL.</text>
<text x="600" y="636" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Hand-rolling this works right up until one byte is wrong. Use a library.</text>
</svg>
