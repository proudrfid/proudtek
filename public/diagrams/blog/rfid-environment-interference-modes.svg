<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Four RFID environmental interference modes, each paired with its fix</title>
<desc id="d">A two-by-two grid of environmental interference modes. Top left, metal detuning: a standard tag on metal detunes the antenna by 50 to 200 MHz and range collapses; the fix is on-metal tags with a ferrite or air-gap layer such as Xerafy or Confidex Ironside. Top right, water and moisture: water absorbs UHF at 900 MHz so wet or submerged loads read poorly; the fix is switching to HF at 13.56 MHz or using liquid-tuned UHF tags. Bottom left, dense tag populations: past 50 to 100 tags in a zone Gen2 collisions can hide some entirely; the fix is tuning session and target and adding antennas around the read zone. Bottom right, tag orientation: a tag presented edge-on barely reads; the fix is aiming the read zone or using a circular polarized antenna.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FOUR WAYS THE ROOM FIGHTS THE FIELD</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Match the tag to the environment</text>
<text x="600" y="133" text-anchor="middle" font-size="15.5" fill="#4f4f4f">RF is physics — metal, water, density, and angle each fail in a predictable way.</text>

<!-- TL: Metal detuning -->
<rect x="64" y="168" width="520" height="180" rx="14" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="90" y="196" width="24" height="18" rx="2" fill="#4a5568"/>
<text x="128" y="212" font-size="17" font-weight="700" fill="#291c0e">Metal detuning</text>
<line x1="88" y1="228" x2="560" y2="228" stroke="#eee7d9" stroke-width="1.4"/>
<circle cx="98" cy="252" r="5" fill="#8b2d2d"/>
<text x="114" y="257" font-size="13.5" fill="#291c0e">A standard tag on metal detunes the</text>
<text x="114" y="276" font-size="13.5" fill="#291c0e">antenna 50-200 MHz — range collapses.</text>
<polyline points="92,300 97,305 106,294" fill="none" stroke="#1f6f3a" stroke-width="2.4"/>
<text x="114" y="307" font-size="13.5" fill="#234a4a">On-metal tags (ferrite / air-gap layer):</text>
<text x="114" y="326" font-size="13.5" fill="#234a4a">Xerafy, Confidex Ironside.</text>

<!-- TR: Water and moisture -->
<rect x="616" y="168" width="520" height="180" rx="14" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<circle cx="652" cy="206" r="9" fill="#3d6b6b"/><polygon points="652,190 645,202 659,202" fill="#3d6b6b"/>
<text x="676" y="212" font-size="17" font-weight="700" fill="#291c0e">Water and moisture</text>
<line x1="640" y1="228" x2="1112" y2="228" stroke="#eee7d9" stroke-width="1.4"/>
<circle cx="650" cy="252" r="5" fill="#8b2d2d"/>
<text x="666" y="257" font-size="13.5" fill="#291c0e">Water absorbs UHF at 900 MHz — wet or</text>
<text x="666" y="276" font-size="13.5" fill="#291c0e">submerged loads read poorly.</text>
<polyline points="644,300 649,305 658,294" fill="none" stroke="#1f6f3a" stroke-width="2.4"/>
<text x="666" y="307" font-size="13.5" fill="#234a4a">Switch to HF (13.56 MHz), or use</text>
<text x="666" y="326" font-size="13.5" fill="#234a4a">liquid-tuned UHF tags.</text>

<!-- BL: Dense tag populations -->
<rect x="64" y="360" width="520" height="180" rx="14" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<circle cx="92" cy="390" r="3" fill="#4a5568"/><circle cx="104" cy="390" r="3" fill="#4a5568"/><circle cx="116" cy="390" r="3" fill="#4a5568"/>
<circle cx="92" cy="402" r="3" fill="#4a5568"/><circle cx="104" cy="402" r="3" fill="#4a5568"/><circle cx="116" cy="402" r="3" fill="#4a5568"/>
<text x="132" y="404" font-size="17" font-weight="700" fill="#291c0e">Dense tag populations</text>
<line x1="88" y1="420" x2="560" y2="420" stroke="#eee7d9" stroke-width="1.4"/>
<circle cx="98" cy="444" r="5" fill="#8b2d2d"/>
<text x="114" y="449" font-size="13.5" fill="#291c0e">Past 50-100 tags in a zone, Gen2</text>
<text x="114" y="468" font-size="13.5" fill="#291c0e">collisions can hide some entirely.</text>
<polyline points="92,492 97,497 106,486" fill="none" stroke="#1f6f3a" stroke-width="2.4"/>
<text x="114" y="499" font-size="13.5" fill="#234a4a">Tune Session / Target; add antennas</text>
<text x="114" y="518" font-size="13.5" fill="#234a4a">around the read zone.</text>

<!-- BR: Tag orientation -->
<rect x="616" y="360" width="520" height="180" rx="14" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="648" y="388" width="10" height="26" rx="2" fill="#4a5568" transform="rotate(38 653 401)"/>
<text x="676" y="404" font-size="17" font-weight="700" fill="#291c0e">Tag orientation</text>
<line x1="640" y1="420" x2="1112" y2="420" stroke="#eee7d9" stroke-width="1.4"/>
<circle cx="650" cy="444" r="5" fill="#8b2d2d"/>
<text x="666" y="449" font-size="13.5" fill="#291c0e">A tag presented edge-on to the</text>
<text x="666" y="468" font-size="13.5" fill="#291c0e">antenna barely reads.</text>
<polyline points="644,492 649,497 658,486" fill="none" stroke="#1f6f3a" stroke-width="2.4"/>
<text x="666" y="499" font-size="13.5" fill="#234a4a">Aim the read zone, or use a</text>
<text x="666" y="518" font-size="13.5" fill="#234a4a">circular polarized antenna.</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#5c5c5c">None of these needs a bigger reader — they need the right tag, antenna, or read-zone geometry.</text>
</svg>
