<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Medical device UDI + RFID — mark the device, register the record</title>
<desc id="d">A medical device carries its UDI two ways: a printed human-readable label with a barcode showing the GTIN-14 Device Identifier and serial Production Identifier, and an RFID tag as the AIDC carrier. Radio arcs connect the device to the FDA GUDID database record, which lists the same Device Identifier and Production Identifier plus intended use, contraindications and MRI safety, submitted before commercial distribution. Below, three obligations: print the human-readable UDI, encode the AIDC carrier, and register the GUDID record.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MEDICAL DEVICE UDI + RFID · ONE COMBINED PROGRAM</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Mark the device. Register the record.</text>
<text x="600" y="130" text-anchor="middle" font-size="16" fill="#5c5c5c">FDA UDI compliance is marking plus GUDID registration — RFID accelerates the read</text>

