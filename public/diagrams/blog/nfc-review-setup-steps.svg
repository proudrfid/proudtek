<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Set up NFC tap-to-review in five steps</title>
<desc id="d">Five steps, about a day. One, get your Google review URL from business.google.com. Two, program the tag with the NFC Tools writer app in about a second. Three, place one or two tags where guests are happiest, not on a far wall. Four, train staff with a one-line hand-off script, which converts around 75 percent versus 8 percent for unscripted email. Five, monitor the dashboard and respond to every review within 48 hours.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SETUP · ABOUT A DAY, FIVE STEPS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">No technical resource required — a single-location owner can do this.</text>
<rect x="64" y="150" width="184" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/><rect x="64" y="150" width="184" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="156.0" cy="196" r="18" fill="#3d6b6b"/>
<text x="156.0" y="203" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
<text x="156.0" y="250" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Get the link</text>
<text x="156.0" y="276" text-anchor="middle" font-size="12" fill="#5c5c5c">business.google.com</text>
<text x="156.0" y="293" text-anchor="middle" font-size="12" fill="#5c5c5c">Get more reviews</text>
<rect x="80.0" y="320" width="152" height="30" rx="15.0" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/><text x="156.0" y="339.2" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">g.page/r/ link</text>
<rect x="286" y="150" width="184" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/><rect x="286" y="150" width="184" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="378.0" cy="196" r="18" fill="#3d6b6b"/>
<text x="378.0" y="203" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
<text x="378.0" y="250" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Program tag</text>
<text x="378.0" y="276" text-anchor="middle" font-size="12" fill="#5c5c5c">NFC Tools app</text>
<text x="378.0" y="293" text-anchor="middle" font-size="12" fill="#5c5c5c">write the URL</text>
<rect x="302.0" y="320" width="152" height="30" rx="15.0" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/><text x="378.0" y="339.2" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">~1 second</text>
<rect x="508" y="150" width="184" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/><rect x="508" y="150" width="184" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="600.0" cy="196" r="18" fill="#3d6b6b"/>
<text x="600.0" y="203" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
<text x="600.0" y="250" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Place it</text>
<text x="600.0" y="276" text-anchor="middle" font-size="12" fill="#5c5c5c">1-2 best spots</text>
<text x="600.0" y="293" text-anchor="middle" font-size="12" fill="#5c5c5c">not a far wall</text>
<rect x="524.0" y="320" width="152" height="30" rx="15.0" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/><text x="600.0" y="339.2" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">prime spots</text>
<rect x="730" y="150" width="184" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/><rect x="730" y="150" width="184" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="822.0" cy="196" r="18" fill="#3d6b6b"/>
<text x="822.0" y="203" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">4</text>
<text x="822.0" y="250" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Train staff</text>
<text x="822.0" y="276" text-anchor="middle" font-size="12" fill="#5c5c5c">one-line</text>
<text x="822.0" y="293" text-anchor="middle" font-size="12" fill="#5c5c5c">hand-off script</text>
<rect x="746.0" y="320" width="152" height="30" rx="15.0" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/><text x="822.0" y="339.2" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">75% vs 8%</text>
<rect x="952" y="150" width="184" height="300" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/><rect x="952" y="150" width="184" height="8" rx="4" fill="#c39a5f"/>
<circle cx="1044.0" cy="196" r="18" fill="#c39a5f"/>
<text x="1044.0" y="203" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">5</text>
<text x="1044.0" y="250" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Monitor</text>
<text x="1044.0" y="276" text-anchor="middle" font-size="12" fill="#5c5c5c">reply to every</text>
<text x="1044.0" y="293" text-anchor="middle" font-size="12" fill="#5c5c5c">review</text>
<rect x="968.0" y="320" width="152" height="30" rx="15.0" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/><text x="1044.0" y="339.2" text-anchor="middle" font-size="12" font-weight="800" fill="#6d5a3a">within 48 hours</text>
<line x1="251" y1="300" x2="258" y2="300" stroke="#291c0e" stroke-width="2.5"/><polygon points="258,293 267,300 258,307" fill="#291c0e"/>
<line x1="473" y1="300" x2="480" y2="300" stroke="#291c0e" stroke-width="2.5"/><polygon points="480,293 489,300 480,307" fill="#291c0e"/>
<line x1="695" y1="300" x2="702" y2="300" stroke="#291c0e" stroke-width="2.5"/><polygon points="702,293 711,300 702,307" fill="#291c0e"/>
<line x1="917" y1="300" x2="924" y2="300" stroke="#291c0e" stroke-width="2.5"/><polygon points="924,293 933,300 924,307" fill="#291c0e"/>
<text x="600" y="506" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The gap between 'cards arrived' and 'reviews arriving daily' is usually one day and these five steps.</text>
</svg>
