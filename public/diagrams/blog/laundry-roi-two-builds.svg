<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Two fully worked builds — a 250-room hotel and a 400-bed hospital</title>
<desc id="d">Hotel build: 18,000-piece par level; 18K tags at 55 cents equal $9,900; one tunnel reader $5K, two portals $7K, one handheld $1.5K; software $4K plus $400 a month; install and training $8K; total year-one $35-45K against savings of $60-90K from a 65 percent loss reduction — payback 7-11 months. Hospital build: 80,000-piece par level; 80K tags at 65 cents equal $52K; two tunnels $10K, four portals $14K, four handhelds $6K; software $8K plus $1K a month; ERP integration $25K; install and training $25K; total $145-170K against savings of $280-490K from a 70 percent loss reduction — payback 5-8 months. Both must budget OpEx of 5-12 percent of year-one CapEx.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NUMBERS PROCUREMENT CAN SIGN</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Two worked builds, every line item on the table</text>

<rect x="60" y="130" width="530" height="440" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="325" y="170" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">250-ROOM HOTEL · 18,000-PIECE PAR</text>
<g font-size="13" fill="#291c0e">
<text x="100" y="210">18K tags × $0.55</text><text x="550" y="210" text-anchor="end" font-weight="700">$9,900</text>
<text x="100" y="240">1 tunnel + 2 portals + 1 handheld</text><text x="550" y="240" text-anchor="end" font-weight="700">$13.5K</text>
<text x="100" y="270">software $4K + $400/mo · install + train $8K</text>
</g>
<line x1="100" y1="292" x2="550" y2="292" stroke="#2c5454" stroke-width="1.5"/>
<text x="100" y="324" font-size="14.5" font-weight="800" fill="#291c0e">Year-1 total</text>
<text x="550" y="324" text-anchor="end" font-size="16" font-weight="800" fill="#2c5454">$35K–45K</text>
<text x="100" y="362" font-size="14.5" font-weight="800" fill="#291c0e">Year-1 savings (65% loss cut)</text>
<text x="550" y="362" text-anchor="end" font-size="16" font-weight="800" fill="#1f6f3a">$60K–90K</text>
<rect x="130" y="396" width="390" height="46" rx="23" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="2"/>
<text x="325" y="425" text-anchor="middle" font-size="16" font-weight="800" fill="#1b4332">payback 7–11 months</text>
<text x="325" y="478" text-anchor="middle" font-size="12.5" fill="#4f4f4f">baseline: $90K–140K yearly replacement at 10–12% loss</text>
<text x="325" y="504" text-anchor="middle" font-size="12.5" fill="#4f4f4f">net Year-1: $20K–50K positive</text>
<text x="325" y="542" text-anchor="middle" font-size="12" fill="#6d5a3a">OpEx to budget: 5–12% of Year-1 CapEx, every year</text>

<rect x="610" y="130" width="530" height="440" rx="16" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="875" y="170" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">400-BED HOSPITAL · 80,000-PIECE PAR</text>
<g font-size="13" fill="#291c0e">
<text x="650" y="210">80K tags × $0.65</text><text x="1100" y="210" text-anchor="end" font-weight="700">$52K</text>
<text x="650" y="240">2 tunnels + 4 portals + 4 handhelds</text><text x="1100" y="240" text-anchor="end" font-weight="700">$30K</text>
<text x="650" y="270">software $8K + $1K/mo · ERP $25K · install $25K</text>
</g>
<line x1="650" y1="292" x2="1100" y2="292" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="650" y="324" font-size="14.5" font-weight="800" fill="#291c0e">Year-1 total</text>
<text x="1100" y="324" text-anchor="end" font-size="16" font-weight="800" fill="#6d5a3a">$145K–170K</text>
<text x="650" y="362" font-size="14.5" font-weight="800" fill="#291c0e">Year-1 savings (70% loss cut)</text>
<text x="1100" y="362" text-anchor="end" font-size="16" font-weight="800" fill="#1f6f3a">$280K–490K</text>
<rect x="680" y="396" width="390" height="46" rx="23" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="2"/>
<text x="875" y="425" text-anchor="middle" font-size="16" font-weight="800" fill="#1b4332">payback 5–8 months</text>
<text x="875" y="478" text-anchor="middle" font-size="12.5" fill="#4f4f4f">baseline: $400K–700K yearly replacement at 12–18% loss</text>
<text x="875" y="504" text-anchor="middle" font-size="12.5" fill="#4f4f4f">net Year-1: $130K–340K positive</text>
<text x="875" y="542" text-anchor="middle" font-size="12" fill="#6d5a3a">budget a 10% tag contingency — first-year attrition is real</text>

<text x="600" y="626" text-anchor="middle" font-size="13" fill="#5c5c5c">Soft savings (audit hours, dispute time, compliance prep) are real too — quantify them, but defend them separately.</text>
</svg>
