<line x1="665" y1="354" x2="1110" y2="354" stroke="#e4c98f" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="665" y="386" font-size="13.5" fill="#4f4f4f">Superpower</text>
<text x="1110" y="386" text-anchor="end" font-size="17" font-weight="700" fill="#291c0e">Multi-source + security</text>
<line x1="665" y1="410" x2="1110" y2="410" stroke="#e4c98f" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="665" y="442" font-size="13.5" fill="#4f4f4f">The catch</text>
<text x="1110" y="442" text-anchor="end" font-size="17" font-weight="700" fill="#291c0e">Volume inlays H2 2026</text>
<rect x="760" y="462" width="255" height="32" rx="16" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
<text x="887" y="483" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.5" fill="#8a6a2f">FULL ARC ROLLOUT INTO 2027</text>

