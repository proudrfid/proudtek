<rect x="114" y="196" width="250" height="300" rx="10" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
<rect x="114" y="196" width="250" height="42" rx="10" fill="#2d6a4f"/>
<rect x="114" y="220" width="250" height="18" fill="#2d6a4f"/>
<text x="239" y="223" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#ffffff">CERTIFICATE</text>
<text x="239" y="264" text-anchor="middle" font-size="12.5" fill="#4f4f4f">ISO 9001 — Quality Management</text>
<rect x="134" y="284" width="170" height="9" rx="4.5" fill="#e3e0d8"/>
<rect x="134" y="303" width="200" height="8" rx="4" fill="#e3e0d8"/>
<rect x="134" y="320" width="180" height="8" rx="4" fill="#e3e0d8"/>
<rect x="134" y="337" width="140" height="8" rx="4" fill="#e3e0d8"/>
<rect x="134" y="354" width="188" height="8" rx="4" fill="#e3e0d8"/>
<rect x="134" y="430" width="32" height="24" rx="4" fill="#f7edd6" stroke="#e4c98f"/>
<rect x="172" y="430" width="32" height="24" rx="4" fill="#f7edd6" stroke="#e4c98f"/>
<rect x="210" y="430" width="32" height="24" rx="4" fill="#f7edd6" stroke="#e4c98f"/>
<text x="134" y="476" font-size="12" fill="#6d5a3a">tri-logo + IAF MLA</text>
<circle cx="320" cy="440" r="26" fill="#d4a755" stroke="#b98a45" stroke-width="2"/>
<circle cx="320" cy="440" r="17" fill="none" stroke="#f7edd6" stroke-width="1.6" stroke-dasharray="3 3"/>
<path d="M 308 440 l 8 8 l 16 -18" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

<line x1="364" y1="225" x2="380" y2="225" stroke="#9fc9ae" stroke-width="1.5"/>
<rect x="380" y="210" width="170" height="30" rx="15" fill="#ffffff" stroke="#9fc9ae"/>
<text x="465" y="230" text-anchor="middle" font-size="12.5" fill="#1f6f3a">cert number ✓</text>
<line x1="364" y1="273" x2="380" y2="273" stroke="#9fc9ae" stroke-width="1.5"/>
<rect x="380" y="258" width="170" height="30" rx="15" fill="#ffffff" stroke="#9fc9ae"/>
<text x="465" y="278" text-anchor="middle" font-size="12.5" fill="#1f6f3a">issue / expiry dates ✓</text>
<line x1="364" y1="321" x2="380" y2="321" stroke="#9fc9ae" stroke-width="1.5"/>
<rect x="380" y="306" width="170" height="30" rx="15" fill="#ffffff" stroke="#9fc9ae"/>
