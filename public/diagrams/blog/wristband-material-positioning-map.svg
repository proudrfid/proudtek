<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Wristband material positioning: per-unit cost versus wear duration and reuse</title>
<desc id="d">A scatter map plotting three wristband materials by per-unit FOB cost (vertical) against wear duration and reuse model (horizontal). Fabric or Tyvek sits low-cost and single-day at $0.18 to $0.45. Woven sits higher-cost and multi-day at $0.60 to $1.20. Silicone sits at similar unit cost to woven, $0.55 to $1.40, but on the reusable end; a dashed arrow shows that amortized over 15 to 30 reuse cycles it drops to about $0.09 per guest — the cheapest wrist-RFID for reusable or multi-day programs.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">POSITIONING · WEAR-TIME vs COST</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">Per unit, silicone and woven rank together — reuse is what separates them.</text>

<!-- axes -->
<line x1="150" y1="120" x2="150" y2="474" stroke="#c8b79a" stroke-width="2"/>
<line x1="150" y1="474" x2="1140" y2="474" stroke="#c8b79a" stroke-width="2"/>
<text x="96" y="150" font-size="12" font-weight="700" fill="#6d5a3a">$ FOB</text>
<text x="96" y="168" font-size="12" fill="#8a6d34">higher</text>
<text x="96" y="462" font-size="12" fill="#8a6d34">lower</text>
<text x="300" y="500" text-anchor="middle" font-size="12.5" fill="#5c5c5c">single-day</text>
<text x="580" y="500" text-anchor="middle" font-size="12.5" fill="#5c5c5c">multi-day</text>
<text x="880" y="500" text-anchor="middle" font-size="12.5" fill="#5c5c5c">reusable / cycled</text>
<text x="645" y="524" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">WEAR DURATION / REUSE MODEL →</text>

<!-- Fabric bubble -->
<circle cx="300" cy="418" r="56" fill="#eef1f4" stroke="#4a5568" stroke-width="2.4"/>
<text x="300" y="410" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4456">Fabric</text>
<text x="300" y="430" text-anchor="middle" font-size="13" fill="#333333">$0.18–0.45</text>

<!-- Woven bubble -->
<circle cx="580" cy="248" r="56" fill="#f7edd6" stroke="#c39a5f" stroke-width="2.4"/>
<text x="580" y="240" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d34">Woven</text>
<text x="580" y="260" text-anchor="middle" font-size="13" fill="#333333">$0.60–1.20</text>

<!-- Silicone bubble -->
<circle cx="880" cy="262" r="58" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.4"/>
<text x="880" y="254" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">Silicone</text>
<text x="880" y="274" text-anchor="middle" font-size="13" fill="#333333">$0.55–1.40</text>

<!-- amortization arrow -->
<line x1="880" y1="320" x2="880" y2="410" stroke="#3d6b6b" stroke-width="2.4" stroke-dasharray="6 5"/>
<polygon points="880,414 873,400 887,400" fill="#3d6b6b"/>
<rect x="792" y="418" width="176" height="44" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="880" y="440" text-anchor="middle" font-size="13" font-weight="800" fill="#1f6f3a">~$0.09 / guest</text>
<text x="880" y="457" text-anchor="middle" font-size="12" fill="#5c5c5c">over 15–30 reuses</text>

<text x="150" y="566" font-size="14" fill="#291c0e">Same unit-cost band, opposite economics: fabric wins on absolute unit price for single-use;</text>
<text x="150" y="588" font-size="14" fill="#291c0e">silicone wins on amortized per-guest cost once a program reuses the band 15–30 times.</text>
</svg>
