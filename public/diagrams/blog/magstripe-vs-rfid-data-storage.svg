<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How a magnetic stripe stores bits versus how an RFID chip stores bits</title>
<desc id="d">A left-right comparison of data storage. The magnetic-stripe side shows bits recorded as magnetic flux reversals in iron-oxide particles, which any external magnet can re-align and erase. The RFID side shows bits held as electric charge in silicon memory cells, powered and read wirelessly through an antenna coil by a 13.56 MHz field, so magnets have no effect.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE THE BITS ACTUALLY LIVE</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Magstripe writes them magnetically. RFID holds them as charge on silicon.</text>

<!-- LEFT: magstripe -->
<rect x="60" y="118" width="524" height="470" rx="16" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="2"/>
<rect x="60" y="118" width="524" height="8" rx="4" fill="#4a5568"/>
<text x="322" y="162" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.5" fill="#4a5568">MAGNETIC STRIPE</text>
<text x="322" y="186" text-anchor="middle" font-size="13" fill="#8a8a8a">bits = magnetic flux reversals</text>
<!-- stripe with N/S arrows -->
<rect x="104" y="232" width="436" height="86" rx="6" fill="#20160b"/>
<text x="140" y="214" text-anchor="middle" font-size="12.5" fill="#8a8a8a">N</text>
<text x="212" y="214" text-anchor="middle" font-size="12.5" fill="#8a8a8a">S</text>
<text x="284" y="214" text-anchor="middle" font-size="12.5" fill="#8a8a8a">N</text>
<text x="356" y="214" text-anchor="middle" font-size="12.5" fill="#8a8a8a">S</text>
<text x="428" y="214" text-anchor="middle" font-size="12.5" fill="#8a8a8a">N</text>
<text x="500" y="214" text-anchor="middle" font-size="12.5" fill="#8a8a8a">S</text>
<line x1="122" y1="275" x2="158" y2="275" stroke="#e0b48a" stroke-width="3"/>
<polygon points="158,269 170,275 158,281" fill="#e0b48a"/>
<line x1="230" y1="275" x2="194" y2="275" stroke="#e0b48a" stroke-width="3"/>
<polygon points="194,269 182,275 194,281" fill="#e0b48a"/>
<line x1="266" y1="275" x2="302" y2="275" stroke="#e0b48a" stroke-width="3"/>
<polygon points="302,269 314,275 302,281" fill="#e0b48a"/>
<line x1="374" y1="275" x2="338" y2="275" stroke="#e0b48a" stroke-width="3"/>
<polygon points="338,269 326,275 338,281" fill="#e0b48a"/>
<line x1="410" y1="275" x2="446" y2="275" stroke="#e0b48a" stroke-width="3"/>
<polygon points="446,269 458,275 446,281" fill="#e0b48a"/>
<line x1="518" y1="275" x2="482" y2="275" stroke="#e0b48a" stroke-width="3"/>
<polygon points="482,269 470,275 482,281" fill="#e0b48a"/>
<text x="322" y="366" text-anchor="middle" font-size="14" fill="#5c5c5c">Iron-oxide particles, aligned to encode data.</text>
<rect x="150" y="404" width="344" height="52" rx="10" fill="#f7e7e7" stroke="#8b2d2d" stroke-width="1.6"/>
<text x="322" y="428" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">An outside magnet re-aligns them —</text>
<text x="322" y="446" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">this is real demagnetization.</text>
<text x="322" y="500" text-anchor="middle" font-size="12.5" fill="#8a8a8a">Phones and magnets can wipe this layer.</text>

<!-- RIGHT: RFID -->
<rect x="616" y="118" width="524" height="470" rx="16" fill="#fbfcfc" stroke="#e6dfd2" stroke-width="2"/>
<rect x="616" y="118" width="524" height="8" rx="4" fill="#3d6b6b"/>
<text x="878" y="162" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.5" fill="#2c5454">RFID / CONTACTLESS</text>
<text x="878" y="186" text-anchor="middle" font-size="13" fill="#8a8a8a">bits = charge in silicon memory</text>
<!-- antenna coil + chip -->
<rect x="700" y="224" width="356" height="130" rx="14" fill="none" stroke="#3d6b6b" stroke-width="2.4"/>
<rect x="716" y="240" width="324" height="98" rx="11" fill="none" stroke="#6f9a9a" stroke-width="1.8"/>
<rect x="732" y="256" width="292" height="66" rx="8" fill="none" stroke="#a9c6c6" stroke-width="1.4"/>
<rect x="850" y="266" width="56" height="46" rx="7" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<line x1="862" y1="278" x2="894" y2="278" stroke="#2c5454" stroke-width="1.6"/>
<line x1="862" y1="289" x2="894" y2="289" stroke="#2c5454" stroke-width="1.6"/>
<line x1="862" y1="300" x2="894" y2="300" stroke="#2c5454" stroke-width="1.6"/>
<text x="878" y="342" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">CHIP + ANTENNA</text>
<text x="878" y="384" text-anchor="middle" font-size="14" fill="#5c5c5c">Read wirelessly by a 13.56 MHz field.</text>
<rect x="704" y="404" width="348" height="52" rx="10" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.6"/>
<text x="878" y="428" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6f3a">No magnetic medium to disturb —</text>
<text x="878" y="446" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6f3a">nothing for a magnet to erase.</text>
<text x="878" y="500" text-anchor="middle" font-size="12.5" fill="#8a8a8a">Immune to phones, fridge magnets, even MRI.</text>
</svg>
