<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Target's three RFID tiers: T2 fully enforced, T3 phased, and non-tiered educational categories</title>
<desc id="d">Target sorts supplier categories into three tiers by enforcement maturity. Tier 2 is fully enforced and covers apparel, footwear, accessories, intimates and home textiles at a 95 percent read rate at receiving, with chargebacks live since 2023. Tier 3 is a phased rollout covering small electronics, toys, seasonal goods and home decor at a 90 percent pilot target, reaching 95 percent by the phase deadline across 2026 to 2027. Non-tiered educational categories are grocery, pharmacy and beauty consumables, where RFID is encouraged but not enforced. The chip and encoding are the same as Walmart; only the rulebook changes by tier.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RETAIL COMPLIANCE · TARGET RFID TIERS</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Know your tier before the first tag</text>
<text x="600" y="132" text-anchor="middle" font-size="16" fill="#4f4f4f">Target sorts categories by enforcement maturity — the tier sets your read rate, deadline and chargeback clock.</text>

<!-- Band 1: T2 -->
<rect x="90" y="168" width="1020" height="126" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="90" y="168" width="10" height="126" rx="5" fill="#2d6a4f"/>
<text x="168" y="228" text-anchor="middle" font-size="46" font-weight="800" fill="#2d6a4f">T2</text>
<text x="168" y="256" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#2d6a4f">FULLY ENFORCED</text>
<line x1="282" y1="188" x2="282" y2="274" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="312" y="206" font-size="12" font-weight="700" letter-spacing="0.5" fill="#5c5c5c">IN SCOPE</text>
<text x="312" y="232" font-size="15" fill="#291c0e">Apparel, footwear, accessories,</text>
<text x="312" y="256" font-size="15" fill="#291c0e">intimates, home textiles</text>
<rect x="812" y="184" width="278" height="94" rx="12" fill="#eaf3ec" stroke="#c5ddc9" stroke-width="1.4"/>
<text x="951" y="224" text-anchor="middle" font-size="30" font-weight="800" fill="#2d6a4f">95%+</text>
<text x="951" y="248" text-anchor="middle" font-size="12.5" fill="#4f4f4f">read rate at receiving</text>
<text x="951" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#2d6a4f">chargebacks live since 2023</text>

<!-- Band 2: T3 -->
<rect x="90" y="304" width="1020" height="126" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="90" y="304" width="10" height="126" rx="5" fill="#c39a5f"/>
<text x="168" y="364" text-anchor="middle" font-size="46" font-weight="800" fill="#6d5a3a">T3</text>
<text x="168" y="392" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PHASED ROLLOUT</text>
<line x1="282" y1="324" x2="282" y2="410" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="312" y="342" font-size="12" font-weight="700" letter-spacing="0.5" fill="#5c5c5c">IN SCOPE</text>
<text x="312" y="368" font-size="15" fill="#291c0e">Small electronics, toys,</text>
<text x="312" y="392" font-size="15" fill="#291c0e">seasonal goods, home decor</text>
<rect x="812" y="320" width="278" height="94" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="951" y="360" text-anchor="middle" font-size="30" font-weight="800" fill="#6d5a3a">90%+</text>
<text x="951" y="384" text-anchor="middle" font-size="12.5" fill="#4f4f4f">pilot-phase target</text>
<text x="951" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5a3a">95% by deadline · 2026-2027</text>

<!-- Band 3: Non-tiered -->
<rect x="90" y="440" width="1020" height="126" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="90" y="440" width="10" height="126" rx="5" fill="#4a5568"/>
<text x="168" y="498" text-anchor="middle" font-size="40" font-weight="800" fill="#4a5568">N/T</text>
<text x="168" y="528" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#4a5568">EDUCATIONAL</text>
<line x1="282" y1="460" x2="282" y2="546" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="312" y="478" font-size="12" font-weight="700" letter-spacing="0.5" fill="#5c5c5c">IN SCOPE</text>
<text x="312" y="504" font-size="15" fill="#291c0e">Grocery, pharmacy,</text>
<text x="312" y="528" font-size="15" fill="#291c0e">beauty consumables</text>
<rect x="812" y="456" width="278" height="94" rx="12" fill="#eef1f4" stroke="#c7cfd9" stroke-width="1.4"/>
<text x="951" y="496" text-anchor="middle" font-size="22" font-weight="800" fill="#4a5568">Not enforced</text>
<text x="951" y="520" text-anchor="middle" font-size="12.5" fill="#4f4f4f">RFID encouraged, not required</text>
<text x="951" y="540" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">early-mover advantage</text>

<text x="600" y="602" text-anchor="middle" font-size="14" fill="#4f4f4f">Same chip and encoding as Walmart — only the rulebook changes by tier.</text>
</svg>
