<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hotel card artwork: blank brief to press-ready in 14 working days</title>
<desc id="d">A Gantt timeline over 14 working days. Day 1, assemble the brief packet. Day 2, supplier kickoff call. Days 3 to 5, design layout and pre-press mark-up. Day 6, soft proof. Days 7 to 10, hard proof on real substrate. Day 11, defect log and rework decision. Day 12, sign-off or a second hard proof. Days 13 to 14, press-ready file lock. Production scheduling starts the day the file locks. Skipping or parallelizing steps typically pushes the timeline to 4 to 6 weeks.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BLANK BRIEF TO PRESS-READY IN 14 DAYS</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Each step gated by a deliverable — skip or parallelize and it becomes 4–6 weeks.</text>

