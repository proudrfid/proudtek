<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="tfTitle tfDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="tfTitle">Trader or factory? Six tells</title>
  <desc id="tfDesc">A six-row comparison of a direct factory versus a trading company: the mapped address (a plant of 8,000-plus square metres with docks versus a single office or residence); a live factory tour (Heidelberg and Komori print lines, 30-bay laminators versus refusal or stalling); lead time (CXJ 8 to 10 days under 20,000 cards versus 5 to 7 days of batching delay); the NXP chip invoice (direct distributor versus 2 to 3 hops); export documents (direct control versus 24 to 48 hours to reply); and the landed-cost quote (written in 4 to 8 hours versus 2 to 3 days).</desc>

  <defs>
    <radialGradient id="tfBg" cx="50%" cy="16%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#tfBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="58" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2" fill="#6d5a3a">TRADER OR FACTORY? SIX TELLS</text>
  <text x="600" y="86" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Most suppliers say "the factory." The paperwork says who is actually quoting you.</text>

  <!-- column headers -->
  <rect x="60" y="104" width="280" height="46" rx="10" fill="#efe6d4"/>
  <text x="76" y="133" font-size="15" font-weight="800" letter-spacing="1" fill="#6d5a3a">THE TELL</text>
  <rect x="348" y="104" width="392" height="46" rx="10" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="1.5"/>
  <text x="544" y="133" text-anchor="middle" font-size="15.5" font-weight="800" letter-spacing="1" fill="#1f6f3a">DIRECT FACTORY</text>
  <rect x="748" y="104" width="392" height="46" rx="10" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
  <text x="944" y="133" text-anchor="middle" font-size="15.5" font-weight="800" letter-spacing="1" fill="#8b2d2d">TRADING COMPANY</text>

  <!-- rows -->
  <g>
    <!-- row template y positions: 160,226,292,358,424,490 (h=60) -->
    <!-- 1 -->
    <rect x="60" y="160" width="280" height="60" rx="10" fill="#fbf8f2" stroke="#e4c98f" stroke-width="1.5"/>
    <text x="76" y="188" font-size="15.5" font-weight="800" fill="#291c0e">Address on the map</text>
    <text x="76" y="208" font-size="12" fill="#6d5a3a">satellite view</text>
    <rect x="348" y="160" width="392" height="60" rx="10" fill="#f3f9f4" stroke="#bfe0c8" stroke-width="1.5"/>
    <text x="368" y="196" font-size="14.5" fill="#1b4332">8,000+ sqm plant · loading docks</text>
    <rect x="748" y="160" width="392" height="60" rx="10" fill="#faf0f0" stroke="#e3c3c3" stroke-width="1.5"/>
    <text x="768" y="196" font-size="14.5" fill="#7a2222">a single office tower or residence</text>

    <!-- 2 -->
    <rect x="60" y="226" width="280" height="60" rx="10" fill="#fbf8f2" stroke="#e4c98f" stroke-width="1.5"/>
    <text x="76" y="254" font-size="15.5" font-weight="800" fill="#291c0e">Live factory tour</text>
    <text x="76" y="274" font-size="12" fill="#6d5a3a">on video, now</text>
    <rect x="348" y="226" width="392" height="60" rx="10" fill="#f3f9f4" stroke="#bfe0c8" stroke-width="1.5"/>
    <text x="368" y="253" font-size="14.5" fill="#1b4332">Heidelberg / Komori lines,</text>
    <text x="368" y="273" font-size="14.5" fill="#1b4332">30-bay laminators, chip bonding</text>
    <rect x="748" y="226" width="392" height="60" rx="10" fill="#faf0f0" stroke="#e3c3c3" stroke-width="1.5"/>
    <text x="768" y="262" font-size="14.5" fill="#7a2222">refuses, delays, or shows stock footage</text>

    <!-- 3 -->
    <rect x="60" y="292" width="280" height="60" rx="10" fill="#fbf8f2" stroke="#e4c98f" stroke-width="1.5"/>
    <text x="76" y="320" font-size="15.5" font-weight="800" fill="#291c0e">Lead time</text>
    <text x="76" y="340" font-size="12" fill="#6d5a3a">vs published tiers</text>
    <rect x="348" y="292" width="392" height="60" rx="10" fill="#f3f9f4" stroke="#bfe0c8" stroke-width="1.5"/>
    <text x="368" y="328" font-size="14.5" fill="#1b4332">CXJ 8–10 days (&lt;20K cards)</text>
    <rect x="748" y="292" width="392" height="60" rx="10" fill="#faf0f0" stroke="#e3c3c3" stroke-width="1.5"/>
    <text x="768" y="328" font-size="14.5" fill="#7a2222">+5–7 days of batching delay</text>

    <!-- 4 -->
    <rect x="60" y="358" width="280" height="60" rx="10" fill="#fbf8f2" stroke="#e4c98f" stroke-width="1.5"/>
    <text x="76" y="386" font-size="15.5" font-weight="800" fill="#291c0e">NXP chip invoice</text>
    <text x="76" y="406" font-size="12" fill="#6d5a3a">for the last lot</text>
    <rect x="348" y="358" width="392" height="60" rx="10" fill="#f3f9f4" stroke="#bfe0c8" stroke-width="1.5"/>
    <text x="368" y="394" font-size="14.5" fill="#1b4332">direct authorized-distributor invoice</text>
    <rect x="748" y="358" width="392" height="60" rx="10" fill="#faf0f0" stroke="#e3c3c3" stroke-width="1.5"/>
    <text x="768" y="394" font-size="14.5" fill="#7a2222">2–3 hops away, none to show</text>

    <!-- 5 -->
    <rect x="60" y="424" width="280" height="60" rx="10" fill="#fbf8f2" stroke="#e4c98f" stroke-width="1.5"/>
    <text x="76" y="452" font-size="15.5" font-weight="800" fill="#291c0e">Export docs / HS code</text>
    <text x="76" y="472" font-size="12" fill="#6d5a3a">who controls them</text>
    <rect x="348" y="424" width="392" height="60" rx="10" fill="#f3f9f4" stroke="#bfe0c8" stroke-width="1.5"/>
    <text x="368" y="460" font-size="14.5" fill="#1b4332">direct export-license control</text>
    <rect x="748" y="424" width="392" height="60" rx="10" fill="#faf0f0" stroke="#e3c3c3" stroke-width="1.5"/>
    <text x="768" y="460" font-size="14.5" fill="#7a2222">24–48 h to reply</text>

    <!-- 6 -->
    <rect x="60" y="490" width="280" height="60" rx="10" fill="#fbf8f2" stroke="#e4c98f" stroke-width="1.5"/>
    <text x="76" y="518" font-size="15.5" font-weight="800" fill="#291c0e">Landed-cost quote</text>
    <text x="76" y="538" font-size="12" fill="#6d5a3a">full TCO breakdown</text>
    <rect x="348" y="490" width="392" height="60" rx="10" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2"/>
    <text x="368" y="526" font-size="14.5" font-weight="700" fill="#1b4332">written in 4–8 hours</text>
    <rect x="748" y="490" width="392" height="60" rx="10" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2"/>
    <text x="768" y="526" font-size="14.5" font-weight="700" fill="#7a2222">2–3 days (round-trips the factory)</text>
  </g>

  <text x="600" y="592" text-anchor="middle" font-size="16.5" fill="#6d5a3a">Buy direct for cleaner accountability, lower TCO, and faster answers.</text>
</svg>
