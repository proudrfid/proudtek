<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Each reader energises only its own coil</title>
  <desc id="d">The same dual-frequency fob sits between a 125 kHz LF reader on the left and a 13.56 MHz HF reader on the right. The LF reader energises only the LF coil and the HF reader only the HF coil, so cross-coupling stays under 1 dB with no mutual interference; any unit over a 1 dB drop versus its single-chip baseline is rejected.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="alf" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3d6b6b"/></marker>
    <marker id="ahf" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6d5a3a"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EACH READER WAKES ONLY ITS OWN COIL</text>
  <text x="600" y="94" text-anchor="middle" font-size="16" fill="#5c5c5c">Two orders of magnitude apart — the chips never notice each other</text>

  <!-- LF reader -->
  <rect x="88" y="248" width="210" height="120" rx="14" fill="#3d6b6b"/>
  <text x="193" y="306" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">LF reader</text>
  <text x="193" y="334" text-anchor="middle" font-size="16" fill="#dfeaea">125 kHz</text>

  <!-- HF reader -->
  <rect x="902" y="248" width="210" height="120" rx="14" fill="#6d5a3a"/>
  <text x="1007" y="306" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">HF reader</text>
  <text x="1007" y="334" text-anchor="middle" font-size="16" fill="#efe6d6">13.56 MHz</text>

  <!-- fob -->
  <rect x="480" y="224" width="240" height="190" rx="24" fill="#f4efe4" stroke="#c39a5f" stroke-width="2.5"/>
  <ellipse cx="600" cy="308" rx="94" ry="74" fill="none" stroke="#6d5a3a" stroke-width="7"/>
  <ellipse cx="600" cy="308" rx="46" ry="38" fill="none" stroke="#3d6b6b" stroke-width="16"/>
  <text x="600" y="404" text-anchor="middle" font-size="13" fill="#8a949c">HF outer loop · LF inner ring</text>

  <!-- energise arrows -->
  <line x1="300" y1="300" x2="474" y2="292" stroke="#3d6b6b" stroke-width="3.5" marker-end="url(#alf)"/>
  <text x="388" y="272" text-anchor="middle" font-size="14" fill="#3d6b6b">energises LF coil only</text>
  <line x1="900" y1="300" x2="726" y2="350" stroke="#6d5a3a" stroke-width="3.5" marker-end="url(#ahf)"/>
  <text x="812" y="392" text-anchor="middle" font-size="14" fill="#6d5a3a">energises HF coil only</text>

  <!-- result band -->
  <rect x="330" y="470" width="540" height="150" rx="18" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="520" text-anchor="middle" font-size="30" font-weight="800" fill="#2c5454">&lt; 1 dB cross-coupling</text>
  <text x="600" y="554" text-anchor="middle" font-size="16" fill="#3d6b6b">no mutual interference · verified per unit, both frequencies</text>
  <text x="600" y="590" text-anchor="middle" font-size="15" fill="#8b2d2d">production reject: &gt; 1 dB drop vs single-chip baseline</text>
</svg>
