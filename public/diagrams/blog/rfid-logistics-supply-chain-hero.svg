<rect x="741" y="252" width="168" height="182" rx="14" fill="#eef1f4" stroke="#4a5568" stroke-width="1.6"/>
<circle cx="825" cy="304" r="3" fill="#2c5454"/>
<path d="M815 300 A 14 14 0 0 1 835 300" stroke="#2c5454" stroke-width="2.4" fill="none"/>
<path d="M808 293 A 24 24 0 0 1 842 293" stroke="#3d6b6b" stroke-width="2.2" fill="none"/>
<text x="825" y="352" text-anchor="middle" font-size="14.5" font-weight="800" letter-spacing="0.3" fill="#3a4658">YARD GATE</text>
<text x="825" y="374" text-anchor="middle" font-size="12.5" fill="#5c5c5c">windshield tag</text>
<rect x="777" y="392" width="96" height="26" rx="13" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="825" y="409" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">RFID read</text>

<!-- NODE 5 -->
<rect x="966" y="252" width="168" height="182" rx="14" fill="#eef1f4" stroke="#4a5568" stroke-width="1.6"/>
<circle cx="1050" cy="304" r="3" fill="#2c5454"/>
<path d="M1040 300 A 14 14 0 0 1 1060 300" stroke="#2c5454" stroke-width="2.4" fill="none"/>
<path d="M1033 293 A 24 24 0 0 1 1067 293" stroke="#3d6b6b" stroke-width="2.2" fill="none"/>
<text x="1050" y="352" text-anchor="middle" font-size="14.5" font-weight="800" letter-spacing="0.3" fill="#3a4658">OUTBOUND DOCK</text>
<text x="1050" y="374" text-anchor="middle" font-size="12.5" fill="#5c5c5c">portal reader</text>
<rect x="1002" y="392" width="96" height="26" rx="13" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
