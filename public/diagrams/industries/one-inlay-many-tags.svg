<text x="600" y="60" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2" fill="#6d5a3a">ONE INLAY → MANY INDUSTRY TAGS</text>
<ellipse cx="170" cy="300" rx="60" ry="78" fill="#fbf3e2" stroke="#c39a5f" stroke-width="3"/>
<ellipse cx="170" cy="300" rx="20" ry="26" fill="#fff" stroke="#c39a5f" stroke-width="2.5"/>
<path d="M225 360 q60 30 130 20" fill="none" stroke="#c39a5f" stroke-width="2" opacity="0.5"/>
<rect x="210" y="392" width="120" height="46" rx="5" fill="#fbf8f2" stroke="#c39a5f" stroke-width="2"/>
<rect x="216" y="398" width="108" height="34" rx="7" fill="none" stroke="#c39a5f" stroke-width="1.4" opacity="0.8"/>
<rect x="222" y="404" width="96" height="22" rx="4" fill="none" stroke="#c39a5f" stroke-width="1.4" opacity="0.8"/>
<rect x="260" y="406" width="20" height="18" rx="2" fill="#291c0e"/>
<text x="170" y="200" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">One wet-inlay roll</text>
<text x="270" y="465" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Mühlbauer inline-tested</text>
<path d="M355 300 h150" stroke="#c39a5f" stroke-width="3" marker-end="url(#ah)"/>
