<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">First-year retail shrinkage reduction after item-level RFID, by category</title>
<desc id="d">Horizontal bars of first-year shrinkage reduction after item-level RFID. Specialty retail — electronics, cosmetics and luxury — 60 to 80 percent. Apparel 50 to 70 percent. Department stores 40 to 60 percent. A gold panel adds that a 1 to 7 day detection window versus a quarterly count acts as a deterrent, and that administrative errors, some 30 to 40 percent of shrink, are cut at receiving and point of sale.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SHRINKAGE REDUCTION BY RETAIL VERTICAL</text>
<text x="600" y="88" text-anchor="middle" font-size="15.5" fill="#4f4f4f">First-year shrinkage cuts after item-level RFID, by category.</text>
<line x1="606" y1="150" x2="606" y2="352" stroke="#efe7d6" stroke-width="2"/>
<text x="606.0" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#8a8a8a">20%</text>
<line x1="760" y1="150" x2="760" y2="352" stroke="#efe7d6" stroke-width="2"/>
<text x="760.0" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#8a8a8a">40%</text>
<line x1="914" y1="150" x2="914" y2="352" stroke="#efe7d6" stroke-width="2"/>
<text x="914.0" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#8a8a8a">60%</text>
<line x1="1068" y1="150" x2="1068" y2="352" stroke="#efe7d6" stroke-width="2"/>
<text x="1068.0" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#8a8a8a">80%</text>
<text x="96" y="200" font-size="16" font-weight="800" fill="#291c0e">Specialty</text>
<text x="96" y="221" font-size="12.5" fill="#8a8a8a">electronics · cosmetics · luxury</text>
<rect x="452" y="176" width="616.0" height="44" rx="8" fill="#1f6f3a"/>
<text x="1080.0" y="205" font-size="15.5" font-weight="800" fill="#1f6f3a">60–80%</text>
<text x="96" y="268" font-size="16" font-weight="800" fill="#291c0e">Apparel</text>
<text x="96" y="289" font-size="12.5" fill="#8a8a8a">denim · activewear · footwear</text>
<rect x="452" y="244" width="539.0" height="44" rx="8" fill="#2f8a52"/>
<text x="1003.0" y="273" font-size="15.5" font-weight="800" fill="#1f6f3a">50–70%</text>
<text x="96" y="336" font-size="16" font-weight="800" fill="#291c0e">Department stores</text>
<text x="96" y="357" font-size="12.5" fill="#8a8a8a">multi-category floors</text>
<rect x="452" y="312" width="462.0" height="44" rx="8" fill="#57a276"/>
<text x="926.0" y="341" font-size="15.5" font-weight="800" fill="#1f6f3a">40–60%</text>
<rect x="88" y="398" width="1024" height="104" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<text x="120" y="446" font-size="30" font-weight="800" fill="#2c5454">1–7 days</text>
<text x="120" y="470" font-size="12.5" fill="#8a8a8a">to detect</text>
<line x1="300" y1="418" x2="300" y2="482" stroke="#ecdcc0" stroke-width="2"/>
<text x="330" y="440" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY THE CUTS COMPOUND</text>
<text x="330" y="466" font-size="14.5" fill="#291c0e">A 1–7 day detection window (vs a quarterly count) is a deterrent — loss gets timed and traced.</text>
<text x="330" y="488" font-size="13.5" fill="#5c5c5c">Administrative errors, ~30–40% of shrink, are caught at receiving and point of sale.</text>
<text x="600" y="556" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Reductions are first-year, item-level deployments; specialty's high per-item value drives the top of the range.</text>
</svg>
