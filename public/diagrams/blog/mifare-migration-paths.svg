<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Four MIFARE migration paths and the reader work each demands</title>
<desc id="d">Four migration routes drawn as rows. Row one: MIFARE Classic to MIFARE Plus — stay on the same sectors at Security Level 1, then switch to AES at Security Level 3 once readers update, tagged same cards. Row two: MIFARE Classic to MIFARE DESFire EV3 — a full change of memory architecture needing new cards and reader firmware, tagged new cards plus firmware. Row three: MIFARE Ultralight to MIFARE DESFire Light — upgrading single-use tickets to reusable AES credentials, tagged cost-optimized. Row four: a dual-chip card carrying both Classic and DESFire chips to bridge legacy and updated readers, tagged 2x chip cost. A footer advises testing 50 to 100 sample cards on every reader type before the production order.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="16%" r="94%">
    <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
  </radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MIFARE MIGRATION PATHS</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Four routes, four amounts of reader work</text>
<text x="600" y="126" text-anchor="middle" font-size="15.5" fill="#4f4f4f">The chips are cheap. Matching them to the readers already on the wall is the whole job.</text>

<!-- Row 1: Classic -> Plus -->
<rect x="64" y="150" width="1072" height="86" rx="14" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="88" y="167" width="228" height="52" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/>
<text x="202" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">MIFARE Classic</text>
<text x="202" y="209" text-anchor="middle" font-size="12" fill="#5c5c5c">1K / 4K · Crypto-1</text>
<line x1="332" y1="193" x2="828" y2="193" stroke="#3d6b6b" stroke-width="2.6"/>
<polygon points="828,193 815,186 815,200" fill="#3d6b6b"/>
<text x="580" y="180" text-anchor="middle" font-size="13" fill="#4f4f4f">Same sectors at SL1, then switch to AES at SL3 once readers update.</text>
<rect x="500" y="203" width="160" height="22" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.1"/>
<text x="580" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">same cards</text>
<rect x="848" y="167" width="252" height="52" rx="10" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="974" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">MIFARE Plus</text>
<text x="974" y="209" text-anchor="middle" font-size="12" fill="#5c5c5c">AES-128 · SL1 → SL3</text>

<!-- Row 2: Classic -> DESFire -->
<rect x="64" y="250" width="1072" height="86" rx="14" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="88" y="267" width="228" height="52" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/>
<text x="202" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">MIFARE Classic</text>
<text x="202" y="309" text-anchor="middle" font-size="12" fill="#5c5c5c">sector + block</text>
<line x1="332" y1="293" x2="828" y2="293" stroke="#4a5568" stroke-width="2.6"/>
<polygon points="828,293 815,286 815,300" fill="#4a5568"/>
<text x="580" y="280" text-anchor="middle" font-size="13" fill="#4f4f4f">Full change: new memory architecture — new cards and reader firmware.</text>
<rect x="492" y="303" width="176" height="22" rx="11" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.1"/>
<text x="580" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5a3a">new cards + firmware</text>
<rect x="848" y="267" width="252" height="52" rx="10" fill="#ffffff" stroke="#1f6f3a" stroke-width="1.6"/>
<text x="974" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">MIFARE DESFire EV3</text>
<text x="974" y="309" text-anchor="middle" font-size="12" fill="#5c5c5c">AES-128 · file system</text>

<!-- Row 3: Ultralight -> DESFire Light -->
<rect x="64" y="350" width="1072" height="86" rx="14" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="88" y="367" width="228" height="52" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/>
<text x="202" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">MIFARE Ultralight</text>
<text x="202" y="409" text-anchor="middle" font-size="12" fill="#5c5c5c">single-use tickets</text>
<line x1="332" y1="393" x2="828" y2="393" stroke="#3d6b6b" stroke-width="2.6"/>
<polygon points="828,393 815,386 815,400" fill="#3d6b6b"/>
<text x="580" y="380" text-anchor="middle" font-size="13" fill="#4f4f4f">Upgrade single-use transit tickets to reusable AES credentials.</text>
<rect x="500" y="403" width="160" height="22" rx="11" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.1"/>
<text x="580" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#234a4a">cost-optimized</text>
<rect x="848" y="367" width="252" height="52" rx="10" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="974" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">MIFARE DESFire Light</text>
<text x="974" y="409" text-anchor="middle" font-size="12" fill="#5c5c5c">reusable · AES-128</text>

<!-- Row 4: Dual-chip bridge -->
<rect x="64" y="450" width="1072" height="86" rx="14" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="88" y="467" width="228" height="52" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="1.6"/>
<text x="202" y="490" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Dual-chip card</text>
<text x="202" y="509" text-anchor="middle" font-size="12" fill="#5c5c5c">Classic + DESFire</text>
<line x1="332" y1="493" x2="828" y2="493" stroke="#c39a5f" stroke-width="2.6"/>
<polygon points="828,493 815,486 815,500" fill="#c39a5f"/>
<text x="580" y="480" text-anchor="middle" font-size="13" fill="#4f4f4f">One card carries both chips — bridge legacy and updated readers.</text>
<rect x="500" y="503" width="160" height="22" rx="11" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.1"/>
<text x="580" y="518" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5a3a">2x chip cost</text>
<rect x="848" y="467" width="252" height="52" rx="10" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="974" y="490" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Legacy + updated readers</text>
<text x="974" y="509" text-anchor="middle" font-size="12" fill="#5c5c5c">both accepted</text>

<text x="600" y="580" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Whatever the route: test 50–100 sample cards on every reader type before the production order.</text>
</svg>
