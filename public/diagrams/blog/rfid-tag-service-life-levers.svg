<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five deployment levers that extend RFID tag service life</title>
<desc id="d">Five cards, each a lever that extends tag life and the failure it prevents. One, shield from UV: prevents antenna-trace cracking in 12 to 18 months. Two, match the rating to the real site: prevents death in a hot wash tunnel. Three, use the correct adhesive: prevents 5 to 15 percent drop-off in year one. Four, leave thermal-expansion clearance: prevents inlay tears on metal spans over 200 millimetres. Five, run a refresh cycle: keeps past-warranty tags under 20 percent. Together they typically deliver two to three times the field service life with no chip-cost premium.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE LEVERS THAT BUY BACK LIFE</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Deployment choices — not chip cost — decide most of a tag's field life.</text>

<!-- 5 cards -->
<!-- card 1 -->
<rect x="78" y="140" width="186" height="250" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="78" y="140" width="186" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="171" cy="188" r="20" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="171" y="194" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">1</text>
<text x="171" y="238" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Shield from UV</text>
<line x1="104" y1="256" x2="238" y2="256" stroke="#eee6d7" stroke-width="1.4"/>
<text x="171" y="284" text-anchor="middle" font-size="12" fill="#8b2d2d">prevents</text>
<text x="171" y="316" text-anchor="middle" font-size="13" fill="#5c5c5c">trace cracks in</text>
<text x="171" y="335" text-anchor="middle" font-size="13" fill="#5c5c5c">12-18 months</text>

<!-- card 2 -->
<rect x="292" y="140" width="186" height="250" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="292" y="140" width="186" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="385" cy="188" r="20" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="385" y="194" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">2</text>
<text x="385" y="232" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Match rating</text>
<text x="385" y="251" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">to the site</text>
<line x1="318" y1="266" x2="452" y2="266" stroke="#eee6d7" stroke-width="1.4"/>
<text x="385" y="294" text-anchor="middle" font-size="12" fill="#8b2d2d">prevents</text>
<text x="385" y="326" text-anchor="middle" font-size="13" fill="#5c5c5c">wash-tunnel death</text>

<!-- card 3 -->
<rect x="506" y="140" width="186" height="250" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="506" y="140" width="186" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="599" cy="188" r="20" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="599" y="194" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">3</text>
<text x="599" y="232" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Correct</text>
<text x="599" y="251" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">adhesive</text>
<line x1="532" y1="266" x2="666" y2="266" stroke="#eee6d7" stroke-width="1.4"/>
<text x="599" y="294" text-anchor="middle" font-size="12" fill="#8b2d2d">prevents</text>
<text x="599" y="326" text-anchor="middle" font-size="13" fill="#5c5c5c">5-15% drop-off</text>
<text x="599" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">in year one</text>

<!-- card 4 -->
<rect x="720" y="140" width="186" height="250" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="720" y="140" width="186" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="813" cy="188" r="20" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="813" y="194" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">4</text>
<text x="813" y="232" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Expansion</text>
<text x="813" y="251" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">clearance</text>
<line x1="746" y1="266" x2="880" y2="266" stroke="#eee6d7" stroke-width="1.4"/>
<text x="813" y="294" text-anchor="middle" font-size="12" fill="#8b2d2d">prevents</text>
<text x="813" y="326" text-anchor="middle" font-size="13" fill="#5c5c5c">inlay tears on</text>
<text x="813" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">metal spans</text>

<!-- card 5 -->
<rect x="934" y="140" width="186" height="250" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="934" y="140" width="186" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="1027" cy="188" r="20" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="1027" y="194" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">5</text>
<text x="1027" y="238" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Refresh cycle</text>
<line x1="960" y1="256" x2="1094" y2="256" stroke="#eee6d7" stroke-width="1.4"/>
<text x="1027" y="284" text-anchor="middle" font-size="12" fill="#8b2d2d">prevents</text>
<text x="1027" y="316" text-anchor="middle" font-size="13" fill="#5c5c5c">running &gt;20%</text>
<text x="1027" y="335" text-anchor="middle" font-size="13" fill="#5c5c5c">past-warranty</text>

<!-- outcome band -->
<rect x="78" y="430" width="1042" height="86" rx="16" fill="#eef7f0" stroke="#1f6f3a" stroke-width="2.4"/>
<text x="600" y="470" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6f3a">2-3× field service life</text>
<text x="600" y="500" text-anchor="middle" font-size="15" fill="#33595a">— with no chip-cost premium. The chip was never the problem.</text>

<text x="600" y="576" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Ordered by how much life each lever buys back — the refresh cycle is the safety net under all four.</text>
</svg>
