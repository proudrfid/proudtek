<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five environmental forces that age an RFID tag</title>
<desc id="d">A central RFID tag icon is connected to five surrounding force cards. Temperature: cold cracks the glue and extreme heat needs specialty tags. Moisture: paper face stock wicks water and delaminates. UV or sunlight: embrittles the material and cracks the antenna trace. Chemicals: solvents and cleaners attack the shell. Mechanical stress: bending fractures the antenna. The forces rarely act alone.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE FORCES THAT AGE A TAG</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Your facility is rarely the lab the spec sheet was tested in.</text>

<!-- connectors -->
<line x1="600" y1="360" x2="600" y2="210" stroke="#d9d2c4" stroke-width="2.4"/>
<line x1="655" y1="345" x2="905" y2="285" stroke="#d9d2c4" stroke-width="2.4"/>
<line x1="655" y1="380" x2="905" y2="470" stroke="#d9d2c4" stroke-width="2.4"/>
<line x1="545" y1="380" x2="295" y2="470" stroke="#d9d2c4" stroke-width="2.4"/>
<line x1="545" y1="345" x2="295" y2="285" stroke="#d9d2c4" stroke-width="2.4"/>

<!-- central tag -->
<rect x="548" y="322" width="104" height="76" rx="10" fill="#f7edd6" stroke="#c39a5f" stroke-width="2.4"/>
<rect x="566" y="340" width="50" height="40" rx="5" fill="none" stroke="#4a5568" stroke-width="2"/>
<rect x="582" y="352" width="20" height="16" rx="2" fill="#4a5568"/>
<text x="600" y="418" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE TAG</text>

<!-- Temperature (top) -->
<rect x="490" y="150" width="220" height="60" rx="12" fill="#fdf3e2" stroke="#c39a5f" stroke-width="1.8"/>
<text x="510" y="176" font-size="15.5" font-weight="800" fill="#a07d43">TEMPERATURE</text>
<text x="510" y="196" font-size="12.5" fill="#7a6533">cold cracks glue, heat kills it</text>

<!-- Moisture (right-top) -->
<rect x="905" y="256" width="215" height="60" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="925" y="282" font-size="15.5" font-weight="800" fill="#2c5454">MOISTURE</text>
<text x="925" y="302" font-size="12.5" fill="#33595a">paper wicks, delaminates</text>

<!-- UV (right-bottom) -->
<rect x="905" y="440" width="215" height="60" rx="12" fill="#fdf3e2" stroke="#c39a5f" stroke-width="1.8"/>
<text x="925" y="466" font-size="15.5" font-weight="800" fill="#a07d43">UV / SUNLIGHT</text>
<text x="925" y="486" font-size="12.5" fill="#7a6533">embrittles, cracks the trace</text>

<!-- Chemicals (left-bottom) -->
<rect x="80" y="440" width="215" height="60" rx="12" fill="#f6e9e9" stroke="#8b2d2d" stroke-width="1.8"/>
<text x="100" y="466" font-size="15.5" font-weight="800" fill="#8b2d2d">CHEMICALS</text>
<text x="100" y="486" font-size="12.5" fill="#7a4b4b">solvents attack the shell</text>

<!-- Mechanical (left-top) -->
<rect x="80" y="256" width="215" height="60" rx="12" fill="#eef0f3" stroke="#4a5568" stroke-width="1.8"/>
<text x="100" y="282" font-size="15.5" font-weight="800" fill="#4a5568">MECHANICAL</text>
<text x="100" y="302" font-size="12.5" fill="#5c5c5c">bending fractures antenna</text>

<text x="600" y="560" text-anchor="middle" font-size="15" fill="#4f4f4f">Five forces, rarely acting alone — match the tag's rating to the ones your site actually has.</text>
</svg>
