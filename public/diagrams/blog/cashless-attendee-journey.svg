<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The cashless attendee money journey, from top-up to refund</title>
<desc id="d">Four stages. One, pre-event top-up online before doors, taken up by 40 to 60 percent of attendees. Two, on-site top-up at kiosks and cash-to-credit stations, sized at one kiosk per 500 attendees. Three, tap to pay at every vendor in under two seconds. Four, post-event refund of unused credit, done automatically — the trust-critical stage. Make the refund automatic, or the queue becomes the review.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE ATTENDEE MONEY JOURNEY</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Designed for speed and transparency, or the cashless trust breaks.</text>

<!-- card 1 -->
<rect x="72" y="196" width="236" height="240" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="72" y="196" width="236" height="7" rx="3.5" fill="#3d6b6b"/>
<circle cx="102" cy="234" r="15" fill="#3d6b6b"/>
<text x="102" y="240" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="190" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Pre-event top-up</text>
<text x="190" y="323" text-anchor="middle" font-size="12" fill="#5c5c5c">online, before doors</text>
<rect x="94" y="352" width="192" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="190" y="374" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">40-60% pre-load</text>

<!-- card 2 -->
<rect x="346" y="196" width="236" height="240" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="346" y="196" width="236" height="7" rx="3.5" fill="#3d6b6b"/>
<circle cx="376" cy="234" r="15" fill="#3d6b6b"/>
<text x="376" y="240" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="464" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">On-site top-up</text>
<text x="464" y="323" text-anchor="middle" font-size="12" fill="#5c5c5c">kiosk · cash-to-credit</text>
<rect x="368" y="352" width="192" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="464" y="374" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">1 kiosk / 500</text>

<!-- card 3 -->
<rect x="620" y="196" width="236" height="240" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="620" y="196" width="236" height="7" rx="3.5" fill="#3d6b6b"/>
<circle cx="650" cy="234" r="15" fill="#3d6b6b"/>
<text x="650" y="240" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="738" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Tap to pay</text>
<text x="738" y="323" text-anchor="middle" font-size="12" fill="#5c5c5c">at every vendor</text>
<rect x="642" y="352" width="192" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="738" y="374" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">under 2 seconds</text>

<!-- card 4 (trust-critical) -->
<rect x="894" y="196" width="236" height="240" rx="13" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="894" y="196" width="236" height="7" rx="3.5" fill="#c39a5f"/>
<circle cx="924" cy="234" r="15" fill="#c39a5f"/>
<text x="924" y="240" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="1012" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Post-event refund</text>
<text x="1012" y="323" text-anchor="middle" font-size="12" fill="#6d5a3a">unused credit, automatic</text>
<rect x="916" y="352" width="192" height="34" rx="17" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="1012" y="374" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8a6d34">trust-critical</text>

<!-- arrows -->
<line x1="312" y1="300" x2="338" y2="300" stroke="#291c0e" stroke-width="3"/>
<polygon points="338,294 346,300 338,306" fill="#291c0e"/>
<line x1="586" y1="300" x2="612" y2="300" stroke="#291c0e" stroke-width="3"/>
<polygon points="612,294 620,300 612,306" fill="#291c0e"/>
<line x1="860" y1="300" x2="886" y2="300" stroke="#291c0e" stroke-width="3"/>
<polygon points="886,294 894,300 886,306" fill="#291c0e"/>

<text x="600" y="486" text-anchor="middle" font-size="14.5" fill="#5c5c5c">The refund is the last thing attendees remember. Make it automatic, or the queue becomes the review.</text>
</svg>
