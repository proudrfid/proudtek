<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Proud Tek factory-direct sourcing flow: from a free sample pack to a standing production order</title>
  <desc id="d">Five steps left to right. Step 1, free sample pack: 8-12 SKUs across LF, HF and UHF shipped by DHL. Step 2, factory-direct quote: chip, MOQ and price itemised in writing. Step 3, proof and first article: a digital proof signed off and tested on your reader. Step 4, production and QC: about 5-7 business days with 100% read-verification and a photographic QC report. Step 5, export and delivery: DDP, FOB or CIF by DHL, FedEx or sea with 3-5 day call-offs. A base arrow underneath shows buyer commitment rising only as risk falls; nothing ships without a QC report you can check.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FROM SAMPLE TO STANDING PO</text>
  <text x="600" y="98" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Front-load the cheap, reversible steps</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">Each step earns the next — nothing ships without a QC report you can check.</text>

  <!-- step 1 -->
  <rect x="48" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="143" cy="216" r="18" fill="#3d6b6b"/>
  <text x="143" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
  <text x="143" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Free sample</text>
  <text x="143" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">pack</text>
  <text x="143" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">8-12 SKUs by DHL</text>
  <text x="143" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">LF / HF / UHF</text>
  <rect x="63" y="404" width="160" height="34" rx="8" fill="#eef5f5"/>
  <text x="143" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">test before you pay</text>

  <!-- step 2 -->
  <rect x="274" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="369" cy="216" r="18" fill="#4a5568"/>
  <text x="369" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
  <text x="369" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Factory-direct</text>
  <text x="369" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">quote</text>
  <text x="369" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">chip, MOQ, price</text>
  <text x="369" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">itemised in writing</text>
  <rect x="289" y="404" width="160" height="34" rx="8" fill="#eef1f5"/>
  <text x="369" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">factory-gate price</text>

  <!-- step 3 -->
  <rect x="500" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="595" cy="216" r="18" fill="#4a5568"/>
  <text x="595" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
  <text x="595" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Proof &amp;</text>
  <text x="595" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">first article</text>
  <text x="595" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">digital proof,</text>
  <text x="595" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">tested on your reader</text>
  <rect x="515" y="404" width="160" height="34" rx="8" fill="#eef1f5"/>
  <text x="595" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">sign-off before run</text>

  <!-- step 4 (quality gate, highlighted) -->
  <rect x="726" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
  <circle cx="821" cy="216" r="18" fill="#c39a5f"/>
  <text x="821" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
  <text x="821" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Production</text>
  <text x="821" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">&amp; QC</text>
  <text x="821" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">5-7 business days,</text>
  <text x="821" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">photographic QC</text>
  <rect x="741" y="404" width="160" height="34" rx="8" fill="#f7edd6"/>
  <text x="821" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">100% read-verified</text>

  <!-- step 5 -->
  <rect x="952" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="1047" cy="216" r="18" fill="#2c5454"/>
  <text x="1047" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
  <text x="1047" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Export &amp;</text>
  <text x="1047" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">delivery</text>
  <text x="1047" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">DDP / FOB / CIF</text>
  <text x="1047" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">DHL · FedEx · sea</text>
  <rect x="967" y="404" width="160" height="34" rx="8" fill="#eef5f5"/>
  <text x="1047" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">3-5 day call-off</text>

  <!-- chevrons between steps -->
  <polygon points="250,315 262,325 250,335" fill="#c39a5f"/>
  <polygon points="476,315 488,325 476,335" fill="#c39a5f"/>
  <polygon points="702,315 714,325 702,335" fill="#c39a5f"/>
  <polygon points="928,315 940,325 928,335" fill="#c39a5f"/>

  <!-- progression base arrow -->
  <text x="100" y="548" font-size="13" font-weight="700" fill="#5c5c5c">Low cost · reversible</text>
  <text x="1090" y="548" text-anchor="end" font-size="13" font-weight="700" fill="#5c5c5c">Full commitment</text>
  <line x1="100" y1="572" x2="1072" y2="572" stroke="#4a5568" stroke-width="3"/>
  <polygon points="1072,564 1090,572 1072,580" fill="#4a5568"/>
  <text x="600" y="614" text-anchor="middle" font-size="15" fill="#291c0e">Nothing ships without a QC report you can check.</text>
</svg>
