<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Lead-capture cost: manual business cards versus RFID app capture, and the renewal payoff</title>
<desc id="d">Three panels. Manual business-card capture costs 15 to 30 dollars per qualified lead, transcribed post-show, with a 5 to 15 percent error rate and 10 to 20 percent of cards never entered. RFID app capture costs 3 to 5 dollars per lead all-in, syncs to CRM within 60 seconds, with zero transcription error. The payoff: exhibitors who get leads in the first hour see 25 to 40 percent higher next-year rebooking.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE LEAD-CAPTURE MATH</text>
<text x="600" y="86" text-anchor="middle" font-size="15" fill="#4f4f4f">What a captured lead costs — and why the speed of delivery drives renewals.</text>
<!-- manual card -->
<rect x="76" y="150" width="336" height="316" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="76" y="150" width="336" height="8" rx="4" fill="#4a5568"/>
<text x="244" y="196" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4557">Manual · business cards</text>
<text x="244" y="288" text-anchor="middle" font-size="44" font-weight="800" fill="#4a5568">$15–30</text>
<text x="244" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">per qualified lead</text>
<text x="244" y="376" text-anchor="middle" font-size="13" fill="#5c5c5c">transcribed 7–14 days post-show</text>
<text x="244" y="404" text-anchor="middle" font-size="13" fill="#5c5c5c">5–15% error · 10–20% never entered</text>
<text x="244" y="440" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">slow, lossy</text>
<!-- rfid card -->
<rect x="432" y="150" width="336" height="316" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="432" y="150" width="336" height="8" rx="4" fill="#3d6b6b"/>
<text x="600" y="196" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">RFID app capture</text>
<text x="600" y="288" text-anchor="middle" font-size="44" font-weight="800" fill="#2c5454">$3–5</text>
<text x="600" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">per lead, all-in</text>
<text x="600" y="376" text-anchor="middle" font-size="13" fill="#5c5c5c">badge + scanner + platform</text>
<text x="600" y="404" text-anchor="middle" font-size="13" fill="#5c5c5c">CRM sync in 60 seconds · zero errors</text>
<text x="600" y="440" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">fast, clean</text>
<!-- payoff card -->
<rect x="788" y="150" width="336" height="316" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="788" y="150" width="336" height="8" rx="4" fill="#c39a5f"/>
<text x="956" y="196" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">The real-time payoff</text>
<text x="956" y="288" text-anchor="middle" font-size="44" font-weight="800" fill="#2c5454">25–40%</text>
<text x="956" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">higher next-year rebooking</text>
<rect x="820" y="360" width="272" height="34" rx="17" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="956" y="382" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">when leads land in the first hour</text>
<text x="956" y="436" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the single biggest renewal driver</text>
<text x="600" y="520" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The badge is cheap; the clock is decisive — a lead delivered in the first hour rebooks far better than one</text>
<text x="600" y="544" text-anchor="middle" font-size="14.5" fill="#4f4f4f">handed over at teardown.</text>
</svg>
