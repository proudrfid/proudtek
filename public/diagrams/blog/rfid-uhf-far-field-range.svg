<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">UHF at 860–960 MHz — far-field range and its enemies</title>
<desc id="d">Far-field diagram. A fixed UHF reader on the left radiates expanding arcs across the canvas to a pallet of nine tagged cartons on the right. A range bar underneath runs from 1 to 12 metres for passive tags, 15 metres and beyond for battery-assisted ones. A stat pill notes 200 to 1,000 tags per second bulk reading; a red warning pill notes that bare metal reflects the signal and water absorbs it, so those targets need special on-metal or high-Q tags.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
