<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Inside an RFID card: four laminated layers, one thinking middle</title>
<desc id="d">Exploded view of an RFID card's four layers. A printed top layer carries logos, artwork and security print. Below it, highlighted with a dashed teal outline, sits the antenna coil and microchip inlay — the entire brains of the card, which wakes only when a reader feeds it power. Then a structural PVC or PETG core of plastic sheets, and a printed bottom layer. A top ruler notes the CR80 format, 85.6 by 54 millimetres; a footer notes the stack is fused under heat and pressure into 0.76 millimetres — about eight sheets of paper — with the chip itself only 1 to 2 millimetres square.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
