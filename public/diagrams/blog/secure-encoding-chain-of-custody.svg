<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Chain of custody for encoded event wristbands, in five stages</title>
<desc id="d">A five-stage flow. One, encode in a controlled facility with access-controlled keys. Two, record each chip UID against its ticket purchase as a one-to-one mapping. Three, seal and reconcile every shipment box by box with chain-of-custody seals. Four, validate at the gate against the whitelist. Five, retire unused credentials by destroying or securely storing them. The caution: blank, un-encoded wristbands shipped loose let anyone in the chain encode their own duplicates.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SECURE ENCODING · CHAIN OF CUSTODY</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">From the encoding room to the gate to disposal — track every credential.</text>

<!-- card 1 -->
<rect x="72" y="200" width="184" height="252" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="72" y="200" width="184" height="7" rx="3.5" fill="#3d6b6b"/>
<circle cx="100" cy="238" r="15" fill="#3d6b6b"/>
<text x="100" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<rect x="146" y="270" width="52" height="40" rx="5" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<rect x="160" y="282" width="24" height="16" rx="2" fill="#d4a755"/>
<text x="164" y="352" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Encode in a</text>
<text x="164" y="371" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">controlled facility</text>
<text x="164" y="398" text-anchor="middle" font-size="12" fill="#5c5c5c">access-controlled keys</text>

<!-- card 2 -->
<rect x="296" y="200" width="184" height="252" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="296" y="200" width="184" height="7" rx="3.5" fill="#3d6b6b"/>
<circle cx="324" cy="238" r="15" fill="#3d6b6b"/>
<text x="324" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<circle cx="366" cy="290" r="12" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<line x1="378" y1="290" x2="398" y2="290" stroke="#2c5454" stroke-width="2"/>
<rect x="398" y="278" width="24" height="24" rx="3" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<text x="388" y="352" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Record UID to</text>
<text x="388" y="371" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">ticket purchase</text>
<text x="388" y="398" text-anchor="middle" font-size="12" fill="#5c5c5c">one-to-one mapping</text>

<!-- card 3 -->
<rect x="520" y="200" width="184" height="252" rx="13" fill="#ffffff" stroke="#e4c98f" stroke-width="1.6"/>
<rect x="520" y="200" width="184" height="7" rx="3.5" fill="#c39a5f"/>
<circle cx="548" cy="238" r="15" fill="#c39a5f"/>
<text x="548" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<rect x="588" y="270" width="48" height="40" rx="4" fill="#f7edd6" stroke="#b8862f" stroke-width="2"/>
<line x1="588" y1="284" x2="636" y2="284" stroke="#b8862f" stroke-width="2"/>
<circle cx="612" cy="290" r="7" fill="#c39a5f"/>
<text x="612" y="352" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Seal &amp; reconcile</text>
<text x="612" y="371" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">every shipment</text>
<text x="612" y="398" text-anchor="middle" font-size="12" fill="#6d5a3a">chain-of-custody seals</text>

<!-- card 4 -->
<rect x="744" y="200" width="184" height="252" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="744" y="200" width="184" height="7" rx="3.5" fill="#3d6b6b"/>
<circle cx="772" cy="238" r="15" fill="#3d6b6b"/>
<text x="772" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<circle cx="836" cy="290" r="20" fill="#eef5f5" stroke="#1f6f3a" stroke-width="2.5"/>
<polyline points="827,290 834,298 847,282" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="836" y="352" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Validate at</text>
<text x="836" y="371" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">the gate</text>
<text x="836" y="398" text-anchor="middle" font-size="12" fill="#5c5c5c">against the whitelist</text>

<!-- card 5 -->
<rect x="968" y="200" width="184" height="252" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="968" y="200" width="184" height="7" rx="3.5" fill="#3d6b6b"/>
<circle cx="996" cy="238" r="15" fill="#3d6b6b"/>
<text x="996" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
<rect x="1042" y="284" width="36" height="28" rx="4" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<path d="M1048 284 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#2c5454" stroke-width="2.5"/>
<text x="1060" y="352" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Retire unused</text>
<text x="1060" y="371" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">credentials</text>
<text x="1060" y="398" text-anchor="middle" font-size="12" fill="#5c5c5c">destroy or lock away</text>

<!-- arrows -->
<line x1="262" y1="326" x2="288" y2="326" stroke="#291c0e" stroke-width="3"/>
<polygon points="288,320 300,326 288,332" fill="#291c0e"/>
<line x1="486" y1="326" x2="512" y2="326" stroke="#291c0e" stroke-width="3"/>
<polygon points="512,320 524,326 512,332" fill="#291c0e"/>
<line x1="710" y1="326" x2="736" y2="326" stroke="#291c0e" stroke-width="3"/>
<polygon points="736,320 748,326 736,332" fill="#291c0e"/>
<line x1="934" y1="326" x2="960" y2="326" stroke="#291c0e" stroke-width="3"/>
<polygon points="960,320 972,326 960,332" fill="#291c0e"/>

<rect x="120" y="500" width="960" height="60" rx="12" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.5"/>
<rect x="120" y="500" width="9" height="60" rx="4" fill="#8b2d2d"/>
<text x="600" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#8b2d2d">The gap most events miss</text>
<text x="600" y="547" text-anchor="middle" font-size="13" fill="#5c5c5c">Blank, un-encoded wristbands shipped loose let anyone in the chain encode their own duplicates.</text>
</svg>
