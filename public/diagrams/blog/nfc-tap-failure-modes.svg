<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five ways an NFC gift tag tap fails on Christmas morning, each paired with its fix</title>
<desc id="d">Five failure modes and their fixes. One, metal foil wrap or foil ribbon blocks the 13.56 MHz field, so use paper wrap or tag the bow. Two, the host link expires by Christmas morning, so test it on a fresh phone with no login the day before. Three, tapping the wrong part of the phone fails, so label the top of an iPhone and the back of an Android. Four, Android NFC is switched off to save battery, so add a printed QR code for about one cent. Five, over-tagging every gift dilutes the magic, so pick the one or two gifts that matter most.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PRACTICAL GOTCHAS</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Five ways the tap dies, and the fix</text>
<text x="600" y="130" text-anchor="middle" font-size="15.5" fill="#4f4f4f">All five are preventable with a five-minute test before the gift goes under the tree.</text>

<text x="112" y="160" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#8b2d2d">WHAT KILLS THE TAP</text>
<text x="698" y="160" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#1f6f3a">THE FIVE-MINUTE FIX</text>

<!-- row 1 -->
<rect x="64" y="176" width="548" height="60" rx="10" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.3"/>
<rect x="64" y="176" width="9" height="60" rx="4" fill="#8b2d2d"/>
<text x="96" y="212" font-size="13.5" fill="#291c0e">Metal foil wrap or ribbon blocks 13.56 MHz</text>
<line x1="620" y1="206" x2="642" y2="206" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="642,200 654,206 642,212" fill="#291c0e"/>
<rect x="662" y="176" width="474" height="60" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.3"/>
<rect x="662" y="176" width="9" height="60" rx="4" fill="#1f6f3a"/>
<text x="694" y="212" font-size="13.5" fill="#291c0e">Use paper wrap, or stick the tag on the bow</text>

<!-- row 2 -->
<rect x="64" y="246" width="548" height="60" rx="10" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.3"/>
<rect x="64" y="246" width="9" height="60" rx="4" fill="#8b2d2d"/>
<text x="96" y="282" font-size="13.5" fill="#291c0e">Host link expired by Christmas morning</text>
<line x1="620" y1="276" x2="642" y2="276" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="642,270 654,276 642,282" fill="#291c0e"/>
<rect x="662" y="246" width="474" height="60" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.3"/>
<rect x="662" y="246" width="9" height="60" rx="4" fill="#1f6f3a"/>
<text x="694" y="282" font-size="13.5" fill="#291c0e">Test on a fresh phone, no login, the day before</text>

<!-- row 3 -->
<rect x="64" y="316" width="548" height="60" rx="10" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.3"/>
<rect x="64" y="316" width="9" height="60" rx="4" fill="#8b2d2d"/>
<text x="96" y="352" font-size="13.5" fill="#291c0e">Recipient taps the wrong part of the phone</text>
<line x1="620" y1="346" x2="642" y2="346" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="642,340 654,346 642,352" fill="#291c0e"/>
<rect x="662" y="316" width="474" height="60" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.3"/>
<rect x="662" y="316" width="9" height="60" rx="4" fill="#1f6f3a"/>
<text x="694" y="352" font-size="13.5" fill="#291c0e">Label it: top of iPhone, back of Android</text>

<!-- row 4 -->
<rect x="64" y="386" width="548" height="60" rx="10" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.3"/>
<rect x="64" y="386" width="9" height="60" rx="4" fill="#8b2d2d"/>
<text x="96" y="422" font-size="13.5" fill="#291c0e">Android NFC switched off to save battery</text>
<line x1="620" y1="416" x2="642" y2="416" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="642,410 654,416 642,422" fill="#291c0e"/>
<rect x="662" y="386" width="474" height="60" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.3"/>
<rect x="662" y="386" width="9" height="60" rx="4" fill="#1f6f3a"/>
<text x="694" y="422" font-size="13.5" fill="#291c0e">Add a printed QR code as backup (1 cent)</text>

<!-- row 5 -->
<rect x="64" y="456" width="548" height="60" rx="10" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.3"/>
<rect x="64" y="456" width="9" height="60" rx="4" fill="#8b2d2d"/>
<text x="96" y="492" font-size="13.5" fill="#291c0e">Over-tagging — every gift gets a tag</text>
<line x1="620" y1="486" x2="642" y2="486" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="642,480 654,486 642,492" fill="#291c0e"/>
<rect x="662" y="456" width="474" height="60" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.3"/>
<rect x="662" y="456" width="9" height="60" rx="4" fill="#1f6f3a"/>
<text x="694" y="492" font-size="13.5" fill="#291c0e">Pick the 1-2 gifts that matter most</text>

<text x="600" y="566" text-anchor="middle" font-size="14.5" fill="#5c5c5c">The cost of getting it wrong is emotional, not financial — which is exactly why the five-minute test pays off.</text>
</svg>
