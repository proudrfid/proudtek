<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">UHF RFID band map — India's 865-867 MHz sits inside the EU band</title>
  <desc id="d">A frequency map of the UHF RFID bands: the European Union uses 865-868 MHz under ETSI EN 302 208, India uses 865-867 MHz de-licensed for RFID by the WPC wing of the Department of Telecommunications (GSR 564-E) at up to 1 W transmitter power and 4 W ERP with a 200 kHz carrier, and the United States uses 902-928 MHz under FCC Part 15. India's 865-867 MHz band sits inside the EU 865-868 MHz band, so EU-tuned inlays fit India, while US 902-928 MHz inlays read short and must be re-tuned. NFC and access cards at 13.56 MHz are global and unaffected.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">GET THE BAND RIGHT — INDIA IS 865-867 MHz</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">It sits inside the EU 865-868 MHz band — EU-tuned stock fits; US 902-928 stock reads short</text>

  <!-- axis 860 .. 930 MHz mapped to x 120..1080 (70 MHz over 960px => 13.71 px/MHz) -->
  <line x1="120" y1="470" x2="1080" y2="470" stroke="#c3ccd6" stroke-width="2"/>
  <text x="188" y="496" font-size="12" fill="#9aa4b2">&#9664; lower band (EU &amp; India)</text>
  <text x="1052" y="496" text-anchor="end" font-size="12" fill="#9aa4b2">upper band (US) &#9654;</text>

  <!-- EU 865-868 => x 188.6..229.7 -->
  <rect x="188.6" y="150" width="41.1" height="48" rx="5" fill="#eef2f5" stroke="#9fb8c2" stroke-width="2"/>
  <text x="150" y="179" text-anchor="end" font-size="15" font-weight="700" fill="#4a5568">EU</text>
  <text x="240" y="170" font-size="13" fill="#5c5c5c">865-868 MHz</text>
  <text x="240" y="189" font-size="12" fill="#9aa4b2">ETSI EN 302 208</text>

  <!-- India 865-867 => x 188.6..216 (solid teal, sits under EU, left edges aligned) -->
  <rect x="188.6" y="214" width="27.4" height="64" rx="5" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
  <text x="150" y="251" text-anchor="end" font-size="15" font-weight="800" fill="#2c5454">INDIA</text>
  <!-- containment guides: India 865 and 867 fall within the EU 865-868 span -->
  <line x1="188.6" y1="198" x2="188.6" y2="214" stroke="#b9c0cc" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="216" y1="198" x2="216" y2="214" stroke="#b9c0cc" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="248" y="238" font-size="13" fill="#3d6b6b">865-867 MHz — inside the EU band</text>

  <!-- US 902-928 => x 696..1052.6 (reference, far right) -->
  <rect x="696" y="214" width="356.6" height="48" rx="5" fill="#eef2f5" stroke="#9fb8c2" stroke-width="2"/>
  <text x="686" y="243" text-anchor="end" font-size="15" font-weight="700" fill="#4a5568">US</text>
  <text x="716" y="243" font-size="13" fill="#291c0e">902-928 MHz (United States)</text>
  <text x="716" y="288" font-size="13" font-weight="700" fill="#8b2d2d">US-tuned inlays read short in India</text>

  <!-- India detail -->
  <text x="120" y="344" font-size="14" font-weight="700" fill="#2c5454">India &#183; 865-867 MHz &#183; WPC / DoT &#183; GSR 564(E), licence-exempt</text>
  <text x="120" y="366" font-size="13" fill="#3d6b6b">1 W transmitter power &#183; 4 W ERP &#183; 200 kHz carrier bandwidth</text>

  <rect x="120" y="530" width="960" height="88" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="142" y="558" font-size="14.5" font-weight="700" fill="#2c5454">India's 865-867 MHz sits inside the EU 865-868 MHz band — so EU-tuned inlays fit</text>
  <text x="142" y="580" font-size="13" fill="#3d6b6b">US 902-928 MHz inlays read short on an Indian portal. Specify 865-867 MHz tuning on the PO.</text>
  <text x="142" y="600" font-size="13" fill="#5c5c5c">NFC and access cards at 13.56 MHz (HF) are global and unaffected by the UHF band question.</text>
</svg>
