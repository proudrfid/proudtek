<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">One NFC inlay, three finish states</title>
  <desc id="d">The same NFC chip and loop antenna shipped in three finish states. A dry inlay is the bare core of chip, loop antenna and PET film with no adhesive or liner — the feedstock state this page describes. A wet inlay adds a PSA adhesive layer and a release liner. A converted inlay is laminated into a finished printed card. Which state is ordered is decided by the downstream process.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3d6b6b"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE INLAY, THREE FINISH STATES</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#5c5c5c">Same NFC chip and loop antenna — the state you order is decided downstream</text>

  <!-- Column 1: DRY (this page) -->
  <rect x="128" y="214" width="244" height="132" rx="14" fill="#faf3e6" stroke="#c39a5f" stroke-width="2"/>
  <rect x="194" y="120" width="112" height="24" rx="12" fill="#c39a5f"/>
  <text x="250" y="137" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">THIS PAGE</text>
  <text x="250" y="174" text-anchor="middle" font-size="20" font-weight="800" fill="#2c5454">DRY</text>
  <text x="250" y="196" text-anchor="middle" font-size="13" fill="#5c5c5c">bare core — no adhesive</text>
  <rect x="140" y="238" width="220" height="28" rx="5" fill="#dfeaea" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="250" y="257" text-anchor="middle" font-size="13" fill="#2c5454">chip + loop antenna</text>
  <rect x="140" y="270" width="220" height="28" rx="5" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="250" y="289" text-anchor="middle" font-size="13" fill="#6d5a3a">PET film</text>
  <text x="250" y="372" text-anchor="middle" font-size="14" font-weight="600" fill="#291c0e">No adhesive, no liner</text>
  <text x="250" y="396" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the raw feedstock for cards · fobs · wristbands</text>

  <!-- Column 2: WET -->
  <text x="600" y="174" text-anchor="middle" font-size="20" font-weight="800" fill="#6d5a3a">WET</text>
  <text x="600" y="196" text-anchor="middle" font-size="13" fill="#5c5c5c">+ adhesive + liner</text>
  <rect x="490" y="206" width="220" height="28" rx="5" fill="#dfeaea" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="600" y="225" text-anchor="middle" font-size="13" fill="#2c5454">chip + loop antenna</text>
  <rect x="490" y="238" width="220" height="28" rx="5" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="600" y="257" text-anchor="middle" font-size="13" fill="#6d5a3a">PET film</text>
  <rect x="490" y="270" width="220" height="28" rx="5" fill="#f2e2c4" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="600" y="289" text-anchor="middle" font-size="13" fill="#6d5a3a">PSA adhesive</text>
  <rect x="490" y="302" width="220" height="28" rx="5" fill="#e9edf1" stroke="#4a5568" stroke-width="1.5"/>
  <text x="600" y="321" text-anchor="middle" font-size="13" fill="#4a5568">release liner</text>
  <text x="600" y="372" text-anchor="middle" font-size="14" font-weight="600" fill="#291c0e">PSA + release liner</text>
  <text x="600" y="396" text-anchor="middle" font-size="12.5" fill="#5c5c5c">for stickers · smart labels · converters</text>

  <!-- Column 3: CONVERTED -->
  <text x="950" y="174" text-anchor="middle" font-size="20" font-weight="800" fill="#4a5568">CONVERTED</text>
  <text x="950" y="196" text-anchor="middle" font-size="13" fill="#5c5c5c">+ card body + print</text>
  <rect x="840" y="206" width="220" height="28" rx="5" fill="#ffffff" stroke="#cdb79a" stroke-width="1.5"/>
  <text x="950" y="225" text-anchor="middle" font-size="13" fill="#291c0e">printed card + overlay</text>
  <rect x="840" y="238" width="220" height="28" rx="5" fill="#dfeaea" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="950" y="257" text-anchor="middle" font-size="13" fill="#2c5454">chip + loop antenna</text>
  <rect x="840" y="270" width="220" height="28" rx="5" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="950" y="289" text-anchor="middle" font-size="13" fill="#6d5a3a">PET film</text>
  <text x="950" y="372" text-anchor="middle" font-size="14" font-weight="600" fill="#291c0e">into a finished card</text>
  <text x="950" y="396" text-anchor="middle" font-size="12.5" fill="#5c5c5c">now a credential, not a component</text>

  <!-- arrows -->
  <line x1="378" y1="268" x2="484" y2="268" stroke="#3d6b6b" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="716" y1="268" x2="834" y2="268" stroke="#3d6b6b" stroke-width="3" marker-end="url(#ar)"/>

  <!-- band -->
  <rect x="300" y="556" width="600" height="76" rx="16" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="588" text-anchor="middle" font-size="16" font-weight="600" fill="#2c5454">We ship the inlay dry (this page) or wet</text>
  <text x="600" y="613" text-anchor="middle" font-size="15" fill="#3d6b6b">converted is what the card bureau makes of it downstream</text>
</svg>
