<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="mbTitle mbDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="mbTitle">Proud Tek testing methodology — how a published number is produced</title>
  <desc id="mbDesc">Every number labelled a Proud Tek lab test clears the same gates: measure at least 30 samples, repeat with a second operator on a separate day, archive the raw data, get editorial-board sign-off, then publish — or retract if wrong. Numbers are reported as p10, p50 and p90 with conditions disclosed per test.</desc>

  <rect width="1200" height="675" fill="#f4efe4"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="66" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="2.5" fill="#6d5a3a">MEASURED · DISCLOSED · REPRODUCIBLE</text>
  <text x="600" y="100" text-anchor="middle" font-size="19" fill="#4f4f4f">Every number labelled “Proud Tek lab test” clears the same five gates.</text>

  <!-- Pipeline -->
  <line x1="150" y1="210" x2="1050" y2="210" stroke="#e4c98f" stroke-width="6"/>

  <!-- 1 Measure -->
  <circle cx="150" cy="210" r="42" fill="#291c0e"/>
  <text x="150" y="223" text-anchor="middle" font-size="30" font-weight="700" fill="#c39a5f">1</text>
  <text x="150" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">Measure</text>
  <text x="150" y="312" text-anchor="middle" font-size="15" fill="#6b7280">N ≥ 30 tags</text>
  <!-- 2 Repeat -->
  <circle cx="375" cy="210" r="42" fill="#291c0e"/>
  <text x="375" y="223" text-anchor="middle" font-size="30" font-weight="700" fill="#c39a5f">2</text>
  <text x="375" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">Repeat</text>
  <text x="375" y="312" text-anchor="middle" font-size="15" fill="#6b7280">2nd operator, separate day</text>
  <!-- 3 Archive -->
  <circle cx="600" cy="210" r="42" fill="#291c0e"/>
  <text x="600" y="223" text-anchor="middle" font-size="30" font-weight="700" fill="#c39a5f">3</text>
  <text x="600" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">Archive</text>
  <text x="600" y="312" text-anchor="middle" font-size="15" fill="#6b7280">test-ID · instrument · log</text>
  <!-- 4 Sign-off -->
  <circle cx="825" cy="210" r="42" fill="#291c0e"/>
  <text x="825" y="223" text-anchor="middle" font-size="30" font-weight="700" fill="#c39a5f">4</text>
  <text x="825" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">Sign-off</text>
  <text x="825" y="312" text-anchor="middle" font-size="15" fill="#6b7280">editorial board</text>
  <!-- 5 Publish (highlight) -->
  <circle cx="1050" cy="210" r="48" fill="#1fcefb"/>
  <circle cx="1050" cy="210" r="48" fill="none" stroke="#0b90b3" stroke-width="2"/>
  <path d="M1032 210 l12 12 l22 -24" fill="none" stroke="#08313d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1050" y="294" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">Publish</text>
  <text x="1050" y="318" text-anchor="middle" font-size="15" fill="#6b7280">or retract if wrong</text>

  <text x="600" y="372" text-anchor="middle" font-size="16" fill="#6d5a3a">Numbers from a manufacturer datasheet are cited separately — never relabelled as our measurement.</text>

  <line x1="72" y1="404" x2="1128" y2="404" stroke="#ece5d8" stroke-width="2"/>

  <!-- Principle chips -->
  <g>
    <rect x="72" y="430" width="336" height="118" rx="16" fill="#fbf7ef" stroke="#e4c98f" stroke-width="2"/>
    <text x="240" y="482" text-anchor="middle" font-size="30" font-weight="800" fill="#291c0e">N ≥ 30</text>
    <text x="240" y="512" text-anchor="middle" font-size="16" fill="#6d5a3a">samples per durability claim</text>
  </g>
  <g>
    <rect x="432" y="430" width="336" height="118" rx="16" fill="#fbf7ef" stroke="#e4c98f" stroke-width="2"/>
    <text x="600" y="482" text-anchor="middle" font-size="27" font-weight="800" fill="#291c0e">p10 · p50 · p90</text>
    <text x="600" y="512" text-anchor="middle" font-size="16" fill="#6d5a3a">reported — never a peak “up to”</text>
  </g>
  <g>
    <rect x="792" y="430" width="336" height="118" rx="16" fill="#fbf7ef" stroke="#e4c98f" stroke-width="2"/>
    <text x="960" y="478" text-anchor="middle" font-size="22" font-weight="800" fill="#291c0e">Conditions disclosed</text>
    <text x="960" y="510" text-anchor="middle" font-size="16" fill="#6d5a3a">reader · antenna · temp, per test</text>
  </g>
</svg>
