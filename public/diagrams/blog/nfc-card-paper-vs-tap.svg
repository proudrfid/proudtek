<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Two life stories: the paper card and the NFC card</title>
<desc id="d">Left, the paper card's journey: handed over, pocketed, forgotten, and filed in the drawer of people you can no longer place. Right, the NFC card's journey: tapped, contact saved in seconds, link updated without reprinting, and every tap counted as a measurable touchpoint. One card works for thousands of taps.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TWO LIFE STORIES</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Where a card ends up decides what it was worth</text>

<rect x="60" y="130" width="530" height="460" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="325" y="170" text-anchor="middle" font-size="16" font-weight="800" fill="#5c5c5c">THE PAPER CARD</text>

<rect x="110" y="200" width="130" height="80" rx="8" fill="#ffffff" stroke="#5c5c5c" stroke-width="1.5"/>
<text x="175" y="238" text-anchor="middle" font-size="12" fill="#5c5c5c">Your Name</text>
<text x="175" y="256" text-anchor="middle" font-size="12" fill="#5c5c5c">tiny phone number</text>
<text x="175" y="306" text-anchor="middle" font-size="12.5" fill="#4f4f4f">handed over</text>

<path d="M 260 240 h 60" stroke="#5c5c5c" stroke-width="2"/>
<path d="M 320 240 l -10 -5 v 10 z" fill="#5c5c5c"/>
<rect x="340" y="200" width="130" height="80" rx="8" fill="#f4efe4" stroke="#5c5c5c" stroke-width="1.5"/>
<text x="405" y="236" text-anchor="middle" font-size="12.5" fill="#4f4f4f">pocketed,</text>
<text x="405" y="256" text-anchor="middle" font-size="12.5" fill="#4f4f4f">then forgotten</text>

<path d="M 405 300 v 60" stroke="#5c5c5c" stroke-width="2"/>
<path d="M 405 360 l -5 -10 h 10 z" fill="#5c5c5c"/>
<rect x="150" y="380" width="360" height="120" rx="10" fill="#f4efe4" stroke="#5c5c5c" stroke-width="2"/>
<rect x="150" y="380" width="360" height="26" rx="10" fill="#e6dfd2"/>
<circle cx="330" cy="393" r="4" fill="#5c5c5c"/>
<text x="330" y="450" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4f4f4f">the drawer of people</text>
<text x="330" y="474" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4f4f4f">you can no longer place</text>
<text x="325" y="546" text-anchor="middle" font-size="13" fill="#5c5c5c">retyped by no one · updated never · measured never</text>

<rect x="610" y="130" width="530" height="460" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="875" y="170" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">THE NFC CARD</text>

<rect x="660" y="200" width="130" height="80" rx="8" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<circle cx="775" cy="215" r="8" fill="none" stroke="#2c5454" stroke-width="1.8"/>
<circle cx="775" cy="215" r="3" fill="#2c5454"/>
<text x="725" y="238" text-anchor="middle" font-size="12" fill="#291c0e">Your Name</text>
<text x="725" y="256" text-anchor="middle" font-size="12" fill="#4f4f4f">tap to connect</text>
<text x="725" y="306" text-anchor="middle" font-size="12.5" fill="#4f4f4f">tapped once</text>

<path d="M 810 240 h 60" stroke="#2d6a4f" stroke-width="2"/>
<path d="M 870 240 l -10 -5 v 10 z" fill="#2d6a4f"/>
<rect x="890" y="200" width="200" height="80" rx="8" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="990" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1b4332">contact saved</text>
<text x="990" y="258" text-anchor="middle" font-size="12" fill="#4f4f4f">in seconds, no retyping</text>

<rect x="660" y="330" width="430" height="70" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="686" y="360" font-size="13.5" font-weight="700" fill="#2c5454">link updated any time</text>
<text x="686" y="382" font-size="12" fill="#4f4f4f">new role, new page — same card, no reprinting</text>

<rect x="660" y="416" width="430" height="70" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="686" y="446" font-size="13.5" font-weight="700" fill="#2c5454">every tap counted</text>
<text x="686" y="468" font-size="12" fill="#4f4f4f">tap counts, geography, device mix — a measurable touchpoint</text>

<text x="875" y="546" text-anchor="middle" font-size="13" font-weight="600" fill="#1b4332">one card · thousands of taps · fully rewritable</text>
<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The paper card's final address is furniture. The NFC card keeps working.</text>
</svg>
