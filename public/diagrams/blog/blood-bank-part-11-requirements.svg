<rect x="777" y="398" width="100" height="34" rx="17" fill="#eef5f5"/><text x="827" y="420" font-size="12.5" font-weight="700" fill="#2c5454">least privilege</text>
<rect x="1004" y="398" width="100" height="34" rx="17" fill="#eef5f5"/><text x="1054" y="420" font-size="12.5" font-weight="700" fill="#2c5454">10+ years</text>
