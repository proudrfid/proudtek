<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">EU UHF RFID band plan versus the US band, with Germany guidance</title>
  <desc id="d">Frequency map from 855 to 935 megahertz. The European Union row under ETSI EN 302 208 shows the lower band at 865 to 868 megahertz with up to 2 watts ERP and four high-power channels, and the upper band at 915 to 921 megahertz with up to 4 watts ERP on channels 916.3, 917.5 and 918.7 megahertz, where adoption varies by member state. The United States row under FCC Part 15.247 shows 902 to 928 megahertz at up to 4 watts EIRP with 50 or more hopping channels, overlapping the EU upper band region. A note states that Germany's BNetzA general assignment for RFID covers 865 to 868 megahertz, so German orders should specify EU lower-band tuning. A red warning chip flags that a US-tuned inlay in a German portal suffers a detuned antenna and shrunken read range.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">UHF RFID IN GERMANY &amp; THE EU — GET THE BAND RIGHT</text>
  <text x="600" y="102" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">865–868 MHz is the workhorse; the upper band is a maybe</text>

  <!-- EU row -->
  <text x="130" y="180" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">EUROPEAN UNION — ETSI EN 302 208</text>
  <text x="256" y="204" font-size="14" font-weight="700" fill="#3d6b6b">Lower band 865–868 MHz · up to 2 W ERP</text>
  <text x="886" y="204" font-size="14" font-weight="700" fill="#3d6b6b">Upper band 915–921 MHz</text>
  <rect x="256" y="214" width="38" height="64" rx="6" fill="#3d6b6b"/>
  <line x1="265" y1="222" x2="265" y2="270" stroke="#ffffff" stroke-width="2"/>
  <line x1="272" y1="222" x2="272" y2="270" stroke="#ffffff" stroke-width="2"/>
  <line x1="280" y1="222" x2="280" y2="270" stroke="#ffffff" stroke-width="2"/>
  <line x1="287" y1="222" x2="287" y2="270" stroke="#ffffff" stroke-width="2"/>
  <rect x="886" y="214" width="76" height="64" rx="6" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="900" y="220" width="6" height="52" fill="#3d6b6b"/>
  <rect x="915" y="220" width="6" height="52" fill="#3d6b6b"/>
  <rect x="930" y="220" width="6" height="52" fill="#3d6b6b"/>
  <text x="909" y="300" text-anchor="middle" font-size="12.5" fill="#4f4f4f">4 W ERP · channels 916.3 / 917.5 / 918.7 MHz · adoption varies</text>

  <!-- US row -->
  <text x="130" y="332" font-size="13" font-weight="800" letter-spacing="0.5" fill="#4a5568">UNITED STATES — FCC PART 15.247</text>
  <rect x="722" y="342" width="328" height="64" rx="6" fill="#4a5568"/>
  <text x="886" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">902–928 MHz</text>
  <text x="886" y="392" text-anchor="middle" font-size="12.5" fill="#e6dfd2">up to 4 W EIRP · 50+ hopping channels</text>

  <!-- axis: x = 130 + (f-855)*12.6 -->
  <line x1="130" y1="440" x2="1130" y2="440" stroke="#e6dfd2" stroke-width="2"/>
  <line x1="193" y1="434" x2="193" y2="446" stroke="#c9c2b4" stroke-width="2"/>
  <line x1="319" y1="434" x2="319" y2="446" stroke="#c9c2b4" stroke-width="2"/>
  <line x1="445" y1="434" x2="445" y2="446" stroke="#c9c2b4" stroke-width="2"/>
  <line x1="571" y1="434" x2="571" y2="446" stroke="#c9c2b4" stroke-width="2"/>
  <line x1="697" y1="434" x2="697" y2="446" stroke="#c9c2b4" stroke-width="2"/>
  <line x1="823" y1="434" x2="823" y2="446" stroke="#c9c2b4" stroke-width="2"/>
  <line x1="949" y1="434" x2="949" y2="446" stroke="#c9c2b4" stroke-width="2"/>
  <line x1="1075" y1="434" x2="1075" y2="446" stroke="#c9c2b4" stroke-width="2"/>
  <text x="193" y="464" text-anchor="middle" font-size="12" fill="#5c5c5c">860</text>
  <text x="319" y="464" text-anchor="middle" font-size="12" fill="#5c5c5c">870</text>
  <text x="445" y="464" text-anchor="middle" font-size="12" fill="#5c5c5c">880</text>
  <text x="571" y="464" text-anchor="middle" font-size="12" fill="#5c5c5c">890</text>
  <text x="697" y="464" text-anchor="middle" font-size="12" fill="#5c5c5c">900</text>
  <text x="823" y="464" text-anchor="middle" font-size="12" fill="#5c5c5c">910</text>
  <text x="949" y="464" text-anchor="middle" font-size="12" fill="#5c5c5c">920</text>
  <text x="1075" y="464" text-anchor="middle" font-size="12" fill="#5c5c5c">930</text>
  <text x="1118" y="464" font-size="12" font-weight="700" fill="#5c5c5c">MHz</text>

  <!-- Germany strip -->
  <rect x="90" y="492" width="676" height="70" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="114" y="520" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">GERMANY TODAY</text>
  <text x="114" y="544" font-size="13.5" fill="#291c0e">BNetzA's RFID general assignment covers 865–868 MHz — quote lower-band tuning</text>

  <!-- risk chip -->
  <rect x="790" y="492" width="320" height="70" rx="12" fill="#ffffff" stroke="#8b2d2d" stroke-width="2"/>
  <text x="814" y="516" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">WRONG-BAND RISK</text>
  <text x="814" y="536" font-size="12.5" fill="#4f4f4f">US-tuned inlay in a German portal:</text>
  <text x="814" y="552" font-size="12.5" fill="#4f4f4f">detuned antenna, shrunken read range</text>

  <text x="600" y="606" text-anchor="middle" font-size="13" fill="#5c5c5c">Same Gen2 silicon works worldwide — antenna tuning decides where it performs. Name the deployment country on your RFQ.</text>
</svg>
