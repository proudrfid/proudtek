<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Which RFID chips suit cashless payment wristbands</title>
<desc id="d">Four chips ranked for payment suitability. MIFARE Classic 1K is OK for low-value closed-loop credit only, because Crypto-1 is weak but acceptable for limited balances. MIFARE DESFire EV2/EV3 is preferred for new builds, with AES-128 and mutual authentication that resist cloning. NTAG 213/215 is for cloud-balance systems only, storing just a UID mapped to a server balance. UHF RFID is not suitable for payments, because its long read range risks unintended transactions.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PAYMENT CHIP SUITABILITY</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Value stored on the chip needs security; a long read range is a liability.</text>

<!-- row 1 Classic 1K -->
<rect x="64" y="150" width="1072" height="84" rx="11" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.4"/>
<rect x="64" y="150" width="9" height="84" rx="4" fill="#c39a5f"/>
<text x="104" y="188" font-size="15.5" font-weight="800" fill="#291c0e">MIFARE Classic 1K</text>
<text x="104" y="212" font-size="12.5" fill="#6d5a3a">Crypto-1 is weak but fine for limited credit</text>
<rect x="796" y="172" width="296" height="40" rx="20" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<text x="944" y="197" text-anchor="middle" font-size="13" font-weight="800" fill="#8a6d34">OK — low-value closed-loop</text>

<!-- row 2 DESFire -->
<rect x="64" y="244" width="1072" height="84" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<rect x="64" y="244" width="9" height="84" rx="4" fill="#1f6f3a"/>
<text x="104" y="282" font-size="15.5" font-weight="800" fill="#291c0e">MIFARE DESFire EV2 / EV3</text>
<text x="104" y="306" font-size="12.5" fill="#33595a">AES-128 + mutual auth resist cloning</text>
<rect x="796" y="266" width="296" height="40" rx="20" fill="#e7f2ea" stroke="#a9cfb5" stroke-width="1.3"/>
<text x="944" y="291" text-anchor="middle" font-size="13" font-weight="800" fill="#1f6f3a">PREFERRED for new builds</text>

<!-- row 3 NTAG -->
<rect x="64" y="338" width="1072" height="84" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="64" y="338" width="9" height="84" rx="4" fill="#3d6b6b"/>
<text x="104" y="376" font-size="15.5" font-weight="800" fill="#291c0e">NTAG 213 / 215</text>
<text x="104" y="400" font-size="12.5" fill="#4f6a6a">stores only a UID mapped to a server balance</text>
<rect x="796" y="360" width="296" height="40" rx="20" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="944" y="385" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">cloud balance only</text>

<!-- row 4 UHF -->
<rect x="64" y="432" width="1072" height="84" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="432" width="9" height="84" rx="4" fill="#8b2d2d"/>
<text x="104" y="470" font-size="15.5" font-weight="800" fill="#291c0e">UHF RFID</text>
<text x="104" y="494" font-size="12.5" fill="#8b2d2d">long read range risks unintended transactions</text>
<rect x="796" y="454" width="296" height="40" rx="20" fill="#f4eaea" stroke="#e0c4c4" stroke-width="1.3"/>
<text x="944" y="479" text-anchor="middle" font-size="13" font-weight="800" fill="#8b2d2d">NOT for payments</text>

<text x="600" y="560" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Put value on the chip only with DESFire-class security; otherwise keep the balance in the cloud.</text>
</svg>
