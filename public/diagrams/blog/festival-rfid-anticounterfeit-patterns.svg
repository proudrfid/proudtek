<text x="242" y="272" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">Encrypted tiered wristbands</text>
<circle cx="100" cy="309" r="4" fill="#3d6b6b"/>
<text x="116" y="314" font-size="12.5" fill="#333333">VIP / GA / artist / crew permissions</text>
<circle cx="100" cy="339" r="4" fill="#3d6b6b"/>
<text x="116" y="344" font-size="12.5" fill="#333333">gate-side validation, sub-second</text>
<circle cx="100" cy="369" r="4" fill="#3d6b6b"/>
<text x="116" y="374" font-size="12.5" fill="#333333">replaced prior paper-ticket fraud</text>
