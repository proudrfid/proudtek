<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Which Target departments require RFID tagging, by tier</title>
<desc id="d">Four departments carry Target's RFID mandate. Apparel and Accessories is Tier 2 and fully enforced: every item, every season, every brand, at the highest 95 percent-plus read rate. Home is Tier 2: textiles, bedding, bath and kitchen soft goods, using standard inlays with on-metal inlays for hard goods. Footwear is Tier 2: every pair, every season, with the tag often on a swing tag rather than the shoe. Hardlines is Tier 3 and phased: electronics, toys, sporting goods and seasonal, rolling out across 2026 and 2027 with category-specific dates. Target owned brands such as Cat and Jack, A New Day and Threshold follow the same RFID rules as third-party brands.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TARGET RFID · DEPARTMENTS IN SCOPE</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Which departments must tag?</text>
<text x="600" y="132" text-anchor="middle" font-size="16" fill="#4f4f4f">Apparel, home and footwear are fully enforced today; hardlines phase in as Tier 3.</text>

<!-- Card 1: A&A -->
<rect x="88" y="182" width="500" height="150" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="88" y="182" width="8" height="150" rx="4" fill="#2d6a4f"/>
<text x="116" y="224" font-size="18" font-weight="800" fill="#291c0e">Apparel &amp; Accessories</text>
<rect x="436" y="198" width="136" height="28" rx="14" fill="#eaf3ec" stroke="#c5ddc9" stroke-width="1.2"/>
<text x="504" y="217" text-anchor="middle" font-size="12" font-weight="800" fill="#2d6a4f">T2 · ENFORCED</text>
<text x="116" y="264" font-size="14" fill="#4f4f4f">Every item, every season, every brand.</text>
<text x="116" y="292" font-size="13.5" fill="#5c5c5c">Highest enforcement — 95%+ read rate.</text>

<!-- Card 2: Home -->
<rect x="612" y="182" width="500" height="150" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="612" y="182" width="8" height="150" rx="4" fill="#2d6a4f"/>
<text x="640" y="224" font-size="18" font-weight="800" fill="#291c0e">Home</text>
<rect x="960" y="198" width="136" height="28" rx="14" fill="#eaf3ec" stroke="#c5ddc9" stroke-width="1.2"/>
<text x="1028" y="217" text-anchor="middle" font-size="12" font-weight="800" fill="#2d6a4f">T2 · ENFORCED</text>
<text x="640" y="264" font-size="14" fill="#4f4f4f">Textiles, bedding, bath, kitchen soft goods.</text>
<text x="640" y="292" font-size="13.5" fill="#5c5c5c">Standard inlays; hard goods use on-metal.</text>

<!-- Card 3: Footwear -->
<rect x="88" y="354" width="500" height="150" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="88" y="354" width="8" height="150" rx="4" fill="#2d6a4f"/>
<text x="116" y="396" font-size="18" font-weight="800" fill="#291c0e">Footwear</text>
<rect x="436" y="370" width="136" height="28" rx="14" fill="#eaf3ec" stroke="#c5ddc9" stroke-width="1.2"/>
<text x="504" y="389" text-anchor="middle" font-size="12" font-weight="800" fill="#2d6a4f">T2 · ENFORCED</text>
<text x="116" y="436" font-size="14" fill="#4f4f4f">Every pair, every season.</text>
<text x="116" y="464" font-size="13.5" fill="#5c5c5c">Tag often on a swing tag, not the shoe.</text>

<!-- Card 4: Hardlines -->
<rect x="612" y="354" width="500" height="150" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="612" y="354" width="8" height="150" rx="4" fill="#c39a5f"/>
<text x="640" y="396" font-size="18" font-weight="800" fill="#291c0e">Hardlines</text>
<rect x="960" y="370" width="136" height="28" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="1028" y="389" text-anchor="middle" font-size="12" font-weight="800" fill="#6d5a3a">T3 · PHASED</text>
<text x="640" y="436" font-size="14" fill="#4f4f4f">Electronics, toys, sporting goods, seasonal.</text>
<text x="640" y="464" font-size="13.5" fill="#5c5c5c">Phased 2026-2027; category-specific dates.</text>

<!-- Owned brands strip -->
<rect x="88" y="524" width="1024" height="50" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="116" y="554" font-size="14" fill="#291c0e">Owned brands (Cat &amp; Jack, A New Day, Threshold) follow the same RFID rules as third-party brands.</text>
</svg>
