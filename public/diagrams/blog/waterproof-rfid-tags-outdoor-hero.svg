<text x="471" y="286" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">SUBMERSION</text>
<text x="471" y="322" text-anchor="middle" font-size="19" font-weight="800" fill="#3a4456">IP68</text>
<text x="471" y="356" text-anchor="middle" font-size="12" fill="#5c5c5c">buoys, valves, dock,</text>
<text x="471" y="375" text-anchor="middle" font-size="12" fill="#5c5c5c">trapped water</text>

