<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How supplier RFID mandates capture shrinkage before goods reach the store</title>
<desc id="d">A left-to-right flow of five stages. One, supplier: 70 to 95 percent of the base ships pre-tagged under Walmart, Target or Macy's mandates, so per-store tag cost falls to near zero. Two, receiving dock: an RFID portal matches goods to the advance ship notice, catching short-ships and mislabels and delivering 30 to 50 percent of the program's shrinkage reduction here. Three, sales floor and fitting room: items counted in versus out, flagged within hours. Four, point of sale: every item read at once, catching sweethearting. Five, exit: EAS gates become RFID EPC reads that record which item passed the gate and when.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE 'TAG IN THE BOX' SHRINKAGE FLOW</text>
<text x="600" y="88" text-anchor="middle" font-size="15.5" fill="#4f4f4f">When suppliers tag at source, shrinkage capture starts before the store does.</text>
<rect x="88" y="180" width="196" height="250" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
