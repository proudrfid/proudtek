<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="rbTitle rbDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="rbTitle">Proud Tek RFID &amp; NFC resource hub — three ways in</title>
  <desc id="rbDesc">Three entry points arranged as buyer-journey stages. Step 1, Guides (teal, open-book icon): chip-family encyclopedias, protocol and regulation explainers, for scoping what's possible. Step 2, Compare (steel, bar-chart icon): head-to-head decision matrices to narrow a shortlist and defend the pick to procurement. Step 3, Compatibility (gold, key icon): which RFID or NFC card encodes for which hotel-lock or reader estate. Every page cites the underlying ISO, GS1, FDA or EU standard or the NXP, Impinj or Alien spec sheet, and links straight to the matching Proud Tek SKU.</desc>

  <defs>
    <radialGradient id="rbGlow" cx="50%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#rbGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="3" fill="#6d5a3a">RFID &amp; NFC RESOURCES  ·  THREE WAYS IN</text>

  <!-- journey chevrons between panels -->
  <path d="M410 191 l9 9 l-9 9" fill="none" stroke="#c39a5f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M775 191 l9 9 l-9 9" fill="none" stroke="#c39a5f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===================== STEP 1 · GUIDES (teal) ===================== -->
  <rect x="70" y="112" width="330" height="418" rx="18" fill="#fbf8f2" stroke="#3d6b6b" stroke-width="2"/>
  <text x="235" y="152" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#3d6b6b">STEP 1  ·  LEARN</text>
  <circle cx="235" cy="200" r="33" fill="#3d6b6b"/>
  <!-- open-book glyph -->
  <path d="M213 186 L235 190 L235 214 L213 210 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M257 186 L235 190 L235 214 L257 210 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="218" y1="194" x2="230" y2="196" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="240" y1="196" x2="252" y2="194" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="235" y="288" text-anchor="middle" font-size="29" font-weight="800" fill="#291c0e">Guides</text>
  <text x="235" y="320" text-anchor="middle" font-size="16.5" fill="#6d5a3a">Chip-family encyclopedias,</text>
  <text x="235" y="343" text-anchor="middle" font-size="16.5" fill="#6d5a3a">protocol &amp; regulation explainers</text>
  <line x1="117" y1="382" x2="353" y2="382" stroke="#ece5d8" stroke-width="2"/>
  <text x="235" y="416" text-anchor="middle" font-size="13.5" font-weight="600" letter-spacing="1" fill="#3d6b6b">NTAG21x · ISO 14443 · EU DPP</text>
  <text x="235" y="446" text-anchor="middle" font-size="14.5" fill="#8a7a5a">for scoping what's possible</text>

  <!-- ===================== STEP 2 · COMPARE (steel) ===================== -->
  <rect x="435" y="112" width="330" height="418" rx="18" fill="#fbf8f2" stroke="#4a5568" stroke-width="2"/>
  <text x="600" y="152" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#4a5568">STEP 2  ·  DECIDE</text>
  <circle cx="600" cy="200" r="33" fill="#4a5568"/>
  <!-- comparison bars glyph -->
  <line x1="581" y1="213" x2="619" y2="213" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="585" y="193" width="8" height="19" rx="2" fill="#ffffff"/>
  <rect x="596" y="181" width="8" height="31" rx="2" fill="#ffffff"/>
  <rect x="607" y="187" width="8" height="25" rx="2" fill="#ffffff"/>
  <text x="600" y="288" text-anchor="middle" font-size="29" font-weight="800" fill="#291c0e">Compare</text>
  <text x="600" y="320" text-anchor="middle" font-size="16.5" fill="#6d5a3a">Head-to-head decision matrices</text>
  <text x="600" y="343" text-anchor="middle" font-size="16.5" fill="#6d5a3a">to narrow a shortlist</text>
  <line x1="482" y1="382" x2="718" y2="382" stroke="#ece5d8" stroke-width="2"/>
  <text x="600" y="416" text-anchor="middle" font-size="13.5" font-weight="600" letter-spacing="1" fill="#4a5568">chip vs chip · band vs band</text>
  <text x="600" y="446" text-anchor="middle" font-size="14.5" fill="#8a7a5a">for defending the pick to procurement</text>

  <!-- ===================== STEP 3 · COMPATIBILITY (gold) ===================== -->
  <rect x="800" y="112" width="330" height="418" rx="18" fill="#fbf8f2" stroke="#c39a5f" stroke-width="2"/>
  <text x="965" y="152" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#8a6d34">STEP 3  ·  SOURCE</text>
  <circle cx="965" cy="200" r="33" fill="#c39a5f"/>
  <!-- key glyph -->
  <circle cx="951" cy="200" r="10" fill="none" stroke="#ffffff" stroke-width="3.2"/>
  <line x1="960" y1="200" x2="986" y2="200" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="979" y1="200" x2="979" y2="209" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="986" y1="200" x2="986" y2="207" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
  <text x="965" y="288" text-anchor="middle" font-size="29" font-weight="800" fill="#291c0e">Compatibility</text>
  <text x="965" y="320" text-anchor="middle" font-size="16.5" fill="#6d5a3a">Which card encodes for which</text>
  <text x="965" y="343" text-anchor="middle" font-size="16.5" fill="#6d5a3a">hotel-lock or reader estate</text>
  <line x1="847" y1="382" x2="1083" y2="382" stroke="#ece5d8" stroke-width="2"/>
  <text x="965" y="416" text-anchor="middle" font-size="13.5" font-weight="600" letter-spacing="1" fill="#8a6d34">Saflok · VingCard · Onity</text>
  <text x="965" y="446" text-anchor="middle" font-size="14.5" fill="#8a7a5a">for landing the credential</text>

  <!-- ===================== FOOTER ===================== -->
  <text x="600" y="576" text-anchor="middle" font-size="17.5" fill="#4f4f4f">Every page cites the underlying ISO / GS1 / FDA / EU standard or the NXP / Impinj / Alien</text>
  <text x="600" y="600" text-anchor="middle" font-size="17.5" fill="#4f4f4f">spec sheet — and links straight to the matching Proud Tek SKU.</text>
  <text x="600" y="632" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1.2" fill="#8a7a5a">LEARN → DECIDE → SOURCE   ·   WRITTEN BY RFID ENGINEERS   ·   CITED TO SOURCE</text>
</svg>
