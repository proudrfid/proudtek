<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">UHF RFID band map — Brazil is two sub-bands with a cellular guard gap</title>
  <desc id="d">A frequency map of the UHF RFID bands. The European Union uses 865-868 MHz under ETSI EN 302 208. The United States uses one block, 902-928 MHz, under FCC Part 15. Brazil, under ANATEL, authorises only two sub-bands within that range — 902-907.5 MHz and 915-928 MHz — separated by a cellular guard gap at 907.5-915 MHz, at up to 4 W EIRP. A reader configured for the full 902-928 MHz band is non-compliant in Brazil. Passive tags are antenna-tuned for the Brazilian bands; the reader carries ANATEL homologation. Access-control cards at 13.56 MHz are global and unaffected.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">GET THE BAND RIGHT — BRAZIL IS TWO SUB-BANDS</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">902-907.5 MHz and 915-928 MHz, split by a cellular guard gap — not the full 902-928 MHz block</text>

  <!-- axis 860 .. 930 MHz mapped to x 120..1080 (13.71 px/MHz) -->
  <line x1="120" y1="470" x2="1080" y2="470" stroke="#c3ccd6" stroke-width="2"/>
  <text x="188" y="496" font-size="12.5" fill="#9aa4b2">lower band (EU)</text>
  <text x="1052" y="496" text-anchor="end" font-size="12.5" fill="#9aa4b2">upper band (US / Brazil)</text>

  <!-- EU 865-868 => x 189..230 -->
  <rect x="189" y="150" width="41" height="52" rx="5" fill="#eef2f5" stroke="#9fb8c2" stroke-width="2"/>
  <text x="140" y="181" font-size="15" font-weight="700" fill="#4a5568">EU</text>
  <text x="236" y="176" font-size="13" fill="#5c5c5c">865-868 MHz</text>
  <text x="236" y="194" font-size="12.5" fill="#9aa4b2">ETSI EN 302 208</text>

  <!-- US 902-928 full block => x 696..1053 -->
  <rect x="696" y="224" width="357" height="52" rx="5" fill="#eef2f5" stroke="#9fb8c2" stroke-width="2"/>
  <text x="140" y="255" font-size="15" font-weight="700" fill="#4a5568">US</text>
  <text x="716" y="255" font-size="13" fill="#291c0e">902-928 MHz — one full block (United States)</text>

  <!-- Brazil two sub-bands: 902-907.5 (x696..771) and 915-928 (x874..1053), gap 907.5-915 (x771..874) -->
  <text x="140" y="335" font-size="15" font-weight="800" fill="#2c5454">BRAZIL</text>
  <rect x="696" y="300" width="75" height="60" rx="5" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
  <text x="733" y="335" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">902-907.5</text>
  <rect x="771" y="300" width="103" height="60" rx="5" fill="#f7edd6" stroke="#c98b2d" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="822" y="326" text-anchor="middle" font-size="12" fill="#8a6d3b">cellular</text>
  <text x="822" y="344" text-anchor="middle" font-size="12" fill="#8a6d3b">guard gap</text>
  <rect x="874" y="300" width="179" height="60" rx="5" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
  <text x="963" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">915-928 MHz</text>
  <text x="120" y="410" font-size="14" font-weight="700" fill="#2c5454">Brazil · 902-907.5 MHz + 915-928 MHz · guard gap 907.5-915 MHz · ANATEL · up to 4 W EIRP</text>

  <!-- risk callout: full-band reader non-compliant (RED = genuine risk state) -->
  <rect x="120" y="512" width="960" height="110" rx="12" fill="#fbeeee" stroke="#e0b4b4" stroke-width="1.5"/>
  <text x="142" y="540" font-size="14.5" font-weight="800" fill="#8b2d2d">A reader set to the full 902-928 MHz band is non-compliant in Brazil</text>
  <text x="142" y="564" font-size="13" fill="#5c5c5c">Configure the reader to the two ANATEL sub-bands (902-907.5 and 915-928 MHz) and keep the 907.5-915 MHz gap clear.</text>
  <text x="142" y="586" font-size="13" fill="#3d6b6b">Passive tags are antenna-tuned for the Brazilian bands; the reader — not the tag — carries ANATEL homologation.</text>
  <text x="142" y="608" font-size="13" fill="#5c5c5c">Access-control cards at 13.56 MHz (HF) are global and unaffected by the UHF band split.</text>
</svg>
