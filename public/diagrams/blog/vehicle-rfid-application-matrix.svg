<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Four windshield-tag applications mapped by vehicle speed and read range</title>
<desc id="d">A scatter map with vehicle speed on the horizontal axis and required read range on the vertical axis. Electronic tolling sits top-right at up to 200 km/h and 6-10 meters. Fleet management sits mid at 5-30 km/h and 3-8 meters. Parking access sits lower-left at 5-15 km/h and 3-5 meters. Gated communities sit near parking at 5-15 km/h and 3-5 meters. Tolling is the demanding outlier; the rest cluster at low speed and short range.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FOUR APPLICATIONS, MAPPED</text>
<text x="600" y="86" text-anchor="middle" font-size="15" fill="#4f4f4f">Positioned by the read range and vehicle speed each application demands.</text>
<!-- axes -->
<line x1="150" y1="150" x2="150" y2="560" stroke="#d9cdb6" stroke-width="2"/>
<line x1="150" y1="560" x2="1110" y2="560" stroke="#d9cdb6" stroke-width="2"/>
<text x="630" y="600" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d5a3a">VEHICLE SPEED →</text>
<text x="180" y="140" text-anchor="start" font-size="13.5" font-weight="700" fill="#6d5a3a">READ RANGE ↑</text>
<text x="196" y="556" text-anchor="middle" font-size="12" fill="#8a8272">low</text>
<text x="1070" y="556" text-anchor="middle" font-size="12" fill="#8a8272">highway</text>
<!-- gated marker (behind parking cluster) -->
<circle cx="300" cy="470" r="11" fill="#4a5568"/>
<rect x="322" y="452" width="250" height="36" rx="10" fill="#ffffff" stroke="#bcc6d4" stroke-width="1.4"/>
<text x="336" y="469" text-anchor="start" font-size="13.5" font-weight="800" fill="#3a4557">Gated community</text>
<text x="336" y="483" text-anchor="start" font-size="12" fill="#5c5c5c">5-15 km/h · 3-5 m</text>
<!-- parking marker -->
<circle cx="250" cy="400" r="11" fill="#3d6b6b"/>
<rect x="272" y="382" width="240" height="36" rx="10" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="286" y="399" text-anchor="start" font-size="13.5" font-weight="800" fill="#2c5454">Parking access</text>
<text x="286" y="413" text-anchor="start" font-size="12" fill="#5c5c5c">5-15 km/h · 3-5 m</text>
<!-- fleet marker -->
<circle cx="430" cy="300" r="11" fill="#3d6b6b"/>
<rect x="452" y="282" width="248" height="36" rx="10" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="466" y="299" text-anchor="start" font-size="13.5" font-weight="800" fill="#2c5454">Fleet management</text>
<text x="466" y="313" text-anchor="start" font-size="12" fill="#5c5c5c">5-30 km/h · 3-8 m</text>
<!-- tolling marker -->
<circle cx="980" cy="220" r="13" fill="#c39a5f"/>
<rect x="726" y="196" width="252" height="48" rx="10" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.6"/>
<text x="742" y="216" text-anchor="start" font-size="14" font-weight="800" fill="#6d5a3a">Electronic tolling</text>
<text x="742" y="233" text-anchor="start" font-size="12" fill="#5c5c5c">up to 200 km/h · 6-10 m</text>
<text x="600" y="632" text-anchor="middle" font-size="14" fill="#5c5c5c">Tolling is the demanding outlier — highway speed and the longest range; the rest cluster low and short.</text>
</svg>
