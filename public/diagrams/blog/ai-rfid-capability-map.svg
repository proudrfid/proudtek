<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five AI capabilities unlocked by RFID inventory data</title>
<desc id="d">Five capability cards: one, anomaly detection — flags stock drops, wrong-location items and RFID-versus-POS mismatches against learned normal patterns. Two, automated replenishment — reorder points from sell-through by store, zone and time period, fewer stockouts and overstocks. Three, dynamic markdown timing — timing and depth from inventory aging data, recovering revenue before seasonal end-of-life. Four, omnichannel allocation — the cheapest fulfillment path per order: ship-from-store, BOPIS or DC shipment. Five, store layout insight — picked up, tried on, returned versus purchased: placement that actually converts. Caption: none of it exists without dense, accurate item-level reads underneath.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT THE PAIRING ACTUALLY BUYS</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Five capabilities AI adds on top of RFID reads</text>

<rect x="60" y="130" width="340" height="200" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<circle cx="100" cy="178" r="18" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="100" y="184" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">1</text>
<text x="136" y="184" font-size="16.5" font-weight="700" fill="#291c0e">Anomaly detection</text>
<text x="88" y="230" font-size="13.5" fill="#4f4f4f">flags stock drops, wrong-location</text>
<text x="88" y="254" font-size="13.5" fill="#4f4f4f">items and RFID-vs-POS mismatches</text>
<text x="88" y="278" font-size="13.5" fill="#4f4f4f">against learned normal patterns</text>

<rect x="430" y="130" width="340" height="200" rx="14" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<circle cx="470" cy="178" r="18" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="470" y="184" text-anchor="middle" font-size="16" font-weight="800" fill="#1b4332">2</text>
<text x="506" y="184" font-size="16.5" font-weight="700" fill="#291c0e">Auto replenishment</text>
<text x="458" y="230" font-size="13.5" fill="#4f4f4f">reorder points from sell-through</text>
<text x="458" y="254" font-size="13.5" fill="#4f4f4f">by store, zone and time period —</text>
<text x="458" y="278" font-size="13.5" fill="#4f4f4f">fewer stockouts, less overstock</text>

<rect x="800" y="130" width="340" height="200" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.5"/>
<circle cx="840" cy="178" r="18" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="840" y="184" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">3</text>
<text x="876" y="184" font-size="16.5" font-weight="700" fill="#291c0e">Dynamic markdown</text>
<text x="828" y="230" font-size="13.5" fill="#4f4f4f">timing + depth from inventory</text>
<text x="828" y="254" font-size="13.5" fill="#4f4f4f">aging data, recovering revenue</text>
<text x="828" y="278" font-size="13.5" fill="#4f4f4f">before seasonal end-of-life</text>

<rect x="245" y="370" width="340" height="200" rx="14" fill="#eef1f5" stroke="#4a5568" stroke-width="1.5"/>
<circle cx="285" cy="418" r="18" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="285" y="424" text-anchor="middle" font-size="16" font-weight="800" fill="#4a5568">4</text>
<text x="321" y="424" font-size="16.5" font-weight="700" fill="#291c0e">Omnichannel allocation</text>
<text x="273" y="470" font-size="13.5" fill="#4f4f4f">the cheapest fulfillment path</text>
<text x="273" y="494" font-size="13.5" fill="#4f4f4f">per order: ship-from-store,</text>
<text x="273" y="518" font-size="13.5" fill="#4f4f4f">BOPIS or DC shipment</text>

<rect x="615" y="370" width="340" height="200" rx="14" fill="#e8f4f7" stroke="#177a92" stroke-width="1.5"/>
<circle cx="655" cy="418" r="18" fill="#ffffff" stroke="#177a92" stroke-width="1.5"/>
<text x="655" y="424" text-anchor="middle" font-size="16" font-weight="800" fill="#177a92">5</text>
<text x="691" y="424" font-size="16.5" font-weight="700" fill="#291c0e">Store layout insight</text>
<text x="643" y="470" font-size="13.5" fill="#4f4f4f">picked up, tried on, returned</text>
<text x="643" y="494" font-size="13.5" fill="#4f4f4f">vs purchased — the placement</text>
<text x="643" y="518" font-size="13.5" fill="#4f4f4f">data that actually converts</text>

<text x="600" y="625" text-anchor="middle" font-size="14" fill="#5c5c5c">None of it exists without dense, accurate item-level reads underneath — that part is the radio's job.</text>
</svg>
