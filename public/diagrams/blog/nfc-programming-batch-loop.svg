<text x="446" y="383" text-anchor="end" font-size="12" fill="#b7cccc">status LED</text>

<line x1="504" y1="285" x2="540" y2="285" stroke="#c39a5f" stroke-width="3"/>
<path d="M 540 285 l -11 -6 v 12 z" fill="#c39a5f"/>

