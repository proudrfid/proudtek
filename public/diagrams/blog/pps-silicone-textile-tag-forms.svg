<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Form-factor comparison of PPS, silicone and textile RFID laundry tags</title>
<desc id="d">Three physical forms drawn to relative scale. PPS: a rigid button 18-22 mm or 45 by 16 mm rectangle, 2-3 mm thick, heat-sealed or sewn. Silicone: a flexible strip 70 by 15 mm, 2-3 mm thick, sewn into a seam. Textile: a woven label 50 by 30 mm, under 1 mm thick, sewn in like a care label.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THREE MATERIALS, THREE FORMS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Same reader — very different things to sew into a garment.</text>

<line x1="388" y1="150" x2="388" y2="430" stroke="#efe7d6" stroke-width="1.5"/>
<line x1="756" y1="150" x2="756" y2="430" stroke="#efe7d6" stroke-width="1.5"/>

<!-- PPS -->
<circle cx="196" cy="252" r="30" fill="#4a5568"/>
<rect x="240" y="236" width="72" height="30" rx="4" fill="#4a5568"/>
<text x="244" y="322" text-anchor="middle" font-size="17" font-weight="800" fill="#3f4657">PPS</text>
<text x="244" y="346" text-anchor="middle" font-size="12.5" fill="#291c0e">rigid button / rectangle</text>
<text x="244" y="370" text-anchor="middle" font-size="12" fill="#5c5c5c">18-22 mm · 45 × 16 mm · 2-3 mm</text>
<text x="244" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">heat-seal pouch or sewn</text>

<!-- Silicone -->
<rect x="530" y="238" width="140" height="28" rx="14" fill="#3d6b6b"/>
<text x="600" y="322" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">Silicone</text>
<text x="600" y="346" text-anchor="middle" font-size="12.5" fill="#291c0e">flexible strip, bends with fabric</text>
<text x="600" y="370" text-anchor="middle" font-size="12" fill="#5c5c5c">70 × 15 mm · 2-3 mm</text>
<text x="600" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">sewn into a seam</text>

<!-- Textile -->
<rect x="906" y="222" width="100" height="52" rx="4" fill="#c39a5f"/>
<line x1="916" y1="236" x2="996" y2="236" stroke="#e9d6ad" stroke-width="1.4"/>
<line x1="916" y1="248" x2="996" y2="248" stroke="#e9d6ad" stroke-width="1.4"/>
<line x1="916" y1="260" x2="996" y2="260" stroke="#e9d6ad" stroke-width="1.4"/>
<text x="956" y="322" text-anchor="middle" font-size="17" font-weight="800" fill="#a07d43">Textile</text>
<text x="956" y="346" text-anchor="middle" font-size="12.5" fill="#291c0e">woven label, imperceptible</text>
<text x="956" y="370" text-anchor="middle" font-size="12" fill="#5c5c5c">50 × 30 mm · &lt; 1 mm</text>
<text x="956" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#a07d43">sewn in like a care label</text>

<rect x="230" y="470" width="740" height="44" rx="12" fill="#faf7f0" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="600" y="497" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Thickness — PPS 2-3 mm · Silicone 2-3 mm · Textile &lt; 1 mm</text>

<text x="600" y="574" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The reader can't tell them apart; the wearer and the wash can.</text>
</svg>
