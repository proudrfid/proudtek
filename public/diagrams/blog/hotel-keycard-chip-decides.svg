<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">One chip choice on the purchase order decides five things about a hotel keycard</title>
<desc id="d">A single choice — the chip — fans out to five downstream consequences. One, lock compatibility: which locks even authenticate the card. Two, security tier: Crypto-1 versus AES-128 and EAL5+. Three, multi-application headroom: whether one card can serve door, spa and point-of-sale. Four, write endurance: the daily re-encode cycles survived. Five, unit cost: the smallest line item but the biggest source of lock-in.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE CHOICE ON THE PURCHASE ORDER</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The chip quietly decides all five of these.</text>

<!-- hub -->
<line x1="310" y1="338" x2="400" y2="179" stroke="#cbb8a0" stroke-width="1.8"/>
<line x1="310" y1="338" x2="400" y2="245" stroke="#cbb8a0" stroke-width="1.8"/>
<line x1="310" y1="338" x2="400" y2="311" stroke="#cbb8a0" stroke-width="1.8"/>
<line x1="310" y1="338" x2="400" y2="377" stroke="#cbb8a0" stroke-width="1.8"/>
<line x1="310" y1="338" x2="400" y2="443" stroke="#cbb8a0" stroke-width="1.8"/>
<rect x="150" y="288" width="160" height="100" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="204" y="312" width="52" height="44" rx="6" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<rect x="218" y="324" width="24" height="20" rx="2" fill="#d4a755"/>
<text x="230" y="378" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">THE CHIP</text>

<!-- pill 1 -->
<rect x="400" y="150" width="724" height="58" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="432" cy="179" r="14" fill="#3d6b6b"/>
<text x="432" y="184" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="460" y="174" font-size="15" font-weight="800" fill="#291c0e">Lock compatibility</text>
<text x="460" y="194" font-size="12.5" fill="#4f6a6a">which locks even authenticate the card</text>

<!-- pill 2 -->
<rect x="400" y="216" width="724" height="58" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="432" cy="245" r="14" fill="#3d6b6b"/>
<text x="432" y="250" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="460" y="240" font-size="15" font-weight="800" fill="#291c0e">Security tier</text>
<text x="460" y="260" font-size="12.5" fill="#4f6a6a">Crypto-1 vs AES-128 / EAL5+</text>

<!-- pill 3 -->
<rect x="400" y="282" width="724" height="58" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="432" cy="311" r="14" fill="#3d6b6b"/>
<text x="432" y="316" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
<text x="460" y="306" font-size="15" font-weight="800" fill="#291c0e">Multi-application headroom</text>
<text x="460" y="326" font-size="12.5" fill="#4f6a6a">one card for door, spa and POS?</text>

<!-- pill 4 -->
<rect x="400" y="348" width="724" height="58" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="432" cy="377" r="14" fill="#3d6b6b"/>
<text x="432" y="382" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
<text x="460" y="372" font-size="15" font-weight="800" fill="#291c0e">Write endurance</text>
<text x="460" y="392" font-size="12.5" fill="#4f6a6a">daily re-encode cycles survived</text>

<!-- pill 5 -->
<rect x="400" y="414" width="724" height="58" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<circle cx="432" cy="443" r="14" fill="#c39a5f"/>
<text x="432" y="448" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">5</text>
<text x="460" y="438" font-size="15" font-weight="800" fill="#291c0e">Unit cost</text>
<text x="460" y="458" font-size="12.5" fill="#6d5a3a">small line item, biggest lock-in</text>

<text x="600" y="512" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Map the lock estate and the three-year refresh plan before the chip, not after.</text>
</svg>
