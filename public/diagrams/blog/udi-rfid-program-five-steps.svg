<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five-step UDI + RFID program — design, manufacturing, GUDID submission, distribution, post-market</title>
<desc id="d">A five-step flow. Step 1, design: choose the issuing agency and reserve the DI range. Step 2, manufacturing line: printer plus RFID encoder mark DI and PI on each unit. Step 3, GUDID submission via HL7 or the FDA portal, flagged as required before commercial distribution. Step 4, distribution: hospitals and distributors read for inventory and recall. Step 5, post-market: trace affected units — UDI says which, RFID says where. Below, three notes: on the line every unit leaves DI and PI marked and RFID-encoded; to the FDA each UDI's metadata is submitted to GUDID before shipping; in the field UDI identifies the units and RFID locates them in inventory.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BUILDING A COMBINED UDI + RFID PROGRAM</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Five steps from DI range to traceable device</text>
<text x="600" y="132" text-anchor="middle" font-size="15" fill="#5c5c5c">design · manufacturing · packaging · regulatory affairs · post-market surveillance</text>

<rect x="460" y="192" width="280" height="34" rx="17" fill="#e7f1ec" stroke="#a8c8bb" stroke-width="1.5"/>
<text x="600" y="214" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">BEFORE COMMERCIAL DISTRIBUTION</text>
<line x1="600" y1="226" x2="600" y2="252" stroke="#a8c8bb" stroke-width="2"/>

<line x1="150" y1="300" x2="1050" y2="300" stroke="#cfe0e0" stroke-width="5" stroke-linecap="round"/>
<circle cx="150" cy="300" r="34" fill="#3d6b6b"/>
<text x="150" y="308" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
<circle cx="375" cy="300" r="34" fill="#3d6b6b"/>
<text x="375" y="308" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
<circle cx="600" cy="300" r="44" fill="none" stroke="#a8c8bb" stroke-width="2.5"/>
<circle cx="600" cy="300" r="34" fill="#2d6a4f"/>
<text x="600" y="308" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
<circle cx="825" cy="300" r="34" fill="#3d6b6b"/>
<text x="825" y="308" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">4</text>
<circle cx="1050" cy="300" r="34" fill="#3d6b6b"/>
<text x="1050" y="308" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">5</text>

<text x="150" y="368" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Design</text>
<text x="150" y="392" text-anchor="middle" font-size="12.5" fill="#4f4f4f">choose issuing agency</text>
<text x="150" y="412" text-anchor="middle" font-size="12.5" fill="#4f4f4f">reserve DI range</text>
<text x="375" y="368" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Manufacturing line</text>
<text x="375" y="392" text-anchor="middle" font-size="12.5" fill="#4f4f4f">printer + RFID encoder</text>
<text x="375" y="412" text-anchor="middle" font-size="12.5" fill="#4f4f4f">DI + PI on each unit</text>
<text x="600" y="368" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">GUDID submission</text>
<text x="600" y="392" text-anchor="middle" font-size="12.5" fill="#4f4f4f">HL7 or FDA portal</text>
<text x="600" y="412" text-anchor="middle" font-size="12.5" fill="#4f4f4f">before distribution</text>
<text x="825" y="368" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Distribution</text>
<text x="825" y="392" text-anchor="middle" font-size="12.5" fill="#4f4f4f">hospitals &amp; distributors</text>
<text x="825" y="412" text-anchor="middle" font-size="12.5" fill="#4f4f4f">inventory · recall reads</text>
<text x="1050" y="368" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Post-market</text>
<text x="1050" y="392" text-anchor="middle" font-size="12.5" fill="#4f4f4f">trace affected units</text>
<text x="1050" y="412" text-anchor="middle" font-size="12.5" fill="#4f4f4f">UDI: which · RFID: where</text>

<rect x="90" y="470" width="330" height="96" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="114" y="502" font-size="14" font-weight="700" fill="#291c0e">On the line</text>
<text x="114" y="526" font-size="12.5" fill="#4f4f4f">every unit leaves DI + PI marked</text>
<text x="114" y="546" font-size="12.5" fill="#4f4f4f">and RFID-encoded</text>
<rect x="435" y="470" width="330" height="96" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="459" y="502" font-size="14" font-weight="700" fill="#291c0e">To the FDA</text>
<text x="459" y="526" font-size="12.5" fill="#4f4f4f">each UDI's metadata submitted</text>
<text x="459" y="546" font-size="12.5" fill="#4f4f4f">to GUDID before shipping</text>
<rect x="780" y="470" width="330" height="96" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="804" y="502" font-size="14" font-weight="700" fill="#291c0e">In the field</text>
<text x="804" y="526" font-size="12.5" fill="#4f4f4f">UDI identifies the units —</text>
<text x="804" y="546" font-size="12.5" fill="#4f4f4f">RFID locates them in inventory</text>
</svg>
