<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The eco spectrum of RFID card materials — greener as you go down</title>
<desc id="d">A vertical spectrum ladder runs from harder-to-recycle at the top to compostable at the bottom: PVC with chlorine content and messy post-consumer recycling, ABS with limited recycling infrastructure, PC whose green argument is sheer longevity, PET in standard plastics recycling streams, PETG and rPET with recycled-content grades, FSC wood veneer with a verifiable chain of custody, and compostable paper whose water-soluble adhesive frees the inlay for reuse. A side panel notes the counter-intuitive bit: a five-year PVC card can have lower lifecycle emissions than a paper card replaced monthly, and several EU hotel chains now mandate PET or paper keys for single-use plastics targets.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="eco" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a89684"/><stop offset="100%" stop-color="#2d6a4f"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE PART YOUR ESG REPORT CARES ABOUT</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Greener as you go down the ladder</text>

<text x="149" y="142" text-anchor="middle" font-size="12.5" fill="#5c5c5c">harder to recycle</text>
<rect x="140" y="150" width="18" height="420" rx="9" fill="url(#eco)"/>
<path d="M 138 576 L 160 576 L 149 594 Z" fill="#2d6a4f"/>
<text x="149" y="614" text-anchor="middle" font-size="12.5" fill="#2d6a4f">compostable</text>

<circle cx="149" cy="170" r="9" fill="#3d6b6b" stroke="#ffffff" stroke-width="2.5"/>
<text x="190" y="168" font-size="15" font-weight="700" fill="#291c0e">PVC</text>
<text x="190" y="188" font-size="13" fill="#4f4f4f">chlorine content, messy post-consumer recycling</text>

<circle cx="149" cy="230" r="9" fill="#a97f43" stroke="#ffffff" stroke-width="2.5"/>
<text x="190" y="228" font-size="15" font-weight="700" fill="#291c0e">ABS</text>
<text x="190" y="248" font-size="13" fill="#4f4f4f">limited recycling infrastructure, long-lived</text>

<circle cx="149" cy="290" r="9" fill="#234a4a" stroke="#ffffff" stroke-width="2.5"/>
<text x="190" y="288" font-size="15" font-weight="700" fill="#291c0e">PC</text>
<text x="190" y="308" font-size="13" fill="#4f4f4f">recyclable — longevity is its green argument</text>

<circle cx="149" cy="350" r="9" fill="#4a5568" stroke="#ffffff" stroke-width="2.5"/>
<text x="190" y="348" font-size="15" font-weight="700" fill="#291c0e">PET</text>
<text x="190" y="368" font-size="13" fill="#4f4f4f">standard plastics recycling stream</text>

<circle cx="149" cy="410" r="9" fill="#2d6a4f" stroke="#ffffff" stroke-width="2.5"/>
<text x="190" y="408" font-size="15" font-weight="700" fill="#291c0e">PETG / rPET</text>
<text x="190" y="428" font-size="13" fill="#4f4f4f">recycled-content grades available</text>

<circle cx="149" cy="470" r="9" fill="#7a5636" stroke="#ffffff" stroke-width="2.5"/>
<text x="190" y="468" font-size="15" font-weight="700" fill="#291c0e">FSC wood veneer</text>
<text x="190" y="488" font-size="13" fill="#4f4f4f">verifiable chain of custody for audits</text>

<circle cx="149" cy="530" r="9" fill="#7d7060" stroke="#ffffff" stroke-width="2.5"/>
<text x="190" y="528" font-size="15" font-weight="700" fill="#291c0e">Paper</text>
<text x="190" y="548" font-size="13" fill="#4f4f4f">compostable — water-soluble adhesive frees the inlay</text>

<rect x="770" y="210" width="366" height="250" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="788" y="246" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">THE COUNTER-INTUITIVE BIT</text>
<text x="788" y="280" font-size="16" font-weight="700" fill="#291c0e">A five-year PVC card can have</text>
<text x="788" y="304" font-size="16" font-weight="700" fill="#291c0e">lower lifecycle emissions than</text>
<text x="788" y="328" font-size="16" font-weight="700" fill="#291c0e">a paper card replaced monthly.</text>
<text x="788" y="362" font-size="13.5" fill="#4f4f4f">Compare over the card's life,</text>
<text x="788" y="382" font-size="13.5" fill="#4f4f4f">not per unit.</text>
<text x="788" y="416" font-size="13.5" fill="#2d6a4f">Several EU hotel chains now mandate</text>
<text x="788" y="436" font-size="13.5" fill="#2d6a4f">PET or paper keys for single-use targets.</text>

<text x="600" y="640" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Recyclability, compostability and longevity crown three different winners — pick your metric first.</text>
</svg>
