<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="acF1Title acF1Desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="acF1Title">Five ways an autoclave destroys a standard RFID tag</title>
  <desc id="acF1Desc">Five failure modes for a consumer-grade RFID tag in an autoclave. One, adhesive failure: pressure-sensitive adhesives delaminate above 80°C and the tag falls off on the first cycle. Two, substrate warp: PET and PVC deform above 100°C, cracking or detuning the antenna. Three, antenna oxidation: copper or aluminium antennas oxidize and break, with read range degrading within 5 to 20 cycles. Four, chip thermal stress: silicon dies are rated to 85°C operating and 105°C storage, so repeated 134°C exposure stresses bond wires. Five, moisture ingress: steam corrodes internal traces and read range fades before total failure.</desc>

  <defs>
    <radialGradient id="f1Bg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f1ece0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#f1Bg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="66" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="1.5" fill="#291c0e">Five ways an autoclave kills a standard tag</text>
  <text x="600" y="95" text-anchor="middle" font-size="15.5" fill="#8b2d2d">One trip through 134°C steam and the wafer comes back curled, discolored, and mute</text>

  <!-- 5 cards -->
  <!-- card template positions: x = 58, 278, 498, 718, 938 ; width 204 -->
  <g>
    <!-- CARD 1 -->
    <rect x="58" y="150" width="204" height="370" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
    <rect x="58" y="150" width="204" height="8" rx="4" fill="#8b2d2d"/>
    <circle cx="160" cy="200" r="20" fill="#f4e6e3" stroke="#8b2d2d" stroke-width="2"/>
    <text x="160" y="207" text-anchor="middle" font-size="20" font-weight="800" fill="#8b2d2d">1</text>
    <!-- peeling label icon -->
    <rect x="128" y="238" width="64" height="44" rx="6" fill="#ffffff" stroke="#b9a074" stroke-width="2"/>
    <path d="M188 238 q22 6 14 34 q-4 12 -18 10 q10 -8 6 -22 q-4 -14 -2 -22 z" fill="#f4e6e3" stroke="#8b2d2d" stroke-width="2"/>
    <text x="160" y="316" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Adhesive failure</text>
    <text x="160" y="352" text-anchor="middle" font-size="26" font-weight="800" fill="#8b2d2d">&gt; 80°C</text>
    <text x="160" y="392" text-anchor="middle" font-size="13" fill="#4f4f4f">PSA adhesives</text>
    <text x="160" y="411" text-anchor="middle" font-size="13" fill="#4f4f4f">delaminate. Tag</text>
    <text x="160" y="430" text-anchor="middle" font-size="13" fill="#4f4f4f">drops off on the</text>
    <text x="160" y="449" text-anchor="middle" font-size="13" fill="#4f4f4f">very first cycle.</text>
  </g>

  <g>
    <!-- CARD 2 -->
    <rect x="278" y="150" width="204" height="370" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
    <rect x="278" y="150" width="204" height="8" rx="4" fill="#8b2d2d"/>
    <circle cx="380" cy="200" r="20" fill="#f4e6e3" stroke="#8b2d2d" stroke-width="2"/>
    <text x="380" y="207" text-anchor="middle" font-size="20" font-weight="800" fill="#8b2d2d">2</text>
    <!-- warped card icon -->
    <path d="M348 250 q32 -18 64 0 q-4 22 0 34 q-32 16 -64 0 q4 -18 0 -34 z" fill="#ffffff" stroke="#b9a074" stroke-width="2"/>
    <text x="380" y="316" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Substrate warp</text>
    <text x="380" y="352" text-anchor="middle" font-size="26" font-weight="800" fill="#8b2d2d">&gt; 100°C</text>
    <text x="380" y="392" text-anchor="middle" font-size="13" fill="#4f4f4f">PET and PVC</text>
    <text x="380" y="411" text-anchor="middle" font-size="13" fill="#4f4f4f">deform. The tag</text>
    <text x="380" y="430" text-anchor="middle" font-size="13" fill="#4f4f4f">bends, cracks, or</text>
    <text x="380" y="449" text-anchor="middle" font-size="13" fill="#4f4f4f">detunes its antenna.</text>
  </g>

  <g>
    <!-- CARD 3 -->
    <rect x="498" y="150" width="204" height="370" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
    <rect x="498" y="150" width="204" height="8" rx="4" fill="#8b2d2d"/>
    <circle cx="600" cy="200" r="20" fill="#f4e6e3" stroke="#8b2d2d" stroke-width="2"/>
    <text x="600" y="207" text-anchor="middle" font-size="20" font-weight="800" fill="#8b2d2d">3</text>
    <!-- broken coil icon -->
    <rect x="570" y="244" width="60" height="44" rx="4" fill="none" stroke="#b9a074" stroke-width="2"/>
    <path d="M578 252 h44 v8 h-38 v8 h38 v8 h-44" fill="none" stroke="#8b2d2d" stroke-width="2.5"/>
    <line x1="596" y1="238" x2="606" y2="294" stroke="#8b2d2d" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="600" y="316" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Antenna oxidation</text>
    <text x="600" y="352" text-anchor="middle" font-size="24" font-weight="800" fill="#8b2d2d">5–20 cycles</text>
    <text x="600" y="392" text-anchor="middle" font-size="13" fill="#4f4f4f">Copper / aluminium</text>
    <text x="600" y="411" text-anchor="middle" font-size="13" fill="#4f4f4f">antennas oxidize</text>
    <text x="600" y="430" text-anchor="middle" font-size="13" fill="#4f4f4f">and break. Read</text>
    <text x="600" y="449" text-anchor="middle" font-size="13" fill="#4f4f4f">range decays.</text>
  </g>

  <g>
    <!-- CARD 4 -->
    <rect x="718" y="150" width="204" height="370" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
    <rect x="718" y="150" width="204" height="8" rx="4" fill="#8b2d2d"/>
    <circle cx="820" cy="200" r="20" fill="#f4e6e3" stroke="#8b2d2d" stroke-width="2"/>
    <text x="820" y="207" text-anchor="middle" font-size="20" font-weight="800" fill="#8b2d2d">4</text>
    <!-- chip icon -->
    <rect x="796" y="244" width="48" height="44" rx="5" fill="#ffffff" stroke="#8b2d2d" stroke-width="2"/>
    <rect x="806" y="254" width="28" height="24" rx="3" fill="#f4e6e3"/>
    <path d="M796 254 h-8 M796 266 h-8 M796 278 h-8 M844 254 h8 M844 266 h8 M844 278 h8" stroke="#8b2d2d" stroke-width="2"/>
    <text x="820" y="316" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Chip thermal stress</text>
    <text x="820" y="352" text-anchor="middle" font-size="24" font-weight="800" fill="#8b2d2d">85 / 105°C</text>
    <text x="820" y="392" text-anchor="middle" font-size="13" fill="#4f4f4f">Silicon is rated</text>
    <text x="820" y="411" text-anchor="middle" font-size="13" fill="#4f4f4f">85°C run, 105°C</text>
    <text x="820" y="430" text-anchor="middle" font-size="13" fill="#4f4f4f">store. 134°C stresses</text>
    <text x="820" y="449" text-anchor="middle" font-size="13" fill="#4f4f4f">the bond wires.</text>
  </g>

  <g>
    <!-- CARD 5 -->
    <rect x="938" y="150" width="204" height="370" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
    <rect x="938" y="150" width="204" height="8" rx="4" fill="#8b2d2d"/>
    <circle cx="1040" cy="200" r="20" fill="#f4e6e3" stroke="#8b2d2d" stroke-width="2"/>
    <text x="1040" y="207" text-anchor="middle" font-size="20" font-weight="800" fill="#8b2d2d">5</text>
    <!-- droplet icon -->
    <path d="M1040 242 q22 26 22 42 a22 22 0 1 1 -44 0 q0 -16 22 -42 z" fill="#ffffff" stroke="#8b2d2d" stroke-width="2"/>
    <path d="M1032 288 a10 10 0 0 0 8 6" fill="none" stroke="#8b2d2d" stroke-width="2"/>
    <text x="1040" y="316" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Moisture ingress</text>
    <text x="1040" y="352" text-anchor="middle" font-size="24" font-weight="800" fill="#8b2d2d">gradual</text>
    <text x="1040" y="392" text-anchor="middle" font-size="13" fill="#4f4f4f">Steam seeps in and</text>
    <text x="1040" y="411" text-anchor="middle" font-size="13" fill="#4f4f4f">corrodes traces.</text>
    <text x="1040" y="430" text-anchor="middle" font-size="13" fill="#4f4f4f">Range fades first,</text>
    <text x="1040" y="449" text-anchor="middle" font-size="13" fill="#4f4f4f">then fails entirely.</text>
  </g>

  <!-- footer takeaway -->
  <rect x="58" y="548" width="1084" height="82" rx="14" fill="#2a1d0f"/>
  <text x="88" y="582" font-size="15.5" font-weight="700" fill="#f0c98a">The catch:</text>
  <text x="176" y="582" font-size="15.5" fill="#f3ecdd">most modes start subtle — range quietly degrades before the tag dies, so a &quot;still works&quot; test can</text>
  <text x="176" y="606" font-size="15.5" fill="#f3ecdd">mask a tag that&apos;s already three cycles from silence. That&apos;s why validation is measured, not eyeballed.</text>
</svg>
