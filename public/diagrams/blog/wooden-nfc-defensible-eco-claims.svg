<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Defensible sustainability claims for wooden NFC cards and the paperwork each needs</title>
<desc id="d">Five sustainability claims paired with the documentation to request. FSC-certified wood needs the FSC Chain-of-Custody certificate number in the format FSC-C followed by six digits, verified on info.fsc.org. The PEFC alternative is recognized by EU public procurement under Directive 2014/24/EU. A bamboo rapidly-renewable claim maps to LEED v4 with a 3-year harvest, species Moso or Phyllostachys edulis. REACH and formaldehyde-free claims need a Material Safety Data Sheet plus CARB Phase 2 or EPA TSCA Title VI compliance. For end-of-life, the honest phrasing is partially compostable with the NFC inlay recyclable through e-waste streams; claiming 100 percent biodegradable is a greenwashing risk under the FTC Green Guides and the EU Empowering Consumers Directive 2024/825.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="48" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ESG CLAIMS YOU CAN DEFEND IN AN AUDIT</text>
<text x="600" y="76" text-anchor="middle" font-size="16" fill="#4f4f4f">Each claim is only as strong as the paperwork that ships with the cards.</text>

<text x="118" y="112" font-size="12" font-weight="800" letter-spacing="0.4" fill="#8a8a8a">DEFENSIBLE CLAIM</text>
<text x="648" y="112" font-size="12" font-weight="800" letter-spacing="0.4" fill="#8a8a8a">DOCUMENTATION TO REQUEST</text>
<line x1="628" y1="126" x2="628" y2="430" stroke="#efe9dc" stroke-width="1.4"/>

<!-- r1 -->
<circle cx="96" cy="158" r="11" fill="#2d6a4f"/><path d="M 91 158 l 3 4 l 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="118" y="164" font-size="15" font-weight="800" fill="#291c0e">FSC-certified wood</text>
<text x="648" y="152" font-size="13" fill="#3a2f20">FSC Chain-of-Custody cert no. (FSC-CXXXXXX) —</text>
<text x="648" y="172" font-size="13" fill="#3a2f20">verify on info.fsc.org.</text>
<line x1="64" y1="188" x2="1136" y2="188" stroke="#efe9dc" stroke-width="1.2"/>

<!-- r2 -->
<circle cx="96" cy="220" r="11" fill="#2d6a4f"/><path d="M 91 220 l 3 4 l 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="118" y="226" font-size="15" font-weight="800" fill="#291c0e">PEFC alternative</text>
<text x="648" y="214" font-size="13" fill="#3a2f20">Recognized by EU public procurement</text>
<text x="648" y="234" font-size="13" fill="#3a2f20">(Directive 2014/24/EU).</text>
<line x1="64" y1="250" x2="1136" y2="250" stroke="#efe9dc" stroke-width="1.2"/>

<!-- r3 -->
<circle cx="96" cy="282" r="11" fill="#2d6a4f"/><path d="M 91 282 l 3 4 l 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="118" y="288" font-size="15" font-weight="800" fill="#291c0e">Bamboo rapidly renewable</text>
<text x="648" y="276" font-size="13" fill="#3a2f20">LEED v4, 3-yr harvest; species Moso</text>
<text x="648" y="296" font-size="13" fill="#3a2f20">(Phyllostachys edulis).</text>
<line x1="64" y1="312" x2="1136" y2="312" stroke="#efe9dc" stroke-width="1.2"/>

<!-- r4 -->
<circle cx="96" cy="344" r="11" fill="#2d6a4f"/><path d="M 91 344 l 3 4 l 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="118" y="350" font-size="15" font-weight="800" fill="#291c0e">REACH / formaldehyde-free</text>
<text x="648" y="338" font-size="13" fill="#3a2f20">Material Safety Data Sheet (MSDS) +</text>
<text x="648" y="358" font-size="13" fill="#3a2f20">CARB Phase 2 / EPA TSCA Title VI.</text>
<line x1="64" y1="374" x2="1136" y2="374" stroke="#efe9dc" stroke-width="1.2"/>

<!-- r5 end-of-life (the trap) -->
<rect x="64" y="392" width="1072" height="118" rx="12" fill="#fbf3f3" stroke="#e6c9c9" stroke-width="2"/>
<text x="92" y="424" font-size="15.5" font-weight="800" fill="#291c0e">End-of-life — say it honestly</text>
<circle cx="104" cy="458" r="10" fill="#2d6a4f"/><path d="M 99 458 l 3 4 l 6 -8" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="124" y="463" font-size="13.5" fill="#26402f">Say: "partially compostable; the NFC inlay is recyclable through e-waste streams."</text>
<circle cx="104" cy="490" r="10" fill="#8b2d2d"/><path d="M 100 486 l 8 8 M 108 486 l -8 8" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
<text x="124" y="495" font-size="13.5" fill="#7a2323">Don't say "100% biodegradable" — greenwashing risk under FTC Green Guides &amp; EU 2024/825.</text>

<text x="600" y="548" text-anchor="middle" font-size="14" fill="#4f4f4f">Ask for the paperwork up front — an unverifiable "FSC" claim is worse than no claim at all.</text>
</svg>
