<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">EPC Gen2v2 memory banks on the Alien Higgs-9, drawn to scale</title>
  <desc id="d">The four EPC Gen2v2 memory banks of the Higgs-9 drawn as horizontal bars scaled by bit size: Bank 0 Reserved holds the 32-bit access and 32-bit kill passwords; Bank 1 EPC is 128-bit for SGTIN and SSCC encoding; Bank 2 TID is a 96-bit factory-serialised unique identifier; Bank 3 User is 688-bit, the largest in the volume RAIN tier, holding on-tag application data. A note explains a 36-byte RTI trip record fits the User bank but not an M700 32-bit User bank.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EPC GEN2v2 MEMORY MAP — WHY HIGGS-9</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Four banks. Three are housekeeping; the fourth is the whole pitch.</text>

  <!-- Bank 0 Reserved -->
  <text x="120" y="150" font-size="15" font-weight="700" fill="#291c0e">Bank 0 · Reserved</text>
  <rect x="120" y="162" width="96" height="40" rx="5" fill="#4a5568"/>
  <text x="228" y="188" font-size="13.5" fill="#5c5c5c">64-bit — 32-bit access + 32-bit kill passwords</text>

  <!-- Bank 1 EPC -->
  <text x="120" y="246" font-size="15" font-weight="700" fill="#291c0e">Bank 1 · EPC</text>
  <rect x="120" y="258" width="192" height="40" rx="5" fill="#3d6b6b"/>
  <text x="324" y="284" font-size="13.5" fill="#5c5c5c">128-bit — SGTIN-96 / 198, SSCC, GIAI (GS1 TDS 2.0)</text>

  <!-- Bank 2 TID -->
  <text x="120" y="342" font-size="15" font-weight="700" fill="#291c0e">Bank 2 · TID</text>
  <rect x="120" y="354" width="144" height="40" rx="5" fill="#3d6b6b"/>
  <text x="276" y="380" font-size="13.5" fill="#5c5c5c">96-bit — factory-serialised unique ID (anti-clone)</text>

  <!-- Bank 3 User -->
  <text x="120" y="438" font-size="15" font-weight="800" fill="#291c0e">Bank 3 · User memory</text>
  <rect x="120" y="450" width="760" height="72" rx="6" fill="#c39a5f" stroke="#a97f3f" stroke-width="2"/>
  <text x="140" y="478" font-size="16" font-weight="800" fill="#ffffff">688-bit  ·  ≥ 64 bytes</text>
  <text x="140" y="502" font-size="13.5" fill="#3a2f1c">Largest in the volume RAIN tier — RTI trip data, field-service logs, GS1 AI</text>
  <text x="900" y="494" font-size="13.5" fill="#5c5c5c">on-tag,</text>
  <text x="900" y="512" font-size="13.5" fill="#5c5c5c">works offline</text>

  <!-- footnote -->
  <rect x="120" y="560" width="960" height="58" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="142" y="586" font-size="14.5" font-weight="700" fill="#2c5454">A 36-byte RTI trip record fits Bank 3 comfortably</text>
  <text x="142" y="607" font-size="13.5" fill="#3d6b6b">The same record does not fit an M700 32-bit User bank — that is the entire chip-selection argument.</text>
</svg>
