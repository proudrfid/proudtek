<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five steps to measure RFID shrinkage reduction defensibly</title>
<desc id="d">A five-step measurement method as a numbered list. One, capture a 90-day shrinkage baseline before deployment from cycle counts, discrepancy reports and audits, with weekly counts on top SKUs. Two, tag the 80/20 SKUs — the items that are 80 percent of shrink value get RFID. Three, run a matched-pair pilot: RFID one store, keep a similar control store, compare the 90-day delta. Four, track shrinkage by category not store-wide, to show 70 to 90 percent cuts in target categories. Five, run an annual independent audit so a third-party count becomes the finance-defensible number.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MEASURING THE REDUCTION, DEFENSIBLY</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="33" font-weight="700" fill="#291c0e">Five steps a CFO will actually believe</text>
<text x="600" y="124" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Baseline, isolate, audit — or the shrinkage claim is just marketing.</text>
<rect x="76" y="168" width="1048" height="72" rx="12" fill="#eef1f5" stroke="#c3c9d4" stroke-width="1.5"/>
<rect x="76" y="168" width="7" height="72" rx="3" fill="#4a5568"/>
<circle cx="122" cy="204" r="19" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="122" y="210" text-anchor="middle" font-size="19" font-weight="800" fill="#4a5568">1</text>
<text x="158" y="199" font-size="16" font-weight="800" fill="#291c0e">90-day shrinkage baseline</text>
<text x="158" y="224" font-size="13.5" fill="#5c5c5c">Cycle counts + discrepancy reports + audits before go-live; weekly counts on top SKUs.</text>
<rect x="76" y="252" width="1048" height="72" rx="12" fill="#eef1f5" stroke="#c3c9d4" stroke-width="1.5"/>
<rect x="76" y="252" width="7" height="72" rx="3" fill="#4a5568"/>
<circle cx="122" cy="288" r="19" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="122" y="294" text-anchor="middle" font-size="19" font-weight="800" fill="#4a5568">2</text>
<text x="158" y="283" font-size="16" font-weight="800" fill="#291c0e">Tag the 80/20 SKUs</text>
<text x="158" y="308" font-size="13.5" fill="#5c5c5c">The items driving 80% of shrink value get RFID; the tail stays on barcodes.</text>
<rect x="76" y="336" width="1048" height="72" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<rect x="76" y="336" width="7" height="72" rx="3" fill="#3d6b6b"/>
<circle cx="122" cy="372" r="19" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<text x="122" y="378" text-anchor="middle" font-size="19" font-weight="800" fill="#3d6b6b">3</text>
<text x="158" y="367" font-size="16" font-weight="800" fill="#291c0e">Matched-pair pilot</text>
<text x="158" y="392" font-size="13.5" fill="#5c5c5c">RFID one store, keep a look-alike control; compare the 90-day delta to strip out season.</text>
<rect x="76" y="420" width="1048" height="72" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<rect x="76" y="420" width="7" height="72" rx="3" fill="#3d6b6b"/>
<circle cx="122" cy="456" r="19" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<text x="122" y="462" text-anchor="middle" font-size="19" font-weight="800" fill="#3d6b6b">4</text>
<text x="158" y="451" font-size="16" font-weight="800" fill="#291c0e">Report by category</text>
<text x="158" y="476" font-size="13.5" fill="#5c5c5c">RFID hits high-theft categories hardest — show 70–90% cuts by department, not store-wide.</text>
<rect x="76" y="504" width="1048" height="72" rx="12" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.5"/>
<rect x="76" y="504" width="7" height="72" rx="3" fill="#1f6f3a"/>
<circle cx="122" cy="540" r="19" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<text x="122" y="546" text-anchor="middle" font-size="19" font-weight="800" fill="#1f6f3a">5</text>
<text x="158" y="535" font-size="16" font-weight="800" fill="#291c0e">Annual independent audit</text>
<text x="158" y="560" font-size="13.5" fill="#5c5c5c">A third-party physical count becomes the finance-defensible number, not RFID self-report.</text>
<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Without a baseline and a control store, you can't tell RFID from a good season.</text>
</svg>
