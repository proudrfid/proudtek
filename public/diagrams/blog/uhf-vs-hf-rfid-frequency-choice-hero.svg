<line x1="394" y1="224" x2="394" y2="292" stroke="#4a5568" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="199" y="300" width="70" height="58" rx="4" fill="#f9f1e2" stroke="#d4a755" stroke-width="2"/>
