<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">5-year keycard TCO for a 250-room property — three scenarios compared</title>
<desc id="d">Horizontal bars compare five-year cumulative keycard cost at a 250-room mid-scale property with 80 percent occupancy and 50 percent key return, using OpenKey's $18K-a-year lost-key baseline and conservative midpoints of published data. Magstripe status quo: $340-540K, with lost keys still bleeding $18K a year. RFID card-only switch, locks already RFID-capable: $135-200K, payback 8-14 months, saving $140-340K versus status quo. Full RFID lock replacement including $80K-150K capex: $190-290K, payback 18-32 months, saving $50-250K and adding mobile key plus AES-128 on every door.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">5-YEAR TCO — 250-ROOM MID-SCALE PROPERTY</text>
<text x="600" y="92" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="27" font-weight="700" fill="#291c0e">Three paths, one obvious spreadsheet winner</text>
<text x="600" y="122" text-anchor="middle" font-size="12.5" fill="#4f4f4f">80% occupancy · 50% key return · OpenKey lost-key baseline $18K/yr · conservative midpoints of published data</text>

<line x1="380" y1="140" x2="380" y2="570" stroke="#e6dfd2" stroke-width="1.5"/>
<line x1="600" y1="140" x2="600" y2="570" stroke="#efe9dd" stroke-width="1"/>
<line x1="820" y1="140" x2="820" y2="570" stroke="#efe9dd" stroke-width="1"/>
<line x1="1040" y1="140" x2="1040" y2="570" stroke="#efe9dd" stroke-width="1"/>
<text x="380" y="592" text-anchor="middle" font-size="12.5" fill="#4f4f4f">$0</text>
<text x="600" y="592" text-anchor="middle" font-size="12.5" fill="#4f4f4f">$200K</text>
<text x="820" y="592" text-anchor="middle" font-size="12.5" fill="#4f4f4f">$400K</text>
<text x="1040" y="592" text-anchor="middle" font-size="12.5" fill="#4f4f4f">$600K</text>

<text x="70" y="200" font-size="16" font-weight="700" fill="#291c0e">Magstripe status quo</text>
<text x="70" y="222" font-size="12.5" fill="#4f4f4f">the do-nothing baseline</text>
<rect x="380" y="180" width="594" height="48" rx="8" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
<line x1="754" y1="180" x2="754" y2="228" stroke="#8b2d2d" stroke-width="2" stroke-dasharray="5 4"/>
<text x="986" y="211" font-size="16" font-weight="800" fill="#8b2d2d">$340-540K</text>
<text x="380" y="254" font-size="13" font-weight="600" fill="#8b2d2d">and the $18K/yr of lost keys keeps coming</text>

<text x="70" y="340" font-size="16" font-weight="700" fill="#291c0e">RFID card-only switch</text>
<text x="70" y="362" font-size="12.5" fill="#4f4f4f">locks already RFID-capable</text>
<rect x="380" y="320" width="220" height="48" rx="8" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<line x1="529" y1="320" x2="529" y2="368" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="5 4"/>
<text x="612" y="351" font-size="16" font-weight="800" fill="#1b4332">$135-200K</text>
<text x="380" y="394" font-size="13" font-weight="700" fill="#1f6f3a">payback 8-14 months · saves $140-340K vs status quo</text>

<text x="70" y="480" font-size="16" font-weight="700" fill="#291c0e">Full RFID lock replacement</text>
<text x="70" y="502" font-size="12.5" fill="#4f4f4f">capex $80K-150K included</text>
<rect x="380" y="460" width="319" height="48" rx="8" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<line x1="589" y1="460" x2="589" y2="508" stroke="#3d6b6b" stroke-width="2" stroke-dasharray="5 4"/>
<text x="711" y="491" font-size="16" font-weight="800" fill="#2c5454">$190-290K</text>
<text x="380" y="534" font-size="13" font-weight="700" fill="#2c5454">payback 18-32 months · saves $50-250K · unlocks mobile key + AES-128</text>

<text x="600" y="634" text-anchor="middle" font-size="13" fill="#5c5c5c">The dominant move is the boring one: keep the locks, swap the consumable. Full line items in the table below.</text>
</svg>
