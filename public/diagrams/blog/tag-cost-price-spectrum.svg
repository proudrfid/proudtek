<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">2026 per-tag price bands for eight RFID product categories</title>
<desc id="d">Log-scale range chart. Eight RFID product categories are plotted as horizontal price bands on an axis running from $0.03 to $5.00 and above. UHF paper-face labels sit at $0.03-0.08, UHF apparel hang tags at $0.05-0.15, NTAG213 NFC stickers at $0.05-0.12, NTAG 424 DNA authenticated NFC stickers at $0.15-0.40, MIFARE Classic PVC cards at $0.30-0.80, DESFire EV3 PVC cards at $0.80-2.00, silicone wristbands at $0.40-1.50 and rugged industrial or on-metal tags at $0.50-5.00 and above. A caption notes the scale is logarithmic and order quantity decides where inside each band a buyer lands.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EIGHT PRODUCTS · ONE QUESTION</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Where each tag type lands between $0.03 and $5.00+</text>

<!-- gridlines -->
<line x1="395" y1="150" x2="395" y2="556" stroke="#eee6d6" stroke-width="1"/>
<line x1="560" y1="150" x2="560" y2="556" stroke="#eee6d6" stroke-width="1"/>
<line x1="710" y1="150" x2="710" y2="556" stroke="#eee6d6" stroke-width="1"/>
<line x1="875" y1="150" x2="875" y2="556" stroke="#eee6d6" stroke-width="1"/>
<line x1="1025" y1="150" x2="1025" y2="556" stroke="#eee6d6" stroke-width="1"/>
<line x1="340" y1="556" x2="1120" y2="556" stroke="#d9cfbc" stroke-width="1.5"/>
<text x="395" y="580" text-anchor="middle" font-size="12.5" fill="#5c5c5c">$0.03</text>
<text x="560" y="580" text-anchor="middle" font-size="12.5" fill="#5c5c5c">$0.10</text>
<text x="710" y="580" text-anchor="middle" font-size="12.5" fill="#5c5c5c">$0.30</text>
<text x="875" y="580" text-anchor="middle" font-size="12.5" fill="#5c5c5c">$1.00</text>
<text x="1025" y="580" text-anchor="middle" font-size="12.5" fill="#5c5c5c">$3.00</text>

<!-- rows -->
<text x="326" y="181" text-anchor="end" font-size="14.5" fill="#291c0e">UHF label · paper-face</text>
<rect x="395" y="166" width="135" height="20" rx="10" fill="#3d6b6b"/>
<text x="542" y="181" font-size="14" font-weight="700" fill="#291c0e">$0.03–0.08</text>

<text x="326" y="229" text-anchor="end" font-size="14.5" fill="#291c0e">UHF hang tag · apparel</text>
<rect x="465" y="214" width="151" height="20" rx="10" fill="#3d6b6b"/>
<text x="628" y="229" font-size="14" font-weight="700" fill="#291c0e">$0.05–0.15</text>

<text x="326" y="277" text-anchor="end" font-size="14.5" fill="#291c0e">NFC sticker · NTAG213</text>
<rect x="465" y="262" width="120" height="20" rx="10" fill="#c39a5f"/>
<text x="597" y="277" font-size="14" font-weight="700" fill="#291c0e">$0.05–0.12</text>

<text x="326" y="325" text-anchor="end" font-size="14.5" fill="#291c0e">NFC sticker · NTAG 424 DNA</text>
<rect x="616" y="310" width="134" height="20" rx="10" fill="#c39a5f"/>
<text x="762" y="325" font-size="14" font-weight="700" fill="#291c0e">$0.15–0.40</text>

<text x="326" y="373" text-anchor="end" font-size="14.5" fill="#291c0e">PVC card · MIFARE Classic</text>
<rect x="710" y="358" width="135" height="20" rx="10" fill="#2c5454"/>
<text x="857" y="373" font-size="14" font-weight="700" fill="#291c0e">$0.30–0.80</text>

<text x="326" y="421" text-anchor="end" font-size="14.5" fill="#291c0e">PVC card · DESFire EV3</text>
<rect x="845" y="406" width="125" height="20" rx="10" fill="#2c5454"/>
<text x="982" y="421" font-size="14" font-weight="700" fill="#291c0e">$0.80–2.00</text>

<text x="326" y="469" text-anchor="end" font-size="14.5" fill="#291c0e">Silicone wristband</text>
<rect x="750" y="454" width="180" height="20" rx="10" fill="#2d6a4f"/>
<text x="942" y="469" font-size="14" font-weight="700" fill="#291c0e">$0.40–1.50</text>

<text x="326" y="517" text-anchor="end" font-size="14.5" fill="#291c0e">Industrial · rugged, on-metal</text>
<rect x="780" y="502" width="315" height="20" rx="10" fill="#4a5568"/>
<text x="1083" y="517" text-anchor="end" font-size="14" font-weight="700" fill="#ffffff">$0.50–5.00+</text>

<text x="600" y="620" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Log scale, 2026 volume pricing — order quantity decides where inside the band you land.</text>
</svg>
