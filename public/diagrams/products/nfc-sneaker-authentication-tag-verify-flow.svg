<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Tap-to-verify authentication and ownership flow for an NTAG 424 DNA sneaker tag</title>
  <desc id="d">A four-step flow: a buyer taps the shoe at 13.56 MHz; the NTAG 424 DNA chip emits a fresh per-tap CMAC URL using its AES-128 key (Secure Unique NFC message); the brand server verifies the signature; the result is shown as genuine and the owner record is logged. A banner explains each tap is a different signed URL, so a copied URL fails on the next tap and a counterfeit cannot reproduce it without the in-silicon AES-128 key. A closing panel notes ownership travels with the shoe through StockX and GOAT intake and every resale buyer, and that the same SUN payload can carry an EU Digital Product Passport link.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TAP-TO-VERIFY — NTAG 424 DNA SUN + OWNERSHIP</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">The proof is a fresh signature on every tap, and the pair's owner record travels with it</text>

  <!-- step 1 -->
  <rect x="70" y="168" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="168" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="187" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1 · TAP</text>
  <text x="187" y="246" text-anchor="middle" font-size="14" fill="#291c0e">Buyer taps the shoe</text>
  <text x="187" y="270" text-anchor="middle" font-size="14" fill="#291c0e">at 13.56 MHz</text>
  <text x="187" y="306" text-anchor="middle" font-size="12.5" fill="#5c5c5c">No app — the OS opens</text>
  <text x="187" y="324" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the returned URL</text>

  <!-- step 2 -->
  <rect x="345" y="168" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="345" y="168" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="462" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2 · SUN</text>
  <text x="462" y="246" text-anchor="middle" font-size="14" fill="#291c0e">Chip emits a fresh</text>
  <text x="462" y="270" text-anchor="middle" font-size="14" fill="#291c0e">per-tap CMAC URL</text>
  <text x="462" y="306" text-anchor="middle" font-size="12.5" fill="#5c5c5c">AES-128 key, sealed</text>
  <text x="462" y="324" text-anchor="middle" font-size="12.5" fill="#5c5c5c">in the silicon</text>

  <!-- step 3 -->
  <rect x="620" y="168" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="620" y="168" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="737" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3 · VERIFY</text>
  <text x="737" y="246" text-anchor="middle" font-size="14" fill="#291c0e">Brand server checks</text>
  <text x="737" y="270" text-anchor="middle" font-size="14" fill="#291c0e">the CMAC signature</text>
  <text x="737" y="306" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Counter rises every</text>
  <text x="737" y="324" text-anchor="middle" font-size="12.5" fill="#5c5c5c">tap — replay is caught</text>

  <!-- step 4 -->
  <rect x="895" y="168" width="235" height="205" rx="14" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <rect x="895" y="168" width="235" height="42" rx="14" fill="#1f6f3a"/>
  <text x="1012" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4 · RESULT</text>
  <text x="1012" y="248" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6f3a">GENUINE</text>
  <text x="1012" y="282" text-anchor="middle" font-size="13" fill="#2c5454">Owner record logged</text>
  <text x="1012" y="310" text-anchor="middle" font-size="12.5" fill="#8b2d2d">Copied URL returns</text>
  <text x="1012" y="328" text-anchor="middle" font-size="12.5" fill="#8b2d2d">COUNTERFEIT next tap</text>

  <!-- arrows -->
  <polygon points="308,270 336,270 336,264 350,273 336,282 336,276 308,276" fill="#4a5568"/>
  <polygon points="583,270 611,270 611,264 625,273 611,282 611,276 583,276" fill="#4a5568"/>
  <polygon points="858,270 886,270 886,264 900,273 886,282 886,276 858,276" fill="#4a5568"/>

  <!-- banner -->
  <rect x="70" y="410" width="1060" height="64" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="90" y="437" font-size="15" font-weight="700" fill="#2c5454">Why a super-fake still fails</text>
  <text x="90" y="459" font-size="13.5" fill="#3d6b6b">The tongue label can be cloned to visual near-parity; the per-tap CMAC cannot — it needs the AES-128 key held inside chip silicon.</text>

  <!-- ownership footer -->
  <rect x="70" y="492" width="1060" height="140" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="90" y="521" font-size="15" font-weight="700" fill="#6d5a3a">Ownership travels with the shoe</text>
  <text x="90" y="547" font-size="13.5" fill="#291c0e">One chip verifies for the first buyer, StockX / GOAT intake, and every resale buyer after — no re-tagging.</text>
  <text x="90" y="571" font-size="13.5" fill="#291c0e">The brand backend logs each transfer, so provenance and warranty follow the pair, not the receipt.</text>
  <text x="90" y="595" font-size="13.5" fill="#291c0e">The same SUN payload can carry an EU Digital Product Passport link, so one tap serves authentication and DPP.</text>
  <text x="90" y="619" font-size="12.5" fill="#5c5c5c">Every number shown here also appears in the page text — the diagram adds none of its own.</text>
</svg>
