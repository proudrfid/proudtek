  <text x="394.3" y="384.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9b8b66">2027</text>
  <line x1="531.4" y1="354" x2="531.4" y2="366" stroke="#cdbf9f" stroke-width="2"/>
  <text x="531.4" y="384.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9b8b66">2028</text>
  <line x1="668.6" y1="354" x2="668.6" y2="366" stroke="#cdbf9f" stroke-width="2"/>
  <text x="668.6" y="384.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9b8b66">2029</text>
  <line x1="805.7" y1="354" x2="805.7" y2="366" stroke="#cdbf9f" stroke-width="2"/>
  <text x="805.7" y="384.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9b8b66">2030</text>
  <line x1="942.9" y1="354" x2="942.9" y2="366" stroke="#cdbf9f" stroke-width="2"/>
  <text x="942.9" y="384.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9b8b66">2031</text>
  <rect x="34.8" y="150" width="206" height="96" rx="14" fill="#fdf8ef" stroke="#c39a5f" stroke-opacity="0.4" stroke-width="1.8"/>
  <rect x="34.8" y="150" width="6" height="96" rx="3" fill="#c39a5f"/>
  <text x="56.8" y="175.0" font-size="14.5" font-weight="800" fill="#c39a5f">18 Feb 2025</text>
  <rect x="166.8" y="161" width="62" height="20" rx="10" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.2"/>
  <text x="197.8" y="175.0" text-anchor="middle" font-size="10.5" font-weight="800" fill="#c39a5f">LIVE</text>
  <text x="56.8" y="199.0" font-size="18.5" font-weight="800" fill="#291c0e">Carbon footprint</text>
  <text x="56.8" y="221.0" font-size="13" font-weight="400" fill="#4f4f4f">EV: GWP per kWh,</text>
  <text x="56.8" y="240.0" font-size="13" font-weight="400" fill="#4f4f4f">JRC CFB-EV, verified.</text>
  <line x1="137.8" y1="246" x2="137.8" y2="360" stroke="#c39a5f" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="137.8" cy="360" r="7" fill="#c39a5f"/><circle cx="137.8" cy="360" r="2.5" fill="#fff"/>
  <rect x="309.1" y="138" width="206" height="96" rx="14" fill="#f0f6f2" stroke="#2d6a4f" stroke-opacity="0.55" stroke-width="2.6"/>
  <rect x="309.1" y="138" width="6" height="96" rx="3" fill="#2d6a4f"/>
  <text x="331.1" y="163.0" font-size="14.5" font-weight="800" fill="#2d6a4f">18 Feb 2027</text>
  <rect x="441.1" y="149" width="62" height="20" rx="10" fill="#dcebe1" stroke="#2d6a4f" stroke-width="1.2"/>
  <text x="472.1" y="163.0" text-anchor="middle" font-size="10.5" font-weight="800" fill="#2d6a4f">HEADLINE</text>
  <text x="331.1" y="187.0" font-size="18.5" font-weight="800" fill="#291c0e">Battery Passport</text>
  <text x="331.1" y="209.0" font-size="13" font-weight="400" fill="#4f4f4f">QR-readable ID, type</text>
  <text x="331.1" y="228.0" font-size="13" font-weight="400" fill="#4f4f4f">/ model, key specs.</text>
  <line x1="412.1" y1="234" x2="412.1" y2="360" stroke="#2d6a4f" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="412.1" cy="360" r="7" fill="#2d6a4f"/><circle cx="412.1" cy="360" r="2.5" fill="#fff"/>
  <rect x="926.3" y="150" width="206" height="96" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-opacity="0.4" stroke-width="1.8"/>
  <rect x="926.3" y="150" width="6" height="96" rx="3" fill="#3d6b6b"/>
  <text x="948.3" y="175.0" font-size="14.5" font-weight="800" fill="#3d6b6b">18 Aug 2031</text>
  <text x="948.3" y="199.0" font-size="18.5" font-weight="800" fill="#291c0e">Recycled content</text>
  <text x="948.3" y="221.0" font-size="13" font-weight="400" fill="#4f4f4f">16% Co · 6% Li ·</text>
  <text x="948.3" y="240.0" font-size="13" font-weight="400" fill="#4f4f4f">6% Ni · 85% Pb.</text>
  <line x1="1029.3" y1="246" x2="1029.3" y2="360" stroke="#3d6b6b" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="1029.3" cy="360" r="7" fill="#3d6b6b"/><circle cx="1029.3" cy="360" r="2.5" fill="#fff"/>
  <rect x="402.0" y="430" width="206" height="96" rx="14" fill="#f1f3f6" stroke="#4a5568" stroke-opacity="0.4" stroke-width="1.8"/>
  <rect x="402.0" y="430" width="6" height="96" rx="3" fill="#4a5568"/>
  <text x="424.0" y="455.0" font-size="14.5" font-weight="800" fill="#4a5568">18 Aug 2027</text>
  <text x="424.0" y="479.0" font-size="18.5" font-weight="800" fill="#291c0e">Due diligence</text>
  <text x="424.0" y="501.0" font-size="13" font-weight="400" fill="#4f4f4f">Co / Li / Ni / graphite</text>
  <text x="424.0" y="520.0" font-size="13" font-weight="400" fill="#4f4f4f">tracing. Postponed from 2025.</text>
  <line x1="480.7" y1="360" x2="480.7" y2="430" stroke="#4a5568" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="480.7" cy="360" r="7" fill="#4a5568"/><circle cx="480.7" cy="360" r="2.5" fill="#fff"/>
  <circle cx="332.6" cy="360" r="5" fill="#6d5a3a"/>
  <path d="M332.6 360 L318 388" stroke="#6d5a3a" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="300.0" y="404.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">DPP registry live</text>
  <text x="300.0" y="421.0" text-anchor="middle" font-size="12" font-weight="400" fill="#4f4f4f">19 Jul 2026</text>
  <text x="600.0" y="610.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#6d5a3a">One headline date, several quieter ones — a 10-year tag has to clear them all.</text>
</svg>
