<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">CE compliance roles for RFID: reader, passive tag, and operator</title>
  <desc id="d">Three columns describe who certifies what under EU rules. First, the RFID reader or interrogator is radio equipment under the Radio Equipment Directive 2014/53/EU and carries the conformity assessment, the manufacturer's Declaration of Conformity and the CE mark. Second, a passive tag, card or inlay has no battery and no transmitter, so it sits outside the radio scope of RED, but ships with RoHS declarations, REACH SVHC declarations and a product-safety file. Third, the operator's deployment carries its own duties: running the reader within its approved envelope, GDPR for personal data, and the Digital Product Passport where mandated. A bottom band lists the documents that travel with every Proud Tek shipment: Declaration of Conformity for in-scope products, RoHS and REACH declarations, Certificate of Origin, test report and HS-coded invoice. A red note warns that missing documentation risks a market-surveillance hold.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CE COMPLIANCE FOR RFID — WHO CERTIFIES WHAT</text>
  <text x="600" y="102" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">The reader carries the radio cert; the tag carries its papers</text>

  <!-- card 1: reader -->
  <rect x="90" y="150" width="320" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="90" y="150" width="320" height="52" rx="14" fill="#2d6a4f"/>
  <rect x="90" y="182" width="320" height="20" fill="#2d6a4f"/>
  <text x="250" y="183" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#ffffff">RFID READER / INTERROGATOR</text>
  <text x="114" y="238" font-size="13.5" fill="#291c0e">Radio equipment under</text>
  <text x="114" y="262" font-size="13.5" font-weight="700" fill="#1b4332">RED 2014/53/EU</text>
  <text x="114" y="300" font-size="13.5" fill="#4f4f4f">• Conformity assessment</text>
  <text x="114" y="326" font-size="13.5" fill="#4f4f4f">• Declaration of Conformity</text>
  <text x="114" y="352" font-size="13.5" fill="#4f4f4f">• CE mark on the device</text>
  <text x="114" y="404" font-size="12.5" font-style="italic" fill="#5c5c5c">The regulated radio device</text>

  <!-- card 2: passive tag -->
  <rect x="440" y="150" width="320" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="440" y="150" width="320" height="52" rx="14" fill="#3d6b6b"/>
  <rect x="440" y="182" width="320" height="20" fill="#3d6b6b"/>
  <text x="600" y="183" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#ffffff">PASSIVE TAG / CARD / INLAY</text>
  <text x="464" y="238" font-size="13.5" fill="#291c0e">No battery, no transmitter —</text>
  <text x="464" y="262" font-size="13.5" font-weight="700" fill="#2c5454">outside RED's radio scope</text>
  <text x="464" y="300" font-size="13.5" fill="#4f4f4f">• RoHS declarations</text>
  <text x="464" y="326" font-size="13.5" fill="#4f4f4f">• REACH SVHC declarations</text>
  <text x="464" y="352" font-size="13.5" fill="#4f4f4f">• Product-safety file</text>
  <text x="464" y="404" font-size="12.5" font-style="italic" fill="#5c5c5c">Radio conformity rides on the reader</text>

  <!-- card 3: deployment -->
  <rect x="790" y="150" width="320" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="790" y="150" width="320" height="52" rx="14" fill="#4a5568"/>
  <rect x="790" y="182" width="320" height="20" fill="#4a5568"/>
  <text x="950" y="183" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#ffffff">YOUR DEPLOYMENT</text>
  <text x="814" y="238" font-size="13.5" fill="#291c0e">Operator duties on site</text>
  <text x="814" y="300" font-size="13.5" fill="#4f4f4f">• Reader run within its</text>
  <text x="826" y="322" font-size="13.5" fill="#4f4f4f">approved envelope</text>
  <text x="814" y="352" font-size="13.5" fill="#4f4f4f">• GDPR for personal data</text>
  <text x="814" y="378" font-size="13.5" fill="#4f4f4f">• DPP where mandated (2027+)</text>
  <text x="814" y="416" font-size="12.5" font-style="italic" fill="#5c5c5c">Documented by you, aided by us</text>

  <!-- docs band -->
  <rect x="90" y="474" width="1020" height="92" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="600" y="508" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TRAVELS WITH EVERY PROUD TEK SHIPMENT</text>
  <text x="600" y="540" text-anchor="middle" font-size="15" fill="#291c0e">CE DoC (in-scope products) · RoHS / REACH declarations · Certificate of Origin · test report · HS-coded invoice</text>

  <text x="600" y="606" text-anchor="middle" font-size="12.5" fill="#8b2d2d">Missing documentation = market-surveillance hold risk at the border — ask any supplier for the DoC before you order.</text>
</svg>
