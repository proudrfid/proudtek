<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="wsTitle wsDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="wsTitle">What Proud Tek supplies, and what it verifies against</title>
  <desc id="wsDesc">Two rows. The top row, Proud Tek supplies: guest key cards in PVC, wood, bamboo or metal; guest wristbands for pool, spa and all-inclusive; and linen and laundry tags sewn or heat-sealed in. The bottom row, what Proud Tek does not sell but verifies against: door locks (Saflok, Onity, VingCard, Salto), PMS software (Oracle OPERA, Mews, Cloudbeds) and the reader infrastructure already in the doors. The credential and the tag are supplied; everything else is checked, not sold.</desc>

  <defs>
    <radialGradient id="wsGlow" cx="50%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#wsGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="66" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2.5" fill="#6d5a3a">WHAT WE MAKE — AND WHAT WE VERIFY AGAINST</text>

  <!-- ============ We supply ============ -->
  <text x="72" y="118" font-size="14" font-weight="700" letter-spacing="1.5" fill="#6c5127">PROUD TEK SUPPLIES</text>
  <line x1="290" y1="113" x2="1128" y2="113" stroke="#e5e9ed" stroke-width="2"/>

  <!-- Card 1: key cards -->
  <g>
    <rect x="72" y="132" width="332" height="184" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="238" cy="188" r="30" fill="#6c5127"/>
    <rect x="220" y="175" width="36" height="26" rx="4" fill="#ffffff"/>
    <rect x="226" y="182" width="11" height="9" rx="1.5" fill="#c39a5f"/>
    <path d="M247 179 a11 11 0 0 1 0 17" fill="none" stroke="#1fcefb" stroke-width="2.4" stroke-linecap="round"/>
    <text x="238" y="252" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Guest key cards</text>
    <text x="238" y="278" text-anchor="middle" font-size="13.5" fill="#6d5a3a">PVC · wood · bamboo · metal</text>
    <text x="238" y="298" text-anchor="middle" font-size="13.5" fill="#6d5a3a">ISO/IEC 7810 ID-1 (CR80)</text>
  </g>
  <!-- Card 2: wristbands -->
  <g>
    <rect x="434" y="132" width="332" height="184" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="600" cy="188" r="30" fill="#6c5127"/>
    <ellipse cx="600" cy="188" rx="15" ry="20" fill="none" stroke="#ffffff" stroke-width="5"/>
    <rect x="593" y="198" width="14" height="11" rx="2" fill="#c39a5f"/>
    <path d="M617 179 a13 13 0 0 1 0 18" fill="none" stroke="#1fcefb" stroke-width="2.4" stroke-linecap="round"/>
    <text x="600" y="252" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Guest wristbands</text>
    <text x="600" y="278" text-anchor="middle" font-size="13.5" fill="#6d5a3a">pool · spa · all-inclusive</text>
    <text x="600" y="298" text-anchor="middle" font-size="13.5" fill="#6d5a3a">IP67, cashless-ready</text>
  </g>
  <!-- Card 3: linen tags -->
  <g>
    <rect x="796" y="132" width="332" height="184" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="962" cy="188" r="30" fill="#6c5127"/>
    <rect x="946" y="177" width="32" height="6" rx="2" fill="#ffffff"/>
    <rect x="946" y="187" width="32" height="6" rx="2" fill="#ffffff"/>
    <rect x="946" y="197" width="32" height="6" rx="2" fill="#ffffff"/>
    <path d="M984 179 a13 13 0 0 1 0 18" fill="none" stroke="#1fcefb" stroke-width="2.4" stroke-linecap="round"/>
    <text x="962" y="252" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Linen &amp; laundry tags</text>
    <text x="962" y="278" text-anchor="middle" font-size="13.5" fill="#6d5a3a">sewn or heat-sealed in</text>
    <text x="962" y="298" text-anchor="middle" font-size="13.5" fill="#6d5a3a">PPS · silicone · woven</text>
  </g>

  <!-- ============ We don't sell ============ -->
  <text x="72" y="366" font-size="14" font-weight="700" letter-spacing="1.5" fill="#4a5568">WE DON'T SELL THESE — WE VERIFY AGAINST YOURS</text>
  <line x1="560" y1="361" x2="1128" y2="361" stroke="#e5e9ed" stroke-width="2"/>
  <rect x="72" y="380" width="1056" height="164" rx="16" fill="#eef1f4" stroke="#cdd7de" stroke-width="2"/>

  <!-- item 1: locks -->
  <g>
    <circle cx="238" cy="430" r="26" fill="#4a5568"/>
    <rect x="228" y="424" width="20" height="16" rx="3" fill="#ffffff"/>
    <path d="M231 424 v-5 a7 7 0 0 1 14 0 v5" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="238" y="490" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Door locks</text>
    <text x="238" y="513" text-anchor="middle" font-size="13" fill="#55687a">Saflok · Onity · VingCard · Salto</text>
  </g>
  <line x1="404" y1="404" x2="404" y2="520" stroke="#cdd7de" stroke-width="2"/>
  <!-- item 2: PMS -->
  <g>
    <circle cx="600" cy="430" r="26" fill="#4a5568"/>
    <rect x="588" y="420" width="24" height="18" rx="2" fill="#ffffff"/>
    <rect x="592" y="425" width="16" height="3" rx="1" fill="#4a5568"/>
    <rect x="592" y="431" width="16" height="3" rx="1" fill="#4a5568"/>
    <text x="600" y="490" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">PMS software</text>
    <text x="600" y="513" text-anchor="middle" font-size="13" fill="#55687a">Oracle OPERA · Mews · Cloudbeds</text>
  </g>
  <line x1="766" y1="404" x2="766" y2="520" stroke="#cdd7de" stroke-width="2"/>
  <!-- item 3: readers -->
  <g>
    <circle cx="962" cy="430" r="26" fill="#4a5568"/>
    <rect x="954" y="420" width="16" height="20" rx="3" fill="#ffffff"/>
    <path d="M978 422 a13 13 0 0 1 0 16" fill="none" stroke="#1fcefb" stroke-width="2.6" stroke-linecap="round"/>
    <text x="962" y="490" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Reader infrastructure</text>
    <text x="962" y="513" text-anchor="middle" font-size="13" fill="#55687a">the readers already in your doors</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-size="15" fill="#6d5a3a">We supply the credential and the tag — checked against the lock, reader or laundry system you already run.</text>
</svg>
