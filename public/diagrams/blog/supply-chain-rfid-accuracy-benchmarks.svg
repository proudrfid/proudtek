<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Published supply-chain RFID accuracy benchmarks</title>
<desc id="d">A benchmark panel. The top comparison shows order-inaccuracy from audits: legacy UPC audits flagged 69 percent of orders inaccurate, while EPC RFID audits flagged less than 0.01 percent, per the Auburn University RFID Lab Project Zipper study of eight brands and five retailers over ten months, reported by Supply Chain Dive in 2018. Three stat chips beneath give a 99.99 percent dock-door portal scan rate, 99.7 to 99.95 percent real-time inventory accuracy, and 15 to 30 percent less trailer dwell time.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PUBLISHED ACCURACY BENCHMARKS</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="33" font-weight="700" fill="#291c0e">The numbers you can put in an audit trail</text>
<text x="600" y="132" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Citable figures behind the receiving, dock-door and yard claims in this guide.</text>

<!-- comparison block -->
<text x="80" y="184" font-size="14" font-weight="800" letter-spacing="0.4" fill="#4a5568">ORDER INACCURACY, AUDITED</text>
<!-- legacy row -->
<text x="80" y="230" font-size="14.5" font-weight="700" fill="#291c0e">Legacy UPC audits</text>
<rect x="340" y="212" width="700" height="30" rx="6" fill="#f0ece3"/>
<rect x="340" y="212" width="483" height="30" rx="6" fill="#8b2d2d"/>
<text x="835" y="234" font-size="16" font-weight="800" fill="#8b2d2d">69% of orders inaccurate</text>
<!-- rfid row -->
<text x="80" y="286" font-size="14.5" font-weight="700" fill="#291c0e">EPC / RFID audits</text>
<rect x="340" y="268" width="700" height="30" rx="6" fill="#f0ece3"/>
<rect x="340" y="268" width="6" height="30" rx="3" fill="#1f6f3a"/>
<text x="356" y="290" font-size="16" font-weight="800" fill="#1f6f3a">&lt; 0.01% inaccurate</text>
<text x="80" y="330" font-size="12.5" fill="#5c5c5c">Auburn University RFID Lab · Project Zipper — 8 brands, 5 retailers, 10 months (Supply Chain Dive, 2018)</text>

<line x1="64" y1="360" x2="1136" y2="360" stroke="#e6dfd2" stroke-width="1.6"/>

<!-- stat chips -->
<rect x="64" y="384" width="336" height="150" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="232" y="422" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DOCK-DOOR PORTAL</text>
<text x="232" y="474" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6f3a">99.99%</text>
<text x="232" y="504" text-anchor="middle" font-size="13.5" fill="#291c0e">scan-rate accuracy</text>

<rect x="432" y="384" width="336" height="150" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="600" y="422" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">REAL-TIME INVENTORY</text>
<text x="600" y="474" text-anchor="middle" font-size="34" font-weight="800" fill="#1f6f3a">99.7–99.95%</text>
<text x="600" y="504" text-anchor="middle" font-size="13.5" fill="#291c0e">reported accuracy</text>

<rect x="800" y="384" width="336" height="150" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="968" y="422" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TRAILER DWELL</text>
<text x="968" y="474" text-anchor="middle" font-size="40" font-weight="800" fill="#2c5454">15–30%</text>
<text x="968" y="504" text-anchor="middle" font-size="13.5" fill="#291c0e">reduction with RFID + YMS</text>

<text x="600" y="590" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Bring these to the accuracy argument — they're published references, not a vendor brochure.</text>
</svg>
