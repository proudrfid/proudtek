<rect x="450" y="196" width="300" height="280" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="450" y="196" width="300" height="8" rx="4" fill="#3d6b6b"/>
<text x="600" y="240" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">2 · TAP</text>
<rect x="512" y="292" width="96" height="46" rx="23" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="548" y="304" width="26" height="22" rx="3" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<path d="M 628 296 A 24 24 0 0 1 628 340" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 642 288 A 36 36 0 0 1 642 348" fill="none" stroke="#a9cccc" stroke-width="2.5"/>
<rect x="654" y="298" width="40" height="40" rx="6" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
