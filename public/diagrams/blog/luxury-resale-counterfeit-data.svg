<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Counterfeit base rates the resale platforms publish</title>
<desc id="d">Three data panels. Entrupy scan: a donut chart shows 8.4 percent of luxury goods came back fake or inconclusive across roughly 2 billion dollars of scanned resale value, 20-plus brands. Vestiaire rejects: bars rise from one-third of intake rejections in 2021 to more than half by 2024 — suspected fakes as a share of everything rejected. Market backdrop: authentication services grow about 10 percent a year through 2031, and about 41 percent of the market is held by Europe.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE BASE RATES, PUBLISHED</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">What the platforms admit they're catching</text>

<!-- panel 1: entrupy -->
<rect x="46" y="130" width="340" height="470" rx="16" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="216" y="170" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="2" fill="#6d5a3a">ENTRUPY SCAN</text>
<circle cx="216" cy="320" r="80" fill="none" stroke="#efe6d2" stroke-width="26"/>
<path d="M 216 240 A 80 80 0 0 1 256.3 250.9" fill="none" stroke="#8b2d2d" stroke-width="26"/>
<text x="216" y="332" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#291c0e">8.4%</text>
<text x="216" y="448" text-anchor="middle" font-size="14" fill="#4f4f4f">fake or inconclusive,</text>
<text x="216" y="472" text-anchor="middle" font-size="14" fill="#4f4f4f">across ~$2B of resale value</text>
<text x="216" y="500" text-anchor="middle" font-size="13" fill="#5c5c5c">20+ brands scanned</text>

<!-- panel 2: vestiaire -->
<rect x="430" y="130" width="340" height="470" rx="16" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="170" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="2" fill="#6d5a3a">VESTIAIRE REJECTS</text>
<line x1="460" y1="500" x2="740" y2="500" stroke="#d9cfbc" stroke-width="2"/>
<rect x="485" y="414" width="80" height="86" fill="#efe6d2" stroke="#c39a5f" stroke-width="1.5"/>
<rect x="635" y="367" width="80" height="133" fill="#8b2d2d"/>
<text x="518" y="390" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="18" font-weight="700" fill="#4f4f4f">one-third</text>
<text x="675" y="347" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="18" font-weight="700" fill="#8b2d2d">more than half</text>
<path d="M 556 406 Q 612 374 650 362" fill="none" stroke="#8b2d2d" stroke-width="2.4" stroke-dasharray="5 6"/>
<path d="M 660 359 l -14 -2 5 11 Z" fill="#8b2d2d"/>
<text x="525" y="528" text-anchor="middle" font-size="13.5" fill="#5c5c5c">2021</text>
<text x="675" y="528" text-anchor="middle" font-size="13.5" font-weight="600" fill="#291c0e">2024</text>
<text x="600" y="560" text-anchor="middle" font-size="13.5" fill="#5c5c5c">suspected fakes, as a share</text>
<text x="600" y="582" text-anchor="middle" font-size="13.5" fill="#5c5c5c">of everything rejected at intake</text>

<!-- panel 3: market -->
<rect x="814" y="130" width="340" height="470" rx="16" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="984" y="170" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="2" fill="#6d5a3a">MARKET BACKDROP</text>
<text x="984" y="272" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="46" font-weight="700" fill="#291c0e">~10%</text>
<text x="984" y="302" text-anchor="middle" font-size="13.5" fill="#4f4f4f">authentication-services growth,</text>
<text x="984" y="324" text-anchor="middle" font-size="13.5" fill="#4f4f4f">per year through 2031</text>
<line x1="884" y1="366" x2="1084" y2="366" stroke="#efe9dc" stroke-width="1.5"/>
<text x="984" y="452" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="46" font-weight="700" fill="#c39a5f">~41%</text>
<text x="984" y="482" text-anchor="middle" font-size="13.5" fill="#4f4f4f">of the authentication market</text>
<text x="984" y="504" text-anchor="middle" font-size="13.5" fill="#4f4f4f">is held by Europe</text>
</svg>
