<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Through-glass read geometry — gate lane distances by speed</title>
  <desc id="d">Lane diagram: a windshield-mounted long-dipole sticker read through glass by an overhead gate reader at 5-8 m for 0-30 km/h parking and yard gates, extending to 8-12 m at 30-100 km/h for toll and highway lanes. Copper- or aluminium-etched dipole optimised for through-glass transmission.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Read the truck before it reaches the barrier</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">UHF 860-960 MHz through the windshield — distance scales with lane speed</text>
  <g transform="translate(60,150)" font-family="Helvetica, Arial, sans-serif">
    <rect x="640" y="0" width="26" height="180" fill="#6d5a3a"/>
    <rect x="600" y="0" width="110" height="30" rx="6" fill="#2c5454"/>
    <text x="614" y="20" font-size="12" fill="#f8f6f1">gate reader</text>
    <g stroke="#c39a5f" stroke-width="2" fill="none" opacity="0.9">
      <path d="M 636 40 C 500 90 360 130 240 160"/>
      <path d="M 636 60 C 520 110 420 140 320 168"/>
    </g>
    <rect x="80" y="150" width="240 " height="90" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
    <rect x="104" y="170" width="150" height="8" rx="3" fill="#3d6b6b"/>
    <rect x="170" y="162" width="18" height="24" rx="3" fill="#c39a5f" stroke="#6d5a3a"/>
    <text x="104" y="216" font-size="12" fill="#2c5454">long-dipole sticker, inside glass</text>
    <text x="80" y="270" font-size="13" fill="#6d5a3a">copper- or aluminium-etched dipole, tuned for through-glass RF</text>
  </g>
  <g transform="translate(60,470)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="500" height="90" rx="12" fill="#eef2f0" stroke="#2c5454" stroke-width="2"/>
    <text x="24" y="34" font-family="Georgia, serif" font-size="16" fill="#2c5454">Parking + yard gate</text>
    <text x="24" y="64" font-size="14" fill="#2c5454">5-8 m read at 0-30 km/h</text>
    <rect x="550" y="0" width="500" height="90" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="574" y="34" font-family="Georgia, serif" font-size="16" fill="#291c0e">Toll + highway lane</text>
    <text x="574" y="64" font-size="14" fill="#2c5454">8-12 m read at 30-100 km/h</text>
  </g>
</svg>
