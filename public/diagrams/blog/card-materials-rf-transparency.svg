<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How 13.56 MHz radio sees each card material</title>
<desc id="d">Three lanes leave an HF reader. Lane one: the signal passes cleanly through a stacked sample of PVC, PET, PETG, PC and ABS — practically invisible. Lane two: wood veneer adds a whisper of attenuation, barely noticed. Lane three: genuinely soaked paper detunes the antenna 10 to 30 percent until it dries out, shown as a fading dashed line. Caption: at 13.56 MHz the card body barely matters — moisture is the only real saboteur, and only while it lasts.</desc>
