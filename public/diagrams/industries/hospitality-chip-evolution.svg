<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ceTitle ceDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ceTitle">The hotel key-card chip security ladder</title>
  <desc id="ceDesc">Three ascending steps. Step one, MIFARE Classic 1K on CRYPTO-1, broken since 2008, the legacy installed base for Saflok RT and MT and Onity HT. Step two, MIFARE Plus SE on AES-128, a drop-in replacement that keeps the same readers and form factor during migration. Step three, the tallest, MIFARE DESFire EV3 on AES-128 with 3DES and DES, 2, 4 or 8 kilobytes of memory and up to 28 application slots — the new-build, premium and chain-scale default. Stage the firmware to read both, issue DESFire to new guests, and sunset Classic over 30 to 60 days.</desc>

  <defs>
    <radialGradient id="ceGlow" cx="50%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="ceWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#291c0e"/>
      <stop offset="100%" stop-color="#6c5127"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#ceGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="64" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2.5" fill="#6d5a3a">THE HOTEL KEY-CARD SECURITY LADDER</text>
  <text x="600" y="90" text-anchor="middle" font-size="13.5" fill="#a0895f">Classic 1K → Plus SE → DESFire EV3 — the upgrade every new build converges on</text>

  <!-- ascending arrows -->
  <path d="M394 300 l30 -14 -6 12 8 4 -8 14 -8 -4 -6 12 z" fill="#c39a5f"/>
  <path d="M757 230 l30 -14 -6 12 8 4 -8 14 -8 -4 -6 12 z" fill="#c39a5f"/>

  <!-- Step 1: Classic 1K (lowest) -->
  <g>
    <rect x="72" y="322" width="330" height="178" rx="16" fill="#f4f2ee" stroke="#cdd7de" stroke-width="2"/>
    <text x="96" y="352" font-size="12" font-weight="700" letter-spacing="1.2" fill="#8a949c">01 · LEGACY</text>
    <text x="96" y="384" font-size="19" font-weight="800" fill="#291c0e">MIFARE Classic 1K</text>
    <text x="96" y="410" font-size="14.5" font-weight="700" fill="#8b2d2d">CRYPTO-1 — broken since 2008</text>
    <g>
      <rect x="96" y="424" width="30" height="9" rx="4" fill="#8b2d2d"/>
      <rect x="132" y="424" width="30" height="9" rx="4" fill="#e5e9ed"/>
      <rect x="168" y="424" width="30" height="9" rx="4" fill="#e5e9ed"/>
    </g>
    <text x="96" y="470" font-size="12.5" fill="#55687a">Installed base: Saflok RT / MT · Onity HT.</text>
    <text x="96" y="488" font-size="12.5" fill="#55687a">Serviceable, but retire it — don't spec it new.</text>
  </g>

  <!-- Step 2: Plus SE (mid) -->
  <g>
    <rect x="435" y="252" width="330" height="248" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="459" y="282" font-size="12" font-weight="700" letter-spacing="1.2" fill="#a0895f">02 · MIGRATION BRIDGE</text>
    <text x="459" y="314" font-size="19" font-weight="800" fill="#291c0e">MIFARE Plus SE</text>
    <text x="459" y="340" font-size="14.5" font-weight="700" fill="#1f6f3a">AES-128</text>
    <g>
      <rect x="459" y="354" width="30" height="9" rx="4" fill="#c39a5f"/>
      <rect x="495" y="354" width="30" height="9" rx="4" fill="#c39a5f"/>
      <rect x="531" y="354" width="30" height="9" rx="4" fill="#e5e9ed"/>
    </g>
    <text x="459" y="398" font-size="12.5" fill="#6d5a3a">Drop-in replacement for Classic —</text>
    <text x="459" y="416" font-size="12.5" fill="#6d5a3a">same readers, same CR80 form factor.</text>
    <text x="459" y="462" font-size="12.5" fill="#6d5a3a">Buys an AES upgrade without</text>
    <text x="459" y="480" font-size="12.5" fill="#6d5a3a">re-cutting the reader fleet.</text>
  </g>

  <!-- Step 3: DESFire EV3 (highest, the winner) -->
  <g>
    <rect x="798" y="170" width="330" height="330" rx="16" fill="url(#ceWin)"/>
    <text x="822" y="202" font-size="12" font-weight="700" letter-spacing="1.2" fill="#d4a755">03 · NEW-BUILD DEFAULT</text>
    <text x="822" y="236" font-size="20" font-weight="800" fill="#ffffff">MIFARE DESFire EV3</text>
    <text x="822" y="263" font-size="14.5" font-weight="700" fill="#1fcefb">AES-128 + 3DES + DES</text>
    <g>
      <rect x="822" y="277" width="30" height="9" rx="4" fill="#1fcefb"/>
      <rect x="858" y="277" width="30" height="9" rx="4" fill="#1fcefb"/>
      <rect x="894" y="277" width="30" height="9" rx="4" fill="#1fcefb"/>
    </g>
    <text x="822" y="322" font-size="13" fill="#efe6d2">• 2 / 4 / 8 KB user memory</text>
    <text x="822" y="346" font-size="13" fill="#efe6d2">• up to 28 application slots</text>
    <text x="822" y="370" font-size="13" fill="#efe6d2">• AES mutual authentication</text>
    <text x="822" y="452" font-size="12.5" fill="#cbb489">Specified by ASSA ABLOY Visionline,</text>
    <text x="822" y="470" font-size="12.5" fill="#cbb489">Salto XS4 and Saflok Confidant RFID.</text>
  </g>

  <text x="600" y="560" text-anchor="middle" font-size="15" fill="#6d5a3a">Stage the firmware to read both, issue DESFire to new guests, sunset Classic over 30–60 days — no lockout.</text>
</svg>
