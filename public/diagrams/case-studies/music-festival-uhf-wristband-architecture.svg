<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Festival wristband architecture — one band carrying a UHF gate chip and an NFC cashless chip</title>
  <desc id="d">The deployment architecture. A single-use Tyvek festival wristband carries two radios: a UCODE 9 UHF chip for the gate and an NTAG213 NFC chip for cashless payment. On the access lane, an Impinj R700 driving four Times-7 A6034 antennas in a 1.8 m portal reads the UHF chip at 50 to 80 cm with the wrist at any angle, clearing 14 attendees per lane per minute versus 9 on the old barcode lane. On the cashless lane, the NTAG213 chip is tapped at the point of sale, the terminal looks up the balance over Wi-Fi in the back-office, deducts the spend and shows the new balance, at under 30 transactions per hour per terminal.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa4b2"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE BAND, TWO RADIOS — GATE AND CASHLESS</text>
  <text x="600" y="80" text-anchor="middle" font-size="15" fill="#5c5c5c">The UHF chip opens the gate; the NFC chip settles the tab</text>

  <!-- wristband object -->
  <rect x="66" y="278" width="252" height="150" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="86" y="308" font-size="13" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">SINGLE-USE BAND</text>
  <text x="86" y="330" font-size="12.5" fill="#291c0e">Tyvek hybrid · 25 mm</text>
  <rect x="86" y="344" width="212" height="30" rx="6" fill="#3d6b6b"/>
  <text x="98" y="364" font-size="12.5" font-weight="700" fill="#ffffff">UCODE 9 — UHF gate chip</text>
  <rect x="86" y="382" width="212" height="30" rx="6" fill="#4a5568"/>
  <text x="98" y="402" font-size="12.5" font-weight="700" fill="#ffffff">NTAG213 — NFC pay chip</text>

  <!-- connectors from band -->
  <line x1="318" y1="318" x2="356" y2="222" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="318" y1="392" x2="356" y2="540" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ACCESS LANE -->
  <text x="360" y="150" font-size="13" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">ACCESS LANE · UHF</text>
  <rect x="360" y="164" width="250" height="112" rx="10" fill="#ffffff" stroke="#bcd3d3" stroke-width="2"/>
  <text x="374" y="196" font-size="15" font-weight="700" fill="#291c0e">UHF portal read</text>
  <text x="374" y="220" font-size="12.5" fill="#5c5c5c">Impinj R700 reader</text>
  <text x="374" y="240" font-size="12.5" fill="#5c5c5c">4 × Times-7 A6034</text>
  <text x="374" y="260" font-size="12.5" fill="#5c5c5c">1.8 m portal</text>

  <rect x="640" y="164" width="200" height="112" rx="10" fill="#ffffff" stroke="#bcd3d3" stroke-width="2"/>
  <text x="654" y="196" font-size="15" font-weight="700" fill="#291c0e">Walk-through</text>
  <text x="654" y="220" font-size="12.5" fill="#5c5c5c">reads at 50–80 cm</text>
  <text x="654" y="240" font-size="12.5" fill="#5c5c5c">wrist at any angle</text>
  <text x="654" y="260" font-size="12.5" fill="#5c5c5c">no tap needed</text>

  <rect x="870" y="164" width="266" height="112" rx="10" fill="#3d6b6b"/>
  <text x="884" y="196" font-size="15" font-weight="700" fill="#ffffff">Access · age · re-entry</text>
  <text x="884" y="222" font-size="14" font-weight="700" fill="#ffffff">14 / lane / minute</text>
  <text x="884" y="246" font-size="12.5" fill="#cfe3e3">barcode lane: 9 / minute</text>
  <text x="884" y="266" font-size="12.5" fill="#cfe3e3">a moving queue, not a stall</text>

  <line x1="610" y1="220" x2="636" y2="220" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="840" y1="220" x2="866" y2="220" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ah)"/>

  <!-- CASHLESS LANE -->
  <text x="360" y="472" font-size="13" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">CASHLESS LANE · NFC</text>
  <rect x="360" y="486" width="250" height="112" rx="10" fill="#ffffff" stroke="#bcd3d3" stroke-width="2"/>
  <text x="374" y="518" font-size="15" font-weight="700" fill="#291c0e">NFC tap at POS</text>
  <text x="374" y="542" font-size="12.5" fill="#5c5c5c">NTAG213 read</text>
  <text x="374" y="562" font-size="12.5" fill="#5c5c5c">on a small tap patch</text>

  <rect x="640" y="486" width="200" height="112" rx="10" fill="#ffffff" stroke="#bcd3d3" stroke-width="2"/>
  <text x="654" y="518" font-size="15" font-weight="700" fill="#291c0e">Balance lookup</text>
  <text x="654" y="542" font-size="12.5" fill="#5c5c5c">over Wi-Fi to the</text>
  <text x="654" y="562" font-size="12.5" fill="#5c5c5c">back-office system</text>

  <rect x="870" y="486" width="266" height="112" rx="10" fill="#3d6b6b"/>
  <text x="884" y="518" font-size="15" font-weight="700" fill="#ffffff">Deduct · show balance</text>
  <text x="884" y="544" font-size="14" font-weight="700" fill="#ffffff">under 30 / hour / terminal</text>
  <text x="884" y="568" font-size="12.5" fill="#cfe3e3">slower lane, no harm done</text>

  <line x1="610" y1="542" x2="636" y2="542" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="840" y1="542" x2="866" y2="542" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ah)"/>

  <!-- footer -->
  <rect x="66" y="612" width="1070" height="40" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="601" y="637" text-anchor="middle" font-size="13" font-weight="600" fill="#2c5454">One credential, two reads — the EPC is the ID; the cashless balance lives in the back-office, not on the chip.</text>
</svg>
