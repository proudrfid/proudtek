<text x="393.0" y="276" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">RFID vs ASN match</text>
<text x="393.0" y="306" text-anchor="middle" font-size="12" fill="#5c5c5c">catch short-ships &amp; mislabels</text>
<text x="393.0" y="332" text-anchor="middle" font-size="12" fill="#5c5c5c">→ 30–50% of the reduction</text>
