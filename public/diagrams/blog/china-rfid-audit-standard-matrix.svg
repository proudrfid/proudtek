<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="s3t s3d" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
      <title id="s3t">Which retailer requires which factory social-compliance audit</title>
      <desc id="s3d">A mapping. Walmart, Target and Costco require Walmart RSCI, which accepts BSCI, SMETA or SA8000 reports. IKEA, Carrefour and Tesco require amfori BSCI at grade C or better. Marks and Spencer, Sainsbury's and Asda require SMETA four-pillar. Disney under its FAMA programme accepts SMETA, WRAP or ICTI. Hasbro and Mattel licensees require ICTI CARE.</desc>
      <defs><radialGradient id="bg3" cx="50%" cy="16%" r="92%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
      <rect width="1200" height="675" fill="url(#bg3)"/>
      <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
      <text x="600" y="58" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="2" fill="#6d5a3a">THE AUDIT YOU INHERIT WITH THE BUYER</text>
      <text x="270" y="104" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#4a5568">IF YOU SELL INTO…</text>
      <text x="930" y="104" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6c5127">…THE FACTORY MUST CLEAR</text>

      <!-- connector lines -->
      <g stroke="#e4c98f" stroke-width="2.5" fill="none">
        <path d="M470 165 H730"/><path d="M470 262 H730"/><path d="M470 359 H730"/><path d="M470 456 H730"/><path d="M470 553 H730"/>
      </g>
      <g fill="#c39a5f"><circle cx="600" cy="165" r="4"/><circle cx="600" cy="262" r="4"/><circle cx="600" cy="359" r="4"/><circle cx="600" cy="456" r="4"/><circle cx="600" cy="553" r="4"/></g>

      <!-- left buyer chips -->
      <g font-family="Inter">
        <rect x="80" y="132" width="390" height="66" rx="14" fill="#f1f4f6" stroke="#cdd7de" stroke-width="2"/><text x="104" y="165" font-size="18" font-weight="800" fill="#291c0e">Walmart · Target · Costco</text><text x="104" y="187" font-size="12.5" fill="#55687a">US big-box mandate</text>
        <rect x="80" y="229" width="390" height="66" rx="14" fill="#f1f4f6" stroke="#cdd7de" stroke-width="2"/><text x="104" y="262" font-size="18" font-weight="800" fill="#291c0e">IKEA · Carrefour · Tesco</text><text x="104" y="284" font-size="12.5" fill="#55687a">European retail</text>
        <rect x="80" y="326" width="390" height="66" rx="14" fill="#f1f4f6" stroke="#cdd7de" stroke-width="2"/><text x="104" y="359" font-size="18" font-weight="800" fill="#291c0e">M&amp;S · Sainsbury's · Asda</text><text x="104" y="381" font-size="12.5" fill="#55687a">UK grocery &amp; apparel</text>
        <rect x="80" y="423" width="390" height="66" rx="14" fill="#f1f4f6" stroke="#cdd7de" stroke-width="2"/><text x="104" y="456" font-size="18" font-weight="800" fill="#291c0e">Disney (FAMA)</text><text x="104" y="478" font-size="12.5" fill="#55687a">licensed consumer products</text>
        <rect x="80" y="520" width="390" height="66" rx="14" fill="#f1f4f6" stroke="#cdd7de" stroke-width="2"/><text x="104" y="553" font-size="18" font-weight="800" fill="#291c0e">Hasbro · Mattel</text><text x="104" y="575" font-size="12.5" fill="#55687a">toys</text>
      </g>
      <!-- right standard chips -->
      <g font-family="Inter">
        <rect x="730" y="132" width="390" height="66" rx="14" fill="#fbf3e2" stroke="#e4c98f" stroke-width="2"/><text x="754" y="163" font-size="18" font-weight="800" fill="#291c0e">Walmart RSCI</text><text x="754" y="185" font-size="12.5" fill="#6d5a3a">accepts BSCI / SMETA / SA8000; zero-tolerance items</text>
        <rect x="730" y="229" width="390" height="66" rx="14" fill="#fbf3e2" stroke="#e4c98f" stroke-width="2"/><text x="754" y="260" font-size="18" font-weight="800" fill="#291c0e">amfori BSCI — grade ≥ C</text><text x="754" y="282" font-size="12.5" fill="#6d5a3a">below C = hard stop, re-audit within 6 months</text>
        <rect x="730" y="326" width="390" height="66" rx="14" fill="#fbf3e2" stroke="#e4c98f" stroke-width="2"/><text x="754" y="357" font-size="18" font-weight="800" fill="#291c0e">SMETA 4-pillar</text><text x="754" y="379" font-size="12.5" fill="#6d5a3a">valid 2 yrs · $1,500–$3,500 / factory / audit</text>
        <rect x="730" y="423" width="390" height="66" rx="14" fill="#fbf3e2" stroke="#e4c98f" stroke-width="2"/><text x="754" y="454" font-size="18" font-weight="800" fill="#291c0e">SMETA / WRAP / ICTI</text><text x="754" y="476" font-size="12.5" fill="#6d5a3a">FAMA accepts any as equivalent</text>
        <rect x="730" y="520" width="390" height="66" rx="14" fill="#fbf3e2" stroke="#e4c98f" stroke-width="2"/><text x="754" y="551" font-size="18" font-weight="800" fill="#291c0e">ICTI CARE</text><text x="754" y="573" font-size="12.5" fill="#6d5a3a">required by toy licensees</text>
      </g>
      <text x="600" y="632" text-anchor="middle" font-size="15" fill="#6d5a3a">Verify grades yourself at amfori.org/services/audit-search before you sign the first PO — the certificate on the wall is a claim, not proof.</text>
    </svg>
