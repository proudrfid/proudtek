<text x="73.0" y="582" text-anchor="start" font-size="13.5" font-weight="700" fill="#6d5a3a">minor finding</text>
<text x="1127.0" y="582" text-anchor="end" font-size="13.5" font-weight="700" fill="#8b2d2d">existential risk</text>
<text x="600.0" y="645" text-anchor="middle" font-size="18" font-weight="700" fill="#6d5a3a">Each rung costs more than the compliance project it replaces.</text>
