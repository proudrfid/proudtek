<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">When a warehouse barcode label peels, the data is lost; on RFID it is not</title>
<desc id="d">A two-panel contrast. Left, a barcode label prints the identifier on the outer surface of a carton, so once the label peels, scratches, or fades it becomes unreadable. Right, an RFID label keeps the identifier on an encapsulated chip read by radio, so even a dirty, scuffed, or hidden tag still reads. The fix is to move the data off a printed surface the warehouse destroys and onto a chip it cannot.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="58" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INDUSTRIAL RFID · WAREHOUSE LABELING</text>
<text x="600" y="104" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#291c0e">When the label peels, the data doesn't</text>
<text x="600" y="140" text-anchor="middle" font-size="16" fill="#4f4f4f">Move the identifier off a printed surface the warehouse destroys — onto a chip it can't.</text>

<!-- Panel A: barcode (risk) -->
<rect x="88" y="196" width="448" height="284" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="88" y="196" width="9" height="284" rx="4" fill="#8b2d2d"/>
<text x="120" y="232" font-size="16" font-weight="800" fill="#291c0e">BARCODE LABEL</text>
<text x="120" y="256" font-size="13" fill="#5c5c5c">data printed on the surface</text>
<rect x="238" y="286" width="176" height="132" rx="6" fill="#f6efe2" stroke="#cbb8a0" stroke-width="1.6"/>
<rect x="262" y="306" width="128" height="72" rx="4" fill="#ffffff" stroke="#b9a68e" stroke-width="1.5"/>
<polygon points="366,306 390,306 390,332" fill="#e7ddcb" stroke="#b9a68e" stroke-width="1"/>
<rect x="272" y="322" width="4" height="40" fill="#291c0e"/>
<rect x="279" y="322" width="3" height="40" fill="#3a3a3a"/>
<rect x="285" y="322" width="5" height="40" fill="#555555"/>
<rect x="293" y="322" width="2" height="40" fill="#6f6f6f"/>
<rect x="298" y="322" width="4" height="40" fill="#8a8a8a"/>
<rect x="306" y="322" width="3" height="40" fill="#a3a3a3"/>
<rect x="312" y="322" width="5" height="40" fill="#b9b9b9"/>
<rect x="321" y="322" width="3" height="40" fill="#cccccc"/>
<rect x="327" y="322" width="4" height="40" fill="#dadada"/>
<text x="120" y="440" font-size="13.5" fill="#5c5c5c">peels · scratches · fades</text>
<text x="120" y="462" font-size="14.5" font-weight="800" fill="#8b2d2d">→ unreadable</text>

<!-- center fix arrow -->
<text x="600" y="322" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE RFID FIX</text>
<line x1="556" y1="342" x2="640" y2="342" stroke="#291c0e" stroke-width="3"/>
<polygon points="640,335 656,342 640,349" fill="#291c0e"/>

<!-- Panel B: RFID (solution) -->
<rect x="664" y="196" width="448" height="284" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="664" y="196" width="9" height="284" rx="4" fill="#3d6b6b"/>
<text x="696" y="232" font-size="16" font-weight="800" fill="#291c0e">RFID LABEL</text>
<text x="696" y="256" font-size="13" fill="#5c5c5c">data on an encapsulated chip</text>
<rect x="744" y="300" width="196" height="104" rx="8" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<rect x="766" y="330" width="52" height="44" rx="5" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<rect x="780" y="342" width="24" height="20" rx="2" fill="#d4a755"/>
<line x1="818" y1="352" x2="852" y2="352" stroke="#2c5454" stroke-width="2"/>
<line x1="852" y1="336" x2="852" y2="368" stroke="#2c5454" stroke-width="2"/>
<path d="M 872 330 A 30 30 0 0 1 872 374" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 888 320 A 46 46 0 0 1 888 384" fill="none" stroke="#6a9a9a" stroke-width="2.5"/>
<path d="M 904 310 A 62 62 0 0 1 904 394" fill="none" stroke="#a9cccc" stroke-width="2.5"/>
<text x="696" y="440" font-size="13.5" fill="#5c5c5c">dirty · scuffed · hidden</text>
<text x="696" y="462" font-size="14.5" font-weight="800" fill="#2c5454">→ still reads</text>

<text x="600" y="612" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Barcodes keep the identifier where the warehouse can destroy it. RFID keeps it where the warehouse can't.</text>
</svg>
