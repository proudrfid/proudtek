<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Reader deployment geometry for windshield tags: overhead gantry and side-mount</title>
<desc id="d">Two panels. Left: an overhead gantry reader angled 15 to 30 degrees down onto a windshield pane below. Right: a side-mounted reader at 1.2 to 1.5 meters windshield height angled at an approaching vehicle, with a barrier arm. A bottom strip lists per-lane antenna isolation to prevent cross-reads, 2 to 3 antennas per lane, and a 200 to 500 millisecond tag-to-barrier response time.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">READER DEPLOYMENT</text>
<text x="600" y="86" text-anchor="middle" font-size="15" fill="#4f4f4f">Antenna placement, angle, isolation and timing decide the read rate.</text>
<!-- left panel: overhead gantry -->
<rect x="60" y="120" width="520" height="330" rx="16" fill="#fcfbf8" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="320" y="150" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Overhead gantry</text>
<rect x="110" y="180" width="420" height="11" rx="3" fill="#4a5568"/>
<rect x="110" y="191" width="11" height="120" fill="#4a5568"/>
<rect x="519" y="191" width="11" height="120" fill="#4a5568"/>
<rect x="268" y="164" width="104" height="24" rx="5" fill="#2c5454"/>
<text x="320" y="181" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">READER</text>
<polygon points="300,191 342,191 300,352" fill="#dbe8e8"/>
<polygon points="170,392 250,344 400,344 340,392" fill="#e8f0f0" stroke="#9fb8b8" stroke-width="2"/>
<rect x="286" y="356" width="22" height="11" rx="3" fill="#3d6b6b"/>
<text x="446" y="250" text-anchor="middle" font-size="13" font-weight="800" fill="#3a4557">15-30°</text>
<text x="446" y="270" text-anchor="middle" font-size="12" fill="#5c5c5c">down-angle</text>
<!-- right panel: side-mount -->
<rect x="620" y="120" width="520" height="330" rx="16" fill="#fcfbf8" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="880" y="150" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Side-mounted at the barrier</text>
<line x1="700" y1="392" x2="1110" y2="392" stroke="#d9cdb6" stroke-width="2"/>
<rect x="726" y="210" width="20" height="182" fill="#4a5568"/>
<rect x="705" y="196" width="56" height="26" rx="5" fill="#2c5454"/>
<text x="733" y="214" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">RDR</text>
<line x1="690" y1="222" x2="690" y2="392" stroke="#8a8272" stroke-width="1.5"/>
<polygon points="690,222 685,236 695,236" fill="#8a8272"/>
<polygon points="690,392 685,378 695,378" fill="#8a8272"/>
<text x="654" y="312" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4557">1.2-1.5 m</text>
<polygon points="761,214 761,232 918,336" fill="#dbe8e8"/>
<polygon points="880,300 960,300 1010,360 850,360" fill="#e8f0f0" stroke="#9fb8b8" stroke-width="2"/>
<rect x="900" y="318" width="22" height="11" rx="3" fill="#3d6b6b"/>
<rect x="770" y="300" width="120" height="10" rx="4" fill="#c39a5f"/>
<text x="1000" y="384" text-anchor="middle" font-size="12" fill="#5c5c5c">approaching vehicle</text>
<!-- bottom facts -->
<rect x="60" y="480" width="360" height="40" rx="20" fill="#eef2f5" stroke="#bcc6d4" stroke-width="1.3"/>
<text x="240" y="505" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4557">Per-lane isolation — no cross-reads</text>
<rect x="440" y="480" width="288" height="40" rx="20" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="584" y="505" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">2-3 antennas per lane</text>
<rect x="748" y="480" width="392" height="40" rx="20" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<text x="944" y="505" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">200-500 ms · tag detected → barrier open</text>
<text x="600" y="576" text-anchor="middle" font-size="14" fill="#5c5c5c">Angle, height, isolation and timing matter as much as the tag you pick.</text>
</svg>
