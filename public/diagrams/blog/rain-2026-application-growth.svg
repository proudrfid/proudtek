<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five applications that drove 2026 RAIN tag volume</title>
<desc id="d">Leaderboard of the five fastest-growing RAIN RFID applications in 2026, each with its own headline metric. Apparel and footwear leads at 40-45% of tag volume. Pharmaceuticals follows with 100M+ units tagged under DSCSA and EU FMD. Food traceability under FSMA 204 now pencils out at $0.04 per tag. Reusable transport packaging returns its investment in 8-14 months. Healthcare asset deployments average 10K-30K tags per site. Bar lengths show the pecking order, not a shared axis — each challenger runs on its own metric.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE THE NEW TAG VOLUME WENT</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">The 2026 application leaderboard</text>

<!-- row 1: apparel -->
<text x="64" y="152" font-size="15.5" font-weight="700" fill="#291c0e">Apparel &amp; footwear — still #1</text>
<rect x="64" y="162" width="768" height="30" rx="9" fill="#eef5f5"/>
<rect x="64" y="162" width="768" height="30" rx="9" fill="#3d6b6b"/>
<text x="1136" y="183" text-anchor="end" font-size="16" font-weight="700" fill="#2c5454">40-45% of tag volume</text>

<!-- row 2: pharma -->
<text x="64" y="236" font-size="15.5" font-weight="700" fill="#291c0e">Pharmaceuticals (DSCSA + EU FMD)</text>
<rect x="64" y="246" width="768" height="30" rx="9" fill="#eef1f5"/>
<rect x="64" y="246" width="430" height="30" rx="9" fill="#4a5568"/>
<text x="1136" y="267" text-anchor="end" font-size="16" font-weight="700" fill="#4a5568">100M+ units tagged</text>

<!-- row 3: food -->
<text x="64" y="320" font-size="15.5" font-weight="700" fill="#291c0e">Food traceability (FSMA 204)</text>
<rect x="64" y="330" width="768" height="30" rx="9" fill="#eef7f1"/>
<rect x="64" y="330" width="350" height="30" rx="9" fill="#2d6a4f"/>
<text x="1136" y="351" text-anchor="end" font-size="16" font-weight="700" fill="#1f6f3a">$0.04 per tag</text>

<!-- row 4: reusable transport packaging -->
<text x="64" y="404" font-size="15.5" font-weight="700" fill="#291c0e">Reusable transport packaging</text>
<rect x="64" y="414" width="768" height="30" rx="9" fill="#f9f1e2"/>
<rect x="64" y="414" width="290" height="30" rx="9" fill="#c39a5f"/>
<text x="1136" y="435" text-anchor="end" font-size="16" font-weight="700" fill="#8a6a2f">8-14 mo ROI</text>

<!-- row 5: healthcare -->
<text x="64" y="488" font-size="15.5" font-weight="700" fill="#291c0e">Healthcare assets</text>
<rect x="64" y="498" width="768" height="30" rx="9" fill="#eef5f5"/>
<rect x="64" y="498" width="235" height="30" rx="9" fill="#2c5454"/>
<text x="1136" y="519" text-anchor="end" font-size="16" font-weight="700" fill="#2c5454">10K-30K tags per site</text>

<text x="600" y="580" text-anchor="middle" font-size="13" fill="#5c5c5c">Bar lengths show the pecking order, not a shared axis — each challenger runs on its own headline metric.</text>
<text x="600" y="606" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Apparel still wears the crown; pharma, food, packaging and healthcare are sprinting up the leaderboard.</text>
</svg>
