<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">iOS vs Android NFC behavior — the differences that decide whether a tap works</title>
<desc id="d">Two columns. iOS, on iPhone XS and later, reads NFC tags in the background with no user action, shows a notification banner you tap to open, requires HTTPS URLs and ignores plain HTTP, silently ignores Android Application Records, and exposes tag access through Core NFC. Android dispatches reads through an intent system: if no app claims the intent the default browser opens URI records, apps can register intent filters, and it natively supports AAR and a wider range of record types. Both platforms suppress repeated reads of the same tag for roughly 5 to 10 seconds to prevent accidental duplicate actions.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="1.2" fill="#6d5a3a">SAME TAG, TWO PERSONALITIES &#8212; iOS vs ANDROID</text>

<!-- iOS panel -->
<rect x="60" y="92" width="520" height="424" rx="16" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.6"/>
<rect x="84" y="116" width="34" height="52" rx="6" fill="#291c0e"/><rect x="90" y="122" width="22" height="40" rx="3" fill="#4a5568"/>
<text x="132" y="140" font-size="21" font-weight="800" fill="#291c0e">iOS</text>
<text x="132" y="162" font-size="13.5" font-weight="600" fill="#4a5568">iPhone XS and later &#183; Core NFC</text>

<g font-size="15" font-weight="600" fill="#26303c">
<circle cx="96" cy="212" r="5" fill="#4a5568"/><text x="116" y="217">Reads tags in the <tspan font-weight="800">background</tspan> &#8212; no user action</text>
<circle cx="96" cy="262" r="5" fill="#4a5568"/><text x="116" y="267">A notification banner appears; tap it to open</text>
<circle cx="96" cy="312" r="5" fill="#4a5568"/><text x="116" y="317"><tspan font-weight="800">Requires HTTPS.</tspan> Plain http:// is not opened</text>
<circle cx="96" cy="362" r="5" fill="#8b2d2d"/><text x="116" y="367">Silently <tspan font-weight="800" fill="#8b2d2d">ignores AAR</tspan> (Android App Records)</text>
</g>
<rect x="84" y="410" width="472" height="82" rx="10" fill="#ffffff" stroke="#d3dae3" stroke-width="1.4"/>
<text x="104" y="440" font-size="13.5" font-weight="700" fill="#4a5568">System Tag Reader shows a banner like:</text>
<rect x="104" y="452" width="432" height="30" rx="8" fill="#eef1f5"/><text x="120" y="472" font-size="13.5" font-weight="700" fill="#26303c">&#128241; brand.com &#8212; tap to open</text>

<!-- VS badge -->
<circle cx="600" cy="300" r="30" fill="#c39a5f"/><text x="600" y="307" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">vs</text>

<!-- Android panel -->
<rect x="620" y="92" width="520" height="424" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="644" y="116" width="34" height="52" rx="6" fill="#291c0e"/><rect x="650" y="122" width="22" height="40" rx="3" fill="#3d6b6b"/>
<text x="692" y="140" font-size="21" font-weight="800" fill="#291c0e">Android</text>
<text x="692" y="162" font-size="13.5" font-weight="600" fill="#3d6b6b">intent dispatch &#183; wider record support</text>

<g font-size="15" font-weight="600" fill="#234a4a">
<circle cx="656" cy="212" r="5" fill="#3d6b6b"/><text x="676" y="217">Dispatches reads through an <tspan font-weight="800">intent system</tspan></text>
<circle cx="656" cy="262" r="5" fill="#3d6b6b"/><text x="676" y="267">No app claims it &#8594; default browser opens URI</text>
<circle cx="656" cy="312" r="5" fill="#3d6b6b"/><text x="676" y="317">Apps register <tspan font-weight="800">intent filters</tspan> for tag types</text>
<circle cx="656" cy="362" r="5" fill="#1f6f3a"/><text x="676" y="367">Natively supports <tspan font-weight="800" fill="#1f6f3a">AAR + wider records</tspan></text>
</g>
<rect x="644" y="410" width="472" height="82" rx="10" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="664" y="440" font-size="13.5" font-weight="700" fill="#3d6b6b">Intent routing:</text>
<text x="664" y="470" font-size="13.5" font-weight="700" fill="#234a4a">tag &#8594; filter match? &#8594; your app &#183; else &#8594; browser</text>

<!-- shared band -->
<rect x="60" y="536" width="1080" height="72" rx="12" fill="#6d5a3a"/>
<text x="600" y="568" text-anchor="middle" font-size="15.5" font-weight="800" letter-spacing="0.5" fill="#ffffff">BOTH: suppress repeat reads of the same tag for ~5&#8211;10 s (so one tap doesn't fire five times)</text>
<text x="600" y="592" text-anchor="middle" font-size="13.5" font-weight="600" fill="#f0e2c2">Both need a valid NDEF message. One HTTPS URL keeps the experience identical on either phone.</text>
</svg>
