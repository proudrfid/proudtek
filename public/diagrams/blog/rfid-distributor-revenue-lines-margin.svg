<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID distributor revenue lines ranked by gross margin</title>
<desc id="d">A ranked horizontal bar chart of RFID distributor revenue lines by gross margin. Trade-in and refurbishment sales run at 100% margin, value-added services at 60-80%, integration consulting at 50-75%, and RFID-as-a-service at 50-70%, all well above plain tag resale at 25-45% shown as the baseline everyone competes on. A note explains that annual blanket orders sit near spot margin and pay off in predictable cash flow rather than a higher rate.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">REVENUE LINES BY MARGIN</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Ranked by margin, not by revenue</text>
<text x="600" y="134" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Where a well-run RFID distributor actually earns its keep.</text>

<!-- gridlines -->
<line x1="400" y1="176" x2="400" y2="500" stroke="#efe9db" stroke-width="1.4"/>
<line x1="580" y1="176" x2="580" y2="500" stroke="#efe9db" stroke-width="1.4"/>
<line x1="760" y1="176" x2="760" y2="500" stroke="#efe9db" stroke-width="1.4"/>
<line x1="940" y1="176" x2="940" y2="500" stroke="#efe9db" stroke-width="1.4"/>
<line x1="1120" y1="176" x2="1120" y2="500" stroke="#efe9db" stroke-width="1.4"/>
<text x="400" y="518" text-anchor="middle" font-size="12" fill="#9a9a9a">0%</text>
<text x="580" y="518" text-anchor="middle" font-size="12" fill="#9a9a9a">25%</text>
<text x="760" y="518" text-anchor="middle" font-size="12" fill="#9a9a9a">50%</text>
<text x="940" y="518" text-anchor="middle" font-size="12" fill="#9a9a9a">75%</text>
<text x="1112" y="518" text-anchor="middle" font-size="12" fill="#9a9a9a">100%</text>

<!-- Row 1: refurb 100% -->
<text x="72" y="211" font-size="14.5" fill="#291c0e">Trade-in / refurb</text>
<rect x="400" y="186" width="720" height="40" rx="6" fill="#2d6a4f" stroke="#1b4332" stroke-width="1.4"/>
<text x="1100" y="211" text-anchor="end" font-size="14.5" font-weight="800" fill="#eaf2ec">100%</text>

<!-- Row 2: VAS 60-80% -->
<text x="72" y="279" font-size="14.5" fill="#291c0e">Value-added services</text>
<rect x="400" y="254" width="576" height="40" rx="6" fill="#3d6b6b" stroke="#234a4a" stroke-width="1.4"/>
<line x1="832" y1="256" x2="832" y2="292" stroke="#eaf2f2" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="988" y="279" font-size="14.5" font-weight="700" fill="#234a4a">60-80%</text>

<!-- Row 3: consulting 50-75% -->
<text x="72" y="347" font-size="14.5" fill="#291c0e">Integration consulting</text>
<rect x="400" y="322" width="540" height="40" rx="6" fill="#3d6b6b" stroke="#234a4a" stroke-width="1.4"/>
<line x1="760" y1="324" x2="760" y2="360" stroke="#eaf2f2" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="952" y="347" font-size="14.5" font-weight="700" fill="#234a4a">50-75%</text>

<!-- Row 4: RaaS 50-70% -->
<text x="72" y="415" font-size="14.5" fill="#291c0e">RFID-as-a-Service</text>
<rect x="400" y="390" width="504" height="40" rx="6" fill="#3d6b6b" stroke="#234a4a" stroke-width="1.4"/>
<line x1="760" y1="392" x2="760" y2="428" stroke="#eaf2f2" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="916" y="415" font-size="14.5" font-weight="700" fill="#234a4a">50-70%</text>

<!-- Row 5: tag resale baseline 25-45% -->
<text x="72" y="483" font-size="14.5" fill="#291c0e">Tag resale (baseline)</text>
<rect x="400" y="458" width="324" height="40" rx="6" fill="#d6cbb3" stroke="#8a6d3b" stroke-width="1.4" stroke-dasharray="5 3"/>
<line x1="580" y1="460" x2="580" y2="496" stroke="#8a6d3b" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="736" y="483" font-size="14.5" font-weight="700" fill="#6d5a3a">25-45%</text>

<text x="600" y="556" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Annual blanket orders sit near spot margin — their payoff is predictable cash flow, not a higher rate.</text>
<text x="600" y="602" text-anchor="middle" font-size="14.5" fill="#5c5c5c">The tag is the door-opener. The margin walks in behind it.</text>
</svg>
