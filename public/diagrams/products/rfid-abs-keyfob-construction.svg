<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Cutaway anatomy of a welded ABS RFID keyfob</title>
  <desc id="d">A cutaway of a welded ABS keyfob labelling five parts with leader lines: a two-piece ABS top and bottom shell in 94HB or UL 94 V-0 grade; an ultrasonic weld seam at 20-35 kHz that seals the cavity to IP68 per IEC 60529; an LF or HF inlay of a copper coil plus chip that can be swapped without retooling the shell; and a 304 or 316 stainless split ring at the key-ring lug. A footnote lists the -25 to +85 °C service range, the 1.5 m drop test to IEC 60068-2-32 Ea, and the 30-50 mm footprint.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANATOMY OF A WELDED ABS KEYFOB</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Two moulded shells, one ultrasonic weld, an inlay you can swap without retooling</text>

  <!-- key-ring + split ring -->
  <circle cx="452" cy="352" r="46" fill="#f1e6cd" stroke="#c39a5f" stroke-width="3"/>
  <circle cx="452" cy="352" r="20" fill="#ffffff" stroke="#4a5568" stroke-width="6"/>

  <!-- fob body -->
  <rect x="470" y="228" width="352" height="248" rx="70" fill="#f7edd6" stroke="#e4c98f" stroke-width="3"/>
  <!-- weld seam (parting line between the two shells) -->
  <line x1="478" y1="352" x2="814" y2="352" stroke="#c39a5f" stroke-width="3" stroke-dasharray="11 7"/>
  <!-- coil turns -->
  <rect x="506" y="262" width="280" height="180" rx="54" fill="none" stroke="#c39a5f" stroke-width="4"/>
  <rect x="524" y="280" width="244" height="144" rx="44" fill="none" stroke="#c39a5f" stroke-width="3"/>
  <rect x="542" y="298" width="208" height="108" rx="36" fill="none" stroke="#c39a5f" stroke-width="3"/>
  <!-- chip die -->
  <rect x="616" y="326" width="60" height="52" rx="6" fill="#4a5568" stroke="#2f394a" stroke-width="2"/>
  <text x="646" y="357" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">chip</text>

  <!-- left labels -->
  <text x="96" y="250" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">SPLIT RING</text>
  <text x="96" y="271" font-size="13.5" fill="#5c5c5c">304 / 316 stainless key-ring</text>
  <line x1="96" y1="284" x2="428" y2="340" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="96" y="430" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">ULTRASONIC WELD</text>
  <text x="96" y="451" font-size="13.5" fill="#5c5c5c">20-35 kHz seam, sealed to IP68 (IEC 60529)</text>
  <line x1="96" y1="414" x2="520" y2="356" stroke="#b9c0cc" stroke-width="1.5"/>

  <!-- right labels -->
  <text x="864" y="250" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">TOP SHELL</text>
  <text x="864" y="271" font-size="13.5" fill="#5c5c5c">ABS — 94HB or UL 94 V-0 grade</text>
  <line x1="800" y1="250" x2="858" y2="256" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="864" y="352" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">LF / HF INLAY</text>
  <text x="864" y="373" font-size="13.5" fill="#5c5c5c">coil plus chip — swap chip, keep the shell</text>
  <line x1="786" y1="352" x2="858" y2="360" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="864" y="452" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">BOTTOM SHELL</text>
  <text x="864" y="473" font-size="13.5" fill="#5c5c5c">welded to IP68, moulded to 0.1 mm</text>
  <line x1="762" y1="452" x2="858" y2="462" stroke="#b9c0cc" stroke-width="1.5"/>

  <!-- footnote -->
  <text x="600" y="614" text-anchor="middle" font-size="13.5" fill="#5c5c5c">IP68 per IEC 60529 — -25 to +85 °C — 1.5 m drop (IEC 60068-2-32 Ea) — 30-50 mm teardrop, rectangle or oval</text>
</svg>
