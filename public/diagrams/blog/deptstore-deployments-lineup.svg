<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="depTitle depDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="depTitle">Public tier-1 department-store RFID deployments</title>
  <desc id="depDesc">Five named retailers with headline public numbers. Macy's: omnichannel fill rate rose from about 85 percent to over 95 percent, with 100 percent item-level tagging by 2024 and 5 to 15 percent shrink reduction at EAS-integrated pilots. Decathlon: a 9 to 12 percent revenue lift across 1,700-plus stores, over 30 percent shrink reduction, using Nedap !D Cloud. Target: a 2018 to 2024 rollout with smart-shelf pilots in cosmetics and baby formula. Bloomingdale's: shrink-event attribution improved from under 20 percent to over 70 percent moving from EAS-only to RFID-EAS. Lululemon: 98 percent-plus inventory accuracy versus about 75 percent before, with weekly cycle counts cut from 4 to 6 hours to 30 to 45 minutes, redirecting roughly 200 hours per store per year to the selling floor.</desc>
  <defs>
    <radialGradient id="depBg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="depArrow" markerWidth="9" markerHeight="9" refX="3" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 Z" fill="#8a6d3b"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#depBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="2.5" fill="#6d5a3a">PROOF FROM THE FLOOR · PUBLIC DEPLOYMENTS</text>
  <text x="600" y="83" text-anchor="middle" font-size="16" fill="#4f4f4f">numbers from earnings calls, NRF keynotes and trade press</text>

  <!-- Row: Macy's -->
  <rect x="60" y="102" width="1080" height="84" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="80" y="137" width="14" height="14" rx="3" fill="#2d6a4f"/>
  <text x="110" y="151" font-size="21" font-weight="800" fill="#291c0e">Macy's</text>
  <text x="452" y="138" font-size="22" font-weight="800" fill="#2d6a4f">fill rate ~85% → &gt;95%</text>
  <text x="452" y="166" font-size="13.5" fill="#4f4f4f">100% item-level by 2024 · 5–15% shrink at EAS pilots</text>

  <!-- Row: Decathlon -->
  <rect x="60" y="196" width="1080" height="84" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="80" y="231" width="14" height="14" rx="3" fill="#3d6b6b"/>
  <text x="110" y="245" font-size="21" font-weight="800" fill="#291c0e">Decathlon</text>
  <text x="452" y="232" font-size="22" font-weight="800" fill="#3d6b6b">9–12% revenue lift</text>
  <text x="452" y="260" font-size="13.5" fill="#4f4f4f">100% across 1,700+ stores · 30%+ shrink · Nedap !D Cloud</text>

  <!-- Row: Target -->
  <rect x="60" y="290" width="1080" height="84" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="80" y="325" width="14" height="14" rx="3" fill="#4a5568"/>
  <text x="110" y="339" font-size="21" font-weight="800" fill="#291c0e">Target</text>
  <text x="452" y="326" font-size="22" font-weight="800" fill="#4a5568">2018–2024 rollout</text>
  <text x="452" y="354" font-size="13.5" fill="#4f4f4f">smart-shelf pilots: cosmetics, baby formula</text>

  <!-- Row: Bloomingdale's -->
  <rect x="60" y="384" width="1080" height="84" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="80" y="419" width="14" height="14" rx="3" fill="#c39a5f"/>
  <text x="110" y="433" font-size="21" font-weight="800" fill="#291c0e">Bloomingdale's</text>
  <text x="452" y="420" font-size="22" font-weight="800" fill="#8a6d3b">attribution &lt;20% → &gt;70%</text>
  <text x="452" y="448" font-size="13.5" fill="#4f4f4f">shrink-event attribution, EAS-only → RFID-EAS hybrid</text>

  <!-- Row: Lululemon -->
  <rect x="60" y="478" width="1080" height="84" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="80" y="513" width="14" height="14" rx="3" fill="#177a92"/>
  <text x="110" y="527" font-size="21" font-weight="800" fill="#291c0e">Lululemon</text>
  <text x="452" y="514" font-size="22" font-weight="800" fill="#177a92">98%+ accuracy</text>
  <text x="452" y="542" font-size="13.5" fill="#4f4f4f">vs ~75% pre-RFID · counts 4–6 hrs → 30–45 min · ~200 hrs/store/yr</text>

  <text x="600" y="600" text-anchor="middle" font-size="14" font-style="italic" fill="#6d5a3a">Public sources — handy when your own pilot's numbers look too good for the board deck.</text>
</svg>
