<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Handheld-only vs always-on vs hybrid retail RFID architectures compared</title>
<desc id="d">Three architecture cards. Handheld-only, the legacy default, walks the floor weekly at 2 to 4 hours per cycle count, reaches 92 to 95 percent accuracy as the snapshot drifts, and costs about 3 to 5 thousand dollars per store. Always-on, the leading practice, uses overhead antennas from PervasID, Mojix or Impinj xSpan reading every 30 to 60 seconds for 98 to 99 percent-plus continuous accuracy at about 25 to 80 thousand dollars per store, with 6 to 9 month payback. Hybrid runs always-on at front-of-store, fitting room and receiving plus handheld in the back room, capturing most of the benefit at 40 to 60 percent of the capex. Recommended sequence: handheld in year one, always-on in year two.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE ARCHITECTURE CHANGES THE PAYBACK</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">A snapshot you refresh weekly, or an event stream that never stops reading.</text>

<!-- card 1 handheld -->
<rect x="64" y="150" width="340" height="336" rx="14" fill="#f1f3f7" stroke="#c7cdd8" stroke-width="1.6"/>
<text x="88" y="184" font-size="16.5" font-weight="800" fill="#3a4453">HANDHELD-ONLY</text>
<text x="88" y="205" font-size="12.5" fill="#8a8a8a">legacy default</text>
<line x1="88" y1="218" x2="380" y2="218" stroke="#dde1e8" stroke-width="1.3"/>
<text x="88" y="246" font-size="13" fill="#4a5568">Walk the floor weekly,</text>
<text x="88" y="264" font-size="13" fill="#4a5568">2–4 hr per cycle count.</text>
<text x="88" y="300" font-size="12" font-weight="800" letter-spacing="0.4" fill="#8a7a55">ACCURACY</text>
<text x="88" y="330" font-size="24" font-weight="800" fill="#3a4453">92–95%</text>
<text x="220" y="330" font-size="12" fill="#8a8a8a">snapshot drifts</text>
<text x="88" y="366" font-size="12" font-weight="800" letter-spacing="0.4" fill="#8a7a55">CAPEX / STORE</text>
<text x="88" y="394" font-size="19" font-weight="800" fill="#291c0e">~$3–5K</text>
<text x="88" y="440" font-size="12.5" fill="#5c5c5c">Caps out because the</text>
<text x="88" y="458" font-size="12.5" fill="#5c5c5c">count ages between walks.</text>

<!-- card 2 always-on (recommended) -->
<rect x="430" y="150" width="340" height="336" rx="14" fill="#eef7f0" stroke="#7fbf9a" stroke-width="2.2"/>
<text x="454" y="184" font-size="16.5" font-weight="800" fill="#234a4a">ALWAYS-ON</text>
<text x="454" y="205" font-size="12" font-weight="800" letter-spacing="0.4" fill="#1f6f3a">★ LEADING PRACTICE</text>
<line x1="454" y1="218" x2="746" y2="218" stroke="#c7e2d1" stroke-width="1.3"/>
<text x="454" y="246" font-size="13" fill="#33595a">Overhead antennas read</text>
<text x="454" y="264" font-size="13" fill="#33595a">every 30–60 sec.</text>
<text x="454" y="282" font-size="12" fill="#6a8a8a">PervasID · Mojix · Impinj xSpan</text>
<text x="454" y="312" font-size="12" font-weight="800" letter-spacing="0.4" fill="#3a6a4a">ACCURACY</text>
<text x="454" y="342" font-size="24" font-weight="800" fill="#1f6f3a">98–99%+</text>
<text x="586" y="342" font-size="12" fill="#6a8a8a">continuous</text>
<text x="454" y="378" font-size="12" font-weight="800" letter-spacing="0.4" fill="#3a6a4a">CAPEX / STORE</text>
<text x="454" y="406" font-size="19" font-weight="800" fill="#291c0e">~$25–80K</text>
<text x="600" y="406" font-size="14" font-weight="800" fill="#1f6f3a">payback 6–9 mo</text>
<text x="454" y="448" font-size="12.5" fill="#33595a">Event stream unlocks BOPIS,</text>
<text x="454" y="466" font-size="12.5" fill="#33595a">ship-from-store, fitting-room.</text>

<!-- card 3 hybrid -->
<rect x="796" y="150" width="340" height="336" rx="14" fill="#eef5f5" stroke="#bcd6d6" stroke-width="1.6"/>
<text x="820" y="184" font-size="16.5" font-weight="800" fill="#2c5454">HYBRID</text>
<text x="820" y="205" font-size="12.5" fill="#6a8a8a">pragmatic pick</text>
<line x1="820" y1="218" x2="1112" y2="218" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="820" y="246" font-size="13" fill="#33595a">Always-on at front-of-store,</text>
<text x="820" y="264" font-size="13" fill="#33595a">fitting room &amp; receiving;</text>
<text x="820" y="282" font-size="13" fill="#33595a">handheld in the back room.</text>
<text x="820" y="318" font-size="12" font-weight="800" letter-spacing="0.4" fill="#8a7a55">GETS</text>
<text x="820" y="348" font-size="18" font-weight="800" fill="#2c5454">most of always-on</text>
<text x="820" y="384" font-size="12" font-weight="800" letter-spacing="0.4" fill="#8a7a55">AT CAPEX OF</text>
<text x="820" y="412" font-size="19" font-weight="800" fill="#291c0e">40–60%</text>
<text x="820" y="454" font-size="12.5" fill="#5c5c5c">Most of the value without</text>
<text x="820" y="472" font-size="12.5" fill="#5c5c5c">the full overhead build.</text>

<!-- sequencing band -->
<rect x="64" y="506" width="1072" height="64" rx="13" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="92" y="534" font-size="14.5" font-weight="800" fill="#6d5a3a">Sequence it: handheld in year 1 to prove the supplier-tag flow → always-on in year 2 once the baseline is stable.</text>
<text x="92" y="556" font-size="13" fill="#7a6844">Lululemon, Zara, Nike and Walmart broadly did this. Market context: $13.46B (2024) → $29B (2033).</text>

<text x="600" y="600" text-anchor="middle" font-size="14" fill="#5c5c5c">Always-on pays back faster than handheld because the omnichannel revenue compounds.</text>
</svg>
