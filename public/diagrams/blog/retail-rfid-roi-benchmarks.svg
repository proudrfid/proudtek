<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Retail RFID ROI benchmarks: sales, labor, shrinkage, payback, plus Walmart and Lululemon proof</title>
<desc id="d">Four benchmark tiles and two proof cards. Same-store sales rise 2 to 10 percent from reduced out-of-stocks. Counting labor falls 60 to 80 percent versus barcode. Shrinkage falls 10 to 25 percent through item-level variance analysis. Payback is 6 to 18 months for apparel and footwear. Walmart reported accuracy moving from about 65 percent to 95 percent or more, with a 10 to 15 percent out-of-stock reduction and roughly 5 percent sales lift. Lululemon reached 98 percent accuracy with under one-year payback, per SML and industry benchmarks.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ROI BENCHMARKS FOR THE BUSINESS CASE</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Numbers a technology buyer can defend — published by the retailers who deployed.</text>

<!-- tiles -->
<rect x="64" y="150" width="248" height="158" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="188" y="216" text-anchor="middle" font-size="32" font-weight="800" fill="#1f6f3a">+2–10%</text>
<text x="188" y="250" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">same-store sales</text>
<text x="188" y="274" text-anchor="middle" font-size="12.5" fill="#5c5c5c">from fewer out-of-stocks</text>

<rect x="332" y="150" width="248" height="158" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="456" y="216" text-anchor="middle" font-size="32" font-weight="800" fill="#1f6f3a">−60–80%</text>
<text x="456" y="250" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">counting labor</text>
<text x="456" y="274" text-anchor="middle" font-size="12.5" fill="#5c5c5c">vs barcode counts</text>

<rect x="600" y="150" width="248" height="158" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="724" y="216" text-anchor="middle" font-size="32" font-weight="800" fill="#1f6f3a">−10–25%</text>
<text x="724" y="250" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">shrinkage</text>
<text x="724" y="274" text-anchor="middle" font-size="12.5" fill="#5c5c5c">item-level variance</text>

<rect x="868" y="150" width="268" height="158" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="1002" y="216" text-anchor="middle" font-size="32" font-weight="800" fill="#a07d43">6–18 mo</text>
<text x="1002" y="250" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">payback</text>
<text x="1002" y="274" text-anchor="middle" font-size="12.5" fill="#5c5c5c">apparel &amp; footwear</text>

<!-- proof cards -->
<text x="64" y="352" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">PUBLISHED PROOF POINTS</text>
<rect x="64" y="366" width="520" height="150" rx="14" fill="#ffffff" stroke="#dfd7c7" stroke-width="1.6"/>
<rect x="64" y="366" width="9" height="150" rx="4" fill="#2c5454"/>
<text x="92" y="402" font-size="18" font-weight="800" fill="#291c0e">Walmart</text>
<text x="92" y="432" font-size="15" font-weight="800" fill="#1f6f3a">accuracy ~65% → 95%+</text>
<text x="92" y="458" font-size="13.5" fill="#4f4f4f">out-of-stocks −10–15%</text>
<text x="92" y="480" font-size="13.5" fill="#4f4f4f">~5% sales lift</text>

<rect x="616" y="366" width="520" height="150" rx="14" fill="#ffffff" stroke="#dfd7c7" stroke-width="1.6"/>
<rect x="616" y="366" width="9" height="150" rx="4" fill="#c39a5f"/>
<text x="644" y="402" font-size="18" font-weight="800" fill="#291c0e">Lululemon</text>
<text x="644" y="432" font-size="15" font-weight="800" fill="#1f6f3a">98% accuracy</text>
<text x="644" y="458" font-size="13.5" fill="#4f4f4f">under 1-year payback</text>
<text x="644" y="480" font-size="12.5" font-style="italic" fill="#8a8a8a">per SML and industry benchmarks</text>

<text x="600" y="566" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">The counting saving pays the pilot; the omnichannel lift pays the rollout.</text>
<text x="600" y="598" text-anchor="middle" font-size="14" fill="#5c5c5c">Model 3-year volume conservatively and the payback lands inside 6–18 months.</text>
</svg>
