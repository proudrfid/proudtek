<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">An NFC gift tag on Christmas wrapping opens a video, playlist, photo album or webpage on one phone tap</title>
<desc id="d">A wrapped gift with a gold-ribboned bow carries a paper gift tag holding a small NFC chip. A phone taps the tag, and a short-range NFC field passes between them. An arrow leads to four outcomes the single tap can open: a video message, a holiday playlist, a photo album, and a personalized webpage. No app is required, and the sticker can be reprogrammed every December.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NFC CHRISTMAS GIFT TAGS</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#291c0e">One tap unwraps a video</text>
<text x="600" y="138" text-anchor="middle" font-size="16" fill="#4f4f4f">A sticker on the wrapping opens a message, playlist or photo album — no app, on any recent phone.</text>

<!-- gift box -->
<rect x="150" y="330" width="210" height="168" rx="12" fill="#3d6b6b"/>
<rect x="134" y="300" width="242" height="40" rx="8" fill="#234a4a"/>
<rect x="244" y="330" width="22" height="168" fill="#d4a755"/>
<rect x="244" y="300" width="22" height="40" fill="#c39a5f"/>
<circle cx="242" cy="292" r="15" fill="#d4a755"/>
<circle cx="268" cy="292" r="15" fill="#d4a755"/>
<rect x="249" y="285" width="12" height="15" rx="3" fill="#c39a5f"/>

<!-- gift tag -->
<line x1="300" y1="288" x2="330" y2="266" stroke="#b8863f" stroke-width="2"/>
<rect x="326" y="236" width="128" height="82" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
<circle cx="342" cy="252" r="4" fill="none" stroke="#b8863f" stroke-width="2"/>
<rect x="344" y="262" width="24" height="24" rx="3" fill="none" stroke="#2c5454" stroke-width="2.5"/>
<path d="M 378 264 A 20 20 0 0 1 378 300" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 390 258 A 30 30 0 0 1 390 306" fill="none" stroke="#7aa6a6" stroke-width="2.5"/>
<text x="344" y="308" font-size="13" font-weight="700" fill="#2c5454">TAP ME</text>

<!-- phone tapping -->
<rect x="486" y="300" width="96" height="182" rx="16" fill="#ffffff" stroke="#234a4a" stroke-width="3"/>
<rect x="498" y="318" width="72" height="146" rx="6" fill="#eef5f5"/>
<polygon points="524,372 524,412 556,392" fill="#3d6b6b"/>
<text x="534" y="440" text-anchor="middle" font-size="12" fill="#5c5c5c">plays</text>
<path d="M 476 356 A 40 40 0 0 0 476 428" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 464 366 A 30 30 0 0 0 464 418" fill="none" stroke="#a9cccc" stroke-width="2.5"/>

<!-- arrow to outcomes -->
<line x1="606" y1="392" x2="676" y2="392" stroke="#291c0e" stroke-width="3"/>
<polygon points="676,383 694,392 676,401" fill="#291c0e"/>

<!-- outcomes -->
<text x="712" y="258" font-size="13" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">ONE TAP CAN OPEN</text>

<rect x="712" y="276" width="424" height="56" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="726" y="288" width="32" height="32" rx="8" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<polygon points="737,298 737,310 749,304" fill="#3d6b6b"/>
<text x="776" y="309" font-size="17" font-weight="700" fill="#291c0e">Video message</text>

<rect x="712" y="344" width="424" height="56" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="726" y="356" width="32" height="32" rx="8" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<circle cx="738" cy="379" r="5" fill="#3d6b6b"/>
<rect x="742" y="360" width="3" height="19" fill="#3d6b6b"/>
<text x="776" y="377" font-size="17" font-weight="700" fill="#291c0e">Holiday playlist</text>

<rect x="712" y="412" width="424" height="56" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="726" y="424" width="32" height="32" rx="8" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<rect x="731" y="431" width="22" height="18" rx="2" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="738" cy="438" r="2.5" fill="#3d6b6b"/>
<polygon points="742,449 749,440 753,449" fill="#3d6b6b"/>
<text x="776" y="445" font-size="17" font-weight="700" fill="#291c0e">Photo album</text>

<rect x="712" y="480" width="424" height="56" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="726" y="492" width="32" height="32" rx="8" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<circle cx="742" cy="508" r="11" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<line x1="731" y1="508" x2="753" y2="508" stroke="#3d6b6b" stroke-width="2"/>
<path d="M 742 497 A 15 11 0 0 0 742 519" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<text x="776" y="513" font-size="17" font-weight="700" fill="#291c0e">Personalized webpage</text>

<text x="600" y="628" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Reprogram it every December — the same sticker carries a new surprise each year.</text>
</svg>
