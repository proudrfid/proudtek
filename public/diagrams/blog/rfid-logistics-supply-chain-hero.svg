<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">One RFID tag read at every hand-off across the logistics chain</title>
<desc id="d">A left-to-right chain of five logistics hand-off points — inbound dock portal, warehouse zone readers, conveyor tunnel reader, yard gate, and outbound dock portal — each shown with an RFID read signal. A band beneath states that the reads form continuous, automatic capture feeding WMS, TMS and ERP, replacing manual stop-and-scan barcode work.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="58" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">READ AT EVERY HAND-OFF</text>
<text x="600" y="106" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="38" font-weight="700" fill="#291c0e">One tag, read at every hand-off</text>
<text x="600" y="140" text-anchor="middle" font-size="16.5" fill="#4f4f4f">UHF RFID turns each transition point into an automatic read — no one aims a barcode gun.</text>

<!-- arrows between nodes -->
<g stroke="#8a94a3" stroke-width="2.4" fill="#8a94a3">
<line x1="238" y1="340" x2="280" y2="340"/><polygon points="280,335 289,340 280,345"/>
<line x1="463" y1="340" x2="505" y2="340"/><polygon points="505,335 514,340 505,345"/>
<line x1="688" y1="340" x2="730" y2="340"/><polygon points="730,335 739,340 730,345"/>
<line x1="913" y1="340" x2="955" y2="340"/><polygon points="955,335 964,340 955,345"/>
</g>

<!-- NODE 1 -->
<rect x="66" y="252" width="168" height="182" rx="14" fill="#eef1f4" stroke="#4a5568" stroke-width="1.6"/>
<circle cx="150" cy="304" r="3" fill="#2c5454"/>
<path d="M140 300 A 14 14 0 0 1 160 300" stroke="#2c5454" stroke-width="2.4" fill="none"/>
<path d="M133 293 A 24 24 0 0 1 167 293" stroke="#3d6b6b" stroke-width="2.2" fill="none"/>
<text x="150" y="352" text-anchor="middle" font-size="14.5" font-weight="800" letter-spacing="0.3" fill="#3a4658">INBOUND DOCK</text>
<text x="150" y="374" text-anchor="middle" font-size="12.5" fill="#5c5c5c">portal reader</text>
<rect x="102" y="392" width="96" height="26" rx="13" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="150" y="409" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">RFID read</text>

<!-- NODE 2 -->
<rect x="291" y="252" width="168" height="182" rx="14" fill="#eef1f4" stroke="#4a5568" stroke-width="1.6"/>
<circle cx="375" cy="304" r="3" fill="#2c5454"/>
<path d="M365 300 A 14 14 0 0 1 385 300" stroke="#2c5454" stroke-width="2.4" fill="none"/>
<path d="M358 293 A 24 24 0 0 1 392 293" stroke="#3d6b6b" stroke-width="2.2" fill="none"/>
<text x="375" y="352" text-anchor="middle" font-size="14.5" font-weight="800" letter-spacing="0.3" fill="#3a4658">WAREHOUSE</text>
<text x="375" y="374" text-anchor="middle" font-size="12.5" fill="#5c5c5c">area + handheld</text>
<rect x="327" y="392" width="96" height="26" rx="13" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="375" y="409" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">RFID read</text>

<!-- NODE 3 -->
<rect x="516" y="252" width="168" height="182" rx="14" fill="#eef1f4" stroke="#4a5568" stroke-width="1.6"/>
<circle cx="600" cy="304" r="3" fill="#2c5454"/>
<path d="M590 300 A 14 14 0 0 1 610 300" stroke="#2c5454" stroke-width="2.4" fill="none"/>
<path d="M583 293 A 24 24 0 0 1 617 293" stroke="#3d6b6b" stroke-width="2.2" fill="none"/>
