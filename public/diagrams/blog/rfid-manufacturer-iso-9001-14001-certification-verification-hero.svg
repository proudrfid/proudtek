<line x1="364" y1="369" x2="380" y2="369" stroke="#9fc9ae" stroke-width="1.5"/>
<rect x="380" y="354" width="170" height="30" rx="15" fill="#ffffff" stroke="#9fc9ae"/>
<text x="465" y="374" text-anchor="middle" font-size="12.5" fill="#1f6f3a">accreditation mark ✓</text>

<rect x="111" y="505" width="410" height="34" rx="17" fill="#e8f4ec" stroke="#9fc9ae"/>
<text x="316" y="527" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6f3a">✓ Found on the issuer's portal — current &amp; in scope</text>

