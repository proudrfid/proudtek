<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A documented-correct manual count can still leave a sponge inside; the RFID adjunct scan detects it</title>
<desc id="d">Two panels. On the left, manual count only: the closing count is documented correct, yet a tagged sponge remains in the surgical field, so the outcome is a retained sponge. On the right, the RFID adjunct: a final scan over the same field before closure detects and locates the retained sponge so it is removed. The takeaway is that RFID adds an intraoperative scan that counts and locates each sponge, the FDA-cleared adjunct AORN recommends alongside the manual count.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">A CORRECT COUNT CAN STILL BE WRONG</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">The manual count reads "correct" in most retained-item cases — the adjunct is the catch.</text>

<!-- LEFT: manual only -->
<rect x="60" y="112" width="524" height="452" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="60" y="112" width="524" height="8" rx="4" fill="#4a5568"/>
<text x="322" y="156" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.5" fill="#4a5568">MANUAL COUNT ONLY</text>
<rect x="182" y="188" width="280" height="60" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<path d="M 202 218 L 210 227 L 226 208" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="240" y="223" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f6f3a">Count documented correct</text>
<!-- surgical field -->
<rect x="182" y="284" width="280" height="150" rx="14" fill="#f3f6f6" stroke="#3d6b6b" stroke-width="2"/>
<text x="322" y="308" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#2c5454">SURGICAL FIELD</text>
<line x1="206" y1="330" x2="438" y2="330" stroke="#cfe0e0" stroke-width="2"/>
<line x1="206" y1="356" x2="438" y2="356" stroke="#cfe0e0" stroke-width="2"/>
<line x1="206" y1="382" x2="438" y2="382" stroke="#cfe0e0" stroke-width="2"/>
<line x1="206" y1="408" x2="438" y2="408" stroke="#cfe0e0" stroke-width="2"/>
<rect x="300" y="360" width="30" height="30" rx="5" fill="#f2d9d9" stroke="#8b2d2d" stroke-width="2"/>
<line x1="300" y1="370" x2="330" y2="370" stroke="#8b2d2d" stroke-width="1.2"/>
<line x1="300" y1="380" x2="330" y2="380" stroke="#8b2d2d" stroke-width="1.2"/>
<text x="346" y="379" font-size="12" fill="#8b2d2d">retained</text>
<rect x="182" y="470" width="280" height="40" rx="20" fill="#f7e7e7" stroke="#8b2d2d" stroke-width="1.6"/>
<text x="322" y="496" text-anchor="middle" font-size="14.5" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">SPONGE STILL INSIDE</text>
<text x="322" y="540" text-anchor="middle" font-size="13" fill="#5c5c5c">The count was right on paper.</text>

<!-- RIGHT: RFID adjunct -->
<rect x="616" y="112" width="524" height="452" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="616" y="112" width="524" height="8" rx="4" fill="#3d6b6b"/>
<text x="878" y="156" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.5" fill="#2c5454">RFID ADJUNCT SCAN</text>
<rect x="738" y="188" width="280" height="60" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<rect x="756" y="205" width="30" height="22" rx="4" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
<path d="M 792 218 a 13 13 0 0 1 18 0" fill="none" stroke="#2c5454" stroke-width="2"/>
<text x="822" y="223" text-anchor="start" font-size="13" font-weight="700" fill="#2c5454">Final scan before closure</text>
<!-- surgical field with locate -->
<rect x="738" y="284" width="280" height="150" rx="14" fill="#f3f6f6" stroke="#3d6b6b" stroke-width="2"/>
<text x="878" y="308" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#2c5454">SURGICAL FIELD</text>
<line x1="762" y1="330" x2="994" y2="330" stroke="#cfe0e0" stroke-width="2"/>
<line x1="762" y1="356" x2="994" y2="356" stroke="#cfe0e0" stroke-width="2"/>
<line x1="762" y1="382" x2="994" y2="382" stroke="#cfe0e0" stroke-width="2"/>
<line x1="762" y1="408" x2="994" y2="408" stroke="#cfe0e0" stroke-width="2"/>
<circle cx="871" cy="375" r="28" fill="none" stroke="#1f6f3a" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="856" y="360" width="30" height="30" rx="5" fill="#dfeee7" stroke="#1f6f3a" stroke-width="2"/>
<line x1="856" y1="370" x2="886" y2="370" stroke="#1f6f3a" stroke-width="1.2"/>
<line x1="856" y1="380" x2="886" y2="380" stroke="#1f6f3a" stroke-width="1.2"/>
<text x="912" y="345" font-size="12" fill="#1f6f3a">located</text>
<rect x="738" y="470" width="280" height="40" rx="20" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.6"/>
<text x="878" y="496" text-anchor="middle" font-size="14.5" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">DETECTED &amp; REMOVED</text>
<text x="878" y="540" text-anchor="middle" font-size="13" fill="#5c5c5c">The scan caught what the count missed.</text>

<line x1="120" y1="588" x2="1080" y2="588" stroke="#efe7d6" stroke-width="2"/>
<text x="600" y="620" text-anchor="middle" font-size="15" fill="#4f4f4f">RFID adds an intraoperative scan that counts and locates each sponge — the FDA-cleared adjunct AORN recommends alongside the count.</text>
</svg>
