<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How to validate laundry-tag durability claims on a datasheet</title>
<desc id="d">Left, a read-range degradation curve over 200 wash cycles: an acceptable tag stays under 1 dB of loss while a failing tag exceeds the 3 dB antenna-damage threshold. Right, the five demands to make of any datasheet: an ISO/IEC 6330 procedure number rather than a vague 'tested to 200'; ISO/IEC 18046-3 read-range measured every 25 cycles; ASTM chemistry ratings in ppm (PPS above 1,500, silicone 1,000, textile 200-500); named finishing equipment such as Kannegiesser, JENSEN or Inwatec; and a guaranteed end-of-life read-rate above 98%.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT TO DEMAND ON THE DATASHEET</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">'Tested to 200 cycles' is not a procedure-traceable claim.</text>

<!-- chart -->
<text x="120" y="158" font-size="12.5" font-weight="700" fill="#6d5a3a">read-range loss (dB)</text>
<line x1="120" y1="170" x2="120" y2="450" stroke="#c9c1b2" stroke-width="2"/>
<line x1="120" y1="450" x2="540" y2="450" stroke="#c9c1b2" stroke-width="2"/>
<text x="108" y="454" text-anchor="end" font-size="12" fill="#8a8a8a">0</text>
<text x="108" y="384" text-anchor="end" font-size="12" fill="#8a8a8a">1</text>
<text x="108" y="244" text-anchor="end" font-size="12" fill="#8a8a8a">3</text>
<line x1="120" y1="380" x2="540" y2="380" stroke="#3d6b6b" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="120" y1="240" x2="540" y2="240" stroke="#8b2d2d" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="534" y="373" text-anchor="end" font-size="12" font-weight="700" fill="#2c5454">acceptable &lt; 1 dB</text>
<text x="534" y="233" text-anchor="end" font-size="12" font-weight="700" fill="#8b2d2d">antenna damage &gt; 3 dB</text>
<text x="120" y="470" text-anchor="middle" font-size="12" fill="#8a8a8a">0</text>
<text x="330" y="470" text-anchor="middle" font-size="12" fill="#8a8a8a">100</text>
<text x="540" y="470" text-anchor="middle" font-size="12" fill="#8a8a8a">200</text>
<text x="330" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5a3a">wash cycles</text>
<polyline points="120,450 225,443 330,430 435,410 540,388" fill="none" stroke="#3d6b6b" stroke-width="3"/>
<polyline points="120,450 225,436 330,404 435,300 540,205" fill="none" stroke="#8b2d2d" stroke-width="3"/>
<circle cx="540" cy="388" r="4" fill="#3d6b6b"/>
<circle cx="540" cy="205" r="4" fill="#8b2d2d"/>

<!-- checklist -->
<line x1="580" y1="170" x2="580" y2="450" stroke="#efe7d6" stroke-width="1.5"/>
<circle cx="620" cy="190" r="11" fill="#1f6f3a"/><path d="M615,190 L619,194 L626,185" fill="none" stroke="#ffffff" stroke-width="2.4"/>
<text x="644" y="188" font-size="13.5" font-weight="700" fill="#291c0e">ISO/IEC 6330 procedure number (4N / 6N)</text>
<text x="644" y="206" font-size="12" fill="#5c5c5c">not a vague "tested to 200 cycles"</text>

<circle cx="620" cy="250" r="11" fill="#1f6f3a"/><path d="M615,250 L619,254 L626,245" fill="none" stroke="#ffffff" stroke-width="2.4"/>
<text x="644" y="255" font-size="13.5" font-weight="700" fill="#291c0e">ISO/IEC 18046-3 read-range every 25 cycles</text>

<circle cx="620" cy="310" r="11" fill="#1f6f3a"/><path d="M615,310 L619,314 L626,305" fill="none" stroke="#ffffff" stroke-width="2.4"/>
<text x="644" y="308" font-size="13.5" font-weight="700" fill="#291c0e">ASTM chemistry rating in ppm</text>
<text x="644" y="326" font-size="12" fill="#5c5c5c">PPS &gt;1,500 · silicone 1,000 · textile 200-500</text>

<circle cx="620" cy="370" r="11" fill="#1f6f3a"/><path d="M615,370 L619,374 L626,365" fill="none" stroke="#ffffff" stroke-width="2.4"/>
<text x="644" y="368" font-size="13.5" font-weight="700" fill="#291c0e">Named finishing equipment</text>
<text x="644" y="386" font-size="12" fill="#5c5c5c">Kannegiesser, JENSEN, Inwatec</text>

<circle cx="620" cy="424" r="11" fill="#1f6f3a"/><path d="M615,424 L619,428 L626,419" fill="none" stroke="#ffffff" stroke-width="2.4"/>
<text x="644" y="429" font-size="13.5" font-weight="700" fill="#291c0e">Guaranteed end-of-life read-rate &gt; 98%</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">A flat degradation curve is suspicious — a real one shows 5-10% loss late in life.</text>
</svg>
