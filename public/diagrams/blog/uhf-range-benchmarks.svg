<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="bmTitle bmDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="bmTitle">Read-range benchmarks by inlay, chip and reader</title>
  <desc id="bmDesc">A table of the most-deployed UHF inlays at 4 watt EIRP FCC. Avery Dennison AD-228m6 with Impinj M730 reads 12 to 14 meters free-space and 8 to 10 meters on cardboard, 3 to 4 meters on metal. SML GB6 and GB7 with Impinj M750 or M770 read 6 to 9 meters on cardboard, omnidirectional. Confidex Survivor and Steelwave with NXP UCODE 9 or Impinj M730 read 8 to 10 meters off metal and 4 to 7 meters on metal. Xerafy Mercury and Cargo Trak read over 12 meters on shipping containers at 30 dBm. Times-7 A5020 and A6033 antennas with an Impinj R720 reader give 8 to 12 meter portal range at 200 to 500 tags per second.</desc>
  <defs>
    <radialGradient id="bmBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bmBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="27" font-weight="800" letter-spacing="1.2" fill="#6d5a3a">DATASHEET RANGE vs. THE REAL WORLD</text>
  <text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Typical 2026 reference values at 4W EIRP (FCC) — free-space is the vendor’s best day</text>

  <!-- table -->
  <rect x="56" y="110" width="1088" height="404" rx="14" fill="#ffffff" stroke="#e4c98f" stroke-width="2"/>
  <!-- header -->
  <path d="M56 124 a14 14 0 0 1 14 -14 h1060 a14 14 0 0 1 14 14 v34 h-1088 Z" fill="#291c0e"/>
  <text x="80" y="146" font-size="16" font-weight="800" letter-spacing="0.5" fill="#f4efe4">INLAY FAMILY · CHIP</text>
  <text x="740" y="146" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#f4efe4">FREE-SPACE</text>
  <text x="988" y="146" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#f4efe4">REAL-WORLD (MOUNTED)</text>

  <!-- column dividers -->
  <line x1="640" y1="158" x2="640" y2="514" stroke="#efe7d9" stroke-width="1.5"/>
  <line x1="840" y1="158" x2="840" y2="514" stroke="#efe7d9" stroke-width="1.5"/>

  <!-- row 1 -->
  <rect x="57" y="158" width="1086" height="71" fill="#fbf8f2"/>
  <text x="80" y="188" font-size="19" font-weight="700" fill="#291c0e">Avery Dennison AD-228m6</text>
  <text x="80" y="212" font-size="15" fill="#6d5a3a">Impinj M730 · retail apparel workhorse</text>
  <text x="740" y="198" text-anchor="middle" font-size="18" font-weight="800" fill="#2d6a4f">12–14 m</text>
  <text x="988" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">8–10 m cardboard</text>
  <text x="988" y="212" text-anchor="middle" font-size="15" fill="#8b2d2d">3–4 m on metal</text>

  <!-- row 2 -->
  <rect x="57" y="229" width="1086" height="71" fill="#ffffff"/>
  <text x="80" y="259" font-size="19" font-weight="700" fill="#291c0e">SML GB6 / GB7</text>
  <text x="80" y="283" font-size="15" fill="#6d5a3a">Impinj M750 / M770 · 4-axis omnidirectional</text>
  <text x="740" y="273" text-anchor="middle" font-size="17" fill="#8a949c">—</text>
  <text x="988" y="265" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">6–9 m cardboard</text>
  <text x="988" y="287" text-anchor="middle" font-size="15" fill="#4f4f4f">any orientation</text>

  <!-- row 3 -->
  <rect x="57" y="300" width="1086" height="71" fill="#fbf8f2"/>
  <text x="80" y="330" font-size="19" font-weight="700" fill="#291c0e">Confidex Survivor / Steelwave</text>
  <text x="80" y="354" font-size="15" fill="#6d5a3a">NXP UCODE 9 / Impinj M730 · direct-on-metal</text>
  <text x="740" y="344" text-anchor="middle" font-size="17" fill="#8a949c">—</text>
  <text x="988" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">8–10 m off metal</text>
  <text x="988" y="358" text-anchor="middle" font-size="15" fill="#2c5454">4–7 m on steel</text>

  <!-- row 4 -->
  <rect x="57" y="371" width="1086" height="71" fill="#ffffff"/>
  <text x="80" y="401" font-size="19" font-weight="700" fill="#291c0e">Xerafy Mercury / Cargo Trak</text>
  <text x="80" y="425" font-size="15" fill="#6d5a3a">ruggedised on-metal · IP69K, −40 to +85 °C</text>
  <text x="740" y="415" text-anchor="middle" font-size="17" fill="#8a949c">—</text>
  <text x="988" y="407" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">&gt;12 m on containers</text>
  <text x="988" y="429" text-anchor="middle" font-size="15" fill="#4f4f4f">at 30 dBm</text>

  <!-- row 5 -->
  <rect x="57" y="442" width="1086" height="71" fill="#fbf8f2"/>
  <text x="80" y="472" font-size="19" font-weight="700" fill="#291c0e">Times-7 A5020 / A6033 + Impinj R720</text>
  <text x="80" y="496" font-size="15" fill="#6d5a3a">portal / tunnel antenna configuration</text>
  <text x="740" y="486" text-anchor="middle" font-size="17" fill="#8a949c">—</text>
  <text x="988" y="478" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">8–12 m portal</text>
  <text x="988" y="500" text-anchor="middle" font-size="15" fill="#4f4f4f">200–500 tags/s</text>

  <text x="600" y="560" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">Then subtract 30–60% for your environment.</text>
  <text x="600" y="600" text-anchor="middle" font-size="16" fill="#6d5a3a">Free-space is where the tag lives; the warehouse is where it has to work.</text>
</svg>
