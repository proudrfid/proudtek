<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Anti-counterfeiting for event tickets: from a copyable ticket to a bound, validated credential</title>
<desc id="d">The core strategy in three stages. Stage one, an optical ticket — paper, barcode or QR screenshot — can be photographed and duplicated without limit, the failure state. Stage two, an RFID wristband binds the entry to a factory-unique chip UID, one identity that cannot be cloned on standard chips. Stage three, the gate validates that UID against a central whitelist and accepts it only if it is on the list and being scanned for the first time, rejecting clones or reused UIDs. The point: optical tickets copy without limit; a bound, validated UID does not.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="58" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EVENT TICKETING · ANTI-COUNTERFEIT RFID</text>
<text x="600" y="104" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#291c0e">Make the ticket impossible to fake</text>
<text x="600" y="140" text-anchor="middle" font-size="16" fill="#4f4f4f">Bind each entry to a chip UID, then validate it in real time at the gate.</text>

<!-- Panel A: optical ticket (risk) -->
