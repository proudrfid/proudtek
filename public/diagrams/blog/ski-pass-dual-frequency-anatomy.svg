<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">One ski pass card, two radio frequencies</title>
<desc id="d">A comparison of the two frequencies on a dual-frequency ski pass card. UHF at 860 to 960 megahertz runs the lift gate: it reads at a 0.5 to 1.5 metre range, through a jacket pocket, for hands-free turnstile access. HF or NFC runs everything else on the resort: locker access, rental check-out and cashless payment, read only on a deliberate close tap so there are no stray reads.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE CARD, TWO RADIOS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The frequency is the design choice: reach for the gate, a deliberate tap for everything else.</text>

<rect x="546" y="104" width="108" height="34" rx="9" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.4"/><text x="600" y="126" text-anchor="middle" font-size="13" font-weight="800" fill="#6d5a3a">1 CARD</text>
<line x1="582" y1="138" x2="430" y2="150" stroke="#e4c98f" stroke-width="1.4"/>
<line x1="618" y1="138" x2="770" y2="150" stroke="#e4c98f" stroke-width="1.4"/>

<rect x="90" y="150" width="490" height="402" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="90" y="150" width="490" height="48" rx="14" fill="#3d6b6b"/>
<text x="335" y="181" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">UHF · THE LIFT GATE</text>
<text x="335" y="254" text-anchor="middle" font-size="27" font-weight="800" fill="#234a4a">860-960 MHz</text>
<circle cx="150" cy="300" r="4" fill="#3d6b6b"/><text x="166" y="305" font-size="14.5" fill="#291c0e">Read range 0.5-1.5 m</text>
<circle cx="150" cy="338" r="4" fill="#3d6b6b"/><text x="166" y="343" font-size="14.5" fill="#291c0e">Reads through a jacket pocket</text>
<circle cx="150" cy="376" r="4" fill="#3d6b6b"/><text x="166" y="381" font-size="14.5" fill="#291c0e">Hands-free at the turnstile</text>
<text x="335" y="446" text-anchor="middle" font-size="12.5" fill="#5c5c5c">card detected while still approaching</text>
<line x1="150" y1="478" x2="520" y2="478" stroke="#cbb98f" stroke-width="2"/>
<rect x="300" y="472" width="220" height="12" rx="6" fill="#cfe0e0"/>
<line x1="150" y1="472" x2="150" y2="484" stroke="#cbb98f" stroke-width="2"/><line x1="520" y1="472" x2="520" y2="484" stroke="#cbb98f" stroke-width="2"/>
<text x="150" y="500" text-anchor="middle" font-size="12" fill="#8a8a8a">gate</text>
<text x="410" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">reads 0.5-1.5 m out</text>

<rect x="620" y="150" width="490" height="402" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="620" y="150" width="490" height="48" rx="14" fill="#4a5568"/>
<text x="865" y="181" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">HF / NFC · ON-RESORT</text>
<text x="865" y="254" text-anchor="middle" font-size="25" font-weight="800" fill="#3a4657">Tap, up close</text>
<circle cx="680" cy="300" r="4" fill="#4a5568"/><text x="696" y="305" font-size="14.5" fill="#291c0e">Locker access &amp; rental check-out</text>
<circle cx="680" cy="338" r="4" fill="#4a5568"/><text x="696" y="343" font-size="14.5" fill="#291c0e">Cashless payment at the lodge</text>
<circle cx="680" cy="376" r="4" fill="#4a5568"/><text x="696" y="381" font-size="14.5" fill="#291c0e">Deliberate tap — no stray reads</text>
<rect x="760" y="440" width="86" height="60" rx="8" fill="#eef1f5" stroke="#c3ccd8" stroke-width="1.6"/><text x="803" y="475" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4657">reader</text>
<rect x="900" y="452" width="120" height="38" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/><text x="960" y="476" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4657">card</text>
<line x1="882" y1="471" x2="896" y2="471" stroke="#4a5568" stroke-width="2.4"/><polygon points="882,466 872,471 882,476" fill="#4a5568"/>
<text x="865" y="524" text-anchor="middle" font-size="12" fill="#8a8a8a">hold the card to the reader</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Same plastic, two antennas — the gate gets the reach, the locker gets the tap.</text>
</svg>
