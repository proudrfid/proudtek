<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">PVC, metal or wood — how the handshake feels</title>
<desc id="d">Three material panels. PVC: standard CR80 card, 85.6 by 54 millimetres, full-colour printing, the affordable default. Metal: premium weight, needs a ferrite shielding layer and a non-metal antenna window, reads at 2-3 centimetres — always request a read-test sample. Wood: bamboo, cherry or walnut veneer with laser engraving for the sharpest detail. Footnote: recycled PVC and PLA bio-cards perform identically to standard PVC.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<pattern id="grain" width="18" height="8" patternUnits="userSpaceOnUse"><rect width="18" height="8" fill="#e8cfa4"/><path d="M 0 4 q 4.5 -2.5 9 0 t 9 0" stroke="#c39a5f" stroke-width="1" fill="none"/></pattern>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE FEEL OF THE HANDSHAKE</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Same chip inside — three very different first impressions</text>

<rect x="52" y="130" width="356" height="410" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="230" y="168" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">PVC</text>
<rect x="105" y="196" width="250" height="150" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<rect x="105" y="196" width="250" height="44" rx="12" fill="#d4a755"/>
<text x="230" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#291c0e">full-colour print · foil · spot UV</text>
<text x="230" y="310" text-anchor="middle" font-size="12" fill="#4f4f4f">CR80 · 85.6 × 54 mm · 0.76 mm</text>
<text x="230" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6f3a">the affordable default</text>
<text x="230" y="420" text-anchor="middle" font-size="12.5" fill="#4f4f4f">widest design flexibility</text>
<text x="230" y="444" text-anchor="middle" font-size="12.5" fill="#4f4f4f">read range 3–5 cm</text>
<text x="230" y="502" text-anchor="middle" font-size="12" fill="#6d5a3a">best for: whole-team rollouts</text>

<rect x="422" y="130" width="356" height="410" rx="14" fill="#eef1f5" stroke="#4a5568" stroke-width="1.5"/>
<text x="600" y="168" text-anchor="middle" font-size="17" font-weight="800" fill="#4a5568">METAL</text>
<rect x="475" y="196" width="250" height="150" rx="12" fill="#4a5568"/>
<rect x="634" y="212" width="76" height="50" rx="8" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.5"/>
<text x="674" y="234" text-anchor="middle" font-size="12" fill="#4a5568">antenna</text>
<text x="674" y="248" text-anchor="middle" font-size="12" fill="#4a5568">window</text>
<text x="530" y="240" font-size="13" font-weight="700" fill="#eef1f5">matte black,</text>
<text x="530" y="262" font-size="13" font-weight="700" fill="#eef1f5">real weight</text>
<rect x="475" y="352" width="250" height="12" rx="3" fill="#d3dae3"/>
<text x="600" y="388" text-anchor="middle" font-size="12" fill="#4f4f4f">ferrite layer under the antenna — mandatory</text>
<text x="600" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#4a5568">premium heft, one physics footnote</text>
<text x="600" y="444" text-anchor="middle" font-size="12.5" fill="#4f4f4f">read range 2–3 cm with proper engineering</text>
<text x="600" y="502" text-anchor="middle" font-size="12" fill="#8b2d2d">always read-test a sample before production</text>

<rect x="792" y="130" width="356" height="410" rx="14" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="970" y="168" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">WOOD</text>
<rect x="845" y="196" width="250" height="150" rx="12" fill="url(#grain)" stroke="#c39a5f" stroke-width="2"/>
<text x="970" y="278" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="15" font-weight="700" fill="#5a4520">laser-engraved</text>
<text x="970" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6f3a">grain nobody else has</text>
<text x="970" y="420" text-anchor="middle" font-size="12.5" fill="#4f4f4f">bamboo · cherry · walnut veneer</text>
<text x="970" y="444" text-anchor="middle" font-size="12.5" fill="#4f4f4f">over a PVC or paper core + inlay</text>
<text x="970" y="502" text-anchor="middle" font-size="12" fill="#6d5a3a">best for: brands selling craft &amp; character</text>

<text x="600" y="586" text-anchor="middle" font-size="13.5" fill="#1b4332" font-weight="600">Sustainability route: recycled PVC and PLA bio-cards — identical NFC performance to standard PVC.</text>
<text x="600" y="626" text-anchor="middle" font-size="13" fill="#5c5c5c">Chip decides what the card says; material decides how it feels saying it.</text>
</svg>
