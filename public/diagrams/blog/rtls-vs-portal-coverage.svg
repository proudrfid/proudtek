<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Portal-only RFID versus full RTLS: coverage, cost, and how to phase them</title>
<desc id="d">A comparison. Portal-only deployments capture asset position only at portal-crossing events and cost one third to one fifth of full RTLS — the right starting point for most warehouses. Full RTLS adds ceiling readers such as the Zebra ATR7000 and Impinj xArray for continuous location to within 2 feet or 0.6 metres, justified when assets dwell in zones. The recommended phasing: year one portals on all docks and zone lines, year two RTLS in one or two high-value zones.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PORTAL-ONLY VS FULL RTLS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Coverage versus capex — most warehouses phase from one to the other.</text>

<line x1="600" y1="120" x2="600" y2="486" stroke="#e6dfd2" stroke-width="2"/>

