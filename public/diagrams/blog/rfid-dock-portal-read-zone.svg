<polygon points="392,423 410,430 392,437" fill="#291c0e"/>
<text x="318" y="424" text-anchor="middle" font-size="12.5" fill="#5c5c5c">pallet rolls through</text>

<!-- RIGHT · portal design facts -->
<text x="628" y="176" font-size="14" font-weight="800" letter-spacing="0.5" fill="#a07d43">PORTAL DESIGN FACTS</text>
<rect x="628" y="188" width="16" height="16" rx="4" fill="#4a5568"/>
<text x="656" y="201" font-size="16.5" font-weight="800" fill="#291c0e">2-4 antennas per door frame</text>
<text x="656" y="223" font-size="14" fill="#5c5c5c">mounted to build one continuous capture zone</text>
<line x1="628" y1="246" x2="1150" y2="246" stroke="#efe7d6" stroke-width="1.5"/>
<rect x="628" y="262" width="16" height="16" rx="4" fill="#2c5454"/>
<text x="656" y="275" font-size="16.5" font-weight="800" fill="#291c0e">Pallets, carts and cartons</text>
<text x="656" y="297" font-size="14" fill="#5c5c5c">all read together in a single pass</text>
<line x1="628" y1="320" x2="1150" y2="320" stroke="#efe7d6" stroke-width="1.5"/>
<rect x="628" y="336" width="16" height="16" rx="4" fill="#c39a5f"/>
<text x="656" y="349" font-size="16.5" font-weight="800" fill="#291c0e">EPC Gen2 Q-algorithm</text>
<text x="656" y="371" font-size="14" fill="#5c5c5c">hundreds of tags read at once, no collisions</text>
<line x1="628" y1="394" x2="1150" y2="394" stroke="#efe7d6" stroke-width="1.5"/>
<rect x="628" y="410" width="16" height="16" rx="4" fill="#1f6f3a"/>
<text x="656" y="423" font-size="16.5" font-weight="800" fill="#291c0e">Conveyor variants up to 3 m/s</text>
<text x="656" y="445" font-size="14" fill="#5c5c5c">belt-speed capture on automated lines</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Accuracy is set by antenna placement, power tuning and tag orientation — commission it, don't eyeball it.</text>
</svg>
