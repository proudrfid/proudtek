<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Measured results after 90 days — restaurant NFC review card program</title>
  <desc id="d">Bar comparison of Google reviews per store per month. The control period averaged 14 reviews per store per month; the first 90 days of deployment averaged 43 — a 3.07 times lift. Three result chips: chain-wide rating moved from 4.2 to 4.4 stars; review sentiment was 91% four- or five-star versus 84% in the control; NFC tap-to-review conversion was 2.1% versus 0.7% for QR. All figures are the customer's reported results across 412 stores.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT 90 DAYS CHANGED</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Google reviews per store per month — control vs deployment</text>

  <!-- bar 1: control -->
  <text x="60" y="168" font-size="15" font-weight="700" fill="#291c0e">Control</text>
  <text x="60" y="188" font-size="12.5" fill="#5c5c5c">last 90 days pre-deployment</text>
  <rect x="360" y="150" width="211" height="48" rx="6" fill="#4a5568"/>
  <text x="376" y="180" font-size="15" font-weight="700" fill="#ffffff">14 / store / month</text>

  <!-- bar 2: deployment -->
  <text x="60" y="268" font-size="15" font-weight="700" fill="#291c0e">Deployment</text>
  <text x="60" y="288" font-size="12.5" fill="#c39a5f">first 90 days · 3.07× lift</text>
  <rect x="360" y="250" width="648" height="48" rx="6" fill="#3d6b6b"/>
  <text x="376" y="280" font-size="15" font-weight="700" fill="#ffffff">43 / store / month</text>

  <line x1="360" y1="316" x2="1008" y2="316" stroke="#e6dfd2" stroke-width="2"/>
  <text x="360" y="336" font-size="12" fill="#9aa4b2">0</text>
  <text x="1008" y="336" text-anchor="end" font-size="12" fill="#9aa4b2">reviews / store / month</text>

  <!-- result chips -->
  <rect x="60" y="360" width="340" height="110" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="230" y="392" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">CHAIN-WIDE RATING</text>
  <text x="230" y="428" text-anchor="middle" font-size="26" font-weight="800" fill="#2c5454">4.2 → 4.4</text>
  <text x="230" y="452" text-anchor="middle" font-size="12.5" fill="#5c5c5c">+0.2 stars chain-wide</text>

  <rect x="430" y="360" width="340" height="110" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="392" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">REVIEW SENTIMENT</text>
  <text x="600" y="428" text-anchor="middle" font-size="26" font-weight="800" fill="#2c5454">91% vs 84%</text>
  <text x="600" y="452" text-anchor="middle" font-size="12.5" fill="#5c5c5c">4- or 5-star reviews vs control</text>

  <rect x="800" y="360" width="340" height="110" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="970" y="392" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">TAP CONVERSION</text>
  <text x="970" y="428" text-anchor="middle" font-size="26" font-weight="800" fill="#2c5454">2.1% vs 0.7%</text>
  <text x="970" y="452" text-anchor="middle" font-size="12.5" fill="#5c5c5c">NFC tap vs QR code</text>

  <rect x="60" y="500" width="1080" height="60" rx="12" fill="#fbf7ee" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="600" y="536" text-anchor="middle" font-size="14" font-weight="600" fill="#3d6b6b">Reported results across all 412 stores over the first 90 days — measured, not modelled</text>
</svg>
