<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NFC chip user memory compared, from 48 bytes to 8 KB</title>
<desc id="d">A horizontal bar chart of NFC chip user memory on a logarithmic scale. MIFARE DESFire EV3 holds up to 8 KB, NTAG I2C Plus 1,912 bytes, NTAG216 888 bytes, NTAG215 504 bytes, NTAG 424 DNA 416 bytes, NTAG213 144 bytes and MIFARE Ultralight 48 bytes. A marker at 144 bytes notes that most projects fit at or below NTAG213's capacity.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NFC CHIP MEMORY COMPARISON</text>
<text x="600" y="94" text-anchor="middle" font-size="34" font-weight="800" font-family="Lora, Georgia, serif" fill="#291c0e">How much each NFC chip actually holds</text>
<text x="600" y="122" text-anchor="middle" font-size="15" fill="#4f4f4f">User memory, log scale — the range spans 48 bytes to 8 KB, but most projects live at the small end.</text>

<!-- most-projects marker -->
<line x1="514" y1="150" x2="514" y2="492" stroke="#c39a5f" stroke-width="2.2" stroke-dasharray="6 5"/>
<text x="514" y="146" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">≈144 B covers most projects</text>

<!-- bars (descending memory) -->
<text x="300" y="183" text-anchor="end" font-size="14.5" font-weight="800" fill="#291c0e">MIFARE DESFire EV3</text>
<rect x="340" y="163" width="740" height="30" rx="6" fill="#c39a5f"/>
<text x="1066" y="183" text-anchor="end" font-size="14" font-weight="800" fill="#ffffff">up to 8 KB</text>

<text x="300" y="231" text-anchor="end" font-size="14.5" font-weight="800" fill="#291c0e">NTAG I2C Plus</text>
<rect x="340" y="211" width="536" height="30" rx="6" fill="#3d6b6b"/>
<text x="888" y="231" font-size="14" font-weight="800" fill="#2c5454">1,912 B</text>

<text x="300" y="279" text-anchor="end" font-size="14.5" font-weight="800" fill="#291c0e">NTAG216</text>
<rect x="340" y="259" width="428" height="30" rx="6" fill="#3d6b6b"/>
<text x="780" y="279" font-size="14" font-weight="800" fill="#2c5454">888 B</text>

<text x="300" y="327" text-anchor="end" font-size="14.5" font-weight="800" fill="#291c0e">NTAG215</text>
<rect x="340" y="307" width="350" height="30" rx="6" fill="#3d6b6b"/>
<text x="702" y="327" font-size="14" font-weight="800" fill="#2c5454">504 B</text>

<text x="300" y="375" text-anchor="end" font-size="14.5" font-weight="800" fill="#291c0e">NTAG 424 DNA</text>
<rect x="340" y="355" width="323" height="30" rx="6" fill="#2c5454"/>
<text x="675" y="375" font-size="14" font-weight="800" fill="#2c5454">416 B</text>

<text x="300" y="423" text-anchor="end" font-size="14.5" font-weight="800" fill="#291c0e">NTAG213</text>
<rect x="340" y="403" width="174" height="30" rx="6" fill="#1f6f3a"/>
<text x="524" y="423" font-size="14" font-weight="800" fill="#1f6f3a">144 B ✓</text>

<text x="300" y="471" text-anchor="end" font-size="14.5" font-weight="800" fill="#291c0e">MIFARE Ultralight</text>
<rect x="340" y="451" width="20" height="30" rx="6" fill="#1f6f3a"/>
<text x="370" y="471" font-size="14" font-weight="800" fill="#1f6f3a">48 B</text>

<text x="600" y="560" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">The right question is rarely "which holds the most" — it's "how little do I actually need."</text>
<text x="600" y="592" text-anchor="middle" font-size="13.5" fill="#5c5c5c">A single URL fits in 48–144 bytes; capacity above that earns its cost only for vCards, multi-record or offline data.</text>
</svg>
