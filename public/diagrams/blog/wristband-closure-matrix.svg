<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Wristband closure options by material, their failure modes and mitigations</title>
<desc id="d">Seven closure options across the three materials, each with a failure mode and a mitigation. Silicone sized-loop fails on wrong-size fit; mitigate by stocking five to six sizes and fit-training staff. Silicone pull-tight over-tightens or loosens; best for one to three day wear. Silicone snap-lock can snap prematurely at check-in; mitigate with staff training and spare stock. Fabric adhesive can be applied too loose or too tight; mitigate with staff training and entry QC. Woven plastic slider can be left unseated; mitigate with an application demo and audit. Woven metal bead can rarely loosen on wrist flex; mitigate with a quality supplier and batch spot-check. Woven tear-tab can tear accidentally; offer it as self-service removal.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="48" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CLOSURES · WHERE PROGRAMS ACTUALLY FAIL</text>
<text x="600" y="76" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Most wristband failures are closure failures, not material failures.</text>

<text x="92" y="104" font-size="12" font-weight="800" letter-spacing="0.6" fill="#6d5a3a">CLOSURE</text>
<text x="446" y="104" font-size="12" font-weight="800" letter-spacing="0.6" fill="#8b2d2d">FAILURE MODE</text>
<text x="812" y="104" font-size="12" font-weight="800" letter-spacing="0.6" fill="#1f6f3a">MITIGATION</text>

<!-- rows -->
<g font-size="13.5">
<rect x="64" y="114" width="1072" height="60" rx="9" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<rect x="64" y="114" width="8" height="60" rx="4" fill="#3d6b6b"/>
<text x="92" y="140" font-weight="800" fill="#291c0e">Silicone sized-loop</text>
<text x="92" y="160" font-size="12" fill="#5c5c5c">continuous loop, no mechanism</text>
<text x="446" y="150" fill="#333333">Wrong size: loose falls off, tight cuts in</text>
<text x="812" y="150" fill="#333333">Stock 5–6 sizes, fit-train staff</text>

<rect x="64" y="178" width="1072" height="58" rx="9" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<rect x="64" y="178" width="8" height="58" rx="4" fill="#3d6b6b"/>
<text x="92" y="213" font-weight="800" fill="#291c0e">Silicone pull-tight</text>
<text x="446" y="213" fill="#333333">Over-tightens, or loosens in hard activity</text>
<text x="812" y="213" fill="#333333">Best kept to 1–3 day wear</text>

<rect x="64" y="240" width="1072" height="58" rx="9" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<rect x="64" y="240" width="8" height="58" rx="4" fill="#3d6b6b"/>
<text x="92" y="268" font-weight="800" fill="#291c0e">Silicone snap-lock</text>
<text x="92" y="287" font-size="12" fill="#5c5c5c">tamper-evident, cut to remove</text>
<text x="446" y="275" fill="#333333">Premature snap at check-in</text>
<text x="812" y="275" fill="#333333">Staff training + spare stock</text>

<rect x="64" y="302" width="1072" height="58" rx="9" fill="#eef1f4" stroke="#c3ccd8" stroke-width="1.2"/>
<rect x="64" y="302" width="8" height="58" rx="4" fill="#4a5568"/>
<text x="92" y="337" font-weight="800" fill="#291c0e">Fabric adhesive</text>
<text x="446" y="330" fill="#333333">Too loose (off in 24 h) or too tight</text>
<text x="446" y="349" font-size="12" fill="#8b2d2d">staff technique is the dominant variable</text>
<text x="812" y="337" fill="#333333">Staff training + entry QC</text>

<rect x="64" y="364" width="1072" height="58" rx="9" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<rect x="64" y="364" width="8" height="58" rx="4" fill="#c39a5f"/>
<text x="92" y="399" font-weight="800" fill="#291c0e">Woven plastic slider</text>
<text x="92" y="418" font-size="12" fill="#5c5c5c">most common woven closure</text>
<text x="446" y="399" fill="#333333">Slider not seated → band loosens</text>
<text x="812" y="399" fill="#333333">Application demo + audit</text>

<rect x="64" y="426" width="1072" height="58" rx="9" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<rect x="64" y="426" width="8" height="58" rx="4" fill="#c39a5f"/>
<text x="92" y="461" font-weight="800" fill="#291c0e">Woven metal bead</text>
<text x="92" y="480" font-size="12" fill="#5c5c5c">highest perceived quality</text>
<text x="446" y="461" fill="#333333">Rare loosen on extreme wrist flex</text>
<text x="812" y="461" fill="#333333">Quality supplier + batch spot-check</text>

<rect x="64" y="488" width="1072" height="58" rx="9" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<rect x="64" y="488" width="8" height="58" rx="4" fill="#c39a5f"/>
<text x="92" y="523" font-weight="800" fill="#291c0e">Woven tear-tab</text>
<text x="446" y="523" fill="#333333">Accidental tear mid-event</text>
<text x="812" y="523" fill="#333333">Offer as self-service removal</text>
</g>

<text x="600" y="586" text-anchor="middle" font-size="14" fill="#291c0e">The closure line is also the anti-transfer line — read it twice before you order.</text>
</svg>
