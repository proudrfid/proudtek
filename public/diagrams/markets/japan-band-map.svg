<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">UHF RFID band map — Japan's 920 MHz band versus the US and EU bands</title>
  <desc id="d">A frequency map of the UHF RFID bands: the United States uses 902-928 MHz under FCC Part 15, the European Union uses 865-868 MHz, and Japan uses the 920 MHz band — 916.7-920.9 MHz for high-power readers (up to 1 W conducted, 4 W EIRP) under ARIB STD-T106, and 916.7-923.5 MHz for specified-low-power devices (250 mW) under ARIB STD-T107, regulated by MIC under the Radio Act. Japan's band sits inside the upper part of the US band but does not overlap the EU 865-868 MHz band, so EU-tuned inlays underperform in Japan and inlays must be specified for the 920 MHz band on the purchase order.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">GET THE BAND RIGHT — JAPAN IS THE 920 MHz BAND</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Inlay antennas are tuned per band — EU 865-868 stock reads short on a Japanese portal</text>

  <!-- axis 860 .. 930 MHz mapped to x 120..1080 (70 MHz over 960px => 13.71 px/MHz) -->
  <line x1="120" y1="470" x2="1080" y2="470" stroke="#c3ccd6" stroke-width="2"/>
  <text x="188" y="496" font-size="12" fill="#9aa4b2">&#9664; lower band (EU)</text>
  <text x="1052" y="496" text-anchor="end" font-size="12" fill="#9aa4b2">upper band (US / Japan) &#9654;</text>

  <!-- EU 865-868 => x 188..229 -->
  <rect x="188" y="150" width="41" height="52" rx="5" fill="#eef2f5" stroke="#9fb8c2" stroke-width="2"/>
  <text x="140" y="181" font-size="15" font-weight="700" fill="#4a5568">EU</text>
  <text x="234" y="176" font-size="13" fill="#5c5c5c">865-868 MHz</text>
  <text x="234" y="194" font-size="12" fill="#9aa4b2">ETSI EN 302 208</text>

  <!-- US 902-928 => x 696..1052 -->
  <rect x="696" y="224" width="356" height="52" rx="5" fill="#eef2f5" stroke="#9fb8c2" stroke-width="2"/>
  <text x="140" y="255" font-size="15" font-weight="700" fill="#4a5568">US</text>
  <text x="716" y="255" font-size="13" fill="#291c0e">902-928 MHz (United States)</text>

  <!-- Japan low-power 916.7-923.5 => x 897..991 (light) ; high-power 916.7-920.9 => x 897..955 (solid) -->
  <rect x="897" y="298" width="94" height="60" rx="5" fill="#d7e6e6" stroke="#6c9a9a" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="897" y="298" width="58" height="60" rx="5" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
  <text x="926" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">1 W</text>
  <text x="973" y="290" text-anchor="middle" font-size="12" fill="#5c8686">250 mW</text>
  <text x="140" y="335" font-size="15" font-weight="800" fill="#2c5454">JAPAN</text>
  <text x="120" y="406" font-size="14" font-weight="700" fill="#2c5454">Japan &#183; 920 MHz band &#183; MIC Radio Act &#183; ARIB STD-T106 / T107</text>
  <text x="120" y="428" font-size="13" fill="#3d6b6b">916.7-920.9 MHz high-power (1 W / 4 W EIRP)  |  916.7-923.5 MHz low-power (250 mW)</text>
  <line x1="926" y1="358" x2="926" y2="392" stroke="#2c5454" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- containment guides: Japan sits inside the US band -->
  <line x1="897" y1="276" x2="897" y2="298" stroke="#b9c0cc" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="991" y1="276" x2="991" y2="298" stroke="#b9c0cc" stroke-width="1.5" stroke-dasharray="3 3"/>

  <rect x="120" y="530" width="960" height="88" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="142" y="558" font-size="14.5" font-weight="700" fill="#2c5454">Japan's 920 MHz band sits inside the upper US band — and nowhere near the EU band</text>
  <text x="142" y="580" font-size="13" fill="#3d6b6b">916.7-920.9 MHz overlaps the top of the US 902-928 MHz allocation, so US-style inlays are close; EU 865-868 MHz inlays are not.</text>
  <text x="142" y="600" font-size="13" fill="#5c5c5c">Specify 920 MHz-band tuning on the PO. NFC and access cards at 13.56 MHz (HF) are global and unaffected.</text>
</svg>
