<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five ROI levers of an RFID sponge-counting program</title>
<desc id="d">The dominant lever is the avoided retained-sponge event: each averages 200 thousand to 1 million dollars, and a ten-OR hospital with about 1.5 expected events per year saves 300 thousand to 1.5 million dollars annually. Four further levers: reduced manual count time saves 180 to 360 thousand dollars a year; lower malpractice premiums save 200 to 800 thousand dollars a year for a 200-bed hospital; improved Joint Commission survey performance is an indirect benefit through CMS pay-for-performance; and avoided additional surgery saves 30 to 100 thousand dollars per removed-sponge case.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE ROI LEVERS</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Dominated by one line item — the retained-sponge event that never happens.</text>

<!-- dominant lever -->
<rect x="80" y="122" width="1040" height="98" rx="14" fill="#eef7f0" stroke="#1f6f3a" stroke-width="2.4"/>
<text x="112" y="158" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">DOMINANT LEVER</text>
<text x="112" y="186" font-size="17" font-weight="800" fill="#291c0e">Avoided retained-sponge event</text>
<text x="112" y="208" font-size="12.5" fill="#5c5c5c">$200K-1M each · ~1.5 expected events per year at a 10-OR hospital</text>
<rect x="852" y="144" width="248" height="54" rx="12" fill="#ffffff" stroke="#1f6f3a" stroke-width="1.8"/>
<text x="976" y="177" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6f3a">$300K-1.5M / yr</text>

<!-- lever 2 -->
<rect x="80" y="238" width="1040" height="64" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="80" y="238" width="8" height="64" rx="4" fill="#3d6b6b"/>
<text x="112" y="266" font-size="15" font-weight="800" fill="#291c0e">Reduced manual count time</text>
<text x="112" y="288" font-size="12.5" fill="#5c5c5c">5-10 min/case · 6,000 cases/yr × $30 OR-staff cost</text>
<text x="1096" y="277" text-anchor="end" font-size="15.5" font-weight="800" fill="#2c5454">$180K-360K / yr</text>

<!-- lever 3 -->
<rect x="80" y="316" width="1040" height="64" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="80" y="316" width="8" height="64" rx="4" fill="#3d6b6b"/>
<text x="112" y="344" font-size="15" font-weight="800" fill="#291c0e">Lower malpractice premium</text>
<text x="112" y="366" font-size="12.5" fill="#5c5c5c">5-15% lower with a documented prevention program · 200-bed hospital</text>
<text x="1096" y="355" text-anchor="end" font-size="15.5" font-weight="800" fill="#2c5454">$200K-800K / yr</text>

<!-- lever 4 -->
<rect x="80" y="394" width="1040" height="64" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="80" y="394" width="8" height="64" rx="4" fill="#4a5568"/>
<text x="112" y="422" font-size="15" font-weight="800" fill="#291c0e">Joint Commission survey performance</text>
<text x="112" y="444" font-size="12.5" fill="#5c5c5c">Better patient-safety scores · CMS pay-for-performance</text>
<text x="1096" y="433" text-anchor="end" font-size="14.5" font-weight="800" fill="#3f4a5c">indirect</text>

<!-- lever 5 -->
<rect x="80" y="472" width="1040" height="64" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="80" y="472" width="8" height="64" rx="4" fill="#3d6b6b"/>
<text x="112" y="500" font-size="15" font-weight="800" fill="#291c0e">Avoided additional surgery</text>
<text x="112" y="522" font-size="12.5" fill="#5c5c5c">Removed-sponge reoperation plus extended length of stay</text>
<text x="1096" y="511" text-anchor="end" font-size="15.5" font-weight="800" fill="#2c5454">$30K-100K / case</text>

<text x="600" y="566" text-anchor="middle" font-size="12.5" fill="#8a8a8a">Figures are the post's business-case estimates; verify against your own case volume and payer mix.</text>
</svg>
