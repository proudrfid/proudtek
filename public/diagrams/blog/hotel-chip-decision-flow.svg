<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Decision flow for choosing a hotel key card chip</title>
<desc id="d">Three conditions map to three chips. If all locks are legacy Classic-only with no upgrade planned within three years, specify Classic 1K to minimize cost. If a lock migration is underway or planned within two years, specify MIFARE Plus EV2, which runs in Classic mode now and switches to AES later. If installing new locks or meeting a brand-mandated security standard, specify DESFire EV3 from the outset. In every case, test a 50-card sample across every lock model before the production order, and check encoder compatibility.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CHOOSING THE RIGHT CHIP · DECISION FLOW</text>
<text x="600" y="78" text-anchor="middle" font-size="15" fill="#4f4f4f">Map three questions to one chip — then sample before you commit.</text>

<text x="378" y="122" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.7" fill="#8a6d34">IF YOUR LOCK ESTATE —</text>
<text x="945" y="122" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.7" fill="#8a6d34">— SPECIFY</text>

<!-- row 1 -->
<rect x="70" y="138" width="616" height="92" rx="13" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<circle cx="106" cy="184" r="17" fill="#4a5568"/>
<text x="106" y="190" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
<text x="140" y="178" font-size="17" font-weight="800" fill="#291c0e">All locks legacy Classic-only</text>
<text x="140" y="204" font-size="13.5" fill="#5c5c5c">no upgrade planned within 3 years</text>
<path d="M 694 184 L 748 184" stroke="#c39a5f" stroke-width="3"/>
<path d="M 742 176 L 756 184 L 742 192 Z" fill="#c39a5f"/>
<rect x="760" y="138" width="370" height="92" rx="13" fill="#f4f6f9" stroke="#4a5568" stroke-width="1.6"/>
<text x="784" y="182" font-size="19" font-weight="800" fill="#2f3846">Classic 1K</text>
<text x="784" y="206" font-size="13.5" fill="#5c5c5c">minimize cost</text>
<rect x="1058" y="166" width="48" height="36" rx="5" fill="#ffffff" stroke="#4a5568" stroke-width="1.8"/>
<rect x="1068" y="176" width="16" height="13" rx="2" fill="#8895a7"/>

<!-- row 2 -->
<rect x="70" y="246" width="616" height="92" rx="13" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<circle cx="106" cy="292" r="17" fill="#c39a5f"/>
<text x="106" y="298" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<text x="140" y="286" font-size="17" font-weight="800" fill="#291c0e">A lock migration is underway</text>
<text x="140" y="312" font-size="13.5" fill="#5c5c5c">or planned within 2 years</text>
<path d="M 694 292 L 748 292" stroke="#c39a5f" stroke-width="3"/>
<path d="M 742 284 L 756 292 L 742 300 Z" fill="#c39a5f"/>
<rect x="760" y="246" width="370" height="92" rx="13" fill="#fbf4e6" stroke="#c39a5f" stroke-width="1.6"/>
<text x="784" y="290" font-size="19" font-weight="800" fill="#6d5a3a">MIFARE Plus EV2</text>
<text x="784" y="314" font-size="13.5" fill="#8a6d34">Classic now, AES later</text>
<rect x="1058" y="274" width="48" height="36" rx="5" fill="#ffffff" stroke="#c39a5f" stroke-width="1.8"/>
<rect x="1068" y="284" width="16" height="13" rx="2" fill="#d4a755"/>

<!-- row 3 -->
<rect x="70" y="354" width="616" height="92" rx="13" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<circle cx="106" cy="400" r="17" fill="#3d6b6b"/>
<text x="106" y="406" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<text x="140" y="394" font-size="17" font-weight="800" fill="#291c0e">Installing new locks</text>
<text x="140" y="420" font-size="13.5" fill="#5c5c5c">or meeting a brand-mandated standard</text>
<path d="M 694 400 L 748 400" stroke="#c39a5f" stroke-width="3"/>
<path d="M 742 392 L 756 400 L 742 408 Z" fill="#c39a5f"/>
<rect x="760" y="354" width="370" height="92" rx="13" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="784" y="398" font-size="19" font-weight="800" fill="#2c5454">DESFire EV3</text>
<text x="784" y="422" font-size="13.5" fill="#4f4f4f">specify from the outset</text>
<rect x="1058" y="382" width="48" height="36" rx="5" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<rect x="1068" y="392" width="16" height="13" rx="2" fill="#3d6b6b"/>

<!-- always rule -->
<rect x="70" y="466" width="1060" height="96" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<rect x="94" y="496" width="96" height="34" rx="17" fill="#c39a5f"/>
<text x="142" y="518" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.6" fill="#ffffff">ALWAYS</text>
<text x="212" y="504" font-size="17" font-weight="800" fill="#291c0e">Test a 50-card sample across every lock model before the production order.</text>
<text x="212" y="530" font-size="13.5" fill="#5c5c5c">Check encoder compatibility too — some front-desk units need firmware or a hardware swap for DESFire.</text>

<text x="600" y="600" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Three inputs, one chip — the sampling step is what turns the decision into an order.</text>
</svg>
