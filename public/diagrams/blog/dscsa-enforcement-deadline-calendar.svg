<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="calt cald" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="calt">The four-tier DSCSA enforcement deadline calendar</title>
<desc id="cald">DSCSA enforcement lands on four separate deadlines: manufacturers and repackagers on May 27, 2025; wholesale distributors on August 27, 2025; dispensers with 26 or more full-time employees on November 27, 2025; and small dispensers with 25 or fewer licensed pharmacists or technicians exempt until November 27, 2026. Civil fines run up to 500,000 dollars per violation under the FD&amp;C Act, intentional violations add criminal charges and license revocation, and FDA enforcement is widely described as risk-based and progressive.</desc>
