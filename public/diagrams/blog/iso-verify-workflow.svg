<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five-step certificate verification workflow</title>
<desc id="d">A five-step timeline. Step 1, extract the metadata: number, dates, scope and accreditation mark. Step 2, accreditation check: UKAS, ANAB or CNAS national directory. Step 3, portal lookup on certipedia, SGS, BSI, DNV or Bureau Veritas — flagged as the step where forgeries usually fall apart. Step 4, tri-logo and IAF MLA cross-check at iaf.nu with watermarks in place. Step 5, scope match: the certificate must cover what you buy, because the scope is binding. A result panel says one structured hour before the first PO catches the 5-15% of certificates that are fake, expired or issued by a non-accredited body — run it on every supplier, even the one your best contact swears by.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RUN THIS BEFORE THE FIRST PO · FIVE MINUTES PER CERTIFICATE</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">The five-step forgery-catching workflow</text>

<rect x="430" y="200" width="240" height="30" rx="15" fill="#f7e3df" stroke="#d9a89e"/>
<text x="550" y="220" text-anchor="middle" font-size="12.5" fill="#8b2d2d">forgeries usually fall apart here</text>
<line x1="550" y1="230" x2="550" y2="246" stroke="#d9a89e" stroke-width="1.5"/>

<line x1="170" y1="280" x2="995" y2="280" stroke="#e6dfd2" stroke-width="3"/>
<path d="M 1008 280 l -14 -7 v 14 z" fill="#c39a5f"/>

<circle cx="170" cy="280" r="30" fill="#2d6a4f"/>
<text x="170" y="287" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">1</text>
<text x="170" y="342" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Extract the metadata</text>
<text x="170" y="366" text-anchor="middle" font-size="12.5" fill="#5c5c5c">number · dates · scope</text>
<text x="170" y="386" text-anchor="middle" font-size="12.5" fill="#5c5c5c">accreditation mark</text>

<circle cx="365" cy="280" r="30" fill="#2d6a4f"/>
<text x="365" y="287" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">2</text>
<text x="365" y="342" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Accreditation check</text>
<text x="365" y="366" text-anchor="middle" font-size="12.5" fill="#5c5c5c">UKAS · ANAB · CNAS</text>
<text x="365" y="386" text-anchor="middle" font-size="12.5" fill="#5c5c5c">national directory</text>

<circle cx="560" cy="280" r="39" fill="none" stroke="#e4c98f" stroke-width="3"/>
<circle cx="560" cy="280" r="30" fill="#c39a5f"/>
<text x="560" y="287" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">3</text>
<text x="560" y="342" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Portal lookup</text>
<text x="560" y="366" text-anchor="middle" font-size="12.5" fill="#5c5c5c">certipedia · SGS · BSI</text>
<text x="560" y="386" text-anchor="middle" font-size="12.5" fill="#5c5c5c">DNV · Bureau Veritas</text>

<circle cx="755" cy="280" r="30" fill="#2d6a4f"/>
<text x="755" y="287" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">4</text>
<text x="755" y="342" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Tri-logo + IAF MLA</text>
<text x="755" y="366" text-anchor="middle" font-size="12.5" fill="#5c5c5c">cross-check at iaf.nu</text>
<text x="755" y="386" text-anchor="middle" font-size="12.5" fill="#5c5c5c">watermarks in place</text>

<circle cx="950" cy="280" r="30" fill="#2d6a4f"/>
<text x="950" y="287" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">5</text>
<text x="950" y="342" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Scope match</text>
<text x="950" y="366" text-anchor="middle" font-size="12.5" fill="#5c5c5c">covers what you buy</text>
<text x="950" y="386" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the scope is binding</text>

