<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A magnet erases a magnetic-stripe card but has no effect on an RFID card</title>
<desc id="d">Two panels compared. On the left, a magnetic-stripe card: a magnet held over the black stripe re-aligns its iron-oxide particles, so the verdict is data erased. On the right, an RFID card whose data lives on a silicon chip and antenna coil: the same magnet does nothing, so the verdict is immune, nothing to erase. The closing line notes that RFID data lives on silicon powered by a 13.56 MHz radio field, so magnetism has nothing to grab.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MAGNET MEETS THE CARD</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">One of these can be demagnetized. The other has nothing to demagnetize.</text>

<!-- LEFT PANEL: magnetic stripe -->
<rect x="60" y="112" width="524" height="452" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="60" y="112" width="524" height="8" rx="4" fill="#4a5568"/>
<text x="322" y="156" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.5" fill="#4a5568">MAGNETIC STRIPE CARD</text>
<text x="322" y="180" text-anchor="middle" font-size="13" fill="#8a8a8a">data stored in the black stripe</text>
<!-- magnet -->
<g transform="translate(322,232)">
<path d="M -26 -22 A 26 26 0 0 0 26 -22 L 26 -22 L 12 -22 A 12 12 0 0 1 -12 -22 Z" fill="#8b2d2d"/>
<path d="M -26 -22 A 26 26 0 0 0 26 -22" fill="none" stroke="#8b2d2d" stroke-width="14" stroke-linecap="butt"/>
<rect x="-27" y="-26" width="14" height="8" fill="#b98a8a"/>
<rect x="13" y="-26" width="14" height="8" fill="#b98a8a"/>
</g>
<line x1="292" y1="254" x2="292" y2="296" stroke="#8b2d2d" stroke-width="2.4" opacity="0.55"/>
<polygon points="287,290 292,300 297,290" fill="#8b2d2d" opacity="0.55"/>
<line x1="322" y1="254" x2="322" y2="296" stroke="#8b2d2d" stroke-width="2.4" opacity="0.55"/>
<polygon points="317,290 322,300 327,290" fill="#8b2d2d" opacity="0.55"/>
<line x1="352" y1="254" x2="352" y2="296" stroke="#8b2d2d" stroke-width="2.4" opacity="0.55"/>
<polygon points="347,290 352,300 357,290" fill="#8b2d2d" opacity="0.55"/>
<!-- card -->
<rect x="182" y="302" width="280" height="150" rx="14" fill="#ffffff" stroke="#cfc8ba" stroke-width="2"/>
<rect x="182" y="320" width="280" height="30" fill="#291c0e"/>
<text x="322" y="404" text-anchor="middle" font-size="12.5" fill="#8a8a8a">iron-oxide stripe · magnetically written</text>
<!-- verdict -->
<rect x="182" y="474" width="280" height="40" rx="20" fill="#f7e7e7" stroke="#8b2d2d" stroke-width="1.6"/>
<text x="322" y="500" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">DATA ERASED</text>
<text x="322" y="540" text-anchor="middle" font-size="13" fill="#5c5c5c">A magnet re-aligns the stripe's particles.</text>

<!-- RIGHT PANEL: RFID -->
<rect x="616" y="112" width="524" height="452" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="616" y="112" width="524" height="8" rx="4" fill="#3d6b6b"/>
<text x="878" y="156" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.5" fill="#2c5454">RFID CARD</text>
<text x="878" y="180" text-anchor="middle" font-size="13" fill="#8a8a8a">data stored on a silicon chip</text>
<!-- magnet -->
<g transform="translate(878,232)">
<path d="M -26 -22 A 26 26 0 0 0 26 -22 L 26 -22 L 12 -22 A 12 12 0 0 1 -12 -22 Z" fill="#8b2d2d"/>
<path d="M -26 -22 A 26 26 0 0 0 26 -22" fill="none" stroke="#8b2d2d" stroke-width="14" stroke-linecap="butt"/>
<rect x="-27" y="-26" width="14" height="8" fill="#b98a8a"/>
<rect x="13" y="-26" width="14" height="8" fill="#b98a8a"/>
</g>
<line x1="848" y1="254" x2="848" y2="296" stroke="#8b2d2d" stroke-width="2.4" opacity="0.4"/>
<polygon points="843,290 848,300 853,290" fill="#8b2d2d" opacity="0.4"/>
<line x1="878" y1="254" x2="878" y2="296" stroke="#8b2d2d" stroke-width="2.4" opacity="0.4"/>
<polygon points="873,290 878,300 883,290" fill="#8b2d2d" opacity="0.4"/>
<line x1="908" y1="254" x2="908" y2="296" stroke="#8b2d2d" stroke-width="2.4" opacity="0.4"/>
<polygon points="903,290 908,300 913,290" fill="#8b2d2d" opacity="0.4"/>
<!-- card with chip + antenna -->
<rect x="738" y="302" width="280" height="150" rx="14" fill="#ffffff" stroke="#cfc8ba" stroke-width="2"/>
<rect x="754" y="316" width="248" height="122" rx="12" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<rect x="768" y="330" width="220" height="94" rx="9" fill="none" stroke="#8fb4b4" stroke-width="1.5"/>
<rect x="856" y="360" width="44" height="40" rx="6" fill="#2c5454"/>
<line x1="856" y1="372" x2="846" y2="372" stroke="#2c5454" stroke-width="2.2"/>
<line x1="856" y1="388" x2="846" y2="388" stroke="#2c5454" stroke-width="2.2"/>
<line x1="900" y1="372" x2="910" y2="372" stroke="#2c5454" stroke-width="2.2"/>
<line x1="900" y1="388" x2="910" y2="388" stroke="#2c5454" stroke-width="2.2"/>
<!-- verdict -->
<rect x="738" y="474" width="280" height="40" rx="20" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.6"/>
<text x="878" y="500" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">IMMUNE — NOTHING TO ERASE</text>
<text x="878" y="540" text-anchor="middle" font-size="13" fill="#5c5c5c">The chip ignores the magnetic field.</text>

<!-- footer -->
<line x1="120" y1="588" x2="1080" y2="588" stroke="#efe7d6" stroke-width="2"/>
<text x="600" y="620" text-anchor="middle" font-size="15" fill="#4f4f4f">RFID data lives on silicon powered by a 13.56 MHz radio field — magnetism has nothing to grab.</text>
</svg>
