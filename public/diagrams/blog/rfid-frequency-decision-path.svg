<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Choosing the right RFID frequency, step by step</title>
<desc id="d">Five-step decision path. Step one, start with the environment: metal and water push toward LF, phone interaction requires HF or NFC, long-range bulk reads require UHF. Step two, check regional regulations, since UHF power and channels vary by country. Step three, respect existing reader infrastructure. Step four, do the whole-system math: UHF tags are cheapest at volume but UHF readers cost more. Step five, sample in the real environment before committing. A caption warns there is no firmware patch for the wrong radio.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE STEPS · ZERO REGRETS</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Pick the band before you pick any hardware</text>

<line x1="180" y1="180" x2="1020" y2="180" stroke="#e4c98f" stroke-width="2.5"/>

<g text-anchor="middle">
<circle cx="180" cy="180" r="26" fill="#c39a5f"/>
<text x="180" y="188" font-size="20" font-weight="800" fill="#ffffff">1</text>
<rect x="80" y="228" width="200" height="150" rx="12" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="180" y="258" font-size="15.5" font-weight="700" fill="#291c0e">Environment first</text>
<text x="180" y="286" font-size="12.5" fill="#4f4f4f">metal &amp; water → LF</text>
<text x="180" y="308" font-size="12.5" fill="#4f4f4f">phone tap → HF / NFC</text>
<text x="180" y="330" font-size="12.5" fill="#4f4f4f">long-range bulk → UHF</text>
<text x="180" y="358" font-size="12" fill="#6d5a3a">where must the tag live?</text>
</g>
<g text-anchor="middle">
<circle cx="390" cy="180" r="26" fill="#c39a5f"/>
<text x="390" y="188" font-size="20" font-weight="800" fill="#ffffff">2</text>
<rect x="290" y="228" width="200" height="150" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="390" y="258" font-size="15.5" font-weight="700" fill="#291c0e">Check regulations</text>
<text x="390" y="286" font-size="12.5" fill="#4f4f4f">UHF power &amp; channels</text>
<text x="390" y="308" font-size="12.5" fill="#4f4f4f">vary by region —</text>
<text x="390" y="330" font-size="12.5" fill="#4f4f4f">FCC · ETSI · SRRC</text>
<text x="390" y="358" font-size="12" fill="#6d5a3a">range assumptions change</text>
</g>
<g text-anchor="middle">
<circle cx="600" cy="180" r="26" fill="#c39a5f"/>
<text x="600" y="188" font-size="20" font-weight="800" fill="#ffffff">3</text>
<rect x="500" y="228" width="200" height="150" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="258" font-size="15.5" font-weight="700" fill="#291c0e">Respect legacy</text>
<text x="600" y="286" font-size="12.5" fill="#4f4f4f">10,000 readers don't</text>
<text x="600" y="308" font-size="12.5" fill="#4f4f4f">migrate overnight —</text>
<text x="600" y="330" font-size="12.5" fill="#4f4f4f">new tags must coexist</text>
<text x="600" y="358" font-size="12" fill="#6d5a3a">multi-year transitions</text>
</g>
<g text-anchor="middle">
<circle cx="810" cy="180" r="26" fill="#c39a5f"/>
<text x="810" y="188" font-size="20" font-weight="800" fill="#ffffff">4</text>
<rect x="710" y="228" width="200" height="150" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="810" y="258" font-size="15.5" font-weight="700" fill="#291c0e">Whole-system math</text>
<text x="810" y="286" font-size="12.5" fill="#4f4f4f">UHF labels &lt; $0.05,</text>
<text x="810" y="308" font-size="12.5" fill="#4f4f4f">but UHF readers cost</text>
<text x="810" y="330" font-size="12.5" fill="#4f4f4f">the most per point</text>
<text x="810" y="358" font-size="12" fill="#6d5a3a">tags + readers + antennas</text>
</g>
<g text-anchor="middle">
<circle cx="1020" cy="180" r="26" fill="#2d6a4f"/>
<text x="1020" y="188" font-size="20" font-weight="800" fill="#ffffff">5</text>
<rect x="920" y="228" width="200" height="150" rx="12" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="1020" y="258" font-size="15.5" font-weight="700" fill="#1b4332">Sample in situ</text>
<text x="1020" y="286" font-size="12.5" fill="#4f4f4f">free samples, RF-tested</text>
<text x="1020" y="308" font-size="12.5" fill="#4f4f4f">in your actual racks,</text>
<text x="1020" y="330" font-size="12.5" fill="#4f4f4f">liquids and walls</text>
<text x="1020" y="358" font-size="12" fill="#1b4332">before production volume</text>
</g>

<rect x="240" y="440" width="720" height="120" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="482" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="22" font-weight="700" fill="#291c0e">There is no firmware patch for the wrong radio.</text>
<text x="600" y="516" text-anchor="middle" font-size="14" fill="#4f4f4f">LF, HF and UHF readers and tags are not interchangeable —</text>
<text x="600" y="538" text-anchor="middle" font-size="14" fill="#4f4f4f">a wrong band choice invalidates the entire hardware investment.</text>
<text x="600" y="620" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Start at the shelf, the drum, the wrist — wherever the tag has to live — and work backwards to the radio.</text>
</svg>
