<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">One tap resolves and authenticates an EU Battery Passport on an NTAG 424 DNA tag</title>
  <desc id="d">A four-step flow: a phone taps the pack at 13.56 MHz; the NTAG 424 DNA chip signs a fresh per-tap CMAC URL with its AES-128 key (Secure Unique NFC message); the registry verifies the signature and the GS1 Digital Link identifier resolves; the Annex XIII passport opens. The battery passport data model then shows six fields resolved from one tap — chemistry (NMC, NCA, LFP), rated capacity and cycle life, carbon footprint per lifecycle stage, state-of-health, recycled content (cobalt, lithium, nickel, lead), and origin with due-diligence. Five access keys (public consumer, owner, service, recycler, regulator) each authenticate to a different AES-128 key via SDM, and a copied URL fails re-verification because the CMAC is regenerated on every tap.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="48" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TAP TO BATTERY PASSPORT — NTAG 424 DNA SUN</text>
  <text x="600" y="80" text-anchor="middle" font-size="15" fill="#5c5c5c">One tap authenticates the pack and opens the Annex XIII passport by access tier</text>

  <!-- step 1 -->
  <rect x="70" y="104" width="235" height="170" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="104" width="235" height="40" rx="14" fill="#3d6b6b"/>
  <text x="187" y="131" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1 &#183; TAP</text>
  <text x="187" y="180" text-anchor="middle" font-size="14" fill="#291c0e">Phone taps the pack</text>
  <text x="187" y="204" text-anchor="middle" font-size="14" fill="#291c0e">at 13.56 MHz</text>
  <text x="187" y="236" text-anchor="middle" font-size="12.5" fill="#5c5c5c">No app — the OS opens</text>
  <text x="187" y="254" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the returned URL</text>

  <!-- step 2 -->
  <rect x="345" y="104" width="235" height="170" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="345" y="104" width="235" height="40" rx="14" fill="#3d6b6b"/>
  <text x="462" y="131" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2 &#183; SUN</text>
  <text x="462" y="180" text-anchor="middle" font-size="14" fill="#291c0e">Chip signs a fresh</text>
  <text x="462" y="204" text-anchor="middle" font-size="14" fill="#291c0e">per-tap CMAC URL</text>
  <text x="462" y="236" text-anchor="middle" font-size="12.5" fill="#5c5c5c">AES-128 key sealed</text>
  <text x="462" y="254" text-anchor="middle" font-size="12.5" fill="#5c5c5c">in the silicon</text>

  <!-- step 3 -->
  <rect x="620" y="104" width="235" height="170" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="620" y="104" width="235" height="40" rx="14" fill="#3d6b6b"/>
  <text x="737" y="131" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3 &#183; VERIFY</text>
  <text x="737" y="180" text-anchor="middle" font-size="14" fill="#291c0e">Registry checks the</text>
  <text x="737" y="204" text-anchor="middle" font-size="14" fill="#291c0e">CMAC signature</text>
  <text x="737" y="236" text-anchor="middle" font-size="12.5" fill="#5c5c5c">GS1 Digital Link</text>
  <text x="737" y="254" text-anchor="middle" font-size="12.5" fill="#5c5c5c">resolves the ID</text>

  <!-- step 4 -->
  <rect x="895" y="104" width="235" height="170" rx="14" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <rect x="895" y="104" width="235" height="40" rx="14" fill="#1f6f3a"/>
  <text x="1012" y="131" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4 &#183; PASSPORT</text>
  <text x="1012" y="192" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6f3a">VERIFIED</text>
  <text x="1012" y="228" text-anchor="middle" font-size="13" fill="#291c0e">The passport opens</text>
  <text x="1012" y="250" text-anchor="middle" font-size="12.5" fill="#5c5c5c">six fields, by tier, below</text>

  <!-- arrows -->
  <polygon points="309,186 337,186 337,180 351,189 337,198 337,192 309,192" fill="#4a5568"/>
  <polygon points="584,186 612,186 612,180 626,189 612,198 612,192 584,192" fill="#4a5568"/>
  <polygon points="859,186 887,186 887,180 901,189 887,198 887,192 859,192" fill="#4a5568"/>

  <!-- data model -->
  <text x="600" y="316" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE BATTERY PASSPORT DATA MODEL — ANNEX XIII</text>

  <rect x="70" y="340" width="170" height="132" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="340" width="170" height="34" rx="12" fill="#6d5a3a"/>
  <text x="155" y="363" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">CHEMISTRY</text>
  <text x="155" y="408" text-anchor="middle" font-size="13.5" fill="#291c0e">NMC · NCA · LFP</text>
  <text x="155" y="436" text-anchor="middle" font-size="12.5" fill="#3d6b6b">cell + materials</text>

  <rect x="248" y="340" width="170" height="132" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="248" y="340" width="170" height="34" rx="12" fill="#6d5a3a"/>
  <text x="333" y="363" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">CAPACITY</text>
  <text x="333" y="408" text-anchor="middle" font-size="13.5" fill="#291c0e">Rated capacity</text>
  <text x="333" y="436" text-anchor="middle" font-size="12.5" fill="#3d6b6b">energy · cycle life</text>

  <rect x="426" y="340" width="170" height="132" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="426" y="340" width="170" height="34" rx="12" fill="#6d5a3a"/>
  <text x="511" y="363" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">CARBON</text>
  <text x="511" y="408" text-anchor="middle" font-size="13.5" fill="#291c0e">Carbon footprint</text>
  <text x="511" y="436" text-anchor="middle" font-size="12.5" fill="#3d6b6b">per lifecycle stage</text>

  <rect x="604" y="340" width="170" height="132" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="604" y="340" width="170" height="34" rx="12" fill="#6d5a3a"/>
  <text x="689" y="363" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">HEALTH</text>
  <text x="689" y="408" text-anchor="middle" font-size="13.5" fill="#291c0e">State-of-health</text>
  <text x="689" y="436" text-anchor="middle" font-size="12.5" fill="#3d6b6b">restricted tier</text>

  <rect x="782" y="340" width="170" height="132" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="782" y="340" width="170" height="34" rx="12" fill="#6d5a3a"/>
  <text x="867" y="363" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">RECYCLED</text>
  <text x="867" y="408" text-anchor="middle" font-size="13.5" fill="#291c0e">Recycled content</text>
  <text x="867" y="436" text-anchor="middle" font-size="12.5" fill="#3d6b6b">Co · Li · Ni · Pb</text>

  <rect x="960" y="340" width="170" height="132" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="960" y="340" width="170" height="34" rx="12" fill="#6d5a3a"/>
  <text x="1045" y="363" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">ORIGIN</text>
  <text x="1045" y="408" text-anchor="middle" font-size="13.5" fill="#291c0e">Origin + sourcing</text>
  <text x="1045" y="436" text-anchor="middle" font-size="12.5" fill="#3d6b6b">due-diligence</text>

  <!-- banner -->
  <rect x="70" y="496" width="1060" height="60" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="90" y="522" font-size="15" font-weight="700" fill="#2c5454">Five access keys, one physical tag</text>
  <text x="90" y="544" font-size="13.5" fill="#3d6b6b">Public consumer, owner, service, recycler and regulator each unlock a different AES-128 key via SDM — one tag, role-appropriate data.</text>

  <text x="600" y="590" text-anchor="middle" font-size="13.5" fill="#5c5c5c">A copied URL fails re-verification — the AES-128 CMAC is regenerated on every tap and cannot be cloned.</text>
</svg>
