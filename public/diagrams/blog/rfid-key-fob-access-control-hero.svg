<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID key fob access control — the fob's anatomy and the frequency-vs-protocol trap</title>
<desc id="d">Left: the anatomy of a passive RFID key fob — keyring hole, antenna coil powered by the reader field, a chip carrying the credential ID, no battery, in an ABS or epoxy housing — with unit costs of $0.50-$1.50 for LF and $1.00-$4.00 for encrypted HF. Right: the two frequency bands and their protocols — 125 kHz LF carrying EM4100, HID Prox and AWID with 5-15 cm read range and EM4100 clonable in seconds, and 13.56 MHz HF carrying MIFARE Classic, DESFire and iCLASS SE with 3-10 cm range and AES-128 options — plus the procurement trap: a 125 kHz EM4100 fob will not open a 125 kHz HID ProxPoint door, because same frequency does not mean same protocol.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID KEY FOB ACCESS CONTROL — HOW TO SPEC IT RIGHT</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Same frequency does not mean same protocol</text>

<rect x="60" y="128" width="400" height="462" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="260" y="164" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">THE FOB ITSELF</text>

<rect x="120" y="215" width="115" height="185" rx="36" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
<circle cx="177" cy="248" r="13" fill="#f4efe4" stroke="#3d6b6b" stroke-width="2"/>
<rect x="138" y="290" width="79" height="92" rx="12" fill="none" stroke="#9dbcbc" stroke-width="1.5"/>
<rect x="146" y="298" width="63" height="76" rx="9" fill="none" stroke="#9dbcbc" stroke-width="1.5"/>
<rect x="163" y="322" width="30" height="26" rx="4" fill="#c39a5f" stroke="#a9834e" stroke-width="1.5"/>

<line x1="192" y1="246" x2="248" y2="242" stroke="#c39a5f" stroke-width="1.5"/>
<text x="255" y="246" font-size="13.5" font-weight="700" fill="#291c0e">Keyring hole</text>
<text x="255" y="264" font-size="12" fill="#4f4f4f">lives where the keys live</text>

<line x1="219" y1="300" x2="248" y2="294" stroke="#c39a5f" stroke-width="1.5"/>
<text x="255" y="298" font-size="13.5" font-weight="700" fill="#291c0e">Antenna coil</text>
<text x="255" y="316" font-size="12" fill="#4f4f4f">powered by the reader field</text>

<line x1="195" y1="335" x2="248" y2="346" stroke="#c39a5f" stroke-width="1.5"/>
<text x="255" y="350" font-size="13.5" font-weight="700" fill="#291c0e">Chip</text>
<text x="255" y="368" font-size="12" fill="#4f4f4f">carries the credential ID</text>

<line x1="200" y1="390" x2="248" y2="398" stroke="#c39a5f" stroke-width="1.5"/>
<text x="255" y="402" font-size="13.5" font-weight="700" fill="#291c0e">No battery</text>
<text x="255" y="420" font-size="12" fill="#4f4f4f">power comes from the reader</text>

<text x="177" y="444" text-anchor="middle" font-size="12.5" fill="#4f4f4f">ABS / epoxy housing</text>

<rect x="84" y="508" width="352" height="62" rx="10" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="260" y="533" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Fob unit cost: $0.50-$1.50 (LF)</text>
<text x="260" y="553" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">$1.00-$4.00 (HF, encrypted)</text>

<rect x="492" y="128" width="648" height="462" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="816" y="164" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">TWO BANDS, MANY PROTOCOLS</text>

<rect x="516" y="186" width="296" height="230" rx="14" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="664" y="214" text-anchor="middle" font-size="16" font-weight="800" fill="#4a5568">125 kHz — LF</text>
<rect x="569" y="228" width="190" height="30" rx="8" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.2"/>
<text x="664" y="248" text-anchor="middle" font-size="13.5" font-weight="600" fill="#291c0e">EM4100</text>
<rect x="569" y="266" width="190" height="30" rx="8" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.2"/>
<text x="664" y="286" text-anchor="middle" font-size="13.5" font-weight="600" fill="#291c0e">HID Prox</text>
<rect x="569" y="304" width="190" height="30" rx="8" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.2"/>
<text x="664" y="324" text-anchor="middle" font-size="13.5" font-weight="600" fill="#291c0e">AWID</text>
<text x="664" y="356" text-anchor="middle" font-size="12.5" fill="#4f4f4f">read range 5-15 cm</text>
<text x="664" y="375" text-anchor="middle" font-size="12.5" fill="#4f4f4f">fobs $0.50-$1.50</text>
<text x="664" y="398" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">EM4100: clonable in seconds</text>

<rect x="844" y="186" width="296" height="230" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<text x="992" y="214" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">13.56 MHz — HF</text>
<rect x="897" y="228" width="190" height="30" rx="8" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.2"/>
<text x="992" y="248" text-anchor="middle" font-size="13.5" font-weight="600" fill="#291c0e">MIFARE Classic</text>
<rect x="897" y="266" width="190" height="30" rx="8" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.2"/>
<text x="992" y="286" text-anchor="middle" font-size="13.5" font-weight="600" fill="#291c0e">DESFire</text>
<rect x="897" y="304" width="190" height="30" rx="8" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.2"/>
<text x="992" y="324" text-anchor="middle" font-size="13.5" font-weight="600" fill="#291c0e">iCLASS SE</text>
<text x="992" y="356" text-anchor="middle" font-size="12.5" fill="#4f4f4f">read range 3-10 cm</text>
<text x="992" y="375" text-anchor="middle" font-size="12.5" fill="#4f4f4f">fobs $1.00-$4.00</text>
<text x="992" y="398" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">AES-128 options resist cloning</text>

<rect x="516" y="432" width="624" height="66" rx="12" fill="#f7eaea" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="828" y="458" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8b2d2d">A 125 kHz EM4100 fob will not open a 125 kHz HID ProxPoint door</text>
<text x="828" y="480" text-anchor="middle" font-size="12.5" fill="#4f4f4f">same frequency, different protocol — nothing to say to each other</text>

<rect x="516" y="514" width="624" height="60" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="828" y="539" text-anchor="middle" font-size="13.5" font-weight="700" fill="#234a4a">Match the protocol first.</text>
<text x="828" y="559" text-anchor="middle" font-size="12.5" fill="#2c5454">The frequency only proves the two radios can hear each other.</text>

<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#5c5c5c">One keychain credential, two bands, many protocols — the purchase order lives or dies on the protocol line.</text>
</svg>
