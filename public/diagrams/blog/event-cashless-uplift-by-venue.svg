<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Per-attendee spending lift by event type after RFID cashless</title>
<desc id="d">Horizontal bars of per-attendee spending lift versus cash-and-card baselines. Music festivals 20 to 30 percent, sporting events and arenas 15 to 25 percent, conferences and trade shows 10 to 20 percent. A separate gold panel notes that top-up bonus incentives raise average pre-load by 25 to 40 percent, and that theme parks and resorts see higher spa, retail and dining ancillary spend.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SPENDING LIFT BY VENUE TYPE</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">How big the per-attendee lift runs once a wristband replaces cash.</text>
<line x1="567" y1="165" x2="567" y2="360" stroke="#efe7d6" stroke-width="2"/>
<text x="566.6666666666667" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#8a8a8a">10%</text>
<line x1="773" y1="165" x2="773" y2="360" stroke="#efe7d6" stroke-width="2"/>
<text x="773.3333333333334" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#8a8a8a">20%</text>
<line x1="980" y1="165" x2="980" y2="360" stroke="#efe7d6" stroke-width="2"/>
<text x="980.0" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#8a8a8a">30%</text>
<text x="104" y="212" font-size="14.5" font-weight="700" fill="#291c0e">Music festivals</text>
<rect x="360" y="185" width="620.0" height="40" rx="8" fill="#3d6b6b"/>
<text x="992.0" y="212" font-size="15" font-weight="800" fill="#2c5454">20–30%</text>
<text x="104" y="280" font-size="14.5" font-weight="700" fill="#291c0e">Sporting events &amp; arenas</text>
<rect x="360" y="253" width="516.6666666666667" height="40" rx="8" fill="#4d7a7a"/>
<text x="888.6666666666667" y="280" font-size="15" font-weight="800" fill="#2c5454">15–25%</text>
<text x="104" y="348" font-size="14.5" font-weight="700" fill="#291c0e">Conferences &amp; trade shows</text>
<rect x="360" y="321" width="413.33333333333337" height="40" rx="8" fill="#5f8a8a"/>
<text x="785.3333333333334" y="348" font-size="15" font-weight="800" fill="#2c5454">10–20%</text>
<rect x="88" y="404" width="1024" height="104" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<text x="120" y="452" font-size="34" font-weight="800" fill="#2c5454">+25–40%</text>
<text x="120" y="476" font-size="12.5" fill="#8a8a8a">avg pre-load</text>
<line x1="300" y1="424" x2="300" y2="488" stroke="#ecdcc0" stroke-width="2"/>
<text x="330" y="444" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TOP-UP BONUS INCENTIVES</text>
<text x="330" y="470" font-size="14.5" fill="#291c0e">“Load $50, get $55” lifts average pre-load 25–40% — revenue banked before the gates open.</text>
<text x="330" y="492" font-size="13.5" fill="#5c5c5c">Theme parks &amp; resorts: higher spa, retail and dining ancillary once signing and swiping disappear.</text>
<text x="600" y="556" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Ranges are per-attendee spend lift vs cash-and-card baselines; upper bounds are multi-day events.</text>
</svg>
