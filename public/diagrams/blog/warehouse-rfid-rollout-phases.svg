<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The twelve-month warehouse RFID rollout calendar in five phases</title>
<desc id="d">A twelve-month timeline with five phases in payback order: phase 1, receiving portals in months 0-2, verifying pallets in 3-5 seconds versus 15-30 minutes and saving 1-2 FTE in a 50K-pallet/year facility — the fastest payback; phase 2, put-away and bin verification in months 2-4, ending the mis-slotted pallets that cost 2-4 hours to find; phase 3, cycle counting in months 4-6, with daily UHF counts reaching 99%+ accuracy within 60 days and the count team redeployed; phase 4, picking verification at pack-out in months 6-9, dropping mis-ships 60-80%; and phase 5, yard management in months 9-12, eliminating 1-2 FTE of yard administration with 25-30% workforce-efficiency gains.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TWELVE MONTHS, FIVE PHASES</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">The rollout calendar: savings every quarter</text>

<rect x="60" y="128" width="320" height="128" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="80" y="156" font-size="15" font-weight="700" fill="#291c0e">Phase 1 — Receiving</text>
<text x="80" y="176" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MONTHS 0-2</text>
<text x="80" y="198" font-size="12.5" fill="#4f4f4f">portal verify: 3-5 s vs 15-30 min manual</text>
<text x="80" y="217" font-size="12.5" fill="#4f4f4f">saves 1-2 FTE at 50K pallets/year</text>
<text x="80" y="240" font-size="13" font-weight="700" fill="#1f6f3a">fastest payback in the sequence</text>

<rect x="440" y="128" width="320" height="128" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="460" y="156" font-size="15" font-weight="700" fill="#291c0e">Phase 3 — Cycle counting</text>
<text x="460" y="176" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MONTHS 4-6</text>
<text x="460" y="198" font-size="12.5" fill="#4f4f4f">daily UHF counts replace quarterly</text>
<text x="460" y="217" font-size="12.5" fill="#4f4f4f">physical counts: 99%+ within 60 days</text>
<text x="460" y="240" font-size="13" font-weight="700" fill="#1f6f3a">count team redeployed to value-add</text>

<rect x="820" y="128" width="320" height="128" rx="14" fill="#f4f5f7" stroke="#4a5568" stroke-width="2"/>
<text x="840" y="156" font-size="15" font-weight="700" fill="#291c0e">Phase 5 — Yard</text>
<text x="840" y="176" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MONTHS 9-12</text>
<text x="840" y="198" font-size="12.5" fill="#4f4f4f">windshield tags automate gate logs</text>
<text x="840" y="217" font-size="12.5" fill="#4f4f4f">and dispatch: 25-30% efficiency gains</text>
<text x="840" y="240" font-size="13" font-weight="700" fill="#1f6f3a">1-2 FTE of yard admin eliminated</text>

<line x1="166" y1="256" x2="166" y2="342" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="3 4"/>
<line x1="513" y1="256" x2="513" y2="342" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="3 4"/>
<line x1="990" y1="256" x2="990" y2="342" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="3 4"/>

<rect x="80" y="342" width="1040" height="30" rx="8" fill="#f4efe4" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="80" y="342" width="173" height="30" rx="8" fill="#3d6b6b"/>
<rect x="253" y="346" width="174" height="22" fill="#7ea5a5"/>
<rect x="427" y="342" width="173" height="30" fill="#3d6b6b"/>
<rect x="600" y="346" width="260" height="22" fill="#7ea5a5"/>
<rect x="860" y="342" width="260" height="30" rx="8" fill="#4a5568"/>
<text x="166" y="362" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">P1</text>
<text x="340" y="361" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">P2</text>
<text x="513" y="362" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">P3</text>
<text x="730" y="361" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">P4</text>
<text x="990" y="362" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">P5</text>

<text x="80" y="398" text-anchor="middle" font-size="12" fill="#5c5c5c">Month 0</text>
<text x="253" y="398" text-anchor="middle" font-size="12" fill="#5c5c5c">2</text>
<text x="427" y="398" text-anchor="middle" font-size="12" fill="#5c5c5c">4</text>
<text x="600" y="398" text-anchor="middle" font-size="12" fill="#5c5c5c">6</text>
<text x="773" y="398" text-anchor="middle" font-size="12" fill="#5c5c5c">8</text>
<text x="947" y="398" text-anchor="middle" font-size="12" fill="#5c5c5c">10</text>
<text x="1120" y="398" text-anchor="middle" font-size="12" fill="#5c5c5c">12</text>

<line x1="340" y1="424" x2="340" y2="368" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="3 4"/>
<line x1="730" y1="424" x2="730" y2="368" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="3 4"/>

<rect x="180" y="424" width="320" height="128" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="200" y="452" font-size="15" font-weight="700" fill="#291c0e">Phase 2 — Put-away</text>
<text x="200" y="472" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MONTHS 2-4</text>
<text x="200" y="494" font-size="12.5" fill="#4f4f4f">handheld readers verify rack placement</text>
<text x="200" y="513" font-size="12.5" fill="#4f4f4f">during put-away</text>
<text x="200" y="536" font-size="13" font-weight="700" fill="#1f6f3a">ends the 2-4 hour pallet hunts</text>

<rect x="570" y="424" width="320" height="128" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="590" y="452" font-size="15" font-weight="700" fill="#291c0e">Phase 4 — Picking</text>
<text x="590" y="472" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MONTHS 6-9</text>
<text x="590" y="494" font-size="12.5" fill="#4f4f4f">RFID-verified picks at pack-out catch</text>
<text x="590" y="513" font-size="12.5" fill="#4f4f4f">wrong-SKU errors before shipment</text>
<text x="590" y="536" font-size="13" font-weight="700" fill="#1f6f3a">mis-ship rate drops 60-80%</text>

<text x="600" y="596" text-anchor="middle" font-size="13.5" fill="#5c5c5c">All at once stalls at 6-9 months without ROI — phased by impact, something lands every quarter.</text>
<text x="600" y="634" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Receiving first, yard last: strict order of payback speed.</text>
</svg>
