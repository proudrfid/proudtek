<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Cutaway anatomy of an RFID parking token</title>
  <desc id="d">A cutaway of a coin-shaped RFID parking token with five labelled parts: a 304 or 316 stainless split ring at the key-ring lug; the ABS or polycarbonate housing, UV-stable to ISO 4892-2; a 3-mil laser-engraved serial with optional four-colour logo; a 13.56 MHz NFC coil antenna tuned to ISO/IEC 14443-A; and the secure chip die carrying an NTAG424 DNA or NTAG21x credential with 416 bytes of memory. A footnote notes the windshield UHF variant on a PET label with a Monza R6-P or M775 inlay reading 2-5 m at 860-960 MHz.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANATOMY OF AN RFID PARKING TOKEN</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">The coil does the reading; the shell decides how many winters in a glovebox it survives</text>

  <!-- key-ring lug -->
  <circle cx="560" cy="214" r="31" fill="#f1e6cd" stroke="#c39a5f" stroke-width="3"/>
  <circle cx="560" cy="214" r="13" fill="#ffffff" stroke="#4a5568" stroke-width="6"/>

  <!-- coin body -->
  <circle cx="560" cy="392" r="150" fill="#f7edd6" stroke="#e4c98f" stroke-width="3"/>
  <!-- antenna coil turns -->
  <circle cx="560" cy="392" r="126" fill="none" stroke="#c39a5f" stroke-width="4"/>
  <circle cx="560" cy="392" r="106" fill="none" stroke="#c39a5f" stroke-width="3"/>
  <circle cx="560" cy="392" r="86" fill="none" stroke="#c39a5f" stroke-width="3"/>
  <!-- chip die -->
  <rect x="534" y="368" width="52" height="48" rx="6" fill="#4a5568" stroke="#2f394a" stroke-width="2"/>
  <text x="560" y="398" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">die</text>
  <!-- laser serial mark -->
  <rect x="500" y="470" width="120" height="16" rx="4" fill="#efe4cd" stroke="#c39a5f" stroke-width="1.5"/>

  <!-- left labels -->
  <text x="92" y="250" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">SPLIT RING</text>
  <text x="92" y="271" font-size="13.5" fill="#5c5c5c">304 / 316 stainless key-ring</text>
  <line x1="250" y1="240" x2="533" y2="212" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="92" y="392" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">HOUSING</text>
  <text x="92" y="413" font-size="13.5" fill="#5c5c5c">ABS or PC · UV-stable to ISO 4892-2</text>
  <line x1="250" y1="401" x2="412" y2="392" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="92" y="486" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">LASER SERIAL</text>
  <text x="92" y="507" font-size="13.5" fill="#5c5c5c">3-mil mark + 4-colour logo</text>
  <line x1="250" y1="496" x2="500" y2="480" stroke="#b9c0cc" stroke-width="1.5"/>

  <!-- right labels -->
  <text x="842" y="330" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">NFC COIL ANTENNA</text>
  <text x="842" y="351" font-size="13.5" fill="#5c5c5c">13.56 MHz · ISO/IEC 14443-A</text>
  <line x1="688" y1="360" x2="838" y2="340" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="842" y="440" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">SECURE CHIP DIE</text>
  <text x="842" y="461" font-size="13.5" fill="#5c5c5c">NTAG424 DNA / NTAG21x · 416 B</text>
  <line x1="588" y1="392" x2="838" y2="450" stroke="#b9c0cc" stroke-width="1.5"/>

  <!-- footnote -->
  <text x="600" y="622" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Windshield UHF variant: a PET adhesive label with a Monza R6-P / M775 inlay reads 2-5 m at 860-960 MHz.</text>
</svg>
