<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NFC read-failure map — symptom, likely cause, and the fix</title>
<desc id="d">Five common tap failures. No read at all usually means NFC is switched off — enable it in settings; on Android use the quick-settings toggle, while iPhone keeps it on for background reads. Reads that drop mean the tag is not aligned with the phone's coil, which sits at the top on iPhones and center-back on many Androids. A tag dead on metal has an antenna detuned by metal within 2 mm — use an anti-metal ferrite-backed tag or add a 1 mm spacer. Random wrong reads mean multiple tags overlap in the field — space them at least 3 cm apart. A phone that sees nothing useful is reading raw data rather than a formatted NDEF message — reformat the tag with an NFC writing app or a desktop reader.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="1.1" fill="#6d5a3a">WHEN THE TAP DOES NOTHING &#8212; SYMPTOM, CAUSE, FIX</text>
<text x="600" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5c5c">It is almost never a dead tag &#8212; though a dead tag is, reliably, the first thing everyone blames.</text>

<!-- column headers -->
<text x="96" y="112" font-size="13" font-weight="800" letter-spacing="1" fill="#8b2d2d">SYMPTOM</text>
<text x="356" y="112" font-size="13" font-weight="800" letter-spacing="1" fill="#6d5a3a">LIKELY CAUSE</text>
<text x="628" y="112" font-size="13" font-weight="800" letter-spacing="1" fill="#1f6f3a">THE FIX</text>

<!-- ===== Row 1 (y 126) ===== -->
<rect x="70" y="126" width="1060" height="84" rx="12" fill="#faf6ec" stroke="#e3d8c4" stroke-width="1.3"/>
<rect x="70" y="126" width="8" height="84" rx="4" fill="#8b2d2d"/>
<text x="96" y="174" font-size="15.5" font-weight="800" fill="#291c0e">No read at all</text>
<text x="356" y="174" font-size="14" font-weight="600" fill="#4f4f4f">NFC is switched off</text>
<text x="628" y="156" font-size="14" font-weight="600" fill="#234a2a">Enable NFC in settings. On Android, use</text>
<text x="628" y="176" font-size="14" font-weight="600" fill="#234a2a">the quick-settings toggle; iPhone keeps</text>
<text x="628" y="196" font-size="14" font-weight="600" fill="#234a2a">NFC on for background reads.</text>

<!-- ===== Row 2 (y 217) ===== -->
<rect x="70" y="217" width="1060" height="84" rx="12" fill="#faf6ec" stroke="#e3d8c4" stroke-width="1.3"/>
<rect x="70" y="217" width="8" height="84" rx="4" fill="#c39a5f"/>
<text x="96" y="265" font-size="15.5" font-weight="800" fill="#291c0e">Reads, then drops</text>
<text x="356" y="265" font-size="14" font-weight="600" fill="#4f4f4f">Tag off the phone's coil</text>
<text x="628" y="257" font-size="14" font-weight="600" fill="#234a2a">The coil sits at the top on iPhones,</text>
<text x="628" y="277" font-size="14" font-weight="600" fill="#234a2a">center-back on many Androids &#8212; move to match.</text>

<!-- ===== Row 3 (y 308) ===== -->
<rect x="70" y="308" width="1060" height="84" rx="12" fill="#faf6ec" stroke="#e3d8c4" stroke-width="1.3"/>
<rect x="70" y="308" width="8" height="84" rx="4" fill="#4a5568"/>
<text x="96" y="356" font-size="15.5" font-weight="800" fill="#291c0e">Dead on metal</text>
<text x="356" y="348" font-size="14" font-weight="600" fill="#4f4f4f">Metal within 2 mm detunes</text>
<text x="356" y="368" font-size="14" font-weight="600" fill="#4f4f4f">the resonant circuit</text>
<text x="628" y="348" font-size="14" font-weight="600" fill="#234a2a">Use anti-metal (ferrite-backed) tags,</text>
<text x="628" y="368" font-size="14" font-weight="600" fill="#234a2a">or add a 1 mm spacer.</text>

<!-- ===== Row 4 (y 399) ===== -->
<rect x="70" y="399" width="1060" height="84" rx="12" fill="#faf6ec" stroke="#e3d8c4" stroke-width="1.3"/>
<rect x="70" y="399" width="8" height="84" rx="4" fill="#3d6b6b"/>
<text x="96" y="447" font-size="15.5" font-weight="800" fill="#291c0e">Random wrong reads</text>
<text x="356" y="447" font-size="14" font-weight="600" fill="#4f4f4f">Several tags overlap</text>
<text x="628" y="439" font-size="14" font-weight="600" fill="#234a2a">Space tags at least 3 cm apart so</text>
<text x="628" y="459" font-size="14" font-weight="600" fill="#234a2a">anti-collision can pick just one.</text>

<!-- ===== Row 5 (y 490) ===== -->
<rect x="70" y="490" width="1060" height="84" rx="12" fill="#faf6ec" stroke="#e3d8c4" stroke-width="1.3"/>
<rect x="70" y="490" width="8" height="84" rx="4" fill="#6d5a3a"/>
<text x="96" y="538" font-size="15.5" font-weight="800" fill="#291c0e">Sees nothing useful</text>
<text x="356" y="530" font-size="14" font-weight="600" fill="#4f4f4f">Raw data, not a formatted</text>
<text x="356" y="550" font-size="14" font-weight="600" fill="#4f4f4f">NDEF message</text>
<text x="628" y="530" font-size="14" font-weight="600" fill="#234a2a">Reformat the tag with an NFC writing</text>
<text x="628" y="550" font-size="14" font-weight="600" fill="#234a2a">app or desktop reader.</text>

<text x="600" y="606" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Work the list top to bottom before you RMA anything. The tag is usually innocent.</text>
</svg>
