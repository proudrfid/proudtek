<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Proud Tek Shenzhen product range: one supplier resolved into six RFID product families and one shipment</title>
  <desc id="d">A left-to-right map. On the left, a card labelled PROUD TEK SHENZHEN (since 2008). In the centre, six product-family lanes: RFID cards and fobs (MIFARE Classic, MIFARE Plus, DESFire, NTAG 215, T5577); NFC tags and stickers (NTAG 213, NTAG 216, NTAG 424 DNA, ICODE SLIX2); UHF inlays and labels (Impinj M730, NXP UCODE 9, Monza R6 at 860-960 MHz); event wristbands (MIFARE Ultralight, NTAG 213, UCODE 9); keyfobs and hard tags (EM4200, T5577, NTAG 216, MIFARE Classic); and RFID readers (desktop, handheld and fixed UHF encoders). All six converge on the right into ONE SHIPMENT: encoded to spec, 100% read-verified, full document pack. A footer notes RFID has been made in Shenzhen since 2008 under one ISO 9001, 14001 and 45001 system.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PROUD TEK SHENZHEN PRODUCT RANGE</text>
  <text x="600" y="92" text-anchor="middle" font-size="29" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">One supplier, six families, one shipment</text>
  <text x="600" y="118" text-anchor="middle" font-size="14" fill="#5c5c5c">Every family runs to a published air-interface standard — not a reader-locked part.</text>

  <!-- connectors: factory to lanes -->
  <path d="M258,385 L300,185" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,385 L300,265" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,385 L300,345" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,385 L300,425" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,385 L300,505" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,385 L300,585" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <!-- connectors: lanes to shipment -->
  <path d="M900,185 L946,385" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,265 L946,385" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,345 L946,385" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,425 L946,385" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,505 L946,385" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,585 L946,385" stroke="#3d6b6b" stroke-width="2" fill="none"/>

  <!-- factory card -->
  <rect x="48" y="310" width="210" height="150" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="153" y="352" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">PROUD TEK</text>
  <text x="153" y="375" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">SHENZHEN</text>
  <text x="153" y="408" text-anchor="middle" font-size="13" fill="#5c5c5c">Shenzhen · since 2008</text>
  <text x="153" y="428" text-anchor="middle" font-size="13" fill="#5c5c5c">chip-vendor agnostic</text>

  <!-- lane 1: cards and fobs -->
  <rect x="300" y="150" width="600" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="150" width="7" height="70" rx="3" fill="#c39a5f"/>
  <text x="324" y="180" font-size="16" font-weight="700" fill="#291c0e">RFID cards &amp; fobs</text>
  <text x="324" y="204" font-size="13" fill="#5c5c5c">MIFARE Classic · MIFARE Plus · DESFire · NTAG 215 · T5577</text>

  <!-- lane 2: NFC tags and stickers -->
  <rect x="300" y="230" width="600" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="230" width="7" height="70" rx="3" fill="#3d6b6b"/>
  <text x="324" y="260" font-size="16" font-weight="700" fill="#291c0e">NFC tags &amp; stickers</text>
  <text x="324" y="284" font-size="13" fill="#5c5c5c">NTAG 213 · NTAG 216 · NTAG 424 DNA · ICODE SLIX2</text>

  <!-- lane 3: UHF inlays and labels -->
  <rect x="300" y="310" width="600" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="310" width="7" height="70" rx="3" fill="#4a5568"/>
  <text x="324" y="340" font-size="16" font-weight="700" fill="#291c0e">UHF inlays &amp; labels</text>
  <text x="324" y="364" font-size="13" fill="#5c5c5c">Impinj M730 · NXP UCODE 9 · Monza R6 · 860-960 MHz</text>

  <!-- lane 4: event wristbands -->
  <rect x="300" y="390" width="600" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="390" width="7" height="70" rx="3" fill="#6d5a3a"/>
  <text x="324" y="420" font-size="16" font-weight="700" fill="#291c0e">Event wristbands</text>
  <text x="324" y="444" font-size="13" fill="#5c5c5c">MIFARE Ultralight · NTAG 213 · UCODE 9</text>

  <!-- lane 5: keyfobs and hard tags -->
  <rect x="300" y="470" width="600" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="470" width="7" height="70" rx="3" fill="#2d6a4f"/>
  <text x="324" y="500" font-size="16" font-weight="700" fill="#291c0e">Keyfobs &amp; hard tags</text>
  <text x="324" y="524" font-size="13" fill="#5c5c5c">EM4200 · T5577 · NTAG 216 · MIFARE Classic</text>

  <!-- lane 6: RFID readers -->
  <rect x="300" y="550" width="600" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="550" width="7" height="70" rx="3" fill="#2c5454"/>
  <text x="324" y="580" font-size="16" font-weight="700" fill="#291c0e">RFID readers</text>
  <text x="324" y="604" font-size="13" fill="#5c5c5c">Desktop · handheld · fixed UHF encoders</text>

  <!-- shipment card -->
  <rect x="946" y="310" width="214" height="150" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="1053" y="348" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">ONE SHIPMENT</text>
  <text x="1053" y="380" text-anchor="middle" font-size="13" fill="#291c0e">Encoded to spec</text>
  <text x="1053" y="404" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">100% read-verified</text>
  <text x="1053" y="428" text-anchor="middle" font-size="13" fill="#291c0e">Full document pack</text>

  <text x="600" y="648" text-anchor="middle" font-size="14" fill="#5c5c5c">Making RFID in Shenzhen since 2008 · one ISO 9001 / 14001 / 45001 system</text>
</svg>
