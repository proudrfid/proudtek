<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="dbTitle dbDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="dbTitle">Proud Tek editorial firewall and commercial disclosure</title>
  <desc id="dbDesc">Two panels separated by a firewall: on the left, Commerce — Proud Tek manufactures and sells RFID and NFC hardware, paid by product orders rather than ads; on the right, Editorial — guides and comparisons written to be correct, with no paid placements and reviewers who can overrule a sales-preferred pick. A shield on the central firewall marks the separation. Every commercial interest that could influence coverage is disclosed on the page.</desc>

  <defs>
    <radialGradient id="dbGlow" cx="50%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="dbWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a755"/>
      <stop offset="100%" stop-color="#c39a5f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#dbGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="74" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="3" fill="#6d5a3a">COMMERCE  ·  EDITORIAL FIREWALL  ·  DISCLOSURE</text>

  <!-- ===================== LEFT: COMMERCE ===================== -->
  <rect x="70" y="118" width="468" height="384" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <!-- header -->
  <circle cx="126" cy="182" r="33" fill="#c39a5f"/>
  <!-- tag glyph -->
  <path d="M112 168 h16 a4 4 0 0 1 2.8 1.2 l14 14 a4 4 0 0 1 0 5.6 l-13.2 13.2 a4 4 0 0 1 -5.6 0 l-14 -14 a4 4 0 0 1 -1.2 -2.8 v-16 a1.5 1.5 0 0 1 1.4 -1.4 z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="120" cy="176" r="3.2" fill="#ffffff"/>
  <text x="178" y="176" font-size="26" font-weight="800" fill="#291c0e">COMMERCE</text>
  <text x="178" y="203" font-size="15.5" fill="#6d5a3a">What funds this site</text>
  <line x1="94" y1="228" x2="514" y2="228" stroke="#ece5d8" stroke-width="2"/>
  <!-- bullets -->
  <circle cx="110" cy="273" r="11" fill="#c39a5f"/>
  <path d="M105 273 l3.5 3.5 l6.5 -7.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="134" y="279" font-size="18.5" fill="#291c0e">We sell RFID &amp; NFC hardware</text>
  <circle cx="110" cy="332" r="11" fill="#c39a5f"/>
  <path d="M105 332 l3.5 3.5 l6.5 -7.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="134" y="338" font-size="18.5" fill="#291c0e">Paid by product orders — not ads</text>
  <circle cx="110" cy="391" r="11" fill="#c39a5f"/>
  <path d="M105 391 l3.5 3.5 l6.5 -7.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="134" y="397" font-size="18.5" fill="#291c0e">A disclosed commercial interest</text>
  <text x="94" y="456" font-size="15" fill="#8a7a5a">The bias every reader should keep in mind.</text>

  <!-- ===================== CENTER: FIREWALL ===================== -->
  <rect x="588" y="118" width="24" height="384" rx="12" fill="url(#dbWall)"/>
  <circle cx="600" cy="300" r="52" fill="#fbf5ea" stroke="#e4c98f" stroke-width="2"/>
  <path d="M573 283 c0,-4 2,-6 6,-7 l21,-5 l21,5 c4,1 6,3 6,7 l0,24 c0,16 -12,26 -27,32 c-15,-6 -27,-16 -27,-32 z" fill="#ffffff" stroke="#c39a5f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M589 302 l8 8 l16 -18" fill="none" stroke="#1f6f3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="545" y="360" width="110" height="27" rx="13.5" fill="#291c0e"/>
  <text x="600" y="378" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#ffffff">FIREWALL</text>

  <!-- ===================== RIGHT: EDITORIAL ===================== -->
  <rect x="662" y="118" width="468" height="384" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <!-- header -->
  <circle cx="718" cy="182" r="33" fill="#3d6b6b"/>
  <!-- pen / nib glyph -->
  <path d="M706 196 l18 -18 l6 6 l-18 18 l-8 2 z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M726 172 l4 -4 a2.8 2.8 0 0 1 4 0 l2 2 a2.8 2.8 0 0 1 0 4 l-4 4 z" fill="#ffffff"/>
  <text x="770" y="176" font-size="26" font-weight="800" fill="#291c0e">EDITORIAL</text>
  <text x="770" y="203" font-size="15.5" fill="#6d5a3a">What we publish</text>
  <line x1="686" y1="228" x2="1106" y2="228" stroke="#ece5d8" stroke-width="2"/>
  <!-- bullets -->
  <circle cx="702" cy="273" r="11" fill="#3d6b6b"/>
  <path d="M697 273 l3.5 3.5 l6.5 -7.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="726" y="279" font-size="18.5" fill="#291c0e">Guides written to be correct</text>
  <circle cx="702" cy="332" r="11" fill="#3d6b6b"/>
  <path d="M697 332 l3.5 3.5 l6.5 -7.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="726" y="338" font-size="18.5" fill="#291c0e">No paid or sponsored reviews</text>
  <circle cx="702" cy="391" r="11" fill="#3d6b6b"/>
  <path d="M697 391 l3.5 3.5 l6.5 -7.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="726" y="397" font-size="18.5" fill="#291c0e">Reviewers can overrule sales</text>
  <text x="686" y="456" font-size="15" fill="#8a7a5a">The right pick wins, even one we don't sell.</text>

  <!-- ===================== FOOTER ===================== -->
  <text x="600" y="556" text-anchor="middle" font-size="18" fill="#4f4f4f">We manufacture the products our guides discuss — so every interest that</text>
  <text x="600" y="582" text-anchor="middle" font-size="18" fill="#4f4f4f">could influence our coverage is disclosed on this page.</text>
  <text x="600" y="614" text-anchor="middle" font-size="13.5" font-weight="600" letter-spacing="1" fill="#8a7a5a">NO AFFILIATE LINKS TODAY   ·   NO PAID PLACEMENTS   ·   TRADEMARKS CREDITED</text>
</svg>
