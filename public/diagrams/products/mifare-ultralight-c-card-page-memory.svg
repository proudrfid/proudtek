<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Ultralight C memory — 192 bytes as 48 pages of 4 bytes</title>
  <desc id="d">Page-based memory map: 48 pages of 4 bytes totalling 192 bytes. Pages 0-1 carry the 7-byte UID, pages 2-3 configuration, OTP and lock bits, leaving 144 usable bytes for the application, protected by 3DES authentication.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">192 bytes, dealt out as 48 pages</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">No sectors, no filing cabinet — a ticket-sized notepad, 4 bytes per page</text>
  <g transform="translate(60,130)">
    <g font-family="Helvetica, Arial, sans-serif" font-size="12">
      <rect x="0" y="0" width="252" height="46" rx="6" fill="#fdf3e3" stroke="#c39a5f" stroke-width="2"/>
      <text x="12" y="20" fill="#6d5a3a">pages 0-1</text><text x="12" y="38" fill="#291c0e">7-byte UID (read-only)</text>
      <rect x="0" y="56" width="252" height="46" rx="6" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2"/>
      <text x="12" y="76" fill="#2c5454">pages 2-3</text><text x="12" y="94" fill="#2c5454">config + OTP + lock bits</text>
      <rect x="0" y="112" width="252" height="180" rx="6" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
      <text x="12" y="136" fill="#2c5454">pages 4-47</text>
      <text x="12" y="158" fill="#6d5a3a">144 usable bytes</text>
      <text x="12" y="180" fill="#6d5a3a">ticket state, counters,</text>
      <text x="12" y="200" fill="#6d5a3a">pass identifiers</text>
      <text x="12" y="240" fill="#6d5a3a">write-protected behind</text>
      <text x="12" y="260" fill="#6d5a3a">3DES authentication</text>
    </g>
    <g transform="translate(320,0)" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d5a3a">
      <text x="0" y="14" font-size="14" fill="#291c0e" font-family="Georgia, serif">All 48 pages at a glance</text>
      <g transform="translate(0,28)">
        <rect x="0" y="0" width="58" height="26" fill="#fdf3e3" stroke="#c39a5f"/><rect x="62" y="0" width="58" height="26" fill="#fdf3e3" stroke="#c39a5f"/>
        <rect x="124" y="0" width="58" height="26" fill="#eef2f0" stroke="#3d6b6b"/><rect x="186" y="0" width="58" height="26" fill="#eef2f0" stroke="#3d6b6b"/>
        <rect x="248" y="0" width="58" height="26" fill="#ffffff" stroke="#d8cdb8"/><rect x="310" y="0" width="58" height="26" fill="#ffffff" stroke="#d8cdb8"/>
        <rect x="372" y="0" width="58" height="26" fill="#ffffff" stroke="#d8cdb8"/><rect x="434" y="0" width="58" height="26" fill="#ffffff" stroke="#d8cdb8"/>
        <rect x="0" y="30" width="492" height="26" fill="#ffffff" stroke="#d8cdb8"/>
        <rect x="0" y="60" width="492" height="26" fill="#ffffff" stroke="#d8cdb8"/>
        <rect x="0" y="90" width="492" height="26" fill="#ffffff" stroke="#d8cdb8"/>
        <rect x="0" y="120" width="492" height="26" fill="#ffffff" stroke="#d8cdb8"/>
        <text x="0" y="170">4 bytes per page x 48 pages = 192 bytes total</text>
      </g>
    </g>
  </g>
  <g transform="translate(60,480)">
    <rect x="0" y="0" width="1040" height="110" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="36" font-family="Georgia, serif" font-size="18" fill="#291c0e">Why so small on purpose</text>
    <text x="24" y="66" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">A disposable ticket carries a fare state, not a file system — the silicon budget goes to the 3DES handshake instead</text>
    <text x="24" y="92" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">NFC Forum Type 2 Tag — read by every standard reader, turnstile and NFC smartphone</text>
  </g>
</svg>
