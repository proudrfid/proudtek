<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">iPhone NFC capability by model and iOS version, in three tiers</title>
<desc id="d">Three capability tiers. iPhone 7, 8 and X on iOS 11+ read NFC only through Apple's Core NFC framework and require an app, with no background tag reading. iPhone XS, XR and 11 through 16 on iOS 13+ add built-in background tag reading, so a tap on the top edge opens the NDEF automatically. iOS 14 and later provide the broadest support: NFC Forum Type 1, 2, 4 and 5 tags plus ISO 15693 vicinity tags. All iPhones read from the top edge near the front camera.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">iPHONE NFC CAPABILITY BY MODEL</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">What each generation can actually do — and when you still need an app.</text>

<!-- Tier 1 -->
<rect x="64" y="120" width="1072" height="126" rx="13" fill="#faf5ea" stroke="#e4d8bf" stroke-width="1.6"/>
<rect x="64" y="120" width="9" height="126" rx="4" fill="#c39a5f"/>
<text x="104" y="166" font-size="20" font-weight="800" fill="#291c0e">iPhone 7 · 8 · X</text>
<text x="104" y="196" font-size="14" fill="#5c5c5c">iOS 11+ · Core NFC framework only.</text>
<text x="104" y="220" font-size="14" fill="#5c5c5c">Reading needs an app — no background tag reading.</text>
<rect x="836" y="163" width="264" height="40" rx="20" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="968" y="188" text-anchor="middle" font-size="13.5" font-weight="800" fill="#8a6d34">APP REQUIRED</text>

<!-- Tier 2 -->
<rect x="64" y="268" width="1072" height="126" rx="13" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="64" y="268" width="9" height="126" rx="4" fill="#3d6b6b"/>
<text x="104" y="314" font-size="20" font-weight="800" fill="#291c0e">iPhone XS · XR · 11–16</text>
<text x="104" y="344" font-size="14" fill="#4f6a6a">iOS 13+ · Background tag reading built in.</text>
<text x="104" y="368" font-size="14" fill="#4f6a6a">Tap the top edge; iOS opens the NDEF automatically.</text>
<rect x="836" y="311" width="264" height="40" rx="20" fill="#dcebeb" stroke="#a9cccc" stroke-width="1.4"/>
<text x="968" y="336" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2c5454">TAP-TO-READ, NO APP</text>

<!-- Tier 3 -->
<rect x="64" y="416" width="1072" height="126" rx="13" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<rect x="64" y="416" width="9" height="126" rx="4" fill="#2d6a4f"/>
<text x="104" y="462" font-size="20" font-weight="800" fill="#291c0e">iOS 14 and later</text>
<text x="104" y="492" font-size="14" fill="#33614a">Broadest support — the recommended baseline.</text>
<text x="104" y="516" font-size="14" fill="#33614a">NFC Forum Type 1 / 2 / 4 / 5 + ISO 15693 vicinity tags.</text>
<rect x="836" y="459" width="264" height="40" rx="20" fill="#dcebe2" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="968" y="484" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f6f3a">TYPE 1–5 + NFC-V</text>

<text x="600" y="590" text-anchor="middle" font-size="14.5" fill="#5c5c5c">All iPhones read from the top edge near the front camera — technique matters as much as the model.</text>
</svg>
