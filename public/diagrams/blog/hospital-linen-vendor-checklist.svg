<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="hlS5Title hlS5Desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="hlS5Title">Five questions that sort hospital linen RFID vendors in 2026</title>
  <desc id="hlS5Desc">A buyer checklist. One: tag-replacement and end-of-life ownership — the dominant model is vendor-owned linen on a per-piece-per-day rental that amortises replacement. Two: per-zone read accuracy, benchmarked at every reader location, at least 97 percent recommended. Three: data feed format and ownership — require REST or HL7 API access and a data-export clause, not CSV-only. Four: surgical-textile cycle limits, often 75 to 100 cycles, auto-retired at the threshold. Five: an infection-event traceability SLA of 2 hours or less to produce every linen that touched a ward in the last 14 days.</desc>

  <defs>
    <radialGradient id="s5Bg" cx="50%" cy="16%" r="95%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f0ebdf"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#s5Bg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="58" text-anchor="middle" font-size="25" font-weight="800" fill="#291c0e">Five questions that sort the vendors</text>
  <text x="600" y="88" text-anchor="middle" font-size="15.5" fill="#2d6a4f">You're signing the laundry RFP and the RFID RFP at once — ask before you do.</text>

  <!-- rows: y = 116,214,312,410,508 ; h 86 -->
  <g>
    <!-- helper checkbox appears per row -->
    <!-- Row 1 -->
    <rect x="62" y="116" width="1076" height="86" rx="14" fill="#fbf8f2" stroke="#e6dbc4" stroke-width="2"/>
    <rect x="90" y="139" width="40" height="40" rx="9" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>
    <path d="M99 159 l7 8 l15 -18" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="152" y="150" font-size="17" font-weight="700" fill="#291c0e">Tag replacement &amp; end-of-life</text>
    <text x="152" y="176" font-size="13.5" fill="#6c5127">Who pays when a tag fails before its rated cycle count?</text>
    <rect x="812" y="138" width="308" height="42" rx="10" fill="#f0f6f1" stroke="#a9c8b2" stroke-width="1.5"/>
    <text x="966" y="164" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6f3a">vendor-owned rental amortises it</text>

    <!-- Row 2 -->
    <rect x="62" y="214" width="1076" height="86" rx="14" fill="#fbf8f2" stroke="#e6dbc4" stroke-width="2"/>
    <rect x="90" y="237" width="40" height="40" rx="9" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>
    <path d="M99 257 l7 8 l15 -18" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="152" y="248" font-size="17" font-weight="700" fill="#291c0e">Per-zone read-accuracy guarantee</text>
    <text x="152" y="274" font-size="13.5" fill="#6c5127">Benchmark every reader, not just the vendor's flagship tunnel.</text>
    <rect x="812" y="236" width="308" height="42" rx="10" fill="#eef4f6" stroke="#bcd4dd" stroke-width="1.5"/>
    <text x="966" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79">≥97% at every location</text>

    <!-- Row 3 -->
    <rect x="62" y="312" width="1076" height="86" rx="14" fill="#fbf8f2" stroke="#e6dbc4" stroke-width="2"/>
    <rect x="90" y="335" width="40" height="40" rx="9" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>
    <path d="M99 355 l7 8 l15 -18" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="152" y="346" font-size="17" font-weight="700" fill="#291c0e">Data feed format &amp; ownership</text>
    <text x="152" y="372" font-size="13.5" fill="#6c5127">A CSV-only feed is the biggest barrier to audit-ready reporting.</text>
    <rect x="812" y="334" width="308" height="42" rx="10" fill="#eef4f6" stroke="#bcd4dd" stroke-width="1.5"/>
    <text x="966" y="360" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f4e79">REST / HL7 API + export clause</text>

    <!-- Row 4 -->
    <rect x="62" y="410" width="1076" height="86" rx="14" fill="#fbf8f2" stroke="#e6dbc4" stroke-width="2"/>
    <rect x="90" y="433" width="40" height="40" rx="9" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>
    <path d="M99 453 l7 8 l15 -18" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="152" y="444" font-size="17" font-weight="700" fill="#291c0e">Surgical-textile cycle limits</text>
    <text x="152" y="470" font-size="13.5" fill="#6c5127">Gowns &amp; drapes (Halyard, Standard Textile, Encompass Group).</text>
    <rect x="812" y="432" width="308" height="42" rx="10" fill="#f0f6f1" stroke="#a9c8b2" stroke-width="1.5"/>
    <text x="966" y="458" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f6f3a">75-100 cycles, auto-retired</text>

    <!-- Row 5 -->
    <rect x="62" y="508" width="1076" height="86" rx="14" fill="#fbf8f2" stroke="#e6dbc4" stroke-width="2"/>
    <rect x="90" y="531" width="40" height="40" rx="9" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>
    <path d="M99 551 l7 8 l15 -18" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="152" y="542" font-size="17" font-weight="700" fill="#291c0e">Infection-event traceability SLA</text>
    <text x="152" y="568" font-size="13.5" fill="#6c5127">"Every linen that touched this ward in the last 14 days" — how fast?</text>
    <rect x="812" y="530" width="308" height="42" rx="10" fill="#f7ecea" stroke="#dcb6b0" stroke-width="1.5"/>
    <text x="966" y="556" text-anchor="middle" font-size="15" font-weight="800" fill="#8b2d2d">≤2 hours, in writing</text>
  </g>

  <text x="600" y="632" text-anchor="middle" font-size="13.5" fill="#6c5127">Manual cycle counting fails these audits reliably — which is rather the point of asking up front.</text>
</svg>
