<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Metal NFC business cards: one tap saves the contact, and the card gets kept</title>
<desc id="d">A brushed-metal NFC business card on the left taps a smartphone on the right, which shows a contact saved to the phone. Below sit three stats: the card weighs 15 to 20 grams versus 4 grams for a PVC card, it drives 3 to 5 times higher contact-save rates, and it needs zero reprints because the digital profile updates instead of the card.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e7eaef"/><stop offset="100%" stop-color="#c3cad3"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PREMIUM NFC · BUSINESS NETWORKING</text>
<text x="600" y="105" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#291c0e">The card that gets weighed, not pocketed</text>
<text x="600" y="141" text-anchor="middle" font-size="16.5" fill="#4f4f4f">One tap sends your vCard — the metal stays in the hand.</text>

<!-- metal card -->
<rect x="150" y="228" width="300" height="192" rx="16" fill="url(#steel)" stroke="#9aa3ad" stroke-width="2"/>
<rect x="368" y="248" width="58" height="46" rx="8" fill="none" stroke="#c39a5f" stroke-width="2"/>
<rect x="376" y="256" width="42" height="30" rx="6" fill="none" stroke="#c39a5f" stroke-width="2"/>
<rect x="384" y="264" width="26" height="14" rx="4" fill="none" stroke="#c39a5f" stroke-width="2"/>
<text x="397" y="316" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#a07d43">NFC</text>
<text x="178" y="372" font-size="19" font-weight="800" letter-spacing="0.5" fill="#4a5568">ACME CORP</text>
<text x="178" y="397" font-size="13" fill="#5c5c5c">Jordan Ellis · VP Sales</text>

<!-- tap arrow -->
<text x="611" y="306" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.5" fill="#6d5a3a">ONE TAP</text>
<line x1="470" y1="324" x2="748" y2="324" stroke="#291c0e" stroke-width="3"/>
<polygon points="748,317 766,324 748,331" fill="#291c0e"/>

<!-- phone with saved contact -->
<rect x="772" y="206" width="188" height="274" rx="26" fill="#ffffff" stroke="#291c0e" stroke-width="3"/>
<rect x="790" y="236" width="152" height="216" rx="10" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.4"/>
<circle cx="866" cy="298" r="27" fill="#dfe3e8" stroke="#9aa3ad" stroke-width="1.6"/>
<circle cx="866" cy="290" r="10" fill="#9aa3ad"/>
<path d="M 849 316 a 17 15 0 0 1 34 0 Z" fill="#9aa3ad"/>
<text x="866" y="356" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Jordan Ellis</text>
<text x="866" y="376" text-anchor="middle" font-size="12.5" fill="#5c5c5c">VP Sales · ACME</text>
<circle cx="866" cy="410" r="16" fill="#1f6f3a"/>
<polyline points="859,410 864,416 874,404" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="866" y="446" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">Saved to Contacts</text>

<!-- stat pills -->
<rect x="100" y="498" width="300" height="82" rx="16" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="250" y="537" text-anchor="middle" font-size="30" font-weight="800" fill="#6d5a3a">15-20 g</text>
<text x="250" y="563" text-anchor="middle" font-size="13" fill="#5c5c5c">heft vs 4 g PVC card</text>
<rect x="450" y="498" width="300" height="82" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="600" y="537" text-anchor="middle" font-size="30" font-weight="800" fill="#2c5454">3-5x</text>
<text x="600" y="563" text-anchor="middle" font-size="13" fill="#5c5c5c">higher contact-save rate</text>
<rect x="800" y="498" width="300" height="82" rx="16" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="950" y="537" text-anchor="middle" font-size="30" font-weight="800" fill="#1f6f3a">0</text>
<text x="950" y="563" text-anchor="middle" font-size="13" fill="#5c5c5c">reprints — update the URL</text>

<text x="600" y="620" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Update the profile behind the tap; the card itself never gets reprinted.</text>
</svg>
