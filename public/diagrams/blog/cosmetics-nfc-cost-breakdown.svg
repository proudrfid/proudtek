<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ccTitle ccDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ccTitle">Itemized cost of an item-level NFC program for cosmetics, 2026</title>
  <desc id="ccDesc">A receipt itemizes the cost lines of a cosmetics NFC authentication program at 2026 market norms: an NTAG 424 DNA on-metal inlay at 0.20 to 0.45 dollars per unit, or a plain NTAG213 inlay at 0.06 to 0.10 dollars if anti-counterfeit is not the goal; packaging-line integration at 5 to 25 thousand dollars one time per SKU; a backend authentication platform at 20 to 150 thousand dollars per year; and 8 to 16 weeks of tap-to-verify UX work. All-in it lands at 0.40 to 0.80 dollars per unit for authentication only, or 0.50 to 1.20 dollars with refill and loyalty added — roughly 1 to 3 percent of the average selling price.</desc>
  <defs>
    <radialGradient id="ccBg" cx="50%" cy="12%" r="95%"><stop offset="0%" stop-color="#f8f1e2"/><stop offset="100%" stop-color="#f2ece0"/></radialGradient>
    <linearGradient id="ccGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9c084"/><stop offset="1" stop-color="#8f7d54"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#ccBg)"/>
  <text x="600" y="56" text-anchor="middle" font-size="15" letter-spacing="3" fill="#9a8a66">WHAT 2026 MONEY ACTUALLY BUYS</text>
  <text x="600" y="92" text-anchor="middle" font-size="29" font-weight="700" fill="#291c0e">Leaner than apparel — here's the receipt</text>

  <!-- receipt -->
  <g>
    <path d="M150 158 Q150 140 168 140 H592 Q610 140 610 158 V566 l -25 16 -25 -16 l -25 16 -25 -16 l -25 16 -25 -16 l -25 16 -25 -16 l -25 16 -25 -16 l -25 16 -25 -16 l -25 16 -25 -16 l -25 16 -25 -16 l -25 16 -25 -16 Z" fill="#fffaf0" stroke="#e2caa4" stroke-width="1.5"/>
    <text x="380" y="196" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#291c0e">PROUD TEK · BEAUTÉ</text>
    <text x="380" y="222" text-anchor="middle" font-size="12" letter-spacing="3" fill="#9a8a66">ITEM-LEVEL NFC · PER SKU</text>
    <line x1="184" y1="242" x2="576" y2="242" stroke="#e2caa4" stroke-dasharray="3 4"/>
    <g font-size="15" fill="#4f4535">
      <text x="184" y="278">NTAG 424 DNA inlay (on-metal)</text><text x="576" y="278" text-anchor="end" fill="#8a5b43">$0.20–0.45</text>
      <text x="184" y="310">…or plain NTAG213 (marketing only)</text><text x="576" y="310" text-anchor="end" fill="#8a5b43">$0.06–0.10</text>
      <text x="184" y="342">Packaging line integration (1×/SKU)</text><text x="576" y="342" text-anchor="end" fill="#8a5b43">$5K–25K</text>
      <text x="184" y="374">Backend auth platform (per year)</text><text x="576" y="374" text-anchor="end" fill="#8a5b43">$20K–150K</text>
      <text x="184" y="406">Tap-to-verify UX (designer + dev)</text><text x="576" y="406" text-anchor="end" fill="#8a5b43">8–16 wks</text>
    </g>
    <line x1="184" y1="430" x2="576" y2="430" stroke="#e2caa4" stroke-dasharray="3 4"/>
    <text x="184" y="466" font-size="15" fill="#6b6259">Authentication-only, all-in</text>
    <text x="576" y="466" text-anchor="end" font-size="16" font-weight="700" fill="#291c0e">$0.40–0.80</text>
    <text x="184" y="496" font-size="15" fill="#6b6259">+ Refill + loyalty, all-in</text>
    <text x="576" y="496" text-anchor="end" font-size="16" font-weight="700" fill="#291c0e">$0.50–1.20</text>
    <rect x="184" y="516" width="392" height="42" rx="8" fill="#291c0e"/>
    <text x="202" y="543" font-size="14" letter-spacing="1.5" fill="#e4ce9e">TOTAL / TAGGED UNIT</text>
    <text x="558" y="543" text-anchor="end" font-family="Georgia, serif" font-size="18" fill="#fff">≈ 1–3% of ASP</text>
  </g>

  <!-- right rail: the two headline totals -->
  <g>
    <text x="700" y="200" font-size="15" letter-spacing="2" fill="#9a8a66">THE NUMBER FINANCE REMEMBERS</text>
    <rect x="700" y="222" width="392" height="120" rx="16" fill="#fdf6ea" stroke="#e3d3b3"/>
    <text x="724" y="266" font-size="15" fill="#6b6259">Authentication only</text>
    <text x="1068" y="298" text-anchor="end" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#291c0e">$0.40–0.80</text>
    <text x="724" y="326" font-size="13" fill="#8a7f76">per tagged unit, all-in</text>

    <rect x="700" y="360" width="392" height="120" rx="16" fill="#fbeee4" stroke="#e6c8b6"/>
    <text x="724" y="404" font-size="15" fill="#6b6259">Auth + refill + loyalty</text>
    <text x="1068" y="436" text-anchor="end" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#a96b58">$0.50–1.20</text>
    <text x="724" y="464" font-size="13" fill="#8a7f76">per tagged unit, all-in</text>

    <text x="700" y="524" font-size="16" fill="#4f4535">Tag counts stay low — typically</text>
    <text x="700" y="548" font-size="16" fill="#4f4535">0.5–5M units/year per major SKU —</text>
    <text x="700" y="572" font-size="16" fill="#4f4535">so packaging integration stays clean.</text>
  </g>
</svg>
