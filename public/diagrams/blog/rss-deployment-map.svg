    <rect x="740" y="146" width="384" height="54" rx="12" fill="#faf6ee" stroke="#e6dfd2" stroke-width="1.5"/>
    <circle cx="768" cy="173" r="6" fill="#c39a5f"/><text x="790" y="179" font-size="17" font-weight="600" fill="#291c0e">16 door-exit RFID portals</text>
