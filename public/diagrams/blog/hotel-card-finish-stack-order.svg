<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hotel card finish stack: correct order of operations versus the wrong order</title>
<desc id="d">Left, the correct finish order from the substrate up: print, then foil stamp, then laminate to seal the foil, then spot UV on the laminated surface — the bonds hold. Right, the wrong order: spot UV applied directly on bare foil, which lifts and peels within weeks of handling. Below, three interaction warnings: embossing over 280 percent or heavier dark ink cracks unless you leave a clear zone or drop ink below 240 percent; metallic ink over the chip detunes the NFC antenna, so keep it clear or use foil; soft-touch laminate over digital print shifts colour 5 to 15 percent, so press-check a laminated proof.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FINISH STACK — ORDER OF OPERATIONS</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Each finish bonds to the layer below — the wrong order peels after 24–48 h.</text>

<!-- CORRECT -->
<rect x="64" y="106" width="470" height="352" rx="14" fill="#eef7f5" stroke="#cfe3dd" stroke-width="2"/>
<text x="299" y="140" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#234a4a">CORRECT ORDER</text>
<rect x="150" y="170" width="290" height="40" rx="6" fill="#234a4a"/>
<circle cx="168" cy="190" r="12" fill="#ffffff"/><text x="168" y="195" text-anchor="middle" font-size="13" font-weight="800" fill="#234a4a">4</text>
<text x="308" y="195" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Spot UV (on laminate)</text>
<rect x="150" y="214" width="290" height="40" rx="6" fill="#eef5f5" stroke="#8fb6b6" stroke-width="1.6"/>
<circle cx="168" cy="234" r="12" fill="#3d6b6b"/><text x="168" y="239" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text>
<text x="308" y="239" text-anchor="middle" font-size="13.5" font-weight="700" fill="#234a4a">Laminate (seals the foil)</text>
<rect x="150" y="258" width="290" height="40" rx="6" fill="#c39a5f"/>
<circle cx="168" cy="278" r="12" fill="#ffffff"/><text x="168" y="283" text-anchor="middle" font-size="13" font-weight="800" fill="#8a6a2f">2</text>
<text x="308" y="283" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a2f16">Foil stamp</text>
<rect x="150" y="302" width="290" height="40" rx="6" fill="#3d6b6b"/>
<circle cx="168" cy="322" r="12" fill="#ffffff"/><text x="168" y="327" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">1</text>
<text x="308" y="327" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Print</text>
<rect x="150" y="346" width="290" height="40" rx="6" fill="#4a5568"/>
<text x="308" y="371" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Substrate</text>
<circle cx="299" cy="418" r="12" fill="#2d6a4f"/><path d="M 293 418 l 4 5 l 8 -10" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="320" y="423" font-size="14" font-weight="800" fill="#1b4332">Bonds hold</text>

<!-- WRONG -->
<rect x="560" y="106" width="576" height="352" rx="14" fill="#fbf3f3" stroke="#e6c9c9" stroke-width="2"/>
<text x="848" y="140" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">WRONG ORDER — spot UV on bare foil</text>
<rect x="700" y="238" width="296" height="40" rx="6" fill="#234a4a"/>
<text x="848" y="263" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Spot UV (straight on foil)</text>
<rect x="700" y="282" width="296" height="40" rx="6" fill="#c39a5f"/>
<text x="848" y="307" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a2f16">Foil stamp</text>
<rect x="700" y="326" width="296" height="40" rx="6" fill="#4a5568"/>
<text x="848" y="351" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Substrate</text>
<path d="M 700 258 l -18 -6 M 700 268 l -20 2 M 700 278 l -18 8" stroke="#8b2d2d" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="848" cy="404" r="12" fill="#8b2d2d"/><path d="M 844 400 l 8 8 M 852 400 l -8 8" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
<text x="868" y="409" font-size="14" font-weight="800" fill="#8b2d2d">Lifts &amp; peels within weeks</text>

<!-- interaction warnings -->
<rect x="64" y="476" width="340" height="70" rx="10" fill="#fbf3f3" stroke="#e6c9c9" stroke-width="1.6"/>
<rect x="64" y="476" width="7" height="70" rx="3" fill="#8b2d2d"/>
<text x="86" y="502" font-size="13" font-weight="800" fill="#291c0e">Emboss over 280%+ dark ink cracks</text>
<text x="86" y="524" font-size="12.5" fill="#7a2323">→ leave a clear zone, or ink &lt; 240%</text>
<rect x="430" y="476" width="340" height="70" rx="10" fill="#fbf3f3" stroke="#e6c9c9" stroke-width="1.6"/>
<rect x="430" y="476" width="7" height="70" rx="3" fill="#8b2d2d"/>
<text x="452" y="502" font-size="13" font-weight="800" fill="#291c0e">Metallic ink over the chip detunes NFC</text>
<text x="452" y="524" font-size="12.5" fill="#7a2323">→ keep clear, or switch to foil</text>
<rect x="796" y="476" width="340" height="70" rx="10" fill="#fbf3f3" stroke="#e6c9c9" stroke-width="1.6"/>
<rect x="796" y="476" width="7" height="70" rx="3" fill="#8b2d2d"/>
<text x="818" y="502" font-size="13" font-weight="800" fill="#291c0e">Soft-touch over digital: colour +5–15%</text>
<text x="818" y="524" font-size="12.5" fill="#7a2323">→ press-check a laminated proof</text>

<text x="600" y="582" text-anchor="middle" font-size="14" fill="#4f4f4f">Most proof failures are finish-interaction errors — declare the stack order in the brief, not at proof review.</text>
</svg>
