<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID and tracking battery life by tag class</title>
<desc id="d">A years scale from 0 to 7 with battery-life bars by tag class. Passive UHF and HF/NFC tags have no battery and are limited only by the housing, effectively 50-plus years. Active 433 megahertz tags last 3 to 7 years (CenTrak, Stanley Healthcare, Sonitor, Versus). BLE 4.0 and 5.0 beacons last 1 to 3 years, or 5 to 7 at low beacon rates (HID Bluzone, Estimote, Quuppa). UWB trackers last 1 to 2 years (Apple AirTag, Samsung SmartTag+, Sewio). Sensor-enabled tags last 6 to 18 months because sensor sampling draws more power (Sensitech, ELPRO, Berlinger).</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BATTERY LIFE BY TAG CLASS</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">The passive tag has no clock; every active class trades battery for range or sensing.</text>

<!-- axis -->
<line x1="300" y1="140" x2="300" y2="500" stroke="#c9c1b2" stroke-width="2"/>
<line x1="300" y1="500" x2="1120" y2="500" stroke="#c9c1b2" stroke-width="2"/>
<line x1="416" y1="140" x2="416" y2="500" stroke="#efe7d6" stroke-width="1.2"/>
<line x1="647" y1="140" x2="647" y2="500" stroke="#efe7d6" stroke-width="1.2"/>
<line x1="878" y1="140" x2="878" y2="500" stroke="#efe7d6" stroke-width="1.2"/>
<text x="300" y="523" text-anchor="middle" font-size="12.5" fill="#8a8a8a">0</text>
<text x="416" y="523" text-anchor="middle" font-size="12.5" fill="#8a8a8a">1</text>
<text x="647" y="523" text-anchor="middle" font-size="12.5" fill="#8a8a8a">3</text>
<text x="878" y="523" text-anchor="middle" font-size="12.5" fill="#8a8a8a">5</text>
<text x="1110" y="523" text-anchor="middle" font-size="12.5" fill="#8a8a8a">7</text>
<text x="710" y="545" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.5" fill="#8a8a8a">YEARS OF BATTERY SERVICE</text>

<!-- Passive -->
<text x="285" y="178" text-anchor="end" font-size="14.5" font-weight="800" fill="#1f6f3a">Passive UHF / HF</text>
<rect x="300" y="162" width="810" height="34" rx="6" fill="#cfe7d7" stroke="#1f6f3a" stroke-width="1.8"/>
<polygon points="1110,162 1132,179 1110,196" fill="#cfe7d7" stroke="#1f6f3a" stroke-width="1.8"/>
<text x="318" y="184" font-size="14" font-weight="800" fill="#1f6f3a">NO BATTERY — housing-limited only (50+ yr silicon)</text>

<!-- Active 433 -->
<text x="285" y="250" text-anchor="end" font-size="14.5" font-weight="800" fill="#2c5454">Active 433 MHz</text>
<rect x="647" y="234" width="463" height="34" rx="6" fill="#cfe0e0" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="665" y="256" font-size="14" font-weight="800" fill="#2c5454">3-7 yr</text>
<text x="810" y="256" font-size="12" fill="#33595a">CenTrak, Stanley, Sonitor, Versus</text>

<!-- BLE -->
<text x="285" y="322" text-anchor="end" font-size="14.5" font-weight="800" fill="#a07d43">BLE 4.0 / 5.0</text>
<rect x="416" y="306" width="694" height="34" rx="6" fill="#fbeccb" stroke="#e4c98f" stroke-width="1.4"/>
<rect x="416" y="306" width="231" height="34" rx="6" fill="#f0c96f" stroke="#c39a5f" stroke-width="1.8"/>
<text x="432" y="328" font-size="14" font-weight="800" fill="#6d5a3a">1-3 yr</text>
<text x="700" y="328" font-size="12.5" fill="#a07d43">5-7 yr at low beacon rate · HID, Estimote, Quuppa</text>

<!-- UWB -->
<text x="285" y="394" text-anchor="end" font-size="14.5" font-weight="800" fill="#4a5568">UWB trackers</text>
<rect x="416" y="378" width="231" height="34" rx="6" fill="#dfe3e9" stroke="#4a5568" stroke-width="1.8"/>
<text x="432" y="400" font-size="14" font-weight="800" fill="#33404f">1-2 yr</text>
<text x="662" y="400" font-size="12" fill="#5c5c5c">AirTag, Galaxy SmartTag+, Sewio</text>

<!-- Sensor -->
<text x="285" y="464" text-anchor="end" font-size="14.5" font-weight="800" fill="#a07d43">Sensor-enabled</text>
<rect x="358" y="448" width="115" height="34" rx="6" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.8"/>
<text x="374" y="470" font-size="13.5" font-weight="800" fill="#6d5a3a">6-18 mo</text>
<text x="488" y="470" font-size="12" fill="#a07d43">sensor sampling sips hardest · Sensitech, ELPRO, Berlinger</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Only the passive tag has no clock to run out — for the rest, beacon interval sets the budget.</text>
</svg>
