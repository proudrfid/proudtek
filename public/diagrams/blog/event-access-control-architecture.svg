<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The four layers of an RFID event access-control system</title>
<desc id="d">A left-to-right signal path through four layers. Credential: an RFID wristband or badge carrying a UID and zone permissions, encoded at fulfillment. Reader: a fixed HF reader at the gate, 13.56 MHz, read at 3 to 8 cm. Controller network: wired Ethernet or Wi-Fi relaying the credential to the server, with cellular backup. Access software: the permission database that logs every gate event and makes the open-or-deny decision. The decision actuates the gate, which opens for a valid, permitted credential or denies an unknown UID or wrong zone. The full round trip takes 200 to 500 milliseconds.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SYSTEM ARCHITECTURE · FOUR LAYERS, ONE SIGNAL PATH</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">A tap travels credential to reader to controller to software, and the answer returns to the gate.</text>

<!-- Card 1: Credential -->
<rect x="83" y="150" width="236" height="214" rx="14" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="1.6"/>
<circle cx="109" cy="150" r="18" fill="#3d6b6b"/><text x="109" y="156" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
<ellipse cx="201" cy="214" rx="24" ry="18" fill="none" stroke="#3d6b6b" stroke-width="7"/>
<rect x="192" y="188" width="18" height="13" rx="3" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
<text x="201" y="268" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Credential</text>
<text x="201" y="292" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3d6b6b">RFID wristband / badge</text>
<text x="201" y="311" text-anchor="middle" font-size="13.5" fill="#4f4f4f">UID + zone permissions</text>
<rect x="121" y="330" width="160" height="26" rx="13" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1"/>
<text x="201" y="347" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">encoded at fulfillment</text>

<!-- Card 2: Reader -->
<rect x="349" y="150" width="236" height="214" rx="14" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="1.6"/>
<circle cx="375" cy="150" r="18" fill="#c39a5f"/><text x="375" y="156" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<rect x="441" y="192" width="52" height="40" rx="6" fill="#ffffff" stroke="#291c0e" stroke-width="2.5"/>
<rect x="449" y="198" width="36" height="16" rx="3" fill="#f7edd6"/>
<circle cx="467" cy="222" r="4.5" fill="#1f6f3a"/>
<text x="467" y="268" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Reader</text>
<text x="467" y="292" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d5a3a">HF reader at the gate</text>
<text x="467" y="311" text-anchor="middle" font-size="13.5" fill="#4f4f4f">13.56 MHz · 3–8 cm</text>
<rect x="387" y="330" width="160" height="26" rx="13" fill="#f7edd6" stroke="#e4c98f" stroke-width="1"/>
<text x="467" y="347" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">reads the credential</text>

<!-- Card 3: Controller network -->
<rect x="615" y="150" width="236" height="214" rx="14" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="1.6"/>
<circle cx="641" cy="150" r="18" fill="#4a5568"/><text x="641" y="156" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<g stroke="#4a5568" stroke-width="2.5" fill="#4a5568">
<line x1="713" y1="216" x2="749" y2="198"/><line x1="713" y1="216" x2="743" y2="230"/><line x1="749" y1="198" x2="743" y2="230"/>
<circle cx="713" cy="216" r="6"/><circle cx="749" cy="198" r="6"/><circle cx="743" cy="230" r="6"/>
</g>
<text x="733" y="268" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Controller network</text>
<text x="733" y="292" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a5568">wired Ethernet / Wi-Fi</text>
<text x="733" y="311" text-anchor="middle" font-size="13.5" fill="#4f4f4f">relays to the server</text>
<rect x="653" y="330" width="160" height="26" rx="13" fill="#eef1f5" stroke="#d3dae3" stroke-width="1"/>
<text x="733" y="347" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">cellular backup</text>

<!-- Card 4: Access software -->
<rect x="881" y="150" width="236" height="214" rx="14" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="1.6"/>
<circle cx="907" cy="150" r="18" fill="#2c5454"/><text x="907" y="156" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4</text>
<path d="M977 197 V227 a22 7 0 0 0 44 0 V197" fill="#eef5f5" stroke="#2c5454" stroke-width="2.5"/>
<ellipse cx="999" cy="197" rx="22" ry="7" fill="#dfeaea" stroke="#2c5454" stroke-width="2.5"/>
<text x="999" y="268" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Access software</text>
<text x="999" y="292" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">permission database</text>
<text x="999" y="311" text-anchor="middle" font-size="13.5" fill="#4f4f4f">logs every gate event</text>
<rect x="919" y="330" width="160" height="26" rx="13" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1"/>
<text x="999" y="347" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">open / deny decision</text>

<!-- chevrons -->
<g fill="#c39a5f"><path d="M327 240 l14 10 l-14 10 z"/><path d="M593 240 l14 10 l-14 10 z"/><path d="M859 240 l14 10 l-14 10 z"/></g>

<!-- rail into gate -->
<g stroke="#c39a5f" stroke-width="2.5"><line x1="201" y1="364" x2="201" y2="380"/><line x1="467" y1="364" x2="467" y2="380"/><line x1="733" y1="364" x2="733" y2="380"/><line x1="999" y1="364" x2="999" y2="380"/><line x1="201" y1="380" x2="999" y2="380"/></g>
<line x1="600" y1="380" x2="600" y2="404" stroke="#c39a5f" stroke-width="4"/>
<path d="M593 393 h14 l-7 13 z" fill="#c39a5f"/>

<!-- gate decision band -->
<rect x="83" y="408" width="517" height="104" rx="14" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2"/>
<rect x="600" y="408" width="517" height="104" rx="14" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2"/>
<circle cx="140" cy="460" r="18" fill="#1f6f3a"/><path d="M130 460 l6 7 l12 -15" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="170" y="453" font-size="20" font-weight="800" fill="#1f6f3a">GATE OPENS</text>
<text x="170" y="477" font-size="13.5" fill="#3f6b4e">valid credential · permitted zone</text>
<circle cx="660" cy="460" r="18" fill="#8b2d2d"/><path d="M652 452 l16 16 M668 452 l-16 16" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
<text x="692" y="453" font-size="20" font-weight="800" fill="#8b2d2d">GATE DENIES</text>
<text x="692" y="477" font-size="13.5" fill="#7a4242">unknown UID · wrong zone</text>

<text x="600" y="550" text-anchor="middle" font-size="15" fill="#5c5c5c">The full round trip — tap to open-or-deny — takes 200–500 ms.</text>
</svg>
