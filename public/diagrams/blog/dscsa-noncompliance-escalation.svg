<text x="810.0" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Trading-partner</text>
<text x="810.0" y="472" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">exclusion</text>
<text x="810.0" y="500" text-anchor="middle" font-size="12.6" font-weight="500" fill="#4f4f4f">Top-10 manufacturers stop</text>
<text x="810.0" y="518" text-anchor="middle" font-size="12.6" font-weight="500" fill="#4f4f4f">shipping to you.</text>
<rect x="925.0" y="130" width="190" height="426" rx="14" fill="#fbeeee" stroke="#8b2d2d" stroke-width="2" stroke-opacity="0.5"/>
