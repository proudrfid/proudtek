<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Fixed readers — the portal that reads everything that passes</title>
<desc id="d">Dock-door portal scene on the left: a door frame carries four antenna panels and a reader box on the beam, one PoE cable supplies both data and power, and a tagged pallet of cartons rolls through underneath without stopping. A pill notes hundreds of tags per second under UHF EPC Gen2. On the right, an anti-collision explainer: five tags all shout me at once, the reader answers everyone quiet — now just you, now just you, and the result is hundreds of clean reads a second with no two replies smeared together. Caption: 1 to 8 external antenna ports, Ethernet, RS-485 or GPIO — budget the whole doorway, not just the box.</desc>
