<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Incoterms responsibility ladder for RFID shipments: EXW, FOB, CIF, DAP, DDP</title>
<desc id="d">Along a shipping journey from factory to origin port, on board the ship, destination port and the buyer's door, five trade terms show how far the seller's responsibility extends. EXW Ex-Works: the buyer covers everything from the factory door. FOB Free On Board: the seller covers to the ship's rail, then the buyer, and it is the most common term for RFID. CIF Cost Insurance Freight: the seller covers to the destination port plus insurance. DAP Delivered At Place: the seller covers to the buyer's door but the buyer clears customs. DDP Delivered Duty Paid: the seller covers to the door with duties paid. Teal marks seller cost and risk, grey marks buyer cost and risk.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FOB, CIF, DDP — WHO PAYS WHAT</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">The trade term decides where the seller's responsibility ends.</text>

<!-- journey stages -->
<text x="270" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">Factory</text>
<text x="450" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">Origin port</text>
<text x="620" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">On board</text>
<text x="800" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">Dest port</text>
<text x="980" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">Buyer's door</text>
<line x1="250" y1="128" x2="1010" y2="128" stroke="#d8d2c4" stroke-width="1.6"/>
<line x1="270" y1="130" x2="270" y2="500" stroke="#efe9dc" stroke-width="1.3" stroke-dasharray="4 5"/>
<line x1="450" y1="130" x2="450" y2="500" stroke="#efe9dc" stroke-width="1.3" stroke-dasharray="4 5"/>
<line x1="620" y1="130" x2="620" y2="500" stroke="#efe9dc" stroke-width="1.3" stroke-dasharray="4 5"/>
<line x1="800" y1="130" x2="800" y2="500" stroke="#efe9dc" stroke-width="1.3" stroke-dasharray="4 5"/>
<line x1="980" y1="130" x2="980" y2="500" stroke="#efe9dc" stroke-width="1.3" stroke-dasharray="4 5"/>

<!-- EXW -->
<text x="70" y="216" font-size="16" font-weight="800" fill="#2c5454">EXW</text>
<text x="250" y="192" font-size="12.5" fill="#5c5c5c">Ex-Works — buyer covers everything from the factory door</text>
<rect x="250" y="198" width="50" height="26" rx="5" fill="#3d6b6b"/>
<rect x="300" y="198" width="710" height="26" rx="5" fill="#e5e2da"/>

<!-- FOB -->
<text x="70" y="280" font-size="16" font-weight="800" fill="#2c5454">FOB</text>
<text x="250" y="256" font-size="12.5" fill="#5c5c5c">Free On Board — seller to the ship's rail; RFID's most common term</text>
<rect x="250" y="262" width="370" height="26" rx="5" fill="#3d6b6b"/>
<rect x="620" y="262" width="390" height="26" rx="5" fill="#e5e2da"/>

<!-- CIF -->
<text x="70" y="344" font-size="16" font-weight="800" fill="#2c5454">CIF</text>
<text x="250" y="320" font-size="12.5" fill="#5c5c5c">Cost, Insurance, Freight — seller to destination port, plus insurance</text>
<rect x="250" y="326" width="550" height="26" rx="5" fill="#3d6b6b"/>
<rect x="800" y="326" width="210" height="26" rx="5" fill="#e5e2da"/>
<circle cx="770" cy="339" r="7" fill="#c39a5f"/>
<text x="770" y="343" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">i</text>

<!-- DAP -->
<text x="70" y="408" font-size="16" font-weight="800" fill="#2c5454">DAP</text>
<text x="250" y="384" font-size="12.5" fill="#5c5c5c">Delivered At Place — seller to your door; buyer clears customs</text>
<rect x="250" y="390" width="730" height="26" rx="5" fill="#3d6b6b"/>
<rect x="980" y="390" width="30" height="26" rx="5" fill="#e5e2da"/>
<text x="966" y="408" text-anchor="end" font-size="12" font-weight="700" fill="#8a6a2f">customs → buyer</text>

<!-- DDP -->
<text x="70" y="472" font-size="16" font-weight="800" fill="#2c5454">DDP</text>
<text x="250" y="448" font-size="12.5" fill="#5c5c5c">Delivered Duty Paid — seller to your door, duties paid</text>
<rect x="250" y="454" width="760" height="26" rx="5" fill="#3d6b6b"/>
<text x="990" y="472" text-anchor="end" font-size="12" font-weight="700" fill="#ffffff">duties paid</text>

<!-- legend -->
<rect x="300" y="524" width="20" height="16" rx="3" fill="#3d6b6b"/>
<text x="328" y="537" font-size="13" fill="#291c0e">seller: cost + risk</text>
<rect x="500" y="524" width="20" height="16" rx="3" fill="#e5e2da"/>
<text x="528" y="537" font-size="13" fill="#291c0e">buyer: cost + risk</text>
<circle cx="710" cy="532" r="7" fill="#c39a5f"/><text x="710" y="536" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">i</text>
<text x="724" y="537" font-size="13" fill="#291c0e">insurance included</text>

<text x="600" y="586" text-anchor="middle" font-size="14" fill="#4f4f4f">Same tag, five very different bills — confirm the term before comparing quotes.</text>
</svg>
