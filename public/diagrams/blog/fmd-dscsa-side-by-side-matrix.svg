<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="s5Title s5Desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="s5Title">DSCSA vs EU FMD — side-by-side compliance matrix</title>
  <desc id="s5Desc">A comparison table of US DSCSA and EU FMD across six dimensions. Effective date and basis: DSCSA enacted 2013 with final EDDS enforcement in 2025 and the small-dispenser exemption ending November 27 2026; FMD under Delegated Regulation 2016/161 effective February 9 2019, Italy delayed to 2027. Mandatory DataMatrix fields, tamper evidence (not mandated for DSCSA, mandatory for FMD), aggregation, verification at dispensing (not required for DSCSA, 100 percent scan for FMD) and penalty regime (DSCSA civil fines up to 500,000 dollars per violation; FMD penalties set per member state).</desc>
  <defs>
    <radialGradient id="s5Bg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#s5Bg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="2" fill="#6d5a3a">DSCSA vs EU FMD — QUICK REFERENCE</text>
  <text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Six dimensions operations leaders ask about most</text>

  <!-- zebra body rows -->
  <rect x="56" y="148" width="1088" height="75" fill="#ffffff"/>
  <rect x="56" y="223" width="1088" height="75" fill="#faf8f4"/>
  <rect x="56" y="298" width="1088" height="75" fill="#ffffff"/>
  <rect x="56" y="373" width="1088" height="75" fill="#faf8f4"/>
  <rect x="56" y="448" width="1088" height="75" fill="#ffffff"/>
  <rect x="56" y="523" width="1088" height="75" fill="#faf8f4"/>

  <!-- header -->
  <rect x="56" y="104" width="248" height="44" fill="#f0ece3"/>
  <rect x="308" y="104" width="415" height="44" fill="#1f4e79"/>
  <rect x="727" y="104" width="417" height="44" fill="#3d6b6b"/>
  <text x="72" y="132" font-size="13.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">DIMENSION</text>
  <text x="515" y="132" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">US DSCSA</text>
  <text x="935" y="132" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">EU FMD</text>

  <!-- grid -->
  <line x1="306" y1="148" x2="306" y2="598" stroke="#ece4d6" stroke-width="1.5"/>
  <line x1="725" y1="148" x2="725" y2="598" stroke="#ece4d6" stroke-width="1.5"/>
  <line x1="56" y1="223" x2="1144" y2="223" stroke="#f0eadf" stroke-width="1"/>
  <line x1="56" y1="298" x2="1144" y2="298" stroke="#f0eadf" stroke-width="1"/>
  <line x1="56" y1="373" x2="1144" y2="373" stroke="#f0eadf" stroke-width="1"/>
  <line x1="56" y1="448" x2="1144" y2="448" stroke="#f0eadf" stroke-width="1"/>
  <line x1="56" y1="523" x2="1144" y2="523" stroke="#f0eadf" stroke-width="1"/>
  <rect x="56" y="104" width="1088" height="494" fill="none" stroke="#e4d8c4" stroke-width="2"/>

  <!-- Row 1 -->
  <text x="72" y="190" font-size="14" font-weight="800" fill="#291c0e">Effective date &amp; basis</text>
  <text x="322" y="170" font-size="13" fill="#291c0e">Enacted 2013. Final EDDS enforcement:</text>
  <text x="322" y="188" font-size="13" fill="#291c0e">May 27 → Aug 27 → Nov 27 2025;</text>
  <text x="322" y="206" font-size="13" fill="#291c0e">small-dispenser exemption ends Nov 27 2026.</text>
  <text x="741" y="170" font-size="13" fill="#291c0e">Delegated Regulation 2016/161,</text>
  <text x="741" y="188" font-size="13" fill="#291c0e">effective Feb 9 2019 (EU/EEA).</text>
  <text x="741" y="206" font-size="13" fill="#291c0e">Italy delayed to 2027.</text>

  <!-- Row 2 -->
  <text x="72" y="258" font-size="14" font-weight="800" fill="#291c0e">Mandatory</text>
  <text x="72" y="276" font-size="14" font-weight="800" fill="#291c0e">DataMatrix fields</text>
  <text x="322" y="258" font-size="13" fill="#291c0e">NDC (or standardised drug code),</text>
  <text x="322" y="276" font-size="13" fill="#291c0e">randomised serial, lot, expiry.</text>
  <text x="741" y="258" font-size="13" fill="#291c0e">GTIN, randomised serial, batch/lot,</text>
  <text x="741" y="276" font-size="13" fill="#291c0e">expiry (+ NHRN where required).</text>

  <!-- Row 3 -->
  <text x="72" y="341" font-size="14" font-weight="800" fill="#291c0e">Tamper evidence</text>
  <text x="322" y="341" font-size="13" fill="#8b2d2d">Not mandated.</text>
  <text x="741" y="341" font-size="13" font-weight="700" fill="#1f6f3a">Mandatory on every prescription pack.</text>

  <!-- Row 4 -->
  <text x="72" y="416" font-size="14" font-weight="800" fill="#291c0e">Aggregation</text>
  <text x="322" y="406" font-size="13" fill="#291c0e">Not required by law; de-facto —</text>
  <text x="322" y="424" font-size="13" fill="#291c0e">McKesson, AmerisourceBergen, Cardinal.</text>
  <text x="741" y="416" font-size="13" fill="#291c0e">Voluntary in law and in practice.</text>

  <!-- Row 5 -->
  <text x="72" y="491" font-size="14" font-weight="800" fill="#291c0e">Verify at dispensing</text>
  <text x="322" y="481" font-size="13" fill="#291c0e">Not required; keep records +</text>
  <text x="322" y="499" font-size="13" fill="#291c0e">confirm supplier ATP status.</text>
  <text x="741" y="481" font-size="13" font-weight="700" fill="#1f6f3a">100% scan of every pack vs EMVS</text>
  <text x="741" y="499" font-size="13" font-weight="700" fill="#1f6f3a">before dispensing.</text>

  <!-- Row 6 -->
  <text x="72" y="566" font-size="14" font-weight="800" fill="#291c0e">Penalty regime</text>
  <text x="322" y="556" font-size="13" fill="#291c0e">Civil fines up to $500,000 / violation;</text>
  <text x="322" y="574" font-size="13" fill="#291c0e">criminal + license revocation (FD&amp;C Act).</text>
  <text x="741" y="556" font-size="13" fill="#291c0e">Set per member state; product</text>
  <text x="741" y="574" font-size="13" fill="#291c0e">detention + supply-chain blocking.</text>

  <text x="600" y="628" text-anchor="middle" font-size="12.5" fill="#6d5a3a">Sources: FDA DSCSA program · EU Delegated Regulation 2016/161 · EMVO · IntuitionLabs 2026</text>
</svg>
