<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="siHeroTitle siHeroDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="siHeroTitle">One RFID tag follows a surgical instrument through its whole reprocessing loop</title>
  <desc id="siHeroDesc">An autoclave-rated RFID tag is read at five reprocessing checkpoints — decontamination, tray assembly, sterilization, OR use and count-out — in place of the paper clipboard. Three outcomes follow: instrument loss falls from 5 to 15 percent toward 1 to 2 percent, retained foreign objects are caught before the patient is closed, and sterilisation records become Joint Commission audit-ready.</desc>

  <defs>
    <radialGradient id="siHeroBg" cx="50%" cy="14%" r="95%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f1ece0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#siHeroBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="61" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="0.3" fill="#291c0e">One tag, the whole instrument journey</text>
  <text x="600" y="90" text-anchor="middle" font-size="15" fill="#3d6b6b">An autoclave-rated RFID tag rides every reprocessing step the paper clipboard only guessed at</text>

  <!-- tag pill -->
  <rect x="356" y="108" width="488" height="34" rx="17" fill="#e9f1f0" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="600" y="130" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2c5454">Scanned at every checkpoint below — no clipboard required</text>

  <!-- rail -->
  <line x1="180" y1="225" x2="1000" y2="225" stroke="#d9c39a" stroke-width="3"/>
  <path d="M277 220 l11 5 l-11 5 z" fill="#c39a5f"/>
  <path d="M482 220 l11 5 l-11 5 z" fill="#c39a5f"/>
  <path d="M687 220 l11 5 l-11 5 z" fill="#c39a5f"/>
  <path d="M892 220 l11 5 l-11 5 z" fill="#c39a5f"/>

  <!-- station 1: decontamination -->
  <text x="180" y="176" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1.5" fill="#c39a5f">01</text>
  <circle cx="180" cy="225" r="36" fill="#e9f1f0" stroke="#3d6b6b" stroke-width="2.5"/>
  <path d="M180 206 q16 20 16 31 a16 16 0 1 1 -32 0 q0 -11 16 -31 z" fill="none" stroke="#2c5454" stroke-width="2.4"/>
  <text x="180" y="291" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Decontam</text>
  <text x="180" y="310" text-anchor="middle" font-size="12.5" fill="#4f4f4f">wash &amp; rinse</text>

  <!-- station 2: assembly -->
  <text x="385" y="176" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1.5" fill="#c39a5f">02</text>
  <circle cx="385" cy="225" r="36" fill="#e9f1f0" stroke="#3d6b6b" stroke-width="2.5"/>
  <rect x="365" y="216" width="40" height="20" rx="3" fill="none" stroke="#2c5454" stroke-width="2.2"/>
  <path d="M375 216 v20 M385 216 v20 M395 216 v20" stroke="#2c5454" stroke-width="1.6"/>
  <text x="385" y="291" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Assembly</text>
  <text x="385" y="310" text-anchor="middle" font-size="12.5" fill="#4f4f4f">tray build</text>

  <!-- station 3: sterilization -->
  <text x="590" y="176" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1.5" fill="#c39a5f">03</text>
  <circle cx="590" cy="225" r="36" fill="#e9f1f0" stroke="#3d6b6b" stroke-width="2.5"/>
  <path d="M582 200 q-4 -6 0 -12 M590 200 q-4 -6 0 -12 M598 200 q-4 -6 0 -12" fill="none" stroke="#2c5454" stroke-width="1.8"/>
  <rect x="570" y="214" width="40" height="26" rx="6" fill="none" stroke="#2c5454" stroke-width="2.2"/>
  <circle cx="590" cy="227" r="6" fill="none" stroke="#2c5454" stroke-width="2"/>
  <text x="590" y="291" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Sterilize</text>
  <text x="590" y="310" text-anchor="middle" font-size="12.5" fill="#4f4f4f">autoclave cycle</text>

  <!-- station 4: OR use -->
  <text x="795" y="176" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1.5" fill="#c39a5f">04</text>
  <circle cx="795" cy="225" r="36" fill="#e9f1f0" stroke="#3d6b6b" stroke-width="2.5"/>
  <path d="M791 208 h8 v9 h9 v8 h-9 v9 h-8 v-9 h-9 v-8 h9 z" fill="#2c5454"/>
  <text x="795" y="291" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">OR use</text>
  <text x="795" y="310" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the procedure</text>

  <!-- station 5: count-out -->
  <text x="1000" y="176" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1.5" fill="#c39a5f">05</text>
  <circle cx="1000" cy="225" r="36" fill="#e9f1f0" stroke="#1f6f3a" stroke-width="2.5"/>
  <path d="M985 226 l9 9 l19 -21" fill="none" stroke="#1f6f3a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1000" y="291" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Count-out</text>
  <text x="1000" y="310" text-anchor="middle" font-size="12.5" fill="#4f4f4f">before closing</text>

  <!-- outcome cards -->
  <!-- card 1 -->
  <rect x="80" y="356" width="320" height="150" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <rect x="80" y="356" width="320" height="8" rx="4" fill="#1f6f3a"/>
  <text x="240" y="412" text-anchor="middle" font-size="27" font-weight="800" fill="#1f6f3a">5–15% &#8594; 1–2%</text>
  <text x="240" y="446" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Instrument loss, cut</text>
  <text x="240" y="474" text-anchor="middle" font-size="12.5" fill="#4f4f4f">tracked items alert the moment</text>
  <text x="240" y="492" text-anchor="middle" font-size="12.5" fill="#4f4f4f">they leave a designated zone</text>

  <!-- card 2 -->
  <rect x="440" y="356" width="320" height="150" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <rect x="440" y="356" width="320" height="8" rx="4" fill="#3d6b6b"/>
  <text x="600" y="412" text-anchor="middle" font-size="27" font-weight="800" fill="#3d6b6b">Before closing</text>
  <text x="600" y="446" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Retained objects caught</text>
  <text x="600" y="474" text-anchor="middle" font-size="12.5" fill="#4f4f4f">count-in / count-out at the OR</text>
  <text x="600" y="492" text-anchor="middle" font-size="12.5" fill="#4f4f4f">doors, verified not eyeballed</text>

  <!-- card 3 -->
  <rect x="800" y="356" width="320" height="150" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <rect x="800" y="356" width="320" height="8" rx="4" fill="#c39a5f"/>
  <text x="960" y="412" text-anchor="middle" font-size="27" font-weight="800" fill="#a9781f">On demand</text>
  <text x="960" y="446" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Audit-ready records</text>
  <text x="960" y="474" text-anchor="middle" font-size="12.5" fill="#4f4f4f">time-stamped for Joint Commission,</text>
  <text x="960" y="492" text-anchor="middle" font-size="12.5" fill="#4f4f4f">not hand-written on a clipboard</text>

  <!-- footer takeaway -->
  <rect x="70" y="560" width="1060" height="76" rx="14" fill="#2a1d0f"/>
  <text x="100" y="596" font-size="15.5" font-weight="700" fill="#f0c98a">The shift:</text>
  <text x="188" y="596" font-size="15" fill="#f3ecdd">an instrument's history stops living on a clipboard and starts living in the record —</text>
  <text x="188" y="620" font-size="15" fill="#f3ecdd">where an auditor, a surgeon, or a CFO can pull it up in seconds instead of a filing cabinet.</text>
</svg>
