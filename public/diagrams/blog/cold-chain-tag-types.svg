<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Four cold-chain tag archetypes, cheapest to most capable</title>
<desc id="d">Four tag cards arranged from cheapest to most capable. Card one, passive temperature inlay, one to three dollars, no battery, reads on demand only. Card two, highlighted as the pharma workhorse, semi-passive logger, five to twenty-five dollars, six to twenty-four months, logs every one to fifteen minutes and holds one thousand to ten thousand readings on a coin cell. Card three, active plus cellular, fifty to five hundred dollars, reusable, real-time and in-transit. Card four, BLE-RFID hybrid, combines a live Bluetooth view with an RFID audit trail. A cost axis underneath runs from cheapest on the left to most capable on the right.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
