<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">What carries over from a Walmart RFID program to Target, and what does not</title>
<desc id="d">Target and Walmart share the RFID foundation: UHF EPC Gen2, ARC-certified inlays and SGTIN-96 encoding, so one tag SKU fits both retailers. Four things diverge. Read rate: both want 95 percent or better at receiving, but Target is slightly more lenient in the 90 to 95 percent band while Walmart enforces stricter scorecards. Placement: Target uses photo guides per category, Walmart uses text rules. EDI portal: Target runs Partners Online with EDI 856, Walmart runs Retail Link with EDI 856. Audit cadence: Target publishes monthly scorecards, Walmart publishes weekly.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TARGET vs WALMART · WHAT CARRIES OVER</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Same tag, two rulebooks</text>
<text x="600" y="132" text-anchor="middle" font-size="16" fill="#4f4f4f">The chip and encoding transfer intact; the placement, portal and audit cadence do not.</text>

<!-- shared banner -->
<rect x="90" y="168" width="1020" height="62" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="116" y="192" font-size="12" font-weight="800" letter-spacing="0.5" fill="#2c5454">SHARED FOUNDATION</text>
<text x="116" y="216" font-size="15" fill="#291c0e">UHF EPC Gen2 · ARC-certified · SGTIN-96 encoding — one tag SKU fits both retailers.</text>

<!-- column headers -->
<text x="488" y="266" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">TARGET</text>
<text x="907" y="266" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#4a5568">WALMART</text>

<!-- Row 1 -->
<text x="110" y="313" font-size="14" font-weight="700" fill="#291c0e">Read rate</text>
<rect x="286" y="281" width="404" height="52" rx="9" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="306" y="313" font-size="13.5" fill="#234a4a">95%+ · lenient at 90-95% band</text>
<rect x="704" y="281" width="406" height="52" rx="9" fill="#eef1f4" stroke="#c7cfd9" stroke-width="1.4"/>
<text x="724" y="313" font-size="13.5" fill="#3b4557">95%+ · stricter scorecards</text>

<!-- Row 2 -->
<text x="110" y="379" font-size="14" font-weight="700" fill="#291c0e">Placement</text>
<rect x="286" y="347" width="404" height="52" rx="9" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="306" y="379" font-size="13.5" fill="#234a4a">Photo guides, per category</text>
<rect x="704" y="347" width="406" height="52" rx="9" fill="#eef1f4" stroke="#c7cfd9" stroke-width="1.4"/>
<text x="724" y="379" font-size="13.5" fill="#3b4557">Text-rule placement</text>

<!-- Row 3 -->
<text x="110" y="445" font-size="14" font-weight="700" fill="#291c0e">EDI portal</text>
<rect x="286" y="413" width="404" height="52" rx="9" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="306" y="445" font-size="13.5" fill="#234a4a">Partners Online + EDI 856</text>
<rect x="704" y="413" width="406" height="52" rx="9" fill="#eef1f4" stroke="#c7cfd9" stroke-width="1.4"/>
<text x="724" y="445" font-size="13.5" fill="#3b4557">Retail Link + EDI 856</text>

<!-- Row 4 -->
<text x="110" y="511" font-size="14" font-weight="700" fill="#291c0e">Audit cadence</text>
<rect x="286" y="479" width="404" height="52" rx="9" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="306" y="511" font-size="13.5" fill="#234a4a">Monthly scorecards</text>
<rect x="704" y="479" width="406" height="52" rx="9" fill="#eef1f4" stroke="#c7cfd9" stroke-width="1.4"/>
<text x="724" y="511" font-size="13.5" fill="#3b4557">Weekly scorecards</text>

<text x="600" y="586" text-anchor="middle" font-size="14" fill="#4f4f4f">Reuse the tag and the encoder — budget separately for each retailer's EDI and scorecard.</text>
