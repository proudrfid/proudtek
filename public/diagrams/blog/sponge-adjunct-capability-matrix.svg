<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Capability matrix for the three FDA-cleared sponge-adjunct types</title>
<desc id="d">A matrix comparing three FDA-cleared adjunct types on three capabilities: count in and out, locate a sponge inside the patient, and identify each sponge uniquely. Bar-code counting (Stryker SurgiCount) can count and identify but cannot locate a sponge inside the patient. The RF detection wand (formerly RF Surgical, now Stryker) can locate but cannot count or identify. RFID (STERIS ORLocate) can do all three: count, locate and identify. RFID is the only type that satisfies every column.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COUNT · LOCATE · IDENTIFY</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">The three FDA-cleared adjunct types, on the axis the AORN guideline cares about.</text>

<!-- column headers -->
<text x="230" y="150" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TECHNOLOGY</text>
<text x="523" y="142" text-anchor="middle" font-size="13.5" font-weight="800" fill="#291c0e">Count</text>
<text x="523" y="162" text-anchor="middle" font-size="12" fill="#8a8a8a">in and out</text>
<text x="769" y="142" text-anchor="middle" font-size="13.5" font-weight="800" fill="#291c0e">Locate in patient</text>
<text x="769" y="162" text-anchor="middle" font-size="12" fill="#8a8a8a">detect a retained sponge</text>
<text x="1015" y="142" text-anchor="middle" font-size="13.5" font-weight="800" fill="#291c0e">Identify uniquely</text>
<text x="1015" y="162" text-anchor="middle" font-size="12" fill="#8a8a8a">which sponge is which</text>

<line x1="400" y1="176" x2="1138" y2="176" stroke="#e6dfd2" stroke-width="2"/>
<line x1="400" y1="176" x2="400" y2="566" stroke="#eee7d8" stroke-width="2"/>
<line x1="646" y1="176" x2="646" y2="566" stroke="#eee7d8" stroke-width="2"/>
<line x1="892" y1="176" x2="892" y2="566" stroke="#eee7d8" stroke-width="2"/>

<!-- Row 1: bar-code -->
<rect x="60" y="192" width="1078" height="112" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="84" y="238" font-size="16" font-weight="800" fill="#291c0e">Bar-code counting</text>
<text x="84" y="262" font-size="12" fill="#8a8a8a">Stryker SurgiCount Safety-Sponge</text>
<text x="84" y="284" font-size="12" fill="#8a8a8a">unique data-matrix code per sponge</text>
<path d="M 514 244 L 520 251 L 533 236" fill="none" stroke="#1f6f3a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="523" y="276" text-anchor="middle" font-size="12" fill="#8a8a8a">counts what passes</text>
<line x1="760" y1="238" x2="778" y2="256" stroke="#9aa3ad" stroke-width="3.2" stroke-linecap="round"/>
<line x1="778" y1="238" x2="760" y2="256" stroke="#9aa3ad" stroke-width="3.2" stroke-linecap="round"/>
<text x="769" y="276" text-anchor="middle" font-size="12" fill="#8a8a8a">no in-patient detection</text>
<path d="M 1006 244 L 1012 251 L 1025 236" fill="none" stroke="#1f6f3a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1015" y="276" text-anchor="middle" font-size="12" fill="#8a8a8a">unique code</text>

<!-- Row 2: RF wand -->
<rect x="60" y="312" width="1078" height="112" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="84" y="358" font-size="16" font-weight="800" fill="#291c0e">RF detection wand</text>
<text x="84" y="382" font-size="12" fill="#8a8a8a">RF Surgical Detection System (now Stryker)</text>
<text x="84" y="404" font-size="12" fill="#8a8a8a">"is a sponge present?" — yes or no</text>
<line x1="514" y1="358" x2="532" y2="376" stroke="#9aa3ad" stroke-width="3.2" stroke-linecap="round"/>
<line x1="532" y1="358" x2="514" y2="376" stroke="#9aa3ad" stroke-width="3.2" stroke-linecap="round"/>
<text x="523" y="396" text-anchor="middle" font-size="12" fill="#8a8a8a">no count</text>
<path d="M 760 364 L 766 371 L 779 356" fill="none" stroke="#1f6f3a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="769" y="396" text-anchor="middle" font-size="12" fill="#8a8a8a">detects in the field</text>
<line x1="1006" y1="358" x2="1024" y2="376" stroke="#9aa3ad" stroke-width="3.2" stroke-linecap="round"/>
<line x1="1024" y1="358" x2="1006" y2="376" stroke="#9aa3ad" stroke-width="3.2" stroke-linecap="round"/>
<text x="1015" y="396" text-anchor="middle" font-size="12" fill="#8a8a8a">no unique ID</text>

<!-- Row 3: RFID highlighted -->
<rect x="60" y="432" width="1078" height="120" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.4"/>
<text x="84" y="480" font-size="16" font-weight="800" fill="#2c5454">RFID counting + detection</text>
<text x="84" y="504" font-size="12" fill="#5c8a8a">STERIS ORLocate · HoveRead 6-in count, Locator 19-in in vivo</text>
<text x="84" y="526" font-size="12" fill="#5c8a8a">77+ tagged-sponge SKUs</text>
<path d="M 514 486 L 520 493 L 533 478" fill="none" stroke="#1f6f3a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="523" y="520" text-anchor="middle" font-size="12" fill="#5c8a8a">counts in / out</text>
<path d="M 760 486 L 766 493 L 779 478" fill="none" stroke="#1f6f3a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="769" y="520" text-anchor="middle" font-size="12" fill="#5c8a8a">locates in the patient</text>
<path d="M 1006 486 L 1012 493 L 1025 478" fill="none" stroke="#1f6f3a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1015" y="520" text-anchor="middle" font-size="12" fill="#5c8a8a">unique serial per item</text>

<text x="600" y="588" text-anchor="middle" font-size="12.5" fill="#8a8a8a">AORN's adjunct guidance points toward the system that both counts and detects. Many hospitals run more than one.</text>
</svg>
