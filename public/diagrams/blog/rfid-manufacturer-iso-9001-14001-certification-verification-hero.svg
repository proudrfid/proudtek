<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Real vs fake factory certificate — the five-minute verification check</title>
<desc id="d">Two factory certificates side by side under a magnifying glass. The real one, labeled "the real one", carries a certificate number, issue and expiry dates, a scope statement, an accreditation tri-logo and a gold seal, and a green verdict pill confirms it is found on the issuer's portal, current and in scope. The fake, labeled "the beautiful lie", looks nearly identical but its callouts read: no portal record, no audit dates, potato-resolution logo, issuer not accredited — and its verdict pill says no record on the issuer's portal, walk away. A caption notes that 5-15% of certificates in factory RFPs are fake, expired or issued by a body nobody accredited.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SUPPLIER DUE DILIGENCE · THE FIVE-MINUTE CERTIFICATE CHECK</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Spot the fake certificate before you sign the PO</text>

