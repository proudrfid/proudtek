<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Anatomy of a dock-door RFID portal and its read zone</title>
<desc id="d">On the left, a dock-door frame with two to four antennas mounted inside the posts, creating a shaded read zone that a tagged pallet passes through as it rolls in. On the right, four portal design facts: two to four antennas per door frame; pallets, carts and cartons read together in one pass; the EPC Gen2 Q-algorithm reads hundreds of tags without collisions; and conveyor variants read at up to 3 metres per second. Accuracy depends on antenna placement, power tuning and tag orientation.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DOCK-DOOR PORTAL, INSIDE THE READ ZONE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Two to four antennas turn a doorway into an automatic capture point.</text>

