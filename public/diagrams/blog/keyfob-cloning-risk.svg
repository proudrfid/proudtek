<text x="875" y="374" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">$15 handheld duplicator</text>

<line x1="875" y1="398" x2="875" y2="418" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="875,426 868,414 882,414" fill="#3d6b6b"/>

<text x="875" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#1f6f3a">Nothing usable captured</text>
<text x="875" y="474" text-anchor="middle" font-size="12.5" fill="#4f4f4f">clone attempts fail authentication</text>

<path d="M 875 492 l 30 11 v 22 c 0 18 -14 29 -30 36 c -16 -7 -30 -18 -30 -36 v -22 z" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2"/>
<path d="M 862 522 l 9 9 l 18 -20" fill="none" stroke="#1f6f3a" stroke-width="3"/>

<text x="600" y="608" text-anchor="middle" font-size="13.5" fill="#5c5c5c">For any access point protecting assets, personnel safety or sensitive areas,</text>
<text x="600" y="628" text-anchor="middle" font-size="13.5" fill="#5c5c5c">encrypted HF protocols are the minimum recommendation.</text>
