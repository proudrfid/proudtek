<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID read-range loss quantified by environmental factor, with mitigations</title>
<desc id="d">A table of five factors. Water and liquid, directly on fluid, cause 80 to 95 percent loss; mitigate by tagging the top of the stack or using an anti-liquid inlay. Metal proximity, flush contact, causes 80 to 100 percent loss; mitigate with purpose-built on-metal tags. Dense-tag fields of 2000-plus tags cost 5 to 10 dB of sensitivity; mitigate with Session 1 or 2 persistent flags and longer dwell. Orientation, a linear perpendicular tag, causes 80 to 95 percent loss; a circular antenna cuts that to only 3 to 5 dB. Occlusion by a pallet of boxes costs 4 to 8 dB; size dock-door portals for it.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RANGE LOSS, QUANTIFIED · BY FACTOR</text>
<text x="600" y="82" text-anchor="middle" font-size="15" fill="#4f4f4f">Benchmark losses from RAIN Alliance, GS1, Auburn RFID Lab and Voyantic reports.</text>

<!-- header -->
<text x="84" y="128" font-size="12.5" font-weight="800" letter-spacing="0.4" fill="#8a8a8a">FACTOR</text>
<text x="452" y="128" font-size="12.5" font-weight="800" letter-spacing="0.4" fill="#8a8a8a">WORST-CASE LOSS</text>
<text x="742" y="128" font-size="12.5" font-weight="800" letter-spacing="0.4" fill="#8a8a8a">MITIGATION</text>
<line x1="64" y1="140" x2="1136" y2="140" stroke="#e6dfd2" stroke-width="1.6"/>

<!-- row 1 water -->
<rect x="64" y="150" width="1072" height="76" rx="10" fill="#faf7f2"/>
<rect x="64" y="150" width="6" height="76" rx="3" fill="#8b2d2d"/>
<text x="92" y="184" font-size="16" font-weight="800" fill="#291c0e">Water &amp; liquid</text>
<text x="92" y="206" font-size="12.5" fill="#8a8a8a">directly on fluid / saline</text>
<text x="452" y="196" font-size="19" font-weight="800" fill="#8b2d2d">80–95%</text>
<text x="742" y="196" font-size="14" fill="#291c0e">Tag top of stack; anti-liquid inlay</text>

<!-- row 2 metal -->
<rect x="64" y="234" width="1072" height="76" rx="10" fill="#ffffff"/>
<rect x="64" y="234" width="6" height="76" rx="3" fill="#8b2d2d"/>
<text x="92" y="268" font-size="16" font-weight="800" fill="#291c0e">Metal proximity</text>
<text x="92" y="290" font-size="12.5" fill="#8a8a8a">tag flush on metal</text>
<text x="452" y="280" font-size="19" font-weight="800" fill="#8b2d2d">80–100%</text>
<text x="742" y="280" font-size="14" font-weight="700" fill="#291c0e">Purpose-built on-metal tags from the start</text>

<!-- row 3 dense -->
<rect x="64" y="318" width="1072" height="76" rx="10" fill="#faf7f2"/>
<rect x="64" y="318" width="6" height="76" rx="3" fill="#c39a5f"/>
<text x="92" y="352" font-size="16" font-weight="800" fill="#291c0e">Dense-tag field</text>
<text x="92" y="374" font-size="12.5" fill="#8a8a8a">2000+ tags in field</text>
<text x="452" y="364" font-size="19" font-weight="800" fill="#6d5a3a">5–10 dB</text>
<text x="742" y="364" font-size="14" fill="#291c0e">Session 1/2 persistent flag; longer dwell</text>

<!-- row 4 orientation -->
<rect x="64" y="402" width="1072" height="76" rx="10" fill="#ffffff"/>
<rect x="64" y="402" width="6" height="76" rx="3" fill="#8b2d2d"/>
<text x="92" y="436" font-size="16" font-weight="800" fill="#291c0e">Orientation</text>
<text x="92" y="458" font-size="12.5" fill="#8a8a8a">linear, perpendicular tag</text>
<text x="452" y="448" font-size="19" font-weight="800" fill="#8b2d2d">80–95%</text>
<text x="742" y="448" font-size="14" font-weight="700" fill="#291c0e">Circular antenna → only 3–5 dB</text>

<!-- row 5 occlusion -->
<rect x="64" y="486" width="1072" height="76" rx="10" fill="#faf7f2"/>
<rect x="64" y="486" width="6" height="76" rx="3" fill="#3d6b6b"/>
<text x="92" y="520" font-size="16" font-weight="800" fill="#291c0e">Occlusion</text>
<text x="92" y="542" font-size="12.5" fill="#8a8a8a">pallet of corrugated boxes</text>
<text x="452" y="532" font-size="19" font-weight="800" fill="#2c5454">4–8 dB</text>
<text x="742" y="532" font-size="14" fill="#291c0e">Size dock-door portals to account for it</text>

<text x="600" y="596" text-anchor="middle" font-size="14" fill="#4f4f4f">The two biggest losses — metal and orientation — also have the cleanest purpose-built fixes.</text>
</svg>
