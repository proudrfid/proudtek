<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Air versus sea freight for RFID cargo — the speed-cost tradeoff</title>
<desc id="d">Two panels compare shipping RFID tags from China. Air freight: transit 3-7 days, rate $4-8/kg, express DHL or FedEx $7-15/kg, profile fast and expensive. Sea freight: transit 25-45 days, FCL rate $0.30-1.00/kg, LCL $80-250 per cubic meter, profile slow and cheap. Between them, a 10-20 times cost gap — the premium buys weeks off the calendar.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">AIR vs SEA — THE FREIGHT TRADEOFF</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The extra money buys one thing: weeks off the calendar.</text>

<!-- AIR panel -->
<rect x="76" y="130" width="470" height="310" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="76" y="130" width="470" height="8" rx="4" fill="#3d6b6b"/>
<text x="311" y="174" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">AIR FREIGHT</text>
<line x1="104" y1="196" x2="518" y2="196" stroke="#eef5f5" stroke-width="1.4"/>
<text x="104" y="230" font-size="15" font-weight="700" fill="#291c0e">Transit</text>
<text x="518" y="230" text-anchor="end" font-size="15" font-weight="800" fill="#2c5454">3-7 days</text>
<line x1="104" y1="252" x2="518" y2="252" stroke="#eef5f5" stroke-width="1.2"/>
<text x="104" y="286" font-size="15" font-weight="700" fill="#291c0e">Rate</text>
<text x="518" y="286" text-anchor="end" font-size="15" font-weight="800" fill="#2c5454">$4-8/kg</text>
<line x1="104" y1="308" x2="518" y2="308" stroke="#eef5f5" stroke-width="1.2"/>
<text x="104" y="342" font-size="15" font-weight="700" fill="#291c0e">Express (DHL/FedEx)</text>
<text x="518" y="342" text-anchor="end" font-size="15" font-weight="800" fill="#2c5454">$7-15/kg</text>
<line x1="104" y1="364" x2="518" y2="364" stroke="#eef5f5" stroke-width="1.2"/>
<text x="104" y="398" font-size="15" font-weight="700" fill="#291c0e">Profile</text>
<text x="518" y="398" text-anchor="end" font-size="14" font-weight="700" fill="#177a92">fast · expensive</text>

<!-- SEA panel -->
<rect x="654" y="130" width="470" height="310" rx="14" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.8"/>
<rect x="654" y="130" width="470" height="8" rx="4" fill="#4a5568"/>
<text x="889" y="174" text-anchor="middle" font-size="16" font-weight="800" fill="#3f4657">SEA FREIGHT</text>
<line x1="682" y1="196" x2="1096" y2="196" stroke="#eee9df" stroke-width="1.4"/>
<text x="682" y="230" font-size="15" font-weight="700" fill="#291c0e">Transit</text>
<text x="1096" y="230" text-anchor="end" font-size="15" font-weight="800" fill="#4a5568">25-45 days</text>
<line x1="682" y1="252" x2="1096" y2="252" stroke="#eee9df" stroke-width="1.2"/>
<text x="682" y="286" font-size="15" font-weight="700" fill="#291c0e">Rate (FCL)</text>
<text x="1096" y="286" text-anchor="end" font-size="15" font-weight="800" fill="#4a5568">$0.30-1.00/kg</text>
<line x1="682" y1="308" x2="1096" y2="308" stroke="#eee9df" stroke-width="1.2"/>
<text x="682" y="342" font-size="15" font-weight="700" fill="#291c0e">LCL</text>
<text x="1096" y="342" text-anchor="end" font-size="15" font-weight="800" fill="#4a5568">$80-250/CBM</text>
<line x1="682" y1="364" x2="1096" y2="364" stroke="#eee9df" stroke-width="1.2"/>
<text x="682" y="398" font-size="15" font-weight="700" fill="#291c0e">Profile</text>
<text x="1096" y="398" text-anchor="end" font-size="14" font-weight="700" fill="#5c5c5c">slow · cheap</text>

<!-- gap band -->
<text x="600" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">air is faster · sea is cheaper · the spread is the decision</text>
<rect x="360" y="478" width="480" height="86" rx="18" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<text x="600" y="524" text-anchor="middle" font-size="40" font-weight="800" fill="#2c5454">10-20×</text>
<text x="600" y="550" text-anchor="middle" font-size="14" font-weight="700" fill="#6d5a3a">air-over-sea cost gap, per kg</text>

<text x="600" y="606" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Buy speed only where speed pays — sea the bulk, air the part that can't wait.</text>
</svg>
