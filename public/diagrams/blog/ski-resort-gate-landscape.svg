<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The major-resort RFID gate landscape</title>
<desc id="d">Who runs which stack. Vail's Epic Pass uses a custom UHF stack across 37 owned resorts, powering the EpicMix layer. Alterra's Ikon Pass spans 50-plus partner resorts mostly on SKIDATA gates, with one card ID mapped to a shared database. SKIDATA is the dominant global gate platform, HF and NFC led with newer UHF and Mobile Flow BLE. Axess runs at Mt. Rose, Mammoth and many European resorts with strong long-range UHF and cashless. TeamAxess and MagicPass are smaller stacks; NXP NTAG and DESFire chips read across all three when correctly specified.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHO RUNS WHICH STACK</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Two pass alliances, three gate vendors — and what compatibility means in practice.</text>

<text x="205" y="120" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PLAYER</text>
<text x="740" y="120" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">STACK &amp; WHAT IT MEANS</text>

<rect x="64" y="134" width="1072" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="84" y="150" width="262" height="44" rx="22" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/><text x="215" y="178" text-anchor="middle" font-size="14.5" font-weight="800" fill="#2c5454">Vail · Epic Pass</text>
<line x1="364" y1="146" x2="364" y2="198" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="384" y="170" font-size="14.5" fill="#291c0e">Custom UHF stack across 37 owned resorts —</text>
<text x="384" y="192" font-size="13" fill="#5c5c5c">longer-range scanning powers the EpicMix layer.</text>

<rect x="64" y="222" width="1072" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="84" y="238" width="262" height="44" rx="22" fill="#faf3e6" stroke="#e4c98f" stroke-width="1.4"/><text x="215" y="266" text-anchor="middle" font-size="14.5" font-weight="800" fill="#a07d43">Alterra · Ikon</text>
<line x1="364" y1="234" x2="364" y2="286" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="384" y="258" font-size="14.5" fill="#291c0e">50+ partner resorts, mostly on SKIDATA gates —</text>
<text x="384" y="280" font-size="13" fill="#5c5c5c">one card ID maps to the shared partner database.</text>

<rect x="64" y="310" width="1072" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="84" y="326" width="262" height="44" rx="22" fill="#eef1f5" stroke="#c3ccd8" stroke-width="1.4"/><text x="215" y="354" text-anchor="middle" font-size="14.5" font-weight="800" fill="#3a4657">SKIDATA</text>
<line x1="364" y1="322" x2="364" y2="374" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="384" y="346" font-size="14.5" fill="#291c0e">The dominant gate platform globally —</text>
<text x="384" y="368" font-size="13" fill="#5c5c5c">HF/NFC-led with newer UHF; Mobile Flow adds BLE.</text>

<rect x="64" y="398" width="1072" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="84" y="414" width="262" height="44" rx="22" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/><text x="215" y="442" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f6f3a">Axess</text>
<line x1="364" y1="410" x2="364" y2="462" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="384" y="434" font-size="14.5" fill="#291c0e">Mt. Rose, Mammoth and many European resorts —</text>
<text x="384" y="456" font-size="13" fill="#5c5c5c">strong long-range UHF plus cashless on one credential.</text>

<rect x="64" y="486" width="1072" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="84" y="502" width="262" height="44" rx="22" fill="#f4efe4" stroke="#d8cdb8" stroke-width="1.4"/><text x="215" y="530" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6d5a3a">TeamAxess · MagicPass</text>
<line x1="364" y1="498" x2="364" y2="550" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="384" y="522" font-size="14.5" fill="#291c0e">Smaller resort-management stacks —</text>
<text x="384" y="544" font-size="13" fill="#5c5c5c">NXP NTAG / DESFire read across all three when specified.</text>

<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Match your chip family to the gates you'll actually pass through — that's the whole compatibility question.</text>
</svg>
