<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Cast in, not stuck on — cross-section of an RFID concrete embed tag</title>
  <desc id="d">Cross-section of a cured precast concrete element with a cast-in RFID tag. On the left, a handheld UHF reader is held at the finished surface. Inside the concrete, a rebar grid carries the tag, clipped at a rebar intersection through its integrated cable-tie slot. A dimension arrow marks the concrete cover between the finished surface and the tag: 25 to 75 millimetres per the ACI 301 band, 25 to 50 millimetres optimal. A dashed signal arc shows the read path from the reader through the cover to the tag; the stat line states that the tag reads through 5 to 10 centimetres of cured cover at 0.3 to 1.0 metres from the surface. The right column lists the three placement options — form-face adhesive consumed as the concrete bonds, rebar clip set at inspection, and post-install drill-and-grout pocket for existing elements — plus the survival envelope: pH 12 to 13 pore-water alkalinity, curing exotherm up to 70 degrees Celsius at the core, service temperature minus 40 to plus 80 degrees Celsius, and ASTM C666 freeze-thaw durability past 300 cycles.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d6b6b"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d5a3a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID CONCRETE EMBED TAG — CAST-IN INSTALLATION</text>
  <text x="600" y="98" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Cast in, not stuck on</text>

  <!-- ── LEFT: cross-section ──────────────────────────────────────── -->
  <rect x="52" y="126" width="648" height="430" rx="16" fill="#f2f4f7" stroke="#cdd3dc" stroke-width="1.5"/>
  <text x="376" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#37404e">Inside the cured element</text>
  <text x="376" y="182" text-anchor="middle" font-size="12.5" fill="#5c5c5c">cross-section — the ID is part of the structural matrix</text>

  <rect x="150" y="206" width="500" height="292" fill="#e7e4db" stroke="#cfc9bc" stroke-width="1.5"/>
  <circle cx="205" cy="243" r="7" fill="#d8d2c4"/>
  <circle cx="330" cy="266" r="5" fill="#d8d2c4"/>
  <circle cx="598" cy="238" r="6" fill="#d8d2c4"/>
  <circle cx="560" cy="304" r="5" fill="#d8d2c4"/>
  <circle cx="196" cy="468" r="6" fill="#d8d2c4"/>
  <circle cx="362" cy="470" r="5" fill="#d8d2c4"/>
  <circle cx="618" cy="454" r="7" fill="#d8d2c4"/>
  <circle cx="432" cy="412" r="5" fill="#d8d2c4"/>

  <rect x="147" y="206" width="5" height="292" fill="#4a5568"/>
  <text transform="rotate(-90 166 262)" x="166" y="262" text-anchor="middle" font-size="12.5" fill="#4f4f4f">finished surface</text>

  <rect x="168" y="328" width="464" height="11" rx="5" fill="#4a5568"/>
  <rect x="168" y="432" width="464" height="11" rx="5" fill="#4a5568"/>
  <rect x="280" y="236" width="11" height="238" rx="5" fill="#4a5568"/>
  <rect x="500" y="236" width="11" height="238" rx="5" fill="#4a5568"/>

  <rect x="258" y="316" width="56" height="34" rx="7" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <rect x="266" y="326" width="9" height="9" rx="2" fill="#b0854d"/>
  <line x1="281" y1="330" x2="306" y2="330" stroke="#b0854d" stroke-width="2"/>
  <line x1="281" y1="337" x2="306" y2="337" stroke="#b0854d" stroke-width="2"/>

  <line x1="314" y1="322" x2="400" y2="262" stroke="#c39a5f" stroke-width="1.5"/>
  <rect x="400" y="238" width="236" height="48" rx="9" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="518" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#291c0e">tag at a rebar intersection</text>
  <text x="518" y="276" text-anchor="middle" font-size="12.5" fill="#5c5c5c">integrated cable-tie slot</text>

  <line x1="155" y1="374" x2="255" y2="374" stroke="#6d5a3a" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="196" y="398" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">cover 25–75 mm (ACI 301)</text>
  <text x="196" y="415" text-anchor="middle" font-size="12" fill="#6d5a3a">optimal 25–50 mm</text>

  <rect x="58" y="300" width="76" height="66" rx="10" fill="#37404e"/>
  <text x="96" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">UHF</text>
  <text x="96" y="340" text-anchor="middle" font-size="12" fill="#d7dbe2">handheld</text>
  <text x="96" y="356" text-anchor="middle" font-size="12" fill="#d7dbe2">reader</text>

  <path d="M 138 326 C 180 292, 224 292, 254 320" fill="none" stroke="#3d6b6b" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arr)"/>

  <text x="376" y="534" text-anchor="middle" font-size="14.5" font-weight="700" fill="#234a4a">reads through 5–10 cm cured cover · 0.3–1.0 m at the surface</text>

  <!-- ── RIGHT: placement options + envelope ──────────────────────── -->
  <text x="934" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#291c0e">Three ways in</text>
  <text x="934" y="182" text-anchor="middle" font-size="12.5" fill="#5c5c5c">fixed before the pour — or drilled in after</text>

  <rect x="720" y="196" width="428" height="66" rx="12" fill="#f2f4f7" stroke="#cdd3dc" stroke-width="1.5"/>
  <text x="744" y="223" font-size="15" font-weight="700" fill="#37404e">Form-face adhesive</text>
  <text x="744" y="245" font-size="12.5" fill="#5c5c5c">temporary pad — consumed as the concrete bonds</text>

  <rect x="720" y="272" width="428" height="66" rx="12" fill="#f2f4f7" stroke="#cdd3dc" stroke-width="1.5"/>
  <text x="744" y="299" font-size="15" font-weight="700" fill="#37404e">Rebar clip</text>
  <text x="744" y="321" font-size="12.5" fill="#5c5c5c">cable-tie slot at an intersection, set at inspection</text>

  <rect x="720" y="348" width="428" height="66" rx="12" fill="#f2f4f7" stroke="#cdd3dc" stroke-width="1.5"/>
  <text x="744" y="375" font-size="15" font-weight="700" fill="#37404e">Post-install pocket</text>
  <text x="744" y="397" font-size="12.5" fill="#5c5c5c">drill-and-grout retrofit into existing elements</text>

  <rect x="720" y="428" width="428" height="128" rx="12" fill="#eef5f5" stroke="#c2d6d6" stroke-width="1.5"/>
  <text x="744" y="456" font-size="14" font-weight="700" fill="#234a4a">Survival envelope</text>
  <text x="744" y="482" font-size="12.5" fill="#2c5454">pH 12–13 pore-water alkalinity</text>
  <text x="744" y="502" font-size="12.5" fill="#2c5454">curing exotherm — up to 70 °C core</text>
  <text x="744" y="522" font-size="12.5" fill="#2c5454">service −40 °C to +80 °C</text>
  <text x="744" y="542" font-size="12.5" fill="#2c5454">ASTM C666 freeze-thaw — 300+ cycles</text>

  <text x="600" y="600" text-anchor="middle" font-size="13" fill="#4f4f4f">All numbers from this page's specification table — cover bands per ACI 301, read window 0.3–1.0 m through 5–10 cm of cover.</text>
</svg>
