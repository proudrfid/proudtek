<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID festival wristbands: one band, four jobs</title>
<desc id="d">A fabric RFID wristband with a chip inlay and one-way slide lock sits at the center of four jobs: gate access moving 15-20 attendees per minute versus 4-6 with manual scanning; cashless payments with a 15-30 percent per-capita spending lift; zone analytics with real-time density maps for crowd flow, staffing and vendor placement; and sponsor activation via tap points at booths. A lead-time strip underneath warns that projects fail on the lead time, not the technology: 15-25 business days from artwork approval plus 5-7 days shipping, ordered at 105-110 percent of expected attendance.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
