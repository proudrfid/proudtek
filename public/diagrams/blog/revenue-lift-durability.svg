<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Which parts of the RFID revenue lift last, and which fade</title>
<desc id="d">The 15 to 30 percent lift split into three columns by shelf life. Sustainable, in green: point-of-sale friction reduction giving 2 to 3 times more served per hour, and impulse capture of 1.5 to 2 times more transactions, both compounding for the life of the deployment. Decays over time, in gold: pre-load breakage netting 1 to 3 percent of preload, and the top-up bonus that lifts pre-load 25 to 40 percent in year one but fades by year three. Incremental, in teal: sponsor-funded perks worth 50,000 to 500,000 dollars per event, a new revenue line rather than part of the lift.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHICH PARTS OF THE LIFT LAST</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">The 15–30% is real — but it is a stack of mechanisms with different shelf lives.</text>
<rect x="76" y="168" width="336" height="382" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/>
<rect x="76" y="168" width="336" height="8" rx="4" fill="#1f6f3a"/>
<text x="244" y="204" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">SUSTAINABLE</text>
<text x="244" y="228" text-anchor="middle" font-size="12.5" fill="#8a8a8a">repeats every edition</text>
<rect x="98" y="272" width="292" height="118" rx="12" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="116" y="306" font-size="15" font-weight="800" fill="#291c0e">Friction at POS</text>
<text x="116" y="342" font-size="22" font-weight="800" fill="#1f6f3a">2–3× served / hr</text>
<text x="116" y="370" font-size="12.5" fill="#5c5c5c">1–2 sec tap vs 15–30 sec cash</text>
<rect x="98" y="404" width="292" height="118" rx="12" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="116" y="438" font-size="15" font-weight="800" fill="#291c0e">Impulse capture</text>
<text x="116" y="474" font-size="22" font-weight="800" fill="#1f6f3a">×1.5–2 txns</text>
<text x="116" y="502" font-size="12.5" fill="#5c5c5c">the band kills the wallet decision</text>
<rect x="432" y="168" width="336" height="382" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="432" y="168" width="336" height="8" rx="4" fill="#c39a5f"/>
<text x="600" y="204" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DECAYS OVER TIME</text>
<text x="600" y="228" text-anchor="middle" font-size="12.5" fill="#8a8a8a">fades or needs modeling</text>
<rect x="454" y="272" width="292" height="118" rx="12" fill="#ffffff" stroke="#e4c98f" stroke-width="1.4"/>
<text x="472" y="306" font-size="15" font-weight="800" fill="#291c0e">Pre-load breakage</text>
<text x="472" y="342" font-size="22" font-weight="800" fill="#6d5a3a">net 1–3%</text>
<text x="472" y="370" font-size="12.5" fill="#5c5c5c">5–15% unredeemed, minus refunds</text>
<rect x="454" y="404" width="292" height="118" rx="12" fill="#ffffff" stroke="#e4c98f" stroke-width="1.4"/>
<text x="472" y="438" font-size="15" font-weight="800" fill="#291c0e">Top-up bonus</text>
<text x="472" y="474" font-size="22" font-weight="800" fill="#6d5a3a">+25–40% yr 1</text>
<text x="472" y="502" font-size="12.5" fill="#5c5c5c">marginal lift fades by year three</text>
<rect x="788" y="168" width="336" height="382" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="788" y="168" width="336" height="8" rx="4" fill="#3d6b6b"/>
<text x="956" y="204" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#2c5454">INCREMENTAL</text>
<text x="956" y="228" text-anchor="middle" font-size="12.5" fill="#8a8a8a">new money, not ‘lift’</text>
<rect x="810" y="272" width="292" height="118" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="828" y="306" font-size="15" font-weight="800" fill="#291c0e">Sponsor perks</text>
<text x="828" y="342" font-size="22" font-weight="800" fill="#2c5454">$50K–$500K</text>
<text x="828" y="370" font-size="12.5" fill="#5c5c5c">cashback &amp; co-branded top-ups</text>
<rect x="810" y="404" width="292" height="118" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="828" y="438" font-size="15" font-weight="800" fill="#291c0e">New inventory</text>
<text x="828" y="474" font-size="22" font-weight="800" fill="#2c5454">incremental</text>
<text x="828" y="502" font-size="12.5" fill="#5c5c5c">revenue that didn't exist pre-RFID</text>
<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Fund the deployment on the parts that compound; treat the bonus and the breakage as upside.</text>
</svg>
