<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">When NFC on-tag memory matters versus a cloud-resolved URL</title>
<desc id="d">A decision diagram. The default for about 95 percent of consumer NFC programs is a small URL on the tag with rich data in the cloud, for which NTAG213 with 144 bytes is sufficient. On-tag memory earns its place in four cases: offline operation with no network, using NTAG215, 216 or I2C Plus; privacy or ephemeral payloads like tickets and tokens, using NTAG213 or 215; sensor and counter buffers, using NTAG I2C Plus; and DPP or authentication payloads carrying a GS1 Digital Link plus SUN CMAC, using NTAG 424 DNA with 416 bytes.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ON-TAG MEMORY: THE EXCEPTION, NOT THE RULE</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Default to a small URL and a cloud backend — then know the four cases that need bytes on the tag.</text>

<!-- default banner -->
<rect x="64" y="104" width="1072" height="92" rx="14" fill="#eef7f0" stroke="#7fbf9a" stroke-width="2"/>
<text x="92" y="138" font-size="16.5" font-weight="800" fill="#1f6f3a">DEFAULT (≈95% of consumer NFC): small URL on tag, rich data in cloud</text>
<text x="92" y="164" font-size="13.5" fill="#33595a">NTAG213 (144 B) is sufficient — product info, DPP data, authentication payload and analytics all live behind the URL.</text>
<text x="92" y="184" font-size="12.5" font-style="italic" fill="#6a8a8a">Putting full passport data on the tag is the most common over-engineering pattern in EU DPP pilots.</text>

<text x="600" y="232" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8a7a55">ON-TAG MEMORY EARNS ITS PLACE WHEN…</text>

<!-- 4 exception cards -->
<rect x="64" y="248" width="256" height="278" rx="13" fill="#f1f3f7" stroke="#c7cdd8" stroke-width="1.6"/>
<text x="84" y="284" font-size="15.5" font-weight="800" fill="#3a4453">Offline</text>
<text x="84" y="304" font-size="15.5" font-weight="800" fill="#3a4453">operation</text>
<text x="84" y="332" font-size="12.5" fill="#4a5568">No network: basements,</text>
<text x="84" y="350" font-size="12.5" fill="#4a5568">remote logistics,</text>
<text x="84" y="368" font-size="12.5" fill="#4a5568">aviation maintenance.</text>
<text x="84" y="392" font-size="12.5" fill="#4a5568">vCard, config, equipment</text>
<text x="84" y="410" font-size="12.5" fill="#4a5568">metadata survive offline.</text>
<line x1="84" y1="462" x2="300" y2="462" stroke="#dde1e8" stroke-width="1.3"/>
<text x="84" y="486" font-size="12" font-weight="800" letter-spacing="0.4" fill="#8a7a55">USE</text>
<text x="84" y="508" font-size="14" font-weight="800" fill="#3a4453">NTAG215 / 216 / I2C Plus</text>

<rect x="344" y="248" width="256" height="278" rx="13" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="364" y="284" font-size="15.5" font-weight="800" fill="#2c5454">Privacy /</text>
<text x="364" y="304" font-size="15.5" font-weight="800" fill="#2c5454">ephemeral</text>
<text x="364" y="332" font-size="12.5" fill="#4f4f4f">Short-lived tickets,</text>
<text x="364" y="350" font-size="12.5" fill="#4f4f4f">tokens, voucher codes</text>
<text x="364" y="368" font-size="12.5" fill="#4f4f4f">stored on-tag so there is</text>
<text x="364" y="386" font-size="12.5" fill="#4f4f4f">no central log of taps.</text>
<text x="364" y="410" font-size="12.5" fill="#4f4f4f">Regulatory-driven.</text>
<line x1="364" y1="462" x2="580" y2="462" stroke="#d7e3e3" stroke-width="1.3"/>
<text x="364" y="486" font-size="12" font-weight="800" letter-spacing="0.4" fill="#8a7a55">USE</text>
<text x="364" y="508" font-size="14" font-weight="800" fill="#2c5454">NTAG213 / 215</text>

<rect x="624" y="248" width="256" height="278" rx="13" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.6"/>
<text x="644" y="284" font-size="15.5" font-weight="800" fill="#6d5a3a">Sensor &amp;</text>
<text x="644" y="304" font-size="15.5" font-weight="800" fill="#6d5a3a">counter</text>
<text x="644" y="332" font-size="12.5" fill="#5c5c5c">Chip talks to a micro-</text>
<text x="644" y="350" font-size="12.5" fill="#5c5c5c">controller over I²C;</text>
<text x="644" y="368" font-size="12.5" fill="#5c5c5c">phone reads/writes</text>
<text x="644" y="386" font-size="12.5" fill="#5c5c5c">sensor data. Memory =</text>
<text x="644" y="404" font-size="12.5" fill="#5c5c5c">the reading-window buffer.</text>
<line x1="644" y1="462" x2="860" y2="462" stroke="#ece1c8" stroke-width="1.3"/>
<text x="644" y="486" font-size="12" font-weight="800" letter-spacing="0.4" fill="#8a7a55">USE</text>
<text x="644" y="508" font-size="14" font-weight="800" fill="#6d5a3a">NTAG I2C Plus</text>

<rect x="904" y="248" width="232" height="278" rx="13" fill="#eef5f5" stroke="#bcd6d6" stroke-width="1.6"/>
<text x="924" y="284" font-size="15.5" font-weight="800" fill="#234a4a">DPP / auth</text>
<text x="924" y="312" font-size="12.5" fill="#33595a">GS1 Digital Link with</text>
<text x="924" y="330" font-size="12.5" fill="#33595a">GTIN + serial, plus the</text>
<text x="924" y="348" font-size="12.5" fill="#33595a">SUN / CMAC parameters</text>
<text x="924" y="366" font-size="12.5" fill="#33595a">the chip injects on tap.</text>
<text x="924" y="390" font-size="12.5" fill="#33595a">Longer payload → cloud.</text>
<line x1="924" y1="462" x2="1116" y2="462" stroke="#d7e3e3" stroke-width="1.3"/>
<text x="924" y="486" font-size="12" font-weight="800" letter-spacing="0.4" fill="#8a7a55">USE</text>
<text x="924" y="508" font-size="14" font-weight="800" fill="#234a4a">NTAG 424 DNA (416 B)</text>

<text x="600" y="562" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">If the tag can phone home, store a URL. If it can't — or must not — that's when bytes on the chip matter.</text>
</svg>
