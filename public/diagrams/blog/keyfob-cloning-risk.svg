<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">What a $15 handheld duplicator does to an EM4100 fob versus an AES-128 fob</title>
<desc id="d">Two panels. Left, LF EM4100 in plaintext: the fob broadcasts its ID in the clear with no authentication and no challenge, a $15 handheld duplicator captures it, and the result is a working clone in seconds — the reader cannot tell the original and the clone apart. Right, HF AES-128 protocols such as DESFire and iCLASS SE: reader and fob run mutual authentication as challenge-response with diversified keys, the same $15 duplicator captures nothing usable, and clone attempts fail authentication. Bottom line: for any access point protecting assets, personnel safety or sensitive areas, encrypted HF protocols are the minimum recommendation.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
