<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Two coils in one dual-frequency key-fob housing</title>
  <desc id="d">A cutaway of one 40 by 32 by 6 mm ABS key-fob housing. A large-diameter 125 kHz LF coil sits on the outer layer and a small planar 13.56 MHz HF coil on the inner layer, routed orthogonally, so cross-coupling stays under 1 dB, verified per unit.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TWO COILS, ONE HOUSING</text>
  <text x="600" y="96" text-anchor="middle" font-size="16" fill="#5c5c5c">One 40 × 32 × 6 mm ABS housing · ultrasonic-welded · IP65</text>

  <!-- split ring -->
  <circle cx="600" cy="132" r="30" fill="none" stroke="#4a5568" stroke-width="9"/>
  <rect x="590" y="160" width="20" height="16" fill="#4a5568"/>

  <!-- housing -->
  <rect x="440" y="172" width="320" height="358" rx="40" fill="#f4efe4" stroke="#c39a5f" stroke-width="2.5"/>

  <!-- LF coil (large, outer layer) -->
  <ellipse cx="600" cy="300" rx="120" ry="72" fill="none" stroke="#3d6b6b" stroke-width="11"/>
  <ellipse cx="600" cy="300" rx="96" ry="54" fill="none" stroke="#3d6b6b" stroke-width="4" opacity="0.45"/>
  <!-- HF coil (small planar, inner layer) -->
  <rect x="548" y="372" width="104" height="92" rx="8" fill="none" stroke="#6d5a3a" stroke-width="8"/>
  <rect x="562" y="386" width="76" height="64" rx="4" fill="none" stroke="#6d5a3a" stroke-width="3" opacity="0.5"/>

  <!-- LF callout (left) -->
  <line x1="300" y1="304" x2="478" y2="300" stroke="#3d6b6b" stroke-width="2"/>
  <circle cx="480" cy="300" r="4" fill="#3d6b6b"/>
  <text x="92" y="292" font-size="17" font-weight="700" fill="#2c5454">LF coil — 125 kHz</text>
  <text x="92" y="316" font-size="14" fill="#3d6b6b">large-diameter coil</text>
  <text x="92" y="338" font-size="13" fill="#5c5c5c">outer layer</text>

  <!-- HF callout (right) -->
  <line x1="652" y1="418" x2="900" y2="418" stroke="#6d5a3a" stroke-width="2"/>
  <circle cx="652" cy="418" r="4" fill="#6d5a3a"/>
  <text x="1108" y="400" text-anchor="end" font-size="17" font-weight="700" fill="#6d5a3a">HF coil — 13.56 MHz</text>
  <text x="1108" y="424" text-anchor="end" font-size="14" fill="#6d5a3a">small planar coil</text>
  <text x="1108" y="446" text-anchor="end" font-size="13" fill="#5c5c5c">inner layer · orthogonal</text>

  <!-- result band -->
  <rect x="360" y="556" width="480" height="74" rx="16" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="588" text-anchor="middle" font-size="16" font-weight="600" fill="#2c5454">Orthogonal routing keeps the coils apart</text>
  <text x="600" y="613" text-anchor="middle" font-size="15" fill="#3d6b6b">&lt; 1 dB cross-coupling · verified per unit</text>
</svg>
