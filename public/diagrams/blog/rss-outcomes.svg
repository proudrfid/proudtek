<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="outTitle outDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="outTitle">Retained sponge events 2 to 0 and Joint Commission findings 14 to 2</title>
  <desc id="outDesc">Two before-and-after results. Retained surgical sponge events fell from 2 in the 12 months before deployment to 0 across the 18 months after — eliminated. Joint Commission count-documentation findings fell from 14 in the 2024 survey to 2 in the next survey cycle, an 87% reduction.</desc>
  <defs>
    <radialGradient id="outBg" cx="50%" cy="18%" r="95%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#outBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="62" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="1.2" fill="#6d5a3a">TWO NUMBERS THAT MOVED THE RIGHT WAY</text>

  <!-- Panel 1: RSS events -->
  <rect x="80" y="112" width="1040" height="214" rx="16" fill="#faf6ee" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="112" y="152" font-size="15" font-weight="800" letter-spacing="1.1" fill="#6d5a3a">RETAINED SPONGE EVENTS</text>
  <text x="280" y="268" text-anchor="middle" font-size="128" font-weight="800" fill="#8b2d2d">2</text>
  <text x="280" y="304" text-anchor="middle" font-size="16" fill="#6d5a3a">prior 12 months</text>
  <line x1="404" y1="228" x2="556" y2="228" stroke="#c39a5f" stroke-width="6" stroke-linecap="round"/>
  <path d="M556 228 l-20 -12 v24 z" fill="#c39a5f"/>
  <g fill="none" stroke="#1fcefb" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <path d="M628 204 a30 30 0 0 1 0 52"/>
    <path d="M646 190 a46 46 0 0 1 0 80"/>
  </g>
  <text x="712" y="268" text-anchor="middle" font-size="128" font-weight="800" fill="#1f6f3a">0</text>
  <text x="712" y="304" text-anchor="middle" font-size="16" fill="#6d5a3a">18 months post go-live</text>
  <rect x="864" y="204" width="224" height="48" rx="24" fill="#e7f4ec" stroke="#1f6f3a" stroke-width="1.5"/>
  <text x="976" y="234" text-anchor="middle" font-size="17" font-weight="700" fill="#1f6f3a">RSS events eliminated</text>

  <!-- Panel 2: Joint Commission findings -->
  <rect x="80" y="346" width="1040" height="210" rx="16" fill="#faf6ee" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="112" y="386" font-size="15" font-weight="800" letter-spacing="1.1" fill="#6d5a3a">JOINT COMMISSION COUNT-DOC FINDINGS</text>
  <text x="280" y="496" text-anchor="middle" font-size="112" font-weight="800" fill="#b48a3a">14</text>
  <text x="280" y="532" text-anchor="middle" font-size="16" fill="#6d5a3a">2024 survey</text>
  <line x1="404" y1="458" x2="556" y2="458" stroke="#c39a5f" stroke-width="6" stroke-linecap="round"/>
  <path d="M556 458 l-20 -12 v24 z" fill="#c39a5f"/>
  <text x="712" y="496" text-anchor="middle" font-size="112" font-weight="800" fill="#1f6f3a">2</text>
  <text x="712" y="532" text-anchor="middle" font-size="16" fill="#6d5a3a">next survey cycle</text>
  <rect x="864" y="434" width="224" height="48" rx="24" fill="#eaf9fe" stroke="#1fcefb" stroke-width="1.5"/>
  <text x="976" y="464" text-anchor="middle" font-size="18" font-weight="800" fill="#177a92">87% reduction</text>
  <text x="976" y="506" text-anchor="middle" font-size="13.5" fill="#6d5a3a">both remaining findings unrelated to counts</text>

  <text x="600" y="606" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">18 months, zero retained sponges — against a pre-deployment baseline of two.</text>
</svg>
