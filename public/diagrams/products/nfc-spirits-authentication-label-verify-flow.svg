<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Tap-to-verify and anti-refill flow for an NTAG 424 DNA TT spirits label</title>
  <desc id="d">A four-step flow: a phone taps the bottle-cap seal at 13.56 MHz; the NTAG 424 DNA chip signs a fresh per-tap CMAC URL with an AES-128 key sealed in silicon; the brand server checks the CMAC signature and the bridge-antenna state; the result shows genuine and sealed. A banner explains that opening the cap snaps the bridge-antenna trace across the closure, so on every later tap the chip returns a signed opened state or cannot answer at all, and a genuine empty bottle cannot be re-sealed. A footnote notes coexistence with duty stamps HMRC DS5, EU 92/83/EEC and Russian EGAIS.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TAP-TO-VERIFY — NTAG 424 DNA SUN + ANTI-REFILL</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">One tap returns a fresh signature and whether the bottle has ever been opened</text>

  <!-- step 1 -->
  <rect x="70" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="170" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="187" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1 · TAP</text>
  <text x="187" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Phone taps the cap seal</text>
  <text x="187" y="272" text-anchor="middle" font-size="14" fill="#291c0e">at 13.56 MHz</text>
  <text x="187" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">No app — the phone OS</text>
  <text x="187" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">opens the returned URL</text>

  <!-- step 2 -->
  <rect x="345" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="345" y="170" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="462" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2 · SUN</text>
  <text x="462" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Fresh per-tap CMAC URL</text>
  <text x="462" y="272" text-anchor="middle" font-size="14" fill="#291c0e">signed on every tap</text>
  <text x="462" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">AES-128 key sealed</text>
  <text x="462" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">in the chip silicon</text>

  <!-- step 3 -->
  <rect x="620" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="620" y="170" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="737" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3 · VERIFY</text>
  <text x="737" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Server checks the CMAC</text>
  <text x="737" y="272" text-anchor="middle" font-size="14" fill="#291c0e">and the bridge state</text>
  <text x="737" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Counter rises each tap —</text>
  <text x="737" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">replay is rejected</text>

  <!-- step 4 -->
  <rect x="895" y="170" width="235" height="205" rx="14" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <rect x="895" y="170" width="235" height="42" rx="14" fill="#1f6f3a"/>
  <text x="1012" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4 · RESULT</text>
  <text x="1012" y="252" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6f3a">GENUINE</text>
  <text x="1012" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#1f6f3a">· SEALED ·</text>
  <text x="1012" y="316" text-anchor="middle" font-size="12.5" fill="#8b2d2d">Opened bottle → tamper</text>
  <text x="1012" y="334" text-anchor="middle" font-size="12.5" fill="#8b2d2d">or no answer next tap</text>

  <!-- arrows -->
  <polygon points="308,272 336,272 336,266 350,275 336,284 336,278 308,278" fill="#4a5568"/>
  <polygon points="583,272 611,272 611,266 625,275 611,284 611,278 583,278" fill="#4a5568"/>
  <polygon points="858,272 886,272 886,266 900,275 886,284 886,278 858,278" fill="#4a5568"/>

  <!-- banner -->
  <rect x="70" y="415" width="1060" height="84" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="90" y="443" font-size="15" font-weight="700" fill="#2c5454">Why a refilled genuine bottle still fails</text>
  <text x="90" y="466" font-size="13.5" fill="#3d6b6b">Opening the cap snaps the bridge-antenna trace across the closure. On every later tap the chip returns a</text>
  <text x="90" y="486" font-size="13.5" fill="#3d6b6b">cryptographically signed 'opened' state — or cannot answer at all. A discarded genuine bottle cannot be re-sealed.</text>

  <text x="600" y="548" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Coexists with the duty stamp — HMRC DS5, EU 92/83/EEC, Russian EGAIS — as the cryptographic layer above fiscal control.</text>
</svg>
