<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Four ways to encode an event wristband, ordered by the queue each creates</title>
<desc id="d">Four credential-encoding methods from lowest to highest queue impact. Pre-event fulfillment: wristbands are encoded and mailed with the tickets, adding no on-site queue. On-site registration: staff issue and encode a band from a desktop reader in about 15 to 30 seconds each, a moderate queue. Self-service kiosk: attendees scan a ticket and a kiosk dispenses and encodes a band, cutting staff but needing reliable hardware. Gate-side encoding: the slow last resort, encoding at the gate while the line grows, reserved for day-of upgrades. A queue-impact bar runs from none on the left to severe on the right.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="risk" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1f6f3a"/><stop offset="45%" stop-color="#c39a5f"/><stop offset="100%" stop-color="#8b2d2d"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CREDENTIAL ENCODING · WHERE THE PERMISSION IS WRITTEN</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Encode earlier and the gate just reads; encode later and the queue is yours to own.</text>

<!-- Card 1: fulfillment -->
<rect x="62" y="126" width="254" height="236" rx="16" fill="#fbf8f2" stroke="#1f6f3a" stroke-width="2"/>
<circle cx="88" cy="126" r="18" fill="#1f6f3a"/><text x="88" y="132" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
<rect x="159" y="166" width="60" height="40" rx="4" fill="#efe0bf" stroke="#6d5a3a" stroke-width="3"/>
<path d="M159 170 L189 192 L219 170" fill="none" stroke="#6d5a3a" stroke-width="3" stroke-linejoin="round"/>
<text x="189" y="250" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Pre-event fulfillment</text>
<text x="189" y="276" text-anchor="middle" font-size="14" fill="#4f4f4f">encode and mail</text>
<text x="189" y="296" text-anchor="middle" font-size="14" fill="#4f4f4f">with the tickets</text>
<rect x="96" y="322" width="186" height="28" rx="14" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="1.4"/>
<text x="189" y="341" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">no on-site queue</text>

<!-- Card 2: on-site registration -->
<rect x="336" y="126" width="254" height="236" rx="16" fill="#fbf8f2" stroke="#c39a5f" stroke-width="2"/>
<circle cx="362" cy="126" r="18" fill="#c39a5f"/><text x="362" y="132" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<rect x="439" y="162" width="48" height="34" rx="4" fill="#eef5f5" stroke="#6d5a3a" stroke-width="3"/>
<line x1="463" y1="196" x2="463" y2="204" stroke="#6d5a3a" stroke-width="3"/>
<ellipse cx="463" cy="210" rx="16" ry="6" fill="#f7edd6" stroke="#6d5a3a" stroke-width="2"/>
<text x="463" y="250" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">On-site registration</text>
<text x="463" y="276" text-anchor="middle" font-size="14" fill="#4f4f4f">desktop reader issues</text>
<text x="463" y="296" text-anchor="middle" font-size="14" fill="#4f4f4f">15–30 s per attendee</text>
<rect x="370" y="322" width="186" height="28" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="463" y="341" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">moderate queue</text>

<!-- Card 3: self-service kiosk -->
<rect x="610" y="126" width="254" height="236" rx="16" fill="#fbf8f2" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="636" cy="126" r="18" fill="#3d6b6b"/><text x="636" y="132" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<rect x="717" y="158" width="40" height="56" rx="6" fill="#eef5f5" stroke="#3d6b6b" stroke-width="3"/>
<rect x="723" y="164" width="28" height="24" rx="3" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<line x1="725" y1="200" x2="749" y2="200" stroke="#3d6b6b" stroke-width="3"/>
<text x="737" y="250" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Self-service kiosk</text>
<text x="737" y="276" text-anchor="middle" font-size="14" fill="#4f4f4f">scan ticket, auto-encode</text>
<text x="737" y="296" text-anchor="middle" font-size="14" fill="#4f4f4f">fewer staff needed</text>
<rect x="644" y="322" width="186" height="28" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="737" y="341" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">needs reliable hardware</text>

<!-- Card 4: gate-side -->
<rect x="884" y="126" width="254" height="236" rx="16" fill="#fbf8f2" stroke="#8b2d2d" stroke-width="2"/>
<circle cx="910" cy="126" r="18" fill="#8b2d2d"/><text x="910" y="132" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4</text>
<rect x="987" y="164" width="8" height="44" fill="#8b2d2d"/><rect x="1027" y="164" width="8" height="44" fill="#8b2d2d"/>
<circle cx="1011" cy="180" r="13" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5"/>
<line x1="1011" y1="180" x2="1011" y2="172" stroke="#8b2d2d" stroke-width="2"/><line x1="1011" y1="180" x2="1017" y2="183" stroke="#8b2d2d" stroke-width="2"/>
<text x="1011" y="250" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Gate-side encoding</text>
<text x="1011" y="276" text-anchor="middle" font-size="14" fill="#4f4f4f">encode at the gate</text>
<text x="1011" y="296" text-anchor="middle" font-size="14" fill="#4f4f4f">the line grows behind</text>
<rect x="918" y="322" width="186" height="28" rx="14" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.4"/>
<text x="1011" y="341" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">last resort only</text>

<!-- queue-impact bar -->
<text x="600" y="392" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">QUEUE IMPACT · GROWS TO THE RIGHT</text>
<rect x="62" y="402" width="1076" height="30" rx="15" fill="url(#risk)"/>
<path d="M1138 407 l16 10 l-16 10 z" fill="#8b2d2d"/>
<text x="189" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6f3a">none</text>
<text x="463" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">moderate</text>
<text x="737" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">moderate</text>
<text x="1011" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">severe</text>

<text x="600" y="500" text-anchor="middle" font-size="15" fill="#5c5c5c">Push encoding as far left as your attendee data allows — the line you avoid is the one behind the gate.</text>
</svg>
