<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The small-business RFID invoice, demystified</title>
<desc id="d">A receipt lists the whole entry system: one handheld UHF reader at $800-1,500, one thousand UHF labels at $0.05-0.15 each, cloud software from $50-150 a month — total $1,500-3,000. Beside it, three verdicts: entry cost $1,500-3,000, tags from five cents, payback in 6-12 months when manual counting eats five or more hours a week.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE INVOICE, DEMYSTIFIED</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">RFID for a small business: short enough to fit on a receipt</text>

<rect x="120" y="140" width="420" height="440" rx="10" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="2"/>
<line x1="150" y1="196" x2="510" y2="196" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="330" y="178" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1" fill="#291c0e">STARTER SYSTEM — RECEIPT</text>

<text x="150" y="240" font-size="15.5" fill="#291c0e">Handheld UHF reader</text>
<text x="510" y="240" text-anchor="end" font-size="15.5" font-weight="700" fill="#291c0e">$800–1,500</text>
<text x="150" y="266" font-size="12.5" fill="#5c5c5c">Zebra / Chainway · pairs with your phone</text>

<text x="150" y="312" font-size="15.5" fill="#291c0e">1,000 UHF labels</text>
<text x="510" y="312" text-anchor="end" font-size="15.5" font-weight="700" fill="#291c0e">$0.05–0.15 ea</text>
<text x="150" y="338" font-size="12.5" fill="#5c5c5c">about the price of good barcode labels</text>

<text x="150" y="384" font-size="15.5" fill="#291c0e">Cloud software</text>
<text x="510" y="384" text-anchor="end" font-size="15.5" font-weight="700" fill="#291c0e">$50–150 / mo</text>
<text x="150" y="410" font-size="12.5" fill="#5c5c5c">free tiers exist · no server, no IT team</text>

<line x1="150" y1="446" x2="510" y2="446" stroke="#291c0e" stroke-width="2"/>
<text x="150" y="484" font-size="18" font-weight="800" fill="#291c0e">TOTAL, DEPLOYED</text>
<text x="510" y="484" text-anchor="end" font-size="20" font-weight="800" fill="#1f6f3a">$1,500–3,000</text>
<text x="150" y="522" font-size="13" fill="#4f4f4f">no consultant · no budget committee</text>
<text x="150" y="544" font-size="13" fill="#4f4f4f">no one says "synergy"</text>

<rect x="620" y="150" width="90" height="150" rx="14" fill="#4a5568"/>
<rect x="640" y="170" width="50" height="66" rx="6" fill="#eef1f5"/>
<rect x="652" y="300" width="26" height="34" rx="6" fill="#4a5568"/>
<path d="M 726 190 a 26 26 0 0 1 0 44" fill="none" stroke="#4a5568" stroke-width="2.5"/>
<path d="M 740 176 a 44 44 0 0 1 0 72" fill="none" stroke="#4a5568" stroke-width="2"/>
<text x="665" y="368" text-anchor="middle" font-size="13.5" fill="#4f4f4f">one reader is enough</text>

<g font-weight="700">
<rect x="800" y="150" width="330" height="56" rx="28" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="965" y="178" text-anchor="middle" font-size="15.5" fill="#6d5a3a">entry system $1,500–3,000</text>
<text x="965" y="196" text-anchor="middle" font-size="12" font-weight="400" fill="#4f4f4f">reader + 1,000 tags + software</text>
<rect x="800" y="226" width="330" height="56" rx="28" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="965" y="254" text-anchor="middle" font-size="15.5" fill="#2c5454">tags from $0.05–0.15 each</text>
<text x="965" y="272" text-anchor="middle" font-size="12" font-weight="400" fill="#4f4f4f">rugged reusable: $0.30–1.50</text>
<rect x="800" y="302" width="330" height="56" rx="28" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="965" y="330" text-anchor="middle" font-size="15.5" fill="#1b4332">payback in 6–12 months</text>
<text x="965" y="348" text-anchor="middle" font-size="12" font-weight="400" fill="#4f4f4f">when manual counts eat 5+ h/week</text>
</g>

<rect x="620" y="420" width="510" height="120" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="875" y="466" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="20" font-weight="700" fill="#291c0e">The "enterprise-only" price tag</text>
<text x="875" y="494" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="20" font-weight="700" fill="#291c0e">is a decade out of date.</text>
<text x="600" y="620" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Works from 500 tracked items up — the maths below shows where it starts paying rent.</text>
</svg>
