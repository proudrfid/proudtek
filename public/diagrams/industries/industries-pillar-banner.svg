    <text x="229" y="198" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Retail &amp; Brand Protection</text>
    <line x1="183" y1="213" x2="275" y2="213" stroke="#ece5d8" stroke-width="2"/>
    <text x="229" y="237" text-anchor="middle" font-size="13.5" fill="#6d5a3a">Apparel · luxury · anti-counterfeit</text>
