<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID control points that catch each shrinkage category</title>
<desc id="d">Four RFID checkpoints along the warehouse flow: receiving portal catches ASN mismatches, guided put-away catches misplacement, perpetual cycle count catches drift early, and shipping verification catches short-ships. A deterrence band runs beneath: every item is traceable to a time, zone and handler.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW RFID CLOSES EACH LEAK</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">One checkpoint at every handoff where stock goes missing.</text>
<rect x="72" y="196" width="236" height="206" rx="14" fill="#ffffff" stroke="#d3dae3" stroke-width="1.8"/><rect x="72" y="196" width="236" height="8" rx="4" fill="#4a5568"/>
<circle cx="102" cy="230" r="15" fill="#4a5568"/><text x="102" y="235" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="190" y="286" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Receiving</text>
<text x="190" y="309" text-anchor="middle" font-size="12.5" fill="#5c5c5c">ASN match at the dock</text>
<rect x="92.0" y="330" width="196" height="32" rx="16.0" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.2"/><text x="190" y="350.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#3a4453">catch mismatches</text>
<rect x="346" y="196" width="236" height="206" rx="14" fill="#ffffff" stroke="#d3dae3" stroke-width="1.8"/><rect x="346" y="196" width="236" height="8" rx="4" fill="#4a5568"/>
<circle cx="376" cy="230" r="15" fill="#4a5568"/><text x="376" y="235" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="464" y="286" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Put-away</text>
<text x="464" y="309" text-anchor="middle" font-size="12.5" fill="#5c5c5c">right bin, real-time</text>
<rect x="366.0" y="330" width="196" height="32" rx="16.0" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.2"/><text x="464" y="350.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#3a4453">catch misplacement</text>
<rect x="620" y="196" width="236" height="206" rx="14" fill="#ffffff" stroke="#d3dae3" stroke-width="1.8"/><rect x="620" y="196" width="236" height="8" rx="4" fill="#4a5568"/>
<circle cx="650" cy="230" r="15" fill="#4a5568"/><text x="650" y="235" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
<text x="738" y="286" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Cycle count</text>
<text x="738" y="309" text-anchor="middle" font-size="12.5" fill="#5c5c5c">scan an aisle fast</text>
<rect x="640.0" y="330" width="196" height="32" rx="16.0" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.2"/><text x="738" y="350.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#3a4453">catch drift early</text>
<rect x="894" y="196" width="236" height="206" rx="14" fill="#ffffff" stroke="#d3dae3" stroke-width="1.8"/><rect x="894" y="196" width="236" height="8" rx="4" fill="#4a5568"/>
<circle cx="924" cy="230" r="15" fill="#4a5568"/><text x="924" y="235" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
<text x="1012" y="286" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Shipping</text>
<text x="1012" y="309" text-anchor="middle" font-size="12.5" fill="#5c5c5c">line-by-line at ship</text>
<rect x="914.0" y="330" width="196" height="32" rx="16.0" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.2"/><text x="1012" y="350.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#3a4453">catch short-ships</text>
<line x1="310" y1="299" x2="335" y2="299" stroke="#4a5568" stroke-width="3"/><polygon points="335,292 344,299 335,306" fill="#4a5568"/>
<line x1="584" y1="299" x2="609" y2="299" stroke="#4a5568" stroke-width="3"/><polygon points="609,292 618,299 609,306" fill="#4a5568"/>
<line x1="858" y1="299" x2="883" y2="299" stroke="#4a5568" stroke-width="3"/><polygon points="883,292 892,299 883,306" fill="#4a5568"/>
<rect x="72" y="436" width="1056" height="54" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<polyline points="96,463 100.5,468 109,457" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="122" y="468" text-anchor="start" font-size="14" font-weight="700" fill="#2d6a4f">Deterrence: every item is traceable to a specific time, zone and handler — its own theft control.</text>
<text x="600" y="556" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Each control catches a different leak; together they close the gap end to end.</text>
</svg>
