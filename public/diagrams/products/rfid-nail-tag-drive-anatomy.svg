<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Nail tag anatomy — hammer-in transponder in timber cross-section</title>
<desc id="d">Cutaway of timber with a nail tag driven in, showing shaft dimensions, over-moulded head body, pilot hole guidance and heat-treatment survival.</desc>
<rect width="1200" height="675" fill="#f8f6f1"/>
<text x="60" y="64" font-family="Georgia, serif" font-size="34" fill="#291c0e">Hammer it home, read it for years</text>
<text x="60" y="98" font-family="Verdana, sans-serif" font-size="16" fill="#6d5a3a">A steel shaft per ASTM F1667 / EN 10230-1 carries the transponder head into the wood</text>
<rect x="120" y="260" width="420" height="300" rx="6" fill="#ffffff" stroke="#6d5a3a" stroke-width="3"/>
<g stroke="#c39a5f" stroke-width="1.5" fill="none" opacity="0.7">
<path d="M140 300 Q330 285 520 300"/>
<path d="M140 360 Q330 345 520 360"/>
<path d="M140 420 Q330 408 520 420"/>
<path d="M140 480 Q330 465 520 480"/>
<path d="M140 535 Q330 522 520 535"/>
</g>
<rect x="306" y="150" width="48" height="46" rx="10" fill="#3d6b6b" stroke="#2c5454" stroke-width="2.5"/>
<circle cx="330" cy="173" r="8" fill="#f8f6f1"/>
<rect x="322" y="196" width="16" height="64" fill="#291c0e"/>
<rect x="322" y="260" width="16" height="180" fill="#291c0e"/>
<path d="M322 440 L338 440 L330 470 Z" fill="#291c0e"/>
<line x1="360" y1="196" x2="360" y2="260" stroke="#6d5a3a" stroke-width="1"/>
<text x="372" y="232" font-family="Verdana, sans-serif" font-size="12.5" fill="#6d5a3a">head body stays proud</text>
<line x1="290" y1="260" x2="290" y2="470" stroke="#2c5454" stroke-width="1" stroke-dasharray="4 3"/>
<text x="276" y="380" font-family="Verdana, sans-serif" font-size="12.5" fill="#2c5454" text-anchor="end">drive depth 15-50 mm</text>
<g font-family="Verdana, sans-serif" font-size="14" fill="#291c0e">
<rect x="600" y="150" width="520" height="62" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="620" y="176" font-size="15">Shaft 22 / 30 / 40 / 50 mm x 3.0-4.2 mm dia</text>
<text x="620" y="197" font-size="12.5" fill="#6d5a3a">plain steel, galvanised, 304 / 316L, hardened spiral, ring-shank</text>
<rect x="600" y="228" width="520" height="62" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="620" y="254" font-size="15">Head body — ABS / polycarbonate / 316L over-mould</text>
<text x="620" y="275" font-size="12.5" fill="#6d5a3a">IP68 + UV-tested ASTM G154 UVB-313 1,000 hr · -40 C to +85 C outdoor</text>
<rect x="600" y="306" width="520" height="62" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="620" y="332" font-size="15">Hardwood asks for a pilot hole first</text>
<text x="620" y="353" font-size="12.5" fill="#6d5a3a">2.5-3.5 mm dia x 15-30 mm deep — optional for softwood · nailer-compatible AC120</text>
<rect x="600" y="384" width="520" height="62" rx="8" fill="#eef2f0" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="620" y="410" font-size="15">Survives the ISPM-15 oven</text>
<text x="620" y="431" font-size="12.5" fill="#2c5454">56 C core for 30 min heat-treatment — the tag ships with the pallet, legally</text>
<rect x="600" y="462" width="520" height="62" rx="8" fill="#eef2f0" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="620" y="488" font-size="15">2-3 m pallet-portal · 3-5 m flush on poles</text>
<text x="620" y="509" font-size="12.5" fill="#2c5454">Autotune ICs (M750 / M770 / M775 class) ride out wood-moisture detuning</text>
</g>
<rect x="60" y="590" width="1060" height="52" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="84" y="622" font-family="Georgia, serif" font-size="16" fill="#291c0e">Staples rust out and barcodes weather off — a driven shaft is how wood keeps its name.</text>
</svg>
