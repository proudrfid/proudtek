<circle cx="1010" cy="360" r="3"/><circle cx="1058" cy="360" r="3"/><circle cx="1010" cy="326" r="3"/><circle cx="1058" cy="326" r="3"/><circle cx="1034" cy="292" r="3"/>
</g>

<text x="216" y="452" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Short range · loves metal and mud</text>
<text x="216" y="486" text-anchor="middle" font-size="13.5" fill="#1f6f3a">✓ water · tissue · soil · thin metal</text>
<text x="216" y="510" text-anchor="middle" font-size="13.5" fill="#4f4f4f">reads 1–10 cm, one tag at a time</text>

<text x="600" y="452" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">The tap in your phone and hotel key</text>
<text x="600" y="486" text-anchor="middle" font-size="13.5" fill="#1f6f3a">✓ NFC · smart cards · libraries</text>
<text x="600" y="510" text-anchor="middle" font-size="13.5" fill="#4f4f4f">1–30 cm · real data rates · global standards</text>

<text x="984" y="452" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Long range · reads a whole room at once</text>
<text x="984" y="486" text-anchor="middle" font-size="13.5" fill="#1f6f3a">✓ pallets · retail floors · tolling</text>
<text x="984" y="510" text-anchor="middle" font-size="13.5" fill="#8b2d2d">metal reflects it · water swallows it</text>

<line x1="120" y1="600" x2="1072" y2="600" stroke="#4f4f4f" stroke-width="1.5"/>
<path d="M 1072 600 l -12 -6 v 12 z" fill="#4f4f4f"/>
<line x1="216" y1="594" x2="216" y2="606" stroke="#4f4f4f" stroke-width="1.5"/>
<line x1="600" y1="594" x2="600" y2="606" stroke="#4f4f4f" stroke-width="1.5"/>
<line x1="984" y1="594" x2="984" y2="606" stroke="#4f4f4f" stroke-width="1.5"/>
<text x="216" y="626" text-anchor="middle" font-size="14" font-weight="600" fill="#4f4f4f">125 kHz</text>
<text x="600" y="626" text-anchor="middle" font-size="14" font-weight="600" fill="#4f4f4f">13.56 MHz</text>
<text x="984" y="626" text-anchor="middle" font-size="14" font-weight="600" fill="#4f4f4f">860–960 MHz</text>
<text x="600" y="648" text-anchor="middle" font-size="13" fill="#5c5c5c">← lower: closer reads, forgives metal &amp; water · higher: farther reads, fussier environment →</text>
</svg>
