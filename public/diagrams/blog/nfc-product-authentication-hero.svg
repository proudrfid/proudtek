<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Genuine versus cloned: NFC product authentication returns authentic for a real chip and rejected for a clone</title>
<desc id="d">Two side-by-side lanes. On the left, a genuine unit carries a secure NFC chip; when a phone taps it, the chip signs a fresh cryptographic rolling code and the verdict is AUTHENTIC. On the right, a cloned tag copies only the visible UID and cannot sign a valid code, so the same tap returns REJECTED. Below, three facts: the counterfeit-goods trade runs past 500 billion dollars a year, verification is one phone tap with no app to install, and every tap generates a fresh code so replays fail.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="58" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NFC PRODUCT AUTHENTICATION</text>
<text x="600" y="104" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">A copy can imitate the look —</text>
<text x="600" y="144" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">it can't prove it knows the secret key.</text>

<!-- LEFT LANE: GENUINE -->
<rect x="70" y="184" width="498" height="298" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="2"/>
<text x="100" y="220" font-size="15" font-weight="800" letter-spacing="1" fill="#2c5454">GENUINE UNIT</text>
<rect x="100" y="244" width="132" height="150" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="140" y="298" width="52" height="44" rx="6" fill="#c39a5f"/>
<path d="M148 298v-8M162 298v-8M176 298v-8M184 298v-8M148 342v8M162 342v8M176 342v8M184 342v8" stroke="#7d6a3f" stroke-width="2"/>
<text x="166" y="374" text-anchor="middle" font-size="12.5" fill="#4f4f4f">secure NFC chip</text>
<line x1="240" y1="320" x2="286" y2="320" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="282,314 294,320 282,326" fill="#3d6b6b"/>
<rect x="300" y="244" width="104" height="150" rx="16" fill="#291c0e"/>
<rect x="314" y="260" width="76" height="118" rx="8" fill="#e3f0e6"/>
<path d="M334 322 l12 13 24 -30" fill="none" stroke="#1f6f3a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="290" y="412" width="150" height="42" rx="21" fill="#e3f0e6" stroke="#1f6f3a" stroke-width="1.6"/>
<text x="365" y="439" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">AUTHENTIC</text>

<!-- RIGHT LANE: CLONE -->
<rect x="632" y="184" width="498" height="298" rx="16" fill="#f8ecec" stroke="#e6c9c9" stroke-width="2"/>
<text x="662" y="220" font-size="15" font-weight="800" letter-spacing="1" fill="#8b2d2d">CLONED TAG</text>
<rect x="662" y="244" width="132" height="150" rx="12" fill="#ffffff" stroke="#c39a9a" stroke-width="2"/>
<rect x="702" y="298" width="52" height="44" rx="6" fill="#c3b39a"/>
<path d="M710 298v-8M724 298v-8M738 298v-8M746 298v-8M710 342v8M724 342v8M738 342v8M746 342v8" stroke="#9a8a72" stroke-width="2"/>
<text x="728" y="374" text-anchor="middle" font-size="12.5" fill="#8b6a6a">copied UID only</text>
<line x1="802" y1="320" x2="848" y2="320" stroke="#b07a7a" stroke-width="2.5"/>
<polygon points="844,314 856,320 844,326" fill="#b07a7a"/>
<rect x="862" y="244" width="104" height="150" rx="16" fill="#291c0e"/>
<rect x="876" y="260" width="76" height="118" rx="8" fill="#f7e2e2"/>
<path d="M898 304 l32 32 M930 304 l-32 32" stroke="#8b2d2d" stroke-width="7" stroke-linecap="round"/>
<rect x="852" y="412" width="150" height="42" rx="21" fill="#f7e2e2" stroke="#8b2d2d" stroke-width="1.6"/>
<text x="927" y="439" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">REJECTED</text>

<!-- STAT BAND -->
<line x1="416" y1="516" x2="416" y2="600" stroke="#e6dfd2" stroke-width="2"/>
<line x1="784" y1="516" x2="784" y2="600" stroke="#e6dfd2" stroke-width="2"/>
<text x="243" y="556" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">$500B+</text>
<text x="243" y="584" text-anchor="middle" font-size="13.5" fill="#5c5c5c">counterfeit trade per year</text>
<text x="600" y="556" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#3d6b6b">1 tap</text>
<text x="600" y="584" text-anchor="middle" font-size="13.5" fill="#5c5c5c">to verify, no app to install</text>
<text x="957" y="556" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#3d6b6b">fresh code</text>
<text x="957" y="584" text-anchor="middle" font-size="13.5" fill="#5c5c5c">every tap — replays fail</text>
</svg>
