<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID distributor pricing benchmarks by vertical for 2026</title>
<desc id="d">A benchmark table of five RFID verticals with landed cost, distributor sell price, and gross margin. Retail apparel UHF inlays for retail-mandate compliance: landed $0.05-$0.10, sells $0.08-$0.15, margin 25-40%. Healthcare HF and NFC tags for asset tracking: landed $0.50-$1.20, sells $1.20-$2.50, margin 50-65%. Industrial laundry tags, PPS or silicone rated for 200 cycles: landed $0.40-$0.80, sells $0.80-$2.00, margin 50-65%. Event UHF wristbands with custom print and short lead: landed $0.15-$0.45, sells $0.50-$1.50, margin 60-75%. RFID readers with visible list pricing: landed $400-$1,800, sells $700-$3,500, margin 30-45%.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PRICING BENCHMARKS BY VERTICAL · 2026</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">What distributors actually charge</text>
<text x="600" y="133" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Landed cost, sell price, and gross margin across five RFID verticals.</text>

<!-- header -->
<text x="88" y="184" font-size="12.5" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">VERTICAL</text>
<text x="580" y="184" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">LANDED COST</text>
<text x="780" y="184" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">SELLS AT</text>
<text x="1000" y="184" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">GROSS MARGIN</text>
<line x1="64" y1="196" x2="1136" y2="196" stroke="#e6dfd2" stroke-width="1.6"/>

<!-- Row 1 -->
<rect x="64" y="204" width="1072" height="56" rx="8" fill="#faf7f0"/>
<text x="88" y="230" font-size="14.5" font-weight="600" fill="#291c0e">Retail apparel UHF inlay</text>
<text x="88" y="249" font-size="12" fill="#8a8a8a">retail-mandate compliance</text>
<text x="580" y="238" text-anchor="middle" font-size="14.5" fill="#291c0e">$0.05-$0.10</text>
<text x="780" y="238" text-anchor="middle" font-size="14.5" fill="#291c0e">$0.08-$0.15</text>
<rect x="940" y="215" width="120" height="34" rx="17" fill="#e6dcc2"/><text x="1000" y="237" text-anchor="middle" font-size="14.5" font-weight="800" fill="#8a6d3b">25-40%</text>

<!-- Row 2 -->
<rect x="64" y="264" width="1072" height="56" rx="8" fill="#ffffff"/>
<text x="88" y="290" font-size="14.5" font-weight="600" fill="#291c0e">Healthcare HF / NFC</text>
<text x="88" y="309" font-size="12" fill="#8a8a8a">asset tracking</text>
<text x="580" y="298" text-anchor="middle" font-size="14.5" fill="#291c0e">$0.50-$1.20</text>
<text x="780" y="298" text-anchor="middle" font-size="14.5" fill="#291c0e">$1.20-$2.50</text>
<rect x="940" y="275" width="120" height="34" rx="17" fill="#cfe6e0"/><text x="1000" y="297" text-anchor="middle" font-size="14.5" font-weight="800" fill="#2c5454">50-65%</text>

<!-- Row 3 -->
<rect x="64" y="324" width="1072" height="56" rx="8" fill="#faf7f0"/>
<text x="88" y="350" font-size="14.5" font-weight="600" fill="#291c0e">Industrial laundry tags</text>
<text x="88" y="369" font-size="12" fill="#8a8a8a">PPS / silicone, 200-cycle</text>
<text x="580" y="358" text-anchor="middle" font-size="14.5" fill="#291c0e">$0.40-$0.80</text>
<text x="780" y="358" text-anchor="middle" font-size="14.5" fill="#291c0e">$0.80-$2.00</text>
<rect x="940" y="335" width="120" height="34" rx="17" fill="#cfe6e0"/><text x="1000" y="357" text-anchor="middle" font-size="14.5" font-weight="800" fill="#2c5454">50-65%</text>

<!-- Row 4 -->
<rect x="64" y="384" width="1072" height="56" rx="8" fill="#ffffff"/>
<text x="88" y="410" font-size="14.5" font-weight="600" fill="#291c0e">Event UHF wristbands</text>
<text x="88" y="429" font-size="12" fill="#8a8a8a">custom print, short lead</text>
<text x="580" y="418" text-anchor="middle" font-size="14.5" fill="#291c0e">$0.15-$0.45</text>
<text x="780" y="418" text-anchor="middle" font-size="14.5" fill="#291c0e">$0.50-$1.50</text>
<rect x="940" y="395" width="120" height="34" rx="17" fill="#c3e4cf"/><text x="1000" y="417" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1b4332">60-75%</text>

<!-- Row 5 -->
<rect x="64" y="444" width="1072" height="56" rx="8" fill="#faf7f0"/>
<text x="88" y="470" font-size="14.5" font-weight="600" fill="#291c0e">RFID readers</text>
<text x="88" y="489" font-size="12" fill="#8a8a8a">list price visible</text>
<text x="580" y="478" text-anchor="middle" font-size="14.5" fill="#291c0e">$400-$1,800</text>
<text x="780" y="478" text-anchor="middle" font-size="14.5" fill="#291c0e">$700-$3,500</text>
<rect x="940" y="455" width="120" height="34" rx="17" fill="#ecdcb4"/><text x="1000" y="477" text-anchor="middle" font-size="14.5" font-weight="800" fill="#6d5a3a">30-45%</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Readers carry the thinnest margin because the buyer can already see the list price. A wristband, they can't.</text>
</svg>
