<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="bmTitle bmDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="bmTitle">The case-study numbers against published RSI benchmarks</title>
  <desc id="bmDesc">Four comparisons against published data cited by STERIS. Retained-item incidence: this center's pre-program rate of about 1 in 4,900 procedures versus the Mayo Clinic benchmark of 1 in 5,500. Adjunct-technology adoption: only about 20% of US hospitals use any adjunct sponge-counting technology, per ECRI. Average cost per retained-item event: about $166,000 per the Pennsylvania Patient Safety Authority, versus a $48K direct-reoperation floor here. In-vivo read range: the STERIS ORLocate locator wand reaches 19 inches versus about 6 inches for the HoveRead handheld.</desc>
  <defs>
    <radialGradient id="bmBg" cx="50%" cy="18%" r="95%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bmBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="62" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="1.1" fill="#6d5a3a">HOW THE NUMBERS LINE UP AGAINST PUBLISHED DATA</text>

  <!-- Card A: incidence -->
  <rect x="80" y="106" width="505" height="196" rx="16" fill="#faf6ee" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="104" y="142" font-size="14.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">RSI INCIDENCE (LOWER = MORE FREQUENT)</text>
  <circle cx="116" cy="182" r="7" fill="#8b2d2d"/>
  <text x="136" y="188" font-size="18" font-weight="800" fill="#8b2d2d">≈ 1 in 4,900 — this center, pre-program</text>
  <circle cx="116" cy="222" r="7" fill="#c39a5f"/>
  <text x="136" y="228" font-size="18" font-weight="700" fill="#291c0e">1 in 5,500 — Mayo Clinic benchmark</text>
  <text x="104" y="276" font-size="14.5" font-style="italic" fill="#6d5a3a">Slightly worse than benchmark — the trigger for the program.</text>

  <!-- Card B: adoption -->
  <rect x="615" y="106" width="505" height="196" rx="16" fill="#faf6ee" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="639" y="142" font-size="14.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">ADJUNCT-TECH ADOPTION (ECRI)</text>
  <rect x="639" y="164" width="457" height="38" rx="8" fill="#efe6d5"/>
  <rect x="639" y="164" width="91" height="38" rx="8" fill="#1fcefb"/>
  <text x="663" y="272" font-size="40" font-weight="800" fill="#177a92">~20%</text>
  <text x="770" y="258" font-size="16" fill="#291c0e">of US hospitals use any</text>
  <text x="770" y="282" font-size="16" fill="#291c0e">adjunct sponge-counting tech</text>

  <!-- Card C: cost -->
  <rect x="80" y="326" width="505" height="196" rx="16" fill="#faf6ee" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="104" y="362" font-size="14.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">AVG COST PER RSI EVENT (PPSA)</text>
  <text x="104" y="428" font-size="52" font-weight="800" fill="#291c0e">~$166,000</text>
  <text x="104" y="460" font-size="15" fill="#6d5a3a">legal defence + indemnity + unreimbursed care</text>
  <line x1="104" y1="478" x2="561" y2="478" stroke="#efe6d5" stroke-width="1.5"/>
  <text x="104" y="504" font-size="15.5" fill="#291c0e">Conservative floor here: $48K direct reoperation cost</text>

  <!-- Card D: read range -->
  <rect x="615" y="326" width="505" height="196" rx="16" fill="#faf6ee" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="639" y="362" font-size="14.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">IN-VIVO READ RANGE (STERIS ORLOCATE)</text>
  <text x="639" y="398" font-size="15" fill="#291c0e">ORLocate locator wand</text>
  <rect x="639" y="406" width="400" height="28" rx="6" fill="#1fcefb"/>
  <text x="1026" y="426" text-anchor="end" font-size="16" font-weight="800" fill="#06323c">19 in</text>
  <text x="639" y="464" font-size="15" fill="#291c0e">HoveRead handheld counter</text>
  <rect x="639" y="472" width="126" height="28" rx="6" fill="#c39a5f"/>
  <text x="775" y="492" font-size="16" font-weight="700" fill="#6d5a3a">~6 in</text>

  <text x="600" y="606" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Sources cited by STERIS: Mayo Clinic, Pennsylvania Patient Safety Authority (PPSA), and ECRI.</text>
</svg>
