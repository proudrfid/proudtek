<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID vs magnetic stripe: durability and four more wins</title>
<desc id="d">A bar comparison of reads before wear-out: the RFID antenna bar runs nearly the full width at 100,000+ read cycles, while the magnetic stripe bar is a stub at 200 to 500 swipes. Below, four pills list the other wins: RFID reads through wallets, gloves and water; rotating cryptography on every read with DESFire EV3 and NTAG 424 DNA versus static stripe data; many applications on one card in walled-off zones; and 50 to 200 cards per second at gates from 3 to 5 metres. A closing line reads: a magstripe is a static playback device — modern RFID is a live cryptographic conversation.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY THE STRIPE LOST</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Reads before it simply wears out</text>

<text x="140" y="156" font-size="15.5" font-weight="700" fill="#291c0e">RFID antenna</text>
<rect x="140" y="170" width="880" height="46" rx="10" fill="#3d6b6b"/>
<text x="1000" y="200" text-anchor="end" font-size="16" font-weight="700" fill="#ffffff">100,000+ read cycles</text>
<rect x="1040" y="170" width="122" height="46" rx="10" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="1101" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">no contact</text>
<text x="1101" y="208" text-anchor="middle" font-size="12.5" fill="#4f4f4f">no friction</text>

<text x="140" y="264" font-size="15.5" font-weight="700" fill="#291c0e">Magnetic stripe</text>
<rect x="140" y="278" width="16" height="46" rx="8" fill="#8b2d2d"/>
<text x="172" y="308" font-size="16" font-weight="700" fill="#8b2d2d">200-500 swipes, then the gym-sock fade</text>

<line x1="140" y1="366" x2="1060" y2="366" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="140" y="398" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">AND FOUR MORE WAYS THE STRIPE LOSES</text>

<rect x="140" y="416" width="440" height="86" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<circle cx="178" cy="459" r="17" fill="#3d6b6b"/>
<path d="M 178 448 c 6 8 9 12 9 17 a 9 9 0 0 1 -18 0 c 0 -5 3 -9 9 -17 z" fill="#ffffff"/>
<text x="210" y="452" font-size="15" font-weight="700" fill="#291c0e">Reads through wallets, gloves &amp; water</text>
<text x="210" y="476" font-size="13" fill="#4f4f4f">rain and lint don't interrupt the tap</text>

<rect x="620" y="416" width="440" height="86" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<circle cx="658" cy="459" r="17" fill="#c39a5f"/>
<rect x="651" y="456" width="14" height="11" rx="2" fill="#ffffff"/>
<path d="M 653 456 v -3 a 5 5 0 0 1 10 0 v 3" fill="none" stroke="#ffffff" stroke-width="2"/>
<text x="690" y="452" font-size="15" font-weight="700" fill="#291c0e">Rotating cryptography on every read</text>
<text x="690" y="476" font-size="13" fill="#4f4f4f">DESFire EV3 · NTAG 424 DNA vs static stripe data</text>

<rect x="140" y="518" width="440" height="86" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<circle cx="178" cy="561" r="17" fill="#4a5568"/>
<rect x="170" y="553" width="7" height="7" rx="1.5" fill="#ffffff"/>
<rect x="180" y="553" width="7" height="7" rx="1.5" fill="#ffffff"/>
<rect x="170" y="563" width="7" height="7" rx="1.5" fill="#ffffff"/>
<rect x="180" y="563" width="7" height="7" rx="1.5" fill="#ffffff"/>
<text x="210" y="554" font-size="15" font-weight="700" fill="#291c0e">Many applications, one card</text>
<text x="210" y="578" font-size="13" fill="#4f4f4f">access + ID + payment in walled-off zones</text>

<rect x="620" y="518" width="440" height="86" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<circle cx="658" cy="561" r="17" fill="#2d6a4f"/>
<path d="M 661 550 l -9 13 h 6 l -2 9 9 -13 h -6 z" fill="#ffffff"/>
<text x="690" y="554" font-size="15" font-weight="700" fill="#291c0e">50-200 cards per second at gates</text>
<text x="690" y="578" font-size="13" fill="#4f4f4f">RAIN UHF from 3-5 m — no single-file lines</text>

<text x="600" y="640" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="17" font-style="italic" fill="#2c5454">A magstripe is a static playback device. Modern RFID is a live cryptographic conversation.</text>
</svg>
