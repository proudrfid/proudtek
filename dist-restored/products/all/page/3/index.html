      .codex-editorial-answer-label {
        margin: 0 0 0.45rem;
        color: var(--codex-gold-muted);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .codex-product-cta__eyebrow { margin-bottom: 0.35rem; }
      .codex-collection-cta__eyebrow { letter-spacing: 0.08em; }
      .codex-editorial-answer-label { letter-spacing: 0.08em; }

      /* Pill button – shared base */
      .codex-product-cta__primary,
      .codex-collection-cta__primary,
      .codex-footer-rfq-link,
      .codex-legacy-redirect__action,
      .codex-growth-hub__action,
      .codex-editorial-link-card,
      .codex-editorial-brief-link,
      .codex-editorial-secondary,
      .codex-editorial-primary,
      .codex-editorial-jump-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.85rem;
        padding: 0.7rem 1rem;
        border-radius: var(--codex-radius-pill);
        text-decoration: none;
        transition: var(--codex-transition), background-color 160ms ease;
      }

      /* Pill button – dark variant */
      .codex-product-cta__primary,
      .codex-footer-rfq-link,
      .codex-legacy-redirect__action--primary {
        color: #fff;
        background: var(--codex-gradient-dark);
        box-shadow: var(--codex-shadow);
      }

      .codex-product-cta__primary:hover,
      .codex-footer-rfq-link:hover,
      .codex-legacy-redirect__action--primary:hover {
        transform: translateY(-1px);
        box-shadow: var(--codex-shadow-light);
      }

      /* Pill button – outlined / ghost variant */
      .codex-legacy-redirect__action,
      .codex-growth-hub__action,
      .codex-editorial-link-card,
      .codex-editorial-brief-link,
      .codex-editorial-secondary,
      .codex-editorial-jump-link {
        border: 1px solid var(--codex-border);
        background: rgba(255, 255, 255, 0.92);
        color: var(--codex-text);
      }

      .codex-editorial-jump-link {
        min-height: 2.75rem;
        padding: 0.7rem 1rem;
        background: linear-gradient(180deg, var(--codex-bg-warm), rgba(255, 255, 255, 0.98));
        border: 1px solid rgba(41, 28, 14, 0.1);
        font-size: 0.9rem;
      }

      .codex-legacy-redirect__action:hover,
      .codex-growth-hub__action:hover,
      .codex-editorial-link-card:hover,
      .codex-editorial-brief-link:hover,
      .codex-editorial-secondary:hover,
      .codex-editorial-primary:hover,
      .codex-editorial-jump-link:hover {
        transform: translateY(-1px);
        box-shadow: var(--codex-shadow-light);
      }

      /* Active/pressed state — subtle press-down feedback */
      .codex-product-cta__primary:active,
      .codex-collection-cta__primary:active,
      .codex-footer-rfq-link:active,
      .codex-legacy-redirect__action:active,
      .codex-growth-hub__action:active,
      .codex-editorial-link-card:active,
      .codex-editorial-brief-link:active,
      .codex-editorial-secondary:active,
      .codex-editorial-primary:active,
      .codex-editorial-jump-link:active {
        transform: translateY(0);
        box-shadow: none;
        transition-duration: 50ms;
      }

      .codex-editorial-jump-link:hover {
        border-color: rgba(195, 154, 95, 0.28);
      }

      /* Pill button – gold / accent variant (primary CTA) */
      .codex-editorial-primary {
        background: var(--codex-gradient-dark);
        color: #fff;
        font-weight: 700;
        box-shadow: var(--codex-shadow);
        padding: 0.8rem 1.4rem;
        font-size: 1rem;
      }

      /* Pill button – green variant (collection) */
      .codex-collection-cta__primary {
        color: #fff;
        background: linear-gradient(135deg, #1f5f47, #0d3a2b);
        box-shadow: 0 10px 22px rgba(13, 58, 43, 0.18);
        font-weight: 700;
      }

      .codex-collection-cta__primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(41, 28, 14, 0.14);
      }

      /* Action row – shared flex layout for button groups */
      .codex-product-cta__actions,
      .codex-collection-cta__actions,
      .codex-growth-hub__actions,
      .codex-legacy-redirect__actions,
      .codex-editorial-link-list,
      .codex-editorial-action-links,
      .codex-editorial-brief-links,
      .codex-editorial-jump-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .codex-product-cta__actions,
      .codex-legacy-redirect__actions {
        margin-top: 1rem;
      }

      .codex-legacy-redirect__actions { margin-top: 1.25rem; gap: 0.8rem; }
      .codex-growth-hub__actions { gap: 0.8rem; grid-column: 1 / -1; }
      .codex-editorial-link-list,
      .codex-editorial-action-links,
      .codex-editorial-brief-links { gap: 0.8rem; }

      /* Support / card panel – shared pattern for info grids */
      .codex-product-support,
      .codex-article-support,
      .codex-collection-support {
        padding: 1.5rem;
        border: 1px solid var(--codex-border);
        border-radius: var(--codex-radius-card);
      }

      .codex-product-support {
        margin: 2rem 0 2.5rem;
        background: linear-gradient(180deg, rgba(245, 245, 245, 0.9), rgba(255, 255, 255, 0.98));
      }

      .codex-article-support {
        margin: 2.5rem 0 0;
        background: linear-gradient(180deg, rgba(245, 245, 245, 0.85), rgba(255, 255, 255, 0.98));
      }

      .codex-collection-support {
        margin: 1.5rem 0 2rem;
        background: linear-gradient(180deg, var(--codex-bg-warm), rgba(255, 255, 255, 0.98));
      }

      /* ── Collection Buying Support (redesigned) ── */

      .codex-collection-buying-support {
        margin: 1.5rem 0 2rem;
        display: grid;
        gap: 1.25rem;
      }

      /* Collection CTA — redesigned as a horizontal card */
      .codex-collection-cta {
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr auto;
        align-items: center;
        padding: 1.5rem 1.75rem;
        border-radius: var(--codex-radius-card-lg);
        background: linear-gradient(135deg, #1e150b 0%, #3a2a16 100%);
        color: #f0e8dd;
        border: none;
      }

      .codex-collection-cta h2 {
        margin: 0 0 0.35rem;
        font-size: 1.25rem;
        line-height: 1.25;
        color: #fff;
      }

      .codex-collection-cta__copy p:last-child {
        margin-bottom: 0;
        color: #d4c5b0;
        font-size: 0.95rem;
        line-height: 1.55;
      }

      .codex-collection-cta__brief {
        margin: 0.75rem 0 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 1.25rem;
      }

      .codex-collection-cta__brief li {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        font-size: 0.88rem;
        color: #c8b89e;
      }

      .codex-collection-cta__check {
        color: var(--codex-gold);
        font-weight: 700;
      }

      .codex-collection-cta__brief li + li {
        margin-top: 0;
      }

      .codex-collection-cta__actions {
        grid-row: 1 / -1;
        align-self: center;
      }

      .codex-collection-cta__primary {
        white-space: nowrap;
        background: var(--codex-gold) !important;
        color: var(--codex-dark) !important;
        font-weight: 700;
        box-shadow: 0 8px 20px rgba(195, 154, 95, 0.3);
      }

      .codex-collection-cta__primary:hover {
        box-shadow: 0 10px 24px rgba(195, 154, 95, 0.4);
      }

      /* Collection Guidance — redesigned as numbered steps */
      .codex-collection-guidance {
        padding: 1.5rem 1.75rem;
        border-radius: var(--codex-radius-card-lg);
        border: 1px solid var(--codex-border-light);
        background: rgba(255, 255, 255, 0.7);
      }

      .codex-collection-guidance__title {
        margin: 0 0 1.15rem;
        font-size: 1.15rem;
        color: var(--codex-text);
      }

      .codex-collection-guidance__steps {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0;
      }

      .codex-collection-guidance__step {
        display: grid;
        grid-template-columns: 2.4rem 1fr;
        gap: 0.75rem;
        padding: 1rem 0;
        border-top: 1px solid var(--codex-border-light);
        align-items: start;
      }

      .codex-collection-guidance__step:first-child {
        border-top: none;
        padding-top: 0;
      }

      .codex-collection-guidance__step:last-child {
        padding-bottom: 0;
      }

      .codex-collection-guidance__num {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2.2rem;
        height: 2.2rem;
        border-radius: 50%;
        background: var(--codex-bg-warm);
        border: 1px solid var(--codex-border);
        color: var(--codex-dark-mid);
        font-size: 0.85rem;
        font-weight: 700;
        flex-shrink: 0;
      }

      .codex-collection-guidance__body strong {
        display: block;
        margin-bottom: 0.25rem;
        color: var(--codex-text);
        font-size: 0.95rem;
      }

      .codex-collection-guidance__body p {
        margin: 0;
        color: var(--codex-text-muted);
        font-size: 0.92rem;
        line-height: 1.6;
      }

      /* Support grids */
      .codex-product-support__grid {
        display: grid;
        gap: 1.25rem;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .codex-article-support__grid {
        display: grid;
        gap: 1.25rem;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      /* Support panel headings */
      .codex-product-support__panel h2,
      .codex-article-support__panel h2 {
        margin: 0 0 0.85rem;
        font-size: 1.15rem;
      }

      /* Support dl resets */
      .codex-product-procurement dl,
      .codex-article-guidance dl {
        margin: 0;
      }

      /* Support row separators */
      .codex-product-support__row + .codex-product-support__row,
      .codex-article-support__row + .codex-article-support__row {
        margin-top: 0.85rem;
        padding-top: 0.85rem;
        border-top: 1px solid var(--codex-border-light);
      }

      .codex-product-support__row dt,
      .codex-article-support__row dt {
        margin: 0 0 0.25rem;
        font-weight: 700;
        color: var(--codex-text);
      }

      .codex-product-support__row dd,
      .codex-article-support__row dd {
        margin: 0;
        color: var(--codex-text-muted);
      }

      /* ── Blog Index ── */

      .codex-blog-index {
        max-width: 1100px;
        margin: 2rem auto 3rem;
        padding: 0 1rem;
      }

      .codex-blog-index__header {
        margin-bottom: 1.5rem;
      }

      .codex-blog-index__header h1 {
        margin: 0 0 0.4rem;
        font-size: 1.75rem;
        color: var(--codex-text);
      }

      .codex-blog-index__header p {
        margin: 0;
        color: var(--codex-text-muted);
        font-size: 1rem;
        line-height: 1.5;
      }

      /* Topic filter pills */
      .codex-blog-index__topics {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--codex-border-light);
      }

      .codex-blog-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.4rem 0.85rem;
        border: 1px solid var(--codex-border);
        border-radius: var(--codex-radius-pill);
        background: #fff;
        color: var(--codex-text-muted);
        font-size: 0.82rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 150ms ease;
      }

      .codex-blog-pill:hover {
        border-color: var(--codex-gold);
        color: var(--codex-text);
      }

      .codex-blog-pill--active {
        background: var(--codex-dark);
        border-color: var(--codex-dark);
        color: #fff;
      }

      .codex-blog-pill--active:hover {
        background: var(--codex-dark-mid);
        color: #fff;
      }

      .codex-blog-pill span {
        font-size: 0.72rem;
        opacity: 0.6;
      }

      /* Card grid */
      .codex-blog-index__grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(3, 1fr);
      }

      .codex-blog-grid-card {
        display: flex;
        flex-direction: column;
        padding: 1.25rem 1.35rem;
        border: 1px solid var(--codex-border-light);
        border-radius: var(--codex-radius-card);
        background: #fff;
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      }

      .codex-blog-grid-card:hover {
        transform: translateY(-3px);
        border-color: rgba(195, 154, 95, 0.35);
        box-shadow: 0 10px 28px rgba(41, 28, 14, 0.07);
      }

      .codex-blog-grid-card__thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border-radius: var(--codex-radius-card);
        margin-bottom: 0.75rem;
        background: var(--codex-bg-warm);
      }

      .codex-blog-grid-card__tag {
        display: inline-block;
        align-self: flex-start;
        margin-bottom: 0.65rem;
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
        background: var(--codex-bg-warm);
        color: var(--codex-dark-mid);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .codex-blog-grid-card strong {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--codex-text);
        font-size: 1rem;
        line-height: 1.35;
      }

      .codex-blog-grid-card p {
        margin: 0;
        color: var(--codex-text-muted);
        font-size: 0.88rem;
        line-height: 1.55;
        flex-grow: 1;
      }

      .codex-blog-grid-card__cta {
        display: inline-block;
        margin-top: 0.85rem;
        color: var(--codex-gold);
        font-size: 0.85rem;
        font-weight: 600;
      }

      @media (max-width: 900px) {
        .codex-blog-index__grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 560px) {
        .codex-blog-index__grid {
          grid-template-columns: 1fr;
        }
      }

      /* ── Product Spec Sheet ── */

      .codex-product-spec-sheet {
        display: grid;
        gap: 1.5rem;
        grid-template-columns: 1.4fr 0.6fr;
        margin: 1.5rem 0;
      }

      .codex-spec-table-wrap {
        padding: 1.5rem;
        border-radius: var(--codex-radius-card-lg);
        border: 1px solid var(--codex-border-light);
        background: #fff;
      }

      .codex-spec-table-wrap h2 {
        margin: 0 0 1rem;
        font-size: 1.15rem;
        color: var(--codex-text);
      }

      .codex-spec-table {
        width: 100%;
        border-collapse: collapse;
      }

      .codex-spec-table th,
      .codex-spec-table td {
        padding: 0.7rem 0.85rem;
        border-bottom: 1px solid var(--codex-border-light);
        text-align: left;
        vertical-align: top;
        font-size: 0.92rem;
      }

      .codex-spec-table th {
        width: 35%;
        font-weight: 600;
        color: var(--codex-text);
        background: var(--codex-bg-warm);
      }

      .codex-spec-table td {
        color: var(--codex-text-muted);
      }

      .codex-spec-table tbody tr:last-child th,
      .codex-spec-table tbody tr:last-child td {
        border-bottom: 0;
      }

      .codex-spec-table tbody tr:nth-child(even) th {
        background: rgba(248, 246, 241, 0.5);
      }

      .codex-spec-compat {
        margin-top: 1rem;
        padding: 0.85rem 1rem;
        border-radius: 12px;
        background: var(--codex-bg-warm);
        font-size: 0.9rem;
        color: var(--codex-text-muted);
        line-height: 1.55;
      }

      .codex-spec-compat strong {
        color: var(--codex-text);
      }

      .codex-spec-sidebar {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .codex-spec-applications,
      .codex-spec-buyer-notes {
        padding: 1.15rem 1.25rem;
        border-radius: var(--codex-radius-card-lg);
        border: 1px solid var(--codex-border-light);
        background: #fff;
      }

      .codex-spec-applications h3,
      .codex-spec-buyer-notes h3 {
        margin: 0 0 0.75rem;
        font-size: 1rem;
        color: var(--codex-text);
      }

      .codex-spec-applications ul {
        margin: 0;
        padding-left: 1.15rem;
      }

      .codex-spec-applications li {
        color: var(--codex-text-muted);
        font-size: 0.92rem;
      }

      .codex-spec-applications li + li {
        margin-top: 0.45rem;
      }

      .codex-spec-buyer-notes ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .codex-spec-note {
        display: flex;
        gap: 0.65rem;
        align-items: start;
        font-size: 0.88rem;
        color: var(--codex-text-muted);
        line-height: 1.55;
      }

      .codex-spec-note + .codex-spec-note {
        margin-top: 0.65rem;
        padding-top: 0.65rem;
        border-top: 1px solid var(--codex-border-light);
      }

      .codex-spec-note__num {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 1.6rem;
        height: 1.6rem;
        border-radius: 50%;
        background: var(--codex-bg-warm);
        border: 1px solid var(--codex-border);
        color: var(--codex-dark-mid);
        font-size: 0.75rem;
        font-weight: 700;
        flex-shrink: 0;
      }

      @media (max-width: 767px) {
        .codex-product-spec-sheet {
          grid-template-columns: 1fr;
        }
      }

      /* Support list styles */
      .codex-article-summary ul,
      .codex-article-sources ul,
      .codex-article-related ul {
        margin: 0;
        padding-left: 1.15rem;
      }

      .codex-article-summary li,
      .codex-article-sources li,
      .codex-article-related li {
        margin: 0;
        color: var(--codex-text-muted);
      }

      .codex-article-summary li + li,
      .codex-article-sources li + li,
      .codex-article-related li + li {
        margin-top: 0.65rem;
      }

      /* ═══════════════════════════════════════════
         Site Header & Navigation Fixes
         ═══════════════════════════════════════════ */

      /* Fix: header overlapping page content when position:absolute */
      .site-header,
      .site-header .site-header-inner-wrap,
      .site-header .site-header-inner-wrap.item-is-fixed,
      .site-header .site-header-inner-wrap.kadence-sticky-header,
      .site-header .site-header-upper-wrap,
      .site-header .site-header-upper-inner-wrap,
      .site-header .site-header-row-container-inner {
        position: sticky !important;
        top: 0 !important;
        z-index: 1000 !important;
        background: rgba(255, 255, 255, 0.97) !important;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 1px 4px rgba(41, 28, 14, 0.08);
      }
      /* Force consistent nav text color on all scroll states */
      .site-header .site-header-inner-wrap a,
      .site-header .site-header-inner-wrap.item-is-fixed a,
      .site-header .site-header-inner-wrap.kadence-sticky-header a,
      .site-header .main-navigation a,
      .site-header .header-navigation a {
        color: var(--codex-dark, #2a1f14) !important;
      }
      .site-header .main-navigation a:hover,
      .site-header .header-navigation a:hover {
        color: var(--codex-gold, #b08d57) !important;
      }

      /* ── Desktop: show full nav bar ── */
      @media (min-width: 769px) {
        /* Hide the mobile header on desktop */
        .site-mobile-header-wrap {
          display: none !important;
        }

        /* Show the desktop header — undo Kadence fixed/sticky transforms */
        .site-header-wrap {
          display: block !important;
          width: 100% !important;
          height: auto !important;
        }

        .site-header-inner-wrap,
        .site-header-inner-wrap.item-is-fixed,
        .site-header-inner-wrap.kadence-sticky-header {
          position: relative !important;
          display: block !important;
          width: 100% !important;
          height: auto !important;
          transform: none !important;
          top: auto !important;
        }

        .site-header-upper-wrap,
        .site-header-upper-inner-wrap {
          display: block !important;
          width: 100% !important;
          height: auto !important;
        }

        .site-top-header-wrap {
          display: block !important;
          width: 100% !important;
          height: auto !important;
        }

        .site-top-header-wrap .site-header-row-container-inner,
        .site-top-header-wrap .site-container {
          display: block !important;
          width: 100% !important;
          max-width: 1200px;
          margin: 0 auto;
          padding: 0 1.5rem;
        }

        /* Layout: logo left, nav center-right */
        .site-top-header-inner-wrap.site-header-row {
          display: flex !important;
          align-items: center;
          justify-content: space-between;
          min-height: 64px;
          width: 100% !important;
        }

        .site-header-section {
          display: flex !important;
          align-items: center;
          width: auto !important;
          flex-shrink: 0;
        }

        /* Hide empty sections */
        .site-header-section-left-center:empty,
        .site-header-section-right-center:empty,
        .site-header-section-center:empty,
        .site-header-section:not(:has(*)) {
          display: none !important;
        }

        /* Logo */
        .site-branding .custom-logo {
          max-height: 38px;
          width: auto;
        }

        /* Navigation */
        #site-navigation {
          display: flex !important;
        }

        #site-navigation .primary-menu-container {
          display: flex !important;
        }

        #primary-menu {
          display: flex !important;
          gap: 0.15rem;
          align-items: center;
          list-style: none;
          margin: 0;
          padding: 0;
        }

        #primary-menu > li {
          display: flex !important;
          align-items: center;
        }

        #primary-menu > li > a {
          display: inline-flex;
          align-items: center;
          padding: 0.55rem 0.85rem;
          font-size: 0.9rem;
          font-weight: 500;
          letter-spacing: 0.01em;
          color: var(--codex-dark);
          text-decoration: none;
          white-space: nowrap;
          border-radius: 8px;
          transition: color 160ms ease, background 160ms ease;
        }

        #primary-menu > li > a:hover,
        #primary-menu > li.current-menu-item > a {
          color: var(--codex-gold);
          background: rgba(195, 154, 95, 0.06);
        }

        /* Dropdown toggle arrow */
        #primary-menu .dropdown-nav-toggle {
          display: none;
        }

        /* Sub-menus hidden for now */
        #primary-menu .sub-menu {
          display: none;
        }
      }

      /* ── Mobile: keep hamburger layout ── */
      @media (max-width: 768px) {
        .site-header-wrap {
          display: none !important;
        }

        .site-mobile-header-wrap {
          display: flex !important;
          align-items: center;
          justify-content: space-between;
          min-height: 56px;
          padding: 0 1rem;
        }

        .site-mobile-header-wrap .site-container {
          display: flex;
          align-items: center;
          justify-content: space-between;
          width: 100%;
        }

        .mobile-site-branding .custom-logo {
          max-height: 30px;
          width: auto;
        }
      }

      /* ═══════════════════════════════════════════
         About Page Header
         ═══════════════════════════════════════════ */

      .codex-about-header {
        position: relative;
        z-index: 1;
        max-width: 720px;
        margin: 0 auto 1.5rem;
        padding: 2.5rem 1.5rem 2rem;
        text-align: center;
      }

      .codex-about-header h1 {
        margin: 0 0 0.75rem;
        color: var(--codex-text) !important;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        font-weight: 800;
        line-height: 1.15;
      }

      .codex-about-header p {
        margin: 0;
        color: var(--codex-text-muted) !important;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      /* ═══════════════════════════════════════════
         WordPress Overrides
         ═══════════════════════════════════════════ */

      .single-product .woocommerce-product-gallery {
        opacity: 1 !important;
      }

      /* C2: Contact/archive hero text must be white on dark overlay */
      .entry-hero-layout-standard .hero-container .page-title,
      .entry-hero-layout-standard .hero-container .archive-title,
      .entry-hero-layout-standard .hero-container h1,
      .kt-row-has-bg h1.page-title,
      .kb-row-layout-wrap.kt-row-has-bg h1 {
        color: #fff !important;
      }

      .entry-content > .kb-row-layout-wrap.kt-row-has-bg:first-child p {
        color: rgba(255, 255, 255, 0.9);
      }

      /* H4: Hide hero breadcrumb on catalog pages (content area has its own) */
      .entry-hero .kadence-breadcrumbs {
        display: none;
      }

      /* M5: Reduce contact hero dead space */
      .entry-hero.post-archive-hero-section {
        min-height: auto !important;
        padding-bottom: 2rem !important;
      }

      /* H5: Tighten footer layout, remove dead space */
      .site-footer .site-footer-bottom-section {
        padding-top: 1.5rem;
        padding-bottom: 1.5rem;
      }

      .site-footer .footer-widget-area .widget {
        margin-bottom: 0.75rem;
      }

      /* ═══════════════════════════════════════════
         Navigation RFQ Links
         ═══════════════════════════════════════════ */

      #site-navigation .codex-nav-rfq-link,
      #footer-navigation .codex-nav-rfq-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--codex-radius-pill);
        padding: 0.5rem 1rem !important;
        background: var(--codex-gradient-gold);
        color: var(--codex-dark) !important;
        box-shadow: var(--codex-shadow);
      }

      .header-navigation .header-menu-container.primary-menu-container > ul > li > a.codex-nav-rfq-link:after,
      .footer-navigation .footer-menu-container > ul > li > a.codex-nav-rfq-link:after {
        display: none !important;
      }

      #site-navigation .codex-nav-rfq-link:hover,
      #footer-navigation .codex-nav-rfq-link:hover,
      #site-navigation .current-menu-item > .codex-nav-rfq-link {
        transform: translateY(-1px);
        background: var(--codex-gradient-gold-hover);
        color: var(--codex-dark) !important;
      }

      #mobile-site-navigation .codex-nav-rfq-link {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 0.8rem;
        border-radius: var(--codex-radius-pill);
        padding: 0.9rem 1rem !important;
        background: var(--codex-gradient-gold);
        color: var(--codex-dark) !important;
        box-shadow: 0 12px 24px rgba(41, 28, 14, 0.16);
      }

      #mobile-site-navigation .codex-nav-rfq-link:hover,
      #mobile-site-navigation .current-menu-item > .codex-nav-rfq-link {
        background: var(--codex-gradient-gold-hover);
        color: var(--codex-dark) !important;
      }

      /* ── Industries simple dropdown ───────────────────────── */
      .codex-industries-drop {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 99999;
        background: #fff !important;
        min-width: 260px;
        box-shadow: 0 8px 32px rgba(0,0,0,.18);
        border-radius: 10px;
        padding: 10px 0;
        list-style: none;
        border: 1px solid rgba(0,0,0,.06);
      }
      .codex-industries-menu:hover > .codex-industries-drop,
      .codex-industries-menu:focus-within > .codex-industries-drop {
        display: block !important;
      }
      .codex-industries-drop > li {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .codex-industries-drop > li > a {
        display: block;
        padding: 10px 22px;
        font-size: 0.9rem;
        font-weight: 500;
        color: #333 !important;
        text-decoration: none !important;
        transition: background 0.15s, color 0.15s;
        white-space: nowrap;
        line-height: 1.4;
      }
      .codex-industries-drop > li > a:hover {
        background: rgba(176, 141, 87, 0.1);
        color: var(--codex-gold, #b08d57) !important;
      }
      /* mobile industries menu */
      #mobile-site-navigation .codex-industries-menu > .sub-menu > li > a {
        font-weight: 600;
        font-size: 0.92rem;
        color: #333;
      }
      /* ── Industries summary page (redesigned) ──────────────── */
      .ind-page { max-width: 100%; margin: 0 auto; padding: 0 1.5rem; }
      .ind-header { text-align: center; padding: 2rem 0 1.5rem; }
      .ind-header h1 { font-size: 2.2rem; color: var(--codex-dark, #2a1f14); margin: 0.5rem 0; }
      .ind-header__sub { color: #666; font-size: 1.05rem; max-width: 700px; margin: 0.5rem auto 1.5rem; line-height: 1.6; }

      /* ── Sidebar + Content Layout ── */
      .ind-layout { display: flex; gap: 1.25rem; align-items: flex-start; }
      .ind-sidebar { flex-shrink: 0; width: 190px; position: sticky; top: 90px; max-height: calc(100vh - 110px); overflow-y: auto; }
      .ind-sidebar__nav { background: #fff; border-radius: 12px; border: 1px solid #f0ebe3; padding: 0.75rem 0; box-shadow: 0 2px 12px rgba(41,28,14,0.04); }
      .ind-sidebar__title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #999; padding: 0.5rem 1.1rem 0.6rem; border-bottom: 1px solid #f5f0ea; }
      .ind-sidebar__link { display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.8rem; text-decoration: none; color: var(--codex-dark, #2a1f14); font-size: 0.82rem; font-weight: 500; transition: all 0.15s; border-left: 3px solid transparent; }
      .ind-sidebar__link:hover { background: var(--codex-beige-light, #faf6f0); border-left-color: var(--codex-gold, #b08d57); }
      .ind-sidebar__link.active { background: var(--codex-beige-light, #faf6f0); border-left-color: var(--codex-gold, #b08d57); color: var(--codex-gold, #b08d57); font-weight: 600; }
      .ind-sidebar__emoji { font-size: 1rem; flex-shrink: 0; }
      .ind-sidebar__label { flex: 1; line-height: 1.3; }
      .ind-sidebar__count { font-size: 0.72rem; color: #aaa; background: #f5f0ea; border-radius: 99px; padding: 0.15rem 0.5rem; font-weight: 600; flex-shrink: 0; }
      .ind-content { flex: 1; min-width: 0; }

      .ind-hero-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem; margin-bottom: 3rem; }
      .ind-hero-card { display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 2px 12px rgba(41,28,14,0.06); text-decoration: none; color: inherit; transition: transform 0.25s, box-shadow 0.25s; }
      .ind-hero-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(41,28,14,0.12); }
      .ind-hero-card__img { height: 140px; background-size: cover; background-position: center; background-color: var(--codex-beige-light, #faf6f0); }
      .ind-hero-card__body { padding: 1rem 1.1rem 1.2rem; }
      .ind-hero-card__emoji { font-size: 1.3rem; }
      .ind-hero-card__title { font-size: 1.05rem; font-weight: 700; color: var(--codex-dark, #2a1f14); margin: 0.3rem 0; }
      .ind-hero-card__desc { font-size: 0.82rem; color: #777; line-height: 1.5; margin: 0 0 0.5rem; }
      .ind-hero-card__count { font-size: 0.82rem; color: var(--codex-gold, #b08d57); font-weight: 600; }

      .ind-section { margin-bottom: 3rem; padding-top: 1.5rem; border-top: 2px solid var(--codex-beige-light, #faf6f0); }
      .ind-section__header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1.5rem; margin-bottom: 1.5rem; }
      .ind-section__header-text { flex: 1; }
      .ind-section__emoji { font-size: 1.5rem; margin-right: 0.3rem; vertical-align: middle; }
      .ind-section__header h2 { display: inline; font-size: 1.5rem; vertical-align: middle; }
      .ind-section__header h2 a { color: var(--codex-dark, #2a1f14); text-decoration: none; }
      .ind-section__header h2 a:hover { color: var(--codex-gold, #b08d57); }
      .ind-section__header p { color: #666; font-size: 0.95rem; margin: 0.4rem 0 0; line-height: 1.5; }
      .ind-section__cta { flex-shrink: 0; margin-top: 0.4rem; padding: 0.5rem 1.2rem; border-radius: 8px; background: var(--codex-gold, #b08d57); color: #fff; font-size: 0.85rem; font-weight: 600; text-decoration: none; white-space: nowrap; transition: background 0.2s; }
      .ind-section__cta:hover { background: var(--codex-gold-dark, #96763e); color: #fff; }

      .ind-product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1rem; }
      .ind-product-card { display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; background: #fff; border: 1px solid #f0ebe3; text-decoration: none; color: inherit; transition: transform 0.2s, box-shadow 0.2s; }
      .ind-product-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(41,28,14,0.08); }
      .ind-product-card img { width: 100%; height: 160px; object-fit: cover; background: var(--codex-beige-light, #faf6f0); }
      .ind-product-card__placeholder { width: 100%; height: 160px; background: linear-gradient(135deg, #faf6f0 0%, #f0ebe3 100%); }
      .ind-product-card__body { padding: 0.8rem 1rem 1rem; }
      .ind-product-card__body h4 { font-size: 0.9rem; font-weight: 600; color: var(--codex-dark, #2a1f14); margin: 0 0 0.3rem; line-height: 1.35; }
      .ind-product-card__body p { font-size: 0.8rem; color: #888; margin: 0; line-height: 1.4; }

      /* ── Industry category product grid (on /industries/xxx/ pages) ── */
      .ind-cat-products { margin: 2.5rem 0; padding: 2rem 0; border-top: 2px solid var(--codex-beige-light, #faf6f0); border-bottom: 2px solid var(--codex-beige-light, #faf6f0); }
      .ind-cat-products__title { font-size: 1.5rem; color: var(--codex-dark, #2a1f14); margin: 0 0 0.3rem; text-align: center; }
      .ind-cat-products__sub { color: #666; font-size: 0.95rem; text-align: center; margin: 0 0 1.5rem; }
      .ind-cat-products__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
      .ind-cat-card { display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; background: #fff; border: 1px solid #f0ebe3; text-decoration: none; color: inherit; transition: all 0.2s; }
      .ind-cat-card:hover { border-color: var(--codex-gold, #b08d57); box-shadow: 0 6px 20px rgba(41,28,14,0.1); transform: translateY(-3px); }
      .ind-cat-card img { width: 100%; height: 140px; object-fit: cover; background: var(--codex-beige-light, #faf6f0); }
      .ind-cat-card__placeholder { width: 100%; height: 140px; background: linear-gradient(135deg, #faf6f0 0%, #f0ebe3 100%); }
      .ind-cat-card__body { padding: 0.75rem 1rem 0.85rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
      .ind-cat-card__body h3 { font-size: 0.85rem; font-weight: 600; color: var(--codex-dark, #2a1f14); margin: 0; line-height: 1.3; flex: 1; }
      .ind-cat-card__arrow { color: var(--codex-gold, #b08d57); font-size: 1.1rem; font-weight: 700; transition: transform 0.2s; flex-shrink: 0; }
      .ind-cat-card:hover .ind-cat-card__arrow { transform: translateX(4px); }

      @media (max-width: 1024px) {
        .ind-sidebar { display: none; }
        .ind-layout { display: block; }
        .ind-hero-grid { grid-template-columns: repeat(2, 1fr); }
        .ind-section__header { flex-direction: column; }
      }
      @media (max-width: 600px) {
        .ind-hero-grid { grid-template-columns: 1fr; }
        .ind-header h1 { font-size: 1.6rem; }
        .ind-product-grid { grid-template-columns: repeat(2, 1fr); }
      }

      /* Keep old classes for backward compat */
      .codex-industry-section { margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid #eee; }
      .codex-industry-section:last-child { border-bottom: none; }
      .codex-industry-title { font-size: 1.5rem; margin-bottom: 0.3rem; }
      .codex-industry-title a { color: var(--codex-dark, #2a1f14); text-decoration: none; }
      .codex-industry-title a:hover { color: var(--codex-gold, #b08d57); }
      .codex-industry-desc { color: #666; font-size: 0.95rem; margin-bottom: 1rem; }

      .codex-footer-rfq-entry {
        margin: 0.75rem 0;
      }

      .codex-footer-rfq-link {
        min-height: 2.7rem;
        padding: 0.68rem 1rem;
        color: #fff !important;
        box-shadow: 0 12px 24px rgba(41, 28, 14, 0.18);
      }

      .codex-footer-rfq-link:hover {
        color: #fff !important;
      }

      /* ═══════════════════════════════════════════
         Product CTA Block
         ═══════════════════════════════════════════ */

      .codex-product-cta {
        margin: 1.35rem 0 2rem;
        padding: 1.35rem;
        border: 1px solid var(--codex-border);
        border-radius: 22px;
        background: var(--codex-bg-hero);
        box-shadow: 0 16px 34px rgba(41, 28, 14, 0.08);
      }

      .codex-product-cta h2 {
        margin: 0 0 0.55rem;
        font-size: clamp(1.45rem, 1.28rem + 0.35vw, 1.8rem);
        color: var(--codex-text);
      }

      .codex-product-cta__copy p:last-child {
        margin: 0;
        color: var(--codex-text-muted);
      }

      .codex-product-cta__brief {
        margin: 1rem 0 0;
        padding-left: 1.15rem;
        color: var(--codex-text-muted);
      }

      .codex-product-cta__brief li + li {
        margin-top: 0.5rem;
      }

      /* ═══════════════════════════════════════════
         Article FAQ (inside support panels)
         ═══════════════════════════════════════════ */

      .codex-article-faq {
        margin-top: 1.25rem;
      }

      .codex-article-faq details {
        border-top: 1px solid var(--codex-border-light);
        padding-top: 0.85rem;
        margin-top: 0.85rem;
      }

      .codex-article-faq details:first-of-type {
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
      }

      .codex-article-faq summary {
        cursor: pointer;
        font-weight: 700;
        color: var(--codex-text);
      }

      .codex-article-faq p {
        margin: 0.5rem 0 0;
        color: var(--codex-text-muted);
      }

      /* ═══════════════════════════════════════════
         Collection CTA Block
         ═══════════════════════════════════════════ */

      /* ═══════════════════════════════════════════
         Growth Hub Block
         ═══════════════════════════════════════════ */

      .codex-growth-hub {
        margin: 2rem 0;
        padding: 1.5rem;
        border: 1px solid rgba(41, 28, 14, 0.1);
        border-radius: var(--codex-radius-card-xl);
        background:
          radial-gradient(circle at top right, var(--codex-border-gold), transparent 28%),
          var(--codex-bg-warm-gradient);
        box-shadow: 0 18px 36px rgba(41, 28, 14, 0.08);
      }

      .codex-growth-hub__hero,
      .codex-growth-hub__group,
      .codex-growth-hub__brief {
        padding: 1.25rem;
        border-radius: var(--codex-radius-card-lg);
        background: rgba(255, 255, 255, 0.9);
      }

      .codex-growth-hub__group,
      .codex-growth-hub__brief {
        margin-top: 1rem;
      }

      .codex-growth-hub__hero h2,
      .codex-growth-hub__group h2,
      .codex-growth-hub__brief h2 {
        margin: 0 0 0.65rem;
        color: var(--codex-text);
      }

      .codex-growth-hub__hero p:last-child,
      .codex-growth-hub__group p:last-child,
      .codex-growth-hub__brief p:last-child {
        margin-bottom: 0;
      }

      .codex-growth-hub__grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        margin-top: 1rem;
      }

      .codex-growth-hub__card {
        display: block;
        padding: 1rem;
        border: 1px solid rgba(41, 28, 14, 0.1);
        border-radius: 18px;
        background: var(--codex-bg-card);
        text-decoration: none;
        transition: var(--codex-transition), border-color 160ms ease;
      }

      .codex-growth-hub__card:hover {
        transform: translateY(-2px);
        border-color: rgba(195, 154, 95, 0.3);
        box-shadow: 0 14px 28px rgba(41, 28, 14, 0.08);
      }

      .codex-growth-hub__card-eyebrow {
        display: block;
        margin-bottom: 0.45rem;
        color: var(--codex-gold-muted);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .codex-growth-hub__card strong {
        display: block;
        color: var(--codex-text);
      }

      .codex-growth-hub__card span:last-child {
        display: block;
        margin-top: 0.45rem;
        color: var(--codex-text-muted);
      }

      .codex-growth-hub__brief {
        display: grid;
        gap: 1rem;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.9fr);
        align-items: center;
      }

      .codex-growth-hub__brief-list {
        margin: 0;
        padding-left: 1.15rem;
      }

      .codex-growth-hub__brief-list li + li {
        margin-top: 0.5rem;
      }

      /* ═══════════════════════════════════════════
         Quote Brief — Redesigned CTA Section
         ═══════════════════════════════════════════ */

      .codex-quote-brief {
        margin: 2.5rem 0;
        padding: 2px;
        border-radius: var(--codex-radius-card-xl);
        background: linear-gradient(135deg, rgba(195, 154, 95, 0.4), rgba(41, 28, 14, 0.15), rgba(195, 154, 95, 0.25));
      }

      .codex-quote-brief__inner {
        display: grid;
        gap: 2rem;
        grid-template-columns: 1.1fr 0.9fr;
        align-items: center;
        padding: 2.5rem 2.5rem;
        border-radius: calc(var(--codex-radius-card-xl) - 2px);
        background: linear-gradient(160deg, #faf8f4 0%, #fff 40%, #faf8f4 100%);
      }

      .codex-quote-brief__eyebrow {
        margin: 0 0 0.5rem;
        color: var(--codex-gold-muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .codex-quote-brief__copy h2 {
        margin: 0 0 0.6rem;
        color: var(--codex-text);
        font-size: clamp(1.4rem, 3vw, 1.8rem);
        line-height: 1.2;
      }

      .codex-quote-brief__copy > p:not(.codex-quote-brief__eyebrow) {
        margin: 0 0 1.5rem;
        color: var(--codex-text-muted);
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .codex-quote-brief__cta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .codex-quote-brief__btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.85rem;
        padding: 0.7rem 1.4rem;
        border: 1px solid var(--codex-border);
        border-radius: var(--codex-radius-pill);
        background: #fff;
        color: var(--codex-text);
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        transition: var(--codex-transition), background-color 160ms ease, border-color 160ms ease;
      }

      .codex-quote-brief__btn--primary {
        border-color: transparent;
        background: var(--codex-gradient-dark);
        color: #fff;
        box-shadow: 0 8px 20px rgba(41, 28, 14, 0.18);
      }

      .codex-quote-brief__btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(41, 28, 14, 0.12);
      }

      .codex-quote-brief__btn--primary:hover {
        box-shadow: 0 12px 28px rgba(41, 28, 14, 0.22);
      }

      .codex-quote-brief__checklist {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .codex-quote-brief__item {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--codex-border-light);
        color: var(--codex-text);
        font-size: 0.92rem;
        line-height: 1.45;
      }

      .codex-quote-brief__item:first-child {
        border-top: 1px solid var(--codex-border-light);
      }

      .codex-quote-brief__item:last-child {
        border-bottom: none;
      }

      .codex-quote-brief__step-label {
        padding: 0 1rem 0.5rem;
        color: var(--codex-gold-muted);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .codex-quote-brief__icon {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2.2rem;
        height: 2.2rem;
        border-radius: 10px;
        background: rgba(195, 154, 95, 0.08);
        color: var(--codex-gold-muted);
      }

      .codex-quote-brief__icon svg {
        display: block;
      }

      @media (max-width: 767px) {
        .codex-quote-brief__inner {
          grid-template-columns: 1fr;
          padding: 1.5rem;
        }
      }

      .codex-growth-hub__action {
        min-height: 2.9rem;
        border: 1px solid var(--codex-border);
        background: rgba(255, 255, 255, 0.96);
        color: var(--codex-text);
      }

      /* ═══════════════════════════════════════════
         Industry Selector (Homepage)
         ═══════════════════════════════════════════ */

      .codex-industry-selector {
        margin: 2.5rem auto;
        padding: 0 1.5rem;
        max-width: 1200px;
      }

      .codex-industry-selector__header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .codex-industry-selector__header h2 {
        margin: 0 0 0.5rem;
        font-size: 1.8rem;
        color: var(--codex-text);
      }

      .codex-industry-selector__header p {
        margin: 0;
        color: var(--codex-text-muted);
        font-size: 1.05rem;
      }

      .codex-industry-selector__grid {
        display: grid;
        gap: 1.25rem;
        grid-template-columns: repeat(2, 1fr);
      }

      .codex-industry-selector__card {
        display: flex;
        flex-direction: column;
        position: relative;
        padding: 1.4rem 1.6rem;
        border: 1px solid rgba(41, 28, 14, 0.08);
        border-left: 4px solid var(--accent, var(--codex-gold));
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.96);
        text-decoration: none;
        transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
      }

      .codex-industry-selector__card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px rgba(41, 28, 14, 0.1);
        border-color: var(--accent, var(--codex-gold));
      }

      .codex-industry-selector__eyebrow {
        display: block;
        margin-bottom: 0.4rem;
        color: var(--accent, var(--codex-gold-muted));
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .codex-industry-selector__card strong {
        display: block;
        margin-bottom: 0.4rem;
        color: var(--codex-text);
        font-size: 1.05rem;
      }

      .codex-industry-selector__card span:nth-child(3) {
        display: block;
        color: var(--codex-text-muted);
        font-size: 0.9rem;
        line-height: 1.5;
        flex: 1;
      }

      .codex-industry-selector__arrow {
        display: block;
        margin-top: 0.75rem;
        color: var(--accent, var(--codex-gold));
        font-size: 1.1rem;
        font-weight: 600;
        transition: transform 160ms ease;
      }

      .codex-industry-selector__card:hover .codex-industry-selector__arrow {
        transform: translateX(4px);
      }

      .codex-industry-selector__compare {
        margin-top: 1.5rem;
        padding: 1rem 1.25rem;
        border-radius: 12px;
        background: rgba(248, 246, 241, 0.7);
        text-align: center;
        font-size: 0.88rem;
        line-height: 1.8;
      }

      .codex-industry-selector__compare span {
        display: block;
        color: var(--codex-text-muted);
        font-weight: 500;
        margin-bottom: 0.3rem;
      }

      .codex-industry-selector__compare a {
        color: var(--codex-gold-muted);
        text-decoration: none;
        font-weight: 500;
        transition: color 160ms ease;
      }

      .codex-industry-selector__compare a:hover {
        color: var(--codex-gold);
        text-decoration: underline;
      }

      @media (max-width: 640px) {
        .codex-industry-selector__grid {
          grid-template-columns: 1fr;
        }

        .codex-industry-selector__header h2 {
          font-size: 1.4rem;
        }

        .codex-industry-selector {
          padding: 0 1rem;
        }
      }

      /* ═══════════════════════════════════════════
         Trust Bar
         ═══════════════════════════════════════════ */

      .codex-trust-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.5rem;
        margin: 2rem 0;
        padding: 1.25rem 1.5rem;
        border: 1px solid var(--codex-border-light);
        border-radius: var(--codex-radius-card);
        background: #fff;
      }

      .codex-trust-bar__item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.15rem;
        min-width: 120px;
      }

      .codex-trust-bar__item strong {
        color: var(--codex-text);
        font-size: 1.15rem;
      }

      .codex-trust-bar__item span {
        color: var(--codex-text-muted);
        font-size: 0.82rem;
      }

      @media (max-width: 767px) {
        .codex-trust-bar {
          gap: 1rem;
          padding: 1rem;
        }

        .codex-trust-bar__item {
          min-width: calc(50% - 1rem);
        }
      }

      /* ═══════════════════════════════════════════
         Contact RFQ Form
         ═══════════════════════════════════════════ */

      #contact-rfq-form {
        scroll-margin-top: 7rem;
      }

      #contact-rfq-form .kb-text-style-field::placeholder {
        color: rgba(255, 255, 255, 0.72);
      }

      /* ═══════════════════════════════════════════
         Legacy Redirect Page
         ═══════════════════════════════════════════ */

      .codex-legacy-redirect-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background:
          radial-gradient(circle at top left, var(--codex-border-gold), transparent 26%),
          linear-gradient(180deg, var(--codex-bg-warm), rgba(255, 255, 255, 1));
      }

      .codex-legacy-redirect {
        width: min(720px, 100%);
        padding: 1.5rem;
        border: 1px solid var(--codex-border);
        border-radius: var(--codex-radius-card-xl);
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 42px rgba(41, 28, 14, 0.08);
      }

      .codex-legacy-redirect h1 {
        margin: 0 0 0.75rem;
        color: var(--codex-text);
      }

      .codex-legacy-redirect__lead,
      .codex-legacy-redirect__meta,
      .codex-legacy-redirect p:last-of-type {
        color: var(--codex-text-muted);
      }

      .codex-legacy-redirect__details {
        margin: 1rem 0;
        display: grid;
        gap: 0.85rem;
      }

      .codex-legacy-redirect__details div {
        padding: 0.85rem 1rem;
        border-radius: var(--codex-radius-card);
        background: var(--codex-bg-warm);
        border: 1px solid var(--codex-border-light);
      }

      .codex-legacy-redirect__details dt {
        margin: 0 0 0.25rem;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--codex-gold);
      }

      .codex-legacy-redirect__details dd {
        margin: 0;
        word-break: break-word;
        color: var(--codex-text);
      }

      .codex-legacy-redirect__action {
        font-weight: 700;
      }

      .codex-legacy-redirect__action--primary {
        color: #fff;
        background: var(--codex-gradient-dark);
        border-color: transparent;
        box-shadow: 0 12px 26px rgba(41, 28, 14, 0.14);
      }

      /* ═══════════════════════════════════════════
         Editorial Pages
         ═══════════════════════════════════════════ */

      .codex-editorial-page {
        max-width: min(1160px, calc(100% - 2rem));
        margin: 0 auto 3rem;
      }

      .codex-editorial-trail {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0 0 1.25rem;
        padding-top: 3.5rem;
        color: var(--codex-text-subtle);
        font-size: 0.88rem;
        line-height: 1.4;
        position: relative;
        z-index: 1;
        overflow-wrap: break-word;
        word-break: break-word;
      }

      .codex-editorial-trail a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: var(--codex-gold);
        text-decoration: underline;
        text-decoration-color: rgba(195, 154, 95, 0.3);
        text-underline-offset: 3px;
      }

      .codex-editorial-trail a:hover {
        text-decoration-color: var(--codex-gold);
      }

      .codex-editorial-hero {
        display: grid;
        gap: 1.5rem;
        align-items: center;
        grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.9fr);
        padding: 1.75rem;
        border: 1px solid rgba(41, 28, 14, 0.1);
        border-radius: var(--codex-radius-card-xl);
        background:
          radial-gradient(circle at top left, rgba(195, 154, 95, 0.16), transparent 38%),
          var(--codex-bg-warm-gradient);
        box-shadow: var(--codex-shadow-heavy);
      }

      .codex-editorial-hero h1 {
        margin: 0;
        color: var(--codex-text);
        font-size: clamp(2rem, 1.7rem + 1vw, 2.8rem);
        line-height: 1.08;
        letter-spacing: -0.02em;
      }

      /* Page-type hero color variants */
      .codex-editorial-hero[data-page-type="solution"] {
        border-left: 4px solid var(--codex-teal);
        background:
          radial-gradient(circle at top left, var(--codex-teal-light), transparent 38%),
          var(--codex-bg-warm-gradient);
      }

      .codex-editorial-hero[data-page-type="solution"] .codex-editorial-kicker {
        color: var(--codex-teal);
      }

      .codex-editorial-hero[data-page-type="compare"] {
        border-left: 4px solid var(--codex-steel);
        background:
          radial-gradient(circle at top left, var(--codex-steel-light), transparent 38%),
          var(--codex-bg-warm-gradient);
      }

      .codex-editorial-hero[data-page-type="compare"] .codex-editorial-kicker {
        color: var(--codex-steel);
      }

      .codex-editorial-hero[data-page-type="guide"] {
        border-left: 4px solid var(--codex-forest);
        background:
          radial-gradient(circle at top left, var(--codex-forest-light), transparent 38%),
          var(--codex-bg-warm-gradient);
      }

      .codex-editorial-hero[data-page-type="guide"] .codex-editorial-kicker {
        color: var(--codex-forest);
      }

      .codex-editorial-hero[data-page-type="compatibility"] {
        border-left: 4px solid var(--codex-gold-muted);
      }

      .codex-editorial-answer {
        margin-top: 1rem;
        padding: 1rem 1.1rem;
        border: 1px solid var(--codex-border-gold);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.88);
      }

      .codex-editorial-summary {
        margin: 0;
        color: var(--codex-text-muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .codex-editorial-jump-nav {
        margin-top: 1.5rem;
        padding: 1.1rem 1.2rem;
        border: 1px solid var(--codex-border-light);
        border-radius: var(--codex-radius-card-lg);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
      }

      .codex-editorial-jump-nav .codex-editorial-kicker {
        margin-bottom: 0.65rem;
      }

      .codex-editorial-snapshot-grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      .codex-editorial-snapshot-card {
        padding: 1rem;
        border-radius: 18px;
        border: 1px solid var(--codex-border-light);
        background: rgba(255, 255, 255, 0.9);
      }

      .codex-editorial-snapshot-card p {
        margin: 0;
      }

      .codex-editorial-snapshot-card p + p {
        margin-top: 0.5rem;
      }

      .codex-editorial-snapshot-link {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        margin-top: 0.5rem;
        color: var(--codex-gold);
        font-weight: 700;
        text-decoration: none;
        transition: color 160ms ease;
      }

      .codex-editorial-snapshot-link:hover {
        color: var(--codex-dark-mid);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .codex-editorial-points,
      .codex-editorial-list {
        margin: 1rem 0 0;
        padding-left: 1.15rem;
      }

      .codex-editorial-points li,
      .codex-editorial-list li {
        color: var(--codex-text-muted);
      }

      .codex-editorial-points li + li,
      .codex-editorial-list li + li {
        margin-top: 0.55rem;
      }

      .codex-hero-cta {
        margin-top: 1.25rem;
      }

      .codex-hero-cta-btn {
        display: inline-block;
        padding: 0.75rem 2rem;
        background: var(--codex-gold);
        color: var(--codex-dark);
        font-weight: 700;
        font-size: 1rem;
        border-radius: var(--codex-radius-card);
        text-decoration: none;
        transition: opacity 0.15s;
      }

      .codex-hero-cta-btn:hover {
        opacity: 0.88;
        color: var(--codex-dark);
      }

      .codex-hero-trust-bar {
        display: flex;
        gap: 1.5rem;
        margin-top: 1rem;
        font-size: 0.78rem;
        color: var(--codex-text-muted);
      }

      .codex-hero-trust-bar strong {
        color: var(--codex-gold-muted);
      }

      @media (max-width: 600px) {
        .codex-hero-trust-bar {
          flex-wrap: wrap;
          gap: 0.75rem;
        }
      }

      .codex-editorial-step-list {
        list-style: none;
        margin: 1rem 0 0;
        padding: 0 0 0 0.4rem;
        display: grid;
        gap: 0;
        position: relative;
      }

      /* Vertical connecting line */
      .codex-editorial-step-list::before {
        content: "";
        position: absolute;
        left: calc(0.4rem + 2.45rem);
        top: 1.5rem;
        bottom: 1.5rem;
        width: 2px;
        background: linear-gradient(180deg, var(--codex-border), transparent);
        z-index: 0;
      }

      .codex-editorial-step {
        display: grid;
        gap: 0.8rem;
        grid-template-columns: auto 1fr;
        align-items: start;
        padding: 0.85rem 0.65rem;
        position: relative;
        z-index: 1;
        border: none;
        border-radius: 0;
        background: transparent;
      }

      .codex-editorial-step-index {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 4.9rem;
        min-height: 2.2rem;
        padding: 0.35rem 0.7rem;
        border-radius: var(--codex-radius-pill);
        background: linear-gradient(135deg, rgba(41, 28, 14, 0.96), rgba(108, 81, 39, 0.96));
        color: #fff;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .codex-editorial-step-copy {
        color: var(--codex-text-muted);
        line-height: 1.7;
      }

      .codex-editorial-callout {
        margin: 1.25rem 0;
        padding: 1.15rem 1.35rem;
        border-left: 3px solid var(--codex-gold);
        border-radius: 0 var(--codex-radius-card) var(--codex-radius-card) 0;
        background: var(--codex-bg-warm);
      }

      .codex-editorial-callout strong {
        display: block;
        margin-bottom: 0.3rem;
        color: var(--codex-text);
        font-size: 0.88rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .codex-editorial-callout p {
        margin: 0;
        color: var(--codex-text-muted);
        font-size: 0.92rem;
        line-height: 1.6;
      }

      .codex-editorial-callout__link {
        display: inline-block;
        margin-top: 0.5rem;
        color: var(--codex-gold);
        font-size: 0.88rem;
        font-weight: 600;
        text-decoration: none;
      }

      .codex-editorial-section a {
        color: var(--codex-gold);
        text-decoration: none;
        font-weight: 500;
      }

      .codex-editorial-section a:hover {
        text-decoration: underline;
      }

      .codex-editorial-figure {
        margin: 1rem 0;
      }

      .codex-editorial-figure img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border-radius: var(--codex-radius-card-lg);
      }

      .codex-editorial-section,
      .codex-editorial-card {
        margin-top: 2rem;
        padding: 1.5rem 1.65rem;
        border: 1px solid rgba(41, 28, 14, 0.1);
        border-radius: var(--codex-radius-card-lg);
        background: var(--codex-bg-card);
      }

      .codex-editorial-action-bar {
        margin-top: 2.5rem;
        padding: 1.5rem 1.65rem;
        border: 1px solid rgba(41, 28, 14, 0.1);
        border-radius: var(--codex-radius-card-lg);
        background: var(--codex-bg-card);
      }

      .codex-editorial-section[id],
      .codex-editorial-action-bar[id] {
        scroll-margin-top: 6rem;
      }

      .codex-editorial-section h2,
      .codex-editorial-card h2,
      .codex-editorial-action-bar h2 {
        margin: 0 0 0.8rem;
        color: var(--codex-text);
        font-size: 1.5rem;
      }

      .codex-editorial-section p,
      .codex-editorial-card p,
      .codex-editorial-action-bar p,
      .codex-editorial-brief-card p,
      .codex-editorial-brief-card dd {
        color: var(--codex-text-muted);
      }

      .codex-editorial-section p:last-child,
      .codex-editorial-card p:last-child,
      .codex-editorial-action-bar p:last-child {
        margin-bottom: 0;
      }

      .codex-editorial-resource-grid {
        display: grid;
        gap: 1.25rem;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        margin-top: 1.5rem;
      }

      .codex-editorial-link-card strong {
        display: block;
      }

      .codex-editorial-link-card span {
        display: block;
        font-size: 0.92rem;
      }

      .codex-editorial-brief-grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        margin: 0;
      }

      .codex-editorial-brief-card {
        margin: 0;
        padding: 1rem;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.84);
      }

      .codex-editorial-brief-card dt {
        margin: 0 0 0.4rem;
        color: var(--codex-text);
        font-weight: 700;
      }

      .codex-editorial-brief-card dd {
        margin: 0;
      }

      .codex-editorial-table-wrap {
        overflow-x: auto;
        border: 1px solid var(--codex-border);
        border-radius: 14px;
        background: #fff;
        -webkit-overflow-scrolling: touch;
      }

      /* Scroll fade hint on small screens */
      @media (max-width: 767px) {
        .codex-editorial-table-wrap {
          background:
            linear-gradient(to right, #fff 85%, rgba(255, 255, 255, 0)) 100% 0 / 3rem 100% no-repeat,
            #fff;
        }
      }

      .codex-editorial-table {
        width: 100%;
        border-collapse: collapse;
      }

      .codex-editorial-table th,
      .codex-editorial-table td {
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--codex-border-light);
        text-align: left;
        vertical-align: top;
        font-size: 0.92rem;
        line-height: 1.5;
        overflow-wrap: break-word;
        word-break: break-word;
      }

      .codex-editorial-table thead th {
        background: var(--codex-dark);
        color: #fff;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .codex-editorial-table thead th:first-child {
        border-radius: 13px 0 0 0;
      }

      .codex-editorial-table thead th:last-child {
        border-radius: 0 13px 0 0;
      }

      .codex-editorial-table tbody tr:nth-child(even) {
        background: rgba(248, 246, 241, 0.5);
      }

      .codex-editorial-table tbody tr:last-child th,
      .codex-editorial-table tbody tr:last-child td {
        border-bottom: 0;
      }

      .codex-editorial-table tbody th {
        font-weight: 700;
        color: var(--codex-text);
      }

      .codex-editorial-faq details {
        border-bottom: 1px solid var(--codex-border-light);
        padding-bottom: 0.75rem;
      }

      .codex-editorial-faq details + details {
        margin-top: 0.75rem;
      }

      .codex-editorial-faq details:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .codex-editorial-faq summary {
        cursor: pointer;
        color: var(--codex-text);
        font-weight: 700;
        padding: 0.5rem 0;
        min-height: 2.75rem;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 0.65rem;
      }

      .codex-editorial-faq summary::before {
        content: "+";
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.6rem;
        height: 1.6rem;
        flex-shrink: 0;
        border-radius: 50%;

            for (var i = sections.length - 1; i >= 0; i--) {
              if (sections[i].el.offsetTop <= scrollY) { current = sections[i]; break; }
            }
            if (current === active) return;
            if (active) active.link.classList.remove('is-active');
            if (current) current.link.classList.add('is-active');
            active = current;
          }
          window.addEventListener('scroll', function() {
            if (!ticking) { ticking = true; requestAnimationFrame(function() { update(); ticking = false; }); }
          }, { passive: true });
          update();
        }
      }

      /* Scroll-triggered reveal: IntersectionObserver for section fade-in */
      var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var revealTargets = document.querySelectorAll(
        '.codex-editorial-section, .codex-editorial-card, .codex-editorial-action-bar, .codex-editorial-jump-nav'
      );

      if (revealTargets.length && !prefersReducedMotion) {
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        }, {
          threshold: 0.08,
          rootMargin: '0px 0px -40px 0px'
        });

        revealTargets.forEach(function(el) { observer.observe(el); });
      } else {
        /* Reduced motion or no targets: show everything immediately */
        revealTargets.forEach(function(el) { el.classList.add('is-visible'); });
      }

      /* WhatsApp FAB: show after scrolling 300px */
      var waFab = document.querySelector('.codex-wa-fab');
      if (waFab) {
        var waShown = false;
        function checkWaScroll() {
          if (window.scrollY > 300 && !waShown) {
            waFab.classList.add('is-visible');
            waShown = true;
            window.removeEventListener('scroll', checkWaScroll);
          }
        }
        window.addEventListener('scroll', checkWaScroll, { passive: true });
        checkWaScroll();
      }

      /* Sticky CTA bar: show after 3s delay, hide when action-bar is visible */
      var stickyCta = document.querySelector('.codex-sticky-cta');
      if (stickyCta) {
        var stickyDismissed = false;
        setTimeout(function() {
          if (!stickyDismissed) stickyCta.classList.add('is-visible');
        }, 3000);

        var dismissBtn = stickyCta.querySelector('.codex-sticky-cta__dismiss');
        if (dismissBtn) {
          dismissBtn.addEventListener('click', function() {
            stickyDismissed = true;
            stickyCta.classList.remove('is-visible');
          });
        }

        /* Hide sticky bar when action-bar or conversion shell is in view */
        var actionBar = document.querySelector('.codex-editorial-action-bar, .codex-conversion-shell');
        if (actionBar) {
          var stickyObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
              if (entry.isIntersecting) {
                stickyCta.classList.remove('is-visible');
              } else if (!stickyDismissed) {
                stickyCta.classList.add('is-visible');
              }
            });
          }, { threshold: 0.1 });
          stickyObserver.observe(actionBar);
        }
      }
    })();
