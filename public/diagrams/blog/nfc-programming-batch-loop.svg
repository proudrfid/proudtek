<text x="84" y="234" font-size="12.5" fill="#4f4f4f">0001, /a1</text>
<text x="84" y="258" font-size="12.5" fill="#4f4f4f">0002, /a2</text>
<text x="84" y="282" font-size="12.5" fill="#4f4f4f">0003, /a3</text>
<text x="84" y="306" font-size="12.5" fill="#4f4f4f">0004, /a4</text>
<text x="84" y="330" font-size="12.5" fill="#4f4f4f">0005, /a5</text>
<text x="84" y="362" font-size="12" fill="#5c5c5c">… thousands more,</text>
<text x="84" y="382" font-size="12" fill="#5c5c5c">one row per tag</text>

<line x1="252" y1="285" x2="288" y2="285" stroke="#c39a5f" stroke-width="3"/>
<path d="M 288 285 l -11 -6 v 12 z" fill="#c39a5f"/>

<rect x="296" y="170" width="200" height="230" rx="12" fill="#2c5454"/>
<text x="396" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#eef5f5">encode_loop.py</text>
