<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five certification families for export-grade RFID factories</title>
<desc id="d">Five cards, one per certification family. ISO 9001 quality management — documented processes, audited annually — demanded by every B2B buyer. ISO 14001 environmental management — environmental impact management, documented — for EU export and ESG buyers. BSCI / SA8000 social compliance — labor practices, hours and wage compliance — the price of admission for Walmart, Carrefour and IKEA. RoHS / REACH substance restriction — restricted substances kept out of materials — mandatory for EU electronics. ISO 27001 information security — for encoded PII and proprietary identifiers — critical for encoding services. A footnote says different export markets demand different combinations, so verify the certs your customers will ask for.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE CORE CERTIFICATION STACK · WHAT SERIOUS BUYERS CHECK</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">The five families a serious buyer checks</text>

<!-- card 1: ISO 9001 / quality / teal -->
<rect x="64" y="140" width="205" height="330" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<circle cx="166.5" cy="212" r="36" fill="#3d6b6b"/>
<rect x="162.5" y="181" width="8" height="10" rx="2" fill="#ffffff"/>
<rect x="162.5" y="233" width="8" height="10" rx="2" fill="#ffffff"/>
<rect x="135.5" y="208" width="10" height="8" rx="2" fill="#ffffff"/>
<rect x="187.5" y="208" width="10" height="8" rx="2" fill="#ffffff"/>
<circle cx="166.5" cy="212" r="17" fill="#ffffff"/>
<circle cx="166.5" cy="212" r="8" fill="#3d6b6b"/>
<text x="166.5" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">ISO 9001</text>
<text x="166.5" y="314" text-anchor="middle" font-size="14" fill="#4f4f4f">Quality</text>
<text x="166.5" y="342" text-anchor="middle" font-size="12.5" fill="#5c5c5c">quality processes,</text>
<text x="166.5" y="360" text-anchor="middle" font-size="12.5" fill="#5c5c5c">audited annually</text>
<rect x="69" y="396" width="195" height="30" rx="15" fill="#ffffff" stroke="#cfe0e0"/>
<text x="166.5" y="416" text-anchor="middle" font-size="12.5" fill="#2c5454">every B2B buyer</text>

<!-- card 2: ISO 14001 / environment / forest -->
<rect x="281" y="140" width="205" height="330" rx="16" fill="#eaf4ee" stroke="#c4ddce" stroke-width="1.5"/>
<circle cx="383.5" cy="212" r="36" fill="#2d6a4f"/>
<path d="M 369.5 226 C 369.5 200, 389.5 192, 403.5 193 C 403.5 218, 383.5 228, 369.5 226 Z" fill="#ffffff"/>
<path d="M 375.5 222 C 383.5 212, 391.5 202, 398.5 196" fill="none" stroke="#2d6a4f" stroke-width="2.2" stroke-linecap="round"/>
<text x="383.5" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">ISO 14001</text>
<text x="383.5" y="314" text-anchor="middle" font-size="14" fill="#4f4f4f">Environment</text>
<text x="383.5" y="342" text-anchor="middle" font-size="12.5" fill="#5c5c5c">environmental impact</text>
<text x="383.5" y="360" text-anchor="middle" font-size="12.5" fill="#5c5c5c">management, documented</text>
<rect x="286" y="396" width="195" height="30" rx="15" fill="#ffffff" stroke="#c4ddce"/>
<text x="383.5" y="416" text-anchor="middle" font-size="12.5" fill="#1f6f3a">EU export · ESG buyers</text>

<!-- card 3: BSCI / labor / gold -->
<rect x="498" y="140" width="205" height="330" rx="16" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<circle cx="600.5" cy="212" r="36" fill="#c39a5f"/>
<circle cx="589.5" cy="203" r="8" fill="#ffffff"/>
<path d="M 577.5 228 c 0 -9 5.5 -14 12 -14 s 12 5 12 14 z" fill="#ffffff"/>
<circle cx="612.5" cy="201" r="6.5" fill="#ffffff"/>
<path d="M 602.5 227 c 0 -7.5 4.5 -11.5 10 -11.5 s 10 4 10 11.5 z" fill="#ffffff"/>
<text x="600.5" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">BSCI / SA8000</text>
<text x="600.5" y="314" text-anchor="middle" font-size="14" fill="#4f4f4f">Labor</text>
<text x="600.5" y="342" text-anchor="middle" font-size="12.5" fill="#5c5c5c">labor practices,</text>
<text x="600.5" y="360" text-anchor="middle" font-size="12.5" fill="#5c5c5c">hours · wage compliance</text>
<rect x="503" y="396" width="195" height="30" rx="15" fill="#ffffff" stroke="#e4c98f"/>
<text x="600.5" y="416" text-anchor="middle" font-size="12.5" fill="#6d5a3a">Walmart · Carrefour · IKEA</text>

<!-- card 4: RoHS REACH / materials / steel -->
<rect x="715" y="140" width="205" height="330" rx="16" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.5"/>
<circle cx="817.5" cy="212" r="36" fill="#4a5568"/>
<path d="M 812.5 194 h 10 v 12 l 13 21 a 4 4 0 0 1 -3.5 6 h -29 a 4 4 0 0 1 -3.5 -6 l 13 -21 z" fill="#ffffff"/>
<circle cx="817.5" cy="222" r="3" fill="#4a5568"/>
<circle cx="823" cy="215" r="2.2" fill="#4a5568"/>
<text x="817.5" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">RoHS / REACH</text>
<text x="817.5" y="314" text-anchor="middle" font-size="14" fill="#4f4f4f">Materials</text>
<text x="817.5" y="342" text-anchor="middle" font-size="12.5" fill="#5c5c5c">restricted substances</text>
<text x="817.5" y="360" text-anchor="middle" font-size="12.5" fill="#5c5c5c">kept out of materials</text>
<rect x="720" y="396" width="195" height="30" rx="15" fill="#ffffff" stroke="#d3dae3"/>
<text x="817.5" y="416" text-anchor="middle" font-size="12.5" fill="#4a5568">EU electronics · mandatory</text>

<!-- card 5: ISO 27001 / security / teal dark -->
<rect x="932" y="140" width="205" height="330" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<circle cx="1034.5" cy="212" r="36" fill="#2c5454"/>
<path d="M 1034.5 192 l 17 7 v 11 c 0 12 -8 18 -17 22 c -9 -4 -17 -10 -17 -22 v -11 z" fill="#ffffff"/>
<path d="M 1027.5 212 l 5 6 l 10 -12" fill="none" stroke="#2c5454" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1034.5" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">ISO 27001</text>
<text x="1034.5" y="314" text-anchor="middle" font-size="14" fill="#4f4f4f">Security</text>
<text x="1034.5" y="342" text-anchor="middle" font-size="12.5" fill="#5c5c5c">for encoded PII &amp;</text>
<text x="1034.5" y="360" text-anchor="middle" font-size="12.5" fill="#5c5c5c">proprietary identifiers</text>
<rect x="937" y="396" width="195" height="30" rx="15" fill="#ffffff" stroke="#cfe0e0"/>
<text x="1034.5" y="416" text-anchor="middle" font-size="12.5" fill="#2c5454">encoding services · PII</text>

<text x="600" y="540" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Different export markets demand different combinations — verify the certs your customers will ask for,</text>
<text x="600" y="566" text-anchor="middle" font-size="13.5" fill="#5c5c5c">not the ones that happen to look prettiest in the PDF</text>
</svg>
