<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Year-one results of the apparel source-tagging programme versus the pre-RFID baseline</title>
  <desc id="d">Year-one measured results against the pre-RFID baseline. Store inventory accuracy rose from 67% under pre-RFID visual cycle counts to 98% under weekly MC9300 handheld scans. Four downstream outcomes: size-level out-of-stock at full-price SKUs fell 26%, shrink from theft and admin error fell 22% year on year at the chain level, markdowns from mis-priced inventory fell 18%, and online orders fulfilled from store stock rose 14%. The programme covers 11 M units per year across 340 stores; the size-level out-of-stock cut is the operations team's primary KPI.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">YEAR-ONE RESULTS — MEASURED AGAINST THE PRE-RFID BASELINE</text>
  <text x="600" y="80" text-anchor="middle" font-size="15" fill="#5c5c5c">Inventory accuracy is the lever; stockouts, shrink and markdowns are what it moves</text>

  <text x="60" y="126" font-size="15" font-weight="800" fill="#291c0e">Store inventory accuracy</text>

  <!-- row 1: pre-RFID 67% -->
  <text x="60" y="170" font-size="14" font-weight="700" fill="#291c0e">Pre-RFID visual counts</text>
  <text x="60" y="190" font-size="12" fill="#8a8a8a">cycle counts by eye</text>
  <rect x="300" y="148" width="760" height="46" rx="8" fill="#f1f0ea"/>
  <rect x="300" y="148" width="509" height="46" rx="8" fill="#9aa4b2"/>
  <text x="825" y="177" font-size="16" font-weight="800" fill="#4a5568">67%</text>

  <!-- row 2: RFID 98% -->
  <text x="60" y="238" font-size="14" font-weight="700" fill="#291c0e">Weekly handheld scans</text>
  <text x="60" y="258" font-size="12" fill="#8a8a8a">MC9300, every 7 days</text>
  <rect x="300" y="216" width="760" height="46" rx="8" fill="#f1f0ea"/>
  <rect x="300" y="216" width="745" height="46" rx="8" fill="#3d6b6b"/>
  <text x="1029" y="245" text-anchor="end" font-size="16" font-weight="800" fill="#ffffff">98%</text>

  <!-- delta chips -->
  <rect x="76" y="312" width="250" height="112" rx="12" fill="#ffffff" stroke="#d9e2e2" stroke-width="2"/>
  <rect x="342" y="312" width="250" height="112" rx="12" fill="#ffffff" stroke="#d9e2e2" stroke-width="2"/>
  <rect x="608" y="312" width="250" height="112" rx="12" fill="#ffffff" stroke="#d9e2e2" stroke-width="2"/>
  <rect x="874" y="312" width="250" height="112" rx="12" fill="#ffffff" stroke="#d9e2e2" stroke-width="2"/>

  <text x="201" y="366" text-anchor="middle" font-size="30" font-weight="800" fill="#2d6a4f">-26%</text>
  <text x="201" y="392" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Size-level out-of-stock</text>
  <text x="201" y="411" text-anchor="middle" font-size="12.5" fill="#5c5c5c">at full-price SKUs</text>

  <text x="467" y="366" text-anchor="middle" font-size="30" font-weight="800" fill="#2d6a4f">-22%</text>
  <text x="467" y="392" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Shrink — theft + admin</text>
  <text x="467" y="411" text-anchor="middle" font-size="12.5" fill="#5c5c5c">YoY, chain level</text>

  <text x="733" y="366" text-anchor="middle" font-size="30" font-weight="800" fill="#2d6a4f">-18%</text>
  <text x="733" y="392" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Markdowns from</text>
  <text x="733" y="411" text-anchor="middle" font-size="12.5" fill="#5c5c5c">mis-priced inventory</text>

  <text x="999" y="366" text-anchor="middle" font-size="30" font-weight="800" fill="#3d6b6b">+14%</text>
  <text x="999" y="392" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Online orders fulfilled</text>
  <text x="999" y="411" text-anchor="middle" font-size="12.5" fill="#5c5c5c">from store stock</text>

  <!-- footer -->
  <rect x="60" y="454" width="1080" height="150" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="494" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">A trustworthy count is the replenishment engine's fuel</text>
  <text x="600" y="526" text-anchor="middle" font-size="13.5" fill="#3d6b6b">Accuracy rose from 67% to 98% across 11 M units / year and 340 stores; the size-level out-of-stock</text>
  <text x="600" y="550" text-anchor="middle" font-size="13.5" fill="#3d6b6b">cut of -26% is the operations team's primary KPI, and endless-aisle fulfilment rose +14% on top.</text>
  <text x="600" y="580" text-anchor="middle" font-size="12.5" fill="#6d5a3a">Figures are the customer's own year-one measured values versus the pre-RFID baseline</text>
</svg>
