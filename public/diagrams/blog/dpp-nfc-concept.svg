<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A Digital Product Passport keeps the identifier on the product and the data in the cloud</title>
<desc id="d">Left panel, on the product: the item carries only a unique identifier via NFC, QR or RFID, not the data itself. An arrow labelled unique identifier points to the right panel, in the cloud: the Digital Product Passport record holding material composition, manufacturing origin and footprint, repair, care and durability, and recycling and end-of-life. A bottom row shows four first-wave regulated categories, each with its own delegated act: batteries from February 2027, textiles 2027 to 2028, electronics 2028 to 2029, and construction under the revised CPR.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT A DIGITAL PRODUCT PASSPORT IS</text>
<text x="600" y="104" text-anchor="middle" font-size="33" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">The ID rides on the product; the data lives in the cloud</text>

<rect x="64" y="172" width="436" height="250" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="88" y="206" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">ON THE PRODUCT</text>
<rect x="104" y="236" width="150" height="130" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="146" y="292" width="66" height="42" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="179" y="319" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">ID</text>
<text x="288" y="270" font-size="15.5" fill="#291c0e">Carries only a</text>
<text x="288" y="292" font-size="15.5" font-weight="700" fill="#291c0e">unique identifier</text>
<text x="288" y="314" font-size="15.5" fill="#291c0e">— not the data.</text>
<text x="282" y="398" text-anchor="middle" font-size="14.5" fill="#3d6b6b">via NFC · QR · RFID</text>

<line x1="506" y1="298" x2="694" y2="298" stroke="#b9a68e" stroke-width="3"/>
<polygon points="694,291 708,298 694,305" fill="#b9a68e"/>
<text x="600" y="286" text-anchor="middle" font-size="13" fill="#6d5a3a">unique identifier</text>
<text x="600" y="324" text-anchor="middle" font-size="13" fill="#6d5a3a">resolves to →</text>

<rect x="700" y="172" width="436" height="250" rx="16" fill="#edf3ee" stroke="#cfe0d6" stroke-width="1.6"/>
<text x="724" y="206" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2d6a4f">IN THE CLOUD</text>
<text x="724" y="232" font-size="15.5" font-weight="700" fill="#291c0e">Digital Product Passport record</text>
<circle cx="738" cy="269" r="7" fill="#2d6a4f"/><text x="758" y="274" font-size="14.5" fill="#291c0e">Material composition</text>
<circle cx="738" cy="301" r="7" fill="#2d6a4f"/><text x="758" y="306" font-size="14.5" fill="#291c0e">Manufacturing origin &amp; footprint</text>
<circle cx="738" cy="333" r="7" fill="#2d6a4f"/><text x="758" y="338" font-size="14.5" fill="#291c0e">Repair, care &amp; durability</text>
<circle cx="738" cy="365" r="7" fill="#2d6a4f"/><text x="758" y="370" font-size="14.5" fill="#291c0e">Recycling &amp; end-of-life</text>
<text x="918" y="404" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Hosted, updateable, persistent for the product's life</text>

<text x="600" y="466" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">IN SCOPE — EACH CATEGORY GETS ITS OWN DELEGATED ACT</text>
<rect x="70" y="490" width="250" height="66" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="195" y="522" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Batteries</text>
<text x="195" y="544" text-anchor="middle" font-size="13" fill="#3d6b6b">from Feb 2027</text>
<rect x="340" y="490" width="250" height="66" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="465" y="522" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Textiles</text>
<text x="465" y="544" text-anchor="middle" font-size="13" fill="#3d6b6b">2027–2028</text>
<rect x="610" y="490" width="250" height="66" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="735" y="522" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Electronics</text>
<text x="735" y="544" text-anchor="middle" font-size="13" fill="#3d6b6b">2028–2029</text>
<rect x="880" y="490" width="250" height="66" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="1005" y="522" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Construction</text>
<text x="1005" y="544" text-anchor="middle" font-size="13" fill="#3d6b6b">revised CPR</text>
</svg>
