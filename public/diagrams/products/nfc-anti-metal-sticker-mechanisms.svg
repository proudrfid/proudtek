<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Two ways to read NFC on metal — ferrite layer vs foam spacer</title>
  <desc id="d">Left: a ferrite shielding layer, magnetically permeable and electrically resistive, lets the antenna field pass while blocking eddy currents in the metal. Right: a closed-cell foam interlayer creates an air gap that reduces eddy-current coupling by distance. Slim 1.2 mm ferrite profile available for space-constrained panels.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Metal eats NFC fields — two ways to feed it anyway</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Standard stickers die on steel; these two constructions do not</text>
  <g transform="translate(70,150)" font-family="Helvetica, Arial, sans-serif" font-size="13">
    <rect x="0" y="0" width="500" height="270" rx="14" fill="#ffffff" stroke="#2c5454" stroke-width="2.5"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="17" fill="#2c5454">Ferrite layer — the field router</text>
    <rect x="24" y="60" width="452" height="30" rx="5" fill="#fdf3e3" stroke="#c39a5f"/><text x="38" y="80" fill="#6d5a3a">printable PET face</text>
    <rect x="24" y="96" width="452" height="30" rx="5" fill="#eef2f0" stroke="#3d6b6b"/><text x="38" y="116" fill="#2c5454">antenna + NTAG chip</text>
    <rect x="24" y="132" width="452" height="30" rx="5" fill="#2c5454"/><text x="38" y="152" fill="#f8f6f1">ferrite: magnetically permeable, electrically resistive</text>
    <rect x="24" y="168" width="452" height="30" rx="5" fill="#d8cdb8"/><text x="38" y="188" fill="#291c0e">metal asset surface</text>
    <text x="24" y="226" fill="#2c5454">field passes, eddy currents blocked</text>
    <text x="24" y="250" fill="#6d5a3a">slim 1.2 mm variant for door / panel clearances</text>
    <rect x="550" y="0" width="500" height="270" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="574" y="40" font-family="Georgia, serif" font-size="17" fill="#2c5454">Foam spacer — the air gap</text>
    <rect x="574" y="60" width="452" height="30" rx="5" fill="#fdf3e3" stroke="#c39a5f"/><text x="588" y="80" fill="#6d5a3a">printable PET face</text>
    <rect x="574" y="96" width="452" height="30" rx="5" fill="#eef2f0" stroke="#3d6b6b"/><text x="588" y="116" fill="#2c5454">antenna + NTAG chip</text>
    <rect x="574" y="132" width="452" height="44" rx="5" fill="#ffffff" stroke="#3d6b6b" stroke-dasharray="6 4"/><text x="588" y="158" fill="#2c5454">closed-cell foam air gap</text>
    <rect x="574" y="182" width="452" height="30" rx="5" fill="#d8cdb8"/><text x="588" y="202" fill="#291c0e">metal asset surface</text>
    <text x="574" y="240" fill="#2c5454">coupling reduced by distance</text>
    <text x="574" y="262" fill="#6d5a3a">thicker build, gentler unit cost</text>
  </g>
  <g transform="translate(70,460)">
    <rect x="0" y="0" width="1050" height="100" rx="12" fill="#eef2f0" stroke="#2c5454" stroke-width="2"/>
    <text x="24" y="38" font-family="Georgia, serif" font-size="17" fill="#2c5454">Chip choice rides on top</text>
    <text x="24" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">NTAG213 (144 B) for ID + URL duty · NTAG216 (888 B) for on-tag asset records · NTAG 424 DNA for cryptographic custody</text>
  </g>
</svg>
