<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hotel card artwork sign-off workflow across four stakeholders</title>
<desc id="d">A linear four-stage sign-off. One, brand lock by marketing and creative, approving concept, colour, finish and substrate, timeboxed to five business days. Two, operations review by front desk and housekeeping, covering numbering and variants, re-issue in under 30 seconds, and thickness and encoder fit, which overrides brand friction. Three, compliance sign-off by legal and sustainability on certificate numbers, trademark marks and jurisdiction text, reviewing the final composite. Four, the supplier proof reviewed by all approvers together in one scheduled meeting, signed with name, date and version. A warning notes that non-linear sign-off, where each stage reopens the last, is what stretches a two-week proof into two months.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ARTWORK SIGN-OFF — KEEP IT LINEAR</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Brand, operations, compliance, then a joint proof — in that order.</text>

<!-- card 1 brand -->
<rect x="64" y="120" width="252" height="300" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="64" y="120" width="252" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="98" cy="162" r="16" fill="#3d6b6b"/><text x="98" y="167" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="126" y="160" font-size="15.5" font-weight="800" fill="#291c0e">Brand lock</text>
<text x="126" y="178" font-size="12" fill="#6b6b6b">marketing / creative</text>
<circle cx="90" cy="216" r="3" fill="#3d6b6b"/><text x="104" y="221" font-size="12.5" fill="#3a2f20">Concept &amp; colour</text>
<circle cx="90" cy="246" r="3" fill="#3d6b6b"/><text x="104" y="251" font-size="12.5" fill="#3a2f20">Finish &amp; substrate</text>
<circle cx="90" cy="276" r="3" fill="#3d6b6b"/><text x="104" y="281" font-size="12.5" fill="#3a2f20">Typographic treatment</text>
<rect x="84" y="360" width="212" height="34" rx="17" fill="#eef5f5" stroke="#8fb6b6" stroke-width="1.4"/>
<text x="190" y="382" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">timebox: 5 business days</text>

<!-- card 2 ops -->
<rect x="340" y="120" width="252" height="300" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="340" y="120" width="252" height="8" rx="4" fill="#4a5568"/>
<circle cx="374" cy="162" r="16" fill="#4a5568"/><text x="374" y="167" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="402" y="160" font-size="15.5" font-weight="800" fill="#291c0e">Operations</text>
<text x="402" y="178" font-size="12" fill="#6b6b6b">front desk / housekeeping</text>
<circle cx="366" cy="216" r="3" fill="#4a5568"/><text x="380" y="221" font-size="12.5" fill="#3a2f20">Numbering &amp; variants</text>
<circle cx="366" cy="246" r="3" fill="#4a5568"/><text x="380" y="251" font-size="12.5" fill="#3a2f20">Re-issue in &lt; 30 s</text>
<circle cx="366" cy="276" r="3" fill="#4a5568"/><text x="380" y="281" font-size="12.5" fill="#3a2f20">Thickness / encoder fit</text>
<rect x="360" y="360" width="212" height="34" rx="17" fill="#eef0f4" stroke="#a7afbb" stroke-width="1.4"/>
<text x="466" y="382" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4454">overrides brand friction</text>

<!-- card 3 compliance -->
<rect x="616" y="120" width="252" height="300" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="616" y="120" width="252" height="8" rx="4" fill="#2d6a4f"/>
<circle cx="650" cy="162" r="16" fill="#2d6a4f"/><text x="650" y="167" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
<text x="678" y="160" font-size="15.5" font-weight="800" fill="#291c0e">Compliance</text>
<text x="678" y="178" font-size="12" fill="#6b6b6b">legal / sustainability</text>
<circle cx="642" cy="216" r="3" fill="#2d6a4f"/><text x="656" y="221" font-size="12.5" fill="#3a2f20">Certificate numbers</text>
<circle cx="642" cy="246" r="3" fill="#2d6a4f"/><text x="656" y="251" font-size="12.5" fill="#3a2f20">® / ™ trademark marks</text>
<circle cx="642" cy="276" r="3" fill="#2d6a4f"/><text x="656" y="281" font-size="12.5" fill="#3a2f20">Jurisdiction text</text>
<rect x="636" y="360" width="212" height="34" rx="17" fill="#e9f2ec" stroke="#94bfa5" stroke-width="1.4"/>
<text x="742" y="382" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b4332">reviews final composite</text>

<!-- card 4 supplier proof -->
<rect x="892" y="120" width="244" height="300" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
<rect x="892" y="120" width="244" height="8" rx="4" fill="#c39a5f"/>
<circle cx="926" cy="162" r="16" fill="#c39a5f"/><text x="926" y="167" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
<text x="954" y="160" font-size="15.5" font-weight="800" fill="#291c0e">Supplier proof</text>
<text x="954" y="178" font-size="12" fill="#8a6a2f">all approvers, together</text>
<circle cx="918" cy="216" r="3" fill="#c39a5f"/><text x="932" y="221" font-size="12.5" fill="#3a2f20">Physical composite</text>
<circle cx="918" cy="246" r="3" fill="#c39a5f"/><text x="932" y="251" font-size="12.5" fill="#3a2f20">One scheduled meeting</text>
<circle cx="918" cy="276" r="3" fill="#c39a5f"/><text x="932" y="281" font-size="12.5" fill="#3a2f20">Sign: name + date + version</text>
<rect x="912" y="360" width="212" height="34" rx="17" fill="#ffffff" stroke="#e4c98f" stroke-width="1.4"/>
<text x="1018" y="382" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a6a2f">not sequential desk reviews</text>

<!-- arrows -->
<polygon points="320,265 336,272 320,279" fill="#9aa3ad"/>
<polygon points="596,265 612,272 596,279" fill="#9aa3ad"/>
<polygon points="872,265 888,272 872,279" fill="#9aa3ad"/>

<!-- warning -->
<rect x="64" y="452" width="1072" height="62" rx="12" fill="#fbf3f3" stroke="#e6c9c9" stroke-width="1.8"/>
<circle cx="104" cy="483" r="13" fill="#8b2d2d"/><path d="M 99 478 l 10 10 M 109 478 l -10 10" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
<text x="130" y="479" font-size="14" font-weight="800" fill="#291c0e">Non-linear sign-off — each stage reopening the last —</text>
<text x="130" y="500" font-size="13.5" fill="#7a2323">is the single most common reason a two-week proof stretches into two months.</text>

<text x="600" y="548" text-anchor="middle" font-size="14" fill="#4f4f4f">Each stakeholder reviews against a pre-agreed scope; the sponsor decides any hold-up within 48 hours.</text>
</svg>
