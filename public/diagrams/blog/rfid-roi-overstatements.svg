<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five RFID ROI overstatements and their conservative corrections</title>
<desc id="d">A two-column table pairing an overstated claim, in red on the left, with the conservative fix, in green on the right. One, re-deploying 100 percent of freed labor becomes: bank only 50 to 70 percent and halve the labor line. Two, a full read rate on day one becomes: about 90 percent at go-live rising to 99.5 percent or better by week 4 to 8. Three, assuming tags never fail becomes: 2 to 5 percent per year breakage as year-2 operating cost. Four, top-of-range sales lift everywhere becomes: use the 2 to 3 percent lower bound on applicable SKUs only. Five, treating ghost-asset cleanup as recurring becomes: 15 to 30 percent is one-time, so model the steady state separately.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE ROI OVERSTATEMENTS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">What finance strikes out — and the conservative number to use instead.</text>

<text x="315" y="132" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">OVERSTATED</text>
<text x="860" y="132" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">CONSERVATIVE FIX</text>

<!-- row 1 -->
<rect x="80" y="150" width="470" height="54" rx="10" fill="#fbf1f1" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="100" y="183" font-size="14.5" fill="#7a2a2a">Re-deploy 100% of freed labor</text>
<text x="575" y="184" text-anchor="middle" font-size="20" fill="#6d5a3a">&#8594;</text>
<rect x="600" y="150" width="520" height="54" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="620" y="183" font-size="14.5" font-weight="700" fill="#1f5c37">Bank 50-70%; halve the labor line</text>

<!-- row 2 -->
<rect x="80" y="216" width="470" height="54" rx="10" fill="#fbf1f1" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="100" y="249" font-size="14.5" fill="#7a2a2a">Full read rate on day one</text>
<text x="575" y="250" text-anchor="middle" font-size="20" fill="#6d5a3a">&#8594;</text>
<rect x="600" y="216" width="520" height="54" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="620" y="249" font-size="14.5" font-weight="700" fill="#1f5c37">~90% go-live, 99.5%+ by week 4-8</text>

<!-- row 3 -->
<rect x="80" y="282" width="470" height="54" rx="10" fill="#fbf1f1" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="100" y="315" font-size="14.5" fill="#7a2a2a">Tags never fail</text>
<text x="575" y="316" text-anchor="middle" font-size="20" fill="#6d5a3a">&#8594;</text>
<rect x="600" y="282" width="520" height="54" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="620" y="315" font-size="14.5" font-weight="700" fill="#1f5c37">2-5%/yr breakage &#8594; year-2 opex</text>

<!-- row 4 -->
<rect x="80" y="348" width="470" height="54" rx="10" fill="#fbf1f1" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="100" y="381" font-size="14.5" fill="#7a2a2a">Top-of-range sales lift everywhere</text>
<text x="575" y="382" text-anchor="middle" font-size="20" fill="#6d5a3a">&#8594;</text>
<rect x="600" y="348" width="520" height="54" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="620" y="381" font-size="14.5" font-weight="700" fill="#1f5c37">Use 2-3% lower bound, applicable SKUs</text>

<!-- row 5 -->
<rect x="80" y="414" width="470" height="54" rx="10" fill="#fbf1f1" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="100" y="447" font-size="14.5" fill="#7a2a2a">Ghost-asset cleanup repeats yearly</text>
<text x="575" y="448" text-anchor="middle" font-size="20" fill="#6d5a3a">&#8594;</text>
<rect x="600" y="414" width="520" height="54" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="620" y="447" font-size="14.5" font-weight="700" fill="#1f5c37">15-30% is one-time; model steady-state</text>

<text x="600" y="515" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Halve the best case; the version that still pays back is the credible one.</text>
</svg>
