<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID tag price per unit falls as annual volume rises — the five volume tiers</title>
<desc id="d">Bar chart of apparel RFID tag pricing by annual volume tier. Under 100K tags a year, pilot territory, tags run $0.10-0.18 each. At 100K-500K — the tier every published average secretly assumes — $0.07-0.10. At 500K-2M, where blanket orders start, $0.05-0.08. At 2M-10M, direct-from-converter pricing, $0.04-0.06. Above 10M, strategic-account pricing, $0.035-0.05. Range bars step downward left to right and a dotted midpoint trend line traces the fall — cheaper per tag as volume climbs.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TAG PRICE VS ANNUAL VOLUME</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Buy more, hurt less — the volume curve</text>

<!-- gridlines -->
<line x1="150" y1="220" x2="1110" y2="220" stroke="#eee6d6" stroke-width="1"/>
<text x="130" y="224" text-anchor="end" font-size="12.5" fill="#5c5c5c">$0.15</text>
<line x1="150" y1="320" x2="1110" y2="320" stroke="#eee6d6" stroke-width="1"/>
<text x="130" y="324" text-anchor="end" font-size="12.5" fill="#5c5c5c">$0.10</text>
<line x1="150" y1="420" x2="1110" y2="420" stroke="#eee6d6" stroke-width="1"/>
<text x="130" y="424" text-anchor="end" font-size="12.5" fill="#5c5c5c">$0.05</text>
<line x1="150" y1="520" x2="1110" y2="520" stroke="#d9cfbc" stroke-width="1.5"/>

<!-- range bars -->
<rect x="188" y="160" width="64" height="160" rx="8" fill="#2c5454"/>
<rect x="388" y="320" width="64" height="60" rx="8" fill="#3d6b6b"/>
<rect x="588" y="360" width="64" height="60" rx="8" fill="#5b8484"/>
<rect x="788" y="400" width="64" height="40" rx="8" fill="#7fa3a3"/>
<rect x="988" y="420" width="64" height="30" rx="8" fill="#9dbaba"/>

<!-- midpoint trend -->
<polyline points="220,240 420,350 620,390 820,420 1020,435" fill="none" stroke="#c39a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9"/>
<circle cx="220" cy="240" r="5" fill="#c39a5f"/>
<circle cx="420" cy="350" r="5" fill="#c39a5f"/>
<circle cx="620" cy="390" r="5" fill="#c39a5f"/>
<circle cx="820" cy="420" r="5" fill="#c39a5f"/>
<circle cx="1020" cy="435" r="5" fill="#c39a5f"/>
<text x="850" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#8a6b3c">cheaper per tag as volume climbs ↘</text>

<!-- value labels -->
<text x="220" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#234a4a">$0.10–0.18</text>
<text x="420" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#234a4a">$0.07–0.10</text>
<text x="620" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#234a4a">$0.05–0.08</text>
<text x="820" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#234a4a">$0.04–0.06</text>
<text x="1020" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#234a4a">$0.035–0.05</text>

<!-- x labels -->
<text x="220" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">&lt;100K / yr</text>
<text x="220" y="576" text-anchor="middle" font-size="12.5" fill="#5c5c5c">pilot territory</text>
<text x="420" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">100K–500K</text>
<text x="420" y="576" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the published “average”</text>
<text x="620" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">500K–2M</text>
<text x="620" y="576" text-anchor="middle" font-size="12.5" fill="#5c5c5c">blanket orders</text>
<text x="820" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">2M–10M</text>
<text x="820" y="576" text-anchor="middle" font-size="12.5" fill="#5c5c5c">direct from converter</text>
<text x="1020" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">10M+</text>
<text x="1020" y="576" text-anchor="middle" font-size="12.5" fill="#5c5c5c">strategic account</text>

<text x="600" y="618" text-anchor="middle" font-size="13" fill="#5c5c5c">annual tag volume →</text>
</svg>
