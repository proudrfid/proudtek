<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Per-tag RFID cost broken into five components</title>
<desc id="d">Horizontal range bars show the quoted minimum-to-maximum cost of each per-tag component in US dollars. Chip is the largest at 0.025 to 0.10 dollars. Antenna and inlay is 0.01 to 0.04. Lamination and finishing is 0.005 to 0.02. Encoding is 0.02 to 0.05. Packaging is 0.003 to 0.05. A note explains that 30 to 40 percent of the price is soft fees — encoding, packaging and amortized tooling — all negotiable.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT'S IN THE PER-TAG PRICE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Five components — and the chip is the one that moves with volume.</text>

<!-- gridlines -->
<line x1="320" y1="140" x2="320" y2="470" stroke="#efe9dc" stroke-width="1.4"/>
<line x1="497" y1="140" x2="497" y2="470" stroke="#f2ede2" stroke-width="1.2"/>
<line x1="674" y1="140" x2="674" y2="470" stroke="#f2ede2" stroke-width="1.2"/>
<line x1="851" y1="140" x2="851" y2="470" stroke="#f2ede2" stroke-width="1.2"/>
<line x1="1029" y1="140" x2="1029" y2="470" stroke="#f2ede2" stroke-width="1.2"/>

<!-- bars -->
<text x="292" y="175" text-anchor="end" font-size="14.5" font-weight="700" fill="#291c0e">Chip</text>
<rect x="497" y="151" width="532" height="38" rx="6" fill="#2c5454"/>
<text x="1041" y="175" font-size="13" font-weight="700" fill="#2c5454">$0.025–0.10</text>

<text x="292" y="237" text-anchor="end" font-size="14.5" font-weight="700" fill="#291c0e">Antenna + inlay</text>
<rect x="391" y="213" width="213" height="38" rx="6" fill="#4d8a8a"/>
<text x="616" y="237" font-size="13" font-weight="700" fill="#3d6b6b">$0.01–0.04</text>

<text x="292" y="299" text-anchor="end" font-size="14.5" font-weight="700" fill="#291c0e">Lamination</text>
<rect x="355" y="275" width="107" height="38" rx="6" fill="#4d8a8a"/>
<text x="474" y="299" font-size="13" font-weight="700" fill="#3d6b6b">$0.005–0.02</text>

<text x="292" y="361" text-anchor="end" font-size="14.5" font-weight="700" fill="#291c0e">Encoding</text>
<rect x="462" y="337" width="212" height="38" rx="6" fill="#4d8a8a"/>
<text x="686" y="361" font-size="13" font-weight="700" fill="#3d6b6b">$0.02–0.05</text>

<text x="292" y="423" text-anchor="end" font-size="14.5" font-weight="700" fill="#291c0e">Packaging</text>
<rect x="341" y="399" width="333" height="38" rx="6" fill="#4d8a8a"/>
<text x="686" y="423" font-size="13" font-weight="700" fill="#3d6b6b">$0.003–0.05</text>

<!-- axis -->
<line x1="320" y1="470" x2="1100" y2="470" stroke="#c7c0b0" stroke-width="1.8"/>
<text x="320" y="492" text-anchor="middle" font-size="12" fill="#6b6b6b">$0</text>
<text x="497" y="492" text-anchor="middle" font-size="12" fill="#6b6b6b">$0.025</text>
<text x="674" y="492" text-anchor="middle" font-size="12" fill="#6b6b6b">$0.05</text>
<text x="851" y="492" text-anchor="middle" font-size="12" fill="#6b6b6b">$0.075</text>
<text x="1029" y="492" text-anchor="middle" font-size="12" fill="#6b6b6b">$0.10</text>
<text x="710" y="516" text-anchor="middle" font-size="12.5" fill="#8a8a8a">per-tag cost, USD — bars span the quoted min–max</text>

<!-- soft fees callout -->
<rect x="300" y="536" width="800" height="54" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.8"/>
<text x="700" y="561" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8a6a2f">30-40% of the price is "soft" — encoding, packaging, amortized tooling.</text>
<text x="700" y="581" text-anchor="middle" font-size="13.5" fill="#6d5a3a">All negotiable — and the quote won't point them out for you.</text>
</svg>
