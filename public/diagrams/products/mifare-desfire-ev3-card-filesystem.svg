<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">DESFire EV3 file system — up to 28 applications, 32 files each, five file types</title>
  <desc id="d">Card as a filing cabinet: up to 28 independent applications, each holding up to 32 files of five types — Standard Data, Backup Data, Value, Linear Record, Cyclic Record — with per-application AES-128 keys, plus SDM/SUN tap URLs and Transaction MAC receipts.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Not sectors — a filing cabinet</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Up to 28 applications, each with up to 32 files — every drawer has its own AES-128 keys</text>
  <g transform="translate(60,130)">
    <rect x="0" y="0" width="620" height="380" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
    <text x="26" y="40" font-family="Georgia, serif" font-size="18" fill="#291c0e">One card</text>
    <rect x="26" y="58" width="180" height="120" rx="10" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2"/>
    <text x="40" y="84" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">App 1 — access</text>
    <text x="40" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d5a3a">own AES-128 keys</text>
    <text x="40" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d5a3a">up to 32 files</text>
    <rect x="220" y="58" width="180" height="120" rx="10" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2"/>
    <text x="234" y="84" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">App 2 — transit</text>
    <text x="234" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d5a3a">own AES-128 keys</text>
    <text x="234" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d5a3a">up to 32 files</text>
    <rect x="414" y="58" width="180" height="120" rx="10" fill="#fdf3e3" stroke="#c39a5f" stroke-width="2"/>
    <text x="428" y="84" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">… up to 28 apps</text>
    <text x="428" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d5a3a">cafeteria, closed-loop</text>
    <text x="428" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d5a3a">payment, campus ID …</text>
    <text x="26" y="216" font-family="Georgia, serif" font-size="16" fill="#291c0e">Five file types inside each app</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">
      <rect x="26" y="232" width="176" height="34" rx="6" fill="#ffffff" stroke="#3d6b6b"/><text x="38" y="254">Standard Data</text>
      <rect x="212" y="232" width="176" height="34" rx="6" fill="#ffffff" stroke="#3d6b6b"/><text x="224" y="254">Backup Data</text>
      <rect x="398" y="232" width="176" height="34" rx="6" fill="#ffffff" stroke="#3d6b6b"/><text x="410" y="254">Value</text>
      <rect x="26" y="276" width="176" height="34" rx="6" fill="#ffffff" stroke="#3d6b6b"/><text x="38" y="298">Linear Record</text>
      <rect x="212" y="276" width="176" height="34" rx="6" fill="#ffffff" stroke="#3d6b6b"/><text x="224" y="298">Cyclic Record</text>
    </g>
    <text x="26" y="348" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Key diversification per NXP AN10922 — master key never leaves the HSM</text>
  </g>
  <g transform="translate(720,130)">
    <rect x="0" y="0" width="400" height="180" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="38" font-family="Georgia, serif" font-size="18" fill="#2c5454">Every tap can carry a receipt</text>
    <text x="24" y="72" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">SDM: unique server-verifiable URL per tap</text>
    <text x="24" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">same SUN mechanism as NTAG 424 DNA</text>
    <text x="24" y="130" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Transaction MAC: cryptographic receipt on</text>
    <text x="24" y="154" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">every stored-value mutation — offline OK</text>
  </g>
  <g transform="translate(720,340)">
    <rect x="0" y="0" width="400" height="170" rx="12" fill="#fdf3e3" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="38" font-family="Georgia, serif" font-size="18" fill="#291c0e">Why procurement cares</text>
    <text x="24" y="72" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">One card, many independent issuers —</text>
    <text x="24" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">access + fare + canteen never share keys</text>
    <text x="24" y="130" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">EAL5+ certificate satisfies government and</text>
    <text x="24" y="152" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">defense procurement lines</text>
  </g>
</svg>
