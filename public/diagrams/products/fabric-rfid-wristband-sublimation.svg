<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Edge-to-edge sublimation — the band as sponsor real estate</title>
  <desc id="d">Dye-sublimation transfers full-bleed CMYK plus Pantone-spot artwork into the woven polyester itself, so the print survives the whole festival. The band face doubles as sponsor real estate worn for days, with chip pre-encoding to AXS, Ticketmaster, Eventbrite or Festicket.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Ink inside the weave, not on it</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Sublimation dyes the fibres — artwork survives sunscreen, sweat and seven days</text>
  <g transform="translate(70,160)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="20" width="640" height="90" rx="45" fill="#eef2f0" stroke="#2c5454" stroke-width="2.5"/>
    <g opacity="0.85">
      <circle cx="90" cy="65" r="24" fill="#c39a5f"/>
      <rect x="150" y="42" width="110" height="46" rx="8" fill="#3d6b6b"/>
      <circle cx="330" cy="65" r="28" fill="#8b2d2d" opacity="0.7"/>
      <rect x="400" y="46" width="150" height="38" rx="19" fill="#c39a5f" opacity="0.8"/>
    </g>
    <text x="0" y="150" font-size="13" fill="#6d5a3a">full-bleed CMYK + Pantone spot — edge to edge, no blank margins</text>
    <text x="0" y="196" font-size="14" fill="#2c5454">Sponsor logos live on wrists for 3-7 days — photographed, posted, kept</text>
    <text x="0" y="224" font-size="13" fill="#6d5a3a">typical attendees keep the band as a souvenir after the slider comes off</text>
  </g>
  <g transform="translate(760,150)">
    <rect x="0" y="0" width="370" height="290" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="17" fill="#291c0e">Wired to the box office</text>
    <text x="24" y="76" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">Chip pre-encoded to the ticketing platform:</text>
    <text x="24" y="102" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Eventbrite · AXS · Ticketmaster · Festicket</text>
    <line x1="24" y1="128" x2="346" y2="128" stroke="#d8cdb8" stroke-width="1.5"/>
    <text x="24" y="160" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">NTAG213 / NTAG216 · MIFARE Classic /</text>
    <text x="24" y="182" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Ultralight C for cashless tiers</text>
    <text x="24" y="216" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">Music festivals are the home turf —</text>
    <text x="24" y="238" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">multi-day, camping, premium builds</text>
    <text x="24" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">MOQ 200 · lead 15-20 business days</text>
  </g>
</svg>
