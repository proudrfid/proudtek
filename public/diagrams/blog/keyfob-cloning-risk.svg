<polygon points="325,338 318,326 332,326" fill="#8b2d2d"/>

<rect x="215" y="346" width="220" height="46" rx="10" fill="#f7eaea" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="325" y="374" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">$15 handheld duplicator</text>

<line x1="325" y1="398" x2="325" y2="418" stroke="#8b2d2d" stroke-width="2.5"/>
<polygon points="325,426 318,414 332,414" fill="#8b2d2d"/>

<text x="325" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2d2d">Working clone in seconds</text>
<text x="325" y="474" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the reader cannot tell them apart</text>

