<text x="600" y="374" text-anchor="middle" font-size="12.5" fill="#5c5c5c">tunnel reader</text>
<rect x="552" y="392" width="96" height="26" rx="13" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="600" y="409" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">RFID read</text>

