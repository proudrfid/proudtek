<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Read range of the flexible tag by air interface</title>
  <desc id="d">Range ladder with a compressed distance axis. NFC tap at 13.56 MHz with a loop antenna reads at 2 to 8 cm using NTAG chips. HF vicinity at 13.56 MHz with a loop antenna reads at 30 to 100 cm using ICODE SLIX2. UHF at 860 to 960 MHz with a dipole antenna reads 0.3 to 1.5 m on-body with Monza R6-P and M775 Autotune, and 1 to 5 m off-body with UCODE 9 and Higgs-9. Post-flex read-rate stays at or above 99.5 percent after 10,000 cycles on every band.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">READ RANGE BY AIR INTERFACE</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#5c5c5c">Loop antennas at 13.56 MHz · dipole antennas at 860-960 MHz · axis compressed</text>

  <!-- row 1: NFC -->
  <text x="64" y="160" font-size="16" font-weight="700" fill="#291c0e">NFC tap · 13.56 MHz</text>
  <text x="64" y="184" font-size="12.5" fill="#5c5c5c">NTAG 213 / 215 / 216 · 424 DNA</text>
  <circle cx="305" cy="168" r="16" fill="none" stroke="#3d6b6b" stroke-width="4"/>
  <circle cx="305" cy="168" r="8" fill="none" stroke="#3d6b6b" stroke-width="2"/>
  <rect x="332" y="155" width="96" height="26" rx="13" fill="#3d6b6b"/>
  <text x="428" y="146" text-anchor="end" font-size="15" font-weight="700" fill="#2c5454">2-8 cm</text>

  <!-- row 2: HF -->
  <text x="64" y="260" font-size="16" font-weight="700" fill="#291c0e">HF vicinity · 13.56 MHz</text>
  <text x="64" y="284" font-size="12.5" fill="#5c5c5c">ICODE SLIX2 + SLIX-L</text>
  <circle cx="305" cy="268" r="16" fill="none" stroke="#3d6b6b" stroke-width="4"/>
  <circle cx="305" cy="268" r="8" fill="none" stroke="#3d6b6b" stroke-width="2"/>
  <rect x="531" y="255" width="249" height="26" rx="13" fill="#3d6b6b"/>
  <text x="780" y="246" text-anchor="end" font-size="15" font-weight="700" fill="#2c5454">30-100 cm</text>

  <!-- row 3: UHF on-body -->
  <text x="64" y="360" font-size="16" font-weight="700" fill="#291c0e">UHF on-body · 860-960 MHz</text>
  <text x="64" y="384" font-size="12.5" fill="#5c5c5c">Monza R6-P · M775 Autotune</text>
  <line x1="282" y1="368" x2="334" y2="368" stroke="#4a5568" stroke-width="4"/>
  <rect x="303" y="363" width="10" height="10" fill="#4a5568"/>
  <rect x="531" y="355" width="289" height="26" rx="13" fill="#4a5568"/>
  <text x="820" y="346" text-anchor="end" font-size="15" font-weight="700" fill="#4a5568">0.3-1.5 m</text>

  <!-- row 4: UHF off-body -->
  <text x="64" y="460" font-size="16" font-weight="700" fill="#291c0e">UHF off-body · 860-960 MHz</text>
  <text x="64" y="484" font-size="12.5" fill="#5c5c5c">UCODE 9 / 9xe · Higgs-9</text>
  <line x1="282" y1="468" x2="334" y2="468" stroke="#4a5568" stroke-width="4"/>
  <rect x="303" y="463" width="10" height="10" fill="#4a5568"/>
  <rect x="780" y="455" width="320" height="26" rx="13" fill="#4a5568"/>
  <text x="1100" y="446" text-anchor="end" font-size="15" font-weight="700" fill="#4a5568">1-5 m</text>

  <!-- axis -->
  <line x1="300" y1="540" x2="1100" y2="540" stroke="#e6dfd2" stroke-width="2"/>
  <line x1="300" y1="534" x2="300" y2="546" stroke="#c39a5f" stroke-width="2"/>
  <line x1="460" y1="534" x2="460" y2="546" stroke="#c39a5f" stroke-width="2"/>
  <line x1="780" y1="534" x2="780" y2="546" stroke="#c39a5f" stroke-width="2"/>
  <line x1="1100" y1="534" x2="1100" y2="546" stroke="#c39a5f" stroke-width="2"/>
  <text x="300" y="566" text-anchor="middle" font-size="12.5" fill="#5c5c5c">0</text>
  <text x="460" y="566" text-anchor="middle" font-size="12.5" fill="#5c5c5c">10 cm</text>
  <text x="780" y="566" text-anchor="middle" font-size="12.5" fill="#5c5c5c">1 m</text>
  <text x="1100" y="566" text-anchor="middle" font-size="12.5" fill="#5c5c5c">5 m</text>

  <!-- result band -->
  <rect x="180" y="592" width="840" height="44" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="620" text-anchor="middle" font-size="14.5" font-weight="600" fill="#2c5454">Post-flex read-rate ≥99.5 % after 10,000 cycles at 10 mm — same bend budget on every band</text>
</svg>
