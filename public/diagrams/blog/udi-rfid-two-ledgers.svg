<line x1="552" y1="300" x2="648" y2="300" stroke="#2d6a4f" stroke-width="2.5"/>
<path d="M 660 300 l -14 -7 v 14 z" fill="#2d6a4f"/>
<path d="M 540 300 l 14 -7 v 14 z" fill="#2d6a4f"/>
<rect x="536" y="322" width="128" height="32" rx="16" fill="#e7f1ec" stroke="#a8c8bb" stroke-width="1.5"/>
<text x="600" y="343" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">MUST MATCH</text>

<text x="600" y="566" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4f4f4f">A flawless label with a missing or mismatched GUDID record is still a compliance failure.</text>
</svg>
