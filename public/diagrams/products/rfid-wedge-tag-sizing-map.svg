<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Wedge SKU sizing map — which clip fits which pipe or rail</title>
<desc id="d">Horizontal sizing chart mapping pipe outside diameter ranges and tray rail widths to the six wedge SKUs, including the fire-protection and Unistrut variants.</desc>
<rect width="1200" height="675" fill="#f8f6f1"/>
<text x="60" y="64" font-family="Georgia, serif" font-size="34" fill="#291c0e">Six clips cover the whole rack</text>
<text x="60" y="98" font-family="Verdana, sans-serif" font-size="16" fill="#6d5a3a">Match the OD, pick the SKU — every size carries the same on-metal UHF core</text>
<g font-family="Verdana, sans-serif">
<text x="60" y="160" font-size="15" fill="#291c0e" font-family="Georgia, serif">Pipe runs — ASME A13.1 safety-colour bodies</text>
<rect x="60" y="178" width="300" height="56" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="80" y="202" font-size="14" fill="#291c0e">Safety-Yellow · 25 x 45 x 12 mm</text>
<text x="80" y="222" font-size="12.5" fill="#6d5a3a">15-40 mm OD — over 60 C, toxic, corrosive</text>
<rect x="376" y="178" width="300" height="56" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="396" y="202" font-size="14" fill="#291c0e">Safety-Green · 30 x 50 x 14 mm</text>
<text x="396" y="222" font-size="12.5" fill="#6d5a3a">40-75 mm OD — potable + compressed air</text>
<rect x="692" y="178" width="300" height="56" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="712" y="202" font-size="14" fill="#291c0e">Safety-Blue · 35 x 55 x 16 mm</text>
<text x="712" y="222" font-size="12.5" fill="#6d5a3a">75-100 mm OD — low-hazard fluids</text>
<rect x="60" y="258" width="130" height="20" rx="4" fill="#c39a5f"/>
<rect x="190" y="258" width="230" height="20" rx="0" fill="#3d6b6b"/>
<rect x="420" y="258" width="220" height="20" rx="4" fill="#2c5454"/>
<text x="60" y="298" font-size="12.5" fill="#6d5a3a">15 mm</text>
<text x="178" y="298" font-size="12.5" fill="#6d5a3a">40 mm</text>
<text x="408" y="298" font-size="12.5" fill="#6d5a3a">75 mm</text>
<text x="648" y="298" font-size="12.5" fill="#6d5a3a" text-anchor="start">100 mm OD</text>
<text x="60" y="352" font-size="15" fill="#291c0e" font-family="Georgia, serif">Fire-quenching lines — its own body</text>
<rect x="60" y="370" width="500" height="56" rx="8" fill="#ffffff" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="80" y="394" font-size="14" fill="#8b2d2d">Safety-Red fire-quenching wedge · 25 x 50 x 12 mm</text>
<text x="80" y="414" font-size="12.5" fill="#6d5a3a">NFPA 13 sprinkler + NFPA 25 standpipe inspection estates</text>
<text x="60" y="480" font-size="15" fill="#291c0e" font-family="Georgia, serif">Rails and strut — the electrical side of the rack</text>
<rect x="60" y="498" width="500" height="56" rx="8" fill="#eef2f0" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="80" y="522" font-size="14" fill="#291c0e">Cable-tray rail wedge · 40 x 60 x 18 mm</text>
<text x="80" y="542" font-size="12.5" fill="#2c5454">25-150 mm tray flange — NEMA VE 1 + IEC 61537 + NEC 392</text>
<rect x="592" y="498" width="500" height="56" rx="8" fill="#eef2f0" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="612" y="522" font-size="14" fill="#291c0e">Unistrut + L-angle wedge · 35 x 50 x 14 mm</text>
<text x="612" y="542" font-size="12.5" fill="#2c5454">P1000 strut channel + 50x50 to 100x100 L-angle</text>
<text x="60" y="616" font-size="13.5" fill="#6d5a3a">Optional 316L safety lanyard, 1.5 mm cable with swage ferrule, for lines where a lost tag is itself a finding.</text>
</g>
</svg>
