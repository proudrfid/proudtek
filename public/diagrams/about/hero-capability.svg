<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="hTitle hDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="hTitle">Proud Tek RFID and NFC manufacturing</title>
  <desc id="hDesc">An illustrated RFID smart card showing its embedded antenna coil and chip with NFC signal waves, beside credentials: manufacturing partner since 2008, ISO 9001 / 14001 / 45001, and six product families to our specification.</desc>

  <defs>
    <radialGradient id="glow" cx="38%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#f6e4c2"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33240f"/>
      <stop offset="100%" stop-color="#5f4824"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- NFC signal waves (behind card, radiating top-right) -->
  <g fill="none" stroke="#1fcefb" stroke-linecap="round">
    <path d="M690 250 a120 120 0 0 1 96 150" stroke-width="7" opacity="0.9"/>
    <path d="M690 210 a175 175 0 0 1 150 205" stroke-width="7" opacity="0.6"/>
    <path d="M690 170 a230 230 0 0 1 205 260" stroke-width="7" opacity="0.35"/>
  </g>

  <!-- Smart card -->
  <g transform="rotate(-7 430 340)">
    <rect x="150" y="185" width="520" height="315" rx="28" fill="url(#card)" stroke="#c39a5f" stroke-width="2"/>
    <!-- antenna coil -->
    <g fill="none" stroke="#c39a5f" stroke-width="3">
      <rect x="176" y="211" width="468" height="263" rx="22" opacity="0.9"/>
      <rect x="198" y="233" width="424" height="219" rx="18" opacity="0.7"/>
      <rect x="220" y="255" width="380" height="175" rx="14" opacity="0.5"/>
      <rect x="242" y="277" width="336" height="131" rx="10" opacity="0.35"/>
    </g>
    <!-- chip -->
    <rect x="205" y="232" width="92" height="70" rx="10" fill="#d4a755"/>
    <g stroke="#33240f" stroke-width="3" opacity="0.75">
      <line x1="205" y1="255" x2="187" y2="255"/><line x1="205" y1="279" x2="187" y2="279"/>
      <line x1="297" y1="255" x2="315" y2="255"/><line x1="297" y1="279" x2="315" y2="279"/>
      <line x1="233" y1="232" x2="233" y2="214"/><line x1="269" y1="232" x2="269" y2="214"/>
      <line x1="233" y1="302" x2="233" y2="320"/><line x1="269" y1="302" x2="269" y2="320"/>
    </g>
    <!-- wordmark -->
    <text x="440" y="418" text-anchor="middle" font-size="38" font-weight="800" letter-spacing="2" fill="#f4efe7">PROUDTEK</text>
    <text x="440" y="448" text-anchor="middle" font-size="19" letter-spacing="4" fill="#d4a755">RFID · NFC</text>
  </g>

  <!-- Credential chips (right) -->
  <g>
    <rect x="820" y="212" width="316" height="70" rx="16" fill="#ffffff" stroke="#e4c98f" stroke-width="2"/>
    <text x="848" y="255" font-size="23" font-weight="700" fill="#291c0e">Manufacturing partner since 2008</text>

    <rect x="820" y="302" width="316" height="70" rx="16" fill="#ffffff" stroke="#e4c98f" stroke-width="2"/>
    <text x="848" y="337" font-size="20" font-weight="700" fill="#291c0e">ISO 9001 · RoHS · REACH</text>
    <text x="848" y="360" font-size="18" fill="#6d5a3a">FCC · CE on file</text>

    <rect x="820" y="392" width="316" height="70" rx="16" fill="#291c0e"/>
    <text x="848" y="426" font-size="21" font-weight="700" fill="#f4efe7">6 product families</text>
    <text x="848" y="449" font-size="17" fill="#c39a5f">cards · tags · labels · fobs · bands · readers</text>
  </g>

  <!-- baseline caption -->
  <text x="150" y="600" font-size="22" font-weight="600" fill="#6d5a3a">Shenzhen partner lines — wet-inlay, lamination, encoding to our spec &amp; 100% read-test by our QC</text>
</svg>
