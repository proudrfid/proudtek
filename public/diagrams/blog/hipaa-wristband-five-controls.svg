<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="reqT reqD" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <title id="reqT">The five controls that make an RFID wristband program HIPAA-compliant</title>
      <desc id="reqD">Five requirements: minimize PHI on the chip (store only an opaque patient ID such as a random UUID); encrypt anything at rest (AES-128 mutual authentication via NTAG 424 DNA or DESFire EV3); log every access (reader ID, user ID and timestamp, per Security Rule 164.312(b)); destroy the band at discharge (cut and destroy, not just remove); and sign Business Associate Agreements with any vendor handling wristband data.</desc>
      <defs><radialGradient id="rqBg" cx="50%" cy="16%" r="92%"><stop offset="0%" stop-color="#f8f2e6"/><stop offset="100%" stop-color="#f1ece0"/></radialGradient></defs>
      <rect width="1200" height="675" fill="url(#rqBg)"/>
      <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
      <text x="600" y="62" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="2" fill="#6d5a3a">WHAT "HIPAA-COMPLIANT" REQUIRES — FIVE CONTROLS</text>
      <g font-family="inherit">
        <!-- Row 1 -->
        <circle cx="96" cy="150" r="26" fill="#c39a5f"/><text x="96" y="159" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">1</text>
        <text x="146" y="144" font-size="23" font-weight="800" fill="#291c0e">Minimize PHI on the chip</text>
        <text x="146" y="172" font-size="16.5" fill="#4f4f4f">Store only an opaque patient ID (e.g. a random UUID); clinical data stays in the EHR.</text>
        <line x1="146" y1="198" x2="1112" y2="198" stroke="#efe7d7" stroke-width="1.5"/>
        <!-- Row 2 -->
        <circle cx="96" cy="248" r="26" fill="#c39a5f"/><text x="96" y="257" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">2</text>
        <text x="146" y="242" font-size="23" font-weight="800" fill="#291c0e">Encrypt anything at rest</text>
        <text x="146" y="270" font-size="16.5" fill="#4f4f4f">AES-128 mutual authentication via NTAG 424 DNA or DESFire EV3.</text>
        <line x1="146" y1="296" x2="1112" y2="296" stroke="#efe7d7" stroke-width="1.5"/>
        <!-- Row 3 -->
        <circle cx="96" cy="346" r="26" fill="#c39a5f"/><text x="96" y="355" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">3</text>
        <text x="146" y="340" font-size="23" font-weight="800" fill="#291c0e">Log every access</text>
        <text x="146" y="368" font-size="16.5" fill="#4f4f4f">Reader ID + user ID + timestamp — the audit trail in Security Rule §164.312(b).</text>
        <line x1="146" y1="394" x2="1112" y2="394" stroke="#efe7d7" stroke-width="1.5"/>
        <!-- Row 4 -->
        <circle cx="96" cy="444" r="26" fill="#c39a5f"/><text x="96" y="453" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">4</text>
        <text x="146" y="438" font-size="23" font-weight="800" fill="#291c0e">Destroy the band at discharge</text>
        <text x="146" y="466" font-size="16.5" fill="#4f4f4f">Cut and destroy the end-of-stay band — not just remove it — so any stored data is unreadable.</text>
        <line x1="146" y1="492" x2="1112" y2="492" stroke="#efe7d7" stroke-width="1.5"/>
        <!-- Row 5 -->
        <circle cx="96" cy="542" r="26" fill="#c39a5f"/><text x="96" y="551" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">5</text>
        <text x="146" y="536" font-size="23" font-weight="800" fill="#291c0e">Sign BAAs with vendors</text>
        <text x="146" y="564" font-size="16.5" fill="#4f4f4f">Third parties processing wristband data are Business Associates and must sign a BAA.</text>
      </g>
      <rect x="58" y="596" width="1084" height="42" rx="12" fill="#f4efe4"/>
      <text x="600" y="623" text-anchor="middle" font-size="15" font-style="italic" fill="#6d5a3a">Get these five right and the wristband is boring in the best possible way.</text>
    </svg>
