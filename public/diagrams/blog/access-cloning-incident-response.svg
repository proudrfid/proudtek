<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Incident response to a suspected card cloning: contain, reconstruct, fix</title>
<desc id="d">The response order after a suspected cloning, triggered by a single anomalous line in the access log such as a departed employee's badge or one card read in two places at once. First contain: revoke and reissue the credential, station guards at critical doors, and turn on real-time access alerts. Then reconstruct: audit logs for anomalies, look for duplicate simultaneous reads, and assess the scope of exposure. Only then fix the technology: plan the encrypted-card upgrade, high-security zones first, which kicks off the 90-day plan.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INCIDENT RESPONSE · FIRST HOURS FIRST</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Contain the exposure, reconstruct what happened, then fix the technology — in that order.</text>

<rect x="64" y="116" width="1072" height="46" rx="10" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.6"/>
<text x="600" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#8b2d2d">TRIGGER · one odd line in the log — a departed employee's badge, or one card in two places at once</text>

<!-- Card 1 Contain -->
<rect x="64" y="196" width="336" height="286" rx="14" fill="#fbf8f2" stroke="#c39a5f" stroke-width="2"/>
<circle cx="92" cy="196" r="18" fill="#c39a5f"/><text x="92" y="202" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
<text x="86" y="252" font-size="20" font-weight="800" fill="#291c0e">Contain</text>
<text x="86" y="274" font-size="13" fill="#6d5a3a">stop the bleeding</text>
<rect x="360" y="232" width="22" height="16" rx="2" fill="none" stroke="#c39a5f" stroke-width="2.5"/><path d="M363 232 a8 8 0 0 1 16 0" fill="none" stroke="#c39a5f" stroke-width="2.5"/>
<circle cx="94" cy="310" r="4" fill="#c39a5f"/><text x="108" y="314" font-size="14" fill="#3f3f3f">Revoke + reissue the card</text>
<circle cx="94" cy="344" r="4" fill="#c39a5f"/><text x="108" y="348" font-size="14" fill="#3f3f3f">Guards at critical doors</text>
<circle cx="94" cy="378" r="4" fill="#c39a5f"/><text x="108" y="382" font-size="14" fill="#3f3f3f">Real-time access alerts on</text>

<!-- Card 2 Reconstruct -->
<rect x="432" y="196" width="336" height="286" rx="14" fill="#fbf8f2" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="460" cy="196" r="18" fill="#3d6b6b"/><text x="460" y="202" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<text x="454" y="252" font-size="20" font-weight="800" fill="#291c0e">Reconstruct</text>
<text x="454" y="274" font-size="13" fill="#3d6b6b">what did it touch</text>
<circle cx="740" cy="235" r="9" fill="none" stroke="#3d6b6b" stroke-width="2.5"/><line x1="746" y1="241" x2="753" y2="248" stroke="#3d6b6b" stroke-width="2.5"/>
<circle cx="462" cy="310" r="4" fill="#3d6b6b"/><text x="476" y="314" font-size="14" fill="#3f3f3f">Audit logs for anomalies</text>
<circle cx="462" cy="344" r="4" fill="#3d6b6b"/><text x="476" y="348" font-size="14" fill="#3f3f3f">Duplicate simultaneous reads</text>
<circle cx="462" cy="378" r="4" fill="#3d6b6b"/><text x="476" y="382" font-size="14" fill="#3f3f3f">Assess scope of exposure</text>

<!-- Card 3 Fix -->
<rect x="800" y="196" width="336" height="286" rx="14" fill="#fbf8f2" stroke="#1f6f3a" stroke-width="2"/>
<circle cx="828" cy="196" r="18" fill="#1f6f3a"/><text x="828" y="202" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<text x="822" y="252" font-size="20" font-weight="800" fill="#291c0e">Fix the technology</text>
<text x="822" y="274" font-size="13" fill="#1f6f3a">so it cannot recur</text>
<circle cx="1108" cy="238" r="12" fill="none" stroke="#1f6f3a" stroke-width="2.5"/><path d="M1102 242 l6 -7 l6 7" fill="none" stroke="#1f6f3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="830" cy="310" r="4" fill="#1f6f3a"/><text x="844" y="314" font-size="14" fill="#3f3f3f">Plan the encrypted upgrade</text>
<circle cx="830" cy="344" r="4" fill="#1f6f3a"/><text x="844" y="348" font-size="14" fill="#3f3f3f">High-security zones first</text>
<circle cx="830" cy="378" r="4" fill="#1f6f3a"/><text x="844" y="382" font-size="14" fill="#3f3f3f">Kicks off the 90-day plan</text>

<path d="M409 322 l14 10 l-14 10 z" fill="#c9b48c"/>
<path d="M777 322 l14 10 l-14 10 z" fill="#c9b48c"/>

<text x="600" y="528" text-anchor="middle" font-size="15" fill="#5c5c5c">The first hours decide how much of the breach you get to control.</text>
</svg>
