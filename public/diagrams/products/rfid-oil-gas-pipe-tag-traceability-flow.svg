<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Cradle-to-grave traceability lifecycle for an oil &amp; gas pipe-joint RFID tag</title>
  <desc id="d">A four-step pipe-joint lifecycle flow: at the mill, encode a GS1 GIAI-96 to the API 5L heat certificate and API 1104 weld map; at hydrotest, coat and pressure-test the joint, surviving FBE at 230 degrees C and SA 2.5 sandblast plus burial; in service, run API 570 inspection rounds that scan the joint for heat, grade and wall-thickness context; and record every scan as an EPCIS 2.0 event feeding the PHMSA 49 CFR Part 192 traceable, verifiable, complete record. A banner notes that API 570 and API 579-1 fitness-for-service assessments open with context read from the joint rather than chased through a records archive.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CRADLE-TO-GRAVE JOINT RECORD</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">One GIAI-96 carries the joint from the mill to its last API 570 inspection round</text>

  <rect x="70" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="170" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="187" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1 · MILL</text>
  <text x="187" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Encode GS1 GIAI-96</text>
  <text x="187" y="272" text-anchor="middle" font-size="14" fill="#291c0e">to the API 5L heat cert</text>
  <text x="187" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">API 1104 weld / joint</text>
  <text x="187" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">records mapped</text>

  <rect x="345" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="345" y="170" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="462" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2 · HYDROTEST</text>
  <text x="462" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Coat, pressure-test,</text>
  <text x="462" y="272" text-anchor="middle" font-size="14" fill="#291c0e">survive the trench</text>
  <text x="462" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">FBE 230 °C, SA 2.5</text>
  <text x="462" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">sandblast + burial</text>

  <rect x="620" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="620" y="170" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="737" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3 · IN-SERVICE</text>
  <text x="737" y="248" text-anchor="middle" font-size="14" fill="#291c0e">API 570 inspection</text>
  <text x="737" y="272" text-anchor="middle" font-size="14" fill="#291c0e">rounds — scan the joint</text>
  <text x="737" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">heat / grade / wall</text>
  <text x="737" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">context in seconds</text>

  <rect x="895" y="170" width="235" height="205" rx="14" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <rect x="895" y="170" width="235" height="42" rx="14" fill="#1f6f3a"/>
  <text x="1012" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4 · RECORD</text>
  <text x="1012" y="250" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6f3a">TVC RECORD</text>
  <text x="1012" y="288" text-anchor="middle" font-size="12.5" fill="#5c5c5c">EPCIS 2.0 event to</text>
  <text x="1012" y="306" text-anchor="middle" font-size="12.5" fill="#5c5c5c">PHMSA 49 CFR §192.619</text>

  <polygon points="308,272 336,272 336,266 350,275 336,284 336,278 308,278" fill="#4a5568"/>
  <polygon points="583,272 611,272 611,266 625,275 611,284 611,278 583,278" fill="#4a5568"/>
  <polygon points="858,272 886,272 886,266 900,275 886,284 886,278 858,278" fill="#4a5568"/>

  <rect x="70" y="418" width="1060" height="66" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="90" y="446" font-size="15" font-weight="700" fill="#2c5454">Why it matters for the integrity engineer</text>
  <text x="90" y="468" font-size="13.5" fill="#2c5454">API 570 and API 579-1 fitness-for-service assessments open with the correct heat, grade and wall-thickness — read from the joint, not a records archive.</text>

  <text x="600" y="540" text-anchor="middle" font-size="13.5" fill="#5c5c5c">ROSEN / Baker Hughes / TD Williamson / NDT Global / Quest Integrity ILI runs resolve each anomaly to the specific joint.</text>
</svg>
