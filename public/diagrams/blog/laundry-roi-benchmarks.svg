<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five published payback benchmarks on one band</title>
<desc id="d">Payback ranges from published case studies plotted on a shared 0-24 month band: OR sterile-pack tracking 6-12 months driven by compliance value; hospital linen 8-14 months as loss falls from 10-20 percent to 2-5 percent; uniform rental 8-15 months with disputed wash-counts recovered; healthcare scrub programs 10-16 months as scrub loss drops from 25-40 percent to 5-10 percent; hotels and resorts 12-18 months with 60-80 percent shrinkage reduction reported by Marriott pilots and Hilton in-house programmes.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THIRD-PARTY NUMBERS, ONE RULER</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Five segments, five published payback bands</text>

<line x1="330" y1="150" x2="1090" y2="150" stroke="#4f4f4f" stroke-width="1.5"/>
<g font-size="12.5" fill="#4f4f4f" text-anchor="middle">
<line x1="330" y1="144" x2="330" y2="156" stroke="#4f4f4f" stroke-width="1.5"/><text x="330" y="136">0 mo</text>
<line x1="520" y1="144" x2="520" y2="156" stroke="#4f4f4f" stroke-width="1.5"/><text x="520" y="136">6</text>
<line x1="710" y1="144" x2="710" y2="156" stroke="#4f4f4f" stroke-width="1.5"/><text x="710" y="136">12</text>
<line x1="900" y1="144" x2="900" y2="156" stroke="#4f4f4f" stroke-width="1.5"/><text x="900" y="136">18</text>
<line x1="1090" y1="144" x2="1090" y2="156" stroke="#4f4f4f" stroke-width="1.5"/><text x="1090" y="136">24</text>
</g>

<text x="90" y="205" font-size="14" font-weight="700" fill="#291c0e">OR sterile packs</text>
<text x="90" y="226" font-size="12" fill="#4f4f4f">compliance-driven</text>
<rect x="520" y="186" width="190" height="30" rx="15" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="615" y="206" text-anchor="middle" font-size="13" font-weight="800" fill="#1b4332">6–12 mo</text>

<text x="90" y="287" font-size="14" font-weight="700" fill="#291c0e">Hospital linen</text>
<text x="90" y="308" font-size="12" fill="#4f4f4f">loss 10–20% → 2–5%</text>
<rect x="583" y="268" width="190" height="30" rx="15" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="678" y="288" text-anchor="middle" font-size="13" font-weight="800" fill="#1b4332">8–14 mo</text>

<text x="90" y="369" font-size="14" font-weight="700" fill="#291c0e">Uniform rental</text>
<text x="90" y="390" font-size="12" fill="#4f4f4f">wash-count disputes recovered</text>
<rect x="583" y="350" width="222" height="30" rx="15" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="694" y="370" text-anchor="middle" font-size="13" font-weight="800" fill="#6d5a3a">8–15 mo</text>

<text x="90" y="451" font-size="14" font-weight="700" fill="#291c0e">Healthcare scrubs</text>
<text x="90" y="472" font-size="12" fill="#4f4f4f">loss 25–40% → 5–10%</text>
<rect x="646" y="432" width="190" height="30" rx="15" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="741" y="452" text-anchor="middle" font-size="13" font-weight="800" fill="#6d5a3a">10–16 mo</text>

<text x="90" y="533" font-size="14" font-weight="700" fill="#291c0e">Hotels &amp; resorts</text>
<text x="90" y="554" font-size="12" fill="#4f4f4f">shrinkage cut 60–80%</text>
<rect x="710" y="514" width="190" height="30" rx="15" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="805" y="534" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">12–18 mo</text>

<text x="600" y="626" text-anchor="middle" font-size="13" fill="#5c5c5c">Sources: HID Global, ARC Advisory, AHA Health Forum, CPCON 2026, Marriott/Hilton programme reports — they agree suspiciously well, which here is a good sign.</text>
</svg>
