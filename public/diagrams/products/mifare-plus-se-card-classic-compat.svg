<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Plus SE wears Classic's memory map — same 16 sectors, 4 blocks, MAD directory</title>
  <desc id="d">Side-by-side: Classic 1K layout of 16 sectors by 4 blocks with MAD v1/v2 and access-condition bits, and Plus SE presenting the identical layout at SL1 so legacy readers and tooling see a Classic card, while AES-128 waits underneath for SL3.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">To your readers, it looks exactly like Classic</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Same 16-sector / 4-block layout, same MAD v1/v2, same access-condition bits — that is the whole trick</text>
  <g transform="translate(70,140)">
    <rect x="0" y="0" width="480" height="330" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="19" fill="#291c0e">MIFARE Classic 1K</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d5a3a">
      <rect x="24" y="60" width="200" height="60" rx="6" fill="#fdf3e3" stroke="#c39a5f"/><text x="36" y="86">16 sectors x 4 blocks</text><text x="36" y="106">MAD v1 / v2 directory</text>
      <rect x="24" y="134" width="200" height="40" rx="6" fill="#ffffff" stroke="#d8cdb8"/><text x="36" y="159">access-condition bits</text>
      <rect x="24" y="188" width="200" height="40" rx="6" fill="#ffffff" stroke="#8b2d2d"/><text x="36" y="213" fill="#8b2d2d">CRYPTO-1 — broken 2008</text>
    </g>
    <text x="260" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">what the reader</text>
    <text x="260" y="106" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">estate expects</text>
  </g>
  <g transform="translate(640,140)">
    <rect x="0" y="0" width="480" height="330" rx="14" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2.5"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="19" fill="#2c5454">MIFARE Plus SE</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2c5454">
      <rect x="24" y="60" width="200" height="60" rx="6" fill="#ffffff" stroke="#3d6b6b"/><text x="36" y="86">identical 16 x 4 layout</text><text x="36" y="106">same MAD, same bits</text>
      <rect x="24" y="134" width="200" height="40" rx="6" fill="#ffffff" stroke="#3d6b6b"/><text x="36" y="159">SL1: enrols on Classic readers</text>
      <rect x="24" y="188" width="200" height="40" rx="6" fill="#2c5454"/><text x="36" y="213" fill="#f8f6f1">SL3: AES-128 + AN10922 keys</text>
    </g>
    <text x="260" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">identical PHY —</text>
    <text x="260" y="106" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">ISO/IEC 14443-2/-3/-4</text>
    <text x="260" y="126" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">Type A, 13.56 MHz, T=CL</text>
    <text x="260" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">per-card diversified keys</text>
    <text x="260" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">from UID + sector (AN10922)</text>
  </g>
  <text x="60" y="560" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">Swap the card stock first, keep the doors working, upgrade the crypto when the readers are ready</text>
</svg>
