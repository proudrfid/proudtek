<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="cbTitle cbDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="cbTitle">Proud Tek certifications and compliance</title>
  <desc id="cbDesc">Certification badges in each mark's brand colour: management systems ISO 9001, ISO 14001 and ISO 45001 (ISO red); product and material compliance OEKO-TEX Standard 100 (teal-green), RoHS (green) and CE (blue). Certificate numbers and issuing registrars verifiable on request.</desc>

  <defs>
    <radialGradient id="cbGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#cbGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="78" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="2" fill="#6d5a3a">AUDITED · CERTIFIED · VERIFIABLE</text>

  <!-- Group 1: Management systems — ISO brand red -->
  <text x="72" y="140" font-size="18" font-weight="700" letter-spacing="1.5" fill="#c39a5f">MANAGEMENT SYSTEMS (ISO)</text>
  <line x1="430" y1="134" x2="1128" y2="134" stroke="#ece5d8" stroke-width="2"/>

  <!-- ISO 9001 -->
  <g>
    <rect x="72" y="158" width="336" height="120" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="132" cy="218" r="34" fill="#e4002b"/>
    <path d="M117 218 l11 11 l20 -22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="186" y="210" font-size="26" font-weight="800" fill="#291c0e">ISO 9001</text>
    <text x="186" y="240" font-size="17" fill="#6d5a3a">Quality management</text>
  </g>
  <!-- ISO 14001 -->
  <g>
    <rect x="432" y="158" width="336" height="120" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="492" cy="218" r="34" fill="#e4002b"/>
    <path d="M477 218 l11 11 l20 -22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="546" y="210" font-size="26" font-weight="800" fill="#291c0e">ISO 14001</text>
    <text x="546" y="240" font-size="17" fill="#6d5a3a">Environmental management</text>
  </g>
  <!-- ISO 45001 -->
  <g>
    <rect x="792" y="158" width="336" height="120" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="852" cy="218" r="34" fill="#e4002b"/>
    <path d="M837 218 l11 11 l20 -22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="906" y="210" font-size="26" font-weight="800" fill="#291c0e">ISO 45001</text>
    <text x="906" y="240" font-size="17" fill="#6d5a3a">Occupational H&amp;S</text>
  </g>

  <!-- Group 2: Product & material — each in its own brand colour -->
  <text x="72" y="360" font-size="18" font-weight="700" letter-spacing="1.5" fill="#c39a5f">PRODUCT &amp; MATERIAL</text>
  <line x1="330" y1="354" x2="1128" y2="354" stroke="#ece5d8" stroke-width="2"/>

  <!-- OEKO-TEX STANDARD 100 — OEKO-TEX teal-green #00AC8C -->
  <g>
    <rect x="72" y="378" width="336" height="120" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="132" cy="438" r="34" fill="#00ac8c"/>
    <path d="M117 438 l11 11 l20 -22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="186" y="430" font-size="23" font-weight="800" fill="#291c0e">OEKO-TEX®</text>
    <text x="186" y="459" font-size="15" fill="#6d5a3a">STANDARD 100 · textile safety</text>
  </g>
  <!-- RoHS — compliance green -->
  <g>
    <rect x="432" y="378" width="336" height="120" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="492" cy="438" r="34" fill="#3a8a3f"/>
    <path d="M477 438 l11 11 l20 -22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="546" y="430" font-size="26" font-weight="800" fill="#291c0e">RoHS</text>
    <text x="546" y="460" font-size="16" fill="#6d5a3a">Hazardous-substance compliance</text>
  </g>
  <!-- CE — CE blue -->
  <g>
    <rect x="792" y="378" width="336" height="120" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="852" cy="438" r="34" fill="#005eb8"/>
    <path d="M837 438 l11 11 l20 -22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="906" y="430" font-size="26" font-weight="800" fill="#291c0e">CE marking</text>
    <text x="906" y="460" font-size="16" fill="#6d5a3a">EU declaration of conformity</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-size="18" fill="#6d5a3a">Certificate numbers and issuing registrars provided for verification on request.</text>
</svg>
