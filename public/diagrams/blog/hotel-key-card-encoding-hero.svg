<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hotel key card encoding: one tap, five systems</title>
<desc id="d">A flow diagram of the five systems behind a hotel key card tap. The PMS or middleware such as Opera, Mews or Shiji sends the guest payload with the stay window and room. The encoder fleet at the desk writes the sector data, with firmware capping which chip families it can program. The card itself carries the chip family, such as MIFARE DESFire EV3 or Classic 1K. The lock firmware authenticates the payload, checks the validity window, and opens or does not. Underneath all four runs one key ceremony: a diversified key tree that is generated, stored, transported and written. The verdict line reads: a systems artefact first, a printed artefact second.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOTEL KEY CARD ENCODING</text>
<text x="600" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">One tap, five systems</text>
<text x="600" y="124" text-anchor="middle" font-size="15" fill="#4f4f4f">What has to align before the door believes the card.</text>

<!-- flow boxes -->
<!-- PMS -->
<rect x="77" y="178" width="230" height="158" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="77" y="178" width="230" height="40" rx="14" fill="#eef5f5"/>
<rect x="77" y="204" width="230" height="14" fill="#eef5f5"/>
<text x="192" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#234a4a">1 · PMS / middleware</text>
<text x="192" y="244" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Opera · Mews · Shiji</text>
<text x="192" y="268" text-anchor="middle" font-size="13.5" fill="#4f4f4f">sends the guest payload</text>
<text x="192" y="292" text-anchor="middle" font-size="13.5" fill="#4f4f4f">stay window + room + zones</text>
<text x="192" y="318" text-anchor="middle" font-size="12.5" fill="#6d5a3a">online = live re-issue</text>

<!-- Encoder -->
<rect x="349" y="178" width="230" height="158" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="349" y="178" width="230" height="40" rx="14" fill="#eef5f5"/>
<rect x="349" y="204" width="230" height="14" fill="#eef5f5"/>
<text x="464" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#234a4a">2 · Encoder fleet</text>
<text x="464" y="244" text-anchor="middle" font-size="13.5" fill="#4f4f4f">desk + housekeeping mobiles</text>
<text x="464" y="268" text-anchor="middle" font-size="13.5" fill="#4f4f4f">writes the sector data</text>
<text x="464" y="292" text-anchor="middle" font-size="13.5" fill="#4f4f4f">firmware caps chip support</text>
<text x="464" y="318" text-anchor="middle" font-size="12.5" fill="#6d5a3a">the quiet bottleneck</text>

<!-- Card (emphasis) -->
<rect x="621" y="178" width="230" height="158" rx="14" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
<text x="736" y="206" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3 · THE CARD</text>
<text x="736" y="244" text-anchor="middle" font-size="13.5" fill="#e8f1f1">chip family + memory layout</text>
<text x="736" y="268" text-anchor="middle" font-size="13.5" fill="#e8f1f1">DESFire EV3 · Classic 1K</text>
<text x="736" y="292" text-anchor="middle" font-size="13.5" fill="#e8f1f1">printed layer comes last</text>
<text x="736" y="318" text-anchor="middle" font-size="12.5" fill="#d4c9a8">the only part guests see</text>

<!-- Lock -->
<rect x="893" y="178" width="230" height="158" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="893" y="178" width="230" height="40" rx="14" fill="#eef5f5"/>
<rect x="893" y="204" width="230" height="14" fill="#eef5f5"/>
<text x="1008" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#234a4a">4 · Lock firmware</text>
<text x="1008" y="244" text-anchor="middle" font-size="13.5" fill="#4f4f4f">authenticates the payload</text>
<text x="1008" y="268" text-anchor="middle" font-size="13.5" fill="#4f4f4f">checks the validity window</text>
<text x="1008" y="292" text-anchor="middle" font-size="13.5" fill="#4f4f4f">opens — or does not</text>
<text x="1008" y="318" text-anchor="middle" font-size="12.5" fill="#6d5a3a">a tough audience</text>

<!-- arrows between boxes -->
<line x1="309" y1="257" x2="343" y2="257" stroke="#c39a5f" stroke-width="3"/>
<path d="M 343 257 l -9 -6 v 12 z" fill="#c39a5f"/>
<line x1="581" y1="257" x2="615" y2="257" stroke="#c39a5f" stroke-width="3"/>
<path d="M 615 257 l -9 -6 v 12 z" fill="#c39a5f"/>
<line x1="853" y1="257" x2="887" y2="257" stroke="#c39a5f" stroke-width="3"/>
<path d="M 887 257 l -9 -6 v 12 z" fill="#c39a5f"/>

<!-- key ceremony bar -->
<rect x="77" y="376" width="1046" height="88" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
<text x="600" y="410" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">5 · KEY CEREMONY — UNDER ALL FOUR</text>
<text x="600" y="440" text-anchor="middle" font-size="14" fill="#4f4f4f">One diversified key tree: generated, stored, transported, written — the most security-sensitive step and the least documented.</text>
<!-- ticks connecting bar to boxes -->
<line x1="192" y1="340" x2="192" y2="372" stroke="#e4c98f" stroke-width="2"/>
<line x1="464" y1="340" x2="464" y2="372" stroke="#e4c98f" stroke-width="2"/>
<line x1="736" y1="340" x2="736" y2="372" stroke="#e4c98f" stroke-width="2"/>
<line x1="1008" y1="340" x2="1008" y2="372" stroke="#e4c98f" stroke-width="2"/>

<!-- verdict -->
<text x="600" y="530" text-anchor="middle" font-size="26" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">A systems artefact first, a printed artefact second.</text>
<text x="600" y="566" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Decide encoding first and the project ships on schedule. Decide the finish first and the cards get re-ordered.</text>
<text x="600" y="620" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Misalign any one layer — chip vs lock firmware, encoder vs chip, PMS vs serial format — and the failure surfaces at peak check-in.</text>
</svg>
