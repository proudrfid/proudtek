<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How a DPP resolves: from the NFC tag through GS1 Digital Link to the cloud record</title>
<desc id="d">A four-step left-to-right flow. Step one, the NFC tag stores an NDEF URI record. Step two, that record holds a GS1 Digital Link URL of the form id.gs1.org/01/GTIN/21/serial. Step three, the GS1 Resolver routes the URL to the data endpoint. Step four, the cloud DPP record returns a JSON-LD document conforming to schema.org Product and DigitalDocument types. The tag holds the link, not the passport itself.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FROM TAP TO DATA — HOW A DPP RESOLVES</text>
<text x="600" y="104" text-anchor="middle" font-size="34" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">The tag holds a link, not the passport</text>

<rect x="64" y="250" width="232" height="200" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<circle cx="94" cy="288" r="16" fill="#3d6b6b"/><text x="94" y="294" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
<text x="120" y="294" font-size="16" font-weight="800" fill="#291c0e">NFC tag</text>
<line x1="82" y1="312" x2="278" y2="312" stroke="#ece3d0" stroke-width="1.6"/>
<text x="82" y="348" font-size="14.5" fill="#4f4f4f">Stores an</text>
<text x="82" y="370" font-size="14.5" font-weight="700" fill="#291c0e">NDEF URI record</text>

<rect x="344" y="250" width="232" height="200" rx="14" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
<circle cx="374" cy="288" r="16" fill="#2d6a4f"/><text x="374" y="294" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<text x="400" y="294" font-size="16" font-weight="800" fill="#291c0e">GS1 Digital Link</text>
<line x1="362" y1="312" x2="558" y2="312" stroke="#ece3d0" stroke-width="1.6"/>
<text x="362" y="348" font-size="14.5" fill="#4f4f4f">A resolvable URL</text>
<text x="362" y="372" font-size="13.5" font-weight="700" fill="#234a4a">id.gs1.org/01/</text>
<text x="362" y="392" font-size="13.5" font-weight="700" fill="#234a4a">{GTIN}/21/{serial}</text>

<rect x="624" y="250" width="232" height="200" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="1.8"/>
<circle cx="654" cy="288" r="16" fill="#c39a5f"/><text x="654" y="294" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<text x="680" y="294" font-size="16" font-weight="800" fill="#291c0e">GS1 Resolver</text>
<line x1="642" y1="312" x2="838" y2="312" stroke="#ece3d0" stroke-width="1.6"/>
<text x="642" y="348" font-size="14.5" fill="#4f4f4f">Routes the URL to</text>
<text x="642" y="370" font-size="14.5" fill="#4f4f4f">the data endpoint</text>

<rect x="904" y="250" width="232" height="200" rx="14" fill="#ffffff" stroke="#2c5454" stroke-width="1.8"/>
<circle cx="934" cy="288" r="16" fill="#2c5454"/><text x="934" y="294" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4</text>
<text x="960" y="294" font-size="16" font-weight="800" fill="#291c0e">Cloud record</text>
<line x1="922" y1="312" x2="1118" y2="312" stroke="#ece3d0" stroke-width="1.6"/>
<text x="922" y="348" font-size="14.5" font-weight="700" fill="#291c0e">JSON-LD document</text>
<text x="922" y="372" font-size="13.5" fill="#4f4f4f">schema.org Product</text>
<text x="922" y="392" font-size="13.5" fill="#4f4f4f">· DigitalDocument</text>

<line x1="300" y1="350" x2="340" y2="350" stroke="#b9a68e" stroke-width="3"/><polygon points="340,343 354,350 340,357" fill="#b9a68e"/>
<line x1="580" y1="350" x2="620" y2="350" stroke="#b9a68e" stroke-width="3"/><polygon points="620,343 634,350 620,357" fill="#b9a68e"/>
<line x1="860" y1="350" x2="900" y2="350" stroke="#b9a68e" stroke-width="3"/><polygon points="900,343 914,350 900,357" fill="#b9a68e"/>

<text x="600" y="520" text-anchor="middle" font-size="14.5" fill="#5c5c5c">One tap resolves a link; the passport itself lives in the cloud, not on the chip.</text>
</svg>
