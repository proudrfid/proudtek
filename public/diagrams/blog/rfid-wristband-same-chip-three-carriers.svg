<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The same RFID inlay in three different wristband carriers</title>
<desc id="d">One RFID inlay with an HF or UHF chip feeds three different carrier materials. In silicone the band is waterproof to IP68 and reusable for 2 to 5 years with premium molded or debossed branding. In woven fabric it is comfortable for 3 to 7 days with full-color sublimation and a one-time lock that resists transfer. In Tyvek it is the cheapest, single-use, with a 5 to 10 day lead time and HF chips only. The chip performs the same; the band decides comfort, waterproofing, lifespan and cost.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE CHIP, THREE CARRIERS</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">The same RFID inlay drops into very different bands.</text>

<!-- inlay -->
<rect x="110" y="282" width="210" height="116" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.8"/>
<text x="215" y="309" text-anchor="middle" font-size="14.5" font-weight="800" fill="#6d5a3a">RFID INLAY</text>
<rect x="168" y="320" width="94" height="46" rx="6" fill="none" stroke="#c39a5f" stroke-width="2"/>
<rect x="188" y="330" width="54" height="26" rx="3" fill="#6d5a3a"/>
<text x="215" y="388" text-anchor="middle" font-size="12.5" fill="#5c5c5c">same HF / UHF chip</text>

<!-- connectors -->
<path d="M324 330 L552 198" fill="none" stroke="#9aa6b6" stroke-width="2.2"/>
<path d="M552 198 l-15 0 l6 -11 Z" fill="#9aa6b6"/>
<path d="M324 340 L552 344" fill="none" stroke="#9aa6b6" stroke-width="2.2"/>
<path d="M552 344 l-13 -6 l0 12 Z" fill="#9aa6b6"/>
<path d="M324 350 L552 490" fill="none" stroke="#9aa6b6" stroke-width="2.2"/>
<path d="M552 490 l-6 -12 l-9 4 Z" fill="#9aa6b6"/>

<!-- silicone -->
<rect x="560" y="142" width="560" height="112" rx="14" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.6"/>
<text x="586" y="182" font-size="18" font-weight="800" letter-spacing="0.4" fill="#4a5568">SILICONE</text>
<text x="586" y="212" font-size="14.5" font-weight="700" fill="#291c0e">Waterproof IP68 · reusable 2-5 years</text>
<text x="586" y="235" font-size="13" fill="#5c5c5c">premium feel, molded or debossed branding</text>

<!-- fabric -->
<rect x="560" y="290" width="560" height="112" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="586" y="330" font-size="18" font-weight="800" letter-spacing="0.4" fill="#2c5454">WOVEN FABRIC</text>
<text x="586" y="360" font-size="14.5" font-weight="700" fill="#291c0e">Comfortable 3-7 days · full-color sublimation</text>
<text x="586" y="383" font-size="13" fill="#5c5c5c">one-time lock resists transfer between attendees</text>

<!-- tyvek -->
<rect x="560" y="438" width="560" height="112" rx="14" fill="#fbf4e6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="586" y="478" font-size="18" font-weight="800" letter-spacing="0.4" fill="#a07d43">TYVEK</text>
<text x="586" y="508" font-size="14.5" font-weight="700" fill="#291c0e">Cheapest · single-use · 5-10 day lead time</text>
<text x="586" y="531" font-size="13" fill="#5c5c5c">HF chips only — thin form factor</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The chip performs the same in all three — the band decides comfort, waterproofing, lifespan and cost.</text>
</svg>
