<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The six-step front-desk key-card troubleshooting ladder</title>
<desc id="d">A six-rung troubleshooting ladder for front-desk staff, worked top to bottom from cheapest and most likely to most escalated. Step one, re-encode the card, fixes about 70 percent of issues in about 60 seconds. Step two, try a fresh card to rule out physical damage. Step three, clean the door reader when many guests fail at one door. Step four, check the PMS encoding log for stay-extension and room-move mismatches. Step five, test the lock battery when the light is green but the motor does not move. Step six, escalate to the lock vendor and pull the lock-event log.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FRONT-DESK TROUBLESHOOTING · TOP-DOWN</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Cheapest and most likely first; the vendor hotline is the last rung, not the first.</text>

<line x1="150" y1="148" x2="150" y2="538" stroke="#cfe0e0" stroke-width="4"/>

<!-- step 1 -->
<rect x="110" y="118" width="985" height="60" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<circle cx="150" cy="148" r="24" fill="#3d6b6b"/>
<text x="150" y="156" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
<text x="200" y="144" font-size="17" font-weight="800" fill="#291c0e">Re-encode the card</text>
<text x="200" y="166" font-size="13.5" fill="#5c5c5c">Fixes about 70% of issues — 60 seconds from guest at desk to new key.</text>

<!-- step 2 -->
<rect x="110" y="196" width="985" height="60" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<circle cx="150" cy="226" r="24" fill="#3d6b6b"/>
<text x="150" y="234" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
<text x="200" y="222" font-size="17" font-weight="800" fill="#291c0e">Try a fresh card</text>
<text x="200" y="244" font-size="13.5" fill="#5c5c5c">Rules out physical damage; bin the suspect card, don't re-stock it.</text>

<!-- step 3 -->
<rect x="110" y="274" width="985" height="60" rx="12" fill="#e4f0f0" stroke="#bcdcdc" stroke-width="1.3"/>
<circle cx="150" cy="304" r="24" fill="#2c5454"/>
<text x="150" y="312" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
<text x="200" y="300" font-size="17" font-weight="800" fill="#291c0e">Clean the door reader</text>
<text x="200" y="322" font-size="13.5" fill="#5c5c5c">When several guests fail at the same door but work elsewhere.</text>

<!-- step 4 -->
<rect x="110" y="352" width="985" height="60" rx="12" fill="#e4f0f0" stroke="#bcdcdc" stroke-width="1.3"/>
<circle cx="150" cy="382" r="24" fill="#2c5454"/>
<text x="150" y="390" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">4</text>
<text x="200" y="378" font-size="17" font-weight="800" fill="#291c0e">Check the PMS encoding log</text>
<text x="200" y="400" font-size="13.5" fill="#5c5c5c">Catches stay-extension, room-move and rate-change mismatches.</text>

<!-- step 5 -->
<rect x="110" y="430" width="985" height="60" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<circle cx="150" cy="460" r="24" fill="#c39a5f"/>
<text x="150" y="468" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">5</text>
<text x="200" y="456" font-size="17" font-weight="800" fill="#291c0e">Test the lock battery</text>
<text x="200" y="478" font-size="13.5" fill="#5c5c5c">Green light but no motor movement? Swap the batteries.</text>

<!-- step 6 -->
<rect x="110" y="508" width="985" height="60" rx="12" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/>
<circle cx="150" cy="538" r="24" fill="#4a5568"/>
<text x="150" y="546" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">6</text>
<text x="200" y="534" font-size="17" font-weight="800" fill="#291c0e">Escalate to the lock vendor</text>
<text x="200" y="556" font-size="13.5" fill="#5c5c5c">Pull the lock-event log; don't swap the lock on a single fail.</text>

<text x="600" y="606" text-anchor="middle" font-size="15" fill="#4f4f4f">Most lockouts are solved by step two; the vendor hotline is the last rung, not the first.</text>
</svg>
