<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="acTitle acDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="acTitle">Anti-counterfeit NFC tap-to-verify for luxury bags</title>
  <desc id="acDesc">A three-step authentication flow. A luxury handbag carries an embedded NTAG 424 DNA secure NFC inlay. A shopper taps a phone to the bag, triggering SUN/CMAC authentication that signs a fresh cryptographic challenge on every tap. The backend verifies the signature: a genuine chip returns AUTHENTIC, while a cloned UID fails on the first tap and is REJECTED. Footer: luxury counterfeiting costs the industry 30 to 50 billion dollars a year; brands pilot on 3 to 5 thousand units over 6 to 12 months before a full-catalog rollout of 100 to 500 thousand units a year.</desc>

  <defs>
    <radialGradient id="acBg" cx="50%" cy="26%" r="84%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="acDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#291c0e"/>
      <stop offset="100%" stop-color="#6c5127"/>
    </linearGradient>
    <marker id="acArrow" markerWidth="10" markerHeight="10" refX="3" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#c39a5f"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#acBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <!-- Eyebrow + tagline -->
  <text x="600" y="66" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="3" fill="#6d5a3a">ANTI-COUNTERFEIT NFC FOR LUXURY BAGS</text>
  <text x="600" y="97" text-anchor="middle" font-size="17" fill="#4f4f4f">Tap-to-verify authentication a counterfeiter cannot clone</text>

  <!-- Stage numbers row baseline y ~= 120..430 -->

  <!-- ===================== Stage 1: the bag + embedded inlay ===================== -->
  <g>
    <rect x="60" y="126" width="330" height="300" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <!-- handbag -->
    <path d="M188 214 q37 -60 74 0" fill="none" stroke="#c39a5f" stroke-width="9" stroke-linecap="round"/>
    <path d="M168 214 h114 a14 14 0 0 1 14 14 l14 118 a16 16 0 0 1 -16 18 h-138 a16 16 0 0 1 -16 -18 l14 -118 a14 14 0 0 1 14 -14 Z" fill="#ffffff" stroke="#291c0e" stroke-width="4"/>
    <path d="M168 214 h114 a14 14 0 0 1 14 14 l4 34 h-164 l4 -34 a14 14 0 0 1 14 -14 Z" fill="#efe0bf" stroke="#291c0e" stroke-width="4"/>
    <rect x="213" y="250" width="24" height="20" rx="5" fill="none" stroke="#291c0e" stroke-width="3.5"/>
    <!-- embedded chip badge -->
    <g>
      <rect x="196" y="300" width="58" height="44" rx="8" fill="#eaf9fe" stroke="#1fcefb" stroke-width="2.5"/>
      <g fill="none" stroke="#1fcefb" stroke-width="2.5" stroke-linecap="round">
        <path d="M225 316 a9 9 0 0 1 0 12"/>
        <path d="M233 311 a17 17 0 0 1 0 22"/>
      </g>
      <circle cx="214" cy="322" r="3.5" fill="#1fcefb"/>
    </g>
    <text x="225" y="378" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Embedded secure inlay</text>
    <text x="225" y="404" text-anchor="middle" font-size="15.5" fill="#6d5a3a">NTAG 424 DNA · leather-grade</text>
    <circle cx="90" cy="126" r="19" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/><text x="90" y="133" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
  </g>

  <line x1="396" y1="276" x2="440" y2="276" stroke="#c39a5f" stroke-width="4" stroke-linecap="round" marker-end="url(#acArrow)"/>

  <!-- ===================== Stage 2: the tap ===================== -->
  <g>
    <rect x="446" y="126" width="308" height="300" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <!-- phone -->
    <rect x="556" y="196" width="90" height="164" rx="16" fill="#ffffff" stroke="#291c0e" stroke-width="4"/>
    <rect x="568" y="212" width="66" height="118" rx="6" fill="#f7f0e2"/>
    <circle cx="601" cy="346" r="6" fill="#291c0e"/>
    <!-- NFC tap arcs radiating left toward the bag -->
    <g fill="none" stroke="#1fcefb" stroke-width="4" stroke-linecap="round">
      <path d="M540 246 a34 34 0 0 0 0 68"/>
      <path d="M522 232 a54 54 0 0 0 0 96"/>
      <path d="M504 218 a74 74 0 0 0 0 124"/>
    </g>
    <circle cx="551" cy="280" r="5" fill="#1fcefb"/>
    <text x="600" y="392" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">One tap to verify</text>
    <text x="600" y="416" text-anchor="middle" font-size="15.5" fill="#6d5a3a">SUN / CMAC · fresh signature each tap</text>
    <circle cx="476" cy="126" r="19" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/><text x="476" y="133" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
  </g>

  <line x1="760" y1="276" x2="804" y2="276" stroke="#c39a5f" stroke-width="4" stroke-linecap="round" marker-end="url(#acArrow)"/>

  <!-- ===================== Stage 3: the verdict ===================== -->
  <g>
    <rect x="810" y="126" width="330" height="300" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="975" y="170" text-anchor="middle" font-size="14.5" font-weight="700" letter-spacing="1.5" fill="#6d5a3a">BACKEND VERIFIES THE SIGNATURE</text>
    <!-- genuine -->
    <rect x="838" y="188" width="274" height="88" rx="14" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2.5"/>
    <circle cx="878" cy="232" r="21" fill="#1f6f3a"/>
    <path d="M868 232 l7 8 l14 -16" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="912" y="226" font-size="21" font-weight="800" fill="#1f6f3a">AUTHENTIC</text>
    <text x="912" y="252" font-size="14.5" fill="#3f6b4e">genuine chip · valid signature</text>
    <!-- clone rejected -->
    <rect x="838" y="286" width="274" height="88" rx="14" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2.5"/>
    <circle cx="878" cy="330" r="21" fill="#8b2d2d"/>
    <path d="M870 322 l16 16 M886 322 l-16 16" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <text x="912" y="324" font-size="21" font-weight="800" fill="#8b2d2d">REJECTED</text>
    <text x="912" y="350" font-size="14.5" fill="#7a4242">cloned UID · fails first tap</text>
    <circle cx="840" cy="126" r="19" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/><text x="840" y="133" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
  </g>

  <!-- ===================== Footer stat band ===================== -->
  <rect x="60" y="470" width="1080" height="128" rx="16" fill="url(#acDark)"/>
  <g fill="#ffffff" text-anchor="middle">
    <text x="243" y="524" font-size="34" font-weight="800" fill="#d4a755">$30–50B</text>
    <text x="243" y="556" font-size="15.5" fill="#f4efe4">counterfeit market, every year</text>
    <text x="600" y="524" font-size="34" font-weight="800" fill="#d4a755">6–12 mo · 3–5K</text>
    <text x="600" y="556" font-size="15.5" fill="#f4efe4">pilot units before committing</text>
    <text x="957" y="524" font-size="34" font-weight="800" fill="#d4a755">100K–500K / yr</text>
    <text x="957" y="556" font-size="15.5" fill="#f4efe4">full-catalog rollout volume</text>
  </g>
  <line x1="423" y1="500" x2="423" y2="568" stroke="#c39a5f" stroke-width="1.5" opacity="0.5"/>
  <line x1="777" y1="500" x2="777" y2="568" stroke="#c39a5f" stroke-width="1.5" opacity="0.5"/>

  <!-- Legend -->
  <g>
    <rect x="512" y="616" width="176" height="30" rx="15" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.5"/>
    <circle cx="535" cy="631" r="4" fill="#1fcefb"/>
    <path d="M545 631 a7 7 0 0 1 12 0" fill="none" stroke="#1fcefb" stroke-width="2.5" stroke-linecap="round"/>
    <text x="571" y="636" font-size="12.5" font-weight="600" fill="#177a92">NFC tap-to-verify</text>
  </g>
</svg>
