<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="lbTitle lbDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="lbTitle">Proud Tek team — three functions, engineering-first</title>
  <desc id="lbDesc">Organisation model: Shenzhen Proud Tek Co., Ltd (specification, chip sourcing and QC owner; production on contracted partner lines) over four functional areas — RF / production engineering, independent quality control, sales / account engineering and supply chain — and one account engineer who owns each buyer program end to end, from RFQ to reorder.</desc>

  <rect width="1200" height="675" fill="#f4efe4"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="70" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="2.5" fill="#6d5a3a">ENGINEERING-FIRST · FUNCTIONS, NOT NAMES · SINCE 2008</text>

  <!-- Founder node -->
  <rect x="410" y="96" width="380" height="80" rx="16" fill="#291c0e"/>
  <text x="600" y="130" text-anchor="middle" font-size="24" font-weight="800" fill="#d4a755">Shenzhen Proud Tek Co., Ltd</text>
  <text x="600" y="156" text-anchor="middle" font-size="16" fill="#e8ddc7">Specification · chip sourcing · QC sign-off</text>

  <!-- connectors: bus -->
  <line x1="600" y1="176" x2="600" y2="212" stroke="#c39a5f" stroke-width="3"/>
  <line x1="185" y1="212" x2="1015" y2="212" stroke="#c39a5f" stroke-width="3"/>
  <line x1="185" y1="212" x2="185" y2="246" stroke="#c39a5f" stroke-width="3"/>
  <line x1="461" y1="212" x2="461" y2="246" stroke="#c39a5f" stroke-width="3"/>
  <line x1="739" y1="212" x2="739" y2="246" stroke="#c39a5f" stroke-width="3"/>
  <line x1="1015" y1="212" x2="1015" y2="246" stroke="#c39a5f" stroke-width="3"/>

  <!-- 4 functional pillars -->
  <g>
    <rect x="60" y="246" width="250" height="104" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="185" y="292" text-anchor="middle" font-size="19" font-weight="700" fill="#291c0e">RF / production eng.</text>
    <text x="185" y="318" text-anchor="middle" font-size="14" fill="#6d5a3a">spec &amp; first article, pilot→reorder</text>
  </g>
  <g>
    <rect x="336" y="246" width="250" height="104" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="461" y="292" text-anchor="middle" font-size="19" font-weight="700" fill="#291c0e">Quality — independent</text>
    <text x="461" y="318" text-anchor="middle" font-size="14" fill="#6d5a3a">can't be overridden by ship date</text>
  </g>
  <g>
    <rect x="614" y="246" width="250" height="104" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="739" y="292" text-anchor="middle" font-size="19" font-weight="700" fill="#291c0e">Sales / account eng.</text>
    <text x="739" y="318" text-anchor="middle" font-size="14" fill="#6d5a3a">one owner per program</text>
  </g>
  <g>
    <rect x="890" y="246" width="250" height="104" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="1015" y="292" text-anchor="middle" font-size="19" font-weight="700" fill="#291c0e">Supply chain</text>
    <text x="1015" y="318" text-anchor="middle" font-size="14" fill="#6d5a3a">chip allocation &amp; logistics</text>
  </g>

  <!-- Program thread band -->
  <rect x="60" y="404" width="1080" height="168" rx="16" fill="#fbf7ef" stroke="#e4c98f" stroke-width="2.5"/>
  <text x="600" y="446" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1" fill="#6d5a3a">ONE ACCOUNT ENGINEER OWNS YOUR PROGRAM — END TO END</text>

  <line x1="150" y1="500" x2="1050" y2="500" stroke="#c39a5f" stroke-width="3"/>
  <g fill="#291c0e">
    <circle cx="150" cy="500" r="10"/><circle cx="375" cy="500" r="10"/><circle cx="600" cy="500" r="10"/><circle cx="825" cy="500" r="10"/><circle cx="1050" cy="500" r="10"/>
  </g>
  <g font-size="16" fill="#291c0e" text-anchor="middle" font-weight="600">
    <text x="150" y="540">RFQ</text>
    <text x="375" y="540">Samples</text>
    <text x="600" y="540">Pilot</text>
    <text x="825" y="540">Production</text>
    <text x="1050" y="540">Reorder</text>
  </g>

  <text x="600" y="616" text-anchor="middle" font-size="17" fill="#6d5a3a">The engineer who scopes your program is the one who runs it — no hand-off to junior sales.</text>
</svg>
