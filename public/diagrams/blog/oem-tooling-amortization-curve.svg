<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">OEM tooling cost per unit falls as lifetime volume rises, with a 500K-1M breakeven</title>
<desc id="d">A decay curve plotting OEM tooling cost per unit against lifetime volume on a logarithmic axis. At 100K units the per-unit tooling premium is about 0.55 dollars, at 1M units about 0.055 dollars, and at 10M units about 0.0055 dollars. A shaded breakeven band sits between 500K and 1M units: below it white-label with custom print is cheaper, above it OEM economics work. Example tooling of 55,000 dollars is the sum of a 5,000 dollar antenna, a 20,000 dollar mould and a 30,000 dollar encoding setup.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">OEM TOOLING ONLY PENCILS OUT AT VOLUME</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Total tooling divided by lifetime units — the per-unit premium collapses as volume rises.</text>

<!-- breakeven band -->
<rect x="538" y="150" width="102" height="350" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="589" y="140" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">BREAKEVEN</text>
<text x="589" y="472" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">500K–1M</text>

<!-- axes -->
<line x1="200" y1="150" x2="200" y2="500" stroke="#cdc4b2" stroke-width="2"/>
<line x1="200" y1="500" x2="1080" y2="500" stroke="#cdc4b2" stroke-width="2"/>
<text x="196" y="140" text-anchor="end" font-size="12.5" font-weight="800" letter-spacing="0.4" fill="#8a7a55">$ / UNIT</text>
<text x="1080" y="544" text-anchor="end" font-size="12.5" font-weight="800" letter-spacing="0.4" fill="#8a7a55">LIFETIME VOLUME →</text>

<!-- vertical guides -->
<line x1="300" y1="150" x2="300" y2="500" stroke="#efe7d6" stroke-width="1.5"/>
<line x1="980" y1="150" x2="980" y2="500" stroke="#efe7d6" stroke-width="1.5"/>

<!-- curve -->
<path d="M300,214 Q470,372 640,404 Q810,438 980,470" fill="none" stroke="#4a5568" stroke-width="3.4" stroke-linecap="round"/>

<!-- points -->
<circle cx="300" cy="214" r="8" fill="#c39a5f" stroke="#ffffff" stroke-width="2"/>
<text x="300" y="198" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4453">$0.55 / unit</text>
<circle cx="640" cy="404" r="8" fill="#c39a5f" stroke="#ffffff" stroke-width="2"/>
<text x="662" y="398" font-size="15" font-weight="800" fill="#3a4453">$0.055 / unit</text>
<circle cx="980" cy="470" r="8" fill="#1f6f3a" stroke="#ffffff" stroke-width="2"/>
<text x="980" y="454" text-anchor="middle" font-size="15" font-weight="800" fill="#1f6f3a">$0.0055 / unit</text>

<!-- x labels -->
<text x="300" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#4f4f4f">100K</text>
<text x="640" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#4f4f4f">1M</text>
<text x="980" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#4f4f4f">10M</text>

<!-- zone labels -->
<text x="384" y="432" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a8a8a">white-label with</text>
<text x="384" y="452" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a8a8a">custom print is cheaper</text>
<text x="828" y="350" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f6f3a">OEM economics work</text>

<!-- tooling breakdown footer -->
<rect x="64" y="556" width="1072" height="72" rx="13" fill="#f1f3f7" stroke="#c7cdd8" stroke-width="1.6"/>
<text x="92" y="586" font-size="15" font-weight="800" fill="#3a4453">EXAMPLE TOOLING = $55K</text>
<text x="92" y="608" font-size="13" fill="#4a5568">antenna $5K + mould $20K + encoding setup $30K — model 3-year volume at half the sales-team forecast.</text>
<text x="1112" y="597" text-anchor="end" font-size="13.5" font-weight="700" fill="#4a5568">÷ lifetime units = your real premium</text>
</svg>
