<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Key ceremony and audit chain — how per-fob AES keys are born</title>
  <desc id="d">Issuance chain: the customer master key stays in the HSM; NXP AN10922 CMAC diversification derives a unique AES-128 application key per fob from master key plus UID; production emits a signed per-lot key-derivation log tied to the order and UID range, with remote-attended key ceremonies available.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Every fob gets its own key — and a paper trail</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">AN10922 diversification means one stolen fob never unlocks the estate</text>
  <g transform="translate(70,170)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="20" width="280" height="140" rx="12" fill="#2c5454"/>
    <text x="24" y="58" font-family="Georgia, serif" font-size="17" fill="#f8f6f1">Master key</text>
    <text x="24" y="88" font-size="13" fill="#dfe9e7">never leaves the HSM</text>
    <text x="24" y="112" font-size="13" fill="#dfe9e7">customer-controlled</text>
    <rect x="360" y="20" width="300" height="140" rx="12" fill="#eef2f0" stroke="#2c5454" stroke-width="2.5"/>
    <text x="384" y="58" font-family="Georgia, serif" font-size="17" fill="#2c5454">AN10922 derivation</text>
    <text x="384" y="88" font-size="13" fill="#2c5454">AES-128 CMAC over master + UID</text>
    <text x="384" y="112" font-size="13" fill="#2c5454">unique application key per fob</text>
    <rect x="740" y="20" width="300" height="140" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="764" y="58" font-family="Georgia, serif" font-size="17" fill="#291c0e">Signed lot log</text>
    <text x="764" y="88" font-size="13" fill="#2c5454">tied to production order + UID range</text>
    <text x="764" y="112" font-size="13" fill="#2c5454">your auditor's evidence pack</text>
    <path d="M 285 90 L 353 90" stroke="#6d5a3a" stroke-width="2.5" marker-end="url(#a8)"/>
    <path d="M 665 90 L 733 90" stroke="#6d5a3a" stroke-width="2.5" marker-end="url(#a8)"/>
    <defs><marker id="a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d5a3a"/></marker></defs>
  </g>
  <g transform="translate(70,420)">
    <rect x="0" y="0" width="1050" height="130" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="18" fill="#2c5454">Remote-attended key ceremony</text>
    <text x="24" y="72" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Your security officer witnesses the key-loading session remotely — the ceremony record joins the lot log</text>
    <text x="24" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Per-site AIDs for access-only builds · dual-application access + transit payloads on request</text>
  </g>
</svg>
