<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Source tagging versus DC tagging per-unit economics</title>
<desc id="d">A side-by-side cost comparison. Source tagging at the factory costs five to twelve cents per unit, rides the existing pack line, builds encoding QC in, and gives the supplier its own RFID visibility. DC tagging at the distribution center costs twenty to fifty cents per unit, requires opening, tagging and repacking by hand, adds a second error-prone encoding step, and adds 24 to 48 hours dock-to-stock. Break-even sits near 200,000 units per year; at one million units a year the gap is 150,000 to 400,000 dollars.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TAGGING ECONOMICS · SOURCE vs DC</text>
<text x="600" y="95" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">Where the tag goes on changes the math</text>
<text x="600" y="126" text-anchor="middle" font-size="15" fill="#4f4f4f">Walmart accepts both; the per-unit gap is why over 95% of apparel is source-tagged as of 2026.</text>

<rect x="88" y="176" width="470" height="288" rx="16" fill="#ffffff" stroke="#cfd6df" stroke-width="1.8"/><rect x="88" y="176" width="470" height="9" rx="4.5" fill="#4a5568"/>
<text x="323" y="220" text-anchor="middle" font-size="18" font-weight="800" fill="#3a4453">SOURCE TAG</text>
<text x="323" y="242" text-anchor="middle" font-size="13" fill="#5c5c5c">at the factory</text>
<text x="323" y="300" text-anchor="middle" font-size="46" font-weight="800" fill="#3a4453">$0.05–0.12</text>
<text x="323" y="326" text-anchor="middle" font-size="14" fill="#4f4f4f">per unit</text>
<circle cx="130" cy="366" r="3.5" fill="#4a5568"/><text x="146" y="371" font-size="13.5" fill="#291c0e">Rides the existing pack line</text>
<circle cx="130" cy="398" r="3.5" fill="#4a5568"/><text x="146" y="403" font-size="13.5" fill="#291c0e">Encoding QC built into production</text>
<circle cx="130" cy="430" r="3.5" fill="#4a5568"/><text x="146" y="435" font-size="13.5" fill="#291c0e">Your own warehouses get visibility too</text>

<rect x="642" y="176" width="470" height="288" rx="16" fill="#fdf7f6" stroke="#e6c9c9" stroke-width="1.8"/><rect x="642" y="176" width="470" height="9" rx="4.5" fill="#b3564a"/>
<text x="877" y="220" text-anchor="middle" font-size="18" font-weight="800" fill="#8b2d2d">DC TAG</text>
<text x="877" y="242" text-anchor="middle" font-size="13" fill="#5c5c5c">at the distribution center</text>
<text x="877" y="300" text-anchor="middle" font-size="46" font-weight="800" fill="#8b2d2d">$0.20–0.50</text>
<text x="877" y="326" text-anchor="middle" font-size="14" fill="#4f4f4f">per unit</text>
<circle cx="684" cy="366" r="3.5" fill="#b3564a"/><text x="700" y="371" font-size="13.5" fill="#291c0e">Open, tag and repack by hand</text>
<circle cx="684" cy="398" r="3.5" fill="#b3564a"/><text x="700" y="403" font-size="13.5" fill="#291c0e">A second encoding step, new errors</text>
<circle cx="684" cy="430" r="3.5" fill="#b3564a"/><text x="700" y="435" font-size="13.5" fill="#291c0e">+24–48 h dock-to-stock delay</text>

<circle cx="600" cy="300" r="30" fill="#ffffff" stroke="#d3dae3" stroke-width="1.8"/><text x="600" y="307" text-anchor="middle" font-size="19" font-weight="800" fill="#6d5a3a">vs</text>

<rect x="140" y="496" width="440" height="50" rx="14" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.4"/>
<text x="360" y="527" text-anchor="middle" font-size="15" font-weight="700" fill="#3a4453">Break-even ≈ 200K units / year</text>
<rect x="620" y="496" width="440" height="50" rx="14" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.4"/>
<text x="840" y="527" text-anchor="middle" font-size="15" font-weight="700" fill="#3a4453">1M units/yr → $150K–400K/yr gap</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">DC tagging means opening the carton you just sealed to tag it by hand — exactly as economical as it sounds.</text>
</svg>
