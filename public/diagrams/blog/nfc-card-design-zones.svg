<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Design zones of an NFC business card — the radio has opinions</title>
<desc id="d">Front and back layouts. Front: brand identity and contact info, with a small tap icon placed directly over the antenna position. The antenna window zone must stay free of metallic ink, foil stamping and thick embossing, which can attenuate read range by 50 percent or more. Back: the NFC prompt and a QR-code fallback for phones without NFC. Footer: test the production card on at least three phone models before approving the run.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE RADIO HAS OPINIONS ABOUT FOIL</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Two sides, four zones, one rule: keep the window clear</text>

<text x="330" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#4f4f4f">FRONT — identity</text>
<rect x="120" y="180" width="420" height="264" rx="18" fill="#f9f1e2" stroke="#c39a5f" stroke-width="2.5"/>
<text x="150" y="240" font-size="22" font-weight="800" fill="#291c0e">Your Name</text>
<text x="150" y="268" font-size="13.5" fill="#4f4f4f">Title · Company</text>
<text x="150" y="292" font-size="13.5" fill="#4f4f4f">phone · email</text>
<rect x="404" y="330" width="106" height="84" rx="12" fill="#eef5f5" stroke="#2c5454" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="457" cy="362" r="12" fill="none" stroke="#2c5454" stroke-width="2.2"/>
<circle cx="457" cy="362" r="4.5" fill="#2c5454"/>
<text x="457" y="398" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">tap here</text>
<path d="M 457 444 v 44" stroke="#2c5454" stroke-width="2"/>
<path d="M 457 488 l -6 -10 h 12 z" fill="#2c5454"/>
<rect x="286" y="494" width="342" height="66" rx="12" fill="#eef5f5" stroke="#2c5454" stroke-width="1.5"/>
<text x="457" y="522" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">antenna window · keep clear</text>
<text x="457" y="544" text-anchor="middle" font-size="12" fill="#4f4f4f">no metallic ink · no foil · no thick embossing here</text>

<text x="870" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#4f4f4f">BACK — instruction + fallback</text>
<rect x="660" y="180" width="420" height="264" rx="18" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
<circle cx="800" cy="290" r="26" fill="none" stroke="#2c5454" stroke-width="2.5"/>
<circle cx="800" cy="290" r="10" fill="#2c5454"/>
<text x="800" y="348" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Tap with your phone</text>
<rect x="922" y="252" width="96" height="96" rx="8" fill="#ffffff" stroke="#291c0e" stroke-width="2"/>
<g fill="#291c0e">
<rect x="934" y="264" width="22" height="22"/><rect x="984" y="264" width="22" height="22"/><rect x="934" y="314" width="22" height="22"/>
<rect x="966" y="296" width="10" height="10"/><rect x="984" y="302" width="10" height="10"/><rect x="996" y="314" width="10" height="10"/><rect x="966" y="326" width="10" height="10"/>
</g>
<text x="970" y="372" text-anchor="middle" font-size="12" fill="#4f4f4f">QR fallback — for the</text>
<text x="970" y="390" text-anchor="middle" font-size="12" fill="#4f4f4f">NFC-less and the cautious</text>

<rect x="660" y="470" width="420" height="90" rx="14" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="870" y="504" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">Foil / spot UV / embossing over the antenna:</text>
<text x="870" y="530" text-anchor="middle" font-size="13" fill="#8b2d2d">read range can drop 50%+ — the beautiful way to fail</text>
<text x="600" y="620" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Before the full run: test the real production card on three phones — recent iPhone, flagship Android, mid-range Android.</text>
</svg>
