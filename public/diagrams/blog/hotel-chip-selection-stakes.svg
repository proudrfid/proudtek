<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Why the hotel key card chip choice matters: mixed lock estate and the three failure modes</title>
<desc id="d">Left, one 300-room property with two lock vintages: renovated suites on ASSA ABLOY Visionline running DESFire EV3, and guest floors on Saflok RT running Classic 1K. Right, the three ways the wrong chip fails: a failed pilot test where the sample will not read on the target lock, a security audit finding where Crypto-1 is flagged non-compliant, and dead card stock that cannot be re-used after a lock upgrade. Verdict: the chip is the cheapest part of the card and the easiest thing to get expensively wrong.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY THE CHIP CHOICE MATTERS</text>

<text x="275" y="112" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.7" fill="#8a6d34">ONE ESTATE · TWO VINTAGES</text>
<text x="855" y="112" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.7" fill="#8a6d34">GET THE CHIP WRONG, AND —</text>

<!-- left: mixed estate -->
<rect x="125" y="132" width="300" height="150" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<rect x="345" y="152" width="52" height="38" rx="5" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<rect x="355" y="162" width="18" height="14" rx="2" fill="#3d6b6b"/>
<text x="150" y="170" font-size="16" font-weight="800" fill="#2c5454">Renovated suites</text>
<text x="150" y="196" font-size="13" fill="#4f4f4f">ASSA ABLOY Visionline</text>
<text x="150" y="252" font-size="20" font-weight="800" fill="#2c5454">DESFire EV3</text>

<line x1="275" y1="284" x2="275" y2="300" stroke="#c9bfae" stroke-width="2" stroke-dasharray="3 5"/>

<rect x="125" y="302" width="300" height="150" rx="14" fill="#f4f6f9" stroke="#4a5568" stroke-width="1.5"/>
<rect x="345" y="322" width="52" height="38" rx="5" fill="#ffffff" stroke="#4a5568" stroke-width="1.8"/>
<rect x="355" y="332" width="18" height="14" rx="2" fill="#8895a7"/>
<text x="150" y="340" font-size="16" font-weight="800" fill="#2f3846">Guest floors</text>
<text x="150" y="366" font-size="13" fill="#5c5c5c">Saflok RT</text>
<text x="150" y="422" font-size="20" font-weight="800" fill="#2f3846">Classic 1K</text>

<text x="275" y="484" text-anchor="middle" font-size="13.5" fill="#5c5c5c">One 300-room property, two lock vintages.</text>

<!-- right: three failure modes -->
<rect x="600" y="130" width="510" height="96" rx="12" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="600" y="130" width="9" height="96" rx="4" fill="#c39a5f"/>
<circle cx="644" cy="178" r="16" fill="#c39a5f"/>
<text x="644" y="184" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
<text x="678" y="171" font-size="17" font-weight="800" fill="#291c0e">Failed pilot test</text>
<text x="678" y="197" font-size="13.5" fill="#5c5c5c">the sample won't read on the target lock</text>

<rect x="600" y="242" width="510" height="96" rx="12" fill="#fbf2f0" stroke="#e8cfca" stroke-width="1.3"/>
<rect x="600" y="242" width="9" height="96" rx="4" fill="#8b2d2d"/>
<circle cx="644" cy="290" r="16" fill="#8b2d2d"/>
<text x="644" y="296" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<text x="678" y="283" font-size="17" font-weight="800" fill="#291c0e">Security audit finding</text>
<text x="678" y="309" font-size="13.5" fill="#8b2d2d">Crypto-1 flagged non-compliant</text>

<rect x="600" y="354" width="510" height="96" rx="12" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="600" y="354" width="9" height="96" rx="4" fill="#4a5568"/>
<circle cx="644" cy="402" r="16" fill="#4a5568"/>
<text x="644" y="408" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<text x="678" y="395" font-size="17" font-weight="800" fill="#291c0e">Dead card stock</text>
<text x="678" y="421" font-size="13.5" fill="#5c5c5c">no re-use after a lock upgrade</text>

<rect x="70" y="516" width="1060" height="118" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="562" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">The chip is the cheapest part of the card — and the easiest thing to get expensively wrong.</text>
<text x="600" y="596" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Choose it against the lock roadmap, not just today's price, and the other three problems never start.</text>
</svg>
