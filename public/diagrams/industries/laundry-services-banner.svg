<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="lsTitle lsDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="lsTitle">The laundry-services industry on RFID, mapped</title>
  <desc id="lsDesc">An industry map. Top row: the four segments RFID covers — hotel linen, healthcare textile, uniform rental and food and beverage. Middle: the tier-1 operators that run them — US (Cintas, Aramark, Alsco, UniFirst, Mission Linen), EU (Elis, Initial, Lindström, Mewa, CWS) and healthcare specialists (ImageFIRST, Crothall). A dark steel footer states what RFID delivers here: 2–3 second bag count, 20–40% less linen loss, TRSA / ETSA compliance and 6–12 month ROI.</desc>

  <defs>
    <radialGradient id="lsGlow" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="lsSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#3a4656"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#lsGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="70" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2.5" fill="#6d5a3a">THE LAUNDRY-SERVICES INDUSTRY, MAPPED</text>

  <!-- ===================== Segments ===================== -->
  <text x="72" y="106" font-size="14" font-weight="700" letter-spacing="1.5" fill="#4a5568">SEGMENTS RFID COVERS</text>
  <line x1="286" y1="101" x2="1128" y2="101" stroke="#e5e9ed" stroke-width="2"/>

  <!-- Card 0: Hotel linen -->
  <g>
    <rect x="72" y="118" width="240" height="152" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="192" cy="168" r="27" fill="#4a5568"/>
    <rect x="178" y="158" width="28" height="6" rx="2" fill="#ffffff"/>
    <rect x="178" y="167" width="28" height="6" rx="2" fill="#ffffff"/>
    <rect x="178" y="176" width="28" height="6" rx="2" fill="#ffffff"/>
    <path d="M214 152 a13 13 0 0 1 0 20" fill="none" stroke="#1fcefb" stroke-width="2.5" stroke-linecap="round"/>
    <text x="192" y="224" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Hotel linen</text>
    <text x="192" y="247" text-anchor="middle" font-size="12.5" fill="#6d5a3a">sheets · towels · robes</text>
  </g>
  <!-- Card 1: Healthcare textile -->
  <g>
    <rect x="344" y="118" width="240" height="152" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="464" cy="168" r="27" fill="#4a5568"/>
    <rect x="460" y="154" width="8" height="28" rx="2" fill="#ffffff"/>
    <rect x="450" y="164" width="28" height="8" rx="2" fill="#ffffff"/>
    <path d="M486 152 a13 13 0 0 1 0 20" fill="none" stroke="#1fcefb" stroke-width="2.5" stroke-linecap="round"/>
    <text x="464" y="224" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Healthcare textile</text>
    <text x="464" y="247" text-anchor="middle" font-size="12.5" fill="#6d5a3a">scrubs · gowns · drapes</text>
  </g>
  <!-- Card 2: Uniform rental -->
  <g>
    <rect x="616" y="118" width="240" height="152" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="736" cy="168" r="27" fill="#4a5568"/>
    <path d="M736 154 l9 4 l6 4 l-4 7 l-4 -2 v18 h-14 v-18 l-4 2 l-4 -7 l6 -4 z" fill="#ffffff"/>
    <path d="M758 152 a13 13 0 0 1 0 20" fill="none" stroke="#1fcefb" stroke-width="2.5" stroke-linecap="round"/>
    <text x="736" y="224" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Uniform rental</text>
    <text x="736" y="247" text-anchor="middle" font-size="12.5" fill="#6d5a3a">workwear · chef · lab coat</text>
  </g>
  <!-- Card 3: Food & beverage -->
  <g>
    <rect x="888" y="118" width="240" height="152" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="1008" cy="168" r="27" fill="#4a5568"/>
    <circle cx="1000" cy="162" r="7" fill="#ffffff"/>
    <circle cx="1016" cy="162" r="7" fill="#ffffff"/>
    <circle cx="1008" cy="157" r="8" fill="#ffffff"/>
    <rect x="997" y="170" width="22" height="9" rx="2" fill="#ffffff"/>
    <path d="M1030 152 a13 13 0 0 1 0 20" fill="none" stroke="#1fcefb" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1008" y="224" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Food &amp; beverage</text>
    <text x="1008" y="247" text-anchor="middle" font-size="12.5" fill="#6d5a3a">aprons · napkins · linen</text>
  </g>

  <!-- ===================== Operators ===================== -->
  <text x="72" y="302" font-size="14" font-weight="700" letter-spacing="1.5" fill="#4a5568">SERVED BY TIER-1 OPERATORS</text>
  <line x1="378" y1="297" x2="1128" y2="297" stroke="#e5e9ed" stroke-width="2"/>
  <rect x="72" y="314" width="1056" height="104" rx="16" fill="#eef1f4" stroke="#cdd7de" stroke-width="2"/>

  <!-- row 1: US -->
  <rect x="96" y="336" width="42" height="24" rx="12" fill="#4a5568"/>
  <text x="117" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">US</text>
  <text x="150" y="353" font-size="15.5" fill="#291c0e">Cintas · Aramark · Alsco · UniFirst · Mission Linen</text>

  <!-- row 2: EU + Healthcare -->
  <rect x="96" y="374" width="42" height="24" rx="12" fill="#4a5568"/>
  <text x="117" y="391" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">EU</text>
  <text x="150" y="391" font-size="15.5" fill="#291c0e">Elis · Initial · Lindström · Mewa · CWS</text>
  <rect x="590" y="374" width="104" height="24" rx="12" fill="#2d6a4f"/>
  <text x="642" y="391" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">HEALTHCARE</text>
  <text x="706" y="391" font-size="15.5" fill="#291c0e">ImageFIRST · Crothall</text>

  <!-- ===================== Outcomes footer ===================== -->
  <rect x="72" y="446" width="1056" height="150" rx="16" fill="url(#lsSteel)"/>
  <text x="600" y="480" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#cfd8e2">WHAT RFID DELIVERS HERE</text>
  <g text-anchor="middle">
    <text x="210" y="530" font-size="26" font-weight="800" fill="#ffffff">2–3 sec</text>
    <text x="210" y="558" font-size="13" fill="#c7d0da">bag-level count</text>
    <text x="470" y="530" font-size="26" font-weight="800" fill="#ffffff">20–40%</text>
    <text x="470" y="558" font-size="13" fill="#c7d0da">less linen loss</text>
    <text x="730" y="530" font-size="24" font-weight="800" fill="#ffffff">TRSA · ETSA</text>
    <text x="730" y="558" font-size="13" fill="#c7d0da">compliant on every item</text>
    <text x="990" y="530" font-size="26" font-weight="800" fill="#ffffff">6–12 mo</text>
    <text x="990" y="558" font-size="13" fill="#c7d0da">ROI payback</text>
  </g>

  <text x="600" y="628" text-anchor="middle" font-size="14.5" fill="#6d5a3a">The how-to lives on the linked management, tracking and tags pages.</text>
</svg>
