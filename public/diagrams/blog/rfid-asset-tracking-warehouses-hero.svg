<path d="M 244 232 A 18 18 0 0 1 244 268" fill="none" stroke="#9aa3ad" stroke-width="2"/>
<rect x="82" y="318" width="184" height="36" rx="18" fill="#eef1f5" stroke="#c4ccd6" stroke-width="1.4"/>
