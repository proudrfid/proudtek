<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Bolt tag read ladder — inspection distances by method</title>
<desc id="d">Horizontal distance chart comparing man-lift, drone and handheld read ranges against a steel truss, with read-rate and bridge inspection cadence notes.</desc>
<rect width="1200" height="675" fill="#f8f6f1"/>
<text x="60" y="64" font-family="Georgia, serif" font-size="34" fill="#291c0e">Reading a bridge without climbing it</text>
<text x="60" y="98" font-family="Verdana, sans-serif" font-size="16" fill="#6d5a3a">Every bolt answers from the distance your inspection method can reach</text>
<g stroke="#6d5a3a" stroke-width="2.5">
<line x1="140" y1="180" x2="140" y2="330"/>
<line x1="118" y1="200" x2="162" y2="180"/>
<line x1="118" y1="230" x2="162" y2="210"/>
<line x1="118" y1="260" x2="162" y2="240"/>
<line x1="118" y1="290" x2="162" y2="270"/>
<line x1="118" y1="320" x2="162" y2="300"/>
<line x1="118" y1="180" x2="118" y2="330"/>
</g>
<circle cx="129" cy="255" r="6" fill="#2c5454"/>
<text x="129" y="360" font-family="Verdana, sans-serif" font-size="13" fill="#6d5a3a" text-anchor="middle">tagged truss joint</text>
<g font-family="Verdana, sans-serif">
<line x1="200" y1="420" x2="1120" y2="420" stroke="#c39a5f" stroke-width="1.5"/>
<text x="200" y="448" font-size="12.5" fill="#6d5a3a">0 m</text>
<text x="384" y="448" font-size="12.5" fill="#6d5a3a">1 m</text>
<text x="568" y="448" font-size="12.5" fill="#6d5a3a">2 m</text>
<text x="752" y="448" font-size="12.5" fill="#6d5a3a">3 m</text>
<text x="936" y="448" font-size="12.5" fill="#6d5a3a">4 m</text>
<text x="1108" y="448" font-size="12.5" fill="#6d5a3a">5 m</text>
<rect x="292" y="190" width="184" height="44" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<text x="384" y="217" font-size="14" fill="#291c0e" text-anchor="middle">man-lift · 0.5-1.5 m</text>
<rect x="292" y="190" width="184" height="6" fill="#c39a5f"/>
<rect x="384" y="262" width="368" height="44" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<text x="568" y="289" font-size="14" fill="#291c0e" text-anchor="middle">drone flyby · 1-3 m</text>
<rect x="384" y="262" width="368" height="6" fill="#3d6b6b"/>
<rect x="568" y="334" width="368" height="44" rx="8" fill="#eef2f0" stroke="#2c5454" stroke-width="2.5"/>
<text x="752" y="361" font-size="14" fill="#291c0e" text-anchor="middle">handheld sweep · 2-4 m</text>
<rect x="568" y="334" width="368" height="6" fill="#2c5454"/>
<line x1="292" y1="234" x2="292" y2="420" stroke="#c39a5f" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="936" y1="378" x2="936" y2="420" stroke="#2c5454" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="60" y="500" width="512" height="100" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="84" y="532" font-size="26" font-family="Georgia, serif" fill="#6d5a3a">99.5 percent or better</text>
<text x="84" y="560" font-size="13" fill="#6d5a3a">post-installation read-rate — handheld, drone and</text>
<text x="84" y="580" font-size="13" fill="#6d5a3a">fixed-portal inspection alike</text>
<rect x="608" y="500" width="512" height="100" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="632" y="532" font-size="17" font-family="Georgia, serif" fill="#291c0e">The cadence it serves</text>
<text x="632" y="560" font-size="13" fill="#6d5a3a">FHWA NBI + NBIS 23 CFR 650: routine bridge inspection</text>
<text x="632" y="580" font-size="13" fill="#6d5a3a">on a 2-year interval — serials make the punch list honest</text>
</g>
</svg>
