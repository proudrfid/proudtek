<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="uklTitle uklDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="uklTitle">Shenzhen to any UK postcode — DDP, 9–13 days door to door</title>
  <desc id="uklDesc">Four-station flow from Shenzhen production to a UK delivery address. Station one: production, 7 to 15 business days after artwork approval, with 100 percent electrical testing. Station two: DHL express air, 4 to 6 days to any UK address, London to the Highlands. Station three, highlighted in gold: the DDP checkpoint, where the 0 percent UK Global Tariff on smart cards under commodity 8523 52, the 20 percent import VAT, and customs clearance are settled by the supplier mid-route. Station four: your UK door, 9 to 13 days door to door, with the compliance pack in the box and no surprise invoices. Beneath the flow, two note bars: container-scale orders can move by sea to Felixstowe or Southampton on request, quoted per sailing, while express air stays the default for card and tag volumes; and the paperwork that rides along — CE Declaration of Conformity, RoHS and REACH declarations, commodity-coded invoice — plus a note that a GB EORI number ties the customs entry to you when importing in your own name. Footnote: quotes return within one business day; Shenzhen runs seven to eight hours ahead of the UK.</desc>
  <defs>
    <radialGradient id="uklBg" cx="50%" cy="18%" r="92%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="uklArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#uklBg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="1" fill="#6d5a3a">SHENZHEN TO ANY UK POSTCODE — DDP</text>
  <text x="600" y="86" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Production 5–7 business days · DHL express 4–6 days · duty, VAT and clearance settled mid-route</text>

  <!-- station 1: factory -->
  <rect x="64" y="128" width="232" height="196" rx="14" fill="#ffffff" stroke="#c3cad4" stroke-width="2"/>
  <text x="180" y="160" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.8" fill="#4a5568">SHENZHEN PRODUCTION</text>
  <text x="180" y="206" text-anchor="middle" font-size="32" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">5–7</text>
  <text x="180" y="232" text-anchor="middle" font-size="12.5" fill="#5c5c5c">business days production</text>
  <text x="180" y="266" text-anchor="middle" font-size="13" fill="#291c0e">after artwork approval</text>
  <text x="180" y="290" text-anchor="middle" font-size="13" fill="#291c0e">100% electrical testing</text>

  <!-- station 2: air -->
  <rect x="344" y="128" width="232" height="196" rx="14" fill="#ffffff" stroke="#c3cad4" stroke-width="2"/>
  <text x="460" y="160" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.8" fill="#4a5568">DHL EXPRESS AIR</text>
  <text x="460" y="206" text-anchor="middle" font-size="32" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">4–6</text>
  <text x="460" y="232" text-anchor="middle" font-size="12.5" fill="#5c5c5c">days to any UK address</text>
  <text x="460" y="266" text-anchor="middle" font-size="13" fill="#291c0e">London to the Highlands —</text>
  <text x="460" y="290" text-anchor="middle" font-size="13" fill="#291c0e">every postcode served</text>

  <!-- station 3: DDP checkpoint (gold) -->
  <rect x="624" y="128" width="232" height="196" rx="14" fill="#fdf7ec" stroke="#e4c98f" stroke-width="2.5"/>
  <text x="740" y="160" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">DDP CHECKPOINT</text>
  <text x="740" y="206" text-anchor="middle" font-size="32" font-weight="700" fill="#6d5a3a" font-family="Lora, Georgia, serif">0%</text>
  <text x="740" y="232" text-anchor="middle" font-size="12.5" fill="#5c5c5c">duty — smart cards, 8523 52</text>
  <text x="740" y="266" text-anchor="middle" font-size="13" fill="#291c0e">20% import VAT settled,</text>
  <text x="740" y="290" text-anchor="middle" font-size="13" fill="#291c0e">customs clearance by us</text>

  <!-- station 4: UK door -->
  <rect x="904" y="128" width="232" height="196" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="1020" y="160" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.8" fill="#234a4a">YOUR UK DOOR</text>
  <text x="1020" y="206" text-anchor="middle" font-size="32" font-weight="700" fill="#2c5454" font-family="Lora, Georgia, serif">9–13</text>
  <text x="1020" y="232" text-anchor="middle" font-size="12.5" fill="#5c5c5c">days door to door</text>
  <text x="1020" y="266" text-anchor="middle" font-size="13" fill="#291c0e">compliance pack in the box,</text>
  <text x="1020" y="290" text-anchor="middle" font-size="13" fill="#291c0e">no surprise invoices</text>

  <!-- arrows -->
  <line x1="298" y1="226" x2="338" y2="226" stroke="#4a5568" stroke-width="2.5" marker-end="url(#uklArr)"/>
  <line x1="578" y1="226" x2="618" y2="226" stroke="#4a5568" stroke-width="2.5" marker-end="url(#uklArr)"/>
  <line x1="858" y1="226" x2="898" y2="226" stroke="#4a5568" stroke-width="2.5" marker-end="url(#uklArr)"/>

  <!-- note bar 1: sea alternative -->
  <rect x="64" y="360" width="1072" height="102" rx="14" fill="#ffffff" stroke="#c3cad4" stroke-width="2"/>
  <text x="88" y="392" font-size="13" font-weight="800" letter-spacing="0.8" fill="#4a5568">CONTAINER-SCALE ALTERNATIVE</text>
  <text x="88" y="420" font-size="14" fill="#291c0e">Sea freight to Felixstowe or Southampton is available on request, quoted per sailing —</text>
  <text x="88" y="443" font-size="14" fill="#291c0e">express air stays the default for card and tag volumes.</text>

  <!-- note bar 2: paperwork -->
  <rect x="64" y="482" width="1072" height="102" rx="14" fill="#ffffff" stroke="#c3cad4" stroke-width="2"/>
  <text x="88" y="514" font-size="13" font-weight="800" letter-spacing="0.8" fill="#4a5568">PAPERWORK THAT RIDES ALONG</text>
  <text x="88" y="542" font-size="14" fill="#291c0e">CE Declaration of Conformity · RoHS/REACH declarations · commodity-coded commercial invoice</text>
  <text x="88" y="565" font-size="14" fill="#291c0e">Importing in your own name instead? Your GB EORI ties the entry — and postponed VAT — to you.</text>

  <text x="600" y="630" text-anchor="middle" font-size="12.5" fill="#6d5a3a">Quotes return within one business day — Shenzhen runs seven to eight hours ahead of the UK</text>
</svg>
