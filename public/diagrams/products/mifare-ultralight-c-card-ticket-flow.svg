<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Ultralight C at the fare gate — 3DES mutual authentication for disposable tickets</title>
  <desc id="d">Gate flow: card and reader run Triple-DES mutual authentication with a 112-bit effective key per NIST SP 800-67, both sides prove knowledge before any protected read or write; contrast panel notes plain Ultralight's 32-bit password is brute-forceable and Classic's CRYPTO-1 is broken.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">The cheapest card that still asks for ID</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Single-ride and day-pass ticketing where the gate must trust a throwaway card</text>
  <g transform="translate(70,150)">
    <rect x="0" y="60" width="220" height="140" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="100" font-family="Georgia, serif" font-size="18" fill="#291c0e">Ticket</text>
    <text x="24" y="128" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Ultralight C (MF0ICU2)</text>
    <text x="24" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">diversified 3DES key</text>
    <rect x="420" y="60" width="220" height="140" rx="12" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2.5"/>
    <text x="444" y="100" font-family="Georgia, serif" font-size="18" fill="#2c5454">Fare gate</text>
    <text x="444" y="128" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">holds the issuer key</text>
    <text x="444" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">challenges every tap</text>
    <path d="M 290 100 L 415 100" stroke="#6d5a3a" stroke-width="2.5" marker-end="url(#a2)"/>
    <path d="M 415 160 L 290 160" stroke="#6d5a3a" stroke-width="2.5" marker-end="url(#a2)"/>
    <defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d5a3a"/></marker></defs>
    <text x="300" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2c5454">challenge</text>
    <text x="305" y="182" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2c5454">response</text>
    <rect x="120" y="250" width="400" height="66" rx="10" fill="#2c5454"/>
    <text x="144" y="278" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f8f6f1">3DES (TDEA, NIST SP 800-67) mutual auth</text>
    <text x="144" y="300" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#dfe9e7">112-bit effective key — both sides prove it</text>
  </g>
  <g transform="translate(760,150)">
    <rect x="0" y="0" width="370" height="320" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="18" fill="#291c0e">Why not the cheaper siblings</text>
    <text x="24" y="76" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8b2d2d">Ultralight / EV1: 32-bit password —</text>
    <text x="24" y="98" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8b2d2d">brute-forceable on commodity hardware</text>
    <text x="24" y="132" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8b2d2d">Classic 1K: CRYPTO-1 publicly broken</text>
    <text x="24" y="166" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Ultralight C: real mutual auth at a</text>
    <text x="24" y="188" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">disposable-ticket price point</text>
    <text x="24" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Fine for a brochure URL: plain Ultralight.</text>
    <text x="24" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Anything with fare value on it: C.</text>
    <text x="24" y="292" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Upgrade path when value grows: DESFire</text>
  </g>
</svg>
