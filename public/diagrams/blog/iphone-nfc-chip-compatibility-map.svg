<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">iPhone-compatible NFC chips mapped to their NFC Forum tag type and best-fit job</title>
<desc id="d">Three chip families mapped to the NFC Forum tag types iOS reads natively. NTAG 213, 215 and 216 are Type 2 tags, the everyday iPhone-compatible parts for stickers, cards and inlays. NTAG 424 DNA is a Type 4 tag with cryptographic authentication and dynamic URLs, used for brand protection and secure NFC. ICODE SLIX2 is a Type 5, NFC-V, ISO 15693 vicinity chip for library, industrial and longer-range use. All are NXP parts; iPhone reads Type 2 and Type 4 since iPhone 7 and Type 5 since iOS 14.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CHIPS GUARANTEED TO WORK WITH iPHONE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">All NXP parts — iPhone reads Type 2/4 since iPhone 7, Type 5 since iOS 14.</text>

<text x="104" y="140" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#9a8f7a">CHIP</text>
<text x="712" y="140" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#9a8f7a">iOS-NATIVE TAG TYPE</text>
<text x="880" y="140" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#9a8f7a">BEST-FIT JOB</text>

<!-- Row 1 -->
<rect x="64" y="156" width="1072" height="116" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<rect x="64" y="156" width="9" height="116" rx="4" fill="#3d6b6b"/>
<text x="104" y="202" font-size="17.5" font-weight="800" fill="#291c0e">NTAG 213 · 215 · 216</text>
<text x="104" y="232" font-size="13" fill="#4f6a6a">The everyday iPhone-compatible tags</text>
<rect x="596" y="194" width="232" height="40" rx="20" fill="#dcebeb" stroke="#a9cccc" stroke-width="1.4"/>
<text x="712" y="219" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">NFC FORUM TYPE 2</text>
<text x="880" y="219" font-size="13.5" fill="#4f4f4f">stickers, cards, inlays</text>

<!-- Row 2 -->
<rect x="64" y="292" width="1072" height="116" rx="12" fill="#faf5ea" stroke="#e4d8bf" stroke-width="1.5"/>
<rect x="64" y="292" width="9" height="116" rx="4" fill="#c39a5f"/>
<text x="104" y="338" font-size="17.5" font-weight="800" fill="#291c0e">NTAG 424 DNA</text>
<text x="104" y="368" font-size="13" fill="#8a6d34">Cryptographic auth + dynamic URL</text>
<rect x="596" y="330" width="232" height="40" rx="20" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="712" y="355" text-anchor="middle" font-size="13" font-weight="800" fill="#8a6d34">NFC FORUM TYPE 4</text>
<text x="880" y="355" font-size="13.5" fill="#4f4f4f">brand protection, secure NFC</text>

<!-- Row 3 -->
<rect x="64" y="428" width="1072" height="116" rx="12" fill="#f1f2f5" stroke="#d3d9e2" stroke-width="1.5"/>
<rect x="64" y="428" width="9" height="116" rx="4" fill="#4a5568"/>
<text x="104" y="474" font-size="17.5" font-weight="800" fill="#291c0e">ICODE SLIX2</text>
<text x="104" y="504" font-size="13" fill="#3b4557">ISO 15693 vicinity chip</text>
<rect x="596" y="466" width="232" height="40" rx="20" fill="#eef0f3" stroke="#d3d9e2" stroke-width="1.4"/>
<text x="712" y="491" text-anchor="middle" font-size="13" font-weight="800" fill="#3b4557">TYPE 5 · NFC-V</text>
<text x="880" y="491" font-size="13.5" fill="#4f4f4f">library, industrial, range</text>

<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Match the chip to the job — every one is read natively, no app required.</text>
</svg>
