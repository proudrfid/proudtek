<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five cost components of an RFID asset-tracking system</title>
<desc id="d">A labelled list of the five cost components in an RFID asset-tracking deployment. RFID asset tags run 0.10 to 5.00 dollars per tag depending on form factor, durability and mount. Handheld UHF readers run 1,500 to 3,500 dollars per unit for walking audits. Fixed portal readers are optional at 800 to 2,000 dollars per portal for real-time movement alerts. Asset management software runs 5,000 to more than 50,000 dollars for check-in and check-out, lifecycle and depreciation tracking. Initial tagging labor takes 1 to 5 minutes per item, at 500 to 2,000 items per person per day.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT THE SYSTEM COSTS</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Five line items — priced per tag, per reader, per portal, per year and per hour of labor.</text>

<!-- Row 1: tags -->
<rect x="64" y="162" width="54" height="54" rx="12" fill="#3d6b6b"/>
<text x="91" y="197" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">1</text>
<text x="140" y="184" font-size="18" font-weight="700" fill="#291c0e">RFID asset tags</text>
<text x="140" y="207" font-size="13" fill="#5c5c5c">per tag — form factor, durability, mount method</text>
<text x="1130" y="182" text-anchor="end" font-size="22" font-weight="800" fill="#2c5454">$0.10-5.00</text>
<text x="1130" y="205" text-anchor="end" font-size="12.5" fill="#8a8a8a">per tag</text>

<line x1="64" y1="228" x2="1136" y2="228" stroke="#efe7d6" stroke-width="1.6"/>
<!-- Row 2: handhelds -->
<rect x="64" y="240" width="54" height="54" rx="12" fill="#4a5568"/>
<text x="91" y="275" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">2</text>
<text x="140" y="262" font-size="18" font-weight="700" fill="#291c0e">Handheld readers</text>
<text x="140" y="285" font-size="13" fill="#5c5c5c">portable UHF, for walking audits and locating items</text>
<text x="1130" y="260" text-anchor="end" font-size="22" font-weight="800" fill="#4a5568">$1,500-3,500</text>
<text x="1130" y="283" text-anchor="end" font-size="12.5" fill="#8a8a8a">per unit</text>

<line x1="64" y1="306" x2="1136" y2="306" stroke="#efe7d6" stroke-width="1.6"/>
<!-- Row 3: portals -->
<rect x="64" y="318" width="54" height="54" rx="12" fill="#4a5568"/>
<text x="91" y="353" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">3</text>
<text x="140" y="340" font-size="18" font-weight="700" fill="#291c0e">Fixed portal readers — optional</text>
<text x="140" y="363" font-size="13" fill="#5c5c5c">doorways and docks — adds real-time movement alerts</text>
<text x="1130" y="338" text-anchor="end" font-size="22" font-weight="800" fill="#4a5568">$800-2,000</text>
<text x="1130" y="361" text-anchor="end" font-size="12.5" fill="#8a8a8a">per portal</text>

<line x1="64" y1="384" x2="1136" y2="384" stroke="#efe7d6" stroke-width="1.6"/>
<!-- Row 4: software -->
<rect x="64" y="396" width="54" height="54" rx="12" fill="#c39a5f"/>
<text x="91" y="431" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">4</text>
<text x="140" y="418" font-size="18" font-weight="700" fill="#291c0e">Asset management software</text>
<text x="140" y="441" font-size="13" fill="#5c5c5c">check-in/out, lifecycle, depreciation, compliance</text>
<text x="1130" y="416" text-anchor="end" font-size="22" font-weight="800" fill="#a07d43">$5,000-50,000+</text>
<text x="1130" y="439" text-anchor="end" font-size="12.5" fill="#8a8a8a">scales with fleet</text>

<line x1="64" y1="462" x2="1136" y2="462" stroke="#efe7d6" stroke-width="1.6"/>
<!-- Row 5: labor -->
<rect x="64" y="474" width="54" height="54" rx="12" fill="#6d5a3a"/>
<text x="91" y="509" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">5</text>
<text x="140" y="496" font-size="18" font-weight="700" fill="#291c0e">Initial tagging (labor)</text>
<text x="140" y="519" font-size="13" fill="#5c5c5c">1-5 minutes per item to select, attach and register</text>
<text x="1130" y="494" text-anchor="end" font-size="22" font-weight="800" fill="#6d5a3a">500-2,000</text>
<text x="1130" y="517" text-anchor="end" font-size="12.5" fill="#8a8a8a">items / person / day</text>

<text x="600" y="588" text-anchor="middle" font-size="14" fill="#4f4f4f">Hardware and software totals scale with facility count; add 15-25% contingency for a site survey.</text>
</svg>
