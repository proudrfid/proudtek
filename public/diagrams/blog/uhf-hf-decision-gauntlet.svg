<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The six-gate decision gauntlet for UHF vs HF</title>
<desc id="d">Five question gates stacked vertically, each able to exit sideways to a verdict. Gate one: need reads beyond 30 cm? Yes exits left to UHF required; tap-to-read under 10 cm prefers HF. Gate two: need 50 or more tags read at once? Portals and conveyors exit left to UHF; single-item interaction continues. Gate three: need AES-128 or PKI mutual authentication? Exits right to HF smart cards such as DESFire and Java Card. Gate four: must unmodified smartphones read it? Exits right to HF/NFC — phones have no native UHF. Gate five: metal and liquid everywhere? Leans right to HF, or specialised UHF tags. Survivors reach gate six, total cost of ownership: UHF tags are cheaper per unit, but UHF reader infrastructure costs more per point.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SIX GATES, IN ORDER</text>
<text x="600" y="92" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="29" font-weight="700" fill="#291c0e">The decision gauntlet — run it before the vendor demo</text>

<text x="205" y="134" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#4a5568">EXIT → UHF</text>
<text x="995" y="134" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#2c5454">EXIT → HF/NFC</text>

<rect x="390" y="150" width="420" height="56" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="174" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">1 · Need reads beyond 30 cm?</text>
<text x="600" y="193" text-anchor="middle" font-size="12" fill="#6d5a3a">yes → UHF required · tap-to-read &lt; 10 cm → HF preferred</text>
<line x1="390" y1="178" x2="312" y2="178" stroke="#4a5568" stroke-width="2"/>
<polygon points="304,178 316,172 316,184" fill="#4a5568"/>
<rect x="110" y="160" width="190" height="36" rx="18" fill="#eef1f5" stroke="#4a5568"/>
<text x="205" y="183" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a5568">&gt; 30 cm → UHF</text>
<line x1="600" y1="206" x2="600" y2="222" stroke="#c39a5f" stroke-width="2"/>
<polygon points="600,228 594,217 606,217" fill="#c39a5f"/>

<rect x="390" y="230" width="420" height="56" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="254" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">2 · Need 50+ tags read at once?</text>
<text x="600" y="273" text-anchor="middle" font-size="12" fill="#6d5a3a">portals, conveyors, inventory counts → UHF · one at a time → either</text>
<line x1="390" y1="258" x2="312" y2="258" stroke="#4a5568" stroke-width="2"/>
<polygon points="304,258 316,252 316,264" fill="#4a5568"/>
<rect x="110" y="240" width="190" height="36" rx="18" fill="#eef1f5" stroke="#4a5568"/>
<text x="205" y="263" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a5568">50+ tags → UHF</text>
<line x1="600" y1="286" x2="600" y2="302" stroke="#c39a5f" stroke-width="2"/>
<polygon points="600,308 594,297 606,297" fill="#c39a5f"/>

<rect x="390" y="310" width="420" height="56" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="334" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">3 · Need AES-128 / PKI mutual authentication?</text>
<text x="600" y="353" text-anchor="middle" font-size="12" fill="#6d5a3a">strongest options are HF smart cards — DESFire, Java Card</text>
<line x1="810" y1="338" x2="888" y2="338" stroke="#3d6b6b" stroke-width="2"/>
<polygon points="896,338 884,332 884,344" fill="#3d6b6b"/>
<rect x="900" y="320" width="190" height="36" rx="18" fill="#eef5f5" stroke="#3d6b6b"/>
<text x="995" y="343" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">AES-128 → HF</text>
<line x1="600" y1="366" x2="600" y2="382" stroke="#c39a5f" stroke-width="2"/>
<polygon points="600,388 594,377 606,377" fill="#c39a5f"/>

<rect x="390" y="390" width="420" height="56" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="414" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">4 · Must unmodified smartphones read it?</text>
<text x="600" y="433" text-anchor="middle" font-size="12" fill="#6d5a3a">phones speak NFC only — smartphones do not read UHF</text>
<line x1="810" y1="418" x2="888" y2="418" stroke="#3d6b6b" stroke-width="2"/>
<polygon points="896,418 884,412 884,424" fill="#3d6b6b"/>
<rect x="900" y="400" width="190" height="36" rx="18" fill="#eef5f5" stroke="#3d6b6b"/>
<text x="995" y="423" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">phones → HF/NFC</text>
<line x1="600" y1="446" x2="600" y2="462" stroke="#c39a5f" stroke-width="2"/>
<polygon points="600,468 594,457 606,457" fill="#c39a5f"/>

<rect x="390" y="470" width="420" height="56" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="494" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">5 · Metal and liquid everywhere?</text>
<text x="600" y="513" text-anchor="middle" font-size="12" fill="#6d5a3a">proximity to metal and liquid favours HF · open air favours UHF</text>
<line x1="810" y1="498" x2="888" y2="498" stroke="#3d6b6b" stroke-width="2"/>
<polygon points="896,498 884,492 884,504" fill="#3d6b6b"/>
<rect x="900" y="480" width="190" height="36" rx="18" fill="#eef5f5" stroke="#3d6b6b"/>
<text x="995" y="503" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">wet / metallic → HF*</text>
<line x1="600" y1="526" x2="600" y2="542" stroke="#c39a5f" stroke-width="2"/>
<polygon points="600,548 594,537 606,537" fill="#c39a5f"/>

<rect x="180" y="554" width="840" height="58" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="578" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">6 · Total cost of ownership — the ambush gate</text>
<text x="600" y="599" text-anchor="middle" font-size="13" fill="#4f4f4f">UHF tags are cheaper per unit, but the reader infrastructure is more expensive — price the whole system.</text>
<text x="600" y="642" text-anchor="middle" font-size="12.5" fill="#5c5c5c">*or specialised on-metal / liquid-tolerant UHF tag designs — see the environmental step in the framework below.</text>
</svg>
