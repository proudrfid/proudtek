<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID textile laundry tag — construction cross-section and garment placement map</title>
<desc id="d">Two panels. Left, inside the tag: a UHF inlay with etched antenna and chip sits encapsulated between two woven polyester layers, 1.5 to 2 millimetres total; the top view shows a slim label-shaped tag with a stitched border, available in 55 by 15 millimetre or 70 by 15 millimetre stock sizes, always sewn flat because folding breaks the antenna geometry. Right, where it sews on a uniform shirt: approved points are the side seam at the hem, abrasion-protected and invisible to the wearer, and the care-label seam, the usual retrofit point for garments already in service. Metal zips, buttons and snaps are marked as a keep-away zone because metal hardware detunes the UHF antenna. Footer: fabric-encased UHF, reads 1-3 metres handheld and 2-5 metres through a tunnel reader, rated 50-100 cycles at 60-75 degrees Celsius.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SEWN-IN TEXTILE LAUNDRY TAG</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Thin enough to forget, placed where it survives</text>

<!-- ── LEFT PANEL: construction ── -->
<rect x="52" y="130" width="536" height="452" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="320" y="168" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">INSIDE THE TAG</text>

<!-- exploded layer stack -->
<rect x="130" y="192" width="330" height="30" rx="6" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.8"/>
<text x="295" y="212" text-anchor="middle" font-size="12.5" fill="#6d5a3a">woven polyester — outer face</text>
<rect x="130" y="234" width="330" height="44" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<path d="M 148 256 h 40 v -10 h 24 v 20 h 24 v -20 h 24 v 20 h 14" fill="none" stroke="#4a5568" stroke-width="2.5"/>
<rect x="284" y="247" width="18" height="18" rx="2" fill="#4a5568"/>
<path d="M 312 256 h 14 v -10 h 24 v 20 h 24 v -20 h 24 v 20 h 40" fill="none" stroke="#4a5568" stroke-width="2.5"/>
<rect x="130" y="290" width="330" height="30" rx="6" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.8"/>
<text x="295" y="310" text-anchor="middle" font-size="12.5" fill="#6d5a3a">woven polyester — back face</text>
<text x="295" y="344" text-anchor="middle" font-size="12.5" fill="#4f4f4f">UHF inlay: etched antenna + chip</text>

<!-- thickness bracket -->
<path d="M 472 192 h 10 v 128 h -10" fill="none" stroke="#4a5568" stroke-width="1.8"/>
<text x="492" y="252" font-size="13" font-weight="700" fill="#291c0e">1.5-2 mm</text>
<text x="492" y="270" font-size="12.5" fill="#4f4f4f">total</text>

<!-- top view with stitch border -->
<rect x="130" y="378" width="330" height="90" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<rect x="141" y="389" width="308" height="68" rx="6" fill="none" stroke="#c39a5f" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M 170 423 h 90" stroke="#e4c98f" stroke-width="1.5"/>
<rect x="288" y="416" width="14" height="14" rx="2" fill="#c39a5f"/>
<path d="M 330 423 h 90" stroke="#e4c98f" stroke-width="1.5"/>
<text x="295" y="492" text-anchor="middle" font-size="12.5" fill="#4f4f4f">55 × 15 mm or 70 × 15 mm — two stock lengths</text>
<text x="295" y="540" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f6f3a">Sew flat — folding breaks antenna geometry</text>

<!-- ── RIGHT PANEL: placement ── -->
<rect x="612" y="130" width="536" height="452" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="880" y="168" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">WHERE IT SEWS — UNIFORM SHIRT</text>

<!-- shirt -->
<path d="M 845 200 L 795 212 L 733 284 L 757 312 L 800 288 L 800 484 L 960 484 L 960 288 L 1003 312 L 1027 284 L 965 212 L 915 200 L 880 236 Z" fill="#ffffff" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M 845 200 L 880 236 L 915 200" fill="none" stroke="#4a5568" stroke-width="2"/>
<path d="M 851 197 L 880 227 L 909 197" fill="none" stroke="#4a5568" stroke-width="1.2"/>

<!-- care-label at back neck -->
<rect x="862" y="248" width="36" height="22" rx="3" fill="none" stroke="#1f6f3a" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M 898 259 h 34" stroke="#1f6f3a" stroke-width="1.4"/>
<circle cx="945" cy="259" r="13" fill="#1f6f3a"/>
<text x="945" y="264" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text>

<!-- metal button placket = keep-away -->
<path d="M 880 276 v 200" stroke="#4a5568" stroke-width="1.4"/>
<circle cx="880" cy="330" r="6" fill="#4a5568"/>
<circle cx="880" cy="378" r="6" fill="#4a5568"/>
<circle cx="880" cy="426" r="6" fill="#4a5568"/>
<rect x="856" y="306" width="48" height="144" rx="10" fill="none" stroke="#8b2d2d" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M 904 420 h 28" stroke="#8b2d2d" stroke-width="1.4"/>
<circle cx="945" cy="420" r="13" fill="none" stroke="#8b2d2d" stroke-width="2.5"/>
<text x="945" y="425" text-anchor="middle" font-size="13" font-weight="800" fill="#8b2d2d">3</text>

<!-- side-seam tag at hem -->
<rect x="806" y="440" width="34" height="14" rx="3" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.6"/>
<path d="M 806 447 h -22" stroke="#1f6f3a" stroke-width="1.4"/>
<circle cx="771" cy="447" r="13" fill="#1f6f3a"/>
<text x="771" y="452" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text>

<!-- legend -->
<circle cx="652" cy="509" r="11" fill="#1f6f3a"/>
<text x="652" y="513" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">1</text>
<text x="674" y="513" font-size="13" fill="#291c0e">Side seam at the hem — abrasion-protected, invisible to the wearer</text>
<circle cx="652" cy="536" r="11" fill="#1f6f3a"/>
<text x="652" y="540" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">2</text>
<text x="674" y="540" font-size="13" fill="#291c0e">Care-label seam — the usual retrofit point for in-service garments</text>
<circle cx="652" cy="563" r="11" fill="none" stroke="#8b2d2d" stroke-width="2.2"/>
<text x="652" y="567" text-anchor="middle" font-size="12" font-weight="800" fill="#8b2d2d">3</text>
<text x="674" y="567" font-size="13" fill="#8b2d2d">Keep metal zips, buttons and snaps clear — they detune the antenna</text>

<!-- footer stat line -->
<text x="600" y="626" text-anchor="middle" font-size="13" fill="#4f4f4f">Fabric-encased UHF · reads 1-3 m handheld, 2-5 m through a tunnel reader · rated 50-100 cycles at 60-75 °C</text>
</svg>
