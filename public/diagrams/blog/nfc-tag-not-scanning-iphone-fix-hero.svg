<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Before blaming an NFC tag on iPhone: the antenna is in the top 2 cm, and three common causes only look like a dead tag</title>
<desc id="d">An iPhone with its NFC antenna zone highlighted across the top 2 cm of the screen, beside the three usual reasons a tag appears not to scan on iOS: an incompatible chip such as a 125 kHz or MIFARE Classic tag iOS will not read; a missing or malformed NDEF message iOS ignores silently; and holding the tag against the middle of the phone instead of the top antenna. A genuinely dead tag is the rarest cause and the last to check.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="58" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NFC TROUBLESHOOTING · iPHONE</text>
<text x="600" y="106" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="41" font-weight="700" fill="#291c0e">Before you blame the tag</text>
<text x="600" y="142" text-anchor="middle" font-size="16.5" fill="#4f4f4f">Every iPhone reads NFC from just the top 2 cm of the screen — check three things first.</text>

<!-- iPhone -->
<rect x="150" y="200" width="212" height="404" rx="40" fill="#ffffff" stroke="#3d6b6b" stroke-width="3"/>
<rect x="168" y="226" width="176" height="352" rx="22" fill="#eef5f5" stroke="#cfe0e0" stroke-width="2"/>
<rect x="176" y="234" width="160" height="80" rx="16" fill="#cfe6e6" stroke="#3d6b6b" stroke-width="2"/>
<text x="256" y="270" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#2c5454">NFC ANTENNA</text>
<text x="256" y="293" text-anchor="middle" font-size="13" fill="#33595a">top 2 cm of screen</text>
<rect x="230" y="184" width="52" height="34" rx="6" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
<path d="M 300 190 A 22 22 0 0 1 300 226" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 314 182 A 34 34 0 0 1 314 234" fill="none" stroke="#a9cccc" stroke-width="2.5"/>
<text x="256" y="470" text-anchor="middle" font-size="13.5" fill="#5c5c5c">hold flat, 1-2 seconds</text>
<text x="256" y="540" text-anchor="middle" font-size="13.5" fill="#5c5c5c">near the front camera</text>

<!-- three suspects -->
<rect x="440" y="200" width="684" height="104" rx="14" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.6"/>
<rect x="440" y="200" width="9" height="104" rx="4" fill="#3d6b6b"/>
<text x="486" y="243" font-size="18" font-weight="800" fill="#291c0e">1 · Incompatible chip</text>
<text x="486" y="273" font-size="14" fill="#4f6a6a">A 125 kHz or MIFARE Classic tag iOS simply won't read.</text>

<rect x="440" y="322" width="684" height="104" rx="14" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.6"/>
<rect x="440" y="322" width="9" height="104" rx="4" fill="#c39a5f"/>
<text x="486" y="365" font-size="18" font-weight="800" fill="#291c0e">2 · Malformed or missing NDEF</text>
<text x="486" y="395" font-size="14" fill="#8a6d34">Blank or badly formatted data — iOS ignores it silently.</text>

<rect x="440" y="444" width="684" height="104" rx="14" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.6"/>
<rect x="440" y="444" width="9" height="104" rx="4" fill="#4a5568"/>
<text x="486" y="487" font-size="18" font-weight="800" fill="#291c0e">3 · Wrong tap zone</text>
<text x="486" y="517" font-size="14" fill="#3b4557">Held mid-phone, nowhere near the top antenna.</text>

<text x="618" y="600" text-anchor="middle" font-size="14.5" fill="#5c5c5c">A genuinely dead tag is the rarest cause — check it last.</text>
</svg>
