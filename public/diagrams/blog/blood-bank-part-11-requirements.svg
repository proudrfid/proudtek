<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five FDA 21 CFR Part 11 requirements an RFID system must satisfy</title>
<desc id="d">Five requirement cards. One, system validation: every function tested and documented before go-live, per FDA Computer Software Validation guidance. Two, audit trail: every create, edit and delete logged with user, timestamp and reason. Three, electronic signatures: unique to the user, traceable and repudiation-proof, typically password plus biometric. Four, access control: role-based, so technicians read, supervisors edit, and only authorized users approve final records. Five, data retention: at least 10 years per FDA and AABB standards, with long-term archival and restorable history. Summary: satisfy all five and RFID scan data qualifies as a valid electronic record.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE REQUIREMENTS · ONE VALID RECORD</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">What 21 CFR Part 11 asks of an RFID system</text>

