<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Chemical gauntlet — what the epoxy dome survives per ASTM D543</title>
<desc id="d">Grid of chemical exposures the epoxy tag is qualified against under ASTM D543, plus hazardous-area and food-contact deployment notes.</desc>
<rect width="1200" height="675" fill="#f8f6f1"/>
<text x="60" y="64" font-family="Georgia, serif" font-size="34" fill="#291c0e">The chemical gauntlet, per ASTM D543</text>
<text x="60" y="98" font-family="Verdana, sans-serif" font-size="16" fill="#6d5a3a">Qualified exposures — the resin takes the bath so the inlay never does</text>
<g font-family="Verdana, sans-serif">
<rect x="60" y="150" width="340" height="88" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="230" y="188" font-size="21" font-family="Georgia, serif" fill="#6d5a3a" text-anchor="middle">10 percent HCl</text>
<text x="230" y="216" font-size="13" fill="#6d5a3a" text-anchor="middle">acid wash + pickling zones</text>
<rect x="430" y="150" width="340" height="88" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="600" y="188" font-size="21" font-family="Georgia, serif" fill="#6d5a3a" text-anchor="middle">20 percent H2SO4</text>
<text x="600" y="216" font-size="13" fill="#6d5a3a" text-anchor="middle">battery + process acid service</text>
<rect x="800" y="150" width="340" height="88" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="970" y="188" font-size="21" font-family="Georgia, serif" fill="#6d5a3a" text-anchor="middle">30 percent NaOH</text>
<text x="970" y="216" font-size="13" fill="#6d5a3a" text-anchor="middle">caustic CIP + degreasing lines</text>
<rect x="60" y="258" width="340" height="88" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="230" y="296" font-size="21" font-family="Georgia, serif" fill="#6d5a3a" text-anchor="middle">IPA + MEK + toluene</text>
<text x="230" y="324" font-size="13" fill="#6d5a3a" text-anchor="middle">solvent wipe-down + paint shops</text>
<rect x="430" y="258" width="340" height="88" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="600" y="296" font-size="21" font-family="Georgia, serif" fill="#6d5a3a" text-anchor="middle">Hydrocarbons</text>
<text x="600" y="324" font-size="13" fill="#6d5a3a" text-anchor="middle">aliphatic + aromatic — fuel + lube exposure</text>
<rect x="800" y="258" width="340" height="88" rx="10" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2"/>
<text x="970" y="296" font-size="21" font-family="Georgia, serif" fill="#2c5454" text-anchor="middle">100 bar / 80 C jet</text>
<text x="970" y="324" font-size="13" fill="#2c5454" text-anchor="middle">IP69K wash-down after every bath</text>
<text x="60" y="404" font-size="17" fill="#291c0e" font-family="Georgia, serif">Where that buys admission</text>
<rect x="60" y="424" width="340" height="96" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="84" y="454" font-size="15" fill="#291c0e">Refinery + chemical CMLs</text>
<text x="84" y="478" font-size="12.5" fill="#6d5a3a">API 570 piping + API 510 vessel</text>
<text x="84" y="497" font-size="12.5" fill="#6d5a3a">condition-monitoring locations</text>
<rect x="430" y="424" width="340" height="96" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="454" y="454" font-size="15" fill="#291c0e">ATEX / IECEx zones</text>
<text x="454" y="478" font-size="12.5" fill="#6d5a3a">Ex m encapsulation per IEC 60079-18 —</text>
<text x="454" y="497" font-size="12.5" fill="#6d5a3a">epoxy is the approved compound itself</text>
<rect x="800" y="424" width="340" height="96" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="824" y="454" font-size="15" fill="#291c0e">Food-adjacent sanitary zones</text>
<text x="824" y="478" font-size="12.5" fill="#6d5a3a">FDA 21 CFR 175.300 resin + NSF/ANSI 51</text>
<text x="824" y="497" font-size="12.5" fill="#6d5a3a">flush-mount button SKU</text>
<rect x="60" y="556" width="1080" height="66" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="84" y="584" font-size="17" fill="#291c0e" font-family="Georgia, serif">Engine bays, offshore splash zones, caustic wash tunnels — the dome is the datasheet.</text>
<text x="84" y="608" font-size="13.5" fill="#6d5a3a">UV-stable hybrid resin option carries 20-year outdoor weathering per ASTM G154 for utility and streetlight estates.</text>
</g>
</svg>
