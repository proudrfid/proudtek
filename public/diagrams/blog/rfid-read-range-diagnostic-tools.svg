<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID read-range diagnostic tools and standards, by role and cost</title>
<desc id="d">Four platforms. Voyantic Tagformance is the lab fixture for tag sensitivity and backscatter, costing 25,000 to 60,000 dollars or 500 to 3,000 dollars per SKU as a service. CISC RFID Xplorer is a handheld field-tester for in-situ range and interference, costing 4,000 to 12,000 dollars. ARC from the Auburn RFID Lab is the retail-mandate inlay benchmark, adding 5,000 to 25,000 dollars to inlay cost. ISO/IEC 18046 is the international RFID test-method standard used to define RFP criteria. Open-source tools such as LLRP Toolkit and SLLURP dump raw reader data.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DIAGNOSTIC TOOLS &amp; STANDARDS</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Which platform to reach for — and what it costs.</text>

<!-- card 1 -->
<rect x="64" y="140" width="262" height="336" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="64" y="140" width="262" height="8" rx="4" fill="#3d6b6b"/>
<text x="195" y="186" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">Voyantic Tagformance</text>
<text x="195" y="210" text-anchor="middle" font-size="12.5" fill="#8a8a8a">lab fixture</text>
<line x1="96" y1="232" x2="294" y2="232" stroke="#eef0f4" stroke-width="1.4"/>
<text x="195" y="266" text-anchor="middle" font-size="13.5" fill="#291c0e">Tag sensitivity (RPOT)</text>
<text x="195" y="288" text-anchor="middle" font-size="13.5" fill="#291c0e">&amp; backscatter analysis</text>
<text x="195" y="310" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the gold-standard reference</text>
<rect x="96" y="392" width="198" height="56" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="195" y="416" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">$25K–60K</text>
<text x="195" y="436" text-anchor="middle" font-size="12" fill="#5c5c5c">or $500–3K / SKU service</text>

<!-- card 2 -->
<rect x="342" y="140" width="262" height="336" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="342" y="140" width="262" height="8" rx="4" fill="#3d6b6b"/>
<text x="473" y="186" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">CISC RFID Xplorer</text>
<text x="473" y="210" text-anchor="middle" font-size="12.5" fill="#8a8a8a">handheld field-tester</text>
<line x1="374" y1="232" x2="572" y2="232" stroke="#eef0f4" stroke-width="1.4"/>
<text x="473" y="266" text-anchor="middle" font-size="13.5" fill="#291c0e">In-situ read-range and</text>
<text x="473" y="288" text-anchor="middle" font-size="13.5" fill="#291c0e">interference measurement</text>
<text x="473" y="310" text-anchor="middle" font-size="12.5" fill="#5c5c5c">for field-engineering teams</text>
<rect x="374" y="392" width="198" height="56" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="473" y="424" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">$4K–12K</text>

<!-- card 3 -->
<rect x="620" y="140" width="262" height="336" rx="14" fill="#ffffff" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="620" y="140" width="262" height="8" rx="4" fill="#c39a5f"/>
<text x="751" y="186" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">ARC · Auburn RFID Lab</text>
<text x="751" y="210" text-anchor="middle" font-size="12.5" fill="#8a8a8a">certification programme</text>
<line x1="652" y1="232" x2="850" y2="232" stroke="#f7edd6" stroke-width="1.4"/>
<text x="751" y="266" text-anchor="middle" font-size="13.5" fill="#291c0e">Retail-mandate inlay</text>
<text x="751" y="288" text-anchor="middle" font-size="13.5" fill="#291c0e">benchmark (Spec G)</text>
<text x="751" y="310" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Walmart / Target / Macy's</text>
<rect x="652" y="392" width="198" height="56" rx="12" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.3"/>
<text x="751" y="416" text-anchor="middle" font-size="18" font-weight="800" fill="#6d5a3a">+$5K–25K</text>
<text x="751" y="436" text-anchor="middle" font-size="12" fill="#5c5c5c">to the inlay's cost</text>

<!-- card 4 -->
<rect x="898" y="140" width="238" height="336" rx="14" fill="#ffffff" stroke="#d4dae2" stroke-width="1.8"/>
<rect x="898" y="140" width="238" height="8" rx="4" fill="#4a5568"/>
<text x="1017" y="186" text-anchor="middle" font-size="16" font-weight="800" fill="#3a4457">ISO/IEC 18046</text>
<text x="1017" y="210" text-anchor="middle" font-size="12.5" fill="#8a8a8a">test-method standard</text>
<line x1="930" y1="232" x2="1104" y2="232" stroke="#eef0f4" stroke-width="1.4"/>
<text x="1017" y="266" text-anchor="middle" font-size="13.5" fill="#291c0e">RFID test methods:</text>
<text x="1017" y="288" text-anchor="middle" font-size="13.5" fill="#291c0e">range, anti-collision</text>
<text x="1017" y="310" text-anchor="middle" font-size="12.5" fill="#5c5c5c">defines RFP criteria</text>
<rect x="930" y="392" width="174" height="56" rx="12" fill="#eef0f4" stroke="#d4dae2" stroke-width="1.3"/>
<text x="1017" y="418" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4457">a spec, not a price</text>
<text x="1017" y="436" text-anchor="middle" font-size="12" fill="#5c5c5c">beats free-space specs</text>

<text x="600" y="522" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Open-source: LLRP Toolkit &amp; SLLURP dump raw reader data when the canned vendor reports don't fit.</text>
</svg>
