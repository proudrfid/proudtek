<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Real UHF wristband read range on the human wrist versus the catalog number</title>
<desc id="d">A descending bar chart of UHF wristband read range in metres. Free-space on a single tag reaches the catalog number of 8 m. Wrist-mounted in free space drops to 6.6 m as the antenna couples to skin. Wrist-mounted in a crowd drops to 2 to 3 m. A standard label inlay with no body-decoupling collapses to about 30 cm. Design portals for 2 to 5 m on-body with 2-mat redundancy, and budget 2 to 3 times more readers than the brochure suggests.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CATALOG vs THE HUMAN WRIST</text>
<text x="600" y="94" text-anchor="middle" font-size="28" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">The 8 m datasheet is 2&#8211;3 m in a real crowd</text>

<line x1="360" y1="150" x2="360" y2="440" stroke="#d8cbb2" stroke-width="1.5"/>
<line x1="532" y1="150" x2="532" y2="440" stroke="#efe7d6" stroke-width="1.2"/>
<line x1="705" y1="150" x2="705" y2="440" stroke="#efe7d6" stroke-width="1.2"/>
<line x1="877" y1="150" x2="877" y2="440" stroke="#efe7d6" stroke-width="1.2"/>
<line x1="1050" y1="150" x2="1050" y2="440" stroke="#efe7d6" stroke-width="1.2"/>

<!-- Row 1: free-space 8 m (catalog) -->
<text x="344" y="190" text-anchor="end" font-size="14" font-weight="700" fill="#291c0e">Free-space</text>
<text x="344" y="208" text-anchor="end" font-size="12" fill="#8a8a8a">catalog, no body</text>
<rect x="360" y="166" width="690" height="52" rx="6" fill="#b7bfca"/>
<text x="1040" y="199" text-anchor="end" font-size="15" font-weight="700" fill="#5c6570">8 m</text>

<!-- Row 2: wrist free space 6.6 m -->
<text x="344" y="262" text-anchor="end" font-size="14" font-weight="700" fill="#291c0e">Wrist, free space</text>
<text x="344" y="280" text-anchor="end" font-size="12" fill="#5c5c5c">couples to skin</text>
<rect x="360" y="238" width="569" height="52" rx="6" fill="#3d6b6b"/>
<text x="939" y="271" text-anchor="start" font-size="15" font-weight="700" fill="#2c5454">6.6 m</text>

<!-- Row 3: wrist in a crowd 2-3 m -->
<text x="344" y="334" text-anchor="end" font-size="14" font-weight="700" fill="#291c0e">Wrist in a crowd</text>
<text x="344" y="352" text-anchor="end" font-size="12" fill="#5c5c5c">other tags near</text>
<rect x="360" y="310" width="259" height="52" rx="6" fill="#2c5454"/>
<text x="629" y="343" text-anchor="start" font-size="15" font-weight="700" fill="#2c5454">2&#8211;3 m</text>

<!-- Row 4: no decoupling 30 cm (failure) -->
<text x="344" y="406" text-anchor="end" font-size="14" font-weight="700" fill="#8b2d2d">No decoupling</text>
<text x="344" y="424" text-anchor="end" font-size="12" fill="#8b2d2d">inlay on skin</text>
<rect x="360" y="382" width="26" height="52" rx="6" fill="#8b2d2d"/>
<text x="396" y="415" text-anchor="start" font-size="15" font-weight="700" fill="#8b2d2d">~30 cm</text>

<text x="360" y="460" text-anchor="middle" font-size="12" fill="#8a7a5c">0</text>
<text x="532" y="460" text-anchor="middle" font-size="12" fill="#8a7a5c">2</text>
<text x="705" y="460" text-anchor="middle" font-size="12" fill="#8a7a5c">4</text>
<text x="877" y="460" text-anchor="middle" font-size="12" fill="#8a7a5c">6</text>
<text x="1050" y="460" text-anchor="middle" font-size="12" fill="#8a7a5c">8</text>
<text x="705" y="484" text-anchor="middle" font-size="12.5" fill="#8a7a5c">metres &#183; on-body &#183; single fixed reader</text>

<rect x="88" y="506" width="1024" height="60" rx="12" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="542" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Design portals for 2&#8211;5 m on-body with 2-mat redundancy; budget 2&#8211;3&#215; more readers than the brochure suggests.</text>
</svg>
