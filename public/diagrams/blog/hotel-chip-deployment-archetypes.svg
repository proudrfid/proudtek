<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five hotel deployment archetypes matched to a key card chip</title>
<desc id="d">A property-to-chip mapping. Limited-service or economy, single room type with no spa or POS, uses Classic 1K because chip cost dominates — watch for Fudan clones. Mid-scale in renovation, replacing 20 to 40 percent of locks per year, uses MIFARE Plus EV2 as one SKU across old and new locks for a $0.04 to $0.06 premium. Luxury, resort and casino, with safes, POS and spa zones, uses DESFire EV3 for AES-128, EAL5+ and proximity check. Mobile-key-forward chains use DESFire EV3 for native NFC Forum Type 4 framing — Club Quarters shipped wallet keys in January 2025. Saflok-only estates align with the dormakaba default, Ultralight C.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DEPLOYMENT ARCHETYPES · MATCH PROPERTY TO CHIP</text>
<text x="600" y="78" text-anchor="middle" font-size="15" fill="#4f4f4f">Four patterns cover 90%+ of new procurement — start from yours, not a blank sheet.</text>

<text x="92" y="118" font-size="12.5" font-weight="800" letter-spacing="0.7" fill="#8a6d34">PROPERTY ARCHETYPE</text>
<text x="524" y="118" font-size="12.5" font-weight="800" letter-spacing="0.7" fill="#8a6d34">CHIP</text>
<text x="762" y="118" font-size="12.5" font-weight="800" letter-spacing="0.7" fill="#8a6d34">WHY</text>

<!-- row 1 · Classic 1K -->
<rect x="64" y="130" width="1072" height="76" rx="11" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="130" width="9" height="76" rx="4" fill="#4a5568"/>
<text x="92" y="164" font-size="15.5" font-weight="800" fill="#291c0e">Limited-service / economy</text>
<text x="92" y="186" font-size="12.5" fill="#5c5c5c">single room type, no spa or POS</text>
<text x="524" y="163" font-size="16" font-weight="800" fill="#2f3846">Classic 1K</text>
<text x="524" y="185" font-size="12" fill="#8895a7">lowest unit cost</text>
<text x="762" y="160" font-size="12.5" fill="#5c5c5c">Chip cost dominates; single-app</text>
<text x="762" y="180" font-size="12.5" fill="#8b2d2d">threat model — watch for Fudan clones</text>

<!-- row 2 · Plus EV2 -->
<rect x="64" y="216" width="1072" height="76" rx="11" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="216" width="9" height="76" rx="4" fill="#c39a5f"/>
<text x="92" y="250" font-size="15.5" font-weight="800" fill="#291c0e">Mid-scale in renovation</text>
<text x="92" y="272" font-size="12.5" fill="#5c5c5c">replacing 20–40% of locks per year</text>
<text x="524" y="249" font-size="16" font-weight="800" fill="#6d5a3a">MIFARE Plus EV2</text>
<text x="524" y="271" font-size="12" fill="#a98a52">one SKU, two modes</text>
<text x="762" y="246" font-size="12.5" fill="#5c5c5c">Runs on old + new locks together</text>
<text x="762" y="266" font-size="12.5" fill="#5c5c5c">+$0.04–0.06/card buys SKU simplicity</text>

<!-- row 3 · DESFire EV3 -->
<rect x="64" y="302" width="1072" height="76" rx="11" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="302" width="9" height="76" rx="4" fill="#3d6b6b"/>
<text x="92" y="336" font-size="15.5" font-weight="800" fill="#291c0e">Luxury · resort · casino</text>
<text x="92" y="358" font-size="12.5" fill="#5c5c5c">safes, POS, gym &amp; spa zones</text>
<text x="524" y="335" font-size="16" font-weight="800" fill="#2c5454">DESFire EV3</text>
<text x="524" y="357" font-size="12" fill="#6b8a8a">from day one</text>
<text x="762" y="332" font-size="12.5" fill="#5c5c5c">AES-128 + EAL5+ + proximity check</text>
<text x="762" y="352" font-size="12.5" fill="#5c5c5c">security exposure dwarfs the premium</text>

<!-- row 4 · DESFire EV3 mobile -->
<rect x="64" y="388" width="1072" height="76" rx="11" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="388" width="9" height="76" rx="4" fill="#3d6b6b"/>
<text x="92" y="422" font-size="15.5" font-weight="800" fill="#291c0e">Mobile-key-forward chains</text>
<text x="92" y="444" font-size="12.5" fill="#5c5c5c">Apple &amp; Google Wallet keys</text>
<text x="524" y="421" font-size="16" font-weight="800" fill="#2c5454">DESFire EV3</text>
<text x="524" y="443" font-size="12" fill="#6b8a8a">wallet-native</text>
<text x="762" y="418" font-size="12.5" fill="#5c5c5c">Native NFC Forum Type 4 framing</text>
<text x="762" y="438" font-size="12.5" fill="#5c5c5c">Club Quarters shipped this Jan 2025</text>

<!-- row 5 · Ultralight C -->
<rect x="64" y="474" width="1072" height="76" rx="11" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="474" width="9" height="76" rx="4" fill="#4a5568"/>
<text x="92" y="508" font-size="15.5" font-weight="800" fill="#291c0e">Saflok-only estates</text>
<text x="92" y="530" font-size="12.5" fill="#5c5c5c">dormakaba default stock</text>
<text x="524" y="507" font-size="16" font-weight="800" fill="#2f3846">Ultralight C</text>
<text x="524" y="529" font-size="12" fill="#8895a7">special case</text>
<text x="762" y="504" font-size="12.5" fill="#5c5c5c">Align with the lock-vendor default</text>
<text x="762" y="524" font-size="12.5" fill="#5c5c5c">don't over-specify without an audit</text>

<text x="600" y="594" text-anchor="middle" font-size="14" fill="#5c5c5c">Your property is usually one of these five — match the archetype, then sample on your own locks.</text>
</svg>
