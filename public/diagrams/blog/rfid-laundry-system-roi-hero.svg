<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The RFID laundry ROI ledger — loss down, hours back, cash-positive fast</title>
<desc id="d">Three ledger lines: linen loss falls from 5-15 percent of textile spend to 1-3 percent; automated tunnel counting recovers 20-40 staff hours a week at medium-scale facilities; and the system typically goes cash-positive in 6-14 months. A footnote marks the honest full range across real deployments at 6-36 months, decided by scale, loss rate and segment.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE LEDGER, BEFORE AND AFTER</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Where the linen money stops leaking</text>

<rect x="70" y="150" width="500" height="130" rx="14" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="320" y="188" text-anchor="middle" font-size="14" font-weight="800" fill="#8b2d2d">UNTRACKED</text>
<text x="320" y="226" text-anchor="middle" font-size="22" font-weight="800" fill="#8b2d2d">5–15% of textile spend, gone</text>
<text x="320" y="256" text-anchor="middle" font-size="12.5" fill="#4f4f4f">plus manual counts eating whole shifts</text>

<path d="M 600 215 h 44" stroke="#1f6f3a" stroke-width="3"/>
<path d="M 644 215 l -12 -7 v 14 z" fill="#1f6f3a"/>

<rect x="660" y="150" width="470" height="130" rx="14" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="895" y="188" text-anchor="middle" font-size="14" font-weight="800" fill="#1b4332">RFID-TRACKED</text>
<text x="895" y="226" text-anchor="middle" font-size="22" font-weight="800" fill="#1b4332">loss held at 1–3%</text>
<text x="895" y="256" text-anchor="middle" font-size="12.5" fill="#4f4f4f">every piece counted at machine speed</text>

<rect x="70" y="320" width="340" height="160" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="240" y="360" text-anchor="middle" font-size="14.5" font-weight="800" fill="#2c5454">HOURS RETURNED</text>
<text x="240" y="404" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">20–40 h/week</text>
<text x="240" y="436" text-anchor="middle" font-size="12.5" fill="#4f4f4f">counting labor replaced by</text>
<text x="240" y="458" text-anchor="middle" font-size="12.5" fill="#4f4f4f">tunnel readers, at medium scale</text>

<rect x="430" y="320" width="340" height="160" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="360" text-anchor="middle" font-size="14.5" font-weight="800" fill="#6d5a3a">TYPICAL PAYBACK</text>
<text x="600" y="404" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">6–14 months</text>
<text x="600" y="436" text-anchor="middle" font-size="12.5" fill="#4f4f4f">faster with high loss rates</text>
<text x="600" y="458" text-anchor="middle" font-size="12.5" fill="#4f4f4f">or high labor costs</text>

<rect x="790" y="320" width="340" height="160" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="960" y="360" text-anchor="middle" font-size="14.5" font-weight="800" fill="#4a5568">THE HONEST RANGE</text>
<text x="960" y="404" text-anchor="middle" font-size="26" font-weight="800" fill="#4a5568">6–36 months</text>
<text x="960" y="436" text-anchor="middle" font-size="12.5" fill="#4f4f4f">where you land is predictable:</text>
<text x="960" y="458" text-anchor="middle" font-size="12.5" fill="#4f4f4f">scale, loss rate, segment</text>

<rect x="240" y="516" width="720" height="66" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="544" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="18" font-weight="700" fill="#291c0e">Nobody stole the towels in any cinematic sense —</text>
<text x="600" y="570" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="18" font-weight="700" fill="#291c0e">they just left without a forwarding address.</text>
<text x="600" y="628" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The analysis below: the leak, the fix, the framework, the benchmarks, and two fully worked builds.</text>
</svg>
