<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Where UHF RFID wristbands are worth deploying, and the one case to avoid</title>
<desc id="d">Five deployments rated for fit. Race timing is proven — bib-mounted is the default, with wristbands for trail and obstacle runs (MYLAPS, ChronoTrack). Festival zone-occupancy counting is proven — fixed readers count bands at zone boundaries and feed fire-marshal dashboards. Theme park ride tracking is proven — Disney MagicBands and Universal use it for analytics and personalization. Warehouse personnel zone tracking is proven — hands-free entry and exit through PPE at 2 to 5 m. Cashless payment is to avoid — a 3 m read could debit the wrong band, so pair with HF (DESFire) and never use UHF alone.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE UHF EARNS ITS KEEP</text>
<text x="600" y="92" text-anchor="middle" font-size="28" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Four proven deployments, one to avoid</text>

<!-- Row 1 -->
<rect x="88" y="124" width="1024" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="88" y="124" width="8" height="70" rx="4" fill="#1f6f3a"/>
<text x="118" y="153" text-anchor="start" font-size="15.5" font-weight="800" fill="#291c0e">Race timing</text>
<text x="118" y="175" text-anchor="start" font-size="12.5" fill="#5c5c5c">Bib-mounted is the default; wristbands for trail &amp; obstacle runs (MYLAPS, ChronoTrack)</text>
<rect x="966" y="140" width="120" height="38" rx="8" fill="#e7f0ea" stroke="#9ec6ac" stroke-width="1.2"/>
<text x="1026" y="164" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">PROVEN</text>

<!-- Row 2 -->
<rect x="88" y="202" width="1024" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="88" y="202" width="8" height="70" rx="4" fill="#1f6f3a"/>
<text x="118" y="231" text-anchor="start" font-size="15.5" font-weight="800" fill="#291c0e">Festival zone counting</text>
<text x="118" y="253" text-anchor="start" font-size="12.5" fill="#5c5c5c">Fixed readers count bands at zone boundaries; feeds fire-marshal occupancy dashboards</text>
<rect x="966" y="218" width="120" height="38" rx="8" fill="#e7f0ea" stroke="#9ec6ac" stroke-width="1.2"/>
<text x="1026" y="242" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">PROVEN</text>

<!-- Row 3 -->
<rect x="88" y="280" width="1024" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="88" y="280" width="8" height="70" rx="4" fill="#1f6f3a"/>
<text x="118" y="309" text-anchor="start" font-size="15.5" font-weight="800" fill="#291c0e">Theme park ride tracking</text>
<text x="118" y="331" text-anchor="start" font-size="12.5" fill="#5c5c5c">Disney MagicBands, Universal &#8212; visited-ride analytics + personalization</text>
<rect x="966" y="296" width="120" height="38" rx="8" fill="#e7f0ea" stroke="#9ec6ac" stroke-width="1.2"/>
<text x="1026" y="320" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">PROVEN</text>

<!-- Row 4 -->
<rect x="88" y="358" width="1024" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="88" y="358" width="8" height="70" rx="4" fill="#1f6f3a"/>
<text x="118" y="387" text-anchor="start" font-size="15.5" font-weight="800" fill="#291c0e">Warehouse personnel zones</text>
<text x="118" y="409" text-anchor="start" font-size="12.5" fill="#5c5c5c">Hands-free entry/exit through PPE; reads at 2&#8211;5 m where a tap is impractical</text>
<rect x="966" y="374" width="120" height="38" rx="8" fill="#e7f0ea" stroke="#9ec6ac" stroke-width="1.2"/>
<text x="1026" y="398" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">PROVEN</text>

<!-- Row 5 (avoid) -->
<rect x="88" y="436" width="1024" height="70" rx="12" fill="#fbf1ef" stroke="#e3c4c0" stroke-width="1.5"/>
<rect x="88" y="436" width="8" height="70" rx="4" fill="#8b2d2d"/>
<text x="118" y="465" text-anchor="start" font-size="15.5" font-weight="800" fill="#291c0e">Cashless payment</text>
<text x="118" y="487" text-anchor="start" font-size="12.5" fill="#7a4a45">A 3 m read could debit the wrong band &#8212; pair with HF (DESFire), never UHF alone</text>
<rect x="966" y="452" width="120" height="38" rx="8" fill="#f6e4e2" stroke="#d8a7a1" stroke-width="1.2"/>
<text x="1026" y="476" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">AVOID</text>

<rect x="88" y="520" width="1024" height="48" rx="12" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="549" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Rule of thumb: UHF for anything you count or track; HF for anything you charge or unlock.</text>
</svg>
