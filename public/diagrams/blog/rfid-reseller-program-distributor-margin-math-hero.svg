<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The RFID distributor margin stack, from product resale up to recurring contracts</title>
<desc id="d">A three-layer stack showing where an RFID distributor's gross profit accumulates. The base layer is product resale at 25-45% margin, described as the commodity floor that factory-direct competition keeps pushing down. The middle layer is value-added services at 60-80% margin — encoding, kitting, and consulting — which throw off 30-50% of a well-run distributor's profit. The top layer is recurring contracts at 50-70% margin — blanket orders, vendor-managed inventory, and RFID-as-a-service — which lock revenue for 24-36 months. Margin per dollar of revenue rises as value is added.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE DISTRIBUTOR MARGIN STACK</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Where the profit actually stacks up</text>
<text x="600" y="134" text-anchor="middle" font-size="15.5" fill="#4f4f4f">The box barely moves the needle — the layers stacked on top of it do.</text>

<!-- rising-margin arrow -->
<line x1="70" y1="536" x2="70" y2="184" stroke="#c39a5f" stroke-width="2.6"/><polygon points="64,192 70,178 76,192" fill="#c39a5f"/>
<text transform="rotate(-90 60 360)" x="60" y="360" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MARGIN PER $ OF REVENUE</text>

<!-- TOP: recurring -->
<rect x="100" y="176" width="372" height="116" rx="12" fill="#dce8e8" stroke="#2c5454" stroke-width="1.8"/>
<text x="122" y="210" font-size="14" font-weight="800" letter-spacing="0.3" fill="#234a4a">RECURRING CONTRACTS</text>
<text x="122" y="246" font-size="25" font-weight="800" fill="#2c5454">50-70% margin</text>
<text x="122" y="272" font-size="12.5" fill="#5c5c5c">blanket orders · VMI · RaaS</text>

<!-- MID: value-added -->
<rect x="100" y="300" width="372" height="116" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="122" y="334" font-size="14" font-weight="800" letter-spacing="0.3" fill="#234a4a">VALUE-ADDED SERVICES</text>
<text x="122" y="370" font-size="25" font-weight="800" fill="#3d6b6b">60-80% margin</text>
<text x="122" y="396" font-size="12.5" fill="#5c5c5c">encoding · kitting · consulting</text>

<!-- BASE: product resale -->
<rect x="100" y="424" width="372" height="116" rx="12" fill="#f4f0e6" stroke="#6d5a3a" stroke-width="1.8"/>
<text x="122" y="458" font-size="14" font-weight="800" letter-spacing="0.3" fill="#6d5a3a">PRODUCT RESALE</text>
<text x="122" y="494" font-size="25" font-weight="800" fill="#8a6d3b">25-45% margin</text>
<text x="122" y="520" font-size="12.5" fill="#5c5c5c">standard-tag markup</text>

<!-- connectors + notes -->
<line x1="472" y1="234" x2="540" y2="234" stroke="#cfd6df" stroke-width="1.6"/>
<rect x="540" y="196" width="596" height="78" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="562" y="228" font-size="14.5" font-weight="700" fill="#234a4a">The sticky top.</text>
<text x="562" y="252" font-size="13.5" fill="#4f4f4f">Blanket orders, VMI, and RaaS lock revenue for 24-36 months.</text>

<line x1="472" y1="358" x2="540" y2="358" stroke="#cfd6df" stroke-width="1.6"/>
<rect x="540" y="320" width="596" height="78" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="562" y="352" font-size="14.5" font-weight="700" fill="#234a4a">The engine.</text>
<text x="562" y="376" font-size="13.5" fill="#4f4f4f">Encoding, kitting, and consulting throw off 30-50% of the profit.</text>

<line x1="472" y1="482" x2="540" y2="482" stroke="#cfd6df" stroke-width="1.6"/>
<rect x="540" y="444" width="596" height="78" rx="12" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.4"/>
<text x="562" y="476" font-size="14.5" font-weight="700" fill="#8b2d2d">The commodity floor.</text>
<text x="562" y="500" font-size="13.5" fill="#4f4f4f">Factory-direct competition keeps pushing this layer down.</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Two distributors can sell the identical tag at the identical price — and still run completely different businesses.</text>
</svg>
