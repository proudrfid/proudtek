<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">On-metal construction of a process-valve RFID tag</title>
  <desc id="d">A cross-section stack showing how a valve RFID tag reads on steel: the steel valve or pipe body at the base, an anti-metal ferrite isolation layer, a UHF Gen2v2 inlay carrying a GS1 GIAI-96 identifier at 860-960 MHz, a hard PPS, PEEK or glass-filled polyamide housing, and a 316L stainless band-clamp or yoke bolt-through mount. Below, four qualification chips: NEMA 4X / IP68, ATEX / IECEx Zone 1, minus 40 to 150 degrees C, and NACE MR0175 sour service.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW A VALVE TAG READS ON STEEL</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Bare inlays go silent on metal — the anti-metal layer is what makes the read survive</text>

  <!-- valve icon -->
  <rect x="150" y="300" width="150" height="70" rx="8" fill="#dfe4ea" stroke="#9aa4b2" stroke-width="2"/>
  <rect x="210" y="250" width="30" height="56" fill="#9aa4b2"/>
  <rect x="185" y="238" width="80" height="16" rx="6" fill="#9aa4b2"/>
  <rect x="195" y="322" width="60" height="26" rx="4" fill="#4a5568"/>
  <text x="225" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">Band-clamped to the yoke</text>

  <!-- layer stack -->
  <text x="700" y="140" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">THE ON-METAL STACK (bottom → top)</text>
  <rect x="440" y="322" width="520" height="40" rx="6" fill="#dfe4ea" stroke="#9aa4b2" stroke-width="2"/>
  <text x="460" y="347" font-size="13.5" fill="#291c0e">Steel valve / pipe body — the surface that kills bare inlays</text>
  <rect x="440" y="276" width="520" height="40" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="460" y="301" font-size="13.5" fill="#2c5454">Anti-metal ferrite isolation layer — restores the read</text>
  <rect x="440" y="230" width="520" height="40" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="460" y="255" font-size="13.5" fill="#291c0e">UHF Gen2v2 inlay — 860-960 MHz, GS1 GIAI-96</text>
  <rect x="440" y="184" width="520" height="40" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="460" y="209" font-size="13.5" fill="#291c0e">Hard housing — PPS / PEEK / glass-filled PA66</text>
  <rect x="440" y="150" width="520" height="28" rx="6" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <text x="460" y="169" font-size="12.5" fill="#5c5c5c">316L band-clamp or yoke bolt-through mount</text>

  <!-- qualification chips -->
  <text x="600" y="452" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">QUALIFIED FOR THE HAZARDOUS AREA</text>
  <rect x="120" y="470" width="240" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="140" y="497" font-size="15" font-weight="700" fill="#291c0e">NEMA 4X / IP68</text>
  <text x="140" y="517" font-size="12.5" fill="#5c5c5c">to IEC 60529</text>
  <rect x="378" y="470" width="240" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="398" y="497" font-size="15" font-weight="700" fill="#291c0e">ATEX / IECEx Zone 1</text>
  <text x="398" y="517" font-size="12.5" fill="#5c5c5c">passive tag, IS reader path</text>
  <rect x="636" y="470" width="200" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="656" y="497" font-size="15" font-weight="700" fill="#291c0e">-40 to +150 °C</text>
  <text x="656" y="517" font-size="12.5" fill="#5c5c5c">+180 °C short excursion</text>
  <rect x="854" y="470" width="226" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="874" y="497" font-size="15" font-weight="700" fill="#291c0e">NACE MR0175</text>
  <text x="874" y="517" font-size="12.5" fill="#5c5c5c">sour-service housing</text>

  <text x="600" y="576" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Six mount SKUs — yoke wrap, bolted name-plate, pipe-support, buried vault disc, actuator disc, GMP PEEK — one GIAI-96 record.</text>
</svg>
