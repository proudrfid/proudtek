<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Built for the windshield — tamper-destruct face and the cabin environment</title>
  <desc id="d">Left: destructible brittle PET face — a peel attempt fractures the antenna and permanently kills the tag, so a sticker cannot migrate between vehicles. Right: environment envelope from minus 40 to plus 85 degrees Celsius, surviving car washes and weather.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Stays on its windshield — or stops existing</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Credential theft by sticker-peel simply does not survive the peel</text>
  <g transform="translate(70,160)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="500" height="230" rx="14" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="17" fill="#8b2d2d">Peel attempt = dead tag</text>
    <rect x="24" y="64" width="200" height="10" rx="3" fill="#3d6b6b"/>
    <path d="M 236 69 L 300 40" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round"/>
    <path d="M 250 72 L 262 66" stroke="#8b2d2d" stroke-width="3"/>
    <text x="24" y="112" font-size="14" fill="#2c5454">destructible brittle PET face stock</text>
    <text x="24" y="138" font-size="14" fill="#2c5454">antenna fractures on peel — permanently</text>
    <text x="24" y="176" font-size="13" fill="#6d5a3a">a credential that cannot migrate to</text>
    <text x="24" y="198" font-size="13" fill="#6d5a3a">another vehicle</text>
    <rect x="550" y="0" width="500" height="230" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="574" y="40" font-family="Georgia, serif" font-size="17" fill="#2c5454">Lives happily on the glass</text>
    <text x="574" y="80" font-size="14" fill="#2c5454">operating envelope: -40 °C to +85 °C</text>
    <text x="574" y="106" font-size="13" fill="#6d5a3a">winter cold through sun-heated cabin</text>
    <text x="574" y="140" font-size="14" fill="#2c5454">survives car washes and weather</text>
    <text x="574" y="176" font-size="13" fill="#6d5a3a">EPC Gen2v2 — ISO/IEC 18000-63:2015,</text>
    <text x="574" y="198" font-size="13" fill="#6d5a3a">UHF 860-960 MHz RAIN</text>
  </g>
  <g transform="translate(70,440)">
    <rect x="0" y="0" width="1050" height="120" rx="12" fill="#eef2f0" stroke="#2c5454" stroke-width="2"/>
    <text x="24" y="38" font-family="Georgia, serif" font-size="17" fill="#2c5454">Fleet plumbing included</text>
    <text x="24" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">Pre-encoded EPC per your numbering plan · reads on Impinj Speedway R420 / R700 and Zebra FX9600 fixed readers</text>
    <text x="24" y="96" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Slots into Manhattan Active, Blue Yonder, SAP Yard Logistics and Oracle WMS yard flows · MOQ 1,000</text>
  </g>
</svg>
