<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five ROI metrics that prove an AI-RFID inventory deployment</title>
<desc id="d">A five-row before-and-after scoreboard. Inventory accuracy: from a 65-75% manual counting plateau to 98-99% sustained after 90 days, per Auburn RFID Lab benchmarks. Out-of-stock incidents: from the shelf emptying first to down 30-50%, recovering substitution losses. Shrink-loss window: from 30 days to under 24 hours, against $112B annual US retail shrink reported by NRF. Counting labor: from manual cycle counts to 20-40 hours per store per week redirected to service and restocking, per SML and Avery Dennison benchmarks. Forecast error: from POS-only models to down 15-25% on RFID-confirmed sales velocity. Caption: Lululemon publicly reported 98% accuracy with under 1-year payback after RFID plus analytics rollout.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE QUARTERLY-REVIEW SCOREBOARD</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Five dials that prove the deployment</text>
<text x="700" y="130" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BEFORE</text>
<text x="985" y="130" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WITH AI ON RFID</text>

<rect x="60" y="140" width="1080" height="84" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1"/>
<text x="88" y="174" font-size="16" font-weight="700" fill="#291c0e">Inventory accuracy</text>
<text x="88" y="198" font-size="12.5" fill="#4f4f4f">manual counting plateaus (Auburn RFID Lab benchmarks)</text>
<text x="700" y="187" text-anchor="middle" font-size="14" fill="#4f4f4f">65-75%</text>
<line x1="776" y1="182" x2="826" y2="182" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 838 182 l -12 -6 v 12 z" fill="#3d6b6b"/>
<text x="862" y="178" font-size="17" font-weight="800" fill="#1f6f3a">98-99% sustained</text>
<text x="862" y="202" font-size="12.5" fill="#4f4f4f">after 90 days of deployment</text>

<rect x="60" y="233" width="1080" height="84" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1"/>
<text x="88" y="267" font-size="16" font-weight="700" fill="#291c0e">Out-of-stock incidents</text>
<text x="88" y="291" font-size="12.5" fill="#4f4f4f">replenishment triggers before the shelf empties</text>
<text x="700" y="280" text-anchor="middle" font-size="14" fill="#4f4f4f">shelf empties first</text>
<line x1="776" y1="275" x2="826" y2="275" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 838 275 l -12 -6 v 12 z" fill="#3d6b6b"/>
<text x="862" y="271" font-size="17" font-weight="800" fill="#1f6f3a">down 30-50%</text>
<text x="862" y="295" font-size="12.5" fill="#4f4f4f">substitution losses recovered</text>

<rect x="60" y="326" width="1080" height="84" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1"/>
<text x="88" y="360" font-size="16" font-weight="700" fill="#291c0e">Shrink-loss window</text>
<text x="88" y="384" font-size="12.5" fill="#4f4f4f">anomalies flagged in hours, not the month-end audit</text>
<text x="700" y="373" text-anchor="middle" font-size="14" fill="#4f4f4f">30 days</text>
<line x1="776" y1="368" x2="826" y2="368" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 838 368 l -12 -6 v 12 z" fill="#3d6b6b"/>
<text x="862" y="364" font-size="17" font-weight="800" fill="#1f6f3a">under 24 hours</text>
<text x="862" y="388" font-size="12.5" fill="#4f4f4f">against $112B US retail shrink (NRF)</text>

<rect x="60" y="419" width="1080" height="84" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1"/>
<text x="88" y="453" font-size="16" font-weight="700" fill="#291c0e">Counting labor</text>
<text x="88" y="477" font-size="12.5" fill="#4f4f4f">cycle counting automated (SML, Avery Dennison)</text>
<text x="700" y="466" text-anchor="middle" font-size="14" fill="#4f4f4f">manual cycle counts</text>
<line x1="776" y1="461" x2="826" y2="461" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 838 461 l -12 -6 v 12 z" fill="#3d6b6b"/>
<text x="862" y="457" font-size="17" font-weight="800" fill="#1f6f3a">20-40 h per store per week</text>
<text x="862" y="481" font-size="12.5" fill="#4f4f4f">redirected to service + restocking</text>

<rect x="60" y="512" width="1080" height="84" rx="12" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1"/>
<text x="88" y="546" font-size="16" font-weight="700" fill="#291c0e">Forecast error</text>
<text x="88" y="570" font-size="12.5" fill="#4f4f4f">models trained on RFID-confirmed sales velocity</text>
<text x="700" y="559" text-anchor="middle" font-size="14" fill="#4f4f4f">POS-only models</text>
<line x1="776" y1="554" x2="826" y2="554" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 838 554 l -12 -6 v 12 z" fill="#3d6b6b"/>
<text x="862" y="550" font-size="17" font-weight="800" fill="#1f6f3a">down 15-25%</text>
<text x="862" y="574" font-size="12.5" fill="#4f4f4f">less safety stock, fewer markdowns</text>

<text x="600" y="634" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Lululemon publicly reported 98% accuracy with under 1-year payback after RFID + analytics rollout.</text>
</svg>
