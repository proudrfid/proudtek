<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How many bytes each common NFC payload needs and the smallest chip that fits</title>
<desc id="d">A five-row sizing ladder. A short URL under 40 characters needs 48 to 64 bytes and fits NTAG210 or MIFARE Ultralight. A standard URL of 40 to 100 characters needs 100 to 144 bytes and fits NTAG213. A long URL with parameters of 100 to 250 characters needs 250 to 504 bytes and fits NTAG215. A vCard contact needs 300 to 800 bytes and fits NTAG215 or NTAG216. Multiple NDEF records need 500 to 2,000 bytes and fit NTAG216 or higher.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SIZE FOR THE PAYLOAD, NOT THE MAX</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">What each common payload actually needs — and the smallest chip that carries it.</text>

<text x="92" y="126" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">PAYLOAD</text>
<text x="600" y="126" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">BYTES NEEDED</text>
<text x="1112" y="126" text-anchor="end" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">SMALLEST CHIP THAT FITS</text>

<!-- row 1 -->
<rect x="64" y="138" width="1072" height="72" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<rect x="64" y="138" width="9" height="72" rx="4" fill="#1f6f3a"/>
<text x="92" y="170" font-size="15.5" font-weight="800" fill="#291c0e">Short URL</text>
<text x="92" y="192" font-size="12.5" fill="#5c5c5c">under 40 characters</text>
<text x="600" y="182" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6f3a">48–64 B</text>
<text x="1112" y="182" text-anchor="end" font-size="15" font-weight="800" fill="#26543a">NTAG210 / Ultralight</text>

<!-- row 2 -->
<rect x="64" y="218" width="1072" height="72" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<rect x="64" y="218" width="9" height="72" rx="4" fill="#1f6f3a"/>
<text x="92" y="250" font-size="15.5" font-weight="800" fill="#291c0e">Standard URL</text>
<text x="92" y="272" font-size="12.5" fill="#5c5c5c">40–100 characters</text>
<text x="600" y="262" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6f3a">100–144 B</text>
<text x="1112" y="258" text-anchor="end" font-size="15" font-weight="800" fill="#26543a">NTAG213</text>
<text x="1112" y="278" text-anchor="end" font-size="12" fill="#3a6a4a">✓ covers most projects</text>

<!-- row 3 -->
<rect x="64" y="298" width="1072" height="72" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="64" y="298" width="9" height="72" rx="4" fill="#3d6b6b"/>
<text x="92" y="330" font-size="15.5" font-weight="800" fill="#291c0e">Long URL + parameters</text>
<text x="92" y="352" font-size="12.5" fill="#5c5c5c">100–250 characters (UTM, deep links)</text>
<text x="600" y="342" text-anchor="middle" font-size="20" font-weight="800" fill="#2c5454">250–504 B</text>
<text x="1112" y="342" text-anchor="end" font-size="15" font-weight="800" fill="#2c5454">NTAG215</text>

<!-- row 4 -->
<rect x="64" y="378" width="1072" height="72" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="64" y="378" width="9" height="72" rx="4" fill="#3d6b6b"/>
<text x="92" y="410" font-size="15.5" font-weight="800" fill="#291c0e">vCard contact</text>
<text x="92" y="432" font-size="12.5" fill="#5c5c5c">name / phone / email → detailed</text>
<text x="600" y="422" text-anchor="middle" font-size="20" font-weight="800" fill="#2c5454">300–800 B</text>
<text x="1112" y="422" text-anchor="end" font-size="15" font-weight="800" fill="#2c5454">NTAG215 / NTAG216</text>

<!-- row 5 -->
<rect x="64" y="458" width="1072" height="72" rx="11" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.4"/>
<rect x="64" y="458" width="9" height="72" rx="4" fill="#c39a5f"/>
<text x="92" y="490" font-size="15.5" font-weight="800" fill="#291c0e">Multiple NDEF records</text>
<text x="92" y="512" font-size="12.5" fill="#5c5c5c">URL + text + app launch (each adds header)</text>
<text x="600" y="502" text-anchor="middle" font-size="20" font-weight="800" fill="#a07d43">500–2,000 B</text>
<text x="1112" y="502" text-anchor="end" font-size="15" font-weight="800" fill="#6d5a3a">NTAG216+</text>

<text x="600" y="576" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Round up one row for real-world headroom — but paying for row five to store a single link is the classic over-spec.</text>
</svg>
