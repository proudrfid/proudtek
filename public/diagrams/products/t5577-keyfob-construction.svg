<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Exploded layer cross-section of a 125 kHz LF T5577 keyfob</title>
  <desc id="d">An exploded side cross-section of a 125 kHz LF keyfob shown as five stacked layers with leader labels: the outer housing offered in ABS, IP68-rated silicone, epoxy or LWG-Gold leather; the potting that seals the cavity to IP68; a many-turn copper LF coil antenna tuned to 125 kHz; the T5577 die carrying a 330-bit EEPROM across 7 data blocks with a 32-bit password write-lock and an independent block-0 configuration lock; and a 304 or 316 stainless steel split ring at the keyring lug.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANATOMY OF A 125 kHz LF T5577 KEYFOB</text>
  <text x="600" y="84" text-anchor="middle" font-size="15" fill="#5c5c5c">The copper coil does the work; the shell decides how much abuse it survives</text>

  <!-- split ring -->
  <circle cx="414" cy="165" r="30" fill="#f1e6cd" stroke="#c39a5f" stroke-width="3"/>
  <circle cx="414" cy="165" r="13" fill="#ffffff" stroke="#4a5568" stroke-width="6"/>

  <!-- stacked layers -->
  <rect x="440" y="138" width="380" height="54" rx="16" fill="#f7edd6" stroke="#e4c98f" stroke-width="3"/>
  <rect x="470" y="202" width="320" height="38" rx="12" fill="#f1e6cd" stroke="#c39a5f" stroke-width="2"/>

  <rect x="470" y="250" width="320" height="62" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
  <line x1="502" y1="262" x2="502" y2="300" stroke="#c39a5f" stroke-width="2.5"/>
  <line x1="540" y1="262" x2="540" y2="300" stroke="#c39a5f" stroke-width="2.5"/>
  <line x1="578" y1="262" x2="578" y2="300" stroke="#c39a5f" stroke-width="2.5"/>
  <line x1="616" y1="262" x2="616" y2="300" stroke="#c39a5f" stroke-width="2.5"/>
  <line x1="654" y1="262" x2="654" y2="300" stroke="#c39a5f" stroke-width="2.5"/>
  <line x1="692" y1="262" x2="692" y2="300" stroke="#c39a5f" stroke-width="2.5"/>
  <line x1="730" y1="262" x2="730" y2="300" stroke="#c39a5f" stroke-width="2.5"/>
  <line x1="758" y1="262" x2="758" y2="300" stroke="#c39a5f" stroke-width="2.5"/>

  <rect x="556" y="322" width="148" height="64" rx="8" fill="#4a5568" stroke="#2f394a" stroke-width="2"/>
  <text x="630" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">T5577 die</text>
  <text x="630" y="370" text-anchor="middle" font-size="12" fill="#d7dbe2">330-bit · 7 blocks</text>

  <rect x="440" y="398" width="380" height="54" rx="16" fill="#f7edd6" stroke="#e4c98f" stroke-width="3"/>

  <!-- left label: split ring -->
  <text x="150" y="158" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">SPLIT RING</text>
  <text x="150" y="179" font-size="13" fill="#5c5c5c">304 / 316 stainless keyring lug</text>
  <line x1="292" y1="168" x2="386" y2="165" stroke="#b9c0cc" stroke-width="1.5"/>

  <!-- right labels -->
  <text x="858" y="158" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">HOUSING</text>
  <text x="858" y="179" font-size="13" fill="#5c5c5c">ABS · silicone IP68 · epoxy · leather</text>
  <line x1="820" y1="165" x2="852" y2="166" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="858" y="214" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">POTTING</text>
  <text x="858" y="235" font-size="13" fill="#5c5c5c">seals cavity to IP68 (IEC 60529)</text>
  <line x1="790" y1="221" x2="852" y2="222" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="858" y="274" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">LF COIL ANTENNA</text>
  <text x="858" y="295" font-size="13" fill="#5c5c5c">many-turn copper, tuned 125 kHz</text>
  <line x1="790" y1="281" x2="852" y2="282" stroke="#b9c0cc" stroke-width="1.5"/>

  <text x="858" y="350" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">T5577 DIE</text>
  <text x="858" y="371" font-size="13" fill="#5c5c5c">330-bit EEPROM · 32-bit password lock</text>
  <line x1="704" y1="354" x2="852" y2="356" stroke="#b9c0cc" stroke-width="1.5"/>

  <!-- lock-model callout -->
  <rect x="96" y="486" width="1008" height="56" rx="12" fill="#eef5f5" stroke="#cdd7d7" stroke-width="1.5"/>
  <text x="120" y="513" font-size="14" font-weight="700" fill="#2c5454">Lock model — 32-bit write password + independent block-0 configuration lock</text>
  <text x="120" y="534" font-size="12.5" fill="#3d6b6b">Seal the modulation profile once; keep reissuing the ID. The air interface itself carries no cryptography.</text>

  <!-- footnote -->
  <text x="600" y="624" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Off metal the 125 kHz coil reads freely; mounted on steel it needs a spacer to avoid detuning.</text>
</svg>
