<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Pre-encoding spectrum: blank, partial, full</title>
<desc id="d">A three-column comparison of hotel card encoding models. Blank cards: no per-card premium, the property generates and writes everything, the desk spends 2 to 4 seconds encoding per check-in; best for low volume with spare encoder capacity, and emergency stock lives here too. Partial pre-encoding, marked most common: adds 0.05 to 0.15 US dollars per card, the supplier prints serials while the property loads its own keys in a one-time pass of roughly 3 to 4 hours per 10,000 cards; the default for mid-sized chain properties. Full pre-encoding: adds 0.15 to 0.35 US dollars per card, the supplier injects keys under a signed key-handling agreement, cards arrive ready to issue with sub-5-second throughput; suits chain scale, typically paid back inside a year.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PRE-ENCODING SPECTRUM</text>
<text x="600" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Blank, partial, or full</text>
<text x="600" y="124" text-anchor="middle" font-size="15" fill="#4f4f4f">Same data, different desk — and different hands on the keys.</text>

<!-- column: BLANK -->
<rect x="65" y="156" width="330" height="424" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="65" y="156" width="330" height="52" rx="16" fill="#eef5f5"/>
<rect x="65" y="192" width="330" height="16" fill="#eef5f5"/>
<text x="230" y="189" text-anchor="middle" font-size="18" font-weight="800" fill="#234a4a">BLANK</text>
<text x="93" y="242" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COST</text>
<text x="93" y="266" font-size="14.5" font-weight="700" fill="#291c0e">card cost only</text>
<text x="93" y="308" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">KEY CUSTODY</text>
<text x="93" y="332" font-size="14" fill="#291c0e">property generates</text>
<text x="93" y="352" font-size="14" fill="#291c0e">and writes everything</text>
<text x="93" y="394" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PEAK DESK</text>
<text x="93" y="418" font-size="14" fill="#291c0e">2–4 s encode per card,</text>
<text x="93" y="438" font-size="14" fill="#291c0e">every single check-in</text>
<text x="93" y="480" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BEST FOR</text>
<text x="93" y="504" font-size="14" fill="#291c0e">low volume, spare</text>
<text x="93" y="524" font-size="14" fill="#291c0e">encoder capacity</text>
<text x="93" y="558" font-size="12.5" fill="#5c5c5c">emergency stock lives here too</text>

<!-- column: PARTIAL (highlight) -->
<rect x="435" y="156" width="330" height="424" rx="16" fill="#ffffff" stroke="#3d6b6b" stroke-width="3"/>
<rect x="435" y="156" width="330" height="52" rx="16" fill="#3d6b6b"/>
<rect x="435" y="192" width="330" height="16" fill="#3d6b6b"/>
<text x="600" y="189" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">PARTIAL</text>
<rect x="530" y="216" width="140" height="26" rx="13" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.5"/>
<text x="600" y="234" text-anchor="middle" font-size="12" font-weight="800" fill="#6d5a3a">MOST COMMON</text>
<text x="463" y="276" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COST</text>
<text x="463" y="300" font-size="14.5" font-weight="700" fill="#291c0e">+US$0.05–0.15 per card</text>
<text x="463" y="340" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">KEY CUSTODY</text>
<text x="463" y="364" font-size="14" fill="#291c0e">supplier prints serials;</text>
<text x="463" y="384" font-size="14" fill="#291c0e">property loads its own keys</text>
<text x="463" y="404" font-size="13" fill="#5c5c5c">(one pass: 3–4 h / 10,000 cards)</text>
<text x="463" y="444" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PEAK DESK</text>
<text x="463" y="468" font-size="14" fill="#291c0e">balanced — serials printed,</text>
<text x="463" y="488" font-size="14" fill="#291c0e">data written at the desk</text>
<text x="463" y="528" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BEST FOR</text>
<text x="463" y="552" font-size="14" fill="#291c0e">mid-sized chain default</text>

<!-- column: FULL -->
<rect x="805" y="156" width="330" height="424" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="805" y="156" width="330" height="52" rx="16" fill="#eef5f5"/>
<rect x="805" y="192" width="330" height="16" fill="#eef5f5"/>
<text x="970" y="189" text-anchor="middle" font-size="18" font-weight="800" fill="#234a4a">FULL</text>
<text x="833" y="242" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COST</text>
<text x="833" y="266" font-size="14.5" font-weight="700" fill="#291c0e">+US$0.15–0.35 per card</text>
<text x="833" y="308" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">KEY CUSTODY</text>
<text x="833" y="332" font-size="14" fill="#291c0e">supplier injects keys —</text>
<text x="833" y="352" font-size="14" fill="#291c0e">signed key-handling agreement</text>
<text x="833" y="394" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PEAK DESK</text>
<text x="833" y="418" font-size="14" fill="#291c0e">ready-to-issue drawer,</text>
<text x="833" y="438" font-size="14" fill="#291c0e">sub-5-second throughput</text>
<text x="833" y="480" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BEST FOR</text>
<text x="833" y="504" font-size="14" fill="#291c0e">chain scale — typically</text>
<text x="833" y="524" font-size="14" fill="#291c0e">paid back inside a year</text>
<text x="833" y="558" font-size="12.5" fill="#5c5c5c">treat keys like safe combinations</text>

<!-- caption -->
<text x="600" y="622" text-anchor="middle" font-size="14" fill="#5c5c5c">Moving right: faster desks, more supplier trust, more paperwork about that trust.</text>
</svg>
