<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The luxury NFC adoption leaderboard</title>
<desc id="d">Five ranked rows show who is chipping what. Hermès: Birkin and Kelly chipped, live for authentication and repair intake at boutiques. Louis Vuitton and LVMH: Aura Blockchain Consortium pilot with one authentication backend across the labels. Streetwear and sneakers: Nike, Adidas and kin, early adopters because resale is the show. Prada: select capsule collections chipped, full catalog idling at the EU DPP deadline. Watches: Rolex, Patek Philippe, Audemars Piguet still lead with paper provenance — lagging.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHO'S CHIPPING WHAT — THE LUXURY NFC LEADERBOARD</text>

