<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">One T5577 blank emulates thirty-plus 125 kHz credential formats</title>
  <desc id="d">A central T5577 rewritable 125 kHz chip on the left, labelled 330-bit EEPROM across 7 data blocks with a block-0 configuration lock, with arrows fanning out to six legacy 125 kHz credential families it can emulate: native EM4100 / EM4200 / EM4450 read-only ID; HID Prox H10301 and Corporate 1000; Indala; AWID; Kantech ioProx, Pyramid and Farpointe; and Viking, Keri and Nexwatch. A red caption notes the 125 kHz LF air interface has no cryptography and the emulated ID is clone-readable by any reader.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE T5577 — THIRTY-PLUS 125 kHz FORMATS</text>
  <text x="600" y="84" text-anchor="middle" font-size="15" fill="#5c5c5c">Set the block-0 configuration word once; reissue any legacy credential forever</text>

  <!-- central chip -->
  <rect x="96" y="250" width="252" height="150" rx="16" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
  <text x="222" y="306" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff">T5577</text>
  <text x="222" y="338" text-anchor="middle" font-size="13.5" fill="#eef5f5">330-bit EEPROM · 7 data blocks</text>
  <text x="222" y="360" text-anchor="middle" font-size="13.5" fill="#eef5f5">block-0 configuration lock</text>
  <text x="222" y="384" text-anchor="middle" font-size="13" fill="#d7e6e6">rewritable · ≥ 30 formats</text>

  <!-- arrows -->
  <line x1="348" y1="325" x2="700" y2="140" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="700,140 686,135 686,145" fill="#4a5568"/>
  <line x1="348" y1="325" x2="700" y2="214" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="700,214 686,209 686,219" fill="#4a5568"/>
  <line x1="348" y1="325" x2="700" y2="288" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="700,288 686,283 686,293" fill="#4a5568"/>
  <line x1="348" y1="325" x2="700" y2="362" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="700,362 686,357 686,367" fill="#4a5568"/>
  <line x1="348" y1="325" x2="700" y2="436" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="700,436 686,431 686,441" fill="#4a5568"/>
  <line x1="348" y1="325" x2="700" y2="510" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="700,510 686,505 686,515" fill="#4a5568"/>

  <!-- format cards -->
  <rect x="708" y="112" width="468" height="56" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="708" y="112" width="8" height="56" rx="4" fill="#3d6b6b"/>
  <text x="736" y="137" font-size="16.5" font-weight="700" fill="#291c0e">EM4100 / EM4200 / EM4450</text>
  <text x="736" y="156" font-size="13" fill="#5c5c5c">Native 64 / 128-bit read-only ID</text>

  <rect x="708" y="186" width="468" height="56" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="708" y="186" width="8" height="56" rx="4" fill="#3d6b6b"/>
  <text x="736" y="211" font-size="16.5" font-weight="700" fill="#291c0e">HID Prox H10301</text>
  <text x="736" y="230" font-size="13" fill="#5c5c5c">26-bit + Corporate 1000 35 / 48-bit</text>

  <rect x="708" y="260" width="468" height="56" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="708" y="260" width="8" height="56" rx="4" fill="#3d6b6b"/>
  <text x="736" y="285" font-size="16.5" font-weight="700" fill="#291c0e">Indala</text>
  <text x="736" y="304" font-size="13" fill="#5c5c5c">26 / 27-bit legacy Wiegand</text>

  <rect x="708" y="334" width="468" height="56" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="708" y="334" width="8" height="56" rx="4" fill="#3d6b6b"/>
  <text x="736" y="359" font-size="16.5" font-weight="700" fill="#291c0e">AWID</text>
  <text x="736" y="378" font-size="13" fill="#5c5c5c">26 / 34-bit legacy Wiegand</text>

  <rect x="708" y="408" width="468" height="56" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="708" y="408" width="8" height="56" rx="4" fill="#3d6b6b"/>
  <text x="736" y="433" font-size="16.5" font-weight="700" fill="#291c0e">Kantech ioProx · Pyramid · Farpointe</text>
  <text x="736" y="452" font-size="13" fill="#5c5c5c">26-bit · 37-bit · 26 / 34-bit</text>

  <rect x="708" y="482" width="468" height="56" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="708" y="482" width="8" height="56" rx="4" fill="#3d6b6b"/>
  <text x="736" y="507" font-size="16.5" font-weight="700" fill="#291c0e">Viking · Keri · Nexwatch</text>
  <text x="736" y="526" font-size="13" fill="#5c5c5c">additional legacy Wiegand formats</text>

  <!-- risk caption -->
  <rect x="96" y="560" width="1080" height="64" rx="12" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="1.5"/>
  <text x="120" y="588" font-size="15" font-weight="700" fill="#8b2d2d">Security posture — 125 kHz LF has no cryptography</text>
  <text x="120" y="610" font-size="13.5" fill="#8b2d2d">Any 125 kHz reader — Proxmark or Flipper Zero included — reads and clones the emulated ID. Correct for retrofit and audit, not high-security doors.</text>
</svg>
