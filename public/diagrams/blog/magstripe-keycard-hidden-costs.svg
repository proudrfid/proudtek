<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five cost centers behind magstripe keycard failure, only one of which is the replacement card</title>
<desc id="d">Five stacked cost drivers of magnetic-stripe keycard failure. One, front-desk re-encoding labor at 2 to 3 minutes per incident across 15 to 25 percent of stays. Two, consumable card waste adding 1,500 to 3,000 dollars per year at a 200-room property. Three, guest-satisfaction decline, a top-three complaint category. Four, dated brand perception as contactless becomes the floor. Five, security and litigation exposure, illustrated by a 2 million dollar settlement in 2022 over cloned magstripe credentials.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT MAGSTRIPE FAILURE ACTUALLY COSTS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Five cost centers behind "the guest did nothing wrong" — only one is the replacement card.</text>

<!-- row 1 -->
<rect x="64" y="120" width="1072" height="74" rx="12" fill="#fbf7ee" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="64" y="120" width="9" height="74" rx="4" fill="#4a5568"/>
<circle cx="104" cy="157" r="16" fill="#4a5568"/>
<text x="104" y="162" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="140" y="151" font-size="15.5" font-weight="700" fill="#291c0e">Front-desk re-encoding labor</text>
<text x="140" y="173" font-size="13" fill="#5c5c5c">2-3 min per incident, always at peak check-in</text>
<rect x="804" y="133" width="308" height="48" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="958" y="162" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">15-25% of stays</text>

<!-- row 2 -->
<rect x="64" y="206" width="1072" height="74" rx="12" fill="#fbf7ee" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="64" y="206" width="9" height="74" rx="4" fill="#4a5568"/>
<circle cx="104" cy="243" r="16" fill="#4a5568"/>
<text x="104" y="248" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="140" y="237" font-size="15.5" font-weight="700" fill="#291c0e">Consumable card waste</text>
<text x="140" y="259" font-size="13" fill="#5c5c5c">guests bin cards they assume are broken</text>
<rect x="804" y="219" width="308" height="48" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="958" y="248" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">+$1,500-3,000 / yr *</text>

<!-- row 3 -->
<rect x="64" y="292" width="1072" height="74" rx="12" fill="#fbf7ee" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="64" y="292" width="9" height="74" rx="4" fill="#4a5568"/>
<circle cx="104" cy="329" r="16" fill="#4a5568"/>
<text x="104" y="334" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="140" y="323" font-size="15.5" font-weight="700" fill="#291c0e">Guest-satisfaction decline</text>
<text x="140" y="345" font-size="13" fill="#5c5c5c">lockouts land in reviews and NPS</text>
<rect x="804" y="305" width="308" height="48" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="958" y="334" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">top-3 complaint</text>

<!-- row 4 -->
<rect x="64" y="378" width="1072" height="74" rx="12" fill="#fbf7ee" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="64" y="378" width="9" height="74" rx="4" fill="#4a5568"/>
<circle cx="104" cy="415" r="16" fill="#4a5568"/>
<text x="104" y="420" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="140" y="409" font-size="15.5" font-weight="700" fill="#291c0e">Dated brand perception</text>
<text x="140" y="431" font-size="13" fill="#5c5c5c">a swipe card that fails near a phone feels obsolete</text>
<rect x="804" y="391" width="308" height="48" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="958" y="420" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">contactless is the floor</text>

<!-- row 5 -->
<rect x="64" y="464" width="1072" height="74" rx="12" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.5"/>
<rect x="64" y="464" width="9" height="74" rx="4" fill="#8b2d2d"/>
<circle cx="104" cy="501" r="16" fill="#8b2d2d"/>
<text x="104" y="506" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
<text x="140" y="495" font-size="15.5" font-weight="700" fill="#291c0e">Security &amp; litigation exposure</text>
<text x="140" y="517" font-size="13" fill="#5c5c5c">cloned magstripe credentials, not a guest-experience nit</text>
<rect x="804" y="477" width="308" height="48" rx="10" fill="#ffffff" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="958" y="506" text-anchor="middle" font-size="14.5" font-weight="800" fill="#8b2d2d">$2M settlement, 2022</text>

<text x="600" y="574" text-anchor="middle" font-size="13.5" fill="#5c5c5c">* 200-room property at 70% occupancy. Only line 1 is the card — the other four are the real bill.</text>
</svg>
