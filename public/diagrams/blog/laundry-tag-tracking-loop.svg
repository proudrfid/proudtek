<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The laundry loop, with a count at every corner</title>
<desc id="d">Four RFID read points around the commercial laundry loop: soil-sort intake, wash, finish, and dispatch — each producing an automated piece count. In the middle, the problem being closed: without per-item tracking, 10 to 15 percent of linen vanishes yearly into guest bags, mop closets and loading docks; with the loop instrumented, loss drops below 5 percent and every gap has an address.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">A COUNT AT EVERY CORNER</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Where the linen goes — and where it stops going missing</text>

<rect x="90" y="150" width="240" height="110" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="210" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">SOIL-SORT INTAKE</text>
<text x="210" y="224" text-anchor="middle" font-size="12.5" fill="#4f4f4f">dirty linen arrives, counted in</text>
<rect x="870" y="150" width="240" height="110" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="990" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">WASH</text>
<text x="990" y="224" text-anchor="middle" font-size="12.5" fill="#4f4f4f">counted through the tunnel</text>
<rect x="870" y="420" width="240" height="110" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="990" y="466" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">FINISH</text>
<text x="990" y="494" text-anchor="middle" font-size="12.5" fill="#4f4f4f">dried, pressed, counted again</text>
<rect x="90" y="420" width="240" height="110" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="210" y="466" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">DISPATCH</text>
<text x="210" y="494" text-anchor="middle" font-size="12.5" fill="#4f4f4f">counted out the door</text>

<path d="M 340 205 h 520" stroke="#c39a5f" stroke-width="2.5"/>
<path d="M 860 205 l -12 -6 v 12 z" fill="#c39a5f"/>
<path d="M 990 270 v 140" stroke="#c39a5f" stroke-width="2.5"/>
<path d="M 990 410 l -6 -12 h 12 z" fill="#c39a5f"/>
<path d="M 860 475 h -520" stroke="#c39a5f" stroke-width="2.5"/>
<path d="M 340 475 l 12 -6 v 12 z" fill="#c39a5f"/>
<path d="M 210 410 v -140" stroke="#c39a5f" stroke-width="2.5"/>
<path d="M 210 270 l -6 12 h 12 z" fill="#c39a5f"/>

<g fill="#1f6f3a">
<circle cx="340" cy="205" r="13"/>
<circle cx="990" cy="330" r="13"/>
<circle cx="600" cy="475" r="13"/>
<circle cx="210" cy="330" r="13"/>
</g>
<g fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">
<text x="340" y="210">✓</text><text x="990" y="335">✓</text><text x="600" y="480">✓</text><text x="210" y="335">✓</text>
</g>

<rect x="420" y="270" width="360" height="150" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="304" text-anchor="middle" font-size="14" font-weight="800" fill="#8b2d2d">WITHOUT TRACKING</text>
<text x="600" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#8b2d2d">10–15% vanishes yearly</text>
<text x="600" y="354" text-anchor="middle" font-size="12" fill="#4f4f4f">guest bags · mop closets · loading docks</text>
<text x="600" y="386" text-anchor="middle" font-size="15" font-weight="800" fill="#1f6f3a">with the loop instrumented: under 5%</text>
<text x="600" y="408" text-anchor="middle" font-size="12" fill="#4f4f4f">and every gap finally has an address</text>

<text x="600" y="586" text-anchor="middle" font-size="13.5" fill="#291c0e" font-weight="600">Bundled in bags or stacked on carts — no line of sight required, the count happens anyway.</text>
<text x="600" y="626" text-anchor="middle" font-size="13" fill="#5c5c5c">Bonus: per-item wash counts turn "replace everything yearly" into "replace what's actually worn out."</text>
</svg>
