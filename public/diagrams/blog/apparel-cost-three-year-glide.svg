<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The 3-year glide path: per-unit RFID program cost falls from $0.18-0.30 to $0.06-0.10</title>
<desc id="d">Line chart of per-unit apparel RFID program cost across three phases. Year 1, the ramp — cost-heavy and dramatic — runs $0.18-0.30 per unit with hardware fully loaded and integration at consultant rates. Year 2, normalize, drops to $0.10-0.15 as hardware deploys and integration moves in-house. Year 3, amortize, reaches the promised floor of $0.06-0.10 as infrastructure spreads across full annual volume. A shaded band traces the max-min range with a bold midline. A footer notes cumulative 3-year spend of $5M-8M for a tier-1 supplier at 10M units a year — the tag price barely moves; everything around it melts.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE 3-YEAR GLIDE PATH</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Three acts the CFO will actually sign</text>

<!-- phase washes -->
<rect x="150" y="150" width="310" height="330" fill="#f7edd6"/>
<rect x="460" y="150" width="310" height="330" fill="#eef5f5"/>
<rect x="770" y="150" width="310" height="330" fill="#e9f2ec"/>

<!-- gridlines -->
<line x1="150" y1="150" x2="1080" y2="150" stroke="#eee6d6" stroke-width="1"/>
<text x="138" y="154" text-anchor="end" font-size="12.5" fill="#5c5c5c">$0.30</text>
<line x1="150" y1="260" x2="1080" y2="260" stroke="#eee6d6" stroke-width="1"/>
<text x="138" y="264" text-anchor="end" font-size="12.5" fill="#5c5c5c">$0.20</text>
<line x1="150" y1="370" x2="1080" y2="370" stroke="#eee6d6" stroke-width="1"/>
<text x="138" y="374" text-anchor="end" font-size="12.5" fill="#5c5c5c">$0.10</text>
<line x1="150" y1="480" x2="1080" y2="480" stroke="#d9cfbc" stroke-width="1.5"/>
<text x="138" y="484" text-anchor="end" font-size="12.5" fill="#5c5c5c">$0</text>
<text x="150" y="136" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6d5a3a">PER-UNIT PROGRAM COST</text>

<!-- range band -->
<polygon points="305,150 615,315 925,370 925,414 615,370 305,282" fill="#dcebeb"/>
<polyline points="305,150 615,315 925,370" fill="none" stroke="#7fa3a3" stroke-width="2" stroke-dasharray="5 5"/>
<polyline points="305,282 615,370 925,414" fill="none" stroke="#7fa3a3" stroke-width="2" stroke-dasharray="5 5"/>

<!-- midline -->
<polyline points="305,216 615,343 925,392" fill="none" stroke="#3d6b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="305" cy="216" r="7" fill="#ffffff" stroke="#3d6b6b" stroke-width="4"/>
<circle cx="615" cy="343" r="7" fill="#ffffff" stroke="#3d6b6b" stroke-width="4"/>
<circle cx="925" cy="392" r="7" fill="#ffffff" stroke="#3d6b6b" stroke-width="4"/>

<!-- value labels -->
<text x="321" y="221" font-size="15" font-weight="700" fill="#234a4a">$0.18–0.30</text>
<text x="631" y="348" font-size="15" font-weight="700" fill="#234a4a">$0.10–0.15</text>
<text x="941" y="397" font-size="15" font-weight="700" fill="#234a4a">$0.06–0.10</text>

<!-- phase labels -->
<text x="305" y="520" text-anchor="middle" font-size="16" font-weight="700" fill="#8a6b3c">YEAR 1 · RAMP</text>
<text x="305" y="542" text-anchor="middle" font-size="12.5" fill="#5c5c5c">cost-heavy, dramatic</text>
<text x="615" y="520" text-anchor="middle" font-size="16" font-weight="700" fill="#2c5454">YEAR 2 · NORMALIZE</text>
<text x="615" y="542" text-anchor="middle" font-size="12.5" fill="#5c5c5c">finding its feet</text>
<text x="925" y="520" text-anchor="middle" font-size="16" font-weight="700" fill="#2d6a4f">YEAR 3 · AMORTIZE</text>
<text x="925" y="542" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the per-unit floor</text>

<text x="600" y="600" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Cumulative 3-year spend: $5M–8M for a tier-1 supplier at 10M units / year — the tag barely moves; everything around it melts.</text>
</svg>
