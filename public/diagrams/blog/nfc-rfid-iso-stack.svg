<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="isoTitle isoDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="isoTitle">The ISO and IEC standards that govern NFC, HF RFID and UHF RFID</title>
  <desc id="isoDesc">Five standards grouped by frequency band. HF at 13.56 megahertz covers three: ISO/IEC 14443, the proximity standard under 10 centimetres at up to 848 kilobits per second for payment and secure NFC, which your iPhone speaks; ISO/IEC 15693, the vicinity standard at about 1.5 metres for library and ICODE; and ISO/IEC 18092 plus 21481, the NFCIP peer-to-peer layers and Type 1 to 5 tags. UHF at 860 to 960 megahertz uses ISO/IEC 18000-63, known as EPC Gen2v2 or RAIN RFID, at 1 to 15 metres for Walmart, Target and Zara, which the warehouse portal speaks. LF at 125 to 134 kilohertz uses ISO/IEC 18000-2, ISO 11784/85 and ISO 14223 for animal ID and legacy access.</desc>
  <defs>
    <radialGradient id="isoBg" cx="50%" cy="14%" r="94%"><stop offset="0%" stop-color="#f8f1e2"/><stop offset="100%" stop-color="#f3eee2"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#isoBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">THE ISO/IEC STACK — WHO SPEAKS WHICH LAYER</text>

  <!-- Row 1: HF 14443 -->
  <rect x="56" y="80" width="1088" height="96" rx="14" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="72" y="96" width="156" height="64" rx="10" fill="#e6efef" stroke="#3d6b6b" stroke-width="2"/>
  <text x="150" y="124" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">HF</text>
  <text x="150" y="146" text-anchor="middle" font-size="13.5" fill="#2c5454">13.56 MHz</text>
  <text x="250" y="118" font-size="18.5" font-weight="800" fill="#291c0e">ISO/IEC 14443 · proximity &lt;10 cm · up to 848 kbps</text>
  <text x="250" y="148" font-size="15.5" fill="#4f4f4f">Contactless payment (EMV), transit cards, the secure NFC profile</text>
  <rect x="892" y="108" width="228" height="44" rx="22" fill="#e8f9fe" stroke="#1fcefb" stroke-width="1.5"/><text x="1006" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#0f6d84">your iPhone speaks this</text>

  <!-- Row 2: HF 15693 -->
  <rect x="56" y="186" width="1088" height="96" rx="14" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="72" y="202" width="156" height="64" rx="10" fill="#e6efef" stroke="#3d6b6b" stroke-width="2"/>
  <text x="150" y="230" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">HF</text>
  <text x="150" y="252" text-anchor="middle" font-size="13.5" fill="#2c5454">13.56 MHz</text>
  <text x="250" y="224" font-size="18.5" font-weight="800" fill="#291c0e">ISO/IEC 15693 · vicinity · ~1.5 m · slower</text>
  <text x="250" y="254" font-size="15.5" fill="#4f4f4f">Library books, light asset tracking, ICODE chips</text>
  <rect x="892" y="214" width="228" height="44" rx="22" fill="#e6efef" stroke="#3d6b6b" stroke-width="1.5"/><text x="1006" y="242" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">phones: NFC-V, narrower</text>

  <!-- Row 3: HF 18092/21481 -->
  <rect x="56" y="292" width="1088" height="96" rx="14" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="72" y="308" width="156" height="64" rx="10" fill="#e6efef" stroke="#3d6b6b" stroke-width="2"/>
  <text x="150" y="336" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">HF</text>
  <text x="150" y="358" text-anchor="middle" font-size="13.5" fill="#2c5454">13.56 MHz</text>
  <text x="250" y="330" font-size="18.5" font-weight="800" fill="#291c0e">ISO/IEC 18092 + 21481 · NFCIP-1 / NFCIP-2</text>
  <text x="250" y="360" font-size="15.5" fill="#4f4f4f">The NFC-specific layer: peer-to-peer + NFC Forum Type 1–5 tags</text>
  <rect x="892" y="320" width="228" height="44" rx="22" fill="#e8f9fe" stroke="#1fcefb" stroke-width="1.5"/><text x="1006" y="348" text-anchor="middle" font-size="15" font-weight="800" fill="#0f6d84">the NFC layer proper</text>

  <!-- Row 4: UHF 18000-63 -->
  <rect x="56" y="398" width="1088" height="96" rx="14" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="72" y="414" width="156" height="64" rx="10" fill="#e9eef5" stroke="#1f4e79" stroke-width="2"/>
  <text x="150" y="442" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">UHF</text>
  <text x="150" y="464" text-anchor="middle" font-size="12.5" fill="#1f4e79">860–960 MHz</text>
  <text x="250" y="436" font-size="18.5" font-weight="800" fill="#291c0e">ISO/IEC 18000-63 · EPC Gen2v2 · RAIN · 1–15 m</text>
  <text x="250" y="466" font-size="15.5" fill="#4f4f4f">Anti-collision for hundreds of tags/sec · Walmart, Target, Decathlon, Zara</text>
  <rect x="892" y="426" width="228" height="44" rx="22" fill="#eef1f6" stroke="#4a5568" stroke-width="1.5"/><text x="1006" y="454" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79">the warehouse portal</text>

  <!-- Row 5: LF family -->
  <rect x="56" y="504" width="1088" height="96" rx="14" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="72" y="520" width="156" height="64" rx="10" fill="#f1e6cf" stroke="#c39a5f" stroke-width="2"/>
  <text x="150" y="548" text-anchor="middle" font-size="18" font-weight="800" fill="#6d5a3a">LF</text>
  <text x="150" y="570" text-anchor="middle" font-size="12.5" fill="#6d5a3a">125–134 kHz</text>
  <text x="250" y="542" font-size="18.5" font-weight="800" fill="#291c0e">ISO/IEC 18000-2 · ISO 11784/85 · ISO 14223</text>
  <text x="250" y="572" font-size="15.5" fill="#4f4f4f">Animal microchips, legacy access, penetration through liquid or tissue</text>
  <rect x="892" y="532" width="228" height="44" rx="22" fill="#f1e6cf" stroke="#c39a5f" stroke-width="1.5"/><text x="1006" y="560" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">deliberate legacy pick</text>
</svg>
