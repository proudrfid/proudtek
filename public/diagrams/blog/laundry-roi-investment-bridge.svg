<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The ROI framework — every cost row against every savings row</title>
<desc id="d">Left column, the investment: tags at $0.30-0.90 each meaning $15-45K to tag a 50,000-piece par level; tunnel readers $3-8K each; portal readers $2-5K; handhelds $0.8-2K with 3-6 read points needed; software $500-2,000 a month; installation and training $5-15K — total initial investment $40-100K for a mid-size facility. Right column, the return: $60-150K in annual savings from loss reduction and labor. The bridge meets at a typical 6-14 month payback, faster where loss rates or labor costs run high.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DON'T SKIP THE BORING ROWS</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">The whole model on one bridge</text>

<rect x="60" y="130" width="500" height="410" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="310" y="168" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">WHAT GOES IN</text>
<g font-size="13.5" fill="#291c0e">
<text x="100" y="210">tags · $0.30–0.90 each</text>
<text x="520" y="210" text-anchor="end" font-weight="700">$15K–45K</text>
<text x="100" y="234" font-size="12" fill="#4f4f4f">(50,000-piece par level, tagged once)</text>
<text x="100" y="272">tunnel readers · $3K–8K each</text>
<text x="100" y="304">portal readers · $2K–5K each</text>
<text x="100" y="336">handhelds · $0.8K–2K each</text>
<text x="520" y="304" text-anchor="end" font-weight="700">3–6 read points</text>
<text x="100" y="374">software · $500–2,000 / month</text>
<text x="100" y="406">install + training</text>
<text x="520" y="406" text-anchor="end" font-weight="700">$5K–15K</text>
</g>
<line x1="100" y1="436" x2="520" y2="436" stroke="#291c0e" stroke-width="2"/>
<text x="100" y="472" font-size="16" font-weight="800" fill="#291c0e">Total, mid-size facility</text>
<text x="520" y="472" text-anchor="end" font-size="18" font-weight="800" fill="#6d5a3a">$40K–100K</text>
<text x="100" y="504" font-size="12" fill="#5c5c5c">one-time, plus the monthly software line</text>

<path d="M 574 330 h 50" stroke="#1f6f3a" stroke-width="3"/>
<path d="M 624 330 l -14 -8 v 16 z" fill="#1f6f3a"/>

<rect x="640" y="130" width="500" height="250" rx="16" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="890" y="168" text-anchor="middle" font-size="15" font-weight="800" fill="#1b4332">WHAT COMES BACK, YEARLY</text>
<text x="890" y="240" text-anchor="middle" font-size="34" font-weight="800" fill="#1b4332">$60K–150K</text>
<text x="890" y="286" text-anchor="middle" font-size="13.5" fill="#4f4f4f">loss reduction + counting labor +</text>
<text x="890" y="310" text-anchor="middle" font-size="13.5" fill="#4f4f4f">inventory no longer over-purchased</text>
<text x="890" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">recurs every year the system runs</text>

<rect x="640" y="404" width="500" height="136" rx="16" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="890" y="446" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">WHERE THEY MEET</text>
<text x="890" y="490" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">payback in 6–14 months</text>
<text x="890" y="520" text-anchor="middle" font-size="12.5" fill="#4f4f4f">high loss rate or high labor cost → the fast end</text>

<text x="600" y="590" text-anchor="middle" font-size="13.5" font-weight="600" fill="#291c0e">Two columns, side by side — the model mostly writes itself.</text>
<text x="600" y="626" text-anchor="middle" font-size="13" fill="#5c5c5c">Worked hotel and hospital builds with every line item follow below.</text>
</svg>
