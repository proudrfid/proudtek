<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Gen2X in three panels — faster reads, clone-tag checks, battery-free sensing</title>
<desc id="d">Three panels summarize what Gen2X adds on top of standard EPC Gen2. Speed: a gauge showing roughly 30% faster inventory cycles via Fast Reinventory, plus tighter read-zone confinement. Trust: a shield with a check mark for endpoint IC verification — clone tags denied at the read, authenticity beyond TID lock. Sensing: a sensor card with a thermometer, a droplet and a strain wave for battery-free sensing of temperature, moisture and strain over the same passive UHF link, aimed at cold chain and structural monitoring. A footer notes Gen2X released December 2024 with broad availability across chip vendors by Q4 2025, and that it is backwards-compatible — non-Gen2X inlays keep working with Gen2X readers.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">GEN2X · STANDARDS-COMPATIBLE WITH EPC GEN2</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Three upgrades, zero batteries</text>

<!-- panel 1: speed -->
<rect x="60" y="128" width="340" height="390" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="230" y="162" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="2" fill="#2c5454">SPEED</text>
<circle cx="230" cy="292" r="62" fill="none" stroke="#d7e5e5" stroke-width="13"/>
<path d="M 230 230 A 62 62 0 0 1 283.7 323" fill="none" stroke="#3d6b6b" stroke-width="13" stroke-linecap="round"/>
<text x="230" y="286" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#2c5454">~30%</text>
<text x="230" y="312" text-anchor="middle" font-size="13" fill="#4f4f4f">faster cycles</text>
<text x="230" y="430" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Fast Reinventory</text>
<text x="230" y="458" text-anchor="middle" font-size="13.5" fill="#4f4f4f">~30% faster inventory cycles</text>
<text x="230" y="480" text-anchor="middle" font-size="13" fill="#5c5c5c">plus tighter read-zone confinement</text>

<!-- panel 2: trust -->
<rect x="440" y="128" width="340" height="390" rx="16" fill="#eef7f1" stroke="#a8cbb8" stroke-width="1.5"/>
<text x="610" y="162" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="2" fill="#1b4332">TRUST</text>
<path d="M 610 214 l 60 25 v 42 c 0 40 -32 64 -60 74 c -28 -10 -60 -34 -60 -74 v -42 z" fill="#ffffff" stroke="#2d6a4f" stroke-width="4.5" stroke-linejoin="round"/>
<path d="M 580 288 l 17 19 l 36 -40" fill="none" stroke="#1f6f3a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="610" y="430" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Endpoint IC verification</text>
<text x="610" y="458" text-anchor="middle" font-size="13.5" fill="#4f4f4f">clone tags, denied at the read</text>
<text x="610" y="480" text-anchor="middle" font-size="13" fill="#5c5c5c">authenticity beyond TID lock</text>

<!-- panel 3: sensing -->
<rect x="820" y="128" width="340" height="390" rx="16" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="990" y="162" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="2" fill="#8a6a2f">SENSING</text>
<rect x="915" y="232" width="150" height="104" rx="14" fill="#ffffff" stroke="#e4c98f" stroke-width="2.5"/>
<rect x="938" y="252" width="6" height="40" rx="3" fill="#e6dfd2"/>
<rect x="938" y="272" width="6" height="20" fill="#c39a5f"/>
<circle cx="941" cy="298" r="8" fill="#c39a5f"/>
<path d="M 990 250 c 13 16 13 30 0 34 c -13 -4 -13 -18 0 -34 z" fill="#177a92"/>
<path d="M 1020 280 q 8 -18 16 0 q 8 18 16 0" fill="none" stroke="#8a6a2f" stroke-width="3.5" stroke-linecap="round"/>
<text x="990" y="430" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Battery-free sensing</text>
<text x="990" y="458" text-anchor="middle" font-size="13.5" fill="#4f4f4f">temp · moisture · strain</text>
<text x="990" y="480" text-anchor="middle" font-size="13" fill="#5c5c5c">cold chain + structural monitoring</text>

<!-- footer -->
<rect x="60" y="548" width="1080" height="76" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="580" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Released Dec 2024 · broad availability across chip vendors by Q4 2025</text>
<text x="600" y="604" text-anchor="middle" font-size="13" fill="#4f4f4f">Backwards-compatible: non-Gen2X inlays keep working with Gen2X readers — upgrade on your own refresh cycle, not in a panic.</text>
