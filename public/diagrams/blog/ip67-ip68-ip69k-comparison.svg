<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">IP67 versus IP68 versus IP69K for RFID tags: test condition, price and where each is needed</title>
<desc id="d">Three ratings compared. IP67 is tested by immersion in 1 metre of fresh water for 30 minutes, costs 1.50 to 5 dollars, and suits signage, vehicle asset tags, occasional rain and most industrial laundry tags. IP68 is continuous immersion of 1.5 to 3 metres for 24 hours or more, costs 3 to 10 dollars, and suits permanently submerged buoys, docks, irrigation valves and trapped water. IP69K is an 80 to 100 bar spray at 80 degrees Celsius from multiple angles per DIN 40050-9 and ISO 20653, costs 5 to 25 dollars, and suits wash-down in food, dairy, pharmaceutical clean-in-place and meat processing. Field data: during active clean-in-place wash-down, IP69K held a 99.8 percent read rate while IP68 dropped to 70 to 85 percent because brief water films detune the antenna at HF.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">IP67 vs IP68 vs IP69K · WHAT EACH RATING BUYS</text>
<text x="600" y="80" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Higher isn't "better" — it's a cost-vs-environment trade. IP69K runs 2–4× the price of IP67.</text>

<!-- col IP67 -->
<rect x="64" y="104" width="346" height="352" rx="13" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<rect x="64" y="104" width="346" height="8" rx="4" fill="#3d6b6b"/>
<text x="86" y="150" font-size="26" font-weight="800" fill="#2c5454">IP67</text>
<text x="86" y="184" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TEST</text>
<text x="86" y="205" font-size="13.5" fill="#333333">1 m fresh water · 30 min</text>
<text x="86" y="246" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PRICE / UHF HARD-TAG</text>
<text x="86" y="278" font-size="24" font-weight="800" fill="#291c0e">$1.50–$5</text>
<text x="86" y="318" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE</text>
<text x="86" y="340" font-size="13" fill="#333333">Signage, vehicle asset tags,</text>
<text x="86" y="360" font-size="13" fill="#333333">occasional rain or splash,</text>
<text x="86" y="380" font-size="13" fill="#333333">most industrial laundry tags.</text>

<!-- col IP68 -->
<rect x="428" y="104" width="346" height="352" rx="13" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<rect x="428" y="104" width="346" height="8" rx="4" fill="#4a5568"/>
<text x="450" y="150" font-size="26" font-weight="800" fill="#3a4456">IP68</text>
<text x="450" y="184" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TEST</text>
<text x="450" y="205" font-size="13.5" fill="#333333">Continuous 1.5–3 m · 24 h+</text>
<text x="450" y="246" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PRICE / UHF HARD-TAG</text>
<text x="450" y="278" font-size="24" font-weight="800" fill="#291c0e">$3–$10</text>
<text x="450" y="318" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE</text>
<text x="450" y="340" font-size="13" fill="#333333">Submerged: buoys, dock,</text>
<text x="450" y="360" font-size="13" fill="#333333">irrigation valves, underwater;</text>
<text x="450" y="380" font-size="13" fill="#333333">puddles &amp; trapped water.</text>

<!-- col IP69K -->
<rect x="792" y="104" width="346" height="352" rx="13" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<rect x="792" y="104" width="346" height="8" rx="4" fill="#1f6f3a"/>
<text x="814" y="150" font-size="26" font-weight="800" fill="#1f6f3a">IP69K</text>
<text x="814" y="184" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TEST</text>
<text x="814" y="205" font-size="13.5" fill="#333333">80–100 bar @ 80 °C, multi-angle</text>
<text x="814" y="224" font-size="12" fill="#5c5c5c">DIN 40050-9 / ISO 20653</text>
<text x="814" y="256" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PRICE / UHF HARD-TAG</text>
<text x="814" y="286" font-size="24" font-weight="800" fill="#291c0e">$5–$25</text>
<text x="814" y="322" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE</text>
<text x="814" y="344" font-size="13" fill="#333333">Wash-down: food, dairy,</text>
<text x="814" y="364" font-size="13" fill="#333333">pharma CIP, meat processing.</text>

<!-- field data -->
<rect x="64" y="478" width="1072" height="118" rx="13" fill="#f3f1ea" stroke="#ddd6c8" stroke-width="1.5"/>
<text x="90" y="512" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIELD DATA · DURING ACTIVE CIP WASH-DOWN</text>
<circle cx="104" cy="546" r="8" fill="#1f6f3a"/>
<text x="122" y="551" font-size="14.5" font-weight="800" fill="#1f6f3a">IP69K held 99.8% read rate</text>
<text x="360" y="551" font-size="14" fill="#333333">— full inventory possible mid-wash.</text>
<circle cx="104" cy="576" r="8" fill="#8b2d2d"/>
<text x="122" y="581" font-size="14.5" font-weight="800" fill="#8b2d2d">IP68 dropped to 70–85%</text>
<text x="322" y="581" font-size="14" fill="#333333">— brief water films detune the antenna at HF. (RFIDhy / Confidex)</text>
</svg>
