<polygon points="420,278 434,285 420,292" fill="#4a5568"/>
<rect x="448" y="225" width="12" height="120" fill="#4a5568"/>
<rect x="460" y="245" width="66" height="10" fill="#9aa4b5"/>
<circle cx="505" cy="220" r="13" fill="#4a5568"/>
<rect x="493" y="236" width="24" height="36" rx="8" fill="#4a5568"/>
<text x="324" y="392" text-anchor="middle" font-size="13.5" fill="#4f4f4f">squint, compare, wave through</text>
<text x="324" y="446" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#4a5568">4-6</text>
<text x="324" y="474" text-anchor="middle" font-size="13.5" fill="#4f4f4f">attendees per minute</text>

<!-- RIGHT: RFID -->
<rect x="616" y="128" width="520" height="372" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
