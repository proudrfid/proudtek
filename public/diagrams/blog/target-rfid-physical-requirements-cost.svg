<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Target's physical and procurement RFID requirements, with their cost or flag</title>
<desc id="d">The physical and procurement requirements Target enforces beyond the read-rate scorecard, each with its cost or flag. One, the EPC logo must be clearly visible on the hangtag; a freehand approximation fails the audit, so request the official file. Two, inlays must come from an approved converter such as FineLine, Avery Dennison, SML or Checkpoint, and the list updates quarterly. Three, 100 percent inline read testing at the factory, budgeted at 5 to 15 thousand dollars per encoding station; skip it and Target's receiving audit bills the chargeback. Four, a pre-ship tunnel audit at 97 percent or better at your dock, using tunnel readers at 15 to 50 thousand dollars per dock or a managed service at one to three cents per unit. Five, confirm department scope each quarter via Partners Online.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TARGET RFID · THE PHYSICAL LAYER</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">The checks the EDI docs skip</text>
<text x="600" y="132" text-anchor="middle" font-size="16" fill="#4f4f4f">Beyond read rate, Target polices the logo, converter, factory QC and pre-ship audit — each with a cost.</text>

<!-- Row 1 -->
<rect x="90" y="188" width="1020" height="60" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="90" y="188" width="8" height="60" rx="4" fill="#4a5568"/>
<text x="116" y="214" font-size="15" font-weight="700" fill="#291c0e">EPC logo 'clearly visible' on the hangtag</text>
<text x="116" y="236" font-size="12.5" fill="#4f4f4f">Request the official EPC file from your inlay vendor or GS1.</text>
<rect x="896" y="203" width="200" height="30" rx="15" fill="#fbeeee" stroke="#e9c9c9" stroke-width="1.3"/>
<text x="996" y="223" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8b2d2d">freehand = audit fail</text>

<!-- Row 2 -->
<rect x="90" y="258" width="1020" height="60" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="90" y="258" width="8" height="60" rx="4" fill="#4a5568"/>
<text x="116" y="284" font-size="15" font-weight="700" fill="#291c0e">Approved converter only</text>
<text x="116" y="306" font-size="12.5" fill="#4f4f4f">FineLine · Avery Dennison · SML · Checkpoint — even ARC-certified rejects if off-list.</text>
<rect x="896" y="273" width="200" height="30" rx="15" fill="#eef1f4" stroke="#c7cfd9" stroke-width="1.3"/>
<text x="996" y="293" text-anchor="middle" font-size="12.5" font-weight="800" fill="#3b4557">list updates quarterly</text>

<!-- Row 3 -->
<rect x="90" y="328" width="1020" height="60" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="90" y="328" width="8" height="60" rx="4" fill="#4a5568"/>
<text x="116" y="354" font-size="15" font-weight="700" fill="#291c0e">100% inline read test at the factory</text>
<text x="116" y="376" font-size="12.5" fill="#4f4f4f">Skip it and Target's receiving audit bills the chargeback instead.</text>
<rect x="896" y="343" width="200" height="30" rx="15" fill="#eef1f4" stroke="#c7cfd9" stroke-width="1.3"/>
<text x="996" y="363" text-anchor="middle" font-size="12.5" font-weight="800" fill="#3b4557">$5-15K / station</text>

<!-- Row 4 -->
<rect x="90" y="398" width="1020" height="60" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="90" y="398" width="8" height="60" rx="4" fill="#4a5568"/>
<text x="116" y="424" font-size="15" font-weight="700" fill="#291c0e">Pre-ship tunnel audit, 97%+ at your dock</text>
<text x="116" y="446" font-size="12.5" fill="#4f4f4f">Own the tunnel or buy it as a converter-managed service.</text>
<rect x="864" y="413" width="232" height="30" rx="15" fill="#eef1f4" stroke="#c7cfd9" stroke-width="1.3"/>
<text x="980" y="433" text-anchor="middle" font-size="12.5" font-weight="800" fill="#3b4557">$15-50K/dock · $0.01-0.03/unit</text>

<!-- Row 5 -->
<rect x="90" y="468" width="1020" height="60" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="90" y="468" width="8" height="60" rx="4" fill="#4a5568"/>
<text x="116" y="494" font-size="15" font-weight="700" fill="#291c0e">Confirm department scope each quarter</text>
<text x="116" y="516" font-size="12.5" fill="#4f4f4f">Scope shifts; check before you assume a SKU is in or out.</text>
<rect x="896" y="483" width="200" height="30" rx="15" fill="#eef1f4" stroke="#c7cfd9" stroke-width="1.3"/>
<text x="996" y="503" text-anchor="middle" font-size="12.5" font-weight="800" fill="#3b4557">via Partners Online</text>

<text x="600" y="582" text-anchor="middle" font-size="14" fill="#4f4f4f">Budget the physical layer up front — QC stations and tunnels cost less than the chargebacks they prevent.</text>
</svg>
