<rect x="701" y="284" width="170" height="9" rx="4.5" fill="#e3e0d8"/>
<rect x="701" y="303" width="200" height="8" rx="4" fill="#e3e0d8"/>
<rect x="701" y="320" width="180" height="8" rx="4" fill="#e3e0d8"/>
<rect x="701" y="337" width="140" height="8" rx="4" fill="#e3e0d8"/>
