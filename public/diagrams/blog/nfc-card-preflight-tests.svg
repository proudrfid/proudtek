<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The 30-minute pre-flight before a 1,000-unit NFC card run</title>
<desc id="d">Five checks: test on at least five phones across iPhone 12 through 16 and Android including Pixel and Samsung, locked and unlocked; a 50-tap stress test per card, rejecting batches with more than 5 percent missed reads; an end-to-end destination check covering the landing page, vCard save and tracking parameters; an artwork-interference check keeping the roughly 25 by 15 millimetre antenna window free of foil and embossing; and locking the tag only after final approval, leaving tags unlocked for the first 7 days of distribution.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">30 MINUTES NOW, OR 1,000 REGRETS LATER</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">The pre-flight checklist before the big print run</text>

<rect x="52" y="136" width="356" height="216" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="82" y="176" font-size="15.5" font-weight="800" fill="#2c5454">① Five phones minimum</text>
<text x="82" y="208" font-size="12.5" fill="#4f4f4f">iPhone 12 / 14 / 15 / 16 · Pixel 7+ ·</text>
<text x="82" y="230" font-size="12.5" fill="#4f4f4f">Samsung S23+ · one mid-range Android</text>
<text x="82" y="262" font-size="12.5" fill="#4f4f4f">locked AND unlocked screens —</text>
<text x="82" y="284" font-size="12.5" fill="#4f4f4f">iOS background reading varies by model</text>
<text x="82" y="326" font-size="12" font-weight="700" fill="#1f6f3a">✓ triggers everywhere, every time</text>

<rect x="422" y="136" width="356" height="216" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="452" y="176" font-size="15.5" font-weight="800" fill="#291c0e">② 50-tap stress test</text>
<text x="452" y="208" font-size="12.5" fill="#4f4f4f">a colleague, a card, 50+ taps —</text>
<text x="452" y="230" font-size="12.5" fill="#4f4f4f">intermittent reads surface fast</text>
<text x="452" y="262" font-size="13" font-weight="700" fill="#8b2d2d">reject the batch at &gt;5% missed reads</text>
<text x="452" y="284" font-size="12.5" fill="#4f4f4f">usual culprit: misaligned ferrite or</text>
<text x="452" y="306" font-size="12.5" fill="#4f4f4f">damaged antenna trace</text>
<text x="452" y="332" font-size="12" font-weight="700" fill="#1f6f3a">✓ manufacturing variance caught early</text>

<rect x="792" y="136" width="356" height="216" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="822" y="176" font-size="15.5" font-weight="800" fill="#291c0e">③ End-to-end flow</text>
<text x="822" y="208" font-size="12.5" fill="#4f4f4f">Safari / Chrome open the right page?</text>
<text x="822" y="230" font-size="12.5" fill="#4f4f4f">vCard saves cleanly? UTM tracking</text>
<text x="822" y="252" font-size="12.5" fill="#4f4f4f">parameters propagate?</text>
<text x="822" y="284" font-size="12.5" fill="#4f4f4f">Apple / Google Wallet passes have their</text>
<text x="822" y="306" font-size="12.5" fill="#4f4f4f">own NDEF rules — test separately</text>
<text x="822" y="332" font-size="12" font-weight="700" fill="#1f6f3a">✓ the tap actually delivers</text>

<rect x="237" y="380" width="356" height="200" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="267" y="420" font-size="15.5" font-weight="800" fill="#291c0e">④ Artwork interference</text>
<text x="267" y="452" font-size="12.5" fill="#4f4f4f">foil, thick spot UV or embossing over</text>
<text x="267" y="474" font-size="12.5" fill="#4f4f4f">the antenna can cut range 50%+</text>
<text x="267" y="506" font-size="12.5" fill="#4f4f4f">keep the ~25 × 15 mm window clean;</text>
<text x="267" y="528" font-size="12.5" fill="#4f4f4f">sample YOUR exact finish first</text>
<text x="267" y="560" font-size="12" font-weight="700" fill="#1f6f3a">✓ beauty and physics both satisfied</text>

<rect x="607" y="380" width="356" height="200" rx="14" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="637" y="420" font-size="15.5" font-weight="800" fill="#1b4332">⑤ Lock late</text>
<text x="637" y="452" font-size="12.5" fill="#4f4f4f">password-protect writes only after</text>
<text x="637" y="474" font-size="12.5" fill="#4f4f4f">final approval — a locked-in typo</text>
<text x="637" y="496" font-size="12.5" fill="#4f4f4f">costs the entire batch</text>
<text x="637" y="528" font-size="12.5" fill="#4f4f4f">best practice: 7 days unlocked in the field</text>
<text x="637" y="560" font-size="12" font-weight="700" fill="#1f6f3a">✓ URL fixes stay possible</text>

<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Half an hour of testing, or a box of beautiful cards that tap on your phone and nobody else's — choose once.</text>
</svg>
