<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ppTitle ppDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ppTitle">Proud Tek production and QC steps on partner lines</title>
  <desc id="ppDesc">Six steps, run on contracted partner lines to Proud Tek's specification, left to right: inlay bonding, lamination, encoding, one hundred percent read-test QC, laser numbering, and pack and dispatch.</desc>

  <rect width="1200" height="675" fill="#f8f6f1"/>
  <rect x="24" y="24" width="1152" height="627" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="72" y="120" font-size="22" font-weight="700" letter-spacing="1.5" fill="#6d5a3a">ONE SPECIFICATION — ONE QC SIGN-OFF</text>
  <text x="72" y="158" font-size="20" fill="#4f4f4f">The encoding and the compliance test are done under our own roof — the two steps a customs or brand audit checks.</text>

  <!-- connecting track -->
  <line x1="140" y1="320" x2="1060" y2="320" stroke="#e4c98f" stroke-width="6"/>

  <!-- Step group generator (manual) -->
  <!-- 1 Inlay bonding -->
  <circle cx="140" cy="320" r="48" fill="#291c0e"/>
  <text x="140" y="334" text-anchor="middle" font-size="34" font-weight="700" fill="#c39a5f">1</text>
  <text x="140" y="410" text-anchor="middle" font-size="21" font-weight="700" fill="#291c0e">Inlay bonding</text>
  <text x="140" y="440" text-anchor="middle" font-size="15" fill="#6b7280">chip → antenna</text>
  <text x="140" y="460" text-anchor="middle" font-size="15" fill="#6b7280">6 vendor families</text>

  <!-- 2 Lamination -->
  <circle cx="324" cy="320" r="48" fill="#291c0e"/>
  <text x="324" y="334" text-anchor="middle" font-size="34" font-weight="700" fill="#c39a5f">2</text>
  <text x="324" y="410" text-anchor="middle" font-size="21" font-weight="700" fill="#291c0e">Lamination</text>
  <text x="324" y="440" text-anchor="middle" font-size="15" fill="#6b7280">PVC · PET · PPS</text>
  <text x="324" y="460" text-anchor="middle" font-size="15" fill="#6b7280">recycled · paper</text>

  <!-- 3 Encoding -->
  <circle cx="508" cy="320" r="48" fill="#291c0e"/>
  <text x="508" y="334" text-anchor="middle" font-size="34" font-weight="700" fill="#c39a5f">3</text>
  <text x="508" y="410" text-anchor="middle" font-size="21" font-weight="700" fill="#291c0e">Encoding</text>
  <text x="508" y="440" text-anchor="middle" font-size="15" fill="#6b7280">UID lock · NDEF</text>
  <text x="508" y="460" text-anchor="middle" font-size="15" fill="#6b7280">key diversification</text>

  <!-- 4 Read-test QC (highlight) -->
  <circle cx="692" cy="320" r="54" fill="#1fcefb"/>
  <circle cx="692" cy="320" r="54" fill="none" stroke="#0b90b3" stroke-width="2"/>
  <text x="692" y="334" text-anchor="middle" font-size="34" font-weight="700" fill="#08313d">4</text>
  <text x="692" y="416" text-anchor="middle" font-size="21" font-weight="700" fill="#291c0e">Read-test QC</text>
  <text x="692" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#0b6a86">100% functional</text>
  <text x="692" y="466" text-anchor="middle" font-size="15" fill="#6b7280">on every unit</text>

  <!-- 5 Laser numbering -->
  <circle cx="876" cy="320" r="48" fill="#291c0e"/>
  <text x="876" y="334" text-anchor="middle" font-size="34" font-weight="700" fill="#c39a5f">5</text>
  <text x="876" y="410" text-anchor="middle" font-size="21" font-weight="700" fill="#291c0e">Laser numbering</text>
  <text x="876" y="440" text-anchor="middle" font-size="15" fill="#6b7280">serial · QR</text>
  <text x="876" y="460" text-anchor="middle" font-size="15" fill="#6b7280">variable data</text>

  <!-- 6 Pack & dispatch -->
  <circle cx="1060" cy="320" r="48" fill="#291c0e"/>
  <text x="1060" y="334" text-anchor="middle" font-size="34" font-weight="700" fill="#c39a5f">6</text>
  <text x="1060" y="410" text-anchor="middle" font-size="21" font-weight="700" fill="#291c0e">Pack &amp; dispatch</text>
  <text x="1060" y="440" text-anchor="middle" font-size="15" fill="#6b7280">DHL · FedEx</text>
  <text x="1060" y="460" text-anchor="middle" font-size="15" fill="#6b7280">sea LCL / FCL</text>

  <!-- footer strip -->
  <rect x="48" y="540" width="1104" height="72" rx="14" fill="#fbf7ef" stroke="#e4c98f" stroke-width="2"/>
  <text x="600" y="584" text-anchor="middle" font-size="20" fill="#6d5a3a">Documented test report shipped with every order — traceability from chip to carton.</text>
</svg>
