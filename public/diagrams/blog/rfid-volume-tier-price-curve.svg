<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID volume-tier pricing follows a non-linear curve</title>
<desc id="d">A line chart of example per-tag price against order volume: 10,000 units at 0.12 dollars, 50,000 at 0.09, 100,000 at 0.08, 500,000 at 0.07, and 1,000,000 at 0.065. The curve drops steeply early as setup cost amortizes, then plateaus as chip cost dominates. A dashed straight line marks what a linear drop would look like — a sign the factory is anchoring rather than reflecting real cost. The advice is to order just above each break-point, for example 100,000 instead of 95,000.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW VOLUME-TIER PRICING WORKS</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Tier drops are non-linear — steep early, then a chip-cost floor.</text>

<!-- y grid + ticks -->
<line x1="200" y1="150" x2="200" y2="470" stroke="#c7c0b0" stroke-width="1.8"/>
<line x1="200" y1="150" x2="1080" y2="150" stroke="#f2ede2" stroke-width="1.2"/>
<text x="190" y="155" text-anchor="end" font-size="12" fill="#6b6b6b">$0.13</text>
<line x1="200" y1="241" x2="1080" y2="241" stroke="#f2ede2" stroke-width="1.2"/>
<text x="190" y="246" text-anchor="end" font-size="12" fill="#6b6b6b">$0.11</text>
<line x1="200" y1="333" x2="1080" y2="333" stroke="#f2ede2" stroke-width="1.2"/>
<text x="190" y="338" text-anchor="end" font-size="12" fill="#6b6b6b">$0.09</text>
<line x1="200" y1="424" x2="1080" y2="424" stroke="#f2ede2" stroke-width="1.2"/>
<text x="190" y="429" text-anchor="end" font-size="12" fill="#6b6b6b">$0.07</text>

<!-- x axis -->
<line x1="200" y1="470" x2="1080" y2="470" stroke="#c7c0b0" stroke-width="1.8"/>
<text x="260" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">10K</text>
<text x="460" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">50K</text>
<text x="660" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">100K</text>
<text x="860" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">500K</text>
<text x="1060" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">1M</text>
<text x="640" y="516" text-anchor="middle" font-size="12.5" fill="#8a8a8a">order volume (units) — example quote curve</text>

<!-- linear reference (anchoring) -->
<line x1="260" y1="196" x2="1060" y2="447" stroke="#c99a9a" stroke-width="2" stroke-dasharray="6 5"/>
<text x="742" y="360" font-size="12.5" font-weight="700" fill="#8b2d2d">dashed = a linear drop = anchoring red flag</text>

<!-- real curve -->
<polyline points="260,196 460,333 660,379 860,424 1060,447" fill="none" stroke="#3d6b6b" stroke-width="3.4" stroke-linejoin="round"/>
<circle cx="260" cy="196" r="6.5" fill="#2c5454"/>
<circle cx="460" cy="333" r="6.5" fill="#2c5454"/>
<circle cx="660" cy="379" r="6.5" fill="#2c5454"/>
<circle cx="860" cy="424" r="6.5" fill="#2c5454"/>
<circle cx="1060" cy="447" r="6.5" fill="#2c5454"/>
<text x="260" y="182" text-anchor="middle" font-size="13" font-weight="800" fill="#234a4a">$0.12</text>
<text x="452" y="322" text-anchor="end" font-size="13" font-weight="800" fill="#234a4a">$0.09</text>
<text x="660" y="366" text-anchor="middle" font-size="13" font-weight="800" fill="#234a4a">$0.08</text>
<text x="860" y="412" text-anchor="middle" font-size="13" font-weight="800" fill="#234a4a">$0.07</text>
<text x="1060" y="436" text-anchor="middle" font-size="13" font-weight="800" fill="#234a4a">$0.065</text>

<!-- zone labels -->
<text x="352" y="238" font-size="13" font-weight="700" fill="#2c5454">Steep early drops —</text>
<text x="352" y="256" font-size="13" fill="#5c5c5c">setup cost amortizes</text>
<text x="930" y="418" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">Plateau —</text>
<text x="930" y="436" text-anchor="middle" font-size="13" fill="#5c5c5c">chip cost dominates</text>

<!-- callout -->
<rect x="200" y="540" width="880" height="52" rx="10" fill="#eef5f5" stroke="#cfe3dd" stroke-width="1.8"/>
<text x="640" y="565" text-anchor="middle" font-size="14.5" font-weight="700" fill="#234a4a">Order at the bottom of each tier — 100K instead of 95K —</text>
<text x="640" y="584" text-anchor="middle" font-size="13.5" fill="#3a2f20">to capture the lower price without much extra inventory commitment.</text>
</svg>
