<text x="600" y="628" text-anchor="middle" font-size="14" fill="#5c5c5c">EPC Gen2v2 (ISO 18000-63) · Impinj Monza · NXP UCODE · Alien Higgs — magnificent in open air, high-maintenance elsewhere.</text>
