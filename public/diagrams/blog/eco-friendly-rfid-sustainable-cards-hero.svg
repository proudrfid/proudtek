<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five sustainable RFID card substrates, ordered from plastic-based to plant-based</title>
<desc id="d">Five material options for sustainable RFID cards shown as cards, left to right from plastic-based to plant-based. Recycled PVC: GRS certified, behaves like virgin PVC, about 4 to 5 grams CO2e. Recycled PET: rPET, GRS certified, tougher than PVC, plus 10 to 20 percent cost. Bio-based PLA: OK Compost, compostable, plus 20 to 30 percent cost. Wood veneer: FSC-certified, lowest verified carbon, about 2 to 4 grams CO2e. Paper: FSC or recycled, cheapest and single-use, minus 10 to 20 percent cost. A spectrum bar beneath runs from plastic-based to plant-based. The same RFID chip fits all five; the substrate decides carbon, cost and end-of-life.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4a5568"/><stop offset="50%" stop-color="#3d6b6b"/><stop offset="100%" stop-color="#1b4332"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SUSTAINABLE RFID SUBSTRATES</text>
<text x="600" y="98" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Five ways to make a greener card</text>
<text x="600" y="128" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Ordered plastic-based to plant-based &#8212; the chip stays the same, the substrate changes everything else.</text>

<!-- Card 1: Recycled PVC -->
<rect x="88" y="164" width="180" height="292" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="88" y="164" width="180" height="8" rx="4" fill="#4a5568"/>
<text x="178" y="212" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Recycled PVC</text>
<text x="178" y="236" text-anchor="middle" font-size="12" fill="#5c5c5c">GRS certified</text>
<line x1="108" y1="254" x2="248" y2="254" stroke="#eadfce" stroke-width="1.4"/>
<text x="178" y="292" text-anchor="middle" font-size="13.5" fill="#333333">Behaves like PVC</text>
<rect x="103" y="392" width="150" height="42" rx="8" fill="#eef1f5" stroke="#b9c2cf" stroke-width="1.3"/>
<text x="178" y="418" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4453">4&#8211;5 g CO2e</text>

<!-- Card 2: Recycled PET -->
<rect x="299" y="164" width="180" height="292" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="299" y="164" width="180" height="8" rx="4" fill="#3d6b6b"/>
<text x="389" y="212" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Recycled PET</text>
<text x="389" y="236" text-anchor="middle" font-size="12" fill="#5c5c5c">rPET, GRS certified</text>
<line x1="319" y1="254" x2="459" y2="254" stroke="#eadfce" stroke-width="1.4"/>
<text x="389" y="292" text-anchor="middle" font-size="13.5" fill="#333333">Tougher than PVC</text>
<rect x="314" y="392" width="150" height="42" rx="8" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="389" y="418" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">+10&#8211;20% cost</text>

<!-- Card 3: Bio-based PLA -->
<rect x="510" y="164" width="180" height="292" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="510" y="164" width="180" height="8" rx="4" fill="#2d6a4f"/>
<text x="600" y="212" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Bio-based PLA</text>
<text x="600" y="236" text-anchor="middle" font-size="12" fill="#5c5c5c">OK Compost</text>
<line x1="530" y1="254" x2="670" y2="254" stroke="#eadfce" stroke-width="1.4"/>
<text x="600" y="292" text-anchor="middle" font-size="13.5" fill="#333333">Compostable</text>
<rect x="525" y="392" width="150" height="42" rx="8" fill="#e7f0ea" stroke="#a9cbb8" stroke-width="1.3"/>
<text x="600" y="418" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2d6a4f">+20&#8211;30% cost</text>

<!-- Card 4: Wood veneer -->
<rect x="721" y="164" width="180" height="292" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="721" y="164" width="180" height="8" rx="4" fill="#1b4332"/>
<text x="811" y="212" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Wood veneer</text>
<text x="811" y="236" text-anchor="middle" font-size="12" fill="#5c5c5c">FSC-certified</text>
<line x1="741" y1="254" x2="881" y2="254" stroke="#eadfce" stroke-width="1.4"/>
<text x="811" y="292" text-anchor="middle" font-size="13.5" fill="#333333">Lowest carbon</text>
<rect x="736" y="392" width="150" height="42" rx="8" fill="#e2ede7" stroke="#8fbaa2" stroke-width="1.3"/>
<text x="811" y="418" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1b4332">2&#8211;4 g CO2e</text>

<!-- Card 5: Paper -->
<rect x="932" y="164" width="180" height="292" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="932" y="164" width="180" height="8" rx="4" fill="#6d5a3a"/>
<text x="1022" y="212" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Paper</text>
<text x="1022" y="236" text-anchor="middle" font-size="12" fill="#5c5c5c">FSC / recycled</text>
<line x1="952" y1="254" x2="1092" y2="254" stroke="#eadfce" stroke-width="1.4"/>
<text x="1022" y="292" text-anchor="middle" font-size="13.5" fill="#333333">Cheapest, single-use</text>
<rect x="947" y="392" width="150" height="42" rx="8" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<text x="1022" y="418" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">&#8722;10&#8211;20% cost</text>

<!-- Spectrum bar -->
<rect x="88" y="500" width="1024" height="12" rx="6" fill="url(#spectrum)"/>
<text x="88" y="540" text-anchor="start" font-size="12.5" font-weight="700" fill="#4a5568">PLASTIC-BASED</text>
<text x="1112" y="540" text-anchor="end" font-size="12.5" font-weight="700" fill="#1b4332">PLANT-BASED</text>
<text x="600" y="588" text-anchor="middle" font-size="14" fill="#4f4f4f">Same chip inside all five &#8212; the substrate decides carbon, cost and end-of-life.</text>
</svg>
