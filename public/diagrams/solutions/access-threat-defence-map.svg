<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Access credential threats paired with operational defences</title>
<desc id="d">A five-row matrix pairing each access-control threat with its counter. LF cloning in seconds with Proxmark or Flipper Zero is countered by migrating to DESFire EV3 or Seos with dual-tech readers bridging the estate. Crypto-1 key recovery against MIFARE Classic is countered by retiring Classic at refresh, or UID-only mode if it must linger. Wiegand wire-taps with ESPKey-class devices are countered by OSDP v2.2 Secure Channel plus conduit and reader tamper alarms. Relay attacks that extend read range are countered by Proximity Check timing plus a PIN or biometric at sensitive doors. Lost or stolen badges are countered by hot-list propagation to every reader within a minute and HR-feed automatic revocation.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THREAT MODEL</text>
<text x="600" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Every attack has a counter that ships today</text>
<text x="600" y="124" text-anchor="middle" font-size="15" fill="#4f4f4f">Commodity tools made the attacks cheap; most of the defences are procurement choices.</text>

<text x="350" y="158" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">THE ATTACK</text>
<text x="890" y="158" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#3a4353">THE COUNTER</text>

<rect x="90" y="172" width="520" height="70" rx="10" fill="#ffffff" stroke="#8b2d2d" stroke-width="2"/>
<text x="114" y="201" font-size="14.5" font-weight="700" fill="#8b2d2d">LF clone in seconds</text>
<text x="114" y="224" font-size="12.5" fill="#4f4f4f">Proxmark / Flipper Zero reads EM4100 and HID Prox raw</text>
<line x1="610" y1="207" x2="652" y2="207" stroke="#4a5568" stroke-width="3"/>
<path d="M 652 200 l 12 7 l -12 7 z" fill="#4a5568"/>
<rect x="670" y="172" width="440" height="70" rx="10" fill="#eef0f3" stroke="#4a5568" stroke-width="1.5"/>
<text x="694" y="201" font-size="13.5" font-weight="700" fill="#291c0e">Migrate to DESFire EV3 / Seos</text>
<text x="694" y="224" font-size="12.5" fill="#4f4f4f">dual-tech readers bridge the estate meanwhile</text>

<rect x="90" y="254" width="520" height="70" rx="10" fill="#ffffff" stroke="#8b2d2d" stroke-width="2"/>
<text x="114" y="283" font-size="14.5" font-weight="700" fill="#8b2d2d">Crypto-1 key recovery</text>
<text x="114" y="306" font-size="12.5" fill="#4f4f4f">MIFARE Classic sector keys fall in minutes</text>
<line x1="610" y1="289" x2="652" y2="289" stroke="#4a5568" stroke-width="3"/>
<path d="M 652 282 l 12 7 l -12 7 z" fill="#4a5568"/>
<rect x="670" y="254" width="440" height="70" rx="10" fill="#eef0f3" stroke="#4a5568" stroke-width="1.5"/>
<text x="694" y="283" font-size="13.5" font-weight="700" fill="#291c0e">Retire Classic at refresh</text>
<text x="694" y="306" font-size="12.5" fill="#4f4f4f">UID-only mode if it must linger — treat as Tier-1</text>

<rect x="90" y="336" width="520" height="70" rx="10" fill="#ffffff" stroke="#8b2d2d" stroke-width="2"/>
<text x="114" y="365" font-size="14.5" font-weight="700" fill="#8b2d2d">Wiegand wire-tap</text>
<text x="114" y="388" font-size="12.5" fill="#4f4f4f">ESPKey-class device clips onto D0 / D1 at the panel side</text>
<line x1="610" y1="371" x2="652" y2="371" stroke="#4a5568" stroke-width="3"/>
<path d="M 652 364 l 12 7 l -12 7 z" fill="#4a5568"/>
<rect x="670" y="336" width="440" height="70" rx="10" fill="#eef0f3" stroke="#4a5568" stroke-width="1.5"/>
<text x="694" y="365" font-size="13.5" font-weight="700" fill="#291c0e">OSDP v2.2 Secure Channel</text>
<text x="694" y="388" font-size="12.5" fill="#4f4f4f">metal conduit + tamper alarms on the reader back-box</text>

<rect x="90" y="418" width="520" height="70" rx="10" fill="#ffffff" stroke="#8b2d2d" stroke-width="2"/>
<text x="114" y="447" font-size="14.5" font-weight="700" fill="#8b2d2d">Relay attack</text>
<text x="114" y="470" font-size="12.5" fill="#4f4f4f">a paired rig stretches read range across the building</text>
<line x1="610" y1="453" x2="652" y2="453" stroke="#4a5568" stroke-width="3"/>
<path d="M 652 446 l 12 7 l -12 7 z" fill="#4a5568"/>
<rect x="670" y="418" width="440" height="70" rx="10" fill="#eef0f3" stroke="#4a5568" stroke-width="1.5"/>
<text x="694" y="447" font-size="13.5" font-weight="700" fill="#291c0e">Proximity Check timing</text>
<text x="694" y="470" font-size="12.5" fill="#4f4f4f">plus PIN or biometric at high-security doors</text>

<rect x="90" y="500" width="520" height="70" rx="10" fill="#ffffff" stroke="#8b2d2d" stroke-width="2"/>
<text x="114" y="529" font-size="14.5" font-weight="700" fill="#8b2d2d">Lost / stolen badge</text>
<text x="114" y="552" font-size="12.5" fill="#4f4f4f">the everyday breach — no lab equipment required</text>
<line x1="610" y1="535" x2="652" y2="535" stroke="#4a5568" stroke-width="3"/>
<path d="M 652 528 l 12 7 l -12 7 z" fill="#4a5568"/>
<rect x="670" y="500" width="440" height="70" rx="10" fill="#eef0f3" stroke="#4a5568" stroke-width="1.5"/>
<text x="694" y="529" font-size="13.5" font-weight="700" fill="#291c0e">Hot-list every reader fast</text>
<text x="694" y="552" font-size="12.5" fill="#4f4f4f">propagation within a minute + HR-feed auto-revocation</text>

<text x="600" y="618" text-anchor="middle" font-size="14" fill="#5c5c5c">None of these counters require inventing anything — they mostly require refusing the default configuration.</text>
</svg>
