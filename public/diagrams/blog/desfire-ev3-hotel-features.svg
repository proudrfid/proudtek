<text x="600" y="544" text-anchor="middle" font-size="17.5" font-weight="800" fill="#291c0e">None of these cost extra on the chip — they cost only the specification.</text>
<text x="600" y="569" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Put the ones your threat model needs into the RFP, not into a re-spec next year.</text>
