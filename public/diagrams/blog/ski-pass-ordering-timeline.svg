<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Ordering timeline for a season's ski pass cards</title>
<desc id="d">A four-phase timeline. In July to August the resort places the order and locks artwork, proofing and encoding, which is the critical path. In September to October the printed and encoded cards are delivered. In November the season opens and the gates go live. In April the season ends and the resort reconciles and plans the reorder. The cards are locked in the previous summer, months before opening day.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ORDER IN SUMMER, SKI IN WINTER</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">A season's cards are locked months before opening day.</text>

<line x1="150" y1="330" x2="1070" y2="330" stroke="#d9d2c4" stroke-width="3"/>
<polygon points="352,324 364,330 352,336" fill="#cbb98f"/>
<polygon points="632,324 644,330 632,336" fill="#cbb98f"/>
<polygon points="912,324 924,330 912,336" fill="#cbb98f"/>

<text x="200" y="298" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">JUL–AUG</text>
<circle cx="200" cy="330" r="13" fill="#c39a5f" stroke="#ffffff" stroke-width="2"/>
<text x="200" y="372" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Place order</text>

<text x="480" y="298" text-anchor="middle" font-size="15" font-weight="800" fill="#234a4a">SEP–OCT</text>
<circle cx="480" cy="330" r="12" fill="#3d6b6b" stroke="#ffffff" stroke-width="2"/>
<text x="480" y="372" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Delivery</text>

<text x="760" y="298" text-anchor="middle" font-size="15" font-weight="800" fill="#1b4332">NOV</text>
<circle cx="760" cy="330" r="13" fill="#1f6f3a" stroke="#ffffff" stroke-width="2"/>
<text x="760" y="372" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Season opens</text>

<text x="1040" y="298" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4657">APR</text>
<circle cx="1040" cy="330" r="12" fill="#4a5568" stroke="#ffffff" stroke-width="2"/>
<text x="1040" y="372" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Season ends</text>

<line x1="200" y1="420" x2="480" y2="420" stroke="#c39a5f" stroke-width="1.8"/>
<line x1="200" y1="420" x2="200" y2="412" stroke="#c39a5f" stroke-width="1.8"/><line x1="480" y1="420" x2="480" y2="412" stroke="#c39a5f" stroke-width="1.8"/>
<text x="340" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">artwork · proofing · encoding — the critical path</text>

<line x1="760" y1="420" x2="1040" y2="420" stroke="#a9cfb5" stroke-width="1.8"/>
<line x1="760" y1="420" x2="760" y2="412" stroke="#a9cfb5" stroke-width="1.8"/><line x1="1040" y1="420" x2="1040" y2="412" stroke="#a9cfb5" stroke-width="1.8"/>
<text x="900" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6f3a">the season runs (Nov–Apr)</text>

<text x="600" y="520" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Miss the summer window and you're proofing artwork in a blizzard — at rush prices.</text>
</svg>
