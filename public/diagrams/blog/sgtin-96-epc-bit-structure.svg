<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The 96-bit SGTIN-96 EPC field structure</title>
<desc id="d">A 96-bit binary layout in six fields, left to right. Header 8 bits, value 0x30. Filter 3 bits. Partition 3 bits. GS1 Company Prefix, variable 20 to 40 bits. Item reference, variable 4 to 24 bits. Serial number 38 bits. Fixed-width fields are shown dark, variable-width fields light. Notes: filter value 1 marks item-level retail, the 38-bit serial gives about 274.8 billion serials per GTIN, and the code is written to EPC bank 0x01 starting at word 0x02.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ENCODING · SGTIN-96 (96-BIT EPC)</text>
<text x="600" y="95" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">Ninety-six bits, six fields</text>
<text x="600" y="126" text-anchor="middle" font-size="15" fill="#4f4f4f">Header, filter, partition, GS1 Company Prefix, item reference and serial — written to EPC bank 0x01.</text>

<rect x="100" y="212" width="90" height="92" fill="#3a4453" stroke="#ffffff" stroke-width="2"/>
<text x="145" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Header</text>
<text x="145" y="284" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">8</text>
<rect x="190" y="212" width="70" height="92" fill="#4a5568" stroke="#ffffff" stroke-width="2"/>
<text x="225" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Filter</text>
<text x="225" y="284" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">3</text>
<rect x="260" y="212" width="70" height="92" fill="#55687a" stroke="#ffffff" stroke-width="2"/>
<text x="295" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Part.</text>
<text x="295" y="284" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">3</text>
<rect x="330" y="212" width="300" height="92" fill="#eef1f5" stroke="#ffffff" stroke-width="2"/>
<text x="480" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#291c0e">GS1 Company Prefix</text>
<text x="480" y="284" text-anchor="middle" font-size="24" font-weight="800" fill="#3a4453">20–40</text>
<rect x="630" y="212" width="200" height="92" fill="#e4e9ef" stroke="#ffffff" stroke-width="2"/>
<text x="730" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#291c0e">Item reference</text>
<text x="730" y="284" text-anchor="middle" font-size="24" font-weight="800" fill="#3a4453">4–24</text>
<rect x="830" y="212" width="270" height="92" fill="#4a5568" stroke="#ffffff" stroke-width="2"/>
<text x="965" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Serial number</text>
<text x="965" y="284" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">38</text>

<text x="145" y="330" text-anchor="middle" font-size="12.5" fill="#5c5c5c">value 0x30</text>
<text x="600" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4453">= 96 bits total · dark = fixed width, light = variable · EPC bank 0x01, word 0x02</text>

<rect x="110" y="392" width="310" height="60" rx="12" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.4"/>
<text x="265" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Filter 1 (001)</text>
<text x="265" y="438" text-anchor="middle" font-size="12.5" fill="#4f4f4f">= item-level retail unit</text>
<rect x="445" y="392" width="310" height="60" rx="12" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.4"/>
<text x="600" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">38-bit serial</text>
<text x="600" y="438" text-anchor="middle" font-size="12.5" fill="#4f4f4f">≈ 274.8 billion per GTIN</text>
<rect x="780" y="392" width="310" height="60" rx="12" fill="#f7ecec" stroke="#e0b9b9" stroke-width="1.4"/>
<text x="935" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#8b2d2d">Wrong filter</text>
<text x="935" y="438" text-anchor="middle" font-size="12.5" fill="#7a2323">→ unit misclassified at DC</text>

<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#4f4f4f">One misencoded bit flags the whole tag unreadable — the encoding is the precondition, not a detail.</text>
</svg>
