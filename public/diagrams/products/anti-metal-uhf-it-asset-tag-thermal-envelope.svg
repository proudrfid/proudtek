<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Tag operating envelope vs ASHRAE TC 9.9 thermal classes</title>
  <desc id="d">Horizontal band chart. The Proud Tek anti-metal tag operates from -20 °C to +85 °C, drawn as the widest bar. Below it, the ASHRAE TC 9.9 bands: class A1 recommended 18-27 °C, class A1 allowable 15-32 °C, class A2 10-35 °C, class A3 5-40 °C and class A4 5-45 °C. A dashed gold line marks the 55 °C hot-aisle-containment ceiling, inside the tag envelope. The summary band notes ASTM F1980 accelerated-aging qualification for a 10-year service life.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">OPERATING ENVELOPE VS ASHRAE TC 9.9</text>
  <text x="600" y="90" text-anchor="middle" font-size="16" fill="#5c5c5c">tag temperature rating against data-centre thermal classes</text>

  <rect x="240" y="130" width="860" height="330" rx="12" fill="#faf6ec" stroke="#e6dfd2" stroke-width="1.5"/>

  <!-- tag envelope -->
  <text x="225" y="169" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">Proud Tek tag</text>
  <rect x="240" y="150" width="860" height="28" rx="6" fill="#2c5454"/>
  <text x="670" y="169" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">-20 °C to +85 °C</text>

  <!-- ASHRAE bands -->
  <text x="225" y="219" text-anchor="end" font-size="14" fill="#4f4f4f">A1 recommended</text>
  <rect x="551" y="200" width="74" height="28" rx="6" fill="#cfe0e0" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="633" y="219" font-size="13" fill="#4f4f4f">18-27 °C</text>

  <text x="225" y="269" text-anchor="end" font-size="14" fill="#4f4f4f">A1 allowable</text>
  <rect x="527" y="250" width="139" height="28" rx="6" fill="#cfe0e0" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="674" y="269" font-size="13" fill="#4f4f4f">15-32 °C</text>

  <text x="225" y="319" text-anchor="end" font-size="14" fill="#4f4f4f">Class A2</text>
  <rect x="486" y="300" width="205" height="28" rx="6" fill="#cfe0e0" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="699" y="319" font-size="13" fill="#4f4f4f">10-35 °C</text>

  <text x="225" y="369" text-anchor="end" font-size="14" fill="#4f4f4f">Class A3</text>
  <rect x="445" y="350" width="287" height="28" rx="6" fill="#cfe0e0" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="740" y="369" font-size="13" fill="#4f4f4f">5-40 °C</text>

  <text x="225" y="419" text-anchor="end" font-size="14" fill="#4f4f4f">Class A4</text>
  <rect x="445" y="400" width="328" height="28" rx="6" fill="#cfe0e0" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="781" y="419" font-size="13" fill="#4f4f4f">5-45 °C</text>

  <!-- hot-aisle ceiling -->
  <line x1="854" y1="140" x2="854" y2="455" stroke="#c39a5f" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="854" y="482" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d5a3a">55 °C hot-aisle ceiling</text>

  <!-- summary band -->
  <rect x="180" y="560" width="840" height="76" rx="16" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="592" text-anchor="middle" font-size="16" font-weight="600" fill="#2c5454">Covers every ASHRAE class with margin — including the 55 °C hot aisle</text>
  <text x="600" y="617" text-anchor="middle" font-size="14.5" fill="#3d6b6b">ASTM F1980 accelerated-aging qualified · 10-year service life</text>
</svg>
