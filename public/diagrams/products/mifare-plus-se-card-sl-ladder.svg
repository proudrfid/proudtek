<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">MIFARE Plus SE security-level ladder — SL0 personalisation to SL1 Classic-compatible to SL3 AES-128</title>
  <desc id="d">Three-step one-way ladder: SL0 factory personalisation, SL1 CRYPTO-1 Classic-compatible operation on existing readers, SL3 AES-128 mutual authentication with CMAC after the level switch. No downgrade path. Phased rollout: baseline audit, issue at SL1, reader firmware upgrade, SL3 switch.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">The one-way ladder out of CRYPTO-1</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Issue cards today on the readers you already own — flip the whole estate to AES-128 later</text>
  <g transform="translate(80,150)">
    <rect x="0" y="290" width="300" height="120" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="326" font-family="Georgia, serif" font-size="19" fill="#291c0e">SL0 — factory</text>
    <text x="24" y="354" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">Personalisation at the bureau:</text>
    <text x="24" y="376" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">keys loaded, card sealed</text>
    <rect x="370" y="170" width="300" height="120" rx="12" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2.5"/>
    <text x="394" y="206" font-family="Georgia, serif" font-size="19" fill="#2c5454">SL1 — Classic-compatible</text>
    <text x="394" y="234" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Runs CRYPTO-1 on your existing</text>
    <text x="394" y="256" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Classic readers — same PHY, same MAD</text>
    <rect x="740" y="50" width="330" height="120" rx="12" fill="#2c5454"/>
    <text x="764" y="86" font-family="Georgia, serif" font-size="19" fill="#f8f6f1">SL3 — AES-128 endpoint</text>
    <text x="764" y="114" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#dfe9e7">Mutual auth per NIST FIPS 197,</text>
    <text x="764" y="136" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#dfe9e7">CMAC integrity per NIST SP 800-38B</text>
    <path d="M 300 340 L 360 240" stroke="#6d5a3a" stroke-width="3" fill="none" marker-end="url(#arr)"/>
    <path d="M 670 220 L 730 120" stroke="#6d5a3a" stroke-width="3" fill="none" marker-end="url(#arr)"/>
    <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d5a3a"/></marker></defs>
    <text x="440" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8b2d2d">one-way — no downgrade path</text>
  </g>
  <g transform="translate(80,600)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">Phased rollout: Phase 0 baseline audit → Phase 1 issue Plus SE at SL1 → Phase 2 reader firmware upgrade → Phase 3 SL3 level-switch</text>
  </g>
</svg>
