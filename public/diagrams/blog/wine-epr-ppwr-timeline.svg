<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">PPWR timeline: adopted December 2024, in force February 2025, applies 12 August 2026</title>
<desc id="d">A timeline of PPWR milestones. 19 December 2024: adopted. 11 February 2025: enters into force. 12 August 2026, the emphasised node: PPWR applies across the EU — be in market before this date. 1 January 2029: Deposit Return Systems expected for single-use plastic and metal beverage containers. 2030: recycled-content minimums for plastic, escalating in 2040. A strip underneath notes that PPWR is a regulation, not a directive — it applies directly in every member state with no national transposition — and that modulated EPR fee structures follow 18 months after each implementing act, with rolling changes through 2027-2029.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE ROLLOUT IS STAGGERED ON PURPOSE</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">PPWR: adoption to application — and beyond</text>

<line x1="100" y1="380" x2="1092" y2="380" stroke="#4f4f4f" stroke-width="2"/>
<path d="M 1100 380 l -16 -8 v 16 z" fill="#4f4f4f"/>

<text x="170" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">19 December 2024</text>
<text x="170" y="318" text-anchor="middle" font-size="13" fill="#4f4f4f">adopted</text>
<line x1="170" y1="330" x2="170" y2="368" stroke="#a8c7b6" stroke-width="1.6"/>
<circle cx="170" cy="380" r="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>

<line x1="350" y1="392" x2="350" y2="428" stroke="#a8c7b6" stroke-width="1.6"/>
<circle cx="350" cy="380" r="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>
<text x="350" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">11 February 2025</text>
<text x="350" y="474" text-anchor="middle" font-size="13" fill="#4f4f4f">enters into force</text>

<circle cx="600" cy="380" r="42" fill="#ecf4ef"/>
<circle cx="600" cy="380" r="25" fill="#ffffff" stroke="#2d6a4f" stroke-width="3.5"/>
<circle cx="600" cy="380" r="9" fill="#2d6a4f"/>
<text x="600" y="262" text-anchor="middle" font-size="21" font-weight="800" fill="#1b4332">12 August 2026</text>
<text x="600" y="290" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2d6a4f">PPWR applies across the EU</text>
<text x="600" y="311" text-anchor="middle" font-size="13" fill="#4f4f4f">be in market before this date</text>
<line x1="600" y1="322" x2="600" y2="336" stroke="#6f9c86" stroke-width="1.6"/>

<line x1="850" y1="392" x2="850" y2="428" stroke="#a8c7b6" stroke-width="1.6"/>
<circle cx="850" cy="380" r="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>
<text x="850" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">1 January 2029</text>
<text x="850" y="474" text-anchor="middle" font-size="13" fill="#4f4f4f">DRS expected — single-use plastic</text>
<text x="850" y="494" text-anchor="middle" font-size="13" fill="#4f4f4f">and metal beverage containers</text>

<text x="1020" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">2030</text>
<text x="1020" y="318" text-anchor="middle" font-size="13" fill="#4f4f4f">recycled-content minimums</text>
<text x="1020" y="338" text-anchor="middle" font-size="13" fill="#4f4f4f">for plastic (escalating 2040)</text>
<line x1="1020" y1="350" x2="1020" y2="368" stroke="#a8c7b6" stroke-width="1.6"/>
<circle cx="1020" cy="380" r="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>

<rect x="64" y="545" width="1072" height="54" rx="12" fill="#ecf4ef" stroke="#cfe0d6"/>
<text x="600" y="579" text-anchor="middle" font-size="15" font-weight="600" fill="#1b4332">A regulation, not a directive — PPWR applies directly in every member state, with no national transposition.</text>
<text x="600" y="633" text-anchor="middle" font-size="13" fill="#5c5c5c">Modulated EPR fee structures follow 18 months after each implementing act — expect rolling changes through 2027-2029.</text>
</svg>
