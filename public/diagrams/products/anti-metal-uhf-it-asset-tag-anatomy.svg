<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Anti-metal UHF IT-asset tag construction cross-section</title>
  <desc id="d">Layer stack of the anti-metal tag from top to bottom: thermal-transfer printable face; UHF chip on an on-metal PCB dipole antenna; Ni-Zn or Mn-Zn ferrite isolation sheet of 0.2-0.5 mm; 3M VHB adhesive or M3 screw-mount; then the metal asset such as a server chassis, rack rail or PDU. The ferrite layer provides ground-plane isolation that keeps the dipole tuned. A bare paper label on metal detunes and its read range collapses, while the ferrite-backed tag reads at 1-5 m across the 860-960 MHz UHF band. Rated IP67 and -20 °C to +85 °C.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANTI-METAL CONSTRUCTION — CROSS-SECTION</text>
  <text x="600" y="90" text-anchor="middle" font-size="16" fill="#5c5c5c">printable face · UHF chip + PCB dipole · ferrite isolation · metal asset</text>

  <g transform="translate(0,36)">
  <!-- layer stack -->
  <rect x="110" y="132" width="540" height="48" rx="8" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="380" y="162" text-anchor="middle" font-size="14.5" font-weight="600" fill="#291c0e">Thermal-transfer printable face</text>

  <rect x="110" y="188" width="540" height="64" rx="8" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="380" y="212" text-anchor="middle" font-size="14.5" font-weight="600" fill="#2c5454">UHF chip + on-metal PCB dipole antenna</text>
  <rect x="150" y="230" width="460" height="8" fill="#3d6b6b"/>
  <rect x="368" y="224" width="24" height="20" rx="3" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>

  <rect x="110" y="260" width="540" height="56" rx="8" fill="#f2e2c9" stroke="#c39a5f" stroke-width="2"/>
  <text x="380" y="283" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">Ni-Zn / Mn-Zn ferrite isolation sheet</text>
  <text x="380" y="304" text-anchor="middle" font-size="13.5" fill="#6d5a3a">0.2-0.5 mm</text>

  <rect x="110" y="324" width="540" height="24" rx="6" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="380" y="340" text-anchor="middle" font-size="12.5" fill="#5c5c5c">3M VHB adhesive · M3 screw-mount option</text>

  <rect x="110" y="356" width="540" height="62" rx="8" fill="#4a5568"/>
  <text x="380" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Metal asset</text>
  <text x="380" y="402" text-anchor="middle" font-size="13" fill="#d5dae2">server chassis · rack rail · PDU</text>

  <!-- ferrite callout -->
  <circle cx="650" cy="288" r="4" fill="#c39a5f"/>
  <line x1="654" y1="288" x2="700" y2="288" stroke="#c39a5f" stroke-width="2"/>
  <text x="712" y="282" font-size="16" font-weight="700" fill="#2c5454">Ground-plane isolation</text>
  <text x="712" y="304" font-size="13.5" fill="#5c5c5c">keeps the dipole tuned against metal</text>

  <!-- bare label vs ferrite-backed -->
  <rect x="712" y="132" width="418" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="732" y="162" font-size="15" font-weight="700" fill="#8b2d2d">Bare paper label on metal</text>
  <text x="732" y="186" font-size="13.5" fill="#8b2d2d">✗ dipole detunes — read range collapses</text>
  <text x="732" y="210" font-size="12.5" fill="#5c5c5c">metal reflects the 860-960 MHz wave</text>

  <rect x="712" y="330" width="418" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="732" y="360" font-size="15" font-weight="700" fill="#1f6f3a">Ferrite-backed anti-metal tag</text>
  <text x="732" y="384" font-size="13.5" fill="#1f6f3a">✓ 1-5 m on-metal read range</text>
  <text x="732" y="408" font-size="12.5" fill="#5c5c5c">holds tuning on chassis, rack rail, bezel</text>
  </g>

  <!-- summary band -->
  <rect x="180" y="560" width="840" height="76" rx="16" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="592" text-anchor="middle" font-size="16" font-weight="600" fill="#2c5454">One job: keep the dipole tuned against the metal it inventories</text>
  <text x="600" y="617" text-anchor="middle" font-size="15" fill="#3d6b6b">860-960 MHz UHF · 1-5 m on-metal · IP67 · -20 °C to +85 °C</text>
</svg>
