<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five most common Macy's RFID compliance mistakes</title>
<desc id="d">Five failure cards, each with a red cross badge. One: one ticket, two SKUs — the spec is blunt, 1 ticket = 1 UPC = 1 EPC, and reuse across color variants flags the entire shipment. Two: no factory read test — dead tags pay the $0.75 per-unit offset, raised from $0.60 in July 2023, while inline testing costs a fraction. Three: a sloppy EDI 856 ASN — missing the SGTIN-96 to SSCC to BOL roll-up blocks the entire receiving event on GXS. Four: stale inlay list — mid-quarter inlay swaps get rejected at receiving; re-qualify with a sample shipment first. Five: Bloomingdale's is not Macy's — same portal, tighter placement and cosmetic standards on the Bloomingdale's side. Monthly audit cadence means these surface late: one bad ASN can ride 4-5 weekly shipments before the scorecard tells you.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE MISTAKES THAT QUIETLY COST MONEY</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Chargebacks love these five</text>

<rect x="56" y="140" width="338" height="190" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="56" y="140" width="338" height="8" rx="4" fill="#8b2d2d"/>
<circle cx="92" cy="184" r="14" fill="#fbeeee" stroke="#8b2d2d" stroke-width="2"/>
<path d="M86 178 l12 12 M98 178 l-12 12" stroke="#8b2d2d" stroke-width="2.5" stroke-linecap="round"/>
<text x="118" y="190" font-size="16" font-weight="800" fill="#291c0e">One ticket, two SKUs</text>
<text x="84" y="232" font-size="13" fill="#4f4f4f">The spec is blunt: 1 ticket = 1 UPC</text>
<text x="84" y="256" font-size="13" fill="#4f4f4f">= 1 EPC. Reuse across color variants</text>
<text x="84" y="280" font-size="13" fill="#4f4f4f">flags the entire shipment.</text>

<rect x="431" y="140" width="338" height="190" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="431" y="140" width="338" height="8" rx="4" fill="#8b2d2d"/>
<circle cx="467" cy="184" r="14" fill="#fbeeee" stroke="#8b2d2d" stroke-width="2"/>
<path d="M461 178 l12 12 M473 178 l-12 12" stroke="#8b2d2d" stroke-width="2.5" stroke-linecap="round"/>
<text x="493" y="190" font-size="16" font-weight="800" fill="#291c0e">No factory read test</text>
<text x="459" y="232" font-size="13" fill="#4f4f4f">Dead tags pay the $0.75/unit offset</text>
<text x="459" y="256" font-size="13" fill="#4f4f4f">(raised from $0.60 in July 2023) —</text>
<text x="459" y="280" font-size="13" fill="#4f4f4f">inline testing costs a fraction.</text>

<rect x="806" y="140" width="338" height="190" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="806" y="140" width="338" height="8" rx="4" fill="#8b2d2d"/>
<circle cx="842" cy="184" r="14" fill="#fbeeee" stroke="#8b2d2d" stroke-width="2"/>
<path d="M836 178 l12 12 M848 178 l-12 12" stroke="#8b2d2d" stroke-width="2.5" stroke-linecap="round"/>
<text x="868" y="190" font-size="16" font-weight="800" fill="#291c0e">A sloppy EDI 856 ASN</text>
<text x="834" y="232" font-size="13" fill="#4f4f4f">An ASN missing the SGTIN-96 →</text>
<text x="834" y="256" font-size="13" fill="#4f4f4f">SSCC → BOL roll-up blocks the</text>
<text x="834" y="280" font-size="13" fill="#4f4f4f">entire receiving event on GXS.</text>

<rect x="243" y="355" width="338" height="190" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="243" y="355" width="338" height="8" rx="4" fill="#8b2d2d"/>
<circle cx="279" cy="399" r="14" fill="#fbeeee" stroke="#8b2d2d" stroke-width="2"/>
<path d="M273 393 l12 12 M285 393 l-12 12" stroke="#8b2d2d" stroke-width="2.5" stroke-linecap="round"/>
<text x="305" y="405" font-size="16" font-weight="800" fill="#291c0e">Stale inlay list</text>
<text x="271" y="447" font-size="13" fill="#4f4f4f">Mid-quarter inlay swaps get rejected</text>
<text x="271" y="471" font-size="13" fill="#4f4f4f">at receiving — re-qualify with a</text>
<text x="271" y="495" font-size="13" fill="#4f4f4f">sample shipment first.</text>

<rect x="618" y="355" width="338" height="190" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="618" y="355" width="338" height="8" rx="4" fill="#8b2d2d"/>
<circle cx="654" cy="399" r="14" fill="#fbeeee" stroke="#8b2d2d" stroke-width="2"/>
<path d="M648 393 l12 12 M660 393 l-12 12" stroke="#8b2d2d" stroke-width="2.5" stroke-linecap="round"/>
<text x="680" y="405" font-size="16" font-weight="800" fill="#291c0e">Bloomingdale's ≠ Macy's</text>
<text x="646" y="447" font-size="13" fill="#4f4f4f">Same portal, tighter placement and</text>
<text x="646" y="471" font-size="13" fill="#4f4f4f">cosmetic standards on the</text>
<text x="646" y="495" font-size="13" fill="#4f4f4f">Bloomingdale's side. Check per PO.</text>

<text x="600" y="612" text-anchor="middle" font-size="14" fill="#5c5c5c">Monthly audit cadence means these surface late — one bad ASN can ride 4-5 weekly shipments before the scorecard tells you.</text>
</svg>
