<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID frequency-band matching across LF, HF, and UHF, with a mismatch example</title>
<desc id="d">Three matched band lanes on the left and a red mismatch panel on the right. Lane one, LF at 125 kHz, reader and tag on the same band read successfully, used for proximity cards and animal ID. Lane two, HF at 13.56 MHz, reads successfully, covered by ISO 14443 and ISO 15693. Lane three, UHF at 902 to 928 MHz in the US, reads successfully, using EPC Gen2 with an 865 to 868 MHz band in the EU. The right panel, in red, shows that a 125 kHz LF tag placed in front of a 13.56 MHz HF reader never answers, because it is the wrong band rather than a broken tag.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MATCH THE BAND, OR IT WON'T READ</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">A reader only hears its own frequency</text>
<text x="600" y="133" text-anchor="middle" font-size="15.5" fill="#4f4f4f">The tag's band and the reader's band have to be the same, or nothing answers.</text>

<!-- LANE 1: LF -->
<rect x="64" y="186" width="756" height="88" rx="12" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.4"/>
<rect x="80" y="202" width="150" height="56" rx="10" fill="#4a5568"/>
<text x="155" y="228" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">LF</text>
<text x="155" y="248" text-anchor="middle" font-size="13" fill="#e7ecf2">125 kHz</text>
<rect x="264" y="210" width="52" height="40" rx="6" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.5"/>
<path d="M324 218 A 14 14 0 0 1 324 242" fill="none" stroke="#4a5568" stroke-width="2.2"/>
<path d="M334 212 A 22 22 0 0 1 334 248" fill="none" stroke="#8a94a3" stroke-width="2"/>
<rect x="360" y="210" width="54" height="40" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="370" y="220" width="20" height="20" rx="2" fill="none" stroke="#b98f4e" stroke-width="1.6"/>
<rect x="470" y="206" width="330" height="48" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<circle cx="494" cy="230" r="9" fill="#1f6f3a"/><polyline points="489,230 493,234 500,224" fill="none" stroke="#fff" stroke-width="2.4"/>
<text x="514" y="226" font-size="14.5" font-weight="700" fill="#234a4a">Same band → reads</text>
<text x="514" y="244" font-size="12.5" fill="#5c5c5c">prox cards, animal ID</text>

<!-- LANE 2: HF -->
<rect x="64" y="286" width="756" height="88" rx="12" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.4"/>
<rect x="80" y="302" width="150" height="56" rx="10" fill="#3d6b6b"/>
<text x="155" y="328" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">HF</text>
<text x="155" y="348" text-anchor="middle" font-size="13" fill="#dcebeb">13.56 MHz</text>
<rect x="264" y="310" width="52" height="40" rx="6" fill="#f4f6f8" stroke="#3d6b6b" stroke-width="1.5"/>
<path d="M324 318 A 14 14 0 0 1 324 342" fill="none" stroke="#3d6b6b" stroke-width="2.2"/>
<path d="M334 312 A 22 22 0 0 1 334 348" fill="none" stroke="#7fb0b0" stroke-width="2"/>
<rect x="360" y="310" width="54" height="40" rx="6" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/><rect x="370" y="320" width="20" height="20" rx="2" fill="none" stroke="#b98f4e" stroke-width="1.6"/>
<rect x="470" y="306" width="330" height="48" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<circle cx="494" cy="330" r="9" fill="#1f6f3a"/><polyline points="489,330 493,334 500,324" fill="none" stroke="#fff" stroke-width="2.4"/>
<text x="514" y="326" font-size="14.5" font-weight="700" fill="#234a4a">Same band → reads</text>
<text x="514" y="344" font-size="12.5" fill="#5c5c5c">ISO 14443 · ISO 15693</text>

<!-- LANE 3: UHF -->
<rect x="64" y="386" width="756" height="88" rx="12" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.4"/>
<rect x="80" y="402" width="150" height="56" rx="10" fill="#2c5454"/>
<text x="155" y="428" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">UHF</text>
<text x="155" y="448" text-anchor="middle" font-size="12.5" fill="#d3e4e4">902-928 MHz US</text>
<rect x="264" y="410" width="52" height="40" rx="6" fill="#f4f6f8" stroke="#2c5454" stroke-width="1.5"/>
<path d="M324 418 A 14 14 0 0 1 324 442" fill="none" stroke="#2c5454" stroke-width="2.2"/>
<path d="M334 412 A 22 22 0 0 1 334 448" fill="none" stroke="#6fa3a3" stroke-width="2"/>
<rect x="360" y="410" width="54" height="40" rx="6" fill="#ffffff" stroke="#2c5454" stroke-width="1.5"/><rect x="370" y="420" width="20" height="20" rx="2" fill="none" stroke="#b98f4e" stroke-width="1.6"/>
<rect x="470" y="406" width="330" height="48" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<circle cx="494" cy="430" r="9" fill="#1f6f3a"/><polyline points="489,430 493,434 500,424" fill="none" stroke="#fff" stroke-width="2.4"/>
<text x="514" y="426" font-size="14.5" font-weight="700" fill="#234a4a">Same band → reads</text>
<text x="514" y="444" font-size="12.5" fill="#5c5c5c">EPC Gen2 · 865-868 MHz EU</text>

<!-- MISMATCH panel -->
<rect x="844" y="186" width="292" height="288" rx="14" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.6"/>
<text x="990" y="224" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">MISMATCH = SILENCE</text>
<rect x="884" y="248" width="62" height="44" rx="6" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/><text x="915" y="275" text-anchor="middle" font-size="13" font-weight="800" fill="#234a4a">HF</text>
<circle cx="990" cy="270" r="15" fill="#8b2d2d"/><line x1="982" y1="262" x2="998" y2="278" stroke="#fff" stroke-width="3"/><line x1="998" y1="262" x2="982" y2="278" stroke="#fff" stroke-width="3"/>
<rect x="1034" y="248" width="62" height="44" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/><text x="1065" y="275" text-anchor="middle" font-size="13" font-weight="800" fill="#3a4658">LF</text>
<text x="990" y="332" text-anchor="middle" font-size="13.5" fill="#291c0e">A 125 kHz LF tag in front of a</text>
<text x="990" y="352" text-anchor="middle" font-size="13.5" fill="#291c0e">13.56 MHz HF reader never answers.</text>
<text x="990" y="404" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8b2d2d">It isn't a broken tag —</text>
<text x="990" y="426" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8b2d2d">it's the wrong band.</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Confirm the tag's operating band matches the reader before you suspect anything more exotic.</text>
</svg>
