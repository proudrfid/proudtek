<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID festival deployment timeline, from T-24 weeks to doors-open</title>
<desc id="d">A horizontal timeline running from T-24 weeks to doors-open in five phases. T-24 to T-12 weeks: vendor selection across platform, bands and gates, the chip family decision and ticketing integration — a wrong chip choice here costs three months. T-12 to T-8 weeks: artwork approval, sample production, encoding format finalized, order locked at 105-110 percent of expected attendance. T-8 to T-4 weeks: production and encoding, QC sample read-tested on real gate hardware, POS shipped for training. T-4 to T-2 weeks: full gate dry-run with 200 production wristbands, POS stress-tested, the encoding window closes. T-7 to T-3 days: site build and reader install, network and offline tests, fire-marshal walkthrough, staff training on real kit — then doors open. Footer: the deadlines do not negotiate; encoding factories close their window whether or not the artwork is approved.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DEPLOYMENT TIMELINE · WORKING BACK FROM DOORS-OPEN</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">The schedule is the project</text>
<text x="600" y="120" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Most RFID festival projects fail in the timeline, not the technology.</text>

