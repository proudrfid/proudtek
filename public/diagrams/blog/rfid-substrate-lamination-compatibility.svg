<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The RFID chip fits every sustainable substrate; the substrate sets the bonding method</title>
<desc id="d">A banner states that one chip family fits every substrate: NTAG, MIFARE, DESFire, Monza and UCODE. Below, four rows map substrate to inlay bonding method and lamination constraint. Recycled PVC and rPET use standard lamination with any inlay, at any temperature. Bio-based PLA needs low-temperature lamination below 100 degrees Celsius. Wood veneer uses pressure-sensitive adhesive at room temperature. Paper uses adhesive-mounted or pulp-embedded inlays at room temperature. Choose the substrate for sustainability; its heat tolerance picks the inlay method.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SUBSTRATE SETS THE BONDING METHOD</text>
<text x="600" y="94" text-anchor="middle" font-size="28" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">The chip never limits the material &#8212; the temperature does</text>

<!-- Universal chip banner -->
<rect x="88" y="120" width="1024" height="62" rx="12" fill="#2d6a4f"/>
<text x="600" y="150" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.4" fill="#cfe6da">ONE CHIP FAMILY FITS EVERY SUBSTRATE</text>
<text x="600" y="172" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">NTAG &#183; MIFARE &#183; DESFire &#183; Impinj Monza &#183; NXP UCODE</text>

<!-- Column headers -->
<text x="140" y="216" text-anchor="start" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">SUBSTRATE</text>
<text x="470" y="216" text-anchor="start" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">INLAY / BONDING METHOD</text>
<text x="940" y="216" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">LAMINATION</text>

<!-- Row 1 -->
<rect x="88" y="232" width="1024" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="88" y="232" width="8" height="74" rx="4" fill="#4a5568"/>
<circle cx="122" cy="269" r="7" fill="#4a5568"/>
<text x="140" y="275" text-anchor="start" font-size="15.5" font-weight="700" fill="#291c0e">Recycled PVC / rPET</text>
<text x="470" y="275" text-anchor="start" font-size="14" fill="#333333">Standard lamination, any inlay format</text>
<rect x="878" y="250" width="124" height="38" rx="8" fill="#eef1f5" stroke="#b9c2cf" stroke-width="1.2"/>
<text x="940" y="274" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4453">Any temp</text>

<!-- Row 2 -->
<rect x="88" y="318" width="1024" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="88" y="318" width="8" height="74" rx="4" fill="#2d6a4f"/>
<circle cx="122" cy="355" r="7" fill="#2d6a4f"/>
<text x="140" y="361" text-anchor="start" font-size="15.5" font-weight="700" fill="#291c0e">Bio-based PLA</text>
<text x="470" y="361" text-anchor="start" font-size="14" fill="#333333">Low-temp lamination or cold-laminated inlay</text>
<rect x="878" y="336" width="124" height="38" rx="8" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="940" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">&#60; 100 &#176;C</text>

<!-- Row 3 -->
<rect x="88" y="404" width="1024" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="88" y="404" width="8" height="74" rx="4" fill="#1b4332"/>
<circle cx="122" cy="441" r="7" fill="#1b4332"/>
<text x="140" y="447" text-anchor="start" font-size="15.5" font-weight="700" fill="#291c0e">Wood veneer</text>
<text x="470" y="447" text-anchor="start" font-size="14" fill="#333333">Pressure-sensitive adhesive inlay</text>
<rect x="878" y="422" width="124" height="38" rx="8" fill="#e2ede7" stroke="#8fbaa2" stroke-width="1.2"/>
<text x="940" y="446" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b4332">Room temp</text>

<!-- Row 4 -->
<rect x="88" y="490" width="1024" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="88" y="490" width="8" height="74" rx="4" fill="#6d5a3a"/>
<circle cx="122" cy="527" r="7" fill="#6d5a3a"/>
<text x="140" y="533" text-anchor="start" font-size="15.5" font-weight="700" fill="#291c0e">Paper</text>
<text x="470" y="533" text-anchor="start" font-size="14" fill="#333333">Adhesive-mounted or pulp-embedded inlay</text>
<rect x="878" y="508" width="124" height="38" rx="8" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="940" y="532" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d5a3a">Room temp</text>

<text x="600" y="608" text-anchor="middle" font-size="14" fill="#4f4f4f">Choose the substrate for sustainability; its heat tolerance picks the inlay method.</text>
</svg>
