<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID access control from credential to PACS head-end</title>
<desc id="d">Banner diagram of an RFID access control system. On the left, three credential form factors — an ISO ID-1 card, a key fob and a wristband — present to a wall reader. The reader connects over an OSDP v2.2 Secure Channel with AES-128 to a controller panel, which reports to the PACS head-end software where enrolment, hot-lists and audit logs live.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID ACCESS CONTROL</text>
<text x="600" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">One credential, four layers of trust</text>
<text x="600" y="124" text-anchor="middle" font-size="15" fill="#4f4f4f">Cards, fobs and wristbands your PACS already understands — encoded to spec before despatch.</text>

<!-- credentials column -->
<text x="165" y="172" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CREDENTIALS</text>
<rect x="80" y="190" width="170" height="106" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2.5"/>
<rect x="100" y="214" width="28" height="22" rx="4" fill="#d4a755" stroke="#c39a5f" stroke-width="1.5"/>
<line x1="100" y1="225" x2="128" y2="225" stroke="#b98e4e" stroke-width="1"/>
<line x1="114" y1="214" x2="114" y2="236" stroke="#b98e4e" stroke-width="1"/>
<text x="165" y="282" text-anchor="middle" font-size="12.5" fill="#5c5c5c">ISO ID-1 card</text>
<circle cx="165" cy="352" r="34" fill="#ffffff" stroke="#4a5568" stroke-width="2.5"/>
<circle cx="165" cy="326" r="8" fill="none" stroke="#4a5568" stroke-width="2.5"/>
<circle cx="165" cy="356" r="12" fill="none" stroke="#9aa5b5" stroke-width="2"/>
<text x="165" y="412" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Key fob</text>
<rect x="95" y="442" width="140" height="42" rx="21" fill="#ffffff" stroke="#4a5568" stroke-width="2.5"/>
<circle cx="165" cy="463" r="8" fill="#4a5568"/>
<text x="165" y="512" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Wristband</text>

<!-- read waves -->
<path d="M 300 320 q 26 40 0 80" fill="none" stroke="#c39a5f" stroke-width="2.5" stroke-linecap="round"/>
<path d="M 330 305 q 34 55 0 110" fill="none" stroke="#c39a5f" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
<path d="M 360 290 q 42 70 0 140" fill="none" stroke="#c39a5f" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

<!-- reader -->
<rect x="425" y="270" width="105" height="180" rx="14" fill="#4a5568" stroke="#3a4353" stroke-width="2"/>
<circle cx="477" cy="305" r="7" fill="#1f6f3a"/>
<rect x="450" y="330" width="55" height="55" rx="8" fill="none" stroke="#9aa5b5" stroke-width="2"/>
<rect x="450" y="402" width="55" height="6" rx="3" fill="#9aa5b5"/>
<text x="477" y="478" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Reader</text>
<text x="477" y="497" text-anchor="middle" font-size="12" fill="#5c5c5c">HID Signo · multiCLASS SE</text>

<!-- secure channel -->
<text x="616" y="320" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">OSDP v2.2</text>
<text x="616" y="341" text-anchor="middle" font-size="12" fill="#5c5c5c">Secure Channel · AES-128</text>
<line x1="530" y1="360" x2="702" y2="360" stroke="#3d6b6b" stroke-width="4"/>
<rect x="608" y="372" width="28" height="20" rx="4" fill="#3d6b6b"/>
<path d="M 614 372 v -7 a 8 8 0 0 1 16 0 v 7" fill="none" stroke="#3d6b6b" stroke-width="3"/>

<!-- panel -->
<rect x="702" y="290" width="168" height="140" rx="14" fill="#ffffff" stroke="#4a5568" stroke-width="2.5"/>
<text x="786" y="322" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Controller panel</text>
<text x="786" y="344" text-anchor="middle" font-size="12" fill="#5c5c5c">Mercury LP-series</text>
<text x="786" y="362" text-anchor="middle" font-size="12" fill="#5c5c5c">HID VertX · iSTAR</text>
<circle cx="748" cy="396" r="5" fill="#1f6f3a"/>
<circle cx="770" cy="396" r="5" fill="#d4a755"/>
<circle cx="792" cy="396" r="5" fill="#9aa5b5"/>
<circle cx="814" cy="396" r="5" fill="#9aa5b5"/>

<!-- arrow panel to head-end -->
<line x1="870" y1="360" x2="916" y2="360" stroke="#4a5568" stroke-width="3.5"/>
<path d="M 916 352 l 14 8 l -14 8 z" fill="#4a5568"/>

<!-- head-end -->
<rect x="936" y="262" width="196" height="196" rx="14" fill="#eef0f3" stroke="#4a5568" stroke-width="2.5"/>
<rect x="966" y="288" width="136" height="78" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<line x1="980" y1="310" x2="1088" y2="310" stroke="#9aa5b5" stroke-width="3"/>
<line x1="980" y1="328" x2="1060" y2="328" stroke="#c8cfda" stroke-width="3"/>
<line x1="980" y1="346" x2="1074" y2="346" stroke="#c8cfda" stroke-width="3"/>
<rect x="1022" y="366" width="24" height="10" fill="#4a5568"/>
<text x="1034" y="404" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">PACS head-end</text>
<text x="1034" y="425" text-anchor="middle" font-size="12" fill="#5c5c5c">Genetec · Lenel · C·CURE</text>
<text x="1034" y="442" text-anchor="middle" font-size="12" fill="#5c5c5c">Pro-Watch · AMAG · Gallagher</text>

<text x="600" y="600" text-anchor="middle" font-size="14" fill="#5c5c5c">The credential is the one layer you hand to strangers by the thousand — choose its silicon accordingly.</text>
</svg>
