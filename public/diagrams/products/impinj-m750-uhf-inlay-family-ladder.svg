<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The Impinj M700 family ladder — where M750 sits</title>
  <desc id="d">A four-card positioning ladder of the Impinj M700 RAIN RFID family. M730 is the cost-optimised chip with 0-bit user memory for SGTIN-96 retail volume. M750, highlighted as this page, adds a 32-bit user bank plus access and kill passwords and short-range mode for supply-chain, returnable-transit-item and point-of-sale privacy work. M770 adds extended user memory and AutoTune for mixed on-metal and on-liquid surfaces. The M800 series is shown as the next-generation successor with roughly 1-2 dB more sensitivity, Gen2X and lower chip power on a pin-compatible upgrade path. A footer notes all four share the EPC Gen2v2 air interface, the same antenna designs and a near-identical minus 22.1 dBm read-sensitivity floor, so the tiers differ by memory and features rather than read range.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE M700 FAMILY LADDER</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">One antenna design, three feature sets — plus the next-gen successor</text>

  <!-- M730 -->
  <rect x="60" y="132" width="240" height="300" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="60" y="132" width="240" height="8" rx="4" fill="#4a5568"/>
  <text x="80" y="184" font-size="23" font-weight="800" fill="#291c0e">M730</text>
  <text x="80" y="208" font-size="12.5" fill="#5c5c5c">cost floor</text>
  <line x1="80" y1="222" x2="280" y2="222" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="80" y="258" font-size="16" font-weight="800" fill="#3d6b6b">0-bit user</text>
  <text x="80" y="292" font-size="13" fill="#5c5c5c">No user / no password</text>
  <text x="80" y="318" font-size="13" fill="#5c5c5c">SGTIN-96 retail volume</text>
  <text x="80" y="344" font-size="13" fill="#5c5c5c">Walmart-mandate default</text>

  <!-- M750 (this page) -->
  <rect x="340" y="132" width="240" height="300" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="3"/>
  <rect x="340" y="132" width="240" height="8" rx="4" fill="#c39a5f"/>
  <text x="360" y="184" font-size="23" font-weight="800" fill="#6d5a3a">M750</text>
  <text x="360" y="208" font-size="12.5" font-weight="700" fill="#a97f3f">this page</text>
  <line x1="360" y1="222" x2="560" y2="222" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="360" y="258" font-size="16" font-weight="800" fill="#6d5a3a">32-bit user</text>
  <text x="360" y="292" font-size="13" fill="#5c5c5c">+ access / kill passwords</text>
  <text x="360" y="318" font-size="13" fill="#5c5c5c">Short-range mode at POS</text>
  <text x="360" y="344" font-size="13" fill="#5c5c5c">Supply-chain · RTI · lots</text>

  <!-- M770 -->
  <rect x="620" y="132" width="240" height="300" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="620" y="132" width="240" height="8" rx="4" fill="#3d6b6b"/>
  <text x="640" y="184" font-size="23" font-weight="800" fill="#291c0e">M770</text>
  <text x="640" y="208" font-size="12.5" fill="#5c5c5c">mixed-surface</text>
  <line x1="640" y1="222" x2="840" y2="222" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="640" y="258" font-size="16" font-weight="800" fill="#3d6b6b">Extended user</text>
  <text x="640" y="292" font-size="13" fill="#5c5c5c">+ AutoTune matching</text>
  <text x="640" y="318" font-size="13" fill="#5c5c5c">On-metal / on-liquid</text>
  <text x="640" y="344" font-size="13" fill="#5c5c5c">Broad substrate mix</text>

  <!-- M800 next-gen -->
  <rect x="900" y="132" width="240" height="300" rx="14" fill="#eef1f5" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="900" y="132" width="240" height="8" rx="4" fill="#4a5568"/>
  <text x="920" y="184" font-size="23" font-weight="800" fill="#4a5568">M800</text>
  <text x="920" y="208" font-size="12.5" font-weight="700" fill="#4a5568">next-gen</text>
  <line x1="920" y1="222" x2="1120" y2="222" stroke="#c3ccd6" stroke-width="1.5"/>
  <text x="920" y="258" font-size="16" font-weight="800" fill="#4a5568">Same + faster</text>
  <text x="920" y="292" font-size="13" fill="#5c5c5c">~1-2 dB · Gen2X</text>
  <text x="920" y="318" font-size="13" fill="#5c5c5c">Lower chip power</text>
  <text x="920" y="344" font-size="13" fill="#5c5c5c">Pin-compatible swap</text>

  <!-- rising step markers -->
  <text x="180" y="404" text-anchor="middle" font-size="12.5" fill="#8a8172">lowest cost</text>
  <text x="460" y="404" text-anchor="middle" font-size="12.5" fill="#a97f3f">+ small on-tag data</text>
  <text x="740" y="404" text-anchor="middle" font-size="12.5" fill="#8a8172">+ tough surfaces</text>
  <text x="1020" y="404" text-anchor="middle" font-size="12.5" fill="#8a8172">upgrade path</text>

  <!-- footer note band -->
  <rect x="60" y="470" width="1080" height="122" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="84" y="506" font-size="15.5" font-weight="800" fill="#2c5454">Same radio, different memory</text>
  <text x="84" y="534" font-size="13.5" fill="#3d6b6b">All four share the EPC Gen2v2 air interface, the same antenna designs, and a near-identical −22.1 dBm read-sensitivity floor.</text>
  <text x="84" y="558" font-size="13.5" fill="#3d6b6b">You climb the ladder for user memory and features — not for read range.</text>
  <text x="84" y="582" font-size="13.5" fill="#3d6b6b">M730 → M750 is a chip-on-foil swap: no antenna re-tune, no reader re-qualification.</text>

  <text x="600" y="626" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Buy the tier whose user memory and features you will actually use — the sensitivity floor barely moves across the family.</text>
</svg>
