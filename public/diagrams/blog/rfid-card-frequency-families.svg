<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The three RFID card frequency families and their personalities</title>
<desc id="d">A frequency axis with three markers — 125 kHz, 13.56 MHz and 860-960 MHz — above three panels. LF at 125 kHz: range 5-15 cm, no phone tap, chips $0.05-$0.15, home to HID Prox, EM4100 and T5577, with the warning that it has no encryption and clones trivially. HF at 13.56 MHz: tap distance, every phone reads it, chips $0.05-$1.40, home to NTAG, MIFARE and DESFire — the default smart-card band. UHF at 860-960 MHz: range 3-12 m, phone-readable only with a sled, chips $0.012-$0.020, home to UCODE 9 and Impinj M730/M770 — long range, dirt cheap. A footer notes your phone only ever speaks to the middle band.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PICK A BAND, ANY BAND</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Three frequency families, three personalities</text>

<line x1="120" y1="152" x2="1072" y2="152" stroke="#4f4f4f" stroke-width="1.5"/>
