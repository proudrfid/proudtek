<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="cgTitle cgDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="cgTitle">Why a cloned chip fails verification</title>
  <desc id="cgDesc">A genuine chip holds a unique private key set at the fab; on every tap it signs a fresh cryptographic signature that the verification API accepts, returning AUTHENTIC. A counterfeit holds only a cloned static UID and no private key, so it cannot produce a valid signature and the same API returns REJECTED. The API checks three things: the signature matches the chip's key set, the tap counter is increasing and not replayed, and the item record is in good standing.</desc>
  <defs>
    <radialGradient id="cgBg" cx="50%" cy="22%" r="86%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <marker id="cgArr" markerWidth="10" markerHeight="10" refX="3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c39a5f"/></marker>
    <marker id="cgArrR" markerWidth="10" markerHeight="10" refX="3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b98a4a"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#cgBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2.5" fill="#6d5a3a">WHY A CLONE FAILS ON THE FIRST TAP</text>
  <text x="600" y="90" text-anchor="middle" font-size="16" fill="#4f4f4f">The private key is set at the fab and never leaves the silicon — so it can't be copied off the item.</text>

  <!-- Genuine chip card -->
  <rect x="66" y="126" width="280" height="150" rx="14" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2.5"/>
  <text x="90" y="160" font-size="15" font-weight="800" letter-spacing="1" fill="#1f6f3a">GENUINE CHIP</text>
  <rect x="90" y="176" width="58" height="58" rx="9" fill="#ffffff" stroke="#1f6f3a" stroke-width="2.5"/>
  <g stroke="#1f6f3a" stroke-width="2.5"><line x1="78" y1="191" x2="90" y2="191"/><line x1="78" y1="205" x2="90" y2="205"/><line x1="78" y1="219" x2="90" y2="219"/><line x1="148" y1="191" x2="160" y2="191"/><line x1="148" y1="205" x2="160" y2="205"/><line x1="148" y1="219" x2="160" y2="219"/></g>
  <circle cx="119" cy="199" r="9" fill="none" stroke="#1f6f3a" stroke-width="3"/><path d="M119 208 v11 M119 216 h7" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round"/>
  <text x="174" y="199" font-size="16.5" font-weight="700" fill="#291c0e">unique private</text>
  <text x="174" y="220" font-size="16.5" font-weight="700" fill="#291c0e">key, fab-set</text>

  <!-- Clone chip card -->
  <rect x="66" y="399" width="280" height="150" rx="14" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2.5"/>
  <text x="90" y="433" font-size="15" font-weight="800" letter-spacing="1" fill="#8b2d2d">COUNTERFEIT</text>
  <rect x="90" y="449" width="58" height="58" rx="9" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="119" y="486" text-anchor="middle" font-size="26" font-weight="800" fill="#8b2d2d">?</text>
  <text x="174" y="472" font-size="16.5" font-weight="700" fill="#291c0e">cloned UID only</text>
  <text x="174" y="493" font-size="16.5" font-weight="700" fill="#7a4242">no private key</text>

  <!-- arrows to API with labels sitting clear in the gap -->
  <text x="416" y="205" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">fresh signature</text>
  <text x="416" y="222" text-anchor="middle" font-size="12.5" fill="#3f6b4e">every tap · SUN</text>
  <line x1="352" y1="238" x2="482" y2="248" stroke="#c39a5f" stroke-width="4" stroke-linecap="round" marker-end="url(#cgArr)"/>
  <text x="404" y="462" text-anchor="middle" font-size="13.5" font-weight="800" fill="#8b2d2d">no valid</text>
  <text x="404" y="480" text-anchor="middle" font-size="13.5" font-weight="800" fill="#8b2d2d">signature</text>
  <line x1="352" y1="452" x2="482" y2="440" stroke="#b98a4a" stroke-width="4" stroke-linecap="round" marker-end="url(#cgArrR)"/>

  <!-- API box -->
  <rect x="490" y="150" width="320" height="376" rx="16" fill="#fbf8f2" stroke="#c39a5f" stroke-width="2.5"/>
  <path d="M490 166 a16 16 0 0 1 16 -16 h288 a16 16 0 0 1 16 16 v36 h-320 Z" fill="#291c0e"/>
  <text x="650" y="183" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="1.5" fill="#d4a755">VERIFICATION API</text>
  <text x="650" y="232" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">EVERY TAP IS CHECKED THREE WAYS</text>
  <g>
    <circle cx="528" cy="272" r="13" fill="#1f6f3a"/><path d="M522 272 l4 5 l9 -10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="552" y="270" font-size="15" font-weight="700" fill="#291c0e">signature matches the</text>
    <text x="552" y="289" font-size="15" font-weight="700" fill="#291c0e">chip's key set</text>
  </g>
  <g>
    <circle cx="528" cy="336" r="13" fill="#1f6f3a"/><path d="M522 336 l4 5 l9 -10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="552" y="334" font-size="15" font-weight="700" fill="#291c0e">tap counter increasing</text>
    <text x="552" y="353" font-size="15" font-weight="700" fill="#291c0e">(not replayed)</text>
  </g>
  <g>
    <circle cx="528" cy="400" r="13" fill="#1f6f3a"/><path d="M522 400 l4 5 l9 -10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="552" y="398" font-size="15" font-weight="700" fill="#291c0e">record in good</text>
    <text x="552" y="417" font-size="15" font-weight="700" fill="#291c0e">standing</text>
  </g>
  <text x="650" y="472" text-anchor="middle" font-size="13" fill="#4f4f4f">Output: verified-or-not + audit trail</text>
  <text x="650" y="492" text-anchor="middle" font-size="13" fill="#4f4f4f">(when · where · by whom)</text>

  <!-- arrows API -> verdicts -->
  <line x1="814" y1="246" x2="860" y2="216" stroke="#c39a5f" stroke-width="4" stroke-linecap="round" marker-end="url(#cgArr)"/>
  <line x1="814" y1="440" x2="860" y2="466" stroke="#b98a4a" stroke-width="4" stroke-linecap="round" marker-end="url(#cgArrR)"/>

  <!-- verdicts -->
  <rect x="866" y="152" width="268" height="120" rx="14" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2.5"/>
  <circle cx="912" cy="212" r="24" fill="#1f6f3a"/><path d="M900 212 l8 9 l16 -18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="950" y="206" font-size="23" font-weight="800" fill="#1f6f3a">AUTHENTIC</text>
  <text x="950" y="232" font-size="14" fill="#3f6b4e">genuine · valid signature</text>

  <rect x="866" y="406" width="268" height="120" rx="14" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2.5"/>
  <circle cx="912" cy="466" r="24" fill="#8b2d2d"/><path d="M902 456 l20 20 M922 456 l-20 20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="950" y="460" font-size="23" font-weight="800" fill="#8b2d2d">REJECTED</text>
  <text x="950" y="486" font-size="14" fill="#7a4242">clone fails first tap</text>
</svg>
