<text x="1044" y="305" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Custom molded</text>
<text x="1044" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">MOQ 1,000-5,000</text>
<text x="1044" y="352" text-anchor="middle" font-size="12.5" fill="#4f4f4f">unique tooling</text>
<text x="1044" y="370" text-anchor="middle" font-size="12.5" fill="#4f4f4f">logo built into the</text>
<text x="1044" y="388" text-anchor="middle" font-size="12.5" fill="#4f4f4f">housing itself</text>

<rect x="70" y="510" width="1076" height="58" rx="12" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="608" y="535" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">All five carry the same chips — the housing decides durability, acceptance and cost.</text>
<text x="608" y="555" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Match the shell to the environment it has to survive.</text>

<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The catalog photo is not the spec — the pocket, the weather and the job site are.</text>
