<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Two departments, one NFC chip — engagement and EPR reporting from the same tag</title>
<desc id="d">A brand manager on the left says "Make it tappable!" and wants videos, pairings and the loyalty club. A sustainability officer on the right asks "Where's my audit trail?" and wants EPR reports that survive audits. Dashed lines connect both to a single NFC chip in the centre, labelled one NFC tag, with two pills underneath: engagement and EPR reporting. Caption: two vocabularies, one chip quietly doing both jobs — which is how NFC graduated from cute gimmick to budget line item.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TWO DEPARTMENTS · ONE BUDGET LINE</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="36" font-weight="700" fill="#291c0e">Two colleagues, one chip</text>

