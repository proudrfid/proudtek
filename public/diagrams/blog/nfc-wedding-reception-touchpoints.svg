<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five places an NFC tag earns its tap at a wedding reception</title>
<desc id="d">A reception floor marked with five NFC touchpoints, each a card showing what a tap opens. Favor bags and boxes on the gift table open a shared photo album. Table number cards open that table's guestbook page. Place cards open a personal note written for that guest. A photo and selfie station opens a live album upload link. Menu and program cards open the couple's love-story and ceremony program. All five point back to one shared page, reached from a different spot in the room.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE PLACES A TAG EARNS ITS TAP</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Where NFC lands at the reception</text>

<rect x="72" y="150" width="1056" height="386" rx="18" fill="#eef5f5" stroke="#cfe0e0" stroke-width="2"/>
<text x="600" y="348" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" fill="#9cb7b7">THE RECEPTION FLOOR</text>

<rect x="110" y="188" width="268" height="98" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="1.8"/>
<circle cx="146" cy="224" r="16" fill="#c39a5f"/>
<text x="146" y="230" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
<text x="176" y="220" font-size="15.5" font-weight="700" fill="#291c0e">Favor bags &amp; boxes</text>
<text x="176" y="244" font-size="12.5" fill="#4f4f4f">on the gift table</text>
<text x="176" y="266" font-size="12.5" font-weight="600" fill="#2c5454">tap → shared photo album</text>

<rect x="110" y="400" width="268" height="98" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<circle cx="146" cy="436" r="16" fill="#3d6b6b"/>
<text x="146" y="442" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<text x="176" y="432" font-size="15.5" font-weight="700" fill="#291c0e">Table number cards</text>
<text x="176" y="456" font-size="12.5" fill="#4f4f4f">one per guest table</text>
<text x="176" y="478" font-size="12.5" font-weight="600" fill="#2c5454">tap → that table's guestbook</text>

<rect x="466" y="294" width="268" height="98" rx="12" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.8"/>
<circle cx="502" cy="330" r="16" fill="#6d5a3a"/>
<text x="502" y="336" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<text x="532" y="326" font-size="15.5" font-weight="700" fill="#291c0e">Place cards</text>
<text x="532" y="350" font-size="12.5" fill="#4f4f4f">one per seat</text>
<text x="532" y="372" font-size="12.5" font-weight="600" fill="#2c5454">tap → a note just for you</text>

<rect x="822" y="188" width="268" height="98" rx="12" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.8"/>
<circle cx="858" cy="224" r="16" fill="#2d6a4f"/>
<text x="858" y="230" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4</text>
<text x="888" y="220" font-size="15.5" font-weight="700" fill="#291c0e">Photo / selfie station</text>
<text x="888" y="244" font-size="12.5" fill="#4f4f4f">by the booth</text>
<text x="888" y="266" font-size="12.5" font-weight="600" fill="#1b4332">tap → live album upload</text>

<rect x="822" y="400" width="268" height="98" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="1.8"/>
<circle cx="858" cy="436" r="16" fill="#c39a5f"/>
<text x="858" y="442" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">5</text>
<text x="888" y="432" font-size="15.5" font-weight="700" fill="#291c0e">Menu &amp; program cards</text>
<text x="888" y="456" font-size="12.5" fill="#4f4f4f">at each place setting</text>
<text x="888" y="478" font-size="12.5" font-weight="600" fill="#2c5454">tap → love-story + ceremony</text>

<line x1="378" y1="237" x2="466" y2="320" stroke="#d4c39a" stroke-width="1.6" stroke-dasharray="3 4"/>
<line x1="378" y1="449" x2="466" y2="366" stroke="#d4c39a" stroke-width="1.6" stroke-dasharray="3 4"/>
<line x1="734" y1="330" x2="822" y2="237" stroke="#d4c39a" stroke-width="1.6" stroke-dasharray="3 4"/>
<line x1="734" y1="360" x2="822" y2="449" stroke="#d4c39a" stroke-width="1.6" stroke-dasharray="3 4"/>

<text x="600" y="586" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="17" font-weight="700" fill="#291c0e">One shared page, five doors in.</text>
<text x="600" y="616" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Each touchpoint opens the couple's album or note from a different spot in the room — put a tag only where it earns the tap.</text>
</svg>
