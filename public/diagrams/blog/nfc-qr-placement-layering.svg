<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Pairing NFC and QR: fast lane and wide lane into one dashboard</title>
<desc id="d">Two lanes routed to one dashboard. The NFC fast lane is the in-hand phone moment at 1 to 2 cm, placed on high-touch surfaces: counter card, table tent, lanyard. The QR wide lane is the across-the-room moment readable at 30 to 150 cm, placed on static surfaces: poster, window cling, packaging. Both feed one UTM-tagged redirect using utm_source=nfc and utm_source=qr, landing in a single GA4 dashboard. NFC captures intent, QR captures reach — print both, route both, compare both.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PAIR THEM · FULL DEVICE COVERAGE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">A fast lane and a wide lane, routed to one dashboard.</text>

<!-- LEFT lane NFC -->
<rect x="88" y="128" width="480" height="248" rx="15" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="328" y="172" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#234a4a">NFC · THE FAST LANE</text>
<text x="328" y="198" text-anchor="middle" font-size="13.5" fill="#3d6b6b">the in-hand phone moment · contact at 1-2 cm</text>
<rect x="104" y="226" width="140" height="44" rx="22" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="174" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">Counter card</text>
<rect x="258" y="226" width="140" height="44" rx="22" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="328" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">Table tent</text>
<rect x="412" y="226" width="140" height="44" rx="22" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="482" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">Lanyard</text>
<text x="328" y="330" text-anchor="middle" font-size="13" fill="#4f6a6a">captures buyers who already have a phone in hand</text>

<!-- RIGHT lane QR -->
<rect x="632" y="128" width="480" height="248" rx="15" fill="#faf6ee" stroke="#c39a5f" stroke-width="2"/>
<text x="872" y="172" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#8a6d34">QR · THE WIDE LANE</text>
<text x="872" y="198" text-anchor="middle" font-size="13.5" fill="#7a6636">the across-the-room moment · readable at 30-150 cm</text>
<rect x="648" y="226" width="140" height="44" rx="22" fill="#ffffff" stroke="#e4d8bf" stroke-width="1.4"/>
<text x="718" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a6d34">Poster</text>
<rect x="802" y="226" width="140" height="44" rx="22" fill="#ffffff" stroke="#e4d8bf" stroke-width="1.4"/>
<text x="872" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a6d34">Window cling</text>
<rect x="956" y="226" width="140" height="44" rx="22" fill="#ffffff" stroke="#e4d8bf" stroke-width="1.4"/>
<text x="1026" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a6d34">Packaging</text>
<text x="872" y="330" text-anchor="middle" font-size="13" fill="#7a6636">captures viewers standing too far away to tap</text>

<!-- converge -->
<line x1="328" y1="376" x2="556" y2="424" stroke="#291c0e" stroke-width="2.6"/>
<polygon points="556,424 539,421 549,435" fill="#291c0e"/>
<line x1="872" y1="376" x2="644" y2="424" stroke="#291c0e" stroke-width="2.6"/>
<polygon points="644,424 651,435 661,421" fill="#291c0e"/>

<rect x="360" y="430" width="480" height="86" rx="14" fill="#e6efec" stroke="#2c5454" stroke-width="2.5"/>
<text x="600" y="466" text-anchor="middle" font-size="17" font-weight="800" fill="#234a4a">ONE UTM-TAGGED REDIRECT</text>
<text x="600" y="496" text-anchor="middle" font-size="14" font-weight="600" fill="#3d6b6b">utm_source=nfc  ·  utm_source=qr</text>

<text x="600" y="556" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Both lanes land in one GA4 dashboard, compared side by side.</text>
<text x="600" y="596" text-anchor="middle" font-size="14" fill="#5c5c5c">NFC captures intent, QR captures reach — print both, route both, compare both.</text>
</svg>
