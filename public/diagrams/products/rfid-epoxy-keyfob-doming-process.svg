<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Custom epoxy keyfob production — six stages with hold points and the resin cure clock</title>
<desc id="d">Serpentine six-step flow. Step one, artwork and silhouette lock: CMYK at 300 dpi or Pantone spec, die-cut contour frozen, with a hold point for Pantone verification on the printed substrate. Step two, print and die-cut of the PVC, PET or aluminium substrate into teardrop, rectangle, oval or custom outline, held against the locked artwork file. Step three, inlay and grommet assembly with a read test on the bare assembly. Step four, resin dose: two-component epoxy mixed and dosed within its 20 to 40 minute pot life, dome built to 3 to 5 millimetres with no voids. Step five, gel and cure: gels in 1 to 2 hours at 25 degrees Celsius, full cure at 24 hours, Shore D hardness 75 to 85, no handling before full cure. Step six, QC, encode and ship: optical clarity, hardness and UID read verified, encoding applied per order, UID list packed with the shipment. Bottom band: the resin clock runs from dose through 20 to 40 minute pot life and 1 to 2 hour gel to 24 hour full cure.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/></marker></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CUSTOM EPOXY KEYFOB PRODUCTION</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Six stages — and a clock you cannot rush</text>

<!-- row 1 -->
<rect x="66" y="126" width="340" height="152" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<circle cx="96" cy="158" r="14" fill="#c39a5f"/>
<text x="96" y="163" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="120" y="163" font-size="15" font-weight="700" fill="#291c0e">Artwork + silhouette lock</text>
<text x="90" y="192" font-size="12.5" fill="#4f4f4f">CMYK ≥ 300 dpi or Pantone spec</text>
<text x="90" y="212" font-size="12.5" fill="#4f4f4f">die-cut contour frozen</text>
<rect x="88" y="228" width="296" height="26" rx="13" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="236" y="245" text-anchor="middle" font-size="12" fill="#6d5a3a">HOLD · Pantone check on printed substrate</text>

<rect x="430" y="126" width="340" height="152" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<circle cx="460" cy="158" r="14" fill="#c39a5f"/>
<text x="460" y="163" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="484" y="163" font-size="15" font-weight="700" fill="#291c0e">Print + die-cut</text>
<text x="454" y="192" font-size="12.5" fill="#4f4f4f">PVC / PET / aluminium substrate</text>
<text x="454" y="212" font-size="12.5" fill="#4f4f4f">teardrop · rectangle · oval · custom</text>
<rect x="452" y="228" width="296" height="26" rx="13" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="600" y="245" text-anchor="middle" font-size="12" fill="#6d5a3a">HOLD · contour vs locked artwork file</text>

<rect x="794" y="126" width="340" height="152" rx="12" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<circle cx="824" cy="158" r="14" fill="#4a5568"/>
<text x="824" y="163" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
<text x="848" y="163" font-size="15" font-weight="700" fill="#291c0e">Inlay + grommet assembly</text>
<text x="818" y="192" font-size="12.5" fill="#4f4f4f">HF or LF inlay bonded to substrate</text>
<text x="818" y="212" font-size="12.5" fill="#4f4f4f">metal grommet set in key-ring hole</text>
<rect x="816" y="228" width="296" height="26" rx="13" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="964" y="245" text-anchor="middle" font-size="12" fill="#6d5a3a">HOLD · read test on bare assembly</text>

<!-- arrows row1 + down + row2 (serpentine) -->
<path d="M 406 202 h 20" fill="none" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M 770 202 h 20" fill="none" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M 964 278 v 24" fill="none" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M 794 382 h -20" fill="none" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M 430 382 h -20" fill="none" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/>

<!-- row 2 (flows right to left: 4, 5, 6) -->
<rect x="794" y="306" width="340" height="152" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="824" cy="338" r="14" fill="#3d6b6b"/>
<text x="824" y="343" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
<text x="848" y="343" font-size="15" font-weight="700" fill="#291c0e">Resin dose</text>
<text x="818" y="372" font-size="12.5" fill="#4f4f4f">two-component epoxy, mixed + dosed</text>
<text x="818" y="392" font-size="12.5" fill="#4f4f4f">within the 20-40 min pot life</text>
<rect x="816" y="408" width="296" height="26" rx="13" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="964" y="425" text-anchor="middle" font-size="12" fill="#6d5a3a">HOLD · dome 3-5 mm, no voids, no overspill</text>

<rect x="430" y="306" width="340" height="152" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="460" cy="338" r="14" fill="#3d6b6b"/>
<text x="460" y="343" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">5</text>
<text x="484" y="343" font-size="15" font-weight="700" fill="#291c0e">Gel + cure</text>
<text x="454" y="372" font-size="12.5" fill="#4f4f4f">gel 1-2 h at 25 °C · full cure 24 h</text>
<text x="454" y="392" font-size="12.5" fill="#4f4f4f">Shore D hardness reaches 75-85</text>
<rect x="452" y="408" width="296" height="26" rx="13" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="600" y="425" text-anchor="middle" font-size="12" fill="#6d5a3a">HOLD · no handling before full cure</text>

<rect x="66" y="306" width="340" height="152" rx="12" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<circle cx="96" cy="338" r="14" fill="#1f6f3a"/>
<text x="96" y="343" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">6</text>
<text x="120" y="343" font-size="15" font-weight="700" fill="#291c0e">QC + encode + ship</text>
<text x="90" y="372" font-size="12.5" fill="#4f4f4f">clarity + hardness + UID read verified</text>
<text x="90" y="392" font-size="12.5" fill="#4f4f4f">encoding applied per order</text>
<rect x="88" y="408" width="296" height="26" rx="13" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="236" y="425" text-anchor="middle" font-size="12" fill="#6d5a3a">UID list packed with the shipment</text>

<!-- resin clock band -->
<text x="600" y="512" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE RESIN CLOCK</text>
<rect x="120" y="530" width="240" height="14" rx="7" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<rect x="360" y="530" width="300" height="14" fill="#8fb8b8"/>
<rect x="660" y="530" width="420" height="14" rx="7" fill="#3d6b6b"/>
<path d="M 120 552 v 8 M 360 552 v 8 M 660 552 v 8 M 1080 552 v 8" stroke="#4a5568" stroke-width="1.5"/>
<text x="120" y="580" text-anchor="middle" font-size="12.5" fill="#4f4f4f">dose</text>
<text x="360" y="580" text-anchor="middle" font-size="12.5" fill="#4f4f4f">20-40 min pot life</text>
<text x="660" y="580" text-anchor="middle" font-size="12.5" fill="#4f4f4f">1-2 h gel at 25 °C</text>
<text x="1080" y="580" text-anchor="middle" font-size="12.5" fill="#4f4f4f">24 h full cure</text>
<text x="600" y="614" text-anchor="middle" font-size="14" fill="#4f4f4f">Ship-ready only after full cure — hardness, clarity and read tests all run on cured resin</text>
</svg>
