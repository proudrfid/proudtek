<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Where each of the six anchor-bolt tag SKUs mounts on the joint</title>
  <desc id="d">Cross-section of a bolted structural joint on a concrete foundation showing the six mounting positions. A laser-welded bolt-head tag of 20 by 12 by 2 millimetres sits on the head face. A drilled-anchor potted inlay of 10 by 10 by 15 millimetres sits epoxy-potted in a cavity in the head. An under-washer disc of 25 by 3 millimetres sits between the fastener and the F436 washer. A weld-on boss of 40 by 20 by 5 millimetres is welded to the plate beside the fastener per AWS D1.1, D1.5 and D1.6. A precast or cast-in-place embed of 60 by 20 by 10 millimetres is cast into the concrete foundation. A seismic hold-down variant of 25 by 15 millimetres rides a post-installed adhesive anchor qualified per ACI 355.4. Pre-tension per AISC 360-22 J3 and the rotational-capacity lot stay certified because no SKU enters the shank.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SIX WAYS ONTO THE STEEL</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#5c5c5c">On the head, under the washer, beside the fastener or in the concrete — never through the joint</text>

  <!-- scene: plate on concrete, main bolt, boss, embed, adhesive anchor -->
  <rect x="330" y="470" width="560" height="130" fill="#eee7d8"/>
  <circle cx="380" cy="510" r="3" fill="#d9d0bd"/>
  <circle cx="490" cy="580" r="4" fill="#d9d0bd"/>
  <circle cx="650" cy="525" r="3" fill="#d9d0bd"/>
  <circle cx="740" cy="585" r="4" fill="#d9d0bd"/>
  <circle cx="866" cy="505" r="3" fill="#d9d0bd"/>
  <circle cx="560" cy="588" r="3" fill="#d9d0bd"/>
  <rect x="330" y="430" width="560" height="40" fill="#4a5568" rx="2"/>

  <rect x="560" y="430" width="36" height="140" fill="#6d5a3a"/>
  <rect x="532" y="416" width="92" height="14" rx="3" fill="#d4a755"/>
  <rect x="528" y="408" width="100" height="8" rx="4" fill="#3d6b6b"/>
  <polygon points="542,408 614,408 626,362 530,362" fill="#6d5a3a"/>
  <rect x="550" y="350" width="56" height="12" rx="6" fill="#c39a5f" stroke="#291c0e" stroke-width="1.5"/>
  <rect x="568" y="372" width="20" height="26" fill="#f8ead0" stroke="#291c0e" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="670" y="404" width="64" height="26" rx="6" fill="#3d6b6b"/>
  <polygon points="664,430 670,412 676,430" fill="#c39a5f"/>
  <polygon points="728,430 734,412 740,430" fill="#c39a5f"/>

  <rect x="396" y="510" width="64" height="24" rx="6" fill="#3d6b6b"/>

  <rect x="800" y="430" width="20" height="130" fill="#6d5a3a"/>
  <rect x="790" y="470" width="40" height="86" fill="none" stroke="#c39a5f" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="790,430 830,430 836,404 784,404" fill="#6d5a3a"/>
  <rect x="796" y="393" width="28" height="10" rx="5" fill="#c39a5f" stroke="#291c0e" stroke-width="1"/>

  <!-- left callouts (head cluster, ordered by target height) -->
  <text x="80" y="140" font-size="16" font-weight="700" fill="#291c0e">1 · Laser-welded bolt-head</text>
  <text x="80" y="164" font-size="12.5" fill="#5c5c5c">20 × 12 × 2 mm · AWS D17.1 weld</text>
  <line x1="300" y1="172" x2="544" y2="352" stroke="#c39a5f" stroke-width="2"/>
  <circle cx="546" cy="354" r="4" fill="#c39a5f"/>

  <text x="80" y="230" font-size="16" font-weight="700" fill="#291c0e">2 · Drilled-anchor potted</text>
  <text x="80" y="254" font-size="12.5" fill="#5c5c5c">10 × 10 × 15 mm · epoxy-potted in the head</text>
  <line x1="300" y1="262" x2="564" y2="382" stroke="#3d6b6b" stroke-width="2"/>
  <circle cx="566" cy="383" r="4" fill="#3d6b6b"/>

  <text x="80" y="320" font-size="16" font-weight="700" fill="#291c0e">3 · Under-washer disc</text>
  <text x="80" y="344" font-size="12.5" fill="#5c5c5c">25 × 3 mm · above the F436 / F436M washer</text>
  <line x1="300" y1="354" x2="526" y2="410" stroke="#3d6b6b" stroke-width="2"/>
  <circle cx="528" cy="411" r="4" fill="#3d6b6b"/>

  <!-- right callouts -->
  <text x="1120" y="230" text-anchor="end" font-size="16" font-weight="700" fill="#291c0e">4 · Weld-on boss</text>
  <text x="1120" y="254" text-anchor="end" font-size="12.5" fill="#5c5c5c">40 × 20 × 5 mm · AWS D1.1 / D1.5 / D1.6</text>
  <line x1="840" y1="262" x2="738" y2="414" stroke="#3d6b6b" stroke-width="2"/>
  <circle cx="736" cy="416" r="4" fill="#3d6b6b"/>

  <text x="1120" y="540" text-anchor="end" font-size="16" font-weight="700" fill="#291c0e">6 · Adhesive-anchor hold-down</text>
  <text x="1120" y="564" text-anchor="end" font-size="12.5" fill="#5c5c5c">25 × 15 mm · ACI 355.4-qualified</text>
  <line x1="856" y1="536" x2="834" y2="508" stroke="#c39a5f" stroke-width="2"/>
  <circle cx="832" cy="505" r="4" fill="#c39a5f"/>

  <text x="80" y="540" font-size="16" font-weight="700" fill="#291c0e">5 · Precast / cast-in embed</text>
  <text x="80" y="564" font-size="12.5" fill="#5c5c5c">60 × 20 × 10 mm · cast into the foundation</text>
  <line x1="330" y1="546" x2="394" y2="524" stroke="#3d6b6b" stroke-width="2"/>
  <circle cx="396" cy="523" r="4" fill="#3d6b6b"/>

  <!-- result band -->
  <rect x="200" y="618" width="800" height="36" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="642" text-anchor="middle" font-size="14" font-weight="600" fill="#2c5454">Pre-tension per AISC 360-22 J3 + rotational-capacity lot stay certified — no SKU enters the shank</text>
</svg>
