<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">LF, HF and UHF — the three RFID bands, side by side</title>
<desc id="d">Spectrum banner. Three panels compare the RFID bands: LF at 125 kHz reads centimetres and forgives metal and water; HF at 13.56 MHz is the band NFC phones, smart cards and hotel keys speak; UHF at 860-960 MHz reads metres and inventories whole pallets but dislikes metal and water. A frequency axis underneath runs from lower frequency (closer reads, forgiving) to higher frequency (farther reads, fussier environment).</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE SIGNAL · THREE VERY DIFFERENT PERSONALITIES</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">LF, HF and UHF — match the band to the job</text>

<rect x="46" y="130" width="340" height="430" rx="16" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<rect x="430" y="130" width="340" height="430" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<rect x="814" y="130" width="340" height="430" rx="16" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.5"/>

<text x="216" y="200" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="42" font-weight="700" fill="#c39a5f">LF</text>
<text x="600" y="200" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="42" font-weight="700" fill="#3d6b6b">HF</text>
<text x="984" y="200" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="42" font-weight="700" fill="#4a5568">UHF</text>

<rect x="141" y="218" width="150" height="34" rx="17" fill="#ffffff" stroke="#e4c98f"/>
<text x="216" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">125 kHz</text>
<rect x="525" y="218" width="150" height="34" rx="17" fill="#ffffff" stroke="#cfe0e0"/>
<text x="600" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">13.56 MHz</text>
<rect x="899" y="218" width="170" height="34" rx="17" fill="#ffffff" stroke="#d3dae3"/>
<text x="984" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#4a5568">860–960 MHz</text>

<circle cx="216" cy="330" r="16" fill="#c39a5f"/>
<circle cx="216" cy="330" r="34" fill="none" stroke="#c39a5f" stroke-width="2.5" opacity="0.75"/>
