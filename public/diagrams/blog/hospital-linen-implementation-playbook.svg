<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="hlS3Title hlS3Desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="hlS3Title">The five-step hospital linen RFID playbook</title>
  <desc id="hlS3Desc">Five sequential steps: tag every linen at receipt before first use; install tunnel, handheld and sterile-zone perimeter readers; integrate reads with the hospital ERP such as SAP or Lawson and the laundry vendor's WMS; define zone, over-cycle and rotation alerts; and train staff 4 to 8 hours per role, running a 90-day side-by-side phase. The rollout typically spans 12 to 24 months.</desc>

  <defs>
    <radialGradient id="s3Bg" cx="50%" cy="16%" r="95%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f0ebdf"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#s3Bg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="25" font-weight="800" fill="#291c0e">The five-step linen RFID playbook</text>
  <text x="600" y="90" text-anchor="middle" font-size="15.5" fill="#2d6a4f">Two organizations, one rollout — neither side fully controls the other.</text>

  <!-- connecting rail -->
  <line x1="164" y1="176" x2="1036" y2="176" stroke="#e2d3b4" stroke-width="4"/>

  <!-- 5 step cards : x = 64,282,500,718,936 ; w 200 -->
  <g>
    <!-- step 1 -->
    <rect x="64" y="196" width="200" height="248" rx="14" fill="#f6f0e6" stroke="#e2d3b4" stroke-width="2"/>
    <circle cx="164" cy="176" r="26" fill="#8a6d33"/>
    <text x="164" y="185" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">1</text>
    <text x="164" y="240" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Tag at receipt</text>
    <line x1="94" y1="256" x2="234" y2="256" stroke="#e2d3b4" stroke-width="1.5"/>
    <text x="164" y="284" text-anchor="middle" font-size="13.5" fill="#6c5127">Every new linen,</text>
    <text x="164" y="304" text-anchor="middle" font-size="13.5" fill="#6c5127">before first use.</text>
    <text x="164" y="336" text-anchor="middle" font-size="13.5" fill="#6c5127">Existing stock during</text>
    <text x="164" y="356" text-anchor="middle" font-size="13.5" fill="#6c5127">refresh cycles — no</text>
    <text x="164" y="376" text-anchor="middle" font-size="13.5" fill="#6c5127">need to halt the ward.</text>

    <!-- step 2 -->
    <rect x="282" y="196" width="200" height="248" rx="14" fill="#eef4f6" stroke="#bcd4dd" stroke-width="2"/>
    <circle cx="382" cy="176" r="26" fill="#1f4e79"/>
    <text x="382" y="185" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">2</text>
    <text x="382" y="240" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Install readers</text>
    <line x1="312" y1="256" x2="452" y2="256" stroke="#bcd4dd" stroke-width="1.5"/>
    <text x="382" y="284" text-anchor="middle" font-size="13.5" fill="#4a5568">Tunnel reader at the</text>
    <text x="382" y="304" text-anchor="middle" font-size="13.5" fill="#4a5568">laundry inlet/outlet,</text>
    <text x="382" y="336" text-anchor="middle" font-size="13.5" fill="#4a5568">handhelds at intake,</text>
    <text x="382" y="356" text-anchor="middle" font-size="13.5" fill="#4a5568">wall readers at the</text>
    <text x="382" y="376" text-anchor="middle" font-size="13.5" fill="#4a5568">sterile-zone perimeter.</text>

    <!-- step 3 -->
    <rect x="500" y="196" width="200" height="248" rx="14" fill="#f0f6f1" stroke="#a9c8b2" stroke-width="2"/>
    <circle cx="600" cy="176" r="26" fill="#2d6a4f"/>
    <text x="600" y="185" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">3</text>
    <text x="600" y="240" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Integrate</text>
    <line x1="530" y1="256" x2="670" y2="256" stroke="#a9c8b2" stroke-width="1.5"/>
    <text x="600" y="284" text-anchor="middle" font-size="13.5" fill="#3c5c46">Reads flow into the</text>
    <text x="600" y="304" text-anchor="middle" font-size="13.5" fill="#3c5c46">hospital ERP</text>
    <text x="600" y="324" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6f3a">(SAP or Lawson)</text>
    <text x="600" y="352" text-anchor="middle" font-size="13.5" fill="#3c5c46">and the laundry</text>
    <text x="600" y="372" text-anchor="middle" font-size="13.5" fill="#3c5c46">partner's WMS.</text>

    <!-- step 4 -->
    <rect x="718" y="196" width="200" height="248" rx="14" fill="#f0f6f1" stroke="#a9c8b2" stroke-width="2"/>
    <circle cx="818" cy="176" r="26" fill="#2d6a4f"/>
    <text x="818" y="185" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">4</text>
    <text x="818" y="240" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Define alerts</text>
    <line x1="748" y1="256" x2="888" y2="256" stroke="#a9c8b2" stroke-width="1.5"/>
    <text x="818" y="284" text-anchor="middle" font-size="13.5" fill="#3c5c46">Linen out of zone,</text>
    <text x="818" y="304" text-anchor="middle" font-size="13.5" fill="#3c5c46">over-cycle linen,</text>
    <text x="818" y="324" text-anchor="middle" font-size="13.5" fill="#3c5c46">mismatched rotation —</text>
    <text x="818" y="352" text-anchor="middle" font-size="13.5" fill="#3c5c46">each wired to a</text>
    <text x="818" y="372" text-anchor="middle" font-size="13.5" fill="#3c5c46">dashboard that's watched.</text>

    <!-- step 5 -->
    <rect x="936" y="196" width="200" height="248" rx="14" fill="#f6f0e6" stroke="#e2d3b4" stroke-width="2"/>
    <circle cx="1036" cy="176" r="26" fill="#8a6d33"/>
    <text x="1036" y="185" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">5</text>
    <text x="1036" y="240" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Train &amp; run parallel</text>
    <line x1="966" y1="256" x2="1106" y2="256" stroke="#e2d3b4" stroke-width="1.5"/>
    <text x="1036" y="288" text-anchor="middle" font-size="20" font-weight="800" fill="#8a6d33">4-8 hrs</text>
    <text x="1036" y="308" text-anchor="middle" font-size="13" fill="#6c5127">per role</text>
    <text x="1036" y="344" text-anchor="middle" font-size="13.5" fill="#6c5127">A 90-day side-by-side</text>
    <text x="1036" y="364" text-anchor="middle" font-size="13.5" fill="#6c5127">phase — trust the scale</text>
    <text x="1036" y="384" text-anchor="middle" font-size="13.5" fill="#6c5127">till the data earns it.</text>
  </g>

  <!-- timeline footer -->
  <rect x="64" y="474" width="1072" height="144" rx="16" fill="#fbf8f2" stroke="#e6dbc4" stroke-width="2"/>
  <text x="90" y="508" font-size="13" font-weight="800" letter-spacing="1.5" fill="#8a6d33">TYPICAL ROLLOUT WINDOW</text>
  <rect x="90" y="524" width="1020" height="18" rx="9" fill="#efe6d2"/>
  <rect x="90" y="524" width="1020" height="18" rx="9" fill="#c39a5f" opacity="0.35"/>
  <rect x="90" y="524" width="170" height="18" rx="9" fill="#2d6a4f"/>
  <text x="175" y="538" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">90-day parallel</text>
  <text x="96" y="566" font-size="13" fill="#6c5127">month 0</text>
  <text x="1104" y="566" text-anchor="end" font-size="13" fill="#6c5127">month 24</text>
  <text x="600" y="596" text-anchor="middle" font-size="16" font-weight="800" fill="#8a6d33">Full rollout: 12-24 months</text>
</svg>
