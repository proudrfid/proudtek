<text x="96" y="212" font-size="12.5" font-weight="700" fill="#3d6b6b">NXP</text>
<text x="452" y="185" font-size="14" fill="#333333">AES-128 · 3-pass mutual auth</text>
<text x="452" y="209" font-size="12.5" fill="#5c5c5c">Common Criteria EAL5+</text>
<text x="812" y="197" font-size="14" fill="#333333">Broadest 13.56 MHz upgrade path</text>

