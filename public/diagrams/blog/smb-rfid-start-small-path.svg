<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The budget path into RFID: four steps, no enterprise shopping spree</title>
<desc id="d">Four steps left to right: one, tag only the top 20 percent highest-value items; two, run a handheld-only setup — no fixed portals, no cabling; three, use a free or low-cost cloud software tier with no servers; four, order tags in 1,000-5,000 batches for bulk pricing without overcommitting. The outcome pill: let the results sign off the next purchase.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">START SMALL · SCALE ON PROOF</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">The opposite of buying like an enterprise</text>

<line x1="170" y1="170" x2="1030" y2="170" stroke="#e4c98f" stroke-width="2.5"/>

<g text-anchor="middle">
<circle cx="170" cy="170" r="26" fill="#c39a5f"/>
<text x="170" y="178" font-size="20" font-weight="800" fill="#ffffff">1</text>
<rect x="66" y="218" width="208" height="180" rx="12" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="170" y="250" font-size="15.5" font-weight="700" fill="#291c0e">Tag the top 20%</text>
<text x="170" y="278" font-size="12.5" fill="#4f4f4f">highest-value items first</text>
<text x="170" y="300" font-size="12.5" fill="#4f4f4f">not everything you own</text>
<text x="170" y="322" font-size="12.5" fill="#4f4f4f">on day one</text>
<text x="170" y="374" font-size="12" font-weight="700" fill="#6d5a3a">expand as it earns it</text>
</g>
<g text-anchor="middle">
<circle cx="457" cy="170" r="26" fill="#c39a5f"/>
<text x="457" y="178" font-size="20" font-weight="800" fill="#ffffff">2</text>
<rect x="353" y="218" width="208" height="180" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="457" y="250" font-size="15.5" font-weight="700" fill="#291c0e">Handheld only</text>
<text x="457" y="278" font-size="12.5" fill="#4f4f4f">one Bluetooth reader</text>
<text x="457" y="300" font-size="12.5" fill="#4f4f4f">+ a tablet — no portals,</text>
<text x="457" y="322" font-size="12.5" fill="#4f4f4f">no ceiling cabling</text>
<text x="457" y="374" font-size="12" font-weight="700" fill="#6d5a3a">infrastructure can wait</text>
</g>
<g text-anchor="middle">
<circle cx="744" cy="170" r="26" fill="#c39a5f"/>
<text x="744" y="178" font-size="20" font-weight="800" fill="#ffffff">3</text>
<rect x="640" y="218" width="208" height="180" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="744" y="250" font-size="15.5" font-weight="700" fill="#291c0e">Cloud, cheap tier</text>
<text x="744" y="278" font-size="12.5" fill="#4f4f4f">free or low-cost plan</text>
<text x="744" y="300" font-size="12.5" fill="#4f4f4f">no upfront licences,</text>
<text x="744" y="322" font-size="12.5" fill="#4f4f4f">no dedicated servers</text>
<text x="744" y="374" font-size="12" font-weight="700" fill="#6d5a3a">scales with usage</text>
</g>
<g text-anchor="middle">
<circle cx="1030" cy="170" r="26" fill="#2d6a4f"/>
<text x="1030" y="178" font-size="20" font-weight="800" fill="#ffffff">4</text>
<rect x="926" y="218" width="208" height="180" rx="12" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="1030" y="250" font-size="15.5" font-weight="700" fill="#1b4332">Buy tags in batches</text>
<text x="1030" y="278" font-size="12.5" fill="#4f4f4f">1,000–5,000 at a time:</text>
<text x="1030" y="300" font-size="12.5" fill="#4f4f4f">bulk pricing without</text>
<text x="1030" y="322" font-size="12.5" fill="#4f4f4f">overcommitting stock</text>
<text x="1030" y="374" font-size="12" font-weight="700" fill="#1b4332">low MOQs exist for SMBs</text>
</g>

<rect x="240" y="460" width="720" height="110" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="504" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="22" font-weight="700" fill="#291c0e">Let the results sign off the next purchase.</text>
<text x="600" y="538" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Fixed readers, ERP hooks and wall-to-wall tagging are all real — later, with the pilot's numbers behind them.</text>
<text x="600" y="622" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The most expensive RFID system is the enterprise one you bought before proving the small one.</text>
</svg>
