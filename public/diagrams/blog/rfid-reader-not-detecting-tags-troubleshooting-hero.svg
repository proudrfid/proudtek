<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five-step order for isolating an RFID no-read failure</title>
<desc id="d">A left-to-right sequence of five diagnostic stages, each a card with a number and a short prompt. Stage one, hardware: power, connectors, and the right port. Stage two, configuration: region, protocol, power, and session. Stage three, tags: band match and a reference tag. Stage four, RF physics: power, grounding, and polarization. Stage five, environment: metal, water, density, and orientation. Arrows connect the cards left to right. A footer explains that the reader is the last thing that is actually broken, so it is the first thing you rule out before working outward.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TROUBLESHOOT IN THIS ORDER</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="35" font-weight="700" fill="#291c0e">Start at the reader. Work outward.</text>
<text x="600" y="134" text-anchor="middle" font-size="15.5" fill="#4f4f4f">A no-read is a chain of ordinary faults — test the chain in sequence, not the expensive part first.</text>

<!-- arrows between cards (drawn first, sit behind) -->
<g stroke="#8a94a3" stroke-width="2.6" fill="#8a94a3">
<line x1="257" y1="322" x2="277" y2="322"/><polygon points="277,316 285,322 277,328"/>
<line x1="478" y1="322" x2="498" y2="322"/><polygon points="498,316 506,322 498,328"/>
<line x1="699" y1="322" x2="719" y2="322"/><polygon points="719,316 727,322 719,328"/>
<line x1="920" y1="322" x2="940" y2="322"/><polygon points="940,316 948,322 940,328"/>
</g>

<!-- Card 1: HARDWARE -->
<rect x="64" y="200" width="188" height="250" rx="14" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.6"/>
<circle cx="158" cy="232" r="18" fill="#3d6b6b"/><text x="158" y="239" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
<rect x="128" y="280" width="60" height="42" rx="6" fill="#eef1f5" stroke="#4a5568" stroke-width="1.6"/>
<circle cx="144" cy="322" r="3.4" fill="#4a5568"/><circle cx="172" cy="322" r="3.4" fill="#4a5568"/>
<text x="158" y="374" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">HARDWARE</text>
<text x="158" y="400" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Power, connectors,</text>
<text x="158" y="419" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the right port</text>

<!-- Card 2: CONFIG -->
<rect x="285" y="200" width="188" height="250" rx="14" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.6"/>
<circle cx="379" cy="232" r="18" fill="#3d6b6b"/><text x="379" y="239" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
<line x1="351" y1="294" x2="407" y2="294" stroke="#4a5568" stroke-width="3"/><circle cx="367" cy="294" r="6.5" fill="#3d6b6b"/>
<line x1="351" y1="314" x2="407" y2="314" stroke="#4a5568" stroke-width="3"/><circle cx="393" cy="314" r="6.5" fill="#3d6b6b"/>
<text x="379" y="374" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">CONFIG</text>
<text x="379" y="400" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Region, protocol,</text>
<text x="379" y="419" text-anchor="middle" font-size="12.5" fill="#5c5c5c">power, session</text>

<!-- Card 3: TAGS -->
<rect x="506" y="200" width="188" height="250" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<circle cx="600" cy="232" r="18" fill="#3d6b6b"/><text x="600" y="239" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
<rect x="570" y="282" width="60" height="40" rx="6" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/>
<rect x="578" y="290" width="24" height="24" rx="3" fill="none" stroke="#2c5454" stroke-width="1.6"/><circle cx="614" cy="302" r="4.5" fill="#2c5454"/>
<text x="600" y="374" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">TAGS</text>
<text x="600" y="400" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Band match,</text>
<text x="600" y="419" text-anchor="middle" font-size="12.5" fill="#5c5c5c">reference tag</text>

<!-- Card 4: RF PHYSICS -->
<rect x="727" y="200" width="188" height="250" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<circle cx="821" cy="232" r="18" fill="#3d6b6b"/><text x="821" y="239" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">4</text>
<circle cx="800" cy="302" r="4" fill="#2c5454"/>
<path d="M808 290 A 15 15 0 0 1 808 314" fill="none" stroke="#2c5454" stroke-width="2.4"/>
<path d="M816 282 A 26 26 0 0 1 816 322" fill="none" stroke="#2c5454" stroke-width="2.4"/>
<path d="M824 274 A 37 37 0 0 1 824 330" fill="none" stroke="#3d6b6b" stroke-width="2.2"/>
<text x="821" y="374" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">RF PHYSICS</text>
<text x="821" y="400" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Power, grounding,</text>
<text x="821" y="419" text-anchor="middle" font-size="12.5" fill="#5c5c5c">polarization</text>

<!-- Card 5: ENVIRONMENT -->
<rect x="948" y="200" width="188" height="250" rx="14" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.6"/>
<circle cx="1042" cy="232" r="18" fill="#3d6b6b"/><text x="1042" y="239" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">5</text>
<polygon points="1010,296 1042,278 1074,296" fill="#4a5568"/>
<rect x="1014" y="296" width="56" height="28" fill="#eef1f5" stroke="#4a5568" stroke-width="1.6"/>
<text x="1042" y="374" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">ENVIRONMENT</text>
<text x="1042" y="400" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Metal, water,</text>
<text x="1042" y="419" text-anchor="middle" font-size="12.5" fill="#5c5c5c">density, orientation</text>

<!-- footer strip -->
<rect x="64" y="498" width="1072" height="92" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="600" y="536" text-anchor="middle" font-size="16.5" font-weight="700" fill="#234a4a">The reader is usually the last thing that's actually broken.</text>
<text x="600" y="566" text-anchor="middle" font-size="15" fill="#4f4f4f">So it's the first thing you rule out — then keep moving outward until the reads come back.</text>
<text x="600" y="626" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Most "the readers are dead" calls quietly end at a reseated cable.</text>
</svg>
