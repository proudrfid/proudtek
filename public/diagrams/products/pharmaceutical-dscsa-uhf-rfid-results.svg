<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">First-full-year operational results under DSCSA enforcement</title>
  <desc id="d">Four measured results after the first full year under DSCSA enforcement, each against its requirement or prior baseline: a 99.96% verification rate against the FDA's 99% threshold; a 22-hour suspect-product investigation time against the 24-hour requirement; a 4-hour item-level lot recall span, down from 5 days; and 18 minutes per pallet to process saleable returns, down from 4 hours. A footer records 380 million item-level units tagged per year and zero DSCSA findings in the first annual FDA audit.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIRST FULL YEAR UNDER DSCSA ENFORCEMENT</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Every figure is the customer's own measured value against its requirement or prior baseline</text>

  <rect x="70" y="150" width="250" height="230" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="195" y="230" text-anchor="middle" font-size="40" font-weight="800" fill="#2c5454">99.96%</text>
  <text x="195" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Verification rate</text>
  <text x="195" y="316" text-anchor="middle" font-size="13" fill="#1f6f3a">FDA threshold: 99%</text>

  <rect x="340" y="150" width="250" height="230" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="465" y="230" text-anchor="middle" font-size="40" font-weight="800" fill="#2c5454">22 hrs</text>
  <text x="465" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Suspect investigation</text>
  <text x="465" y="316" text-anchor="middle" font-size="13" fill="#1f6f3a">Requirement: 24 h</text>

  <rect x="610" y="150" width="250" height="230" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="735" y="230" text-anchor="middle" font-size="40" font-weight="800" fill="#2c5454">4 hrs</text>
  <text x="735" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Lot recall span</text>
  <text x="735" y="316" text-anchor="middle" font-size="13" fill="#1f6f3a">Down from 5 days</text>

  <rect x="880" y="150" width="250" height="230" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="1005" y="230" text-anchor="middle" font-size="38" font-weight="800" fill="#2c5454">18 min</text>
  <text x="1005" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Returns per pallet</text>
  <text x="1005" y="316" text-anchor="middle" font-size="13" fill="#1f6f3a">Down from 4 hours</text>

  <rect x="70" y="418" width="1060" height="120" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="600" y="456" text-anchor="middle" font-size="26" font-weight="800" fill="#6d5a3a">380 M item-level units tagged per year</text>
  <text x="600" y="492" text-anchor="middle" font-size="14.5" fill="#3a2f1c">Zero DSCSA findings in the first annual FDA audit post-enforcement, with the verification rate cited as the</text>
  <text x="600" y="514" text-anchor="middle" font-size="14.5" fill="#3a2f1c">primary mitigation against the most common failure mode — slow verification on suspect product.</text>
</svg>
