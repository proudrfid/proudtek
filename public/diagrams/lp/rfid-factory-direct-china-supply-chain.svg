<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Manufacturer-direct versus trading company: where the reseller margin lives in an RFID supply chain</title>
  <desc id="d">Two paths compared. Path 1, through a trading company: the buyer pays a trading company that resells the order and owns no factory (marked with a red reseller-margin badge), which forwards the job to a factory the buyer never audits, so the buyer pays the factory price plus the desk's margin. Path 2, manufacturer-direct from Proud Tek: the buyer deals straight with Proud Tek — which owns the specification, chip sourcing and QC sign-off and has the antenna, print and encoding executed on contracted partner lines under one ISO 9001 system — and pays the manufacturer-direct price. A footer notes Proud Tek has supplied RFID from Shenzhen since 2008 and holds ISO 9001, 14001 and 45001 certified management systems (sales and service scope).</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MANUFACTURER-DIRECT VS TRADING COMPANY</text>
  <text x="600" y="99" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Where the middleman's margin lives</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">Same product. One path adds a reseller layer; the other does not.</text>

  <!-- PATH 1: through a trading company -->
  <text x="60" y="176" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PATH 1 · THROUGH A TRADING COMPANY</text>

  <rect x="60" y="196" width="190" height="112" rx="14" fill="#eef1f5" stroke="#4a5568" stroke-width="2"/>
  <text x="155" y="246" text-anchor="middle" font-size="18" font-weight="700" fill="#291c0e">YOU</text>
  <text x="155" y="272" text-anchor="middle" font-size="14" fill="#5c5c5c">the buyer</text>

  <line x1="252" y1="252" x2="290" y2="252" stroke="#6d5a3a" stroke-width="2.5"/>
  <polygon points="290,246 300,252 290,258" fill="#6d5a3a"/>

  <rect x="300" y="196" width="250" height="112" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="425" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">TRADING COMPANY</text>
  <text x="425" y="260" text-anchor="middle" font-size="13.5" fill="#5c5c5c">resells your order,</text>
  <text x="425" y="282" text-anchor="middle" font-size="13.5" fill="#5c5c5c">owns no factory</text>
  <rect x="330" y="316" width="190" height="27" rx="13" fill="#f7e6e6" stroke="#8b2d2d" stroke-width="1"/>
  <text x="425" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">+ reseller margin</text>

  <line x1="552" y1="252" x2="590" y2="252" stroke="#6d5a3a" stroke-width="2.5"/>
  <polygon points="590,246 600,252 590,258" fill="#6d5a3a"/>

  <rect x="600" y="196" width="175" height="112" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="687" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">A FACTORY</text>
  <text x="687" y="272" text-anchor="middle" font-size="13.5" fill="#5c5c5c">you never audit</text>

  <line x1="777" y1="252" x2="812" y2="252" stroke="#6d5a3a" stroke-width="2.5"/>
  <polygon points="812,246 822,252 812,258" fill="#6d5a3a"/>

  <rect x="822" y="196" width="318" height="112" rx="14" fill="#f7e6e6" stroke="#8b2d2d" stroke-width="2"/>
  <text x="981" y="232" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#8b2d2d">YOU PAY</text>
  <text x="981" y="258" text-anchor="middle" font-size="14" fill="#291c0e">factory price</text>
  <text x="981" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#8b2d2d">+ the desk's margin</text>

  <!-- PATH 2: factory-direct from Proud Tek -->
  <text x="60" y="388" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">PATH 2 · MANUFACTURER-DIRECT FROM PROUD TEK</text>

  <rect x="60" y="408" width="190" height="112" rx="14" fill="#eef1f5" stroke="#4a5568" stroke-width="2"/>
  <text x="155" y="458" text-anchor="middle" font-size="18" font-weight="700" fill="#291c0e">YOU</text>
  <text x="155" y="484" text-anchor="middle" font-size="14" fill="#5c5c5c">the buyer</text>

  <line x1="252" y1="464" x2="292" y2="464" stroke="#3d6b6b" stroke-width="2.5"/>
  <polygon points="292,458 300,464 292,470" fill="#3d6b6b"/>

  <rect x="300" y="408" width="475" height="112" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.5"/>
  <text x="537" y="446" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">PROUD TEK + PARTNER LINES</text>
  <text x="537" y="472" text-anchor="middle" font-size="13.5" fill="#2c5454">chip · antenna · print · encode · QC</text>
  <text x="537" y="494" text-anchor="middle" font-size="13.5" fill="#5c5c5c">one ISO 9001 management system</text>

  <line x1="777" y1="464" x2="814" y2="464" stroke="#3d6b6b" stroke-width="2.5"/>
  <polygon points="814,458 822,464 814,470" fill="#3d6b6b"/>

  <rect x="822" y="408" width="318" height="112" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="981" y="450" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">YOU PAY</text>
  <text x="981" y="478" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">the manufacturer-direct price</text>

  <!-- footer -->
  <line x1="60" y1="562" x2="1140" y2="562" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="600" y="600" text-anchor="middle" font-size="14" fill="#5c5c5c">Since 2008 · Shenzhen · ISO 9001 / 14001 / 45001 certified (sales &amp; service scope)</text>
</svg>
