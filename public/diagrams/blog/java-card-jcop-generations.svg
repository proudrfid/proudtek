<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">JCOP 4 vs JCOP 5 vs the Java Card 3.1 specification</title>
<desc id="d">Three columns. JCOP 4 — Java Card 3.0.5 and GlobalPlatform 2.3 on the SmartMX3 P71: RSA-4096 and ECC P-521 plus Brainpool, AES-256, 3DES and SHA-256/512, MIFARE Plus plus DESFire bundles; certified Common Criteria EAL6+ for EMV payment, USIM/SIM and government eID. JCOP 5 — Java Card 3.1 features and GlobalPlatform 2.3.1: extended APDUs up to 32 KiB, Curve25519 and Ed25519, post-quantum-ready key agreement and the SCP11 secure channel; targets FIDO2, eMRTD with ICAO 9303 biometrics, EUDI Wallet and mDL ISO/IEC 18013-5. Java Card 3.1 — the specification underneath: logical channels mandatory, per-applet security domains, the Sensitive Result anti-fault API, and a Classic 2.2.2 CAP file still loads without recompilation. Caption: order by OS-and-chip pair, never just a Java Card.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
