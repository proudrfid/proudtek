<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five forces that destroy warehouse barcode labels, ranked</title>
<desc id="d">Five ranked failure forces. One, temperature cycling — daily swings of 20 to 30 degrees Celsius break the adhesive bond so edges lift and peel. Two, dusty and oily surfaces — dust, grease and moisture block a strong initial bond. Three, physical handling — forklifts and stacking scratch and tear the printed code. Four, humidity and condensation — lifts edges and smears thermal ink. Five, UV exposure — warehouse light and dock sun fade the barcode below scanner contrast. None of these touch a chip.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY BARCODE LABELS FAIL · RANKED</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">A warehouse is hostile to anything printed and stuck to a surface.</text>

<text x="132" y="124" font-size="13" font-weight="800" letter-spacing="1" fill="#8b2d2d">FAILURE FORCE</text>
<text x="460" y="124" font-size="13" font-weight="800" letter-spacing="1" fill="#8b2d2d">WHAT IT DOES TO THE LABEL</text>

<!-- row 1 -->
<rect x="64" y="136" width="1072" height="74" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="136" width="9" height="74" rx="4" fill="#8b2d2d"/>
<circle cx="102" cy="173" r="15" fill="#8b2d2d"/>
<text x="102" y="179" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="134" y="178" font-size="16" font-weight="800" fill="#291c0e">Temperature cycling</text>
<text x="460" y="178" font-size="13.5" fill="#333333">20-30°C daily swings break the adhesive bond — edges lift, then peel</text>

<!-- row 2 -->
<rect x="64" y="218" width="1072" height="74" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="218" width="9" height="74" rx="4" fill="#8b2d2d"/>
<circle cx="102" cy="255" r="15" fill="#8b2d2d"/>
<text x="102" y="261" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="134" y="260" font-size="16" font-weight="800" fill="#291c0e">Dusty / oily surfaces</text>
<text x="460" y="260" font-size="13.5" fill="#333333">dust, grease and moisture block a strong initial bond</text>

<!-- row 3 -->
<rect x="64" y="300" width="1072" height="74" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="300" width="9" height="74" rx="4" fill="#8b2d2d"/>
<circle cx="102" cy="337" r="15" fill="#8b2d2d"/>
<text x="102" y="343" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="134" y="342" font-size="16" font-weight="800" fill="#291c0e">Physical handling</text>
<text x="460" y="342" font-size="13.5" fill="#333333">forklifts and stacking scratch and tear the printed code</text>

<!-- row 4 -->
<rect x="64" y="382" width="1072" height="74" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="382" width="9" height="74" rx="4" fill="#8b2d2d"/>
<circle cx="102" cy="419" r="15" fill="#8b2d2d"/>
<text x="102" y="425" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="134" y="424" font-size="16" font-weight="800" fill="#291c0e">Humidity / condensation</text>
<text x="460" y="424" font-size="13.5" fill="#333333">lifts label edges and smears thermal-printed ink</text>

<!-- row 5 -->
<rect x="64" y="464" width="1072" height="74" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="464" width="9" height="74" rx="4" fill="#8b2d2d"/>
<circle cx="102" cy="501" r="15" fill="#8b2d2d"/>
<text x="102" y="507" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
<text x="134" y="506" font-size="16" font-weight="800" fill="#291c0e">UV exposure</text>
<text x="460" y="506" font-size="13.5" fill="#333333">warehouse light and dock sun fade it below scanner contrast</text>

<text x="600" y="582" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">None of these touch a chip. That's the opening RFID walks through.</text>
</svg>
