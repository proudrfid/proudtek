<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Tap-to-verify and provenance flow for an NTAG 424 DNA olive-oil label</title>
  <desc id="d">A four-step flow: a phone taps the cap-and-neck seal at 13.56 MHz; the NTAG 424 DNA chip signs a fresh per-tap CMAC URL with an AES-128 key sealed in the silicon; the mill server checks the signature and the sealed-or-opened state; the result shows genuine with the seal intact, and a refilled bottle would read opened on the next tap. A strip below lists what the same tap surfaces: grove GPS polygon, harvest date, cultivar mix, mill ID, the IOC analytical certificate, and the PDO or PGI entry in EU eAmbrosia. A closing line explains the bridge antenna spans cap and neck so opening breaks the trace.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TAP-TO-VERIFY — NTAG 424 DNA SUN + PROVENANCE</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">One tap proves the seal is intact and surfaces where the oil was grown, pressed and tested</text>

  <!-- step 1 -->
  <rect x="70" y="168" width="235" height="200" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="168" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="187" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1 · TAP</text>
  <text x="187" y="246" text-anchor="middle" font-size="14" fill="#291c0e">Phone taps the cap</text>
  <text x="187" y="268" text-anchor="middle" font-size="14" fill="#291c0e">and neck at 13.56 MHz</text>
  <text x="187" y="302" text-anchor="middle" font-size="12.5" fill="#5c5c5c">No app — the phone OS</text>
  <text x="187" y="320" text-anchor="middle" font-size="12.5" fill="#5c5c5c">opens the returned URL</text>

  <!-- step 2 -->
  <rect x="345" y="168" width="235" height="200" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="345" y="168" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="462" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2 · SUN</text>
  <text x="462" y="246" text-anchor="middle" font-size="14" fill="#291c0e">Chip signs a fresh</text>
  <text x="462" y="268" text-anchor="middle" font-size="14" fill="#291c0e">per-tap CMAC URL</text>
  <text x="462" y="302" text-anchor="middle" font-size="12.5" fill="#5c5c5c">AES-128 key sealed</text>
  <text x="462" y="320" text-anchor="middle" font-size="12.5" fill="#5c5c5c">inside the silicon</text>

  <!-- step 3 -->
  <rect x="620" y="168" width="235" height="200" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="620" y="168" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="737" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3 · VERIFY</text>
  <text x="737" y="246" text-anchor="middle" font-size="14" fill="#291c0e">Mill server checks the</text>
  <text x="737" y="268" text-anchor="middle" font-size="14" fill="#291c0e">CMAC and seal state</text>
  <text x="737" y="302" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Counter rises each tap</text>
  <text x="737" y="320" text-anchor="middle" font-size="12.5" fill="#5c5c5c">— replay is caught</text>

  <!-- step 4 -->
  <rect x="895" y="168" width="235" height="200" rx="14" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <rect x="895" y="168" width="235" height="42" rx="14" fill="#1f6f3a"/>
  <text x="1012" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4 · RESULT</text>
  <text x="1012" y="250" text-anchor="middle" font-size="24" font-weight="800" fill="#1f6f3a">GENUINE</text>
  <text x="1012" y="282" text-anchor="middle" font-size="13.5" fill="#1f6f3a">Seal intact</text>
  <text x="1012" y="312" text-anchor="middle" font-size="12.5" fill="#8b2d2d">A refilled bottle reads</text>
  <text x="1012" y="330" text-anchor="middle" font-size="12.5" fill="#8b2d2d">OPENED on the next tap</text>

  <!-- arrows -->
  <polygon points="308,268 336,268 336,262 350,271 336,280 336,274 308,274" fill="#4a5568"/>
  <polygon points="583,268 611,268 611,262 625,271 611,280 611,274 583,274" fill="#4a5568"/>
  <polygon points="858,268 886,268 886,262 900,271 886,280 886,274 858,274" fill="#4a5568"/>

  <!-- provenance strip -->
  <rect x="70" y="410" width="1060" height="102" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="90" y="438" font-size="15" font-weight="700" fill="#2c5454">What the same tap surfaces</text>
  <text x="90" y="464" font-size="13.5" fill="#3d6b6b">Grove GPS polygon · harvest date · cultivar mix (70% Frantoio · 20% Leccino · 10% Moraiolo) · mill ID</text>
  <text x="90" y="490" font-size="13.5" fill="#3d6b6b">IOC certificate — free acidity ≤ 0.8% · peroxide value ≤ 20 meq O2/kg — and the PDO / PGI entry in EU eAmbrosia</text>

  <text x="600" y="560" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Bridge antenna spans cap and neck — opening breaks the trace, so a refilled bottle reads OPENED on the very next tap.</text>
</svg>
