<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Mobile credential landscape and the Aliro 1.0 standard</title>
<desc id="d">Map of the mobile access credential landscape. On the left, today's proprietary vendor clouds: HID Origo with Seos over BLE and NFC, Salto JustIN with BLE and SVN or KS data-on-card, Allegion Mobile paired via ENGAGE, and LEGIC Connect, all consumed through Apple Wallet and Google Wallet on secure-element NFC. An arrow leads right to Aliro 1.0, the Connectivity Standards Alliance unified standard published in February 2026 with Apple, Google, Samsung, HID, ASSA ABLOY, Allegion and dormakaba among the founders — one credential format for any certified reader, with first certified products expected in the second half of 2026. A note underneath records that plastic remains the primary credential, with mobile as an opt-in complement for roughly 10 to 25 percent of a typical workforce.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MOBILE CREDENTIALS</text>
<text x="600" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Four clouds, one standard on the horizon</text>
<text x="600" y="124" text-anchor="middle" font-size="15" fill="#4f4f4f">Vendor lock-in is the current price of phone-as-badge; Aliro is the negotiated exit.</text>

<!-- today panel -->
<rect x="90" y="150" width="560" height="392" rx="14" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="370" y="186" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#3a4353">TODAY — PROPRIETARY VENDOR CLOUDS</text>
<rect x="120" y="210" width="500" height="60" rx="10" fill="#eef0f3" stroke="#4a5568" stroke-width="1.5"/>
<text x="142" y="246" font-size="15" font-weight="700" fill="#291c0e">HID Origo</text>
<text x="598" y="246" text-anchor="end" font-size="13" fill="#4f4f4f">Seos over BLE / NFC</text>
<rect x="120" y="282" width="500" height="60" rx="10" fill="#eef0f3" stroke="#4a5568" stroke-width="1.5"/>
<text x="142" y="318" font-size="15" font-weight="700" fill="#291c0e">Salto JustIN</text>
<text x="598" y="318" text-anchor="end" font-size="13" fill="#4f4f4f">BLE · SVN / KS data-on-card</text>
<rect x="120" y="354" width="500" height="60" rx="10" fill="#eef0f3" stroke="#4a5568" stroke-width="1.5"/>
<text x="142" y="390" font-size="15" font-weight="700" fill="#291c0e">Allegion Mobile</text>
<text x="598" y="390" text-anchor="end" font-size="13" fill="#4f4f4f">ENGAGE-paired BLE locks</text>
<rect x="120" y="426" width="500" height="60" rx="10" fill="#eef0f3" stroke="#4a5568" stroke-width="1.5"/>
<text x="142" y="462" font-size="15" font-weight="700" fill="#291c0e">LEGIC Connect</text>
<text x="598" y="462" text-anchor="end" font-size="13" fill="#4f4f4f">BLE / NFC · European corporate</text>
<text x="370" y="518" text-anchor="middle" font-size="12.5" fill="#5c5c5c">consumed via Apple Wallet · Google Wallet on secure-element NFC</text>

<!-- arrow -->
<line x1="662" y1="346" x2="716" y2="346" stroke="#c39a5f" stroke-width="5"/>
<path d="M 716 334 l 20 12 l -20 12 z" fill="#c39a5f"/>

<!-- aliro panel -->
<rect x="748" y="150" width="362" height="392" rx="14" fill="#4a5568" stroke="#3a4353" stroke-width="2"/>
<text x="929" y="200" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">Aliro 1.0</text>
<text x="929" y="226" text-anchor="middle" font-size="13" fill="#c8cfda">CSA unified mobile-access standard</text>
<line x1="790" y1="248" x2="1068" y2="248" stroke="#5f6b7f" stroke-width="1.5"/>
<text x="929" y="284" text-anchor="middle" font-size="13.5" fill="#e6e9ee">Published February 2026</text>
<text x="929" y="316" text-anchor="middle" font-size="13.5" fill="#e6e9ee">Apple · Google · Samsung · HID</text>
<text x="929" y="342" text-anchor="middle" font-size="13.5" fill="#e6e9ee">ASSA ABLOY · Allegion · dormakaba</text>
<text x="929" y="374" text-anchor="middle" font-size="13.5" fill="#e6e9ee">First certified products H2 2026</text>
<text x="929" y="406" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">One format, any certified reader</text>
<rect x="824" y="440" width="210" height="36" rx="18" fill="#ffffff"/>
