<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Bulk RFID card volume price ladder: per-card cost falls as order quantity climbs through six tiers</title>
  <desc id="d">A descending step chart. Order quantity rises left to right across six bulk tiers — 1K, 5K, 10K, 50K, 100K and 500K-plus cards — while each bar gets shorter, showing per-card cost falling as the run deepens. A gold line traced across the bar tops marks the per-card cost curve. Two anchors are called out: a reference of about 0.35 US dollars per card below bulk at 500 pieces, and an indicative 0.12 to 0.18 US dollars per card at 50K. Tags note 1K as the bulk floor, 10K as the first major break, and 500K-plus annual or blanket orders as the best rate. A footer states there is no published price list — every tier is quoted per program on chip, artwork and order volume.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">VOLUME PRICE LADDER</text>
  <text x="600" y="99" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">More cards behind one set-up, less each card carries</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">Per-card cost falls at each quantity break. Exact figures are quoted per program.</text>

  <!-- bars: per-card cost shrinking as tier grows -->
  <rect x="96" y="238" width="132" height="277" rx="8" fill="#3d6b6b"/>
  <rect x="264" y="276" width="132" height="239" rx="8" fill="#3d6b6b"/>
  <rect x="432" y="312" width="132" height="203" rx="8" fill="#3d6b6b"/>
  <rect x="600" y="344" width="132" height="171" rx="8" fill="#2c5454"/>
  <rect x="768" y="372" width="132" height="143" rx="8" fill="#2c5454"/>
  <rect x="936" y="396" width="132" height="119" rx="8" fill="#234a4a"/>

  <!-- per-card cost curve traced across bar tops -->
  <polyline points="162,238 330,276 498,312 666,344 834,372 1002,396" fill="none" stroke="#c39a5f" stroke-width="2.5"/>
  <circle cx="162" cy="238" r="5" fill="#c39a5f"/>
  <circle cx="330" cy="276" r="5" fill="#c39a5f"/>
  <circle cx="498" cy="312" r="5" fill="#c39a5f"/>
  <circle cx="666" cy="344" r="5" fill="#c39a5f"/>
  <circle cx="834" cy="372" r="5" fill="#c39a5f"/>
  <circle cx="1002" cy="396" r="5" fill="#c39a5f"/>
  <text x="372" y="250" font-size="13" font-weight="700" fill="#6d5a3a">per-card cost falls</text>

  <!-- reference callout: below bulk -->
  <rect x="70" y="150" width="250" height="58" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="82" y="176" font-size="12.5" font-weight="700" fill="#2c5454">Reference — below bulk</text>
  <text x="82" y="199" font-size="14" fill="#291c0e">about $0.35 per card at 500 pcs</text>

  <!-- 50K anchor callout -->
  <rect x="560" y="250" width="216" height="56" rx="10" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="572" y="275" font-size="12.5" font-weight="700" fill="#6d5a3a">Volume anchor (indicative)</text>
  <text x="572" y="298" font-size="14" fill="#291c0e">$0.12-$0.18 per card at 50K</text>
  <line x1="667" y1="306" x2="666" y2="344" stroke="#c39a5f" stroke-width="2"/>

  <!-- tier labels -->
  <text x="162" y="544" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">1K</text>
  <text x="162" y="567" text-anchor="middle" font-size="12.5" fill="#5c5c5c">bulk floor</text>
  <text x="330" y="544" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">5K</text>
  <text x="498" y="544" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">10K</text>
  <text x="498" y="567" text-anchor="middle" font-size="12.5" fill="#5c5c5c">first major break</text>
  <text x="666" y="544" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">50K</text>
  <text x="834" y="544" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">100K</text>
  <text x="1002" y="544" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">500K+</text>
  <text x="1002" y="567" text-anchor="middle" font-size="12.5" fill="#5c5c5c">annual — best rate</text>

  <!-- quantity axis -->
  <line x1="96" y1="600" x2="1050" y2="600" stroke="#4a5568" stroke-width="3"/>
  <polygon points="1050,592 1068,600 1050,608" fill="#4a5568"/>
  <text x="96" y="624" font-size="12.5" fill="#5c5c5c">smaller order</text>
  <text x="1068" y="624" text-anchor="end" font-size="12.5" fill="#5c5c5c">1,000,000+ cards</text>
  <text x="600" y="647" text-anchor="middle" font-size="13" fill="#291c0e">No published price list — every tier is quoted per program on chip, artwork and order volume.</text>
</svg>
