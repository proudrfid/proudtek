<text x="454" y="224" font-size="12.5" fill="#5c5c5c">FDA 21 CFR 820 · EU MDR 2017/745</text>
<text x="454" y="244" font-size="12.5" fill="#5c5c5c">instrument · asset · specimen tags</text>
<rect x="454" y="272" width="110" height="28" rx="14" fill="#eef5f5" stroke="#cfe0e0"/>
<text x="509" y="291" text-anchor="middle" font-size="12.5" fill="#2c5454">annual audit</text>
