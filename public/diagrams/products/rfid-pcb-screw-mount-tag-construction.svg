<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">On-metal construction of a screw-mount PCB RFID tag</title>
  <desc id="d">A cross-section stack showing how a screw-mount PCB RFID tag reads on a metal chassis: the metal chassis or mounting boss at the base, a reinforced copper pad with a plated-through-hole that takes the M3 or M4 clamp load, an FR-4 or Rogers RO4350B dielectric with a ground plane at 1.6-2.4 mm, an etched copper UHF antenna with ENIG or HASL finish at 860-960 MHz, a reflowed Monza R6-P, M730, M750, M800 or UCODE 9 chip, and a solder-masked IP65 face built to IPC-A-610 Class 2 or 3. Below, four callouts: M3 or M4 ISO 4762 hex-socket cap screw, 1.3 or 3.0 newton-metre torque per ISO 2380, 2-6 metre on-metal read range at plus or minus 0.5 dB unit variance, and a minus 40 to plus 85 degrees C service window with an IP65 face.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW A SCREW-MOUNT PCB TAG READS ON A METAL CHASSIS</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">The fastener carries the load; the ground plane restores the read an adhesive tag would lose</text>

  <!-- chassis + screwed-down tag icon -->
  <rect x="95" y="336" width="220" height="80" rx="6" fill="#dfe4ea" stroke="#9aa4b2" stroke-width="2"/>
  <rect x="88" y="356" width="9" height="40" rx="3" fill="#9aa4b2"/>
  <rect x="313" y="356" width="9" height="40" rx="3" fill="#9aa4b2"/>
  <rect x="135" y="305" width="150" height="42" rx="4" fill="#e4c98f" stroke="#c39a5f" stroke-width="2"/>
  <circle cx="152" cy="326" r="8" fill="#4a5568"/>
  <line x1="147" y1="326" x2="157" y2="326" stroke="#dfe4ea" stroke-width="2"/>
  <circle cx="268" cy="326" r="8" fill="#4a5568"/>
  <line x1="263" y1="326" x2="273" y2="326" stroke="#dfe4ea" stroke-width="2"/>
  <text x="210" y="331" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">TAG</text>
  <path d="M292,318 a20,20 0 1 1 -12,-14" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
  <polygon points="278,300 286,306 275,312" fill="#3d6b6b"/>
  <text x="205" y="372" text-anchor="middle" font-size="12.5" fill="#4a5568">Torqued to the chassis with two screws</text>
  <text x="205" y="404" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">Retention is mechanical, not adhesive</text>
  <polygon points="330,331 418,331 418,325 436,337 418,349 418,343 330,343" fill="#9aa4b2"/>

  <!-- layer stack -->
  <text x="700" y="120" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">THE ON-METAL STACK (bottom → top)</text>
  <rect x="440" y="356" width="520" height="38" rx="6" fill="#dfe4ea" stroke="#9aa4b2" stroke-width="2"/>
  <text x="460" y="380" font-size="13.5" fill="#291c0e">Metal chassis / mounting boss — where a bare inlay goes silent</text>
  <rect x="440" y="312" width="520" height="38" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="460" y="336" font-size="13.5" fill="#291c0e">Reinforced copper pad + plated-through-hole — takes the M3 / M4 load</text>
  <rect x="440" y="268" width="520" height="38" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="460" y="292" font-size="13.5" fill="#2c5454">FR-4 / Rogers RO4350B dielectric + ground plane — 1.6-2.4 mm</text>
  <rect x="440" y="224" width="520" height="38" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="460" y="248" font-size="13.5" fill="#291c0e">Etched copper UHF antenna — ENIG / HASL, 860-960 MHz</text>
  <rect x="440" y="180" width="520" height="38" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="460" y="204" font-size="13.5" fill="#2c5454">Reflowed chip — Monza R6-P / M730 / M750 / M800 / UCODE 9</text>
  <rect x="440" y="136" width="520" height="34" rx="6" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <text x="460" y="158" font-size="12.5" fill="#5c5c5c">Solder-masked IP65 face — IPC-A-610 Class 2 / 3</text>

  <!-- fastener callouts -->
  <text x="600" y="452" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FASTENER-ANCHORED, NOT ADHESIVE</text>
  <rect x="70" y="470" width="250" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="90" y="497" font-size="15" font-weight="700" fill="#291c0e">M3 / M4 ISO 4762</text>
  <text x="90" y="517" font-size="12.5" fill="#5c5c5c">hex-socket cap screw</text>
  <rect x="340" y="470" width="250" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="360" y="497" font-size="15" font-weight="700" fill="#291c0e">1.3 / 3.0 N·m torque</text>
  <text x="360" y="517" font-size="12.5" fill="#5c5c5c">per ISO 2380 + thread-lock</text>
  <rect x="610" y="470" width="250" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="630" y="497" font-size="15" font-weight="700" fill="#291c0e">2-6 m on metal</text>
  <text x="630" y="517" font-size="12.5" fill="#5c5c5c">≤ ±0.5 dB unit variance</text>
  <rect x="880" y="470" width="250" height="60" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="900" y="497" font-size="15" font-weight="700" fill="#291c0e">-40 °C to +85 °C</text>
  <text x="900" y="517" font-size="12.5" fill="#5c5c5c">IP65 solder-masked face</text>

  <text x="600" y="576" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The fastener sets the mounting height and carries the vibration load — one EPC, permalocked to the CMDB / EAM record.</text>
</svg>
