<path d="M 600 315 C 612 315 616 306 630 306 M 600 315 C 612 315 616 324 630 324 M 600 315 C 588 315 584 306 570 306 M 600 315 C 588 315 584 324 570 324" fill="none" stroke="#c39a5f" stroke-width="2.2" stroke-linecap="round"/>
<text x="600" y="384" text-anchor="middle" font-size="14" font-weight="700" fill="#6d5a3a">one NFC tag</text>
