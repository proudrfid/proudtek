<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="art ard" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="art">The audit result and the payback math</title>
  <desc id="ard">Two panels. Left, case-level read rate: Walmart's pass threshold is 95 percent; the brand hit 98.6 percent at the pre-audit and 99.2 percent at the formal audit after placement tuning, both clearing the threshold. Right, the payback math: RFID added about 112 thousand dollars a year in tag cost of goods (7 cents across roughly 1.6 million units), set against about 280 thousand dollars a year in avoided non-compliance chargebacks, for a payback of about three months.</desc>
  <defs><radialGradient id="arbg" cx="50%" cy="20%" r="92%"><stop offset="0%" stop-color="#f8f0df"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#arbg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="24" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="1.4" fill="#6d5a3a">THE AUDIT RESULT — AND THE MATH BEHIND IT</text>
  <rect x="56" y="150" width="516" height="402" rx="16" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="2"/>
  <text x="314.0" y="192" font-size="18" font-weight="800" fill="#6d5a3a" text-anchor="middle" letter-spacing="1">CASE-LEVEL READ RATE</text>
  <rect x="96" y="375" width="440" height="125" fill="#8b2d2d" opacity="0.06"/>
  <line x1="96" y1="375" x2="536" y2="375" stroke="#8b2d2d" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="100" y="365" font-size="14.5" font-weight="700" fill="#8b2d2d">95% floor</text>
  <line x1="96" y1="500" x2="536" y2="500" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="196" y="285" width="92" height="215" rx="8" fill="#c39a5f"/>
  <text x="242" y="271.0000000000001" font-size="23" font-weight="800" fill="#291c0e" text-anchor="middle">98.6%</text>
  <text x="242" y="524" font-size="17" font-weight="600" fill="#4f4f4f" text-anchor="middle">Pre-audit</text>
  <rect x="356" y="270" width="92" height="230" rx="8" fill="#1f6f3a"/>
  <text x="402" y="255.99999999999994" font-size="23" font-weight="800" fill="#291c0e" text-anchor="middle">99.2%</text>
  <text x="402" y="524" font-size="17" font-weight="600" fill="#4f4f4f" text-anchor="middle">Formal audit</text>
  <path d="M 292 283 C 330 251, 340 236, 356 264" fill="none" stroke="#4a5568" stroke-width="2.4"/>
  <path d="M 356 264 l -10 -3 l 4 10 z" fill="#4a5568"/>
  <text x="324" y="241.0000000000001" font-size="14" font-weight="700" fill="#4a5568" text-anchor="middle" font-style="italic">placement tuning</text>
  <rect x="628" y="150" width="516" height="402" rx="16" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="2"/>
  <text x="886.0" y="192" font-size="18" font-weight="800" fill="#6d5a3a" text-anchor="middle" letter-spacing="1">THE PAYBACK MATH</text>
  <rect x="656" y="232" width="196" height="66" rx="33" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="754.0" y="273" text-anchor="middle" font-size="23" font-weight="800" fill="#291c0e">+ $112K / yr</text>
  <text x="878" y="258" font-size="19" font-weight="700" fill="#291c0e">RFID tag COGS</text>
  <text x="878" y="284" font-size="16.5" font-weight="400" fill="#4f4f4f">$0.07 × ~1.6M units</text>
  <rect x="656" y="320" width="196" height="66" rx="33" fill="#e7f1eb" stroke="#1f6f3a" stroke-width="1.5"/>
  <text x="754.0" y="361" text-anchor="middle" font-size="23" font-weight="800" fill="#1f6f3a">− $280K / yr</text>
  <text x="878" y="346" font-size="19" font-weight="700" fill="#291c0e">Avoided chargebacks</text>
  <text x="878" y="372" font-size="16.5" font-weight="400" fill="#4f4f4f">non-compliance fees, gone</text>
  <rect x="656" y="410" width="460" height="104" rx="16" fill="#291c0e"/>
  <text x="884.0" y="458" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">≈ 3-month payback</text>
  <text x="884.0" y="490" font-size="16" font-weight="400" fill="#e9dcc4" text-anchor="middle">recovered by avoided chargebacks alone</text>
  <text x="600" y="600" text-anchor="middle" font-size="17.5" font-weight="700" fill="#6d5a3a">Clear the bar first — then let the avoided chargebacks pay for the tags.</text>
</svg>
