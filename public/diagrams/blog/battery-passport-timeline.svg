  <line x1="120.0" y1="354" x2="120.0" y2="366" stroke="#cdbf9f" stroke-width="2"/>
  <text x="120.0" y="384.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9b8b66">2025</text>
