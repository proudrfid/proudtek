<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Marking techniques for wooden NFC cards</title>
<desc id="d">Five marking techniques ranked. Laser engraving is preferred: it burns a dark, permanent, ink-free mark and works on every wood species. UV flatbed printing lays full-colour CMYK straight onto wood, with a white underbase on dark woods. Silk-screen printing suits spot colours and logos on a smooth, fine grain like maple or beech. Hot foil stamping adds a gold, silver or copper metallic accent. Embossing and debossing should be avoided, because the pressure cracks a thin veneer and can damage the NFC antenna underneath.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MARKING TECHNIQUES ON WOOD</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Grain changes how ink and light behave — match the method to the surface.</text>

<!-- 1 laser (preferred) -->
<rect x="64" y="138" width="1072" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="64" y="138" width="8" height="74" rx="4" fill="#2d6a4f"/>
<text x="92" y="172" font-size="16.5" font-weight="800" fill="#291c0e">Laser engraving</text>
<text x="92" y="196" font-size="13.5" fill="#5c5c5c">Burns a dark, permanent, ink-free mark. Works on every wood species.</text>
<rect x="902" y="160" width="204" height="32" rx="16" fill="#e9f2ec" stroke="#94bfa5" stroke-width="1.5"/>
<circle cx="928" cy="176" r="9" fill="#2d6a4f"/><path d="M 923 176 l 3 4 l 6 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1015" y="181" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1b4332">PREFERRED</text>

<!-- 2 UV -->
<rect x="64" y="224" width="1072" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="64" y="224" width="8" height="74" rx="4" fill="#3d6b6b"/>
<text x="92" y="258" font-size="16.5" font-weight="800" fill="#291c0e">UV flatbed printing</text>
<text x="92" y="282" font-size="13.5" fill="#5c5c5c">Full-colour CMYK straight onto wood; white underbase on dark woods like walnut.</text>
<rect x="902" y="246" width="204" height="32" rx="16" fill="#eef5f5" stroke="#8fb6b6" stroke-width="1.5"/>
<text x="1004" y="267" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">full-colour CMYK</text>

<!-- 3 silk-screen -->
<rect x="64" y="310" width="1072" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="64" y="310" width="8" height="74" rx="4" fill="#3d6b6b"/>
<text x="92" y="344" font-size="16.5" font-weight="800" fill="#291c0e">Silk-screen printing</text>
<text x="92" y="368" font-size="13.5" fill="#5c5c5c">Great for spot colours and logos; needs a smooth, fine grain (maple, beech).</text>
<rect x="902" y="332" width="204" height="32" rx="16" fill="#eef5f5" stroke="#8fb6b6" stroke-width="1.5"/>
<text x="1004" y="353" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">spot colour</text>

<!-- 4 foil -->
<rect x="64" y="396" width="1072" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="64" y="396" width="8" height="74" rx="4" fill="#c39a5f"/>
<text x="92" y="430" font-size="16.5" font-weight="800" fill="#291c0e">Hot foil stamping</text>
<text x="92" y="454" font-size="13.5" fill="#5c5c5c">Gold, silver or copper metallic accent that pops against natural wood tones.</text>
<rect x="902" y="418" width="204" height="32" rx="16" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="1004" y="439" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8a6a2f">metallic accent</text>

<!-- 5 emboss (avoid) -->
<rect x="64" y="482" width="1072" height="74" rx="12" fill="#fbf3f3" stroke="#e6c9c9" stroke-width="2"/>
<rect x="64" y="482" width="8" height="74" rx="4" fill="#8b2d2d"/>
<text x="92" y="516" font-size="16.5" font-weight="800" fill="#291c0e">Emboss / deboss</text>
<text x="92" y="540" font-size="13.5" fill="#5c5c5c">Pressure cracks a thin veneer and can damage the NFC antenna underneath.</text>
<rect x="902" y="504" width="204" height="32" rx="16" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.5"/>
<circle cx="928" cy="520" r="9" fill="#8b2d2d"/><path d="M 924 516 l 8 8 M 932 516 l -8 8" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
<text x="1018" y="525" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8b2d2d">AVOID</text>

<text x="600" y="596" text-anchor="middle" font-size="14" fill="#4f4f4f">On thin veneer, laser engraving wins on contrast and permanence — embossing is the one to skip.</text>
</svg>
