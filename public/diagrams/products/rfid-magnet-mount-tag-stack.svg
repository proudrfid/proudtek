<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Magnet mount tag stack — housing, antenna, ferrite, magnet</title>
<desc id="d">Exploded layer stack of a magnet-mount tag with the four magnet family options and their pull-force or temperature headline figures.</desc>
<rect width="1200" height="675" fill="#f8f6f1"/>
<text x="60" y="64" font-family="Georgia, serif" font-size="34" fill="#291c0e">18 kg of grip, zero drilled holes</text>
<text x="60" y="98" font-family="Verdana, sans-serif" font-size="16" fill="#6d5a3a">The stack that lets a UHF antenna live directly on top of its own magnet</text>
<g font-family="Verdana, sans-serif" font-size="14">
<rect x="120" y="170" width="360" height="58" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<text x="300" y="205" font-size="14" fill="#291c0e" text-anchor="middle">UV-stabilised housing — ABS / PC-ABS / PA66-GF30</text>
<rect x="140" y="248" width="320" height="46" rx="8" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2"/>
<text x="300" y="277" font-size="14" fill="#2c5454" text-anchor="middle">on-metal PCB antenna + UHF IC</text>
<rect x="150" y="314" width="300" height="34" rx="6" fill="#3d6b6b"/>
<text x="300" y="336" font-size="13" fill="#f8f6f1" text-anchor="middle">Ni-Zn ferrite isolation 0.3-1.0 mm</text>
<rect x="140" y="368" width="320" height="56" rx="8" fill="#ffffff" stroke="#291c0e" stroke-width="2.5"/>
<text x="300" y="392" font-size="14" fill="#291c0e" text-anchor="middle">permanent-magnet base</text>
<text x="300" y="412" font-size="12.5" fill="#6d5a3a" text-anchor="middle">pull tested on 6 mm AISI 1018 steel, Ra 0.8</text>
<path d="M300 440 L300 470" stroke="#6d5a3a" stroke-width="2.5"/>
<path d="M300 470 l-6 -10 h12 z" fill="#6d5a3a"/>
<rect x="150" y="478" width="300 " height="40" rx="6" fill="#ffffff" stroke="#6d5a3a" stroke-width="2"/>
<text x="300" y="503" font-size="13.5" fill="#291c0e" text-anchor="middle">any ferromagnetic steel surface</text>
<text x="300" y="556" font-size="12.5" fill="#6d5a3a" text-anchor="middle">ferrite keeps the magnet from swallowing the signal —</text>
<text x="300" y="576" font-size="12.5" fill="#6d5a3a" text-anchor="middle">2-5 m on-metal read despite the base</text>
<rect x="580" y="160" width="540" height="86" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="604" y="192" font-size="16" fill="#291c0e" font-family="Georgia, serif">NdFeB — the workhorse</text>
<text x="604" y="216" font-size="12.5" fill="#6d5a3a">N42 low-profile 30 x 5 mm holds 3 kg · N52 50 x 10 mm holds 18 kg</text>
<text x="604" y="235" font-size="12.5" fill="#6d5a3a">Ni-Cu-Ni plated per ISO 2081, Parylene option for wash-down</text>
<rect x="580" y="262" width="540" height="86" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="604" y="294" font-size="16" fill="#291c0e" font-family="Georgia, serif">SmCo — the heat specialist</text>
<text x="604" y="318" font-size="12.5" fill="#6d5a3a">Sm2Co17 40 x 8 mm · 8 kg pull · 350 C continuous service</text>
<text x="604" y="337" font-size="12.5" fill="#6d5a3a">no coating needed — natively oxidation-resistant</text>
<rect x="580" y="364" width="540" height="86" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="604" y="396" font-size="16" fill="#291c0e" font-family="Georgia, serif">Ferrite Y30 — the economist</text>
<text x="604" y="420" font-size="12.5" fill="#6d5a3a">60 x 10 mm · 2-3 kg pull · ceramic surface needs no plating</text>
<text x="604" y="439" font-size="12.5" fill="#6d5a3a">corrosion-free outdoor duty at the lowest cost per point</text>
<rect x="580" y="466" width="540" height="86" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="604" y="498" font-size="16" fill="#291c0e" font-family="Georgia, serif">AlNiCo 5 — the steady hand</text>
<text x="604" y="522" font-size="12.5" fill="#6d5a3a">50 x 10 mm · 3-4 kg pull · tempco -0.02 percent per kelvin</text>
<text x="604" y="541" font-size="12.5" fill="#6d5a3a">MIL-STD-1376B pedigree for precision-measurement estates</text>
<text x="580" y="596" font-size="13.5" fill="#2c5454">Sixth SKU: NdFeB N40 countersunk sanitary — 316L cover, ASME BPE polish.</text>
</g>
</svg>
