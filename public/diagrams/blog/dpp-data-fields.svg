<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="dfTitle dfDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="dfTitle">The textile DPP minimum data set, field by field</title>
  <desc id="dfDesc">Five data blocks make up the textile Digital Product Passport. Identification and material: unique product identifier, GTIN or SGTIN-96, fibre percentage by weight, recycled content with GRS or RCS chain of custody, and REACH restricted-substance declarations. Manufacturing trace: spinning, weaving or knitting, dyeing and finishing, cut-make-trim, and packaging, by country and eventually facility. Repair, care and durability: care symbols, repair partners, expected service life, and spare-parts availability. Recycling and end-of-life: fibre-separation guidance, recycling route, hazardous-substance flags, and take-back instructions. Compliance and certificates: OEKO-TEX, GRS and GOTS with verifiable links to issuing-body databases. Footer note: build beyond the minimum, because the next delegated act expands the list.</desc>

  <defs>
    <radialGradient id="dfGlow" cx="50%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#f9eed6"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="dfSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#3a4656"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#dfGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="3" fill="#b0894c">WHAT RIDES ON THE PASSPORT</text>
  <text x="600" y="92" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">The textile DPP minimum data set</text>

  <!-- 5 columns -->
  <!-- col template: x, header color -->
  <!-- 1 Identification and material -->
  <g>
    <rect x="40" y="128" width="214" height="376" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
    <path d="M40 148 a20 20 0 0 1 20 -20 h174 a20 20 0 0 1 20 20 v40 h-214 z" fill="#2d6a4f"/>
    <text x="147" y="162" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">Identification</text>
    <text x="147" y="180" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">&amp; material</text>
    <g font-size="12.5" fill="#3a3025">
      <circle cx="62" cy="222" r="3.5" fill="#2d6a4f"/><text x="74" y="226">UPI · unique product ID</text>
      <circle cx="62" cy="256" r="3.5" fill="#2d6a4f"/><text x="74" y="260">GTIN / SGTIN-96</text>
      <circle cx="62" cy="290" r="3.5" fill="#2d6a4f"/><text x="74" y="294">fibre % by weight</text>
      <circle cx="62" cy="324" r="3.5" fill="#2d6a4f"/><text x="74" y="328">recycled content</text>
      <text x="74" y="345" font-size="11" fill="#7a6f60">GRS / RCS custody</text>
      <circle cx="62" cy="378" r="3.5" fill="#2d6a4f"/><text x="74" y="382">REACH restricted</text>
      <text x="74" y="399" font-size="11" fill="#7a6f60">substance list</text>
    </g>
    <rect x="56" y="440" width="182" height="46" rx="9" fill="#eef7f1"/>
    <text x="147" y="459" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f6f3a">BIGGEST DATA-QUALITY GAP</text>
    <text x="147" y="475" text-anchor="middle" font-size="10.5" fill="#4f5b52">PLM fibre % tolerance</text>
  </g>

  <!-- 2 Manufacturing trace -->
  <g>
    <rect x="271" y="128" width="214" height="376" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
    <path d="M271 148 a20 20 0 0 1 20 -20 h174 a20 20 0 0 1 20 20 v40 h-214 z" fill="#4a5568"/>
    <text x="378" y="162" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">Manufacturing</text>
    <text x="378" y="180" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">trace</text>
    <g font-size="12.5" fill="#3a3025">
      <circle cx="293" cy="222" r="3.5" fill="#4a5568"/><text x="305" y="226">spinning</text>
      <circle cx="293" cy="256" r="3.5" fill="#4a5568"/><text x="305" y="260">weaving / knitting</text>
      <circle cx="293" cy="290" r="3.5" fill="#4a5568"/><text x="305" y="294">dyeing / finishing</text>
      <circle cx="293" cy="324" r="3.5" fill="#4a5568"/><text x="305" y="328">cut-make-trim</text>
      <circle cx="293" cy="358" r="3.5" fill="#4a5568"/><text x="305" y="362">packaging</text>
    </g>
    <rect x="287" y="404" width="182" height="82" rx="9" fill="#eef1f5"/>
    <text x="378" y="424" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a4656">BY COUNTRY —</text>
    <text x="378" y="440" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a4656">&amp; EVENTUALLY FACILITY</text>
    <text x="378" y="463" text-anchor="middle" font-size="10.5" fill="#55606f">the same trace CSDDD</text>
    <text x="378" y="478" text-anchor="middle" font-size="10.5" fill="#55606f">will demand anyway</text>
  </g>

  <!-- 3 Repair, care and durability -->
  <g>
    <rect x="502" y="128" width="214" height="376" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
    <path d="M502 148 a20 20 0 0 1 20 -20 h174 a20 20 0 0 1 20 20 v40 h-214 z" fill="#c39a5f"/>
    <text x="609" y="162" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">Repair, care</text>
    <text x="609" y="180" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">&amp; durability</text>
    <g font-size="12.5" fill="#3a3025">
      <circle cx="524" cy="222" r="3.5" fill="#c39a5f"/><text x="536" y="226">care symbols</text>
      <circle cx="524" cy="256" r="3.5" fill="#c39a5f"/><text x="536" y="260">repair partners</text>
      <circle cx="524" cy="290" r="3.5" fill="#c39a5f"/><text x="536" y="294">expected service life</text>
      <circle cx="524" cy="324" r="3.5" fill="#c39a5f"/><text x="536" y="328">spare-parts availability</text>
    </g>
    <rect x="518" y="404" width="182" height="82" rx="9" fill="#faf3e6"/>
    <text x="609" y="424" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8a6a2f">ON THE ROADMAP</text>
    <text x="609" y="447" text-anchor="middle" font-size="10.5" fill="#6d5a3a">carbon-footprint</text>
    <text x="609" y="462" text-anchor="middle" font-size="10.5" fill="#6d5a3a">disclosure via PEF</text>
    <text x="609" y="477" text-anchor="middle" font-size="10.5" fill="#6d5a3a">methodology</text>
  </g>

  <!-- 4 Recycling and end-of-life -->
  <g>
    <rect x="733" y="128" width="214" height="376" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
    <path d="M733 148 a20 20 0 0 1 20 -20 h174 a20 20 0 0 1 20 20 v40 h-214 z" fill="#3d6b6b"/>
    <text x="840" y="162" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">Recycling &amp;</text>
    <text x="840" y="180" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">end-of-life</text>
    <g font-size="12.5" fill="#3a3025">
      <circle cx="755" cy="222" r="3.5" fill="#3d6b6b"/><text x="767" y="226">fibre-separation guide</text>
      <circle cx="755" cy="256" r="3.5" fill="#3d6b6b"/><text x="767" y="260">recycling route</text>
      <circle cx="755" cy="290" r="3.5" fill="#3d6b6b"/><text x="767" y="294">hazardous-substance</text>
      <text x="767" y="307" font-size="11" fill="#7a6f60">flags</text>
      <circle cx="755" cy="341" r="3.5" fill="#3d6b6b"/><text x="767" y="345">take-back instructions</text>
    </g>
    <rect x="749" y="404" width="182" height="82" rx="9" fill="#eaf3f3"/>
    <text x="840" y="424" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f5757">ALREADY HALF-BUILT IF</text>
    <text x="840" y="447" text-anchor="middle" font-size="10.5" fill="#3f5b5b">you're in France's</text>
    <text x="840" y="462" text-anchor="middle" font-size="10.5" fill="#3f5b5b">Refashion EPR scheme —</text>
    <text x="840" y="477" text-anchor="middle" font-size="10.5" fill="#3f5b5b">DPP just centralises it</text>
  </g>

  <!-- 5 Compliance and certs -->
  <g>
    <rect x="964" y="128" width="196" height="376" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
    <path d="M964 148 a20 20 0 0 1 20 -20 h156 a20 20 0 0 1 20 20 v40 h-196 z" fill="#6c5127"/>
    <text x="1062" y="162" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">Compliance</text>
    <text x="1062" y="180" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">&amp; certs</text>
    <g font-size="12.5" fill="#3a3025">
      <circle cx="986" cy="222" r="3.5" fill="#6c5127"/><text x="998" y="226">OEKO-TEX</text>
      <circle cx="986" cy="256" r="3.5" fill="#6c5127"/><text x="998" y="260">GRS</text>
      <circle cx="986" cy="290" r="3.5" fill="#6c5127"/><text x="998" y="294">GOTS</text>
      <circle cx="986" cy="324" r="3.5" fill="#6c5127"/><text x="998" y="328">verifiable links to</text>
      <text x="998" y="345" font-size="11" fill="#7a6f60">issuing-body databases</text>
    </g>
    <rect x="980" y="404" width="164" height="82" rx="9" fill="#f5efe4"/>
    <text x="1062" y="428" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6c5127">NOT JUST A LOGO —</text>
    <text x="1062" y="451" text-anchor="middle" font-size="10.5" fill="#6d5a3a">a live link the</text>
    <text x="1062" y="466" text-anchor="middle" font-size="10.5" fill="#6d5a3a">regulator can click</text>
    <text x="1062" y="481" text-anchor="middle" font-size="10.5" fill="#6d5a3a">and check</text>
  </g>

  <!-- footer -->
  <path d="M20 556 h1160 v77 a22 22 0 0 1 -22 22 h-1116 a22 22 0 0 1 -22 -22 z" fill="url(#dfSteel)"/>
  <text x="600" y="600" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Build the schema beyond the minimum.</text>
  <text x="600" y="625" text-anchor="middle" font-size="13" fill="#c9d2df">Building exactly to today's fields is the reliable way to be back here re-engineering when the next delegated act lands.</text>
</svg>
