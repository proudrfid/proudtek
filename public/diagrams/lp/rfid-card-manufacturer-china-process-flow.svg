<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Proud Tek RFID card production line: five in-house stages from inlay to encoded card</title>
  <desc id="d">Five stages left to right. Stage 1, inlay assembly: chip bonded to antenna at HF 13.56 MHz and UHF. Stage 2, collate and laminate: hot-roll lamination at around 150°C encapsulates the chip. Stage 3, die-cut: punched to the ISO/IEC 7810 ID-1 CR80 format, 0.76 mm thick. Stage 4, print and finish: offset, digital and laser engraving apply the artwork. Stage 5, encode and test: UID and NDEF data written on the line, then every card given a 100% functional read test. A base arrow shows raw inlay becoming a finished encoded card; nothing ships until it read-tests.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW AN RFID CARD IS MADE</text>
  <text x="600" y="98" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Five in-house production stages</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">Inlay to encoded card — every stage on Proud Tek's own Shenzhen lines.</text>

  <!-- step 1 -->
  <rect x="48" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="143" cy="216" r="18" fill="#4a5568"/>
  <text x="143" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
  <text x="143" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Inlay</text>
  <text x="143" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">assembly</text>
  <text x="143" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">chip bonded</text>
  <text x="143" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">to antenna</text>
  <rect x="63" y="404" width="160" height="34" rx="8" fill="#eef1f5"/>
  <text x="143" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">HF 13.56 MHz &amp; UHF</text>

  <!-- step 2 -->
  <rect x="274" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="369" cy="216" r="18" fill="#4a5568"/>
  <text x="369" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
  <text x="369" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Collate &amp;</text>
  <text x="369" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">laminate</text>
  <text x="369" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">hot-roll press,</text>
  <text x="369" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">chip encapsulated</text>
  <rect x="289" y="404" width="160" height="34" rx="8" fill="#eef1f5"/>
  <text x="369" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">around 150°C</text>

  <!-- step 3 (highlight: card gets its CR80 identity) -->
  <rect x="500" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
  <circle cx="595" cy="216" r="18" fill="#c39a5f"/>
  <text x="595" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
  <text x="595" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Die-cut</text>
  <text x="595" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">to CR80</text>
  <text x="595" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">ISO/IEC 7810</text>
  <text x="595" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">ID-1 format</text>
  <rect x="515" y="404" width="160" height="34" rx="8" fill="#f7edd6"/>
  <text x="595" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">0.76 mm thick</text>

  <!-- step 4 -->
  <rect x="726" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="821" cy="216" r="18" fill="#3d6b6b"/>
  <text x="821" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
  <text x="821" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Print &amp;</text>
  <text x="821" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">finish</text>
  <text x="821" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">offset, digital,</text>
  <text x="821" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">laser engraving</text>
  <rect x="741" y="404" width="160" height="34" rx="8" fill="#eef5f5"/>
  <text x="821" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">artwork applied</text>

  <!-- step 5 -->
  <rect x="952" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="1047" cy="216" r="18" fill="#2c5454"/>
  <text x="1047" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
  <text x="1047" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Encode &amp;</text>
  <text x="1047" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">test</text>
  <text x="1047" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">UID / NDEF</text>
  <text x="1047" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">written on the line</text>
  <rect x="967" y="404" width="160" height="34" rx="8" fill="#eef5f5"/>
  <text x="1047" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">100% read test</text>

  <!-- chevrons between steps -->
  <polygon points="250,315 262,325 250,335" fill="#c39a5f"/>
  <polygon points="476,315 488,325 476,335" fill="#c39a5f"/>
  <polygon points="702,315 714,325 702,335" fill="#c39a5f"/>
  <polygon points="928,315 940,325 928,335" fill="#c39a5f"/>

  <!-- progression base arrow -->
  <text x="100" y="548" font-size="13" font-weight="700" fill="#5c5c5c">Raw inlay</text>
  <text x="1090" y="548" text-anchor="end" font-size="13" font-weight="700" fill="#5c5c5c">Finished, encoded card</text>
  <line x1="100" y1="572" x2="1072" y2="572" stroke="#4a5568" stroke-width="3"/>
  <polygon points="1072,564 1090,572 1072,580" fill="#4a5568"/>
  <text x="600" y="614" text-anchor="middle" font-size="15" fill="#291c0e">Every card is read-tested before it is packed and shipped.</text>
</svg>
