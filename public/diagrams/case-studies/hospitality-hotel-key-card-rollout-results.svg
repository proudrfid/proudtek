<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Hotel key-card rollout outcomes after 12 months at steady state</title>
  <desc id="d">Measured reductions after the rollout. Front-desk encoding time per card fell 85%, from 12.0 seconds to 1.8 seconds. 'Card does not work' complaints at the lock fell 68%. Lost-card replacement spend fell 41%. Net card-lifecycle cost fell 23%. A footer records that the card unit cost rose 9%, from $0.31 to $0.34, offset roughly 6 times by the lifecycle saving; 2.4 million cards shipped across 28 properties in year one, and the arrival-friction index improved 17%.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE NUMBERS THAT CLOSED THE BUSINESS CASE</text>
  <text x="600" y="82" text-anchor="middle" font-size="15" fill="#5c5c5c">Bar length is the measured reduction after 12 months at steady state</text>

  <line x1="330" y1="132" x2="330" y2="488" stroke="#e6dfd2" stroke-width="2"/>

  <text x="60" y="176" font-size="14.5" font-weight="700" fill="#291c0e">Front-desk encode time</text>
  <text x="60" y="196" font-size="12.5" fill="#5c5c5c">12.0 s → 1.8 s per card</text>
  <rect x="330" y="150" width="612" height="56" rx="6" fill="#2c5454"/>
  <text x="926" y="185" text-anchor="end" font-size="16" font-weight="700" fill="#ffffff">-85%</text>

  <text x="60" y="266" font-size="14.5" font-weight="700" fill="#291c0e">'Card fails' complaints</text>
  <text x="60" y="286" font-size="12.5" fill="#5c5c5c">at the door lock</text>
  <rect x="330" y="240" width="490" height="56" rx="6" fill="#3d6b6b"/>
  <text x="804" y="275" text-anchor="end" font-size="16" font-weight="700" fill="#ffffff">-68%</text>

  <text x="60" y="356" font-size="14.5" font-weight="700" fill="#291c0e">Lost-card spend</text>
  <text x="60" y="376" font-size="12.5" fill="#5c5c5c">no more mag-stripe demag</text>
  <rect x="330" y="330" width="295" height="56" rx="6" fill="#4a5568"/>
  <text x="609" y="365" text-anchor="end" font-size="16" font-weight="700" fill="#ffffff">-41%</text>

  <text x="60" y="446" font-size="14.5" font-weight="700" fill="#291c0e">Card-lifecycle cost</text>
  <text x="60" y="466" font-size="12.5" fill="#5c5c5c">net, after the +9% card cost</text>
  <rect x="330" y="420" width="166" height="56" rx="6" fill="#6d5a3a"/>
  <text x="480" y="455" text-anchor="end" font-size="16" font-weight="700" fill="#ffffff">-23%</text>

  <rect x="60" y="516" width="1080" height="100" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="84" y="548" font-size="15" font-weight="700" fill="#2c5454">Card unit cost rose 9% (from $0.31 to $0.34) and was offset roughly 6× by the lifecycle saving.</text>
  <text x="84" y="574" font-size="13.5" fill="#3d6b6b">2.4 M cards shipped across 28 properties in year one; the arrival-friction index improved 17%.</text>
  <text x="84" y="598" font-size="13.5" fill="#3d6b6b">Every figure is the customer's own measured or shipped value — nothing here is modelled.</text>
</svg>
