<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Wristband material decision flow: three questions map the wear profile to a material, closure and chip</title>
<desc id="d">Three sequential questions choose the material. If there is water or pool exposure or a reusable cycle between guests, choose silicone with a snap-lock closure and MIFARE Classic 1K, for resorts, waterparks, cruises and gyms. If not, and the program is multi-day with a brand-forward keepsake band, choose woven polyester with a plastic slider and MIFARE Classic 1K or NTAG213, for multi-day festivals and corporate events. If not, and it is single-day and cost-sensitive or short lead time, choose fabric or Tyvek with an adhesive closure and NTAG213 or MIFARE Classic 1K, for single-day concerts and day events.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DECISION · MAP THE WEAR PROFILE TO THE MATERIAL</text>
<text x="600" y="80" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Water and reuse decide first; brand and cost break the tie.</text>

<!-- Q1 -->
<rect x="72" y="118" width="452" height="120" rx="12" fill="#faf7f0" stroke="#eadfce" stroke-width="1.6"/>
<text x="96" y="152" font-size="13" font-weight="800" fill="#6d5a3a">1</text>
<text x="118" y="152" font-size="15" font-weight="700" fill="#291c0e">Water / pool exposure, or a</text>
<text x="118" y="176" font-size="15" font-weight="700" fill="#291c0e">reusable cycle between guests?</text>
<text x="118" y="210" font-size="12.5" fill="#5c5c5c">the durability + waterproofing question</text>
<!-- Q2 -->
<rect x="72" y="278" width="452" height="120" rx="12" fill="#faf7f0" stroke="#eadfce" stroke-width="1.6"/>
<text x="96" y="312" font-size="13" font-weight="800" fill="#6d5a3a">2</text>
<text x="118" y="312" font-size="15" font-weight="700" fill="#291c0e">Multi-day wear with a brand-</text>
<text x="118" y="336" font-size="15" font-weight="700" fill="#291c0e">forward, keepsake band?</text>
<text x="118" y="370" font-size="12.5" fill="#5c5c5c">the premium-presentation question</text>
<!-- Q3 -->
<rect x="72" y="438" width="452" height="120" rx="12" fill="#faf7f0" stroke="#eadfce" stroke-width="1.6"/>
<text x="96" y="472" font-size="13" font-weight="800" fill="#6d5a3a">3</text>
<text x="118" y="472" font-size="15" font-weight="700" fill="#291c0e">Single-day, cost-sensitive or</text>
<text x="118" y="496" font-size="15" font-weight="700" fill="#291c0e">short lead time?</text>
<text x="118" y="530" font-size="12.5" fill="#5c5c5c">the disposable-economy question</text>

<!-- NO arrows -->
<line x1="298" y1="238" x2="298" y2="276" stroke="#b0b0b0" stroke-width="2"/><polygon points="298,278 291,266 305,266" fill="#b0b0b0"/>
<text x="312" y="264" font-size="12" fill="#8a8a8a">no</text>
<line x1="298" y1="398" x2="298" y2="436" stroke="#b0b0b0" stroke-width="2"/><polygon points="298,438 291,426 305,426" fill="#b0b0b0"/>
<text x="312" y="424" font-size="12" fill="#8a8a8a">no</text>

<!-- YES arrows -->
<line x1="524" y1="178" x2="634" y2="178" stroke="#1f6f3a" stroke-width="2.6"/><polygon points="634,178 620,171 620,185" fill="#1f6f3a"/><text x="556" y="168" font-size="12" font-weight="800" fill="#1f6f3a">YES</text>
<line x1="524" y1="338" x2="634" y2="338" stroke="#1f6f3a" stroke-width="2.6"/><polygon points="634,338 620,331 620,345" fill="#1f6f3a"/><text x="556" y="328" font-size="12" font-weight="800" fill="#1f6f3a">YES</text>
<line x1="524" y1="498" x2="634" y2="498" stroke="#1f6f3a" stroke-width="2.6"/><polygon points="634,498 620,491 620,505" fill="#1f6f3a"/><text x="556" y="488" font-size="12" font-weight="800" fill="#1f6f3a">YES</text>

<!-- material cards -->
<rect x="640" y="118" width="496" height="120" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="664" y="152" font-size="18" font-weight="800" fill="#2c5454">Silicone</text>
<text x="664" y="180" font-size="13.5" fill="#333333">snap-lock · MIFARE Classic 1K</text>
<text x="664" y="212" font-size="12.5" fill="#5c5c5c">resorts, waterparks, cruises, gyms</text>

<rect x="640" y="278" width="496" height="120" rx="12" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.8"/>
<text x="664" y="312" font-size="18" font-weight="800" fill="#8a6d34">Woven polyester</text>
<text x="664" y="340" font-size="13.5" fill="#333333">plastic slider · MIFARE Classic 1K / NTAG213</text>
<text x="664" y="372" font-size="12.5" fill="#5c5c5c">multi-day festivals, corporate events</text>

<rect x="640" y="438" width="496" height="120" rx="12" fill="#eef1f4" stroke="#4a5568" stroke-width="1.8"/>
<text x="664" y="472" font-size="18" font-weight="800" fill="#3a4456">Fabric / Tyvek</text>
<text x="664" y="500" font-size="13.5" fill="#333333">adhesive · NTAG213 / MIFARE Classic 1K</text>
<text x="664" y="532" font-size="12.5" fill="#5c5c5c">single-day concerts, day events</text>

<text x="600" y="600" text-anchor="middle" font-size="14" fill="#291c0e">Define the issue model first — then the material choice becomes obvious.</text>
</svg>
