<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="slTitle slDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="slTitle">Shenzhen to USA logistics — express air and sea freight lanes with DDP handled mid-route</title>
  <desc id="slDesc">Two shipping lanes run from the Shenzhen factory on the left to a US delivery address on the right. The express air lane via DHL, FedEx, and UPS takes 5 to 7 business days in transit. The sea freight lane to US West Coast ports takes 18 to 22 days and suits orders of 50,000 or more units. Between them sits the DDP checkpoint handled by Proud Tek: US import duty, Section 301 tariff, and customs brokerage are settled before delivery. A bottom strip of four stat chips summarizes: production 5 to 7 business days after artwork approval, express air 5 to 7 business days, 10 to 14 days door-to-door for most US orders, and 18 to 22 days by sea to the West Coast.</desc>
  <defs>
    <radialGradient id="slBg" cx="50%" cy="18%" r="92%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="slArrowSteel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="slArrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d6b6b"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#slBg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="58" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="1.1" fill="#6d5a3a">SHENZHEN TO USA — TWO LANES, ONE LANDED PRICE</text>
  <text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">DDP: US import duty, Section 301 tariff, and customs brokerage settled before your door</text>

  <!-- factory node -->
  <rect x="64" y="150" width="272" height="164" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="200" y="192" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Shenzhen factory</text>
  <text x="200" y="222" text-anchor="middle" font-size="14" fill="#4f4f4f">Production 5–7 business days</text>
  <text x="200" y="246" text-anchor="middle" font-size="14" fill="#4f4f4f">100% electrical testing</text>
  <text x="200" y="270" text-anchor="middle" font-size="12.5" fill="#6d5a3a">compliance pack packed with goods</text>

  <!-- US door node -->
  <rect x="864" y="150" width="272" height="164" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="1000" y="192" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Your US door</text>
  <text x="1000" y="222" text-anchor="middle" font-size="14" fill="#4f4f4f">All 50 states</text>
  <text x="1000" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#4a5568">10–14 days door-to-door</text>
  <text x="1000" y="270" text-anchor="middle" font-size="12.5" fill="#6d5a3a">one invoice, no customs homework</text>

  <!-- air lane -->
  <line x1="336" y1="200" x2="856" y2="200" stroke="#4a5568" stroke-width="5" marker-end="url(#slArrowSteel)"/>
  <text x="600" y="178" text-anchor="middle" font-size="15" font-weight="800" fill="#4a5568">Express air — DHL · FedEx · UPS</text>
  <text x="600" y="226" text-anchor="middle" font-size="13.5" fill="#4f4f4f">5–7 business days transit</text>

  <!-- sea lane -->
  <line x1="336" y1="282" x2="856" y2="282" stroke="#3d6b6b" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#slArrowTeal)"/>
  <text x="600" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">Sea freight — US West Coast ports</text>
  <text x="600" y="308" text-anchor="middle" font-size="13.5" fill="#4f4f4f">18–22 days · for 50,000+ unit orders</text>

  <!-- DDP checkpoint strip -->
  <line x1="600" y1="316" x2="600" y2="376" stroke="#c39a5f" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="240" y="376" width="720" height="92" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="600" y="412" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">DDP CHECKPOINT — HANDLED BY PROUD TEK</text>
  <text x="600" y="442" text-anchor="middle" font-size="15" fill="#291c0e">US import duty · Section 301 tariff · customs brokerage</text>

  <!-- stat chips -->
  <rect x="64" y="505" width="256" height="118" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="192" y="551" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="26" font-weight="700" fill="#4a5568">5–7 days</text>
  <text x="192" y="580" text-anchor="middle" font-size="12.5" fill="#5c5c5c">production after</text>
  <text x="192" y="600" text-anchor="middle" font-size="12.5" fill="#5c5c5c">artwork approval</text>

  <rect x="336" y="505" width="256" height="118" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="464" y="551" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="26" font-weight="700" fill="#4a5568">5–7 days</text>
  <text x="464" y="580" text-anchor="middle" font-size="12.5" fill="#5c5c5c">express air transit</text>
  <text x="464" y="600" text-anchor="middle" font-size="12.5" fill="#5c5c5c">DHL · FedEx · UPS</text>

  <rect x="608" y="505" width="256" height="118" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="736" y="551" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="26" font-weight="700" fill="#4a5568">10–14 days</text>
  <text x="736" y="580" text-anchor="middle" font-size="12.5" fill="#5c5c5c">door-to-door</text>
  <text x="736" y="600" text-anchor="middle" font-size="12.5" fill="#5c5c5c">for most US orders</text>

  <rect x="880" y="505" width="256" height="118" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="1008" y="551" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="26" font-weight="700" fill="#2c5454">18–22 days</text>
  <text x="1008" y="580" text-anchor="middle" font-size="12.5" fill="#5c5c5c">sea to West Coast</text>
  <text x="1008" y="600" text-anchor="middle" font-size="12.5" fill="#5c5c5c">for 50,000+ units</text>
</svg>
