<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Six pilot phases before committing to a wristband program at scale</title>
<desc id="d">Six phases to validate a wristband program. One, sample mix: order 50 to 100 units of each candidate on the target chip with the exact closure and branding. Two, pilot users: run a 2 to 5 day field pilot with 20 to 50 real users and track reads, closure failures, comfort and wear. Three, environmental test: silicone against pool and spa, fabric against rain and sweat, woven against textile wear at three-plus days. Four, sizing calibration: order the full 5 to 6 SKU size matrix, since size-mix is the number-one silicone pilot failure. Five, closure QC: audit 10 percent post-application for closure integrity and build staff training from it. Six, chip-reader integration: confirm the chip reads on the actual deployed readers — locks, turnstiles and POS.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PILOT · SIX PHASES BEFORE THE VOLUME ORDER</text>
<text x="600" y="80" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Validate material + closure + chip with real users before scaling.</text>

<!-- row 1 -->
<rect x="64" y="116" width="344" height="200" rx="13" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<circle cx="98" cy="150" r="17" fill="#3d6b6b"/><text x="98" y="156" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
<text x="126" y="156" font-size="15.5" font-weight="800" fill="#291c0e">Sample mix</text>
<text x="88" y="196" font-size="13" fill="#333333">50–100 units of each candidate</text>
<text x="88" y="218" font-size="13" fill="#333333">material on the target chip.</text>
<text x="88" y="250" font-size="12.5" fill="#5c5c5c">Exact closure + branding as it</text>
<text x="88" y="270" font-size="12.5" fill="#5c5c5c">will ship at scale.</text>

<rect x="428" y="116" width="344" height="200" rx="13" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<circle cx="462" cy="150" r="17" fill="#3d6b6b"/><text x="462" y="156" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<text x="490" y="156" font-size="15.5" font-weight="800" fill="#291c0e">Pilot users</text>
<text x="452" y="196" font-size="13" fill="#333333">2–5 day field pilot with</text>
<text x="452" y="218" font-size="13" fill="#333333">20–50 real attendees.</text>
<text x="452" y="250" font-size="12.5" fill="#5c5c5c">Track reads, closure fails,</text>
<text x="452" y="270" font-size="12.5" fill="#5c5c5c">comfort, visual wear.</text>

<rect x="792" y="116" width="344" height="200" rx="13" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<circle cx="826" cy="150" r="17" fill="#3d6b6b"/><text x="826" y="156" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<text x="854" y="156" font-size="15.5" font-weight="800" fill="#291c0e">Environmental test</text>
<text x="816" y="196" font-size="13" fill="#333333">Silicone: pool / spa.</text>
<text x="816" y="218" font-size="13" fill="#333333">Fabric: rain / sweat.</text>
<text x="816" y="250" font-size="12.5" fill="#5c5c5c">Woven: textile wear across</text>
<text x="816" y="270" font-size="12.5" fill="#5c5c5c">3+ days.</text>

<!-- row 2 -->
<rect x="64" y="360" width="344" height="200" rx="13" fill="#faf7f0" stroke="#eadfce" stroke-width="1.5"/>
<circle cx="98" cy="394" r="17" fill="#c39a5f"/><text x="98" y="400" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4</text>
<text x="126" y="400" font-size="15.5" font-weight="800" fill="#291c0e">Sizing calibration</text>
<text x="88" y="440" font-size="13" fill="#333333">Order the full 5–6 SKU size</text>
<text x="88" y="462" font-size="13" fill="#333333">matrix, even at higher cost.</text>
<text x="88" y="494" font-size="12.5" fill="#8b2d2d">Size-mix is the #1 silicone</text>
<text x="88" y="514" font-size="12.5" fill="#8b2d2d">pilot failure mode.</text>

<rect x="428" y="360" width="344" height="200" rx="13" fill="#faf7f0" stroke="#eadfce" stroke-width="1.5"/>
<circle cx="462" cy="394" r="17" fill="#c39a5f"/><text x="462" y="400" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">5</text>
<text x="490" y="400" font-size="15.5" font-weight="800" fill="#291c0e">Closure QC</text>
<text x="452" y="440" font-size="13" fill="#333333">Audit 10% post-application</text>
<text x="452" y="462" font-size="13" fill="#333333">for closure integrity.</text>
<text x="452" y="494" font-size="12.5" fill="#5c5c5c">Build staff-training material</text>
<text x="452" y="514" font-size="12.5" fill="#5c5c5c">from the observations.</text>

<rect x="792" y="360" width="344" height="200" rx="13" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<circle cx="826" cy="394" r="17" fill="#1f6f3a"/><text x="826" y="400" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">6</text>
<text x="854" y="400" font-size="15.5" font-weight="800" fill="#291c0e">Chip–reader test</text>
<text x="816" y="440" font-size="13" fill="#333333">Confirm reads on the actual</text>
<text x="816" y="462" font-size="13" fill="#333333">deployed reader hardware.</text>
<text x="816" y="494" font-size="12.5" fill="#5c5c5c">Lock readers, gate turnstiles,</text>
<text x="816" y="514" font-size="12.5" fill="#5c5c5c">POS payment readers.</text>

<!-- flow arrows -->
<polygon points="428,216 408,208 408,224" fill="#9dc0c0"/>
<polygon points="792,216 772,208 772,224" fill="#9dc0c0"/>
<polygon points="428,460 408,452 408,468" fill="#d9c39a"/>
<polygon points="792,460 772,452 772,468" fill="#d9c39a"/>
<text x="600" y="600" text-anchor="middle" font-size="14" fill="#291c0e">A wristband that reads on a bench reader can still miss a specific gate antenna — test the real hardware.</text>
</svg>
