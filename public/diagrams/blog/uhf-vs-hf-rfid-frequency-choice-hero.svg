<text x="886" y="166" text-anchor="middle" font-size="20" font-weight="800" fill="#2c5454">HF/NFC · 13.56 MHz</text>
<text x="886" y="190" text-anchor="middle" font-size="13.5" fill="#4f4f4f">the trusted-interaction radio</text>
