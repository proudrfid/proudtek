<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">NFC vs Bluetooth Classic vs BLE comparison matrix</title>
  <desc id="d">A comparison matrix across three short-range wireless technologies. NFC: 0-5 cm range, 13.56 MHz, 106-424 kbps, passive with no battery, tap with no pairing, proximity plus chip cryptography, $0.05-$1.20 per tag. Bluetooth Classic: 1-10 m, 2.4 GHz, 1-3 Mbps, battery or mains powered, discovery and pairing, cryptographic protection required, $15-$200+ per device. BLE: 10-100 m, 2.4 GHz, 125 kbps to 2 Mbps, coin cell for 1-5 years, discovery and pairing, cryptographic protection required, $5-$30 per beacon.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NFC vs BLUETOOTH CLASSIC vs BLE</text>
  <text x="600" y="82" text-anchor="middle" font-size="15" fill="#5c5c5c">Different ends of the proximity spectrum — tap-and-done versus sustained streaming</text>

  <rect x="348" y="104" width="264" height="40" rx="6" fill="#3d6b6b"/>
  <text x="480" y="130" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">NFC</text>
  <rect x="616" y="104" width="264" height="40" rx="6" fill="#4a5568"/>
  <text x="748" y="130" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">BLUETOOTH CLASSIC</text>
  <rect x="884" y="104" width="256" height="40" rx="6" fill="#8a6d3b"/>
  <text x="1012" y="130" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">BLE</text>

  <rect x="60" y="150" width="1080" height="50" rx="6" fill="#f7f4ec"/>
  <text x="72" y="180" font-size="14" font-weight="700" fill="#291c0e">Range</text>
  <text x="360" y="180" font-size="14" font-weight="700" fill="#1f6f3a">0–5 cm</text>
  <text x="628" y="180" font-size="14" fill="#291c0e">1–10 m</text>
  <text x="896" y="180" font-size="14" fill="#291c0e">10–100 m</text>

  <rect x="60" y="204" width="1080" height="50" rx="6" fill="#ffffff"/>
  <text x="72" y="234" font-size="14" font-weight="700" fill="#291c0e">Frequency</text>
  <text x="360" y="234" font-size="14" fill="#291c0e">13.56 MHz</text>
  <text x="628" y="234" font-size="14" fill="#291c0e">2.4 GHz</text>
  <text x="896" y="234" font-size="14" fill="#291c0e">2.4 GHz</text>

  <rect x="60" y="258" width="1080" height="50" rx="6" fill="#f7f4ec"/>
  <text x="72" y="288" font-size="14" font-weight="700" fill="#291c0e">Data rate</text>
  <text x="360" y="288" font-size="14" fill="#291c0e">106–424 kbps</text>
  <text x="628" y="288" font-size="14" fill="#291c0e">1–3 Mbps</text>
  <text x="896" y="288" font-size="14" fill="#291c0e">125 kbps–2 Mbps</text>

  <rect x="60" y="312" width="1080" height="50" rx="6" fill="#ffffff"/>
  <text x="72" y="342" font-size="14" font-weight="700" fill="#291c0e">Power</text>
  <text x="360" y="342" font-size="14" font-weight="700" fill="#1f6f3a">Passive · no battery</text>
  <text x="628" y="342" font-size="14" fill="#291c0e">Battery / mains</text>
  <text x="896" y="342" font-size="14" fill="#291c0e">Coin cell · 1–5 yr</text>

  <rect x="60" y="366" width="1080" height="50" rx="6" fill="#f7f4ec"/>
  <text x="72" y="396" font-size="14" font-weight="700" fill="#291c0e">Connect</text>
  <text x="360" y="396" font-size="14" font-weight="700" fill="#1f6f3a">Tap · no pairing</text>
  <text x="628" y="396" font-size="14" fill="#291c0e">Discovery + pair</text>
  <text x="896" y="396" font-size="14" fill="#291c0e">Discovery + pair</text>

  <rect x="60" y="420" width="1080" height="50" rx="6" fill="#ffffff"/>
  <text x="72" y="450" font-size="14" font-weight="700" fill="#291c0e">Security</text>
  <text x="360" y="450" font-size="14" fill="#291c0e">Proximity + chip crypto</text>
  <text x="628" y="450" font-size="14" fill="#291c0e">Cryptographic required</text>
  <text x="896" y="450" font-size="14" fill="#291c0e">Cryptographic required</text>

  <rect x="60" y="474" width="1080" height="50" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="72" y="504" font-size="14" font-weight="800" fill="#6d5a3a">Tag / device cost</text>
  <text x="360" y="504" font-size="14" fill="#3a2f1c">$0.05–$1.20</text>
  <text x="628" y="504" font-size="14" fill="#3a2f1c">$15–$200+</text>
  <text x="896" y="504" font-size="14" fill="#3a2f1c">$5–$30</text>

  <text x="600" y="562" text-anchor="middle" font-size="13.5" fill="#5c5c5c">NFC at 13.56 MHz is effectively uncontested; 2.4 GHz is shared with Wi-Fi and Zigbee and needs channel planning.</text>
</svg>
