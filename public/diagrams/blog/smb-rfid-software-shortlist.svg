<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">SMB RFID software shortlist — five platforms that fit under $50K budgets</title>
<desc id="d">Five rows: SimpleRFID cloud SaaS at $59-200 per user per month for retail and small distribution; RFIDLinked hardware-plus-software kits from $59-79 per user per month for sub-$15K starter programs; Asset Panda at $1,500-8,000 a year for IT asset and tool tracking; GreyTrunk RFID at $1,200-5,000 a year for non-profits, schools and municipal tracking; TagMatiks at $5K-25K a year when ERP connectors are needed. Enterprise suites starting at $50K-200K a year are marked as the aisle to avoid.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SOFTWARE THAT FITS THE BUDGET</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Five SMB-grade platforms, one enterprise aisle to skip</text>

<g>
<rect x="60" y="130" width="1080" height="76" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="88" y="162" font-size="16" font-weight="800" fill="#2c5454">SimpleRFID</text>
<text x="88" y="186" font-size="12.5" fill="#4f4f4f">retail &amp; small distribution · Shopify, Lightspeed, Square, QuickBooks</text>
<text x="856" y="162" font-size="15" font-weight="800" fill="#291c0e">$59–200 /user/mo</text>
<text x="856" y="186" font-size="12" fill="#4f4f4f">1–10 stores · 1–3 locations</text>
</g>
<g>
<rect x="60" y="218" width="1080" height="76" rx="12" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="88" y="250" font-size="16" font-weight="800" fill="#6d5a3a">RFIDLinked Inventory Kit</text>
<text x="88" y="274" font-size="12.5" fill="#4f4f4f">hardware + software bundle with entry handheld · retail, dental supply, hospitality</text>
<text x="856" y="250" font-size="15" font-weight="800" fill="#291c0e">$59–79 /user/mo</text>
<text x="856" y="274" font-size="12" fill="#4f4f4f">sub-$15K all-in starters</text>
</g>
<g>
<rect x="60" y="306" width="1080" height="76" rx="12" fill="#eef1f5" stroke="#4a5568" stroke-width="1.5"/>
<text x="88" y="338" font-size="16" font-weight="800" fill="#4a5568">Asset Panda</text>
<text x="88" y="362" font-size="12.5" fill="#4f4f4f">IT assets, tools, fixed-asset audit · Slack, ServiceNow, Active Directory</text>
<text x="856" y="338" font-size="15" font-weight="800" fill="#291c0e">$1,500–8,000 /yr</text>
<text x="856" y="362" font-size="12" fill="#4f4f4f">manufacturers · field service</text>
</g>
<g>
<rect x="60" y="394" width="1080" height="76" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="88" y="426" font-size="16" font-weight="800" fill="#2c5454">GreyTrunk RFID</text>
<text x="88" y="450" font-size="12.5" fill="#4f4f4f">web + mobile asset tracking, bundled reader options</text>
<text x="856" y="426" font-size="15" font-weight="800" fill="#291c0e">$1,200–5,000 /yr</text>
<text x="856" y="450" font-size="12" fill="#4f4f4f">non-profits · schools · municipal</text>
</g>
<g>
<rect x="60" y="482" width="1080" height="76" rx="12" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="88" y="514" font-size="16" font-weight="800" fill="#6d5a3a">TagMatiks (RFID4U)</text>
<text x="88" y="538" font-size="12.5" fill="#4f4f4f">receiving / shipping / cycle-count workflows · SAP, Dynamics, NetSuite connectors</text>
<text x="856" y="514" font-size="15" font-weight="800" fill="#291c0e">$5K–25K /yr</text>
<text x="856" y="538" font-size="12" fill="#4f4f4f">outgrown entry tier, need ERP</text>
</g>

<rect x="60" y="574" width="1080" height="44" rx="10" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="88" y="601" font-size="13.5" font-weight="700" fill="#8b2d2d">The aisle to skip: enterprise suites (Manhattan, SAP RFID, Oracle WMS) start at $50K–200K/yr and presume an IT team.</text>
<text x="600" y="646" text-anchor="middle" font-size="13" fill="#5c5c5c">If the software costs more than the problem, you have wandered into the enterprise aisle by mistake — walk back.</text>
</svg>
