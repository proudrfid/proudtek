<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five sectors driving circular-economy RFID adoption in 2026</title>
<desc id="d">A leaderboard of five sectors. Apparel, driven by H&amp;M, Patagonia and Decathlon, faces ESPR mandatory for the largest brands by 2027. Battery and electronics fall under EU Battery Regulation 2023/1542 with a passport for batteries over 2 kWh. Reusable transport packaging cuts container loss from 5 to 15 percent down to 1 to 3 percent with RFID. Construction materials see RFID pushed by the EU Construction Products Regulation revision from 2025. Textile rental and uniforms reach over 200 wash cycles per garment, cutting replacement from 15 to 20 percent a year to under 5 percent.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHO'S SCALING CIRCULAR RFID</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="31" font-weight="700" fill="#291c0e">Five sectors driving the volume</text>
<text x="600" y="126" text-anchor="middle" font-size="15" fill="#4f4f4f">It scales fastest where take-back flows are dense and product value is high.</text>

<!-- row 1 apparel -->
<rect x="64" y="150" width="1072" height="72" rx="12" fill="#eef5f0" stroke="#a9cbb8" stroke-width="1.5"/>
<circle cx="100" cy="186" r="16" fill="#2d6a4f"/><text x="100" y="191" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="136" y="182" font-size="16" font-weight="800" fill="#291c0e">Apparel</text>
<text x="136" y="203" font-size="12.5" fill="#5c5c5c">H&amp;M, Patagonia, Decathlon — NFC in garments</text>
<text x="1112" y="178" text-anchor="end" font-size="22" font-weight="800" fill="#1b4332">2027</text>
<text x="1112" y="200" text-anchor="end" font-size="12.5" fill="#5c5c5c">ESPR mandatory for largest brands</text>

<!-- row 2 battery -->
<rect x="64" y="234" width="1072" height="72" rx="12" fill="#eef5f0" stroke="#a9cbb8" stroke-width="1.5"/>
<circle cx="100" cy="270" r="16" fill="#2d6a4f"/><text x="100" y="275" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="136" y="266" font-size="16" font-weight="800" fill="#291c0e">Battery &amp; electronics</text>
<text x="136" y="287" font-size="12.5" fill="#5c5c5c">EU Battery Regulation 2023/1542 · electronics 2027</text>
<text x="1112" y="262" text-anchor="end" font-size="22" font-weight="800" fill="#1b4332">&gt;2 kWh</text>
<text x="1112" y="284" text-anchor="end" font-size="12.5" fill="#5c5c5c">battery passport threshold</text>

<!-- row 3 reusable packaging -->
<rect x="64" y="318" width="1072" height="72" rx="12" fill="#eef5f0" stroke="#a9cbb8" stroke-width="1.5"/>
<circle cx="100" cy="354" r="16" fill="#2d6a4f"/><text x="100" y="359" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="136" y="350" font-size="16" font-weight="800" fill="#291c0e">Reusable transport packaging</text>
<text x="136" y="371" font-size="12.5" fill="#5c5c5c">pooled pallets, totes, kegs — UHF cycle counts</text>
<text x="1112" y="346" text-anchor="end" font-size="22" font-weight="800" fill="#1f6f3a">1-3%</text>
<text x="1112" y="368" text-anchor="end" font-size="12.5" fill="#5c5c5c">container loss with RFID (vs 5-15%)</text>

<!-- row 4 construction -->
<rect x="64" y="402" width="1072" height="72" rx="12" fill="#eef5f0" stroke="#a9cbb8" stroke-width="1.5"/>
<circle cx="100" cy="438" r="16" fill="#2d6a4f"/><text x="100" y="443" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="136" y="434" font-size="16" font-weight="800" fill="#291c0e">Construction materials</text>
<text x="136" y="455" font-size="12.5" fill="#5c5c5c">structural steel, concrete, panels — EoL routing</text>
<text x="1112" y="430" text-anchor="end" font-size="22" font-weight="800" fill="#1b4332">2025</text>
<text x="1112" y="452" text-anchor="end" font-size="12.5" fill="#5c5c5c">EU CPR revision pushes RFID</text>

<!-- row 5 textile rental -->
<rect x="64" y="486" width="1072" height="72" rx="12" fill="#eef5f0" stroke="#a9cbb8" stroke-width="1.5"/>
<circle cx="100" cy="522" r="16" fill="#2d6a4f"/><text x="100" y="527" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
<text x="136" y="518" font-size="16" font-weight="800" fill="#291c0e">Textile rental &amp; uniforms</text>
<text x="136" y="539" font-size="12.5" fill="#5c5c5c">workwear tracked per item; replacement 15-20%/yr → &lt;5%</text>
<text x="1112" y="514" text-anchor="end" font-size="22" font-weight="800" fill="#1f6f3a">200+</text>
<text x="1112" y="536" text-anchor="end" font-size="12.5" fill="#5c5c5c">wash cycles per garment</text>

<text x="600" y="596" text-anchor="middle" font-size="14" fill="#4f4f4f">High-value goods with dense return flows pay back RFID circularity first.</text>
</svg>
