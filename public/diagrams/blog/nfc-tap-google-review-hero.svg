<text x="600" y="99" text-anchor="middle" font-size="38" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">One tap, one review</text>
<text x="600" y="131" text-anchor="middle" font-size="16" fill="#4f4f4f">The customer taps your NFC tag and lands on your Google review form — no app, no hunting.</text>
