<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Three ROI patterns from real resort wristband deployments, plus the operator caveat</title>
<desc id="d">Three ROI patterns repeat across real resort wristband deployments. Spend lift: per-guest ancillary spend rises 15 to 30 percent versus the cash and card baseline at pool bars. Digital revenue: 200 percent plus growth in year one at a Los Cabos resort, and 3 times sales at a theme-park hotel group. Fewer lost keys: lost-key incidents fall 60 to 80 percent, and the residual 20 to 40 percent is mostly snap-failure on silicone clasps. The operator caveat: two real frictions are guests who refuse the band and PMS sync errors at peak check-in, so keep a 5 to 10 percent branded-card buffer and a clear opt-out at check-in.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT DEPLOYMENTS ACTUALLY REPORT · THREE ROI PATTERNS</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Three patterns repeat across real resort wristband deployments.</text>

<rect x="64" y="140" width="344" height="330" rx="16" fill="#eef7f0" stroke="#2d6a4f" stroke-width="1.5"/>
<rect x="64" y="140" width="344" height="8" rx="4" fill="#2d6a4f"/>
<text x="236" y="180" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">SPEND LIFT</text>
<text x="236" y="272" text-anchor="middle" font-size="58" font-weight="800" fill="#1f6f3a">+15–30%</text>
<text x="236" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">per-guest ancillary spend</text>
<text x="236" y="352" text-anchor="middle" font-size="13.5" fill="#5c5c5c">tap-to-pay vs the cash and</text>
<text x="236" y="374" text-anchor="middle" font-size="13.5" fill="#5c5c5c">card baseline at pool bars.</text>

<rect x="428" y="140" width="344" height="330" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<rect x="428" y="140" width="344" height="8" rx="4" fill="#3d6b6b"/>
<text x="600" y="180" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#2c5454">DIGITAL REVENUE</text>
<text x="600" y="272" text-anchor="middle" font-size="58" font-weight="800" fill="#2c5454">200%+</text>
<text x="600" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">digital revenue, year one</text>
<text x="600" y="352" text-anchor="middle" font-size="13.5" fill="#5c5c5c">at a Los Cabos resort; 3× sales</text>
<text x="600" y="374" text-anchor="middle" font-size="13.5" fill="#5c5c5c">at a theme-park hotel group.</text>

<rect x="792" y="140" width="344" height="330" rx="16" fill="#f4f6f9" stroke="#4a5568" stroke-width="1.5"/>
<rect x="792" y="140" width="344" height="8" rx="4" fill="#4a5568"/>
<text x="964" y="180" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#3b4557">FEWER LOST KEYS</text>
<text x="964" y="272" text-anchor="middle" font-size="58" font-weight="800" fill="#3b4557">−60–80%</text>
<text x="964" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">lost-key incidents</text>
<text x="964" y="352" text-anchor="middle" font-size="13.5" fill="#5c5c5c">the residual 20–40% is mostly</text>
<text x="964" y="374" text-anchor="middle" font-size="13.5" fill="#5c5c5c">snap-failure on silicone clasps.</text>

<rect x="64" y="500" width="1072" height="100" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.8"/>
<text x="96" y="534" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">OPERATOR CAVEAT</text>
<text x="96" y="560" font-size="14" fill="#291c0e">Two real frictions: guests who refuse the band, and PMS sync errors at peak check-in.</text>
<text x="96" y="584" font-size="13.5" fill="#5c5c5c">Keep a 5–10% branded-card buffer and a clear opt-out at check-in.</text>

<text x="600" y="634" text-anchor="middle" font-size="14" fill="#4f4f4f">The pattern under all three: frictionless purchase turns impulse into actual sales.</text>
</svg>
