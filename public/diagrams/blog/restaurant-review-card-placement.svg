<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five restaurant review-card placements ranked by the tap rate each tends to earn</title>
<desc id="d">A restaurant floor map on the left marks five placements: the server apron and the check presenter around the dining tables, the host stand and the take-out bag near the entrance, and the counter or point of sale on the right. A ranked legend on the right orders them by tap rate: server apron leash-clip (high), check presenter or billfold (high), host-stand easel (mid), counter or POS display (mid), and take-out bag insert (low, but scaling with order volume). A note adds that in-hand placement converts about ten times better than the counter, and advises testing two to three placements per location before standardizing on the winner.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE THE TAPS ACTUALLY HAPPEN</text>
<text x="600" y="92" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Rank placements by the tap rate they earn</text>

<!-- floor map -->
<rect x="64" y="128" width="560" height="392" rx="16" fill="#f6f2e9" stroke="#e0d8c8" stroke-width="2"/>
<text x="344" y="152" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#b3a488">DINING ROOM</text>
<!-- tables -->
<circle cx="292" cy="250" r="24" fill="#ffffff" stroke="#d8cfbd" stroke-width="1.6"/>
<circle cx="396" cy="250" r="24" fill="#ffffff" stroke="#d8cfbd" stroke-width="1.6"/>
<circle cx="292" cy="336" r="24" fill="#ffffff" stroke="#d8cfbd" stroke-width="1.6"/>
<circle cx="396" cy="336" r="24" fill="#ffffff" stroke="#d8cfbd" stroke-width="1.6"/>
<!-- pin 1 server apron -->
<circle cx="344" cy="192" r="16" fill="#2c5454"/><text x="344" y="197" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="368" y="197" font-size="13" font-weight="700" fill="#234a4a">server apron</text>
<!-- pin 2 check presenter -->
<circle cx="344" cy="394" r="16" fill="#2c5454"/><text x="344" y="399" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="368" y="399" font-size="13" font-weight="700" fill="#234a4a">check presenter</text>
<!-- take-out -->
<rect x="90" y="416" width="150" height="46" rx="8" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.4"/>
<circle cx="112" cy="439" r="15" fill="#8794a6"/><text x="112" y="444" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">5</text>
<text x="134" y="443" font-size="13" font-weight="700" fill="#4a5568">Take-out bag</text>
<!-- host stand -->
<rect x="90" y="470" width="150" height="42" rx="8" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<circle cx="112" cy="491" r="15" fill="#c39a5f"/><text x="112" y="496" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">3</text>
<text x="134" y="495" font-size="13" font-weight="700" fill="#6d5a3a">Host stand</text>
<!-- counter / POS -->
<rect x="452" y="440" width="150" height="72" rx="8" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<circle cx="474" cy="466" r="15" fill="#c39a5f"/><text x="474" y="471" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">4</text>
<text x="496" y="470" font-size="13" font-weight="700" fill="#6d5a3a">Counter / POS</text>
<text x="527" y="495" text-anchor="middle" font-size="12" fill="#8a7a52">order pickup</text>

<!-- legend -->
<text x="672" y="168" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RANKED BY TAP RATE</text>
<circle cx="686" cy="210" r="15" fill="#2c5454"/><text x="686" y="215" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">1</text>
<text x="712" y="206" font-size="15.5" font-weight="700" fill="#291c0e">Server apron leash-clip</text>
<text x="712" y="226" font-size="12.5" fill="#5c5c5c">tableside hand-off after dessert or check drop</text>
<rect x="1032" y="194" width="88" height="26" rx="13" fill="#2c5454"/><text x="1076" y="211" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">HIGH</text>

<circle cx="686" cy="262" r="15" fill="#2c5454"/><text x="686" y="267" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">2</text>
<text x="712" y="258" font-size="15.5" font-weight="700" fill="#291c0e">Check presenter / billfold</text>
<text x="712" y="278" font-size="12.5" fill="#5c5c5c">the happy-moment capture at payment</text>
<rect x="1032" y="246" width="88" height="26" rx="13" fill="#2c5454"/><text x="1076" y="263" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">HIGH</text>

<circle cx="686" cy="314" r="15" fill="#c39a5f"/><text x="686" y="319" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">3</text>
<text x="712" y="310" font-size="15.5" font-weight="700" fill="#291c0e">Host-stand easel</text>
<text x="712" y="330" font-size="12.5" fill="#5c5c5c">catches the wait-for-a-table window</text>
<rect x="1040" y="298" width="80" height="26" rx="13" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/><text x="1080" y="315" text-anchor="middle" font-size="12" font-weight="800" fill="#8a6d34">MID</text>

<circle cx="686" cy="366" r="15" fill="#c39a5f"/><text x="686" y="371" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">4</text>
<text x="712" y="362" font-size="15.5" font-weight="700" fill="#291c0e">Counter / POS display</text>
<text x="712" y="382" font-size="12.5" fill="#5c5c5c">best for fast-casual and coffee shops</text>
<rect x="1040" y="350" width="80" height="26" rx="13" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/><text x="1080" y="367" text-anchor="middle" font-size="12" font-weight="800" fill="#8a6d34">MID</text>

<circle cx="686" cy="418" r="15" fill="#8794a6"/><text x="686" y="423" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">5</text>
<text x="712" y="414" font-size="15.5" font-weight="700" fill="#291c0e">Take-out bag insert</text>
<text x="712" y="434" font-size="12.5" fill="#5c5c5c">lower rate, but scales with order count</text>
<rect x="1040" y="402" width="80" height="26" rx="13" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/><text x="1080" y="419" text-anchor="middle" font-size="12" font-weight="800" fill="#4a5568">LOW</text>

<line x1="64" y1="548" x2="1136" y2="548" stroke="#ece5d7" stroke-width="1.5"/>
<text x="672" y="486" font-size="13" font-style="italic" fill="#6d5a3a">In-hand placement converts ~10x better than the counter (TAPro).</text>
<text x="600" y="580" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Test 2-3 placements per location, then standardize on the winner before scaling.</text>
</svg>
