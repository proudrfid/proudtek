<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Manual inspection vs NFC tap-to-verify, side by side</title>
<desc id="d">Two panels compare authentication methods. The old way: a clock and a magnifier, 5-15 minutes per bag of expert squinting, missing 5-15 percent of super-fakes. The NFC way: a phone with a gold verification shield, 5-15 seconds per tap with near-zero false accepts or rejects, doable by any staffer with a smartphone. A badge between them reads 30-100x faster.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">AUTHENTICATION, BEFORE AND AFTER THE CHIP</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">The novella and the nod: 5–15 minutes vs 5–15 seconds</text>

<!-- left panel: the old way -->
<rect x="46" y="128" width="520" height="390" rx="16" fill="#fbf7ee" stroke="#e4c98f" stroke-width="1.5"/>
<text x="306" y="166" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="2" fill="#6d5a3a">THE OLD WAY</text>
<circle cx="250" cy="255" r="52" fill="#ffffff" stroke="#291c0e" stroke-width="4"/>
<line x1="250" y1="215" x2="250" y2="224" stroke="#c39a5f" stroke-width="3" stroke-linecap="round"/>
<line x1="250" y1="286" x2="250" y2="295" stroke="#c39a5f" stroke-width="3" stroke-linecap="round"/>
<line x1="210" y1="255" x2="219" y2="255" stroke="#c39a5f" stroke-width="3" stroke-linecap="round"/>
<line x1="281" y1="255" x2="290" y2="255" stroke="#c39a5f" stroke-width="3" stroke-linecap="round"/>
<line x1="250" y1="255" x2="250" y2="226" stroke="#291c0e" stroke-width="5" stroke-linecap="round"/>
<line x1="250" y1="255" x2="272" y2="268" stroke="#291c0e" stroke-width="5" stroke-linecap="round"/>
<circle cx="250" cy="255" r="6" fill="#291c0e"/>
<circle cx="345" cy="305" r="30" fill="#f6ecd9" stroke="#c39a5f" stroke-width="5"/>
<line x1="367" y1="327" x2="396" y2="356" stroke="#c39a5f" stroke-width="6" stroke-linecap="round"/>
<text x="306" y="412" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#291c0e">5–15 min</text>
<text x="306" y="442" text-anchor="middle" font-size="14" fill="#5c5c5c">per bag, expert squinting</text>
<text x="306" y="480" text-anchor="middle" font-size="14" font-weight="600" fill="#8b2d2d">misses 5–15% of super-fakes</text>

<!-- right panel: the nfc way -->
<rect x="634" y="128" width="520" height="390" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="894" y="166" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="2" fill="#2c5454">THE NFC WAY</text>
<rect x="848" y="196" width="92" height="150" rx="14" fill="#291c0e" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="858" y="208" width="72" height="126" rx="8" fill="#234a4a"/>
<path d="M 894 232 L 914 240 L 914 264 Q 914 282 894 292 Q 874 282 874 264 L 874 240 Z" fill="#d4a755"/>
<path d="M 884 262 L 892 271 L 906 252" fill="none" stroke="#234a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 954 240 A 22 22 0 0 1 954 290" fill="none" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round"/>
<path d="M 968 226 A 40 40 0 0 1 968 304" fill="none" stroke="#8fb0b0" stroke-width="2.5" stroke-linecap="round"/>
<text x="894" y="412" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#2c5454">5–15 sec</text>
<text x="894" y="442" text-anchor="middle" font-size="14" fill="#5c5c5c">tap, and you're done</text>
<text x="894" y="480" text-anchor="middle" font-size="14" font-weight="600" fill="#1f6f3a">near-zero false accept / reject</text>

<!-- gap arrow -->
<line x1="572" y1="323" x2="618" y2="323" stroke="#c39a5f" stroke-width="5" stroke-linecap="round"/>
<path d="M 634 323 l -16 -9 v 18 Z" fill="#c39a5f"/>

<!-- badge -->
<rect x="460" y="552" width="280" height="48" rx="24" fill="#291c0e"/>
<text x="600" y="583" text-anchor="middle" font-size="17" font-weight="700" fill="#e4c98f">30–100x faster</text>
<text x="600" y="634" text-anchor="middle" font-size="13.5" fill="#5c5c5c">same verdict, minus the career of training — any staffer with a smartphone</text>
</svg>
