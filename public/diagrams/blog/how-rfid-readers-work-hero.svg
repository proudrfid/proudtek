<text x="216" y="452" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Plug it in, tap one card, done</text>
<text x="216" y="486" text-anchor="middle" font-size="13.5" fill="#1f6f3a">✓ enrollment · check-in · encoding</text>
<text x="216" y="510" text-anchor="middle" font-size="13.5" fill="#4f4f4f">reads at 2–5 cm, one card at a time</text>

<text x="600" y="452" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Battery-powered, roams the floor</text>
<text x="600" y="486" text-anchor="middle" font-size="13.5" fill="#1f6f3a">✓ inventory · audits · asset checks</text>
<text x="600" y="510" text-anchor="middle" font-size="13.5" fill="#4f4f4f">4–12 h per charge, reads to a phone</text>

<text x="984" y="452" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Bolted where the tags must pass</text>
<text x="984" y="486" text-anchor="middle" font-size="13.5" fill="#1f6f3a">✓ dock doors · gates · conveyors</text>
<text x="984" y="510" text-anchor="middle" font-size="13.5" fill="#4f4f4f">hundreds of tags/second, hands-free</text>

<text x="600" y="606" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Same four blocks inside all three — antenna, RF transceiver, control processor, host interface.</text>
<text x="600" y="634" text-anchor="middle" font-size="13.5" fill="#5c5c5c">If a human holds it → desktop or handheld. If the tags come to it → fixed.</text>
