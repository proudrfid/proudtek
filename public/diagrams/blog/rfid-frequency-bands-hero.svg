<circle cx="216" cy="330" r="70" fill="none" stroke="#c39a5f" stroke-width="1.5" opacity="0.25"/>

<rect x="548" y="272" width="62" height="106" rx="10" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="560" y="286" width="38" height="62" rx="4" fill="#eef5f5"/>
