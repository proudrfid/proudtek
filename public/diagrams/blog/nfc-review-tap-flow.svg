<line x1="858" y1="316" x2="883" y2="316" stroke="#291c0e" stroke-width="3"/><polygon points="883,309 892,316 883,323" fill="#291c0e"/>
<text x="600" y="486" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Four steps, one tap for the customer — the other three you do once, up front.</text>
