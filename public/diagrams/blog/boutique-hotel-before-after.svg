<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="baTitle baDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="baTitle">Year-one results, before and after</title>
  <desc id="baDesc">Annual keycard operating cost fell 41 percent, from 9,800 to 5,780 dollars. Four KPIs, magstripe before versus RFID after: card consumable 9,720 dollars down to 5,780 dollars; encoder repair invoices 3,200 dollars down to zero; check-in re-encode rate 14 percent down to 0.8 percent; guest room-access NPS 7.1 out of 10 up to 8.5 out of 10. An unexpected win: 22 cards were returned in a 10 percent food-and-beverage promo, and recycling them trimmed consumables a further 4 percent.</desc>

  <defs>
    <radialGradient id="baBg" cx="50%" cy="18%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="baDark" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
    <marker id="baArrow" markerWidth="9" markerHeight="9" refX="3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f6f3a"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#baBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#6d5a3a">YEAR-ONE RESULTS</text>

  <!-- Headline band -->
  <rect x="60" y="80" width="1080" height="86" rx="16" fill="url(#baDark)"/>
  <text x="104" y="146" font-size="52" font-weight="800" fill="#d4a755">−41%</text>
  <text x="292" y="122" font-size="19" fill="#f4efe4">annual keycard operating cost</text>
  <text x="292" y="150" font-size="21" font-weight="800" fill="#d4a755">$9,800 → $5,780</text>
  <text x="1110" y="130" text-anchor="end" font-size="15.5" fill="#e9d9b6">the least glamorous line item on the</text>
  <text x="1110" y="151" text-anchor="end" font-size="15.5" fill="#e9d9b6">capex sheet, quietly earning its keep</text>

  <!-- Column headers -->
  <text x="620" y="197" text-anchor="middle" font-size="14.5" font-weight="700" letter-spacing="1.2" fill="#8b2d2d">BEFORE · MAGSTRIPE</text>
  <text x="980" y="197" text-anchor="middle" font-size="14.5" font-weight="700" letter-spacing="1.2" fill="#1f6f3a">AFTER · RFID</text>

  <!-- Row 1 -->
  <rect x="60" y="210" width="1080" height="56" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="88" y="245" font-size="18" font-weight="700" fill="#291c0e">Annual card consumable</text>
  <text x="620" y="246" text-anchor="middle" font-size="20" fill="#8b2d2d">$9,720</text>
  <line x1="742" y1="238" x2="792" y2="238" stroke="#1f6f3a" stroke-width="3.5" stroke-linecap="round" marker-end="url(#baArrow)"/>
  <text x="980" y="247" text-anchor="middle" font-size="22" font-weight="800" fill="#1f6f3a">$5,780</text>

  <!-- Row 2 -->
  <rect x="60" y="274" width="1080" height="56" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="88" y="309" font-size="18" font-weight="700" fill="#291c0e">Encoder repair invoices</text>
  <text x="620" y="310" text-anchor="middle" font-size="20" fill="#8b2d2d">$3,200</text>
  <line x1="742" y1="302" x2="792" y2="302" stroke="#1f6f3a" stroke-width="3.5" stroke-linecap="round" marker-end="url(#baArrow)"/>
  <text x="980" y="311" text-anchor="middle" font-size="22" font-weight="800" fill="#1f6f3a">$0</text>

  <!-- Row 3 -->
  <rect x="60" y="338" width="1080" height="56" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="88" y="373" font-size="18" font-weight="700" fill="#291c0e">Re-encode rate at check-in</text>
  <text x="620" y="374" text-anchor="middle" font-size="20" fill="#8b2d2d">14%</text>
  <line x1="742" y1="366" x2="792" y2="366" stroke="#1f6f3a" stroke-width="3.5" stroke-linecap="round" marker-end="url(#baArrow)"/>
  <text x="980" y="375" text-anchor="middle" font-size="22" font-weight="800" fill="#1f6f3a">0.8%</text>

  <!-- Row 4 -->
  <rect x="60" y="402" width="1080" height="56" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="88" y="437" font-size="18" font-weight="700" fill="#291c0e">Guest NPS — room access</text>
  <text x="620" y="438" text-anchor="middle" font-size="20" fill="#8b2d2d">7.1 / 10</text>
  <line x1="742" y1="430" x2="792" y2="430" stroke="#1f6f3a" stroke-width="3.5" stroke-linecap="round" marker-end="url(#baArrow)"/>
  <text x="980" y="439" text-anchor="middle" font-size="22" font-weight="800" fill="#1f6f3a">8.5 / 10</text>

  <!-- Unexpected win -->
  <rect x="60" y="478" width="1080" height="64" rx="14" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2"/>
  <circle cx="100" cy="510" r="16" fill="#1f6f3a"/><path d="M92 510 l6 6 l11 -13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="505" font-size="16.5" font-weight="800" fill="#1f6f3a">Unexpected win</text>
  <text x="130" y="528" font-size="16" fill="#3f6b4e">22 cards returned in a 10% F&amp;B promo → recycling them trimmed consumables a further 4%.</text>

  <text x="600" y="600" text-anchor="middle" font-size="16.5" fill="#6d5a3a">Four KPIs, all pointing the same direction inside 90 days.</text>
</svg>
