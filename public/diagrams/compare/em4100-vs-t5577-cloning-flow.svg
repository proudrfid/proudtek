<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="clnTitle clnDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="clnTitle">How a $25 duplicator clones an EM4100 onto a T5577</title>
  <desc id="clnDesc">A left-to-right cloning flow. A commodity duplicator reads the original EM4100 badge over a 125 kHz field, then writes a T5577 blank that reads identically. Five steps: 1, read the EM4100 and capture the ASK/Manchester response in under 50 milliseconds; 2, decode the 40-bit UID and check parity; 3, set the T5577 configuration block to emulate EM4100 with ASK, RF/64 bit rate and Manchester encoding; 4, write the 40-bit UID into blocks 1 and 2; 5, read the clone back to verify. Total time 2 to 6 seconds. Tools include the Keysy at 35 dollars, a handheld copier at 25 dollars and the Proxmark3 RDV4 at 350 dollars. If readers only match the 125 kHz UID, every EM4100 credential can be copied onto a T5577 blank.</desc>

  <defs>
    <radialGradient id="clnGlow" cx="50%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#f9ecd2"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#clnGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="64" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2" fill="#6d5a3a">HOW A $25 DUPLICATOR PHOTOCOPIES YOUR BADGE</text>
  <text x="600" y="93" text-anchor="middle" font-size="16" fill="#4a5568">Read an EM4100, pour it into a T5577 blank, done — in 2 to 6 seconds.</text>

  <!-- ============ ROW 1: source → device → clone ============ -->
  <!-- source EM4100 -->
  <g>
    <rect x="70" y="150" width="236" height="150" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <path d="M70 164 a14 14 0 0 1 14 -14 h208 a14 14 0 0 1 14 14 v34 h-236 z" fill="#4a5568"/>
    <text x="188" y="187" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">EM4100</text>
    <text x="188" y="228" text-anchor="middle" font-size="13" fill="#6d5a3a">The original badge</text>
    <text x="188" y="255" text-anchor="middle" font-size="12" fill="#9a8f7a">40-bit UID · read-only</text>
    <text x="188" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">·· · 3F A2 19 0C ·· ·</text>
  </g>
  <!-- read arrow -->
  <g fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round">
    <path d="M312 210 a10 10 0 0 1 10 11"/>
    <path d="M312 202 a18 18 0 0 1 18 19"/>
  </g>
  <text x="360" y="200" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1" fill="#177a92">READ</text>
  <path d="M322 225 H408" stroke="#6d5a3a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- duplicator device -->
  <g>
    <rect x="420" y="150" width="330" height="168" rx="16" fill="#291c0e"/>
    <rect x="420" y="150" width="330" height="168" rx="16" fill="none" stroke="#c39a5f" stroke-width="2"/>
    <rect x="446" y="172" width="278" height="60" rx="8" fill="#0f2a33"/>
    <text x="585" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#1fcefb" letter-spacing="1">COPYING…</text>
    <text x="585" y="220" text-anchor="middle" font-size="11.5" fill="#8fdcf3">EM4100 ▸ T5577</text>
    <!-- buttons -->
    <circle cx="500" cy="262" r="14" fill="#3a2c17" stroke="#c39a5f" stroke-width="1.5"/>
    <text x="500" y="266" text-anchor="middle" font-size="10" fill="#e4c98f">READ</text>
    <circle cx="585" cy="262" r="14" fill="#3a2c17" stroke="#c39a5f" stroke-width="1.5"/>
    <text x="585" y="266" text-anchor="middle" font-size="10" fill="#e4c98f">WRITE</text>
    <rect x="636" y="250" width="86" height="24" rx="12" fill="#3a2c17" stroke="#c39a5f" stroke-width="1.5"/>
    <text x="679" y="266" text-anchor="middle" font-size="10.5" fill="#e4c98f">$25 tool</text>
    <text x="585" y="304" text-anchor="middle" font-size="11.5" fill="#c9b48a">Amazon / AliExpress / Huaqiangbei</text>
  </g>
  <!-- stopwatch badge -->
  <g transform="translate(585,132)">
    <rect x="-52" y="-16" width="104" height="30" rx="15" fill="#fbf3e6" stroke="#e4c98f" stroke-width="1.5"/>
    <circle cx="-36" cy="-1" r="8.5" fill="none" stroke="#6d5a3a" stroke-width="2"/>
    <path d="M-36 -1 v-5 M-36 -6 h0" stroke="#6d5a3a" stroke-width="2" stroke-linecap="round"/>
    <path d="M-36 -8 v-3" stroke="#6d5a3a" stroke-width="2" stroke-linecap="round"/>
    <text x="6" y="3" text-anchor="middle" font-size="13" font-weight="800" fill="#6d5a3a">2–6 sec</text>
  </g>

  <!-- write arrow -->
  <path d="M760 225 H846" stroke="#6d5a3a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="800" y="200" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1" fill="#177a92">WRITE</text>
  <g fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round">
    <path d="M866 210 a10 10 0 0 0 -10 11"/>
    <path d="M866 202 a18 18 0 0 0 -18 19"/>
  </g>

  <!-- clone T5577 -->
  <g>
    <rect x="874" y="150" width="236" height="150" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <path d="M874 164 a14 14 0 0 1 14 -14 h208 a14 14 0 0 1 14 14 v34 h-236 z" fill="#3d6b6b"/>
    <text x="992" y="187" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">T5577</text>
    <text x="992" y="228" text-anchor="middle" font-size="13" fill="#6d5a3a">The clone</text>
    <text x="992" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5568">·· · 3F A2 19 0C ·· ·</text>
    <!-- identical stamp -->
    <rect x="922" y="268" width="140" height="24" rx="6" fill="none" stroke="#8b2d2d" stroke-width="2"/>
    <text x="992" y="285" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">READS IDENTICAL</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#6d5a3a"/>
    </marker>
  </defs>

  <!-- ============ ROW 2: five steps ============ -->
  <g>
    <!-- step template repeated -->
    <!-- 1 -->
    <rect x="64" y="348" width="208" height="120" rx="12" fill="#fbf8f2" stroke="#e9dfca" stroke-width="1.5"/>
    <circle cx="92" cy="376" r="15" fill="#c39a5f"/>
    <text x="92" y="381" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
    <text x="118" y="381" font-size="13.5" font-weight="800" fill="#291c0e">Read it</text>
    <text x="82" y="410" font-size="12" fill="#4a5568">125 kHz field grabs the</text>
    <text x="82" y="428" font-size="12" fill="#4a5568">ASK/Manchester reply</text>
    <text x="82" y="450" font-size="11.5" font-weight="700" fill="#177a92">under 50 ms</text>
    <!-- 2 -->
    <rect x="280" y="348" width="208" height="120" rx="12" fill="#fbf8f2" stroke="#e9dfca" stroke-width="1.5"/>
    <circle cx="308" cy="376" r="15" fill="#c39a5f"/>
    <text x="308" y="381" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
    <text x="334" y="381" font-size="13.5" font-weight="800" fill="#291c0e">Decode it</text>
    <text x="298" y="410" font-size="12" fill="#4a5568">Pull the 40-bit UID</text>
    <text x="298" y="428" font-size="12" fill="#4a5568">out of the response</text>
    <text x="298" y="450" font-size="11.5" font-weight="700" fill="#6d5a3a">check parity</text>
    <!-- 3 -->
    <rect x="496" y="348" width="208" height="120" rx="12" fill="#fbf8f2" stroke="#e9dfca" stroke-width="1.5"/>
    <circle cx="524" cy="376" r="15" fill="#c39a5f"/>
    <text x="524" y="381" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
    <text x="550" y="381" font-size="13.5" font-weight="800" fill="#291c0e">Dress the blank</text>
    <text x="514" y="410" font-size="12" fill="#4a5568">Config block → emulate</text>
    <text x="514" y="428" font-size="12" fill="#4a5568">EM4100: ASK, RF/64,</text>
    <text x="514" y="450" font-size="12" fill="#4a5568">Manchester</text>
    <!-- 4 -->
    <rect x="712" y="348" width="208" height="120" rx="12" fill="#fbf8f2" stroke="#e9dfca" stroke-width="1.5"/>
    <circle cx="740" cy="376" r="15" fill="#c39a5f"/>
    <text x="740" y="381" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
    <text x="766" y="381" font-size="13.5" font-weight="800" fill="#291c0e">Write the ID</text>
    <text x="730" y="410" font-size="12" fill="#4a5568">Drop the 40-bit UID</text>
    <text x="730" y="428" font-size="12" fill="#4a5568">into blocks 1–2 of</text>
    <text x="730" y="450" font-size="12" fill="#4a5568">the T5577 EEPROM</text>
    <!-- 5 -->
    <rect x="928" y="348" width="208" height="120" rx="12" fill="#fbf8f2" stroke="#e9dfca" stroke-width="1.5"/>
    <circle cx="956" cy="376" r="15" fill="#1f6f3a"/>
    <text x="956" y="381" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
    <text x="982" y="381" font-size="13.5" font-weight="800" fill="#291c0e">Verify</text>
    <text x="946" y="410" font-size="12" fill="#4a5568">Read the clone back</text>
    <text x="946" y="428" font-size="12" fill="#4a5568">and confirm the copy</text>
    <text x="946" y="450" font-size="11.5" font-weight="700" fill="#1f6f3a">done.</text>
  </g>

  <!-- ============ ROW 3: caution + tools ============ -->
  <g>
    <rect x="64" y="500" width="700" height="96" rx="12" fill="#f6e9e6" stroke="#d8a99f" stroke-width="1.5"/>
    <path d="M104 524 l20 36 h-40 z" fill="none" stroke="#8b2d2d" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="102" y="536" width="4" height="12" rx="2" fill="#8b2d2d"/>
    <circle cx="104" cy="554" r="2.2" fill="#8b2d2d"/>
    <text x="148" y="534" font-size="14" font-weight="800" fill="#8b2d2d">The uncomfortable part</text>
    <text x="148" y="557" font-size="13" fill="#7a3b34">If your readers only match the 125 kHz UID, every EM4100 in the</text>
    <text x="148" y="577" font-size="13" fill="#7a3b34">fleet is one minute and one T5577 blank away from a perfect copy.</text>
  </g>
  <g>
    <rect x="784" y="500" width="352" height="96" rx="12" fill="#fbf8f2" stroke="#e9dfca" stroke-width="1.5"/>
    <text x="806" y="522" font-size="12" font-weight="800" letter-spacing="0.8" fill="#8a7a5a">OFF-THE-SHELF TOOLS</text>
    <text x="806" y="545" font-size="12.5" fill="#291c0e">Handheld copier</text>
    <text x="1114" y="545" text-anchor="end" font-size="12.5" font-weight="700" fill="#291c0e">$25</text>
    <text x="806" y="565" font-size="12.5" fill="#291c0e">Keysy</text>
    <text x="1114" y="565" text-anchor="end" font-size="12.5" font-weight="700" fill="#291c0e">$35</text>
    <text x="806" y="585" font-size="12.5" fill="#291c0e">Proxmark3 RDV4 (adds HID, Indala)</text>
    <text x="1114" y="585" text-anchor="end" font-size="12.5" font-weight="700" fill="#291c0e">$350</text>
  </g>
</svg>
