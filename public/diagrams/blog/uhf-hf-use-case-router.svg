<text x="234" y="378" text-anchor="middle" font-size="13.5" fill="#291c0e">pallet &amp; case tracking</text>
<rect x="84" y="400" width="300" height="34" rx="17" fill="#ffffff" stroke="#4a5568"/>
<text x="234" y="422" text-anchor="middle" font-size="13.5" fill="#291c0e">vehicle toll collection</text>
<rect x="84" y="444" width="300" height="34" rx="17" fill="#ffffff" stroke="#4a5568"/>
<text x="234" y="466" text-anchor="middle" font-size="13.5" fill="#291c0e">airport baggage handling</text>

<rect x="430" y="196" width="340" height="380" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="228" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">EITHER — tie-breaker decides</text>
<text x="600" y="250" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the secondary requirement rules</text>
