<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="coT coD" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <title id="coT">The wristband program costs a fraction of a single breach</title>
      <desc id="coD">A ledger comparison. What the program costs: total program capex of $300K to $1M for a 300-bed hospital (handhelds, sleds, fixed readers, EHR integration at $5,000 to $25,000 per nursing unit); plus $9K to $75K a year in single-use Tyvek bands at $0.25 to $1.50 each. What one mistake costs: HHS OCR settlements from $429K (Lifespan, 2020) to $10.93M (Anthem, 2018), with IBM placing healthcare breach cost above $10M per incident — the highest of any industry. One avoided misidentification breach typically funds the program for years. Footer: wrong-patient events are 7 to 13 percent of medication errors and 5 to 10 percent of lab specimen mismatches; Joint Commission NPSG.01.01.01 requires at least two patient identifiers.</desc>
      <defs>
        <radialGradient id="coBg" cx="50%" cy="16%" r="92%"><stop offset="0%" stop-color="#f8f2e6"/><stop offset="100%" stop-color="#f1ece0"/></radialGradient>
        <linearGradient id="coDark" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
      </defs>
      <rect width="1200" height="675" fill="url(#coBg)"/>
      <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
      <text x="600" y="60" text-anchor="middle" font-size="20.5" font-weight="800" letter-spacing="1.4" fill="#6d5a3a">COST THE PROGRAM AGAINST THE COST OF GETTING IT WRONG</text>

      <!-- Left: program cost -->
      <rect x="64" y="94" width="512" height="436" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2.5"/>
      <text x="320" y="134" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1.5" fill="#6d5a3a">WHAT THE PROGRAM COSTS</text>
      <text x="320" y="212" text-anchor="middle" font-size="52" font-weight="800" fill="#291c0e">$300K–$1M</text>
      <text x="320" y="244" text-anchor="middle" font-size="16" fill="#4f4f4f">total program capex · 300-bed hospital</text>
      <text x="320" y="266" text-anchor="middle" font-size="14.5" fill="#8a7a5f">handhelds, tablet sleds, fixed readers + EHR integration</text>
      <line x1="112" y1="298" x2="528" y2="298" stroke="#eaddc0" stroke-width="1.5"/>
      <text x="320" y="356" text-anchor="middle" font-size="40" font-weight="800" fill="#291c0e">$9K–$75K<tspan font-size="22" fill="#6d5a3a"> / yr</tspan></text>
      <text x="320" y="386" text-anchor="middle" font-size="16" fill="#4f4f4f">single-use Tyvek bands · $0.25–1.50 each</text>
      <rect x="150" y="418" width="340" height="40" rx="20" fill="#efe0bf"/>
      <text x="320" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">$5K–25K per nursing-unit deployment</text>
      <text x="320" y="498" text-anchor="middle" font-size="14.5" fill="#8a7a5f">~35,000–50,000 bands/yr at 500 beds, 75% occupancy, 4-day stay</text>

      <!-- vs -->
      <circle cx="600" cy="312" r="30" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
      <text x="600" y="320" text-anchor="middle" font-size="18" font-weight="800" fill="#6d5a3a">vs</text>

      <!-- Right: breach cost -->
      <rect x="624" y="94" width="512" height="436" rx="16" fill="#f7ecea" stroke="#dcb6b0" stroke-width="2.5"/>
      <text x="880" y="134" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1.5" fill="#8b2d2d">WHAT ONE MISTAKE COSTS</text>
      <text x="880" y="214" text-anchor="middle" font-size="46" font-weight="800" fill="#8b2d2d">$429K → $10.93M</text>
      <text x="880" y="246" text-anchor="middle" font-size="16" fill="#734040">HHS OCR settlements, by scope</text>
      <text x="880" y="268" text-anchor="middle" font-size="14.5" fill="#9a6a6a">Lifespan (2020) → Anthem (2018)</text>
      <line x1="672" y1="300" x2="1088" y2="300" stroke="#e6c9c4" stroke-width="1.5"/>
      <text x="880" y="358" text-anchor="middle" font-size="40" font-weight="800" fill="#8b2d2d">&gt; $10M<tspan font-size="22" fill="#734040"> / incident</tspan></text>
      <text x="880" y="388" text-anchor="middle" font-size="16" fill="#734040">IBM: healthcare breach cost — #1 of any industry, years running</text>
      <rect x="672" y="418" width="416" height="88" rx="12" fill="#ffffff" stroke="#dcb6b0" stroke-width="1.5"/>
      <text x="880" y="452" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">One avoided misidentification breach</text>
      <text x="880" y="480" text-anchor="middle" font-size="17" font-weight="800" fill="#1f6f3a">funds the entire program for years.</text>

      <!-- Footer strip -->
      <rect x="64" y="548" width="1072" height="84" rx="14" fill="url(#coDark)"/>
      <text x="90" y="582" font-size="15.5" fill="#ffffff">Wrong-patient baseline: <tspan font-weight="800">7–13%</tspan> of medication errors · <tspan font-weight="800">5–10%</tspan> of lab specimen mismatches.</text>
      <text x="90" y="612" font-size="15" fill="#e9d9b8">Joint Commission <tspan font-weight="800" fill="#ffffff">NPSG.01.01.01</tspan> — at least two patient identifiers (band + printed text + EHR validation).</text>
    </svg>
