<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The supply-chain visibility gap and how RFID closes it</title>
<desc id="d">Three panels left to right. In transit, goods are tracked to the minute across ocean, rail and truck, each marked visible via GPS, EDI and carrier scans. Inside your building, a red gap panel shows the pallet going dark under manual scans and hours-old counts, so the warehouse system no longer matches reality. With UHF RFID, a dock portal restores continuous automatic reads and the system matches the physical floor again.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE VISIBILITY GAP</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="33" font-weight="700" fill="#291c0e">Tracked to the minute, then dark at your own door</text>
<text x="600" y="136" text-anchor="middle" font-size="15.5" fill="#4f4f4f">The gap isn't in transit — it opens the moment a pallet rolls off the truck into your building.</text>

<!-- arrows between panels -->
<g stroke="#8a94a3" stroke-width="2.6" fill="#8a94a3">
<line x1="392" y1="378" x2="424" y2="378"/><polygon points="424,372 434,378 424,384"/>
<line x1="768" y1="378" x2="800" y2="378"/><polygon points="800,372 810,378 800,384"/>
</g>

<!-- PANEL A: in transit -->
<rect x="64" y="180" width="320" height="392" rx="16" fill="#f4f6f8" stroke="#cdd4dd" stroke-width="1.6"/>
<text x="224" y="220" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">IN TRANSIT</text>
<text x="224" y="242" text-anchor="middle" font-size="12.5" fill="#5c5c5c">tracked to the minute</text>
<rect x="84" y="276" width="280" height="46" rx="10" fill="#ffffff" stroke="#cdd4dd" stroke-width="1.4"/>
<text x="106" y="304" font-size="14.5" font-weight="700" fill="#291c0e">Ocean freight</text>
<circle cx="330" cy="299" r="13" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.8"/>
<path d="M324 299 l4 4 l7 -8" stroke="#1f6f3a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="84" y="344" width="280" height="46" rx="10" fill="#ffffff" stroke="#cdd4dd" stroke-width="1.4"/>
<text x="106" y="372" font-size="14.5" font-weight="700" fill="#291c0e">Rail linehaul</text>
<circle cx="330" cy="367" r="13" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.8"/>
<path d="M324 367 l4 4 l7 -8" stroke="#1f6f3a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="84" y="412" width="280" height="46" rx="10" fill="#ffffff" stroke="#cdd4dd" stroke-width="1.4"/>
<text x="106" y="440" font-size="14.5" font-weight="700" fill="#291c0e">Line-haul truck</text>
<circle cx="330" cy="435" r="13" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.8"/>
<path d="M324 435 l4 4 l7 -8" stroke="#1f6f3a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="224" y="530" text-anchor="middle" font-size="12.5" fill="#4a5568">GPS · EDI · carrier scans</text>

<!-- PANEL B: the gap (red = blind state) -->
<rect x="440" y="180" width="320" height="392" rx="16" fill="#fbf0ee" stroke="#d9a9a3" stroke-width="1.8"/>
<text x="600" y="220" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#8b2d2d">INSIDE YOUR BUILDING</text>
<text x="600" y="242" text-anchor="middle" font-size="12.5" fill="#9a5b52">the pallet goes dark</text>
<rect x="486" y="286" width="228" height="150" rx="12" fill="#fff6f4" stroke="#8b2d2d" stroke-width="2" stroke-dasharray="7 6"/>
<text x="600" y="330" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8b2d2d">manual scans</text>
<text x="600" y="358" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8b2d2d">hours-old counts</text>
<text x="600" y="386" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8b2d2d">guesswork on the floor</text>
<rect x="540" y="470" width="120" height="34" rx="17" fill="#8b2d2d"/>
<text x="600" y="492" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#ffffff">THE GAP</text>
<text x="600" y="536" text-anchor="middle" font-size="12.5" fill="#8b2d2d">WMS ≠ physical reality</text>

<!-- PANEL C: with RFID (green) -->
<rect x="816" y="180" width="320" height="392" rx="16" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/>
<text x="976" y="220" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#1f6f3a">WITH UHF RFID</text>
<text x="976" y="242" text-anchor="middle" font-size="12.5" fill="#3f7d55">the gap closes</text>
<!-- portal frame -->
<rect x="878" y="300" width="16" height="150" fill="#2c5454"/>
<rect x="1058" y="300" width="16" height="150" fill="#2c5454"/>
<rect x="878" y="300" width="196" height="16" fill="#2c5454"/>
<!-- read signal -->
<circle cx="976" cy="346" r="3" fill="#2c5454"/>
<path d="M966 342 A 14 14 0 0 1 986 342" stroke="#2c5454" stroke-width="2.4" fill="none"/>
<path d="M959 335 A 24 24 0 0 1 993 335" stroke="#3d6b6b" stroke-width="2.2" fill="none"/>
<!-- pallet -->
<rect x="940" y="388" width="72" height="46" rx="4" fill="#cdb58a" stroke="#8a6d3b" stroke-width="1.6"/>
<line x1="940" y1="428" x2="1012" y2="428" stroke="#8a6d3b" stroke-width="1.4"/>
<text x="976" y="490" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6f3a">continuous, automatic reads</text>
<text x="976" y="514" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6f3a">the system matches the floor</text>
<text x="976" y="536" text-anchor="middle" font-size="12.5" fill="#1f6f3a">WMS = physical reality</text>

<text x="600" y="610" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Software knows where the pallet is — right up until it becomes your problem.</text>
</svg>
