<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The real per-card cost stack of a hotel keycard program</title>
<desc id="d">Five cost components beyond the chip. Chip: $0.08 to $0.12 for Classic, $0.45 to $0.80 for DESFire — the smallest line but it sets the tier. Card body and printing: $0.15 to $0.40, with custom artwork adding $0.05 to $0.20. Encoding: a supplier pre-encode adds $0.10 to $0.30, or cents per card in-house. Freight: air $0.05 to $0.10 per card, sea $0.01 to $0.02 but four to six weeks slower. Replacement cycle: 30 to 50 percent of inventory a year on an 18 to 30 month card lifespan. A red callout warns that grey-market Fudan FM11RF08 and FM11RF08S chips carry known backdoor keys — insist on NXP-authorized distributor invoices.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT A HOTEL KEYCARD ACTUALLY COSTS</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Price only the card body and you'll miss 30-50% of program cost.</text>

<text x="92" y="120" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">COMPONENT</text>
<text x="470" y="120" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">TYPICAL RANGE</text>
<text x="740" y="120" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">WHAT DRIVES IT</text>

<!-- row 1 -->
<rect x="64" y="134" width="1072" height="52" rx="9" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<text x="92" y="166" font-size="14.5" font-weight="800" fill="#291c0e">Chip</text>
<text x="470" y="166" font-size="13" font-weight="700" fill="#2c5454">$0.08-0.12 / $0.45-0.80</text>
<text x="740" y="166" font-size="12.5" fill="#5c5c5c">Classic / DESFire — sets the tier</text>

<!-- row 2 -->
<rect x="64" y="194" width="1072" height="52" rx="9" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<text x="92" y="226" font-size="14.5" font-weight="800" fill="#291c0e">Card body + printing</text>
<text x="470" y="226" font-size="13" font-weight="700" fill="#2c5454">$0.15-0.40</text>
<text x="740" y="226" font-size="12.5" fill="#5c5c5c">custom artwork adds $0.05-0.20</text>

<!-- row 3 -->
<rect x="64" y="254" width="1072" height="52" rx="9" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<text x="92" y="286" font-size="14.5" font-weight="800" fill="#291c0e">Encoding</text>
<text x="470" y="286" font-size="13" font-weight="700" fill="#2c5454">+$0.10-0.30</text>
<text x="740" y="286" font-size="12.5" fill="#5c5c5c">supplier pre-encode, or cents in-house</text>

<!-- row 4 -->
<rect x="64" y="314" width="1072" height="52" rx="9" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<text x="92" y="346" font-size="14.5" font-weight="800" fill="#291c0e">Freight + customs</text>
<text x="470" y="346" font-size="13" font-weight="700" fill="#2c5454">air $0.05-0.10</text>
<text x="740" y="346" font-size="12.5" fill="#5c5c5c">sea $0.01-0.02 but +4-6 wk lead</text>

<!-- row 5 -->
<rect x="64" y="374" width="1072" height="52" rx="9" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<text x="92" y="406" font-size="14.5" font-weight="800" fill="#291c0e">Replacement cycle</text>
<text x="470" y="406" font-size="13" font-weight="700" fill="#2c5454">30-50% / year</text>
<text x="740" y="406" font-size="12.5" fill="#5c5c5c">18-30 month card lifespan</text>

<!-- grey-market risk -->
<rect x="100" y="446" width="1000" height="92" rx="12" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.5"/>
<rect x="100" y="446" width="9" height="92" rx="4" fill="#8b2d2d"/>
<circle cx="140" cy="482" r="12" fill="#8b2d2d"/>
<text x="140" y="487" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">!</text>
<text x="166" y="478" font-size="14" font-weight="800" fill="#8b2d2d">GREY-MARKET CHIP RISK</text>
<text x="166" y="500" font-size="12.5" fill="#5c5c5c">Fudan FM11RF08 / FM11RF08S "compatible" chips carry known backdoor keys and inconsistent memory layouts.</text>
<text x="166" y="520" font-size="12.5" fill="#5c5c5c">Insist on NXP-authorized distributor invoices for any DESFire or Classic order.</text>
</svg>
