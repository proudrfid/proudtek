<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW IT WORKS · TAP TO REVIEW</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">From an encoded tag to a posted review in four steps.</text>
