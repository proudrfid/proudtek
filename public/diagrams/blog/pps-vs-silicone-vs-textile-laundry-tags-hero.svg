<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">PPS vs silicone vs textile RFID laundry tags compared</title>
<desc id="d">Three material cards. PPS: 200-300 wash cycles, 85°C wet and 200°C dry heat, excellent bleach resistance, $0.002-0.003 per cycle, best for flat linen, uniforms and workwear. Silicone: 150-250 cycles, 80°C wet and 180°C dry, moderate bleach resistance, $0.003-0.004 per cycle, best for fitted garments, scrubs and chef coats. Textile: 100-200 cycles, 60-70°C wet and 120°C dry, poor bleach resistance, $0.002-0.006 per cycle, best for hotel linens and spa robes.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PPS vs SILICONE vs TEXTILE — LAUNDRY TAGS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Match the tag to the wash, not the sticker price.</text>

<!-- PPS card -->
<rect x="76" y="126" width="336" height="396" rx="14" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.8"/>
<rect x="76" y="126" width="336" height="8" rx="4" fill="#4a5568"/>
<text x="244" y="170" text-anchor="middle" font-size="18" font-weight="800" fill="#3f4657">PPS</text>
<text x="244" y="238" text-anchor="middle" font-size="42" font-weight="800" fill="#4a5568">200-300</text>
<text x="244" y="262" text-anchor="middle" font-size="12.5" fill="#5c5c5c">wash cycles</text>
<line x1="108" y1="284" x2="380" y2="284" stroke="#eee9df" stroke-width="1.4"/>
<text x="244" y="316" text-anchor="middle" font-size="13" fill="#291c0e">85°C wet · 200°C dry</text>
<text x="244" y="346" text-anchor="middle" font-size="13" fill="#291c0e">bleach: excellent</text>
<text x="244" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">$0.002-0.003 / cycle</text>
<text x="244" y="414" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a8a8a">BEST FOR</text>
<text x="244" y="436" text-anchor="middle" font-size="12" font-weight="600" fill="#291c0e">flat linen · uniforms · workwear</text>

<!-- Silicone card -->
<rect x="432" y="126" width="336" height="396" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="432" y="126" width="336" height="8" rx="4" fill="#3d6b6b"/>
<text x="600" y="170" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">Silicone</text>
<text x="600" y="238" text-anchor="middle" font-size="42" font-weight="800" fill="#3d6b6b">150-250</text>
<text x="600" y="262" text-anchor="middle" font-size="12.5" fill="#5c5c5c">wash cycles</text>
<line x1="464" y1="284" x2="736" y2="284" stroke="#eef5f5" stroke-width="1.4"/>
<text x="600" y="316" text-anchor="middle" font-size="13" fill="#291c0e">80°C wet · 180°C dry</text>
<text x="600" y="346" text-anchor="middle" font-size="13" fill="#291c0e">bleach: moderate</text>
<text x="600" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">$0.003-0.004 / cycle</text>
<text x="600" y="414" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a8a8a">BEST FOR</text>
<text x="600" y="436" text-anchor="middle" font-size="12" font-weight="600" fill="#291c0e">fitted garments · scrubs · chef coats</text>

<!-- Textile card -->
<rect x="788" y="126" width="336" height="396" rx="14" fill="#ffffff" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="788" y="126" width="336" height="8" rx="4" fill="#c39a5f"/>
<text x="956" y="170" text-anchor="middle" font-size="18" font-weight="800" fill="#a07d43">Textile</text>
<text x="956" y="238" text-anchor="middle" font-size="42" font-weight="800" fill="#a07d43">100-200</text>
<text x="956" y="262" text-anchor="middle" font-size="12.5" fill="#5c5c5c">wash cycles</text>
<line x1="820" y1="284" x2="1092" y2="284" stroke="#f2e6cf" stroke-width="1.4"/>
<text x="956" y="316" text-anchor="middle" font-size="13" fill="#291c0e">60-70°C wet · 120°C dry</text>
<text x="956" y="346" text-anchor="middle" font-size="13" fill="#291c0e">bleach: poor</text>
<text x="956" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#a07d43">$0.002-0.006 / cycle</text>
<text x="956" y="414" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a8a8a">BEST FOR</text>
<text x="956" y="436" text-anchor="middle" font-size="12" font-weight="600" fill="#291c0e">hotel linens · spa robes</text>

<text x="600" y="568" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Every material reads identically to the reader — durability is the only real variable.</text>
</svg>
