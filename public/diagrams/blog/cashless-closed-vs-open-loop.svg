<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Closed-loop versus open-loop cashless wristbands, as two money flows</title>
<desc id="d">Two cashless models. Closed-loop: the attendee pre-loads credit, a venue-managed platform holds the value, and vendors are settled post-event — PCI is not required, offline works fully, best for festivals and multi-day events. Open-loop: the attendee links a bank card or wallet, a payment processor settles vendors directly — PCI is required, offline is limited, best for hotels and resorts billing to a folio.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TWO CASHLESS MODELS</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Where the money sits decides PCI scope, settlement and offline behaviour.</text>

<!-- Panel A: closed-loop -->
<rect x="88" y="108" width="480" height="446" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="88" y="108" width="480" height="8" rx="4" fill="#3d6b6b"/>
<text x="328" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">CLOSED-LOOP</text>
<text x="328" y="172" text-anchor="middle" font-size="12.5" fill="#5c5c5c">venue-managed stored value</text>
<rect x="128" y="190" width="400" height="42" rx="8" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="328" y="216" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Attendee pre-loads credit</text>
<line x1="328" y1="232" x2="328" y2="246" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="322,246 328,256 334,246" fill="#3d6b6b"/>
<rect x="128" y="256" width="400" height="42" rx="8" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="328" y="282" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Venue platform holds the value</text>
<line x1="328" y1="298" x2="328" y2="312" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="322,312 328,322 334,312" fill="#3d6b6b"/>
<rect x="128" y="322" width="400" height="42" rx="8" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="328" y="348" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Vendors settled post-event</text>
<line x1="128" y1="386" x2="528" y2="386" stroke="#eadfce" stroke-width="1.5"/>
<circle cx="150" cy="414" r="5" fill="#1f6f3a"/>
<text x="166" y="419" font-size="13.5" fill="#333333">PCI — not required</text>
<circle cx="150" cy="446" r="5" fill="#1f6f3a"/>
<text x="166" y="451" font-size="13.5" fill="#333333">Offline — full</text>
<circle cx="150" cy="478" r="5" fill="#6d5a3a"/>
<text x="166" y="483" font-size="13.5" fill="#333333">Best — festivals, multi-day</text>

<!-- Panel B: open-loop -->
<rect x="632" y="108" width="480" height="446" rx="14" fill="#ffffff" stroke="#d3dae3" stroke-width="1.8"/>
<rect x="632" y="108" width="480" height="8" rx="4" fill="#4a5568"/>
<text x="872" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#3a4453">OPEN-LOOP</text>
<text x="872" y="172" text-anchor="middle" font-size="12.5" fill="#5c5c5c">linked bank card / wallet</text>
<rect x="672" y="190" width="400" height="42" rx="8" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/>
<text x="872" y="216" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Attendee links card / wallet</text>
<line x1="872" y1="232" x2="872" y2="246" stroke="#4a5568" stroke-width="2.5"/>
<polygon points="866,246 872,256 878,246" fill="#4a5568"/>
<rect x="672" y="256" width="400" height="42" rx="8" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/>
<text x="872" y="282" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Payment processor</text>
<line x1="872" y1="298" x2="872" y2="312" stroke="#4a5568" stroke-width="2.5"/>
<polygon points="866,312 872,322 878,312" fill="#4a5568"/>
<rect x="672" y="322" width="400" height="42" rx="8" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/>
<text x="872" y="348" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Vendors settled directly</text>
<line x1="672" y1="386" x2="1072" y2="386" stroke="#eadfce" stroke-width="1.5"/>
<circle cx="694" cy="414" r="5" fill="#c39a5f"/>
<text x="710" y="419" font-size="13.5" fill="#333333">PCI — required</text>
<circle cx="694" cy="446" r="5" fill="#c39a5f"/>
<text x="710" y="451" font-size="13.5" fill="#333333">Offline — limited</text>
<circle cx="694" cy="478" r="5" fill="#6d5a3a"/>
<text x="710" y="483" font-size="13.5" fill="#333333">Best — hotels, resorts</text>

<text x="600" y="596" text-anchor="middle" font-size="14" fill="#5c5c5c">Most festivals run closed-loop to skip PCI and keep control; hotels lean open-loop to bill the folio.</text>
</svg>
