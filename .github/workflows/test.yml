name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history so the chip-placeholder-drift lint can diff vs
          # origin/main to verify placeholders byte-match prior prose.
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint (path-4 guardrail)
        run: npm run lint

      - name: Chip-claims regression guard
        run: npm run lint:chip-claims

      - name: Chip-placeholder drift guard
        # Verifies every {chip:slug:field} placeholder added in this PR
        # resolves to text that byte-matches the prose it replaced. Catches
        # the failure mode that caused PR batch 2 + batch 5 reverts on
        # 2026-05-23 (commits 9e4aa41 / 24efedc were reverted because
        # schema displayName carried "NXP " prefix the prose lacked).
        # Diffs against origin/main by default; override with BASE env var.
        run: npm run lint:chip-placeholder-drift

      - name: Vitest (snapshot + unit tests)
        run: npm run test

      - name: Astro build (no Lighthouse — keep CI fast)
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
