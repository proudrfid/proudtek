<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hybrid RFID plus QR credential allocation by attendee tier</title>
<desc id="d">A hybrid allocation map. RFID wristbands go to the tiers that earn the premium: VIP, premium and backstage holders for cashless, zone access and keepsake value, and staff and crew for restricted and cash-handling areas. QR mobile tickets go to general admission for gate entry only and to day passes and walk-ups that need no multi-day durability. Both credential types feed one access-control platform, read on the same gate reader hardware.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE HYBRID SPLIT</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">RFID where it earns its cost; QR where gate access is enough — one platform behind both.</text>

<text x="325" y="146" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.6" fill="#2c5454">RFID WRISTBANDS</text>
<text x="875" y="146" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.6" fill="#a07d43">QR MOBILE TICKETS</text>

<!-- RFID chips -->
<rect x="90" y="168" width="470" height="92" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="118" y="206" font-size="18" font-weight="700" fill="#2c5454">VIP, premium &amp; backstage</text>
<text x="118" y="234" font-size="13" fill="#5c5c5c">cashless · zone access · branded keepsake</text>
<rect x="90" y="276" width="470" height="92" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="118" y="314" font-size="18" font-weight="700" fill="#2c5454">Staff &amp; crew</text>
<text x="118" y="342" font-size="13" fill="#5c5c5c">restricted areas · cash-handling zones</text>

<!-- QR chips -->
<rect x="640" y="168" width="470" height="92" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="668" y="206" font-size="18" font-weight="700" fill="#a07d43">General admission</text>
<text x="668" y="234" font-size="13" fill="#5c5c5c">gate entry only — the cheapest credential job</text>
<rect x="640" y="276" width="470" height="92" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="668" y="314" font-size="18" font-weight="700" fill="#a07d43">Day passes &amp; walk-ups</text>
<text x="668" y="342" font-size="13" fill="#5c5c5c">no multi-day wristband durability needed</text>

<!-- converge arrows -->
<path d="M325 368 L325 442" stroke="#9aa6b6" stroke-width="2.4" fill="none"/>
<path d="M319 432 L325 446 L331 432 Z" fill="#9aa6b6"/>
<path d="M875 368 L875 442" stroke="#9aa6b6" stroke-width="2.4" fill="none"/>
<path d="M869 432 L875 446 L881 432 Z" fill="#9aa6b6"/>

<!-- unified platform -->
<rect x="90" y="450" width="1020" height="96" rx="16" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.8"/>
<text x="600" y="492" text-anchor="middle" font-size="19" font-weight="800" letter-spacing="0.4" fill="#4a5568">ONE ACCESS-CONTROL PLATFORM</text>
<text x="600" y="519" text-anchor="middle" font-size="14" fill="#5c5c5c">RFID and QR / barcode read on the same gate reader hardware</text>

<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The credential type flexes by tier; the data flow behind the gate stays unified.</text>
</svg>
