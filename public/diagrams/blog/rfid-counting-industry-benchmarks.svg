<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID-versus-manual counting delta by industry vertical</title>
<desc id="d">Five industries with their realistic time-savings and accuracy or impact delta. Apparel retail (Decathlon, Zara, Macy's, Lululemon): 10-30x faster, plus 25-35 accuracy points. General merchandise (Walmart, Target): 5-10x, up to 95% plus. Healthcare (surgical trays and sponge counts): trays counted in 8-12 seconds versus 6-10 minutes, retained-object events down 90% plus. Manufacturing WIP (Boeing tools, automotive containers): 3-8x, plus 15-25 points. Library and documents: 4-10x, 99% plus accuracy.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE THE DELTA IS BIGGEST</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The blended "10x faster" average hides most of the story — here it is by vertical.</text>

<!-- header -->
<text x="88" y="132" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INDUSTRY</text>
<text x="716" y="132" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TIME SAVINGS</text>
<text x="995" y="132" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ACCURACY / IMPACT</text>
<line x1="64" y1="144" x2="1136" y2="144" stroke="#e6dfd2" stroke-width="1.6"/>

<!-- ROW 1 · Apparel (teal) -->
<rect x="64" y="156" width="6" height="78" rx="3" fill="#3d6b6b"/>
<text x="88" y="188" font-size="16" font-weight="800" fill="#291c0e">Apparel retail</text>
<text x="88" y="212" font-size="12.5" fill="#5c5c5c">Decathlon · Zara · Macy's · Lululemon</text>
<rect x="600" y="177" width="232" height="36" rx="18" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="716" y="200" text-anchor="middle" font-size="14" font-weight="800" fill="#2c5454">10-30x faster</text>
<rect x="864" y="177" width="262" height="36" rx="18" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="995" y="200" text-anchor="middle" font-size="14" font-weight="800" fill="#2c5454">+25-35 accuracy points</text>

<!-- ROW 2 · General merchandise (steel) -->
<rect x="64" y="240" width="6" height="78" rx="3" fill="#4a5568"/>
<text x="88" y="272" font-size="16" font-weight="800" fill="#291c0e">General merchandise</text>
<text x="88" y="296" font-size="12.5" fill="#5c5c5c">Walmart · Target</text>
<rect x="600" y="261" width="232" height="36" rx="18" fill="#eef1f5" stroke="#c4ccd6" stroke-width="1.4"/>
<text x="716" y="284" text-anchor="middle" font-size="14" font-weight="800" fill="#3a4453">5-10x faster</text>
<rect x="864" y="261" width="262" height="36" rx="18" fill="#eef1f5" stroke="#c4ccd6" stroke-width="1.4"/>
<text x="995" y="284" text-anchor="middle" font-size="14" font-weight="800" fill="#3a4453">to 95%+ from 80-85%</text>

<!-- ROW 3 · Healthcare (teal, sober) -->
<rect x="64" y="324" width="6" height="78" rx="3" fill="#3d6b6b"/>
<text x="88" y="356" font-size="16" font-weight="800" fill="#291c0e">Healthcare</text>
<text x="88" y="380" font-size="12.5" fill="#5c5c5c">Surgical trays · sponge counts</text>
<rect x="600" y="345" width="232" height="36" rx="18" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="716" y="368" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2c5454">8-12 s vs 6-10 min</text>
<rect x="864" y="345" width="262" height="36" rx="18" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="995" y="368" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">retained events 90%+ down</text>

<!-- ROW 4 · Manufacturing (gold) -->
<rect x="64" y="408" width="6" height="78" rx="3" fill="#c39a5f"/>
<text x="88" y="440" font-size="16" font-weight="800" fill="#291c0e">Manufacturing WIP</text>
<text x="88" y="464" font-size="12.5" fill="#5c5c5c">Boeing tools · automotive containers</text>
<rect x="600" y="429" width="232" height="36" rx="18" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="716" y="452" text-anchor="middle" font-size="14" font-weight="800" fill="#a07d43">3-8x faster</text>
<rect x="864" y="429" width="262" height="36" rx="18" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="995" y="452" text-anchor="middle" font-size="14" font-weight="800" fill="#a07d43">+15-25 accuracy points</text>

<!-- ROW 5 · Library / documents (green) -->
<rect x="64" y="492" width="6" height="78" rx="3" fill="#1f6f3a"/>
<text x="88" y="524" font-size="16" font-weight="800" fill="#291c0e">Library / documents</text>
<text x="88" y="548" font-size="12.5" fill="#5c5c5c">Universities · pharma chain-of-custody</text>
<rect x="600" y="513" width="232" height="36" rx="18" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="716" y="536" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">4-10x faster</text>
<rect x="864" y="513" width="262" height="36" rx="18" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="995" y="536" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">99%+ from 75-85%</text>

<text x="600" y="602" text-anchor="middle" font-size="14" fill="#4f4f4f">Model your own vertical — don't buy the blended average.</text>
</svg>
