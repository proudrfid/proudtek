<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">When to leave the NTAG21x aisle — jobs that need a different chip family</title>
<desc id="d">A grid of six cards. Per-tap anti-counterfeit URLs with rolling SUN links need NTAG 424 DNA. Multi-application credentials and stored value — badges, transit, campus cash with AES mutual authentication — need MIFARE DESFire EV2 or EV3. Longer HF read range around 1.5 metres for library shelves and asset scans needs ICODE SLI or SLIX vicinity tags under ISO 15693. Warehouse-distance dock-door reads are UHF jobs for EPC Gen2 or dual-frequency NTAG plus UCODE inlays. A cheaper-than-NTAG213 aisle does not exist — NTAG213 is the legitimate cost floor and cheaper usually means counterfeit. Everything else — tap-to-URL, review cards, tickets, business cards — happily stays with NTAG21x.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHEN TO LEAVE THE NTAG21x AISLE</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Five jobs need a different chip — everything else stays</text>

<rect x="46" y="130" width="356" height="222" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="70" y="166" font-size="15.5" font-weight="700" fill="#291c0e">Per-tap anti-counterfeit URLs</text>
<text x="70" y="194" font-size="13" fill="#4f4f4f">Rolling SUN links that change on every</text>
<text x="70" y="216" font-size="13" fill="#4f4f4f">read — beyond any 21x, at any memory size.</text>
<rect x="70" y="296" width="308" height="32" rx="16" fill="#f9f1e2" stroke="#e4c98f"/>
<text x="224" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">→ NTAG 424 DNA</text>

<rect x="430" y="130" width="356" height="222" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="454" y="166" font-size="15.5" font-weight="700" fill="#291c0e">Multi-app credentials, stored value</text>
<text x="454" y="194" font-size="13" fill="#4f4f4f">Employee badges, transit purses, campus</text>
<text x="454" y="216" font-size="13" fill="#4f4f4f">cash — AES mutual auth, multiple app keys.</text>
<rect x="454" y="296" width="308" height="32" rx="16" fill="#eef5f5" stroke="#cfe0e0"/>
<text x="608" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">→ MIFARE DESFire EV2/EV3</text>

<rect x="814" y="130" width="356" height="222" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="838" y="166" font-size="15.5" font-weight="700" fill="#291c0e">Longer HF range (vicinity)</text>
<text x="838" y="194" font-size="13" fill="#4f4f4f">Library shelves and asset scans at ~1.5 m —</text>
<text x="838" y="216" font-size="13" fill="#4f4f4f">NTAG21x tops out around 10 cm.</text>
<rect x="838" y="296" width="308" height="32" rx="16" fill="#eef5f5" stroke="#cfe0e0"/>
<text x="992" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">→ ICODE SLI / SLIX (ISO 15693)</text>

<rect x="46" y="376" width="356" height="222" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="70" y="412" font-size="15.5" font-weight="700" fill="#291c0e">Warehouse-distance reads</text>
<text x="70" y="440" font-size="13" fill="#4f4f4f">Dock doors and pallets are UHF jobs —</text>
<text x="70" y="462" font-size="13" fill="#4f4f4f">metres of range, no smartphone taps.</text>
<rect x="70" y="542" width="308" height="32" rx="16" fill="#eef1f5" stroke="#d3dae3"/>
<text x="224" y="563" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">→ EPC Gen2 / NTAG + UCODE combo</text>

<rect x="430" y="376" width="356" height="222" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="454" y="412" font-size="15.5" font-weight="700" fill="#291c0e">A cheaper aisle</text>
<text x="454" y="440" font-size="13" fill="#4f4f4f">Does not exist. NTAG213 is the legitimate</text>
<text x="454" y="462" font-size="13" fill="#4f4f4f">cost floor — cheaper usually means fake.</text>
<rect x="454" y="542" width="308" height="32" rx="16" fill="#f9f1e2" stroke="#e4c98f"/>
<text x="608" y="563" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">→ stay honest, stay NTAG213</text>

<rect x="814" y="376" width="356" height="222" rx="16" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="2"/>
<text x="838" y="412" font-size="15.5" font-weight="700" fill="#1b4332">Everything else</text>
<text x="838" y="440" font-size="13" fill="#4f4f4f">Tap-to-URL, review cards, tickets, business</text>
<text x="838" y="462" font-size="13" fill="#4f4f4f">cards, smart posters, Wi-Fi handover.</text>
<rect x="838" y="542" width="308" height="32" rx="16" fill="#2d6a4f"/>
<text x="992" y="563" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">→ stay with NTAG21x</text>

<text x="600" y="634" text-anchor="middle" font-size="13.5" fill="#5c5c5c">If the job sits in one of the first five cards, more bytes will not save you — change families.</text>
</svg>
