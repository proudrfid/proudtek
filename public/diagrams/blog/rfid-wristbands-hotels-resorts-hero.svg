<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">One hotel RFID wristband serves as room key, cashless payment, zone access and guest ID</title>
<desc id="d">A hotel and resort RFID wristband at the center connects to four guest-facing jobs. Room key: the band is encoded at the same desktop encoder as a plastic key card. Cashless charge: a tap posts to the room folio and lifts ancillary spend 15 to 30 percent. Zone access: pool, spa, kids club and lockers are each authorized per amenity. Guest ID: digital signage greets guests by name and loyalty works in one tap. One waterproof credential stays on the wrist from check-in to check-out.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOTEL &amp; RESORT RFID · ONE WEARABLE CREDENTIAL</text>
<text x="600" y="104" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#291c0e">One band, the whole stay</text>
<text x="600" y="140" text-anchor="middle" font-size="16" fill="#4f4f4f">Room key, cashless charge, zone access and guest ID — on the wrist from check-in to check-out.</text>

<line x1="600" y1="400" x2="380" y2="270" stroke="#a9cccc" stroke-width="2.5"/>
<line x1="600" y1="400" x2="820" y2="270" stroke="#a9cccc" stroke-width="2.5"/>
<line x1="600" y1="400" x2="380" y2="530" stroke="#a9cccc" stroke-width="2.5"/>
<line x1="600" y1="400" x2="820" y2="530" stroke="#a9cccc" stroke-width="2.5"/>

<rect x="80" y="210" width="300" height="120" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<rect x="80" y="210" width="9" height="120" rx="4" fill="#3d6b6b"/>
<text x="112" y="250" font-size="18" font-weight="800" fill="#2c5454">ROOM KEY</text>
<text x="112" y="280" font-size="13.5" fill="#291c0e">Encoded at the same desktop</text>
<text x="112" y="302" font-size="13.5" fill="#4f4f4f">encoder as a plastic key card.</text>

<rect x="820" y="210" width="300" height="120" rx="14" fill="#eef7f0" stroke="#2d6a4f" stroke-width="1.6"/>
<rect x="820" y="210" width="9" height="120" rx="4" fill="#2d6a4f"/>
<text x="852" y="250" font-size="18" font-weight="800" fill="#1f6f3a">CASHLESS CHARGE</text>
<text x="852" y="280" font-size="13.5" fill="#291c0e">Tap posts to the room folio —</text>
<text x="852" y="302" font-size="13.5" fill="#4f4f4f">ancillary spend up 15–30%.</text>

<rect x="80" y="470" width="300" height="120" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.6"/>
<rect x="80" y="470" width="9" height="120" rx="4" fill="#c39a5f"/>
<text x="112" y="510" font-size="18" font-weight="800" fill="#6d5a3a">ZONE ACCESS</text>
<text x="112" y="540" font-size="13.5" fill="#291c0e">Pool, spa, kids' club, lockers —</text>
<text x="112" y="562" font-size="13.5" fill="#4f4f4f">authorized per amenity.</text>

<rect x="820" y="470" width="300" height="120" rx="14" fill="#f4f6f9" stroke="#4a5568" stroke-width="1.6"/>
<rect x="820" y="470" width="9" height="120" rx="4" fill="#4a5568"/>
<text x="852" y="510" font-size="18" font-weight="800" fill="#4a5568">GUEST ID</text>
<text x="852" y="540" font-size="13.5" fill="#291c0e">Signage greets guests by name;</text>
<text x="852" y="562" font-size="13.5" fill="#4f4f4f">loyalty and prefs in one tap.</text>

<circle cx="600" cy="400" r="94" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.5"/>
<text x="600" y="360" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1" fill="#2c5454">ONE BAND</text>
<rect x="548" y="378" width="104" height="42" rx="21" fill="#3d6b6b"/>
<rect x="584" y="389" width="32" height="20" rx="3" fill="#ffffff" stroke="#234a4a" stroke-width="1.5"/>
<rect x="593" y="394" width="14" height="10" rx="2" fill="#d4a755"/>
<text x="600" y="452" text-anchor="middle" font-size="13.5" fill="#5c5c5c">= the whole stay</text>

<text x="600" y="636" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The one credential a guest can swim, shower and buy a drink with — no plastic card to lose.</text>
</svg>
