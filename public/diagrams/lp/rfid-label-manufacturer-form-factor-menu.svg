<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Proud Tek label and inlay capability menu: one program resolved into five converting families and one applicator-ready roll</title>
  <desc id="d">A left-to-right map. On the left, a card labelled YOUR LABEL PROGRAM (surface, chip, size, volume). In the centre, five converting lanes: UHF RAIN paper and synthetic labels (Impinj M700, NXP UCODE 8/9 at 860-960 MHz); HF/NFC labels (NTAG 213, ICODE SLIX at 13.56 MHz); tamper-evident labels (NTAG 213 with a destructible antenna); UHF wet inlays on 76 mm cores (Impinj M700, NXP UCODE 9); and dry inlays for lamination (NTAG 213, NXP UCODE 8, no adhesive). All five converge on the right into ONE CONVERTED ROLL: printed, encoded, 100% read-verified, applicator-ready.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">LABEL &amp; INLAY CAPABILITY MENU</text>
  <text x="600" y="99" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">One program, six formats, one roll</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">Every family runs to a published air-interface standard — no reader-locked inlays.</text>

  <!-- connectors: program to lanes -->
  <path d="M252,383 L300,191" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M252,383 L300,287" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M252,383 L300,383" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M252,383 L300,479" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M252,383 L300,575" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <!-- connectors: lanes to roll -->
  <path d="M900,191 L946,387" stroke="#4a5568" stroke-width="2" fill="none"/>
  <path d="M900,287 L946,387" stroke="#4a5568" stroke-width="2" fill="none"/>
  <path d="M900,383 L946,387" stroke="#4a5568" stroke-width="2" fill="none"/>
  <path d="M900,479 L946,387" stroke="#4a5568" stroke-width="2" fill="none"/>
  <path d="M900,575 L946,387" stroke="#4a5568" stroke-width="2" fill="none"/>

  <!-- program card -->
  <rect x="48" y="308" width="204" height="150" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="150" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">YOUR</text>
  <text x="150" y="374" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">LABEL PROGRAM</text>
  <text x="150" y="406" text-anchor="middle" font-size="13" fill="#5c5c5c">surface, chip,</text>
  <text x="150" y="426" text-anchor="middle" font-size="13" fill="#5c5c5c">size, volume</text>

  <!-- lane 1: UHF paper & synthetic -->
  <rect x="300" y="150" width="600" height="82" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="150" width="7" height="82" rx="3" fill="#4a5568"/>
  <text x="324" y="184" font-size="18" font-weight="700" fill="#291c0e">UHF RAIN paper &amp; synthetic labels</text>
  <text x="324" y="212" font-size="14" fill="#5c5c5c">Impinj M700 · NXP UCODE 8/9 · 860-960 MHz</text>

  <!-- lane 2: HF / NFC -->
  <rect x="300" y="246" width="600" height="82" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="246" width="7" height="82" rx="3" fill="#3d6b6b"/>
  <text x="324" y="280" font-size="18" font-weight="700" fill="#291c0e">HF / NFC labels</text>
  <text x="324" y="308" font-size="14" fill="#5c5c5c">NTAG 213 · ICODE SLIX · 13.56 MHz</text>

  <!-- lane 3: tamper-evident -->
  <rect x="300" y="342" width="600" height="82" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="342" width="7" height="82" rx="3" fill="#c39a5f"/>
  <text x="324" y="376" font-size="18" font-weight="700" fill="#291c0e">Tamper-evident labels</text>
  <text x="324" y="404" font-size="14" fill="#5c5c5c">NTAG 213 · frangible, destructible antenna</text>

  <!-- lane 4: UHF wet inlays -->
  <rect x="300" y="438" width="600" height="82" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="438" width="7" height="82" rx="3" fill="#4a5568"/>
  <text x="324" y="472" font-size="18" font-weight="700" fill="#291c0e">UHF wet inlays — converter rolls</text>
  <text x="324" y="500" font-size="14" fill="#5c5c5c">Impinj M700 · NXP UCODE 9 · 76 mm core</text>

  <!-- lane 5: dry inlays -->
  <rect x="300" y="534" width="600" height="82" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="534" width="7" height="82" rx="3" fill="#6d5a3a"/>
  <text x="324" y="568" font-size="18" font-weight="700" fill="#291c0e">Dry inlays — lamination stock</text>
  <text x="324" y="596" font-size="14" fill="#5c5c5c">NTAG 213 · NXP UCODE 8 · no adhesive</text>

  <!-- converted-roll card -->
  <rect x="946" y="300" width="206" height="174" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="1049" y="340" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.2" fill="#6d5a3a">ONE CONVERTED ROLL</text>
  <text x="1049" y="376" text-anchor="middle" font-size="14" fill="#291c0e">Printed · encoded</text>
  <text x="1049" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">100% read-verified</text>
  <text x="1049" y="432" text-anchor="middle" font-size="14" fill="#291c0e">Applicator-ready</text>
  <text x="1049" y="458" text-anchor="middle" font-size="13" fill="#5c5c5c">straight to your dock</text>
</svg>
