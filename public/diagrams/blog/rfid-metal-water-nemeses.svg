<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The two nemeses: metal detunes UHF, water swallows it</title>
<desc id="d">Split diagram. Left panel, bare metal versus UHF: a stock inlay flat on a steel plate detunes and read range collapses from 5 metres to under 0.2 metres; the fix is an on-metal tag with a foam or ceramic spacer, which restores 1 to 5 metres. Right panel, water and skin versus UHF: a bottle and a wristband absorb the 860-960 MHz signal, losing 60 to 80 percent of range, while LF and HF slip through liquid and tissue — which is why hospital wristbands and pharma packs default to them.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<pattern id="steel" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#eef1f5"/><line x1="0" y1="0" x2="0" y2="14" stroke="#d3dae3" stroke-width="4"/></pattern>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE TWO NEMESES OF UHF</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Metal reflects the signal · water drinks it</text>

<rect x="46" y="130" width="546" height="450" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="319" y="170" text-anchor="middle" font-size="17" font-weight="800" fill="#4a5568">BARE METAL vs UHF</text>

<rect x="96" y="240" width="440" height="46" rx="6" fill="url(#steel)" stroke="#4a5568" stroke-width="2"/>
<rect x="236" y="216" width="160" height="24" rx="4" fill="#f9f1e2" stroke="#c39a5f" stroke-width="2"/>
<text x="316" y="233" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6d5a3a">stock inlay, flat on steel</text>
<path d="M 180 208 q -20 -34 6 -60" fill="none" stroke="#8b2d2d" stroke-width="2.5"/>
<path d="M 186 148 l -12 4 8 10 z" fill="#8b2d2d"/>
<text x="319" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#8b2d2d">detunes: 5 m → &lt;0.2 m</text>

<rect x="236" y="404" width="160" height="18" rx="3" fill="#c39a5f"/>
<rect x="236" y="422" width="160" height="12" rx="3" fill="#eef1f5" stroke="#d3dae3"/>
<rect x="96" y="434" width="440" height="42" rx="6" fill="url(#steel)" stroke="#4a5568" stroke-width="2"/>
<text x="452" y="416" font-size="12.5" fill="#4f4f4f">tag</text>
<text x="452" y="434" font-size="12.5" fill="#4f4f4f">spacer</text>
<text x="319" y="516" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6f3a">on-metal tag + spacer: 1–5 m back</text>
<text x="319" y="544" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Confidex Ironside · Xerafy Mercury · Omni-ID Power 415 · $0.30–$2.50</text>

<rect x="608" y="130" width="546" height="450" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="881" y="170" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">WATER &amp; SKIN vs UHF</text>

<path d="M 730 230 h 60 v 30 q 24 18 24 52 v 118 q 0 14 -14 14 h -80 q -14 0 -14 -14 v -118 q 0 -34 24 -52 z" fill="#eef5f5" stroke="#2c5454" stroke-width="2.5"/>
<path d="M 712 330 q 24 -12 48 0 t 48 0" fill="none" stroke="#3d6b6b" stroke-width="2.5" opacity="0.8"/>
<path d="M 712 362 q 24 -12 48 0 t 48 0" fill="none" stroke="#3d6b6b" stroke-width="2" opacity="0.5"/>
<text x="760" y="474" text-anchor="middle" font-size="13.5" font-weight="600" fill="#291c0e">bottle contents</text>

<path d="M 960 260 a 52 30 0 1 0 0.1 0" fill="none" stroke="#2c5454" stroke-width="14" opacity="0.25"/>
<rect x="932" y="238" width="56 " height="22" rx="8" fill="#f9f1e2" stroke="#c39a5f" stroke-width="2"/>
<text x="960" y="330" text-anchor="middle" font-size="13.5" font-weight="600" fill="#291c0e">wristband on skin</text>

<path d="M 1030 380 a 30 30 0 0 1 0 60" fill="none" stroke="#8b2d2d" stroke-width="2.5" opacity="0.9"/>
<path d="M 1046 368 a 46 46 0 0 1 0 84" fill="none" stroke="#8b2d2d" stroke-width="2" opacity="0.5" stroke-dasharray="6 8"/>
<path d="M 1062 356 a 62 62 0 0 1 0 108" fill="none" stroke="#8b2d2d" stroke-width="1.5" opacity="0.25" stroke-dasharray="3 10"/>
<text x="881" y="416" text-anchor="middle" font-size="16" font-weight="700" fill="#8b2d2d">60–80% of range lost near liquid</text>
<text x="881" y="516" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6f3a">LF &amp; HF slip through — wristbands &amp; pharma default to them</text>
<text x="881" y="544" text-anchor="middle" font-size="12.5" fill="#4f4f4f">UHF on liquids needs high-Q tags: Avery AD-228m6 · Smartrac Frog-3D</text>

<text x="600" y="626" text-anchor="middle" font-size="14" fill="#5c5c5c">Pick the wrong band for the surface and you lose 50–90% of the read budget before the system leaves the lab.</text>
</svg>
