<text x="860" y="536" text-anchor="middle" font-size="13" fill="#4f4f4f">4K variant: 40 sectors — first 32 standard, last 8 double-size.</text>

<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Red block = the sector trailer holding the keys. Same structure, and the same Crypto-1, whether 1K or 4K.</text>
