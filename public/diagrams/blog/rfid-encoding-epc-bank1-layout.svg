<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">EPC Bank 1 laid out end to end — CRC-16, the PC word, then the EPC content</title>
<desc id="d">A segmented bar shows EPC Gen2 Bank 1 from the top: a green 16-bit CRC-16 the chip computes automatically, a gold 16-bit Protocol Control word that you set, and the teal EPC content of 96 to 496 bits beginning at word 2. Dashed connectors expand the PC word into three fields: the EPC length in the top 5 bits, the AFI and UMI flags, and the XPC indicator meaning more control words follow. A red warning band notes that declaring the length wrong makes the tag read as corrupted, because readers honor the PC word rather than the actual size of what you wrote. Footnote: whichever GS1 scheme you encode — SGTIN-96, GIAI-96, GRAI-96, GLN-96, SSCC-96 — the PC word still rules the read.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EPC GEN2 BANK 1 — WHERE EXPENSIVE MISTAKES LIVE</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Bank 1, laid out end to end</text>

<!-- main bar -->
<rect x="84" y="140" width="170" height="78" rx="10" fill="#1f6f3a"/>
<text x="169" y="172" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">CRC-16</text>
<text x="169" y="194" text-anchor="middle" font-size="12.5" fill="#d6e9dc">16 bits · auto</text>
<rect x="262" y="140" width="210" height="78" rx="10" fill="#c39a5f"/>
<text x="367" y="172" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">PC word</text>
<text x="367" y="194" text-anchor="middle" font-size="12.5" fill="#52401f">16 bits · you set this</text>
<rect x="480" y="140" width="636" height="78" rx="10" fill="#3d6b6b"/>
<text x="798" y="172" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">EPC content</text>
<text x="798" y="194" text-anchor="middle" font-size="12.5" fill="#cfe0e0">96–496 bits · begins at word 2</text>

<text x="84" y="246" font-size="12.5" fill="#4f4f4f">computed for you</text>

<!-- zoom connectors -->
<line x1="270" y1="222" x2="152" y2="300" stroke="#c39a5f" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="464" y1="222" x2="1048" y2="300" stroke="#c39a5f" stroke-width="2" stroke-dasharray="6 6"/>

<!-- PC word zoom -->
<rect x="120" y="300" width="960" height="170" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="146" y="336" font-size="14.5" font-weight="800" fill="#6d5a3a">Inside the 16-bit PC word</text>
<rect x="146" y="352" width="280" height="84" rx="10" fill="#2c5454"/>
<text x="286" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">EPC length</text>
<text x="286" y="410" text-anchor="middle" font-size="12.5" fill="#cfe0e0">top 5 bits — declares the EPC's size</text>
<rect x="442" y="352" width="280" height="84" rx="10" fill="#3d6b6b"/>
<text x="582" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">AFI / UMI flags</text>
<text x="582" y="410" text-anchor="middle" font-size="12.5" fill="#cfe0e0">application family · user-memory flag</text>
<rect x="738" y="352" width="316" height="84" rx="10" fill="#6d5a3a"/>
<text x="896" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">XPC indicator</text>
<text x="896" y="410" text-anchor="middle" font-size="12.5" fill="#e8ddca">'more control words follow'</text>

<!-- warning band -->
<rect x="120" y="506" width="960" height="76" rx="12" fill="#f7e9e9" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="600" y="538" text-anchor="middle" font-size="15" font-weight="800" fill="#8b2d2d">Declare the length wrong and the tag 'reads but looks corrupted'</text>
<text x="600" y="562" text-anchor="middle" font-size="13" font-weight="600" fill="#8b2d2d">Readers honor the PC word — not the actual size of what you wrote.</text>

<text x="600" y="628" text-anchor="middle" font-size="13.5" fill="#5c5c5c">SGTIN-96 · GIAI-96 · GRAI-96 · GLN-96 · SSCC-96 — whichever scheme you encode, the PC word still rules the read.</text>
</svg>
