<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Event operations flow for coconut-shell RFID wristbands</title>
<desc id="d">A five-stage operations flow. One, encode each wristband with a unique ticket ID using a desktop NFC writer. Two, hand out at the gate in 10 to 15 seconds per attendee. Three, tap for access and payment at a 2 to 5 centimetre read range. Four, a lost band is deactivated and reissued, the same as any plastic band. Five, end of life: the shell composts and the chip is recovered, needing no special waste handling. The only step that differs from a plastic band is the last one.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EVENT OPERATIONS FLOW</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">Same as any RFID wristband, from the encoding desk to end-of-life.</text>

<!-- card 1 -->
<rect x="40" y="190" width="196" height="250" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="40" y="190" width="196" height="7" rx="3.5" fill="#3d6b6b"/>
<circle cx="70" cy="228" r="14" fill="#3d6b6b"/>
<text x="70" y="234" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="138" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Encode</text>
<text x="138" y="324" text-anchor="middle" font-size="12" fill="#5c5c5c">unique ticket ID</text>
<rect x="54" y="352" width="168" height="32" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="138" y="373" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">desktop NFC writer</text>

<!-- card 2 -->
<rect x="272" y="190" width="196" height="250" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="272" y="190" width="196" height="7" rx="3.5" fill="#3d6b6b"/>
<circle cx="302" cy="228" r="14" fill="#3d6b6b"/>
<text x="302" y="234" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="370" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Hand out</text>
<text x="370" y="324" text-anchor="middle" font-size="12" fill="#5c5c5c">at the gate</text>
<rect x="286" y="352" width="168" height="32" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="370" y="373" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">10-15 sec each</text>

<!-- card 3 -->
<rect x="504" y="190" width="196" height="250" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="504" y="190" width="196" height="7" rx="3.5" fill="#3d6b6b"/>
<circle cx="534" cy="228" r="14" fill="#3d6b6b"/>
<text x="534" y="234" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
<text x="602" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Tap</text>
<text x="602" y="324" text-anchor="middle" font-size="12" fill="#5c5c5c">access + payment</text>
<rect x="518" y="352" width="168" height="32" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="602" y="373" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">2-5 cm read</text>

<!-- card 4 : lost band -->
<rect x="736" y="190" width="196" height="250" rx="13" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="736" y="190" width="196" height="7" rx="3.5" fill="#c39a5f"/>
<circle cx="766" cy="228" r="14" fill="#c39a5f"/>
<text x="766" y="234" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
<text x="834" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Lost band</text>
<text x="834" y="324" text-anchor="middle" font-size="12" fill="#6d5a3a">deactivate + reissue</text>
<rect x="750" y="352" width="168" height="32" rx="16" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="834" y="373" text-anchor="middle" font-size="12" font-weight="800" fill="#8a6d34">same as plastic</text>

<!-- card 5 : end of life -->
<rect x="968" y="190" width="196" height="250" rx="13" fill="#ffffff" stroke="#cfe3d6" stroke-width="1.6"/>
<rect x="968" y="190" width="196" height="7" rx="3.5" fill="#2d6a4f"/>
<circle cx="998" cy="228" r="14" fill="#2d6a4f"/>
<text x="998" y="234" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">5</text>
<text x="1066" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">End of life</text>
<text x="1066" y="324" text-anchor="middle" font-size="12" fill="#5c5c5c">compost + recover chip</text>
<rect x="982" y="352" width="168" height="32" rx="16" fill="#e9f3ec" stroke="#cfe3d6" stroke-width="1.2"/>
<text x="1066" y="373" text-anchor="middle" font-size="12" font-weight="800" fill="#1b4332">no special waste</text>

<!-- arrows -->
<line x1="240" y1="300" x2="268" y2="300" stroke="#291c0e" stroke-width="3"/>
<polygon points="268,294 276,300 268,306" fill="#291c0e"/>
<line x1="472" y1="300" x2="500" y2="300" stroke="#291c0e" stroke-width="3"/>
<polygon points="500,294 508,300 500,306" fill="#291c0e"/>
<line x1="704" y1="300" x2="732" y2="300" stroke="#291c0e" stroke-width="3"/>
<polygon points="732,294 740,300 732,306" fill="#291c0e"/>
<line x1="936" y1="300" x2="964" y2="300" stroke="#291c0e" stroke-width="3"/>
<polygon points="964,294 972,300 964,306" fill="#291c0e"/>

<text x="600" y="560" text-anchor="middle" font-size="14.5" fill="#5c5c5c">The natural material changes the disposal step, not the operations.</text>
</svg>
