<line x1="812" y1="228" x2="812" y2="452" stroke="#ece6d8" stroke-width="1.2"/>
<line x1="948" y1="228" x2="948" y2="452" stroke="#ece6d8" stroke-width="1.2"/>
<text x="96" y="262" font-size="14" font-weight="800" fill="#291c0e">8542.31</text>
<text x="236" y="262" font-size="12.5" fill="#4f4f4f">RFID chip (wafer / bare die)</text>
<text x="566" y="262" font-size="13" font-weight="700" fill="#2d6a4f">0%</text>
<text x="832" y="262" font-size="13" font-weight="700" fill="#2d6a4f">0%</text>
<text x="966" y="262" font-size="12.5" fill="#8a8172">—</text>
