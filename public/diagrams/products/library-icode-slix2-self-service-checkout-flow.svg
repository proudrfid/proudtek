<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Self-service checkout and EAS-gate flow for the ICODE SLIX2 library deployment</title>
  <desc id="d">A patron brings a stack of 20 to 30 items to the self-checkout kiosk, where ISO 15693 anti-collision reads the whole stack in one sweep at 30 to 80 cm and toggles the AFI security flag to disarm the gate while the loan is logged to the circulation system. At the EAS security gate the reader checks the AFI flag at 80 to 120 cm: a disarmed item passes silently, an item still armed trips the alarm. On return, check-in re-arms the AFI bit and the robotic sorter flags wrong-branch items before re-shelving.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE SELF-SERVICE CHECKOUT PATH</text>
  <text x="600" y="80" text-anchor="middle" font-size="15" fill="#5c5c5c">ISO 15693 anti-collision reads the stack; one AFI bit works the gate</text>

  <!-- top row: check-out flow -->
  <rect x="48" y="110" width="250" height="150" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
  <text x="68" y="140" font-size="15" font-weight="700" fill="#291c0e">1 · PATRON</text>
  <text x="68" y="170" font-size="13" fill="#5c5c5c">Brings a stack of</text>
  <text x="68" y="192" font-size="13" fill="#5c5c5c">20–30 items to the</text>
  <text x="68" y="214" font-size="13" fill="#5c5c5c">self-service kiosk</text>

  <rect x="362" y="110" width="340" height="150" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.5"/>
  <text x="382" y="140" font-size="15" font-weight="700" fill="#2c5454">2 · SELF-CHECKOUT KIOSK</text>
  <text x="382" y="168" font-size="13" fill="#5c5c5c">ISO 15693 anti-collision reads the</text>
  <text x="382" y="188" font-size="13" fill="#291c0e">whole stack in one sweep · 30–80 cm</text>
  <text x="382" y="214" font-size="13" fill="#291c0e">AFI bit toggled to disarm the gate</text>
  <text x="382" y="240" font-size="13" fill="#5c5c5c">Loan logged to circulation system (WMS)</text>

  <rect x="766" y="110" width="386" height="150" rx="12" fill="#ffffff" stroke="#4a5568" stroke-width="2.5"/>
  <text x="786" y="140" font-size="15" font-weight="700" fill="#291c0e">3 · EAS SECURITY GATE</text>
  <text x="786" y="170" font-size="13" fill="#291c0e">Reads the AFI flag at 80–120 cm</text>
  <text x="786" y="196" font-size="13" fill="#5c5c5c">Disarmed item passes silently —</text>
  <text x="786" y="218" font-size="13" fill="#5c5c5c">the security lives in the chip</text>

  <line x1="298" y1="185" x2="360" y2="185" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="702" y1="185" x2="764" y2="185" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- alarm exception (genuine failure state → red) -->
  <line x1="959" y1="260" x2="959" y2="276" stroke="#8b2d2d" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="766" y="278" width="386" height="64" rx="10" fill="#f7e7e2" stroke="#8b2d2d" stroke-width="2"/>
  <text x="786" y="306" font-size="13.5" font-weight="700" fill="#8b2d2d">Exception — item still armed</text>
  <text x="786" y="328" font-size="13" fill="#8b2d2d">at the gate → alarm sounds</text>

  <!-- return lane -->
  <text x="68" y="372" font-size="13" font-weight="800" letter-spacing="0.6" fill="#6d5a3a">RETURN PATH</text>
  <rect x="48" y="388" width="336" height="96" rx="12" fill="#ffffff" stroke="#c3ccd6" stroke-width="2"/>
  <text x="68" y="416" font-size="15" font-weight="700" fill="#291c0e">4 · RETURN &amp; CHECK-IN</text>
  <text x="68" y="444" font-size="13" fill="#5c5c5c">AFI bit re-armed at check-in,</text>
  <text x="68" y="466" font-size="13" fill="#5c5c5c">re-arming the gate for that item</text>

  <rect x="432" y="388" width="336" height="96" rx="12" fill="#ffffff" stroke="#c3ccd6" stroke-width="2"/>
  <text x="452" y="416" font-size="15" font-weight="700" fill="#291c0e">5 · ROBOTIC SORTER</text>
  <text x="452" y="444" font-size="13" fill="#5c5c5c">Flags wrong-branch returns</text>
  <text x="452" y="466" font-size="13" fill="#5c5c5c">before they are re-shelved</text>

  <rect x="816" y="388" width="336" height="96" rx="12" fill="#ffffff" stroke="#c3ccd6" stroke-width="2"/>
  <text x="836" y="416" font-size="15" font-weight="700" fill="#291c0e">6 · BACK ON SHELF</text>
  <text x="836" y="444" font-size="13" fill="#5c5c5c">Right branch, right shelf —</text>
  <text x="836" y="466" font-size="13" fill="#5c5c5c">caught before mis-filing</text>

  <line x1="384" y1="436" x2="430" y2="436" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="768" y1="436" x2="814" y2="436" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- bottom callout -->
  <rect x="48" y="508" width="1104" height="128" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="72" y="540" font-size="15" font-weight="700" fill="#2c5454">One tag, two jobs — the catalogue ID drives circulation, the AFI security flag drives EAS.</text>
  <text x="72" y="568" font-size="13.5" fill="#3d6b6b">ISO 15693 anti-collision reads a full stack at once; ISO 14443 (MIFARE / NTAG) cannot at vicinity range.</text>
  <text x="72" y="596" font-size="13.5" fill="#3d6b6b">No separate security strip to buy, tune, or set off as a false alarm.</text>
</svg>
