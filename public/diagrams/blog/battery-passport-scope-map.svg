<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="scopet scoped" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="scopet">EU Battery Passport scope</title>
  <desc id="scoped">What the EU Battery Passport applies to under Regulation (EU) 2023/1542: batteries over 2 kWh placed on the EU market from 18 February 2027 — EV traction packs, industrial stationary storage, and light-means-of-transport batteries such as e-bikes, e-scooters and e-cargo bikes. The mandatory carrier is a machine-readable QR code plus a persistent unique identifier, with NFC and RFID accepted as supplementary carriers and cross-border data expressed in GS1 / CIRPASS schemas. Consumer laptop and phone batteries are excluded in the first wave.</desc>
  <defs><radialGradient id="scopebg" cx="50%" cy="16%" r="95%"><stop offset="0%" stop-color="#f8f0df"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#scopebg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="24" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="57" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="1.3" fill="#6d5a3a">What the EU Battery Passport covers</text>
  <rect x="70" y="40" width="226" height="34" rx="17" fill="#fdf8ef" stroke="#c39a5f" stroke-width="1.4"/>
  <text x="183.0" y="62.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#c39a5f">Reg (EU) 2023/1542</text>
  <rect x="904" y="40" width="226" height="34" rx="17" fill="#f0f6f2" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="1017.0" y="62.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2d6a4f">Applies 18 Feb 2027</text>
  <rect x="470" y="80" width="260" height="38" rx="19" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="600.0" y="105.0" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Capacity over 2 kWh</text>
  <rect x="75" y="148" width="330" height="286" rx="18" fill="#f0f6f2" stroke="#2d6a4f" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="75" y="148" width="330" height="8" rx="4" fill="#2d6a4f"/>
  <circle cx="240.0" cy="200" r="32" fill="#2d6a4f"/>
  <rect x="220.0" y="188" width="34" height="24" rx="4" fill="none" stroke="#fff" stroke-width="3"/><rect x="254.0" y="195" width="5" height="10" rx="2" fill="#fff"/><polyline points="238.0,191 231.0,201 238.0,201 235.0,209 247.0,197 240.0,197 238.0,191" fill="#fff" stroke="#fff" stroke-width="1" stroke-linejoin="round"/>
  <text x="240.0" y="258.0" text-anchor="middle" font-size="22" font-weight="800" fill="#291c0e">EV traction</text>
  <rect x="140.0" y="270" width="200.0" height="40" rx="20" fill="#dcebe1" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="240.0" y="297.0" text-anchor="middle" font-size="17" font-weight="800" fill="#2d6a4f">Drive batteries</text>
  <text x="240.0" y="336.0" text-anchor="middle" font-size="15.5" font-weight="400" fill="#4f4f4f">Electric-vehicle</text>
  <text x="240.0" y="358.0" text-anchor="middle" font-size="15.5" font-weight="400" fill="#4f4f4f">traction packs.</text>
  <rect x="435" y="148" width="330" height="286" rx="18" fill="#f1f3f6" stroke="#4a5568" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="435" y="148" width="330" height="8" rx="4" fill="#4a5568"/>
  <circle cx="600.0" cy="200" r="32" fill="#4a5568"/>
  <rect x="582.0" y="188" width="36" height="7" rx="2.5" fill="#fff"/><rect x="582.0" y="198" width="36" height="7" rx="2.5" fill="#fff"/><rect x="582.0" y="208" width="36" height="7" rx="2.5" fill="#fff"/>
  <text x="600.0" y="258.0" text-anchor="middle" font-size="22" font-weight="800" fill="#291c0e">Industrial</text>
  <rect x="500.0" y="270" width="200.0" height="40" rx="20" fill="#e2e6ec" stroke="#4a5568" stroke-width="1.5"/>
  <text x="600.0" y="297.0" text-anchor="middle" font-size="17" font-weight="800" fill="#4a5568">Stationary storage</text>
  <text x="600.0" y="336.0" text-anchor="middle" font-size="15.5" font-weight="400" fill="#4f4f4f">Grid and on-site</text>
  <text x="600.0" y="358.0" text-anchor="middle" font-size="15.5" font-weight="400" fill="#4f4f4f">energy storage.</text>
  <rect x="795" y="148" width="330" height="286" rx="18" fill="#eef5f5" stroke="#3d6b6b" stroke-opacity="0.35" stroke-width="2"/>
