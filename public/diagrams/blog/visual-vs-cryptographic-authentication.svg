<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Visual security features are copyable; a cryptographic secret is not</title>
<desc id="d">Top row shows three visual anti-counterfeit features — a hologram, a static serial number, and a security ink — each labelled copyable and reproduced within months of introduction. A downward arrow marks the shift from looking to proving. The bottom panel shows cryptographic challenge and response: the chip holds a secret AES-128 key, the server issues a challenge, and only a chip that knows the key can answer, so a copy cannot pass.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY VISUAL SECURITY FAILS</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="29" font-weight="700" fill="#291c0e">You can photograph a hologram. You can't photograph a secret.</text>

<!-- TOP ROW: copyable visual features -->
<g>
<rect x="78" y="138" width="330" height="150" rx="14" fill="#f8ecec" stroke="#e6c9c9" stroke-width="2"/>
<circle cx="140" cy="196" r="26" fill="#efd7a8" stroke="#c39a5f" stroke-width="2"/>
<path d="M126 196 a14 9 0 0 0 28 0 a14 9 0 0 0 -28 0" fill="none" stroke="#a9843f" stroke-width="2"/>
<text x="182" y="184" font-size="18" font-weight="800" fill="#291c0e">Hologram</text>
<text x="182" y="210" font-size="13.5" fill="#5c5c5c">hot-stamped copies within</text>
<text x="182" y="230" font-size="13.5" fill="#5c5c5c">months of launch</text>
<rect x="182" y="248" width="96" height="24" rx="12" fill="#8b2d2d"/>
<text x="230" y="265" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.5" fill="#ffffff">COPYABLE</text>
</g>
<g>
<rect x="435" y="138" width="330" height="150" rx="14" fill="#f8ecec" stroke="#e6c9c9" stroke-width="2"/>
<rect x="472" y="172" width="52" height="48" rx="6" fill="#ffffff" stroke="#c39a9a" stroke-width="2"/>
<text x="498" y="203" text-anchor="middle" font-family="'SFMono-Regular', ui-monospace, Menlo, monospace" font-size="13" fill="#8b6a6a">SN·07</text>
<text x="542" y="184" font-size="18" font-weight="800" fill="#291c0e">Serial number</text>
<text x="542" y="210" font-size="13.5" fill="#5c5c5c">photographed once, reprinted</text>
<text x="542" y="230" font-size="13.5" fill="#5c5c5c">onto every fake</text>
<rect x="542" y="248" width="96" height="24" rx="12" fill="#8b2d2d"/>
<text x="590" y="265" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.5" fill="#ffffff">COPYABLE</text>
</g>
<g>
<rect x="792" y="138" width="330" height="150" rx="14" fill="#f8ecec" stroke="#e6c9c9" stroke-width="2"/>
<circle cx="854" cy="196" r="24" fill="#dfeaea" stroke="#3d6b6b" stroke-width="2"/>
<path d="M854 180 q14 16 0 32 q-14 -16 0 -32" fill="#9ec3c3"/>
<text x="896" y="184" font-size="18" font-weight="800" fill="#291c0e">Security ink</text>
<text x="896" y="210" font-size="13.5" fill="#5c5c5c">turns up on someone else's</text>
<text x="896" y="230" font-size="13.5" fill="#5c5c5c">packaging soon enough</text>
<rect x="896" y="248" width="96" height="24" rx="12" fill="#8b2d2d"/>
<text x="944" y="265" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.5" fill="#ffffff">COPYABLE</text>
</g>

<!-- SHIFT arrow -->
<line x1="600" y1="300" x2="600" y2="352" stroke="#b9a68e" stroke-width="2.5"/>
<polygon points="592,346 600,362 608,346" fill="#b9a68e"/>
<text x="628" y="336" font-size="14.5" font-style="italic" fill="#6d5a3a">the shift: from looking to proving</text>

<!-- BOTTOM: cryptographic challenge-response -->
<rect x="78" y="372" width="1044" height="212" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="2"/>
<text x="110" y="410" font-size="15" font-weight="800" letter-spacing="1" fill="#2c5454">CRYPTOGRAPHIC CHALLENGE — RESPONSE</text>
<rect x="110" y="430" width="150" height="120" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="150" y="470" width="70" height="46" rx="6" fill="#c39a5f"/>
<text x="185" y="498" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">KEY</text>
<text x="185" y="536" text-anchor="middle" font-size="12.5" fill="#4f4f4f">secret AES-128 key</text>
<text x="388" y="462" text-anchor="middle" font-size="13" fill="#33595a">1 · challenge: "sign this"</text>
<line x1="282" y1="474" x2="492" y2="474" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="488,468 500,474 488,480" fill="#3d6b6b"/>
<line x1="492" y1="512" x2="282" y2="512" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="286,506 274,512 286,518" fill="#3d6b6b"/>
<text x="388" y="532" text-anchor="middle" font-size="13" fill="#33595a">2 · signed reply, key stays in</text>
<rect x="500" y="430" width="270" height="120" rx="12" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<path d="M622 458 l12 13 24 -30" fill="none" stroke="#1f6f3a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="635" y="500" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Answer checks out</text>
<text x="635" y="522" text-anchor="middle" font-size="12.5" fill="#4f4f4f">no key, no valid answer —</text>
<text x="635" y="540" text-anchor="middle" font-size="12.5" fill="#4f4f4f">a copy has nothing to sign</text>
<rect x="812" y="454" width="278" height="72" rx="14" fill="#1f6f3a"/>
<text x="951" y="490" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#ffffff">CANNOT BE COPIED</text>
<text x="951" y="512" text-anchor="middle" font-size="12.5" fill="#cfe6d6">the secret never leaves the chip</text>
</svg>
