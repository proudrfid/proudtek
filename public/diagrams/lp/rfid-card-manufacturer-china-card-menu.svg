<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Proud Tek card menu: one program resolved into five chip families and one laminated card line</title>
  <desc id="d">A left-to-right map. On the left, a card labelled YOUR CARD PROGRAM (material, chip, artwork, volume). In the centre, five card families: HF access and membership (MIFARE Classic, Ultralight at 13.56 MHz); secure HF and transit (MIFARE DESFire EV3, NTAG 424 DNA at 13.56 MHz); NFC tap cards (NTAG 213/215/216 at 13.56 MHz); LF legacy access (EM4100, T5577 at 125 kHz); and UHF and vicinity (NXP UCODE, ICODE SLIX). All five converge on the right into ONE CARD LINE: laminated to ISO/IEC 7810, printed and encoded, 100% read-tested.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PROUD TEK CARD MENU</text>
  <text x="600" y="92" text-anchor="middle" font-size="28" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">One program, five families, one card line</text>
  <text x="600" y="118" text-anchor="middle" font-size="14" fill="#5c5c5c">Any chip family, laminated into any body, to ISO/IEC 7810 card dimensions.</text>

  <!-- connectors: project to lanes -->
  <path d="M258,395 L300,190" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,395 L300,292" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,395 L300,394" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,395 L300,496" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,395 L300,598" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <!-- connectors: lanes to card line -->
  <path d="M900,190 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,292 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,394 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,496 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,598 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>

  <!-- project card -->
  <rect x="48" y="320" width="210" height="150" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="153" y="362" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">YOUR</text>
  <text x="153" y="385" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">CARD PROGRAM</text>
  <text x="153" y="418" text-anchor="middle" font-size="13" fill="#5c5c5c">material, chip,</text>
  <text x="153" y="438" text-anchor="middle" font-size="13" fill="#5c5c5c">artwork, volume</text>

  <!-- lane 1: HF access and membership -->
  <rect x="300" y="146" width="600" height="88" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="146" width="7" height="88" rx="3" fill="#c39a5f"/>
  <text x="324" y="180" font-size="18" font-weight="700" fill="#291c0e">HF access &amp; membership</text>
  <text x="324" y="210" font-size="14" fill="#5c5c5c">MIFARE Classic, Ultralight — 13.56 MHz</text>

  <!-- lane 2: secure HF and transit -->
  <rect x="300" y="248" width="600" height="88" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="248" width="7" height="88" rx="3" fill="#4a5568"/>
  <text x="324" y="282" font-size="18" font-weight="700" fill="#291c0e">Secure HF &amp; transit</text>
  <text x="324" y="312" font-size="14" fill="#5c5c5c">MIFARE DESFire EV3, NTAG 424 DNA — 13.56 MHz</text>

  <!-- lane 3: NFC tap cards -->
  <rect x="300" y="350" width="600" height="88" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="350" width="7" height="88" rx="3" fill="#3d6b6b"/>
  <text x="324" y="384" font-size="18" font-weight="700" fill="#291c0e">NFC tap cards</text>
  <text x="324" y="414" font-size="14" fill="#5c5c5c">NTAG 213/215/216 — 13.56 MHz</text>

  <!-- lane 4: LF legacy access -->
  <rect x="300" y="452" width="600" height="88" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="452" width="7" height="88" rx="3" fill="#6d5a3a"/>
  <text x="324" y="486" font-size="18" font-weight="700" fill="#291c0e">LF legacy access</text>
  <text x="324" y="516" font-size="14" fill="#5c5c5c">EM4100, T5577 — 125 kHz</text>

  <!-- lane 5: UHF and vicinity -->
  <rect x="300" y="554" width="600" height="88" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="554" width="7" height="88" rx="3" fill="#2c5454"/>
  <text x="324" y="588" font-size="18" font-weight="700" fill="#291c0e">UHF &amp; vicinity</text>
  <text x="324" y="618" font-size="14" fill="#5c5c5c">NXP UCODE, ICODE SLIX</text>

  <!-- card-line card -->
  <rect x="946" y="306" width="214" height="174" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="1053" y="344" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">ONE CARD LINE</text>
  <text x="1053" y="378" text-anchor="middle" font-size="14" fill="#291c0e">Laminated to</text>
  <text x="1053" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">ISO/IEC 7810</text>
  <text x="1053" y="424" text-anchor="middle" font-size="14" fill="#291c0e">Printed &amp; encoded</text>
  <text x="1053" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">100% read-tested</text>
</svg>
