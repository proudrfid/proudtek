<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Linear versus circular polarized RFID antennas compared</title>
<desc id="d">A two-panel comparison. The left panel covers linear polarized antennas, LPA: they add about 3 dB of gain in the matched plane but drop to near zero signal when a tag is rotated 90 degrees, so they suit fixed-orientation uses like conveyor lines, dock-door portals, and vehicle mounts. The right panel covers circular polarized antennas, CPA: they read a tag at any orientation but cost about 3 dB of range, so they suit random-orientation uses like handheld scanning, dressing rooms, and mixed asset rooms. A footer notes that mixing the wrong polarization with the wrong application is the single biggest cause of disappointing read rates after a portal install.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANTENNA POLARIZATION</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Gain vs. orientation tolerance</text>
<text x="600" y="133" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Two antenna types, two very different ways to lose a read.</text>

<!-- LEFT: LPA -->
<rect x="64" y="168" width="520" height="388" rx="16" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="324" y="208" text-anchor="middle" font-size="20" font-weight="800" fill="#234a4a">LINEAR (LPA)</text>
<text x="324" y="231" text-anchor="middle" font-size="13.5" fill="#5c5c5c">+3 dB in the matched plane</text>
<line x1="96" y1="250" x2="552" y2="250" stroke="#eee7d9" stroke-width="1.4"/>
<rect x="104" y="284" width="60" height="84" rx="8" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<line x1="134" y1="300" x2="134" y2="352" stroke="#234a4a" stroke-width="2.6"/><polygon points="129,304 134,294 139,304" fill="#234a4a"/><polygon points="129,348 134,358 139,348" fill="#234a4a"/>
<text x="134" y="392" text-anchor="middle" font-size="12" fill="#5c5c5c">one plane</text>
<rect x="238" y="288" width="14" height="44" rx="2" fill="#cdd7d7" stroke="#3d6b6b" stroke-width="1.4"/>
<circle cx="300" cy="310" r="10" fill="#1f6f3a"/><polyline points="294,310 299,315 307,304" fill="none" stroke="#fff" stroke-width="2.4"/>
<text x="322" y="315" font-size="14" fill="#234a4a">Aligned → full gain</text>
<rect x="222" y="352" width="44" height="14" rx="2" fill="#f0d6d6" stroke="#8b2d2d" stroke-width="1.4"/>
<circle cx="300" cy="360" r="10" fill="#8b2d2d"/><line x1="295" y1="355" x2="305" y2="365" stroke="#fff" stroke-width="2.4"/><line x1="305" y1="355" x2="295" y2="365" stroke="#fff" stroke-width="2.4"/>
<text x="322" y="365" font-size="14" fill="#291c0e">90° rotated → ~0 signal</text>
<rect x="104" y="418" width="212" height="44" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<text x="210" y="445" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6f3a">+3 dB gain, matched</text>
<rect x="332" y="418" width="212" height="44" rx="10" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.5"/>
<text x="438" y="445" text-anchor="middle" font-size="14" font-weight="700" fill="#8b2d2d">~0 at 90° rotation</text>
<rect x="104" y="478" width="440" height="58" rx="10" fill="#f4f6f8" stroke="#cfd6df" stroke-width="1.4"/>
<text x="124" y="502" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">USE FOR</text>
<text x="124" y="524" font-size="13.5" fill="#4f4f4f">Fixed orientation: conveyors, dock portals, vehicle mount</text>

<text x="600" y="366" text-anchor="middle" font-size="19" font-weight="800" fill="#a8a29a">vs</text>

<!-- RIGHT: CPA -->
<rect x="616" y="168" width="520" height="388" rx="16" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="876" y="208" text-anchor="middle" font-size="20" font-weight="800" fill="#234a4a">CIRCULAR (CPA)</text>
<text x="876" y="231" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Any orientation, -3 dB range</text>
<line x1="648" y1="250" x2="1104" y2="250" stroke="#eee7d9" stroke-width="1.4"/>
<rect x="656" y="284" width="60" height="84" rx="8" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<circle cx="686" cy="326" r="20" fill="none" stroke="#234a4a" stroke-width="2.4"/><polygon points="700,314 708,322 696,326" fill="#234a4a"/>
<text x="686" y="392" text-anchor="middle" font-size="12" fill="#5c5c5c">rotating field</text>
<rect x="782" y="304" width="12" height="38" rx="2" fill="#cdd7d7" stroke="#3d6b6b" stroke-width="1.4"/>
<rect x="828" y="304" width="12" height="38" rx="2" fill="#cdd7d7" stroke="#3d6b6b" stroke-width="1.4" transform="rotate(45 834 323)"/>
<rect x="866" y="317" width="38" height="12" rx="2" fill="#cdd7d7" stroke="#3d6b6b" stroke-width="1.4"/>
<circle cx="948" cy="323" r="12" fill="#1f6f3a"/><polyline points="941,323 946,329 956,315" fill="none" stroke="#fff" stroke-width="2.6"/>
<text x="876" y="372" text-anchor="middle" font-size="14" fill="#234a4a">Any angle → reads</text>
<rect x="656" y="418" width="212" height="44" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<text x="762" y="445" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6f3a">Any orientation reads</text>
<rect x="884" y="418" width="212" height="44" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="990" y="445" text-anchor="middle" font-size="14" font-weight="700" fill="#6d5a3a">-3 dB range cost</text>
<rect x="656" y="478" width="440" height="58" rx="10" fill="#f4f6f8" stroke="#cfd6df" stroke-width="1.4"/>
<text x="676" y="502" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">USE FOR</text>
<text x="676" y="524" font-size="13.5" fill="#4f4f4f">Random orientation: handheld, dressing rooms, mixed assets</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Mismatched polarization is the single biggest cause of disappointing read rates after a portal install.</text>
</svg>
