<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Hotel key-card access flow, from front-desk encode to a logged door open</title>
  <desc id="d">The credential path for the 28-property rollout. Step 1: the front-desk encoder writes the stay into sectors 1 to 15 of a MIFARE Classic 1K card in 1.8 seconds, down from 12.0 seconds on the old magnetic swipe-and-program. Step 2: the card carries the credential at 13.56 MHz over the ISO 14443 Type A air interface, with sector 0 and the 7-byte UID fixed. Step 3: the guest taps the door, which may be Saflok at 60 percent of properties, Onity at 25 percent or Salto at 15 percent. Step 4: the lock grants access and writes an audit event on every tap. A footer records that the magnetic stripe this replaced was failing on 4.1% of guest interactions by 2024.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FROM FRONT-DESK ENCODE TO A LOGGED DOOR OPEN</text>
  <text x="600" y="82" text-anchor="middle" font-size="15" fill="#5c5c5c">One card SKU, three lock platforms, an audit line on every tap</text>

  <circle cx="198" cy="150" r="15" fill="#3d6b6b"/><text x="198" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <circle cx="466" cy="150" r="15" fill="#3d6b6b"/><text x="466" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <circle cx="734" cy="150" r="15" fill="#3d6b6b"/><text x="734" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <circle cx="1002" cy="150" r="15" fill="#3d6b6b"/><text x="1002" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>

  <rect x="86" y="196" width="224" height="168" rx="12" fill="#4a5568"/>
  <text x="198" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Front desk encoder</text>
  <text x="198" y="262" text-anchor="middle" font-size="12.5" fill="#ffffff">writes sectors 1–15</text>
  <text x="198" y="288" text-anchor="middle" font-size="12.5" fill="#ffffff">1.8 s per card</text>
  <text x="198" y="314" text-anchor="middle" font-size="12.5" fill="#ffffff">(was 12.0 s)</text>

  <rect x="354" y="196" width="224" height="168" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
  <text x="466" y="234" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">MIFARE Classic 1K</text>
  <text x="466" y="262" text-anchor="middle" font-size="12.5" fill="#5c5c5c">13.56 MHz</text>
  <text x="466" y="288" text-anchor="middle" font-size="12.5" fill="#5c5c5c">ISO 14443 Type A</text>
  <text x="466" y="314" text-anchor="middle" font-size="12.5" fill="#5c5c5c">sector 0 + 7-byte UID</text>

  <rect x="622" y="196" width="224" height="168" rx="12" fill="#4a5568"/>
  <text x="734" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Guest taps the lock</text>
  <text x="734" y="262" text-anchor="middle" font-size="12.5" fill="#ffffff">Saflok 60%</text>
  <text x="734" y="288" text-anchor="middle" font-size="12.5" fill="#ffffff">Onity 25%</text>
  <text x="734" y="314" text-anchor="middle" font-size="12.5" fill="#ffffff">Salto 15%</text>

  <rect x="890" y="196" width="224" height="168" rx="12" fill="#2c5454"/>
  <text x="1002" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Access granted</text>
  <text x="1002" y="270" text-anchor="middle" font-size="12.5" fill="#ffffff">+ event logged</text>
  <text x="1002" y="296" text-anchor="middle" font-size="12.5" fill="#ffffff">on every tap</text>

  <line x1="310" y1="280" x2="340" y2="280" stroke="#3d6b6b" stroke-width="3"/>
  <polygon points="340,273 354,280 340,287" fill="#3d6b6b"/>
  <line x1="578" y1="280" x2="608" y2="280" stroke="#3d6b6b" stroke-width="3"/>
  <polygon points="608,273 622,280 608,287" fill="#3d6b6b"/>
  <text x="600" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#3d6b6b">tap</text>
  <line x1="846" y1="280" x2="876" y2="280" stroke="#3d6b6b" stroke-width="3"/>
  <polygon points="876,273 890,280 876,287" fill="#3d6b6b"/>

  <rect x="86" y="452" width="1028" height="150" rx="14" fill="#f7e7e2" stroke="#c98a86" stroke-width="1.5"/>
  <text x="110" y="490" font-size="13" font-weight="800" letter-spacing="0.4" fill="#8b2d2d">THE OLD WORLD IT REPLACED</text>
  <text x="110" y="524" font-size="16" font-weight="700" fill="#8b2d2d">4.1% of guest interactions failed at the lock by 2024</text>
  <text x="110" y="552" font-size="13.5" fill="#5c5c5c">Magnetic stripes demagnetised in guest pockets next to phones — the reason the migration started.</text>
  <text x="110" y="576" font-size="13.5" fill="#5c5c5c">One contactless card SKU now reads every Saflok, Onity and Salto lock in the estate, no door hardware changed.</text>
</svg>
