<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The packing test — which NTAG chip each common NFC payload actually needs</title>
<desc id="d">Six horizontal gauge rows match common NFC payloads to the minimum chip, with bar length proportional to bytes out of 888. A short tap-to-link URL at about 40 bytes and a per-tag serialized URL at about 80 bytes both fit NTAG213. Two URIs plus a text record at about 180 bytes still fit NTAG213 but with zero headroom. A full vCard with photo and address at about 250 bytes needs NTAG215. Amiibo-style game state uses all 504 bytes of NTAG215. A configuration file or long content of up to 888 bytes needs NTAG216. Footnotes warn that payloads that barely fit today tend to grow, and that per-tap dynamic SUN URLs are impossible on any NTAG21x — that is NTAG 424 DNA territory.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE PACKING TEST</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Payloads are smaller than you think</text>

<rect x="392" y="122" width="14" height="14" rx="4" fill="#c39a5f"/>
<text x="412" y="134" font-size="12.5" font-weight="600" fill="#4f4f4f">NTAG213</text>
<rect x="502" y="122" width="14" height="14" rx="4" fill="#3d6b6b"/>
<text x="522" y="134" font-size="12.5" font-weight="600" fill="#4f4f4f">NTAG215</text>
<rect x="612" y="122" width="14" height="14" rx="4" fill="#4a5568"/>
<text x="632" y="134" font-size="12.5" font-weight="600" fill="#4f4f4f">NTAG216</text>
<text x="950" y="134" text-anchor="end" font-size="12.5" fill="#5c5c5c">gauge scale: full track = 888 B</text>

<text x="64" y="181" font-size="14.5" font-weight="600" fill="#291c0e">Short URL (tap-to-link)</text>
<rect x="390" y="166" width="560" height="20" rx="10" fill="#f4efe4"/>
<rect x="390" y="166" width="25" height="20" rx="10" fill="#c39a5f"/>
<text x="425" y="181" font-size="13" fill="#4f4f4f">~40 B</text>
<rect x="980" y="162" width="156" height="28" rx="14" fill="#f9f1e2" stroke="#e4c98f"/>
<text x="1058" y="181" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">NTAG213</text>

<text x="64" y="253" font-size="14.5" font-weight="600" fill="#291c0e">Per-tag serialized URL</text>
<rect x="390" y="238" width="560" height="20" rx="10" fill="#f4efe4"/>
<rect x="390" y="238" width="50" height="20" rx="10" fill="#c39a5f"/>
<text x="450" y="253" font-size="13" fill="#4f4f4f">~80 B</text>
<rect x="980" y="234" width="156" height="28" rx="14" fill="#f9f1e2" stroke="#e4c98f"/>
<text x="1058" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">NTAG213</text>

<text x="64" y="325" font-size="14.5" font-weight="600" fill="#291c0e">2 URIs + a text record</text>
<rect x="390" y="310" width="560" height="20" rx="10" fill="#f4efe4"/>
<rect x="390" y="310" width="113" height="20" rx="10" fill="#c39a5f"/>
<text x="513" y="325" font-size="13" fill="#4f4f4f">~180 B</text>
<rect x="980" y="306" width="156" height="28" rx="14" fill="#f9f1e2" stroke="#e4c98f"/>
<text x="1058" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">213, no headroom</text>

<text x="64" y="397" font-size="14.5" font-weight="600" fill="#291c0e">Full vCard (photo, address)</text>
<rect x="390" y="382" width="560" height="20" rx="10" fill="#f4efe4"/>
<rect x="390" y="382" width="158" height="20" rx="10" fill="#3d6b6b"/>
<text x="558" y="397" font-size="13" fill="#4f4f4f">~250 B</text>
<rect x="980" y="378" width="156" height="28" rx="14" fill="#eef5f5" stroke="#cfe0e0"/>
<text x="1058" y="397" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">NTAG215</text>

<text x="64" y="469" font-size="14.5" font-weight="600" fill="#291c0e">Amiibo-style game state</text>
<rect x="390" y="454" width="560" height="20" rx="10" fill="#f4efe4"/>
<rect x="390" y="454" width="318" height="20" rx="10" fill="#3d6b6b"/>
<text x="718" y="469" font-size="13" fill="#4f4f4f">504 B</text>
<rect x="980" y="450" width="156" height="28" rx="14" fill="#eef5f5" stroke="#cfe0e0"/>
<text x="1058" y="469" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">NTAG215</text>

<text x="64" y="541" font-size="14.5" font-weight="600" fill="#291c0e">Config file / long content</text>
<rect x="390" y="526" width="560" height="20" rx="10" fill="#f4efe4"/>
<rect x="390" y="526" width="560" height="20" rx="10" fill="#4a5568"/>
<text x="940" y="541" text-anchor="end" font-size="13" font-weight="600" fill="#ffffff">up to 888 B</text>
<rect x="980" y="522" width="156" height="28" rx="14" fill="#eef1f5" stroke="#d3dae3"/>
<text x="1058" y="541" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">NTAG216</text>

<line x1="64" y1="572" x2="1136" y2="572" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="64" y="602" font-size="13.5" font-weight="600" fill="#6d5a3a">The trap: a payload that barely fits today grows tomorrow — if it might grow, size up once now.</text>
<text x="64" y="630" font-size="13.5" font-weight="600" fill="#8b2d2d">Not on this chart: per-tap dynamic SUN URLs — no NTAG21x can do that at any size. That is NTAG 424 DNA.</text>
</svg>
