<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Metal keyfob tap-range acceptance envelope at the PACS reader</title>
  <desc id="d">Horizontal gauge measured from the reader face on a millimetre scale from 0 to 50 mm. Three bars: the same chip in a non-metal shell reads at 0-50 mm on HF 13.56 MHz (the reference); the metal shell with ferrite-backed anti-metal antenna holds 0-30 mm on HF 13.56 MHz; and 0-40 mm on LF 125 kHz. Dashed gate lines mark the HF acceptance threshold at 30 mm and the LF acceptance threshold at 40 mm. Caption: tune reader power until every reader confirms these distances during weeks 2-3 antenna validation, then release the pilot batch.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PACS READER VALIDATION</text>
  <text x="600" y="96" text-anchor="middle" font-size="33" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Tap-range acceptance envelope</text>
  <text x="600" y="124" text-anchor="middle" font-size="14" fill="#5c5c5c">confirm at every reader during weeks 2-3 antenna validation, before the pilot batch ships</text>

  <text x="159" y="158" text-anchor="middle" font-size="12.5" fill="#4f4f4f">reader face</text>
  <rect x="150" y="168" width="18" height="330" rx="5" fill="#4a5568"/>

  <text x="720" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">HF gate — 30 mm</text>
  <text x="904" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">LF gate — 40 mm</text>
  <line x1="720" y1="198" x2="720" y2="498" stroke="#c39a5f" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="904" y1="174" x2="904" y2="498" stroke="#c39a5f" stroke-width="1.5" stroke-dasharray="6 5"/>

  <rect x="168" y="210" width="920" height="64" rx="9" fill="#ddeaea" stroke="#9dbcbc" stroke-width="1"/>
  <text x="186" y="237" font-size="14" font-weight="600" fill="#234a4a">Same chip, non-metal shell — reference</text>
  <text x="186" y="259" font-size="12.5" fill="#4f4f4f">HF 13.56 MHz · tap 0-50 mm</text>

  <rect x="168" y="302" width="552" height="64" rx="9" fill="#4a5568"/>
  <text x="186" y="329" font-size="14" font-weight="600" fill="#ffffff">Metal shell — HF 13.56 MHz</text>
  <text x="186" y="351" font-size="12.5" fill="#e3e7ee">acceptance: tap 0-30 mm</text>

  <rect x="168" y="394" width="736" height="64" rx="9" fill="#ecd9b4" stroke="#c39a5f" stroke-width="1"/>
  <text x="186" y="421" font-size="14" font-weight="600" fill="#6d5a3a">Metal shell — LF 125 kHz</text>
  <text x="186" y="443" font-size="12.5" fill="#6d5a3a">acceptance: tap 0-40 mm</text>

  <line x1="168" y1="498" x2="1088" y2="498" stroke="#c9c1b2" stroke-width="2"/>
  <line x1="168" y1="498" x2="168" y2="509" stroke="#a89f8d" stroke-width="2"/>
  <line x1="352" y1="498" x2="352" y2="509" stroke="#a89f8d" stroke-width="2"/>
  <line x1="536" y1="498" x2="536" y2="509" stroke="#a89f8d" stroke-width="2"/>
  <line x1="720" y1="498" x2="720" y2="509" stroke="#a89f8d" stroke-width="2"/>
  <line x1="904" y1="498" x2="904" y2="509" stroke="#a89f8d" stroke-width="2"/>
  <line x1="1088" y1="498" x2="1088" y2="509" stroke="#a89f8d" stroke-width="2"/>
  <text x="168" y="530" text-anchor="middle" font-size="12.5" fill="#5c5c5c">0</text>
  <text x="352" y="530" text-anchor="middle" font-size="12.5" fill="#5c5c5c">10</text>
  <text x="536" y="530" text-anchor="middle" font-size="12.5" fill="#5c5c5c">20</text>
  <text x="720" y="530" text-anchor="middle" font-size="12.5" fill="#5c5c5c">30</text>
  <text x="904" y="530" text-anchor="middle" font-size="12.5" fill="#5c5c5c">40</text>
  <text x="1088" y="530" text-anchor="middle" font-size="12.5" fill="#5c5c5c">50 mm</text>

  <text x="600" y="580" text-anchor="middle" font-size="14" fill="#4f4f4f">Tune reader power until every reader confirms these distances — then release the pilot batch.</text>
  <text x="600" y="606" text-anchor="middle" font-size="12.5" fill="#5c5c5c">0.3-0.5 mm ferrite stack holds the range through the shell</text>
</svg>
