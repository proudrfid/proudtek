<title id="t">NFC business cards — one tap, zero drawer</title>
<desc id="d">A business card taps a phone and the profile saves in seconds. The three buying decisions in order: pick the chip (NTAG213, 215 or 216, from $0.06-0.18 at 500 pieces), pick the material (PVC, metal or wood), then program once and update the link forever. Footnote: over 90 percent of smartphones read NFC natively, no app needed.</desc>
