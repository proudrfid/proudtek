<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Same RFID tag: full range on the test bench, silence flat on a steel shelf</title>
<desc id="d">Split scene. Left: on the test bench a reader's waves expand freely and the tag on its stand reads at around ten metres — full free-air range, the demo that sold the project. Right: the same reader and the same tag, now lying flat on a steel shelf; the incoming wave reflects away, the read range collapses to roughly zero, and the tag sits silent. Nothing is broken — a sheet of steel joined the conversation. Standard tags lose 80 to 100 percent of their read range the moment they touch metal.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<pattern id="steel" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#eef1f5"/><path d="M -1 1 L 1 -1 M 0 12 L 12 0 M 11 13 L 13 11" stroke="#d3dae3" stroke-width="3"/></pattern>
<marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8b2d2d"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE SUPPORT TICKET EVERY RFID ENGINEER KNOWS</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Same tag, same reader — the steel changed the physics</text>

<rect x="46" y="130" width="546" height="440" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="319" y="168" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">ON THE TEST BENCH</text>

<rect x="96" y="286" width="54" height="88" rx="10" fill="#291c0e"/>
<rect x="106" y="268" width="7" height="22" rx="3" fill="#291c0e"/>
<rect x="133" y="268" width="7" height="22" rx="3" fill="#291c0e"/>
<circle cx="123" cy="330" r="7" fill="#1fcefb"/>
<text x="123" y="400" text-anchor="middle" font-size="12.5" fill="#4f4f4f">reader</text>

<path d="M 176 296 A 34 34 0 0 1 176 364" fill="none" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round"/>
<path d="M 200 276 A 56 56 0 0 1 200 384" fill="none" stroke="#8ba6a6" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 224 256 A 78 78 0 0 1 224 404" fill="none" stroke="#bbcbcb" stroke-width="2.2" stroke-linecap="round"/>
<path d="M 248 240 A 98 98 0 0 1 248 420" fill="none" stroke="#d8e1e1" stroke-width="2" stroke-linecap="round"/>

<rect x="380" y="300" width="140" height="54" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="394" y="314" width="18" height="18" rx="3" fill="#c39a5f"/>
<path d="M 424 318 H 502 M 424 328 H 486 M 424 338 H 502" stroke="#8ba6a6" stroke-width="3" stroke-linecap="round"/>
<rect x="446" y="354" width="8" height="52" rx="3" fill="#d3dae3"/>
<ellipse cx="450" cy="410" rx="32" ry="7" fill="#eef1f5" stroke="#d3dae3"/>

<rect x="372" y="232" width="156" height="34" rx="17" fill="#eaf3ed" stroke="#1f6f3a" stroke-width="1.5"/>
<text x="450" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6f3a">reads ≈ 10 m</text>

<line x1="160" y1="448" x2="520" y2="448" stroke="#1f6f3a" stroke-width="2" stroke-dasharray="2 7"/>
<text x="340" y="472" text-anchor="middle" font-size="12.5" fill="#1f6f3a">full free-air range</text>
<text x="319" y="528" text-anchor="middle" font-size="13" font-style="italic" fill="#4f4f4f">the demo that sold the project</text>

<rect x="608" y="130" width="546" height="440" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="881" y="168" text-anchor="middle" font-size="17" font-weight="800" fill="#4a5568">ON THE STEEL SHELF</text>

<rect x="658" y="286" width="54" height="88" rx="10" fill="#291c0e"/>
<rect x="668" y="268" width="7" height="22" rx="3" fill="#291c0e"/>
<rect x="695" y="268" width="7" height="22" rx="3" fill="#291c0e"/>
<circle cx="685" cy="330" r="7" fill="#1fcefb"/>
<text x="685" y="400" text-anchor="middle" font-size="12.5" fill="#4f4f4f">same reader</text>

<path d="M 738 306 A 24 24 0 0 1 738 354" fill="none" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round"/>
<path d="M 756 292 A 40 40 0 0 1 756 368" fill="none" stroke="#bbcbcb" stroke-width="2.4" stroke-linecap="round"/>
<text x="790" y="268" font-size="13" font-style="italic" fill="#4f4f4f">…hello?</text>

<rect x="1064" y="170" width="20" height="360" fill="url(#steel)" stroke="#4a5568" stroke-width="1.8"/>
<rect x="922" y="300" width="142" height="13" fill="url(#steel)" stroke="#4a5568" stroke-width="1.8"/>
<rect x="922" y="440" width="142" height="13" fill="url(#steel)" stroke="#4a5568" stroke-width="1.8"/>

<rect x="934" y="274" width="100" height="26" rx="5" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5"/>
<rect x="944" y="281" width="13" height="13" rx="2" fill="#8b2d2d"/>
<path d="M 966 287 H 1022" stroke="#dcc0c0" stroke-width="2.5" stroke-linecap="round"/>

<rect x="880" y="212" width="176" height="34" rx="17" fill="#f7eaea" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="968" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#8b2d2d">read range ≈ 0</text>

<line x1="774" y1="330" x2="926" y2="304" stroke="#8ba6a6" stroke-width="2.5"/>
<line x1="926" y1="304" x2="800" y2="430" stroke="#8b2d2d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrR)"/>
<text x="800" y="454" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">reflected away</text>

<text x="1092" y="212" font-size="12" font-weight="700" fill="#9ba2ab">z</text>
<text x="1104" y="198" font-size="15" font-weight="700" fill="#9ba2ab">z</text>
<text x="1118" y="182" font-size="18" font-weight="700" fill="#4a5568">z</text>
<text x="881" y="528" text-anchor="middle" font-size="13" font-style="italic" fill="#4f4f4f">same tag. sullen silence.</text>

<text x="600" y="612" text-anchor="middle" font-size="15" font-weight="600" fill="#291c0e">Nothing is broken — a sheet of steel just joined the conversation.</text>
<text x="600" y="640" text-anchor="middle" font-size="14" fill="#5c5c5c">Standard tags lose 80–100% of their read range the moment they touch metal.</text>
</svg>
