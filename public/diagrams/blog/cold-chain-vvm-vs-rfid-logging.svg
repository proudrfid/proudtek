<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Chemical VVM versus continuous RFID temperature log</title>
<desc id="d">Side-by-side comparison. Left panel, the old way, a chemical vaccine vial monitor: a circular indicator gives a single verdict, "not exposed", with no answer to when, how long or how bad — one bit of data. Right panel, the RFID way, a continuous log: a temperature chart shows the plus two to plus eight degrees Celsius safe band with a logged trace, and one excursion above plus eight degrees is drawn in red and bounded by two markers with a timestamp window, so the record shows exactly when, where and how long the excursion happened.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">A VERDICT VERSUS A TIMELINE</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Same shipment, two very different records</text>

<rect x="46" y="130" width="546" height="452" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="319" y="172" text-anchor="middle" font-size="17" font-weight="800" fill="#4a5568">THE OLD WAY · CHEMICAL VVM</text>

<circle cx="319" cy="284" r="62" fill="#eef1f5" stroke="#4a5568" stroke-width="2"/>
<circle cx="319" cy="284" r="38" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="319" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#2c5454">OK?</text>

<text x="319" y="392" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Reads: "not exposed"</text>
<text x="319" y="424" text-anchor="middle" font-size="14" fill="#4f4f4f">When?   Unknown</text>
<text x="319" y="448" text-anchor="middle" font-size="14" fill="#4f4f4f">How long?   Unknown</text>
<text x="319" y="472" text-anchor="middle" font-size="14" fill="#4f4f4f">How bad?   Unknown</text>
<text x="319" y="540" text-anchor="middle" font-size="13.5" fill="#4f4f4f">One bit of data — a verdict with no story</text>

<rect x="608" y="130" width="546" height="452" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="881" y="172" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">THE RFID WAY · CONTINUOUS LOG</text>

<rect x="676" y="250" width="410" height="80" fill="#eef5f5"/>
<line x1="676" y1="250" x2="1086" y2="250" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="5 6"/>
<line x1="676" y1="330" x2="1086" y2="330" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="5 6"/>
<text x="666" y="255" text-anchor="end" font-size="13" fill="#2c5454">+8°C</text>
<text x="666" y="335" text-anchor="end" font-size="13" fill="#2c5454">+2°C</text>

<line x1="900" y1="236" x2="900" y2="346" stroke="#d4a755" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="978" y1="236" x2="978" y2="346" stroke="#d4a755" stroke-width="1.5" stroke-dasharray="4 5"/>
<polyline points="678,302 730,298 785,300 835,297 878,300 900,272 925,238 952,232 978,272 1002,300 1045,298 1084,300" fill="none" stroke="#3d6b6b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="890,286 900,272 925,238 952,232 978,272 990,286" fill="none" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="939" y="366" text-anchor="middle" font-size="12.5" fill="#6d5a3a">excursion window 14:32–14:51</text>

<text x="881" y="424" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Exactly when, where and how long</text>
<text x="881" y="452" text-anchor="middle" font-size="14" fill="#4f4f4f">every reading time-stamped and downloadable</text>
<text x="881" y="540" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2d6a4f">A full timeline — on the record for years</text>

<text x="600" y="616" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The logger does not replace judgment — it gives the quality team the data the verdict never could.</text>
</svg>
