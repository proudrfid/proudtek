<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="gmTitle gmDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="gmTitle">Detecting gray-market diversion with the tap counter and geolocation</title>
  <desc id="gmDesc">A single chip is encoded at the fab with an authorised channel — APAC, Distributor A. Its first tap is in Hong Kong at week zero, inside the authorised channel. Six weeks later the monotonic tap counter shows a scan in Brazil, a region whose distributor never received that batch, so the tap is out of channel and flagged. The mismatch routes to brand legal, and aggregated across more than 100,000 scans the diversion route becomes statistically obvious — without ever tipping off the unauthorised reseller.</desc>
  <defs>
    <radialGradient id="gmBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="gmDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
    <marker id="gmArr" markerWidth="11" markerHeight="11" refX="4" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#8b2d2d"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#gmBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="56" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2" fill="#6d5a3a">ONE CHIP, TWO CONTINENTS, ZERO PAPERWORK</text>
  <text x="600" y="84" text-anchor="middle" font-size="15.5" fill="#4f4f4f">The tap counter and geolocation surface the diversion the reseller forgot to mention.</text>

  <!-- encoded channel pill -->
  <rect x="326" y="102" width="548" height="42" rx="21" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.6"/>
  <circle cx="356" cy="123" r="7" fill="#1fcefb"/>
  <text x="600" y="128" text-anchor="middle" font-size="14.5" font-weight="700" fill="#177a92">Encoded at the fab → authorised channel: APAC · Distributor A</text>

  <!-- Hong Kong (authorised) -->
  <rect x="150" y="298" width="256" height="150" rx="16" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2.5"/>
  <g transform="translate(200,360)"><path d="M0 8 C -16 -8 -14 -28 0 -28 C 14 -28 16 -8 0 8 Z" fill="#1f6f3a"/><circle cx="0" cy="-17" r="6" fill="#fff"/></g>
  <text x="248" y="342" font-size="21" font-weight="800" fill="#291c0e">Hong Kong</text>
  <text x="248" y="367" font-size="14.5" fill="#3f6b4e">Tap #001 · week 0</text>
  <text x="248" y="392" font-size="14.5" font-weight="700" fill="#1f6f3a">✓ in authorised channel</text>

  <!-- Brazil (unauthorised) -->
  <rect x="794" y="298" width="256" height="150" rx="16" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2.5"/>
  <g transform="translate(844,360)"><path d="M0 8 C -16 -8 -14 -28 0 -28 C 14 -28 16 -8 0 8 Z" fill="#8b2d2d"/><circle cx="0" cy="-17" r="6" fill="#fff"/></g>
  <text x="892" y="342" font-size="21" font-weight="800" fill="#291c0e">Brazil</text>
  <text x="892" y="367" font-size="14.5" fill="#7a4242">Tap #482 · week 6</text>
  <text x="892" y="392" font-size="14.5" font-weight="700" fill="#8b2d2d">✗ batch never shipped here</text>

  <!-- travelling arc -->
  <path d="M410 322 C 520 210, 690 210, 796 322" fill="none" stroke="#b98a4a" stroke-width="3.5" stroke-dasharray="9 7" stroke-linecap="round" marker-end="url(#gmArr)"/>
  <g transform="translate(603,214)">
    <circle cx="-96" cy="0" r="14" fill="none" stroke="#6d5a3a" stroke-width="2.5"/><path d="M-96 -8 v8 l5 4" fill="none" stroke="#6d5a3a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="-72" y="6" font-size="18" font-weight="800" fill="#6d5a3a">6 weeks later</text>
  </g>
  <text x="603" y="282" text-anchor="middle" font-size="14.5" fill="#4f4f4f">monotonic tap counter can't run backwards: #001 → #482</text>

  <!-- mismatch alert -->
  <rect x="300" y="474" width="600" height="70" rx="14" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2.5"/>
  <path d="M348 494 l18 32 h-36 Z" fill="#8b2d2d"/><text x="348" y="523" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">!</text>
  <text x="382" y="503" font-size="16.5" font-weight="800" fill="#8b2d2d">MISMATCH — location ≠ authorised channel</text>
  <text x="382" y="527" font-size="14.5" fill="#7a4242">the distributor never received this batch → routed automatically to brand legal</text>

  <!-- aggregation footer -->
  <rect x="62" y="562" width="1076" height="66" rx="14" fill="url(#gmDark)"/>
  <text x="600" y="592" text-anchor="middle" font-size="17" font-weight="800" fill="#d4a755">Aggregated across 100K+ scans, the diversion route becomes statistically obvious</text>
  <text x="600" y="615" text-anchor="middle" font-size="14" fill="#f4efe4">— and the unauthorised reseller is never tipped off.</text>
</svg>
