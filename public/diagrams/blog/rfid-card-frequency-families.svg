<rect x="440" y="204" width="320" height="356" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<rect x="775" y="204" width="320" height="356" rx="16" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.5"/>

<text x="133" y="252" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#6d5a3a">LF</text>
<text x="185" y="252" font-size="13.5" font-weight="600" fill="#4f4f4f">125 kHz · legacy prox</text>
<line x1="133" y1="268" x2="397" y2="268" stroke="#e4c98f" stroke-width="1.4"/>
<text x="468" y="252" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#2c5454">HF</text>
<text x="522" y="252" font-size="13.5" font-weight="600" fill="#4f4f4f">13.56 MHz · smart cards</text>
<line x1="468" y1="268" x2="732" y2="268" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="803" y="252" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#4a5568">UHF</text>
<text x="878" y="252" font-size="13.5" font-weight="600" fill="#4f4f4f">860-960 MHz · RAIN</text>
