<rect x="928" y="453" width="194" height="32" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="1025" y="474" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">$0.60–1.20</text>
<!-- row 5 -->
<rect x="60" y="522" width="1080" height="82" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="60" y="522" width="6" height="82" rx="3" fill="#2d6a4f"/>
<text x="92" y="558" text-anchor="start" font-size="17" font-weight="800" fill="#291c0e">E-ink smart badge</text>
<text x="92" y="584" text-anchor="start" font-size="13.5" fill="#5c5c5c">Reusable · updatable e-ink name display + embedded NFC</text>
<rect x="762" y="547" width="116" height="32" rx="16" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="820" y="568" text-anchor="middle" font-size="13" font-weight="800" fill="#6d5a3a">TAP</text>
<rect x="928" y="547" width="194" height="32" rx="16" fill="#e9f2ec" stroke="#bcd8c8" stroke-width="1.2"/>
<text x="1025" y="568" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b4332">reusable, premium</text>
