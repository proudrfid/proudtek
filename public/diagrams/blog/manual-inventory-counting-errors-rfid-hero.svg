<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Manual and barcode inventory counts run 65-85% accurate; RFID-assisted cycle counts report 95-99%</title>
<desc id="d">A before-and-after comparison. On the left, manual and barcode counting reaches 65-85% typical inventory accuracy, dragged down by fatigue, look-alike SKUs, and manual transcription. An arrow leads to the right, where RFID-assisted cycle counts report 95-99% accuracy through bulk reading, no line-of-sight, and perpetual weekly counts. A stat ribbon below shows 70-80% less counting labor, 500-1,000 items per minute versus 20-40 by barcode, and weekly cycle counts instead of annual.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INDUSTRIAL RFID · INVENTORY COUNTING</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="38" font-weight="700" fill="#291c0e">The count that finally matches the system</text>
<text x="600" y="138" text-anchor="middle" font-size="16" fill="#4f4f4f">Manual and barcode counts run 65-85% accurate — RFID-assisted cycle counts report 95-99%.</text>

<rect x="90" y="176" width="440" height="300" rx="14" fill="#f4f5f7" stroke="#d5dae2" stroke-width="2"/>
<rect x="90" y="176" width="440" height="8" rx="4" fill="#4a5568"/>
<text x="310" y="222" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a5568">MANUAL &amp; BARCODE</text>
<text x="310" y="324" text-anchor="middle" font-size="70" font-weight="800" fill="#4a5568">65-85%</text>
<text x="310" y="364" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">typical inventory accuracy</text>
<text x="310" y="406" text-anchor="middle" font-size="13.5" fill="#5c5c5c">fatigue · look-alike SKUs · miscounts</text>
<text x="310" y="430" text-anchor="middle" font-size="13.5" fill="#5c5c5c">· manual transcription into the WMS</text>

<rect x="670" y="176" width="440" height="300" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<rect x="670" y="176" width="440" height="8" rx="4" fill="#1f6f3a"/>
<text x="890" y="222" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">RFID-ASSISTED</text>
<text x="890" y="324" text-anchor="middle" font-size="70" font-weight="800" fill="#1f6f3a">95-99%</text>
<text x="890" y="364" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">inventory accuracy</text>
<text x="890" y="406" text-anchor="middle" font-size="13.5" fill="#4f6a6a">bulk read · no line-of-sight ·</text>
<text x="890" y="430" text-anchor="middle" font-size="13.5" fill="#4f6a6a">perpetual weekly cycle counts</text>

<line x1="548" y1="326" x2="652" y2="326" stroke="#291c0e" stroke-width="4"/>
<polygon points="652,317 672,326 652,335" fill="#291c0e"/>

<rect x="90" y="506" width="1020" height="76" rx="12" fill="#faf6ec" stroke="#e4d8bf" stroke-width="1.4"/>
<line x1="430" y1="522" x2="430" y2="566" stroke="#e4d8bf" stroke-width="1.4"/>
<line x1="770" y1="522" x2="770" y2="566" stroke="#e4d8bf" stroke-width="1.4"/>
<text x="260" y="543" text-anchor="middle" font-size="23" font-weight="800" fill="#1f6f3a">70-80%</text>
<text x="260" y="566" text-anchor="middle" font-size="13" fill="#5c5c5c">less counting labor</text>
<text x="600" y="543" text-anchor="middle" font-size="23" font-weight="800" fill="#2c5454">500-1,000/min</text>
<text x="600" y="566" text-anchor="middle" font-size="13" fill="#5c5c5c">scanned, vs 20-40 by barcode</text>
<text x="940" y="543" text-anchor="middle" font-size="23" font-weight="800" fill="#6d5a3a">Weekly</text>
<text x="940" y="566" text-anchor="middle" font-size="13" fill="#5c5c5c">cycle counts, not annual</text>

<text x="600" y="626" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The weekend count becomes a walk-through — same stock, same staff, far less arguing with the variance.</text>
</svg>
