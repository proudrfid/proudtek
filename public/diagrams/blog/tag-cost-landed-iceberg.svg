<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The landed-cost iceberg: a $0.08 FOB quote becomes a $0.30 landed unit</title>
<desc id="d">Iceberg diagram. Above a teal waterline, a small white iceberg tip is labelled as what the quote shows: the FOB unit price of $0.08 — one tidy line item, technically true. Below the waterline, a much larger berg carries a stamp reading plus 50-200% over the FOB unit price, and five hidden cost layers are listed in the water: tooling and plate fees at $300-$800 for label plates up to $3,000 for on-metal housings; encoding services at $0.005-$0.02 per unit for UHF EPC up to $0.05-$0.15 for DESFire personalisation; freight and duties with sea at $1,800-$3,500 per 20-foot container, air at 6-10x per kg and an 8-15% premium over EXW; quality control and rejects, where the spec is under 0.5% dead tags but substandard converters ship 2-5%; and buffer and dead stock of 8-15 weeks of forward inventory. A bottom note lands the total at $0.30 — the unit price the P&amp;L actually meets.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE QUOTE VS. THE P&amp;L</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">How a $0.08 tag becomes a $0.30 landed unit</text>

<!-- water -->
<path d="M18 310 H1182 V639 Q1182 658 1163 658 H37 Q18 658 18 639 Z" fill="#e3efef"/>
<path d="M18 310 q29.1 -9 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0 t 58.2 0" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>

<!-- berg below water -->
<polygon points="180,310 400,310 436,428 352,606 236,592 152,420" fill="#bcd6d4"/>
<polygon points="180,310 272,436 236,592 152,420" fill="#a9c8c6"/>

<!-- tip above water -->
<polygon points="205,310 252,196 288,242 322,178 372,310" fill="#f4f8f8" stroke="#c9dada" stroke-width="1.5"/>
<polygon points="288,242 322,178 372,310" fill="#e9f1f1"/>

<!-- tip callout -->
<line x1="372" y1="216" x2="500" y2="216" stroke="#4f4f4f" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="512" y="210" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#6d5a3a">WHAT THE QUOTE SHOWS</text>
<text x="512" y="232" font-size="15.5" font-weight="600" fill="#291c0e">FOB unit price — $0.08</text>
<text x="512" y="252" font-size="13" fill="#5c5c5c">one tidy line item, technically true</text>

<!-- hidden layers -->
<text x="560" y="334" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#2c5454">BELOW THE WATERLINE</text>
<rect x="560" y="352" width="12" height="12" rx="3" fill="#2c5454"/>
<text x="584" y="363" font-size="15" font-weight="700" fill="#291c0e">Tooling &amp; plate fees</text>
<text x="584" y="382" font-size="13" fill="#4f4f4f">$300–$800 label plates · up to $3,000 for on-metal housings</text>
<rect x="560" y="406" width="12" height="12" rx="3" fill="#2c5454"/>
<text x="584" y="417" font-size="15" font-weight="700" fill="#291c0e">Encoding services</text>
<text x="584" y="436" font-size="13" fill="#4f4f4f">$0.005–$0.02/unit UHF EPC · up to $0.05–$0.15 DESFire personalisation</text>
<rect x="560" y="460" width="12" height="12" rx="3" fill="#2c5454"/>
<text x="584" y="471" font-size="15" font-weight="700" fill="#291c0e">Freight &amp; duties</text>
<text x="584" y="490" font-size="13" fill="#4f4f4f">sea $1,800–$3,500 per 20-ft box · air 6–10x per kg · 8–15% over EXW</text>
<rect x="560" y="514" width="12" height="12" rx="3" fill="#8b2d2d"/>
<text x="584" y="525" font-size="15" font-weight="700" fill="#291c0e">Quality control &amp; rejects</text>
<text x="584" y="544" font-size="13" fill="#4f4f4f">spec &lt;0.5% dead tags — substandard converters ship 2–5%</text>
<rect x="560" y="568" width="12" height="12" rx="3" fill="#2c5454"/>
<text x="584" y="579" font-size="15" font-weight="700" fill="#291c0e">Buffer &amp; dead stock</text>
<text x="584" y="598" font-size="13" fill="#4f4f4f">8–15 weeks of forward inventory riding in the network</text>

<!-- stamp -->
<rect x="196" y="486" width="196" height="58" rx="12" fill="#291c0e"/>
<text x="294" y="511" text-anchor="middle" font-size="20" font-weight="700" fill="#d4a755">+50–200%</text>
<text x="294" y="532" text-anchor="middle" font-size="12" fill="#cbbfa5">over the FOB unit price</text>

<text x="1120" y="630" text-anchor="end" font-size="13.5" font-weight="600" fill="#291c0e">landed: $0.30 — the unit price your P&amp;L actually meets</text>
</svg>
