<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">One ABS shell, two ways to fill it: the LF versus HF chip decision</title>
  <desc id="d">A decision diagram. One ABS keyfob shell splits into two lanes chosen by the reader estate. Left lane, LF 125 kHz: EM4200, EM4305 or T5577 for legacy HID Prox, Indala and AWID panels with Wiegand 26 / 34 / 37 output, and a red note that 125 kHz has no cryptography so the ID is clone-readable. Right lane, HF 13.56 MHz: MIFARE Classic 1K, MIFARE Plus SE, MIFARE DESFire EV3 with AES-128, NTAG 213-216, NTAG 424 DNA and I-CODE SLIX2 over OSDP v2.2 Secure Channel, aligned to ISO/IEC 27001. A bottom bar shows a dual-frequency LF plus HF fob bridging both estates.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE ABS SHELL, TWO WAYS TO FILL IT</text>
  <text x="600" y="82" text-anchor="middle" font-size="15" fill="#5c5c5c">Same housing, key-ring and colours; the reader estate decides the chip</text>

  <!-- central node -->
  <rect x="430" y="98" width="340" height="50" rx="14" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
  <text x="600" y="129" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">ABS SHELL — ONE HOUSING SKU</text>

  <!-- split arrows -->
  <line x1="540" y1="150" x2="342" y2="197" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="342,197 355,189 353,202" fill="#4a5568"/>
  <line x1="660" y1="150" x2="858" y2="197" stroke="#4a5568" stroke-width="2.5"/>
  <polygon points="858,197 845,189 847,202" fill="#4a5568"/>

  <!-- LF lane -->
  <rect x="68" y="200" width="520" height="300" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="92" y="238" font-size="20" font-weight="800" fill="#6d5a3a">LF — 125 kHz</text>
  <text x="92" y="262" font-size="13" fill="#5c5c5c">Legacy low-frequency reader estates</text>
  <line x1="88" y1="278" x2="568" y2="278" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="92" y="300" width="10" height="10" fill="#c39a5f"/>
  <text x="112" y="309" font-size="16" font-weight="700" fill="#291c0e">EM4200 / EM4305 / T5577</text>
  <text x="112" y="330" font-size="13" fill="#5c5c5c">rewritable T5577 emulates HID Prox, Indala, AWID</text>
  <rect x="92" y="352" width="10" height="10" fill="#c39a5f"/>
  <text x="112" y="361" font-size="16" font-weight="700" fill="#291c0e">Legacy HID Prox / Indala / AWID readers</text>
  <text x="112" y="382" font-size="13" fill="#5c5c5c">still 50-60 % of North-American enterprise estates</text>
  <rect x="92" y="404" width="10" height="10" fill="#c39a5f"/>
  <text x="112" y="413" font-size="16" font-weight="700" fill="#291c0e">Wiegand 26 / 34 / 37 panel output</text>
  <rect x="88" y="430" width="480" height="56" rx="10" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="1.5"/>
  <text x="104" y="454" font-size="14" font-weight="700" fill="#8b2d2d">No cryptography at 125 kHz</text>
  <text x="104" y="474" font-size="13" fill="#8b2d2d">any reader clones the ID — legacy and low-risk doors only</text>

  <!-- HF lane -->
  <rect x="612" y="200" width="520" height="300" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="636" y="238" font-size="20" font-weight="800" fill="#3d6b6b">HF — 13.56 MHz</text>
  <text x="636" y="262" font-size="13" fill="#5c5c5c">Modern authenticated reader estates</text>
  <line x1="632" y1="278" x2="1128" y2="278" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="636" y="300" width="10" height="10" fill="#3d6b6b"/>
  <text x="656" y="309" font-size="16" font-weight="700" fill="#291c0e">MIFARE Classic 1K</text>
  <text x="656" y="330" font-size="13" fill="#5c5c5c">CRYPTO-1 is weak — migrate up for real security</text>
  <rect x="636" y="352" width="10" height="10" fill="#3d6b6b"/>
  <text x="656" y="361" font-size="16" font-weight="700" fill="#291c0e">MIFARE Plus SE / MIFARE DESFire EV3</text>
  <text x="656" y="382" font-size="13" fill="#5c5c5c">AES-128 mutual authentication</text>
  <rect x="636" y="404" width="10" height="10" fill="#3d6b6b"/>
  <text x="656" y="413" font-size="15" font-weight="700" fill="#291c0e">NTAG 213-216 / NTAG 424 DNA / I-CODE SLIX2</text>
  <rect x="632" y="430" width="480" height="56" rx="10" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="648" y="454" font-size="14" font-weight="700" fill="#2c5454">Authenticated with AES-128</text>
  <text x="648" y="474" font-size="13" fill="#2c5454">OSDP v2.2 Secure Channel — ISO/IEC 27001-aligned</text>

  <!-- dual-frequency bar -->
  <rect x="68" y="522" width="1064" height="62" rx="14" fill="#f1e6cd" stroke="#e4c98f" stroke-width="2"/>
  <text x="600" y="549" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">DUAL-FREQUENCY — LF PLUS HF IN ONE ABS SHELL</text>
  <text x="600" y="572" text-anchor="middle" font-size="14" fill="#5c5c5c">One credential carries both inlays to bridge legacy and modern estates through a reader migration</text>
</svg>
