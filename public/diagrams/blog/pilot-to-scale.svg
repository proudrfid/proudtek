<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="psTitle psDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="psTitle">Five-step playbook to scale luxury NFC from pilot to full production</title>
  <desc id="psDesc">A numbered vertical sequence. One, pilot three to five SKU lines for six to twelve months and instrument every tap. Two, build the internal team of one product manager, one engineer and one retail-experience designer. Three, choose the backend deliberately: SaaS for year one, then migrate to in-house control. Four, embed NFC in the factory flow at the leather-cutting stage, which adds only zero to one percent cost versus double for a retrofit. Five, pre-train retail and authentication teams with hands-on tap practice and resale-partner integration before launch.</desc>
  <defs>
    <radialGradient id="psBg" cx="50%" cy="22%" r="86%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#psBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="66" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#6d5a3a">FROM PILOT TO FULL PRODUCTION</text>

  <!-- Connecting spine -->
  <line x1="104" y1="150" x2="104" y2="512" stroke="#e4c98f" stroke-width="5"/>

  <!-- Step 1 -->
  <rect x="150" y="110" width="994" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="104" cy="150" r="27" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/><text x="104" y="159" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">1</text>
  <text x="182" y="145" font-size="25" font-weight="800" fill="#291c0e">Pilot 3–5 SKU lines</text>
  <text x="182" y="174" font-size="17.5" fill="#4f4f4f">6–12 months — instrument every consumer, retail and authentication tap</text>

  <!-- Step 2 -->
  <rect x="150" y="200" width="994" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="104" cy="240" r="27" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/><text x="104" y="249" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">2</text>
  <text x="182" y="235" font-size="25" font-weight="800" fill="#291c0e">Build the internal team</text>
  <text x="182" y="264" font-size="17.5" fill="#4f4f4f">1 product manager + 1 engineer + 1 retail-experience designer, minimum</text>

  <!-- Step 3 -->
  <rect x="150" y="290" width="994" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="104" cy="330" r="27" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/><text x="104" y="339" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">3</text>
  <text x="182" y="325" font-size="25" font-weight="800" fill="#291c0e">Choose the backend deliberately</text>
  <text x="182" y="354" font-size="17.5" fill="#4f4f4f">SaaS (Authena, Aura) for year 1 → migrate in-house for data control</text>

  <!-- Step 4 -->
  <rect x="150" y="380" width="994" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="104" cy="420" r="27" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/><text x="104" y="429" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">4</text>
  <text x="182" y="415" font-size="25" font-weight="800" fill="#291c0e">Embed NFC in the factory flow</text>
  <text x="182" y="444" font-size="17.5" fill="#4f4f4f">At leather-cutting: +0–1% cost. Post-production retrofit doubles or triples it.</text>

  <!-- Step 5 -->
  <rect x="150" y="470" width="994" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="104" cy="510" r="27" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/><text x="104" y="519" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">5</text>
  <text x="182" y="505" font-size="25" font-weight="800" fill="#291c0e">Pre-train retail &amp; authentication</text>
  <text x="182" y="534" font-size="17.5" fill="#4f4f4f">Hands-on tap practice + resale-partner integration wired up before launch</text>

  <text x="600" y="600" text-anchor="middle" font-size="16.5" fill="#6d5a3a">Most programs win the pilot and stall on scale — this is the order that ships.</text>
</svg>
