<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID quote lead-time bands by order type</title>
<desc id="d">A timeline in weeks. A first-time custom order runs 8 to 12 weeks, broken into about 4 weeks tooling, 3 to 4 weeks production, 1 to 2 weeks quality control and 1 to 2 weeks shipping. A repeat custom order runs 4 to 6 weeks. A stocked SKU ships in 3 to 7 days. A note states that quote validity of 30 days is standard, a 7-day validity is anchor pressure, and a 90-day validity signals the factory hedging raw-material risk.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">LEAD-TIME BANDS TO SANITY-CHECK</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">What a realistic quote promises — by order type.</text>

<!-- Row 1: first-time custom -->
<text x="70" y="212" font-size="14.5" font-weight="800" fill="#291c0e">First-time</text>
<text x="70" y="231" font-size="14.5" font-weight="800" fill="#291c0e">custom</text>
<text x="250" y="188" font-size="13" font-weight="700" fill="#291c0e">8–12 weeks for a first custom order</text>
<rect x="250" y="196" width="280" height="42" rx="5" fill="#4a5568"/>
<text x="390" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Tooling</text>
<rect x="530" y="196" width="245" height="42" fill="#3d6b6b"/>
<text x="652" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Production</text>
<rect x="775" y="196" width="105" height="42" fill="#c39a5f"/>
<text x="827" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">QC</text>
<rect x="880" y="196" width="105" height="42" rx="0" fill="#2d6a4f"/>
<text x="932" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Ship</text>
<rect x="985" y="196" width="105" height="42" rx="5" fill="#f3ede0" stroke="#cdd3da" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="1037" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#8a8a8a">→12</text>
<text x="250" y="262" font-size="12.5" fill="#6b6b6b">Tooling ~4 wk · Production 3–4 wk · QC 1–2 wk · Ship 1–2 wk</text>

<!-- Row 2: repeat custom -->
<text x="70" y="322" font-size="14.5" font-weight="800" fill="#291c0e">Repeat custom</text>
<rect x="250" y="300" width="420" height="34" rx="5" fill="#3d6b6b"/>
<line x1="530" y1="300" x2="530" y2="334" stroke="#ffffff" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="684" y="322" font-size="13" font-weight="800" fill="#2c5454">4–6 weeks</text>

<!-- Row 3: stocked -->
<text x="70" y="394" font-size="14.5" font-weight="800" fill="#291c0e">Stocked SKU</text>
<rect x="250" y="372" width="70" height="34" rx="5" fill="#3d6b6b"/>
<text x="334" y="394" font-size="13" font-weight="800" fill="#2c5454">3–7 days</text>

<!-- weeks axis -->
<line x1="250" y1="430" x2="1090" y2="430" stroke="#c7c0b0" stroke-width="1.8"/>
<text x="250" y="450" text-anchor="middle" font-size="12" fill="#6b6b6b">0</text>
<text x="390" y="450" text-anchor="middle" font-size="12" fill="#6b6b6b">2</text>
<text x="530" y="450" text-anchor="middle" font-size="12" fill="#6b6b6b">4</text>
<text x="670" y="450" text-anchor="middle" font-size="12" fill="#6b6b6b">6</text>
<text x="810" y="450" text-anchor="middle" font-size="12" fill="#6b6b6b">8</text>
<text x="950" y="450" text-anchor="middle" font-size="12" fill="#6b6b6b">10</text>
<text x="1090" y="450" text-anchor="middle" font-size="12" fill="#6b6b6b">12</text>
<text x="670" y="470" text-anchor="middle" font-size="12.5" fill="#8a8a8a">weeks from PO to delivery</text>

<!-- validity callout -->
<rect x="250" y="490" width="840" height="56" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.8"/>
<text x="670" y="514" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8a6a2f">Quote validity: 30 days is standard.</text>
<text x="670" y="534" text-anchor="middle" font-size="13" fill="#6d5a3a">7-day validity = anchor pressure · 90-day = the factory hedging raw-material risk.</text>

<text x="600" y="590" text-anchor="middle" font-size="14" fill="#4f4f4f">A quote promising "all volumes in 4 weeks" is overstating capacity or gambling on materials.</text>
</svg>
