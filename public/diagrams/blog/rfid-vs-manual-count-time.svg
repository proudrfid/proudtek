<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How manual counting time compares to RFID across three scenarios</title>
<desc id="d">A manual-versus-RFID time comparison in three rows. Scan rate: a manual operator does 15-25 items per minute, while RFID reads 200-1,000+ tags per second. A 10,000-SKU store: 8-12 hours with 4-6 people manually versus 1-2 hours with 2-3 people using RFID. A 50,000-SKU warehouse: 2-3 days of manual verification versus continuous automatic portal reads. Manual cells are red-tinted, RFID cells teal or green.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW THE TIME COMPARES</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Manual counts per item; RFID counts per second — three scenarios, the same gap.</text>

<!-- column headers -->
<text x="80" y="150" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SCENARIO</text>
<text x="560" y="150" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">MANUAL</text>
<text x="948" y="150" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">RFID</text>

<!-- ROW 1 · scan rate -->
<text x="80" y="222" font-size="16" font-weight="700" fill="#291c0e">Scan / read rate</text>
<text x="80" y="244" font-size="12.5" fill="#5c5c5c">per operator</text>
<rect x="380" y="186" width="360" height="92" rx="10" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.6"/>
<text x="560" y="242" text-anchor="middle" font-size="24" font-weight="800" fill="#8b2d2d" font-family="Lora, Georgia, serif">15-25 items/min</text>
<rect x="760" y="186" width="376" height="92" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="948" y="242" text-anchor="middle" font-size="23" font-weight="800" fill="#2c5454" font-family="Lora, Georgia, serif">200-1,000+ tags/sec</text>

<!-- ROW 2 · 10,000-SKU store -->
<text x="80" y="330" font-size="16" font-weight="700" fill="#291c0e">10,000-SKU store</text>
<text x="80" y="352" font-size="12.5" fill="#5c5c5c">full count</text>
<rect x="380" y="294" width="360" height="92" rx="10" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.6"/>
<text x="560" y="350" text-anchor="middle" font-size="22" font-weight="800" fill="#8b2d2d" font-family="Lora, Georgia, serif">8-12 h · 4-6 people</text>
<rect x="760" y="294" width="376" height="92" rx="10" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="948" y="350" text-anchor="middle" font-size="22" font-weight="800" fill="#1f6f3a" font-family="Lora, Georgia, serif">1-2 h · 2-3 people</text>

<!-- ROW 3 · 50,000-SKU warehouse -->
<text x="80" y="438" font-size="16" font-weight="700" fill="#291c0e">50,000-SKU warehouse</text>
<text x="80" y="460" font-size="12.5" fill="#5c5c5c">verification</text>
<rect x="380" y="402" width="360" height="92" rx="10" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.6"/>
<text x="560" y="458" text-anchor="middle" font-size="24" font-weight="800" fill="#8b2d2d" font-family="Lora, Georgia, serif">2-3 days</text>
<rect x="760" y="402" width="376" height="92" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="948" y="452" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454" font-family="Lora, Georgia, serif">continuous portal</text>
<text x="948" y="476" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454" font-family="Lora, Georgia, serif">reads</text>

<text x="600" y="556" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">The unit of work changes from per-item to per-second — that is the whole saving.</text>
</svg>
