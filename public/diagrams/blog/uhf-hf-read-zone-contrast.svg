<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Read-zone contrast — UHF floodlight vs HF bubble</title>
<desc id="d">Two rows compare the read zones. Top row, UHF at 860–960 MHz with far-field radiative coupling: a reader throws a long widening cone along an axis marked from 1 metre to 12 metres, with a pill noting that doubling the distance costs 75 percent of received power (inverse square). Bottom row, HF/NFC at 13.56 MHz with near-field inductive coupling: the same reader shape produces only a small sharp-edged bubble reaching 30 centimetres, the rest of the axis silent, with a pill noting that doubling the distance costs 87.5 percent of power (inverse cube), which creates the sharp edge. A caption warns that the top axis is metres and the bottom is centimetres — floodlight or scalpel, choose the read zone the job needs.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PHYSICS YOU CANNOT PATCH</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Far-field floodlight vs near-field bubble</text>

<text x="70" y="170" font-size="17" font-weight="800" fill="#4a5568">UHF · 860–960 MHz</text>
<text x="70" y="194" font-size="13" fill="#4f4f4f">far-field · radiative</text>
<rect x="300" y="180" width="44" height="110" rx="8" fill="#4a5568"/>
<polygon points="344,225 582,205 582,265 344,245" fill="#cdd5df"/>
<polygon points="582,205 820,188 820,282 582,265" fill="#e2e7ed"/>
<polygon points="820,188 1058,172 1058,298 820,282" fill="#f1f4f7"/>
<line x1="344" y1="318" x2="1058" y2="318" stroke="#4f4f4f" stroke-width="1.5"/>
<line x1="404" y1="311" x2="404" y2="325" stroke="#4f4f4f" stroke-width="1.5"/>
<line x1="1058" y1="311" x2="1058" y2="325" stroke="#4f4f4f" stroke-width="1.5"/>
<text x="404" y="342" text-anchor="middle" font-size="12.5" fill="#4f4f4f">1 m</text>
<text x="1058" y="342" text-anchor="middle" font-size="12.5" fill="#4f4f4f">12 m</text>
<rect x="344" y="352" width="560" height="34" rx="17" fill="#eef1f5" stroke="#4a5568"/>
<text x="624" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#4a5568">double the distance → 75% less power (inverse square)</text>

<text x="70" y="440" font-size="17" font-weight="800" fill="#2c5454">HF/NFC · 13.56 MHz</text>
<text x="70" y="464" font-size="13" fill="#4f4f4f">near-field · inductive</text>
<rect x="300" y="425" width="44" height="110" rx="8" fill="#3d6b6b"/>
<circle cx="390" cy="477" r="44" fill="#dcebeb" stroke="#2c5454" stroke-width="2.5"/>
<rect x="362" y="462" width="56" height="32" rx="4" fill="#ffffff" stroke="#d4a755" stroke-width="1.5"/>
<line x1="344" y1="556" x2="1058" y2="556" stroke="#4f4f4f" stroke-width="1.5"/>
<line x1="344" y1="549" x2="344" y2="563" stroke="#4f4f4f" stroke-width="1.5"/>
<line x1="434" y1="549" x2="434" y2="563" stroke="#4f4f4f" stroke-width="1.5"/>
<text x="344" y="580" text-anchor="middle" font-size="12.5" fill="#4f4f4f">0</text>
<text x="434" y="580" text-anchor="middle" font-size="12.5" fill="#4f4f4f">30 cm</text>
<text x="760" y="548" text-anchor="middle" font-size="13" fill="#5c5c5c">…silence — the field ends here, on purpose</text>
<rect x="344" y="592" width="640" height="34" rx="17" fill="#eef5f5" stroke="#3d6b6b"/>
<text x="664" y="614" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">double the distance → 87.5% less power (inverse cube) → sharp edge</text>

<text x="600" y="648" text-anchor="middle" font-size="13" fill="#5c5c5c">Top axis is metres, bottom is centimetres — floodlight or scalpel, choose the read zone the job actually wants.</text>
</svg>
