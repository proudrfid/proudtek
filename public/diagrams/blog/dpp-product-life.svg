<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="plTitle plDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="plTitle">One passport, six lives: the DPP must stay readable across the whole product life</title>
  <desc id="plDesc">A Digital Product Passport must remain accessible across six lifecycle stages: manufacturing, retail, consumer use, repair, second-hand resale, and end-of-life recycling. A single NFC-plus-QR carrier persists through all six — single-use printed barcodes do not satisfy this. Three non-negotiables sit underneath: readable by both machine and human, readable across EU borders using the same standards, and built on open standards such as CIRPASS and ISO rather than a proprietary closed app.</desc>

  <defs>
    <radialGradient id="plGlow" cx="50%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#f9eed6"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="plSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#3a4656"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#plGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="62" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="3" fill="#b0894c">PERSISTENT OVER THE PRODUCT'S WHOLE LIFE</text>
  <text x="600" y="94" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">One passport, six lives</text>

  <!-- lifecycle line -->
  <line x1="120" y1="240" x2="1080" y2="240" stroke="#e4c98f" stroke-width="3"/>

  <!-- 6 stage cards -->
  <g>
    <!-- 1 Manufacturing -->
    <circle cx="120" cy="240" r="9" fill="#2d6a4f"/>
    <rect x="46" y="266" width="150" height="150" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="121" cy="308" r="22" fill="#2d6a4f"/><text x="121" y="315" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
    <text x="121" y="356" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Manufacturing</text>
    <text x="121" y="378" text-anchor="middle" font-size="11.5" fill="#6d5a3a">spin · weave</text>
    <text x="121" y="394" text-anchor="middle" font-size="11.5" fill="#6d5a3a">dye · sew</text>

    <!-- 2 Retail -->
    <circle cx="311" cy="240" r="9" fill="#4a5568"/>
    <rect x="237" y="266" width="150" height="150" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="312" cy="308" r="22" fill="#4a5568"/><text x="312" y="315" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
    <text x="312" y="356" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Retail</text>
    <text x="312" y="378" text-anchor="middle" font-size="11.5" fill="#6d5a3a">shelf</text>
    <text x="312" y="394" text-anchor="middle" font-size="11.5" fill="#6d5a3a">point of sale</text>

    <!-- 3 Consumer use -->
    <circle cx="502" cy="240" r="9" fill="#c39a5f"/>
    <rect x="428" y="266" width="150" height="150" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="503" cy="308" r="22" fill="#c39a5f"/><text x="503" y="315" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
    <text x="503" y="356" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Consumer use</text>
    <text x="503" y="378" text-anchor="middle" font-size="11.5" fill="#6d5a3a">wear · wash</text>
    <text x="503" y="394" text-anchor="middle" font-size="11.5" fill="#6d5a3a">care</text>

    <!-- 4 Repair -->
    <circle cx="693" cy="240" r="9" fill="#3d6b6b"/>
    <rect x="619" y="266" width="150" height="150" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="694" cy="308" r="22" fill="#3d6b6b"/><text x="694" y="315" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">4</text>
    <text x="694" y="356" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Repair</text>
    <text x="694" y="378" text-anchor="middle" font-size="11.5" fill="#6d5a3a">mend</text>
    <text x="694" y="394" text-anchor="middle" font-size="11.5" fill="#6d5a3a">spare parts</text>

    <!-- 5 Resale -->
    <circle cx="884" cy="240" r="9" fill="#6c5127"/>
    <rect x="810" y="266" width="150" height="150" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="885" cy="308" r="22" fill="#6c5127"/><text x="885" y="315" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">5</text>
    <text x="885" y="356" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Resale</text>
    <text x="885" y="378" text-anchor="middle" font-size="11.5" fill="#6d5a3a">verify</text>
    <text x="885" y="394" text-anchor="middle" font-size="11.5" fill="#6d5a3a">re-list</text>

    <!-- 6 End-of-life -->
    <circle cx="1075" cy="240" r="9" fill="#2d6a4f"/>
    <rect x="1001" y="266" width="150" height="150" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="1076" cy="308" r="22" fill="#2d6a4f"/><text x="1076" y="315" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">6</text>
    <text x="1076" y="356" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">End-of-life</text>
    <text x="1076" y="378" text-anchor="middle" font-size="11.5" fill="#6d5a3a">recycle</text>
    <text x="1076" y="394" text-anchor="middle" font-size="11.5" fill="#6d5a3a">take-back</text>
  </g>

  <!-- persistence bar -->
  <rect x="46" y="440" width="1105" height="58" rx="14" fill="#eef7f1" stroke="#bfe0cd" stroke-width="2"/>
  <g transform="translate(84,469)">
    <rect x="-18" y="-16" width="36" height="30" rx="5" fill="url(#plSteel)"/>
    <path d="M22 -10 a13 13 0 0 1 0 20" fill="none" stroke="#1fcefb" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30 -16 a20 20 0 0 1 0 32" fill="none" stroke="#1fcefb" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>
  <text x="140" y="465" font-size="14.5" font-weight="800" fill="#1f6f3a">The same NFC + QR reads at every stage above.</text>
  <text x="140" y="486" font-size="12.5" fill="#4f5b52">Single-use printed barcodes fail here — they don't survive the whole life.</text>

  <!-- footer: 3 non-negotiables -->
  <path d="M20 556 h1160 v77 a22 22 0 0 1 -22 22 h-1116 a22 22 0 0 1 -22 -22 z" fill="url(#plSteel)"/>
  <text x="600" y="580" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#c9d2df">THREE NON-NEGOTIABLES FOR THE DATA CARRIER</text>
  <g text-anchor="middle">
    <text x="245" y="612" font-size="14.5" font-weight="800" fill="#ffffff">Machine + human readable</text>
    <text x="245" y="632" font-size="11.5" fill="#c9d2df">NFC or RFID, plus a QR fallback</text>
    <line x1="470" y1="576" x2="470" y2="636" stroke="#5a6577" stroke-width="1.5"/>
    <text x="600" y="612" font-size="14.5" font-weight="800" fill="#ffffff">Reads across EU borders</text>
    <text x="600" y="632" font-size="11.5" fill="#c9d2df">same standards in Spain and Germany</text>
    <line x1="730" y1="576" x2="730" y2="636" stroke="#5a6577" stroke-width="1.5"/>
    <text x="955" y="612" font-size="14.5" font-weight="800" fill="#ffffff">Open standards, no closed app</text>
    <text x="955" y="632" font-size="11.5" fill="#f4d06f">CIRPASS · ISO 22877</text>
  </g>
</svg>
