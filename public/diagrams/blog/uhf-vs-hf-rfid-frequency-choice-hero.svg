<rect x="686" y="458" width="400" height="36" rx="18" fill="#ffffff" stroke="#e6dfd2"/>
<text x="886" y="481" text-anchor="middle" font-size="14" fill="#4f4f4f">0–30 cm tap range · one global regulation</text>

<circle cx="600" cy="320" r="33" fill="#c39a5f"/>
<text x="600" y="329" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">vs</text>

<rect x="64" y="540" width="1072" height="74" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="572" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">100+ tags at 3+ metres → UHF · smartphone or single-card security → HF/NFC</text>
<text x="600" y="598" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The wrong choice is a mid-project migration; the right one is an hour in a conference room.</text>
<text x="600" y="640" text-anchor="middle" font-size="13" fill="#5c5c5c">Same physics for everyone — the only variable is your use case.</text>
</svg>
