<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">125 kHz near-field — why LF shrugs at metal, moisture and grime</title>
  <desc id="d">The 125 kHz wavelength is about 2,400 m, so cards work deep in the near-field inductive regime: a thick multi-turn coil couples magnetically with the reader. Read range 5-15 cm on standard readers and 60-80 cm on long-range LF readers for barrier gates and windshield use.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">A magnet handshake, not a radio link</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Wavelength ~2,400 m — the card sits so deep in the near field that grime and metal barely matter</text>
  <g transform="translate(80,150)">
    <rect x="0" y="20" width="260" height="170" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
    <ellipse cx="130" cy="105" rx="92" ry="58" fill="none" stroke="#3d6b6b" stroke-width="3.5"/>
    <ellipse cx="130" cy="105" rx="78" ry="47" fill="none" stroke="#3d6b6b" stroke-width="3"/>
    <ellipse cx="130" cy="105" rx="64" ry="36" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
    <ellipse cx="130" cy="105" rx="50" ry="26" fill="none" stroke="#3d6b6b" stroke-width="2"/>
    <text x="52" y="216" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">many-turn LF coil, thick winding</text>
    <g stroke="#c39a5f" stroke-width="2" fill="none" opacity="0.85">
      <path d="M 290 60 C 360 30 430 30 500 60"/>
      <path d="M 290 105 C 360 85 430 85 500 105"/>
      <path d="M 290 150 C 360 175 430 175 500 150"/>
    </g>
    <rect x="510" y="20" width="240" height="170" rx="14" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2.5"/>
    <text x="534" y="70" font-family="Georgia, serif" font-size="18" fill="#2c5454">LF reader</text>
    <text x="534" y="102" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">standard: 5-15 cm</text>
    <text x="534" y="126" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">long-range: 60-80 cm</text>
    <text x="534" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">barrier gates, windshields</text>
  </g>
  <g transform="translate(80,420)">
    <rect x="0" y="0" width="1020" height="140" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="26" y="40" font-family="Georgia, serif" font-size="18" fill="#291c0e">Where this envelope earns its keep</text>
    <text x="26" y="74" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Dirty windshields, mixed-metal parking-lane hardware and outdoor moisture all sit inside the LF operating envelope</text>
    <text x="26" y="102" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">Greasy, dusty, metal-cage industrial floors: LF pass-rates run materially higher than HF in the same conditions</text>
    <text x="26" y="128" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Long-range LF is the default specification for parking-barrier estates worldwide</text>
  </g>
</svg>
