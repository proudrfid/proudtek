<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five white-label pitfalls paired with the contract clause that prevents each</title>
<desc id="d">A two-column risk map with five rows. Color mismatch, where hex looks right on screen but prints differently on the substrate, is prevented by specifying Pantone codes and approving a printed sample first. Logo placement drift, where the factory shifts the logo to suit its press, is prevented by locking placement in a proof signed by both parties. Mid-run chip substitution, where an equivalent chip is swapped in without notice, is prevented by naming the chip SKU in the contract and requiring sample approval. Packaging shrinkage, where lighter materials are used to save cost, is prevented by specifying exact GSM, gauge and finishing. Lead-time slip from holidays or material shortages is prevented by building a 30-day buffer and confirming status weekly in peak season.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE WAYS IT GOES WRONG — AND THE FIX</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Every one has happened on a first order. Each has one specific contractual cure.</text>

<text x="92" y="118" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#a85a5a">THE PITFALL</text>
<text x="672" y="118" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#3a6a4a">THE CLAUSE THAT PREVENTS IT</text>

<!-- row 1 -->
<rect x="64" y="130" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="130" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="162" font-size="15.5" font-weight="800" fill="#291c0e">Color mismatch</text>
<text x="92" y="185" font-size="12.5" fill="#7a5555">Hex looks right on screen, prints differently on the substrate.</text>
<polyline points="576,163 594,171 576,179" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="130" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="170" r="12" fill="#1f6f3a"/><polyline points="634,170 638,175 646,164" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="176" font-size="14" font-weight="700" fill="#26543a">Specify Pantone codes; approve a printed sample first.</text>

<!-- row 2 -->
<rect x="64" y="220" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="220" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="252" font-size="15.5" font-weight="800" fill="#291c0e">Logo placement drift</text>
<text x="92" y="275" font-size="12.5" fill="#7a5555">Factory shifts the logo to suit its printing equipment.</text>
<polyline points="576,253 594,261 576,269" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="220" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="260" r="12" fill="#1f6f3a"/><polyline points="634,260 638,265 646,254" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="266" font-size="14" font-weight="700" fill="#26543a">Lock placement in a printed proof signed by both parties.</text>

<!-- row 3 -->
<rect x="64" y="310" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="310" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="342" font-size="15.5" font-weight="800" fill="#291c0e">Chip substitution mid-run</text>
<text x="92" y="365" font-size="12.5" fill="#7a5555">An equivalent chip swapped in without notice.</text>
<polyline points="576,343 594,351 576,359" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="310" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="350" r="12" fill="#1f6f3a"/><polyline points="634,350 638,355 646,344" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="356" font-size="14" font-weight="700" fill="#26543a">Name the chip SKU in the contract; require sample approval.</text>

<!-- row 4 -->
<rect x="64" y="400" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="400" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="432" font-size="15.5" font-weight="800" fill="#291c0e">Packaging shrinkage</text>
<text x="92" y="455" font-size="12.5" fill="#7a5555">Lighter materials than agreed, to save cost.</text>
<polyline points="576,433 594,441 576,449" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="400" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="440" r="12" fill="#1f6f3a"/><polyline points="634,440 638,445 646,434" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="446" font-size="14" font-weight="700" fill="#26543a">Specify exact GSM, gauge and finishing.</text>

<!-- row 5 -->
<rect x="64" y="490" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="490" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="522" font-size="15.5" font-weight="800" fill="#291c0e">Lead-time slip</text>
<text x="92" y="545" font-size="12.5" fill="#7a5555">Holidays and material shortages stretch the schedule.</text>
<polyline points="576,523 594,531 576,539" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="490" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="530" r="12" fill="#1f6f3a"/><polyline points="634,530 638,535 646,524" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="536" font-size="14" font-weight="700" fill="#26543a">Build a 30-day buffer; confirm status weekly in peak season.</text>

<text x="600" y="612" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Sign the right column before the first order, not after the dispute.</text>
</svg>
