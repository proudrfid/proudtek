<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How RFID tag encapsulation seals the chip and antenna against water, chemicals and impact</title>
<desc id="d">A cross-section of an encapsulated RFID tag. An over-moulded encapsulant surrounds a substrate carrying an antenna coil and a chip. On the left, three threats are blocked at the seal: water and steam, detergents and acids and bases, and abrasion and impact. A note explains that silicone and most plastics stay RF-transparent at HF 13.56 MHz and UHF 860 to 960 MHz, with read range dropping less than 10 percent versus a bare inlay, while metal housings or metallic fillers detune the antenna and kill range.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ENCAPSULATION · SEALING THE INLAY</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">Waterproofing embeds the chip and antenna in a material that blocks moisture, chemicals and stress.</text>

<!-- threats blocked (left) -->
<path d="M126 150 C138 166, 136 180, 126 180 C116 180, 114 166, 126 150 Z" fill="#3d6b6b"/>
<text x="150" y="172" font-size="13.5" font-weight="700" fill="#291c0e">Water &amp; steam</text>
<circle cx="126" cy="232" r="13" fill="none" stroke="#8b2d2d" stroke-width="2.6"/>
<line x1="117" y1="223" x2="135" y2="241" stroke="#8b2d2d" stroke-width="2.6"/>
<text x="150" y="237" font-size="13.5" font-weight="700" fill="#291c0e">Detergents, acids, bases</text>
<polygon points="126,286 132,300 120,300" fill="#8b2d2d"/><polygon points="126,316 132,302 120,302" fill="#8b2d2d"/>
<text x="150" y="303" font-size="13.5" font-weight="700" fill="#291c0e">Abrasion &amp; impact</text>

<!-- seal wall -->
<text x="338" y="150" text-anchor="end" font-size="12.5" font-weight="800" letter-spacing="0.6" fill="#8b2d2d">SEALED OUT</text>
<line x1="345" y1="162" x2="345" y2="318" stroke="#8b2d2d" stroke-width="2" stroke-dasharray="5 5"/>

<!-- cross-section capsule -->
<rect x="360" y="176" width="474" height="180" rx="42" fill="#e7efef" stroke="#4a5568" stroke-width="3"/>
<rect x="410" y="268" width="384" height="16" rx="3" fill="#cfc4ad"/>
<rect x="470" y="238" width="256" height="76" rx="9" fill="none" stroke="#c39a5f" stroke-width="3.2"/>
<rect x="488" y="250" width="220" height="52" rx="7" fill="none" stroke="#d4a755" stroke-width="3.2"/>
<rect x="586" y="260" width="26" height="26" rx="3" fill="#291c0e"/>

<text x="597" y="210" text-anchor="middle" font-size="13.5" font-weight="800" fill="#3a4456">encapsulant over-mould</text>
<line x1="880" y1="252" x2="732" y2="266" stroke="#c8b79a" stroke-width="1.8"/>
<text x="886" y="256" font-size="13" font-weight="700" fill="#5c5c5c">antenna coil</text>
<line x1="880" y1="300" x2="612" y2="276" stroke="#c8b79a" stroke-width="1.8"/>
<text x="886" y="304" font-size="13" font-weight="700" fill="#5c5c5c">chip (IC)</text>
<line x1="360" y1="300" x2="300" y2="300" stroke="#c8b79a" stroke-width="0"/>
<text x="597" y="344" text-anchor="middle" font-size="12.5" fill="#4f4f4f">substrate / inlay</text>

<!-- RF note -->
<rect x="64" y="404" width="1072" height="184" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="90" y="442" font-size="15" font-weight="800" letter-spacing="0.4" fill="#2c5454">RF-TRANSPARENT — MOSTLY</text>
<circle cx="104" cy="482" r="7" fill="#1f6f3a"/>
<text x="124" y="487" font-size="14" fill="#333333">Silicone and most plastics stay RF-transparent at HF (13.56 MHz) and UHF (860–960 MHz):</text>
<text x="124" y="512" font-size="14" fill="#333333">read range drops less than 10% versus a bare, unencapsulated inlay.</text>
<circle cx="104" cy="546" r="7" fill="#8b2d2d"/>
<text x="124" y="551" font-size="14" fill="#333333">Metal housings or metallic fillers detune the antenna and kill range — keep them out of the mix.</text>
</svg>
