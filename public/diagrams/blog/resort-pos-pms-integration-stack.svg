<text x="600" y="518" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">One tap, one folio.</text>
<text x="600" y="548" text-anchor="middle" font-size="14" fill="#291c0e">On Lightspeed, the POS + PMS + cashless trio collapses to two.</text>
<text x="600" y="582" text-anchor="middle" font-size="13" fill="#5c5c5c">Ask every partner: reconciliation cadence, PCI-DSS scope, offline failure mode, per-tap fees ($0.05–0.10).</text>
