<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five-step sequence to pass a Target RFID compliance audit</title>
<desc id="d">Five ordered steps to Target RFID compliance. One, register a Target Vendor ID, which ties every shipment to your read-rate scorecard. Two, encode SGTIN-96 on your GS1 company prefix, because Target validates the EDI 856 against the tag's encoded GTIN. Three, apply tags per the Placement Standards Guide: hidden-in-garment placement reads fine, but foil or metallized backing fails. Four, pre-ship tunnel-read every carton, aiming for 97 percent or better at your own dock so shipments land at 95 percent or better at Target. Five, submit the EDI 856 ASN with RFID hierarchy: GTIN at item, SSCC at carton, BOL at shipment.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TARGET RFID · FIVE STEPS TO COMPLIANCE</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">How suppliers actually pass the audit</text>
<text x="600" y="132" text-anchor="middle" font-size="16" fill="#4f4f4f">Five moves, in order — from Vendor ID to the EDI 856 that reconciles every tag.</text>

<line x1="120" y1="196" x2="120" y2="544" stroke="#cfe0e0" stroke-width="3"/>

<!-- Step 1 -->
<circle cx="120" cy="214" r="18" fill="#3d6b6b"/>
<text x="120" y="220" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
<text x="160" y="208" font-size="15.5" font-weight="700" fill="#291c0e">Register a Target Vendor ID</text>
<text x="160" y="232" font-size="13" fill="#4f4f4f">Ties every shipment to your read-rate scorecard.</text>
<rect x="912" y="200" width="178" height="28" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="1001" y="219" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">PREREQUISITE</text>

<!-- Step 2 -->
<circle cx="120" cy="292" r="18" fill="#3d6b6b"/>
<text x="120" y="298" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<text x="160" y="286" font-size="15.5" font-weight="700" fill="#291c0e">Encode SGTIN-96 on your GS1 prefix</text>
<text x="160" y="310" font-size="13" fill="#4f4f4f">Target validates the EDI 856 against the tag's GTIN.</text>
<rect x="912" y="278" width="178" height="28" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="1001" y="297" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">GS1 PREFIX</text>

<!-- Step 3 -->
<circle cx="120" cy="370" r="18" fill="#3d6b6b"/>
<text x="120" y="376" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<text x="160" y="364" font-size="15.5" font-weight="700" fill="#291c0e">Tag per the Placement Standards Guide</text>
<text x="160" y="388" font-size="13" fill="#4f4f4f">Hidden-in-garment reads fine; foil or metallized backing fails.</text>
<rect x="912" y="356" width="178" height="28" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="1001" y="375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">PHOTO GUIDE</text>

<!-- Step 4 -->
<circle cx="120" cy="448" r="18" fill="#3d6b6b"/>
<text x="120" y="454" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4</text>
<text x="160" y="442" font-size="15.5" font-weight="700" fill="#291c0e">Pre-ship tunnel-read every carton</text>
<text x="160" y="466" font-size="13" fill="#4f4f4f">Aim 97%+ at your dock to land 95%+ at Target's.</text>
<rect x="912" y="434" width="178" height="28" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="1001" y="453" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">97%+ AT DOCK</text>

<!-- Step 5 -->
<circle cx="120" cy="526" r="18" fill="#3d6b6b"/>
<text x="120" y="532" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">5</text>
<text x="160" y="520" font-size="15.5" font-weight="700" fill="#291c0e">Submit the EDI 856 ASN</text>
<text x="160" y="544" font-size="13" fill="#4f4f4f">GTIN at item, SSCC at carton, BOL at shipment.</text>
<rect x="912" y="512" width="178" height="28" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="1001" y="531" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">ASN HIERARCHY</text>

<text x="600" y="596" text-anchor="middle" font-size="14" fill="#4f4f4f">Miss any one and the carton flags at receiving — even when the tags read clean.</text>
</svg>
