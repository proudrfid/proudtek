<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="hgTitle hgDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="hgTitle">How to choose hotel key card suppliers</title>
  <desc id="hgDesc">The spec chain from silicon to finished card — silicon chip, antenna inlay, card body, offset print, encoding — leading to a finished RFID key card, evaluated against six procurement gates: chip compatibility, print and material, encoding support, MOQ and pricing, lead time, and certifications.</desc>

  <defs>
    <radialGradient id="hgBg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="hgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#291c0e"/>
      <stop offset="100%" stop-color="#6c5127"/>
    </linearGradient>
    <marker id="hgArrow" markerWidth="9" markerHeight="9" refX="3" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#c39a5f"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#hgBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <!-- Eyebrow + tagline -->
  <text x="600" y="66" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="3" fill="#6d5a3a">SOURCING HOTEL KEY CARDS</text>
  <text x="600" y="97" text-anchor="middle" font-size="16.5" fill="#4f4f4f">From silicon to finished card — what to evaluate before the volume order ships</text>

  <!-- ===== Spec chain ===== -->
  <g>
    <!-- connective arrows -->
    <line x1="222" y1="196" x2="255" y2="196" stroke="#c39a5f" stroke-width="3.5" marker-end="url(#hgArrow)"/>
    <line x1="402" y1="196" x2="435" y2="196" stroke="#c39a5f" stroke-width="3.5" marker-end="url(#hgArrow)"/>
    <line x1="582" y1="196" x2="615" y2="196" stroke="#c39a5f" stroke-width="3.5" marker-end="url(#hgArrow)"/>
    <line x1="762" y1="196" x2="795" y2="196" stroke="#c39a5f" stroke-width="3.5" marker-end="url(#hgArrow)"/>
    <line x1="942" y1="196" x2="975" y2="196" stroke="#c39a5f" stroke-width="3.5" marker-end="url(#hgArrow)"/>

    <!-- stage 1: silicon -->
    <rect x="72" y="164" width="150" height="64" rx="14" fill="#fbf8f2" stroke="#d9b98a" stroke-width="2"/>
    <text x="147" y="192" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Silicon</text>
    <text x="147" y="212" text-anchor="middle" font-size="12" fill="#6d5a3a">NXP chip</text>
    <!-- stage 2: inlay -->
    <rect x="252" y="164" width="150" height="64" rx="14" fill="#fbf8f2" stroke="#d9b98a" stroke-width="2"/>
    <text x="327" y="192" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Inlay</text>
    <text x="327" y="212" text-anchor="middle" font-size="12" fill="#6d5a3a">antenna</text>
    <!-- stage 3: card body -->
    <rect x="432" y="164" width="150" height="64" rx="14" fill="#fbf8f2" stroke="#d9b98a" stroke-width="2"/>
    <text x="507" y="192" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Card body</text>
    <text x="507" y="212" text-anchor="middle" font-size="12" fill="#6d5a3a">PVC / PET</text>
    <!-- stage 4: print -->
    <rect x="612" y="164" width="150" height="64" rx="14" fill="#fbf8f2" stroke="#d9b98a" stroke-width="2"/>
    <text x="687" y="192" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Print</text>
    <text x="687" y="212" text-anchor="middle" font-size="12" fill="#6d5a3a">offset / digital</text>
    <!-- stage 5: encode -->
    <rect x="792" y="164" width="150" height="64" rx="14" fill="#fbf8f2" stroke="#d9b98a" stroke-width="2"/>
    <text x="867" y="192" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Encode</text>
    <text x="867" y="212" text-anchor="middle" font-size="12" fill="#6d5a3a">sector keys</text>

    <!-- finished card -->
    <rect x="982" y="150" width="146" height="92" rx="14" fill="url(#hgDark)"/>
    <rect x="1002" y="172" width="82" height="52" rx="7" fill="#ffffff" opacity="0.96"/>
    <rect x="1002" y="172" width="20" height="52" rx="7" fill="#d4a755"/>
    <g fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round">
      <path d="M1058 184 a11 11 0 0 1 0 28"/>
      <path d="M1069 178 a20 20 0 0 1 0 40"/>
    </g>
    <text x="1055" y="236" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f4efe4">Finished card</text>
  </g>

  <!-- ===== Six gates ===== -->
  <text x="600" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Evaluate every supplier across six gates</text>

  <g>
    <!-- gate template: 6 across, each 170 wide at x = 66 + i*179 -->
    <!-- 1 -->
    <rect x="66" y="336" width="170" height="150" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="151" cy="378" r="20" fill="#c39a5f"/>
    <path d="M143 378 l5 6 l11 -13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="151" y="428" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Chip</text>
    <text x="151" y="449" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">compatibility</text>
    <text x="151" y="470" text-anchor="middle" font-size="12" fill="#6d5a3a">tested on locks</text>
    <!-- 2 -->
    <rect x="245" y="336" width="170" height="150" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="330" cy="378" r="20" fill="#3d6b6b"/>
    <path d="M322 378 l5 6 l11 -13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="330" y="428" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Print &amp;</text>
    <text x="330" y="449" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">material</text>
    <text x="330" y="470" text-anchor="middle" font-size="12" fill="#6d5a3a">samples first</text>
    <!-- 3 -->
    <rect x="424" y="336" width="170" height="150" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="509" cy="378" r="20" fill="#4a5568"/>
    <path d="M501 378 l5 6 l11 -13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="509" y="428" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Encoding</text>
    <text x="509" y="449" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">support</text>
    <text x="509" y="470" text-anchor="middle" font-size="12" fill="#6d5a3a">PMS + injection</text>
    <!-- 4 -->
    <rect x="603" y="336" width="170" height="150" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="688" cy="378" r="20" fill="#6d5a3a"/>
    <path d="M680 378 l5 6 l11 -13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="688" y="428" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">MOQ &amp;</text>
    <text x="688" y="449" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">pricing</text>
    <text x="688" y="470" text-anchor="middle" font-size="12" fill="#6d5a3a">landed cost</text>
    <!-- 5 -->
    <rect x="782" y="336" width="170" height="150" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="867" cy="378" r="20" fill="#2d6a4f"/>
    <path d="M859 378 l5 6 l11 -13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="867" y="428" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Lead</text>
    <text x="867" y="449" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">time</text>
    <text x="867" y="470" text-anchor="middle" font-size="12" fill="#6d5a3a">rush option?</text>
    <!-- 6 -->
    <rect x="961" y="336" width="170" height="150" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="1046" cy="378" r="20" fill="#8b2d2d"/>
    <path d="M1038 378 l5 6 l11 -13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1046" y="442" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Certifications</text>
    <text x="1046" y="470" text-anchor="middle" font-size="12" fill="#6d5a3a">ISO reports</text>
  </g>

  <!-- ===== Footer tagline ===== -->
  <rect x="66" y="518" width="1068" height="104" rx="16" fill="url(#hgDark)"/>
  <text x="600" y="562" text-anchor="middle" font-size="21" font-weight="800" fill="#d4a755">First tap works — or a front desk full of apologies.</text>
  <text x="600" y="594" text-anchor="middle" font-size="15" fill="#f4efe4">Systematic supplier evaluation is the difference between the two.</text>
</svg>
