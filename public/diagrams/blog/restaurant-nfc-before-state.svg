<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="bsTitle bsDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="bsTitle">The restaurant group's review picture before NFC</title>
  <desc id="bsDesc">The baseline before tap-to-review cards: about 20 Google reviews a week across all six locations, a 0.04% conversion of covers to reviews. The average star rating was 4.2 out of 5, skewed by 1-star reviews from upset guests because happy guests rarely posted. The old email-survey program had an 8% open rate, a 1.4% completed-and-posted rate, and cost $4.20 per review. The six locations ran about 1,800 covers a week each, roughly 56,000 covers a month in total. The stated goal was to lift volume threefold and the rating to 4.5-plus within 90 days.</desc>
  <defs>
    <radialGradient id="bsBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="bsDark" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bsBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="62" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#6d5a3a">WHERE THE REVIEWS STOOD BEFORE NFC</text>

  <!-- Left hero: ~20/week baseline -->
  <rect x="56" y="100" width="512" height="324" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="84" y="126" width="252" height="34" rx="17" fill="#efe0bf"/>
  <text x="210" y="149" text-anchor="middle" font-size="14.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">BASELINE REVIEW VOLUME</text>
  <text x="312" y="268" text-anchor="middle" font-size="94" font-weight="800" fill="#291c0e">~20<tspan font-size="40" fill="#6d5a3a"> /wk</tspan></text>
  <text x="312" y="308" text-anchor="middle" font-size="16.5" fill="#4f4f4f">Google reviews across all 6 locations</text>
  <text x="312" y="333" text-anchor="middle" font-size="14.5" fill="#6d5a3a">just 0.04% of covers ever converted</text>
  <rect x="84" y="366" width="456" height="20" rx="10" fill="#efe0bf"/>
  <rect x="84" y="366" width="26" height="20" rx="10" fill="#c39a5f"/>
  <text x="312" y="411" text-anchor="middle" font-size="13.5" font-style="italic" fill="#6d5a3a">the sliver of happy guests who actually posted</text>

  <!-- Right: three pain cards -->
  <rect x="600" y="100" width="544" height="96" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="636" y="167" font-size="46" font-weight="800" fill="#291c0e">4.2 ★</text>
  <text x="808" y="146" font-size="20" font-weight="700" fill="#291c0e">skewed star rating</text>
  <text x="808" y="173" font-size="15" fill="#4f4f4f">dragged down by upset 1-star guests</text>

  <rect x="600" y="210" width="544" height="96" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="636" y="277" font-size="46" font-weight="800" fill="#291c0e">1.4%</text>
  <text x="808" y="256" font-size="20" font-weight="700" fill="#291c0e">email posted-and-public rate</text>
  <text x="808" y="283" font-size="15" fill="#4f4f4f">off an 8% open rate — a polite silence</text>

  <rect x="600" y="320" width="544" height="96" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="636" y="387" font-size="46" font-weight="800" fill="#8b2d2d">$4.20</text>
  <text x="808" y="366" font-size="20" font-weight="700" fill="#291c0e">per review, the email way</text>
  <text x="808" y="393" font-size="15" fill="#4f4f4f">service cost + incentives, all in</text>

  <!-- Bottom dark strip -->
  <rect x="56" y="444" width="1088" height="96" rx="16" fill="url(#bsDark)"/>
  <text x="88" y="486" font-size="18" font-weight="700" fill="#ffffff">The food was fine. The asking was broken.</text>
  <text x="88" y="516" font-size="18" font-weight="800" fill="#f0d9a8">Happy guests said "lovely, thanks" — and typed nothing.</text>
  <text x="1112" y="484" text-anchor="end" font-size="14.5" font-weight="700" fill="#e9d9b8">6 locations · ~1,800 covers/wk each</text>
  <text x="1112" y="510" text-anchor="end" font-size="14.5" font-weight="700" fill="#e9d9b8">~56K covers/month combined</text>

  <text x="600" y="582" text-anchor="middle" font-size="14.5" fill="#6d5a3a">The goal: lift review volume 3x and the rating to 4.5+ within 90 days — and undercut the email program on cost per review.</text>
</svg>
