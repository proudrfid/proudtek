<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Steel drum refill circulation loop — one RFID identity through 5–10 round trips</title>
  <desc id="d">Five-stage circular flow of a returnable steel drum: 1 fill line, where the EPC is linked to batch and lot and the fill record is written; 2 truck gate, where the outbound manifest is validated at the dock-door portal; 3 customer site, with receiving read, dispense log and the empty drum flagged for collection; 4 empty return, where custody is confirmed because an identified drum is a billable drum; 5 reconditioner, running caustic wash at 85 degrees C, shot-blast at 620 kPa and repaint bake at 140 degrees C — the stage where paint marks and labels die, while the welded RFID tag reads on for 10 or more cycles. The loop returns to the fill line. Center statistic: 5–10 round trips in a drum's working life, with the same EPC on every lap so custody, cycle count and test history accumulate on one record; past the cycle threshold the drum goes to disposal review. Caption: portal reads at the fill line, truck gate and reconditioner receiving dock process 60+ drums per minute.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c39a5f"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE REFILL LOOP</text>
  <text x="600" y="92" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">One welded identity, lap after lap</text>

  <!-- ============ node 1: fill line (top) ============ -->
  <rect x="492" y="122" width="216" height="100" rx="16" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <circle cx="516" cy="146" r="13" fill="#4a5568"/>
  <text x="516" y="151" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text>
  <text x="538" y="151" font-size="15.5" font-weight="700" fill="#291c0e">Fill line</text>
  <text x="516" y="180" font-size="12.5" fill="#5c5c5c">EPC linked to batch and lot;</text>
  <text x="516" y="197" font-size="12.5" fill="#5c5c5c">fill record written at the spout</text>

  <!-- ============ node 2: truck gate (right) ============ -->
  <rect x="908" y="252" width="222" height="100" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="932" cy="276" r="13" fill="#4a5568"/>
  <text x="932" y="281" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text>
  <text x="954" y="281" font-size="15.5" font-weight="700" fill="#291c0e">Truck gate</text>
  <text x="932" y="310" font-size="12.5" fill="#5c5c5c">outbound manifest validated</text>
  <text x="932" y="327" font-size="12.5" fill="#5c5c5c">at the dock-door portal</text>

  <!-- ============ node 3: customer site (bottom right) ============ -->
  <rect x="742" y="478" width="224" height="100" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="766" cy="502" r="13" fill="#4a5568"/>
  <text x="766" y="507" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text>
  <text x="788" y="507" font-size="15.5" font-weight="700" fill="#291c0e">Customer site</text>
  <text x="766" y="536" font-size="12.5" fill="#5c5c5c">receiving read, dispense log,</text>
  <text x="766" y="553" font-size="12.5" fill="#5c5c5c">empty flagged for collection</text>

  <!-- ============ node 4: empty return (bottom left) ============ -->
  <rect x="238" y="478" width="224" height="100" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="262" cy="502" r="13" fill="#4a5568"/>
  <text x="262" y="507" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text>
  <text x="284" y="507" font-size="15.5" font-weight="700" fill="#291c0e">Empty return</text>
  <text x="262" y="536" font-size="12.5" fill="#5c5c5c">custody confirmed — an</text>
  <text x="262" y="553" font-size="12.5" fill="#5c5c5c">identified drum is a billable drum</text>

  <!-- ============ node 5: reconditioner (left) ============ -->
  <rect x="66" y="236" width="244" height="152" rx="16" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <circle cx="90" cy="260" r="13" fill="#4a5568"/>
  <text x="90" y="265" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">5</text>
  <text x="112" y="265" font-size="15.5" font-weight="700" fill="#291c0e">Reconditioner</text>
  <text x="90" y="292" font-size="12.5" fill="#5c5c5c">caustic wash 85 °C · shot-blast</text>
  <text x="90" y="309" font-size="12.5" fill="#5c5c5c">620 kPa · repaint bake 140 °C</text>
  <rect x="84" y="322" width="208" height="24" rx="8" fill="#fdf4f4" stroke="#8b2d2d" stroke-width="1.4"/>
  <text x="188" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#8b2d2d">paint marks + labels die here</text>
  <rect x="84" y="352" width="208" height="24" rx="8" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.4"/>
  <text x="188" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">the tag reads on — 10+ cycles</text>

  <!-- ============ loop arrows ============ -->
  <path d="M714 172 Q950 190 1010 246" fill="none" stroke="#c39a5f" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M1024 358 Q1010 440 936 472" fill="none" stroke="#c39a5f" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M736 528 Q600 528 468 528" fill="none" stroke="#c39a5f" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M232 528 Q170 470 178 394" fill="none" stroke="#c39a5f" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M190 230 Q260 160 486 168" fill="none" stroke="#c39a5f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ============ center stat ============ -->
  <text x="600" y="330" text-anchor="middle" font-size="46" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">5–10</text>
  <text x="600" y="358" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d5a3a">ROUND TRIPS IN A WORKING LIFE</text>
  <text x="600" y="386" text-anchor="middle" font-size="13" fill="#5c5c5c">same EPC on every lap — custody, cycle count</text>
  <text x="600" y="404" text-anchor="middle" font-size="13" fill="#5c5c5c">and test history accumulate on one record</text>
  <text x="600" y="430" text-anchor="middle" font-size="12.5" fill="#5c5c5c">past the cycle threshold → disposal review, EPC retired</text>

  <text x="600" y="630" text-anchor="middle" font-size="13" fill="#5c5c5c">Reads happen where the drum changes hands — fill line, truck gate, receiving dock — at 60+ drums / minute through a portal.</text>
</svg>
