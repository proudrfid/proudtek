<text x="540" y="136" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">BEST FOR</text>
<text x="830" y="136" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">ONE WEAKNESS</text>

<rect x="56" y="152" width="1088" height="52" rx="10" fill="#faf7f0"/>
