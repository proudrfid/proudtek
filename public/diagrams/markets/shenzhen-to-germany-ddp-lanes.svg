<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Shipping lanes from Shenzhen to Germany with DDP customs settled mid-route</title>
  <desc id="d">Logistics diagram. On the left, the Shenzhen production node: production seven to fifteen business days from order confirmation approval with one hundred percent electrical testing. Two lanes run to the right-hand node, your German address. The air lane is DHL Express in four to six days; the sea lane runs eighteen to twenty-two days to European ports. Both lanes pass through a gold EU customs gate where, under DDP, the EORI entry, duty and nineteen percent German import VAT are settled. The destination node notes goods arrive with clearance settled and the documentation pack in the box. A bottom strip explains time zones: Shenzhen's afternoon is Munich's morning, so an RFQ sent at nine in the morning CET is usually quoted the same working day. A second strip lists the in-box documents: CE Declaration of Conformity, RoHS and REACH declarations, Certificate of Origin, HS-coded commercial invoice and RF test data.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SHENZHEN TO GERMANY — DDP LANES</text>
  <text x="600" y="102" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Two lanes, one landed price</text>

  <!-- left node -->
  <rect x="80" y="200" width="250" height="140" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="80" y="200" width="250" height="44" rx="14" fill="#4a5568"/>
  <rect x="80" y="226" width="250" height="18" fill="#4a5568"/>
  <text x="205" y="228" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#ffffff">SHENZHEN PRODUCTION</text>
  <text x="104" y="272" font-size="13" fill="#291c0e">Production 5–7 business days</text>
  <text x="104" y="294" font-size="13" fill="#4f4f4f">after artwork approval</text>
  <text x="104" y="320" font-size="13" fill="#4f4f4f">100% electrical testing</text>

  <!-- right node -->
  <rect x="870" y="200" width="250" height="140" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="870" y="200" width="250" height="44" rx="14" fill="#4a5568"/>
  <rect x="870" y="226" width="250" height="18" fill="#4a5568"/>
  <text x="995" y="228" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#ffffff">YOUR GERMAN ADDRESS</text>
  <text x="894" y="272" font-size="13" fill="#291c0e">Goods arrive with clearance,</text>
  <text x="894" y="294" font-size="13" fill="#291c0e">duty and VAT settled</text>
  <text x="894" y="320" font-size="13" fill="#4f4f4f">Docs pack in the box</text>

  <!-- customs gate -->
  <rect x="572" y="188" width="56" height="164" rx="12" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="600" y="374" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EU CUSTOMS — DDP SETTLES</text>
  <text x="600" y="394" text-anchor="middle" font-size="12.5" fill="#4f4f4f">EORI entry · duty · 19% import VAT</text>

  <!-- air lane -->
  <line x1="330" y1="242" x2="864" y2="242" stroke="#4a5568" stroke-width="3"/>
  <path d="M 864 242 L 850 235 L 850 249 Z" fill="#4a5568"/>
  <text x="450" y="228" font-size="13" font-weight="700" letter-spacing="0.5" fill="#2c5454">AIR — DHL EXPRESS · 4–6 DAYS</text>

  <!-- sea lane -->
  <line x1="330" y1="308" x2="864" y2="308" stroke="#4a5568" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M 864 308 L 850 301 L 850 315 Z" fill="#4a5568"/>
  <text x="450" y="336" font-size="13" font-weight="700" letter-spacing="0.5" fill="#2c5454">SEA — 18–22 DAYS · EUROPEAN PORTS</text>

  <!-- time zone strip -->
  <rect x="80" y="440" width="1040" height="80" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="104" y="470" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TIME ZONES, USED PROPERLY</text>
  <text x="104" y="498" font-size="14" fill="#291c0e">Shenzhen's afternoon is Munich's morning — an RFQ sent at 09:00 CET is usually quoted the same working day.</text>

  <!-- docs strip -->
  <rect x="80" y="540" width="1040" height="80" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="104" y="570" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#2c5454">IN THE BOX</text>
  <text x="104" y="598" font-size="14" fill="#291c0e">CE DoC · RoHS / REACH declarations · Certificate of Origin · HS-coded commercial invoice · RF test data</text>
</svg>
