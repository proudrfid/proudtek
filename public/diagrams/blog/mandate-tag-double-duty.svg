<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">One mandate tag, two payers</title>
<desc id="d">A single ARC-certified UHF tag priced at 4 to 8 cents sits at the top. The retail mandate from Walmart or Target funds it for compliance on the left; the same tag becomes free shrinkage infrastructure for the upstream warehouse on the right, covering receiving, put-away, picking and shipping.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MANDATE ECONOMICS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The retail mandate buys the tag; your shrinkage program rides along.</text>
<rect x="475" y="150" width="250" height="66" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="475" y="150" width="250" height="8" rx="4" fill="#c39a5f"/>
<text x="600" y="182" text-anchor="middle" font-size="13.5" font-weight="800" fill="#291c0e">One ARC-certified UHF tag</text>
<text x="600" y="203" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">$0.04-0.08</text>
<line x1="560" y1="216" x2="360" y2="286" stroke="#4a5568" stroke-width="3"/><polygon points="352,278 350,296 366,288" fill="#4a5568"/>
<line x1="640" y1="216" x2="840" y2="286" stroke="#4a5568" stroke-width="3"/><polygon points="848,278 850,296 834,288" fill="#4a5568"/>
<rect x="96" y="300" width="480" height="232" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/><rect x="96" y="300" width="480" height="8" rx="4" fill="#c39a5f"/>
<text x="336" y="342" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">PAID BY THE MANDATE</text>
<text x="336" y="376" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Walmart / Target SGTIN-96 item-level mandate</text>
<text x="336" y="404" text-anchor="middle" font-size="13" fill="#5c5c5c">is the reason the tag exists at all.</text>
<rect x="186.0" y="436" width="300" height="34" rx="17.0" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/><text x="336" y="457.55" text-anchor="middle" font-size="13" font-weight="800" fill="#6d5a3a">compliance pays for the tag</text>
<text x="336" y="500" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Chargeback defense at the supplier dock</text>
<rect x="624" y="300" width="480" height="232" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/><rect x="624" y="300" width="480" height="8" rx="4" fill="#1f6f3a"/>
<text x="864" y="342" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.4" fill="#1f6f3a">FREE FOR YOUR DC</text>
<text x="864" y="376" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Same tag verifies receiving · put-away</text>
<text x="864" y="404" text-anchor="middle" font-size="13" fill="#5c5c5c">· picking · shipping in your own building.</text>
<rect x="714.0" y="436" width="300" height="34" rx="17.0" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.2"/><text x="864" y="457.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2d6a4f">shrinkage caught at ~zero extra cost</text>
<text x="864" y="500" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Item-level visibility across the network</text>
<text x="600" y="588" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The mandate buys the tag; the warehouse gets shrinkage control for the reader cost alone.</text>
</svg>
