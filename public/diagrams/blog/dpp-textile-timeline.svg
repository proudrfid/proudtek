<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="tlTitle tlDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="tlTitle">The 2025–2028 textile DPP timeline, with the two obligations that arrive first</title>
  <desc id="tlDesc">The textile Digital Product Passport timeline. April 2025: the Commission adopts the 2025–2030 ESPR Working Plan with textiles as a priority category. Early 2026: the CEN/CENELEC JTC 24 DPP technical standard publishes. Mid 2026: the Joint Research Centre completes textile preparatory studies. Late 2026: the Commission proposes the textile delegated act plus a DPP infrastructure act. Late 2026 to early 2027: the Parliament and Council adopt the textile delegated act. Mid 2028: after an 18-month transition, textile DPPs become mandatory for first-wave categories. Two concurrent obligations arrive before DPP enforcement: the ban on destroying unsold textiles for large companies from 19 July 2026, and the Battery Regulation DPP (EU 2023/1542) from February 2027, which is the precedent textile teams should study 12 to 15 months ahead.</desc>

  <defs>
    <radialGradient id="tlGlow" cx="50%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#f9eed6"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="tlSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#3a4656"/>
    </linearGradient>
    <linearGradient id="tlLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#tlGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="58" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="3" fill="#b0894c">ALIGN CAPEX TO THE RIGHT MILESTONE</text>
  <text x="600" y="90" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">The textile DPP timeline you plan against</text>

  <!-- main line -->
  <line x1="110" y1="300" x2="1090" y2="300" stroke="url(#tlLine)" stroke-width="4"/>

  <!-- Node 1 Apr 2025 (above) -->
  <line x1="110" y1="300" x2="110" y2="258" stroke="#cbb98d" stroke-width="2"/>
  <rect x="30" y="176" width="168" height="82" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="114" y="200" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4a5568">Apr 2025</text>
  <text x="114" y="220" text-anchor="middle" font-size="10.8" fill="#5c5142">2025–2030 ESPR</text>
  <text x="114" y="234" text-anchor="middle" font-size="10.8" fill="#5c5142">Working Plan —</text>
  <text x="114" y="248" text-anchor="middle" font-size="10.8" fill="#5c5142">textiles a priority</text>
  <circle cx="110" cy="300" r="8" fill="#4a5568"/>

  <!-- Node 2 Early 2026 (below) -->
  <line x1="306" y1="300" x2="306" y2="342" stroke="#cbb98d" stroke-width="2"/>
  <rect x="222" y="342" width="168" height="82" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="306" y="366" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4a5568">Early 2026</text>
  <text x="306" y="386" text-anchor="middle" font-size="10.8" fill="#5c5142">CEN/CLC JTC 24</text>
  <text x="306" y="400" text-anchor="middle" font-size="10.8" fill="#5c5142">DPP technical</text>
  <text x="306" y="414" text-anchor="middle" font-size="10.8" fill="#5c5142">standard publishes</text>
  <circle cx="306" cy="300" r="8" fill="#4a5568"/>

  <!-- Node 3 Mid 2026 (above) -->
  <line x1="502" y1="300" x2="502" y2="258" stroke="#cbb98d" stroke-width="2"/>
  <rect x="418" y="176" width="168" height="82" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="502" y="200" text-anchor="middle" font-size="13.5" font-weight="800" fill="#a97f3f">Mid 2026</text>
  <text x="502" y="220" text-anchor="middle" font-size="10.8" fill="#5c5142">JRC completes</text>
  <text x="502" y="234" text-anchor="middle" font-size="10.8" fill="#5c5142">textile preparatory</text>
  <text x="502" y="248" text-anchor="middle" font-size="10.8" fill="#5c5142">studies</text>
  <circle cx="502" cy="300" r="8" fill="#c39a5f"/>

  <!-- Node 4 Late 2026 (below) -->
  <line x1="698" y1="300" x2="698" y2="342" stroke="#cbb98d" stroke-width="2"/>
  <rect x="614" y="342" width="168" height="82" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="698" y="366" text-anchor="middle" font-size="13.5" font-weight="800" fill="#a97f3f">Late 2026</text>
  <text x="698" y="386" text-anchor="middle" font-size="10.8" fill="#5c5142">Commission proposes</text>
  <text x="698" y="400" text-anchor="middle" font-size="10.8" fill="#5c5142">textile act + DPP</text>
  <text x="698" y="414" text-anchor="middle" font-size="10.8" fill="#5c5142">infrastructure act</text>
  <circle cx="698" cy="300" r="8" fill="#c39a5f"/>

  <!-- Node 5 Late 2026 / early 2027 (above) -->
  <line x1="894" y1="300" x2="894" y2="258" stroke="#cbb98d" stroke-width="2"/>
  <rect x="810" y="176" width="168" height="82" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="894" y="200" text-anchor="middle" font-size="13.2" font-weight="800" fill="#8a6a2f">Late '26 / '27</text>
  <text x="894" y="220" text-anchor="middle" font-size="10.8" fill="#5c5142">Parliament + Council</text>
  <text x="894" y="234" text-anchor="middle" font-size="10.8" fill="#5c5142">adopt the textile</text>
  <text x="894" y="248" text-anchor="middle" font-size="10.8" fill="#5c5142">delegated act</text>
  <circle cx="894" cy="300" r="8" fill="#b98a3c"/>

  <!-- Node 6 Mid 2028 (below) — highlighted -->
  <line x1="1090" y1="300" x2="1090" y2="342" stroke="#7fb499" stroke-width="2"/>
  <rect x="1006" y="342" width="168" height="82" rx="12" fill="#eef7f1" stroke="#2d6a4f" stroke-width="2.5"/>
  <text x="1090" y="366" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f6f3a">Mid 2028</text>
  <text x="1090" y="386" text-anchor="middle" font-size="10.8" fill="#3f5b4a">textile DPP</text>
  <text x="1090" y="400" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1f6f3a">MANDATORY</text>
  <text x="1090" y="414" text-anchor="middle" font-size="10.8" fill="#3f5b4a">18-month transition</text>
  <circle cx="1090" cy="300" r="11" fill="#2d6a4f"/>
  <circle cx="1090" cy="300" r="4" fill="#ffffff"/>

  <!-- concurrent obligations band -->
  <text x="600" y="470" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8b2d2d">TWO OBLIGATIONS THAT REACH YOU BEFORE DPP ENFORCEMENT DOES</text>
  <g>
    <rect x="120" y="486" width="470" height="52" rx="12" fill="#fbefe9" stroke="#e2b3a3" stroke-width="2"/>
    <rect x="120" y="486" width="8" height="52" rx="4" fill="#8b2d2d"/>
    <text x="146" y="509" font-size="13" font-weight="800" fill="#8b2d2d">19 Jul 2026 · unsold-textile destruction ban</text>
    <text x="146" y="528" font-size="11.5" fill="#6d5142">large companies now, mid-caps from 19 Jul 2030 — this hits first</text>
  </g>
  <g>
    <rect x="610" y="486" width="470" height="52" rx="12" fill="#f1eef6" stroke="#b7add0" stroke-width="2"/>
    <rect x="610" y="486" width="8" height="52" rx="4" fill="#4a4370"/>
    <text x="636" y="509" font-size="13" font-weight="800" fill="#4a4370">Feb 2027 · Battery Regulation DPP (EU 2023/1542)</text>
    <text x="636" y="528" font-size="11.5" fill="#5c5142">12–15 months ahead of textiles — study it for governance lessons</text>
  </g>

  <!-- footer -->
  <path d="M20 566 h1160 v67 a22 22 0 0 1 -22 22 h-1116 a22 22 0 0 1 -22 -22 z" fill="url(#tlSteel)"/>
  <text x="600" y="602" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">The binding date is the delegated act + the transition window — not the framework date.</text>
  <text x="600" y="626" text-anchor="middle" font-size="12.5" fill="#c9d2df">Aligning your roadmap to ESPR's 2024 entry-into-force is the most common — and most expensive — planning error.</text>
</svg>
