<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The four hops between tapping a key fob and the door unlocking</title>
<desc id="d">A four-step flow: 1, the passive fob with no battery is powered by the reader's RF field. 2, the reader picks up the credential at 3-10 cm for HF or 5-15 cm for LF, with antenna size and reader power setting the range. 3, the controller checks the ID against the authorized-user database — which IDs, at which doors, during which time windows. 4, if access is granted the lock relay clicks; a revoked ID just gets the red light. Below: credentials are added or revoked in the controller software instantly, with no physical retrieval required.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE TAP, FOUR HOPS</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">What happens between the tap and the click</text>

<rect x="70" y="150" width="250" height="260" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="195" y="184" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">1 · THE FOB</text>
<rect x="172" y="200" width="46" height="74" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="195" cy="214" r="6" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<rect x="188" y="236" width="14" height="12" rx="2" fill="#c39a5f"/>
<text x="195" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#291c0e">Passive — no battery.</text>
<text x="195" y="332" text-anchor="middle" font-size="12.5" fill="#4f4f4f">The reader's RF field</text>
<text x="195" y="350" text-anchor="middle" font-size="12.5" fill="#4f4f4f">powers the chip.</text>

<line x1="326" y1="280" x2="342" y2="280" stroke="#c39a5f" stroke-width="3"/>
<polygon points="350,280 336,273 336,287" fill="#c39a5f"/>

<rect x="356" y="150" width="250" height="260" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="481" y="184" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">2 · THE READER</text>
<rect x="466" y="202" width="50" height="66" rx="8" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="491" cy="218" r="5" fill="#1f6f3a"/>
<path d="M 448 224 a 14 14 0 0 1 0 24" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<path d="M 438 216 a 24 24 0 0 1 0 40" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<text x="481" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#291c0e">Reads the credential:</text>
<text x="481" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#291c0e">HF 3-10 cm · LF 5-15 cm</text>
<text x="481" y="354" text-anchor="middle" font-size="12.5" fill="#4f4f4f">antenna size and reader</text>
<text x="481" y="372" text-anchor="middle" font-size="12.5" fill="#4f4f4f">power set the range</text>

<line x1="612" y1="280" x2="628" y2="280" stroke="#c39a5f" stroke-width="3"/>
<polygon points="636,280 622,273 622,287" fill="#c39a5f"/>

<rect x="642" y="150" width="250" height="260" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="767" y="184" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">3 · THE CONTROLLER</text>
<rect x="737" y="202" width="60" height="66" rx="8" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
<line x1="746" y1="220" x2="788" y2="220" stroke="#a9834e" stroke-width="2.5"/>
<line x1="746" y1="235" x2="788" y2="235" stroke="#a9834e" stroke-width="2.5"/>
<line x1="746" y1="250" x2="778" y2="250" stroke="#a9834e" stroke-width="2.5"/>
<text x="767" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#291c0e">Authorized-user database:</text>
<text x="767" y="332" text-anchor="middle" font-size="12.5" fill="#4f4f4f">which IDs, at which doors,</text>
<text x="767" y="350" text-anchor="middle" font-size="12.5" fill="#4f4f4f">during which time windows</text>

<line x1="898" y1="280" x2="914" y2="280" stroke="#c39a5f" stroke-width="3"/>
<polygon points="922,280 908,273 908,287" fill="#c39a5f"/>

<rect x="928" y="150" width="250" height="260" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="1053" y="184" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">4 · THE LOCK RELAY</text>
<path d="M 1038 226 v-8 a 15 15 0 0 1 30 0 v8" fill="none" stroke="#3d6b6b" stroke-width="3"/>
<rect x="1029" y="226" width="48" height="40" rx="8" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="1053" cy="244" r="5" fill="#3d6b6b"/>
<text x="1053" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#291c0e">Access granted →</text>
<text x="1053" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#291c0e">the relay clicks.</text>
<text x="1053" y="354" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Revoked ID → red light,</text>
<text x="1053" y="372" text-anchor="middle" font-size="12.5" fill="#4f4f4f">press as hard as you like.</text>

<rect x="70" y="460" width="1108" height="64" rx="12" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="624" y="487" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Credentials are added or revoked in the controller software instantly — no physical retrieval required.</text>
<text x="624" y="508" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Deactivation happens at the desk, not at the door.</text>

<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The user only ever sees hop one — the help desk hears about all four.</text>
</svg>
