<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Macy's RFID category rollout — four waves, 2022 to 2027</title>
<desc id="d">Timeline of Macy's item-level RFID category waves. Wave 1, apparel — men's, women's, kids and intimates — active since 2022. Wave 2, footwear and accessories including handbags and jewelry with on-metal inlays for hard goods, active 2024. Wave 3, home soft goods — bedding, towels, kitchen textiles — active 2025 to 2026. Wave 4, home hardlines — cookware, decor, small electrics — piloting in 2026 with enforcement in 2027. Cosmetics, fragrance and fine jewelry remain excluded, likely joining 2027-2028. Stylized tide curves rise under the timeline.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE MANDATE ARRIVES IN WAVES</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Which categories need tags — and when</text>

<circle cx="170" cy="240" r="44" fill="#ffffff" stroke="#3d6b6b" stroke-width="3"/>
<g transform="translate(170,242)" fill="#3d6b6b">
<path d="M-14 -8 L-6 -14 L0 -12 L6 -14 L14 -8 L10 0 L6 -2 L6 14 Q0 17 -6 14 L-6 -2 L-10 0 Z"/>
</g>
<text x="170" y="312" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">WAVE 1</text>
<text x="170" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Apparel</text>
<text x="170" y="360" text-anchor="middle" font-size="13" fill="#4f4f4f">men's, women's, kids,</text>
<text x="170" y="380" text-anchor="middle" font-size="13" fill="#4f4f4f">intimates</text>

<circle cx="430" cy="240" r="44" fill="#ffffff" stroke="#2c5454" stroke-width="3"/>
<g transform="translate(430,242)" fill="#2c5454">
<path d="M-17 6 C-17 -2 -9 -5 -2 -1 L8 -9 C15 -9 20 -4 20 4 L20 9 L-17 9 Z"/>
</g>
<text x="430" y="312" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">WAVE 2</text>
<text x="430" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Footwear &amp; accessories</text>
<text x="430" y="360" text-anchor="middle" font-size="13" fill="#4f4f4f">handbags, jewelry —</text>
<text x="430" y="380" text-anchor="middle" font-size="13" fill="#4f4f4f">on-metal inlays for hard goods</text>

<circle cx="690" cy="240" r="44" fill="#ffffff" stroke="#2d6a4f" stroke-width="3"/>
<g transform="translate(690,240)">
<rect x="-16" y="-10" width="32" height="20" rx="4" fill="#2d6a4f"/>
<path d="M-16 -3 h32 M-16 4 h32" stroke="#ffffff" stroke-width="1.8"/>
</g>
<text x="690" y="312" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">WAVE 3</text>
<text x="690" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Home soft goods</text>
<text x="690" y="360" text-anchor="middle" font-size="13" fill="#4f4f4f">bedding, towels,</text>
<text x="690" y="380" text-anchor="middle" font-size="13" fill="#4f4f4f">kitchen textiles</text>

<circle cx="950" cy="240" r="44" fill="#ffffff" stroke="#c39a5f" stroke-width="3" stroke-dasharray="8 6"/>
<g transform="translate(950,240)">
<rect x="-13" y="-6" width="26" height="16" rx="4" fill="#c39a5f"/>
<path d="M-19 -2 h6 M13 -2 h6" stroke="#c39a5f" stroke-width="3.5" stroke-linecap="round"/>
</g>
<text x="950" y="312" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">WAVE 4</text>
<text x="950" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Home hardlines</text>
<text x="950" y="360" text-anchor="middle" font-size="13" fill="#4f4f4f">cookware, decor,</text>
<text x="950" y="380" text-anchor="middle" font-size="13" fill="#4f4f4f">small electrics</text>

<path d="M40 505 Q 180 465 320 505 T 600 505 T 880 505 T 1160 505 L 1160 548 L 40 548 Z" fill="#3d6b6b" opacity="0.12"/>
<path d="M40 520 Q 180 485 320 520 T 600 520 T 880 520 T 1160 520 L 1160 548 L 40 548 Z" fill="#3d6b6b" opacity="0.2"/>
<path d="M40 534 Q 180 505 320 534 T 600 534 T 880 534 T 1160 534 L 1160 548 L 40 548 Z" fill="#3d6b6b" opacity="0.3"/>

<line x1="90" y1="566" x2="1096" y2="566" stroke="#4f4f4f" stroke-width="1.5"/>
<path d="M 1110 566 l -14 -7 v 14 z" fill="#4f4f4f"/>
<line x1="170" y1="560" x2="170" y2="572" stroke="#4f4f4f" stroke-width="1.5"/>
<line x1="430" y1="560" x2="430" y2="572" stroke="#4f4f4f" stroke-width="1.5"/>
<line x1="690" y1="560" x2="690" y2="572" stroke="#4f4f4f" stroke-width="1.5"/>
<line x1="950" y1="560" x2="950" y2="572" stroke="#4f4f4f" stroke-width="1.5"/>
<text x="170" y="598" text-anchor="middle" font-size="14" font-weight="600" fill="#4f4f4f">2022 · active</text>
<text x="430" y="598" text-anchor="middle" font-size="14" font-weight="600" fill="#4f4f4f">2024 · active</text>
<text x="690" y="598" text-anchor="middle" font-size="14" font-weight="600" fill="#4f4f4f">2025-26 · active</text>
<text x="950" y="598" text-anchor="middle" font-size="14" font-weight="600" fill="#4f4f4f">pilot 2026 → 2027</text>

<text x="600" y="636" text-anchor="middle" font-size="13" fill="#5c5c5c">Still excluded: cosmetics, fragrance and fine jewelry — likely 2027-2028 once tag and placement standards mature.</text>
</svg>
