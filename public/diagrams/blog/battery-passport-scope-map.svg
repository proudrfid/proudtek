  <circle cx="948.0" cy="206" r="9" fill="none" stroke="#fff" stroke-width="3"/><circle cx="972.0" cy="206" r="9" fill="none" stroke="#fff" stroke-width="3"/><path d="M948.0 206 L958.0 192 L972.0 206 M958.0 192 L965.0 192" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="960.0" y="258.0" text-anchor="middle" font-size="22" font-weight="800" fill="#291c0e">LMT</text>
  <rect x="860.0" y="270" width="200.0" height="40" rx="20" fill="#d8e8e8" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="960.0" y="297.0" text-anchor="middle" font-size="17" font-weight="800" fill="#3d6b6b">Light electric</text>
  <text x="960.0" y="336.0" text-anchor="middle" font-size="15.5" font-weight="400" fill="#4f4f4f">E-bikes, e-scooters,</text>
  <text x="960.0" y="358.0" text-anchor="middle" font-size="15.5" font-weight="400" fill="#4f4f4f">e-cargo bikes.</text>
  <rect x="75" y="452" width="1050" height="54" rx="16" fill="#fdf8ef" stroke="#c39a5f" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="104" y="468" width="6" height="6" fill="#c39a5f"/>
  <rect x="112" y="468" width="6" height="6" fill="#c39a5f"/>
  <rect x="104" y="476" width="6" height="6" fill="#c39a5f"/>
  <rect x="120" y="476" width="6" height="6" fill="#c39a5f"/>
  <rect x="112" y="484" width="6" height="6" fill="#c39a5f"/>
  <rect x="120" y="484" width="6" height="6" fill="#c39a5f"/>
  <rect x="104" y="484" width="6" height="6" fill="#c39a5f"/>
  <path d="M1088 470 A14 14 0 0 1 1088 496 M1080 475 A8 8 0 0 1 1080 491" fill="none" stroke="#c39a5f" stroke-width="2.6" stroke-linecap="round"/>
  <text x="600.0" y="485.0" text-anchor="middle" font-size="17.5" font-weight="700" fill="#291c0e">QR mandatory   ·   NFC / RFID supplementary   ·   GS1 / CIRPASS schema</text>
  <text x="600.0" y="560.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#6d5a3a">Over 2 kWh, sold in the EU, from 18 February 2027 — no passport, no market.</text>
  <text x="600.0" y="584.0" text-anchor="middle" font-size="16.5" font-weight="400" fill="#6d5a3a">Laptop and phone batteries sit this one out — for now.</text>
</svg>
