<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="crTitle crDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="crTitle">The two card formats, the spec, and the server script</title>
  <desc id="crDesc">Two NFC card formats plus their spec. Format one, the server-apron card: 8 per location on an apron leash clip, worn during service and replaced quarterly. Format two, the host-stand easel: an NFC card behind acrylic with a 3-tap demo instruction card for guests with older phones. The card spec: NTAG 215, 86 by 54 millimeters, full-color CMYK with brand-color spot lamination, a dynamic per-location URL, at $0.43 each at a minimum order of 5,000. The dynamic URL appends a location ID and server ID, feeding a quarterly server-recognition program. Eighty-four servers were trained on a 30-second close: if you had a great experience, scan here.</desc>
  <defs>
    <radialGradient id="crBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="crDark" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#crBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="1.5" fill="#6d5a3a">TWO FORMATS · ONE SPEC · A 30-SECOND ASK</text>

  <!-- Card 1: server apron card -->
  <rect x="56" y="96" width="352" height="300" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="126" y="116" width="212" height="30" rx="15" fill="#efe0bf"/>
  <text x="232" y="137" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">SERVER-APRON CARD</text>
  <g transform="translate(180,166)">
    <rect x="0" y="0" width="104" height="140" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
    <rect x="40" y="-12" width="24" height="14" rx="4" fill="#6c5127"/>
    <circle cx="52" cy="-5" r="3" fill="#fbf8f2"/>
    <path d="M36 34 a14 14 0 0 1 0 26 M36 26 a22 22 0 0 1 0 42 M36 18 a30 30 0 0 1 0 58" fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round"/>
    <text x="52" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="#291c0e">SCAN TO REVIEW</text>
    <rect x="18" y="112" width="68" height="8" rx="4" fill="#efe0bf"/>
  </g>
  <text x="232" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">8 per location · leash clip</text>
  <text x="232" y="360" text-anchor="middle" font-size="14" fill="#4f4f4f">worn during service</text>
  <text x="232" y="380" text-anchor="middle" font-size="14" fill="#4f4f4f">replaced quarterly for apron wear</text>

  <!-- Card 2: host-stand easel -->
  <rect x="424" y="96" width="352" height="300" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="494" y="116" width="212" height="30" rx="15" fill="#efe0bf"/>
  <text x="600" y="137" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">HOST-STAND EASEL</text>
  <g transform="translate(548,166)">
    <rect x="0" y="0" width="104" height="132" rx="9" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
    <rect x="10" y="10" width="84" height="112" rx="6" fill="none" stroke="#cfeefb" stroke-width="2"/>
    <path d="M36 40 a13 13 0 0 1 0 24 M36 32 a21 21 0 0 1 0 40" fill="none" stroke="#1fcefb" stroke-width="2.8" stroke-linecap="round"/>
    <text x="52" y="102" text-anchor="middle" font-size="9.5" font-weight="700" fill="#291c0e">TAP · 3-STEP DEMO</text>
    <path d="M52 132 l-26 32 h52 z" fill="#e4c98f"/>
  </g>
  <text x="600" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">NFC behind acrylic</text>
  <text x="600" y="360" text-anchor="middle" font-size="14" fill="#4f4f4f">for guests waiting for tables</text>
  <text x="600" y="380" text-anchor="middle" font-size="14" fill="#4f4f4f">3-tap demo card for older phones</text>

  <!-- Card 3: the spec -->
  <rect x="792" y="96" width="352" height="300" rx="16" fill="#ffffff" stroke="#1fcefb" stroke-width="2.5"/>
  <rect x="862" y="116" width="212" height="30" rx="15" fill="#eaf9fe"/>
  <text x="968" y="137" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1" fill="#177a92">THE CARD SPEC</text>
  <text x="968" y="196" text-anchor="middle" font-size="34" font-weight="800" fill="#291c0e">NTAG 215</text>
  <line x1="836" y1="216" x2="1100" y2="216" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="836" y="248" font-size="15" fill="#291c0e">Size</text><text x="1100" y="248" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">86 × 54 mm</text>
  <text x="836" y="282" font-size="15" fill="#291c0e">Finish</text><text x="1100" y="282" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">CMYK + spot lamination</text>
  <text x="836" y="316" font-size="15" fill="#291c0e">URL</text><text x="1100" y="316" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">dynamic, per-location</text>
  <rect x="836" y="338" width="272" height="40" rx="12" fill="#eaf9fe"/>
  <text x="852" y="364" font-size="15.5" fill="#0d3f4d">Unit cost</text>
  <text x="1092" y="364" text-anchor="end" font-size="17" font-weight="800" fill="#177a92">$0.43 @ 5K MOQ</text>

  <!-- Tracking strip -->
  <rect x="56" y="412" width="1088" height="92" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="84" y="446" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW EACH REVIEW GETS ATTRIBUTED</text>
  <g transform="translate(84,462)">
    <rect x="0" y="0" width="470" height="30" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
    <text x="14" y="20" font-size="13.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#291c0e">review.link/</text>
    <text x="112" y="20" font-size="13.5" font-weight="800" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#177a92">?loc=03</text>
    <text x="184" y="20" font-size="13.5" font-weight="800" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#b8873f">&amp;srv=Maya</text>
  </g>
  <text x="580" y="474" font-size="14" fill="#291c0e">Location ID + server ID ride along on every tap —</text>
  <text x="580" y="494" font-size="14" fill="#291c0e">feeding the quarterly server-recognition program.</text>

  <!-- Bottom dark strip: the script -->
  <rect x="56" y="516" width="1088" height="112" rx="16" fill="url(#crDark)"/>
  <text x="88" y="558" font-size="18" font-weight="700" fill="#ffffff">84 servers, one rehearsed line:</text>
  <text x="88" y="590" font-size="21" font-weight="800" fill="#f0d9a8">"If you had a great experience, scan here."</text>
  <text x="88" y="615" font-size="13.5" fill="#e9d9b8">A 30-second tableside close, paired with a manager's compliment.</text>
  <text x="1112" y="576" text-anchor="end" font-size="14.5" font-style="italic" font-weight="700" fill="#8fdcf3">No incentive. No gate.</text>
  <text x="1112" y="600" text-anchor="end" font-size="14" font-style="italic" fill="#e9d9b8">Just the card and the ask.</text>
</svg>
