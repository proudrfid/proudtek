<!-- wrap down under card 4 -->
<polyline points="1011,296 1011,360" fill="none" stroke="#9aa6b5" stroke-width="2.4"/><polygon points="1004,344 1011,360 1018,344" fill="#9aa6b5"/>
<!-- bottom arrows left -->
<polygon points="884,420 868,413 884,406" fill="#9aa6b5"/>
