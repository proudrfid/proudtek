<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NFC gift card — lamination stack and the contactless tap-to-redeem path</title>
<desc id="d">Two panels. Left, the lamination stack exploded top to bottom: a printed front overlay carrying artwork, hot-foil and spot-UV; a PVC or PET core carrying the embedded copper antenna coil and the NFC chip module; and a back overlay carrying the scratch-off PIN panel and signature strip. A bracket marks 0.76 millimetres assembled thickness, and the footprint is 85.60 by 53.98 millimetres, ISO/IEC 7810 ID-1, the standard retail card geometry. A green note says to keep foil, spot-UV and embossing off the scratch panel so the activation PIN reveals cleanly at the till. Right, the tap-to-redeem path: the card coil couples inductively with a POS reader at 13.56 megahertz, contactless and powered by the reader field; the chip carries only a unique UID, which the POS or gift-card processor looks up to find the balance and post the deduction. A green line notes under one second on the first tap with a sub-500-millisecond processor round-trip. Footer: the chip carries identity, not money — NTAG216 for a promo payload, MIFARE DESFire EV3 with AES-128 for high-value programmes.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANATOMY OF AN NFC GIFT CARD</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">One card body, a coil, and a chip that holds no money</text>

<!-- LEFT PANEL: lamination stack -->
<rect x="52" y="130" width="536" height="452" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="320" y="168" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">THE LAMINATION STACK</text>

<rect x="130" y="196" width="330" height="36" rx="6" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.8"/>
<text x="295" y="219" text-anchor="middle" font-size="12.5" fill="#6d5a3a">printed front overlay — artwork + hot-foil</text>

<rect x="130" y="246" width="330" height="64" rx="6" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="150" y="256" width="230" height="44" rx="10" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<rect x="162" y="264" width="206" height="28" rx="8" fill="none" stroke="#3d6b6b" stroke-width="1.5"/>
<rect x="402" y="268" width="22" height="20" rx="3" fill="#3d6b6b"/>
<text x="230" y="337" text-anchor="middle" font-size="12" fill="#2c5454">antenna coil</text>
<text x="413" y="337" text-anchor="middle" font-size="12" fill="#2c5454">NFC chip</text>

<rect x="130" y="352" width="330" height="42" rx="6" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.8"/>
<text x="248" y="378" text-anchor="middle" font-size="12.5" fill="#6d5a3a">back overlay</text>
<rect x="330" y="360" width="118" height="26" rx="3" fill="#4a5568"/>
<text x="389" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">scratch PIN</text>

<path d="M 468 196 h 10 v 198 h -10" fill="none" stroke="#4a5568" stroke-width="1.8"/>
<text x="486" y="292" font-size="12.5" font-weight="700" fill="#291c0e">0.76 mm</text>
<text x="486" y="310" font-size="12.5" fill="#4f4f4f">assembled</text>

<text x="320" y="424" text-anchor="middle" font-size="12.5" fill="#4f4f4f">PVC / PET core carries the antenna coil + NFC chip</text>
<text x="320" y="452" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">85.60 × 53.98 × 0.76 mm — ISO/IEC 7810 ID-1</text>

<text x="320" y="510" text-anchor="middle" font-size="13" font-weight="800" fill="#1f6f3a">Keep foil, spot-UV and emboss off the scratch panel —</text>
<text x="320" y="530" text-anchor="middle" font-size="13" font-weight="800" fill="#1f6f3a">the activation PIN must reveal cleanly at the till</text>

<!-- RIGHT PANEL: tap-to-redeem -->
<rect x="612" y="130" width="536" height="452" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="880" y="168" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">TAP-TO-REDEEM AT THE POS</text>

<rect x="640" y="188" width="480" height="158" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="664" y="216" font-size="14.5" font-weight="800" fill="#2c5454">Coupling at 13.56 MHz — contactless</text>
<rect x="664" y="238" width="126" height="74" rx="10" fill="#3d6b6b"/>
<text x="727" y="271" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">POS</text>
<text x="727" y="289" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">reader</text>
<path d="M 806 260 a 24 24 0 0 1 0 44" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 820 251 a 36 36 0 0 1 0 62" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 834 242 a 48 48 0 0 1 0 80" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="912" y="236" width="136" height="80" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<rect x="924" y="246" width="112" height="60" rx="8" fill="none" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="1014" y="252" width="14" height="14" rx="2" fill="#3d6b6b"/>
<text x="980" y="332" text-anchor="middle" font-size="12" fill="#4f4f4f">gift card — coil + chip</text>

<rect x="640" y="362" width="480" height="150" rx="12" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="664" y="390" font-size="14.5" font-weight="800" fill="#4a5568">The balance lives on the server, not the card</text>
<rect x="664" y="406" width="120" height="60" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="724" y="432" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">chip</text>
<text x="724" y="450" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">UID</text>
<path d="M 792 436 H 860" stroke="#4a5568" stroke-width="2.5" stroke-dasharray="6 4"/>
<path d="M 860 436 l -12 -6 v 12 z" fill="#4a5568"/>
<rect x="872" y="404" width="180" height="64" rx="10" fill="#3d6b6b"/>
<text x="962" y="430" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">POS / gift-card</text>
<text x="962" y="448" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">processor</text>
<text x="880" y="498" text-anchor="middle" font-size="12" fill="#4f4f4f">unique UID → balance lookup + deduction, every tap</text>

<text x="880" y="552" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f6f3a">Under 1 second, first tap — &lt; 500 ms round-trip</text>

<text x="600" y="622" text-anchor="middle" font-size="13" fill="#4f4f4f">The chip carries identity, not money — NTAG216 for a promo payload, MIFARE DESFire EV3 + AES-128 for high value</text>
</svg>
