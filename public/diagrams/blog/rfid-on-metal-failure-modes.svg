<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">One steel aisle, four RFID failure modes: detune, dead zone, shadow, phantom read</title>
<desc id="d">Side view of a metal shelving aisle. A reader antenna on the left sends its beam toward a steel rack. Failure one: a tag mounted flat on the steel upright detunes on contact and loses 80 to 100 percent of its range. Failure two: the beam reflects off the upright and the direct and reflected signals cancel in a dead zone on the floor of aisle A. Failure three: behind the rack a shadow zone hides a tag that is completely unreachable. Failure four: a stray reflected path arcs over the rack and phantom-reads a tag in aisle B, which gets counted twice. All four arrive together in a metal-heavy room, and none of them ever show up on the test bench.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<pattern id="steel" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#eef1f5"/><path d="M -1 1 L 1 -1 M 0 12 L 12 0 M 11 13 L 13 11" stroke="#d3dae3" stroke-width="3"/></pattern>
<marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#3d6b6b"/></marker>
<marker id="arrT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8ba6a6"/></marker>
<marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#c39a5f"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FOUR WAYS METAL ATTACKS THE SIGNAL</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">One steel aisle, four failure modes</text>

<line x1="64" y1="556" x2="1136" y2="556" stroke="#d3dae3" stroke-width="2"/>
<text x="340" y="584" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">AISLE A</text>
<text x="1069" y="584" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">AISLE B</text>

<rect x="620" y="200" width="22" height="356" fill="url(#steel)" stroke="#4a5568" stroke-width="1.8"/>
<rect x="980" y="200" width="22" height="356" fill="url(#steel)" stroke="#4a5568" stroke-width="1.8"/>
<rect x="642" y="306" width="338" height="12" fill="url(#steel)" stroke="#4a5568" stroke-width="1.8"/>
<rect x="642" y="446" width="338" height="12" fill="url(#steel)" stroke="#4a5568" stroke-width="1.8"/>
<rect x="700" y="272" width="52" height="34" fill="#f9f1e2" stroke="#d4a755" stroke-width="1.6"/>
<rect x="770" y="272" width="52" height="34" fill="#f9f1e2" stroke="#d4a755" stroke-width="1.6"/>
<rect x="840" y="412" width="52" height="34" fill="#f9f1e2" stroke="#d4a755" stroke-width="1.6"/>

<rect x="92" y="206" width="78" height="34" rx="8" fill="#291c0e"/>
<circle cx="158" cy="223" r="5" fill="#1fcefb"/>
<text x="131" y="262" text-anchor="middle" font-size="12.5" fill="#4f4f4f">reader antenna</text>

<line x1="172" y1="223" x2="616" y2="300" stroke="#3d6b6b" stroke-width="3" marker-end="url(#arrB)"/>
<text x="380" y="246" text-anchor="middle" font-size="12.5" fill="#2c5454">intended</text>
<line x1="616" y1="302" x2="330" y2="470" stroke="#8ba6a6" stroke-width="2.5" marker-end="url(#arrT)"/>
<text x="490" y="366" text-anchor="end" font-size="12.5" fill="#4f4f4f">reflected</text>

<rect x="600" y="344" width="18" height="68" rx="3" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.2"/>
<rect x="604" y="352" width="10" height="10" fill="#8b2d2d"/>
<circle cx="412" cy="440" r="11" fill="#8b2d2d"/>
<text x="412" y="445" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="430" y="445" font-size="14" font-weight="700" fill="#8b2d2d">contact detune</text>
<text x="430" y="464" font-size="12.5" fill="#4f4f4f">flat on steel: −80–100%</text>
<line x1="548" y1="438" x2="597" y2="414" stroke="#8b2d2d" stroke-width="1.5" stroke-dasharray="3 4"/>

<ellipse cx="310" cy="492" rx="96" ry="42" fill="#f7eaea" stroke="#8b2d2d" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="248" cy="486" r="11" fill="#8b2d2d"/>
<text x="248" y="491" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="266" y="491" font-size="14" font-weight="700" fill="#8b2d2d">dead zone</text>
<text x="310" y="512" text-anchor="middle" font-size="12.5" fill="#4f4f4f">reflections cancel here</text>

<polygon points="1002,330 1136,384 1136,545 1002,545" fill="#e2e7ee"/>
<circle cx="1022" cy="372" r="11" fill="#4a5568"/>
<text x="1022" y="377" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<text x="1040" y="377" font-size="14" font-weight="700" fill="#4a5568">shadow zone</text>
<rect x="1034" y="428" width="58" height="20" rx="4" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="1063" y="474" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">unreachable</text>

<path d="M 172 214 Q 560 30 1020 180 L 1042 240" fill="none" stroke="#c39a5f" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrG)"/>
<circle cx="486" cy="150" r="11" fill="#c39a5f"/>
<text x="486" y="155" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
<text x="504" y="155" font-size="14" font-weight="700" fill="#6d5a3a">phantom read — wrong aisle</text>
<rect x="1014" y="246" width="58" height="20" rx="4" fill="#ffffff" stroke="#c39a5f" stroke-width="2.2"/>
<rect x="1020" y="251" width="9" height="9" fill="#c39a5f"/>
<text x="1043" y="292" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">counted twice</text>

<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#5c5c5c">All four arrive together in a metal-heavy room — and none of them ever show up on the test bench.</text>
</svg>
