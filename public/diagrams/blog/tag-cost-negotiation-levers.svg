<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five negotiation levers that move RFID tag pricing 15-40% below list</title>
<desc id="d">Five rows, one lever each, with the saving pinned on the right. One: lock the chip but flex the inlay — spec the chip model only and let the factory run whichever antenna is cheapest that month. Two: annual blanket order with monthly draws of 80-100K, worth 10-20% better pricing than ad-hoc orders. Three: standardize antenna sizes — five die-cut tools down to two saves $0.005-0.015 per tag. Four: skip the encoding line and avoid the $0.02-0.05 pre-encoding premium by using your own reader fleet. Five: order in off-peak quarters — Q1-Q2 orders land $0.01-0.03 lower than holiday-quarter quotes. A subtitle notes that none of this involves shouting, only a smarter purchase order.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PROCUREMENT, PLAYED PROPERLY</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Five levers that land 15–40% below the price list</text>
<text x="600" y="124" text-anchor="middle" font-size="14.5" fill="#4f4f4f">None of them involve shouting — all of them involve a smarter purchase order.</text>

<rect x="64" y="156" width="1072" height="72" rx="12" fill="#faf5ec" stroke="#e8e0d0" stroke-width="1.5"/>
<circle cx="102" cy="192" r="15" fill="#3d6b6b"/>
<text x="102" y="197" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">1</text>
<text x="134" y="187" font-size="16" font-weight="700" fill="#291c0e">Lock the chip, flex the inlay</text>
<text x="134" y="209" font-size="13" fill="#4f4f4f">spec the chip model only — let the factory run whichever antenna is cheapest that month</text>
<rect x="856" y="175" width="248" height="34" rx="17" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="980" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">supplier picks best-cost inlay</text>

<rect x="64" y="242" width="1072" height="72" rx="12" fill="#faf5ec" stroke="#e8e0d0" stroke-width="1.5"/>
<circle cx="102" cy="278" r="15" fill="#3d6b6b"/>
<text x="102" y="283" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">2</text>
<text x="134" y="273" font-size="16" font-weight="700" fill="#291c0e">Annual blanket order, monthly draws</text>
<text x="134" y="295" font-size="13" fill="#4f4f4f">a 12-month commitment drawn 80–100K/month beats ad-hoc orders of the same size</text>
<rect x="856" y="261" width="248" height="34" rx="17" fill="#3d6b6b"/>
<text x="980" y="283" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">10–20% better pricing</text>

<rect x="64" y="328" width="1072" height="72" rx="12" fill="#faf5ec" stroke="#e8e0d0" stroke-width="1.5"/>
<circle cx="102" cy="364" r="15" fill="#3d6b6b"/>
<text x="102" y="369" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">3</text>
<text x="134" y="359" font-size="16" font-weight="700" fill="#291c0e">Standardize antenna sizes</text>
<text x="134" y="381" font-size="13" fill="#4f4f4f">every unique antenna size is its own die-cut tool — five sizes down to two pays for itself</text>
<rect x="856" y="347" width="248" height="34" rx="17" fill="#3d6b6b"/>
<text x="980" y="369" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">saves $0.005–0.015 per tag</text>

<rect x="64" y="414" width="1072" height="72" rx="12" fill="#faf5ec" stroke="#e8e0d0" stroke-width="1.5"/>
<circle cx="102" cy="450" r="15" fill="#3d6b6b"/>
<text x="102" y="455" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">4</text>
<text x="134" y="445" font-size="16" font-weight="700" fill="#291c0e">Skip the encoding line</text>
<text x="134" y="467" font-size="13" fill="#4f4f4f">buy unencoded blanks and run encoding on the reader fleet you already own</text>
<rect x="856" y="433" width="248" height="34" rx="17" fill="#3d6b6b"/>
<text x="980" y="455" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">avoids $0.02–0.05 premium</text>

<rect x="64" y="500" width="1072" height="72" rx="12" fill="#faf5ec" stroke="#e8e0d0" stroke-width="1.5"/>
<circle cx="102" cy="536" r="15" fill="#3d6b6b"/>
<text x="102" y="541" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">5</text>
<text x="134" y="531" font-size="16" font-weight="700" fill="#291c0e">Order in off-peak quarters</text>
<text x="134" y="553" font-size="13" fill="#4f4f4f">chip supply tightens Sep–Nov — Q1–Q2 orders meet factories with capacity and flexibility</text>
<rect x="856" y="519" width="248" height="34" rx="17" fill="#3d6b6b"/>
<text x="980" y="541" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">$0.01–0.03 lower per tag</text>

<text x="600" y="614" text-anchor="middle" font-size="13" fill="#5c5c5c">Every lever is specification and timing, not haggling.</text>
</svg>
