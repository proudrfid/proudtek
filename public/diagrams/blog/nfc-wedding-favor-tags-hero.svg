<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">One NFC sticker on a wedding favor opens the couple's whole digital night</title>
<desc id="d">A printed wedding favor place card carries a single NTAG213 sticker. A guest taps it with a phone and a shared photo album opens on screen. From that one tap, four destinations are reachable: a shared photo album guests can view and add to, the couple's playlist, a thank-you video filmed before the day, and a registry or love-story page. A footnote notes it works on iPhone 7 and later and every modern Android with no app, at a few cents a sticker.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TAP THE FAVOR · THE MEMORIES OPEN</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">One sticker, the whole night — replayable</text>

<rect x="92" y="250" width="252" height="152" rx="16" fill="#f9f1e2" stroke="#c39a5f" stroke-width="2.5"/>
<circle cx="318" cy="276" r="11" fill="none" stroke="#2c5454" stroke-width="2"/>
<circle cx="318" cy="276" r="4" fill="#2c5454"/>
<text x="205" y="312" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="19" font-weight="700" fill="#291c0e">TAP TO REPLAY</text>
<text x="205" y="340" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the whole night, on their phone</text>
<text x="205" y="372" text-anchor="middle" font-size="12" fill="#6d5a3a">one NTAG213 sticker, hidden under the label</text>

<path d="M 356 300 a 30 30 0 0 1 0 52" fill="none" stroke="#3d6b6b" stroke-width="3"/>
<path d="M 374 284 a 52 52 0 0 1 0 84" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<path d="M 392 268 a 74 74 0 0 1 0 116" fill="none" stroke="#3d6b6b" stroke-width="2"/>

<rect x="430" y="182" width="146" height="272" rx="22" fill="#ffffff" stroke="#2c5454" stroke-width="3"/>
<rect x="447" y="208" width="112" height="204" rx="7" fill="#eef5f5"/>
<rect x="457" y="220" width="42" height="40" rx="5" fill="#e4c98f"/>
<rect x="507" y="220" width="42" height="40" rx="5" fill="#cfe0e0"/>
<rect x="457" y="268" width="42" height="40" rx="5" fill="#bfe0cf"/>
<rect x="507" y="268" width="42" height="40" rx="5" fill="#e8d3a6"/>
<rect x="457" y="316" width="42" height="40" rx="5" fill="#cfe0e0"/>
<rect x="507" y="316" width="42" height="40" rx="5" fill="#d9c39a"/>
<text x="503" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#234a4a">shared album</text>
<rect x="479" y="430" width="48" height="6" rx="3" fill="#cfd8d8"/>
<text x="503" y="486" text-anchor="middle" font-size="13" font-weight="600" fill="#291c0e">one tap — no app, no typed URL</text>

<rect x="628" y="168" width="508" height="80" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<circle cx="672" cy="208" r="21" fill="#c39a5f"/>
<rect x="663" y="199" width="12" height="15" rx="2" fill="#ffffff"/>
<rect x="669" y="196" width="12" height="15" rx="2" fill="#ffffff"/>
<text x="712" y="202" font-size="15.5" font-weight="700" fill="#291c0e">Shared photo album</text>
<text x="712" y="226" font-size="12.5" fill="#4f4f4f">guests tap to view — and add their own shots</text>

<rect x="628" y="258" width="508" height="80" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<circle cx="672" cy="298" r="21" fill="#3d6b6b"/>
<circle cx="667" cy="304" r="5" fill="#ffffff"/>
<rect x="670" y="286" width="3" height="16" fill="#ffffff"/>
<text x="712" y="292" font-size="15.5" font-weight="700" fill="#291c0e">The couple's playlist</text>
<text x="712" y="316" font-size="12.5" fill="#4f4f4f">Spotify or Apple Music, on demand</text>

<rect x="628" y="348" width="508" height="80" rx="14" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<circle cx="672" cy="388" r="21" fill="#2d6a4f"/>
<path d="M 666 380 L 666 396 L 680 388 Z" fill="#ffffff"/>
<text x="712" y="382" font-size="15.5" font-weight="700" fill="#1b4332">Thank-you video</text>
<text x="712" y="406" font-size="12.5" fill="#4f4f4f">filmed before the day, opened weeks after</text>

<rect x="628" y="438" width="508" height="80" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<circle cx="672" cy="478" r="21" fill="#6d5a3a"/>
<path d="M 672 486 C 663 478 665 470 672 474 C 679 470 681 478 672 486 Z" fill="#ffffff"/>
<text x="712" y="472" font-size="15.5" font-weight="700" fill="#291c0e">Registry or love-story page</text>
<text x="712" y="496" font-size="12.5" fill="#4f4f4f">one tap, no long web address to read aloud</text>

<text x="600" y="600" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="18" font-weight="700" fill="#291c0e">One favor. Four doors in. Zero apps.</text>
<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Works on iPhone 7 and later and every modern Android — no app, a few cents a sticker.</text>
</svg>
