<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Accuracy gap between manual and RFID counting, and how it turns into revenue</title>
<desc id="d">Top: SKU-location accuracy bars — manual sits at 65-75%, RFID at 95-99%. Bottom: the revenue chain — every 1 point of accuracy gain yields roughly 0.5-1% sales lift through fewer out-of-stocks, and moving accuracy from 70% to 95% can mean a 5-10% revenue gain for affected categories.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ACCURACY IS WHERE THE MONEY LEAKS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Not one dramatic failure — a thousand small ones nobody reconciles until year-end.</text>

<!-- accuracy bars -->
<text x="90" y="140" font-size="14" font-weight="800" letter-spacing="0.5" fill="#a07d43">SKU-LOCATION ACCURACY</text>
<text x="90" y="196" font-size="14" font-weight="800" fill="#8b2d2d">MANUAL</text>
<rect x="240" y="176" width="740" height="34" rx="6" fill="#f4efe4" stroke="#e6dfd2" stroke-width="1.4"/>
<rect x="240" y="176" width="518" height="34" rx="6" fill="#d98f8f" stroke="#8b2d2d" stroke-width="1.4"/>
<text x="770" y="199" font-size="17" font-weight="800" fill="#8b2d2d">65-75%</text>
<text x="90" y="258" font-size="14" font-weight="800" fill="#1f6f3a">RFID</text>
<rect x="240" y="238" width="740" height="34" rx="6" fill="#f4efe4" stroke="#e6dfd2" stroke-width="1.4"/>
<rect x="240" y="238" width="718" height="34" rx="6" fill="#a9cfb5" stroke="#1f6f3a" stroke-width="1.4"/>
<text x="968" y="261" font-size="17" font-weight="800" fill="#1f6f3a">95-99%</text>

<!-- revenue chain -->
<text x="90" y="340" font-size="14" font-weight="800" letter-spacing="0.5" fill="#a07d43">WHY IT SHOWS UP IN REVENUE</text>
<rect x="150" y="360" width="320" height="76" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="310" y="393" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">+1 point accuracy</text>
<text x="310" y="416" text-anchor="middle" font-size="12.5" fill="#5c5c5c">measured at SKU-location</text>
<line x1="478" y1="398" x2="520" y2="398" stroke="#291c0e" stroke-width="3"/>
<polygon points="520,391 538,398 520,405" fill="#291c0e"/>
<rect x="556" y="360" width="320" height="76" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="716" y="393" text-anchor="middle" font-size="16" font-weight="800" fill="#1f6f3a">+0.5-1% sales lift</text>
<text x="716" y="416" text-anchor="middle" font-size="12.5" fill="#33595a">from fewer out-of-stocks</text>
<line x1="884" y1="398" x2="906" y2="398" stroke="#291c0e" stroke-width="3"/>
<polygon points="906,391 924,398 906,405" fill="#291c0e"/>
<rect x="936" y="360" width="150" height="76" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="1011" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#a07d43">compounds</text>
<text x="1011" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#a07d43">over time</text>

<rect x="150" y="470" width="936" height="66" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="618" y="510" text-anchor="middle" font-size="17" font-weight="800" fill="#a07d43">70% → 95% accuracy = a 5-10% revenue gain for affected categories</text>

<text x="600" y="590" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Manual's errors are quiet: missed scans, double counts, transcription slips — reconciled too late.</text>
</svg>
