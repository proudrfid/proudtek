<rect x="804" y="340" width="9" height="134" rx="4" fill="#8b2d2d"/>
<text x="830" y="242" font-size="15" font-weight="800" fill="#291c0e">GATE VALIDATION</text>
<circle cx="852" cy="300" r="15" fill="#1f6f3a"/>
<polyline points="844,300 850,307 861,292" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="882" y="296" font-size="14.5" font-weight="800" fill="#1f6f3a">Accept</text>
<text x="882" y="316" font-size="12" fill="#5c5c5c">on whitelist · first scan</text>
<circle cx="852" cy="398" r="15" fill="#8b2d2d"/>
<line x1="846" y1="392" x2="858" y2="404" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<line x1="858" y1="392" x2="846" y2="404" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<text x="882" y="394" font-size="14.5" font-weight="800" fill="#8b2d2d">Reject</text>
<text x="882" y="414" font-size="12" fill="#5c5c5c">clone or reused UID</text>

<!-- arrows -->
<text x="423" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5a3a">bind</text>
<line x1="404" y1="348" x2="440" y2="348" stroke="#291c0e" stroke-width="3"/>
<polygon points="440,342 452,348 440,354" fill="#291c0e"/>
<text x="777" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5a3a">validate</text>
<line x1="758" y1="348" x2="794" y2="348" stroke="#291c0e" stroke-width="3"/>
<polygon points="794,342 806,348 794,354" fill="#291c0e"/>

<text x="600" y="616" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Optical tickets copy without limit; a bound, validated UID does not — that gap is the whole strategy.</text>
</svg>
