<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five-layer defense-in-depth stack for anti-counterfeit event credentials</title>
<desc id="d">A stack read from the base upward. Layer one, a factory-unique chip UID that is globally unique and not writable on standard chips. Layer two, a server-side UID whitelist so only pre-registered UIDs pass the gate. Layer three, cryptographic per-tap authentication using a SUN message, which produces a one-time code on each tap so replay fails. Layer four, an encrypted credential payload using AES, useless without the gate-reader key. Layer five at the top, a tamper-evident closure, since removing the band destroys it. Each layer assumes the one beneath it; strip a lower layer and the ones above it stop mattering.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANTI-COUNTERFEIT · DEFENSE IN DEPTH</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Five layers, base to top — each one assumes the layer beneath it.</text>

<!-- vertical direction arrow -->
<text x="150" y="146" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">HARDER TO BEAT</text>
<line x1="150" y1="440" x2="150" y2="166" stroke="#b9a68e" stroke-width="2.5"/>
<polygon points="144,176 150,160 156,176" fill="#b9a68e"/>
<text x="150" y="466" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FOUNDATION</text>

<!-- L5 top: tamper closure -->
<rect x="300" y="150" width="760" height="56" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<circle cx="338" cy="178" r="16" fill="#c39a5f"/>
<text x="338" y="184" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">5</text>
<text x="374" y="174" font-size="16" font-weight="800" fill="#291c0e">Tamper-evident closure</text>
<text x="374" y="194" font-size="12.5" fill="#6d5a3a">removing the band destroys it — no quiet hand-off</text>

<!-- L4: encrypted payload -->
<rect x="300" y="214" width="760" height="56" rx="12" fill="#cfe4e4" stroke="#a9cccc" stroke-width="1.6"/>
<circle cx="338" cy="242" r="16" fill="#234a4a"/>
<text x="338" y="248" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4</text>
<text x="374" y="238" font-size="16" font-weight="800" fill="#291c0e">Encrypted credential payload (AES)</text>
<text x="374" y="258" font-size="12.5" fill="#33595a">useless without the gate-reader key</text>

<!-- L3: per-tap crypto -->
<rect x="300" y="278" width="760" height="56" rx="12" fill="#d7e9e9" stroke="#aacccc" stroke-width="1.6"/>
<circle cx="338" cy="306" r="16" fill="#2c5454"/>
<text x="338" y="312" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<text x="374" y="302" font-size="16" font-weight="800" fill="#291c0e">Cryptographic per-tap auth (SUN)</text>
<text x="374" y="322" font-size="12.5" fill="#33595a">a one-time code each tap — replay fails</text>

<!-- L2: whitelist -->
<rect x="300" y="342" width="760" height="56" rx="12" fill="#e4f0f0" stroke="#bcdcdc" stroke-width="1.6"/>
<circle cx="338" cy="370" r="16" fill="#3d6b6b"/>
<text x="338" y="376" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<text x="374" y="366" font-size="16" font-weight="800" fill="#291c0e">Server-side UID whitelist</text>
<text x="374" y="386" font-size="12.5" fill="#3d6b6b">only pre-registered UIDs pass the gate</text>

<!-- L1 base: chip UID -->
<rect x="300" y="406" width="760" height="56" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="338" cy="434" r="16" fill="#3d6b6b"/>
<text x="338" y="440" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
<text x="374" y="430" font-size="16" font-weight="800" fill="#291c0e">Factory-unique chip UID</text>
<text x="374" y="450" font-size="12.5" fill="#3d6b6b">globally unique · not writable on standard chips</text>

<text x="600" y="512" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Read bottom-up: strip a lower layer and the ones above it stop mattering. A UID alone is not a defense.</text>
</svg>
