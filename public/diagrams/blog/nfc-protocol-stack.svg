<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The NFC protocol stack — five layers from RF to a tap action, and how each one fails</title>
<desc id="d">Five stacked layers. From the bottom up: Physical/RF (ISO 18092 / ISO 14443-3A) does magnetic coupling, power transfer and bit modulation, and fails on out-of-range, metal interference or a detuned antenna. Anti-collision (ISO 14443-3A) selects a single tag among many, and fails when overlapping tags cause read errors. Data link (NFC Forum Type 2 Tag) handles memory access commands, and fails on an incompatible tag type or corrupted memory. Application (NDEF) carries structured records — URI, text, vCard, MIME — and fails on a malformed message or unsupported record type. The OS handler (iOS Core NFC / Android NFC Dispatch) routes the record to an app or browser, and fails when background reading is disabled or NFC is off.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE LAYERS FROM RF TO A TAP &#8212; AND HOW EACH FAILS</text>

<!-- rising arrow -->
<line x1="86" y1="562" x2="86" y2="150" stroke="#c39a5f" stroke-width="3"/><path d="M78 166 l8 -16 8 16 z" fill="#c39a5f"/>
<text x="72" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a" transform="rotate(-90 72 360)">a raw wave becomes an action</text>

<!-- failure column header -->
<text x="1058" y="118" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="1" fill="#8b2d2d">IF IT BREAKS HERE&#8230;</text>

<!-- Row 0 : OS handler -->
<rect x="128" y="132" width="800" height="80" rx="11" fill="#faf3e4" stroke="#e3d8c4" stroke-width="1.4"/>
<rect x="128" y="132" width="9" height="80" rx="4" fill="#c39a5f"/>
<text x="160" y="166" font-size="18" font-weight="800" fill="#291c0e">OS handler</text>
<text x="160" y="192" font-size="13.5" font-weight="700" fill="#6d5a3a">iOS Core NFC / Android NFC Dispatch</text>
<text x="470" y="180" font-size="14" font-weight="600" fill="#4f4f4f">Routes the NDEF record to an app or browser</text>
<rect x="946" y="140" width="204" height="64" rx="9" fill="#f6e9e6"/>
<text x="1048" y="168" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">Background read off,</text>
<text x="1048" y="186" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">NFC off in settings</text>

<!-- Row 1 : Application -->
<rect x="128" y="222" width="800" height="80" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="128" y="222" width="9" height="80" rx="4" fill="#3d6b6b"/>
<text x="160" y="256" font-size="18" font-weight="800" fill="#291c0e">Application</text>
<text x="160" y="282" font-size="13.5" font-weight="700" fill="#3d6b6b">NDEF (NFC Data Exchange Format)</text>
<text x="470" y="270" font-size="14" font-weight="600" fill="#4f4f4f">Structured records: URI, text, vCard, MIME</text>
<rect x="946" y="230" width="204" height="64" rx="9" fill="#f6e9e6"/>
<text x="1048" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">Malformed NDEF,</text>
<text x="1048" y="276" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">unsupported record type</text>

<!-- Row 2 : Data link -->
<rect x="128" y="312" width="800" height="80" rx="11" fill="#faf3e4" stroke="#e3d8c4" stroke-width="1.4"/>
<rect x="128" y="312" width="9" height="80" rx="4" fill="#6d5a3a"/>
<text x="160" y="346" font-size="18" font-weight="800" fill="#291c0e">Data link</text>
<text x="160" y="372" font-size="13.5" font-weight="700" fill="#6d5a3a">NFC Forum Type 2 Tag</text>
<text x="470" y="360" font-size="14" font-weight="600" fill="#4f4f4f">Memory access: READ, WRITE, sector select</text>
<rect x="946" y="320" width="204" height="64" rx="9" fill="#f6e9e6"/>
<text x="1048" y="348" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">Incompatible tag type,</text>
<text x="1048" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">corrupted memory</text>

<!-- Row 3 : Anti-collision -->
<rect x="128" y="402" width="800" height="80" rx="11" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.4"/>
<rect x="128" y="402" width="9" height="80" rx="4" fill="#4a5568"/>
<text x="160" y="436" font-size="18" font-weight="800" fill="#291c0e">Anti-collision</text>
<text x="160" y="462" font-size="13.5" font-weight="700" fill="#4a5568">ISO 14443-3A</text>
<text x="470" y="450" font-size="14" font-weight="600" fill="#4f4f4f">Selects a single tag when several share the field</text>
<rect x="946" y="410" width="204" height="64" rx="9" fill="#f6e9e6"/>
<text x="1048" y="438" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">Overlapping tags</text>
<text x="1048" y="456" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">cause read errors</text>

<!-- Row 4 : Physical / RF -->
<rect x="128" y="492" width="800" height="80" rx="11" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.4"/>
<rect x="128" y="492" width="9" height="80" rx="4" fill="#4a5568"/>
<text x="160" y="526" font-size="18" font-weight="800" fill="#291c0e">Physical / RF</text>
<text x="160" y="552" font-size="13.5" font-weight="700" fill="#4a5568">ISO 18092 / ISO 14443-3A</text>
<text x="470" y="540" font-size="14" font-weight="600" fill="#4f4f4f">Magnetic coupling, power transfer, bit modulation</text>
<rect x="946" y="500" width="204" height="64" rx="9" fill="#f6e9e6"/>
<text x="1048" y="528" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">Out-of-range, metal,</text>
<text x="1048" y="546" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">detuned antenna</text>

<text x="600" y="612" text-anchor="middle" font-size="14.5" font-weight="600" fill="#5c5c5c">Read the stack top-to-bottom to debug a dead tap: the failure is almost always lower than you think.</text>
</svg>
