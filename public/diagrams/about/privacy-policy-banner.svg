<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ppTitle ppDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ppTitle">How Proud Tek handles your data on proudtek.com</title>
  <desc id="ppDesc">A left-to-right flow in three panels. You provide: inquiry and RFQ form data — name, email, company, country, quantity and message. We process: named US-based providers — Formspree for form delivery, Google Analytics which stays consent-gated and off until you accept, and Vercel for hosting and logs. You control: access, correction and deletion rights, plus full GDPR rights for EU and UK visitors, all handled at info@proudtek.com. A footer bar guarantees no data sold, no advertising trackers, no accounts, and analytics off by default.</desc>

  <defs>
    <radialGradient id="ppGlow" cx="50%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#ppGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="76" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="3" fill="#6d5a3a">COLLECT  ·  CONSENT  ·  CONTROL</text>

  <!-- ===================== CARD A: YOU PROVIDE ===================== -->
  <rect x="72" y="150" width="336" height="320" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="128" cy="212" r="31" fill="#c39a5f"/>
  <rect x="115" y="194" width="26" height="36" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="122" y1="204" x2="134" y2="204" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="122" y1="212" x2="134" y2="212" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="122" y1="220" x2="130" y2="220" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="178" y="205" font-size="24" font-weight="800" fill="#291c0e">YOU PROVIDE</text>
  <text x="178" y="231" font-size="14.5" fill="#6d5a3a">Data you actively give us</text>
  <line x1="96" y1="258" x2="384" y2="258" stroke="#ece5d8" stroke-width="2"/>
  <circle cx="108" cy="300" r="6" fill="#c39a5f"/>
  <text x="128" y="306" font-size="18" fill="#291c0e">Inquiry &amp; RFQ forms</text>
  <circle cx="108" cy="344" r="6" fill="#c39a5f"/>
  <text x="128" y="350" font-size="18" fill="#291c0e">Name · email · company</text>
  <circle cx="108" cy="388" r="6" fill="#c39a5f"/>
  <text x="128" y="394" font-size="18" fill="#291c0e">Country · quantity · message</text>
  <text x="96" y="440" font-size="14" fill="#8a7a5a">No accounts. No on-site payments.</text>

  <!-- arrow A -> B -->
  <path d="M414 300 l16 12 l-16 12" fill="none" stroke="#c39a5f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===================== CARD B: WE PROCESS ===================== -->
  <rect x="432" y="150" width="336" height="320" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="488" cy="212" r="31" fill="#3d6b6b"/>
  <rect x="473" y="197" width="30" height="14" rx="3" fill="none" stroke="#ffffff" stroke-width="2.6"/>
  <rect x="473" y="215" width="30" height="14" rx="3" fill="none" stroke="#ffffff" stroke-width="2.6"/>
  <circle cx="480" cy="204" r="2.2" fill="#ffffff"/>
  <circle cx="480" cy="222" r="2.2" fill="#ffffff"/>
  <text x="538" y="205" font-size="24" font-weight="800" fill="#291c0e">WE PROCESS</text>
  <text x="538" y="231" font-size="14.5" fill="#6d5a3a">Named processors, US-based</text>
  <line x1="456" y1="258" x2="744" y2="258" stroke="#ece5d8" stroke-width="2"/>
  <text x="456" y="299" font-size="18" font-weight="700" fill="#291c0e">Formspree</text>
  <text x="456" y="320" font-size="14.5" fill="#6d5a3a">form delivery to our inbox</text>
  <text x="456" y="356" font-size="18" font-weight="700" fill="#291c0e">Google Analytics</text>
  <rect x="456" y="370" width="120" height="21" rx="10.5" fill="#eaf3ef" stroke="#2d6a4f" stroke-width="1.4"/>
  <text x="516" y="384.5" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="0.5" fill="#2d6a4f">CONSENT-GATED</text>
  <text x="586" y="385" font-size="14.5" fill="#6d5a3a">off until you accept</text>
  <text x="456" y="421" font-size="18" font-weight="700" fill="#291c0e">Vercel</text>
  <text x="456" y="442" font-size="14.5" fill="#6d5a3a">hosting &amp; standard logs</text>

  <!-- arrow B -> C -->
  <path d="M774 300 l16 12 l-16 12" fill="none" stroke="#c39a5f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===================== CARD C: YOU CONTROL ===================== -->
  <rect x="792" y="150" width="336" height="320" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="848" cy="212" r="31" fill="#2d6a4f"/>
  <path d="M848 190 l18 6 v12 c0 12 -8 20 -18 24 c-10 -4 -18 -12 -18 -24 v-12 z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M840 212 l6 6 l12 -13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="898" y="205" font-size="24" font-weight="800" fill="#291c0e">YOU CONTROL</text>
  <text x="898" y="231" font-size="14.5" fill="#6d5a3a">Your rights, one address</text>
  <line x1="816" y1="258" x2="1104" y2="258" stroke="#ece5d8" stroke-width="2"/>
  <path d="M818 296 l5 5 l10 -12" fill="none" stroke="#2d6a4f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="842" y="306" font-size="18" fill="#291c0e">Access what we hold</text>
  <path d="M818 340 l5 5 l10 -12" fill="none" stroke="#2d6a4f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="842" y="350" font-size="18" fill="#291c0e">Correct or delete it</text>
  <path d="M818 384 l5 5 l10 -12" fill="none" stroke="#2d6a4f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="842" y="394" font-size="18" fill="#291c0e">Plus GDPR rights (EU/UK)</text>
  <text x="816" y="440" font-size="14" fill="#8a7a5a">One inbox: info@proudtek.com</text>

  <!-- ===================== FOOTER GUARANTEE BAR ===================== -->
  <rect x="72" y="512" width="1056" height="52" rx="16" fill="#291c0e"/>
  <text x="600" y="544" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1" fill="#ffffff">NO DATA SOLD   ·   NO AD TRACKERS   ·   NO ACCOUNTS   ·   ANALYTICS OFF BY DEFAULT</text>
  <text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#6d5a3a">Your consent choice lives in your own browser — we keep no server-side record of it.</text>
</svg>
