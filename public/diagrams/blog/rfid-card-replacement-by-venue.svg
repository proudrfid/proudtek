<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Replacement workflow for a dead RFID card, by venue type</title>
<desc id="d">Four venue lanes plus a mobile fallback. Hotels using MIFARE Classic or DESFire re-encode a blank at the front desk in under 30 seconds and destroy the old card. Offices using HID iCLASS SE or Seos issue a new credential number in the access software in under 5 minutes and revoke the old one. Warehouses using UHF Gen2 hard-tags swap in a rugged IP67 PPS or polycarbonate tag. Multi-tenant buildings and events keep pre-encoded contingency stock and budget 1 to 2 percent wastage. Across all of them, a mobile wallet credential can be issued to the phone in minutes as an instant fallback.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">REPLACE IT WITHOUT THE DOWNTIME</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Match the workflow to the venue and keep total downtime under one shift.</text>

<!-- HOTELS -->
<rect x="56" y="132" width="242" height="330" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="56" y="132" width="242" height="8" rx="4" fill="#3d6b6b"/>
<rect x="147" y="168" width="60" height="40" rx="6" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<rect x="171" y="176" width="14" height="24" rx="3" fill="none" stroke="#2c5454" stroke-width="2"/>
<text x="177" y="242" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#2c5454">HOTELS</text>
<text x="177" y="266" text-anchor="middle" font-size="12" fill="#8a8a8a">MIFARE Classic / DESFire</text>
<text x="177" y="300" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Re-encode a blank at the</text>
<text x="177" y="319" text-anchor="middle" font-size="12.5" fill="#5c5c5c">front desk; destroy the</text>
<text x="177" y="338" text-anchor="middle" font-size="12.5" fill="#5c5c5c">old card through the chip.</text>
<rect x="97" y="404" width="160" height="34" rx="17" fill="#eef5f5" stroke="#2c5454" stroke-width="1.4"/>
<text x="177" y="426" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">under 30 sec</text>

<!-- OFFICES -->
<rect x="338" y="132" width="242" height="330" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="338" y="132" width="242" height="8" rx="4" fill="#4a5568"/>
<rect x="437" y="166" width="44" height="44" rx="5" fill="#eef1f5" stroke="#4a5568" stroke-width="2"/>
<line x1="448" y1="178" x2="470" y2="178" stroke="#4a5568" stroke-width="1.6"/>
<line x1="448" y1="188" x2="470" y2="188" stroke="#4a5568" stroke-width="1.6"/>
<line x1="448" y1="198" x2="470" y2="198" stroke="#4a5568" stroke-width="1.6"/>
<text x="459" y="242" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#3f4a5c">OFFICES</text>
<text x="459" y="266" text-anchor="middle" font-size="12" fill="#8a8a8a">HID iCLASS SE / Seos</text>
<text x="459" y="300" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Issue a new credential</text>
<text x="459" y="319" text-anchor="middle" font-size="12.5" fill="#5c5c5c">number in the software;</text>
<text x="459" y="338" text-anchor="middle" font-size="12.5" fill="#5c5c5c">revoke the old one.</text>
<rect x="379" y="404" width="160" height="34" rx="17" fill="#eef1f5" stroke="#4a5568" stroke-width="1.4"/>
<text x="459" y="426" text-anchor="middle" font-size="13" font-weight="800" fill="#3f4a5c">under 5 min</text>

<!-- WAREHOUSES -->
<rect x="620" y="132" width="242" height="330" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="620" y="132" width="242" height="8" rx="4" fill="#4a5568"/>
<path d="M 741 166 L 765 178 L 765 204 L 741 216 L 717 204 L 717 178 Z" fill="#eef1f5" stroke="#4a5568" stroke-width="2"/>
<line x1="717" y1="178" x2="741" y2="190" stroke="#4a5568" stroke-width="1.6"/>
<line x1="765" y1="178" x2="741" y2="190" stroke="#4a5568" stroke-width="1.6"/>
<line x1="741" y1="190" x2="741" y2="216" stroke="#4a5568" stroke-width="1.6"/>
<text x="741" y="242" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#3f4a5c">WAREHOUSES</text>
<text x="741" y="266" text-anchor="middle" font-size="12" fill="#8a8a8a">UHF Gen2 hard-tags</text>
<text x="741" y="300" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Swap in a rugged IP67</text>
<text x="741" y="319" text-anchor="middle" font-size="12.5" fill="#5c5c5c">PPS or polycarbonate</text>
<text x="741" y="338" text-anchor="middle" font-size="12.5" fill="#5c5c5c">tag; re-map the EPC.</text>
<rect x="661" y="404" width="160" height="34" rx="17" fill="#eef1f5" stroke="#4a5568" stroke-width="1.4"/>
<text x="741" y="426" text-anchor="middle" font-size="13" font-weight="800" fill="#3f4a5c">rugged swap</text>

<!-- MULTI-TENANT -->
<rect x="902" y="132" width="242" height="330" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="902" y="132" width="242" height="8" rx="4" fill="#c39a5f"/>
<rect x="1003" y="170" width="24" height="40" rx="3" fill="#f7edd6" stroke="#a07d43" stroke-width="2"/>
<rect x="1027" y="182" width="20" height="28" rx="3" fill="#f7edd6" stroke="#a07d43" stroke-width="2"/>
<text x="1023" y="242" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#8a6d2f">MULTI-TENANT</text>
<text x="1023" y="266" text-anchor="middle" font-size="12" fill="#8a8a8a">events &amp; convention halls</text>
<text x="1023" y="300" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Keep pre-encoded</text>
<text x="1023" y="319" text-anchor="middle" font-size="12.5" fill="#5c5c5c">contingency stock; budget</text>
<text x="1023" y="338" text-anchor="middle" font-size="12.5" fill="#5c5c5c">1-2% wastage per event.</text>
<rect x="943" y="404" width="160" height="34" rx="17" fill="#f7edd6" stroke="#a07d43" stroke-width="1.4"/>
<text x="1023" y="426" text-anchor="middle" font-size="13" font-weight="800" fill="#8a6d2f">stock on hand</text>

<!-- MOBILE FALLBACK BAR -->
<rect x="56" y="494" width="1088" height="112" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<rect x="56" y="494" width="8" height="112" rx="4" fill="#1f6f3a"/>
<text x="600" y="530" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">MOBILE CREDENTIAL FALLBACK</text>
<text x="600" y="558" text-anchor="middle" font-size="13.5" fill="#33595a">Apple Wallet, Google Wallet, HID Mobile Access or Aliro — issue a key to the phone in minutes,</text>
<text x="600" y="580" text-anchor="middle" font-size="13.5" fill="#33595a">so the user keeps working while a replacement plastic card follows the next business day.</text>
</svg>
