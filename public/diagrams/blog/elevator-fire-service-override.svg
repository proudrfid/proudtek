<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Elevator reader placement and the fire-service override that bypasses RFID restrictions</title>
<desc id="d">Top, two reader placements: an in-car reader on the button panel and a hall-call reader at the lobby elevator bank for destination dispatch, with data carried over RS-485, Wiegand or OSDP through the traveling cable. Below, two operating states. In normal operation the RFID reader checks the credential and enables only authorized floors while restricted floors stay locked. On fire-alarm activation the override bypasses all RFID restrictions so every floor is accessible for evacuation, and Phase I and Phase II firefighter recall run independently of the access system.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INSTALLATION &amp; THE FIRE OVERRIDE</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Reader placement is routine — the fire-alarm bypass is non-negotiable.</text>

<!-- reader placement chips -->
<rect x="150" y="102" width="380" height="66" rx="10" fill="#eef5f5" stroke="#8fb6b6" stroke-width="2"/>
<text x="340" y="132" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">In-car reader</text>
<text x="340" y="153" text-anchor="middle" font-size="12.5" fill="#4f4f4f">on the button panel</text>
<rect x="670" y="102" width="380" height="66" rx="10" fill="#eef5f5" stroke="#8fb6b6" stroke-width="2"/>
<text x="860" y="132" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">Hall-call reader</text>
<text x="860" y="153" text-anchor="middle" font-size="12.5" fill="#4f4f4f">at the lobby bank (destination dispatch)</text>
<text x="600" y="196" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Reader data — RS-485, Wiegand or OSDP — routes through the elevator traveling cable.</text>

<!-- state panels -->
<rect x="64" y="224" width="510" height="380" rx="16" fill="#eef7f5" stroke="#cfe3dd" stroke-width="2"/>
<text x="319" y="262" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#234a4a">NORMAL OPERATION</text>
<circle cx="100" cy="317" r="11" fill="#3d6b6b"/>
<path d="M 95 317 l 3 4 l 6 -8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120" y="323" font-size="15" fill="#291c0e">RFID reader checks the credential</text>
<circle cx="100" cy="372" r="11" fill="#3d6b6b"/>
<path d="M 95 372 l 3 4 l 6 -8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120" y="378" font-size="15" fill="#291c0e">Only authorized floors are enabled</text>
<circle cx="100" cy="427" r="11" fill="#3d6b6b"/>
<path d="M 95 427 l 3 4 l 6 -8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120" y="433" font-size="15" fill="#291c0e">Restricted floors stay locked</text>
<rect x="88" y="520" width="462" height="52" rx="10" fill="#ffffff" stroke="#bcd6d1" stroke-width="1.6"/>
<text x="319" y="552" text-anchor="middle" font-size="14" font-weight="700" fill="#234a4a">Security posture: restrictions ON</text>

<polygon points="584,404 610,417 584,430" fill="#8b2d2d"/>
<text x="600" y="470" text-anchor="middle" font-size="12" font-weight="800" fill="#8b2d2d">ON</text>
<text x="600" y="486" text-anchor="middle" font-size="12" font-weight="800" fill="#8b2d2d">ALARM</text>

<rect x="626" y="224" width="510" height="380" rx="16" fill="#fbf3f3" stroke="#e6c9c9" stroke-width="2"/>
<text x="881" y="262" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">FIRE-ALARM OVERRIDE</text>
<circle cx="662" cy="317" r="8" fill="#8b2d2d"/>
<text x="682" y="323" font-size="15" fill="#291c0e">Bypasses all RFID restrictions</text>
<circle cx="662" cy="372" r="8" fill="#8b2d2d"/>
<text x="682" y="378" font-size="15" fill="#291c0e">Every floor accessible for evacuation</text>
<circle cx="662" cy="427" r="8" fill="#8b2d2d"/>
<text x="682" y="433" font-size="15" fill="#291c0e">Phase I &amp; II recall run independently</text>
<rect x="650" y="520" width="462" height="52" rx="10" fill="#ffffff" stroke="#e6c9c9" stroke-width="1.6"/>
<text x="881" y="552" text-anchor="middle" font-size="14" font-weight="700" fill="#8b2d2d">Life-safety: restrictions OFF, automatically</text>

<text x="600" y="638" text-anchor="middle" font-size="14" fill="#4f4f4f">All modifications must meet local elevator code and pass the authority having jurisdiction.</text>
</svg>
