<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Match a waterproof RFID tag to the punishment: splash, submersion, hot wash-down or extreme heat</title>
<desc id="d">Four outdoor punishments each map to a rating. Splash and rain need IP65 to IP67, for rain, wash and vehicle or signage tags. Submersion needs IP68, for buoys, valves, dock and trapped water. Hot wash-down needs IP69K, an 80 to 100 bar spray at 80 degrees Celsius, for food, dairy and pharmaceutical clean-in-place lines. Extreme heat needs specialty tags, such as paint ovens at 250 degrees Celsius and downhole tools at 22,000 psi. The IP rating is the spec; the encapsulant — silicone, epoxy or glass — is what makes it hold.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INDUSTRIAL RFID · WATERPROOFING &amp; IP RATINGS</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Match the tag to the punishment, not the brochure</text>
<text x="600" y="140" text-anchor="middle" font-size="15.5" fill="#4f4f4f">A tag that shrugs off a car wash can quietly die in a freezer — so spec the threat, not the word "waterproof."</text>

<!-- Tile 1: splash -->
<rect x="64" y="176" width="258" height="232" rx="13" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<rect x="64" y="176" width="258" height="8" rx="4" fill="#3d6b6b"/>
<path d="M193 210 C205 226, 203 240, 193 240 C183 240, 181 226, 193 210 Z" fill="#3d6b6b"/>
<text x="193" y="286" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">SPLASH &amp; RAIN</text>
<text x="193" y="322" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454">IP65–IP67</text>
<text x="193" y="356" text-anchor="middle" font-size="12" fill="#5c5c5c">rain, wash, vehicle &amp;</text>
<text x="193" y="375" text-anchor="middle" font-size="12" fill="#5c5c5c">outdoor signage tags</text>

