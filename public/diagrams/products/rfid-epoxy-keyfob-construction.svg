<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Epoxy RFID keyfob — construction cross-section and body top view</title>
<desc id="d">Two panels. Left, the layer stack inside the pot: a UV-stabilised clear epoxy dome 3 to 5 millimetres high sits over a CMYK or Pantone artwork layer, an HF or LF inlay with chip and etched antenna, and a PVC, PET or aluminium substrate. The cured dome acts as a lens that magnifies artwork about 1.1 to 1.3 times, so physical samples are approved rather than screen proofs. The seamless pot gives IP68 by construction per IEC 60529 — there is no weld seam for water or chemicals to find. Right, the top view: a teardrop body 30 to 50 millimetres long and 20 to 35 millimetres wide weighing 6 to 14 grams, with a 4 to 6 millimetre key-ring hole and optional metal grommet. A comparison strip notes that an ABS weld seam becomes an ingress path after 5 to 7 years outdoors, while the epoxy pot is seamless. Footer: minus 40 to plus 85 degrees Celsius service, IP68, ATEX Zone 2 and 22 passive-equipment use, NEMA 4X wash-down, 7 to 12 year field life.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
