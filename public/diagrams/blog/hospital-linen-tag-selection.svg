<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="hlS2Title hlS2Desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="hlS2Title">Picking a hospital linen tag that outlives the laundry</title>
  <desc id="hlS2Desc">Two frequency choices: UHF at 860 to 960 megahertz for general linen through high-throughput tunnel readers, and HF at 13.56 megahertz for surgical linens needing autoclave compatibility. Form factor decides lifespan — a woven-seam tag survives 200 plus cycles while a corner button tag taps out at 50 to 100. Chips: PPS-encapsulated UHF rated 200 plus cycles at 80 degrees Celsius, or ceramic HF rated 1000 plus autoclave cycles. Tunnel readers clear 200 to 500 items per hour at 99 percent plus. Cost is 0.30 to 1.50 dollars per tag, about 0.002 to 0.008 dollars per cycle, against a 1 to 3 dollar wash cycle.</desc>

  <defs>
    <radialGradient id="s2Bg" cx="50%" cy="16%" r="95%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f0ebdf"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#s2Bg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="25" font-weight="800" fill="#291c0e">Picking a tag that outlives the laundry</text>
  <text x="600" y="90" text-anchor="middle" font-size="15.5" fill="#2d6a4f">Match the frequency to the reader, the form factor to the lifespan.</text>

  <!-- two frequency columns -->
  <!-- UHF -->
  <rect x="62" y="122" width="520" height="300" rx="16" fill="#eef4f6" stroke="#bcd4dd" stroke-width="2"/>
  <rect x="62" y="122" width="520" height="8" rx="4" fill="#1f4e79"/>
  <text x="90" y="162" font-size="18" font-weight="800" fill="#1f4e79">UHF · 860-960 MHz</text>
  <text x="90" y="186" font-size="13.5" fill="#4a5568">general linen · high-throughput tunnel readers</text>
  <line x1="90" y1="202" x2="554" y2="202" stroke="#bcd4dd" stroke-width="1.5"/>
  <text x="90" y="232" font-size="14.5" fill="#334">Woven-seam tag — <tspan font-weight="700" fill="#1f4e79">200-300 cycles</tspan></text>
  <text x="90" y="262" font-size="14.5" fill="#334">Button tag, corner-clipped — <tspan font-weight="700" fill="#1f4e79">300-500 cycles</tspan></text>
  <text x="90" y="292" font-size="14.5" fill="#334">Chip: PPS-encapsulated UHF</text>
  <text x="90" y="316" font-size="13.5" fill="#4a5568">rated 300-500 cycles at 80°C wash</text>
  <rect x="90" y="336" width="464" height="60" rx="12" fill="#ffffff" stroke="#bcd4dd" stroke-width="1.5"/>
  <text x="110" y="362" font-size="14" fill="#4a5568">Tunnel reader throughput</text>
  <text x="534" y="374" text-anchor="end" font-size="22" font-weight="800" fill="#1f4e79">200-500/hr</text>
  <text x="110" y="384" font-size="13" fill="#5c5c5c">at 99%+ read rate</text>

  <!-- HF -->
  <rect x="618" y="122" width="520" height="300" rx="16" fill="#f0f6f1" stroke="#a9c8b2" stroke-width="2"/>
  <rect x="618" y="122" width="520" height="8" rx="4" fill="#2d6a4f"/>
  <text x="646" y="162" font-size="18" font-weight="800" fill="#1f6f3a">HF · 13.56 MHz</text>
  <text x="646" y="186" font-size="13.5" fill="#3c5c46">surgical linens · autoclave-compatible</text>
  <line x1="646" y1="202" x2="1110" y2="202" stroke="#a9c8b2" stroke-width="1.5"/>
  <text x="646" y="232" font-size="14.5" fill="#334">Chip: ceramic HF disc</text>
  <text x="646" y="262" font-size="14.5" fill="#334">Sealed against steam ingress</text>
  <text x="646" y="292" font-size="14.5" fill="#334">Survives the surgical wardrobe</text>
  <text x="646" y="316" font-size="13.5" fill="#3c5c46">drapes, gowns, wraps</text>
  <rect x="646" y="336" width="464" height="60" rx="12" fill="#ffffff" stroke="#a9c8b2" stroke-width="1.5"/>
  <text x="666" y="362" font-size="14" fill="#3c5c46">Autoclave endurance</text>
  <text x="1090" y="374" text-anchor="end" font-size="22" font-weight="800" fill="#1f6f3a">1000+ cycles</text>
  <text x="666" y="384" font-size="13" fill="#5c5c5c">134°C steam-rated builds</text>

  <!-- cost strip -->
  <rect x="62" y="442" width="1076" height="176" rx="16" fill="#fbf8f2" stroke="#e6dbc4" stroke-width="2"/>
  <text x="90" y="476" font-size="13" font-weight="800" letter-spacing="1.5" fill="#8a6d33">THE COST, IN PERSPECTIVE</text>

  <g>
    <rect x="90" y="492" width="320" height="104" rx="12" fill="#ffffff" stroke="#eadfca"/>
    <text x="250" y="524" text-anchor="middle" font-size="14" fill="#6c5127">per tag, incl. embedding</text>
    <text x="250" y="560" text-anchor="middle" font-size="30" font-weight="800" fill="#8a6d33">$0.30-1.50</text>
    <text x="250" y="582" text-anchor="middle" font-size="13" fill="#5c5c5c">a one-time cost</text>
  </g>
  <text x="440" y="550" text-anchor="middle" font-size="28" fill="#c39a5f">÷</text>
  <g>
    <rect x="470" y="492" width="320" height="104" rx="12" fill="#ffffff" stroke="#eadfca"/>
    <text x="630" y="524" text-anchor="middle" font-size="14" fill="#6c5127">amortized over 300-500 cycles</text>
    <text x="630" y="560" text-anchor="middle" font-size="30" font-weight="800" fill="#8a6d33">$0.002-0.008</text>
    <text x="630" y="582" text-anchor="middle" font-size="13" fill="#5c5c5c">per wash cycle</text>
  </g>
  <text x="820" y="550" text-anchor="middle" font-size="24" fill="#c39a5f">vs</text>
  <g>
    <rect x="850" y="492" width="260" height="104" rx="12" fill="#f0f6f1" stroke="#a9c8b2"/>
    <text x="980" y="524" text-anchor="middle" font-size="14" fill="#3c5c46">running the wash cycle</text>
    <text x="980" y="560" text-anchor="middle" font-size="30" font-weight="800" fill="#1f6f3a">$1-3</text>
    <text x="980" y="582" text-anchor="middle" font-size="13" fill="#5c5c5c">a rounding error beside it</text>
  </g>
</svg>
