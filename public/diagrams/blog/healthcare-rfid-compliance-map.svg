<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Mapping healthcare compliance frameworks to the RFID control that satisfies each</title>
<desc id="d">Five rows, each pairing a framework with the RFID control it satisfies. HIPAA Security Rule (45 CFR 164.302-318): every wristband-to-EHR scan is logged to a verified user, closing the shared-session gap. Joint Commission NPSG.01.01.01: at least two identifiers before any care. FDA UDI (21 CFR 801 / 830): in-house scan logs trace each device, while the manufacturer label and GUDID submission stay a separate obligation. DEA EPCS: a badge tap serves as one of the two required authentication factors. GDPR and HHS Privacy: only a pseudonymous identifier rides the tag and PHI resolves server-side.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COMPLIANCE MAP · FRAMEWORK → RFID CONTROL</text>
<text x="600" y="82" text-anchor="middle" font-size="15.5" fill="#4f4f4f">The audit checks the mapping — each control should point at the rule it satisfies.</text>

<!-- row 1 -->
<rect x="64" y="118" width="306" height="64" rx="12" fill="#eaf3ec" stroke="#c4dccb" stroke-width="1.6"/>
<text x="82" y="146" font-size="15" font-weight="800" fill="#1b4332">HIPAA Security Rule</text>
<text x="82" y="167" font-size="12.5" fill="#5c7a68">45 CFR 164.302-318</text>
<line x1="380" y1="150" x2="404" y2="150" stroke="#2d6a4f" stroke-width="3"/><polygon points="404,143 420,150 404,157" fill="#2d6a4f"/>
<rect x="430" y="118" width="706" height="64" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="430" y="118" width="6" height="64" rx="3" fill="#2d6a4f"/>
<text x="456" y="144" font-size="14" fill="#291c0e">Every wristband-to-EHR scan is logged to a verified user —</text>
<text x="456" y="166" font-size="14" fill="#291c0e">closing the shared-session compliance gap.</text>

<!-- row 2 -->
<rect x="64" y="200" width="306" height="64" rx="12" fill="#eaf3ec" stroke="#c4dccb" stroke-width="1.6"/>
<text x="82" y="228" font-size="15" font-weight="800" fill="#1b4332">Joint Commission</text>
<text x="82" y="249" font-size="12.5" fill="#5c7a68">NPSG.01.01.01</text>
<line x1="380" y1="232" x2="404" y2="232" stroke="#2d6a4f" stroke-width="3"/><polygon points="404,225 420,232 404,239" fill="#2d6a4f"/>
<rect x="430" y="200" width="706" height="64" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="430" y="200" width="6" height="64" rx="3" fill="#2d6a4f"/>
<text x="456" y="237" font-size="14.5" fill="#291c0e">At least two patient identifiers before any care, treatment or service.</text>

<!-- row 3 -->
<rect x="64" y="282" width="306" height="64" rx="12" fill="#eaf3ec" stroke="#c4dccb" stroke-width="1.6"/>
<text x="82" y="310" font-size="15" font-weight="800" fill="#1b4332">FDA UDI</text>
<text x="82" y="331" font-size="12.5" fill="#5c7a68">21 CFR 801 / 830</text>
<line x1="380" y1="314" x2="404" y2="314" stroke="#2d6a4f" stroke-width="3"/><polygon points="404,307 420,314 404,321" fill="#2d6a4f"/>
<rect x="430" y="282" width="706" height="64" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="430" y="282" width="6" height="64" rx="3" fill="#2d6a4f"/>
<text x="456" y="308" font-size="14" fill="#291c0e">In-house scan logs trace each device automatically; the manufacturer</text>
<text x="456" y="330" font-size="14" fill="#291c0e">label plus GUDID submission stays a separate obligation.</text>

<!-- row 4 -->
<rect x="64" y="364" width="306" height="64" rx="12" fill="#eaf3ec" stroke="#c4dccb" stroke-width="1.6"/>
<text x="82" y="392" font-size="15" font-weight="800" fill="#1b4332">DEA EPCS</text>
<text x="82" y="413" font-size="12.5" fill="#5c7a68">controlled substances</text>
<line x1="380" y1="396" x2="404" y2="396" stroke="#2d6a4f" stroke-width="3"/><polygon points="404,389 420,396 404,403" fill="#2d6a4f"/>
<rect x="430" y="364" width="706" height="64" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="430" y="364" width="6" height="64" rx="3" fill="#2d6a4f"/>
<text x="456" y="401" font-size="14.5" fill="#291c0e">A badge tap can serve as one of the two required authentication factors.</text>

<!-- row 5 -->
<rect x="64" y="446" width="306" height="64" rx="12" fill="#eaf3ec" stroke="#c4dccb" stroke-width="1.6"/>
<text x="82" y="474" font-size="15" font-weight="800" fill="#1b4332">GDPR / HHS Privacy</text>
<text x="82" y="495" font-size="12.5" fill="#5c7a68">EU + HHS-funded programs</text>
<line x1="380" y1="478" x2="404" y2="478" stroke="#2d6a4f" stroke-width="3"/><polygon points="404,471 420,478 404,485" fill="#2d6a4f"/>
<rect x="430" y="446" width="706" height="64" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="430" y="446" width="6" height="64" rx="3" fill="#2d6a4f"/>
<text x="456" y="483" font-size="14.5" fill="#291c0e">Only a pseudonymous identifier rides the tag; PHI resolves server-side.</text>

<text x="600" y="556" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">The technology is half the audit; the other half is showing which rule each scan satisfies.</text>
<text x="600" y="586" text-anchor="middle" font-size="13" fill="#5c5c5c">Keep PHI off the chip entirely — carry an opaque identifier and resolve it behind the firewall.</text>
</svg>
