<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">What the public RFID and NFC cloning research actually shows</title>
<desc id="d">Three dated disclosures and two standing facts. 2007 to 2008: Nohl, Plotz and Henryk reverse-engineered NXP's MIFARE Classic Crypto-1 cipher, and key recovery with mfoc and hardnested is now standard, so assume all Classic is clonable. 2010 to 2014: Meriac and Garcia showed HID iCLASS Standard Security used a shared site key recoverable from readers, so migrate to iCLASS SE or SEOS. 2024: Quarkslab disclosed an authentication backdoor in Fudan FM11RF08 Classic-compatible chips, so audit off-brand Classic stock. Standing fact: 125 kHz Prox and EM4100 are copyable by design and predate the threat model. And AES-128 done right — DESFire EV2 and EV3, iCLASS SE and SEOS, NTAG 424 DNA — has no known practical clone as of mid-2026, though configuration errors can still downgrade it.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT THE PUBLIC RESEARCH SHOWS</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Each finding maps to a chip family — and to whether you actually need to act.</text>

<!-- Card 1 -->
<rect x="64" y="120" width="346" height="286" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="64" y="120" width="8" height="286" rx="4" fill="#8b2d2d"/>
<text x="96" y="158" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">2007–2008</text>
<text x="96" y="188" font-size="16" font-weight="800" fill="#291c0e">Crypto-1 cipher</text>
<text x="96" y="210" font-size="16" font-weight="800" fill="#291c0e">reverse-engineered</text>
<line x1="96" y1="226" x2="386" y2="226" stroke="#eadfce" stroke-width="1.4"/>
<text x="96" y="254" font-size="13" fill="#4f4f4f">Nohl, Plotz and Henryk broke</text>
<text x="96" y="275" font-size="13" fill="#4f4f4f">NXP's MIFARE Classic cipher;</text>
<text x="96" y="296" font-size="13" fill="#4f4f4f">mfoc / hardnested key recovery</text>
<text x="96" y="317" font-size="13" fill="#4f4f4f">now ships in security distros.</text>
<rect x="96" y="338" width="278" height="42" rx="8" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="110" y="364" font-size="12.5" font-weight="700" fill="#6d5a3a">Assume all Classic is clonable</text>

<!-- Card 2 -->
<rect x="427" y="120" width="346" height="286" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="427" y="120" width="8" height="286" rx="4" fill="#8b2d2d"/>
<text x="459" y="158" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">2010–2014</text>
<text x="459" y="188" font-size="16" font-weight="800" fill="#291c0e">HID iCLASS legacy</text>
<text x="459" y="210" font-size="16" font-weight="800" fill="#291c0e">key extraction</text>
<line x1="459" y1="226" x2="749" y2="226" stroke="#eadfce" stroke-width="1.4"/>
<text x="459" y="254" font-size="13" fill="#4f4f4f">Meriac and Garcia showed</text>
<text x="459" y="275" font-size="13" fill="#4f4f4f">'Standard Security' used one</text>
<text x="459" y="296" font-size="13" fill="#4f4f4f">shared site key, recoverable</text>
<text x="459" y="317" font-size="13" fill="#4f4f4f">from a compromised reader.</text>
<rect x="459" y="338" width="278" height="42" rx="8" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="473" y="364" font-size="12.5" font-weight="700" fill="#6d5a3a">Migrate to iCLASS SE / SEOS</text>

<!-- Card 3 -->
<rect x="790" y="120" width="346" height="286" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="790" y="120" width="8" height="286" rx="4" fill="#8b2d2d"/>
<text x="822" y="158" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">2024</text>
<text x="822" y="188" font-size="16" font-weight="800" fill="#291c0e">Fudan FM11RF08</text>
<text x="822" y="210" font-size="16" font-weight="800" fill="#291c0e">static-nonce backdoor</text>
<line x1="822" y1="226" x2="1112" y2="226" stroke="#eadfce" stroke-width="1.4"/>
<text x="822" y="254" font-size="13" fill="#4f4f4f">Quarkslab disclosed an auth</text>
<text x="822" y="275" font-size="13" fill="#4f4f4f">backdoor in FM11RF08 'Classic-</text>
<text x="822" y="296" font-size="13" fill="#4f4f4f">compatible' chips found in many</text>
<text x="822" y="317" font-size="13" fill="#4f4f4f">low-cost cards and hotel keys.</text>
<rect x="822" y="338" width="278" height="42" rx="8" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="836" y="364" font-size="12.5" font-weight="700" fill="#6d5a3a">Audit off-brand Classic stock</text>

<!-- Standing fact A: LF by design -->
<rect x="64" y="424" width="1072" height="72" rx="12" fill="#f2eee4" stroke="#e0d6bf" stroke-width="1.4"/>
<rect x="64" y="424" width="8" height="72" rx="4" fill="#4a5568"/>
<text x="100" y="456" font-size="14.5" font-weight="800" fill="#3a4453">125 kHz Prox / EM4100 — copyable by design</text>
<text x="100" y="480" font-size="13" fill="#333333">Not a bug: these predate the threat model. Treat any Prox population as already public knowledge.</text>

<!-- Standing fact B: AES safe -->
<rect x="64" y="510" width="1072" height="90" rx="12" fill="#e8f2ea" stroke="#bcdcc7" stroke-width="1.5"/>
<rect x="64" y="510" width="8" height="90" rx="4" fill="#1f6f3a"/>
<text x="100" y="542" font-size="14.5" font-weight="800" fill="#1f6f3a">AES-128 done right — no known practical clone (mid-2026)</text>
<text x="100" y="566" font-size="13" fill="#333333">DESFire EV2/EV3, iCLASS SE/SEOS and NTAG 424 DNA hold up when properly personalized.</text>
<text x="100" y="588" font-size="13" fill="#333333">Caveat: default keys, weak diversification or Wiegand fallback can still downgrade them to Classic-level risk.</text>
</svg>
