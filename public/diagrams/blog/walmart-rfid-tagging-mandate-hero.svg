<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The Walmart RFID compliance pipeline, from factory tag to DC gate</title>
<desc id="d">Three beats. At the factory: source-tag every unit and encode an SGTIN-96 EPC at five to twelve cents per unit. In transit: the ASN 856 links each carton's SSCC-18 to its member EPC serials, with EPCIS 2.0 as an optional stream. At the DC gate: a tunnel reader counts every unit and passes the shipment at ninety-eight percent first-pass reads or issues per-unit chargebacks below ninety-five percent.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WALMART RFID MANDATE · SUPPLIER COMPLIANCE</text>
<text x="600" y="99" text-anchor="middle" font-size="37" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">From factory tag to DC gate</text>
<text x="600" y="131" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Source-tag, encode SGTIN-96, declare it on the ASN, then pass the tunnel reader — or pay per unit.</text>

<rect x="88" y="196" width="300" height="280" rx="14" fill="#ffffff" stroke="#d3dae3" stroke-width="1.8"/><rect x="88" y="196" width="300" height="8" rx="4" fill="#4a5568"/>
<text x="238" y="240" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#3a4453">AT THE FACTORY</text>
<rect x="118" y="268" width="240" height="46" rx="10" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/>
<text x="238" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Source-tag every unit</text>
<rect x="118" y="326" width="240" height="46" rx="10" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/>
<text x="238" y="354" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Encode SGTIN-96 EPC</text>
<rect x="118" y="398" width="240" height="32" rx="16" fill="#ffffff" stroke="#b9c2ce" stroke-width="1.2"/>
<text x="238" y="419" text-anchor="middle" font-size="13" font-weight="800" fill="#3a4453">$0.05–0.12 / unit</text>

<rect x="450" y="196" width="300" height="280" rx="14" fill="#ffffff" stroke="#d3dae3" stroke-width="1.8"/><rect x="450" y="196" width="300" height="8" rx="4" fill="#4a5568"/>
<text x="600" y="240" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#3a4453">IN TRANSIT</text>
<rect x="480" y="268" width="240" height="46" rx="10" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/>
<text x="600" y="290" text-anchor="middle" font-size="12.5" fill="#291c0e">ASN 856 links each carton</text>
<text x="600" y="307" text-anchor="middle" font-size="12.5" fill="#291c0e">to its member EPC serials</text>
<rect x="480" y="326" width="240" height="46" rx="10" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/>
<text x="600" y="354" text-anchor="middle" font-size="13" fill="#291c0e">EPCIS 2.0 — optional stream</text>
<rect x="480" y="398" width="240" height="32" rx="16" fill="#ffffff" stroke="#b9c2ce" stroke-width="1.2"/>
<text x="600" y="419" text-anchor="middle" font-size="13" font-weight="800" fill="#3a4453">SSCC-18 ↔ SGTIN link</text>

<rect x="812" y="196" width="300" height="280" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/><rect x="812" y="196" width="300" height="8" rx="4" fill="#1f6f3a"/>
<text x="962" y="240" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">AT THE DC GATE</text>
<text x="962" y="266" text-anchor="middle" font-size="12.5" fill="#5c5c5c">tunnel reader counts every unit</text>
<rect x="842" y="288" width="240" height="58" rx="12" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="962" y="313" text-anchor="middle" font-size="15" font-weight="800" fill="#1f6f3a">PASS</text>
<text x="962" y="334" text-anchor="middle" font-size="12.5" fill="#2d6a4f">≥ 98.0% first-pass reads</text>
<rect x="842" y="360" width="240" height="58" rx="12" fill="#fbf3f3" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="962" y="385" text-anchor="middle" font-size="15" font-weight="800" fill="#8b2d2d">CHARGEBACK</text>
<text x="962" y="406" text-anchor="middle" font-size="12.5" fill="#7a2323">&lt; 95% read rate</text>

<line x1="392" y1="336" x2="437" y2="336" stroke="#4a5568" stroke-width="3"/><polygon points="437,329 446,336 437,343" fill="#4a5568"/>
<line x1="754" y1="336" x2="799" y2="336" stroke="#4a5568" stroke-width="3"/><polygon points="799,329 808,336 799,343" fill="#4a5568"/>
<text x="600" y="612" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Miss the read rate and the deduction files itself — there is no human in the loop.</text>
</svg>
