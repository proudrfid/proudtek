<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="fcTitle fcDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="fcTitle">Five factors that determine UHF RFID read range</title>
  <desc id="fcDesc">Five stacked factors. One, tag chip sensitivity, roughly minus 20 to minus 23.5 dBm, where lower means farther and NXP UCODE 9 leads at minus 23.5. Two, tag antenna design, where bigger and better-tuned means farther. Three, reader transmit power, 1 to 4 watts capped by region, 4 watts in the US and 2 watts in the EU. Four, reader antenna gain, directional or circular-polarized. Five, and biggest of all, the mounting surface material, from cardboard down to metal. The surface is highlighted as the dominant variable.</desc>
  <defs>
    <radialGradient id="fcBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#fcBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="66" text-anchor="middle" font-size="27" font-weight="800" letter-spacing="1.5" fill="#6d5a3a">FIVE THINGS THAT DECIDE READ RANGE</text>

  <!-- Row 1 -->
  <rect x="56" y="96" width="1088" height="82" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="112" cy="137" r="29" fill="#3d6b6b"/><text x="112" y="146" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">1</text>
  <text x="172" y="130" font-size="24" font-weight="800" fill="#291c0e">Tag chip sensitivity</text>
  <text x="172" y="160" font-size="17" fill="#4f4f4f">The power a chip needs to wake up — lower dBm reads farther</text>
  <rect x="902" y="115" width="214" height="46" rx="23" fill="#e7f0ef" stroke="#9cbfbc" stroke-width="1.5"/><text x="1009" y="144" text-anchor="middle" font-size="16" font-weight="700" fill="#2c5454">−20 to −23.5 dBm</text>

  <!-- Row 2 -->
  <rect x="56" y="188" width="1088" height="82" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="112" cy="229" r="29" fill="#4a5568"/><text x="112" y="238" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">2</text>
  <text x="172" y="222" font-size="24" font-weight="800" fill="#291c0e">Tag antenna design</text>
  <text x="172" y="252" font-size="17" fill="#4f4f4f">Converts reader energy to chip power and backscatters the reply</text>
  <rect x="902" y="207" width="214" height="46" rx="23" fill="#eef1f4" stroke="#c3ccd6" stroke-width="1.5"/><text x="1009" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#3a4a52">bigger = farther</text>

  <!-- Row 3 -->
  <rect x="56" y="280" width="1088" height="82" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="112" cy="321" r="29" fill="#1f4e79"/><text x="112" y="330" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">3</text>
  <text x="172" y="314" font-size="24" font-weight="800" fill="#291c0e">Reader transmit power</text>
  <text x="172" y="344" font-size="17" fill="#4f4f4f">More watts reach farther — until the regulator says stop</text>
  <rect x="902" y="299" width="214" height="46" rx="23" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.5"/><text x="1009" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#177a92">US 4W · EU 2W</text>

  <!-- Row 4 -->
  <rect x="56" y="372" width="1088" height="82" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="112" cy="413" r="29" fill="#6d5a3a"/><text x="112" y="422" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">4</text>
  <text x="172" y="406" font-size="24" font-weight="800" fill="#291c0e">Reader antenna gain</text>
  <text x="172" y="436" font-size="17" fill="#4f4f4f">Directional focus vs. circular-polarized any-orientation reads</text>
  <rect x="902" y="391" width="214" height="46" rx="23" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="1009" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">focus vs. coverage</text>

  <!-- Row 5 — highlighted -->
  <rect x="48" y="466" width="1104" height="96" rx="16" fill="#fff8ec" stroke="#c39a5f" stroke-width="3"/>
  <circle cx="112" cy="514" r="31" fill="#8b2d2d"/><text x="112" y="523" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">5</text>
  <text x="172" y="504" font-size="25" font-weight="800" fill="#291c0e">Mounting surface material</text>
  <text x="172" y="536" font-size="17.5" fill="#4f4f4f">The single biggest real-world variable — cardboard to metal</text>
  <rect x="896" y="490" width="228" height="48" rx="24" fill="#f5e6e6" stroke="#d9a3a3" stroke-width="1.5"/><text x="1010" y="520" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2d2d">biggest swing</text>

  <text x="600" y="606" text-anchor="middle" font-size="17" font-weight="600" fill="#6d5a3a">The first four are engineering. The fifth is whatever you stuck the tag to — and it usually wins.</text>
</svg>
