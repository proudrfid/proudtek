<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Wedge tag clip anatomy — non-penetrating mount on pipe</title>
<desc id="d">Cutaway of a spring-loaded wedge clip gripping a pipe, with the housing layer stack and the rule it obeys: no drilling, no welding, no penetration of the pressure boundary.</desc>
<rect width="1200" height="675" fill="#f8f6f1"/>
<text x="60" y="64" font-family="Georgia, serif" font-size="34" fill="#291c0e">The grip that never drills</text>
<text x="60" y="98" font-family="Verdana, sans-serif" font-size="16" fill="#6d5a3a">Spring-loaded wedge clip — pipes 15-100 mm OD, tray rails 25-150 mm — pressure boundary untouched</text>
<circle cx="330" cy="390" r="150" fill="none" stroke="#291c0e" stroke-width="5"/>
<circle cx="330" cy="390" r="118" fill="none" stroke="#c39a5f" stroke-width="2" stroke-dasharray="6 5"/>
<text x="330" y="396" font-family="Verdana, sans-serif" font-size="14" fill="#6d5a3a" text-anchor="middle">pipe 15-100 mm OD</text>
<path d="M258 252 L402 252 L382 208 L278 208 Z" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
<path d="M278 208 L382 208 L370 176 L290 176 Z" fill="#f8f6f1" stroke="#2c5454" stroke-width="2"/>
<path d="M262 250 Q330 214 398 250" fill="none" stroke="#f8f6f1" stroke-width="3"/>
<text x="330" y="166" font-family="Verdana, sans-serif" font-size="13" fill="#2c5454" text-anchor="middle">tapered wedge seats tighter as the clip loads</text>
<line x1="420" y1="200" x2="560" y2="180" stroke="#6d5a3a" stroke-width="1.5"/>
<g font-family="Verdana, sans-serif" font-size="14" fill="#291c0e">
<rect x="580" y="150" width="540" height="64" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="600" y="176" font-size="15" fill="#291c0e">Housing — Lexan 103 polycarbonate, UV-stabilised</text>
<text x="600" y="198" font-size="12.5" fill="#6d5a3a">or glass-filled PA66-GF30 · IP67 / IP68 / IP69K per IEC 60529</text>
<rect x="580" y="228" width="540" height="64" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="600" y="254" font-size="15">Retention spring — 304 / 316L stainless</text>
<text x="600" y="276" font-size="12.5" fill="#6d5a3a">vibration-qualified IEC 60068-2-6 sine 10-2000 Hz 5 g</text>
<rect x="580" y="306" width="540" height="64" rx="8" fill="#eef2f0" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="600" y="332" font-size="15">Ferrite isolation — Ni-Zn / Mn-Zn sheet 0.3-0.5 mm</text>
<text x="600" y="354" font-size="12.5" fill="#2c5454">keeps the antenna deaf to the steel it sits on</text>
<rect x="580" y="384" width="540" height="64" rx="8" fill="#eef2f0" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="600" y="410" font-size="15">UHF antenna — 860-960 MHz global band</text>
<text x="600" y="432" font-size="12.5" fill="#2c5454">Monza R6-P / UCODE 8 class ICs · 2-4 m read on live pipework</text>
</g>
<rect x="60" y="560" width="1060" height="66" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="84" y="588" font-family="Georgia, serif" font-size="17" fill="#291c0e">The rule it obeys: ASME B31.3 para 321.3.6 restricts unauthorised attachments to pressure piping.</text>
<text x="84" y="612" font-family="Verdana, sans-serif" font-size="13.5" fill="#6d5a3a">A wedge clip is not an attachment weld, not a drilled hole, not an adhesive on hot insulation — it just holds on.</text>
</svg>
