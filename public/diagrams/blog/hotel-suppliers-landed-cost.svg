<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="lcTitle lcDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="lcTitle">Unit price is only the tip of landed cost</title>
  <desc id="lcDesc">Above the waterline, a small tip labelled unit price — the quote everyone compares. Below the waterline, the larger submerged cost: setup and tooling fees, freight, duties and import taxes, artwork revisions at 200 to 500 dollars each, and inventory carrying for 30 to 60 days of safety stock.</desc>

  <defs>
    <radialGradient id="lcBg" cx="50%" cy="18%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="lcWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8f5f8"/><stop offset="100%" stop-color="#dfeef2"/></linearGradient>
    <linearGradient id="lcDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#lcBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="62" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2" fill="#6d5a3a">UNIT PRICE IS ONLY THE TIP</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#4f4f4f">The cheapest per-card quote and the cheapest card program are rarely the same supplier</text>

  <!-- tip above water -->
  <rect x="470" y="118" width="260" height="70" rx="12" fill="#c39a5f"/>
  <text x="600" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Unit price</text>
  <text x="600" y="172" text-anchor="middle" font-size="13" fill="#3a2c18">the quote everyone compares</text>

  <!-- waterline -->
  <rect x="40" y="206" width="1120" height="352" rx="14" fill="url(#lcWater)"/>
  <path d="M40 210 q40 -12 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" fill="none" stroke="#8fc7d6" stroke-width="3"/>
  <text x="1096" y="230" text-anchor="end" font-size="12.5" font-style="italic" fill="#3d6b6b">waterline</text>

  <!-- submerged stack -->
  <g>
    <rect x="150" y="250" width="900" height="52" rx="10" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="186" cy="276" r="11" fill="#c39a5f"/>
    <text x="214" y="282" font-size="16.5" font-weight="700" fill="#291c0e">Setup &amp; tooling fees</text>
    <text x="1020" y="282" text-anchor="end" font-size="13.5" fill="#6d5a3a">per order</text>

    <rect x="150" y="312" width="900" height="52" rx="10" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="186" cy="338" r="11" fill="#3d6b6b"/>
    <text x="214" y="344" font-size="16.5" font-weight="700" fill="#291c0e">Freight — FOB factory + sea or air</text>
    <text x="1020" y="344" text-anchor="end" font-size="13.5" fill="#6d5a3a">hidden by FOB quotes</text>

    <rect x="150" y="374" width="900" height="52" rx="10" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="186" cy="400" r="11" fill="#4a5568"/>
    <text x="214" y="406" font-size="16.5" font-weight="700" fill="#291c0e">Duties &amp; import taxes</text>
    <text x="1020" y="406" text-anchor="end" font-size="13.5" fill="#6d5a3a">varies by destination</text>

    <rect x="150" y="436" width="900" height="52" rx="10" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="186" cy="462" r="11" fill="#6d5a3a"/>
    <text x="214" y="468" font-size="16.5" font-weight="700" fill="#291c0e">Artwork revisions</text>
    <text x="1020" y="468" text-anchor="end" font-size="14" font-weight="800" fill="#8b2d2d">$200–$500 each</text>

    <rect x="150" y="498" width="900" height="52" rx="10" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="186" cy="524" r="11" fill="#2d6a4f"/>
    <text x="214" y="530" font-size="16.5" font-weight="700" fill="#291c0e">Inventory carrying cost</text>
    <text x="1020" y="530" text-anchor="end" font-size="14" font-weight="800" fill="#291c0e">30–60 days safety stock</text>
  </g>

  <text x="600" y="596" text-anchor="middle" font-size="16.5" fill="#6d5a3a">FOB looks great in the meeting — and a good deal less great on the receiving dock.</text>
</svg>
