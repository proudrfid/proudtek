<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The hotel key card chip spectrum: Classic 1K, Plus EV2, DESFire EV3</title>
<desc id="d">Three hotel key card chips arranged left to right along rising security and per-card cost. MIFARE Classic 1K, the legacy volume chip: Crypto-1 48-bit, $0.08 to $0.12 per card, largest installed lock base, end of line. MIFARE Plus EV2, the migration bridge: AES-128 and Classic-compatible, $0.12 to $0.18 per card, switches to AES lock-by-lock. MIFARE DESFire EV3, the target platform: AES-128 plus EAL5+, $0.25 to $0.45 per card, multi-application and mobile wallet ready. A gradient arrow beneath runs from lower security and cost on the left to higher on the right. Verdict: match the chip to your lock estate and upgrade horizon, not to the cheapest line item.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#4a5568"/><stop offset="50%" stop-color="#c39a5f"/><stop offset="100%" stop-color="#3d6b6b"/>
</linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOTEL KEY CARD CHIPS · THE SPECTRUM</text>
<text x="600" y="92" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">One decision, three chips, years of card stock</text>

<!-- panel 1 · Classic 1K · steel -->
<rect x="70" y="128" width="330" height="346" rx="16" fill="#f4f6f9" stroke="#4a5568" stroke-width="1.6"/>
<rect x="205" y="150" width="60" height="44" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<rect x="216" y="162" width="20" height="16" rx="2" fill="#8895a7"/>
<text x="235" y="228" text-anchor="middle" font-size="21" font-weight="800" fill="#2f3846">MIFARE Classic 1K</text>
<text x="235" y="251" text-anchor="middle" font-size="13.5" fill="#5c5c5c">the legacy volume chip</text>
<line x1="110" y1="268" x2="360" y2="268" stroke="#dfe3ea" stroke-width="1.4"/>
<text x="235" y="300" text-anchor="middle" font-size="15" fill="#333333">Crypto-1 · 48-bit</text>
<text x="235" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#2f3846">$0.08–$0.12 / card</text>
<text x="235" y="360" text-anchor="middle" font-size="14" fill="#5c5c5c">largest installed lock base</text>
<rect x="163" y="404" width="144" height="34" rx="17" fill="#eef1f5" stroke="#4a5568" stroke-width="1.2"/>
<text x="235" y="426" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.6" fill="#4a5568">END OF LINE</text>

<!-- panel 2 · Plus EV2 · gold bridge -->
<rect x="435" y="128" width="330" height="346" rx="16" fill="#fbf4e6" stroke="#c39a5f" stroke-width="1.6"/>
<rect x="570" y="150" width="60" height="44" rx="6" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<rect x="581" y="162" width="20" height="16" rx="2" fill="#d4a755"/>
<text x="600" y="228" text-anchor="middle" font-size="21" font-weight="800" fill="#6d5a3a">MIFARE Plus EV2</text>
<text x="600" y="251" text-anchor="middle" font-size="13.5" fill="#8a6d34">the migration bridge</text>
<line x1="475" y1="268" x2="725" y2="268" stroke="#ecdcbe" stroke-width="1.4"/>
<text x="600" y="300" text-anchor="middle" font-size="15" fill="#333333">AES-128, Classic-compatible</text>
<text x="600" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">$0.12–$0.18 / card</text>
<text x="600" y="360" text-anchor="middle" font-size="14" fill="#5c5c5c">switch to AES lock-by-lock</text>
<rect x="528" y="404" width="144" height="34" rx="17" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.2"/>
<text x="600" y="426" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.6" fill="#8a6d34">BRIDGE</text>

<!-- panel 3 · DESFire EV3 · teal target -->
<rect x="800" y="128" width="330" height="346" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<rect x="935" y="150" width="60" height="44" rx="6" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="946" y="162" width="20" height="16" rx="2" fill="#3d6b6b"/>
<text x="965" y="228" text-anchor="middle" font-size="21" font-weight="800" fill="#2c5454">MIFARE DESFire EV3</text>
<text x="965" y="251" text-anchor="middle" font-size="13.5" fill="#4f4f4f">the target platform</text>
<line x1="840" y1="268" x2="1090" y2="268" stroke="#d3e5e5" stroke-width="1.4"/>
<text x="965" y="300" text-anchor="middle" font-size="15" fill="#333333">AES-128 + EAL5+</text>
<text x="965" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">$0.25–$0.45 / card</text>
<text x="965" y="360" text-anchor="middle" font-size="14" fill="#5c5c5c">multi-app + mobile wallet</text>
<rect x="893" y="404" width="144" height="34" rx="17" fill="#e2efef" stroke="#3d6b6b" stroke-width="1.2"/>
<text x="965" y="426" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.6" fill="#2c5454">TARGET</text>

<text x="417" y="308" text-anchor="middle" font-size="26" font-weight="800" fill="#c39a5f">›</text>
<text x="782" y="308" text-anchor="middle" font-size="26" font-weight="800" fill="#c39a5f">›</text>

<rect x="70" y="500" width="1040" height="16" rx="8" fill="url(#spectrum)"/>
<path d="M 1110 494 L 1140 508 L 1110 522 Z" fill="#3d6b6b"/>
<text x="72" y="540" font-size="13" fill="#5c5c5c">lower security · lower cost</text>
<text x="1108" y="540" text-anchor="end" font-size="13" fill="#5c5c5c">higher security · higher cost</text>

<rect x="70" y="558" width="1060" height="74" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="590" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Match the chip to your lock estate and upgrade horizon — not to the cheapest line item.</text>
<text x="600" y="615" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The wrong chip is a drawer of dead card stock after the next lock refresh.</text>
</svg>
