<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Anatomy of an NFC wet inlay</title>
  <desc id="d">An NFC wet inlay drawn as an annotated anatomy. An NFC chip is flip-chip bonded with ACF at the terminals of an etched or wound loop antenna — a multi-turn coil, not a UHF dipole — carried on a 50-75 µm PET substrate. Because it is a wet inlay, the PET is backed by a PSA adhesive coating and a release liner. The loop resonates at HF 13.56 MHz and speaks ISO/IEC 14443 Type A and the NFC Forum Type 2 and Type 4 tag platforms.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANATOMY OF AN NFC WET INLAY</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#5c5c5c">NFC chip · multi-turn loop antenna · PET film · adhesive backing</text>

  <!-- PET substrate panel -->
  <rect x="420" y="250" width="360" height="190" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>

  <!-- multi-turn loop antenna (concentric coil, NOT a dipole) -->
  <rect x="445" y="270" width="310" height="150" rx="12" fill="none" stroke="#3d6b6b" stroke-width="5"/>
  <rect x="460" y="283" width="280" height="124" rx="10" fill="none" stroke="#3d6b6b" stroke-width="5"/>
  <rect x="475" y="296" width="250" height="98" rx="8" fill="none" stroke="#3d6b6b" stroke-width="5"/>
  <rect x="490" y="309" width="220" height="72" rx="6" fill="none" stroke="#3d6b6b" stroke-width="5"/>

  <!-- NFC chip at the loop terminals (top) -->
  <rect x="578" y="256" width="44" height="30" rx="4" fill="#e9edf1" stroke="#4a5568" stroke-width="2"/>
  <rect x="590" y="263" width="20" height="16" rx="2" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>

  <!-- chip callout (top) -->
  <text x="600" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#2c5454">NFC chip</text>
  <text x="600" y="192" text-anchor="middle" font-size="13.5" fill="#5c5c5c">flip-chip bonded (ACF) at the loop terminals</text>
  <line x1="600" y1="206" x2="600" y2="254" stroke="#4a5568" stroke-width="2"/>
  <circle cx="600" cy="254" r="4" fill="#4a5568"/>

  <!-- loop antenna callout (left) -->
  <text x="396" y="316" text-anchor="end" font-size="16" font-weight="700" fill="#2c5454">Etched or wound</text>
  <text x="396" y="338" text-anchor="end" font-size="16" font-weight="700" fill="#2c5454">loop antenna</text>
  <text x="396" y="360" text-anchor="end" font-size="13" fill="#5c5c5c">multi-turn coil — not a dipole</text>
  <line x1="404" y1="345" x2="443" y2="345" stroke="#3d6b6b" stroke-width="2"/>
  <circle cx="444" cy="345" r="4" fill="#3d6b6b"/>

  <!-- adhesive backing callout (right) -->
  <text x="804" y="316" text-anchor="start" font-size="16" font-weight="700" fill="#2c5454">PSA adhesive</text>
  <text x="804" y="338" text-anchor="start" font-size="16" font-weight="700" fill="#2c5454">+ release liner</text>
  <text x="804" y="360" text-anchor="start" font-size="13" fill="#5c5c5c">the wet backing — peel and stick</text>
  <line x1="782" y1="345" x2="800" y2="345" stroke="#4a5568" stroke-width="2"/>
  <circle cx="782" cy="345" r="4" fill="#4a5568"/>

  <!-- PET callout (bottom) -->
  <line x1="600" y1="440" x2="600" y2="470" stroke="#c39a5f" stroke-width="2"/>
  <circle cx="600" cy="440" r="4" fill="#c39a5f"/>
  <text x="600" y="492" text-anchor="middle" font-size="16" font-weight="700" fill="#6d5a3a">50-75 µm PET substrate</text>
  <text x="600" y="514" text-anchor="middle" font-size="13" fill="#5c5c5c">the carrier film — a sub-component, not a label</text>

  <!-- band -->
  <rect x="300" y="556" width="600" height="76" rx="16" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="588" text-anchor="middle" font-size="16" font-weight="600" fill="#2c5454">HF 13.56 MHz · ISO/IEC 14443 Type A</text>
  <text x="600" y="613" text-anchor="middle" font-size="15" fill="#3d6b6b">NFC Forum Type 2 / Type 4 tag platform</text>
</svg>
