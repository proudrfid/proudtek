<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">White-label RFID puts your brand on a frozen hardware layer</title>
<desc id="d">A branded RFID card shown as two stacked layers. The upper brand layer — your logo, packaging and catalog ID — is the customizable part. The lower hardware layer — chip, antenna and tag SKU — is the frozen spec that never changes in a white-label program. Below runs a spectrum of four branding tiers from white-label to private label to OEM to ODM, with cost, control and lead time rising left to right.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHITE-LABEL &amp; OEM RFID</text>
<text x="600" y="100" text-anchor="middle" font-size="39" font-weight="800" font-family="Lora, Georgia, serif" fill="#291c0e">Your brand. Our silicon.</text>
<text x="600" y="130" text-anchor="middle" font-size="16" fill="#4f4f4f">White-label changes the layer you can see — never the chip and antenna underneath.</text>

<!-- brand layer card -->
<rect x="450" y="168" width="300" height="104" rx="13" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.2"/>
<circle cx="500" cy="210" r="16" fill="#f7edd6" stroke="#c39a5f" stroke-width="2.2"/>
<text x="500" y="215" text-anchor="middle" font-size="15" font-weight="800" fill="#a07d43">L</text>
<text x="536" y="205" font-size="14.5" font-weight="800" fill="#291c0e">YOUR LOGO</text>
<text x="536" y="226" font-size="12.5" fill="#3d6b6b">packaging · catalog ID</text>
<text x="600" y="258" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#2c5454">BRAND LAYER — you customize</text>

<!-- exploded connector -->
<line x1="600" y1="276" x2="600" y2="300" stroke="#cdbf9f" stroke-width="2" stroke-dasharray="4 5"/>

<!-- hardware layer card -->
<rect x="450" y="300" width="300" height="126" rx="13" fill="#f1f3f7" stroke="#4a5568" stroke-width="2.2"/>
<rect x="566" y="330" width="34" height="34" rx="4" fill="#e7c98c" stroke="#a07d43" stroke-width="2"/>
<rect x="552" y="316" width="62" height="62" rx="8" fill="none" stroke="#4a5568" stroke-width="2"/>
<rect x="540" y="304" width="86" height="86" rx="12" fill="none" stroke="#8b93a3" stroke-width="1.6"/>
<text x="600" y="404" text-anchor="middle" font-size="13.5" font-weight="800" fill="#3a4453">CHIP · ANTENNA · TAG SKU</text>
<text x="600" y="422" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#4a5568">HARDWARE LAYER — frozen spec</text>

<!-- left callout -->
<text x="150" y="205" font-size="14" font-weight="800" fill="#2c5454">You brand this</text>
<text x="150" y="226" font-size="12.5" fill="#5c5c5c">print &amp; packaging only</text>
<line x1="300" y1="212" x2="446" y2="216" stroke="#3d6b6b" stroke-width="1.8"/>
<circle cx="446" cy="216" r="3.5" fill="#3d6b6b"/>

<!-- right callout -->
<text x="1050" y="352" text-anchor="end" font-size="14" font-weight="800" fill="#4a5568">Same proven tag</text>
<text x="1050" y="373" text-anchor="end" font-size="12.5" fill="#5c5c5c">specs never change</text>
<line x1="754" y1="360" x2="900" y2="360" stroke="#4a5568" stroke-width="1.8"/>
<circle cx="754" cy="360" r="3.5" fill="#4a5568"/>

<!-- tier spectrum strip -->
<text x="120" y="486" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">FOUR TIERS · COST &amp; CONTROL RISE LEFT TO RIGHT</text>
<rect x="120" y="500" width="228" height="66" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/>
<text x="234" y="529" text-anchor="middle" font-size="15" font-weight="800" fill="#1f6f3a">White-label</text>
<text x="234" y="550" text-anchor="middle" font-size="12" fill="#33595a">logo on stock tag</text>
<rect x="360" y="500" width="228" height="66" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="474" y="529" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">Private label</text>
<text x="474" y="550" text-anchor="middle" font-size="12" fill="#4f4f4f">+ catalog &amp; EAN</text>
<rect x="600" y="500" width="228" height="66" rx="11" fill="#f1f3f7" stroke="#c7cdd8" stroke-width="1.6"/>
<text x="714" y="529" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4453">OEM</text>
<text x="714" y="550" text-anchor="middle" font-size="12" fill="#4f4f4f">custom antenna / chip</text>
<rect x="840" y="500" width="240" height="66" rx="11" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.6"/>
<text x="960" y="529" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">ODM</text>
<text x="960" y="550" text-anchor="middle" font-size="12" fill="#4f4f4f">factory designs it</text>

<text x="600" y="612" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Start white-label, graduate to private label as volume grows, reserve OEM/ODM for the SKUs that earn the tooling.</text>
</svg>
