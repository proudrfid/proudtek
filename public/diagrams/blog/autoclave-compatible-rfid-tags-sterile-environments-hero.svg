<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="acHeroTitle acHeroDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="acHeroTitle">Autoclave-compatible RFID tags: what survives 134°C steam</title>
  <desc id="acHeroDesc">A survival flow. A standard PVC or PET RFID label enters an autoclave running saturated steam at 134°C and 2 to 3 bar. A consumer-grade tag comes out curled and dead within 1 to 3 cycles, while a hardened ceramic, PEEK or titanium HF tag survives 1000 to 5000 plus cycles. Footer: HF at 13.56 MHz is preferred; encapsulation is ceramic, PEEK or titanium; per-tag cost runs 3 to 30 US dollars, always priced per validated cycle.</desc>

  <defs>
    <radialGradient id="acBg" cx="50%" cy="24%" r="86%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f1ece0"/>
    </radialGradient>
    <linearGradient id="acSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6675"/>
      <stop offset="100%" stop-color="#3c4552"/>
    </linearGradient>
    <linearGradient id="acDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#291c0e"/>
      <stop offset="100%" stop-color="#6c5127"/>
    </linearGradient>
    <marker id="acArrow" markerWidth="10" markerHeight="10" refX="2.5" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#c39a5f"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#acBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <!-- Eyebrow + tagline -->
  <text x="600" y="64" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="3" fill="#6d5a3a">AUTOCLAVE-COMPATIBLE RFID TAGS</text>
  <text x="600" y="94" text-anchor="middle" font-size="17" fill="#4f4f4f">Why a bargain sticker dies at 134°C — and what shrugs it off</text>

  <!-- ============ Stage A: standard tag ============ -->
  <g>
    <rect x="58" y="150" width="236" height="300" rx="16" fill="#fbf8f2" stroke="#e4d8bf" stroke-width="2"/>
    <text x="176" y="182" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" fill="#6d5a3a">THE INPUT</text>
    <!-- flat label -->
    <rect x="106" y="214" width="140" height="96" rx="10" fill="#ffffff" stroke="#b9a074" stroke-width="2"/>
    <rect x="120" y="230" width="60" height="40" rx="3" fill="none" stroke="#c39a5f" stroke-width="2"/>
    <path d="M126 236 v28 M134 236 v28 M142 236 v28 M150 236 v28 M158 236 v28 M166 236 v28" stroke="#c39a5f" stroke-width="2"/>
    <circle cx="212" cy="250" r="16" fill="none" stroke="#c39a5f" stroke-width="2"/>
    <circle cx="212" cy="250" r="7" fill="none" stroke="#c39a5f" stroke-width="2"/>
    <text x="176" y="298" text-anchor="middle" font-size="12.5" fill="#8a7a5f">paper / PVC / PET inlay</text>
    <text x="176" y="352" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Standard RFID tag</text>
    <text x="176" y="380" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Great for pallets.</text>
    <text x="176" y="400" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Wrong room today.</text>
  </g>

  <!-- arrow A -> B -->
  <line x1="300" y1="300" x2="352" y2="300" stroke="#c39a5f" stroke-width="3" marker-end="url(#acArrow)"/>

  <!-- ============ Stage B: the autoclave ============ -->
  <g>
    <rect x="366" y="150" width="270" height="300" rx="16" fill="url(#acSteel)" stroke="#2f3742" stroke-width="2"/>
    <text x="501" y="182" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" fill="#dfe4ea">THE AUTOCLAVE</text>
    <!-- chamber body -->
    <rect x="404" y="206" width="194" height="150" rx="14" fill="#4a5461" stroke="#2f3742" stroke-width="2"/>
    <!-- round door -->
    <circle cx="501" cy="281" r="60" fill="#3c4552" stroke="#89929e" stroke-width="4"/>
    <circle cx="501" cy="281" r="44" fill="#333b46" stroke="#5a6675" stroke-width="2"/>
    <!-- steam wisps -->
    <path d="M470 250 q10 -16 0 -30 q-10 -14 0 -28" fill="none" stroke="#cdd4dc" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M501 244 q10 -16 0 -30 q-10 -14 0 -28" fill="none" stroke="#cdd4dc" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M532 250 q10 -16 0 -30 q-10 -14 0 -28" fill="none" stroke="#cdd4dc" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <!-- door handle -->
    <rect x="556" y="271" width="26" height="20" rx="5" fill="#89929e"/>
    <!-- readout -->
    <rect x="404" y="372" width="194" height="58" rx="10" fill="#20262e" stroke="#2f3742" stroke-width="2"/>
    <text x="501" y="396" text-anchor="middle" font-size="17" font-weight="800" fill="#1fcefb">134°C · 2–3 bar</text>
    <text x="501" y="417" text-anchor="middle" font-size="13" fill="#9fb3bd">saturated steam · engineered to sterilize</text>
  </g>

  <!-- arrow B -> C -->
  <line x1="642" y1="300" x2="694" y2="300" stroke="#c39a5f" stroke-width="3" marker-end="url(#acArrow)"/>

  <!-- ============ Stage C: two outcomes ============ -->
  <!-- fail -->
  <g>
    <rect x="708" y="150" width="434" height="140" rx="16" fill="#f7ecea" stroke="#dcb6b0" stroke-width="2"/>
    <text x="740" y="182" font-size="13.5" font-weight="700" letter-spacing="1" fill="#8b2d2d">CONSUMER-GRADE</text>
    <!-- curled dead tag -->
    <path d="M744 210 q26 -10 52 4 q22 12 6 34 q-18 22 -44 8 q-28 -14 -14 -46 z" fill="#e7ccc7" stroke="#8b2d2d" stroke-width="2.5"/>
    <line x1="756" y1="220" x2="790" y2="250" stroke="#8b2d2d" stroke-width="2.5"/>
    <line x1="756" y1="250" x2="790" y2="220" stroke="#8b2d2d" stroke-width="2.5"/>
    <text x="922" y="228" font-size="21" font-weight="800" fill="#8b2d2d">FAILS in 1–3 cycles</text>
    <text x="922" y="256" font-size="14" fill="#734040">Curls, delaminates, detunes.</text>
    <text x="922" y="276" font-size="14" fill="#734040">Reads as nothing at all.</text>
  </g>
  <!-- survive -->
  <g>
    <rect x="708" y="308" width="434" height="142" rx="16" fill="#e9f1ea" stroke="#a9c8b2" stroke-width="2"/>
    <text x="740" y="340" font-size="13.5" font-weight="700" letter-spacing="1" fill="#1f6f3a">HARDENED HF TAG</text>
    <!-- intact disc -->
    <circle cx="772" cy="392" r="30" fill="#ffffff" stroke="#1f6f3a" stroke-width="3"/>
    <circle cx="772" cy="392" r="19" fill="none" stroke="#2d6a4f" stroke-width="2.5"/>
    <circle cx="772" cy="392" r="8" fill="#2d6a4f"/>
    <path d="M744 392 h-6 M800 392 h6 M772 362 v-6 M772 422 v6" stroke="#1f6f3a" stroke-width="2.5"/>
    <text x="826" y="372" font-size="21" font-weight="800" fill="#1f6f3a">SURVIVES 1000–5000+</text>
    <text x="826" y="398" font-size="14" fill="#3c5c46">Ceramic · PEEK · laser-welded</text>
    <text x="826" y="418" font-size="14" fill="#3c5c46">titanium. Built for this room.</text>
  </g>

  <!-- ============ Footer stat strip ============ -->
  <rect x="58" y="486" width="1084" height="140" rx="16" fill="url(#acDark)"/>
  <g text-anchor="middle">
    <text x="240" y="536" font-size="30" font-weight="800" fill="#ffffff">HF · 13.56 MHz</text>
    <text x="240" y="566" font-size="14.5" fill="#e7d8b8">preferred over UHF for sterile trays</text>
    <text x="600" y="536" font-size="30" font-weight="800" fill="#ffffff">Ceramic · PEEK · Ti</text>
    <text x="600" y="566" font-size="14.5" fill="#e7d8b8">hermetic encapsulation, not adhesive</text>
    <text x="960" y="536" font-size="30" font-weight="800" fill="#ffffff">$3 – $30 / tag</text>
    <text x="960" y="566" font-size="14.5" fill="#e7d8b8">always priced per validated cycle</text>
    <line x1="420" y1="516" x2="420" y2="596" stroke="#8a6f3e" stroke-width="1.5"/>
    <line x1="780" y1="516" x2="780" y2="596" stroke="#8a6f3e" stroke-width="1.5"/>
  </g>
</svg>
