<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">What each DESFire generation adds: EV1 to EV2 to EV3</title>
<desc id="d">Three stacked bands. EV1 (2006) is the AES-128 baseline with file-level access keys, EAL4+, up to 28 applications and 500k write cycles. EV2 (2016) adds transaction MAC and a proximity check for relay-attack resistance, lifting the app count to effectively unlimited at EAL5+. EV3 (2020) adds Secure Dynamic Messaging for phone tap-to-verify plus LRP hardening, and doubles write endurance to one million cycles. All three share the ISO 14443-4 air interface and are backward compatible.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="24%" r="86%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="2.5" fill="#6d5a3a">WHAT EACH DESFIRE GENERATION ADDS</text>

<!-- ================= EV1 band (baseline) ================= -->
<rect x="40" y="82" width="1120" height="170" rx="16" fill="#ffffff" stroke="#e8dcc4" stroke-width="2"/>
<path d="M56,82 h234 v170 h-234 a16 16 0 0 1 -16 -16 v-138 a16 16 0 0 1 16 -16 Z" fill="#4a5568"/>
<text x="165" y="152" text-anchor="middle" font-size="31" font-weight="800" fill="#ffffff">DESFire EV1</text>
<text x="165" y="186" text-anchor="middle" font-size="20" fill="#ffffff" opacity="0.85">2006</text>
<text x="165" y="222" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#ffffff" opacity="0.9">BASELINE</text>
<text x="1120" y="202" text-anchor="end" font-size="150" font-weight="800" fill="#4a5568" opacity="0.09">1</text>
<text x="320" y="140" font-size="29" font-weight="800" fill="#291c0e">AES-128 foundation</text>
<text x="320" y="178" font-size="18" fill="#4f4f4f">Mutual authentication &#183; file-level access keys</text>
<g font-size="16" font-weight="600">
<rect x="320" y="200" width="176" height="34" rx="17" fill="#f7f0e2" stroke="#e6dcc6" stroke-width="1.5"/><text x="408" y="223" text-anchor="middle" fill="#6d5a3a">&#8804; 28 apps</text>
<rect x="510" y="200" width="176" height="34" rx="17" fill="#f7f0e2" stroke="#e6dcc6" stroke-width="1.5"/><text x="598" y="223" text-anchor="middle" fill="#6d5a3a">500k writes</text>
<rect x="700" y="200" width="176" height="34" rx="17" fill="#f7f0e2" stroke="#e6dcc6" stroke-width="1.5"/><text x="788" y="223" text-anchor="middle" fill="#6d5a3a">EAL 4+</text>
</g>

<!-- plus connector -->
<circle cx="165" cy="257" r="16" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/>
<text x="165" y="264" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">+</text>

<!-- ================= EV2 band (integrity + anti-relay) ================= -->
<rect x="40" y="262" width="1120" height="170" rx="16" fill="#ffffff" stroke="#e8dcc4" stroke-width="2"/>
<path d="M56,262 h234 v170 h-234 a16 16 0 0 1 -16 -16 v-138 a16 16 0 0 1 16 -16 Z" fill="#3d6b6b"/>
<text x="165" y="332" text-anchor="middle" font-size="31" font-weight="800" fill="#ffffff">DESFire EV2</text>
<text x="165" y="366" text-anchor="middle" font-size="20" fill="#ffffff" opacity="0.85">2016</text>
<text x="165" y="402" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#ffffff" opacity="0.9">+ INTEGRITY</text>
<text x="1120" y="382" text-anchor="end" font-size="150" font-weight="800" fill="#3d6b6b" opacity="0.09">2</text>
<text x="320" y="320" font-size="29" font-weight="800" fill="#291c0e">+ Transaction proof &amp; anti-relay</text>
<text x="320" y="358" font-size="18" fill="#4f4f4f">Transaction MAC (CMAC) &#183; proximity check</text>
<g font-size="16" font-weight="600">
<rect x="320" y="380" width="176" height="34" rx="17" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="408" y="403" text-anchor="middle" font-weight="700" fill="#291c0e">&#8734; apps &#8593;</text>
<rect x="510" y="380" width="176" height="34" rx="17" fill="#f7f0e2" stroke="#e6dcc6" stroke-width="1.5"/><text x="598" y="403" text-anchor="middle" fill="#6d5a3a">500k writes</text>
<rect x="700" y="380" width="176" height="34" rx="17" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="788" y="403" text-anchor="middle" font-weight="700" fill="#291c0e">EAL 5+ &#8593;</text>
</g>

<!-- plus connector -->
<circle cx="165" cy="437" r="16" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/>
<text x="165" y="444" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">+</text>

<!-- ================= EV3 band (newest, highlighted) ================= -->
<rect x="40" y="442" width="1120" height="170" rx="16" fill="#fdf9f0" stroke="#dcc79a" stroke-width="2"/>
<path d="M56,442 h234 v170 h-234 a16 16 0 0 1 -16 -16 v-138 a16 16 0 0 1 16 -16 Z" fill="#6d5a3a"/>
<rect x="56" y="442" width="6" height="170" fill="#c39a5f"/>
<text x="165" y="508" text-anchor="middle" font-size="31" font-weight="800" fill="#ffffff">DESFire EV3</text>
<text x="165" y="542" text-anchor="middle" font-size="20" fill="#ffffff" opacity="0.9">2020</text>
<text x="165" y="578" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#ffffff" opacity="0.95">+ NFC VERIFY</text>
<text x="1120" y="562" text-anchor="end" font-size="150" font-weight="800" fill="#c39a5f" opacity="0.12">3</text>
<text x="320" y="500" font-size="29" font-weight="800" fill="#291c0e">+ Phone tap-to-verify</text>
<text x="320" y="538" font-size="18" fill="#4f4f4f">Secure Dynamic Messaging &#183; LRP hardening</text>
<g font-size="16" font-weight="600">
<rect x="320" y="560" width="176" height="34" rx="17" fill="#f7f0e2" stroke="#e6dcc6" stroke-width="1.5"/><text x="408" y="583" text-anchor="middle" fill="#6d5a3a">&#8734; apps</text>
<rect x="510" y="560" width="176" height="34" rx="17" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="598" y="583" text-anchor="middle" font-weight="700" fill="#291c0e">1M writes &#8593;</text>
<rect x="700" y="560" width="176" height="34" rx="17" fill="#f7f0e2" stroke="#e6dcc6" stroke-width="1.5"/><text x="788" y="583" text-anchor="middle" fill="#6d5a3a">EAL 5+</text>
</g>

<text x="600" y="642" text-anchor="middle" font-size="16.5" font-weight="600" fill="#4f4f4f">Backward-compatible on ISO 14443-4 &#8212; but &#8216;newest&#8217; and &#8216;what you need&#8217; aren&#8217;t always the same card.</text>
</svg>
