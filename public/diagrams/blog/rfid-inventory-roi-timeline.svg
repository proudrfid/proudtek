<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The honest five-phase ROI timeline for an RFID inventory program</title>
<desc id="d">Five phases left to right. Months 0-3, deploy and tag: pure cost, 60-80% of program cost. Months 3-6, accuracy ramp: 65-75% climbs to 92-96% and stockouts drop first. Months 6-12, process redesign: labour savings of 1-3 FTE per store become real. Year 2, compounding: forecast and safety-stock gains over 12-24 months. Year 3+, steady state: 3-5x ROI in apparel, 2-3x in grocery and general merchandise.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE HONEST ROI TIMELINE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">RFID inventory almost never breaks even in Q1 — plan the ramp, not the miracle.</text>

<!-- CARD 1 · 0-3 MO (cost / red) -->
<rect x="54" y="176" width="208" height="238" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="54" y="176" width="208" height="8" rx="4" fill="#8b2d2d"/>
<text x="158" y="214" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">0-3 MO</text>
<text x="158" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Deploy + tag</text>
<rect x="72" y="260" width="172" height="34" rx="17" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.4"/>
<text x="158" y="282" text-anchor="middle" font-size="13" font-weight="800" fill="#8b2d2d">60-80% of cost</text>
<text x="158" y="330" text-anchor="middle" font-size="12" fill="#5c5c5c">Pure cost: install,</text>
<text x="158" y="350" text-anchor="middle" font-size="12" fill="#5c5c5c">training, retrofit tags</text>

<!-- CARD 2 · 3-6 MO (gold) -->
<rect x="275" y="176" width="208" height="238" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="275" y="176" width="208" height="8" rx="4" fill="#c39a5f"/>
<text x="379" y="214" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#a07d43">3-6 MO</text>
<text x="379" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Accuracy ramp</text>
<rect x="293" y="260" width="172" height="34" rx="17" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="379" y="282" text-anchor="middle" font-size="13" font-weight="800" fill="#a07d43">65-75% → 92-96%</text>
<text x="379" y="330" text-anchor="middle" font-size="12" fill="#5c5c5c">Stockouts drop first —</text>
<text x="379" y="350" text-anchor="middle" font-size="12" fill="#5c5c5c">sales recover, not labour</text>

<!-- CARD 3 · 6-12 MO (teal) -->
<rect x="496" y="176" width="208" height="238" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="496" y="176" width="208" height="8" rx="4" fill="#3d6b6b"/>
<text x="600" y="214" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#2c5454">6-12 MO</text>
<text x="600" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Process redesign</text>
<rect x="514" y="260" width="172" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="600" y="282" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">1-3 FTE / store</text>
<text x="600" y="330" text-anchor="middle" font-size="12" fill="#5c5c5c">Daily RFID replaces</text>
<text x="600" y="350" text-anchor="middle" font-size="12" fill="#5c5c5c">the monthly count</text>

<!-- CARD 4 · YEAR 2 (green) -->
<rect x="717" y="176" width="208" height="238" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="717" y="176" width="208" height="8" rx="4" fill="#1f6f3a"/>
<text x="821" y="214" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">YEAR 2</text>
<text x="821" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Compounding</text>
<rect x="735" y="260" width="172" height="34" rx="17" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="821" y="282" text-anchor="middle" font-size="13" font-weight="800" fill="#1f6f3a">12-24 months</text>
<text x="821" y="330" text-anchor="middle" font-size="12" fill="#5c5c5c">Forecast + safety stock;</text>
<text x="821" y="350" text-anchor="middle" font-size="12" fill="#5c5c5c">largest financial impact</text>

<!-- CARD 5 · YEAR 3+ (green dark) -->
<rect x="938" y="176" width="208" height="238" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<rect x="938" y="176" width="208" height="8" rx="4" fill="#1b4332"/>
<text x="1042" y="214" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#1b4332">YEAR 3+</text>
<text x="1042" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Steady state</text>
<rect x="956" y="260" width="172" height="34" rx="17" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="1042" y="282" text-anchor="middle" font-size="13" font-weight="800" fill="#1b4332">3-5x apparel</text>
<text x="1042" y="330" text-anchor="middle" font-size="12" fill="#5c5c5c">2-3x grocery / GM;</text>
<text x="1042" y="350" text-anchor="middle" font-size="12" fill="#5c5c5c">below 1.5x = execution</text>

<!-- chevrons -->
<text x="268" y="300" text-anchor="middle" font-size="20" font-weight="800" fill="#cdbb95">&#8250;</text>
<text x="489" y="300" text-anchor="middle" font-size="20" font-weight="800" fill="#cdbb95">&#8250;</text>
<text x="710" y="300" text-anchor="middle" font-size="20" font-weight="800" fill="#cdbb95">&#8250;</text>
<text x="931" y="300" text-anchor="middle" font-size="20" font-weight="800" fill="#cdbb95">&#8250;</text>

<text x="600" y="470" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">The projects that promised the CFO a Q1 payback are the ones that got killed.</text>
<text x="600" y="500" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Labour savings turn real at months 6-12; the biggest money lands in Year 2.</text>
</svg>
