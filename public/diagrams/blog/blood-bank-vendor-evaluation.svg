<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five questions to ask a blood-bank RFID software vendor before shortlisting</title>
<desc id="d">A buyer scorecard of five questions. One, the 21 CFR Part 11 conformance statement — does it cover electronic signatures, audit trail, validation lifecycle and access controls? Two, AABB, FACT or EBA alignment — are features mapped to the standards you are accredited under? Three, BloodTrack, TempTrack or fridge integration — RFID at the fridge door and the bedside? Four, ISBT 128 RFID encoding to ST-021, not a proprietary scheme? Five, validation deliverables in the box — IQ, OQ and PQ pre-written, which saves 8 to 12 weeks? Two outcome cards contrast a conformance statement that covers electronic signatures (transfusion-ready, green) against one that quietly skips them (not transfusion-ready, a red flag).</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">AUDIT THE PLATFORM, NOT THE DEMO</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Five questions before you shortlist a vendor</text>

<!-- left scorecard -->
<rect x="56" y="140" width="656" height="452" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="84" y="182" font-size="17" font-weight="700" fill="#291c0e">The buyer scorecard</text>
<g>
<circle cx="100" cy="234" r="16" fill="#c39a5f"/><text x="100" y="240" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="128" y="228" font-size="14.5" font-weight="700" fill="#291c0e">Part 11 conformance statement</text>
<text x="128" y="250" font-size="13" fill="#4f4f4f">covers e-signatures, audit trail, validation, access?</text>
<circle cx="100" cy="304" r="16" fill="#c39a5f"/><text x="100" y="310" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="128" y="298" font-size="14.5" font-weight="700" fill="#291c0e">AABB / FACT / EBA alignment</text>
<text x="128" y="320" font-size="13" fill="#4f4f4f">features mapped to the standards you're accredited under?</text>
<circle cx="100" cy="374" r="16" fill="#c39a5f"/><text x="100" y="380" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="128" y="368" font-size="14.5" font-weight="700" fill="#291c0e">BloodTrack / TempTrack / fridge integration</text>
<text x="128" y="390" font-size="13" fill="#4f4f4f">RFID at the fridge door and at the bedside?</text>
<circle cx="100" cy="444" r="16" fill="#c39a5f"/><text x="100" y="450" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="128" y="438" font-size="14.5" font-weight="700" fill="#291c0e">ISBT 128 RFID encoding to ST-021</text>
<text x="128" y="460" font-size="13" fill="#4f4f4f">an open standard, not a proprietary scheme?</text>
<circle cx="100" cy="514" r="16" fill="#c39a5f"/><text x="100" y="520" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
<text x="128" y="508" font-size="14.5" font-weight="700" fill="#291c0e">Validation deliverables in the box</text>
<text x="128" y="530" font-size="13" fill="#4f4f4f">IQ / OQ / PQ pre-written — saves 8-12 weeks?</text>
</g>

<!-- right outcome cards -->
<rect x="740" y="176" width="410" height="180" rx="16" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<circle cx="778" cy="216" r="18" fill="#1f6f3a"/><path d="M 770 216 l 6 7 10 -13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="808" y="222" font-size="17" font-weight="700" fill="#1b4332">Transfusion-ready</text>
<text x="774" y="270" font-size="13.5" fill="#291c0e">The conformance statement covers electronic</text>
<text x="774" y="292" font-size="13.5" fill="#291c0e">signatures, audit trail, validation lifecycle</text>
<text x="774" y="314" font-size="13.5" fill="#291c0e">and access controls.</text>

<rect x="740" y="376" width="410" height="180" rx="16" fill="#f6e9e6" stroke="#8b2d2d" stroke-width="1.5"/>
<circle cx="778" cy="416" r="18" fill="#8b2d2d"/><path d="M 771 409 l 14 14 M 785 409 l -14 14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<text x="808" y="422" font-size="17" font-weight="700" fill="#8b2d2d">Not transfusion-ready</text>
<text x="774" y="470" font-size="13.5" fill="#291c0e">A statement that quietly skips electronic</text>
<text x="774" y="492" font-size="13.5" fill="#291c0e">signatures is a red flag — most likely not</text>
<text x="774" y="514" font-size="13.5" fill="#291c0e">built for transfusion service.</text>
</svg>
