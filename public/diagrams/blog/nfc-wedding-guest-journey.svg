<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Seven NFC touchpoints across the wedding guest journey</title>
<desc id="d">A left-to-right timeline of one guest's day with seven NFC touchpoints in order. One, a smart seating chart at the welcome easel. Two, a thank-you-video favor opened at home. Three, a digital guestbook sign for a message and voice note. Four, a personalized place card with a note per guest. Five, photo-upload signage that fills a shared album by morning. Six, a photo-booth instant share to the guest's phone. Seven, an after-wedding thank-you card linking to a highlight reel. All repeatable with NTAG213 stickers and free programming software.</desc>
