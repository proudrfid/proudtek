<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Tag survival by wash cycle — PPS versus the legacy textile-laminated tag</title>
  <desc id="d">Tag survival compared by wash cycle. The legacy textile-laminated tag reached only 91% survival at 120 cycles, where it failed. The PPS-housed UCODE 8 tag held 99.4% survival at 250 cycles and 97.1% at 350 cycles. A note records a 2.1-year payback on the tag-cost increase alone, before counting sort-line labour savings.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SURVIVAL BY WASH CYCLE — PPS vs LEGACY TEXTILE</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Bar length is cycles survived; the label is the measured survival rate at that point</text>

  <!-- textile row (failed) -->
  <text x="60" y="182" font-size="14.5" font-weight="700" fill="#291c0e">Textile laminate</text>
  <text x="60" y="202" font-size="12.5" fill="#8b2d2d">failed at 120 cycles</text>
  <rect x="300" y="164" width="254" height="52" rx="6" fill="#f7e7e2" stroke="#c98a86" stroke-width="2"/>
  <text x="322" y="196" font-size="15" font-weight="700" fill="#8b2d2d">120 cycles · 91%</text>

  <!-- PPS 250 -->
  <text x="60" y="288" font-size="14.5" font-weight="700" fill="#291c0e">PPS · UCODE 8</text>
  <text x="60" y="308" font-size="12.5" fill="#5c5c5c">rated checkpoint</text>
  <rect x="300" y="270" width="529" height="52" rx="6" fill="#3d6b6b"/>
  <text x="322" y="302" font-size="15" font-weight="700" fill="#ffffff">250 cycles · 99.4%</text>

  <!-- PPS 350 -->
  <text x="60" y="394" font-size="14.5" font-weight="700" fill="#291c0e">PPS · UCODE 8</text>
  <text x="60" y="414" font-size="12.5" fill="#5c5c5c">extended run</text>
  <rect x="300" y="376" width="740" height="52" rx="6" fill="#2c5454"/>
  <text x="322" y="408" font-size="15" font-weight="700" fill="#ffffff">350 cycles · 97.1%</text>

  <!-- axis hint -->
  <line x1="300" y1="446" x2="1040" y2="446" stroke="#e6dfd2" stroke-width="2"/>
  <text x="300" y="466" font-size="12" fill="#9aa4b2">0</text>
  <text x="554" y="466" text-anchor="middle" font-size="12" fill="#9aa4b2">120</text>
  <text x="829" y="466" text-anchor="middle" font-size="12" fill="#9aa4b2">250</text>
  <text x="1040" y="466" text-anchor="end" font-size="12" fill="#9aa4b2">350 cycles</text>

  <rect x="60" y="504" width="1080" height="96" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="82" y="534" font-size="15" font-weight="700" fill="#2c5454">Roughly 4× the survival rate at about 4× the legacy tag's unit cost</text>
  <text x="82" y="558" font-size="13.5" fill="#3d6b6b">The customer modelled total cost of ownership over five years and reported a 2.1-year payback on the tag-cost</text>
  <text x="82" y="578" font-size="13.5" fill="#3d6b6b">increase alone — before counting the sort-line labour savings (manual sortation down 54%).</text>
</svg>
