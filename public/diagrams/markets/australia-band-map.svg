<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">UHF RFID band map — Australia 920-926 MHz versus the US and EU bands</title>
  <desc id="d">A frequency map of the UHF RFID bands: the United States uses 902-928 MHz under FCC Part 15, the European Union uses 865-868 MHz, and Australia uses 920-926 MHz under the ACMA LIPD class licence at up to 4 W EIRP. Australia's 920-926 MHz sits inside the upper part of the US band but does not overlap the EU 865-868 MHz band, so EU-tuned inlays underperform in Australia and inlays must be specified for 920-926 MHz on the purchase order.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">GET THE BAND RIGHT — AUSTRALIA IS 920-926 MHz</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Inlay antennas are tuned per band — EU 865-868 stock reads short on an Australian portal</text>

  <!-- axis 860 .. 930 MHz mapped to x 120..1080 (70 MHz over 960px => 13.71 px/MHz) -->
  <line x1="120" y1="470" x2="1080" y2="470" stroke="#c3ccd6" stroke-width="2"/>
  <text x="188" y="496" font-size="12" fill="#9aa4b2">◀ lower band (EU)</text>
  <text x="1052" y="496" text-anchor="end" font-size="12" fill="#9aa4b2">upper band (US / Australia) ▶</text>

  <!-- EU 865-868 => x 188..229 -->
  <rect x="188" y="150" width="41" height="52" rx="5" fill="#eef2f5" stroke="#9fb8c2" stroke-width="2"/>
  <text x="140" y="181" font-size="15" font-weight="700" fill="#4a5568">EU</text>
  <text x="234" y="176" font-size="13" fill="#5c5c5c">865-868 MHz</text>
  <text x="234" y="194" font-size="12" fill="#9aa4b2">ETSI EN 302 208</text>

  <!-- US 902-928 => x 696..1052 -->
  <rect x="696" y="224" width="356" height="52" rx="5" fill="#eef2f5" stroke="#9fb8c2" stroke-width="2"/>
  <text x="140" y="255" font-size="15" font-weight="700" fill="#4a5568">US</text>
  <text x="716" y="255" font-size="13" fill="#291c0e">902-928 MHz (United States)</text>

  <!-- Australia 920-926 => x 943..1025 -->
  <rect x="943" y="298" width="82" height="60" rx="5" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
  <text x="140" y="335" font-size="15" font-weight="800" fill="#2c5454">AUSTRALIA</text>
  <text x="120" y="410" font-size="14" font-weight="700" fill="#2c5454">Australia · 920-926 MHz · ACMA LIPD class licence · up to 4 W EIRP</text>
  <line x1="984" y1="358" x2="984" y2="392" stroke="#2c5454" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- overlap guide -->
  <line x1="943" y1="276" x2="943" y2="298" stroke="#b9c0cc" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="1025" y1="276" x2="1025" y2="298" stroke="#b9c0cc" stroke-width="1.5" stroke-dasharray="3 3"/>

  <rect x="120" y="530" width="960" height="88" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="142" y="558" font-size="14.5" font-weight="700" fill="#2c5454">Australia sits in the upper US band — and nowhere near the EU band</text>
  <text x="142" y="580" font-size="13" fill="#3d6b6b">920-926 MHz overlaps the top of the US 902-928 MHz allocation, so US-style inlays are close; EU 865-868 MHz inlays are not.</text>
  <text x="142" y="600" font-size="13" fill="#5c5c5c">Specify 920-926 MHz tuning on the PO. Access-control cards at 13.56 MHz (HF) are global and unaffected.</text>
</svg>
