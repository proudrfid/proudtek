<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hotel card proof-review checklist</title>
<desc id="d">Eight proof-review checks, reviewed under D50 5000K lighting with a named reviewer per item. One, colour against Pantone under D50, not office fluorescents. Two, copy: legal text, loyalty terms, trademark marks and non-English diacritics. Three, numbering: the printed serial matches the encoded serial and the re-issue flow is tested. Four, compatibility: try the card on the real lock across every firmware generation. Five, handling: 48 hours in a staff pocket with coins and a phone. Six, encoder feed at 50-plus encodes per hour, where thick wood jams older units. Seven, regulatory marks such as FSC, GRS, OK Compost and REACH with verifiable numbers. Eight, the tap indicator points to the actual chip.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PROOF REVIEW — WHAT TO CHECK</text>
<text x="600" y="78" text-anchor="middle" font-size="16" fill="#4f4f4f">Colour and copy aren't enough — check operations and compliance too.</text>

<rect x="64" y="98" width="1072" height="44" rx="10" fill="#eef5f5" stroke="#cfe3dd" stroke-width="1.8"/>
<text x="600" y="126" text-anchor="middle" font-size="14.5" font-weight="800" fill="#234a4a">Review under D50 (5,000K) lighting — a named reviewer per item, not "the team".</text>

<!-- L1 -->
<rect x="64" y="160" width="536" height="74" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<circle cx="100" cy="197" r="16" fill="#3d6b6b"/><text x="100" y="202" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="128" y="191" font-size="15" font-weight="800" fill="#291c0e">Colour</text>
<text x="128" y="213" font-size="12.5" fill="#5c5c5c">Against Pantone under D50 — not office fluorescents</text>
<!-- L2 -->
<rect x="64" y="246" width="536" height="74" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<circle cx="100" cy="283" r="16" fill="#3d6b6b"/><text x="100" y="288" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="128" y="277" font-size="15" font-weight="800" fill="#291c0e">Copy</text>
<text x="128" y="299" font-size="12.5" fill="#5c5c5c">Legal text, loyalty terms, ®/™, non-English diacritics</text>
<!-- L3 -->
<rect x="64" y="332" width="536" height="74" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<circle cx="100" cy="369" r="16" fill="#3d6b6b"/><text x="100" y="374" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
<text x="128" y="363" font-size="15" font-weight="800" fill="#291c0e">Numbering</text>
<text x="128" y="385" font-size="12.5" fill="#5c5c5c">Printed serial matches encoded; test the re-issue flow</text>
<!-- L4 -->
<rect x="64" y="418" width="536" height="74" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<circle cx="100" cy="455" r="16" fill="#3d6b6b"/><text x="100" y="460" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
<text x="128" y="449" font-size="15" font-weight="800" fill="#291c0e">Compatibility</text>
<text x="128" y="471" font-size="12.5" fill="#5c5c5c">Try the real lock — every firmware generation in the estate</text>

<!-- R1 -->
<rect x="600" y="160" width="536" height="74" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<circle cx="636" cy="197" r="16" fill="#4a5568"/><text x="636" y="202" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">5</text>
<text x="664" y="191" font-size="15" font-weight="800" fill="#291c0e">Handling</text>
<text x="664" y="213" font-size="12.5" fill="#5c5c5c">48 h in a staff pocket with coins and a phone</text>
<!-- R2 -->
<rect x="600" y="246" width="536" height="74" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<circle cx="636" cy="283" r="16" fill="#4a5568"/><text x="636" y="288" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">6</text>
<text x="664" y="277" font-size="15" font-weight="800" fill="#291c0e">Encoder feed</text>
<text x="664" y="299" font-size="12.5" fill="#5c5c5c">50+ encodes/hr; thick wood jams older units</text>
<!-- R3 -->
<rect x="600" y="332" width="536" height="74" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<circle cx="636" cy="369" r="16" fill="#2d6a4f"/><text x="636" y="374" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">7</text>
<text x="664" y="363" font-size="15" font-weight="800" fill="#291c0e">Regulatory marks</text>
<text x="664" y="385" font-size="12.5" fill="#5c5c5c">FSC / GRS / OK Compost / REACH — verifiable numbers</text>
<!-- R4 -->
<rect x="600" y="418" width="536" height="74" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<circle cx="636" cy="455" r="16" fill="#3d6b6b"/><text x="636" y="460" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">8</text>
<text x="664" y="449" font-size="15" font-weight="800" fill="#291c0e">Tap indicator</text>
<text x="664" y="471" font-size="12.5" fill="#5c5c5c">Points to the actual chip, not a convenient spot</text>

<text x="600" y="536" text-anchor="middle" font-size="14" fill="#4f4f4f">Skip a step here and the miss surfaces at pilot instead — where rework costs 10–20× more.</text>
</svg>
