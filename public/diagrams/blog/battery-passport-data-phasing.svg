<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="phasingt phasingd" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="phasingt">Battery passport data phasing: 2027 vs later</title>
  <desc id="phasingd">Which battery-passport data fields are due when. Mandatory and public at the 18 February 2027 go-live, under Annex XIII first wave: unique battery identifier, type and model, manufacturer identity, category, place of manufacture, weight, expected lifetime, chemistry with hazard flags, and carbon footprint per kWh. Mandatory but restricted at 2027: detailed material composition and supply-chain due-diligence data, visible to authorities and to repair, refurbishment and recycling operators with commercial-confidentiality safeguards. Anticipated in later delegated acts: real-time state-of-health and state-of-charge, full cycle history, refurbishment events, second-life certification, and updated carbon footprint after major repairs.</desc>
  <defs><radialGradient id="phasingbg" cx="50%" cy="16%" r="95%"><stop offset="0%" stop-color="#f8f0df"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#phasingbg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="24" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="57" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="1.3" fill="#6d5a3a">What's due in 2027 vs signposted for later</text>
  <rect x="75" y="140" width="340" height="392" rx="18" fill="#f0f6f2" stroke="#2d6a4f" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M75 158 a18 18 0 0 1 18 -18 h304 a18 18 0 0 1 18 18 v34 h-340 z" fill="#2d6a4f"/>
  <circle cx="107" cy="169" r="15" fill="#ffffff" fill-opacity="0.18"/>
  <path d="M98 170 L105 177 L118 160" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="131.0" y="175.0" font-size="15.5" font-weight="800" fill="#ffffff">Mandatory 2027 · Public</text>
  <rect x="101" y="223" width="9" height="9" rx="2" fill="#2d6a4f"/>
  <text x="121.0" y="232.0" font-size="15.5" font-weight="500" fill="#291c0e">Unique battery ID</text>
  <rect x="101" y="253" width="9" height="9" rx="2" fill="#2d6a4f"/>
  <text x="121.0" y="262.0" font-size="15.5" font-weight="500" fill="#291c0e">Type and model</text>
  <rect x="101" y="283" width="9" height="9" rx="2" fill="#2d6a4f"/>
  <text x="121.0" y="292.0" font-size="15.5" font-weight="500" fill="#291c0e">Manufacturer identity</text>
  <rect x="101" y="313" width="9" height="9" rx="2" fill="#2d6a4f"/>
  <text x="121.0" y="322.0" font-size="15.5" font-weight="500" fill="#291c0e">Category, place, weight</text>
  <rect x="101" y="343" width="9" height="9" rx="2" fill="#2d6a4f"/>
  <text x="121.0" y="352.0" font-size="15.5" font-weight="500" fill="#291c0e">Expected lifetime</text>
  <rect x="101" y="373" width="9" height="9" rx="2" fill="#2d6a4f"/>
  <text x="121.0" y="382.0" font-size="15.5" font-weight="500" fill="#291c0e">Chemistry + hazard flags</text>
  <rect x="101" y="403" width="9" height="9" rx="2" fill="#2d6a4f"/>
  <text x="121.0" y="412.0" font-size="15.5" font-weight="500" fill="#291c0e">Carbon footprint / kWh</text>
  <text x="399" y="516" text-anchor="end" font-size="12.5" font-weight="700" fill="#2d6a4f">2027</text>
  <rect x="430" y="140" width="340" height="392" rx="18" fill="#f1f3f6" stroke="#4a5568" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M430 158 a18 18 0 0 1 18 -18 h304 a18 18 0 0 1 18 18 v34 h-340 z" fill="#4a5568"/>
  <circle cx="462" cy="169" r="15" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="451" y="168" width="22" height="15" rx="3" fill="none" stroke="#fff" stroke-width="2.8"/><path d="M456 168 L456 162 A6 6 0 0 1 468 162 L468 168" fill="none" stroke="#fff" stroke-width="2.8"/>
  <text x="486.0" y="175.0" font-size="15.5" font-weight="800" fill="#ffffff">Mandatory 2027 · Restricted</text>
  <rect x="456" y="223" width="9" height="9" rx="2" fill="#4a5568"/>
  <text x="476.0" y="232.0" font-size="15.5" font-weight="500" fill="#291c0e">Detailed material comp.</text>
  <rect x="456" y="253" width="9" height="9" rx="2" fill="#4a5568"/>
  <text x="476.0" y="262.0" font-size="15.5" font-weight="500" fill="#291c0e">Supply-chain due-diligence</text>
  <rect x="456" y="283" width="9" height="9" rx="2" fill="#4a5568"/>
  <text x="476.0" y="292.0" font-size="15.5" font-weight="500" fill="#291c0e">Seen by authorities plus</text>
  <rect x="456" y="313" width="9" height="9" rx="2" fill="#4a5568"/>
  <text x="476.0" y="322.0" font-size="15.5" font-weight="500" fill="#291c0e">repair / refurb / recycle</text>
  <rect x="456" y="343" width="9" height="9" rx="2" fill="#4a5568"/>
  <text x="476.0" y="352.0" font-size="15.5" font-weight="500" fill="#291c0e">Commercial-confidentiality</text>
  <rect x="456" y="373" width="9" height="9" rx="2" fill="#4a5568"/>
  <text x="476.0" y="382.0" font-size="15.5" font-weight="500" fill="#291c0e">safeguards on IP content</text>
  <text x="754" y="516" text-anchor="end" font-size="12.5" font-weight="700" fill="#4a5568">2027</text>
  <rect x="785" y="140" width="340" height="392" rx="18" fill="#eef5f5" stroke="#3d6b6b" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M785 158 a18 18 0 0 1 18 -18 h304 a18 18 0 0 1 18 18 v34 h-340 z" fill="#3d6b6b"/>
  <circle cx="817" cy="169" r="15" fill="#ffffff" fill-opacity="0.18"/>
  <circle cx="817" cy="169" r="13" fill="none" stroke="#fff" stroke-width="2.8"/><line x1="817" y1="169" x2="817" y2="161" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/><line x1="817" y1="169" x2="823" y2="172" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
  <text x="841.0" y="175.0" font-size="15.5" font-weight="800" fill="#ffffff">Later delegated acts</text>
  <rect x="811" y="223" width="9" height="9" rx="2" fill="none" stroke="#3d6b6b" stroke-width="2"/>
  <text x="831.0" y="232.0" font-size="15.5" font-weight="500" fill="#291c0e">Real-time SoH / SoC</text>
  <rect x="811" y="253" width="9" height="9" rx="2" fill="none" stroke="#3d6b6b" stroke-width="2"/>
  <text x="831.0" y="262.0" font-size="15.5" font-weight="500" fill="#291c0e">Full cycle history</text>
  <rect x="811" y="283" width="9" height="9" rx="2" fill="none" stroke="#3d6b6b" stroke-width="2"/>
  <text x="831.0" y="292.0" font-size="15.5" font-weight="500" fill="#291c0e">Refurbishment events</text>
  <rect x="811" y="313" width="9" height="9" rx="2" fill="none" stroke="#3d6b6b" stroke-width="2"/>
  <text x="831.0" y="322.0" font-size="15.5" font-weight="500" fill="#291c0e">Second-life certification</text>
  <rect x="811" y="343" width="9" height="9" rx="2" fill="none" stroke="#3d6b6b" stroke-width="2"/>
  <text x="831.0" y="352.0" font-size="15.5" font-weight="500" fill="#291c0e">Updated CF after repairs</text>
  <text x="1109" y="516" text-anchor="end" font-size="12.5" font-weight="700" fill="#3d6b6b">post-2027</text>
  <text x="600.0" y="576.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#6d5a3a">Ship the 2027 set first. Architect the tag and backend so ‘later’ never means a new substrate.</text>
  <text x="600.0" y="600.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">Build role-based access control from day one — retrofitting it was the priciest pattern in the 2025-2026 pilots.</text>
</svg>
