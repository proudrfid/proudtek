<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Six DESFire EV3 features that hotels rarely exploit</title>
<desc id="d">Around a central DESFire EV3 chip sit six under-used features. SUN message: a one-time code on every tap for a provable door-open audit trail. Transaction timer: cuts off delayed taps, defeating relay attacks. Proximity check: the card confirms it is in range, blocking long-range relay. Longer read range: 30 to 40 percent further than EV1, with fewer card-not-detected taps. EAL5+ certified: Common Criteria at banking-card and ePassport tier. Side-channel hardening: resists differential power analysis and timing attacks. None cost extra on the chip — only the specification.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DESFIRE EV3 · FEATURES HOTELS UNDER-USE</text>
<text x="600" y="78" text-anchor="middle" font-size="15" fill="#4f4f4f">Most comparisons stop at AES-128 — these are the RFP differentiators.</text>

