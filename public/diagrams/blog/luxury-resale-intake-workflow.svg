<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The resale platform NFC intake workflow, in four steps</title>
<desc id="d">A four-step flow. Step 1, intake: the item arrives. Step 2, NFC tap: a staffer taps the chip, 5-15 seconds. Step 3, brand API: the verification endpoint returns pass or fail plus chain-of-custody history. Step 4, verified listing: the item earns a badge. A result strip underneath reads: verified listings sell 20-40 percent faster and command a 5-15 percent premium.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE TAP, FOUR STEPS, ONE BADGE</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">The intake lane, rebuilt around a five-second tap</text>

<!-- connectors -->
<line x1="276" y1="258" x2="340" y2="258" stroke="#c39a5f" stroke-width="3.5" stroke-linecap="round"/>
<path d="M 356 258 l -16 -9 v 18 Z" fill="#c39a5f"/>
<line x1="564" y1="258" x2="628" y2="258" stroke="#c39a5f" stroke-width="3.5" stroke-linecap="round"/>
<path d="M 644 258 l -16 -9 v 18 Z" fill="#c39a5f"/>
<line x1="852" y1="258" x2="916" y2="258" stroke="#c39a5f" stroke-width="3.5" stroke-linecap="round"/>
<path d="M 932 258 l -16 -9 v 18 Z" fill="#c39a5f"/>

<!-- node 1: intake -->
<rect x="68" y="158" width="200" height="200" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
<circle cx="94" cy="184" r="14" fill="#c39a5f"/>
<text x="94" y="189" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
<path d="M 151 227 L 185 227 L 189 255 L 147 255 Z" fill="none" stroke="#6d5a3a" stroke-width="3" stroke-linejoin="round"/>
<path d="M 160 227 C 160 211 176 211 176 227" fill="none" stroke="#6d5a3a" stroke-width="3"/>
<text x="168" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Intake</text>
<text x="168" y="386" text-anchor="middle" font-size="13.5" fill="#5c5c5c">item arrives</text>

<!-- node 2: nfc tap -->
<rect x="356" y="158" width="200" height="200" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
<circle cx="382" cy="184" r="14" fill="#c39a5f"/>
<text x="382" y="189" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
<rect x="427" y="210" width="46" height="64" rx="8" fill="#291c0e"/>
<path d="M 450 224 l 12 5 v 12 q 0 10 -12 15 q -12 -5 -12 -15 v -12 Z" fill="#d4a755"/>
<path d="M 481 226 A 12 12 0 0 1 481 258" fill="none" stroke="#3d6b6b" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 490 218 A 23 23 0 0 1 490 266" fill="none" stroke="#8fb0b0" stroke-width="2.2" stroke-linecap="round"/>
<text x="456" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">NFC tap</text>
<text x="456" y="386" text-anchor="middle" font-size="13.5" fill="#5c5c5c">5–15 seconds</text>

<!-- node 3: brand api -->
<rect x="644" y="158" width="200" height="200" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
<circle cx="670" cy="184" r="14" fill="#c39a5f"/>
<text x="670" y="189" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
<path d="M 726 260 q -18 0 -18 -16 q 0 -14 14 -15 q 4 -18 24 -18 q 17 0 21 16 q 15 0 15 15 q 0 18 -18 18 Z" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.6" stroke-linejoin="round"/>
<path d="M 733 243 l 8 9 16 -18" fill="none" stroke="#1f6f3a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="744" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Brand API</text>
<text x="744" y="386" text-anchor="middle" font-size="13.5" fill="#5c5c5c">pass / fail + history</text>

<!-- node 4: verified listing -->
<rect x="932" y="158" width="200" height="200" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
<circle cx="958" cy="184" r="14" fill="#c39a5f"/>
<text x="958" y="189" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
<path d="M 1000 218 L 1044 218 L 1068 244 L 1044 270 L 1000 270 Z" fill="#c39a5f"/>
<circle cx="1013" cy="244" r="5" fill="#ffffff"/>
<path d="M 1032 242 l 8 8 14 -16" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1032" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Verified listing</text>
<text x="1032" y="386" text-anchor="middle" font-size="13.5" fill="#5c5c5c">badge for the buyer</text>

<!-- result strip -->
<rect x="230" y="448" width="740" height="54" rx="27" fill="#291c0e"/>
<text x="600" y="482" text-anchor="middle" font-size="17" font-weight="600" fill="#e4c98f">Verified listings sell 20–40% faster and command a 5–15% premium</text>
<text x="600" y="556" text-anchor="middle" font-size="14" fill="#5c5c5c">The choreography varies by platform; the backend gospel — tap, API, badge — is identical.</text>
</svg>
