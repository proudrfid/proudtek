<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Sort-line RFID portal geometry for the industrial-laundry deployment</title>
  <desc id="d">The sort-line portal: an Impinj R700 fixed reader driving four Times-7 A6034 circular-polarised antennas arranged in a square around the conveyor at 1.5 m antenna height. Garments move through at a 12-per-second belt speed and are read on multiple antennas during a 2-second portal pass, so a momentary null on one antenna is recovered by another — producing a 99.7% portal read rate measured at the largest site.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW THE 99.7% SORT-LINE READ RATE IS BUILT</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Four antennas in a square — a momentary null on one is recovered by another</text>

  <!-- portal square -->
  <rect x="360" y="150" width="480" height="300" rx="10" fill="none" stroke="#c3ccd6" stroke-width="3"/>
  <!-- 4 antennas at corners -->
  <rect x="330" y="150" width="60" height="60" rx="8" fill="#3d6b6b"/>
  <rect x="810" y="150" width="60" height="60" rx="8" fill="#3d6b6b"/>
  <rect x="330" y="390" width="60" height="60" rx="8" fill="#3d6b6b"/>
  <rect x="810" y="390" width="60" height="60" rx="8" fill="#3d6b6b"/>
  <text x="360" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">A1</text>
  <text x="840" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">A2</text>
  <text x="360" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">A3</text>
  <text x="840" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">A4</text>

  <!-- conveyor -->
  <rect x="180" y="286" width="840" height="28" rx="4" fill="#dfe4ea" stroke="#9aa4b2" stroke-width="1.5"/>
  <!-- garment with tag -->
  <rect x="560" y="262" width="80" height="76" rx="8" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <rect x="590" y="292" width="20" height="16" rx="3" fill="#4a5568"/>
  <text x="600" y="356" text-anchor="middle" font-size="12.5" fill="#5c5c5c">PPS tag on the label side</text>
  <!-- read pulses -->
  <line x1="392" y1="200" x2="558" y2="288" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="808" y1="200" x2="642" y2="288" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="392" y1="440" x2="558" y2="312" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="808" y1="440" x2="642" y2="312" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- reader -->
  <rect x="500" y="486" width="200" height="52" rx="8" fill="#4a5568"/>
  <text x="600" y="518" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Impinj R700 reader</text>
  <line x1="360" y1="450" x2="520" y2="486" stroke="#b9c0cc" stroke-width="1.5"/>
  <line x1="840" y1="450" x2="680" y2="486" stroke="#b9c0cc" stroke-width="1.5"/>

  <!-- callouts -->
  <text x="96" y="176" font-size="14" font-weight="800" letter-spacing="0.3" fill="#3d6b6b">4 × TIMES-7 A6034</text>
  <text x="96" y="196" font-size="13" fill="#5c5c5c">circular-polarised, square</text>
  <text x="96" y="214" font-size="13" fill="#5c5c5c">geometry, 1.5 m height</text>

  <text x="1104" y="176" text-anchor="end" font-size="14" font-weight="800" letter-spacing="0.3" fill="#3d6b6b">12 GARMENTS / SEC</text>
  <text x="1104" y="196" text-anchor="end" font-size="13" fill="#5c5c5c">read on multiple antennas</text>
  <text x="1104" y="214" text-anchor="end" font-size="13" fill="#5c5c5c">during a 2-second pass</text>

  <rect x="180" y="566" width="840" height="52" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="590" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">99.7% portal read rate</text>
  <text x="600" y="609" text-anchor="middle" font-size="12.5" fill="#3d6b6b">measured at the largest site — workwear pool, 480,000 garments / year throughput</text>
</svg>
