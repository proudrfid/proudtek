<text x="232" y="456" text-anchor="middle" font-size="13" fill="#4f4f4f">videos, pairings, loyalty club</text>

<rect x="796" y="140" width="340" height="350" rx="16" fill="#ecf4ef" stroke="#cfe0d6" stroke-width="1.5"/>
