<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Three-year cost: paper reprints versus one metal NFC order</title>
<desc id="d">A three-year timeline comparing two tracks. The paper or PVC track reprints a 200-card order at 40 to 80 dollars on every title change, office move or rebrand across years one, two and three. The metal NFC track is a single order at 700 to 1,200 dollars in year one, after which updates cost nothing because only the profile URL changes. Below, metal captures 30 contacts a year against 5 for paper, so the cost per captured contact is lower with metal.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THREE-YEAR TOTAL COST</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Higher sticker price, lower cost per contact you actually keep.</text>

<!-- year guides -->
<text x="380" y="140" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#a07d43">YEAR 1</text>
<text x="640" y="140" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#a07d43">YEAR 2</text>
<text x="900" y="140" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#a07d43">YEAR 3</text>
<line x1="380" y1="152" x2="380" y2="446" stroke="#efe7d6" stroke-width="2"/>
<line x1="640" y1="152" x2="640" y2="446" stroke="#efe7d6" stroke-width="2"/>
<line x1="900" y1="152" x2="900" y2="446" stroke="#efe7d6" stroke-width="2"/>

<!-- PAPER track -->
<text x="96" y="228" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a5568">PAPER / PVC</text>
<text x="96" y="248" font-size="12" fill="#8a8a8a">reprint each change</text>
<line x1="210" y1="236" x2="1130" y2="236" stroke="#d9d2c4" stroke-width="2"/>
<rect x="363" y="216" width="34" height="42" rx="4" fill="#f3f1ec" stroke="#b9b2a4" stroke-width="1.6"/>
<rect x="623" y="216" width="34" height="42" rx="4" fill="#f3f1ec" stroke="#b9b2a4" stroke-width="1.6"/>
<rect x="883" y="216" width="34" height="42" rx="4" fill="#f3f1ec" stroke="#b9b2a4" stroke-width="1.6"/>
<text x="380" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#4a5568">$40-$80</text>
<text x="640" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#4a5568">$40-$80</text>
<text x="900" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#4a5568">$40-$80</text>
<text x="380" y="312" text-anchor="middle" font-size="12" fill="#8a8a8a">title change</text>
<text x="640" y="312" text-anchor="middle" font-size="12" fill="#8a8a8a">office move</text>
<text x="900" y="312" text-anchor="middle" font-size="12" fill="#8a8a8a">rebrand</text>

<!-- METAL track -->
<text x="96" y="380" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">METAL NFC</text>
<text x="96" y="400" font-size="12" fill="#6a8a8a">one order, then $0</text>
<line x1="210" y1="388" x2="1130" y2="388" stroke="#a9cfb5" stroke-width="2"/>
<circle cx="380" cy="388" r="22" fill="#eef7f0" stroke="#1f6f3a" stroke-width="2.4"/>
<text x="380" y="393" text-anchor="middle" font-size="13" font-weight="800" fill="#1f6f3a">$$$</text>
<text x="380" y="438" text-anchor="middle" font-size="15" font-weight="800" fill="#1f6f3a">$700-$1,200 once</text>
<rect x="586" y="373" width="108" height="30" rx="15" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="640" y="393" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">$0 · URL</text>
<rect x="846" y="373" width="108" height="30" rx="15" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="900" y="393" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">$0 · URL</text>

<!-- capture chips -->
<rect x="210" y="480" width="440" height="70" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="250" y="527" font-size="34" font-weight="800" fill="#1f6f3a">30</text>
<text x="312" y="514" font-size="14.5" font-weight="700" fill="#291c0e">contacts a year</text>
<text x="312" y="535" font-size="12.5" fill="#5c5c5c">captured with a metal card</text>
<rect x="690" y="480" width="440" height="70" rx="14" fill="#f4f2ec" stroke="#d9d2c4" stroke-width="1.6"/>
<text x="730" y="527" font-size="34" font-weight="800" fill="#4a5568">5</text>
<text x="778" y="514" font-size="14.5" font-weight="700" fill="#291c0e">contacts a year</text>
<text x="778" y="535" font-size="12.5" fill="#5c5c5c">captured with paper</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Metal costs more up front, then stops costing — and keeps more of the contacts.</text>
</svg>
