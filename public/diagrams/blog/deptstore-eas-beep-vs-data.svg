<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="easTitle easDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="easTitle">From a beep to an event: legacy EAS versus RFID-EAS hybrid</title>
  <desc id="easDesc">A side-by-side comparison. Left, legacy EAS-only: a gate triggers a generic beep when a tag passes, but the operator does not know what was taken, who walked out, or which checkout lane they used — so false positives cause alarm fatigue. Right, RFID-EAS hybrid: the same gate reads the chip UID and captures the item and SKU, its serial, the time and direction of pass, its last-known shelf location, and its POS status. An unsold item raises an alert with a description, image, and last-known location, while a sold item passes silently — a much higher signal-to-noise ratio.</desc>
  <defs>
    <radialGradient id="easBg" cx="50%" cy="22%" r="88%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#easBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="2.5" fill="#6d5a3a">FROM A BEEP TO AN EVENT</text>
  <text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">RFID turns the door alarm into a data-rich record</text>

  <!-- ===================== Left: legacy EAS-only ===================== -->
  <rect x="56" y="112" width="518" height="486" rx="16" fill="#faf6ef" stroke="#e0cfc0" stroke-width="2"/>
  <rect x="176" y="132" width="278" height="34" rx="17" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
  <text x="315" y="154" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#8b2d2d">EAS-ONLY  ·  LEGACY</text>
  <!-- gate -->
  <rect x="248" y="196" width="20" height="128" rx="6" fill="#ffffff" stroke="#291c0e" stroke-width="3.5"/>
  <rect x="362" y="196" width="20" height="128" rx="6" fill="#ffffff" stroke="#291c0e" stroke-width="3.5"/>
  <!-- alarm burst -->
  <circle cx="315" cy="236" r="22" fill="#8b2d2d"/>
  <text x="315" y="245" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">!</text>
  <g fill="none" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M352 214 a30 30 0 0 1 0 44"/>
    <path d="M368 204 a48 48 0 0 1 0 64"/>
  </g>
  <text x="315" y="300" text-anchor="middle" font-size="24" font-weight="800" fill="#8b2d2d">BEEP!</text>
  <!-- unknowns card -->
  <rect x="96" y="336" width="438" height="176" rx="12" fill="#ffffff" stroke="#e0cfc0" stroke-width="1.5"/>
  <text x="120" y="368" font-size="15" font-weight="700" fill="#6d5a3a">The alarm cannot say…</text>
  <g font-size="16" fill="#4f4f4f">
    <path d="M124 390 l14 14 M138 390 l-14 14" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/>
    <text x="152" y="400">what was taken</text>
    <path d="M124 424 l14 14 M138 424 l-14 14" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/>
    <text x="152" y="434">who walked out</text>
    <path d="M124 458 l14 14 M138 458 l-14 14" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/>
    <text x="152" y="468">which checkout lane</text>
  </g>
  <text x="315" y="556" text-anchor="middle" font-size="15" font-weight="700" fill="#8b2d2d">high false positives → alarm fatigue</text>

  <!-- ===================== Right: RFID-EAS hybrid ===================== -->
  <rect x="626" y="112" width="518" height="486" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="746" y="132" width="278" height="34" rx="17" fill="#eaf9fe" stroke="#1fcefb" stroke-width="1.5"/>
  <text x="885" y="154" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#177a92">RFID-EAS  ·  HYBRID</text>
  <!-- gate reading a tag -->
  <rect x="818" y="196" width="20" height="128" rx="6" fill="#ffffff" stroke="#291c0e" stroke-width="3.5"/>
  <rect x="932" y="196" width="20" height="128" rx="6" fill="#ffffff" stroke="#291c0e" stroke-width="3.5"/>
  <rect x="866" y="244" width="38" height="30" rx="6" fill="#efe0bf" stroke="#291c0e" stroke-width="3"/>
  <circle cx="885" cy="259" r="4.5" fill="#1fcefb"/>
  <g fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round">
    <path d="M846 236 a26 26 0 0 1 0 42"/>
    <path d="M832 226 a42 42 0 0 1 0 62"/>
  </g>
  <!-- captured data card -->
  <rect x="666" y="336" width="438" height="132" rx="12" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="690" y="366" font-size="15" font-weight="700" fill="#177a92">The gate captures…</text>
  <g font-size="15" fill="#291c0e">
    <text x="690" y="396">Item · SKU</text>
    <text x="690" y="424">Serial number</text>
    <text x="690" y="452">Time &amp; direction of pass</text>
    <text x="900" y="396">Last-known shelf</text>
    <text x="900" y="424">POS status</text>
  </g>
  <g stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M676 391 l4 5 l7 -9"/>
    <path d="M676 419 l4 5 l7 -9"/>
    <path d="M676 447 l4 5 l7 -9"/>
    <path d="M886 391 l4 5 l7 -9"/>
    <path d="M886 419 l4 5 l7 -9"/>
  </g>
  <!-- outcome pills -->
  <rect x="666" y="484" width="438" height="34" rx="10" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="1.5"/>
  <text x="885" y="506" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f6f3a">unsold item → alert + image + last location</text>
  <rect x="666" y="526" width="438" height="34" rx="10" fill="#f4efe4" stroke="#c9b48f" stroke-width="1.5"/>
  <text x="885" y="548" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">sold item → passes silently</text>
  <text x="885" y="586" text-anchor="middle" font-size="13.5" fill="#4f4f4f">much higher signal-to-noise ratio</text>
</svg>
