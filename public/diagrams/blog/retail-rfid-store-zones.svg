<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The RFID-enabled store: five reader zones from receiving dock to point of sale</title>
<desc id="d">A store floorplan with five zones. At the receiving dock, fixed UHF readers bulk-read incoming cartons and reconcile them against the advance shipment notice. In the back room, cycle counts reveal stockroom items that should move to the floor for replenishment. On the sales floor, associates walk with a Bluetooth handheld reading over 200 tags per minute against the on-hand file. At point of sale, readers capture every item at once for an automatic inventory-deduction event. Loss prevention compares floor, POS and receiving data to surface item-level shrinkage. Goods flow from receiving to back room to sales floor to POS.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE RFID-ENABLED STORE</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Where each read happens — and what it turns into.</text>

<!-- receiving -->
<rect x="120" y="150" width="248" height="150" rx="12" fill="#f1f3f7" stroke="#c7cdd8" stroke-width="1.6"/>
<text x="140" y="180" font-size="15" font-weight="800" fill="#3a4453">RECEIVING DOCK</text>
<text x="140" y="204" font-size="12.5" font-weight="700" fill="#2c5454">◉ fixed UHF readers</text>
<text x="140" y="226" font-size="12.5" fill="#4a5568">bulk-read incoming cartons,</text>
<text x="140" y="244" font-size="12.5" fill="#4a5568">auto-reconcile vs the ASN</text>

<!-- back room -->
<rect x="120" y="326" width="248" height="150" rx="12" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.4"/>
<text x="140" y="356" font-size="15" font-weight="800" fill="#6d5a3a">BACK ROOM</text>
<text x="140" y="380" font-size="12.5" fill="#5c5c5c">cycle counts reveal stockroom</text>
<text x="140" y="398" font-size="12.5" fill="#5c5c5c">items that belong on the floor</text>
<text x="140" y="420" font-size="12.5" font-weight="700" fill="#2c5454">→ kills phantom out-of-stocks</text>

<!-- sales floor (center, large) -->
<rect x="392" y="150" width="404" height="326" rx="12" fill="#eef5f5" stroke="#bcd6d6" stroke-width="1.8"/>
<text x="594" y="184" text-anchor="middle" font-size="17" font-weight="800" fill="#234a4a">SALES FLOOR</text>
<text x="594" y="212" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">▤ handheld Bluetooth walk</text>
<rect x="520" y="238" width="148" height="92" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<text x="594" y="284" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6f3a">200+</text>
<text x="594" y="306" text-anchor="middle" font-size="12.5" fill="#4f4f4f">tags / minute</text>
<text x="594" y="360" text-anchor="middle" font-size="12.5" fill="#4f4f4f">every tagged item scanned and</text>
<text x="594" y="378" text-anchor="middle" font-size="12.5" fill="#4f4f4f">compared to the on-hand file</text>
<text x="594" y="404" text-anchor="middle" font-size="12.5" font-weight="700" fill="#234a4a">weekly — soon daily</text>

<!-- POS -->
<rect x="820" y="150" width="260" height="150" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="840" y="180" font-size="15" font-weight="800" fill="#6d5a3a">POS / CHECKOUT</text>
<text x="840" y="204" font-size="12.5" font-weight="700" fill="#a07d43">◉ reads all items at once</text>
<text x="840" y="226" font-size="12.5" fill="#5c5c5c">speeds checkout and fires an</text>
<text x="840" y="244" font-size="12.5" fill="#5c5c5c">auto inventory-deduction event</text>

<!-- loss prevention -->
<rect x="820" y="326" width="260" height="150" rx="12" fill="#f1f3f7" stroke="#c7cdd8" stroke-width="1.6"/>
<text x="840" y="356" font-size="15" font-weight="800" fill="#3a4453">LOSS PREVENTION</text>
<text x="840" y="380" font-size="12.5" fill="#4a5568">compare floor vs POS vs</text>
<text x="840" y="398" font-size="12.5" fill="#4a5568">receiving data</text>
<text x="840" y="420" font-size="12.5" font-weight="700" fill="#2c5454">→ item-level shrinkage</text>

<!-- goods-flow arrows -->
<polyline points="372,225 386,234 372,243" fill="none" stroke="#c39a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="372,398 386,407 372,416" fill="none" stroke="#c39a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="800,225 814,234 800,243" fill="none" stroke="#c39a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

<text x="600" y="516" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Five reads, one continuously-true inventory record.</text>
<text x="600" y="548" text-anchor="middle" font-size="14" fill="#5c5c5c">Fixed readers at the edges, a handheld on the floor — goods flow receiving → back room → floor → POS.</text>
</svg>
