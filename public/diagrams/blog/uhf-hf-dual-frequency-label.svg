<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Anatomy of a dual-frequency label — one label, two radios</title>
<desc id="d">A single label drawn large in the centre carries two inlays. The top half holds a UHF inlay at 860–960 MHz, drawn as a dipole antenna with a chip at its centre; a callout on the left notes that a dock door reads it at distance for case-level tracking through distribution. The bottom half holds an NFC inlay at 13.56 MHz, drawn as a concentric coil with a chip; a callout on the right notes that a nurse's phone taps it for item-level verification at the point of care. A strip underneath states: both workflows, one label, at 2–3x the single-frequency price — run the cost-benefit against maintaining two separate single-frequency tag populations.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DUAL-FREQUENCY LABELS</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">One label, two radios, zero re-tagging</text>

<rect x="400" y="140" width="400" height="320" rx="18" fill="#ffffff" stroke="#e4c98f" stroke-width="3"/>
<rect x="440" y="218" width="140" height="12" rx="3" fill="#4a5568"/>
<rect x="620" y="218" width="140" height="12" rx="3" fill="#4a5568"/>
<rect x="584" y="210" width="32" height="28" rx="4" fill="#4a5568"/>
<text x="600" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#4a5568">UHF inlay · 860–960 MHz</text>
<line x1="430" y1="296" x2="770" y2="296" stroke="#e6dfd2" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="520" y="318" width="160" height="84" rx="12" fill="none" stroke="#3d6b6b" stroke-width="3"/>
<rect x="536" y="332" width="128" height="56" rx="9" fill="none" stroke="#3d6b6b" stroke-width="2.2"/>
<rect x="552" y="346" width="96" height="28" rx="7" fill="none" stroke="#3d6b6b" stroke-width="1.6"/>
<rect x="670" y="352" width="20" height="16" rx="3" fill="#c39a5f"/>
<text x="600" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">NFC inlay · 13.56 MHz</text>

<text x="70" y="250" font-size="15" font-weight="700" fill="#291c0e">dock door reads it at distance</text>
<text x="70" y="272" font-size="13" fill="#4f4f4f">case-level tracking through</text>
<text x="70" y="290" font-size="13" fill="#4f4f4f">distribution (dock doors, conveyors)</text>
<line x1="330" y1="245" x2="388" y2="232" stroke="#4a5568" stroke-width="2"/>
<polygon points="396,230 384,228 386,239" fill="#4a5568"/>

<text x="1130" y="380" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">a nurse's phone taps it</text>
<text x="1130" y="402" text-anchor="end" font-size="13" fill="#4f4f4f">item-level verification at</text>
<text x="1130" y="420" text-anchor="end" font-size="13" fill="#4f4f4f">the point of care</text>
<line x1="940" y1="376" x2="812" y2="362" stroke="#3d6b6b" stroke-width="2"/>
<polygon points="804,361 816,357 815,368" fill="#3d6b6b"/>

<rect x="240" y="500" width="720" height="42" rx="21" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="527" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">both workflows, one label — at 2–3x the single-frequency price</text>
<text x="600" y="586" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Run the cost-benefit against its alternative: two separate single-frequency tag populations,</text>
<text x="600" y="606" text-anchor="middle" font-size="13.5" fill="#5c5c5c">each with its own encoding and reading infrastructure.</text>
</svg>
