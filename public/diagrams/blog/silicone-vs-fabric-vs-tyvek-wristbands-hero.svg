<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Silicone, fabric and Tyvek RFID wristbands positioned by cost and wear life</title>
<desc id="d">A positioning map of three RFID wristband materials along a diagonal from cheaper and shorter-lived to pricier and longer-lived. Tyvek sits low: 0.30 to 0.80 dollars per band, 1 to 3 days, for single-day general admission. Woven fabric sits in the middle: 0.80 to 2.50 dollars, 3 to 7 days, for multi-day festivals. Silicone sits high: 1.00 to 3.00 dollars, 2 to 5 years reusable, for parks, VIP and membership programs. The cheapest band and the longest-lasting band are never the same band.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SILICONE vs FABRIC vs TYVEK</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Same RFID chip inside — the material is the real decision.</text>

<line x1="240" y1="536" x2="1000" y2="196" stroke="#ddd2bd" stroke-width="3" stroke-dasharray="7 6"/>
<path d="M1000 196 l-14 2 l7 12 Z" fill="#ddd2bd"/>
<text x="176" y="128" font-size="13" font-weight="700" fill="#8a8a8a">longer wear life</text>
<text x="1120" y="612" text-anchor="end" font-size="13" font-weight="700" fill="#8a8a8a">higher unit cost</text>

<!-- Tyvek (low cost, short life) -->
<rect x="206" y="408" width="250" height="116" rx="14" fill="#fbf4e6" stroke="#e4c98f" stroke-width="1.8"/>
<text x="230" y="444" font-size="17" font-weight="800" letter-spacing="0.4" fill="#a07d43">TYVEK</text>
<text x="230" y="472" font-size="14.5" font-weight="700" fill="#291c0e">$0.30-0.80 · 1-3 days</text>
<text x="230" y="497" font-size="13" fill="#5c5c5c">single-day general admission</text>

<!-- Fabric (mid) -->
<rect x="498" y="280" width="250" height="116" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<text x="522" y="316" font-size="17" font-weight="800" letter-spacing="0.4" fill="#2c5454">WOVEN FABRIC</text>
<text x="522" y="344" font-size="14.5" font-weight="700" fill="#291c0e">$0.80-2.50 · 3-7 days</text>
<text x="522" y="369" font-size="13" fill="#5c5c5c">multi-day festivals</text>

<!-- Silicone (high cost, long life) -->
<rect x="790" y="152" width="250" height="116" rx="14" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.8"/>
<text x="814" y="188" font-size="17" font-weight="800" letter-spacing="0.4" fill="#4a5568">SILICONE</text>
<text x="814" y="216" font-size="14.5" font-weight="700" fill="#291c0e">$1.00-3.00 · 2-5 yrs reuse</text>
<text x="814" y="241" font-size="13" fill="#5c5c5c">parks · VIP · membership</text>

<text x="600" y="622" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The cheapest band and the longest-lasting one are never the same band — match it to the event.</text>
</svg>
