<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="dfTitle dfDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="dfTitle">What the RFP deck promises versus what the factory floor delivers</title>
  <desc id="dfDesc">On the left, a glossy RFP slide: a confident five-million-units-per-month capacity figure, a row of certificate logos (ISO 9001, BSCI, SA8000, WRAP), and a hero photo of a production line lit like a car commercial. On the right, the unretouched floor: three work benches and one operator, with verified capacity typically 50 to 70 percent of the number on the slide. You only find out which version is true by standing on the floor.</desc>
  <defs>
    <radialGradient id="dfBg" cx="50%" cy="18%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="dfGlam" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff7e6"/><stop offset="100%" stop-color="#f3e2bd"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#dfBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="66" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="2.5" fill="#6d5a3a">THE DECK vs THE FLOOR</text>

  <!-- LEFT: the deck -->
  <rect x="58" y="100" width="520" height="490" rx="18" fill="url(#dfGlam)" stroke="#e4c98f" stroke-width="2"/>
  <rect x="82" y="124" width="152" height="32" rx="16" fill="#efe0bf"/><text x="158" y="146" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">THE RFP DECK</text>
  <rect x="82" y="174" width="472" height="186" rx="12" fill="#ffffff" stroke="#e8d6ac" stroke-width="1.5"/>
  <text x="318" y="248" text-anchor="middle" font-size="54" font-weight="800" fill="#291c0e">5,000,000</text>
  <text x="318" y="286" text-anchor="middle" font-size="18" font-weight="600" fill="#6d5a3a">units / month "capacity"</text>
  <g opacity="0.6"><path d="M300 312 l6 12 13 2-9 9 2 13-12-6-12 6 2-13-9-9 13-2z" fill="#c39a5f"/></g>
  <g font-size="12.5" font-weight="700" fill="#7a6a45">
    <rect x="82" y="380" width="98" height="30" rx="15" fill="#fff" stroke="#e4c98f"/><text x="131" y="400" text-anchor="middle">ISO 9001</text>
    <rect x="190" y="380" width="82" height="30" rx="15" fill="#fff" stroke="#e4c98f"/><text x="231" y="400" text-anchor="middle">BSCI</text>
    <rect x="282" y="380" width="96" height="30" rx="15" fill="#fff" stroke="#e4c98f"/><text x="330" y="400" text-anchor="middle">SA8000</text>
    <rect x="388" y="380" width="82" height="30" rx="15" fill="#fff" stroke="#e4c98f"/><text x="429" y="400" text-anchor="middle">WRAP</text>
  </g>
  <rect x="82" y="424" width="472" height="142" rx="12" fill="#2b2115"/>
  <ellipse cx="318" cy="470" rx="150" ry="32" fill="#c39a5f" opacity="0.35"/>
  <rect x="150" y="492" width="60" height="34" rx="4" fill="#6c5127"/><rect x="240" y="486" width="60" height="40" rx="4" fill="#7a5e2e"/><rect x="330" y="492" width="60" height="34" rx="4" fill="#6c5127"/><rect x="420" y="488" width="50" height="38" rx="4" fill="#7a5e2e"/>
  <text x="318" y="548" text-anchor="middle" font-size="12.5" fill="#d9c8a2" font-style="italic">one hero shot, lit like a car commercial</text>

  <!-- divider -->
  <circle cx="600" cy="345" r="31" fill="#291c0e"/><text x="600" y="353" text-anchor="middle" font-size="18" font-weight="800" fill="#f4ead3">vs</text>

  <!-- RIGHT: the floor -->
  <rect x="622" y="100" width="520" height="490" rx="18" fill="#f1f4f6" stroke="#cdd7de" stroke-width="2"/>
  <rect x="646" y="124" width="150" height="32" rx="16" fill="#e2e8ed"/><text x="721" y="146" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1" fill="#4a5568">THE FLOOR</text>
  <g>
    <rect x="690" y="222" width="120" height="20" rx="4" fill="#8a949c"/><rect x="700" y="242" width="12" height="46" fill="#8a949c"/><rect x="788" y="242" width="12" height="46" fill="#8a949c"/>
    <rect x="836" y="222" width="120" height="20" rx="4" fill="#8a949c"/><rect x="846" y="242" width="12" height="46" fill="#8a949c"/><rect x="934" y="242" width="12" height="46" fill="#8a949c"/>
    <rect x="982" y="222" width="120" height="20" rx="4" fill="#8a949c"/><rect x="992" y="242" width="12" height="46" fill="#8a949c"/><rect x="1080" y="242" width="12" height="46" fill="#8a949c"/>
    <circle cx="770" cy="204" r="13" fill="#4a5568"/><rect x="759" y="217" width="22" height="30" rx="8" fill="#4a5568"/>
  </g>
  <text x="882" y="316" text-anchor="middle" font-size="13.5" fill="#55687a" font-style="italic">three benches and one very patient operator</text>
  <rect x="672" y="352" width="420" height="158" rx="12" fill="#ffffff" stroke="#cdd7de" stroke-width="1.5"/>
  <text x="882" y="410" text-anchor="middle" font-size="48" font-weight="800" fill="#8b2d2d">50–70%</text>
  <text x="882" y="444" text-anchor="middle" font-size="17" font-weight="600" fill="#4a5568">of the claimed capacity is typical,</text>
  <text x="882" y="470" text-anchor="middle" font-size="17" font-weight="600" fill="#4a5568">once you count the machines yourself</text>
  <text x="882" y="494" text-anchor="middle" font-size="13" fill="#8a949c">verified on-site · not from the slide</text>

  <text x="600" y="626" text-anchor="middle" font-size="15.5" fill="#6d5a3a">You only find out which version is true by standing on the floor. A ~$3K visit buys you out of $100K+ of failed-shipment pain.</text>
</svg>
