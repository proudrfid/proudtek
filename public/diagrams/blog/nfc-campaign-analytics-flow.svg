<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The NFC campaign data layer: tap, redirect platform, dashboard</title>
<desc id="d">What each tap records — tap count, location, time of day, and device type — feeds a flow from tap to redirect platform to dashboard. The redirect platform logs the event and serves the URL; the dashboard gives one view of the whole campaign. The destination URL swaps server-side for A/B variants, seasonal promos, and language routing, without touching the physical sticker. So the poster finally reports back.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE CAMPAIGN DATA LAYER</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Every tap is a measurable event — and the destination changes without a ladder.</text>

<text x="600" y="128" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8a6d34">WHAT EACH TAP RECORDS</text>
<rect x="100" y="146" width="248" height="48" rx="24" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="224" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">Tap count</text>
<rect x="360" y="146" width="248" height="48" rx="24" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="484" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">Location</text>
<rect x="620" y="146" width="248" height="48" rx="24" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="744" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">Time of day</text>
<rect x="880" y="146" width="248" height="48" rx="24" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="1004" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">Device type</text>

<!-- flow -->
<rect x="100" y="266" width="220" height="112" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<text x="210" y="312" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">TAP</text>
<text x="210" y="340" text-anchor="middle" font-size="13" fill="#4f6a6a">a single sticker touch</text>

<rect x="400" y="250" width="340" height="144" rx="14" fill="#eef5f5" stroke="#2c5454" stroke-width="2.5"/>
<text x="570" y="312" text-anchor="middle" font-size="17" font-weight="800" fill="#234a4a">REDIRECT PLATFORM</text>
<text x="570" y="340" text-anchor="middle" font-size="13" fill="#3d6b6b">logs the event · serves the URL</text>

<rect x="820" y="266" width="308" height="112" rx="14" fill="#eef7f0" stroke="#1f6f3a" stroke-width="2"/>
<text x="974" y="312" text-anchor="middle" font-size="17" font-weight="800" fill="#1f6f3a">DASHBOARD</text>
<text x="974" y="340" text-anchor="middle" font-size="13" fill="#4f6a5a">one view of the whole campaign</text>

<line x1="324" y1="322" x2="392" y2="322" stroke="#291c0e" stroke-width="3"/>
<polygon points="392,315 408,322 392,329" fill="#291c0e"/>
<line x1="744" y1="322" x2="812" y2="322" stroke="#291c0e" stroke-width="3"/>
<polygon points="812,315 828,322 812,329" fill="#291c0e"/>

<!-- server-side callout -->
<rect x="100" y="432" width="1028" height="104" rx="14" fill="#faf6ee" stroke="#e4c98f" stroke-width="1.8"/>
<text x="614" y="474" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">The destination URL swaps server-side: A/B variants, seasonal promos, language routing.</text>
<text x="614" y="504" text-anchor="middle" font-size="14" fill="#7a6636">The physical sticker never changes — no peel, no reprint, no ladder.</text>

<text x="600" y="588" text-anchor="middle" font-size="14.5" fill="#5c5c5c">The poster finally reports back.</text>
</svg>
