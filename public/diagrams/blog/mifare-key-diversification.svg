<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">MIFARE key diversification: a unique AES-128 key derived per card</title>
<desc id="d">A left-to-right flow showing MIFARE key diversification. Two inputs on the left combine: an HSM holding the AES-128 master key that never leaves the vault, and each card's unique UID. They feed a key derivation function labelled NXP AN10922 and AN12752, which outputs a per-card AES-128 key that is different on every card. Below, the payoff: if one card is cloned or lost, the attacker gets only that card's key, while the master key and the rest of the fleet stay safe. A footer states the master key stays in the HSM and only derived keys ever touch a card.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="16%" r="94%">
    <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
  </radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">KEY DIVERSIFICATION</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">One key per card, master key never in the field</text>
<text x="600" y="130" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Derive a unique AES-128 key from each card's UID, so a single clone never opens the fleet.</text>

<!-- inputs -->
<rect x="88" y="214" width="250" height="84" rx="12" fill="#eef1f5" stroke="#4a5568" stroke-width="1.7"/>
<text x="213" y="246" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">HSM — master key</text>
<text x="213" y="268" text-anchor="middle" font-size="12.5" fill="#5c5c5c">AES-128 · never leaves the vault</text>

<text x="213" y="326" text-anchor="middle" font-size="26" font-weight="800" fill="#6d5a3a">+</text>

<rect x="88" y="334" width="250" height="84" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="213" y="366" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Card UID</text>
<text x="213" y="388" text-anchor="middle" font-size="12.5" fill="#5c5c5c">unique per chip</text>

<!-- merge bracket + arrow to KDF -->
<line x1="338" y1="256" x2="352" y2="256" stroke="#a8a29a" stroke-width="2.2"/>
<line x1="338" y1="376" x2="352" y2="376" stroke="#a8a29a" stroke-width="2.2"/>
<line x1="352" y1="256" x2="352" y2="376" stroke="#a8a29a" stroke-width="2.2"/>
<line x1="352" y1="316" x2="432" y2="316" stroke="#a8a29a" stroke-width="2.6"/>
<polygon points="432,316 419,309 419,323" fill="#a8a29a"/>

<!-- KDF -->
<rect x="440" y="268" width="250" height="96" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.8"/>
<text x="565" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Key derivation (KDF)</text>
<text x="565" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">NXP AN10922 / AN12752</text>

<line x1="690" y1="316" x2="764" y2="316" stroke="#a8a29a" stroke-width="2.6"/>
<polygon points="764,316 751,309 751,323" fill="#a8a29a"/>

<!-- output -->
<rect x="772" y="268" width="328" height="96" rx="14" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.8"/>
<text x="936" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Per-card AES-128 key</text>
<text x="936" y="332" text-anchor="middle" font-size="13" fill="#2d6a4f">different on every card</text>

<!-- outcome band -->
<text x="600" y="452" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY IT MATTERS</text>
<rect x="140" y="466" width="372" height="88" rx="12" fill="#fbeeee" stroke="#8b2d2d" stroke-width="1.6"/>
<text x="326" y="500" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">One card is cloned or lost</text>
<text x="326" y="524" text-anchor="middle" font-size="13" fill="#8b2d2d">attacker gets that card's key only</text>

<line x1="520" y1="510" x2="592" y2="510" stroke="#a8a29a" stroke-width="2.6"/>
<polygon points="592,510 579,503 579,517" fill="#a8a29a"/>

<rect x="600" y="466" width="460" height="88" rx="12" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.6"/>
<text x="830" y="500" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Master key and the rest of the fleet stay safe</text>
<text x="830" y="524" text-anchor="middle" font-size="13" fill="#2d6a4f">no other credential is exposed</text>

<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#5c5c5c">The master key stays in the HSM; only derived keys ever touch a card.</text>
</svg>
