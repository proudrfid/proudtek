<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ukbTitle ukbDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ukbTitle">The UK runs the ETSI band plan — EU-tuned inlays work in UK portals, US-tuned inlays do not</title>
  <desc id="ukbDesc">Two-lane frequency map from 860 to 930 megahertz. The United Kingdom lane, per Ofcom Interface Requirement 2030, shows two teal blocks: the lower band at 865 to 868 megahertz with up to 2 watts effective radiated power in high-power channels 4 to 13 at 200 kilohertz spacing, and the upper band at 916.1 to 918.9 megahertz with up to 4 watts effective radiated power on three channels at 916.3, 917.5 and 918.7 megahertz. The United States lane below shows, for contrast, one steel block spanning 902 to 928 megahertz — a different band, not a UK tuning target. Beneath the shared frequency axis, two outcome cards: an ETSI-tuned inlay in a UK portal delivers full rated read range, while a US-tuned inlay has its resonance above the UK lower band, giving shorter, flakier reads and then a re-order. Footnote: readers are the regulated radio equipment; passive tags are tuned, not certified.</desc>
  <defs>
    <radialGradient id="ukbBg" cx="50%" cy="18%" r="92%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#ukbBg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="1.1" fill="#6d5a3a">GET THE BAND RIGHT — THE UK RUNS THE ETSI PLAN</text>
  <text x="600" y="86" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Ofcom IR 2030 · lower band 865–868 MHz at 2 W e.r.p. · upper band 916.1–918.9 MHz at 4 W e.r.p.</text>

  <!-- UK lane -->
  <rect x="120" y="130" width="960" height="118" rx="10" fill="#eef5f5"/>
  <text x="136" y="154" font-size="13" font-weight="800" letter-spacing="0.8" fill="#234a4a">UNITED KINGDOM — OFCOM IR 2030</text>
  <rect x="189" y="166" width="41" height="66" rx="4" fill="#3d6b6b"/>
  <text x="244" y="190" font-size="14" font-weight="700" fill="#2c5454">865–868 MHz · up to 2 W e.r.p.</text>
  <text x="244" y="212" font-size="12.5" fill="#4f4f4f">high-power channels 4–13 · 200 kHz spacing</text>
  <rect x="889" y="166" width="38" height="66" rx="4" fill="#2c5454"/>
  <text x="877" y="190" text-anchor="end" font-size="14" font-weight="700" fill="#2c5454">916.1–918.9 MHz · up to 4 W e.r.p.</text>
  <text x="877" y="212" text-anchor="end" font-size="12.5" fill="#4f4f4f">3 channels: 916.3 · 917.5 · 918.7 MHz</text>

  <!-- US lane -->
  <rect x="120" y="260" width="960" height="118" rx="10" fill="#eceff3"/>
  <text x="136" y="284" font-size="13" font-weight="800" letter-spacing="0.8" fill="#4a5568">UNITED STATES — FCC, FOR CONTRAST</text>
  <rect x="696" y="296" width="357" height="66" rx="4" fill="#4a5568"/>
  <text x="874" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">902–928 MHz</text>
  <text x="684" y="322" text-anchor="end" font-size="12.5" fill="#4a5568">a different band —</text>
  <text x="684" y="342" text-anchor="end" font-size="12.5" fill="#4a5568">not a UK tuning target</text>

  <!-- shared frequency axis -->
  <line x1="120" y1="408" x2="1080" y2="408" stroke="#291c0e" stroke-width="2"/>
  <line x1="120" y1="408" x2="120" y2="416" stroke="#291c0e" stroke-width="2"/>
  <line x1="257" y1="408" x2="257" y2="416" stroke="#291c0e" stroke-width="2"/>
  <line x1="394" y1="408" x2="394" y2="416" stroke="#291c0e" stroke-width="2"/>
  <line x1="531" y1="408" x2="531" y2="416" stroke="#291c0e" stroke-width="2"/>
  <line x1="669" y1="408" x2="669" y2="416" stroke="#291c0e" stroke-width="2"/>
  <line x1="806" y1="408" x2="806" y2="416" stroke="#291c0e" stroke-width="2"/>
  <line x1="943" y1="408" x2="943" y2="416" stroke="#291c0e" stroke-width="2"/>
  <line x1="1080" y1="408" x2="1080" y2="416" stroke="#291c0e" stroke-width="2"/>
  <text x="120" y="436" text-anchor="middle" font-size="13" fill="#5c5c5c">860</text>
  <text x="257" y="436" text-anchor="middle" font-size="13" fill="#5c5c5c">870</text>
  <text x="394" y="436" text-anchor="middle" font-size="13" fill="#5c5c5c">880</text>
  <text x="531" y="436" text-anchor="middle" font-size="13" fill="#5c5c5c">890</text>
  <text x="669" y="436" text-anchor="middle" font-size="13" fill="#5c5c5c">900</text>
  <text x="806" y="436" text-anchor="middle" font-size="13" fill="#5c5c5c">910</text>
  <text x="943" y="436" text-anchor="middle" font-size="13" fill="#5c5c5c">920</text>
  <text x="1080" y="436" text-anchor="middle" font-size="13" fill="#5c5c5c">930</text>
  <text x="1104" y="436" text-anchor="start" font-size="12.5" fill="#8a949c">MHz</text>

  <!-- outcome cards -->
  <rect x="64" y="470" width="524" height="118" rx="14" fill="#eaf5ec" stroke="#9cccae" stroke-width="2"/>
  <text x="88" y="504" font-size="16" font-weight="800" fill="#1f6f3a">ETSI-tuned inlay in a UK portal</text>
  <text x="88" y="533" font-size="14" fill="#291c0e">Antenna matched to 865–868 MHz.</text>
  <text x="88" y="556" font-size="14" fill="#291c0e">Full rated read range on UK readers.</text>

  <rect x="612" y="470" width="524" height="118" rx="14" fill="#f5e6e6" stroke="#d9a3a3" stroke-width="2"/>
  <text x="636" y="504" font-size="16" font-weight="800" fill="#8b2d2d">US-tuned inlay in a UK portal</text>
  <text x="636" y="533" font-size="14" fill="#291c0e">Resonance sits above the UK lower band.</text>
  <text x="636" y="556" font-size="14" fill="#291c0e">Shorter, flakier reads — then a re-order.</text>

  <text x="600" y="634" text-anchor="middle" font-size="12.5" fill="#6d5a3a">Readers are the regulated radio equipment — passive tags are tuned, not certified</text>
</svg>
