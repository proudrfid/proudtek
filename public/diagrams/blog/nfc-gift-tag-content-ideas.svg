<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five NFC gift-tag content ideas ranked by how reliably they land on Christmas morning</title>
<desc id="d">Five ideas for what an NFC gift tag can open, ordered surest-bet first. One, a video message you record, host unlisted, and the tap plays on the recipient's phone. Two, a holiday playlist linked from Spotify, Apple Music or YouTube Music. Three, a photo album pointed at a Google Photos or iCloud gallery. Four, a digital gift card or e-voucher revealed by the tap. Five, a scavenger hunt where each tag holds a clue leading to the next and finally the big gift.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">GIFT-TAG CONTENT IDEAS</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="36" font-weight="700" fill="#291c0e">Five ways to fill a gift tag</text>
<text x="600" y="132" text-anchor="middle" font-size="16" fill="#4f4f4f">Ordered by how reliably they land on Christmas morning — surest bet first.</text>

<!-- row 1 -->
<rect x="64" y="164" width="1072" height="64" rx="12" fill="#e4f0f0" stroke="#bcdcdc" stroke-width="1.3"/>
<circle cx="104" cy="196" r="20" fill="#234a4a"/>
<text x="104" y="203" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
<text x="146" y="190" font-size="16" font-weight="800" fill="#291c0e">Video message</text>
<text x="146" y="213" font-size="13.5" fill="#4f4f4f">Record it, host it unlisted, and the tap plays it on their phone.</text>

<!-- row 2 -->
<rect x="64" y="238" width="1072" height="64" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<circle cx="104" cy="270" r="20" fill="#3d6b6b"/>
<text x="104" y="277" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
<text x="146" y="264" font-size="16" font-weight="800" fill="#291c0e">Holiday playlist</text>
<text x="146" y="287" font-size="13.5" fill="#4f4f4f">Link a Spotify, Apple Music or YouTube Music playlist.</text>

<!-- row 3 -->
<rect x="64" y="312" width="1072" height="64" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<circle cx="104" cy="344" r="20" fill="#3d6b6b"/>
<text x="104" y="351" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
<text x="146" y="338" font-size="16" font-weight="800" fill="#291c0e">Photo album</text>
<text x="146" y="361" font-size="13.5" fill="#4f4f4f">Point the tag at a Google Photos or iCloud gallery.</text>

<!-- row 4 -->
<rect x="64" y="386" width="1072" height="64" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<circle cx="104" cy="418" r="20" fill="#3d6b6b"/>
<text x="104" y="425" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">4</text>
<text x="146" y="412" font-size="16" font-weight="800" fill="#291c0e">Digital gift card</text>
<text x="146" y="435" font-size="13.5" fill="#4f4f4f">The tap reveals a gift card or e-voucher to redeem.</text>

<!-- row 5 -->
<rect x="64" y="460" width="1072" height="64" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<circle cx="104" cy="492" r="20" fill="#c39a5f"/>
<text x="104" y="499" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">5</text>
<text x="146" y="486" font-size="16" font-weight="800" fill="#291c0e">Scavenger hunt</text>
<text x="146" y="509" font-size="13.5" fill="#4f4f4f">Each tag holds a clue that leads to the next — then the big gift.</text>

<text x="600" y="582" text-anchor="middle" font-size="14.5" fill="#5c5c5c">The higher a row sits, the fewer ways it has to go wrong when a phone actually taps it.</text>
</svg>
