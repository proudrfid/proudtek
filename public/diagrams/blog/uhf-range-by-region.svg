<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="rgTitle rgDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="rgTitle">UHF RFID regulations and read range by region</title>
  <desc id="rgDesc">Region-by-region UHF power limits. United States and Canada under FCC Part 15.247 use 902 to 928 MHz at up to 4 watts EIRP, giving 10 to 15 meters. The European Union under ETSI EN 302 208 uses 865 to 868 MHz at up to 2 watts ERP with Listen-Before-Talk, giving 8 to 12 meters. China under SRRC uses 920 to 925 MHz at 2 watts ERP, comparable to the EU. Japan under ARIB uses 916 to 924 MHz at up to 1 watt ERP, the most restrictive major market at 4 to 8 meters. Korea, Australia, Brazil and India each have their own bands and limits, where dual-band global tags add 5 to 15 percent to price.</desc>
  <defs>
    <radialGradient id="rgBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#rgBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="1.2" fill="#6d5a3a">REGULATIONS CAP YOUR RANGE — BY REGION</text>
  <text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Buy for the band you deploy in — a mismatched “global” tag just detunes the antenna</text>

  <!-- column captions -->
  <text x="640" y="112" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#8a949c">BAND</text>
  <text x="828" y="112" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#8a949c">POWER</text>
  <text x="1024" y="112" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#8a949c">TYPICAL RANGE</text>

  <!-- Row 1 US/Canada -->
  <rect x="56" y="120" width="1088" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="80" y="154" font-size="21" font-weight="800" fill="#291c0e">United States · Canada</text>
  <text x="80" y="180" font-size="14.5" fill="#6d5a3a">FCC Part 15.247 / IC RSS-247 · frequency-hopping</text>
  <rect x="552" y="138" width="176" height="44" rx="22" fill="#e7f0ef" stroke="#9cbfbc" stroke-width="1.5"/><text x="640" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">902–928 MHz</text>
  <rect x="740" y="138" width="176" height="44" rx="22" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.5"/><text x="828" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#177a92">4 W EIRP</text>
  <rect x="928" y="138" width="188" height="44" rx="22" fill="#eaf5ec" stroke="#9cccae" stroke-width="1.5"/><text x="1022" y="166" text-anchor="middle" font-size="15" font-weight="800" fill="#1f6f3a">10–15 m</text>

  <!-- Row 2 EU -->
  <rect x="56" y="208" width="1088" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="80" y="242" font-size="21" font-weight="800" fill="#291c0e">European Union</text>
  <text x="80" y="268" font-size="14.5" fill="#6d5a3a">ETSI EN 302 208 · Listen-Before-Talk (4-channel)</text>
  <rect x="552" y="226" width="176" height="44" rx="22" fill="#e7f0ef" stroke="#9cbfbc" stroke-width="1.5"/><text x="640" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">865–868 MHz</text>
  <rect x="740" y="226" width="176" height="44" rx="22" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.5"/><text x="828" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#177a92">2 W ERP</text>
  <rect x="928" y="226" width="188" height="44" rx="22" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="1022" y="254" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">8–12 m</text>

  <!-- Row 3 China -->
  <rect x="56" y="296" width="1088" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="80" y="330" font-size="21" font-weight="800" fill="#291c0e">China</text>
  <text x="80" y="356" font-size="14.5" fill="#6d5a3a">SRRC GB/T 28925-2012 · test against China band</text>
  <rect x="552" y="314" width="176" height="44" rx="22" fill="#e7f0ef" stroke="#9cbfbc" stroke-width="1.5"/><text x="640" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">920–925 MHz</text>
  <rect x="740" y="314" width="176" height="44" rx="22" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.5"/><text x="828" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#177a92">2 W ERP</text>
  <rect x="928" y="314" width="188" height="44" rx="22" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="1022" y="342" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">~ EU range</text>

  <!-- Row 4 Japan -->
  <rect x="56" y="384" width="1088" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="80" y="418" font-size="21" font-weight="800" fill="#291c0e">Japan</text>
  <text x="80" y="444" font-size="14.5" fill="#6d5a3a">ARIB STD-T106/T107 · most restrictive major market</text>
  <rect x="552" y="402" width="176" height="44" rx="22" fill="#e7f0ef" stroke="#9cbfbc" stroke-width="1.5"/><text x="640" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">916–924 MHz</text>
  <rect x="740" y="402" width="176" height="44" rx="22" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.5"/><text x="828" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#177a92">1 W ERP</text>
  <rect x="928" y="402" width="188" height="44" rx="22" fill="#f5e6e6" stroke="#d9a3a3" stroke-width="1.5"/><text x="1022" y="430" text-anchor="middle" font-size="15" font-weight="800" fill="#8b2d2d">4–8 m</text>

  <!-- Row 5 others -->
  <rect x="56" y="472" width="1088" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="80" y="506" font-size="21" font-weight="800" fill="#291c0e">Korea · Australia · Brazil · India</text>
  <text x="80" y="532" font-size="14.5" fill="#6d5a3a">KCC · ACMA · ANATEL · WPC — each its own band</text>
  <rect x="552" y="490" width="176" height="44" rx="22" fill="#eef1f4" stroke="#c3ccd6" stroke-width="1.5"/><text x="640" y="518" text-anchor="middle" font-size="15" font-weight="700" fill="#3a4a52">various bands</text>
  <rect x="740" y="490" width="176" height="44" rx="22" fill="#eef1f4" stroke="#c3ccd6" stroke-width="1.5"/><text x="828" y="518" text-anchor="middle" font-size="15" font-weight="700" fill="#3a4a52">own caps</text>
  <rect x="928" y="490" width="188" height="44" rx="22" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="1022" y="518" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">dual-band +5–15%</text>

  <text x="600" y="600" text-anchor="middle" font-size="17" font-weight="600" fill="#6d5a3a">Physics sets the ceiling; the regulator sets it lower — and doesn’t take requests.</text>
</svg>
