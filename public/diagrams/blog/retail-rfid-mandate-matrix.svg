<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Walmart, Target and Macy's retail RFID supplier mandates compared</title>
<desc id="d">A three-row mandate matrix. Walmart, using SGTIN-96 and ARC-certified inlays, covers apparel, home goods, electronics and consumer health expanding through 2025 to 2026, requires a 95 percent-plus read rate at receiving, and charges 2 to 5 dollars per unit below 90 percent on a weekly cadence. Target's T2 tier covers apparel, footwear, intimates and home textiles at 95 percent, with T3 small electronics, toys and seasonal phasing through 2026 to 2027 on the same interoperable chip family. Macy's and Bloomingdale's tag size-intensive replenishment items, about 30 percent of annual sales, with a 0.75 dollar per unit non-functioning-tag offset effective July 2023 and a monthly audit cadence. About 93 percent of North American retailers already run RFID, so buying from a mandated supplier delivers a tagged item with no tag capex.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SUPPLIER MANDATES = A FREE TAG IN THE BOX</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">If your vendors already tag at source, your in-store program only buys readers.</text>

<!-- headers -->
<text x="92" y="116" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a7a55">PROGRAM</text>
<text x="338" y="116" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a7a55">CATEGORIES IN SCOPE</text>
<text x="800" y="116" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a7a55">READ RATE</text>
<text x="1112" y="116" text-anchor="end" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a7a55">PENALTY · CADENCE</text>

<!-- row Walmart -->
<rect x="64" y="128" width="1072" height="96" rx="12" fill="#f1f3f7" stroke="#c7cdd8" stroke-width="1.4"/>
<rect x="64" y="128" width="9" height="96" rx="4" fill="#4a5568"/>
<text x="92" y="166" font-size="17" font-weight="800" fill="#291c0e">Walmart</text>
<text x="92" y="190" font-size="12" fill="#8a8a8a">SGTIN-96 · ARC-certified</text>
<text x="338" y="164" font-size="13.5" fill="#4f4f4f">Apparel, home goods, electronics,</text>
<text x="338" y="186" font-size="13.5" fill="#4f4f4f">consumer health (expanding 2025–2026)</text>
<text x="800" y="184" text-anchor="middle" font-size="22" font-weight="800" fill="#1f6f3a">95%+</text>
<text x="1112" y="164" text-anchor="end" font-size="14.5" font-weight="800" fill="#8b2d2d">$2–5/unit &lt; 90%</text>
<text x="1112" y="188" text-anchor="end" font-size="13" fill="#5c5c5c">weekly</text>

<!-- row Target -->
<rect x="64" y="232" width="1072" height="96" rx="12" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.3"/>
<rect x="64" y="232" width="9" height="96" rx="4" fill="#c39a5f"/>
<text x="92" y="270" font-size="17" font-weight="800" fill="#291c0e">Target</text>
<text x="92" y="294" font-size="12" fill="#8a8a8a">T2 / T3 · same chip family</text>
<text x="338" y="268" font-size="13.5" fill="#4f4f4f">T2: apparel, footwear, intimates, home</text>
<text x="338" y="290" font-size="13.5" fill="#4f4f4f">textiles · T3 (electronics, toys) 2026–2027</text>
<text x="800" y="288" text-anchor="middle" font-size="22" font-weight="800" fill="#1f6f3a">95%</text>
<text x="1112" y="268" text-anchor="end" font-size="14" font-weight="700" fill="#4f4f4f">T3 phasing</text>
<text x="1112" y="292" text-anchor="end" font-size="13" fill="#5c5c5c">interoperable w/ Walmart</text>

<!-- row Macy's -->
<rect x="64" y="336" width="1072" height="96" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<rect x="64" y="336" width="9" height="96" rx="4" fill="#3d6b6b"/>
<text x="92" y="374" font-size="17" font-weight="800" fill="#291c0e">Macy's</text>
<text x="92" y="398" font-size="12" fill="#8a8a8a">+ Bloomingdale's</text>
<text x="338" y="372" font-size="13.5" fill="#4f4f4f">Size-intensive replenishment items</text>
<text x="338" y="394" font-size="13.5" fill="#4f4f4f">~30% of annual sales</text>
<text x="800" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#5c5c5c">audit-based</text>
<text x="1112" y="372" text-anchor="end" font-size="14.5" font-weight="800" fill="#8b2d2d">$0.75/unit (Jul 2023)</text>
<text x="1112" y="396" text-anchor="end" font-size="13" fill="#5c5c5c">monthly audit</text>

<!-- cross-mandate note -->
<rect x="64" y="454" width="1072" height="72" rx="13" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="92" y="484" font-size="15.5" font-weight="800" fill="#1f6f3a">~93% of North American retailers already run RFID.</text>
<text x="92" y="507" font-size="13.5" fill="#3a6a4a">Buy from a multi-mandate supplier and item-level tags arrive whether or not you have your own program — you add readers, not tag capex.</text>

<text x="600" y="566" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">The mandate landscape is what makes a late-mover's in-store business case pencil out.</text>
<text x="600" y="596" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Same UHF chip family across programs — one tagged item satisfies multiple trading partners.</text>
</svg>
