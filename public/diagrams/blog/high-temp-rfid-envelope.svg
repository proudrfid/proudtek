<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Specialty RFID tags for heat and pressure beyond normal IP ratings</title>
<desc id="d">Five specialty tag families and their limits. Xerafy MICRO Heat and Paint Shop are titanium-housed UHF tags rated 215 to 250 degrees Celsius at IP68, used in automotive paint ovens that cure at 200 degrees and pharma autoclaves, reading up to 7 metres on metal. Xerafy Xplorer Screw is rated to 220 degrees Celsius and 22,000 psi or 1,517 bar for downhole oilfield tracking. HID EXO is polycarbonate and epoxy at IP68 with 5-plus-year UV stabilization for utility meters and municipal infrastructure. Confidex Captura Ironside Steam and Survivor are IP68 and IP69K on-metal tags rated minus 40 to plus 85 degrees for steam, autoclave and freeze-thaw. Glass LF or HF transponders from Schott or NXP HITAG and ICODE are 2 by 12 millimetre borosilicate capsules for autoclave and livestock implantation per ISO 11784 and 11785, reading 1 to 3 centimetres.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BEYOND IP · HEAT &amp; PRESSURE ENVELOPE</text>
<text x="600" y="80" text-anchor="middle" font-size="15.5" fill="#4f4f4f">When the environment destroys a normal inlay, specialty tags take over — these are the 2026 production options.</text>

<!-- row 1 -->
<rect x="64" y="112" width="1072" height="90" rx="11" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="112" width="9" height="90" rx="4" fill="#4a5568"/>
<text x="92" y="146" font-size="15.5" font-weight="800" fill="#291c0e">Xerafy MICRO Heat / Paint Shop</text>
<text x="92" y="168" font-size="12" fill="#5c5c5c">titanium-housed UHF, on-metal</text>
<rect x="92" y="176" width="196" height="20" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="190" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6d34">215–250 °C · IP68</text>
<text x="404" y="150" font-size="12.5" fill="#333333">Automotive paint ovens (cure 200 °C) and pharma autoclaves;</text>
<text x="404" y="172" font-size="12.5" fill="#333333">on-metal read range up to 7 m at standard FCC power.</text>

<!-- row 2 -->
<rect x="64" y="210" width="1072" height="90" rx="11" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="210" width="9" height="90" rx="4" fill="#4a5568"/>
<text x="92" y="244" font-size="15.5" font-weight="800" fill="#291c0e">Xerafy Xplorer Screw</text>
<text x="92" y="266" font-size="12" fill="#5c5c5c">oil &amp; gas · downhole</text>
<rect x="92" y="274" width="210" height="20" rx="10" fill="#eef1f4" stroke="#c3ccd8" stroke-width="1.2"/>
<text x="197" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4456">+220 °C · 22,000 psi</text>
<text x="404" y="248" font-size="12.5" fill="#333333">Downhole oilfield asset tracking at up to 22,000 psi (1,517 bar);</text>
<text x="404" y="270" font-size="12.5" fill="#333333">embedded screw-thread form factor for permanent mounting.</text>

<!-- row 3 -->
<rect x="64" y="308" width="1072" height="90" rx="11" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<rect x="64" y="308" width="9" height="90" rx="4" fill="#4a5568"/>
<text x="92" y="342" font-size="15.5" font-weight="800" fill="#291c0e">HID EXO Tag family</text>
<text x="92" y="364" font-size="12" fill="#5c5c5c">polycarbonate / epoxy UHF</text>
<rect x="92" y="372" width="180" height="20" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="182" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">IP68 · 5+ yr UV</text>
<text x="404" y="346" font-size="12.5" fill="#333333">Utility meters (gas, water, electric), municipal infrastructure and</text>
<text x="404" y="368" font-size="12.5" fill="#333333">outdoor logistics yards; extended UV stabilization for 5+ years.</text>

