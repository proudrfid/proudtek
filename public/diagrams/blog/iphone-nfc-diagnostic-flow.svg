<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five-step iPhone NFC diagnostic flow, fastest to slowest</title>
<desc id="d">A five-step diagnostic ladder for a single iPhone that will not scan a tag, ordered fastest to slowest. Step one, check the basics: phone awake and unlocked, no metal or MagSafe case, tap the top 2 cm. Step two, test the tag on an Android phone with NFC Tools; if Android reads it but iPhone does not, the chip is iOS-incompatible, so replace the tag. Step three, re-encode a valid https URL; if it writes and reads on Android but not iPhone, the problem is the NDEF format. Step four, try another tag from the batch to isolate a single damaged unit. Step five, as a last resort, run an Apple Pay test; if Apple Pay fails too, the iPhone NFC hardware is suspect and needs Apple Support.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">iPHONE NFC DIAGNOSTIC FLOW</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Fastest checks first — stop the moment the tag reads.</text>

<!-- Step 1 -->
<rect x="64" y="118" width="1072" height="80" rx="12" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.5"/>
<circle cx="112" cy="158" r="22" fill="#3d6b6b"/>
<text x="112" y="165" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
<text x="152" y="152" font-size="16.5" font-weight="800" fill="#291c0e">Check the basics</text>
<text x="152" y="178" font-size="13" fill="#5c5c5c">Awake + unlocked, no metal/MagSafe case, tap the top 2 cm.</text>
<rect x="836" y="140" width="264" height="36" rx="18" fill="#dcebeb" stroke="#a9cccc" stroke-width="1.3"/>
<text x="968" y="163" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">START HERE</text>

<!-- Step 2 -->
<rect x="64" y="208" width="1072" height="80" rx="12" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.5"/>
<circle cx="112" cy="248" r="22" fill="#3d6b6b"/>
<text x="112" y="255" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
<text x="152" y="242" font-size="16.5" font-weight="800" fill="#291c0e">Test on Android (NFC Tools)</text>
<text x="152" y="268" font-size="13" fill="#5c5c5c">Reads on Android but not iPhone? The chip is iOS-incompatible.</text>
<rect x="836" y="230" width="264" height="36" rx="18" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<text x="968" y="253" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8a6d34">→ REPLACE TAG</text>

<!-- Step 3 -->
<rect x="64" y="298" width="1072" height="80" rx="12" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.5"/>
<circle cx="112" cy="338" r="22" fill="#3d6b6b"/>
<text x="112" y="345" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
<text x="152" y="332" font-size="16.5" font-weight="800" fill="#291c0e">Re-encode a valid https URL</text>
<text x="152" y="358" font-size="13" fill="#5c5c5c">Writes + reads on Android, still not iPhone → NDEF format.</text>
<rect x="836" y="320" width="264" height="36" rx="18" fill="#dcebeb" stroke="#a9cccc" stroke-width="1.3"/>
<text x="968" y="343" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">→ NDEF ISSUE</text>

<!-- Step 4 -->
<rect x="64" y="388" width="1072" height="80" rx="12" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.5"/>
<circle cx="112" cy="428" r="22" fill="#3d6b6b"/>
<text x="112" y="435" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">4</text>
<text x="152" y="422" font-size="16.5" font-weight="800" fill="#291c0e">Try another tag from the batch</text>
<text x="152" y="448" font-size="13" fill="#5c5c5c">One fails, the next ten work → broken antenna or chip bond.</text>
<rect x="836" y="410" width="264" height="36" rx="18" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<text x="968" y="433" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8a6d34">→ ISOLATE THE UNIT</text>

<!-- Step 5 -->
<rect x="64" y="478" width="1072" height="80" rx="12" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.5"/>
<circle cx="112" cy="518" r="22" fill="#4a5568"/>
<text x="112" y="525" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">5</text>
<text x="152" y="512" font-size="16.5" font-weight="800" fill="#291c0e">Apple Pay test (last resort)</text>
<text x="152" y="538" font-size="13" fill="#5c5c5c">If Apple Pay fails too, the iPhone's NFC hardware is suspect.</text>
<rect x="836" y="500" width="264" height="36" rx="18" fill="#f4e0e0" stroke="#e0bcbc" stroke-width="1.3"/>
<text x="968" y="523" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8b2d2d">→ APPLE SUPPORT</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Stop at the first step that reads — most tickets die at step 1 or 2.</text>
</svg>
