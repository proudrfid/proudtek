<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Where an NTAG 424 DNA tag is placed in a sneaker and how the inlay is built</title>
  <desc id="d">Left: a side-profile sneaker with four placement callouts — a woven tongue label at 20 by 40 mm, an under-insole inlay at 12 by 19 mm, a heel-counter lining inlay, and a removable lace hang tag. Right: the inlay layer stack — a protective overlay, an aluminium antenna coil with the NTAG 424 DNA die at 13.56 MHz with AES-128 SUN, a durable flexible substrate that survives lasting, and a tamper-evident adhesive that leaves a VOID pattern on removal, plus a shoebox-seal tamper variant note. Bottom: standard sizes — woven tongue label 20 by 40 mm, under-insole inlay 12 by 19 mm — and the operating range of minus 25 to plus 85 degrees Celsius.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE THE TAG LIVES IN THE SHOE</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Five placements integrated at footwear manufacture — hidden, durable, tamper-aware</text>

  <!-- LEFT: PLACEMENT -->
  <text x="330" y="124" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">PLACEMENT</text>

  <!-- sole -->
  <path d="M100 330 L500 330 Q516 330 516 344 Q516 360 500 360 L108 360 Q92 360 96 344 Q98 330 100 330 Z" fill="#cdd7d7" stroke="#4a5568" stroke-width="2"/>
  <line x1="106" y1="345" x2="508" y2="345" stroke="#ffffff" stroke-width="2"/>
  <!-- upper -->
  <path d="M110 332 C100 306 128 290 172 288 L288 288 C304 288 310 272 332 270 L468 270 C494 270 502 302 500 332 Z" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.5"/>
  <path d="M120 330 C122 308 150 300 178 302" fill="none" stroke="#3d6b6b" stroke-width="1.5" opacity="0.65"/>
  <!-- ankle collar -->
  <ellipse cx="452" cy="278" rx="26" ry="10" fill="#dcebeb" stroke="#3d6b6b" stroke-width="1.5"/>
  <!-- tongue -->
  <rect x="300" y="248" width="42" height="44" rx="9" fill="#f7edd6" stroke="#c39a5f" stroke-width="2.5" transform="rotate(-6 321 270)"/>
  <!-- laces -->
  <line x1="304" y1="302" x2="344" y2="292" stroke="#4a5568" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="306" y1="292" x2="346" y2="282" stroke="#4a5568" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="308" y1="282" x2="348" y2="272" stroke="#4a5568" stroke-width="2.4" stroke-linecap="round"/>

  <!-- callout leaders + dots -->
  <line x1="318" y1="256" x2="196" y2="200" stroke="#4a5568" stroke-width="1.4"/>
  <circle cx="318" cy="256" r="4" fill="#3d6b6b"/>
  <line x1="344" y1="292" x2="470" y2="200" stroke="#4a5568" stroke-width="1.4"/>
  <circle cx="344" cy="292" r="4" fill="#3d6b6b"/>
  <line x1="250" y1="344" x2="176" y2="404" stroke="#4a5568" stroke-width="1.4"/>
  <circle cx="250" cy="344" r="4" fill="#3d6b6b"/>
  <line x1="476" y1="316" x2="486" y2="404" stroke="#4a5568" stroke-width="1.4"/>
  <circle cx="476" cy="316" r="4" fill="#3d6b6b"/>

  <!-- callout pills -->
  <rect x="60" y="170" width="188" height="48" rx="10" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="72" y="192" font-size="13.5" font-weight="700" fill="#291c0e">Woven tongue label</text>
  <text x="72" y="209" font-size="12" fill="#5c5c5c">20 × 40 mm · visible</text>

  <rect x="418" y="170" width="182" height="48" rx="10" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="430" y="192" font-size="13.5" font-weight="700" fill="#291c0e">Lace hang tag</text>
  <text x="430" y="209" font-size="12" fill="#5c5c5c">epoxy · removable</text>

  <rect x="58" y="398" width="196" height="48" rx="10" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="70" y="420" font-size="13.5" font-weight="700" fill="#291c0e">Under-insole inlay</text>
  <text x="70" y="437" font-size="12" fill="#5c5c5c">12 × 19 mm · hidden</text>

  <rect x="396" y="398" width="208" height="48" rx="10" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="408" y="420" font-size="13.5" font-weight="700" fill="#291c0e">Heel-counter lining</text>
  <text x="408" y="437" font-size="12" fill="#5c5c5c">laminated, hidden</text>

  <!-- RIGHT: THE INLAY STACK -->
  <text x="900" y="124" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">THE INLAY STACK</text>
  <rect x="700" y="150" width="400" height="42" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="720" y="176" font-size="13.5" fill="#291c0e">Protective overlay — durable topcoat</text>
  <rect x="700" y="198" width="400" height="54" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="720" y="221" font-size="13.5" fill="#291c0e">Aluminium antenna coil + NTAG 424 DNA die</text>
  <text x="720" y="240" font-size="12" fill="#5c5c5c">13.56 MHz · AES-128 SUN</text>
  <rect x="700" y="258" width="400" height="42" rx="6" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <text x="720" y="284" font-size="13.5" fill="#291c0e">Durable flexible substrate — survives lasting</text>
  <rect x="700" y="306" width="400" height="42" rx="6" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="2"/>
  <text x="720" y="332" font-size="13.5" fill="#8b2d2d">Tamper-evident adhesive — VOID on removal</text>

  <!-- shoebox tamper note -->
  <rect x="700" y="366" width="400" height="72" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="720" y="392" font-size="13.5" font-weight="700" fill="#2c5454">Shoebox-seal variant</text>
  <text x="720" y="412" font-size="12.5" fill="#3d6b6b">A tamper sticker on the box flap flags a</text>
  <text x="720" y="429" font-size="12.5" fill="#3d6b6b">swap-and-return before the resale intake scan.</text>

  <!-- BOTTOM: sizes + range -->
  <text x="600" y="486" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">STANDARD SIZES &amp; OPERATING RANGE</text>
  <rect x="110" y="504" width="300" height="94" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="130" y="536" font-size="16" font-weight="700" fill="#291c0e">Woven tongue label</text>
  <text x="130" y="561" font-size="13.5" fill="#3d6b6b">20 × 40 mm</text>
  <text x="130" y="583" font-size="12.5" fill="#5c5c5c">Visible athletic default</text>
  <rect x="450" y="504" width="300" height="94" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="470" y="536" font-size="16" font-weight="700" fill="#291c0e">Under-insole inlay</text>
  <text x="470" y="561" font-size="13.5" fill="#3d6b6b">12 × 19 mm</text>
  <text x="470" y="583" font-size="12.5" fill="#5c5c5c">Hidden, premium tier</text>
  <rect x="790" y="504" width="300" height="94" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="810" y="536" font-size="16" font-weight="700" fill="#291c0e">Operating range</text>
  <text x="810" y="561" font-size="13.5" fill="#3d6b6b">-25 °C to +85 °C</text>
  <text x="810" y="583" font-size="12.5" fill="#5c5c5c">Survives steam lasting</text>

  <text x="600" y="626" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Placement follows the hottest heat steps — post-lasting, pre-final-assembly — so the chip never sees the worst of it.</text>
</svg>
