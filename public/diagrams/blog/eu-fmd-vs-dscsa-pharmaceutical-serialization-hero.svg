<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="hTitle hDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="hTitle">One pack, two rulebooks — EU FMD vs US DSCSA</title>
  <desc id="hDesc">A single serialized pharmaceutical pack carries one shared GS1 2D DataMatrix, then splits into two verification models. On the left, EU FMD is centralized: the EMVO European Hub feeds each member state's National Medicines Verification System, and the pharmacy scans and decommissions the pack at the point of dispensing. On the right, US DSCSA is peer-to-peer: manufacturer, wholesaler and pharmacy exchange EPCIS 2.0 data directly and verify at every change of ownership. Designing the pack once satisfies both authorities and cuts per-region cost 30 to 50 percent.</desc>
  <defs>
    <radialGradient id="hBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <marker id="mkGold" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c39a5f"/></marker>
    <marker id="mkTeal" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#3d6b6b"/></marker>
  </defs>

  <rect width="1200" height="675" fill="url(#hBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="58" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="2" fill="#6d5a3a">ONE PACK, TWO RULEBOOKS</text>
  <text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The same GS1 2D DataMatrix — verified two very different ways</text>

  <!-- Shared pack -->
  <rect x="470" y="100" width="260" height="104" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="486" y="120" width="64" height="64" rx="6" fill="#ffffff" stroke="#291c0e" stroke-width="1.5"/>
  <g fill="#291c0e">
    <rect x="492" y="126" width="10" height="10"/><rect x="512" y="126" width="10" height="10"/><rect x="532" y="126" width="10" height="10"/>
    <rect x="502" y="136" width="10" height="10"/><rect x="522" y="136" width="10" height="10"/>
    <rect x="492" y="146" width="10" height="10"/><rect x="532" y="146" width="10" height="10"/><rect x="512" y="146" width="10" height="10"/>
    <rect x="502" y="166" width="10" height="10"/><rect x="522" y="156" width="10" height="10"/><rect x="532" y="166" width="10" height="10"/>
  </g>
  <text x="566" y="138" font-size="15" font-weight="800" fill="#291c0e">Serialized pack</text>
  <text x="566" y="160" font-size="12.5" fill="#6d5a3a">2D DataMatrix</text>
  <text x="566" y="179" font-size="12" fill="#4f4f4f">GTIN · serial · lot · expiry</text>
  <text x="600" y="228" text-anchor="middle" font-size="13.5" fill="#6d5a3a">One shared barcode carrier</text>

  <!-- split arrows -->
  <path d="M540 210 L332 300" fill="none" stroke="#c39a5f" stroke-width="2.4" marker-end="url(#mkGold)"/>
  <path d="M660 210 L868 300" fill="none" stroke="#c39a5f" stroke-width="2.4" marker-end="url(#mkGold)"/>

  <!-- ===== LEFT: EU FMD (teal, centralized) ===== -->
  <rect x="60" y="300" width="516" height="328" rx="16" fill="#f2f7f7" stroke="#b8d4d4" stroke-width="2"/>
  <rect x="76" y="316" width="484" height="42" rx="10" fill="#3d6b6b"/>
  <text x="92" y="343" font-size="15" font-weight="800" fill="#ffffff">EU FMD · EUROPE</text>
  <rect x="450" y="323" width="98" height="28" rx="14" fill="#2c5454"/>
  <text x="499" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Centralized</text>

  <rect x="100" y="378" width="436" height="46" rx="10" fill="#ffffff" stroke="#b8d4d4" stroke-width="1.5"/>
  <text x="120" y="406" font-size="14.5" fill="#291c0e">EMVO European Hub — one central registry</text>
  <path d="M318 424 L318 439" fill="none" stroke="#3d6b6b" stroke-width="2.2" marker-end="url(#mkTeal)"/>
  <rect x="100" y="440" width="436" height="46" rx="10" fill="#ffffff" stroke="#b8d4d4" stroke-width="1.5"/>
  <text x="120" y="468" font-size="14.5" fill="#291c0e">National NMVS — one per member state (30+)</text>
  <path d="M318 486 L318 501" fill="none" stroke="#3d6b6b" stroke-width="2.2" marker-end="url(#mkTeal)"/>
  <rect x="100" y="502" width="436" height="60" rx="10" fill="#e3efef" stroke="#3d6b6b" stroke-width="2"/>
  <text x="120" y="527" font-size="14.5" font-weight="800" fill="#1f3b3b">Pharmacy: scan + decommission</text>
  <text x="120" y="548" font-size="13" fill="#2c5454">at the point of dispensing</text>
  <text x="318" y="600" text-anchor="middle" font-size="13.5" fill="#2c5454">Verify once — at the very end.</text>

  <!-- ===== RIGHT: US DSCSA (navy, peer-to-peer) ===== -->
  <rect x="624" y="300" width="516" height="328" rx="16" fill="#eef4fa" stroke="#b6cbe0" stroke-width="2"/>
  <rect x="640" y="316" width="484" height="42" rx="10" fill="#1f4e79"/>
  <text x="656" y="343" font-size="15" font-weight="800" fill="#ffffff">US DSCSA · UNITED STATES</text>
  <rect x="1006" y="323" width="104" height="28" rx="14" fill="#163a5c"/>
  <text x="1058" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Peer-to-peer</text>

  <rect x="656" y="392" width="140" height="58" rx="10" fill="#ffffff" stroke="#b6cbe0" stroke-width="1.5"/>
  <text x="726" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3b5c">Manufacturer</text>
  <text x="812" y="428" text-anchor="middle" font-size="22" fill="#1f4e79">↔</text>
  <rect x="828" y="392" width="140" height="58" rx="10" fill="#ffffff" stroke="#b6cbe0" stroke-width="1.5"/>
  <text x="898" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3b5c">Wholesaler</text>
  <text x="984" y="428" text-anchor="middle" font-size="22" fill="#1f4e79">↔</text>
  <rect x="1000" y="392" width="140" height="58" rx="10" fill="#ffffff" stroke="#b6cbe0" stroke-width="1.5"/>
  <text x="1070" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3b5c">Pharmacy</text>

  <rect x="656" y="470" width="484" height="54" rx="10" fill="#dbe7f3" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="898" y="492" text-anchor="middle" font-size="13" font-weight="800" fill="#163a5c">EPCIS 2.0 + EDI · verify at every transfer</text>
  <text x="898" y="511" text-anchor="middle" font-size="12" fill="#1f4e79">and saleable return (GS1 / HDA VRS)</text>
  <text x="898" y="600" text-anchor="middle" font-size="13.5" fill="#1f4e79">Verify at every change of ownership.</text>

  <text x="600" y="646" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">Design the pack once, satisfy both authorities — and cut per-region cost 30–50%.</text>
</svg>
