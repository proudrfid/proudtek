<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Decision path: which NTAG chip should you buy?</title>
<desc id="d">A four-question flowchart. Question one: just one short URL, now and forever? Yes leads to NTAG213, the 95 percent answer. Question two: a few records, a full vCard or amiibo-style data? Yes leads to NTAG215 with 504 bytes of room. Question three: hundreds of bytes of configs, long text or local data? Yes leads to NTAG216 with 888 bytes. Question four: a fresh cryptographic URL on every single tap? Yes leads out of the family to NTAG 424 DNA — different chip, real crypto. A footer notes most buyers never get past the first question, which is the point.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<marker id="arw" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#5c5c5c"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FOUR QUESTIONS, ZERO REGRETS</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Be honest about the payload — it is shorter than you think</text>

<rect x="150" y="140" width="470" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="385" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#291c0e">Just one short URL,</text>
<text x="385" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#291c0e">now and forever?</text>
<line x1="620" y1="178" x2="700" y2="178" stroke="#5c5c5c" stroke-width="2.5" marker-end="url(#arw)"/>
<text x="660" y="168" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">YES</text>
<rect x="706" y="136" width="430" height="84" rx="14" fill="#f9f1e2" stroke="#c39a5f" stroke-width="2"/>
<text x="921" y="174" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="26" font-weight="700" fill="#6d5a3a">NTAG213</text>
<text x="921" y="200" text-anchor="middle" font-size="13" fill="#4f4f4f">the 95% answer — one short URL, done</text>

<line x1="385" y1="216" x2="385" y2="262" stroke="#5c5c5c" stroke-width="2.5" marker-end="url(#arw)"/>
<text x="401" y="245" font-size="12.5" font-weight="700" fill="#5c5c5c">NO</text>
<rect x="150" y="262" width="470" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="385" y="294" text-anchor="middle" font-size="15" font-weight="600" fill="#291c0e">A few records, a full vCard,</text>
<text x="385" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#291c0e">or amiibo-style data?</text>
<line x1="620" y1="300" x2="700" y2="300" stroke="#5c5c5c" stroke-width="2.5" marker-end="url(#arw)"/>
<text x="660" y="290" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">YES</text>
<rect x="706" y="258" width="430" height="84" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="921" y="296" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="26" font-weight="700" fill="#2c5454">NTAG215</text>
<text x="921" y="322" text-anchor="middle" font-size="13" fill="#4f4f4f">504 bytes of room — vCards, multi-record, amiibo</text>

<line x1="385" y1="338" x2="385" y2="384" stroke="#5c5c5c" stroke-width="2.5" marker-end="url(#arw)"/>
<text x="401" y="367" font-size="12.5" font-weight="700" fill="#5c5c5c">NO</text>
<rect x="150" y="384" width="470" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="385" y="416" text-anchor="middle" font-size="15" font-weight="600" fill="#291c0e">Hundreds of bytes —</text>
<text x="385" y="440" text-anchor="middle" font-size="15" font-weight="600" fill="#291c0e">configs, long text, local data?</text>
<line x1="620" y1="422" x2="700" y2="422" stroke="#5c5c5c" stroke-width="2.5" marker-end="url(#arw)"/>
<text x="660" y="412" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">YES</text>
<rect x="706" y="380" width="430" height="84" rx="14" fill="#eef1f5" stroke="#4a5568" stroke-width="2"/>
<text x="921" y="418" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="26" font-weight="700" fill="#4a5568">NTAG216</text>
<text x="921" y="444" text-anchor="middle" font-size="13" fill="#4f4f4f">888 bytes — the tag becomes the storage</text>

<line x1="385" y1="460" x2="385" y2="506" stroke="#5c5c5c" stroke-width="2.5" marker-end="url(#arw)"/>
<text x="401" y="489" font-size="12.5" font-weight="700" fill="#5c5c5c">NO</text>
<rect x="150" y="506" width="470" height="76" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="385" y="538" text-anchor="middle" font-size="15" font-weight="600" fill="#291c0e">A fresh cryptographic URL</text>
<text x="385" y="562" text-anchor="middle" font-size="15" font-weight="600" fill="#291c0e">on every single tap?</text>
<line x1="620" y1="544" x2="700" y2="544" stroke="#5c5c5c" stroke-width="2.5" marker-end="url(#arw)"/>
<text x="660" y="534" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">YES</text>
<rect x="706" y="502" width="430" height="84" rx="14" fill="#291c0e"/>
<text x="921" y="540" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="24" font-weight="700" fill="#d4a755">NTAG 424 DNA</text>
<text x="921" y="566" text-anchor="middle" font-size="12.5" fill="#f4efe4">you just left the 21x family — different chip, real crypto</text>

<text x="600" y="634" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Most buyers never get past the first question — that is the point.</text>
</svg>
