<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Why some NFC access cards clone and some do not</title>
<desc id="d">Two access-card families side by side. Clonable cards broadcast a fixed ID in the clear: the card sends an unencrypted ID, a skimmer captures it in about one second, and the ID is copied to a blank card — 125 kHz Prox and MIFARE Classic, copy tools under fifty dollars, and the reader cannot tell the clone from the original. Clone-resistant cards answer a cryptographic challenge: the reader sends a random challenge, the card replies with its secret AES key, and a wrong key produces no valid reply — DESFire EV3 and iCLASS SE or SEOS using AES-128 mutual authentication, where a copied UID alone is useless.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY SOME CARDS COPY AND SOME DO NOT</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">A plaintext ID can be replayed; a cryptographic handshake cannot.</text>

<!-- Panel A: clonable (risk) -->
<rect x="88" y="108" width="480" height="446" rx="14" fill="#ffffff" stroke="#e6c9c9" stroke-width="1.8"/>
<rect x="88" y="108" width="480" height="8" rx="4" fill="#8b2d2d"/>
<text x="328" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#8b2d2d">CLONABLE</text>
<text x="328" y="172" text-anchor="middle" font-size="12.5" fill="#5c5c5c">broadcasts a fixed ID in the clear</text>
<rect x="128" y="190" width="400" height="42" rx="8" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.3"/>
<text x="328" y="216" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Card sends a fixed ID, unencrypted</text>
<line x1="328" y1="232" x2="328" y2="246" stroke="#8b2d2d" stroke-width="2.5"/>
<polygon points="322,246 328,256 334,246" fill="#8b2d2d"/>
<rect x="128" y="256" width="400" height="42" rx="8" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.3"/>
<text x="328" y="282" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Skimmer captures it in ~1 second</text>
<line x1="328" y1="298" x2="328" y2="312" stroke="#8b2d2d" stroke-width="2.5"/>
<polygon points="322,312 328,322 334,312" fill="#8b2d2d"/>
<rect x="128" y="322" width="400" height="42" rx="8" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.3"/>
<text x="328" y="348" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">ID copied to a blank clone card</text>
<line x1="128" y1="386" x2="528" y2="386" stroke="#eadfce" stroke-width="1.5"/>
<circle cx="150" cy="414" r="5" fill="#8b2d2d"/>
<text x="166" y="419" font-size="13.5" fill="#333333">125 kHz Prox and MIFARE Classic</text>
<circle cx="150" cy="446" r="5" fill="#8b2d2d"/>
<text x="166" y="451" font-size="13.5" fill="#333333">Copy tools cost under $50</text>
<circle cx="150" cy="478" r="5" fill="#6d5a3a"/>
<text x="166" y="483" font-size="13.5" fill="#333333">Reader can't tell clone from original</text>

<!-- Panel B: clone-resistant (safe) -->
<rect x="632" y="108" width="480" height="446" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="632" y="108" width="480" height="8" rx="4" fill="#3d6b6b"/>
<text x="872" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">CLONE-RESISTANT</text>
<text x="872" y="172" text-anchor="middle" font-size="12.5" fill="#5c5c5c">answers a cryptographic challenge</text>
<rect x="672" y="190" width="400" height="42" rx="8" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="872" y="216" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Reader sends a random challenge</text>
<line x1="872" y1="232" x2="872" y2="246" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="866,246 872,256 878,246" fill="#3d6b6b"/>
<rect x="672" y="256" width="400" height="42" rx="8" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="872" y="282" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Card replies with its secret AES key</text>
<line x1="872" y1="298" x2="872" y2="312" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="866,312 872,322 878,312" fill="#3d6b6b"/>
<rect x="672" y="322" width="400" height="42" rx="8" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="872" y="348" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Wrong key produces no valid reply</text>
<line x1="672" y1="386" x2="1072" y2="386" stroke="#eadfce" stroke-width="1.5"/>
<circle cx="694" cy="414" r="5" fill="#1f6f3a"/>
<text x="710" y="419" font-size="13.5" fill="#333333">DESFire EV3 and iCLASS SE / SEOS</text>
<circle cx="694" cy="446" r="5" fill="#1f6f3a"/>
<text x="710" y="451" font-size="13.5" fill="#333333">AES-128 mutual authentication</text>
<circle cx="694" cy="478" r="5" fill="#6d5a3a"/>
<text x="710" y="483" font-size="13.5" fill="#333333">A copied UID alone is useless</text>

<text x="600" y="596" text-anchor="middle" font-size="14" fill="#5c5c5c">Same tap, two outcomes — the whole security story is which side of this line your cards sit on.</text>
</svg>
