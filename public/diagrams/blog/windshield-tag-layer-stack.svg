<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Cross-section of a windshield tag's layers and its two failure modes</title>
<desc id="d">A layered cross-section from cabin side to glass: a UV-stabilized PET face material, a glass-tuned copper antenna, a UHF chip, and a tamper-evident adhesive bonded to the windshield glass. Two failure-mode callouts: peeling the tag destroys the antenna trace (tamper-evident, by design), and years of UV exposure embrittle the face and adhesive. Notes: 90-110 by 30-40 mm, 0.3-0.8 mm thick, rated minus 40 to plus 85 Celsius, 3-5 year life.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TAG CONSTRUCTION &amp; TAMPER EVIDENCE</text>
<text x="600" y="86" text-anchor="middle" font-size="15" fill="#4f4f4f">A lot of engineering for something drivers file mentally under &#8216;sticker&#8217;.</text>
<!-- layer stack (left) -->
<rect x="150" y="150" width="470" height="52" rx="8" fill="#eef2f5" stroke="#bcc6d4" stroke-width="1.6"/>
<text x="176" y="182" text-anchor="start" font-size="15" font-weight="700" fill="#3a4557">UV-stabilized PET face material</text>
<rect x="150" y="212" width="470" height="52" rx="8" fill="#e8f0ee" stroke="#bcd2cc" stroke-width="1.6"/>
<text x="176" y="244" text-anchor="start" font-size="15" font-weight="700" fill="#2c5454">Glass-tuned copper antenna</text>
<rect x="150" y="274" width="470" height="52" rx="8" fill="#e6efe9" stroke="#bcd8c8" stroke-width="1.6"/>
<text x="176" y="306" text-anchor="start" font-size="15" font-weight="700" fill="#1b4332">UHF chip</text>
<rect x="386" y="286" width="30" height="28" rx="4" fill="#4a5568"/>
<rect x="150" y="336" width="470" height="52" rx="8" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="176" y="368" text-anchor="start" font-size="15" font-weight="700" fill="#6d5a3a">Tamper-evident adhesive</text>
<rect x="150" y="400" width="470" height="46" rx="8" fill="#dbe8e8" stroke="#9fb8b8" stroke-width="1.6"/>
<text x="385" y="429" text-anchor="middle" font-size="14" font-weight="800" fill="#2c5454">WINDSHIELD GLASS</text>
<!-- spec chips under stack -->
<rect x="150" y="470" width="150" height="32" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.3"/>
<text x="225" y="491" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4557">90-110 × 30-40 mm</text>
<rect x="312" y="470" width="140" height="32" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.3"/>
<text x="382" y="491" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4557">0.3-0.8 mm thick</text>
<rect x="464" y="470" width="156" height="32" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.3"/>
<text x="542" y="491" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4557">-40 to +85 °C</text>
<!-- failure modes (right) -->
<text x="690" y="176" text-anchor="start" font-size="14" font-weight="800" letter-spacing="0.4" fill="#8b2d2d">TWO WAYS THESE TAGS DIE</text>
<rect x="690" y="196" width="440" height="120" rx="14" fill="#fbf1f1" stroke="#e2b8b8" stroke-width="1.6"/>
<rect x="690" y="196" width="8" height="120" rx="4" fill="#8b2d2d"/>
<text x="720" y="232" text-anchor="start" font-size="16" font-weight="800" fill="#291c0e">Peeled off on purpose</text>
<text x="720" y="262" text-anchor="start" font-size="13.5" fill="#5c5c5c">The adhesive destroys the antenna trace on</text>
<text x="720" y="282" text-anchor="start" font-size="13.5" fill="#5c5c5c">removal — tamper-evident, and by design. No</text>
<text x="720" y="302" text-anchor="start" font-size="13.5" fill="#5c5c5c">transfer to another vehicle.</text>
<rect x="690" y="332" width="440" height="120" rx="14" fill="#fff7ec" stroke="#e4c98f" stroke-width="1.6"/>
<rect x="690" y="332" width="8" height="120" rx="4" fill="#c39a5f"/>
<text x="720" y="368" text-anchor="start" font-size="16" font-weight="800" fill="#291c0e">Baked off by the sun</text>
<text x="720" y="398" text-anchor="start" font-size="13.5" fill="#5c5c5c">Continuous UV embrittles the face and adhesive.</text>
<text x="720" y="418" text-anchor="start" font-size="13.5" fill="#5c5c5c">UV-stabilized materials hold a 3-5 year life on</text>
<text x="720" y="438" text-anchor="start" font-size="13.5" fill="#5c5c5c">an exposed automotive surface.</text>
<text x="600" y="560" text-anchor="middle" font-size="14" fill="#5c5c5c">Every layer is chosen to survive both — the peel test and the years of afternoon sun.</text>
</svg>
