<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NFC versus QR marketing engagement benchmarks and three real campaigns</title>
<desc id="d">Tap-through rate on equivalent placements: NFC runs 8 to 12 percent against QR at 2 to 3 percent. Three real campaigns follow. A beverage brand's festival coasters hit a 36 percent interaction rate, about twice the QR baseline. A global cosmetics brand measured plus 25 percent engagement versus its prior QR poster baseline. A luxury automotive bus-shelter campaign stayed 89 percent functional after six months outdoors and drove four times the bookings per dollar. QR still logs richer per-scan analytics, which is why the smart move is often printing both.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NFC VS QR · MEASURED, NOT CLAIMED</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Independent tap-through benchmarks, and three activations that were actually tracked.</text>

<text x="120" y="126" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8a6d34">TAP-THROUGH RATE ON EQUIVALENT PLACEMENTS</text>
<!-- NFC bar -->
<text x="120" y="171" font-size="16" font-weight="800" fill="#291c0e">NFC</text>
<rect x="220" y="148" width="474" height="34" rx="6" fill="#3d6b6b"/>
<rect x="694" y="148" width="237" height="34" rx="6" fill="#a9cccc"/>
<text x="948" y="172" font-size="15" font-weight="800" fill="#2c5454">8-12%</text>
<!-- QR bar -->
<text x="120" y="221" font-size="16" font-weight="800" fill="#291c0e">QR</text>
<rect x="220" y="198" width="119" height="34" rx="6" fill="#c39a5f"/>
<rect x="339" y="198" width="59" height="34" rx="6" fill="#e4c98f"/>
<text x="414" y="222" font-size="15" font-weight="800" fill="#8a6d34">2-3%</text>

<text x="120" y="284" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8a6d34">THREE REAL CAMPAIGNS THAT WERE TRACKED</text>

<!-- card 1 beverage -->
<rect x="64" y="300" width="336" height="214" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="64" y="300" width="336" height="7" rx="3.5" fill="#3d6b6b"/>
<text x="232" y="342" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">BEVERAGE · FESTIVAL</text>
<text x="232" y="404" text-anchor="middle" font-size="42" font-weight="800" fill="#3d6b6b">36%</text>
<text x="232" y="444" text-anchor="middle" font-size="13.5" fill="#4f6a6a">coaster interaction rate,</text>
<text x="232" y="466" text-anchor="middle" font-size="13.5" fill="#4f6a6a">about 2x the QR baseline</text>

<!-- card 2 cosmetics -->
<rect x="432" y="300" width="336" height="214" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="432" y="300" width="336" height="7" rx="3.5" fill="#3d6b6b"/>
<text x="600" y="342" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">GLOBAL COSMETICS</text>
<text x="600" y="404" text-anchor="middle" font-size="42" font-weight="800" fill="#3d6b6b">+25%</text>
<text x="600" y="444" text-anchor="middle" font-size="13.5" fill="#4f6a6a">engagement vs the prior</text>
<text x="600" y="466" text-anchor="middle" font-size="13.5" fill="#4f6a6a">QR poster baseline</text>

<!-- card 3 luxury auto -->
<rect x="800" y="300" width="336" height="214" rx="13" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="800" y="300" width="336" height="7" rx="3.5" fill="#c39a5f"/>
<text x="968" y="342" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8a6d34">LUXURY AUTO · OUTDOOR</text>
<text x="968" y="404" text-anchor="middle" font-size="42" font-weight="800" fill="#8a6d34">89%</text>
<text x="968" y="444" text-anchor="middle" font-size="13.5" fill="#7a6636">still working at 6 months,</text>
<text x="968" y="466" text-anchor="middle" font-size="13.5" fill="#7a6636">4x bookings per dollar</text>

<text x="600" y="560" text-anchor="middle" font-size="14.5" fill="#5c5c5c">QR still logs richer per-scan analytics — the honest reason to often print both.</text>
</svg>
