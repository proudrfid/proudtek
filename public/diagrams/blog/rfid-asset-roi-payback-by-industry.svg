<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID asset-tracking payback windows by industry, fastest first</title>
<desc id="d">A horizontal range chart of payback windows measured in months to payback, ordered fastest to slowest. Healthcare pays back in 6 to 12 months. IT asset management pays back in 8 to 14 months. Government and defense deployments are compliance-driven and typically under 12 months. Construction pays back in 8 to 16 months. Manufacturing pays back in 10 to 18 months. The axis runs from 0 to 18 months.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PAYBACK BY INDUSTRY</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">The fastest payback goes to whoever loses the most expensive things.</text>

<!-- gridlines -->
<line x1="200" y1="160" x2="200" y2="512" stroke="#efe7d6" stroke-width="1.6"/>
<line x1="355" y1="160" x2="355" y2="512" stroke="#f1ebdd" stroke-width="1.4"/>
<line x1="510" y1="160" x2="510" y2="512" stroke="#f1ebdd" stroke-width="1.4"/>
<line x1="665" y1="160" x2="665" y2="512" stroke="#f1ebdd" stroke-width="1.4"/>
<line x1="820" y1="160" x2="820" y2="512" stroke="#e4c98f" stroke-width="1.6" stroke-dasharray="4 5"/>
<line x1="975" y1="160" x2="975" y2="512" stroke="#f1ebdd" stroke-width="1.4"/>
<line x1="1130" y1="160" x2="1130" y2="512" stroke="#f1ebdd" stroke-width="1.4"/>
<text x="200" y="536" text-anchor="middle" font-size="12.5" fill="#8a8a8a">0</text>
<text x="355" y="536" text-anchor="middle" font-size="12.5" fill="#8a8a8a">3</text>
<text x="510" y="536" text-anchor="middle" font-size="12.5" fill="#8a8a8a">6</text>
<text x="665" y="536" text-anchor="middle" font-size="12.5" fill="#8a8a8a">9</text>
<text x="820" y="536" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a07d43">12</text>
<text x="975" y="536" text-anchor="middle" font-size="12.5" fill="#8a8a8a">15</text>
<text x="1130" y="536" text-anchor="middle" font-size="12.5" fill="#8a8a8a">18</text>
<text x="600" y="566" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.5" fill="#5c5c5c">MONTHS TO PAYBACK</text>

<!-- Row 1: Healthcare 6-12 -->
<text x="64" y="191" font-size="15.5" font-weight="700" fill="#291c0e">Healthcare</text>
<rect x="510" y="171" width="310" height="30" rx="8" fill="#3d6b6b"/>
<text x="806" y="191" text-anchor="end" font-size="15" font-weight="800" fill="#ffffff">6-12 mo</text>

<!-- Row 2: IT assets 8-14 -->
<text x="64" y="264" font-size="15.5" font-weight="700" fill="#291c0e">IT assets</text>
<rect x="613" y="244" width="310" height="30" rx="8" fill="#4a5568"/>
<text x="909" y="264" text-anchor="end" font-size="15" font-weight="800" fill="#ffffff">8-14 mo</text>

<!-- Row 3: Government (<=12, compliance-driven, ceiling) -->
<text x="64" y="337" font-size="15.5" font-weight="700" fill="#291c0e">Government</text>
<rect x="200" y="317" width="620" height="30" rx="8" fill="#faf3e2" stroke="#e4c98f" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="806" y="337" text-anchor="end" font-size="14.5" font-weight="800" fill="#a07d43">under 12 mo</text>

<!-- Row 4: Construction 8-16 -->
<text x="64" y="410" font-size="15.5" font-weight="700" fill="#291c0e">Construction</text>
<rect x="613" y="390" width="414" height="30" rx="8" fill="#2c5454"/>
<text x="1013" y="410" text-anchor="end" font-size="15" font-weight="800" fill="#ffffff">8-16 mo</text>

<!-- Row 5: Manufacturing 10-18 -->
<text x="64" y="483" font-size="15.5" font-weight="700" fill="#291c0e">Manufacturing</text>
<rect x="717" y="463" width="413" height="30" rx="8" fill="#4a5568"/>
<text x="1116" y="483" text-anchor="end" font-size="15" font-weight="800" fill="#ffffff">10-18 mo</text>

<text x="600" y="602" text-anchor="middle" font-size="14" fill="#4f4f4f">Benchmarks cluster by how painful the losses already are, not by company size.</text>
</svg>
