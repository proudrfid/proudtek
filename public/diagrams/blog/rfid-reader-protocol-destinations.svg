<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">One reader, three destinations — LLRP/MQTT/REST, Wiegand/OSDP, PC/SC</title>
<desc id="d">Routing diagram. A single RFID reader on the left fans out to three destination rooms on the right. Top: cloud and analytics — middleware, IoT hubs and event streams — reached over LLRP, MQTT or REST; LLRP is the pick if you might ever swap reader brands. Middle: the access panel — doors, turnstiles and elevator controllers — reached over Wiegand or OSDP; OSDP adds AES-128 over legacy Wiegand. Bottom: desktop apps — encoding stations, hotel PMS and kiosks — reached over PC/SC, which is native on Windows, macOS and Linux. Caption: choose by destination, not by datasheet — the wrong language buys you middleware or a vendor lock-in.</desc>
