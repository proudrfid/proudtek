<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Diversified keys: one master key derives a unique key per lock so one breach doesn't open the building</title>
<desc id="d">A master key at the top feeds an AES CMAC key-derivation step, which produces a different key for each lock. Three locks are shown, each with its own derived key. One lock is marked compromised in red, but the others stay secure because their keys are unrelated, so the breach is contained. A do-and-avoid strip at the bottom says to use MIFARE DESFire EV2 or EV3 and rotate master keys annually, and to avoid MIFARE Classic, whose Crypto-1 cipher is broken, and never to reuse one static key across locks.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">KEY MANAGEMENT · DIVERSIFIED KEYS</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">One master key derives a unique key per lock — so cracking one lock doesn't open the building.</text>

<!-- master key -->
<rect x="486" y="112" width="228" height="60" rx="12" fill="#f7edd6" stroke="#c39a5f" stroke-width="2.4"/>
<circle cx="500" cy="142" r="12" fill="none" stroke="#8a6d34" stroke-width="3"/>
<rect x="509" y="139" width="24" height="6" rx="2" fill="#8a6d34"/>
<text x="612" y="139" text-anchor="middle" font-size="15.5" font-weight="800" fill="#6d4d17">MASTER KEY</text>
<text x="600" y="160" text-anchor="middle" font-size="12" fill="#6d5a3a">held offline, rotated annually</text>

<!-- derivation pill -->
<line x1="600" y1="172" x2="600" y2="200" stroke="#c8b79a" stroke-width="2.4"/>
<rect x="452" y="200" width="296" height="44" rx="22" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="600" y="228" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">AES CMAC key derivation</text>

<!-- fan-out lines -->
<line x1="600" y1="244" x2="240" y2="298" stroke="#c8b79a" stroke-width="2"/>
<line x1="600" y1="244" x2="600" y2="298" stroke="#c8b79a" stroke-width="2"/>
<line x1="600" y1="244" x2="960" y2="298" stroke="#c8b79a" stroke-width="2"/>

<!-- lock A -->
<rect x="120" y="300" width="240" height="120" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<rect x="152" y="332" width="40" height="34" rx="6" fill="none" stroke="#1f6f3a" stroke-width="3"/>
<path d="M 160 332 A 12 12 0 0 1 184 332" fill="none" stroke="#1f6f3a" stroke-width="3"/>
<text x="240" y="342" font-size="15" font-weight="800" fill="#291c0e">Lock A</text>
<text x="240" y="364" font-size="12.5" fill="#5c5c5c">key A — unique</text>
<text x="212" y="398" font-size="12" font-weight="700" fill="#1f6f3a">secure</text>

<!-- lock B compromised -->
<rect x="480" y="300" width="240" height="120" rx="12" fill="#f7ecec" stroke="#d8a9a9" stroke-width="2"/>
<rect x="512" y="332" width="40" height="34" rx="6" fill="none" stroke="#8b2d2d" stroke-width="3"/>
<path d="M 520 332 A 12 12 0 0 1 544 332" fill="none" stroke="#8b2d2d" stroke-width="3" stroke-dasharray="4 4"/>
<text x="600" y="342" font-size="15" font-weight="800" fill="#291c0e">Lock B</text>
<text x="600" y="364" font-size="12.5" fill="#8b2d2d">key B — compromised</text>
<text x="572" y="398" font-size="12" font-weight="700" fill="#8b2d2d">breach contained here</text>

<!-- lock C -->
<rect x="840" y="300" width="240" height="120" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<rect x="872" y="332" width="40" height="34" rx="6" fill="none" stroke="#1f6f3a" stroke-width="3"/>
<path d="M 880 332 A 12 12 0 0 1 904 332" fill="none" stroke="#1f6f3a" stroke-width="3"/>
<text x="960" y="342" font-size="15" font-weight="800" fill="#291c0e">Lock C</text>
<text x="960" y="364" font-size="12.5" fill="#5c5c5c">key C — unaffected</text>
<text x="932" y="398" font-size="12" font-weight="700" fill="#1f6f3a">secure</text>

<!-- do / avoid -->
<rect x="120" y="464" width="480" height="150" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<text x="148" y="500" font-size="15" font-weight="800" fill="#1f6f3a">DO</text>
<text x="148" y="532" font-size="13.5" fill="#333333">• MIFARE DESFire EV2/EV3, AES-128 mutual auth</text>
<text x="148" y="562" font-size="13.5" fill="#333333">• Diversify keys with AES CMAC derivation</text>
<text x="148" y="592" font-size="13.5" fill="#333333">• Rotate master keys annually, backed up offline</text>

<rect x="620" y="464" width="460" height="150" rx="12" fill="#f7ecec" stroke="#d8a9a9" stroke-width="2"/>
<text x="648" y="500" font-size="15" font-weight="800" fill="#8b2d2d">AVOID</text>
<text x="648" y="532" font-size="13.5" fill="#333333">• MIFARE Classic — Crypto-1 is compromised</text>
<text x="648" y="562" font-size="13.5" fill="#333333">• UID-only authentication</text>
<text x="648" y="592" font-size="13.5" fill="#333333">• One static key reused across every lock</text>
</svg>
