<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five real reasons an RFID card stops working</title>
<desc id="d">Five labeled cards in a row, in rough order of how often each lands on a help desk. One, a broken bond wire at the chip-to-antenna joint. Two, a cracked antenna coil from repeated flexing. Three, expired encoding, which is intentional programming rather than damage. Four, a reader-side fault such as a dead lock battery or dirty reader. Five, a frequency mismatch between a 125 kHz card and a 13.56 MHz reader. None of them is demagnetization.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT ACTUALLY KILLS A CARD</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Five failure modes — none of them magnetic — in order of help-desk frequency.</text>

<!-- CARD 1: bond wire -->
<rect x="52" y="150" width="196" height="392" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="52" y="150" width="196" height="8" rx="4" fill="#8b2d2d"/>
<circle cx="150" cy="196" r="17" fill="#f7e7e7" stroke="#8b2d2d" stroke-width="1.6"/>
<text x="150" y="201" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2d2d">1</text>
<rect x="118" y="250" width="64" height="52" rx="7" fill="#f4eee6" stroke="#4a5568" stroke-width="2"/>
<line x1="150" y1="276" x2="132" y2="258" stroke="#8b2d2d" stroke-width="2.4"/>
<line x1="132" y1="258" x2="150" y2="266" stroke="#8b2d2d" stroke-width="2.4"/>
<line x1="150" y1="266" x2="134" y2="276" stroke="#8b2d2d" stroke-width="2.4"/>
<line x1="182" y1="276" x2="200" y2="276" stroke="#4a5568" stroke-width="2.4"/>
<text x="150" y="352" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Broken bond wire</text>
<text x="150" y="392" text-anchor="middle" font-size="12.5" fill="#5c5c5c">The chip-to-antenna</text>
<text x="150" y="410" text-anchor="middle" font-size="12.5" fill="#5c5c5c">joint snaps when the</text>
<text x="150" y="428" text-anchor="middle" font-size="12.5" fill="#5c5c5c">card is bent or sat on.</text>
<text x="150" y="500" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.5" fill="#8b2d2d">MECHANICAL</text>

<!-- CARD 2: antenna crack -->
<rect x="278" y="150" width="196" height="392" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="278" y="150" width="196" height="8" rx="4" fill="#8b2d2d"/>
<circle cx="376" cy="196" r="17" fill="#f7e7e7" stroke="#8b2d2d" stroke-width="1.6"/>
<text x="376" y="201" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2d2d">2</text>
<rect x="338" y="248" width="76" height="56" rx="8" fill="none" stroke="#4a5568" stroke-width="2.2"/>
<rect x="350" y="260" width="52" height="32" rx="5" fill="none" stroke="#8a94a3" stroke-width="1.6"/>
<line x1="376" y1="240" x2="376" y2="312" stroke="#f7e7e7" stroke-width="6"/>
<line x1="376" y1="242" x2="370" y2="266" stroke="#8b2d2d" stroke-width="2.4"/>
<line x1="370" y1="266" x2="382" y2="288" stroke="#8b2d2d" stroke-width="2.4"/>
<line x1="382" y1="288" x2="376" y2="310" stroke="#8b2d2d" stroke-width="2.4"/>
<text x="376" y="352" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Cracked antenna</text>
<text x="376" y="392" text-anchor="middle" font-size="12.5" fill="#5c5c5c">The coil fractures</text>
<text x="376" y="410" text-anchor="middle" font-size="12.5" fill="#5c5c5c">from repeated flexing;</text>
<text x="376" y="428" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the chip loses power.</text>
<text x="376" y="500" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.5" fill="#8b2d2d">MECHANICAL</text>

<!-- CARD 3: encoding expired -->
<rect x="504" y="150" width="196" height="392" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="504" y="150" width="196" height="8" rx="4" fill="#c39a5f"/>
<circle cx="602" cy="196" r="17" fill="#f7edd6" stroke="#a07d43" stroke-width="1.6"/>
<text x="602" y="201" text-anchor="middle" font-size="16" font-weight="800" fill="#a07d43">3</text>
<circle cx="602" cy="276" r="30" fill="none" stroke="#a07d43" stroke-width="2.4"/>
<line x1="602" y1="276" x2="602" y2="256" stroke="#a07d43" stroke-width="2.4"/>
<line x1="602" y1="276" x2="617" y2="284" stroke="#a07d43" stroke-width="2.4"/>
<text x="602" y="352" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Encoding expired</text>
<text x="602" y="392" text-anchor="middle" font-size="12.5" fill="#5c5c5c">The access period</text>
<text x="602" y="410" text-anchor="middle" font-size="12.5" fill="#5c5c5c">ended on schedule —</text>
<text x="602" y="428" text-anchor="middle" font-size="12.5" fill="#5c5c5c">by design, not fault.</text>
<text x="602" y="500" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.5" fill="#a07d43">INTENTIONAL</text>

<!-- CARD 4: reader-side -->
<rect x="730" y="150" width="196" height="392" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="730" y="150" width="196" height="8" rx="4" fill="#4a5568"/>
<circle cx="828" cy="196" r="17" fill="#eef1f5" stroke="#4a5568" stroke-width="1.6"/>
<text x="828" y="201" text-anchor="middle" font-size="16" font-weight="800" fill="#4a5568">4</text>
<rect x="800" y="246" width="56" height="60" rx="8" fill="#eef1f5" stroke="#4a5568" stroke-width="2"/>
<circle cx="828" cy="270" r="10" fill="none" stroke="#4a5568" stroke-width="2"/>
<rect x="812" y="290" width="32" height="8" rx="2" fill="#8b2d2d"/>
<text x="828" y="352" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Reader-side fault</text>
<text x="828" y="392" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Dead lock battery,</text>
<text x="828" y="410" text-anchor="middle" font-size="12.5" fill="#5c5c5c">dirty antenna, or a</text>
<text x="828" y="428" text-anchor="middle" font-size="12.5" fill="#5c5c5c">config change. Card OK.</text>
<text x="828" y="500" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.5" fill="#4a5568">READER-SIDE</text>

<!-- CARD 5: frequency mismatch -->
<rect x="956" y="150" width="196" height="392" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="956" y="150" width="196" height="8" rx="4" fill="#4a5568"/>
<circle cx="1054" cy="196" r="17" fill="#eef1f5" stroke="#4a5568" stroke-width="1.6"/>
<text x="1054" y="201" text-anchor="middle" font-size="16" font-weight="800" fill="#4a5568">5</text>
<path d="M 992 268 q 11 -20 22 0 q 11 20 22 0" fill="none" stroke="#4a5568" stroke-width="2.4"/>
<path d="M 992 292 q 5.5 -16 11 0 q 5.5 16 11 0 q 5.5 -16 11 0 q 5.5 16 11 0" fill="none" stroke="#8a94a3" stroke-width="2.4"/>
<text x="1054" y="352" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Wrong frequency</text>
<text x="1054" y="392" text-anchor="middle" font-size="12.5" fill="#5c5c5c">A 125 kHz card on a</text>
<text x="1054" y="410" text-anchor="middle" font-size="12.5" fill="#5c5c5c">13.56 MHz reader can't</text>
<text x="1054" y="428" text-anchor="middle" font-size="12.5" fill="#5c5c5c">be read at all.</text>
<text x="1054" y="500" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.5" fill="#4a5568">MISMATCH</text>
</svg>
