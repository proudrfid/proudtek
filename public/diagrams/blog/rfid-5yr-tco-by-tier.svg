<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five-year RFID total cost of ownership by deployment tier</title>
<desc id="d">Four deployment tiers with first-year and five-year total cost of ownership. Tier A single-facility small program, 1 to 3 read points and under 50,000 tags a year: Year 1 12,000 to 38,000 dollars, five-year TCO 32,000 to 98,000 dollars. Tier B multi-zone facility, 4 to 12 read points and 100,000 to 500,000 tags a year: Year 1 80,000 to 260,000 dollars, five-year TCO 180,000 to 580,000 dollars. Tier C enterprise multi-site, 50 plus read points and millions of tags: Year 1 400,000 to 1.8 million dollars, five-year TCO 1 million to 3.8 million dollars. Tier D distributed retail compliance such as Walmart, Macy's and John Lewis programs: tag-dominated at roughly 0.06 to 0.12 dollars per unit shipped.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE-YEAR TCO BY DEPLOYMENT TIER</text>
<text x="600" y="80" text-anchor="middle" font-size="15.5" fill="#4f4f4f">A defensible template to sense-check any vendor proposal.</text>
<text x="620" y="118" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a7a55">SCALE</text>
<text x="726" y="118" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a7a55">YEAR 1</text>
<text x="972" y="118" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a7a55">5-YEAR TCO</text>

<rect x="64" y="126" width="1072" height="96" rx="12" fill="#f2f4f7" stroke="#c3ccd7" stroke-width="1.4"/>
<circle cx="112" cy="174" r="30" fill="#8a94a2"/>
<text x="112" y="184" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">A</text>
<text x="162" y="164" font-size="16.5" font-weight="800" fill="#291c0e">Single facility · small program</text>
<text x="162" y="188" font-size="12.5" fill="#5c6470">1-3 read points · under 50K tags / year</text>
<rect x="616" y="152" width="220" height="44" rx="22" fill="#eef1f5" stroke="#b3bcc9" stroke-width="1.3"/>
<text x="726" y="180" text-anchor="middle" font-size="15" font-weight="800" fill="#4a5568">$12K-$38K</text>
<rect x="852" y="152" width="252" height="44" rx="22" fill="#e4e8ee" stroke="#9aa3b1" stroke-width="1.4"/>
<text x="978" y="180" text-anchor="middle" font-size="16" font-weight="800" fill="#3a4353">$32K-$98K</text>

<rect x="64" y="230" width="1072" height="96" rx="12" fill="#eaeef3" stroke="#b3bcc9" stroke-width="1.4"/>
<circle cx="112" cy="278" r="30" fill="#5c6879"/>
<text x="112" y="288" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">B</text>
<text x="162" y="268" font-size="16.5" font-weight="800" fill="#291c0e">Multi-zone facility</text>
<text x="162" y="292" font-size="12.5" fill="#5c6470">4-12 read points · 100K-500K tags / year</text>
<rect x="616" y="256" width="220" height="44" rx="22" fill="#eef1f5" stroke="#b3bcc9" stroke-width="1.3"/>
<text x="726" y="284" text-anchor="middle" font-size="15" font-weight="800" fill="#4a5568">$80K-$260K</text>
<rect x="852" y="256" width="252" height="44" rx="22" fill="#dbe1e9" stroke="#8a94a2" stroke-width="1.4"/>
<text x="978" y="284" text-anchor="middle" font-size="16" font-weight="800" fill="#3a4353">$180K-$580K</text>

<rect x="64" y="334" width="1072" height="96" rx="12" fill="#e1e6ee" stroke="#a3aebd" stroke-width="1.4"/>
<circle cx="112" cy="382" r="30" fill="#4a5568"/>
<text x="112" y="392" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">C</text>
<text x="162" y="372" font-size="16.5" font-weight="800" fill="#291c0e">Enterprise multi-site</text>
<text x="162" y="396" font-size="12.5" fill="#5c6470">50+ read points · millions of tags / year · 5+ sites</text>
<rect x="616" y="360" width="220" height="44" rx="22" fill="#eef1f5" stroke="#b3bcc9" stroke-width="1.3"/>
<text x="726" y="388" text-anchor="middle" font-size="15" font-weight="800" fill="#4a5568">$400K-$1.8M</text>
<rect x="852" y="360" width="252" height="44" rx="22" fill="#cdd5e0" stroke="#7a8598" stroke-width="1.4"/>
<text x="978" y="388" text-anchor="middle" font-size="16" font-weight="800" fill="#31394a">$1M-$3.8M</text>

<rect x="64" y="438" width="1072" height="96" rx="12" fill="#f7edd6" stroke="#e0c084" stroke-width="1.4"/>
<circle cx="112" cy="486" r="30" fill="#c39a5f"/>
<text x="112" y="496" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">D</text>
<text x="162" y="476" font-size="16.5" font-weight="800" fill="#291c0e">Distributed retail compliance</text>
<text x="162" y="500" font-size="12.5" fill="#7a6a45">Walmart, Macy's, John Lewis programs — tag cost dominates</text>
<rect x="616" y="464" width="220" height="44" rx="22" fill="#f3e6c9" stroke="#e0c084" stroke-width="1.3"/>
<text x="726" y="492" text-anchor="middle" font-size="14" font-weight="800" fill="#8a6d34">tag-dominated</text>
<rect x="852" y="464" width="252" height="44" rx="22" fill="#f0dcb0" stroke="#d0aa6a" stroke-width="1.4"/>
<text x="978" y="492" text-anchor="middle" font-size="15" font-weight="800" fill="#7a5f2c">$0.06-$0.12 / unit</text>

<text x="600" y="576" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Five-year TCO — not year one — is what separates the cheap-looking proposal from the honest one.</text>
</svg>
