<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The anatomy of an LED RFID tag and its two operating modes</title>
<desc id="d">On the left, an annotated LED RFID tag shows three parts: a UHF chip and antenna, a CR2032 coin-cell battery, and an LED indicator. On the right, two panels describe the two modes. Passive mode, for identification: the reader interrogates the tag, which returns its EPC at a read range of 2 to 10 meters, powered by the reader's RF field. LED mode, for location: the reader sends a command to one EPC and the LED flashes at 1 to 2 hertz for 10 to 60 seconds, visible at 5 to 15 meters and powered by the CR2032 cell. Only the LED mode draws on the battery.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE TAG, TWO MODES</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Passive UHF to identify it; a battery-driven LED to locate it.</text>

<!-- ANATOMY (left) -->
<rect x="96" y="176" width="408" height="212" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="2.4"/>
<rect x="120" y="204" width="176" height="156" rx="10" fill="none" stroke="#4a5568" stroke-width="2.6"/>
<rect x="144" y="228" width="128" height="108" rx="7" fill="none" stroke="#4a5568" stroke-width="2"/>
<rect x="188" y="264" width="40" height="30" rx="4" fill="#4a5568"/>
<text x="208" y="284" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">IC</text>
<circle cx="372" cy="248" r="40" fill="#e7eaef" stroke="#9aa3ad" stroke-width="2.6"/>
<text x="372" y="253" text-anchor="middle" font-size="14" font-weight="800" fill="#4a5568">CR2032</text>
<circle cx="404" cy="330" r="22" fill="#d4a755" stroke="#ffffff" stroke-width="2.4"/>
<circle cx="396" cy="322" r="6" fill="#fff2cf"/>

<circle cx="208" cy="264" r="4" fill="#4a5568"/>
<text x="120" y="424" font-size="14.5" font-weight="800" fill="#4a5568">UHF chip + antenna</text>
<text x="300" y="424" font-size="14.5" font-weight="800" fill="#4a5568">CR2032 cell</text>
<text x="120" y="452" font-size="13.5" fill="#5c5c5c">reads &amp; returns the EPC</text>
<text x="300" y="452" font-size="13.5" fill="#5c5c5c">powers the LED only</text>
<text x="120" y="500" font-size="14.5" font-weight="800" fill="#6d5a3a">LED indicator</text>
<text x="120" y="524" font-size="13.5" fill="#5c5c5c">the visible "here it is" flash</text>

<!-- PASSIVE panel -->
<rect x="560" y="150" width="560" height="200" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="560" y="150" width="560" height="8" rx="4" fill="#3d6b6b"/>
<text x="588" y="194" font-size="16" font-weight="800" letter-spacing="0.5" fill="#2c5454">PASSIVE MODE · IDENTIFY</text>
<text x="588" y="230" font-size="15" fill="#33404f">Reader interrogates → tag returns its EPC.</text>
<text x="588" y="264" font-size="15" fill="#33404f">Read range 2-10 m.</text>
<text x="588" y="298" font-size="15" fill="#33404f">Powered by the reader's RF field — no battery.</text>
<text x="588" y="328" font-size="13" fill="#8a8a8a">Behaves like any standard UHF RFID tag.</text>

<!-- LED panel -->
<rect x="560" y="372" width="560" height="200" rx="14" fill="#fffaf0" stroke="#e4c98f" stroke-width="2"/>
<rect x="560" y="372" width="560" height="8" rx="4" fill="#c39a5f"/>
<text x="588" y="416" font-size="16" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">LED MODE · LOCATE</text>
<text x="588" y="452" font-size="15" fill="#33404f">Reader commands one EPC → its LED flashes.</text>
<text x="588" y="486" font-size="15" fill="#33404f">1-2 Hz, for a set 10-60 s.</text>
<text x="588" y="520" font-size="15" fill="#33404f">Visible 5-15 m · powered by the CR2032 cell.</text>
<text x="588" y="550" font-size="13" fill="#a07d43">Red, green or blue can flag pick, put-away or hold.</text>

<text x="600" y="618" text-anchor="middle" font-size="15" fill="#4f4f4f">Same tag, two questions: "what is it?" runs for free; "where is it?" spends a little battery.</text>
</svg>
