<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="crTitle crDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="crTitle">The five ROI channels of item-level NFC on cosmetics</title>
  <desc id="crDesc">Item-level NFC on cosmetics returns value through five channels at once. First, counterfeit detection: tagged products examined at customs and on gray-market platforms yield a verifiable counterfeit count that converts to recovered sales. Second, repurchase lift of 12 to 25 percent versus non-tappers. Third, refill conversion 35 to 55 percent higher when packaging carries NFC plus a repurchase prompt. Fourth, CRM list growth as 20 to 40 percent of tappers register an email or account. Fifth, margin recovery of 1 to 3 percent of revenue returned to authorized channels by controlling gray-market diversion.</desc>
  <defs>
    <radialGradient id="crBg" cx="50%" cy="12%" r="95%"><stop offset="0%" stop-color="#f8f1e2"/><stop offset="100%" stop-color="#f2ece0"/></radialGradient>
    <linearGradient id="crGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9c084"/><stop offset="1" stop-color="#9a8a66"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#crBg)"/>
  <text x="600" y="58" text-anchor="middle" font-size="15" letter-spacing="3" fill="#9a8a66">MULTI-CHANNEL ROI · CFO + CMO TOGETHER</text>
  <text x="600" y="94" text-anchor="middle" font-size="29" font-weight="700" fill="#291c0e">One tag, five ways to pay for itself</text>

  <!-- 5 cards -->
  <!-- card template positions: x = 60,280,500,720,940 -->
  <g>
    <!-- 1 -->
    <rect x="60" y="150" width="200" height="400" rx="18" fill="#fffaf0" stroke="#e6d4b4"/>
    <circle cx="160" cy="216" r="34" fill="#eef3ec" stroke="#cfe0d3"/>
    <path d="M146 216 l9 10 18 -22" fill="none" stroke="#2d6a4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#2d6a4f">Verifiable</text>
    <text x="160" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#2d6a4f">count</text>
    <text x="160" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Counterfeit</text>
    <text x="160" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">detection</text>
    <text x="160" y="466" text-anchor="middle" font-size="12.5" fill="#6b6259">Customs &amp; marketplace</text>
    <text x="160" y="484" text-anchor="middle" font-size="12.5" fill="#6b6259">counts → recovered</text>
    <text x="160" y="502" text-anchor="middle" font-size="12.5" fill="#6b6259">legitimate sales</text>

    <!-- 2 -->
    <rect x="280" y="150" width="200" height="400" rx="18" fill="#fffaf0" stroke="#e6d4b4"/>
    <circle cx="380" cy="216" r="34" fill="#f6efe0" stroke="#e3d3b3"/>
    <path d="M366 228 l10 -12 8 8 12 -16" fill="none" stroke="#b79a52" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="380" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#291c0e">12–25%</text>
    <text x="380" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Repurchase</text>
    <text x="380" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">lift</text>
    <text x="380" y="466" text-anchor="middle" font-size="12.5" fill="#6b6259">More frequent buys</text>
    <text x="380" y="484" text-anchor="middle" font-size="12.5" fill="#6b6259">vs non-tappers, via</text>
    <text x="380" y="502" text-anchor="middle" font-size="12.5" fill="#6b6259">restock reminders</text>

    <!-- 3 -->
    <rect x="500" y="150" width="200" height="400" rx="18" fill="#fffaf0" stroke="#e6d4b4"/>
    <circle cx="600" cy="216" r="34" fill="#f6efe0" stroke="#e3d3b3"/>
    <path d="M588 206 a12 12 0 1 1 -4 9 M584 215 v-8 h8" fill="none" stroke="#b79a52" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#291c0e">35–55%</text>
    <text x="600" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Refill</text>
    <text x="600" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">conversion</text>
    <text x="600" y="466" text-anchor="middle" font-size="12.5" fill="#6b6259">Higher refill-vs-</text>
    <text x="600" y="484" text-anchor="middle" font-size="12.5" fill="#6b6259">replace with NFC +</text>
    <text x="600" y="502" text-anchor="middle" font-size="12.5" fill="#6b6259">repurchase prompt</text>

    <!-- 4 -->
    <rect x="720" y="150" width="200" height="400" rx="18" fill="#fffaf0" stroke="#e6d4b4"/>
    <circle cx="820" cy="216" r="34" fill="#f6efe0" stroke="#e3d3b3"/>
    <circle cx="820" cy="209" r="7" fill="none" stroke="#b79a52" stroke-width="4"/>
    <path d="M806 230 a14 10 0 0 1 28 0" fill="none" stroke="#b79a52" stroke-width="4" stroke-linecap="round"/>
    <text x="820" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#291c0e">20–40%</text>
    <text x="820" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">CRM list</text>
    <text x="820" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">growth</text>
    <text x="820" y="466" text-anchor="middle" font-size="12.5" fill="#6b6259">Tappers who register</text>
    <text x="820" y="484" text-anchor="middle" font-size="12.5" fill="#6b6259">email or account — at</text>
    <text x="820" y="502" text-anchor="middle" font-size="12.5" fill="#6b6259">~zero acquisition cost</text>

    <!-- 5 -->
    <rect x="940" y="150" width="200" height="400" rx="18" fill="#fffaf0" stroke="#e6d4b4"/>
    <circle cx="1040" cy="216" r="34" fill="#fbeee4" stroke="#e6c8b6"/>
    <text x="1040" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#a96b58">$</text>
    <text x="1040" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#a96b58">1–3%</text>
    <text x="1040" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Margin</text>
    <text x="1040" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">recovery</text>
    <text x="1040" y="466" text-anchor="middle" font-size="12.5" fill="#6b6259">Of revenue returned</text>
    <text x="1040" y="484" text-anchor="middle" font-size="12.5" fill="#6b6259">to authorized channels</text>
    <text x="1040" y="502" text-anchor="middle" font-size="12.5" fill="#6b6259">— covers year-1 cost</text>
  </g>
  <text x="600" y="600" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#4f4535">The chip pays for the security; the tap pays for everything else.</text>
</svg>
