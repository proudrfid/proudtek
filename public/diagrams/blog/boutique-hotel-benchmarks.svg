<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="bmTitle bmDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="bmTitle">This property against industry benchmarks</title>
  <desc id="bmDesc">Four benchmark comparisons, industry versus this property. Mobile-key consumable saving, per OpenKey and Canary Technologies: about 1,000 dollars a month industry-wide versus about 335 dollars a month here on a 78-room property with no mobile key yet. Lost-key replacement cost, from a published 250-room, 80 percent occupancy, 50 percent return scenario: over 18,000 dollars a year, scaling to about 5,600 dollars modeled here against 4,020 dollars actually measured. Check-in wait and lost keys, per IJFMR and Hotel Tech Report: 40 percent-plus wait reduction and 85 percent fewer lost keys industry-wide, versus a 14-point NPS lift here on an already-fast baseline. And a missed opportunity: mobile key was not specified at install, where about 25 percent of arrivals could skip the front desk, an estimated 4 to 6 thousand dollars a year left on the table. Salto JustIN retrofits the AElement Fusion via firmware, scoped for the 2026 capex cycle.</desc>

  <defs>
    <radialGradient id="bmBg" cx="50%" cy="18%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="bmDark" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bmBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#6d5a3a">THIS PROPERTY vs INDUSTRY BENCHMARKS</text>

  <!-- Column headers -->
  <text x="662" y="118" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.2" fill="#6d5a3a">BENCHMARK · INDUSTRY</text>
  <text x="985" y="118" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.2" fill="#1f6f3a">THIS PROPERTY</text>

  <!-- Row 1 -->
  <rect x="60" y="130" width="1080" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="88" y="165" font-size="18" font-weight="800" fill="#291c0e">Mobile-key consumable saving</text>
  <text x="88" y="189" font-size="14.5" fill="#4f4f4f">OpenKey / Canary Technologies</text>
  <text x="662" y="178" text-anchor="middle" font-size="21" font-weight="800" fill="#4f4f4f">~$1,000 / mo</text>
  <text x="985" y="172" text-anchor="middle" font-size="21" font-weight="800" fill="#1f6f3a">~$335 / mo</text>
  <text x="985" y="193" text-anchor="middle" font-size="13" fill="#3f6b4e">78 rooms, no mobile key yet</text>

  <!-- Row 2 -->
  <rect x="60" y="220" width="1080" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="88" y="255" font-size="18" font-weight="800" fill="#291c0e">Lost-key replacement cost</text>
  <text x="88" y="279" font-size="14.5" fill="#4f4f4f">published 250-room · 80% occ · 50% return</text>
  <text x="662" y="268" text-anchor="middle" font-size="21" font-weight="800" fill="#4f4f4f">&gt;$18,000 / yr</text>
  <text x="985" y="262" text-anchor="middle" font-size="21" font-weight="800" fill="#1f6f3a">~$5,600 modeled</text>
  <text x="985" y="283" text-anchor="middle" font-size="13" fill="#3f6b4e">$4,020 actually measured</text>

  <!-- Row 3 -->
  <rect x="60" y="310" width="1080" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="88" y="345" font-size="18" font-weight="800" fill="#291c0e">Check-in wait &amp; lost keys</text>
  <text x="88" y="369" font-size="14.5" fill="#4f4f4f">IJFMR · Hotel Tech Report</text>
  <text x="662" y="358" text-anchor="middle" font-size="19" font-weight="800" fill="#4f4f4f">40%+ wait ↓ · 85% keys ↓</text>
  <text x="985" y="352" text-anchor="middle" font-size="21" font-weight="800" fill="#1f6f3a">+14 NPS lift</text>
  <text x="985" y="373" text-anchor="middle" font-size="13" fill="#3f6b4e">already-fast baseline</text>

  <!-- Row 4 : missed opportunity -->
  <rect x="60" y="400" width="1080" height="80" rx="14" fill="#f6ede0" stroke="#c39a5f" stroke-width="2.5"/>
  <rect x="88" y="414" width="86" height="24" rx="12" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="131" y="431" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#8a5a1a">MISSED</text>
  <text x="186" y="433" font-size="18" font-weight="800" fill="#291c0e">Mobile key not specified at install</text>
  <text x="88" y="463" font-size="14.5" fill="#4f4f4f">Salto JustIN — retrofits AElement Fusion via firmware</text>
  <text x="662" y="448" text-anchor="middle" font-size="21" font-weight="800" fill="#4f4f4f">~25% skip desk</text>
  <text x="985" y="448" text-anchor="middle" font-size="21" font-weight="800" fill="#b4802a">est. $4–6K / yr</text>
  <text x="985" y="469" text-anchor="middle" font-size="13" fill="#8a5a1a">left on the table</text>

  <!-- Forward-looking band -->
  <rect x="60" y="502" width="1080" height="58" rx="14" fill="url(#bmDark)"/>
  <text x="600" y="538" text-anchor="middle" font-size="16.5" font-weight="700" fill="#d4a755">Next up: layer Salto JustIN mobile key onto the existing locks — scoped for the 2026 capex cycle.</text>

  <text x="600" y="600" text-anchor="middle" font-size="16.5" fill="#6d5a3a">Not an outlier — the results line up with the published benchmarks, and in places beat them.</text>
</svg>
