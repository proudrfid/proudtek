<text x="234" y="250" text-anchor="middle" font-size="12.5" fill="#4f4f4f">bulk, distance, volume</text>
<rect x="84" y="268" width="300" height="34" rx="17" fill="#ffffff" stroke="#4a5568"/>
<text x="234" y="290" text-anchor="middle" font-size="13.5" fill="#291c0e">warehouse dock-door portals</text>
<rect x="84" y="312" width="300" height="34" rx="17" fill="#ffffff" stroke="#4a5568"/>
<text x="234" y="334" text-anchor="middle" font-size="13.5" fill="#291c0e">retail item-level counting</text>
