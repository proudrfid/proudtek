<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The ESPR delegated-act timeline as a queue of EU Digital Product Passport deadlines</title>
<desc id="d">A vertical timeline of milestones. March 2026, CEN/CENELEC harmonised standards under mandate M/616. 19 July 2026, the EU DPP digital registry goes live. 2026, iron and steel as the first ESPR product-specific act. 18 February 2027, battery passports go live under Regulation (EU) 2023/1542. 2027, the textiles act, with compliance around 2028 to 2029. 2028, furniture. 2028 to 2029, electronics. Infrastructure dates hold while product dates slip, but the order is the reliable part.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ESPR DELEGATED-ACT TIMELINE</text>
<text x="600" y="104" text-anchor="middle" font-size="34" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">A queue of deadlines, not a single date</text>

<line x1="300" y1="164" x2="300" y2="600" stroke="#cbb994" stroke-width="3"/>

<text x="276" y="190" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">Mar 2026</text>
<circle cx="300" cy="185" r="11" fill="#3d6b6b"/>
<text x="332" y="190" font-size="15" fill="#4f4f4f">CEN/CENELEC harmonised standards (M/616)</text>

<text x="276" y="260" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">19 Jul 2026</text>
<circle cx="300" cy="255" r="11" fill="#c39a5f"/>
<text x="332" y="260" font-size="15" fill="#4f4f4f">EU DPP digital registry goes live</text>

<text x="276" y="330" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">2026</text>
<circle cx="300" cy="325" r="11" fill="#3d6b6b"/>
<text x="332" y="330" font-size="15" fill="#4f4f4f">Iron &amp; steel — first ESPR product act</text>

<text x="276" y="400" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">18 Feb 2027</text>
<circle cx="300" cy="395" r="12" fill="#2d6a4f"/>
<text x="332" y="400" font-size="15" font-weight="700" fill="#291c0e">Battery passports — Reg (EU) 2023/1542</text>

<text x="276" y="470" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">2027</text>
<circle cx="300" cy="465" r="11" fill="#2d6a4f"/>
<text x="332" y="470" font-size="15" fill="#4f4f4f">Textiles act — compliance ~2028–2029</text>

<text x="276" y="540" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">2028</text>
<circle cx="300" cy="535" r="11" fill="#3d6b6b"/>
<text x="332" y="540" font-size="15" fill="#4f4f4f">Furniture</text>

<text x="276" y="605" text-anchor="end" font-size="15" font-weight="700" fill="#291c0e">2028–2029</text>
<circle cx="300" cy="600" r="11" fill="#3d6b6b"/>
<text x="332" y="605" font-size="15" fill="#4f4f4f">Electronics</text>

<text x="332" y="642" font-size="13" fill="#5c5c5c">Infrastructure dates hold; product dates slip — the order is the reliable part.</text>
</svg>
