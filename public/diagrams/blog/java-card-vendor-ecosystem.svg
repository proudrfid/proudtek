<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The Java Card vendor ecosystem drawn as a temple — four pillars on one shared standard</title>
<desc id="d">A temple diagram. The roof is a teal bar of off-the-shelf certified applets: EMV, PIV, ICAO MRTD, FIDO2, Calypso and CIPURSE. Four vendor pillars hold it up: NXP with JCOP 4 and 5 on SmartMX3 (largest certified applet catalogue, the bank plus government default); G+D with Sm@rtCafe Expert on Infineon SLE 78 (transit specialist and personalization bureaus, deep Calypso and CIPURSE support); Thales with IDPrime and TOP DL on Integrity Guard (enterprise PKI and federal deployments, PIV, CAC and .NET cards); and Infineon with SECORA on SLE 78 and SLE 97 (one million write cycles per page, 25-year retention, one supplier for IC and OS). All pillars stand on a gold base labelled Java Card plus GlobalPlatform — the shared standard every pillar stands on.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FOUR VENDORS · ONE FOUNDATION</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">You're not buying an OS — you're buying a catalogue</text>

<!-- roof: certified applets -->
<rect x="64" y="130" width="1072" height="76" rx="14" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
