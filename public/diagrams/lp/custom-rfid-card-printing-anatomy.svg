<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Anatomy of a printed RFID card and the finish menu applied after lamination</title>
  <desc id="d">Left: a cross-section of a printed RFID card as five laminated layers from top to bottom — a clear protective overlay, a CMYK-printed PVC face at 300 DPI, an inlay carrying the antenna coil and RFID or NFC chip, a printed PVC back, and a clear protective overlay beneath — built to the ISO/IEC 7810 ID-1 format, 85.6 by 54 mm at 0.76 mm thick with a 3.18 mm corner radius. Right: a finish menu listing spot UV, hot foil, matte or gloss lamination, magnetic stripe, signature panel and custom die-cut, each applied as a separate pass after lamination and before final QC.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CARD ANATOMY &amp; FINISH MENU</text>
  <text x="600" y="99" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">How a printed RFID card is built</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">Five laminated layers, one ISO/IEC 7810 ID-1 body, finishes added by pass.</text>

  <text x="70" y="172" font-size="15" font-weight="800" letter-spacing="0.4" fill="#2c5454">CARD CROSS-SECTION</text>

  <!-- layer 1: overlay -->
  <rect x="70" y="196" width="350" height="44" rx="9" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="90" y="224" font-size="15" font-weight="700" fill="#291c0e">Protective overlay</text>
  <text x="440" y="224" font-size="13" fill="#5c5c5c">clear laminate</text>

  <!-- layer 2: printed face -->
  <rect x="70" y="250" width="350" height="44" rx="9" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="90" y="278" font-size="15" font-weight="700" fill="#291c0e">Printed PVC face — CMYK</text>
  <text x="440" y="278" font-size="13" fill="#5c5c5c">300 DPI artwork</text>

  <!-- layer 3: inlay (emphasized) -->
  <rect x="70" y="304" width="350" height="58" rx="9" fill="#eef1f5" stroke="#4a5568" stroke-width="2.5"/>
  <text x="90" y="330" font-size="15" font-weight="700" fill="#291c0e">Inlay: antenna coil + chip</text>
  <text x="90" y="350" font-size="13" fill="#4a5568">the RFID / NFC layer</text>
  <text x="440" y="338" font-size="13" fill="#5c5c5c">encoded + read-verified</text>

  <!-- layer 4: printed back -->
  <rect x="70" y="372" width="350" height="44" rx="9" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="90" y="400" font-size="15" font-weight="700" fill="#291c0e">Printed PVC back</text>
  <text x="440" y="400" font-size="13" fill="#5c5c5c">barcode / serial</text>

  <!-- layer 5: overlay -->
  <rect x="70" y="426" width="350" height="44" rx="9" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="90" y="454" font-size="15" font-weight="700" fill="#291c0e">Protective overlay</text>
  <text x="440" y="454" font-size="13" fill="#5c5c5c">clear laminate</text>

  <!-- dimension note -->
  <text x="70" y="512" font-size="16" font-weight="800" fill="#2c5454">ISO/IEC 7810 ID-1</text>
  <text x="70" y="536" font-size="14" fill="#5c5c5c">85.6 × 54 mm · 0.76 mm · 3.18 mm corner radius (CR-80)</text>

  <!-- finish menu panel -->
  <rect x="620" y="186" width="536" height="356" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="644" y="226" font-size="17" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">FINISH MENU</text>

  <circle cx="654" cy="261" r="7" fill="#c39a5f"/>
  <text x="676" y="266" font-size="15" fill="#291c0e">Spot UV — raised gloss on chosen areas</text>

  <circle cx="654" cy="307" r="7" fill="#c39a5f"/>
  <text x="676" y="312" font-size="15" fill="#291c0e">Hot foil — gold, silver, rose gold, holographic</text>

  <circle cx="654" cy="353" r="7" fill="#3d6b6b"/>
  <text x="676" y="358" font-size="15" fill="#291c0e">Matte or gloss lamination — surface feel</text>

  <circle cx="654" cy="399" r="7" fill="#4a5568"/>
  <text x="676" y="404" font-size="15" fill="#291c0e">Magnetic stripe — HiCo or LoCo</text>

  <circle cx="654" cy="445" r="7" fill="#4a5568"/>
  <text x="676" y="450" font-size="15" fill="#291c0e">Signature panel — sign on issue</text>

  <circle cx="654" cy="491" r="7" fill="#3d6b6b"/>
  <text x="676" y="496" font-size="15" fill="#291c0e">Custom die-cut — mini cards, key tags</text>

  <text x="600" y="596" text-anchor="middle" font-size="15" fill="#291c0e">Each finish is a separate pass, applied after lamination — before final QC.</text>
</svg>
