<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID data architecture: raw reads to middleware to business events to WMS</title>
<desc id="d">A four-stage pipeline. Stage one, raw reads: readers emit high-volume EPC reads. Stage two, middleware such as Impinj ItemSense or Zebra RFID Connect filters and deduplicates them. Stage three, business events: received, moved to zone B, shipped. Stage four, the warehouse management system — SAP EWM, Manhattan, Oracle or Blue Yonder. A band underneath notes the transport: API, message queue such as MQTT or Kafka, and EPCIS, in near real-time.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FROM TAG READ TO WMS EVENT</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Middleware turns a firehose of raw reads into events the WMS can act on.</text>

<!-- BOX 1 · RAW READS (steel) -->
<rect x="49" y="150" width="250" height="270" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="49" y="150" width="250" height="8" rx="4" fill="#4a5568"/>
<text x="174" y="192" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#3a4453">RAW READS</text>
<rect x="132" y="220" width="84" height="46" rx="6" fill="#eef1f5" stroke="#4a5568" stroke-width="2"/>
<text x="174" y="248" text-anchor="middle" font-size="12.5" font-weight="800" fill="#3a4453">READER</text>
<circle cx="150" cy="292" r="4" fill="#9aa3ad"/>
<circle cx="174" cy="286" r="4" fill="#9aa3ad"/>
<circle cx="198" cy="294" r="4" fill="#9aa3ad"/>
<circle cx="162" cy="306" r="4" fill="#9aa3ad"/>
<circle cx="188" cy="308" r="4" fill="#9aa3ad"/>
<text x="174" y="360" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Readers emit</text>
<text x="174" y="380" text-anchor="middle" font-size="13.5" fill="#5c5c5c">high-volume EPC reads</text>

<!-- BOX 2 · MIDDLEWARE (teal) -->
<rect x="333" y="150" width="250" height="270" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="333" y="150" width="250" height="8" rx="4" fill="#3d6b6b"/>
<text x="458" y="192" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">MIDDLEWARE</text>
<polygon points="410,222 506,222 476,270 440,270" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<rect x="452" y="270" width="12" height="30" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<text x="458" y="346" text-anchor="middle" font-size="13" fill="#5c5c5c">Impinj ItemSense,</text>
<text x="458" y="366" text-anchor="middle" font-size="13" fill="#5c5c5c">Zebra RFID Connect —</text>
<text x="458" y="386" text-anchor="middle" font-size="13" fill="#5c5c5c">filter &amp; deduplicate</text>

<!-- BOX 3 · BUSINESS EVENTS (gold) -->
<rect x="617" y="150" width="250" height="270" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="617" y="150" width="250" height="8" rx="4" fill="#c39a5f"/>
<text x="742" y="192" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#a07d43">BUSINESS EVENTS</text>
<rect x="662" y="222" width="160" height="24" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="678" y="239" font-size="12.5" font-weight="700" fill="#8a6a2f">received</text>
<rect x="662" y="254" width="160" height="24" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="678" y="271" font-size="12.5" font-weight="700" fill="#8a6a2f">moved to zone B</text>
<rect x="662" y="286" width="160" height="24" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<text x="678" y="303" font-size="12.5" font-weight="700" fill="#8a6a2f">shipped</text>
<text x="742" y="360" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Raw reads become</text>
<text x="742" y="380" text-anchor="middle" font-size="13.5" fill="#5c5c5c">meaningful movements</text>

<!-- BOX 4 · WMS (green) -->
<rect x="901" y="150" width="250" height="270" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<rect x="901" y="150" width="250" height="8" rx="4" fill="#1f6f3a"/>
<text x="1026" y="192" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">WMS</text>
<ellipse cx="1026" cy="228" rx="36" ry="11" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<path d="M 990 228 v 48 a 36 11 0 0 0 72 0 v -48" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<path d="M 990 252 a 36 11 0 0 0 72 0" fill="none" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="1026" y="352" text-anchor="middle" font-size="12.5" fill="#33595a">SAP EWM · Manhattan</text>
<text x="1026" y="372" text-anchor="middle" font-size="12.5" fill="#33595a">Oracle · Blue Yonder</text>

<!-- arrows -->
<line x1="300" y1="285" x2="330" y2="285" stroke="#291c0e" stroke-width="3"/>
<polygon points="330,278 348,285 330,292" fill="#291c0e"/>
<line x1="584" y1="285" x2="614" y2="285" stroke="#291c0e" stroke-width="3"/>
<polygon points="614,278 632,285 614,292" fill="#291c0e"/>
<line x1="868" y1="285" x2="898" y2="285" stroke="#291c0e" stroke-width="3"/>
<polygon points="898,278 916,285 898,292" fill="#291c0e"/>

<!-- transport band -->
<rect x="180" y="470" width="840" height="46" rx="23" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="600" y="498" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">Transport: API · message queue (MQTT / Kafka) · EPCIS — near real-time</text>

<text x="600" y="566" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">The EPC on each tag is the globally unique key that maps a read to an asset record.</text>
</svg>
