<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five first-timer race-timing mistakes, each paired with its fix</title>
<desc id="d">Five rows, each a common mistake on the left and its fix on the right. One, a single mat at start or finish, fixed by two mats with the second offset 3 to 5 metres. Two, tags clipped in different spots, fixed by one method, bib-mounted UHF. Three, a generator sized for the PA only, fixed by 1.5 to 2 kilowatts per zone plus a battery. Four, bibs handed out but never scanned, fixed by scan-on-pickup that registers each UID. Five, no clock-sync on race morning, fixed by one NTP source for every clock.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE SETUP MISTAKES → FIVE FIXES</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The failures all happen before the gun. So do the fixes.</text>

<text x="318" y="132" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">COMMON MISTAKE</text>
<text x="882" y="132" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">THE FIX</text>

<rect x="64" y="150" width="508" height="70" rx="12" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.4"/>
<rect x="628" y="150" width="508" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="100" cy="185" r="11" fill="#8b2d2d"/><line x1="94" y1="179" x2="106" y2="191" stroke="#ffffff" stroke-width="2.4"/><line x1="106" y1="179" x2="94" y2="191" stroke="#ffffff" stroke-width="2.4"/>
<circle cx="664" cy="185" r="11" fill="#1f6f3a"/><polyline points="659,186 663,190 671,180" fill="none" stroke="#ffffff" stroke-width="2.6"/>
<text x="124" y="190" font-size="14.5" fill="#291c0e">One mat at start / finish</text>
<text x="688" y="190" font-size="14.5" fill="#234a4a">Two mats — second offset 3–5 m</text>
<line x1="581" y1="185" x2="599" y2="185" stroke="#291c0e" stroke-width="2.3"/><polygon points="599,179 609,185 599,191" fill="#291c0e"/>

<rect x="64" y="232" width="508" height="70" rx="12" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.4"/>
<rect x="628" y="232" width="508" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="100" cy="267" r="11" fill="#8b2d2d"/><line x1="94" y1="261" x2="106" y2="273" stroke="#ffffff" stroke-width="2.4"/><line x1="106" y1="261" x2="94" y2="273" stroke="#ffffff" stroke-width="2.4"/>
<circle cx="664" cy="267" r="11" fill="#1f6f3a"/><polyline points="659,268 663,272 671,262" fill="none" stroke="#ffffff" stroke-width="2.6"/>
<text x="124" y="272" font-size="14.5" fill="#291c0e">Tags clipped in different spots</text>
<text x="688" y="272" font-size="14.5" fill="#234a4a">One method: bib-mounted UHF</text>
<line x1="581" y1="267" x2="599" y2="267" stroke="#291c0e" stroke-width="2.3"/><polygon points="599,261 609,267 599,273" fill="#291c0e"/>

<rect x="64" y="314" width="508" height="70" rx="12" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.4"/>
<rect x="628" y="314" width="508" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="100" cy="349" r="11" fill="#8b2d2d"/><line x1="94" y1="343" x2="106" y2="355" stroke="#ffffff" stroke-width="2.4"/><line x1="106" y1="343" x2="94" y2="355" stroke="#ffffff" stroke-width="2.4"/>
<circle cx="664" cy="349" r="11" fill="#1f6f3a"/><polyline points="659,350 663,354 671,344" fill="none" stroke="#ffffff" stroke-width="2.6"/>
<text x="124" y="354" font-size="14.5" fill="#291c0e">Generator sized for the PA only</text>
<text x="688" y="354" font-size="14.5" fill="#234a4a">1.5–2 kW per zone + battery</text>
<line x1="581" y1="349" x2="599" y2="349" stroke="#291c0e" stroke-width="2.3"/><polygon points="599,343 609,349 599,355" fill="#291c0e"/>

