<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How to read an RFID tag wholesale quote</title>
<desc id="d">On the left, a stylised factory quote lists the per-tag components — chip 0.025 to 0.10 dollars, antenna and inlay, lamination, encoding, packaging, plus a one-time tooling and setup fee — with an all-in per-tag total of about 0.12 dollars flagged as the least useful line. On the right, the four places the real leverage sits: the per-tag build cost where the chip dominates, the soft fees at 30 to 40 percent of price, the non-linear volume tiers, and the trade term that decides who pays freight, insurance and customs.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">READING AN RFID TAG QUOTE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The bottom-line total is the least useful line — the leverage sits above it.</text>

<!-- LEFT: quote sheet -->
<rect x="70" y="132" width="440" height="474" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="70" y="132" width="440" height="46" rx="14" fill="#f3ede0"/>
<rect x="70" y="160" width="440" height="18" fill="#f3ede0"/>
<text x="92" y="161" font-size="15" font-weight="800" letter-spacing="0.4" fill="#234a4a">FACTORY QUOTE · per tag</text>

<text x="92" y="212" font-size="14.5" fill="#291c0e">Chip</text>
<text x="488" y="212" text-anchor="end" font-size="14.5" font-weight="700" fill="#2c5454">$0.025–0.10</text>
<line x1="92" y1="226" x2="488" y2="226" stroke="#efe9dc" stroke-width="1.4"/>
<text x="92" y="256" font-size="14.5" fill="#291c0e">Antenna + inlay</text>
<text x="488" y="256" text-anchor="end" font-size="14.5" font-weight="700" fill="#2c5454">$0.01–0.04</text>
<line x1="92" y1="270" x2="488" y2="270" stroke="#efe9dc" stroke-width="1.4"/>
<text x="92" y="300" font-size="14.5" fill="#291c0e">Lamination + finishing</text>
<text x="488" y="300" text-anchor="end" font-size="14.5" font-weight="700" fill="#2c5454">$0.005–0.02</text>
<line x1="92" y1="314" x2="488" y2="314" stroke="#efe9dc" stroke-width="1.4"/>
<text x="92" y="344" font-size="14.5" fill="#291c0e">Encoding</text>
<text x="488" y="344" text-anchor="end" font-size="14.5" font-weight="700" fill="#2c5454">$0.02–0.05</text>
<line x1="92" y1="358" x2="488" y2="358" stroke="#efe9dc" stroke-width="1.4"/>
<text x="92" y="388" font-size="14.5" fill="#291c0e">Packaging</text>
<text x="488" y="388" text-anchor="end" font-size="14.5" font-weight="700" fill="#2c5454">$0.003–0.05</text>
<line x1="92" y1="402" x2="488" y2="402" stroke="#efe9dc" stroke-width="1.4"/>
<text x="92" y="432" font-size="14.5" fill="#291c0e">Tooling / setup</text>
<text x="488" y="432" text-anchor="end" font-size="14.5" font-weight="700" fill="#a07d43">one-time</text>

<rect x="90" y="456" width="400" height="54" rx="10" fill="#f7edd6" stroke="#d9b45f" stroke-width="2"/>
<text x="108" y="490" font-size="16" font-weight="800" fill="#a07d43">ALL-IN / tag</text>
<text x="472" y="490" text-anchor="end" font-size="19" font-weight="800" fill="#291c0e">$0.12</text>
<text x="92" y="546" font-size="13" fill="#8a6a2f">↑ the one number buyers read first — and the least useful</text>

<!-- RIGHT: leverage layers -->
<text x="548" y="150" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">WHERE THE LEVERAGE IS</text>

<rect x="548" y="170" width="584" height="92" rx="12" fill="#eef5f5" stroke="#cfe3dd" stroke-width="1.8"/>
<rect x="548" y="170" width="8" height="92" rx="4" fill="#3d6b6b"/>
<text x="576" y="206" font-size="16.5" font-weight="800" fill="#234a4a">Per-tag build cost</text>
<text x="576" y="234" font-size="14" fill="#3a2f20">The chip dominates and is the most volume-sensitive line.</text>

<rect x="548" y="278" width="584" height="92" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="548" y="278" width="8" height="92" rx="4" fill="#c39a5f"/>
<text x="576" y="314" font-size="16.5" font-weight="800" fill="#8a6a2f">Soft fees — 30-40% of price</text>
<text x="576" y="342" font-size="14" fill="#3a2f20">Tooling, encoding, packaging: negotiable, rarely flagged.</text>

<rect x="548" y="386" width="584" height="92" rx="12" fill="#eef5f5" stroke="#cfe3dd" stroke-width="1.8"/>
<rect x="548" y="386" width="8" height="92" rx="4" fill="#3d6b6b"/>
<text x="576" y="422" font-size="16.5" font-weight="800" fill="#234a4a">Volume tiers</text>
<text x="576" y="450" font-size="14" fill="#3a2f20">Non-linear — order just above each break-point.</text>

<rect x="548" y="494" width="584" height="92" rx="12" fill="#eef0f4" stroke="#c7cdd6" stroke-width="1.8"/>
<rect x="548" y="494" width="8" height="92" rx="4" fill="#4a5568"/>
<text x="576" y="530" font-size="16.5" font-weight="800" fill="#3a4454">Trade term — FOB / CIF / DDP</text>
<text x="576" y="558" font-size="14" fill="#3a2f20">Decides who pays freight, insurance and customs.</text>

<text x="600" y="640" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Read a quote bottom-up: the total is the price; the lines above are the deal.</text>
</svg>
