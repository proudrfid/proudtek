<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">When a DIY NFC wedding project tips into hiring a pro</title>
<desc id="d">Four tiers scaled by favor count and personalization, with a rising effort meter. Tier one, pure DIY you own end to end: under 100 favors on one shared URL, about 15 to 25 dollars in stickers, 30 minutes. Tier two, DIY with a helper: 100 to 200 favors with per-table variation, about 30 to 50 dollars, recruit a bridesmaid, one to two hours. Tier three, a planner with NFC experience: 200-plus favors with per-guest notes, four to six hours to program, one typo is costly. Tier four, a laser-cut NFC fabrication shop: engraved wood or acrylic at 5 to 15 dollars per piece versus about 20 cents for a DIY sticker, when the aesthetic matters. A red footer warns not to use NFC at bargain venues with weak cellular, and to test signal at reception time first.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE DIY TIPS INTO HIRE-A-PRO</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Match the help to the favor count</text>
<text x="1028" y="140" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#9c8a63">EFFORT</text>

<rect x="80" y="150" width="1040" height="80" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<circle cx="126" cy="190" r="22" fill="#c39a5f"/>
<text x="126" y="197" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
<text x="172" y="184" font-size="16.5" font-weight="700" fill="#291c0e">DIY — you own it end to end</text>
<text x="172" y="210" font-size="13" fill="#4f4f4f">under 100 favors · one shared URL · ~$15–25 in stickers · about 30 minutes</text>
<circle cx="992" cy="190" r="7" fill="#c39a5f"/>
<circle cx="1016" cy="190" r="7" fill="#efe6d4"/>
<circle cx="1040" cy="190" r="7" fill="#efe6d4"/>
<circle cx="1064" cy="190" r="7" fill="#efe6d4"/>

<rect x="80" y="238" width="1040" height="80" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<circle cx="126" cy="278" r="22" fill="#3d6b6b"/>
<text x="126" y="285" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
<text x="172" y="272" font-size="16.5" font-weight="700" fill="#291c0e">DIY with a helper</text>
<text x="172" y="298" font-size="13" fill="#4f4f4f">100–200 favors · per-table variation · ~$30–50 · recruit a bridesmaid, 1–2 hours</text>
<circle cx="992" cy="278" r="7" fill="#3d6b6b"/>
<circle cx="1016" cy="278" r="7" fill="#3d6b6b"/>
<circle cx="1040" cy="278" r="7" fill="#dce9e9"/>
<circle cx="1064" cy="278" r="7" fill="#dce9e9"/>

<rect x="80" y="326" width="1040" height="80" rx="14" fill="#eef0f3" stroke="#c7cfda" stroke-width="1.5"/>
<circle cx="126" cy="366" r="22" fill="#4a5568"/>
<text x="126" y="373" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
<text x="172" y="360" font-size="16.5" font-weight="700" fill="#291c0e">Planner with NFC experience</text>
<text x="172" y="386" font-size="13" fill="#4f4f4f">200+ favors · per-guest notes · 4–6 hours to program · one mistyped URL is costly</text>
<circle cx="992" cy="366" r="7" fill="#4a5568"/>
<circle cx="1016" cy="366" r="7" fill="#4a5568"/>
<circle cx="1040" cy="366" r="7" fill="#4a5568"/>
<circle cx="1064" cy="366" r="7" fill="#dce0e6"/>

<rect x="80" y="414" width="1040" height="80" rx="14" fill="#eaf5ec" stroke="#bcd9c6" stroke-width="1.5"/>
<circle cx="126" cy="454" r="22" fill="#2d6a4f"/>
<text x="126" y="461" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">4</text>
<text x="172" y="448" font-size="16.5" font-weight="700" fill="#1b4332">Laser-cut / NFC fabrication shop</text>
<text x="172" y="474" font-size="13" fill="#4f4f4f">engraved wood or acrylic · $5–15 per piece vs ~$0.20 DIY · when the aesthetic matters</text>
<circle cx="992" cy="454" r="7" fill="#2d6a4f"/>
<circle cx="1016" cy="454" r="7" fill="#2d6a4f"/>
<circle cx="1040" cy="454" r="7" fill="#2d6a4f"/>
<circle cx="1064" cy="454" r="7" fill="#2d6a4f"/>

<rect x="80" y="524" width="1040" height="104" rx="14" fill="#f7e6e6" stroke="#e0b8b8" stroke-width="1.5"/>
<path d="M 128 556 L 148 596 L 108 596 Z" fill="none" stroke="#8b2d2d" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="126" y="572" width="4" height="12" fill="#8b2d2d"/>
<circle cx="128" cy="590" r="2.4" fill="#8b2d2d"/>
<text x="176" y="566" font-size="16" font-weight="700" fill="#8b2d2d">When you should NOT use NFC</text>
<text x="176" y="590" font-size="13" fill="#6b4a4a">Bargain venues with weak cellular — the tag hands off a URL the phone still has to load.</text>
<text x="176" y="612" font-size="13" fill="#6b4a4a">Test signal at reception time before committing the whole favor concept.</text>
</svg>
