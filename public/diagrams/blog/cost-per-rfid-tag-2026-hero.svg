<text x="592" y="534" font-size="13" fill="#5c5c5c">Eight full bands, the hidden costs and the negotiation levers — all below.</text>

<text x="600" y="608" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Factory-direct from Shenzhen typically runs 20–35% below trading-company quotes — the middleman is a deletable line item.</text>
