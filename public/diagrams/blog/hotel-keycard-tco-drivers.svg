<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The four levers that decide hotel keycard TCO — magstripe vs RFID</title>
<desc id="d">Four total-cost-of-ownership levers compared side by side. Replacement rate: magstripe 30-50 percent a year from demagnetization and wear, RFID 5-15 percent, mostly lost cards. Key complaints: magstripe card failure is the top front-desk complaint at many hotels; after RFID migration complaints fall 60-80 percent and room access leaves the top-10 within 90 days. Programming failures: worn magstripe encoders fail 3-5 percent of encodes, RFID near zero, both take 2-5 seconds. Lock maintenance: slot readers jam and wear at $5-8K a year in service tickets; contactless locks cut tickets 30-40 percent.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FOUR LEVERS DECIDE KEYCARD TCO</text>
<text x="600" y="92" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="27" font-weight="700" fill="#291c0e">Per-card price is not one of them</text>

<text x="600" y="138" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#4a5568">MAGSTRIPE</text>
<text x="960" y="138" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#2c5454">RFID</text>

<text x="70" y="192" font-size="15.5" font-weight="700" fill="#291c0e">Replacement rate</text>
<text x="70" y="214" font-size="12.5" fill="#4f4f4f">cards re-bought each year</text>
<rect x="430" y="152" width="340" height="100" rx="12" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="600" y="196" text-anchor="middle" font-size="20" font-weight="800" fill="#8b2d2d">30-50% / yr</text>
<text x="600" y="222" text-anchor="middle" font-size="12.5" fill="#4f4f4f">demagnetizes in a pocket</text>
<rect x="790" y="152" width="340" height="100" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="960" y="196" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6f3a">5-15% / yr</text>
<text x="960" y="222" text-anchor="middle" font-size="12.5" fill="#4f4f4f">mostly lost, not failed</text>

<text x="70" y="306" font-size="15.5" font-weight="700" fill="#291c0e">Key complaints</text>
<text x="70" y="328" font-size="12.5" fill="#4f4f4f">AHLA 'room access' category</text>
<rect x="430" y="266" width="340" height="100" rx="12" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="600" y="310" text-anchor="middle" font-size="18" font-weight="800" fill="#8b2d2d">top front-desk complaint</text>
<text x="600" y="336" text-anchor="middle" font-size="12.5" fill="#4f4f4f">at many hotels</text>
<rect x="790" y="266" width="340" height="100" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="960" y="310" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6f3a">down 60-80%</text>
<text x="960" y="336" text-anchor="middle" font-size="12.5" fill="#4f4f4f">off the top-10 within 90 days</text>

<text x="70" y="420" font-size="15.5" font-weight="700" fill="#291c0e">Programming failures</text>
<text x="70" y="442" font-size="12.5" fill="#4f4f4f">at check-in, 2-5 s per card</text>
<rect x="430" y="380" width="340" height="100" rx="12" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="600" y="424" text-anchor="middle" font-size="20" font-weight="800" fill="#8b2d2d">3-5%</text>
<text x="600" y="450" text-anchor="middle" font-size="12.5" fill="#4f4f4f">on worn encoders</text>
<rect x="790" y="380" width="340" height="100" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="960" y="424" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6f3a">near zero</text>
<text x="960" y="450" text-anchor="middle" font-size="12.5" fill="#4f4f4f">no contact, no wear path</text>

<text x="70" y="534" font-size="15.5" font-weight="700" fill="#291c0e">Lock maintenance</text>
<text x="70" y="556" font-size="12.5" fill="#4f4f4f">service tickets per year</text>
<rect x="430" y="494" width="340" height="100" rx="12" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="600" y="538" text-anchor="middle" font-size="18" font-weight="800" fill="#8b2d2d">slot readers jam &amp; wear</text>
<text x="600" y="564" text-anchor="middle" font-size="12.5" fill="#4f4f4f">$5-8K/yr in service tickets</text>
<rect x="790" y="494" width="340" height="100" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="960" y="538" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6f3a">down 30-40%</text>
<text x="960" y="564" text-anchor="middle" font-size="12.5" fill="#4f4f4f">no slot mechanism to wear</text>

<text x="600" y="632" text-anchor="middle" font-size="13" fill="#5c5c5c">The per-card line is missing from this chart on purpose — it barely moves the total.</text>
</svg>
