<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="s2Title s2Desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="s2Title">DSCSA — the peer-to-peer model versus FMD's hub</title>
  <desc id="s2Desc">EU FMD is drawn as a star: a central EMVS hub linked to several national systems. US DSCSA is drawn as a chain: manufacturer, wholesaler and pharmacy exchanging EPCIS 2.0 and EDI data directly, verifying at every transfer and saleable return via the VRS, with no central database. Five difference cards summarize how the regimes diverge: architecture (central hub vs peer-to-peer), data exchange (EMVS API vs GS1 EPCIS 2.0 and EDI), verification timing (at dispensing only vs every transfer), tamper evidence (required vs best practice) and penalties (per member state vs unified federal).</desc>
  <defs>
    <radialGradient id="s2Bg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#s2Bg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="2" fill="#6d5a3a">DSCSA — THE PEER-TO-PEER MODEL</text>
  <text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">No central hub: trading partners verify each other over EPCIS 2.0</text>

  <!-- FMD star (small) -->
  <rect x="56" y="112" width="316" height="238" rx="14" fill="#f2f7f7" stroke="#b8d4d4" stroke-width="2"/>
  <text x="214" y="140" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">EU FMD</text>
  <text x="214" y="160" text-anchor="middle" font-size="12.5" fill="#4f4f4f">centralized — one hub</text>
  <line x1="214" y1="252" x2="120" y2="212" stroke="#3d6b6b" stroke-width="2"/>
  <line x1="214" y1="252" x2="308" y2="212" stroke="#3d6b6b" stroke-width="2"/>
  <line x1="214" y1="252" x2="120" y2="308" stroke="#3d6b6b" stroke-width="2"/>
  <line x1="214" y1="252" x2="308" y2="308" stroke="#3d6b6b" stroke-width="2"/>
  <circle cx="120" cy="212" r="12" fill="#b8d4d4"/><circle cx="308" cy="212" r="12" fill="#b8d4d4"/><circle cx="120" cy="308" r="12" fill="#b8d4d4"/><circle cx="308" cy="308" r="12" fill="#b8d4d4"/>
  <circle cx="214" cy="252" r="34" fill="#3d6b6b"/><text x="214" y="257" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">EMVS</text>
  <text x="214" y="338" text-anchor="middle" font-size="12" fill="#4f4f4f">One hub, many national systems</text>

  <!-- DSCSA chain (big) -->
  <rect x="392" y="112" width="752" height="238" rx="14" fill="#eef4fa" stroke="#b6cbe0" stroke-width="2"/>
  <text x="420" y="144" font-size="15" font-weight="800" fill="#1f3b5c">US DSCSA — peer-to-peer</text>
  <rect x="430" y="176" width="180" height="64" rx="10" fill="#ffffff" stroke="#b6cbe0" stroke-width="1.5"/>
  <text x="520" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#1f3b5c">Manufacturer</text>
  <text x="644" y="215" text-anchor="middle" font-size="24" fill="#1f4e79">↔</text>
  <rect x="678" y="176" width="180" height="64" rx="10" fill="#ffffff" stroke="#b6cbe0" stroke-width="1.5"/>
  <text x="768" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#1f3b5c">Wholesaler</text>
  <text x="892" y="215" text-anchor="middle" font-size="24" fill="#1f4e79">↔</text>
  <rect x="926" y="176" width="180" height="64" rx="10" fill="#ffffff" stroke="#b6cbe0" stroke-width="1.5"/>
  <text x="1016" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#1f3b5c">Pharmacy</text>
  <rect x="430" y="262" width="676" height="46" rx="10" fill="#dbe7f3" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="768" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#163a5c">EPCIS 2.0 + EDI · verify at every transfer &amp; saleable return (VRS)</text>
  <text x="768" y="336" text-anchor="middle" font-size="12" fill="#1f4e79">No central database — partners verify each other directly</text>

  <!-- five difference cards -->
  <g>
    <!-- card 1 -->
    <rect x="56" y="372" width="208" height="214" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
    <text x="160" y="402" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Architecture</text>
    <line x1="72" y1="414" x2="248" y2="414" stroke="#ece4d6" stroke-width="1.5"/>
    <rect x="72" y="428" width="92" height="24" rx="12" fill="#e3efef" stroke="#3d6b6b" stroke-width="1"/><text x="118" y="444" text-anchor="middle" font-size="11" font-weight="700" fill="#2c5454">EU FMD</text>
    <text x="72" y="474" font-size="13" fill="#291c0e">Central hub</text>
    <rect x="72" y="502" width="100" height="24" rx="12" fill="#e6eef6" stroke="#1f4e79" stroke-width="1"/><text x="122" y="518" text-anchor="middle" font-size="11" font-weight="700" fill="#1f4e79">US DSCSA</text>
    <text x="72" y="548" font-size="13" fill="#291c0e">Peer-to-peer chain</text>

    <!-- card 2 -->
    <rect x="276" y="372" width="208" height="214" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
    <text x="380" y="402" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Data exchange</text>
    <line x1="292" y1="414" x2="468" y2="414" stroke="#ece4d6" stroke-width="1.5"/>
    <rect x="292" y="428" width="92" height="24" rx="12" fill="#e3efef" stroke="#3d6b6b" stroke-width="1"/><text x="338" y="444" text-anchor="middle" font-size="11" font-weight="700" fill="#2c5454">EU FMD</text>
    <text x="292" y="474" font-size="13" fill="#291c0e">EMVS API + NCA</text>
    <rect x="292" y="502" width="100" height="24" rx="12" fill="#e6eef6" stroke="#1f4e79" stroke-width="1"/><text x="342" y="518" text-anchor="middle" font-size="11" font-weight="700" fill="#1f4e79">US DSCSA</text>
    <text x="292" y="548" font-size="13" fill="#291c0e">GS1 EPCIS 2.0 + EDI</text>

    <!-- card 3 -->
    <rect x="496" y="372" width="208" height="214" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
    <text x="600" y="402" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Verify timing</text>
    <line x1="512" y1="414" x2="688" y2="414" stroke="#ece4d6" stroke-width="1.5"/>
    <rect x="512" y="428" width="92" height="24" rx="12" fill="#e3efef" stroke="#3d6b6b" stroke-width="1"/><text x="558" y="444" text-anchor="middle" font-size="11" font-weight="700" fill="#2c5454">EU FMD</text>
    <text x="512" y="474" font-size="13" fill="#291c0e">At dispensing only</text>
    <rect x="512" y="502" width="100" height="24" rx="12" fill="#e6eef6" stroke="#1f4e79" stroke-width="1"/><text x="562" y="518" text-anchor="middle" font-size="11" font-weight="700" fill="#1f4e79">US DSCSA</text>
    <text x="512" y="548" font-size="13" fill="#291c0e">Every transfer +</text>
    <text x="512" y="565" font-size="13" fill="#291c0e">saleable return</text>

    <!-- card 4 -->
    <rect x="716" y="372" width="208" height="214" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
    <text x="820" y="402" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Tamper</text>
    <line x1="732" y1="414" x2="908" y2="414" stroke="#ece4d6" stroke-width="1.5"/>
    <rect x="732" y="428" width="92" height="24" rx="12" fill="#e3efef" stroke="#3d6b6b" stroke-width="1"/><text x="778" y="444" text-anchor="middle" font-size="11" font-weight="700" fill="#2c5454">EU FMD</text>
    <text x="732" y="474" font-size="13" fill="#291c0e">Required, every pack</text>
    <rect x="732" y="502" width="100" height="24" rx="12" fill="#e6eef6" stroke="#1f4e79" stroke-width="1"/><text x="782" y="518" text-anchor="middle" font-size="11" font-weight="700" fill="#1f4e79">US DSCSA</text>
    <text x="732" y="548" font-size="13" fill="#291c0e">Best practice,</text>
    <text x="732" y="565" font-size="13" fill="#291c0e">not required</text>

    <!-- card 5 -->
    <rect x="936" y="372" width="208" height="214" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
    <text x="1040" y="402" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Penalty</text>
    <line x1="952" y1="414" x2="1128" y2="414" stroke="#ece4d6" stroke-width="1.5"/>
    <rect x="952" y="428" width="92" height="24" rx="12" fill="#e3efef" stroke="#3d6b6b" stroke-width="1"/><text x="998" y="444" text-anchor="middle" font-size="11" font-weight="700" fill="#2c5454">EU FMD</text>
    <text x="952" y="474" font-size="13" fill="#291c0e">Per member state</text>
    <rect x="952" y="502" width="100" height="24" rx="12" fill="#e6eef6" stroke="#1f4e79" stroke-width="1"/><text x="1002" y="518" text-anchor="middle" font-size="11" font-weight="700" fill="#1f4e79">US DSCSA</text>
    <text x="952" y="548" font-size="13" fill="#291c0e">Unified federal</text>
  </g>

  <text x="600" y="620" text-anchor="middle" font-size="14.5" fill="#6d5a3a">Same goal, different plumbing — five ways the US and EU systems diverge.</text>
</svg>
