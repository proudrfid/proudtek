<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Magstripe to RFID migration — one combo credential across all three phases</title>
<desc id="d">Three phases left to right. Phase 1, legacy estate: a magstripe-only card, with doors, elevators, POS and vending, and parking all reading stripe swipes. Phase 2, the bridge, typically 18 to 36 months in hospitality: a single combo card carrying both stripe and RFID coil serves a split fleet — RFID readers in migrated zones and stripe readers in legacy zones at the same time. Phase 3, end state: every reader is on 13.56 megahertz RFID, cards are reissued RFID-only on the same chip SKU, and the stripe retires. Footer: no duplicate issuance, no flag-day cutover — migrate zone by zone; when the last stripe head-end retires, the combo spec retires with it and the stripe premium ends.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MAGSTRIPE TO RFID — THE BRIDGE PERIOD</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">One credential across the whole migration</text>

<!-- PHASE 1 -->
<rect x="52" y="136" width="330" height="380" rx="14" fill="#eef0f4" stroke="#4a5568" stroke-width="1.5"/>
<text x="217" y="172" text-anchor="middle" font-size="15" font-weight="800" fill="#4a5568">PHASE 1 — LEGACY ESTATE</text>
<rect x="132" y="192" width="170" height="106" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<rect x="132" y="206" width="170" height="16" fill="#4a5568"/>
<text x="217" y="322" text-anchor="middle" font-size="12.5" fill="#4f4f4f">magstripe-only cards</text>
<rect x="92" y="342" width="250" height="30" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="217" y="362" text-anchor="middle" font-size="12.5" fill="#4a5568">Doors — stripe swipe</text>
<rect x="92" y="382" width="250" height="30" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="217" y="402" text-anchor="middle" font-size="12.5" fill="#4a5568">Elevators — stripe swipe</text>
<rect x="92" y="422" width="250" height="30" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="217" y="442" text-anchor="middle" font-size="12.5" fill="#4a5568">POS / vending — stripe swipe</text>
<rect x="92" y="462" width="250" height="30" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="217" y="482" text-anchor="middle" font-size="12.5" fill="#4a5568">Parking — stripe swipe</text>

<polygon points="390,296 416,308 390,320" fill="#c39a5f"/>

<!-- PHASE 2 -->
<rect x="422" y="136" width="330" height="380" rx="14" fill="#f9f1e2" stroke="#c39a5f" stroke-width="2"/>
<text x="587" y="172" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">PHASE 2 — THE BRIDGE</text>
<text x="587" y="192" text-anchor="middle" font-size="12.5" fill="#6d5a3a">18-36 months on a typical hospitality estate</text>
<rect x="502" y="210" width="170" height="106" rx="10" fill="#ffffff" stroke="#291c0e" stroke-width="2"/>
<rect x="502" y="224" width="170" height="16" fill="#4a5568"/>
<rect x="514" y="250" width="146" height="56" rx="8" fill="none" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="634" y="256" width="12" height="12" rx="2" fill="#3d6b6b"/>
<text x="587" y="340" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">one combo card — both rails live</text>
<path d="M 552 352 L 517 392" stroke="#3d6b6b" stroke-width="2"/>
<polygon points="517,392 521,380 528,387" fill="#3d6b6b"/>
<path d="M 622 352 L 657 392" stroke="#4a5568" stroke-width="2"/>
<polygon points="657,392 646,387 653,380" fill="#4a5568"/>
<rect x="442" y="398" width="140" height="84" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="512" y="430" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">RFID readers</text>
<text x="512" y="450" text-anchor="middle" font-size="12.5" fill="#4f4f4f">migrated zones</text>
<rect x="592" y="398" width="140" height="84" rx="10" fill="#eef0f4" stroke="#4a5568" stroke-width="1.5"/>
<text x="662" y="430" text-anchor="middle" font-size="13" font-weight="800" fill="#4a5568">Stripe readers</text>
<text x="662" y="450" text-anchor="middle" font-size="12.5" fill="#4f4f4f">legacy zones</text>

<polygon points="760,296 786,308 760,320" fill="#c39a5f"/>

<!-- PHASE 3 -->
<rect x="792" y="136" width="330" height="380" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="957" y="172" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">PHASE 3 — END STATE</text>
<rect x="872" y="192" width="170" height="106" rx="10" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="884" y="204" width="146" height="82" rx="8" fill="none" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="1006" y="210" width="12" height="12" rx="2" fill="#3d6b6b"/>
<text x="957" y="322" text-anchor="middle" font-size="12.5" fill="#4f4f4f">reissue RFID-only — same chip SKU</text>
<rect x="832" y="342" width="250" height="30" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="957" y="362" text-anchor="middle" font-size="12.5" fill="#2c5454">Doors — 13.56 MHz RFID</text>
<rect x="832" y="382" width="250" height="30" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="957" y="402" text-anchor="middle" font-size="12.5" fill="#2c5454">Elevators — RFID</text>
<rect x="832" y="422" width="250" height="30" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="957" y="442" text-anchor="middle" font-size="12.5" fill="#2c5454">POS / vending — RFID</text>
<rect x="832" y="462" width="250" height="30" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="957" y="482" text-anchor="middle" font-size="12.5" fill="#2c5454">Parking — RFID</text>

<text x="600" y="574" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f6f3a">No duplicate issuance, no flag-day cutover — migrate zone by zone</text>
<text x="600" y="598" text-anchor="middle" font-size="12.5" fill="#4f4f4f">When the last stripe head-end retires, the combo spec retires with it — the stripe premium ends at steady state</text>
</svg>
