<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID wristband cost per attendee at three common event sizes</title>
<desc id="d">Three cost scenarios. A single-day 1,000-attendee corporate event using Tyvek HF bands at 0.30 to 0.80 dollars each with 1.05 overage lands under 1,000 dollars total, plus a 50 to 125 dollar VIP fabric upsell. A multi-day 10,000-attendee festival using woven fabric at 0.80 to 2.50 dollars each with 1.10 overage costs 9,000 to 29,000 dollars, roughly 0.5 to 1.5 percent of the festival budget, plus 500 to 1,500 dollars of silicone backup. A recurring 25,000-member-per-season gym or resort program using silicone DESFire costs 25,000 to 75,000 dollars in year one and 1,500 to 7,500 dollars per year after, the cheapest option amortized over 3 to 5 seasons. Rule of thumb: under 2 days favours Tyvek, 2 to 5 days favours fabric, recurring use favours silicone.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COST PER ATTENDEE AT THREE SIZES</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">Material cost per band is only part of the total.</text>

<!-- Card 1: Tyvek 1K single-day -->
<rect x="64" y="120" width="344" height="322" rx="16" fill="#fbf4e6" stroke="#e4c98f" stroke-width="1.8"/>
<text x="236" y="158" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#a07d43">SINGLE-DAY · 1,000</text>
<line x1="96" y1="172" x2="376" y2="172" stroke="#ecdcb4" stroke-width="1.4"/>
<text x="236" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Tyvek HF</text>
<text x="236" y="266" text-anchor="middle" font-size="38" font-weight="800" font-family="Lora, Georgia, serif" fill="#a07d43">under $1K</text>
<text x="236" y="312" text-anchor="middle" font-size="13" fill="#5c5c5c">band $0.30-0.80 × 1.05 overage</text>
<text x="236" y="340" text-anchor="middle" font-size="13" fill="#5c5c5c">VIP fabric upsell +$50-125</text>
<text x="236" y="368" text-anchor="middle" font-size="13" fill="#5c5c5c">fast application, adhesive lock</text>
<text x="236" y="410" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a07d43">lowest total cost under 2 days</text>

<!-- Card 2: Fabric 10K multi-day -->
<rect x="428" y="120" width="344" height="322" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<text x="600" y="158" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">MULTI-DAY · 10,000</text>
<line x1="460" y1="172" x2="740" y2="172" stroke="#d7e6e6" stroke-width="1.4"/>
<text x="600" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Woven fabric</text>
<text x="600" y="266" text-anchor="middle" font-size="38" font-weight="800" font-family="Lora, Georgia, serif" fill="#2c5454">$9K-29K</text>
<text x="600" y="312" text-anchor="middle" font-size="13" fill="#5c5c5c">band $0.80-2.50 × 1.10 overage</text>
<text x="600" y="340" text-anchor="middle" font-size="13" fill="#5c5c5c">silicone backup +$500-1,500</text>
<text x="600" y="368" text-anchor="middle" font-size="13" fill="#5c5c5c">comfortable for continuous wear</text>
<text x="600" y="410" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">≈ 0.5-1.5% of festival budget</text>

<!-- Card 3: Silicone 25K recurring -->
<rect x="792" y="120" width="344" height="322" rx="16" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.8"/>
<text x="964" y="158" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#4a5568">RECURRING · 25K / SEASON</text>
<line x1="824" y1="172" x2="1104" y2="172" stroke="#dde2ea" stroke-width="1.4"/>
<text x="964" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Silicone DESFire</text>
<text x="964" y="266" text-anchor="middle" font-size="38" font-weight="800" font-family="Lora, Georgia, serif" fill="#4a5568">$25K-75K</text>
<text x="964" y="312" text-anchor="middle" font-size="13" fill="#5c5c5c">year one; then $1.5K-7.5K / yr</text>
<text x="964" y="340" text-anchor="middle" font-size="13" fill="#5c5c5c">5-10% annual replacement</text>
<text x="964" y="368" text-anchor="middle" font-size="13" fill="#5c5c5c">reusable, reprogrammable</text>
<text x="964" y="410" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a5568">cheapest over 3-5 seasons</text>

<!-- rule of thumb strip -->
<rect x="64" y="468" width="1072" height="66" rx="16" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="96" y="497" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RULE OF THUMB</text>
<text x="96" y="516" font-size="12" fill="#8a7a53">lowest total cost by event length</text>
<text x="470" y="508" text-anchor="middle" font-size="15" font-weight="800" fill="#a07d43">under 2 days → Tyvek</text>
<text x="712" y="508" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">2-5 days → fabric</text>
<text x="968" y="508" text-anchor="middle" font-size="15" font-weight="800" fill="#4a5568">recurring → silicone</text>

<text x="600" y="576" text-anchor="middle" font-size="14" fill="#4f4f4f">Below 2 days Tyvek wins on total cost; at multi-season use silicone wins despite the highest unit price.</text>
</svg>
