<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Closing the warehouse shrinkage gap with RFID</title>
<desc id="d">Three beats. The gap: what the WMS records versus what is physically on the racks, a 1 to 3 percent annual shrinkage loss. The checkpoints: RFID reads at receiving, put-away and shipping. The close: inventory accuracy of 95 to 99 percent and 50 to 75 percent less shrinkage.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INDUSTRIAL RFID · WAREHOUSE SHRINKAGE</text>
<text x="600" y="99" text-anchor="middle" font-size="37" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">Closing the shrinkage gap</text>
<text x="600" y="131" text-anchor="middle" font-size="15.5" fill="#4f4f4f">RFID read points at receiving, put-away and shipping cut shrinkage 50-75% and hold 95-99% accuracy.</text>
<rect x="88" y="196" width="300" height="280" rx="14" fill="#ffffff" stroke="#d3dae3" stroke-width="1.8"/><rect x="88" y="196" width="300" height="8" rx="4" fill="#4a5568"/>
<text x="238" y="240" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#3a4453">THE GAP</text>
<text x="238" y="284" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Recorded in WMS</text>
<rect x="118" y="292" width="240" height="22" rx="5" fill="#4a5568"/>
<text x="238" y="340" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Physical on racks</text>
<rect x="118" y="348" width="182" height="22" rx="5" fill="#9aa6b5"/>
<rect x="300" y="348" width="58" height="22" rx="5" fill="#8b2d2d"/>
<rect x="152.0" y="398" width="172" height="30" rx="15.0" fill="#f7ecec" stroke="#e0b9b9" stroke-width="1.2"/><text x="238" y="417.55" text-anchor="middle" font-size="13" font-weight="800" fill="#8b2d2d">shrinkage 1-3%</text>
<rect x="450" y="196" width="300" height="280" rx="14" fill="#ffffff" stroke="#d3dae3" stroke-width="1.8"/><rect x="450" y="196" width="300" height="8" rx="4" fill="#4a5568"/>
<text x="600" y="240" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#3a4453">RFID CHECKPOINTS</text>
<rect x="490" y="274" width="220" height="42" rx="10" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/>
<circle cx="512" cy="295" r="13" fill="#4a5568"/><text x="512" y="300" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="546" y="301" text-anchor="start" font-size="14" font-weight="700" fill="#291c0e">Receiving</text>
<polyline points="682,295 686.5,300 695,289" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="490" y="332" width="220" height="42" rx="10" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/>
<circle cx="512" cy="353" r="13" fill="#4a5568"/><text x="512" y="358" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="546" y="359" text-anchor="start" font-size="14" font-weight="700" fill="#291c0e">Put-away</text>
<polyline points="682,353 686.5,358 695,347" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="490" y="390" width="220" height="42" rx="10" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/>
<circle cx="512" cy="411" r="13" fill="#4a5568"/><text x="512" y="416" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
<text x="546" y="417" text-anchor="start" font-size="14" font-weight="700" fill="#291c0e">Shipping</text>
<polyline points="682,411 686.5,416 695,405" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="812" y="196" width="300" height="280" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/><rect x="812" y="196" width="300" height="8" rx="4" fill="#1f6f3a"/>
<text x="962" y="240" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">THE CLOSE</text>
<text x="962" y="320" text-anchor="middle" font-size="44" font-weight="800" fill="#1f6f3a">95-99%</text>
<text x="962" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">inventory accuracy</text>
<rect x="842.0" y="388" width="240" height="32" rx="16.0" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.2"/><text x="962" y="408.55" text-anchor="middle" font-size="13" font-weight="800" fill="#2d6a4f">50-75% less shrinkage</text>
<line x1="392" y1="336" x2="437" y2="336" stroke="#4a5568" stroke-width="3"/><polygon points="437,329 446,336 437,343" fill="#4a5568"/>
<line x1="754" y1="336" x2="799" y2="336" stroke="#4a5568" stroke-width="3"/><polygon points="799,329 808,336 799,343" fill="#4a5568"/>
<text x="600" y="612" text-anchor="middle" font-size="14.5" fill="#4f4f4f">You can't fix a leak you can't see — RFID makes every handoff countable.</text>
</svg>
