<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID turning a printed sustainability claim into per-item proof</title>
<desc id="d">Three panels left to right. A printed hangtag carries vague claims — recyclable, made with recycled content, send it back — that are hard to substantiate for one specific item. An RFID or NFC chip is the middle layer that carries or links per-item data. On the right, three parties — a recycler, an auditor and a regulator — all read the same verifiable record, so the claim becomes checkable.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PROVE IT</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">From printed claim to per-item proof</text>
<text x="600" y="136" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Easy to print on a hangtag; hard to substantiate for one garment on a sorting line two years later.</text>

<!-- arrows -->
<g stroke="#8a94a3" stroke-width="2.6" fill="#8a94a3">
<line x1="392" y1="376" x2="424" y2="376"/><polygon points="424,370 434,376 424,382"/>
<line x1="768" y1="376" x2="800" y2="376"/><polygon points="800,370 810,376 800,382"/>
</g>

<!-- PANEL A: the claim (unverifiable, gold) -->
<rect x="64" y="180" width="320" height="392" rx="16" fill="#fbf7ee" stroke="#e4c98f" stroke-width="1.8"/>
<text x="224" y="220" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">THE CLAIM</text>
<text x="224" y="242" text-anchor="middle" font-size="12.5" fill="#8a7a5c">printed on a hangtag</text>
<!-- hangtag shape -->
<path d="M150 288 L298 288 L298 428 L150 428 Z" fill="#ffffff" stroke="#cbb89a" stroke-width="1.6"/>
<circle cx="164" cy="302" r="5" fill="none" stroke="#cbb89a" stroke-width="1.6"/>
<text x="224" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">"Recyclable"</text>
<text x="224" y="352" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">"Recycled content"</text>
<text x="224" y="384" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">"Send it back"</text>
<text x="224" y="416" text-anchor="middle" font-size="26" font-weight="800" fill="#b08a3c">?</text>
<text x="224" y="470" text-anchor="middle" font-size="12.5" fill="#8a7a5c">true for which item, exactly?</text>

<!-- PANEL B: the middle layer (chip, forest) -->
<rect x="440" y="180" width="320" height="392" rx="16" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.8"/>
<text x="600" y="220" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#1b4332">THE MIDDLE LAYER</text>
<text x="600" y="242" text-anchor="middle" font-size="12.5" fill="#3f7d55">the unglamorous chip + antenna</text>
<rect x="560" y="300" width="80" height="62" rx="8" fill="#1b4332"/>
<circle cx="600" cy="331" r="12" fill="none" stroke="#eef5f0" stroke-width="2.4"/>
<line x1="560" y1="316" x2="544" y2="316" stroke="#1b4332" stroke-width="2.6"/>
<line x1="560" y1="346" x2="544" y2="346" stroke="#1b4332" stroke-width="2.6"/>
<line x1="640" y1="316" x2="656" y2="316" stroke="#1b4332" stroke-width="2.6"/>
<line x1="640" y1="346" x2="656" y2="346" stroke="#1b4332" stroke-width="2.6"/>
<text x="600" y="404" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b4332">carries or links</text>
<text x="600" y="426" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b4332">per-item data</text>
<text x="600" y="470" text-anchor="middle" font-size="12.5" fill="#3f7d55">material, origin, care, LCA</text>

<!-- PANEL C: who can read it (green) -->
<rect x="816" y="180" width="320" height="392" rx="16" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/>
<text x="976" y="220" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#1f6f3a">WHO CAN READ IT</text>
<text x="976" y="242" text-anchor="middle" font-size="12.5" fill="#3f7d55">the same record, one source</text>
<rect x="840" y="272" width="272" height="52" rx="10" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="862" y="303" font-size="14.5" font-weight="700" fill="#291c0e">Recycler</text>
<circle cx="1088" cy="298" r="13" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.8"/>
<path d="M1082 298 l4 4 l7 -8" stroke="#1f6f3a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="840" y="336" width="272" height="52" rx="10" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="862" y="367" font-size="14.5" font-weight="700" fill="#291c0e">Auditor</text>
<circle cx="1088" cy="362" r="13" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.8"/>
<path d="M1082 362 l4 4 l7 -8" stroke="#1f6f3a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="840" y="400" width="272" height="52" rx="10" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="862" y="431" font-size="14.5" font-weight="700" fill="#291c0e">Regulator</text>
<circle cx="1088" cy="426" r="13" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.8"/>
<path d="M1082 426 l4 4 l7 -8" stroke="#1f6f3a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="976" y="490" text-anchor="middle" font-size="12.5" fill="#1f6f3a">the claim becomes checkable</text>

<text x="600" y="610" text-anchor="middle" font-size="14.5" fill="#4f4f4f">RFID is the layer that turns a marketing line into data a regulator can actually read.</text>
</svg>
