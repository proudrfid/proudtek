<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Proud Tek roll-to-roll RFID label converting flow: inlay insertion to applicator-ready roll in one inline pass</title>
  <desc id="d">Five steps left to right. Step 1, inlay insertion: the wet inlay is laminated into your face stock. Step 2, print: flexographic or digital, barcode and graphics, registration under 0.3 mm. Step 3, encode and verify: EPC or NDEF written and 100% read-verified inline. Step 4, die-cut: any size from 15 by 15 mm to 100 by 150 mm. Step 5, roll format: labels on 76 mm cores at your applicator pitch. A base bar reads: face stock in, applicator-ready roll out — one inline pass, up to 60M labels per month, traceable to roll position.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ROLL-TO-ROLL CONVERTING LINE</text>
  <text x="600" y="98" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Face stock in, applicator-ready roll out</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">One inline pass at 50-150 m/min — insert, print, encode, die-cut, rewind.</text>

  <!-- step 1 -->
  <rect x="48" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="143" cy="216" r="18" fill="#4a5568"/>
  <text x="143" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
  <text x="143" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Inlay</text>
  <text x="143" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">insertion</text>
  <text x="143" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">wet inlay laminated</text>
  <text x="143" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">into face stock</text>
  <rect x="63" y="404" width="160" height="34" rx="8" fill="#eef5f5"/>
  <text x="143" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">high-speed lamination</text>

  <!-- step 2 -->
  <rect x="274" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="369" cy="216" r="18" fill="#4a5568"/>
  <text x="369" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
  <text x="369" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Print</text>
  <text x="369" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">flexo · digital</text>
  <text x="369" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">barcode, text,</text>
  <text x="369" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">full-color graphics</text>
  <rect x="289" y="404" width="160" height="34" rx="8" fill="#eef1f5"/>
  <text x="369" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">registration &lt;0.3 mm</text>

  <!-- step 3 (highlight) -->
  <rect x="500" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
  <circle cx="595" cy="216" r="18" fill="#c39a5f"/>
  <text x="595" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
  <text x="595" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Encode</text>
  <text x="595" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">&amp; verify</text>
  <text x="595" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">EPC or NDEF</text>
  <text x="595" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">written on the line</text>
  <rect x="515" y="404" width="160" height="34" rx="8" fill="#f7edd6"/>
  <text x="595" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">100% read-verified</text>

  <!-- step 4 -->
  <rect x="726" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="821" cy="216" r="18" fill="#4a5568"/>
  <text x="821" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
  <text x="821" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Die-cut</text>
  <text x="821" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">to size</text>
  <text x="821" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">15 × 15 mm to</text>
  <text x="821" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">100 × 150 mm</text>
  <rect x="741" y="404" width="160" height="34" rx="8" fill="#eef1f5"/>
  <text x="821" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">corner, tab, fold</text>

  <!-- step 5 -->
  <rect x="952" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="1047" cy="216" r="18" fill="#2c5454"/>
  <text x="1047" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
  <text x="1047" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Roll</text>
  <text x="1047" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">format</text>
  <text x="1047" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">on 76 mm cores</text>
  <text x="1047" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">to your pitch</text>
  <rect x="967" y="404" width="160" height="34" rx="8" fill="#eef5f5"/>
  <text x="1047" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">applicator-ready</text>

  <!-- chevrons -->
  <polygon points="250,315 262,325 250,335" fill="#c39a5f"/>
  <polygon points="476,315 488,325 476,335" fill="#c39a5f"/>
  <polygon points="702,315 714,325 702,335" fill="#c39a5f"/>
  <polygon points="928,315 940,325 928,335" fill="#c39a5f"/>

  <!-- base bar -->
  <text x="100" y="548" font-size="13" font-weight="700" fill="#5c5c5c">Face stock in</text>
  <text x="1090" y="548" text-anchor="end" font-size="13" font-weight="700" fill="#5c5c5c">Applicator-ready roll out</text>
  <line x1="100" y1="572" x2="1072" y2="572" stroke="#4a5568" stroke-width="3"/>
  <polygon points="1072,564 1090,572 1072,580" fill="#4a5568"/>
  <text x="600" y="614" text-anchor="middle" font-size="15" fill="#291c0e">One inline pass — up to 60M labels / month, every unit traceable to roll position.</text>
</svg>
