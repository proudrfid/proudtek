<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five regulatory waves driving RFID demand from 2019 to 2030 on a shared timeline</title>
<desc id="d">A timeline of five regulations plotted against years 2019 to 2030. The EU Digital Product Passport under the ESPR (Regulation 2024/1781) phases in from 2026 to 2030. The EU Batteries Regulation (2023/1542) battery passport applies from February 2027. US DSCSA Phase 3 is effective from November 2024. The EU Falsified Medicines Directive (2011/62/EU) has been operational since 2019. Walmart, Target and Macy's retailer source-tagging mandates run 2024 to 2026. A dashed marker shows the present, 2026.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">REGULATORY WAVES · 2024–2030</text>
<text x="600" y="99" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">Five mandates, one rising tide</text>
<text x="600" y="131" text-anchor="middle" font-size="16" fill="#4f4f4f">Each regulation pulls RFID demand on its own clock — here's when each one starts to bite.</text>
<line x1="853" y1="196" x2="853" y2="550" stroke="#c39a5f" stroke-width="1.8" stroke-dasharray="5 5"/>
<text x="853" y="188" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">now · 2026</text>
<text x="88" y="248" font-size="14" font-weight="700" fill="#291c0e">EU DPP · ESPR</text>
<text x="88" y="266" font-size="12.5" fill="#5c5c5c">Reg 2024/1781</text>
<rect x="816" y="237" width="295" height="26" rx="8" fill="#2d6a4f"/>
<text x="832" y="254" font-size="12.5" font-weight="700" fill="#ffffff">phases in 2026 → 2030</text>
<text x="88" y="314" font-size="14" font-weight="700" fill="#291c0e">EU battery passport</text>
<text x="88" y="332" font-size="12.5" fill="#5c5c5c">Reg 2023/1542</text>
<rect x="890" y="303" width="221" height="26" rx="8" fill="#1b4332"/>
<text x="906" y="320" font-size="12.5" font-weight="700" fill="#ffffff">from Feb 2027</text>
<text x="88" y="380" font-size="14" font-weight="700" fill="#291c0e">US DSCSA Phase 3</text>
<text x="88" y="398" font-size="12.5" fill="#5c5c5c">effective Nov 2024</text>
<rect x="669" y="369" width="443" height="26" rx="8" fill="#4a5568"/>
<text x="685" y="386" font-size="12.5" font-weight="700" fill="#ffffff">unit-level pharmaceutical serialization</text>
<text x="88" y="446" font-size="14" font-weight="700" fill="#291c0e">EU FMD</text>
<text x="88" y="464" font-size="12.5" fill="#5c5c5c">Dir 2011/62/EU</text>
<rect x="300" y="435" width="812" height="26" rx="8" fill="#3d6b6b"/>
<text x="316" y="452" font-size="12.5" font-weight="700" fill="#ffffff">operational since 2019 — unique pack identifiers</text>
<text x="88" y="512" font-size="14" font-weight="700" fill="#291c0e">Retailer mandates</text>
<text x="88" y="530" font-size="12.5" fill="#5c5c5c">Walmart·Target·Macy's</text>
<rect x="669" y="501" width="148" height="26" rx="8" fill="#c39a5f"/>
<text x="685" y="518" font-size="12.5" font-weight="800" fill="#291c0e">2024–26</text>
<line x1="300" y1="556" x2="1112" y2="556" stroke="#e6dfd2" stroke-width="2"/>
<text x="300" y="576" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2019</text>
<text x="521" y="576" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2022</text>
<text x="743" y="576" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2025</text>
<text x="964" y="576" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2028</text>
<text x="1112" y="576" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2030</text>
<text x="600" y="604" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Overlapping waves compound — one apparel item can face a retailer mandate and a Digital Product Passport at once.</text>
</svg>
