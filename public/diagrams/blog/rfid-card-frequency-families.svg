<line x1="600" y1="146" x2="600" y2="158" stroke="#4f4f4f" stroke-width="1.5"/>
<line x1="935" y1="146" x2="935" y2="158" stroke="#4f4f4f" stroke-width="1.5"/>
<circle cx="265" cy="152" r="6" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
<circle cx="600" cy="152" r="6" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
<circle cx="935" cy="152" r="6" fill="#ffffff" stroke="#4a5568" stroke-width="2.5"/>
<text x="265" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d5a3a">125 kHz</text>
<text x="600" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">13.56 MHz</text>
<text x="935" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a5568">860-960 MHz</text>
<text x="120" y="180" font-size="12.5" fill="#5c5c5c">◄ lower · closer, forgiving</text>
<text x="1072" y="180" text-anchor="end" font-size="12.5" fill="#5c5c5c">higher · farther, fussier ►</text>

