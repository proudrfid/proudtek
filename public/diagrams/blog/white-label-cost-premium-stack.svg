<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The white-label cost premium broken into four line items at two volumes</title>
<desc id="d">A cost table with four component rows and two volume columns. Logo printing runs 0.005 to 0.02 dollars per tag at first order and 0.002 to 0.008 at volume. Custom packaging runs 0.10 to 0.50 dollars per unit, dropping to 0.03 to 0.15 at 50K or more. A custom catalog or EAN code costs 0.001 to 0.005 dollars per tag plus a 50 to 200 dollar setup per SKU that amortizes over volume. Setup and tooling is a 100 to 500 dollar one-time fee below 5K MOQ and is included at 5K and above. Together the premium over generic is 5 to 15 percent at first order, falling to 2 to 5 percent past 100K units.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE WHITE-LABEL COST STACK</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Four line items you negotiate one at a time — each one shrinks as volume climbs.</text>

<!-- column headers -->
<text x="92" y="128" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">COMPONENT</text>
<text x="700" y="128" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">AT FIRST ORDER (~10K)</text>
<text x="990" y="128" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">AT VOLUME (100K+)</text>

<!-- row 1 -->
<rect x="64" y="142" width="1072" height="66" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="64" y="142" width="9" height="66" rx="4" fill="#3d6b6b"/>
<text x="92" y="172" font-size="15.5" font-weight="800" fill="#291c0e">Logo printing</text>
<text x="92" y="193" font-size="12.5" fill="#5c5c5c">1-color simpler; foil &amp; metallic cost more</text>
<text x="700" y="182" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">$0.005–0.02 / tag</text>
<text x="990" y="182" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">$0.002–0.008 / tag</text>

<!-- row 2 -->
<rect x="64" y="216" width="1072" height="66" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="64" y="216" width="9" height="66" rx="4" fill="#3d6b6b"/>
<text x="92" y="246" font-size="15.5" font-weight="800" fill="#291c0e">Custom packaging</text>
<text x="92" y="267" font-size="12.5" fill="#5c5c5c">branded box, blister or display card</text>
<text x="700" y="256" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">$0.10–0.50 / unit</text>
<text x="990" y="256" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">$0.03–0.15 / unit</text>

<!-- row 3 -->
<rect x="64" y="290" width="1072" height="66" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="64" y="290" width="9" height="66" rx="4" fill="#4a5568"/>
<text x="92" y="320" font-size="15.5" font-weight="800" fill="#291c0e">Catalog / EAN code</text>
<text x="92" y="341" font-size="12.5" fill="#5c5c5c">printed catalog ID + one-time setup per SKU</text>
<text x="700" y="330" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4453">$0.001–0.005 /tag + $50–200</text>
<text x="990" y="330" text-anchor="middle" font-size="14" fill="#5c5c5c">setup amortizes</text>

<!-- row 4 -->
<rect x="64" y="364" width="1072" height="66" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="64" y="364" width="9" height="66" rx="4" fill="#4a5568"/>
<text x="92" y="394" font-size="15.5" font-weight="800" fill="#291c0e">Setup &amp; tooling</text>
<text x="92" y="415" font-size="12.5" fill="#5c5c5c">logo plate setup</text>
<text x="700" y="404" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4453">$100–500 one-time (&lt;5K)</text>
<text x="990" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6f3a">included at 5K+ MOQ</text>

<!-- total band -->
<rect x="64" y="452" width="1072" height="88" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.8"/>
<text x="92" y="490" font-size="16.5" font-weight="800" fill="#6d5a3a">TOTAL PREMIUM OVER GENERIC</text>
<text x="92" y="516" font-size="13" fill="#7a6844">Setup costs amortize as the order grows.</text>
<text x="700" y="505" text-anchor="middle" font-size="30" font-weight="800" fill="#a07d43">5–15%</text>
<text x="700" y="527" text-anchor="middle" font-size="12.5" fill="#7a6844">at first-order MOQ</text>
<text x="880" y="502" text-anchor="middle" font-size="24" fill="#b79a63">→</text>
<text x="990" y="505" text-anchor="middle" font-size="30" font-weight="800" fill="#1f6f3a">2–5%</text>
<text x="990" y="527" text-anchor="middle" font-size="12.5" fill="#3a6a4a">at 100K+ volume</text>

<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#4f4f4f">A manageable margin hit for putting your name on proven hardware.</text>
</svg>
