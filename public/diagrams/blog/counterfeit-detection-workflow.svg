<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="wfTitle wfDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="wfTitle">One chip, four counterfeit-detection checkpoints</title>
  <desc id="wfDesc">A four-checkpoint detection workflow using a single chip. Checkpoint one, factory output: every shipped unit is logged as the source of truth. Checkpoint two, distribution and customs: officers tap suspicious shipments. Checkpoint three, retail and resale: staff tap at intake and pre-listing. Checkpoint four, consumer: shoppers tap to verify. All four feed a backend analytics dashboard tracking per-region volume, pass/fail rate, suspected clusters and spike alerts.</desc>
  <defs>
    <radialGradient id="wfBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="wfDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
    <marker id="wfArr" markerWidth="9" markerHeight="9" refX="3" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c39a5f"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#wfBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2.5" fill="#6d5a3a">ONE CHIP, FOUR CHECKPOINTS</text>
  <text x="600" y="88" text-anchor="middle" font-size="15.5" fill="#4f4f4f">A fake has to slip past every gate to reach a shelf. Same chip at each one; a different person tapping.</text>

  <!-- checkpoint cards -->
  <!-- 1 Factory -->
  <rect x="62" y="112" width="254" height="248" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="86" cy="112" r="18" fill="#c39a5f"/><text x="86" y="118" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">1</text>
  <g transform="translate(189,170)" stroke="#6d5a3a" stroke-width="3.5" fill="#efe0bf" stroke-linejoin="round">
    <path d="M-34 22 v-30 l20 14 v-14 l20 14 v-14 l20 14 v30 Z"/>
    <rect x="-38" y="22" width="80" height="10" fill="#6d5a3a" stroke="none"/>
  </g>
  <text x="189" y="252" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Factory output</text>
  <text x="189" y="278" text-anchor="middle" font-size="14" fill="#4f4f4f">logs every unit —</text>
  <text x="189" y="297" text-anchor="middle" font-size="14" fill="#4f4f4f">the source of truth</text>
  <rect x="111" y="316" width="156" height="28" rx="14" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.3"/><text x="189" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#177a92">UID · batch · ship-to</text>

  <!-- 2 Customs -->
  <rect x="336" y="112" width="254" height="248" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="360" cy="112" r="18" fill="#c39a5f"/><text x="360" y="118" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">2</text>
  <g transform="translate(463,168)">
    <path d="M0 -24 l30 11 v24 q0 24 -30 37 q-30 -13 -30 -37 v-24 Z" fill="#efe0bf" stroke="#6d5a3a" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M-13 6 l9 10 l18 -22" fill="none" stroke="#1f6f3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="463" y="252" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Distribution &amp; customs</text>
  <text x="463" y="278" text-anchor="middle" font-size="14" fill="#4f4f4f">officers tap suspicious</text>
  <text x="463" y="297" text-anchor="middle" font-size="14" fill="#4f4f4f">shipments</text>
  <rect x="385" y="316" width="156" height="28" rx="14" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.3"/><text x="463" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#177a92">phone or USB reader</text>

  <!-- 3 Retail -->
  <rect x="610" y="112" width="254" height="248" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="634" cy="112" r="18" fill="#c39a5f"/><text x="634" y="118" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">3</text>
  <g transform="translate(737,170)">
    <path d="M-30 -16 h34 a6 6 0 0 1 4 2 l30 30 a6 6 0 0 1 0 8 l-24 24 a6 6 0 0 1 -8 0 l-30 -30 a6 6 0 0 1 -2 -4 v-24 a6 6 0 0 1 6 -6 Z" fill="#efe0bf" stroke="#6d5a3a" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="-14" cy="0" r="6" fill="#fff" stroke="#6d5a3a" stroke-width="3"/>
  </g>
  <text x="737" y="252" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Retail &amp; resale</text>
  <text x="737" y="278" text-anchor="middle" font-size="14" fill="#4f4f4f">tap at intake and</text>
  <text x="737" y="297" text-anchor="middle" font-size="14" fill="#4f4f4f">pre-listing</text>
  <rect x="659" y="316" width="156" height="28" rx="14" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.3"/><text x="737" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#177a92">fail → return to supplier</text>

  <!-- 4 Consumer -->
  <rect x="884" y="112" width="254" height="248" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="908" cy="112" r="18" fill="#c39a5f"/><text x="908" y="118" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">4</text>
  <g transform="translate(1011,168)">
    <rect x="-2" y="-28" width="52" height="94" rx="12" fill="#fff" stroke="#291c0e" stroke-width="3.5"/>
    <rect x="6" y="-18" width="36" height="66" rx="4" fill="#f7f0e2"/>
    <circle cx="24" cy="57" r="4" fill="#291c0e"/>
    <g fill="none" stroke="#1fcefb" stroke-width="3.4" stroke-linecap="round"><path d="M-16 -6 a22 22 0 0 0 0 44"/><path d="M-30 -16 a38 38 0 0 0 0 66"/></g>
  </g>
  <text x="1011" y="252" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Consumer</text>
  <text x="1011" y="278" text-anchor="middle" font-size="14" fill="#4f4f4f">tap-to-verify builds</text>
  <text x="1011" y="297" text-anchor="middle" font-size="14" fill="#4f4f4f">CRM data</text>
  <rect x="933" y="316" width="156" height="28" rx="14" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.3"/><text x="1011" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#177a92">catches fakes in use</text>

  <!-- flow chevrons between cards -->
  <g fill="#c39a5f"><path d="M320 236 l14 8 l-14 8 Z"/><path d="M594 236 l14 8 l-14 8 Z"/><path d="M868 236 l14 8 l-14 8 Z"/></g>

  <!-- down arrows into backend -->
  <g stroke="#c39a5f" stroke-width="3.5" stroke-linecap="round">
    <line x1="189" y1="366" x2="189" y2="398" marker-end="url(#wfArr)"/>
    <line x1="463" y1="366" x2="463" y2="398" marker-end="url(#wfArr)"/>
    <line x1="737" y1="366" x2="737" y2="398" marker-end="url(#wfArr)"/>
    <line x1="1011" y1="366" x2="1011" y2="398" marker-end="url(#wfArr)"/>
  </g>

  <!-- backend band -->
  <rect x="62" y="406" width="1076" height="196" rx="16" fill="url(#wfDark)"/>
  <text x="600" y="446" text-anchor="middle" font-size="19" font-weight="800" letter-spacing="1.5" fill="#d4a755">BACKEND ANALYTICS DASHBOARD</text>
  <text x="600" y="472" text-anchor="middle" font-size="14" fill="#f4efe4">every tap from every checkpoint lands here</text>
  <g>
    <rect x="96" y="500" width="228" height="74" rx="12" fill="#ffffff" opacity="0.08"/>
    <text x="210" y="532" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Per-region volume</text>
    <text x="210" y="556" text-anchor="middle" font-size="13" fill="#e9ddc4">verification counts by geography</text>
    <rect x="340" y="500" width="228" height="74" rx="12" fill="#ffffff" opacity="0.08"/>
    <text x="454" y="532" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Pass / fail rate</text>
    <text x="454" y="556" text-anchor="middle" font-size="13" fill="#e9ddc4">authentic vs rejected</text>
    <rect x="584" y="500" width="228" height="74" rx="12" fill="#ffffff" opacity="0.08"/>
    <text x="698" y="532" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Suspected clusters</text>
    <text x="698" y="556" text-anchor="middle" font-size="13" fill="#e9ddc4">counterfeit hotspots</text>
    <rect x="828" y="500" width="228" height="74" rx="12" fill="#8b2d2d" opacity="0.9"/>
    <text x="942" y="532" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Spike alerts</text>
    <text x="942" y="556" text-anchor="middle" font-size="13" fill="#f4d9d9">fail rate jumps in a channel</text>
  </g>
</svg>
