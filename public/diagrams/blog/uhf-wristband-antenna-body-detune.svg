<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Why a UHF wristband antenna needs a body-decoupling ground plane</title>
<desc id="d">Two cross-sections of a UHF wristband against the wrist. Left, a standard label inlay sits directly on the skin: its energy radiates down into the body, which is mostly water, so the on-body read range collapses to about 30 cm. Right, a body-decoupled design places a thin metallic ground plane between the antenna and the skin, redirecting radiation outward and restoring a usable 2 to 5 m range. Standard label inlays lose 50 to 80 percent of range on-body.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANTENNA vs THE BODY</text>
<text x="600" y="98" text-anchor="middle" font-size="28" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">The wrist is mostly water &#8212; detune the antenna off it</text>

<!-- LEFT · standard inlay on skin (failure) -->
<rect x="88" y="124" width="480" height="372" rx="14" fill="#fbf1ef" stroke="#e3c4c0" stroke-width="1.8"/>
<rect x="88" y="124" width="480" height="8" rx="4" fill="#8b2d2d"/>
<text x="328" y="166" text-anchor="middle" font-size="16.5" font-weight="800" fill="#8b2d2d">Standard inlay on skin</text>
<text x="328" y="230" text-anchor="middle" font-size="34" font-weight="800" fill="#8b2d2d" font-family="Lora, Georgia, serif">~30 cm</text>
<text x="328" y="256" text-anchor="middle" font-size="13" fill="#5c5c5c">on-body range collapses</text>
<text x="328" y="322" text-anchor="middle" font-size="12.5" fill="#8b2d2d">energy dumped into the wrist</text>
<line x1="248" y1="336" x2="248" y2="392" stroke="#8b2d2d" stroke-width="2.6"/>
<polygon points="242,384 254,384 248,396" fill="#8b2d2d"/>
<line x1="328" y1="336" x2="328" y2="392" stroke="#8b2d2d" stroke-width="2.6"/>
<polygon points="322,384 334,384 328,396" fill="#8b2d2d"/>
<line x1="408" y1="336" x2="408" y2="392" stroke="#8b2d2d" stroke-width="2.6"/>
<polygon points="402,384 414,384 408,396" fill="#8b2d2d"/>
<rect x="178" y="360" width="300" height="24" rx="4" fill="#4a5568"/>
<text x="328" y="376" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">UHF antenna</text>
<rect x="178" y="400" width="300" height="44" rx="4" fill="#e8d5c0" stroke="#cbb89a" stroke-width="1.4"/>
<text x="328" y="427" text-anchor="middle" font-size="12.5" fill="#7a6a52">SKIN &#183; mostly water</text>
<text x="328" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">body shielding dominates</text>

<!-- RIGHT · body-decoupled design (good) -->
<rect x="632" y="124" width="480" height="372" rx="14" fill="#eef0f4" stroke="#d4dae2" stroke-width="1.8"/>
<rect x="632" y="124" width="480" height="8" rx="4" fill="#4a5568"/>
<text x="872" y="166" text-anchor="middle" font-size="16.5" font-weight="800" fill="#3a4457">Body-decoupled design</text>
<text x="872" y="230" text-anchor="middle" font-size="34" font-weight="800" fill="#3a4457" font-family="Lora, Georgia, serif">2&#8211;5 m</text>
<text x="872" y="256" text-anchor="middle" font-size="13" fill="#5c5c5c">usable on-body range</text>
<text x="872" y="300" text-anchor="middle" font-size="12.5" fill="#3a4457">radiates outward</text>
<line x1="792" y1="356" x2="792" y2="312" stroke="#4a5568" stroke-width="2.6"/>
<polygon points="786,322 798,322 792,310" fill="#4a5568"/>
<line x1="872" y1="356" x2="872" y2="312" stroke="#4a5568" stroke-width="2.6"/>
<polygon points="866,322 878,322 872,310" fill="#4a5568"/>
<line x1="952" y1="356" x2="952" y2="312" stroke="#4a5568" stroke-width="2.6"/>
<polygon points="946,322 958,322 952,310" fill="#4a5568"/>
<rect x="722" y="360" width="300" height="24" rx="4" fill="#4a5568"/>
<text x="872" y="376" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">UHF antenna</text>
<rect x="722" y="390" width="300" height="18" rx="3" fill="#c39a5f" stroke="#a9843f" stroke-width="1.3"/>
<text x="872" y="403" text-anchor="middle" font-size="12" font-weight="700" fill="#3a2f18">metallic ground plane</text>
<rect x="722" y="414" width="300" height="40" rx="4" fill="#e8d5c0" stroke="#cbb89a" stroke-width="1.4"/>
<text x="872" y="439" text-anchor="middle" font-size="12.5" fill="#7a6a52">SKIN &#183; mostly water</text>
<text x="872" y="476" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4457">ground plane redirects outward</text>

<rect x="88" y="516" width="1024" height="58" rx="12" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="551" text-anchor="middle" font-size="13.5" fill="#4f4f4f">A thin metallic ground plane between antenna and skin turns 30 cm into 2&#8211;5 m. Standard label inlays lose 50&#8211;80% of range on-body.</text>
</svg>
