<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Matching an NFC sticker to its surface</title>
<desc id="d">Five surface types and the sticker each one needs. Paper, cardboard, plastic, and glass are NFC-friendly and take a standard sticker with no modification. Metal such as cans, foil, and appliances needs an anti-metal, ferrite-backed sticker that costs 20 to 40 percent more but keeps full range. Curved surfaces like bottles and tubes need a flexible printed antenna because rigid coils crack on the bend. Outdoor placements need UV-resistant, waterproof adhesive. Temporary placements on rented or shared surfaces need removable adhesive.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SURFACE COMPATIBILITY</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">The surface matters as much as the chip — match the adhesive and antenna to it.</text>

<!-- row 1 friendly -->
<rect x="64" y="132" width="1072" height="72" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<rect x="64" y="132" width="9" height="72" rx="4" fill="#1f6f3a"/>
<text x="104" y="166" font-size="15.5" font-weight="800" fill="#291c0e">Paper · cardboard · plastic · glass</text>
<text x="104" y="188" font-size="12.5" fill="#4f6a5a">NFC-friendly, no modification needed</text>
<rect x="796" y="152" width="296" height="40" rx="20" fill="#e7f2ea" stroke="#a9cfb5" stroke-width="1.3"/>
<text x="944" y="177" text-anchor="middle" font-size="13" font-weight="800" fill="#1f6f3a">Standard sticker</text>

<!-- row 2 metal -->
<rect x="64" y="216" width="1072" height="72" rx="11" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.4"/>
<rect x="64" y="216" width="9" height="72" rx="4" fill="#c39a5f"/>
<text x="104" y="250" font-size="15.5" font-weight="800" fill="#291c0e">Metal — cans, foil, appliances</text>
<text x="104" y="272" font-size="12.5" fill="#7a6636">+20-40% cost, but keeps full read range</text>
<rect x="796" y="236" width="296" height="40" rx="20" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<text x="944" y="261" text-anchor="middle" font-size="13" font-weight="800" fill="#8a6d34">Anti-metal, ferrite-backed</text>

<!-- row 3 curved -->
<rect x="64" y="300" width="1072" height="72" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="64" y="300" width="9" height="72" rx="4" fill="#3d6b6b"/>
<text x="104" y="334" font-size="15.5" font-weight="800" fill="#291c0e">Curved — bottles, tubes</text>
<text x="104" y="356" font-size="12.5" fill="#4f6a6a">rigid wound-wire coils crack on the bend</text>
<rect x="796" y="320" width="296" height="40" rx="20" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="944" y="345" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">Flexible printed antenna</text>

<!-- row 4 outdoor -->
<rect x="64" y="384" width="1072" height="72" rx="11" fill="#edf5ef" stroke="#b7d4bf" stroke-width="1.4"/>
<rect x="64" y="384" width="9" height="72" rx="4" fill="#2d6a4f"/>
<text x="104" y="418" font-size="15.5" font-weight="800" fill="#291c0e">Outdoor — exposed to weather</text>
<text x="104" y="440" font-size="12.5" fill="#3f6a52">sun, rain, temperature swings</text>
<rect x="796" y="404" width="296" height="40" rx="20" fill="#e7f2ea" stroke="#b7d4bf" stroke-width="1.3"/>
<text x="944" y="429" text-anchor="middle" font-size="13" font-weight="800" fill="#2d6a4f">UV-resistant, waterproof</text>

<!-- row 5 temporary -->
<rect x="64" y="468" width="1072" height="72" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="64" y="468" width="9" height="72" rx="4" fill="#3d6b6b"/>
<text x="104" y="502" font-size="15.5" font-weight="800" fill="#291c0e">Temporary — rented or shared</text>
<text x="104" y="524" font-size="12.5" fill="#4f6a6a">must peel clean when the campaign ends</text>
<rect x="796" y="488" width="296" height="40" rx="20" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="944" y="513" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5454">Removable adhesive</text>

<text x="600" y="582" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Get this wrong and the tag reads beautifully — in the lab, on a desk, nowhere useful.</text>
</svg>
