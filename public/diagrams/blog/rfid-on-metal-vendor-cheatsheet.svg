<text x="189" y="423" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">pairs naturally with HID readers</text>
<text x="66" y="458" font-size="13" font-weight="600" fill="#291c0e">InLine 200/500 (industrial) · IN10000 (very long range)</text>
<text x="66" y="480" font-size="13" font-weight="600" fill="#291c0e">Vigo (low-profile small)</text>
<text x="66" y="508" font-size="12.5" fill="#4f4f4f">same supply chain as HID Trusted Tag &amp; Origo —</text>
<text x="66" y="530" font-size="12.5" fill="#4f4f4f">slots into combined asset + access deployments</text>

<rect x="607" y="354" width="545" height="216" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="627" y="390" font-size="17" font-weight="800" fill="#291c0e">Murata Magicstrap</text>
<text x="1132" y="390" text-anchor="end" font-size="12.5" fill="#6d5a3a">embedded on the PCB</text>
<rect x="627" y="406" width="296" height="26" rx="13" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.4"/>
<text x="775" y="423" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5a3a">built in at assembly · factory → recycling</text>
<text x="627" y="458" font-size="13" font-weight="600" fill="#291c0e">UHF tag integrated into the product's own PCB</text>
<text x="627" y="480" font-size="13" font-weight="600" fill="#291c0e">used by Cisco, Dell &amp; HPE for IT assets</text>
<text x="627" y="508" font-size="12.5" fill="#4f4f4f">higher cost per tag — but zero sticker labour,</text>
<text x="627" y="530" font-size="12.5" fill="#4f4f4f">and it survives as long as the product does</text>

<text x="600" y="612" text-anchor="middle" font-size="14" fill="#5c5c5c">An on-metal tag family is a 5–10 year commitment — read the datasheet like a prenup.</text>
<text x="600" y="636" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Prices are indicative per-tag at the stated MOQs.</text>
</svg>
