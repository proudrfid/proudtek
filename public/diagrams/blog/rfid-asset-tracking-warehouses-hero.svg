<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Warehouse RFID, end to end: four automatic jobs one tagged asset performs</title>
<desc id="d">Four capability cards across a warehouse. Dock portal reads a whole pallet at 200-500 tags per second. Zone readers log every crossing hands-free for chain of custody. LED pick-to-light tags cut search time 70-90 percent by lighting the exact item. Ceiling RTLS locates high-value assets to within 2 feet or 0.6 metres. All four read streams flow into one warehouse management system such as SAP EWM, Manhattan, Oracle or Blue Yonder.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WAREHOUSE RFID, END TO END</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Four jobs one tagged asset does automatically — from the dock door to the pick face.</text>

