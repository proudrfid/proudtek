<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">RFID parking-token barrier-access flow</title>
  <desc id="d">A flow from a driver tapping a parking token at the entry reader, to the reader reading the credential (the 7-byte UID and an NTAG424 DNA SUN AES-128 CMAC), to the parking-management system checking the access list online or offline, branching to a granted outcome where the barrier opens in under one second and the pass is logged, or a denied outcome where a deactivated or expired token is refused and the attempt is logged.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="14%" r="96%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#4a5568"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FROM BUMPER TO BOOM GATE — THE BARRIER CYCLE</text>
  <text x="600" y="83" text-anchor="middle" font-size="15" fill="#5c5c5c">The token carries the credential; the parking system carries the verdict; the gate just obeys</text>

  <!-- stage A -->
  <rect x="55" y="118" width="330" height="104" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="78" y="150" font-size="15.5" font-weight="800" fill="#2c5454">1 · APPROACH &amp; TAP</text>
  <text x="78" y="177" font-size="13.5" fill="#291c0e">Driver taps the token 1-5 cm</text>
  <text x="78" y="198" font-size="13.5" fill="#5c5c5c">at the entry-barrier reader</text>

  <!-- stage B -->
  <rect x="435" y="118" width="330" height="104" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="458" y="150" font-size="15.5" font-weight="800" fill="#2c5454">2 · READ CREDENTIAL</text>
  <text x="458" y="177" font-size="13.5" fill="#291c0e">7-byte UID + NTAG424 DNA SUN</text>
  <text x="458" y="198" font-size="13.5" fill="#5c5c5c">AES-128 CMAC on every tap</text>

  <!-- stage C -->
  <rect x="815" y="118" width="330" height="104" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="838" y="150" font-size="15.5" font-weight="800" fill="#2c5454">3 · CHECK ACCESS LIST</text>
  <text x="838" y="177" font-size="13.5" fill="#291c0e">PMS validates the credential</text>
  <text x="838" y="198" font-size="13.5" fill="#5c5c5c">online, or offline from the token</text>

  <!-- arrows A->B->C -->
  <line x1="385" y1="170" x2="431" y2="170" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="765" y1="170" x2="811" y2="170" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- connector C down to decision -->
  <polyline points="980,222 980,258 600,258 600,290" fill="none" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- decision -->
  <rect x="468" y="292" width="264" height="74" rx="12" fill="#f7edd6" stroke="#c39a5f" stroke-width="2.5"/>
  <text x="600" y="325" text-anchor="middle" font-size="15.5" font-weight="800" fill="#6d5a3a">Credential valid &amp; active?</text>
  <text x="600" y="348" text-anchor="middle" font-size="13" fill="#5c5c5c">checked against the authorised database</text>

  <!-- branch lines -->
  <line x1="600" y1="366" x2="336" y2="408" stroke="#1f6f3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="600" y1="366" x2="866" y2="408" stroke="#8b2d2d" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="452" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6f3a">YES</text>
  <text x="748" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">NO</text>

  <!-- granted -->
  <rect x="110" y="412" width="430" height="150" rx="14" fill="#ffffff" stroke="#1f6f3a" stroke-width="3"/>
  <text x="134" y="452" font-size="17" font-weight="800" fill="#1f6f3a">GRANTED</text>
  <text x="134" y="488" font-size="14" fill="#291c0e">Barrier opens in under 1 s</text>
  <text x="134" y="514" font-size="14" fill="#291c0e">Pass written to the transaction log</text>
  <text x="134" y="540" font-size="13" fill="#5c5c5c">no ticket to pull, no card to swipe</text>

  <!-- denied -->
  <rect x="660" y="412" width="430" height="150" rx="14" fill="#ffffff" stroke="#8b2d2d" stroke-width="3"/>
  <text x="684" y="452" font-size="17" font-weight="800" fill="#8b2d2d">DENIED</text>
  <text x="684" y="488" font-size="14" fill="#291c0e">Deactivated / expired token refused</text>
  <text x="684" y="514" font-size="14" fill="#291c0e">Attempt logged as an exception</text>
  <text x="684" y="540" font-size="13" fill="#5c5c5c">lost or stolen tokens killed in the PMS</text>

  <!-- footnote -->
  <text x="600" y="620" text-anchor="middle" font-size="13.5" fill="#5c5c5c">On NTAG424 DNA tokens the per-site AES-128 key can be rotated to invalidate a lost authenticator without reissuing the fleet.</text>
</svg>
