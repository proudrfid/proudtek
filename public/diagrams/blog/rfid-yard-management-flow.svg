<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID yard management flow from gate-in to gate-out</title>
<desc id="d">A four-step left-to-right flow for yard management with windshield RFID tags. Step one, gate-in: the gate reader captures the trailer tag and the yard system logs arrival. Step two, in yard: a dwell timer runs and the trailer stays locatable. Step three, dock assign: a yard jockey is directed and the dock reader confirms the spot. Step four, gate-out: departure is logged and dwell time closed. A band beneath states dwell time drops 15 to 30 percent with higher dock-door utilization.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">YARD: GATE-IN TO GATE-OUT</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Reading the trailer, not walking the yard</text>
<text x="600" y="136" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Windshield tags turn gate events and yard moves into automatic YMS updates.</text>

<!-- arrows -->
<g stroke="#8a94a3" stroke-width="2.6" fill="#8a94a3">
<line x1="296" y1="352" x2="336" y2="352"/><polygon points="336,346 346,352 336,358"/>
<line x1="573" y1="352" x2="613" y2="352"/><polygon points="613,346 623,352 613,358"/>
<line x1="850" y1="352" x2="890" y2="352"/><polygon points="890,346 900,352 890,358"/>
</g>

<!-- STEP 1 -->
<rect x="64" y="216" width="230" height="212" rx="14" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.6"/>
<circle cx="98" cy="252" r="16" fill="#4a5568"/><text x="98" y="257" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="126" y="257" font-size="15.5" font-weight="800" letter-spacing="0.3" fill="#3a4658">GATE-IN</text>
<rect x="88" y="286" width="182" height="52" rx="8" fill="#ffffff" stroke="#cdd4dd" stroke-width="1.4"/>
<rect x="104" y="302" width="40" height="24" rx="3" fill="#cfe0e0" stroke="#2c5454" stroke-width="1.4"/>
<text x="158" y="312" font-size="12" fill="#5c5c5c">windshield</text>
<text x="158" y="328" font-size="12" fill="#5c5c5c">tag read</text>
<text x="179" y="372" text-anchor="middle" font-size="13" fill="#291c0e">Gate reader logs</text>
<text x="179" y="392" text-anchor="middle" font-size="13" fill="#291c0e">arrival to the YMS</text>

<!-- STEP 2 -->
<rect x="341" y="216" width="230" height="212" rx="14" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.6"/>
<circle cx="375" cy="252" r="16" fill="#4a5568"/><text x="375" y="257" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="403" y="257" font-size="15.5" font-weight="800" letter-spacing="0.3" fill="#3a4658">IN YARD</text>
<circle cx="456" cy="316" r="30" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.4"/>
<line x1="456" y1="316" x2="456" y2="298" stroke="#3d6b6b" stroke-width="2.6" stroke-linecap="round"/>
<line x1="456" y1="316" x2="470" y2="322" stroke="#3d6b6b" stroke-width="2.6" stroke-linecap="round"/>
<text x="456" y="374" text-anchor="middle" font-size="13" fill="#291c0e">Dwell timer runs;</text>
<text x="456" y="394" text-anchor="middle" font-size="13" fill="#291c0e">trailer stays locatable</text>

<!-- STEP 3 -->
<rect x="618" y="216" width="230" height="212" rx="14" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.6"/>
<circle cx="652" cy="252" r="16" fill="#4a5568"/><text x="652" y="257" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="680" y="257" font-size="15.5" font-weight="800" letter-spacing="0.3" fill="#3a4658">DOCK ASSIGN</text>
<rect x="642" y="286" width="182" height="52" rx="8" fill="#ffffff" stroke="#cdd4dd" stroke-width="1.4"/>
<text x="733" y="310" text-anchor="middle" font-size="12.5" fill="#5c5c5c">jockey directed to spot;</text>
<text x="733" y="328" text-anchor="middle" font-size="12.5" fill="#5c5c5c">dock reader confirms it</text>
<text x="733" y="372" text-anchor="middle" font-size="13" fill="#291c0e">No radio call, no</text>
<text x="733" y="392" text-anchor="middle" font-size="13" fill="#291c0e">walking the rows</text>

<!-- STEP 4 -->
<rect x="895" y="216" width="230" height="212" rx="14" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.8"/>
<circle cx="929" cy="252" r="16" fill="#1f6f3a"/><text x="929" y="257" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="957" y="257" font-size="15.5" font-weight="800" letter-spacing="0.3" fill="#1f6f3a">GATE-OUT</text>
<rect x="919" y="286" width="182" height="52" rx="8" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="1010" y="310" text-anchor="middle" font-size="12.5" fill="#5c5c5c">departure logged;</text>
<text x="1010" y="328" text-anchor="middle" font-size="12.5" fill="#5c5c5c">dwell time closed</text>
<text x="1010" y="372" text-anchor="middle" font-size="13" fill="#291c0e">Clean arrival-to-</text>
<text x="1010" y="392" text-anchor="middle" font-size="13" fill="#291c0e">departure record</text>

<!-- stat band -->
<rect x="64" y="474" width="1072" height="78" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="300" y="510" text-anchor="middle" font-size="30" font-weight="800" fill="#2c5454">15–30%</text>
<text x="300" y="534" text-anchor="middle" font-size="13" fill="#4f4f4f">less trailer dwell time</text>
<line x1="600" y1="490" x2="600" y2="536" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="840" y="504" text-anchor="middle" font-size="15" font-weight="700" fill="#234a4a">Higher dock-door utilization,</text>
<text x="840" y="526" text-anchor="middle" font-size="15" font-weight="700" fill="#234a4a">fewer manual yard checks</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The yard stops being the one place where "locate the trailer" means "go walk around."</text>
</svg>
