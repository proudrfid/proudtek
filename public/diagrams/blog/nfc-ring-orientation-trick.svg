<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The antenna-orientation trick — tap the side, not the gemstone spot</title>
<desc id="d">Left: the coil wraps around the ring band, so presenting the side of the ring or a closed knuckle couples fully with the reader, while the instinctive face-tap — where a gemstone would sit — yields half the read distance. Right: three material verdicts — ceramic is radio-transparent and scratch-resistant but brittle at 1-3 centimetres; titanium and steel need an antenna window and read at 1-2 centimetres; resin and carbon read farthest at 2-4 centimetres and cost least. Footer: a 30-second onboarding video saves 80 percent of support tickets.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE GEMSTONE SPOT IS THE WORST SEAT IN THE HOUSE</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Tap the side — the coil lives in the band</text>

<rect x="60" y="130" width="530" height="440" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="325" y="172" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">ORIENTATION</text>

<circle cx="200" cy="290" r="58" fill="none" stroke="#2c5454" stroke-width="18"/>
<circle cx="200" cy="290" r="58" fill="none" stroke="#e4c98f" stroke-width="4" stroke-dasharray="10 7"/>
<text x="200" y="380" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the coil wraps the band</text>

<rect x="330" y="220" width="200" height="64" rx="12" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="2"/>
<text x="430" y="247" text-anchor="middle" font-size="14" font-weight="800" fill="#1b4332">side-tap / knuckle</text>
<text x="430" y="270" text-anchor="middle" font-size="12.5" fill="#1b4332">full coupling ✓</text>
<rect x="330" y="306" width="200" height="64" rx="12" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2"/>
<text x="430" y="333" text-anchor="middle" font-size="14" font-weight="800" fill="#8b2d2d">face-tap ("gemstone")</text>
<text x="430" y="356" text-anchor="middle" font-size="12.5" fill="#8b2d2d">half the read distance</text>

<rect x="110" y="430" width="430" height="100" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="325" y="466" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">Build the side-tap into onboarding —</text>
<text x="325" y="492" text-anchor="middle" font-size="13.5" fill="#4f4f4f">a 30-second video saves 80% of support tickets</text>
<text x="325" y="514" text-anchor="middle" font-size="12" fill="#5c5c5c">"the ring is broken" is usually "the tap was jewellery-style"</text>

<rect x="610" y="130" width="530" height="440" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="875" y="172" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">MATERIAL VERDICTS</text>

<rect x="650" y="196" width="450" height="104" rx="12" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="676" y="228" font-size="14.5" font-weight="800" fill="#6d5a3a">Ceramic (zirconia) · 1–3 cm</text>
<text x="676" y="254" font-size="12.5" fill="#4f4f4f">radio-transparent · scratch-resistant · hypoallergenic</text>
<text x="676" y="278" font-size="12.5" fill="#8b2d2d">brittle — cracks if dropped on tile or concrete</text>

<rect x="650" y="316" width="450" height="104" rx="12" fill="#eef1f5" stroke="#4a5568" stroke-width="1.5"/>
<text x="676" y="348" font-size="14.5" font-weight="800" fill="#4a5568">Titanium / steel · 1–2 cm</text>
<text x="676" y="374" font-size="12.5" fill="#4f4f4f">premium and near-indestructible — but the Faraday</text>
<text x="676" y="398" font-size="12.5" fill="#4f4f4f">cage effect demands an antenna window in the metal</text>

<rect x="650" y="436" width="450" height="104" rx="12" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="676" y="468" font-size="14.5" font-weight="800" fill="#1b4332">Resin / carbon · 2–4 cm</text>
<text x="676" y="494" font-size="12.5" fill="#4f4f4f">lightest, fully RF-transparent, best range, lowest cost —</text>
<text x="676" y="518" font-size="12.5" fill="#4f4f4f">cosmetic wear shows at 18–24 months</text>

<text x="600" y="626" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Sizing kit US 5–13 before bulk ordering; budget 5–10% size exchanges — loose rings misalign the antenna too.</text>
</svg>
