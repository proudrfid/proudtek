<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">NTAG213 sticker sizes — diameter decides the tap distance</title>
  <desc id="d">Three sticker sizes with their phone read distances: 18 mm at 1-2 cm with a small-antenna Android caution, 22 mm for small bottles and packaging, 25 mm at 2-3 cm with universal phone compatibility. Layer stack: printable PET face, antenna and chip, adhesive, liner.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Pick a diameter, pick a tap distance</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">The antenna is the sticker — smaller circle, closer tap</text>
  <g transform="translate(80,150)" font-family="Helvetica, Arial, sans-serif">
    <circle cx="90" cy="110" r="54" fill="#ffffff" stroke="#3d6b6b" stroke-width="3"/>
    <circle cx="90" cy="110" r="42" fill="none" stroke="#3d6b6b" stroke-width="2"/>
    <circle cx="90" cy="110" r="30" fill="none" stroke="#3d6b6b" stroke-width="1.5"/>
    <text x="52" y="200" font-size="15" fill="#291c0e">Ø18 mm</text>
    <text x="30" y="224" font-size="13" fill="#2c5454">tap at 1-2 cm</text>
    <text x="10" y="246" font-size="12" fill="#8b2d2d">small-antenna Android caution</text>
    <circle cx="360" cy="104" r="66" fill="#ffffff" stroke="#3d6b6b" stroke-width="3"/>
    <circle cx="360" cy="104" r="52" fill="none" stroke="#3d6b6b" stroke-width="2"/>
    <circle cx="360" cy="104" r="38" fill="none" stroke="#3d6b6b" stroke-width="1.5"/>
    <text x="322" y="200" font-size="15" fill="#291c0e">Ø22 mm</text>
    <text x="296" y="224" font-size="13" fill="#2c5454">small bottle / packaging</text>
    <circle cx="650" cy="98" r="75" fill="#eef2f0" stroke="#2c5454" stroke-width="3.5"/>
    <circle cx="650" cy="98" r="60" fill="none" stroke="#2c5454" stroke-width="2.5"/>
    <circle cx="650" cy="98" r="45" fill="none" stroke="#2c5454" stroke-width="2"/>
    <text x="612" y="200" font-size="15" fill="#291c0e">Ø25 mm</text>
    <text x="586" y="224" font-size="13" fill="#2c5454">tap at 2-3 cm — universal phones</text>
  </g>
  <g transform="translate(830,140)">
    <rect x="0" y="0" width="300" height="240" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="22" y="36" font-family="Georgia, serif" font-size="17" fill="#291c0e">The four-layer stack</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="13">
      <rect x="22" y="52" width="256" height="34" rx="5" fill="#fdf3e3" stroke="#c39a5f"/><text x="34" y="74" fill="#6d5a3a">printable PET face (75 um)</text>
      <rect x="22" y="92" width="256" height="34" rx="5" fill="#eef2f0" stroke="#3d6b6b"/><text x="34" y="114" fill="#2c5454">antenna + NTAG213 chip</text>
      <rect x="22" y="132" width="256" height="34" rx="5" fill="#ffffff" stroke="#d8cdb8"/><text x="34" y="154" fill="#6d5a3a">acrylic adhesive (3M 467MP)</text>
      <rect x="22" y="172" width="256" height="34" rx="5" fill="#ffffff" stroke="#d8cdb8"/><text x="34" y="194" fill="#6d5a3a">release liner</text>
    </g>
    <text x="22" y="228" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d5a3a">silver PET + rubber adhesive options</text>
  </g>
  <g transform="translate(80,440)">
    <rect x="0" y="0" width="1050" height="120" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="38" font-family="Georgia, serif" font-size="18" fill="#2c5454">Ship it encoded, not blank</text>
    <text x="24" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">NDEF URL pre-encoding with your URL written before shipment — UID-specific encoding available per tag</text>
    <text x="24" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">13.56 MHz · ISO/IEC 14443-3 Type A · NFC Forum Type 2 Tag — reads on every modern phone, no app</text>
  </g>
</svg>
