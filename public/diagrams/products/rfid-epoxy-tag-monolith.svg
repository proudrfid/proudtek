<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Epoxy tag cutaway — inlay suspended in a monolithic resin dome</title>
<desc id="d">Cross-section of a seamless cast epoxy dome with the inlay floating mid-resin, annotated with temperature envelope, ingress ratings and moisture classification.</desc>
<rect width="1200" height="675" fill="#f8f6f1"/>
<text x="60" y="64" font-family="Georgia, serif" font-size="34" fill="#291c0e">No shell, no seam, no way in</text>
<text x="60" y="98" font-family="Verdana, sans-serif" font-size="16" fill="#6d5a3a">The inlay is cast inside one solid piece of industrial epoxy — there is no housing to crack open</text>
<path d="M140 470 L560 470 L560 430 Q560 300 350 300 Q140 300 140 430 Z" fill="#ffffff" stroke="#291c0e" stroke-width="4"/>
<path d="M172 470 L528 470 L528 436 Q528 330 350 330 Q172 330 172 436 Z" fill="none" stroke="#c39a5f" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="255" y="392" width="190" height="26" rx="6" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2.5"/>
<circle cx="350" cy="405" r="6" fill="#2c5454"/>
<line x1="350" y1="392" x2="350" y2="342" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="350" y="285" font-family="Verdana, sans-serif" font-size="13" fill="#2c5454" text-anchor="middle">inlay suspended mid-resin — NFC, HF or UHF</text>
<line x1="140" y1="500" x2="560" y2="500" stroke="#6d5a3a" stroke-width="2"/>
<text x="350" y="528" font-family="Verdana, sans-serif" font-size="12.5" fill="#6d5a3a" text-anchor="middle">mount face: 3M VHB 5952 / 4941 or M3 / M4 screw boss</text>
<g font-family="Verdana, sans-serif" font-size="14" fill="#291c0e">
<rect x="620" y="150" width="500" height="66" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="640" y="177" font-size="15">-40 C to +150 C standard resin</text>
<text x="640" y="199" font-size="12.5" fill="#6d5a3a">-55 C to +200 C silica-filled · +220 C bursts to 30 min per JESD22-A103D</text>
<rect x="620" y="234" width="500" height="66" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="640" y="261" font-size="15">1,000 thermal cycles, -40 C to +125 C</text>
<text x="640" y="283" font-size="12.5" fill="#6d5a3a">JEDEC JESD22-A104F Condition G — read-rate still 99.5 percent or better</text>
<rect x="620" y="318" width="500" height="66" rx="8" fill="#eef2f0" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="640" y="345" font-size="15">IP68 at 10 m + IP69K at 100 bar</text>
<text x="640" y="367" font-size="12.5" fill="#2c5454">ISO 20653 wash-down — the dome has no gasket to age out</text>
<rect x="620" y="402" width="500" height="66" rx="8" fill="#eef2f0" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="640" y="429" font-size="15">MSL-1 moisture class, J-STD-020E</text>
<text x="640" y="451" font-size="12.5" fill="#2c5454">unlimited floor life at 30 C / 85 percent RH — no cavity to condense in</text>
<rect x="620" y="486" width="500" height="66" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="640" y="513" font-size="15">IPC-A-610H Class 3 build discipline</text>
<text x="640" y="535" font-size="12.5" fill="#6d5a3a">the acceptance class written for safety-critical electronics</text>
</g>
<rect x="60" y="586" width="1060" height="56" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="84" y="620" font-family="Georgia, serif" font-size="16" fill="#291c0e">Plastic-housed tags fail at the seam. A monolith has none — chemistry has to beat the whole dome to reach the chip.</text>
</svg>
