<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">On-metal NFC battery passport label construction and mounting on the pack</title>
  <desc id="d">Left: the layer stack — a printed protective face, an aluminium antenna coil carrying the NTAG 424 DNA die at 13.56 MHz with AES-128 SUN, an anti-metal ferrite spacer that recovers a 3-5 cm read on the metal pack, a high-temperature chemical-resistant lamination rated -40 °C to +85 °C and qualified to ISO 16750 vibration, a tamper-evident adhesive that flags removal, and the bond to the aluminium or steel pack housing. Right: four mounting positions matched to the pack — the pack housing exterior, the battery management system (BMS) area, the charge-port vicinity, and an embedded inlay for sealed industrial cells over 2 kWh. Bottom: a generic label detunes on the metal housing and can go unreadable within months, while the anti-metal ferrite antenna holds a 3-5 cm read and the NTAG 424 DNA chip retains its data 10+ years, covering the 10-15 year service life of an EV battery.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="48" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ON-METAL BATTERY PASSPORT LABEL — LAYER STACK &amp; MOUNTING</text>
  <text x="600" y="80" text-anchor="middle" font-size="15" fill="#5c5c5c">Anti-metal ferrite recovers the read a bare label loses on a steel pack</text>

  <!-- layer stack -->
  <text x="300" y="120" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">THE LAYER STACK</text>
  <rect x="90" y="142" width="420" height="40" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="110" y="167" font-size="13.5" fill="#291c0e">Printed face + protective overlay</text>

  <rect x="90" y="186" width="420" height="54" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="110" y="210" font-size="13.5" fill="#291c0e">Aluminium antenna + NTAG 424 DNA die</text>
  <text x="110" y="230" font-size="12.5" fill="#5c5c5c">13.56 MHz · AES-128 SUN</text>

  <rect x="90" y="244" width="420" height="54" rx="6" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <text x="110" y="268" font-size="13.5" fill="#291c0e">Anti-metal ferrite spacer</text>
  <text x="110" y="288" font-size="12.5" fill="#5c5c5c">recovers a 3-5 cm read on the metal pack</text>

  <rect x="90" y="302" width="420" height="54" rx="6" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <text x="110" y="326" font-size="13.5" fill="#291c0e">High-temp chemical-resistant lamination</text>
  <text x="110" y="346" font-size="12.5" fill="#5c5c5c">-40 °C to +85 °C · ISO 16750 vibration</text>

  <rect x="90" y="360" width="420" height="40" rx="6" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="2"/>
  <text x="110" y="385" font-size="13.5" fill="#8b2d2d">Tamper-evident adhesive — flags removal</text>

  <rect x="90" y="404" width="420" height="34" rx="6" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <text x="110" y="426" font-size="13.5" fill="#291c0e">Bonded to aluminium / steel pack housing</text>

  <!-- mounting cards -->
  <text x="845" y="120" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">MOUNTING ON THE PACK</text>
  <rect x="560" y="142" width="270" height="98" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="580" y="176" font-size="15.5" font-weight="700" fill="#291c0e">Pack housing exterior</text>
  <text x="580" y="200" font-size="13" fill="#5c5c5c">Primary consumer or</text>
  <text x="580" y="220" font-size="13" fill="#3d6b6b">inspector tap point</text>

  <rect x="850" y="142" width="270" height="98" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="870" y="176" font-size="15.5" font-weight="700" fill="#291c0e">BMS area</text>
  <text x="870" y="200" font-size="13" fill="#5c5c5c">Battery management</text>
  <text x="870" y="220" font-size="13" fill="#3d6b6b">system enclosure</text>

  <rect x="560" y="260" width="270" height="98" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="580" y="294" font-size="15.5" font-weight="700" fill="#291c0e">Charge-port vicinity</text>
  <text x="580" y="318" font-size="13" fill="#5c5c5c">Operationally accessible</text>
  <text x="580" y="338" font-size="13" fill="#3d6b6b">smartphone tap</text>

  <rect x="850" y="260" width="270" height="98" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="870" y="294" font-size="15.5" font-weight="700" fill="#291c0e">Embedded inlay</text>
  <text x="870" y="318" font-size="13" fill="#5c5c5c">Sealed industrial cells</text>
  <text x="870" y="338" font-size="13" fill="#3d6b6b">&gt; 2 kWh packs</text>

  <!-- retention band -->
  <rect x="70" y="462" width="1060" height="82" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="90" y="490" font-size="15" font-weight="700" fill="#2c5454">Why anti-metal, not a generic NFC label</text>
  <text x="90" y="513" font-size="13.5" fill="#3d6b6b">A generic label detunes on the aluminium / steel pack and can go unreadable within months.</text>
  <text x="90" y="533" font-size="13.5" fill="#3d6b6b">The ferrite antenna restores a 3-5 cm read; 10+ year retention covers the 10-15 year EV battery service life.</text>

  <text x="600" y="576" text-anchor="middle" font-size="13.5" fill="#5c5c5c">One inlay platform, four mounts — the NTAG 424 DNA chip and its AES-128 key stay identical across the pack.</text>
</svg>
