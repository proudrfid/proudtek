<line x1="464" y1="280" x2="464" y2="292" stroke="#3d6b6b" stroke-width="2"/>
<line x1="450" y1="292" x2="478" y2="292" stroke="#3d6b6b" stroke-width="2"/>
<text x="464" y="320" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Place</text>
<text x="464" y="341" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Embedded in a display</text>
