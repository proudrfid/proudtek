<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The lifecycle of a coconut-shell RFID wristband, from byproduct to composting</title>
<desc id="d">A four-stage lifecycle with a return loop. One, a waste-stream shell — a coconut oil and water byproduct. Two, it is carved and an NFC inlay is embedded and sealed with food-grade epoxy. Three, it is worn at the event for multiple days, water-resistant. Four, at end of life it is either kept as a keepsake by 60 to 80 percent of attendees, or composted. A dashed return arrow shows the shell composting back into the waste stream while the NFC inlay is recovered for electronics recycling.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COCONUT-SHELL LIFECYCLE</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">From a burned byproduct to a keepsake &#8212; and back to the waste stream.</text>

<!-- card 1 -->
<rect x="72" y="140" width="236" height="250" rx="13" fill="#ffffff" stroke="#cfe3d6" stroke-width="1.6"/>
<rect x="72" y="140" width="236" height="7" rx="3.5" fill="#2d6a4f"/>
<text x="190" y="200" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Waste-stream shell</text>
<text x="190" y="224" text-anchor="middle" font-size="12" fill="#5c5c5c">oil &amp; water byproduct</text>
<rect x="94" y="300" width="192" height="34" rx="17" fill="#e9f3ec" stroke="#cfe3d6" stroke-width="1.2"/>
<text x="190" y="322" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1b4332">renewable, abundant</text>

<!-- card 2 -->
<rect x="346" y="140" width="236" height="250" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="346" y="140" width="236" height="7" rx="3.5" fill="#3d6b6b"/>
<text x="464" y="200" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Carve + embed NFC</text>
<text x="464" y="224" text-anchor="middle" font-size="12" fill="#5c5c5c">food-grade epoxy seal</text>
<rect x="368" y="300" width="192" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="464" y="322" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">sealed inlay</text>

<!-- card 3 -->
<rect x="620" y="140" width="236" height="250" rx="13" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="620" y="140" width="236" height="7" rx="3.5" fill="#3d6b6b"/>
<text x="738" y="200" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Worn at the event</text>
<text x="738" y="224" text-anchor="middle" font-size="12" fill="#5c5c5c">multi-day, water-resistant</text>
<rect x="642" y="300" width="192" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/>
<text x="738" y="322" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">2-5 cm read</text>

<!-- card 4 : end of life (fork) -->
<rect x="894" y="140" width="236" height="250" rx="13" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/>
<rect x="894" y="140" width="236" height="7" rx="3.5" fill="#c39a5f"/>
<text x="1012" y="200" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">End of life</text>
<text x="1012" y="224" text-anchor="middle" font-size="12" fill="#6d5a3a">keep or compost</text>
<rect x="916" y="258" width="192" height="34" rx="17" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/>
<text x="1012" y="280" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8a6d34">60-80% kept</text>
<rect x="916" y="300" width="192" height="34" rx="17" fill="#e9f3ec" stroke="#cfe3d6" stroke-width="1.2"/>
<text x="1012" y="322" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1b4332">composted; chip recovered</text>

<!-- forward arrows -->
<line x1="312" y1="250" x2="338" y2="250" stroke="#291c0e" stroke-width="3"/>
<polygon points="338,244 346,250 338,256" fill="#291c0e"/>
<line x1="586" y1="250" x2="612" y2="250" stroke="#291c0e" stroke-width="3"/>
<polygon points="612,244 620,250 612,256" fill="#291c0e"/>
<line x1="860" y1="250" x2="886" y2="250" stroke="#291c0e" stroke-width="3"/>
<polygon points="886,244 894,250 886,256" fill="#291c0e"/>

<!-- return loop -->
<path d="M1012 390 L1012 452 L190 452 L190 398" fill="none" stroke="#2d6a4f" stroke-width="2.4" stroke-dasharray="7 6"/>
<polygon points="190,392 184,404 196,404" fill="#2d6a4f"/>
<text x="601" y="500" text-anchor="middle" font-size="14" fill="#2d6a4f" font-weight="700">Shell composts and returns to the waste stream; the NFC inlay is recovered for electronics recycling.</text>
<text x="601" y="600" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The only step that differs from a plastic band is the last one &#8212; where the material goes.</text>
</svg>
