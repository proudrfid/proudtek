<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hotel encoding rollout timeline, lock audit to post-launch audit</title>
<desc id="d">A phase timeline for a hotel encoding rollout across roughly 26 weeks. Lock and encoder audit in weeks 1 to 2, chip and scope decision in weeks 3 to 4, supplier brief and control samples in weeks 4 to 7, the 200-card pilot in weeks 8 to 11, production and shipping in weeks 11 to 18, site key load and first issue in weeks 18 to 20, and a post-launch audit in weeks 22 to 26. Below, three property profiles show time to first issued card: chain greenfield 8 to 12 weeks, boutique retrofit 12 to 20 weeks, and multi-property refresh with lock firmware updates 20 to 32 weeks. Caption: gate each step on a written deliverable; every skipped gate reappears later as a peak-check-in incident.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ROLLOUT TIMELINE</text>
<text x="600" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Lock audit to first issued card</text>
<text x="600" y="124" text-anchor="middle" font-size="15" fill="#4f4f4f">Gate each step on a written deliverable — the weeks follow the gates, not the other way round.</text>

<!-- labels above -->
<text x="127" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Lock + encoder</text>
<text x="127" y="220" text-anchor="middle" font-size="12.5" fill="#5c5c5c">audit · wk 1–2</text>
<line x1="127" y1="228" x2="127" y2="248" stroke="#c39a5f" stroke-width="2"/>
<text x="293" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Brief + samples</text>
<text x="293" y="220" text-anchor="middle" font-size="12.5" fill="#5c5c5c">wk 4–7</text>
<line x1="293" y1="228" x2="293" y2="248" stroke="#c39a5f" stroke-width="2"/>
<text x="626" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Production + ship</text>
<text x="626" y="220" text-anchor="middle" font-size="12.5" fill="#5c5c5c">wk 11–18</text>
<line x1="626" y1="228" x2="626" y2="248" stroke="#c39a5f" stroke-width="2"/>
<text x="978" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Post-launch audit</text>
<text x="978" y="220" text-anchor="middle" font-size="12.5" fill="#5c5c5c">wk 22–26</text>
<line x1="978" y1="228" x2="978" y2="248" stroke="#c39a5f" stroke-width="2"/>

<!-- segment band y 252..296 -->
<rect x="90" y="252" width="74" height="44" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<text x="127" y="280" text-anchor="middle" font-size="15" font-weight="800" fill="#234a4a">1</text>
<rect x="164" y="252" width="74" height="44" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<text x="201" y="280" text-anchor="middle" font-size="15" font-weight="800" fill="#234a4a">2</text>
<rect x="238" y="252" width="111" height="44" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<text x="293" y="280" text-anchor="middle" font-size="15" font-weight="800" fill="#234a4a">3</text>
<rect x="349" y="252" width="148" height="44" rx="8" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
<text x="423" y="280" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4 · GATE</text>
<rect x="497" y="252" width="259" height="44" rx="8" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
<text x="626" y="280" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">5 · supplier's clock</text>
<rect x="756" y="252" width="74" height="44" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<text x="793" y="280" text-anchor="middle" font-size="15" font-weight="800" fill="#234a4a">6</text>
<text x="867" y="281" text-anchor="middle" font-size="12.5" fill="#5c5c5c">live ops</text>
<rect x="904" y="252" width="148" height="44" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<text x="978" y="280" text-anchor="middle" font-size="15" font-weight="800" fill="#234a4a">7</text>
<line x1="90" y1="304" x2="1052" y2="304" stroke="#e6dfd2" stroke-width="2"/>

<!-- labels below -->
<line x1="201" y1="300" x2="201" y2="320" stroke="#c39a5f" stroke-width="2"/>
<text x="201" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Chip + scope decision</text>
<text x="201" y="360" text-anchor="middle" font-size="12.5" fill="#5c5c5c">wk 3–4 · signed off</text>
<line x1="423" y1="300" x2="423" y2="320" stroke="#c39a5f" stroke-width="2"/>
<text x="423" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Pilot · 200 cards</text>
<text x="423" y="360" text-anchor="middle" font-size="12.5" fill="#5c5c5c">wk 8–11 · exit criteria</text>
<line x1="793" y1="300" x2="793" y2="320" stroke="#c39a5f" stroke-width="2"/>
<text x="793" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Key load + first issue</text>
<text x="793" y="360" text-anchor="middle" font-size="12.5" fill="#5c5c5c">wk 18–20</text>

<!-- profile mini-chart -->
<text x="90" y="416" font-size="14" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TIME TO FIRST ISSUED CARD, BY PROPERTY PROFILE</text>
<line x1="90" y1="440" x2="1018" y2="440" stroke="#f0e9db" stroke-width="1.5"/>
<text x="90" y="462" font-size="13.5" font-weight="700" fill="#291c0e">Chain greenfield</text>
<line x1="90" y1="477" x2="1018" y2="477" stroke="#f0e9db" stroke-width="10"/>
<rect x="322" y="468" width="116" height="18" rx="9" fill="#3d6b6b"/>
<text x="450" y="482" font-size="13" font-weight="700" fill="#234a4a">8–12 weeks</text>
<text x="90" y="512" font-size="13.5" font-weight="700" fill="#291c0e">Boutique retrofit</text>
<line x1="90" y1="527" x2="1018" y2="527" stroke="#f0e9db" stroke-width="10"/>
<rect x="438" y="518" width="232" height="18" rx="9" fill="#3d6b6b" fill-opacity="0.55"/>
<text x="682" y="532" font-size="13" font-weight="700" fill="#234a4a">12–20 weeks</text>
<text x="90" y="562" font-size="13.5" font-weight="700" fill="#291c0e">Multi-property refresh + lock firmware updates</text>
<line x1="90" y1="577" x2="1018" y2="577" stroke="#f0e9db" stroke-width="10"/>
<rect x="670" y="568" width="348" height="18" rx="9" fill="#c39a5f"/>
<text x="1030" y="582" font-size="13" font-weight="700" fill="#6d5a3a">20–32 wk</text>

<!-- caption -->
<text x="600" y="634" text-anchor="middle" font-size="14" fill="#5c5c5c">Every skipped gate reappears later, usually during the first peak-check-in week.</text>
</svg>
