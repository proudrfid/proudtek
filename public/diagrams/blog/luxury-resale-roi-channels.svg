<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The NFC resale premium, and where the money comes home</title>
<desc id="d">Left: a two-bar chart compares resale prices — a visually-authenticated item at base price versus an NFC-verified equivalent selling 8-15 percent higher. Right: five ROI channels for brands — the resale premium share where partnered, brand-equity protection by pulling fakes from the market, a direct CRM line at resale from every tap, piloted 1-3 percent royalties on verified resale transactions, and provenance compliance pre-empted before cross-border regulators ask.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="roiBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e9d7a8"/><stop offset="100%" stop-color="#c39a5f"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE VERIFIED PREMIUM — AND WHERE IT FLOWS</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">The verified bag sells for more; some of it comes home</text>

<!-- left: bar chart -->
<line x1="120" y1="160" x2="120" y2="560" stroke="#e6dfd2" stroke-width="2"/>
<line x1="120" y1="560" x2="470" y2="560" stroke="#e6dfd2" stroke-width="2"/>
<rect x="160" y="410" width="100" height="150" fill="#efe6d2" stroke="#c39a5f" stroke-width="1.5"/>
<line x1="160" y1="410" x2="430" y2="410" stroke="#c39a5f" stroke-width="1.5" stroke-dasharray="4 6"/>
<rect x="330" y="388" width="100" height="172" fill="url(#roiBar)" stroke="#c39a5f" stroke-width="1.5"/>
<rect x="330" y="336" width="100" height="34" rx="17" fill="#291c0e"/>
<text x="380" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#e4c98f">+8–15%</text>
<text x="210" y="590" text-anchor="middle" font-size="14" font-weight="600" fill="#4f4f4f">Eyeballed</text>
<text x="210" y="612" text-anchor="middle" font-size="12.5" fill="#5c5c5c">base price</text>
<text x="380" y="590" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">NFC-verified</text>
<text x="380" y="612" text-anchor="middle" font-size="12.5" fill="#5c5c5c">premium priced</text>

<line x1="515" y1="150" x2="515" y2="600" stroke="#efe9dc" stroke-width="1.5"/>

<!-- right: five channels -->
<text x="540" y="176" font-family="Lora, Georgia, serif" font-size="24" font-weight="700" fill="#291c0e">Where the money comes home</text>
<circle cx="560" cy="222" r="16" fill="#f9f1e2" stroke="#c39a5f" stroke-width="2"/>
<circle cx="560" cy="222" r="6" fill="none" stroke="#6d5a3a" stroke-width="2"/>
<text x="594" y="220" font-size="16" font-weight="700" fill="#291c0e">Resale premium</text>
<text x="594" y="242" font-size="13.5" fill="#4f4f4f">8–15% higher — and a share comes home where brands hold partnerships</text>
<circle cx="560" cy="308" r="16" fill="#f9f1e2" stroke="#c39a5f" stroke-width="2"/>
<circle cx="560" cy="308" r="6" fill="none" stroke="#6d5a3a" stroke-width="2"/>
<text x="594" y="306" font-size="16" font-weight="700" fill="#291c0e">Brand-equity protection</text>
<text x="594" y="328" font-size="13.5" fill="#4f4f4f">fakes out of the secondary market keeps the new-stock premium intact</text>
<circle cx="560" cy="394" r="16" fill="#f9f1e2" stroke="#c39a5f" stroke-width="2"/>
<circle cx="560" cy="394" r="6" fill="none" stroke="#6d5a3a" stroke-width="2"/>
<text x="594" y="392" font-size="16" font-weight="700" fill="#291c0e">A direct line at resale</text>
<text x="594" y="414" font-size="13.5" fill="#4f4f4f">every tap is CRM data on customers you would otherwise never meet</text>
<circle cx="560" cy="480" r="16" fill="#f9f1e2" stroke="#c39a5f" stroke-width="2"/>
<circle cx="560" cy="480" r="6" fill="none" stroke="#6d5a3a" stroke-width="2"/>
<text x="594" y="478" font-size="16" font-weight="700" fill="#291c0e">Future royalties</text>
<text x="594" y="500" font-size="13.5" fill="#4f4f4f">1–3% revenue share on NFC-verified resale, piloting at several houses</text>
<circle cx="560" cy="566" r="16" fill="#f9f1e2" stroke="#c39a5f" stroke-width="2"/>
<circle cx="560" cy="566" r="6" fill="none" stroke="#6d5a3a" stroke-width="2"/>
<text x="594" y="564" font-size="16" font-weight="700" fill="#291c0e">Compliance, pre-empted</text>
<text x="594" y="586" font-size="13.5" fill="#4f4f4f">provenance ready before cross-border resale regulators ask for it</text>
</svg>
