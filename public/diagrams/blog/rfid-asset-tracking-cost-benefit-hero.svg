<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The RFID asset-tracking business case in three numbers</title>
<desc id="d">A hero summary of the CFO business case for RFID asset tracking. Three pillars carry the payback: audit time falls 70 to 90 percent, turning multi-day counts into hours; asset utilization improves 15 to 25 percent through less hoarding and fewer rush purchases; and ghost assets are written off the fixed-asset register, correcting depreciation and lowering insurance. A ribbon notes typical payback of 6 to 18 months, fastest where losses are most expensive.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="58" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE CFO BUSINESS CASE</text>
<text x="600" y="112" text-anchor="middle" font-size="38" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">The RFID asset-tracking business case</text>
<text x="600" y="150" text-anchor="middle" font-size="17" fill="#4f4f4f">Turning real-time asset visibility into a number a CFO will sign.</text>

<!-- Pillar 1: audit time (teal) -->
<rect x="110" y="200" width="300" height="210" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="260" y="240" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.6" fill="#2c5454">AUDIT TIME</text>
<text x="260" y="304" text-anchor="middle" font-size="46" font-weight="800" font-family="Lora, Georgia, serif" fill="#2c5454">70-90%</text>
<text x="260" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">less time counting</text>
<text x="260" y="374" text-anchor="middle" font-size="13" fill="#5c5c5c">days of clipboards to hours</text>

<!-- Pillar 2: utilization (steel) -->
<rect x="450" y="200" width="300" height="210" rx="16" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.6"/>
<text x="600" y="240" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.6" fill="#4a5568">UTILIZATION</text>
<text x="600" y="304" text-anchor="middle" font-size="46" font-weight="800" font-family="Lora, Georgia, serif" fill="#4a5568">15-25%</text>
<text x="600" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">better asset use</text>
<text x="600" y="374" text-anchor="middle" font-size="13" fill="#5c5c5c">less hoarding and rush-buys</text>

<!-- Pillar 3: ghost assets (forest / write-off = win) -->
<rect x="790" y="200" width="300" height="210" rx="16" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>
<text x="940" y="240" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.6" fill="#1f6f3a">GHOST ASSETS</text>
<text x="940" y="300" text-anchor="middle" font-size="38" font-weight="800" font-family="Lora, Georgia, serif" fill="#1f6f3a">Written off</text>
<text x="940" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">register corrected</text>
<text x="940" y="374" text-anchor="middle" font-size="13" fill="#5c5c5c">depreciation and insurance fall</text>

<!-- payback ribbon -->
<rect x="160" y="470" width="880" height="70" rx="35" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="300" y="507" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TYPICAL PAYBACK</text>
<text x="300" y="528" text-anchor="middle" font-size="13" fill="#8a7a53">across deployments</text>
<text x="700" y="519" text-anchor="middle" font-size="30" font-weight="800" font-family="Lora, Georgia, serif" fill="#291c0e">6-18 months</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Audit labor, ghost-asset write-downs and better utilization are the three lines that carry the return.</text>
</svg>
