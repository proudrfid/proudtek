<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Choosing HF versus UHF for healthcare RFID</title>
<desc id="d">Two columns. HF at 13.56 MHz suits patient wristbands and point-of-care verification, with a short controlled read range and minimal interference risk. UHF at 860 to 960 MHz suits asset tracking, supply-chain receiving and laundry, with longer range and bulk-read capability. A central note states that IEC 60601-1-2 electromagnetic-compatibility testing applies to readers deployed in clinical areas. Most hospitals run both bands.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FREQUENCY SELECTION · HF vs UHF</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Match the band to the job: short and safe, or long and bulk.</text>

<!-- LEFT · HF -->
<rect x="88" y="116" width="480" height="366" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="88" y="116" width="480" height="8" rx="4" fill="#3d6b6b"/>
<text x="328" y="156" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#2c5454">HF · 13.56 MHz</text>
<text x="328" y="178" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the bedside band</text>
<circle cx="128" cy="234" r="4" fill="#3d6b6b"/>
<text x="150" y="239" font-size="15" fill="#291c0e">Patient wristbands &amp; point-of-care</text>
<circle cx="128" cy="288" r="4" fill="#3d6b6b"/>
<text x="150" y="293" font-size="15" fill="#291c0e">Short, controlled read range</text>
<circle cx="128" cy="342" r="4" fill="#3d6b6b"/>
<text x="150" y="347" font-size="15" fill="#291c0e">Minimal interference risk</text>
<rect x="116" y="404" width="424" height="48" rx="10" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="328" y="433" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">Read it close, read it deliberately.</text>

<!-- RIGHT · UHF -->
<rect x="632" y="116" width="480" height="366" rx="14" fill="#eef0f4" stroke="#d4dae2" stroke-width="1.8"/>
<rect x="632" y="116" width="480" height="8" rx="4" fill="#4a5568"/>
<text x="872" y="156" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#3a4457">UHF · 860–960 MHz</text>
<text x="872" y="178" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the corridor and the store</text>
<circle cx="672" cy="234" r="4" fill="#4a5568"/>
<text x="694" y="239" font-size="15" fill="#291c0e">Asset tracking &amp; receiving</text>
<circle cx="672" cy="288" r="4" fill="#4a5568"/>
<text x="694" y="293" font-size="15" fill="#291c0e">Longer range, bulk read</text>
<circle cx="672" cy="342" r="4" fill="#4a5568"/>
<text x="694" y="347" font-size="15" fill="#291c0e">Laundry &amp; supply-chain</text>
<rect x="660" y="404" width="424" height="48" rx="10" fill="#ffffff" stroke="#d4dae2" stroke-width="1.3"/>
<text x="872" y="433" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4457">Read many, read from a distance.</text>

<rect x="88" y="506" width="1024" height="58" rx="12" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="533" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d5a3a">IEC 60601-1-2 electromagnetic-compatibility testing applies to any reader in clinical areas.</text>
<text x="600" y="553" text-anchor="middle" font-size="13" fill="#5c5c5c">Most hospitals run both — HF at the bedside, UHF in the corridors and stores.</text>
</svg>
