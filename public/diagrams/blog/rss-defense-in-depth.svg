<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="didTitle didDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="didTitle">Defense in depth: manual count, RFID adjunct, and x-ray long-stop</title>
  <desc id="didDesc">A three-tier stack. The foundation is the manual count, performed every case. The primary adjunct is the RFID wand plus 16 door portals, which confirms the count before closure. The long-stop is x-ray verification, used on any miscount. A radio-opaque thread on every sponge keeps it x-ray-detectable. Per AORN's 2019 guideline the adjunct technology supplements, and does not replace, the manual count.</desc>
  <defs>
    <radialGradient id="didBg" cx="50%" cy="18%" r="95%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#didBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="1" fill="#6d5a3a">DEFENSE IN DEPTH — THE WAND DIDN'T REPLACE ANYTHING</text>
  <text x="600" y="92" text-anchor="middle" font-size="15.5" fill="#6d5a3a">Three independent layers. The RFID wand added one — it replaced none.</text>

  <!-- Tier 3: x-ray long-stop (top, narrowest) -->
  <rect x="330" y="150" width="540" height="92" rx="14" fill="#4a5568"/>
  <text x="600" y="190" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="0.5" fill="#ffffff">X-RAY VERIFICATION</text>
  <text x="600" y="217" text-anchor="middle" font-size="14.5" fill="#d6dbe2">the long-stop — used on any miscount</text>
  <text x="884" y="202" font-size="13" font-weight="700" letter-spacing="1" fill="#8a949c">LAST RESORT</text>

  <!-- Tier 2: RFID adjunct (middle) -->
  <rect x="240" y="266" width="720" height="92" rx="14" fill="#1fcefb"/>
  <text x="600" y="306" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="0.5" fill="#06323c">RFID WAND + 16 DOOR PORTALS</text>
  <text x="600" y="333" text-anchor="middle" font-size="14.5" fill="#0a3a44">primary adjunct — confirms the count before closure</text>
  <text x="974" y="318" font-size="13" font-weight="700" letter-spacing="1" fill="#177a92">THE NEW LAYER</text>

  <!-- Tier 1: manual count foundation (bottom, widest) -->
  <rect x="150" y="382" width="900" height="92" rx="14" fill="#c39a5f"/>
  <text x="600" y="422" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="0.5" fill="#3a2c14">MANUAL COUNT</text>
  <text x="600" y="449" text-anchor="middle" font-size="14.5" fill="#4a3a1c">the foundation — performed every case</text>
  <text x="1030" y="434" text-anchor="end" font-size="13" font-weight="700" letter-spacing="1" fill="#6d5a3a">ALWAYS ON</text>

  <!-- radio-opaque thread running under everything -->
  <text x="600" y="524" text-anchor="middle" font-size="14.5" font-weight="600" fill="#8b2d2d">Radio-opaque thread on every sponge — keeps it x-ray-detectable (AORN)</text>
  <line x1="180" y1="540" x2="1020" y2="540" stroke="#8b2d2d" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round"/>

  <text x="600" y="600" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Per AORN's 2019 guideline, adjunct technology supplements — it does not replace — the manual count.</text>
</svg>
