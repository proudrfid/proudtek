<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five apparel and footwear brand playbooks for NFC-tagged product</title>
<desc id="d">Five brand rows. Allbirds uses per-pair carbon labels and AllbirdsRerun resale verification, with NFC in select Wool and Tree Runner styles and repair instructions. Patagonia Worn Wear enables repair routing and resale verification, with per-product Higg Index scores giving the chip real lifecycle-assessment depth. Nike Move To Zero verifies resale via StockX and GOAT and routes product back to Nike Refurbished and Renew. H&amp;M runs app journeys for tap-to-care, tap-to-recycle and tap-to-resell aligned to the EU ESPR Digital Product Passport. Inditex uses a UHF plus NFC dual-chip, UHF for supply chain and NFC for the consumer passport.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT THE BRANDS ACTUALLY DO</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="31" font-weight="700" fill="#291c0e">NFC-tagged product, five playbooks</text>
<text x="600" y="126" text-anchor="middle" font-size="15" fill="#4f4f4f">The consumer-engagement, repair-routing and recycling models that actually work in 2026.</text>

<!-- row 1 Allbirds -->
<rect x="64" y="150" width="1072" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="64" y="150" width="6" height="74" rx="3" fill="#2d6a4f"/>
<text x="92" y="182" font-size="16.5" font-weight="800" fill="#1b4332">Allbirds</text>
<text x="92" y="205" font-size="12.5" font-weight="700" fill="#6d5a3a">CARBON + RESALE</text>
<text x="320" y="180" font-size="13.5" fill="#291c0e">Per-pair carbon labels + AllbirdsRerun resale verification</text>
<text x="320" y="202" font-size="13.5" fill="#5c5c5c">NFC in select Wool / Tree Runner styles; links to repair instructions</text>

<!-- row 2 Patagonia -->
<rect x="64" y="236" width="1072" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="64" y="236" width="6" height="74" rx="3" fill="#2d6a4f"/>
<text x="92" y="268" font-size="16.5" font-weight="800" fill="#1b4332">Patagonia</text>
<text x="92" y="291" font-size="12.5" font-weight="700" fill="#6d5a3a">REPAIR + RESALE</text>
<text x="320" y="266" font-size="13.5" fill="#291c0e">Worn Wear repair routing + resale verification</text>
<text x="320" y="288" font-size="13.5" fill="#5c5c5c">Per-product Higg Index scores give the chip real LCA depth</text>

<!-- row 3 Nike -->
<rect x="64" y="322" width="1072" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="64" y="322" width="6" height="74" rx="3" fill="#2d6a4f"/>
<text x="92" y="354" font-size="16.5" font-weight="800" fill="#1b4332">Nike</text>
<text x="92" y="377" font-size="12.5" font-weight="700" fill="#6d5a3a">RESALE + RENEW</text>
<text x="320" y="352" font-size="13.5" fill="#291c0e">Move To Zero — resale verification via StockX / GOAT</text>
<text x="320" y="374" font-size="13.5" fill="#5c5c5c">Routes product back to Nike Refurbished and Renew programmes</text>

<!-- row 4 H&M -->
<rect x="64" y="408" width="1072" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="64" y="408" width="6" height="74" rx="3" fill="#2d6a4f"/>
<text x="92" y="440" font-size="16.5" font-weight="800" fill="#1b4332">H&amp;M</text>
<text x="92" y="463" font-size="12.5" font-weight="700" fill="#6d5a3a">TAP JOURNEYS</text>
<text x="320" y="438" font-size="13.5" fill="#291c0e">App journeys: tap-to-care, tap-to-recycle, tap-to-resell</text>
<text x="320" y="460" font-size="13.5" fill="#5c5c5c">Aligned to the EU ESPR Digital Product Passport requirement</text>

<!-- row 5 Inditex -->
<rect x="64" y="494" width="1072" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="64" y="494" width="6" height="74" rx="3" fill="#2d6a4f"/>
<text x="92" y="526" font-size="16.5" font-weight="800" fill="#1b4332">Inditex</text>
<text x="92" y="549" font-size="12.5" font-weight="700" fill="#6d5a3a">DUAL-CHIP</text>
<text x="320" y="524" font-size="13.5" fill="#291c0e">UHF + NFC dual-chip on premium / sustainability lines</text>
<text x="320" y="546" font-size="13.5" fill="#5c5c5c">UHF for supply-chain inventory, NFC for the consumer DPP</text>

<text x="600" y="596" text-anchor="middle" font-size="14" fill="#4f4f4f">Same chip, different jobs — resale proof, repair routing, recycling, compliance.</text>
</svg>
