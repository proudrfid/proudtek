<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five Incoterms RFID buyers use, as a rising cost ladder</title>
<desc id="d">Five ascending bars from lowest to highest supplier responsibility and price. EXW: buyer pays for everything, the lowest sticker price, about $0.05-0.10 per tag less than DDP. FOB: supplier delivers cleared-for-export to the named port, buyer takes freight and duties, roughly 10-20% cheaper than DDP on the freight leg. CIF: supplier covers freight and insurance to the destination port, adding 5-10% over FOB. DAP: supplier delivers to your door except import duties, adding 15-25% over EXW. DDP: supplier handles literally everything, adding 20-50% over EXW but the lowest-friction term.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INCOTERMS — THE COST &amp; RISK LADDER</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Five terms, from you-do-everything to supplier-does-everything.</text>

<text x="120" y="126" font-size="13" font-weight="700" fill="#5c5c5c">← you handle more, pay less</text>
<text x="1080" y="126" text-anchor="end" font-size="13" font-weight="700" fill="#6d5a3a">supplier handles more, you pay more →</text>

<line x1="90" y1="472" x2="1110" y2="472" stroke="#d9d2c4" stroke-width="2"/>

<!-- EXW -->
<rect x="128" y="400" width="150" height="72" rx="7" fill="#7c8794"/>
<text x="203" y="388" text-anchor="middle" font-size="18" font-weight="800" fill="#3f4657">EXW</text>
<text x="203" y="498" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">buyer pays all</text>
<text x="203" y="518" text-anchor="middle" font-size="12" fill="#5c5c5c">−$0.05-0.10/tag</text>

<!-- FOB -->
<rect x="323" y="352" width="150" height="120" rx="7" fill="#5a6678"/>
<text x="398" y="340" text-anchor="middle" font-size="18" font-weight="800" fill="#3f4657">FOB</text>
<text x="398" y="498" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">buyer: freight →</text>
<text x="398" y="518" text-anchor="middle" font-size="12" fill="#5c5c5c">−10-20% vs DDP</text>

<!-- CIF -->
<rect x="518" y="307" width="150" height="165" rx="7" fill="#3d6b6b"/>
<text x="593" y="295" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">CIF</text>
<text x="593" y="498" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">seller → port</text>
<text x="593" y="518" text-anchor="middle" font-size="12" fill="#5c5c5c">+5-10% vs FOB</text>

<!-- DAP -->
<rect x="713" y="252" width="150" height="220" rx="7" fill="#2c5454"/>
<text x="788" y="240" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">DAP</text>
<text x="788" y="498" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">seller → your door</text>
<text x="788" y="518" text-anchor="middle" font-size="12" fill="#5c5c5c">+15-25% vs EXW</text>

<!-- DDP -->
<rect x="908" y="187" width="150" height="285" rx="7" fill="#c39a5f"/>
<text x="983" y="175" text-anchor="middle" font-size="18" font-weight="800" fill="#6d5a3a">DDP</text>
<text x="983" y="498" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">seller pays all</text>
<text x="983" y="518" text-anchor="middle" font-size="12" fill="#5c5c5c">+20-50% vs EXW</text>

<text x="600" y="574" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Same tags, five contracts — the term you pick decides who owns the freight headache.</text>
</svg>
