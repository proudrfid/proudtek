<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">MIFARE Classic sector memory versus DESFire application-directory file system</title>
<desc id="d">Left, MIFARE Classic 1K: sixteen fixed sectors of 64 bytes each, one or two used by the lock and the rest free for a second app, with all-or-nothing sector-key access. Right, DESFire EV3: a flexible file system where one card holds many cryptographically isolated application directories (AIDs) — room access with read-write, loyalty with read-only, cashless POS with write-only — each managed independently with per-file permissions. Verdict: Classic fits one or two applications; DESFire is the only practical choice for a multi-application key card.</desc>
