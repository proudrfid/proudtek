<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five-step cold-chain RFID rollout</title>
<desc id="d">A five-step flow. Step one, tag and activate on the packaging line, capturing the first reading before shipment. Step two, scan hand-offs at every custody change, from receiving and warehouse to last-mile and dispensing. Step three, wire the backend into the serialization platform such as TraceLink or Optel, linked to the unit record. Step four, set out-of-range thresholds per product and name who responds among QA, the 3PL and the pharmacist. Step five, archive with the batch record for ten or more years for biologics. A banner underneath notes that custody changes hands but the temperature record does not.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE STEPS · ONE UNBROKEN RECORD</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">From the packaging line to the archive</text>

<line x1="180" y1="176" x2="1020" y2="176" stroke="#e4c98f" stroke-width="2.5"/>

<g text-anchor="middle">
<circle cx="180" cy="176" r="26" fill="#c39a5f"/>
<text x="180" y="184" font-size="20" font-weight="800" fill="#ffffff">1</text>
<rect x="80" y="224" width="200" height="152" rx="12" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="180" y="254" font-size="15.5" font-weight="700" fill="#291c0e">Tag &amp; activate</text>
<text x="180" y="282" font-size="12.5" fill="#4f4f4f">on the packaging line</text>
<text x="180" y="304" font-size="12.5" fill="#4f4f4f">first reading before</text>
<text x="180" y="326" font-size="12.5" fill="#4f4f4f">anything ships</text>
<text x="180" y="356" font-size="12" fill="#6d5a3a">the clock starts here</text>

<circle cx="390" cy="176" r="26" fill="#c39a5f"/>
<text x="390" y="184" font-size="20" font-weight="800" fill="#ffffff">2</text>
<rect x="290" y="224" width="200" height="152" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="390" y="254" font-size="15.5" font-weight="700" fill="#291c0e">Scan hand-offs</text>
<text x="390" y="282" font-size="12.5" fill="#4f4f4f">receiving · warehouse</text>
<text x="390" y="304" font-size="12.5" fill="#4f4f4f">last-mile · dispensing</text>
<text x="390" y="326" font-size="12.5" fill="#4f4f4f">each scan pulls data</text>
<text x="390" y="356" font-size="12" fill="#6d5a3a">every custody change</text>

<circle cx="600" cy="176" r="26" fill="#c39a5f"/>
<text x="600" y="184" font-size="20" font-weight="800" fill="#ffffff">3</text>
<rect x="500" y="224" width="200" height="152" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="254" font-size="15.5" font-weight="700" fill="#291c0e">Wire the backend</text>
<text x="600" y="282" font-size="12.5" fill="#4f4f4f">serialization platform</text>
<text x="600" y="304" font-size="12.5" fill="#4f4f4f">TraceLink · Optel</text>
<text x="600" y="326" font-size="12.5" fill="#4f4f4f">QA queries on demand</text>
<text x="600" y="356" font-size="12" fill="#6d5a3a">linked to the unit</text>

<circle cx="810" cy="176" r="26" fill="#c39a5f"/>
<text x="810" y="184" font-size="20" font-weight="800" fill="#ffffff">4</text>
<rect x="710" y="224" width="200" height="152" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="810" y="254" font-size="15.5" font-weight="700" fill="#291c0e">Thresholds + owner</text>
<text x="810" y="282" font-size="12.5" fill="#4f4f4f">out-of-range limits</text>
<text x="810" y="304" font-size="12.5" fill="#4f4f4f">per product — and</text>
<text x="810" y="326" font-size="12.5" fill="#4f4f4f">name who responds</text>
<text x="810" y="356" font-size="12" fill="#6d5a3a">QA · 3PL · pharmacist</text>

<circle cx="1020" cy="176" r="26" fill="#2d6a4f"/>
<text x="1020" y="184" font-size="20" font-weight="800" fill="#ffffff">5</text>
<rect x="920" y="224" width="200" height="152" rx="12" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="1020" y="254" font-size="15.5" font-weight="700" fill="#1b4332">Archive</text>
<text x="1020" y="282" font-size="12.5" fill="#4f4f4f">with the batch record</text>
<text x="1020" y="304" font-size="12.5" fill="#4f4f4f">10+ yr for biologics</text>
<text x="1020" y="326" font-size="12.5" fill="#4f4f4f">audit-ready for years</text>
<text x="1020" y="356" font-size="12" fill="#1b4332">the long-haul record</text>
</g>

<rect x="240" y="436" width="720" height="108" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="478" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="22" font-weight="700" fill="#291c0e">Custody changes hands. The record does not.</text>
<text x="600" y="512" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Step 4 is the one that fails quietly — an alert with no named owner is a notification nobody reads.</text>

<text x="600" y="600" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The same five steps run at major pharma manufacturers today.</text>
</svg>
