<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Print-ready hotel key card artwork anatomy</title>
<desc id="d">A CR80 hotel key card layout showing the print-production guides: an outer bleed line 2 mm past the cut, the trim or cut line at 85.60 by 53.98 mm with a 3.18 mm corner radius, and an inner safe area 3 mm inside where critical type must stay. The chip footprint on the left must be kept clear of heavy metallic ink and foil, and the printed tap indicator should point to the real chip. The file is exported as PDF/X-4, CMYK with Pantone spots at Delta-E under 2.0, fonts embedded and outlined, at 300 dpi.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PRINT-READY ARTWORK ANATOMY</text>
<text x="600" y="94" text-anchor="middle" font-size="31" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">The card, field by field</text>
<text x="600" y="122" text-anchor="middle" font-size="15" fill="#4f4f4f">Every spec a production planner needs — locked before the first proof.</text>

<!-- bleed / trim / safe -->
<rect x="366" y="188" width="468" height="306" rx="22" fill="none" stroke="#c39a5f" stroke-width="1.8" stroke-dasharray="7 5"/>
<rect x="380" y="202" width="440" height="278" rx="16" fill="#ffffff" stroke="#291c0e" stroke-width="2.5"/>
<rect x="398" y="220" width="404" height="242" rx="10" fill="none" stroke="#8fb6b6" stroke-width="1.6" stroke-dasharray="6 5"/>

<!-- chip -->
<rect x="420" y="312" width="60" height="60" rx="9" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="450" y="338" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">NFC</text>
<text x="450" y="356" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">CHIP</text>
<path d="M 496 322 a 22 22 0 0 1 0 40" fill="none" stroke="#79a3a3" stroke-width="2"/>
<path d="M 506 316 a 32 32 0 0 1 0 52" fill="none" stroke="#9cc0c0" stroke-width="1.8"/>
<text x="500" y="392" font-size="12" font-weight="700" fill="#2c5454">tap</text>

<!-- logo + room -->
<rect x="566" y="250" width="176" height="86" rx="8" fill="#f3ede0" stroke="#d9b45f" stroke-width="1.6"/>
<text x="654" y="299" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#a07d43">LOGO</text>
<text x="784" y="452" text-anchor="end" font-size="13" font-weight="700" fill="#4a5568">RM 0412</text>

<!-- left callouts -->
<line x1="352" y1="342" x2="420" y2="342" stroke="#c3b48f" stroke-width="1.6"/><circle cx="420" cy="342" r="3.2" fill="#2c5454"/>
<text x="344" y="332" text-anchor="end" font-size="14" font-weight="700" fill="#291c0e">Chip footprint —</text>
<text x="344" y="351" text-anchor="end" font-size="13.5" fill="#5c5c5c">keep foil &amp; metallic ink clear</text>
<line x1="352" y1="408" x2="500" y2="372" stroke="#c3b48f" stroke-width="1.6"/><circle cx="500" cy="372" r="3.2" fill="#2c5454"/>
<text x="344" y="410" text-anchor="end" font-size="14" font-weight="700" fill="#291c0e">Tap indicator points</text>
<text x="344" y="429" text-anchor="end" font-size="13.5" fill="#5c5c5c">to the real chip</text>

<!-- right callouts -->
<line x1="834" y1="210" x2="848" y2="240" stroke="#c3b48f" stroke-width="1.6"/><circle cx="834" cy="210" r="3.2" fill="#a07d43"/>
<text x="856" y="236" font-size="14" font-weight="700" fill="#291c0e">Bleed 2 mm —</text>
<text x="856" y="255" font-size="13.5" fill="#5c5c5c">artwork extends past the cut</text>
<line x1="820" y1="300" x2="848" y2="316" stroke="#c3b48f" stroke-width="1.6"/><circle cx="820" cy="300" r="3.2" fill="#291c0e"/>
<text x="856" y="312" font-size="14" font-weight="700" fill="#291c0e">Trim / cut line —</text>
<text x="856" y="331" font-size="13.5" fill="#5c5c5c">85.60 × 53.98 mm · r 3.18 mm</text>
<line x1="802" y1="400" x2="848" y2="404" stroke="#c3b48f" stroke-width="1.6"/><circle cx="802" cy="400" r="3.2" fill="#2c5454"/>
<text x="856" y="400" font-size="14" font-weight="700" fill="#291c0e">Safe area 3 mm —</text>
<text x="856" y="419" font-size="13.5" fill="#5c5c5c">critical type stays inside</text>

<!-- export strip -->
<rect x="230" y="524" width="740" height="58" rx="12" fill="#eef5f5" stroke="#cfe3dd" stroke-width="1.8"/>
<text x="600" y="548" text-anchor="middle" font-size="14.5" font-weight="800" fill="#234a4a">Export PDF/X-4 · CMYK + Pantone (ΔE ≤ 2.0)</text>
<text x="600" y="569" text-anchor="middle" font-size="13.5" fill="#3a5a5a">fonts embedded &amp; outlined · 300 dpi · finish stack declared in order</text>

<text x="600" y="614" text-anchor="middle" font-size="14" fill="#4f4f4f">Leave any field ambiguous and it becomes a supplier question — each round costs 3–5 business days.</text>
</svg>
