<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Three RFID elevator access architectures compared</title>
<desc id="d">Three columns compare the architectures for RFID elevator access. First, a relay-based retrofit, where an RFID reader and relay board intercept the button-panel wiring on any elevator, at roughly 500 to 2,000 dollars per elevator. Second, elevator controller integration, where the access-control system talks to the elevator controller over serial or IP for destination dispatch, at roughly 2,000 to 5,000 dollars. Third, a cloud-managed smart panel that replaces the button panel with a standalone RFID touch panel, at roughly 5,000 to 10,000 dollars. Each differs in where the reader taps in, its cost and its integration complexity.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THREE WAYS TO WIRE IT IN</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Where the RFID reader taps the elevator decides cost and complexity.</text>

<!-- Column 1: relay retrofit (teal) -->
<rect x="64" y="118" width="326" height="496" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="64" y="118" width="326" height="10" rx="4" fill="#3d6b6b"/>
<circle cx="104" cy="160" r="17" fill="#3d6b6b"/>
<text x="104" y="166" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
<text x="134" y="153" font-size="16" font-weight="800" fill="#291c0e">Relay-based</text>
<text x="134" y="173" font-size="16" font-weight="800" fill="#291c0e">retrofit</text>

<rect x="101" y="200" width="252" height="44" rx="8" fill="#eef5f5" stroke="#8fb6b6" stroke-width="2"/>
<text x="227" y="227" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">RFID reader + relay</text>
<line x1="227" y1="244" x2="227" y2="266" stroke="#9aa3ad" stroke-width="2"/>
<polygon points="221,260 227,272 233,260" fill="#9aa3ad"/>
<rect x="101" y="272" width="252" height="44" rx="8" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
<text x="227" y="299" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Button-panel wiring</text>
<line x1="227" y1="316" x2="227" y2="338" stroke="#9aa3ad" stroke-width="2"/>
<polygon points="221,332 227,344 233,332" fill="#9aa3ad"/>
<rect x="101" y="344" width="252" height="44" rx="8" fill="#ffffff" stroke="#cdd3da" stroke-width="1.8"/>
<text x="227" y="371" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a5568">Any elevator</text>

<line x1="94" y1="410" x2="360" y2="410" stroke="#eae4d7" stroke-width="1.6"/>
<text x="98" y="440" font-size="13" fill="#291c0e">Cost · $500 – $2,000 / car</text>
<text x="98" y="468" font-size="13" fill="#291c0e">Wiring · moderate, electrical</text>
<text x="98" y="496" font-size="13" fill="#291c0e">Best for · existing elevators</text>
<text x="98" y="546" font-size="12.5" font-weight="700" fill="#2c5454">Cheapest, works on any car.</text>

<!-- Column 2: controller integration (steel) -->
<rect x="437" y="118" width="326" height="496" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="437" y="118" width="326" height="10" rx="4" fill="#4a5568"/>
<circle cx="477" cy="160" r="17" fill="#4a5568"/>
<text x="477" y="166" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<text x="507" y="153" font-size="16" font-weight="800" fill="#291c0e">Controller</text>
<text x="507" y="173" font-size="16" font-weight="800" fill="#291c0e">integration</text>

<rect x="474" y="200" width="252" height="44" rx="8" fill="#eef0f4" stroke="#a7afbb" stroke-width="2"/>
<text x="600" y="227" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a4454">RFID reader → ACS</text>
<line x1="600" y1="244" x2="600" y2="266" stroke="#9aa3ad" stroke-width="2"/>
<polygon points="594,260 600,272 606,260" fill="#9aa3ad"/>
<rect x="474" y="272" width="252" height="44" rx="8" fill="#4a5568" stroke="#3a4454" stroke-width="2"/>
<text x="600" y="293" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Elevator controller</text>
<text x="600" y="309" text-anchor="middle" font-size="12" fill="#d7dbe2">serial / IP</text>
<line x1="600" y1="316" x2="600" y2="338" stroke="#9aa3ad" stroke-width="2"/>
<polygon points="594,332 600,344 606,332" fill="#9aa3ad"/>
<rect x="474" y="344" width="252" height="44" rx="8" fill="#ffffff" stroke="#cdd3da" stroke-width="1.8"/>
<text x="600" y="371" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a5568">Destination dispatch</text>

<line x1="467" y1="410" x2="733" y2="410" stroke="#eae4d7" stroke-width="1.6"/>
<text x="471" y="440" font-size="13" fill="#291c0e">Cost · $2,000 – $5,000 / car</text>
<text x="471" y="468" font-size="13" fill="#291c0e">Wiring · high, vendor API</text>
<text x="471" y="496" font-size="13" fill="#291c0e">Best for · new construction</text>
<text x="471" y="546" font-size="12.5" font-weight="700" fill="#3a4454">Deepest integration.</text>

<!-- Column 3: cloud smart panel (forest) -->
<rect x="810" y="118" width="326" height="496" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="810" y="118" width="326" height="10" rx="4" fill="#2d6a4f"/>
<circle cx="850" cy="160" r="17" fill="#2d6a4f"/>
<text x="850" y="166" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<text x="880" y="153" font-size="16" font-weight="800" fill="#291c0e">Cloud smart</text>
<text x="880" y="173" font-size="16" font-weight="800" fill="#291c0e">panel</text>

<rect x="847" y="200" width="252" height="44" rx="8" fill="#e9f2ec" stroke="#94bfa5" stroke-width="2"/>
<text x="973" y="227" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b4332">RFID touch panel</text>
<line x1="973" y1="244" x2="973" y2="266" stroke="#9aa3ad" stroke-width="2"/>
<polygon points="967,260 973,272 979,260" fill="#9aa3ad"/>
<rect x="847" y="272" width="252" height="44" rx="8" fill="#2d6a4f" stroke="#1b4332" stroke-width="2"/>
<text x="973" y="299" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Replaces button panel</text>
<line x1="973" y1="316" x2="973" y2="338" stroke="#9aa3ad" stroke-width="2"/>
<polygon points="967,332 973,344 979,332" fill="#9aa3ad"/>
<rect x="847" y="344" width="252" height="44" rx="8" fill="#ffffff" stroke="#cdd3da" stroke-width="1.8"/>
<text x="973" y="371" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2d6a4f">Standalone / cloud</text>

<line x1="840" y1="410" x2="1106" y2="410" stroke="#eae4d7" stroke-width="1.6"/>
<text x="844" y="440" font-size="13" fill="#291c0e">Cost · $5,000 – $10,000 / car</text>
<text x="844" y="468" font-size="13" fill="#291c0e">Wiring · low, standalone</text>
<text x="844" y="496" font-size="13" fill="#291c0e">Best for · premium retrofit</text>
<text x="844" y="546" font-size="12.5" font-weight="700" fill="#1b4332">Newest UX, priciest.</text>

<text x="600" y="648" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Same credential, three integration depths — the reader just taps in at a different point.</text>
</svg>
