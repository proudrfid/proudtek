<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The RFID data foundation an AI inventory layer stands on</title>
<desc id="d">A foundation diagram. On top, the AI layer: predictions, alerts and automated actions — it inherits the quality of everything below it. Five foundation blocks hold it up: 99%+ accuracy from daily or real-time item-level snapshots; location detail down to backroom, sales floor, fitting room and zone; historical depth of months to years of movement, seasons, promos and trends; real-time events for received, moved, sold and returned with no batch waiting; and cross-channel visibility across stores, DCs, transit and returns in one view. Caption: feed the same architecture a nightly hand-typed total and it returns your old errors, now wearing the authority of a prediction.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE DATA FOUNDATION</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">What the AI layer stands on</text>

<rect x="180" y="126" width="840" height="104" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
<text x="600" y="160" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">AI LAYER</text>
<text x="600" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">predictions · alerts · automated actions</text>
<text x="600" y="212" text-anchor="middle" font-size="12.5" fill="#4f4f4f">inherits the quality of everything below it</text>

<path d="M 168 240 l -6 12 h 12 z" fill="#3d6b6b"/>
<line x1="168" y1="252" x2="168" y2="288" stroke="#3d6b6b" stroke-width="2"/>
<path d="M 384 240 l -6 12 h 12 z" fill="#3d6b6b"/>
<line x1="384" y1="252" x2="384" y2="288" stroke="#3d6b6b" stroke-width="2"/>
<path d="M 600 240 l -6 12 h 12 z" fill="#3d6b6b"/>
<line x1="600" y1="252" x2="600" y2="288" stroke="#3d6b6b" stroke-width="2"/>
<path d="M 816 240 l -6 12 h 12 z" fill="#3d6b6b"/>
<line x1="816" y1="252" x2="816" y2="288" stroke="#3d6b6b" stroke-width="2"/>
<path d="M 1032 240 l -6 12 h 12 z" fill="#3d6b6b"/>
<line x1="1032" y1="252" x2="1032" y2="288" stroke="#3d6b6b" stroke-width="2"/>

<rect x="68" y="300" width="200" height="250" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="168" y="348" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">99%+ accuracy</text>
<text x="168" y="406" text-anchor="middle" font-size="12.5" fill="#4f4f4f">daily or real-time</text>
<text x="168" y="428" text-anchor="middle" font-size="12.5" fill="#4f4f4f">item-level snapshots</text>

<rect x="284" y="300" width="200" height="250" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="384" y="348" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">Location detail</text>
<text x="384" y="406" text-anchor="middle" font-size="12.5" fill="#4f4f4f">backroom, sales floor,</text>
<text x="384" y="428" text-anchor="middle" font-size="12.5" fill="#4f4f4f">fitting room, zone</text>

<rect x="500" y="300" width="200" height="250" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="600" y="348" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">Historical depth</text>
<text x="600" y="406" text-anchor="middle" font-size="12.5" fill="#4f4f4f">months-years of</text>
<text x="600" y="428" text-anchor="middle" font-size="12.5" fill="#4f4f4f">movement, seasons,</text>
<text x="600" y="450" text-anchor="middle" font-size="12.5" fill="#4f4f4f">promos, trends</text>

<rect x="716" y="300" width="200" height="250" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="816" y="348" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">Live events</text>
<text x="816" y="406" text-anchor="middle" font-size="12.5" fill="#4f4f4f">received, moved,</text>
<text x="816" y="428" text-anchor="middle" font-size="12.5" fill="#4f4f4f">sold, returned —</text>
<text x="816" y="450" text-anchor="middle" font-size="12.5" fill="#4f4f4f">no batch waiting</text>

<rect x="932" y="300" width="200" height="250" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="1032" y="348" text-anchor="middle" font-size="18" font-weight="800" fill="#2c5454">Cross-channel</text>
<text x="1032" y="406" text-anchor="middle" font-size="12.5" fill="#4f4f4f">stores, DCs, transit</text>
<text x="1032" y="428" text-anchor="middle" font-size="12.5" fill="#4f4f4f">and returns,</text>
<text x="1032" y="450" text-anchor="middle" font-size="12.5" fill="#4f4f4f">one unified view</text>

<text x="600" y="612" text-anchor="middle" font-size="14" fill="#5c5c5c">Feed the same architecture a nightly hand-typed total and it returns your old errors — now wearing the authority of a prediction.</text>
</svg>
