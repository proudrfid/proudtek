<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five negotiation moves that get a distributor below posted RFID MOQ</title>
<desc id="d">Five rows pairing a move with the cost driver it dissolves. A blanket order with monthly draws commits annual MOQ times 1.5 shipped one twelfth monthly, giving the factory a volume guarantee. Multi-SKU bundling runs three to five SKUs together so per-SKU MOQ is effectively halved. Paying tooling separately as a 500 to 5,000 dollar one-time charge removes the amortization driver. Converting a 200 to 500 unit sample run into a real first order gets a foot in the door. Buying residual inventory from cancelled orders is available at 70 to 90 percent of price with no MOQ.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE MOVES · GET BELOW MOQ</text>
<text x="600" y="82" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Each move dissolves one of the five cost drivers — at a premium the factory can accept.</text>

<!-- row 1 -->
<rect x="64" y="112" width="312" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="82" y="140" font-size="15" font-weight="800" fill="#2c5454">Blanket order</text>
<text x="82" y="162" font-size="12.5" fill="#5c7a7a">monthly draws</text>
<line x1="386" y1="147" x2="410" y2="147" stroke="#3d6b6b" stroke-width="3"/><polygon points="410,140 426,147 410,154" fill="#3d6b6b"/>
<rect x="436" y="112" width="700" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="436" y="112" width="6" height="70" rx="3" fill="#3d6b6b"/>
<text x="462" y="140" font-size="14.5" fill="#291c0e">Commit annual MOQ ×1.5, drawn 1/12 monthly.</text>
<text x="462" y="163" font-size="13.5" fill="#5c5c5c">Factory gets the volume guarantee; you get sub-MOQ shipments.</text>

<!-- row 2 -->
<rect x="64" y="202" width="312" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="82" y="230" font-size="15" font-weight="800" fill="#2c5454">Multi-SKU bundle</text>
<text x="82" y="252" font-size="12.5" fill="#5c7a7a">share one run</text>
<line x1="386" y1="237" x2="410" y2="237" stroke="#3d6b6b" stroke-width="3"/><polygon points="410,230 426,237 410,244" fill="#3d6b6b"/>
<rect x="436" y="202" width="700" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="436" y="202" width="6" height="70" rx="3" fill="#3d6b6b"/>
<text x="462" y="230" font-size="14.5" fill="#291c0e">Combine 3–5 related SKUs into one production run.</text>
<text x="462" y="253" font-size="13.5" fill="#5c5c5c">Setup amortizes across SKUs; per-SKU MOQ effectively halved.</text>

<!-- row 3 -->
<rect x="64" y="292" width="312" height="70" rx="12" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.6"/>
<text x="82" y="320" font-size="15" font-weight="800" fill="#6d5a3a">Pay tooling</text>
<text x="82" y="342" font-size="12.5" fill="#8a7550">as a one-time charge</text>
<line x1="386" y1="327" x2="410" y2="327" stroke="#c39a5f" stroke-width="3"/><polygon points="410,320 426,327 410,334" fill="#c39a5f"/>
<rect x="436" y="292" width="700" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="436" y="292" width="6" height="70" rx="3" fill="#c39a5f"/>
<text x="462" y="320" font-size="14.5" fill="#291c0e">Cover the $500–5K tooling up front, not amortized.</text>
<text x="462" y="343" font-size="13.5" fill="#5c5c5c">Removes the amortization driver; factory accepts much lower MOQ.</text>

<!-- row 4 -->
<rect x="64" y="382" width="312" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="82" y="410" font-size="15" font-weight="800" fill="#2c5454">Convert sample run</text>
<text x="82" y="432" font-size="12.5" fill="#5c7a7a">foot in the door</text>
<line x1="386" y1="417" x2="410" y2="417" stroke="#3d6b6b" stroke-width="3"/><polygon points="410,410 426,417 410,424" fill="#3d6b6b"/>
<rect x="436" y="382" width="700" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="436" y="382" width="6" height="70" rx="3" fill="#3d6b6b"/>
<text x="462" y="410" font-size="14.5" fill="#291c0e">Pay the premium on a 200–500-unit sample run.</text>
<text x="462" y="433" font-size="13.5" fill="#5c5c5c">Use it as a real first order at very low quantity.</text>

<!-- row 5 -->
<rect x="64" y="472" width="312" height="70" rx="12" fill="#eaf3ec" stroke="#c4dccb" stroke-width="1.6"/>
<text x="82" y="500" font-size="15" font-weight="800" fill="#1b4332">Buy residual stock</text>
<text x="82" y="522" font-size="12.5" fill="#5c7a68">no MOQ — just ask</text>
<line x1="386" y1="507" x2="410" y2="507" stroke="#2d6a4f" stroke-width="3"/><polygon points="410,500 426,507 410,514" fill="#2d6a4f"/>
<rect x="436" y="472" width="700" height="70" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="436" y="472" width="6" height="70" rx="3" fill="#2d6a4f"/>
<text x="462" y="500" font-size="14.5" fill="#291c0e">Take cancelled-order inventory at 70–90% of normal price.</text>
<text x="462" y="523" font-size="13.5" fill="#5c5c5c">No MOQ — but you have to ask explicitly, every time.</text>

<text x="600" y="586" text-anchor="middle" font-size="14" fill="#4f4f4f">Match the move to the driver, and the minimum stops being a wall.</text>
</svg>
