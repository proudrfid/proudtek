<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The hybrid pattern — NFC tap for the handshake, Bluetooth for the data</title>
  <desc id="d">A four-step hybrid flow used by premium electronics: the phone taps the NFC tag in a device; the tag carries a pairing handover payload with the Bluetooth MAC address and keys; the phone pairs silently with no settings menu; and Bluetooth then sustains the audio or sensor data channel. Examples include Sony, Bose and Sennheiser tap-to-pair headphones, Wi-Fi Easy Connect provisioning, and medical devices that use NFC for local configuration and BLE for ongoing streaming.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE HYBRID PATTERN — NFC HANDSHAKE, BLUETOOTH DATA</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">The two are usually deployed together, not as alternatives — tap to initiate, Bluetooth to sustain</text>

  <rect x="70" y="170" width="235" height="200" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="170" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="187" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1 · TAP</text>
  <text x="187" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Phone taps the NFC</text>
  <text x="187" y="272" text-anchor="middle" font-size="14" fill="#291c0e">tag in the device</text>
  <text x="187" y="306" text-anchor="middle" font-size="12.5" fill="#5c5c5c">0–5 cm · no app,</text>
  <text x="187" y="324" text-anchor="middle" font-size="12.5" fill="#5c5c5c">no menu</text>

  <rect x="345" y="170" width="235" height="200" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="345" y="170" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="462" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2 · HANDOVER</text>
  <text x="462" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Tag carries the</text>
  <text x="462" y="272" text-anchor="middle" font-size="14" fill="#291c0e">Bluetooth MAC + keys</text>
  <text x="462" y="306" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Pairing handover</text>
  <text x="462" y="324" text-anchor="middle" font-size="12.5" fill="#5c5c5c">payload on the tag</text>

  <rect x="620" y="170" width="235" height="200" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="620" y="170" width="235" height="42" rx="14" fill="#3d6b6b"/>
  <text x="737" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3 · PAIR</text>
  <text x="737" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Phone pairs silently</text>
  <text x="737" y="272" text-anchor="middle" font-size="14" fill="#291c0e">— no settings menu</text>
  <text x="737" y="306" text-anchor="middle" font-size="12.5" fill="#5c5c5c">No scan / select /</text>
  <text x="737" y="324" text-anchor="middle" font-size="12.5" fill="#5c5c5c">enter-PIN flow</text>

  <rect x="895" y="170" width="235" height="200" rx="14" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <rect x="895" y="170" width="235" height="42" rx="14" fill="#1f6f3a"/>
  <text x="1012" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4 · STREAM</text>
  <text x="1012" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Bluetooth sustains</text>
  <text x="1012" y="272" text-anchor="middle" font-size="14" fill="#291c0e">the data channel</text>
  <text x="1012" y="306" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Audio 1–3 Mbps or</text>
  <text x="1012" y="324" text-anchor="middle" font-size="12.5" fill="#5c5c5c">BLE sensor data</text>

  <polygon points="308,270 336,270 336,264 350,273 336,282 336,276 308,276" fill="#4a5568"/>
  <polygon points="583,270 611,270 611,264 625,273 611,282 611,276 583,276" fill="#4a5568"/>
  <polygon points="858,270 886,270 886,264 900,273 886,282 886,276 858,276" fill="#4a5568"/>

  <rect x="70" y="410" width="1060" height="74" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="92" y="440" font-size="15" font-weight="700" fill="#2c5454">Where you already see it</text>
  <text x="92" y="463" font-size="13.5" fill="#3d6b6b">Sony / Bose / Sennheiser tap-to-pair headphones · Wi-Fi Easy Connect provisioning · insulin pumps configured over NFC, streaming over BLE.</text>

  <text x="600" y="540" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Each protocol does what it is best at: NFC removes the pairing friction, Bluetooth carries the sustained load.</text>
</svg>
