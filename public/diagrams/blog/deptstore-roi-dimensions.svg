<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="roiTitle roiDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="roiTitle">What smart-shelf plus EAS pays back</title>
  <desc id="roiDesc">Four outcome cards from public 2024 to 2026 retail-industry benchmarks. Shrinkage reduction of 30 to 50 percent within 12 months. Out-of-stock drop of 30 to 60 percent on high-velocity SKUs. Cycle-count labor down 15 to 30 percent, reallocated to customer service. Topline revenue lift of 3 to 5 percent, validated in matched-pair store comparisons. A payback strip: 12 to 24 months typical for tier-1 deployments, and under 12 months for anchor stores above 100 million dollars annual revenue on shrinkage savings alone.</desc>
  <defs>
    <radialGradient id="roiBg" cx="50%" cy="22%" r="88%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="roiDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#291c0e"/>
      <stop offset="100%" stop-color="#6c5127"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#roiBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="58" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="2.5" fill="#6d5a3a">WHAT SMART-SHELF + EAS PAYS BACK</text>
  <text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">public 2024–2026 retail-industry benchmarks</text>

  <!-- Card A: shrinkage (forest) -->
  <rect x="60" y="108" width="530" height="152" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="84" y="134" width="14" height="14" rx="3" fill="#2d6a4f"/>
  <text x="110" y="146" font-size="16" font-weight="700" fill="#291c0e">Shrinkage reduction</text>
  <text x="84" y="212" font-size="44" font-weight="800" fill="#2d6a4f">30–50%</text>
  <text x="84" y="242" font-size="14.5" fill="#4f4f4f">identified shrink value, within 12 months</text>

  <!-- Card B: out-of-stock (teal) -->
  <rect x="610" y="108" width="530" height="152" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="634" y="134" width="14" height="14" rx="3" fill="#3d6b6b"/>
  <text x="660" y="146" font-size="16" font-weight="700" fill="#291c0e">Out-of-stock drop</text>
  <text x="634" y="212" font-size="44" font-weight="800" fill="#3d6b6b">30–60%</text>
  <text x="634" y="242" font-size="14.5" fill="#4f4f4f">on high-velocity SKUs — fewer walk-aways</text>

  <!-- Card C: labor (steel) -->
  <rect x="60" y="278" width="530" height="152" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="84" y="304" width="14" height="14" rx="3" fill="#4a5568"/>
  <text x="110" y="316" font-size="16" font-weight="700" fill="#291c0e">Cycle-count labor</text>
  <text x="84" y="382" font-size="44" font-weight="800" fill="#4a5568">15–30%</text>
  <text x="84" y="412" font-size="14.5" fill="#4f4f4f">automated — reallocated to service, not cut</text>

  <!-- Card D: revenue (gold) -->
  <rect x="610" y="278" width="530" height="152" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <rect x="634" y="304" width="14" height="14" rx="3" fill="#c39a5f"/>
  <text x="660" y="316" font-size="16" font-weight="700" fill="#291c0e">Topline revenue lift</text>
  <text x="634" y="382" font-size="44" font-weight="800" fill="#b8873f">3–5%</text>
  <text x="634" y="412" font-size="14.5" fill="#4f4f4f">validated in matched-pair store comparisons</text>

  <!-- Payback strip -->
  <rect x="60" y="470" width="1080" height="126" rx="16" fill="url(#roiDark)"/>
  <text x="104" y="516" font-size="14" font-weight="800" letter-spacing="1.5" fill="#d4a755">PAYBACK PERIOD</text>
  <text x="104" y="552" font-size="15" fill="#f4efe4">the whole system, earned back</text>
  <line x1="470" y1="498" x2="470" y2="568" stroke="#c39a5f" stroke-width="1.5" opacity="0.5"/>
  <g text-anchor="middle">
    <text x="640" y="528" font-size="34" font-weight="800" fill="#d4a755">12–24 mo</text>
    <text x="640" y="558" font-size="14.5" fill="#f4efe4">typical tier-1 deployment</text>
    <text x="940" y="528" font-size="34" font-weight="800" fill="#d4a755">&lt;12 mo</text>
    <text x="940" y="558" font-size="14.5" fill="#f4efe4">anchor stores (&gt;$100M) on shrink alone</text>
  </g>
  <line x1="800" y1="498" x2="800" y2="568" stroke="#c39a5f" stroke-width="1.5" opacity="0.5"/>
</svg>
