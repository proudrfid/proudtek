<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Standard RFID wood card — construction cross-section and card face</title>
  <desc id="d">Left: exploded layer stack of the standard RFID wood card — a lacquer seal on top, a 0.3–0.5 mm top veneer that serves as the engraving face, a routed cavity holding the 13.56 MHz HF inlay (antenna coil plus chip), and a closing wood layer underneath; total standard build 0.84 mm, custom 0.6–1.2 mm. Right: card face view at CR80 footprint 85.6 × 54 mm showing the perimeter antenna loop, the chip position, and the laser engraving zone. Read range 2–5 cm typical, up to 7 cm with MIFARE Plus EV2.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">STANDARD RFID WOOD CARD — CONSTRUCTION</text>
  <text x="600" y="100" text-anchor="middle" font-size="36" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">How a chip lives inside wood</text>

  <!-- ================= LEFT: exploded layer stack ================= -->
  <text x="90" y="152" font-size="15" font-weight="700" letter-spacing="0.4" fill="#4f4f4f">LAYER STACK, EXPLODED</text>

  <!-- layer 1: lacquer seal -->
  <rect x="90" y="172" width="300" height="12" rx="6" fill="#d4a755"/>
  <text x="410" y="183" font-size="14" font-weight="600" fill="#291c0e">Lacquer seal</text>
  <text x="410" y="201" font-size="12.5" fill="#5c5c5c">matte, gloss, or food-safe</text>

  <!-- layer 2: top veneer -->
  <rect x="90" y="204" width="300" height="36" rx="6" fill="#c39a5f"/>
  <text x="410" y="221" font-size="14" font-weight="600" fill="#291c0e">Top veneer, 0.3–0.5 mm</text>
  <text x="410" y="239" font-size="12.5" fill="#5c5c5c">the engraving face</text>

  <!-- layer 3: routed cavity + inlay -->
  <rect x="90" y="260" width="300" height="72" rx="6" fill="#b98d54"/>
  <rect x="120" y="272" width="240" height="48" rx="6" fill="#f7edd6"/>
  <rect x="132" y="280" width="216" height="32" rx="5" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
  <rect x="140" y="286" width="200" height="20" rx="4" fill="none" stroke="#3d6b6b" stroke-width="1.5" opacity="0.6"/>
  <rect x="228" y="284" width="24" height="24" rx="3" fill="#4a5568"/>
  <text x="410" y="285" font-size="14" font-weight="600" fill="#291c0e">Routed cavity — HF inlay</text>
  <text x="410" y="303" font-size="12.5" fill="#5c5c5c">13.56 MHz antenna coil + chip</text>
  <text x="410" y="321" font-size="12.5" fill="#5c5c5c">NTAG · MIFARE · ICODE options</text>

  <!-- layer 4: closing wood layer -->
  <rect x="90" y="352" width="300" height="44" rx="6" fill="#a5804a"/>
  <text x="410" y="371" font-size="14" font-weight="600" fill="#291c0e">Closing wood layer</text>
  <text x="410" y="389" font-size="12.5" fill="#5c5c5c">seals the cavity flat</text>

  <!-- total-thickness bracket -->
  <line x1="72" y1="172" x2="72" y2="396" stroke="#6d5a3a" stroke-width="2"/>
  <line x1="66" y1="172" x2="78" y2="172" stroke="#6d5a3a" stroke-width="2"/>
  <line x1="66" y1="396" x2="78" y2="396" stroke="#6d5a3a" stroke-width="2"/>
  <text x="90" y="432" font-size="14" font-weight="700" fill="#6d5a3a">Total: 0.84 mm standard build</text>
  <text x="90" y="452" font-size="12.5" fill="#5c5c5c">custom 0.6–1.2 mm on request</text>

  <!-- ================= RIGHT: card face view ================= -->
  <text x="660" y="152" font-size="15" font-weight="700" letter-spacing="0.4" fill="#4f4f4f">CARD FACE — WHAT THE GUEST SEES</text>

  <!-- card body -->
  <rect x="660" y="172" width="424" height="267" rx="18" fill="#ecd9ae" stroke="#c39a5f" stroke-width="2"/>
  <!-- grain lines -->
  <path d="M672 210 C 780 200, 900 222, 1072 208" fill="none" stroke="#c39a5f" stroke-width="1.4" opacity="0.45"/>
  <path d="M672 262 C 800 274, 920 252, 1072 266" fill="none" stroke="#c39a5f" stroke-width="1.4" opacity="0.4"/>
  <path d="M672 330 C 790 318, 940 340, 1072 326" fill="none" stroke="#c39a5f" stroke-width="1.4" opacity="0.45"/>
  <path d="M672 396 C 810 408, 930 388, 1072 400" fill="none" stroke="#c39a5f" stroke-width="1.4" opacity="0.4"/>
  <!-- antenna loop (hidden inside, shown dashed) -->
  <rect x="684" y="194" width="376" height="223" rx="12" fill="none" stroke="#3d6b6b" stroke-width="3" stroke-dasharray="11 7" opacity="0.85"/>
  <!-- chip -->
  <rect x="700" y="208" width="26" height="26" rx="4" fill="#4a5568"/>
  <!-- engraving -->
  <text x="872" y="298" text-anchor="middle" font-size="30" font-family="Lora, Georgia, serif" font-weight="700" letter-spacing="3" fill="#6d5a3a">HOTEL VERDE</text>
  <text x="872" y="330" text-anchor="middle" font-size="15" letter-spacing="4" fill="#8a6f43">GUEST CARD · 0117</text>

  <!-- callout: antenna -->
  <line x1="1060" y1="194" x2="1108" y2="176" stroke="#3d6b6b" stroke-width="1.6"/>
  <text x="1112" y="172" text-anchor="end" font-size="12.5" font-weight="600" fill="#3d6b6b">antenna loop</text>
  <!-- callout: chip -->
  <line x1="713" y1="234" x2="713" y2="256" stroke="#4a5568" stroke-width="1.6"/>
  <text x="730" y="270" font-size="12.5" font-weight="600" fill="#4a5568">chip</text>

  <!-- dimensions + range -->
  <text x="660" y="470" font-size="14" font-weight="700" fill="#291c0e">85.6 × 54 mm — CR80 footprint</text>
  <text x="660" y="492" font-size="12.5" fill="#5c5c5c">slightly thicker than the 0.76 mm PVC nominal</text>
  <text x="660" y="530" font-size="14" font-weight="700" fill="#3d6b6b">Reads at 2–5 cm — up to 7 cm with Plus EV2</text>
  <text x="660" y="552" font-size="12.5" fill="#5c5c5c">same tap, same locks, warmer card</text>

  <!-- left-bottom note -->
  <rect x="90" y="490" width="460" height="76" rx="14" fill="#f7edd6"/>
  <text x="112" y="521" font-size="13" font-weight="700" fill="#6d5a3a">WHY THE CAVITY, NOT A LAMINATE SANDWICH</text>
  <text x="112" y="543" font-size="12.5" fill="#4f4f4f">Wood is not perfectly flat — routing the inlay in keeps</text>
  <text x="112" y="560" font-size="12.5" fill="#4f4f4f">the face smooth and the engraving layer intact.</text>

  <text x="600" y="622" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Numbers as in the specification table: build thickness, footprint, and read range as ordered.</text>
</svg>
