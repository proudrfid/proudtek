<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Anatomy of an RFID conference badge and the three jobs it performs</title>
<desc id="d">A printed conference badge on the left shows its parts: a lanyard slot, an attendee name and company line, an NFC chip coil, and a passive UHF inlay, all encoded to one badge ID. Three cards on the right list the badge's jobs: automated check-in with a sub-three-second tap, exhibitor lead capture synced to CRM, and automatic session-attendance logging.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID CONFERENCE BADGES</text>
<text x="600" y="104" text-anchor="middle" font-size="34" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">One credential, three jobs at once</text>
<!-- badge -->
<rect x="120" y="150" width="300" height="404" rx="18" fill="#ffffff" stroke="#d9cdb6" stroke-width="2"/>
<rect x="245" y="170" width="50" height="12" rx="6" fill="#efe7d5" stroke="#d9cdb6" stroke-width="1.5"/>
<text x="270" y="232" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">ATTENDEE NAME</text>
<text x="270" y="258" text-anchor="middle" font-size="13" fill="#5c5c5c">Company · Title</text>
<line x1="150" y1="280" x2="390" y2="280" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="232" y="312" width="76" height="64" rx="12" fill="none" stroke="#3d6b6b" stroke-width="3"/>
<rect x="246" y="326" width="48" height="36" rx="8" fill="none" stroke="#3d6b6b" stroke-width="3"/>
<rect x="260" y="339" width="20" height="10" rx="4" fill="#3d6b6b"/>
<text x="270" y="402" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">NFC chip</text>
<rect x="170" y="440" width="8" height="14" fill="#4a5568"/>
<line x1="176" y1="447" x2="364" y2="447" stroke="#4a5568" stroke-width="3"/>
<rect x="362" y="440" width="8" height="14" fill="#4a5568"/>
<text x="270" y="476" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">UHF inlay · passive</text>
<rect x="172" y="500" width="196" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="270" y="522" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">encoded to one badge ID</text>
<!-- job cards -->
<rect x="480" y="180" width="650" height="112" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="480" y="180" width="8" height="112" rx="4" fill="#3d6b6b"/>
<circle cx="536" cy="236" r="26" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="536" y="245" text-anchor="middle" font-size="22" font-weight="800" fill="#2c5454">1</text>
<text x="586" y="228" text-anchor="start" font-size="19" font-weight="800" fill="#291c0e">Automated check-in</text>
<text x="586" y="258" text-anchor="start" font-size="14.5" fill="#4f4f4f">Tap the badge at a registration kiosk — sub-3-second at peak.</text>
<rect x="480" y="308" width="650" height="112" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="480" y="308" width="8" height="112" rx="4" fill="#c39a5f"/>
<circle cx="536" cy="364" r="26" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
<text x="536" y="373" text-anchor="middle" font-size="22" font-weight="800" fill="#6d5a3a">2</text>
<text x="586" y="356" text-anchor="start" font-size="19" font-weight="800" fill="#291c0e">Exhibitor lead capture</text>
<text x="586" y="386" text-anchor="start" font-size="14.5" fill="#4f4f4f">Scan for name, company and interest — synced to CRM.</text>
<rect x="480" y="436" width="650" height="112" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="480" y="436" width="8" height="112" rx="4" fill="#2d6a4f"/>
<circle cx="536" cy="492" r="26" fill="#e9f2ec" stroke="#2d6a4f" stroke-width="2"/>
<text x="536" y="501" text-anchor="middle" font-size="22" font-weight="800" fill="#1b4332">3</text>
<text x="586" y="484" text-anchor="start" font-size="19" font-weight="800" fill="#291c0e">Session attendance</text>
<text x="586" y="514" text-anchor="start" font-size="14.5" fill="#4f4f4f">Readers log every room entry automatically, no tap needed.</text>
<text x="600" y="614" text-anchor="middle" font-size="14" fill="#5c5c5c">Check-in, lead capture and session tracking all run off the same tap and the same attendee record.</text>
</svg>
