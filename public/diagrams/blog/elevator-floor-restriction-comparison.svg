<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Elevator without floor restriction versus with RFID floor restriction</title>
<desc id="d">A side-by-side comparison of the same six-floor building. On the left, with no floor restriction, every floor from the executive level down to the lobby is reachable by anyone who boards the cab. On the right, with RFID floor restriction, only the floors on the presented credential — lobby, floor 2, floor 5 and the guest floor 8 — are authorized, while the executive floor 12 and the R and D lab on floor 3 are blocked.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY FLOOR RESTRICTION MATTERS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Without it, anyone who reaches the cab reaches every floor.</text>

<!-- LEFT panel: unrestricted (risk) -->
<rect x="60" y="112" width="512" height="506" rx="18" fill="#fbf3f3" stroke="#e6c9c9" stroke-width="2"/>
<text x="316" y="148" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">NO FLOOR RESTRICTION</text>

<rect x="166" y="170" width="300" height="52" rx="8" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.8"/>
<text x="186" y="202" font-size="15" font-weight="700" fill="#291c0e">12 · Executive</text>
<circle cx="440" cy="196" r="7" fill="#8b2d2d"/>
<rect x="166" y="232" width="300" height="52" rx="8" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.8"/>
<text x="186" y="264" font-size="15" font-weight="700" fill="#291c0e">8 · Guest floor</text>
<circle cx="440" cy="258" r="7" fill="#8b2d2d"/>
<rect x="166" y="294" width="300" height="52" rx="8" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.8"/>
<text x="186" y="326" font-size="15" font-weight="700" fill="#291c0e">5 · Offices</text>
<circle cx="440" cy="320" r="7" fill="#8b2d2d"/>
<rect x="166" y="356" width="300" height="52" rx="8" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.8"/>
<text x="186" y="388" font-size="15" font-weight="700" fill="#291c0e">3 · R&amp;D lab</text>
<circle cx="440" cy="382" r="7" fill="#8b2d2d"/>
<rect x="166" y="418" width="300" height="52" rx="8" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.8"/>
<text x="186" y="450" font-size="15" font-weight="700" fill="#291c0e">2 · Offices</text>
<circle cx="440" cy="444" r="7" fill="#8b2d2d"/>
<rect x="166" y="480" width="300" height="52" rx="8" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.8"/>
<text x="186" y="512" font-size="15" font-weight="700" fill="#291c0e">L · Lobby</text>
<circle cx="440" cy="506" r="7" fill="#8b2d2d"/>

<circle cx="180" cy="560" r="7" fill="#8b2d2d"/>
<text x="196" y="565" font-size="13" fill="#8b2d2d">Reachable by anyone who boards</text>
<text x="316" y="596" text-anchor="middle" font-size="14" font-weight="700" fill="#8b2d2d">The lobby guard becomes security theater.</text>

<!-- VS badge -->
<circle cx="600" cy="360" r="27" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="367" text-anchor="middle" font-size="18" font-weight="800" fill="#6d5a3a">vs</text>

<!-- RIGHT panel: restricted -->
<rect x="628" y="112" width="512" height="506" rx="18" fill="#eef7f5" stroke="#cfe3dd" stroke-width="2"/>
<text x="884" y="148" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#234a4a">RFID FLOOR RESTRICTION</text>

<rect x="734" y="170" width="300" height="52" rx="8" fill="#ffffff" stroke="#bcd6d1" stroke-width="1.8"/>
<text x="754" y="202" font-size="15" font-weight="700" fill="#7c7c7c">12 · Executive</text>
<rect x="1000" y="187" width="24" height="18" rx="3" fill="#9aa3ad"/>
<path d="M 1004 187 a 8 9 0 0 1 16 0" fill="none" stroke="#9aa3ad" stroke-width="3"/>
<rect x="734" y="232" width="300" height="52" rx="8" fill="#ffffff" stroke="#bcd6d1" stroke-width="1.8"/>
<text x="754" y="264" font-size="15" font-weight="700" fill="#291c0e">8 · Guest floor</text>
<circle cx="1012" cy="258" r="13" fill="#3d6b6b"/>
<path d="M 1006 258 l 4 5 l 8 -10" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="734" y="294" width="300" height="52" rx="8" fill="#ffffff" stroke="#bcd6d1" stroke-width="1.8"/>
<text x="754" y="326" font-size="15" font-weight="700" fill="#291c0e">5 · Offices</text>
<circle cx="1012" cy="320" r="13" fill="#3d6b6b"/>
<path d="M 1006 320 l 4 5 l 8 -10" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="734" y="356" width="300" height="52" rx="8" fill="#ffffff" stroke="#bcd6d1" stroke-width="1.8"/>
<text x="754" y="388" font-size="15" font-weight="700" fill="#7c7c7c">3 · R&amp;D lab</text>
<rect x="1000" y="373" width="24" height="18" rx="3" fill="#9aa3ad"/>
<path d="M 1004 373 a 8 9 0 0 1 16 0" fill="none" stroke="#9aa3ad" stroke-width="3"/>
<rect x="734" y="418" width="300" height="52" rx="8" fill="#ffffff" stroke="#bcd6d1" stroke-width="1.8"/>
<text x="754" y="450" font-size="15" font-weight="700" fill="#291c0e">2 · Offices</text>
<circle cx="1012" cy="444" r="13" fill="#3d6b6b"/>
<path d="M 1006 444 l 4 5 l 8 -10" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="734" y="480" width="300" height="52" rx="8" fill="#ffffff" stroke="#bcd6d1" stroke-width="1.8"/>
<text x="754" y="512" font-size="15" font-weight="700" fill="#291c0e">L · Lobby</text>
<circle cx="1012" cy="506" r="13" fill="#3d6b6b"/>
<path d="M 1006 506 l 4 5 l 8 -10" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

<circle cx="746" cy="560" r="10" fill="#3d6b6b"/>
<path d="M 741 560 l 3 4 l 6 -8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="762" y="565" font-size="13" fill="#234a4a">Authorized</text>
<rect x="884" y="552" width="20" height="15" rx="3" fill="#9aa3ad"/>
<path d="M 887 552 a 7 8 0 0 1 14 0" fill="none" stroke="#9aa3ad" stroke-width="2.6"/>
<text x="912" y="565" font-size="13" fill="#5c5c5c">Blocked</text>
<text x="884" y="596" text-anchor="middle" font-size="14" font-weight="700" fill="#234a4a">Only the credential's floors — plus the commons.</text>
</svg>
