<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Why an AES card cannot be cloned: mutual authentication step by step</title>
<desc id="d">A four-step AES-128 mutual authentication exchange between a reader and a card. Step one: the reader sends a random challenge, a nonce. Step two: the card encrypts that nonce with its diversified AES key and returns the result together with its own challenge. Step three: the reader verifies the response and encrypts the card's challenge back. Step four: both sides derive a session key and exchange data. A red note explains that a cloned UID holds no key, so step two fails and the session never opens.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MUTUAL AUTHENTICATION, STEP BY STEP</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">The card proves it holds the key without ever transmitting the key.</text>

<!-- Actor headers -->
<rect x="150" y="108" width="300" height="52" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="300" y="140" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">READER</text>
<rect x="750" y="108" width="300" height="52" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="900" y="140" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">CARD (holds AES key)</text>
<!-- lifelines -->
<line x1="300" y1="160" x2="300" y2="470" stroke="#cfe0e0" stroke-width="2"/>
<line x1="900" y1="160" x2="900" y2="470" stroke="#cfe0e0" stroke-width="2"/>

<!-- Step 1: reader -> card -->
<text x="600" y="196" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">STEP 1</text>
<line x1="300" y1="210" x2="892" y2="210" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="892,204 902,210 892,216" fill="#3d6b6b"/>
<text x="600" y="228" text-anchor="middle" font-size="13.5" fill="#291c0e">Random challenge (nonce)</text>

<!-- Step 2: card -> reader -->
<text x="600" y="268" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">STEP 2</text>
<line x1="900" y1="282" x2="308" y2="282" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="308,276 298,282 308,288" fill="#3d6b6b"/>
<text x="600" y="300" text-anchor="middle" font-size="13.5" fill="#291c0e">Nonce encrypted with diversified key + card's own challenge</text>

<!-- Step 3: reader -> card -->
<text x="600" y="340" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">STEP 3</text>
<line x1="300" y1="354" x2="892" y2="354" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="892,348 902,354 892,360" fill="#3d6b6b"/>
<text x="600" y="372" text-anchor="middle" font-size="13.5" fill="#291c0e">Reader verifies, encrypts card's challenge back</text>

<!-- Step 4: session -->
<rect x="300" y="404" width="600" height="46" rx="10" fill="#e8f2ea" stroke="#bcdcc7" stroke-width="1.5"/>
<text x="600" y="425" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f6f3a">STEP 4 · Session key established</text>
<text x="600" y="443" text-anchor="middle" font-size="12.5" fill="#3a5f47">both sides authenticated — data now exchanged securely</text>

<!-- Failure note -->
<rect x="150" y="486" width="900" height="118" rx="12" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.5"/>
<rect x="150" y="486" width="9" height="118" rx="4" fill="#8b2d2d"/>
<circle cx="192" cy="524" r="12" fill="#8b2d2d"/>
<text x="192" y="529" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">!</text>
<text x="218" y="520" font-size="14.5" font-weight="800" fill="#8b2d2d">WHY THE CLONE FAILS</text>
<text x="218" y="546" font-size="13.5" fill="#333333">A copied card carries the UID but not the secret key. It cannot produce the Step 2 response,</text>
<text x="218" y="572" font-size="13.5" fill="#333333">so the reader never opens a session. Copying the serial number simply does not help.</text>
</svg>
