<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The five real cost drivers behind an RFID factory MOQ</title>
<desc id="d">Five stacked rows. One, chip-lot purchasing: chips are sold to factories in 1M to 10M unit reels. Two, antenna tooling: custom antennas cost 500 to 5,000 dollars to tool. Three, encoding setup: a custom data range takes 1 to 3 hours to set up per run. Four, minimum run efficiency: starting and shutting an inlay line wastes 200 to 2,000 units in scrap. Five, packaging and logistics: pallet, container and customs minimums make per-unit shipping spike below threshold.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY MOQ EXISTS · FIVE COST DRIVERS</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Each is a real cost — and each can usually be addressed one at a time.</text>

<!-- row 1 -->
<rect x="64" y="112" width="1072" height="90" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<circle cx="118" cy="157" r="20" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="118" y="164" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454">1</text>
<text x="164" y="150" font-size="17" font-weight="800" fill="#291c0e">Chip-lot purchasing</text>
<text x="164" y="176" font-size="13.5" fill="#5c5c5c">Chip suppliers (NXP, Impinj, Alien) sell to factories in full reels</text>
<rect x="892" y="137" width="212" height="40" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="998" y="163" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">1M–10M-unit reels</text>

<!-- row 2 -->
<rect x="64" y="212" width="1072" height="90" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<circle cx="118" cy="257" r="20" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="118" y="264" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454">2</text>
<text x="164" y="250" font-size="17" font-weight="800" fill="#291c0e">Antenna tooling amortization</text>
<text x="164" y="276" font-size="13.5" fill="#5c5c5c">Custom antennas need tooling, spread across the run</text>
<rect x="892" y="237" width="212" height="40" rx="10" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.3"/>
<text x="998" y="263" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">$500–5K tooling</text>

<!-- row 3 -->
<rect x="64" y="312" width="1072" height="90" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<circle cx="118" cy="357" r="20" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="118" y="364" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454">3</text>
<text x="164" y="350" font-size="17" font-weight="800" fill="#291c0e">Encoding setup overhead</text>
<text x="164" y="376" font-size="13.5" fill="#5c5c5c">Setting up a custom data range costs the same at any run length</text>
<rect x="892" y="337" width="212" height="40" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="998" y="363" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">1–3 hrs / run</text>

<!-- row 4 -->
<rect x="64" y="412" width="1072" height="90" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<circle cx="118" cy="457" r="20" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="118" y="464" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454">4</text>
<text x="164" y="450" font-size="17" font-weight="800" fill="#291c0e">Minimum production-run efficiency</text>
<text x="164" y="476" font-size="13.5" fill="#5c5c5c">Starting and shutting an inlay line wastes start-up scrap</text>
<rect x="892" y="437" width="212" height="40" rx="10" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.3"/>
<text x="998" y="463" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">200–2,000 units</text>

<!-- row 5 -->
<rect x="64" y="512" width="1072" height="90" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<circle cx="118" cy="557" r="20" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="118" y="564" text-anchor="middle" font-size="19" font-weight="800" fill="#2c5454">5</text>
<text x="164" y="550" font-size="17" font-weight="800" fill="#291c0e">Packaging &amp; logistics minimums</text>
<text x="164" y="576" font-size="13.5" fill="#5c5c5c">Pallet, container fill and customs paperwork have thresholds</text>
<rect x="892" y="537" width="212" height="40" rx="10" fill="#eef0f4" stroke="#d4dae2" stroke-width="1.3"/>
<text x="998" y="563" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4457">per-unit spikes</text>
</svg>
