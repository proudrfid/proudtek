<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The Java Card applet pipeline — from .java source to a selectable on-card applet</title>
<desc id="d">Five-step flow. Off-card, on the developer's machine: step one, write the applet source in .java; step two, compile with javac to .class files; step three, run the Java Card converter to produce a .cap file. A padlocked GlobalPlatform SCP02/SCP03 secure-channel gate separates off-card from on-card. On the card: step four, install — allocate EEPROM for persistent data; step five, register the AID so the applet becomes selectable. A caption lists the loading tools GPShell, GlobalPlatformPro and vendor personalization suites, and notes every card-management APDU is encrypted and MAC-protected.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FROM KEYBOARD TO LOCKED-DOWN APPLET</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">The CAP-file pipeline, guarded by GlobalPlatform</text>

<!-- zones -->
<rect x="56" y="140" width="600" height="350" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="76" y="170" text-anchor="start" font-size="12.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">OFF-CARD · DEVELOPER TERRITORY</text>
<rect x="744" y="140" width="400" height="350" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="764" y="170" text-anchor="start" font-size="12.5" font-weight="700" letter-spacing="1" fill="#2c5454">ON-CARD · SECURE ELEMENT</text>

<!-- secure channel gate -->
<line x1="700" y1="152" x2="700" y2="282" stroke="#c39a5f" stroke-width="2" stroke-dasharray="5 6"/>
<line x1="700" y1="336" x2="700" y2="478" stroke="#c39a5f" stroke-width="2" stroke-dasharray="5 6"/>
<text x="700" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">SCP02 / SCP03</text>
<path d="M 688 296 v -9 a 12 12 0 0 1 24 0 v 9" fill="none" stroke="#6d5a3a" stroke-width="4"/>
<rect x="678" y="296" width="44" height="32" rx="7" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>
<circle cx="700" cy="312" r="4" fill="#6d5a3a"/>
<text x="700" y="508" text-anchor="middle" font-size="12.5" fill="#6d5a3a">secure channel</text>

<!-- step 1 -->
<rect x="80" y="200" width="170" height="200" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="80" y="200" width="170" height="42" rx="12" fill="#c39a5f"/>
<rect x="80" y="228" width="170" height="14" fill="#c39a5f"/>
<text x="165" y="227" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1 · Write</text>
<text x="165" y="290" text-anchor="middle" font-size="26" font-weight="800" fill="#c39a5f">&lt;/&gt;</text>
<text x="165" y="330" text-anchor="middle" font-size="13" fill="#4f4f4f">applet source</text>
<text x="165" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">.java</text>

<!-- step 2 -->
<rect x="272" y="200" width="170" height="200" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="272" y="200" width="170" height="42" rx="12" fill="#c39a5f"/>
<rect x="272" y="228" width="170" height="14" fill="#c39a5f"/>
<text x="357" y="227" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2 · Compile</text>
<circle cx="345" cy="276" r="16" fill="none" stroke="#c39a5f" stroke-width="3.5"/>
<circle cx="371" cy="287" r="10" fill="none" stroke="#c39a5f" stroke-width="3"/>
<text x="357" y="330" text-anchor="middle" font-size="13" fill="#4f4f4f">javac compiler</text>
<text x="357" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">.class</text>

<!-- step 3 -->
<rect x="464" y="200" width="170" height="200" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="464" y="200" width="170" height="42" rx="12" fill="#c39a5f"/>
<rect x="464" y="228" width="170" height="14" fill="#c39a5f"/>
<text x="549" y="227" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3 · Convert</text>
<path d="M 532 270 H 566 M 566 270 l -8 -8" fill="none" stroke="#c39a5f" stroke-width="3.5" stroke-linecap="round"/>
<path d="M 566 284 H 532 M 532 284 l 8 8" fill="none" stroke="#c39a5f" stroke-width="3.5" stroke-linecap="round"/>
<text x="549" y="330" text-anchor="middle" font-size="13" fill="#4f4f4f">Java Card converter</text>
<text x="549" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">.cap</text>

<!-- step 4 -->
<rect x="764" y="200" width="170" height="200" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<rect x="764" y="200" width="170" height="42" rx="12" fill="#3d6b6b"/>
<rect x="764" y="228" width="170" height="14" fill="#3d6b6b"/>
<text x="849" y="227" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4 · Install</text>
<rect x="827" y="258" width="44" height="32" rx="4" fill="#3d6b6b"/>
<rect x="835" y="266" width="12" height="10" rx="2" fill="#eef5f5"/>
<text x="849" y="330" text-anchor="middle" font-size="13" fill="#4f4f4f">allocate EEPROM</text>
<text x="849" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">persistent data</text>

<!-- step 5 -->
<rect x="956" y="200" width="170" height="200" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<rect x="956" y="200" width="170" height="42" rx="12" fill="#3d6b6b"/>
<rect x="956" y="228" width="170" height="14" fill="#3d6b6b"/>
<text x="1041" y="227" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5 · Select</text>
<circle cx="1041" cy="276" r="20" fill="#3d6b6b"/>
<path d="M 1032 276 l 6 6 l 12 -13" fill="none" stroke="#eef5f5" stroke-width="4" stroke-linecap="round"/>
<text x="1041" y="330" text-anchor="middle" font-size="13" fill="#4f4f4f">AID registered</text>
<text x="1041" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">selectable</text>

<!-- arrows -->
<line x1="252" y1="300" x2="262" y2="300" stroke="#6d5a3a" stroke-width="2.5"/>
<path d="M 262 294 l 10 6 l -10 6 z" fill="#6d5a3a"/>
<line x1="444" y1="300" x2="454" y2="300" stroke="#6d5a3a" stroke-width="2.5"/>
<path d="M 454 294 l 10 6 l -10 6 z" fill="#6d5a3a"/>
<line x1="640" y1="300" x2="662" y2="300" stroke="#6d5a3a" stroke-width="2.5"/>
<path d="M 662 294 l 10 6 l -10 6 z" fill="#6d5a3a"/>
<line x1="726" y1="300" x2="750" y2="300" stroke="#2c5454" stroke-width="2.5"/>
<path d="M 750 294 l 10 6 l -10 6 z" fill="#2c5454"/>
<line x1="936" y1="300" x2="944" y2="300" stroke="#2c5454" stroke-width="2.5"/>
<path d="M 944 294 l 10 6 l -10 6 z" fill="#2c5454"/>

<!-- zone footnotes -->
<text x="356" y="452" text-anchor="middle" font-size="12.5" fill="#6d5a3a">javac and the converter run on your laptop</text>
<text x="944" y="452" text-anchor="middle" font-size="12.5" fill="#2c5454">the card decides what gets in</text>

<text x="600" y="540" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Loading tools: GPShell · GlobalPlatformPro · vendor personalization suites</text>
<text x="600" y="618" text-anchor="middle" font-size="14" fill="#5c5c5c">Every card-management APDU is encrypted and MAC-protected — the cryptographic velvet rope between off-card and on-card.</text>
</svg>
