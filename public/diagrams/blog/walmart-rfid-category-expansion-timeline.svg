<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Walmart item-level RFID mandate category expansion, 2022 to 2026</title>
<desc id="d">A left-to-right timeline of category waves. October 2022 apparel and footwear, ARC Spec A or B. September 2023 home goods and textiles, ARC Spec A or G. January 2024 sporting goods, ARC Spec L or T. February 2025 toys, ARC Spec G or A. Second quarter 2026 hardlines, electronics and automotive accessories, ARC Spec L or R. Late 2026 automotive aftermarket, ARC Spec L. Categories not yet mandated receive 180 to 270 days of advance notice.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MANDATE SCOPE · 2022 → 2026</text>
<text x="600" y="95" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">How the mandate walked through the store</text>
<text x="600" y="126" text-anchor="middle" font-size="15" fill="#4f4f4f">One department at a time, roughly once a year, with 180–270 days' notice before enforcement.</text>

<line x1="150" y1="362" x2="1050" y2="362" stroke="#4a5568" stroke-width="3"/>

<!-- node 1 above: Oct 2022 -->
<rect x="70" y="196" width="160" height="120" rx="12" fill="#ffffff" stroke="#d3dae3" stroke-width="1.6"/><rect x="70" y="196" width="160" height="7" rx="3.5" fill="#4a5568"/>
<text x="150" y="228" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4453">Oct 2022</text>
<text x="150" y="252" text-anchor="middle" font-size="12.5" fill="#291c0e">Apparel &amp;</text>
<text x="150" y="269" text-anchor="middle" font-size="12.5" fill="#291c0e">footwear</text>
<rect x="90" y="282" width="120" height="24" rx="12" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.1"/><text x="150" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4453">ARC A / B</text>
<line x1="150" y1="316" x2="150" y2="362" stroke="#9aa6b5" stroke-width="1.8"/><circle cx="150" cy="362" r="11" fill="#4a5568"/>

<!-- node 2 below: Sep 2023 -->
<circle cx="330" cy="362" r="11" fill="#4a5568"/><line x1="330" y1="362" x2="330" y2="408" stroke="#9aa6b5" stroke-width="1.8"/>
<rect x="250" y="408" width="160" height="120" rx="12" fill="#ffffff" stroke="#d3dae3" stroke-width="1.6"/><rect x="250" y="408" width="160" height="7" rx="3.5" fill="#4a5568"/>
<text x="330" y="440" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4453">Sep 2023</text>
<text x="330" y="464" text-anchor="middle" font-size="12.5" fill="#291c0e">Home goods</text>
<text x="330" y="481" text-anchor="middle" font-size="12.5" fill="#291c0e">&amp; textiles</text>
<rect x="270" y="494" width="120" height="24" rx="12" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.1"/><text x="330" y="510" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4453">ARC A / G</text>

<!-- node 3 above: Jan 2024 -->
<rect x="430" y="196" width="160" height="120" rx="12" fill="#ffffff" stroke="#d3dae3" stroke-width="1.6"/><rect x="430" y="196" width="160" height="7" rx="3.5" fill="#4a5568"/>
<text x="510" y="228" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4453">Jan 2024</text>
<text x="510" y="252" text-anchor="middle" font-size="12.5" fill="#291c0e">Sporting</text>
<text x="510" y="269" text-anchor="middle" font-size="12.5" fill="#291c0e">goods</text>
<rect x="450" y="282" width="120" height="24" rx="12" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.1"/><text x="510" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4453">ARC L / T</text>
<line x1="510" y1="316" x2="510" y2="362" stroke="#9aa6b5" stroke-width="1.8"/><circle cx="510" cy="362" r="11" fill="#4a5568"/>

<!-- node 4 below: Feb 2025 -->
<circle cx="690" cy="362" r="11" fill="#4a5568"/><line x1="690" y1="362" x2="690" y2="408" stroke="#9aa6b5" stroke-width="1.8"/>
<rect x="610" y="408" width="160" height="120" rx="12" fill="#ffffff" stroke="#d3dae3" stroke-width="1.6"/><rect x="610" y="408" width="160" height="7" rx="3.5" fill="#4a5568"/>
<text x="690" y="440" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4453">Feb 2025</text>
<text x="690" y="466" text-anchor="middle" font-size="12.5" fill="#291c0e">Toys</text>
<rect x="630" y="494" width="120" height="24" rx="12" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.1"/><text x="690" y="510" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4453">ARC G / A</text>

<!-- node 5 above: Q2 2026 (current wave, gold) -->
<rect x="790" y="196" width="160" height="120" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.8"/><rect x="790" y="196" width="160" height="7" rx="3.5" fill="#c39a5f"/>
<text x="870" y="228" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6a2f">Q2 2026</text>
<text x="870" y="252" text-anchor="middle" font-size="12.5" fill="#291c0e">Hardlines,</text>
<text x="870" y="269" text-anchor="middle" font-size="12.5" fill="#291c0e">electronics, auto</text>
<rect x="810" y="282" width="120" height="24" rx="12" fill="#ffffff" stroke="#e4c98f" stroke-width="1.1"/><text x="870" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6a2f">ARC L / R</text>
<line x1="870" y1="316" x2="870" y2="362" stroke="#d8bd85" stroke-width="1.8"/><circle cx="870" cy="362" r="11" fill="#c39a5f"/>

<!-- node 6 below: late 2026 (gold) -->
<circle cx="1050" cy="362" r="11" fill="#c39a5f"/><line x1="1050" y1="362" x2="1050" y2="408" stroke="#d8bd85" stroke-width="1.8"/>
<rect x="970" y="408" width="160" height="120" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.8"/><rect x="970" y="408" width="160" height="7" rx="3.5" fill="#c39a5f"/>
<text x="1050" y="440" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6a2f">late 2026</text>
<text x="1050" y="464" text-anchor="middle" font-size="12.5" fill="#291c0e">Automotive</text>
<text x="1050" y="481" text-anchor="middle" font-size="12.5" fill="#291c0e">aftermarket</text>
<rect x="990" y="494" width="120" height="24" rx="12" fill="#ffffff" stroke="#e4c98f" stroke-width="1.1"/><text x="1050" y="510" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6a2f">ARC L</text>

<text x="600" y="614" text-anchor="middle" font-size="14.5" fill="#4f4f4f">A not-yet-mandated category isn't exempt — it's early. Plan for inclusion, not a reprieve.</text>
</svg>
