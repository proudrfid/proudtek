<polygon points="336,420 320,413 336,406" fill="#9aa6b5"/>

<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Skip a step to save a week and you don't save the week — you buy the chargebacks later.</text>
