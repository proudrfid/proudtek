<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">PPWR, CMO and the future ESPR DPP all converge on one NFC chip on the bottle</title>
<desc id="d">Three EU regimes converge on a single NFC chip on a wine bottle. PPWR: packaging and EPR fees, applies from 12 August 2026. CMO 2021/2117: wine e-labels via QR or NFC, allowed since 8 December 2023. ESPR DPP: the Digital Product Passport, with beverages expected in the late-2020s. Dashed arrows lead from each regime card to a chip on the bottle's label, and a pill underneath reads NTAG 424 DNA + GS1 Digital Link. Caption: three regimes on different timetables — one encoded chip, no re-tagging when the next acronym lands.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ALPHABET SOUP, ONE CARRIER</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">PPWR, CMO and the future DPP land on the same chip</text>

<rect x="64" y="150" width="396" height="110" rx="14" fill="#ecf4ef" stroke="#cfe0d6" stroke-width="1.5"/>
<text x="92" y="190" font-size="18" font-weight="800" fill="#1b4332">PPWR</text>
<text x="92" y="218" font-size="13.5" fill="#4f4f4f">packaging and EPR fees</text>
<text x="92" y="240" font-size="13.5" fill="#4f4f4f">applies from 12 August 2026</text>

<rect x="64" y="300" width="396" height="110" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="92" y="340" font-size="18" font-weight="800" fill="#234a4a">CMO 2021/2117</text>
<text x="92" y="368" font-size="13.5" fill="#4f4f4f">wine e-labels via QR or NFC</text>
<text x="92" y="390" font-size="13.5" fill="#4f4f4f">allowed since 8 December 2023</text>

<rect x="64" y="450" width="396" height="110" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="92" y="490" font-size="18" font-weight="800" fill="#6d5a3a">ESPR · DPP</text>
<text x="92" y="518" font-size="13.5" fill="#4f4f4f">digital product passport</text>
<text x="92" y="540" font-size="13.5" fill="#4f4f4f">beverages expected late-2020s</text>

