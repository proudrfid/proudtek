<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Gate throughput: manual ticket check versus RFID wristband tap</title>
<desc id="d">Two festival entry lanes side by side. Left, the manual ticket check: a long queue of eighteen attendees waits while a staffer squints at each ticket for 10 to 15 seconds, moving 4 to 6 attendees per minute. Right, the RFID wristband tap: a short queue of four attendees taps a reader in 3 to 5 seconds per scan, moving 15 to 20 attendees per minute. A verdict strip notes that scaled across a whole arrival, that gap is an entrance versus a bottleneck.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">GATE THROUGHPUT · MANUAL CHECK VS RFID TAP</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">The doors-open hour, two ways</text>

