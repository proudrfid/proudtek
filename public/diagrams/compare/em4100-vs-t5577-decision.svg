<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="decTitle decDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="decTitle">When to pick EM4100 vs T5577</title>
  <desc id="decDesc">A two-column decision board. Reach for EM4100 when the credential is mass-volume single-use (animal-ID tags, gym lockers, parking day passes), when reader fleets are legacy and never re-encode, when an immutable factory UID audit trail matters, for older 125 kHz animal-ID lineage, or when you just need the cheapest unique number. Reach for T5577 when retrofitting hotels or multi-tenant sites that need to emulate HID Prox or Indala now and migrate later, when shipping pre-encoded credentials, when rotating credential IDs in the field, when one SKU must cover many reader formats, or for test, pentest and lab fleets. The deciding question: after it ships, does the credential ever need to change?</desc>

  <defs>
    <radialGradient id="decGlow" cx="50%" cy="24%" r="88%">
      <stop offset="0%" stop-color="#f9ecd2"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#decGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="64" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2.5" fill="#6d5a3a">PICK YOUR FIGHTER · WHEN EACH CHIP WINS</text>
  <text x="600" y="93" text-anchor="middle" font-size="16" fill="#4a5568">Rarely an absolute call — it's about whether the credential ever needs to change.</text>

  <!-- ============ LEFT: EM4100 ============ -->
  <g>
    <rect x="64" y="120" width="512" height="448" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <path d="M64 136 a16 16 0 0 1 16 -16 h480 a16 16 0 0 1 16 16 v40 h-512 z" fill="#4a5568"/>
    <text x="320" y="163" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.5">REACH FOR EM4100</text>
    <text x="320" y="197" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">READ-ONLY IS A FEATURE HERE</text>

    <g>
      <!-- rows -->
      <g>
        <rect x="88" y="222" width="22" height="17" rx="3" fill="#4a5568"/><rect x="94" y="226" width="4" height="9" fill="#f9ecd2"/><rect x="101" y="226" width="4" height="9" fill="#f9ecd2"/>
        <text x="124" y="230" font-size="13.5" font-weight="800" fill="#291c0e">Mass-volume, single-use</text>
        <text x="124" y="249" font-size="12.5" fill="#6d5a3a">Animal-ID tags, gym lockers, parking day passes</text>
      </g>
      <g>
        <rect x="88" y="286" width="22" height="17" rx="3" fill="#4a5568"/><rect x="94" y="290" width="4" height="9" fill="#f9ecd2"/><rect x="101" y="290" width="4" height="9" fill="#f9ecd2"/>
        <text x="124" y="294" font-size="13.5" font-weight="800" fill="#291c0e">Legacy reader fleets</text>
        <text x="124" y="313" font-size="12.5" fill="#6d5a3a">1990s HID ProxPoint doors — re-encoding never happens</text>
      </g>
      <g>
        <rect x="88" y="350" width="22" height="17" rx="3" fill="#4a5568"/><rect x="94" y="354" width="4" height="9" fill="#f9ecd2"/><rect x="101" y="354" width="4" height="9" fill="#f9ecd2"/>
        <text x="124" y="358" font-size="13.5" font-weight="800" fill="#291c0e">Immutable audit trail</text>
        <text x="124" y="377" font-size="12.5" fill="#6d5a3a">A factory UID tied to a batch or customer, by design</text>
      </g>
      <g>
        <rect x="88" y="414" width="22" height="17" rx="3" fill="#4a5568"/><rect x="94" y="418" width="4" height="9" fill="#f9ecd2"/><rect x="101" y="418" width="4" height="9" fill="#f9ecd2"/>
        <text x="124" y="422" font-size="13.5" font-weight="800" fill="#291c0e">125 kHz animal-ID lineage</text>
        <text x="124" y="441" font-size="12.5" fill="#6d5a3a">Older ICAR-registered chains where immutability is the point</text>
      </g>
      <g>
        <rect x="88" y="478" width="22" height="17" rx="3" fill="#4a5568"/><rect x="94" y="482" width="4" height="9" fill="#f9ecd2"/><rect x="101" y="482" width="4" height="9" fill="#f9ecd2"/>
        <text x="124" y="486" font-size="13.5" font-weight="800" fill="#291c0e">Cheapest "unique number"</text>
        <text x="124" y="505" font-size="12.5" fill="#6d5a3a">The reader only needs to see an ID — nothing more</text>
      </g>
    </g>
    <rect x="88" y="528" width="150" height="26" rx="13" fill="#eef1f4" stroke="#9fb0c0" stroke-width="1.5"/>
    <text x="163" y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#3e4c5c">Never changes → EM4100</text>
  </g>

  <!-- ============ RIGHT: T5577 ============ -->
  <g>
    <rect x="624" y="120" width="512" height="448" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <path d="M624 136 a16 16 0 0 1 16 -16 h480 a16 16 0 0 1 16 16 v40 h-512 z" fill="#3d6b6b"/>
    <text x="880" y="163" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.5">REACH FOR T5577</text>
    <text x="880" y="197" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">WHEN THE CREDENTIAL MUST FLEX</text>

    <g>
      <g>
        <rect x="648" y="222" width="22" height="17" rx="3" fill="#3d6b6b"/><path d="M652 235 l3 3 6 -7" fill="none" stroke="#eef4f4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="684" y="230" font-size="13.5" font-weight="800" fill="#291c0e">Hotel &amp; multi-tenant retrofit</text>
        <text x="684" y="249" font-size="12.5" fill="#6d5a3a">Emulate HID Prox / Indala now, migrate the format later</text>
      </g>
      <g>
        <rect x="648" y="286" width="22" height="17" rx="3" fill="#3d6b6b"/><path d="M652 299 l3 3 6 -7" fill="none" stroke="#eef4f4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="684" y="294" font-size="13.5" font-weight="800" fill="#291c0e">Pre-encoded issuance</text>
        <text x="684" y="313" font-size="12.5" fill="#6d5a3a">Ship cards with the credential ID already programmed</text>
      </g>
      <g>
        <rect x="648" y="350" width="22" height="17" rx="3" fill="#3d6b6b"/><path d="M652 363 l3 3 6 -7" fill="none" stroke="#eef4f4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="684" y="358" font-size="13.5" font-weight="800" fill="#291c0e">In-field credential rotation</text>
        <text x="684" y="377" font-size="12.5" fill="#6d5a3a">Rewrite IDs every 90 days — no full card re-issue</text>
      </g>
      <g>
        <rect x="648" y="414" width="22" height="17" rx="3" fill="#3d6b6b"/><path d="M652 427 l3 3 6 -7" fill="none" stroke="#eef4f4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="684" y="422" font-size="13.5" font-weight="800" fill="#291c0e">One SKU, many formats</text>
        <text x="684" y="441" font-size="12.5" fill="#6d5a3a">Configure per site instead of stocking separate cards</text>
      </g>
      <g>
        <rect x="648" y="478" width="22" height="17" rx="3" fill="#3d6b6b"/><path d="M652 491 l3 3 6 -7" fill="none" stroke="#eef4f4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="684" y="486" font-size="13.5" font-weight="800" fill="#291c0e">Test / pentest / lab fleets</text>
        <text x="684" y="505" font-size="12.5" fill="#6d5a3a">Stage any 125 kHz format on a single blank</text>
      </g>
    </g>
    <rect x="648" y="528" width="150" height="26" rx="13" fill="#eef4f4" stroke="#7fb0b0" stroke-width="1.5"/>
    <text x="723" y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#2c5454">Must change → T5577</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-size="15.5" font-weight="600" fill="#6d5a3a">The one question that decides it: after the card ships, does the credential ever need to change?</text>
</svg>
