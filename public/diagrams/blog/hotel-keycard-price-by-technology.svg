<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Per-card price by hotel key card technology, on one axis</title>
<desc id="d">Five hotel key card technologies plotted on one price axis from zero to $1.50. Magstripe at $0.10-0.25 per card with a 3-12 month useful life and 30-50 percent replaced yearly. MIFARE Classic RFID at $0.30-0.60 with a 3-5 year life, compatible with ASSA ABLOY, Dormakaba and Salto locks. Combo RFID plus magstripe cards at $0.40-0.80 as a migration bridge. DESFire EV3 at $0.80-1.50 with EAL5+ Common Criteria banking-tier security. Mobile key at $0-0.50 per activation depending on lock-vendor licensing, with adoption near 14 percent.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PER-CARD PRICE BY TECHNOLOGY</text>
<text x="600" y="92" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="27" font-weight="700" fill="#291c0e">Each step up buys durability or security — not nicer printing</text>

<line x1="430" y1="120" x2="430" y2="560" stroke="#e6dfd2" stroke-width="1.5"/>
<line x1="650" y1="120" x2="650" y2="560" stroke="#efe9dd" stroke-width="1"/>
<line x1="870" y1="120" x2="870" y2="560" stroke="#efe9dd" stroke-width="1"/>
<line x1="1090" y1="120" x2="1090" y2="560" stroke="#efe9dd" stroke-width="1"/>
<text x="430" y="582" text-anchor="middle" font-size="12.5" fill="#4f4f4f">$0</text>
<text x="650" y="582" text-anchor="middle" font-size="12.5" fill="#4f4f4f">$0.50</text>
<text x="870" y="582" text-anchor="middle" font-size="12.5" fill="#4f4f4f">$1.00</text>
<text x="1090" y="582" text-anchor="middle" font-size="12.5" fill="#4f4f4f">$1.50</text>

<text x="70" y="166" font-size="15.5" font-weight="700" fill="#291c0e">Magstripe</text>
<text x="70" y="188" font-size="12.5" fill="#8b2d2d">useful life 3-12 months · 30-50% replaced/yr</text>
<rect x="474" y="156" width="66" height="30" rx="8" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="552" y="177" font-size="13.5" font-weight="800" fill="#291c0e">$0.10-0.25</text>

<text x="70" y="248" font-size="15.5" font-weight="700" fill="#291c0e">RFID — MIFARE Classic</text>
<text x="70" y="270" font-size="12.5" fill="#4f4f4f">3-5 yr life · ASSA ABLOY / Dormakaba / Salto</text>
<rect x="562" y="238" width="132" height="30" rx="8" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="706" y="259" font-size="13.5" font-weight="800" fill="#291c0e">$0.30-0.60</text>

<text x="70" y="330" font-size="15.5" font-weight="700" fill="#291c0e">Combo (RFID + magstripe)</text>
<text x="70" y="352" font-size="12.5" fill="#4f4f4f">migration bridge — tap new locks, swipe old</text>
<rect x="606" y="320" width="176" height="30" rx="8" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="794" y="341" font-size="13.5" font-weight="800" fill="#291c0e">$0.40-0.80</text>

<text x="70" y="412" font-size="15.5" font-weight="700" fill="#291c0e">RFID — DESFire EV3</text>
<text x="70" y="434" font-size="12.5" fill="#4f4f4f">EAL5+ Common Criteria — banking security tier</text>
<rect x="782" y="402" width="308" height="30" rx="8" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="1078" y="423" text-anchor="end" font-size="13.5" font-weight="800" fill="#1b4332">$0.80-1.50</text>

<text x="70" y="494" font-size="15.5" font-weight="700" fill="#291c0e">Mobile key</text>
<text x="70" y="516" font-size="12.5" fill="#4f4f4f">adoption near 14% — additive, not a replacement</text>
<rect x="430" y="484" width="220" height="30" rx="8" fill="#eef0f4" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="662" y="505" font-size="13.5" font-weight="800" fill="#291c0e">$0-0.50 per activation</text>

<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Every technology on one axis — the cheapest card is the one you buy most often.</text>
</svg>
