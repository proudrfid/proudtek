<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="mpTitle mpDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="mpTitle">Why magstripe had to go</title>
  <desc id="mpDesc">Five reasons stacked as rows. One, encoder repairs never end: four encoders across two properties at about 1.8 service visits each, 3,200 dollars a year. Two, re-encoding at check-in from demagnetized cards and phone-pocket interference, 14 percent of check-ins. Three, consumables by the box at 0.18 dollars per card times 54,000 cards a year, 9,720 dollars a year. Four, the guest room-access score was the lowest of all front-desk touchpoints at 7.1 out of 10. Five, the locks were on borrowed time: built 1998, magstripe Onity HT24w retrofit 2014, due for replacement anyway.</desc>

  <defs>
    <radialGradient id="mpBg" cx="50%" cy="22%" r="86%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#mpBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="66" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#6d5a3a">WHY MAGSTRIPE HAD TO GO</text>

  <!-- Row 1 -->
  <rect x="56" y="104" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="147" r="31" fill="#c39a5f"/><text x="116" y="156" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">1</text>
  <text x="180" y="140" font-size="25" font-weight="800" fill="#291c0e">Encoder repairs that never end</text>
  <text x="180" y="170" font-size="17" fill="#4f4f4f">4 encoders across two properties · about 1.8 service visits each</text>
  <rect x="912" y="125" width="214" height="44" rx="22" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/><text x="1019" y="153" text-anchor="middle" font-size="19" font-weight="800" fill="#8b2d2d">$3,200 / yr</text>

  <!-- Row 2 -->
  <rect x="56" y="200" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="243" r="31" fill="#3d6b6b"/><text x="116" y="252" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">2</text>
  <text x="180" y="236" font-size="25" font-weight="800" fill="#291c0e">Re-encoding at check-in</text>
  <text x="180" y="266" font-size="17" fill="#4f4f4f">Demagnetized cards, phone-pocket interference</text>
  <rect x="912" y="221" width="214" height="44" rx="22" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/><text x="1019" y="249" text-anchor="middle" font-size="19" font-weight="800" fill="#8b2d2d">14% of check-ins</text>

  <!-- Row 3 -->
  <rect x="56" y="296" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="339" r="31" fill="#4a5568"/><text x="116" y="348" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">3</text>
  <text x="180" y="332" font-size="25" font-weight="800" fill="#291c0e">Consumables by the box</text>
  <text x="180" y="362" font-size="17" fill="#4f4f4f">$0.18 per card × 54,000 cards a year, plus shipping &amp; waste</text>
  <rect x="912" y="317" width="214" height="44" rx="22" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/><text x="1019" y="345" text-anchor="middle" font-size="19" font-weight="800" fill="#8b2d2d">$9,720 / yr</text>

  <!-- Row 4 -->
  <rect x="56" y="392" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="435" r="31" fill="#2d6a4f"/><text x="116" y="444" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">4</text>
  <text x="180" y="428" font-size="25" font-weight="800" fill="#291c0e">The guest score nobody bragged about</text>
  <text x="180" y="458" font-size="17" fill="#4f4f4f">&#8220;Room access&#8221; — lowest of all front-desk touchpoints</text>
  <rect x="912" y="413" width="214" height="44" rx="22" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="1019" y="441" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">7.1 / 10</text>

  <!-- Row 5 -->
  <rect x="56" y="488" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="531" r="31" fill="#6d5a3a"/><text x="116" y="540" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">5</text>
  <text x="180" y="524" font-size="25" font-weight="800" fill="#291c0e">Locks already on borrowed time</text>
  <text x="180" y="554" font-size="17" fill="#4f4f4f">Built 1998 · magstripe Onity HT24w retrofit 2014, due anyway</text>
  <rect x="912" y="509" width="214" height="44" rx="22" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="1019" y="537" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">1998 build</text>

  <text x="600" y="616" text-anchor="middle" font-size="16.5" fill="#6d5a3a">Five separate line items, one root cause: a 1990s stripe doing a 2020s job.</text>
</svg>
