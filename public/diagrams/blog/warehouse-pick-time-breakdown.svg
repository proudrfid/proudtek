<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Where warehouse picking time goes, with and without LED tags</title>
<desc id="d">Two horizontal bars compare how a pick breaks down. The upper bar, without LED tags, has three parts: travel to the aisle, then a wide visual-search slice at the shelf face that is 30 to 50 percent of pick time, then pick and confirm. The lower bar, with LED tags, keeps travel and pick-and-confirm the same but collapses the visual-search slice to a quick glance, making the whole bar shorter. A bracket marks the reclaimed time. The point: LED tags attack the visual-search slice, cutting search time by 70 to 90 percent.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE PICKING TIME GOES</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Reading shelf labels is 30-50% of pick time — and it is the slice LED tags remove.</text>

<!-- WITHOUT bar -->
<text x="140" y="182" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a5568">WITHOUT LED TAGS</text>
<rect x="140" y="196" width="340" height="78" rx="6" fill="#c3cad3" stroke="#9aa3ad" stroke-width="1.6"/>
<rect x="480" y="196" width="400" height="78" fill="#f0c96f" stroke="#c39a5f" stroke-width="1.6"/>
<rect x="880" y="196" width="180" height="78" rx="6" fill="#cfe0e0" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="310" y="240" text-anchor="middle" font-size="14.5" font-weight="700" fill="#33404f">Travel to aisle</text>
<text x="680" y="233" text-anchor="middle" font-size="15.5" font-weight="800" fill="#6d5a3a">Visual search at shelf</text>
<text x="680" y="256" text-anchor="middle" font-size="13.5" fill="#7a6533">30-50% of pick time</text>
<text x="970" y="233" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">Pick +</text>
<text x="970" y="252" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">confirm</text>

<!-- WITH bar -->
<text x="140" y="360" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">WITH LED TAGS</text>
<rect x="140" y="374" width="340" height="78" rx="6" fill="#c3cad3" stroke="#9aa3ad" stroke-width="1.6"/>
<rect x="480" y="374" width="70" height="78" fill="#f0c96f" stroke="#c39a5f" stroke-width="1.6"/>
<rect x="550" y="374" width="180" height="78" rx="6" fill="#cfe0e0" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="310" y="418" text-anchor="middle" font-size="14.5" font-weight="700" fill="#33404f">Travel to aisle</text>
<text x="515" y="360" text-anchor="middle" font-size="12.5" fill="#7a6533">glance</text>
<text x="640" y="411" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">Pick +</text>
<text x="640" y="430" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">confirm</text>

<!-- reclaimed-time bracket -->
<line x1="730" y1="486" x2="1060" y2="486" stroke="#1f6f3a" stroke-width="2.4"/>
<line x1="730" y1="478" x2="730" y2="486" stroke="#1f6f3a" stroke-width="2.4"/>
<line x1="1060" y1="478" x2="1060" y2="486" stroke="#1f6f3a" stroke-width="2.4"/>
<text x="895" y="512" text-anchor="middle" font-size="15" font-weight="800" fill="#1f6f3a">reclaimed time</text>

<!-- legend -->
<rect x="300" y="556" width="18" height="18" rx="3" fill="#c3cad3" stroke="#9aa3ad" stroke-width="1.4"/>
<text x="326" y="570" font-size="13.5" fill="#5c5c5c">Travel</text>
<rect x="430" y="556" width="18" height="18" rx="3" fill="#f0c96f" stroke="#c39a5f" stroke-width="1.4"/>
<text x="456" y="570" font-size="13.5" fill="#5c5c5c">Visual search at shelf</text>
<rect x="700" y="556" width="18" height="18" rx="3" fill="#cfe0e0" stroke="#3d6b6b" stroke-width="1.4"/>
<text x="726" y="570" font-size="13.5" fill="#5c5c5c">Pick + confirm</text>

<text x="600" y="620" text-anchor="middle" font-size="15" fill="#4f4f4f">LED tags collapse the search slice — the correct location announces itself.</text>
</svg>
