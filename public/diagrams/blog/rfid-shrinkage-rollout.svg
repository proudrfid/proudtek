<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The RFID-for-shrinkage rollout onramp</title>
<desc id="d">Three steps most warehouses follow: start narrow with high-value or high-shrinkage SKUs for the fastest ROI; cover the choke points at receiving, put-away and shipping where stock changes hands; then fit the tag form factors — labels, rugged bin tags and anti-metal tags — to each product and environment.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">GETTING STARTED</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Start where it bleeds, prove it, then widen coverage.</text>
<rect x="110" y="200" width="280" height="236" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/><rect x="110" y="200" width="280" height="8" rx="4" fill="#c39a5f"/>
<circle cx="250.0" cy="244" r="20" fill="#c39a5f"/><text x="250.0" y="249" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="250.0" y="300" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Start narrow</text>
<text x="250.0" y="328" text-anchor="middle" font-size="13" fill="#5c5c5c">high-value &amp; high-</text>
<text x="250.0" y="347" text-anchor="middle" font-size="13" fill="#5c5c5c">shrinkage SKUs first</text>
<rect x="131.0" y="372" width="238" height="32" rx="16.0" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/><text x="250.0" y="392.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">fastest ROI + proof</text>
<rect x="460" y="200" width="280" height="236" rx="14" fill="#ffffff" stroke="#d3dae3" stroke-width="1.8"/><rect x="460" y="200" width="280" height="8" rx="4" fill="#4a5568"/>
<circle cx="600.0" cy="244" r="20" fill="#4a5568"/><text x="600.0" y="249" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="600.0" y="300" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Cover choke points</text>
<text x="600.0" y="328" text-anchor="middle" font-size="13" fill="#5c5c5c">receiving · put-away</text>
<text x="600.0" y="347" text-anchor="middle" font-size="13" fill="#5c5c5c">· shipping</text>
<rect x="481.0" y="372" width="238" height="32" rx="16.0" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.2"/><text x="600.0" y="392.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#3a4453">where stock moves</text>
<rect x="810" y="200" width="280" height="236" rx="14" fill="#ffffff" stroke="#d3dae3" stroke-width="1.8"/><rect x="810" y="200" width="280" height="8" rx="4" fill="#4a5568"/>
<circle cx="950.0" cy="244" r="20" fill="#4a5568"/><text x="950.0" y="249" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
<text x="950.0" y="300" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">Fit the tags</text>
<text x="950.0" y="328" text-anchor="middle" font-size="13" fill="#5c5c5c">labels · rugged bin</text>
<text x="950.0" y="347" text-anchor="middle" font-size="13" fill="#5c5c5c">· anti-metal</text>
<rect x="831.0" y="372" width="238" height="32" rx="16.0" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.2"/><text x="950.0" y="392.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#3a4453">product &amp; environment</text>
<line x1="393" y1="318" x2="418" y2="318" stroke="#4a5568" stroke-width="3"/><polygon points="418,311 427,318 418,325" fill="#4a5568"/>
<line x1="743" y1="318" x2="768" y2="318" stroke="#4a5568" stroke-width="3"/><polygon points="768,311 777,318 768,325" fill="#4a5568"/>
<text x="600" y="506" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Tag the whole building on day one and the pilot dies in committee — start where it bleeds.</text>
</svg>
