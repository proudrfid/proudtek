<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Pilot exit-criteria scorecard for a 200-card hotel pilot</title>
<desc id="d">A written pass-fail scorecard a 200-card hotel encoding pilot must clear before the full order. Open rate on tested locks: 100 percent, across at least 50 distinct lock instances. Issue time including the PMS: under 10 seconds average at a simulated peak of 20 to 30 arrivals per hour. Lost-card invalidation: under 60 seconds on cloud PMS, under 5 minutes on on-premises Opera. Encoder write failures: under 0.5 percent first-pass. Guest-facing incidents: zero across the two-week window. Durability rotation: 20 cards through two weeks of real staff pockets, laundry and dashboards. The footer notes that every failure found at pilot costs 10 to 20 times less than the same failure found after the full production order ships.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PILOT EXIT CRITERIA</text>
<text x="600" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">What 200 cards must prove</text>
<text x="600" y="124" text-anchor="middle" font-size="15" fill="#4f4f4f">Written pass/fail with named sign-off — or the pilot drifts into rationalisation.</text>

<!-- row 1 -->
<rect x="100" y="152" width="1000" height="62" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<circle cx="140" cy="183" r="15" fill="#1f6f3a"/>
<path d="M 132.5 183 l 5.5 5.5 l 10 -11" stroke="#ffffff" stroke-width="3" fill="none"/>
<text x="172" y="177" font-size="15.5" font-weight="700" fill="#291c0e">Open rate on tested locks</text>
<text x="172" y="199" font-size="12.5" fill="#5c5c5c">every firmware variant — back-of-house, lifts, spa, minibar</text>
<text x="1068" y="177" text-anchor="end" font-size="16" font-weight="800" fill="#234a4a">100%</text>
<text x="1068" y="199" text-anchor="end" font-size="12.5" fill="#5c5c5c">≥ 50 distinct locks</text>

<!-- row 2 -->
<rect x="100" y="224" width="1000" height="62" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<circle cx="140" cy="255" r="15" fill="#1f6f3a"/>
<path d="M 132.5 255 l 5.5 5.5 l 10 -11" stroke="#ffffff" stroke-width="3" fill="none"/>
<text x="172" y="249" font-size="15.5" font-weight="700" fill="#291c0e">Issue time, PMS included</text>
<text x="172" y="271" font-size="12.5" fill="#5c5c5c">measured at a simulated 20–30-arrival hour, not a bench test</text>
<text x="1068" y="249" text-anchor="end" font-size="16" font-weight="800" fill="#234a4a">&lt; 10 s average</text>
<text x="1068" y="271" text-anchor="end" font-size="12.5" fill="#5c5c5c">a 20 s issue = a visible queue</text>

<!-- row 3 -->
<rect x="100" y="296" width="1000" height="62" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<circle cx="140" cy="327" r="15" fill="#1f6f3a"/>
<path d="M 132.5 327 l 5.5 5.5 l 10 -11" stroke="#ffffff" stroke-width="3" fill="none"/>
<text x="172" y="321" font-size="15.5" font-weight="700" fill="#291c0e">Lost-card invalidation</text>
<text x="172" y="343" font-size="12.5" fill="#5c5c5c">lose 10 cards on purpose; confirm each is dead at the door</text>
<text x="1068" y="321" text-anchor="end" font-size="16" font-weight="800" fill="#234a4a">&lt; 60 s cloud · &lt; 5 min on-prem</text>
<text x="1068" y="343" text-anchor="end" font-size="12.5" fill="#5c5c5c">slow invalidation = security gap</text>

<!-- row 4 -->
<rect x="100" y="368" width="1000" height="62" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<circle cx="140" cy="399" r="15" fill="#1f6f3a"/>
<path d="M 132.5 399 l 5.5 5.5 l 10 -11" stroke="#ffffff" stroke-width="3" fill="none"/>
<text x="172" y="393" font-size="15.5" font-weight="700" fill="#291c0e">Encoder write failures</text>
<text x="172" y="415" font-size="12.5" fill="#5c5c5c">old encoder + new chip family can fail 5–15% — hidden in bench tests</text>
<text x="1068" y="393" text-anchor="end" font-size="16" font-weight="800" fill="#234a4a">&lt; 0.5% first-pass</text>
<text x="1068" y="415" text-anchor="end" font-size="12.5" fill="#5c5c5c">test at peak speed</text>

<!-- row 5 -->
<rect x="100" y="440" width="1000" height="62" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<circle cx="140" cy="471" r="15" fill="#1f6f3a"/>
<path d="M 132.5 471 l 5.5 5.5 l 10 -11" stroke="#ffffff" stroke-width="3" fill="none"/>
<text x="172" y="465" font-size="15.5" font-weight="700" fill="#291c0e">Guest-facing incidents</text>
<text x="172" y="487" font-size="12.5" fill="#5c5c5c">including recovery drills: demagnetised mid-stay, unstaffed lobby</text>
<text x="1068" y="465" text-anchor="end" font-size="16" font-weight="800" fill="#234a4a">0 across two weeks</text>
<text x="1068" y="487" text-anchor="end" font-size="12.5" fill="#5c5c5c">rehearse before real guests do</text>

<!-- row 6 -->
<rect x="100" y="512" width="1000" height="62" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<circle cx="140" cy="543" r="15" fill="#1f6f3a"/>
<path d="M 132.5 543 l 5.5 5.5 l 10 -11" stroke="#ffffff" stroke-width="3" fill="none"/>
<text x="172" y="537" font-size="15.5" font-weight="700" fill="#291c0e">Durability rotation</text>
<text x="172" y="559" font-size="12.5" fill="#5c5c5c">pockets with coins and phones, uniforms through laundry, hot dashboards</text>
<text x="1068" y="537" text-anchor="end" font-size="16" font-weight="800" fill="#234a4a">20 cards · two weeks</text>
<text x="1068" y="559" text-anchor="end" font-size="12.5" fill="#5c5c5c">staff wear beats lab wear</text>

<!-- footer -->
<rect x="100" y="596" width="1000" height="40" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="621" text-anchor="middle" font-size="14" font-weight="700" fill="#6d5a3a">Every failure found here costs 10–20× less than the same failure after the full order ships.</text>
</svg>
