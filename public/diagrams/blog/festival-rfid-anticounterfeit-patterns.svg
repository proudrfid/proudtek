<circle cx="458" cy="369" r="4" fill="#234a4a"/>
<text x="474" y="374" font-size="12.5" fill="#333333">live even when the network drops</text>
<rect x="458" y="440" width="284" height="34" rx="17" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.4"/>
