<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE FAMILY · ONE DIFFERENCE · THREE TRUNK SIZES</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">NTAG213 vs NTAG215 vs NTAG216 — pick by payload</text>

