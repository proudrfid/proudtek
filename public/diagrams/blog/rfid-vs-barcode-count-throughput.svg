<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID reads 500-1,000 items per minute versus 20-40 by barcode</title>
<desc id="d">A throughput comparison shown as two bars. A short steel bar marks a barcode gun at 20-40 items per minute, needing line-of-sight and one item at a time. A long green bar marks a UHF RFID handheld at 500-1,000 items per minute, roughly 10-25 times faster. Four property cards below explain why: RFID reads through cardboard, plastic and fabric; needs no line-of-sight so sealed cartons are counted; gives each tag a unique EPC for automatic de-duplication; and shows a live expected-versus-actual count on the handheld.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COUNTING THROUGHPUT</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">One reader pass counts everything in range — walking speed beats a barcode gun many times over.</text>

<text x="96" y="220" font-size="15" font-weight="700" fill="#291c0e">Barcode gun</text>
<text x="96" y="240" font-size="12" fill="#5c5c5c">line-of-sight, one at a time</text>
<rect x="330" y="192" width="132" height="56" rx="8" fill="#4a5568"/>
<text x="486" y="228" font-size="19" font-weight="800" fill="#4a5568">20-40 / min</text>

<text x="96" y="324" font-size="15" font-weight="700" fill="#291c0e">UHF RFID handheld</text>
<text x="96" y="344" font-size="12" fill="#5c5c5c">bulk, no line-of-sight</text>
<rect x="330" y="296" width="760" height="56" rx="8" fill="#1f6f3a"/>
<text x="710" y="332" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">500-1,000 items / min</text>

<text x="710" y="283" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">≈ 10-25× faster than barcode scanning</text>

<rect x="90" y="410" width="246" height="116" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="120" cy="440" r="8" fill="#3d6b6b"/>
<text x="213" y="470" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Reads through cardboard,</text>
<text x="213" y="492" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">plastic and fabric</text>

<rect x="348" y="410" width="246" height="116" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="378" cy="440" r="8" fill="#3d6b6b"/>
<text x="471" y="470" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">No line-of-sight —</text>
<text x="471" y="492" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">sealed cartons counted</text>

<rect x="606" y="410" width="246" height="116" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="636" cy="440" r="8" fill="#3d6b6b"/>
<text x="729" y="470" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Unique EPC per tag —</text>
<text x="729" y="492" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">automatic de-duplication</text>

<rect x="864" y="410" width="246" height="116" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="894" cy="440" r="8" fill="#3d6b6b"/>
<text x="987" y="470" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Live expected-vs-actual</text>
<text x="987" y="492" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">count on the handheld</text>

<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The gain is not a faster clipboard — it is clearing an entire zone in a single walk-through.</text>
</svg>
