<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Three credential rails — physical card, BLE app key, NFC wallet — into one dual-credential hotel lock</title>
<desc id="d">Three ways a guest can open the same door, all accepted by one dual-credential lock. Rail one, the physical RFID card, still carries about 86 percent of stays and is the backup for lost or dead phones. Rail two, a BLE app key from the Hilton, Marriott or IHG apps, works with the phone in a pocket at roughly 3 to 10 metres. Rail three, an NFC wallet key in Apple Wallet or Google Wallet, is a tap to unlock with no standalone app. All three converge on a dual-credential lock — ASSA ABLOY Visionline, SALTO XS4 2.0 or dormakaba Saflok Quantum — running one firmware that accepts both rails. Digital-key adoption is around 14 percent, so physical cards still hold the default slot.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PHYSICAL + MOBILE · ONE LOCK, THREE RAILS</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Cards and phones share the same door</text>
<text x="600" y="138" text-anchor="middle" font-size="16" fill="#4f4f4f">Dual-credential locks accept a physical card and a mobile key without conflict.</text>

