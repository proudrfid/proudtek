<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">FDA UDI compliance timeline by risk class — 2014, 2016, 2022, and the 2026 picture</title>
<desc id="d">A timeline. Class III life-supporting and life-sustaining devices: UDI since September 24, 2014 — the 2026 issue is GUDID data hygiene. Class II, most general medical devices: UDI since September 24, 2016 — a missing UDI is now a Form FDA-483 finding. Class I and unclassified: compliance and direct-mark dates September 24, 2022, with GUDID submission by December 8, 2022 — inspectors check the label transition. At 2026, every class is in scope and audit focus has moved to GUDID data quality, direct part marking and kit exemptions. Two notes below: direct part marking under 21 CFR 801.45 — reusable, reprocessed instruments need permanent marking, RFID is acceptable AIDC but a human-readable identifier must accompany it; and kits and combination products under 21 CFR 801.30 — exemptions exist, but the device inside the kit keeps its own UDI, and kit-only marking is a recurring 483 observation.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
