<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="wlTitle wlDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="wlTitle">Why luxury bags are the highest-ROI NFC anti-counterfeit category</title>
  <desc id="wlDesc">Five reasons stacked as rows. One, unit value carries the chip: a 2,000 to 10,000 dollar bag hides a chip that costs 0.30 to 1.00 dollar. Two, super-fakes beat the eye, so cryptographic proof replaces visual judgment. Three, the resale market runs on proof, where authentication services charge 5 to 15 percent fees. Four, every authentic tap is a CRM event that captures an otherwise-anonymous buyer. Five, repair and concierge services need provenance, cutting boutique intake to seconds.</desc>
  <defs>
    <radialGradient id="wlBg" cx="50%" cy="22%" r="86%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#wlBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="66" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#6d5a3a">WHY LUXURY BAGS ARE THE #1 NFC USE CASE</text>

  <!-- Row template: card + numbered token circle + label + desc + right pill -->
  <!-- Row 1 -->
  <rect x="56" y="104" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="147" r="31" fill="#c39a5f"/><text x="116" y="156" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">1</text>
  <text x="180" y="140" font-size="26" font-weight="800" fill="#291c0e">Unit value carries the chip</text>
  <text x="180" y="170" font-size="17.5" fill="#4f4f4f">A $2K–10K bag hides a sub-dollar secure inlay — margins unchanged</text>
  <rect x="902" y="125" width="214" height="44" rx="22" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="1009" y="153" text-anchor="middle" font-size="18" font-weight="700" fill="#291c0e">$0.30–1.00</text>

  <!-- Row 2 -->
  <rect x="56" y="200" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="243" r="31" fill="#3d6b6b"/><text x="116" y="252" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">2</text>
  <text x="180" y="236" font-size="26" font-weight="800" fill="#291c0e">Super-fakes beat the eye</text>
  <text x="180" y="266" font-size="17.5" fill="#4f4f4f">Cryptographic proof removes visual judgment from authentication</text>
  <rect x="902" y="221" width="214" height="44" rx="22" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.5"/><text x="1009" y="249" text-anchor="middle" font-size="18" font-weight="700" fill="#177a92">crypto, not eye</text>

  <!-- Row 3 -->
  <rect x="56" y="296" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="339" r="31" fill="#4a5568"/><text x="116" y="348" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">3</text>
  <text x="180" y="332" font-size="26" font-weight="800" fill="#291c0e">Resale runs on proof</text>
  <text x="180" y="362" font-size="17.5" fill="#4f4f4f">Verified bags turn over faster on The RealReal, Vestiaire, StockX</text>
  <rect x="902" y="317" width="214" height="44" rx="22" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="1009" y="345" text-anchor="middle" font-size="18" font-weight="700" fill="#291c0e">5–15% fees</text>

  <!-- Row 4 -->
  <rect x="56" y="392" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="435" r="31" fill="#2d6a4f"/><text x="116" y="444" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">4</text>
  <text x="180" y="428" font-size="26" font-weight="800" fill="#291c0e">Every tap is a CRM event</text>
  <text x="180" y="458" font-size="17.5" fill="#4f4f4f">Capture the buyer wholesale and resale channels otherwise hide</text>
  <rect x="902" y="413" width="214" height="44" rx="22" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="1.5"/><text x="1009" y="441" text-anchor="middle" font-size="18" font-weight="700" fill="#1f6f3a">1st-tap data</text>

  <!-- Row 5 -->
  <rect x="56" y="488" width="1088" height="86" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="116" cy="531" r="31" fill="#6d5a3a"/><text x="116" y="540" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">5</text>
  <text x="180" y="524" font-size="26" font-weight="800" fill="#291c0e">Repair needs provenance</text>
  <text x="180" y="554" font-size="17.5" fill="#4f4f4f">Boutiques only service authenticated items — intake in seconds</text>
  <rect x="902" y="509" width="214" height="44" rx="22" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/><text x="1009" y="537" text-anchor="middle" font-size="18" font-weight="700" fill="#291c0e">sec, not min</text>

  <text x="600" y="616" text-anchor="middle" font-size="16.5" fill="#6d5a3a">High value + relentless fakes + a resale market that pays for proof = the highest-ROI category.</text>
</svg>
