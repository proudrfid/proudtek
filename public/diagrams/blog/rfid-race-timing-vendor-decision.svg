<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Choosing a race-timing vendor by scale and geography</title>
<desc id="d">Five managed-timer options and when each fits. MYLAPS BibTag: the world's most-deployed mass timing system, for 1,000-plus-runner events wanting multi-decoder redundancy. ChronoTrack: US majors with tight RunSignUp or Race Roster integration and an economical bib chip. Race Result: Europe and multi-discipline events, with an active shoe-transponder option. A local rented rig: major-brand reliability without the capital outlay. DIY UHF self-build: reserve for educational or trail-run prototypes only.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CHOOSING A RACE-TIMING VENDOR</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Almost never build your own — match the managed timer to scale and geography.</text>

<text x="210" y="132" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MANAGED TIMER</text>
<text x="745" y="132" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BEST WHEN</text>

<rect x="64" y="150" width="1072" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="84" y="165" width="252" height="44" rx="22" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/><text x="210" y="193" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">MYLAPS BibTag</text>
<line x1="354" y1="162" x2="354" y2="212" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="372" y="184" font-size="14.5" fill="#291c0e">The world's most-deployed mass timing system —</text>
<text x="372" y="207" font-size="13" fill="#5c5c5c">1,000+ runners, multi-decoder redundancy, a known quantity.</text>

<rect x="64" y="236" width="1072" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="84" y="251" width="252" height="44" rx="22" fill="#faf3e6" stroke="#e4c98f" stroke-width="1.4"/><text x="210" y="279" text-anchor="middle" font-size="15" font-weight="800" fill="#a07d43">ChronoTrack</text>
<line x1="354" y1="248" x2="354" y2="298" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="372" y="270" font-size="14.5" fill="#291c0e">Used at NYC, Boston and many US majors —</text>
<text x="372" y="293" font-size="13" fill="#5c5c5c">tight RunSignUp / Race Roster integration; economical bib chip.</text>

<rect x="64" y="322" width="1072" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="84" y="337" width="252" height="44" rx="22" fill="#eef1f5" stroke="#c3ccd8" stroke-width="1.4"/><text x="210" y="365" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4657">Race Result</text>
<line x1="354" y1="334" x2="354" y2="384" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="372" y="356" font-size="14.5" fill="#291c0e">Big in Europe and multi-discipline events —</text>
<text x="372" y="379" font-size="13" fill="#5c5c5c">active shoe-transponder option where a bib won't sit.</text>

<rect x="64" y="408" width="1072" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="84" y="423" width="252" height="44" rx="22" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/><text x="210" y="451" text-anchor="middle" font-size="15" font-weight="800" fill="#1f6f3a">Local rented rig</text>
<line x1="354" y1="420" x2="354" y2="470" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="372" y="442" font-size="14.5" fill="#291c0e">Rent a major-brand rig from a local timer —</text>
<text x="372" y="465" font-size="13" fill="#5c5c5c">major-brand reliability, none of the capital outlay.</text>

<rect x="64" y="494" width="1072" height="74" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="84" y="509" width="252" height="44" rx="22" fill="#f4efe4" stroke="#d8cdb8" stroke-width="1.4"/><text x="210" y="537" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">DIY UHF self-build</text>
<line x1="354" y1="506" x2="354" y2="556" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="372" y="528" font-size="14.5" fill="#291c0e">Cheap on a whiteboard, expensive once the gun goes —</text>
<text x="372" y="551" font-size="13" fill="#5c5c5c">reserve for educational or trail-run prototypes.</text>

<text x="600" y="606" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Buy the reliability you can't rehearse — race morning is a bad time to meet your decoder for the first time.</text>
</svg>
