<text x="186.0" y="276" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">Pre-tagged 70–95%</text>
<text x="186.0" y="306" text-anchor="middle" font-size="12" fill="#5c5c5c">under Walmart / Target /</text>
<text x="186.0" y="332" text-anchor="middle" font-size="12" fill="#5c5c5c">Macy's mandates → ~$0/store</text>
