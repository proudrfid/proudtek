<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="stepst stepsd" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="stepst">Battery passport implementation in five steps</title>
  <desc id="stepsd">Five steps early-mover OEMs used to implement a battery passport in 2025-2026 pilots. One, choose the data-carrier mix: mandatory QR plus recommended NFC plus a 2D matrix, with NFC enabling app-free tap-to-update. Two, select a harsh-environment NFC tag rated for -40°C to +85°C, such as a ceramic-substrate inlay. Three, bond the tag to the casing with epoxy rated for the full 10-plus-year lifespan. Four, build the backend on GS1 EPCIS 2.0 plus CIRPASS schemas, fed by MES, BMS and field telematics. Five, plan permission-based handoffs from OEM to fleet operator to second-life user to recycler.</desc>
  <defs><radialGradient id="stepsbg" cx="50%" cy="16%" r="95%"><stop offset="0%" stop-color="#f8f0df"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#stepsbg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="24" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="57" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="1.3" fill="#6d5a3a">Five steps from bare pack to compliant passport</text>
  <line x1="180" y1="205" x2="1020" y2="205" stroke="#c39a5f" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <circle cx="180" cy="205" r="44" fill="#f0f6f2" stroke="#2d6a4f" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="180" cy="205" r="34" fill="#2d6a4f"/>
  <text x="180.0" y="216.0" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">1</text>
  <text x="180.0" y="300.0" text-anchor="middle" font-size="20" font-weight="800" fill="#291c0e">Carrier mix</text>
  <text x="180.0" y="330.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4f4f4f">QR + NFC + 2D.</text>
  <text x="180.0" y="352.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4f4f4f">NFC = no app.</text>
  <circle cx="390" cy="205" r="44" fill="#eef5f5" stroke="#3d6b6b" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="390" cy="205" r="34" fill="#3d6b6b"/>
  <text x="390.0" y="216.0" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">2</text>
  <text x="390.0" y="300.0" text-anchor="middle" font-size="20" font-weight="800" fill="#291c0e">Harsh-env tag</text>
  <text x="390.0" y="330.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4f4f4f">-40 to +85°C.</text>
  <text x="390.0" y="352.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4f4f4f">Ceramic inlay.</text>
  <circle cx="600" cy="205" r="44" fill="#f1f3f6" stroke="#4a5568" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="600" cy="205" r="34" fill="#4a5568"/>
  <text x="600.0" y="216.0" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">3</text>
  <text x="600.0" y="300.0" text-anchor="middle" font-size="20" font-weight="800" fill="#291c0e">Bond it down</text>
  <text x="600.0" y="330.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4f4f4f">Epoxy for the</text>
  <text x="600.0" y="352.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4f4f4f">full 10+ years.</text>
  <circle cx="810" cy="205" r="44" fill="#fdf8ef" stroke="#c39a5f" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="810" cy="205" r="34" fill="#c39a5f"/>
  <text x="810.0" y="216.0" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">4</text>
  <text x="810.0" y="300.0" text-anchor="middle" font-size="20" font-weight="800" fill="#291c0e">Backend model</text>
  <text x="810.0" y="330.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4f4f4f">GS1 EPCIS 2.0</text>
  <text x="810.0" y="352.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4f4f4f">+ CIRPASS.</text>
  <circle cx="1020" cy="205" r="44" fill="#fbeeee" stroke="#8b2d2d" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="1020" cy="205" r="34" fill="#8b2d2d"/>
  <text x="1020.0" y="216.0" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">5</text>
  <text x="1020.0" y="300.0" text-anchor="middle" font-size="20" font-weight="800" fill="#291c0e">Handoffs</text>
  <text x="1020.0" y="330.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4f4f4f">RBAC: OEM →</text>
  <text x="1020.0" y="352.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4f4f4f">… → recycler.</text>
  <polygon points="281.0,199 291.0,205 281.0,211" fill="#c39a5f" fill-opacity="0.75"/>
  <polygon points="491.0,199 501.0,205 491.0,211" fill="#c39a5f" fill-opacity="0.75"/>
  <polygon points="701.0,199 711.0,205 701.0,211" fill="#c39a5f" fill-opacity="0.75"/>
  <polygon points="911.0,199 921.0,205 911.0,211" fill="#c39a5f" fill-opacity="0.75"/>
  <rect x="220" y="404" width="760" height="66" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="600.0" y="432.0" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Step 2 is where most pilots fail: a standard paper inlay quietly dies in the first winter.</text>
  <text x="600.0" y="456.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4f4f4f">Get the environment spec from the datasheet before you order, not after.</text>
  <text x="600.0" y="520.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#6d5a3a">Five steps, one order of operations. Skip the tag spec and you will run all five again.</text>
</svg>
