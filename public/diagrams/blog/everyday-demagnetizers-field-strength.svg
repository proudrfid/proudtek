<rect x="664" y="500" width="20" height="20" rx="3" fill="#8b2d2d"/>
<rect x="804" y="486" width="308" height="48" rx="10" fill="#ffffff" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="958" y="515" text-anchor="middle" font-size="14.5" font-weight="800" fill="#8b2d2d">5,000-50,000 Gauss</text>

<text x="600" y="582" text-anchor="middle" font-size="14" fill="#4f4f4f">The worst offender is rarely the phone — and an RFID card ignores every one of them.</text>
</svg>
