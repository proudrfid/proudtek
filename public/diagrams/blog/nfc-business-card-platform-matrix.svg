<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NFC business-card platforms compared: V1CE, Popl, Mobilo, Linq, white-label</title>
<desc id="d">A five-row comparison matrix. V1CE fits solo executives and premium teams, offers premium finishes with no recipient app, and carries no flagged risk. Popl fits individual creators and small teams, is app-driven, and is app-dependent. Mobilo fits CRM-first sales teams with native Salesforce and HubSpot integration. Linq is for existing users only after pivoting to AI messaging in 2026, and is flagged with sunset risk in red. White-label custom metal, the recommended option, fits enterprises wanting full control, lets you own the profile URL with any NFC writer, and has no lock-in.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BUILD-VS-BUY: THE 2026 FIELD</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Five ways to put a tap on a card — and who each one fits.</text>

<!-- headers -->
<text x="94" y="130" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">PLATFORM</text>
<text x="300" y="130" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">BEST FIT</text>
<text x="560" y="130" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">KEY TRAIT</text>
<text x="1041" y="130" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">PLATFORM RISK</text>

<!-- row V1CE -->
<rect x="64" y="146" width="1072" height="62" rx="11" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.3"/>
<rect x="64" y="146" width="9" height="62" rx="4" fill="#c39a5f"/>
<text x="94" y="183" font-size="15.5" font-weight="800" fill="#291c0e">V1CE</text>
<text x="300" y="182" font-size="12.5" fill="#4f4f4f">Solo execs, premium teams</text>
<text x="560" y="182" font-size="12.5" fill="#4f4f4f">Premium finishes; no recipient app</text>
<rect x="966" y="161" width="150" height="32" rx="16" fill="#f0eee8" stroke="#d9d2c4" stroke-width="1.2"/>
<text x="1041" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a8a8a">none flagged</text>

<!-- row Popl -->
<rect x="64" y="216" width="1072" height="62" rx="11" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.3"/>
<rect x="64" y="216" width="9" height="62" rx="4" fill="#3d6b6b"/>
<text x="94" y="253" font-size="15.5" font-weight="800" fill="#291c0e">Popl</text>
<text x="300" y="252" font-size="12.5" fill="#4f4f4f">Creators, small sales teams</text>
<text x="560" y="252" font-size="12.5" fill="#4f4f4f">App-driven editor; app for extras</text>
<rect x="966" y="231" width="150" height="32" rx="16" fill="#f0eee8" stroke="#d9d2c4" stroke-width="1.2"/>
<text x="1041" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a8a8a">app-dependent</text>

<!-- row Mobilo -->
<rect x="64" y="286" width="1072" height="62" rx="11" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.3"/>
<rect x="64" y="286" width="9" height="62" rx="4" fill="#2c5454"/>
<text x="94" y="323" font-size="15.5" font-weight="800" fill="#291c0e">Mobilo</text>
<text x="300" y="322" font-size="12.5" fill="#4f4f4f">CRM-first sales teams</text>
<text x="560" y="322" font-size="12.5" fill="#4f4f4f">Native Salesforce &amp; HubSpot</text>
<rect x="966" y="301" width="150" height="32" rx="16" fill="#f0eee8" stroke="#d9d2c4" stroke-width="1.2"/>
<text x="1041" y="322" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a8a8a">none flagged</text>

<!-- row Linq -->
<rect x="64" y="356" width="1072" height="62" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.3"/>
