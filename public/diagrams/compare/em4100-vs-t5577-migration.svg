<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="migTitle migDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="migTitle">EM4100 to T5577 migration and the read-only to rewritable upgrade path</title>
  <desc id="migDesc">A four-stop upgrade roadmap. One, hybrid issuance: issue T5577 emulating EM4100 alongside existing EM4100 credentials; both work on the reader fleet and old stock attrits over 12 to 18 months. Two, harden the readers: the real upgrade is moving from 125 kHz LF readers to 13.56 MHz HF readers, because T5577 changes only the credential medium, not the cloning surface. Three, dual-frequency bridge cards carry both a 125 kHz LF chip and a 13.56 MHz HF chip during the crossover. Four, log and watch: flag impossible travel, such as one credential at two doors 200 metres apart within a minute. Real cloning resistance means 13.56 MHz — MIFARE Plus EV2 SL3 or DESFire EV3 with AES-128 mutual authentication.</desc>

  <defs>
    <radialGradient id="migGlow" cx="50%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#f9ecd2"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="migArrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#2d6a4f"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#migGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="62" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2" fill="#6d5a3a">THE READ-ONLY → REWRITABLE UPGRADE PATH</text>
  <text x="600" y="91" text-anchor="middle" font-size="16" fill="#4a5568">Nobody flips the whole credential fleet in a single weekend.</text>

  <!-- connector line + nodes -->
  <line x1="191" y1="150" x2="1002" y2="150" stroke="#e0d3ba" stroke-width="3"/>
  <g font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">
    <circle cx="191" cy="150" r="16" fill="#c39a5f"/><text x="191" y="155">1</text>
    <circle cx="461" cy="150" r="16" fill="#3d6b6b"/><text x="461" y="155">2</text>
    <circle cx="731" cy="150" r="16" fill="#c39a5f"/><text x="731" y="155">3</text>
    <circle cx="1002" cy="150" r="16" fill="#c39a5f"/><text x="1002" y="155">4</text>
  </g>

  <!-- ============ 4 cards ============ -->
  <!-- card 1 -->
  <g>
    <rect x="64" y="184" width="255" height="188" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="84" y="216" font-size="15" font-weight="800" fill="#291c0e">Hybrid issuance</text>
    <text x="84" y="244" font-size="12" fill="#4a5568">Issue T5577 (dressed as</text>
    <text x="84" y="262" font-size="12" fill="#4a5568">EM4100) beside the EM4100s</text>
    <text x="84" y="280" font-size="12" fill="#4a5568">already in wallets. Both</text>
    <text x="84" y="298" font-size="12" fill="#4a5568">badge in — no big-bang swap.</text>
    <text x="84" y="336" font-size="12" font-weight="700" fill="#6d5a3a">Old stock attrits over</text>
    <text x="84" y="353" font-size="12" font-weight="700" fill="#6d5a3a">12–18 months.</text>
  </g>
  <!-- card 2 (highlighted: the real fix) -->
  <g>
    <rect x="334" y="184" width="255" height="188" rx="14" fill="#eef4f4" stroke="#3d6b6b" stroke-width="2.5"/>
    <rect x="334" y="184" width="255" height="26" rx="13" fill="#3d6b6b"/>
    <rect x="334" y="197" width="255" height="13" fill="#3d6b6b"/>
    <text x="461" y="202" text-anchor="middle" font-size="11" font-weight="800" letter-spacing="1" fill="#ffffff">THE REAL FIX</text>
    <text x="354" y="238" font-size="15" font-weight="800" fill="#291c0e">Harden the readers</text>
    <text x="354" y="264" font-size="12" fill="#3a4a52">The true upgrade is</text>
    <text x="354" y="282" font-size="12" fill="#3a4a52">LF → HF readers. T5577</text>
    <text x="354" y="300" font-size="12" fill="#3a4a52">changes the medium, not the</text>
    <text x="354" y="318" font-size="12" fill="#3a4a52">125 kHz cloning surface.</text>
    <text x="354" y="352" font-size="12" font-weight="700" fill="#2c5454">Same clone risk otherwise.</text>
  </g>
  <!-- card 3 -->
  <g>
    <rect x="604" y="184" width="255" height="188" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="624" y="216" font-size="15" font-weight="800" fill="#291c0e">Dual-frequency bridge</text>
    <text x="624" y="244" font-size="12" fill="#4a5568">One card, two chips:</text>
    <text x="624" y="262" font-size="12" fill="#4a5568">125 kHz LF + 13.56 MHz HF</text>
    <text x="624" y="280" font-size="12" fill="#4a5568">in the same body. Both</text>
    <text x="624" y="298" font-size="12" fill="#4a5568">readers see it at once.</text>
    <text x="624" y="336" font-size="12" font-weight="700" fill="#6d5a3a">Carries you through the</text>
    <text x="624" y="353" font-size="12" font-weight="700" fill="#6d5a3a">crossover window.</text>
  </g>
  <!-- card 4 -->
  <g>
    <rect x="874" y="184" width="255" height="188" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="894" y="216" font-size="15" font-weight="800" fill="#291c0e">Log &amp; watch</text>
    <text x="894" y="244" font-size="12" fill="#4a5568">Whatever the chip, flag</text>
    <text x="894" y="262" font-size="12" fill="#4a5568">impossible travel: one</text>
    <text x="894" y="280" font-size="12" fill="#4a5568">credential at two doors</text>
    <text x="894" y="298" font-size="12" fill="#4a5568">200 m apart in a minute.</text>
    <text x="894" y="336" font-size="12" font-weight="700" fill="#6d5a3a">The control that works</text>
    <text x="894" y="353" font-size="12" font-weight="700" fill="#6d5a3a">on any medium.</text>
  </g>

  <!-- ============ key insight banner ============ -->
  <g>
    <rect x="64" y="404" width="1065" height="86" rx="14" fill="#eaf3ee" stroke="#a9cdba" stroke-width="1.5"/>
    <circle cx="112" cy="447" r="20" fill="#2d6a4f"/>
    <path d="M104 447 l6 6 12 -14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="152" y="440" font-size="15" font-weight="800" fill="#1b4332">Want actual cloning resistance? It isn't a chip swap — it's a frequency swap.</text>
    <text x="152" y="466" font-size="13.5" fill="#2d6a4f">Move to 13.56 MHz — MIFARE Plus EV2 SL3 or DESFire EV3 — where AES-128 mutual authentication ends the commodity-clone game entirely.</text>
  </g>

  <!-- ============ LF → HF arrow ============ -->
  <g>
    <rect x="150" y="524" width="360" height="58" rx="14" fill="#f6e9e6" stroke="#d8a99f" stroke-width="1.5"/>
    <text x="330" y="549" text-anchor="middle" font-size="14" font-weight="800" fill="#8b2d2d">125 kHz LF</text>
    <text x="330" y="569" text-anchor="middle" font-size="12" fill="#7a3b34">copied in 6 seconds, no key required</text>

    <line x1="524" y1="553" x2="676" y2="553" stroke="#2d6a4f" stroke-width="4" marker-end="url(#migArrow)"/>

    <rect x="690" y="524" width="360" height="58" rx="14" fill="#eaf3ee" stroke="#a9cdba" stroke-width="1.5"/>
    <text x="870" y="549" text-anchor="middle" font-size="14" font-weight="800" fill="#1b4332">13.56 MHz HF</text>
    <text x="870" y="569" text-anchor="middle" font-size="12" fill="#2d6a4f">AES-128 challenge–response, not copyable</text>
  </g>

  <text x="600" y="622" text-anchor="middle" font-size="13" fill="#9a8f7a">T5577 is a smoother credential — not a stronger one. Security lives at the reader and the frequency.</text>
</svg>
