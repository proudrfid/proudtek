<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A blood unit's two identifiers resolving to one validated electronic record</title>
<desc id="d">Three-stage flow. Stage one, the blood unit carries two identifier carriers: a printed ISBT 128 barcode (regulator-mandated) and an RFID overlay tag. Stage two, an RFID reader reads both carriers in a single pass. Stage three, the scan resolves to one validated electronic record that satisfies FDA 21 CFR Part 11 — system validated to IQ, OQ and PQ, audit trail, electronic signature and 10-year retention. Caption: the printed barcode stays mandatory; RFID adds a faster, redundant read into one auditable record.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE UNIT · ONE VALIDATED ELECTRONIC RECORD</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="33" font-weight="700" fill="#291c0e">Blood-bank RFID under FDA 21 CFR Part 11</text>

<!-- Card A: the unit -->
<rect x="56" y="150" width="340" height="384" rx="16" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="226" y="184" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.5" fill="#6d5a3a">THE BLOOD UNIT</text>
<!-- ports -->
<rect x="200" y="206" width="10" height="16" rx="2" fill="#2c5454"/>
<rect x="242" y="206" width="10" height="16" rx="2" fill="#2c5454"/>
<!-- bag body -->
<rect x="164" y="220" width="124" height="210" rx="26" fill="#ffffff" stroke="#2c5454" stroke-width="2.5"/>
<rect x="176" y="360" width="100" height="58" rx="14" fill="#f3ece0"/>
<!-- barcode block -->
<rect x="186" y="250" width="80" height="46" rx="4" fill="#ffffff" stroke="#d9c6a3" stroke-width="1.2"/>
<g fill="#291c0e"><rect x="194" y="258" width="3" height="30"/><rect x="200" y="258" width="2" height="30"/><rect x="205" y="258" width="4" height="30"/><rect x="212" y="258" width="2" height="30"/><rect x="217" y="258" width="3" height="30"/><rect x="223" y="258" width="2" height="30"/><rect x="228" y="258" width="4" height="30"/><rect x="235" y="258" width="2" height="30"/><rect x="240" y="258" width="3" height="30"/><rect x="246" y="258" width="2" height="30"/><rect x="251" y="258" width="4" height="30"/><rect x="258" y="258" width="2" height="30"/></g>
<text x="226" y="315" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">ISBT 128 barcode</text>
<!-- RFID chip -->
<rect x="192" y="326" width="68" height="34" rx="6" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<rect x="200" y="334" width="18" height="18" rx="3" fill="#3d6b6b"/>
<path d="M 226 336 a 9 9 0 0 1 0 16" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<path d="M 234 331 a 15 15 0 0 1 0 26" fill="none" stroke="#6a9090" stroke-width="2"/>
<!-- captions -->
<text x="226" y="460" text-anchor="middle" font-size="14.5" font-weight="600" fill="#291c0e">Two carriers, one identity</text>
<text x="226" y="486" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Printed ISBT 128 — mandatory</text>
<text x="226" y="508" text-anchor="middle" font-size="12.5" fill="#4f4f4f">RFID overlay — faster, redundant</text>

<!-- arrow A -> B -->
<line x1="402" y1="342" x2="424" y2="342" stroke="#c39a5f" stroke-width="3"/>
<path d="M 424 342 l -11 -6 v 12 z" fill="#c39a5f"/>

<!-- Card B: the reader -->
<rect x="430" y="150" width="340" height="384" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="600" y="184" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.5" fill="#2c5454">RFID READER</text>
<!-- waves opening left -->
<path d="M 548 292 A 42 42 0 0 0 548 372" fill="none" stroke="#3d6b6b" stroke-width="3"/>
<path d="M 536 276 A 60 60 0 0 0 536 388" fill="none" stroke="#6a9090" stroke-width="2.5"/>
<path d="M 524 262 A 80 80 0 0 0 524 402" fill="none" stroke="#9fbcbc" stroke-width="2"/>
<!-- reader device -->
<rect x="566" y="256" width="96" height="152" rx="18" fill="#234a4a"/>
<rect x="578" y="270" width="72" height="98" rx="10" fill="#eef5f5"/>
<circle cx="614" cy="306" r="16" fill="#1f6f3a"/>
<path d="M 606 306 l 5 6 10 -12" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="614" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#234a4a">MATCH</text>
<rect x="586" y="382" width="56" height="8" rx="4" fill="#3d6b6b"/>
<text x="600" y="460" text-anchor="middle" font-size="14.5" font-weight="600" fill="#291c0e">Both carriers, one pass</text>
<text x="600" y="486" text-anchor="middle" font-size="12.5" fill="#4f4f4f">barcode and RFID read together</text>
<text x="600" y="508" text-anchor="middle" font-size="12.5" fill="#4f4f4f">every scan logged automatically</text>

<!-- arrow B -> C -->
<line x1="776" y1="342" x2="798" y2="342" stroke="#c39a5f" stroke-width="3"/>
<path d="M 798 342 l -11 -6 v 12 z" fill="#c39a5f"/>

<!-- Card C: validated record -->
<rect x="804" y="150" width="340" height="384" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="804" y="150" width="340" height="52" rx="16" fill="#2c5454"/>
<rect x="804" y="176" width="340" height="26" fill="#2c5454"/>
<text x="974" y="184" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Validated electronic record</text>
<g font-size="14.5" font-weight="600" fill="#291c0e">
<circle cx="842" cy="248" r="11" fill="#1f6f3a"/><path d="M 837 248 l 4 5 7 -9" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="864" y="253">System validated (IQ/OQ/PQ)</text>
<circle cx="842" cy="300" r="11" fill="#1f6f3a"/><path d="M 837 300 l 4 5 7 -9" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="864" y="305">Audit trail — who, what, when</text>
<circle cx="842" cy="352" r="11" fill="#1f6f3a"/><path d="M 837 352 l 4 5 7 -9" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="864" y="357">Electronic signature</text>
<circle cx="842" cy="404" r="11" fill="#1f6f3a"/><path d="M 837 404 l 4 5 7 -9" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="864" y="409">10-year record retention</text>
</g>
<rect x="828" y="446" width="292" height="66" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<text x="974" y="474" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d5a3a">21 CFR PART 11</text>
<text x="974" y="496" text-anchor="middle" font-size="12.5" fill="#4f4f4f">audits cleanly, years later</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#5c5c5c">One printed barcode, one RFID overlay, one auditable electronic record — the compliant core of blood-bank tracking.</text>
</svg>
