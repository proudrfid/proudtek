<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">RFID coin tag diameter series — diameter is the antenna budget</title>
  <desc id="d">Four RFID coin discs drawn to scale on a shared baseline: 12, 20, 25 and 30 mm diameter, each with concentric antenna rings and a centre chip. Labels under each disc give its air-interface fit and mounting compatibility: the 12 mm disc is HF tap only and mounts by adhesive or recess embed; the 20 mm disc adds reduced-range UHF and an M3 screw bore; the 25 mm disc runs HF or UHF and adds an M4 screw and blind-rivet option; the 30 mm disc runs HF, UHF or dual-interface and accepts all five mounts. A reach ladder on the right compares read distances by configuration: HF tap 0-40 mm at any diameter, UHF on steel with the ferrite-spacer variant 0.3-1.5 m, UHF free space 0.5-2 m. A footer notes the shared envelope at every size: 2-4 mm thick, 0.8-3.5 g, IP67 / IP68 per IEC 60529, -25 to +85 degrees C.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID COIN TAG · DIAMETER SERIES</text>
  <text x="600" y="98" text-anchor="middle" font-size="34" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">Diameter is the antenna budget</text>
  <text x="600" y="128" text-anchor="middle" font-size="15" fill="#4f4f4f">Bigger disc, bigger aperture, longer UHF reach — and fewer places it fits.</text>

  <!-- ── discs to scale (5.5 px per mm), common baseline ─────────── -->
  <line x1="70" y1="400" x2="660" y2="400" stroke="#d8dee6" stroke-width="2"/>

  <!-- Ø 12 mm -->
  <circle cx="120" cy="367" r="33" fill="#eef5f5" stroke="#3d6b6b" stroke-width="3"/>
  <circle cx="120" cy="367" r="23" fill="none" stroke="#6fa0a0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="120" cy="367" r="14" fill="none" stroke="#6fa0a0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="115" y="362" width="10" height="10" fill="#4a5568"/>
  <text x="120" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Ø 12 mm</text>
  <text x="120" y="448" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2c5454">HF tap</text>
  <text x="120" y="466" text-anchor="middle" font-size="12.5" fill="#4f4f4f">adhesive · embed</text>

  <!-- Ø 20 mm -->
  <circle cx="230" cy="345" r="55" fill="#eef5f5" stroke="#3d6b6b" stroke-width="3"/>
  <circle cx="230" cy="345" r="43" fill="none" stroke="#6fa0a0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="230" cy="345" r="31" fill="none" stroke="#6fa0a0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="225" y="340" width="10" height="10" fill="#4a5568"/>
  <text x="230" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Ø 20 mm</text>
  <text x="230" y="448" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2c5454">HF · UHF short</text>
  <text x="230" y="466" text-anchor="middle" font-size="12.5" fill="#4f4f4f">+ M3 bore</text>

  <!-- Ø 25 mm -->
  <circle cx="390" cy="331.25" r="68.75" fill="#eef5f5" stroke="#3d6b6b" stroke-width="3"/>
  <circle cx="390" cy="331.25" r="55" fill="none" stroke="#6fa0a0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="390" cy="331.25" r="41" fill="none" stroke="#6fa0a0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="385" y="326.25" width="10" height="10" fill="#4a5568"/>
  <text x="390" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Ø 25 mm</text>
  <text x="390" y="448" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2c5454">HF · UHF</text>
  <text x="390" y="466" text-anchor="middle" font-size="12.5" fill="#4f4f4f">+ M4 · rivet</text>

  <!-- Ø 30 mm -->
  <circle cx="575" cy="317.5" r="82.5" fill="#eef5f5" stroke="#3d6b6b" stroke-width="3"/>
  <circle cx="575" cy="317.5" r="67" fill="none" stroke="#6fa0a0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="575" cy="317.5" r="51" fill="none" stroke="#6fa0a0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="570" y="312.5" width="10" height="10" fill="#4a5568"/>
  <text x="575" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Ø 30 mm</text>
  <text x="575" y="448" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2c5454">HF · UHF · dual</text>
  <text x="575" y="466" text-anchor="middle" font-size="12.5" fill="#4f4f4f">all five mounts</text>

  <!-- ── divider ────────────────────────────────────────────────── -->
  <line x1="690" y1="160" x2="690" y2="480" stroke="#e6dfd2" stroke-width="2"/>

  <!-- ── reach ladder ───────────────────────────────────────────── -->
  <text x="720" y="180" font-size="16" font-weight="700" fill="#291c0e">Reach by configuration</text>

  <text x="720" y="218" font-size="13" fill="#4f4f4f">HF tap — any diameter</text>
  <rect x="720" y="228" width="70" height="18" rx="4" fill="#c39a5f"/>
  <text x="800" y="242" font-size="12.5" font-weight="700" fill="#291c0e">0-40 mm</text>

  <text x="720" y="288" font-size="13" fill="#4f4f4f">UHF on steel — ferrite-spacer variant</text>
  <rect x="720" y="298" width="250" height="18" rx="4" fill="#4a5568"/>
  <text x="980" y="312" font-size="12.5" font-weight="700" fill="#291c0e">0.3-1.5 m</text>

  <text x="720" y="358" font-size="13" fill="#4f4f4f">UHF free space — full-size disc</text>
  <rect x="720" y="368" width="340" height="18" rx="4" fill="#3d6b6b"/>
  <text x="1070" y="382" font-size="12.5" font-weight="700" fill="#291c0e">0.5-2 m</text>

  <text x="720" y="424" font-size="12.5" fill="#5c5c5c">Bars not to a common scale: tap reads live in millimetres,</text>
  <text x="720" y="442" font-size="12.5" fill="#5c5c5c">portal reads in metres — pick the radio for the workflow.</text>

  <!-- ── shared envelope footer ─────────────────────────────────── -->
  <rect x="55" y="540" width="1089" height="58" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="600" y="575" text-anchor="middle" font-size="14" fill="#291c0e">Same rating at every size — 2-4 mm thick · 0.8-3.5 g · IP67 / IP68 (IEC 60529) · -25 °C to +85 °C service</text>
</svg>
