<!-- PHASE band -->
<rect x="64" y="512" width="1072" height="104" rx="16" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="104" y="552" font-size="15" font-weight="800" letter-spacing="0.5" fill="#a07d43">PHASE IT</text>
<circle cx="112" cy="580" r="4" fill="#4a5568"/>
<text x="128" y="585" font-size="14.5" fill="#291c0e">Year 1 — portals on every dock door and zone transition</text>
<circle cx="620" cy="580" r="4" fill="#2c5454"/>
<text x="636" y="585" font-size="14.5" fill="#291c0e">Year 2 — layer RTLS into 1-2 high-value zones</text>
