<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Anatomy of a print-ready RFID artwork file and the encoding fields an OEM spec must define</title>
<desc id="d">A two-panel reference. The left panel shows an artwork card with three nested boundaries — a 3 mm bleed, the trim edge, and a 3 mm safe zone — and lists the prepress rules: vector AI, EPS, SVG or PDF/X-1a with fonts converted to outlines, CMYK color mode rather than RGB or hex, Pantone Solid Coated spot colors, and raster art at 600 dpi or higher. The right panel lists the encoding and lock-state fields that must be defined: EPC bank format as SGTIN-96, SGTIN-198 or TID-mode, USER memory content, kill and access passwords or a documented null, AFI and DSFID for HF, and lock state per memory bank. A red note warns that ambiguity here causes 100 percent of retail-mandate rejection failures.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PRINT-READY ARTWORK + LOCKED ENCODING</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">The two root causes of OEM rework — files that aren't press-ready, and memory nobody defined.</text>

<!-- LEFT: artwork anatomy -->
<text x="92" y="120" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8a7a55">PRINT-READY ARTWORK</text>
<!-- bleed (outer dashed) -->
<rect x="118" y="140" width="360" height="196" rx="8" fill="none" stroke="#c39a5f" stroke-width="1.8" stroke-dasharray="6 5"/>
<!-- trim (solid) -->
<rect x="134" y="156" width="328" height="164" rx="6" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.2"/>
<!-- safe zone (inner dashed) -->
<rect x="152" y="174" width="292" height="128" rx="5" fill="none" stroke="#8a9a9a" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="220" cy="238" r="18" fill="#f7edd6" stroke="#c39a5f" stroke-width="2.2"/>
<text x="220" y="243" text-anchor="middle" font-size="15" font-weight="800" fill="#a07d43">L</text>
<text x="256" y="234" font-size="13.5" font-weight="800" fill="#291c0e">YOUR ARTWORK</text>
<text x="256" y="253" font-size="12" fill="#3d6b6b">CMYK · fonts outlined</text>
<text x="126" y="133" font-size="12" font-weight="700" fill="#a07d43">3 mm bleed</text>
<text x="298" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#6f7d7d">3 mm safe zone</text>

<!-- prepress legend -->
<text x="92" y="374" font-size="12.5" font-weight="800" letter-spacing="0.4" fill="#8a7a55">SUPPLY EVERY FILE AS</text>
<circle cx="100" cy="398" r="6" fill="#3d6b6b"/><text x="118" y="403" font-size="13.5" fill="#3a3a3a">Vector AI / EPS / SVG / PDF-X-1a · fonts → outlines</text>
<circle cx="100" cy="426" r="6" fill="#3d6b6b"/><text x="118" y="431" font-size="13.5" fill="#3a3a3a">CMYK color mode — not RGB / hex</text>
<circle cx="100" cy="454" r="6" fill="#3d6b6b"/><text x="118" y="459" font-size="13.5" fill="#3a3a3a">Pantone Solid Coated for spot colors</text>
<circle cx="100" cy="482" r="6" fill="#3d6b6b"/><text x="118" y="487" font-size="13.5" fill="#3a3a3a">Raster ≥ 600 dpi at print size</text>

<!-- RIGHT: encoding & lock state -->
<rect x="600" y="132" width="536" height="404" rx="14" fill="#faf6ec" stroke="#e4d8bf" stroke-width="1.8"/>
<text x="628" y="168" font-size="15.5" font-weight="800" fill="#6d5a3a">ENCODING &amp; LOCK STATE — DEFINE ALL OF IT</text>
<line x1="628" y1="182" x2="1108" y2="182" stroke="#ecdfc3" stroke-width="1.5"/>

<rect x="628" y="200" width="10" height="10" rx="2" fill="#3d6b6b"/>
<text x="650" y="209" font-size="14.5" font-weight="800" fill="#291c0e">EPC bank format</text>
<text x="650" y="229" font-size="12.5" fill="#5c5c5c">SGTIN-96 · SGTIN-198 · TID-mode</text>

<rect x="628" y="256" width="10" height="10" rx="2" fill="#3d6b6b"/>
<text x="650" y="265" font-size="14.5" font-weight="800" fill="#291c0e">USER memory content</text>
<text x="650" y="285" font-size="12.5" fill="#5c5c5c">define the bytes, or state none</text>

<rect x="628" y="312" width="10" height="10" rx="2" fill="#3d6b6b"/>
<text x="650" y="321" font-size="14.5" font-weight="800" fill="#291c0e">Kill + access passwords</text>
<text x="650" y="341" font-size="12.5" fill="#5c5c5c">set values, or null with documented rationale</text>

<rect x="628" y="368" width="10" height="10" rx="2" fill="#3d6b6b"/>
<text x="650" y="377" font-size="14.5" font-weight="800" fill="#291c0e">AFI / DSFID · lock state per bank</text>
<text x="650" y="397" font-size="12.5" fill="#5c5c5c">AFI/DSFID for HF; which banks are locked</text>

<rect x="628" y="440" width="480" height="72" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.5"/>
<text x="648" y="470" font-size="14" font-weight="800" fill="#8b2d2d">Ambiguity here is expensive</text>
<text x="648" y="492" font-size="12.5" fill="#7a5555">It causes 100% of retail-mandate rejection failures.</text>

<text x="600" y="588" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Get both panels into the spec sheet and the purchase order — not a follow-up email nobody signs.</text>
</svg>
