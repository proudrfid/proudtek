<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="bmt bmd" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="bmt">What the brand benchmarked before it committed</title>
  <desc id="bmd">Three industry reference points the brand checked before signing the inlay purchase order. One, inventory accuracy: about 60 percent without RFID rising to about 99 percent with item-level UHF, per Auburn RFID Lab. Two, disposable tag price: 20 to 50 cents in 2015 falling to 3 to 15 cents in 2026, with the brand's 7-cent quote in the upper-mid band. Three, payback period: a typical 12 to 18 month supplier cohort versus this brand's roughly 3 months, driven by chargeback avoidance. Also weighed: more than 93 percent of North American retailers now run RFID, and 1 to 3 points of dock-to-RDC handling loss.</desc>
  <defs><radialGradient id="bmbg" cx="50%" cy="20%" r="92%"><stop offset="0%" stop-color="#f8f0df"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#bmbg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="24" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="1.4" fill="#6d5a3a">BENCHMARK FIRST, COMMIT SECOND</text>
  <text x="600" y="86" font-size="16.5" font-weight="400" fill="#4f4f4f" text-anchor="middle">The 3-week homework that let the CFO release capex without flinching.</text>
  <rect x="56" y="110" width="1088" height="118" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-opacity="0.32" stroke-width="2"/>
  <circle cx="112" cy="169" r="30" fill="#3d6b6b"/>
  <text x="112" y="178" font-size="27" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="168" y="163" font-size="24" font-weight="800" fill="#291c0e">Inventory accuracy</text>
  <text x="168" y="191" font-size="16" font-weight="400" fill="#4f4f4f">item-level UHF vs none</text>
  <text x="572" y="165" font-size="24" font-weight="800" fill="#4f4f4f" text-anchor="middle">≈60%</text>
  <text x="572" y="191" font-size="14" font-weight="400" fill="#5c5c5c" text-anchor="middle">no RFID</text>
  <line x1="662" y1="163" x2="712" y2="163" stroke="#3d6b6b" stroke-width="3"/>
  <path d="M 712 163 l -11 -6 l 0 12 z" fill="#3d6b6b"/>
  <text x="802" y="165" font-size="24" font-weight="800" fill="#3d6b6b" text-anchor="middle">≈99%</text>
  <text x="802" y="191" font-size="14" font-weight="400" fill="#5c5c5c" text-anchor="middle">item-level UHF</text>
  <rect x="943" y="147" width="178" height="44" rx="22" fill="#e8f1f1" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="1032" y="175" text-anchor="middle" font-size="16.5" font-weight="700" fill="#3d6b6b">Auburn RFID Lab</text>
  <rect x="56" y="250" width="1088" height="118" rx="16" fill="#fdf8ef" stroke="#c39a5f" stroke-opacity="0.32" stroke-width="2"/>
  <circle cx="112" cy="309" r="30" fill="#c39a5f"/>
  <text x="112" y="318" font-size="27" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="168" y="303" font-size="24" font-weight="800" fill="#291c0e">Disposable tag price</text>
  <text x="168" y="331" font-size="16" font-weight="400" fill="#4f4f4f">market collapse, 2015→2026</text>
  <text x="572" y="305" font-size="24" font-weight="800" fill="#4f4f4f" text-anchor="middle">$0.20–0.50</text>
  <text x="572" y="331" font-size="14" font-weight="400" fill="#5c5c5c" text-anchor="middle">2015</text>
  <line x1="662" y1="303" x2="712" y2="303" stroke="#c39a5f" stroke-width="3"/>
  <path d="M 712 303 l -11 -6 l 0 12 z" fill="#c39a5f"/>
  <text x="802" y="305" font-size="24" font-weight="800" fill="#c39a5f" text-anchor="middle">$0.03–0.15</text>
  <text x="802" y="331" font-size="14" font-weight="400" fill="#5c5c5c" text-anchor="middle">2026</text>
  <rect x="943" y="287" width="178" height="44" rx="22" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="1032" y="315" text-anchor="middle" font-size="16.5" font-weight="700" fill="#c39a5f">brand paid $0.07</text>
  <rect x="56" y="390" width="1088" height="118" rx="16" fill="#eef5f0" stroke="#1f6f3a" stroke-opacity="0.32" stroke-width="2"/>
  <circle cx="112" cy="449" r="30" fill="#1f6f3a"/>
  <text x="112" y="458" font-size="27" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="168" y="443" font-size="24" font-weight="800" fill="#291c0e">Payback period</text>
  <text x="168" y="471" font-size="16" font-weight="400" fill="#4f4f4f">cohort vs this brand</text>
  <text x="572" y="445" font-size="24" font-weight="800" fill="#4f4f4f" text-anchor="middle">12–18 mo</text>
  <text x="572" y="471" font-size="14" font-weight="400" fill="#5c5c5c" text-anchor="middle">typical cohort</text>
  <line x1="662" y1="443" x2="712" y2="443" stroke="#1f6f3a" stroke-width="3"/>
  <path d="M 712 443 l -11 -6 l 0 12 z" fill="#1f6f3a"/>
  <text x="802" y="445" font-size="24" font-weight="800" fill="#1f6f3a" text-anchor="middle">≈3 mo</text>
  <text x="802" y="471" font-size="14" font-weight="400" fill="#5c5c5c" text-anchor="middle">this brand</text>
  <rect x="943" y="427" width="178" height="44" rx="22" fill="#e7f1eb" stroke="#1f6f3a" stroke-width="1.5"/>
  <text x="1032" y="455" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1f6f3a">chargeback-driven</text>
  <rect x="56" y="524" width="1088" height="54" rx="14" fill="#faf4e8" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="600" y="557" font-size="15" font-weight="600" fill="#6d5a3a" text-anchor="middle">Also weighed: 93%+ of North American retailers run RFID (Accenture)  ·  plan for 1–3 pts of dock-to-RDC handling loss.</text>
</svg>
