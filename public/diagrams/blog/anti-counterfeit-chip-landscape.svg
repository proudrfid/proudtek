<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="clTitle clDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="clTitle">Anti-counterfeit chip landscape — use cryptographic, avoid static</title>
  <desc id="clDesc">Four chips to use because they authenticate cryptographically: NTAG 424 DNA from NXP with AES-128 SUN/CMAC at 0.30 to 1.00 dollars per chip; MIFARE DESFire EV3 with AES-128 mutual authentication at 1.00 to 3.00 dollars; EM Microelectronic em|echo, an ultra-low-cost UHF chip-DNA tag at 0.10 to 0.25 dollars; and ICODE DNA, an NXP HF chip on ISO 15693 for higher-volume FMCG. Two to avoid because they are static or weak: plain NTAG 213, 215 and 216 with only a 32-bit password, and generic tap-to-verify chips holding a clonable static UID.</desc>
  <defs>
    <radialGradient id="clBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#clBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2.5" fill="#6d5a3a">PICK CRYPTOGRAPHIC, NOT STATIC</text>
  <text x="600" y="86" text-anchor="middle" font-size="15.5" fill="#4f4f4f">The right anti-counterfeit chip depends on unit value, supply-chain complexity and existing investment.</text>

  <!-- USE group -->
  <text x="72" y="118" font-size="16" font-weight="800" letter-spacing="1.2" fill="#1f6f3a">✓ USE — CRYPTOGRAPHIC AUTHENTICATION</text>

  <!-- row 1 -->
  <rect x="56" y="128" width="1088" height="62" rx="12" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2.5"/>
  <circle cx="98" cy="159" r="20" fill="#1f6f3a"/><path d="M88 159 l7 8 l14 -16" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="136" y="153" font-size="21" font-weight="800" fill="#291c0e">NTAG 424 DNA <tspan font-size="15" font-weight="600" fill="#4f4f4f">(NXP)</tspan></text>
  <text x="136" y="176" font-size="14.5" fill="#3f6b4e">AES-128 SUN/CMAC · new signature every tap · industry standard</text>
  <rect x="946" y="139" width="180" height="40" rx="20" fill="#ffffff" stroke="#1f6f3a" stroke-width="1.5"/><text x="1036" y="164" text-anchor="middle" font-size="17" font-weight="700" fill="#1f6f3a">$0.30–1.00</text>

  <!-- row 2 -->
  <rect x="56" y="198" width="1088" height="62" rx="12" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2.5"/>
  <circle cx="98" cy="229" r="20" fill="#1f6f3a"/><path d="M88 229 l7 8 l14 -16" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="136" y="223" font-size="21" font-weight="800" fill="#291c0e">MIFARE DESFire EV3 <tspan font-size="15" font-weight="600" fill="#4f4f4f">(NXP)</tspan></text>
  <text x="136" y="246" font-size="14.5" fill="#3f6b4e">AES-128 mutual auth · multi-application memory · for higher-value items</text>
  <rect x="946" y="209" width="180" height="40" rx="20" fill="#ffffff" stroke="#1f6f3a" stroke-width="1.5"/><text x="1036" y="234" text-anchor="middle" font-size="17" font-weight="700" fill="#1f6f3a">$1.00–3.00</text>

  <!-- row 3 -->
  <rect x="56" y="268" width="1088" height="62" rx="12" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2.5"/>
  <circle cx="98" cy="299" r="20" fill="#1f6f3a"/><path d="M88 299 l7 8 l14 -16" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="136" y="293" font-size="21" font-weight="800" fill="#291c0e">EM Microelectronic em|echo</text>
  <text x="136" y="316" font-size="14.5" fill="#3f6b4e">ultra-low-cost UHF · chip-DNA fingerprint for item-level identification</text>
  <rect x="946" y="279" width="180" height="40" rx="20" fill="#ffffff" stroke="#1f6f3a" stroke-width="1.5"/><text x="1036" y="304" text-anchor="middle" font-size="17" font-weight="700" fill="#1f6f3a">$0.10–0.25</text>

  <!-- row 4 -->
  <rect x="56" y="338" width="1088" height="62" rx="12" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2.5"/>
  <circle cx="98" cy="369" r="20" fill="#1f6f3a"/><path d="M88 369 l7 8 l14 -16" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="136" y="363" font-size="21" font-weight="800" fill="#291c0e">ICODE DNA <tspan font-size="15" font-weight="600" fill="#4f4f4f">(NXP HF, ISO 15693)</tspan></text>
  <text x="136" y="386" font-size="14.5" fill="#3f6b4e">higher-volume FMCG · longer read range · limited smartphone support</text>
  <rect x="946" y="349" width="180" height="40" rx="20" fill="#ffffff" stroke="#1f6f3a" stroke-width="1.5"/><text x="1036" y="374" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f6f3a">ISO 15693 HF</text>

  <!-- AVOID group -->
  <text x="72" y="432" font-size="16" font-weight="800" letter-spacing="1.2" fill="#8b2d2d">✗ AVOID — STATIC OR WEAK</text>

  <!-- row 5 -->
  <rect x="56" y="442" width="1088" height="62" rx="12" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2.5"/>
  <circle cx="98" cy="473" r="20" fill="#8b2d2d"/><path d="M90 465 l16 16 M106 465 l-16 16" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <text x="136" y="467" font-size="21" font-weight="800" fill="#291c0e">Plain NTAG 213 / 215 / 216</text>
  <text x="136" y="490" font-size="14.5" fill="#7a4242">only a 32-bit password — brute-forceable in seconds. Fine for marketing, not proof.</text>
  <rect x="946" y="453" width="180" height="40" rx="20" fill="#ffffff" stroke="#8b2d2d" stroke-width="1.5"/><text x="1036" y="478" text-anchor="middle" font-size="15" font-weight="700" fill="#8b2d2d">marketing only</text>

  <!-- row 6 -->
  <rect x="56" y="512" width="1088" height="62" rx="12" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2.5"/>
  <circle cx="98" cy="543" r="20" fill="#8b2d2d"/><path d="M90 535 l16 16 M106 535 l-16 16" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <text x="136" y="537" font-size="21" font-weight="800" fill="#291c0e">Generic “tap-to-verify” chips</text>
  <text x="136" y="560" font-size="14.5" fill="#7a4242">static UID with no rotating signature — clonable by any NFC writer.</text>
  <rect x="946" y="523" width="180" height="40" rx="20" fill="#ffffff" stroke="#8b2d2d" stroke-width="1.5"/><text x="1036" y="548" text-anchor="middle" font-size="15" font-weight="700" fill="#8b2d2d">no crypto</text>

  <text x="600" y="608" text-anchor="middle" font-size="14.5" font-style="italic" fill="#6d5a3a">A static UID is a photocopy anyone can make. A cryptographic signature is fresh on every single tap.</text>
</svg>
