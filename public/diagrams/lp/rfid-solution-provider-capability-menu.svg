<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Proud Tek RFID capability menu: one application resolved into four product families and one encoded shipment</title>
  <desc id="d">A left-to-right map. On the left, a card labelled YOUR APPLICATION (read range, volume, environment, budget). In the centre, four product-family lanes: RFID cards and fobs (MIFARE DESFire, NTAG 215, T5577, EM4200 at 125 kHz LF and 13.56 MHz HF); UHF inlays and labels (Impinj M730, NXP UCODE 9, Monza R6 at 860-960 MHz UHF); NFC tags and stickers (NTAG 213, NTAG 424 DNA, ICODE SLIX2 at 13.56 MHz HF); and event wristbands (MIFARE Ultralight, NTAG 213, UCODE 9 at 13.56 MHz and UHF). All four converge on the right into ONE SHIPMENT: encoded to spec, 100% read-verified, full document pack, straight to your dock.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PROUD TEK CAPABILITY MENU</text>
  <text x="600" y="99" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">One requirement, four families, one shipment</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">Every family runs to a published air-interface standard — not a reader-locked inlay.</text>

  <!-- connectors: application to lanes -->
  <path d="M258,393 L300,204" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,393 L300,330" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,393 L300,456" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,393 L300,582" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <!-- connectors: lanes to shipment -->
  <path d="M900,204 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,330 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,456 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,582 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>

  <!-- application card -->
  <rect x="48" y="318" width="210" height="150" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="153" y="360" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">YOUR</text>
  <text x="153" y="383" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">APPLICATION</text>
  <text x="153" y="416" text-anchor="middle" font-size="13" fill="#5c5c5c">read range, volume,</text>
  <text x="153" y="436" text-anchor="middle" font-size="13" fill="#5c5c5c">environment, budget</text>

  <!-- lane 1: cards and fobs -->
  <rect x="300" y="150" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="150" width="7" height="108" rx="3" fill="#c39a5f"/>
  <text x="324" y="182" font-size="18" font-weight="700" fill="#291c0e">RFID cards &amp; fobs</text>
  <text x="324" y="210" font-size="14" fill="#5c5c5c">MIFARE DESFire · NTAG 215 · T5577 · EM4200</text>
  <text x="324" y="238" font-size="14" font-weight="700" fill="#2c5454">125 kHz LF · 13.56 MHz HF</text>

  <!-- lane 2: UHF inlays and labels -->
  <rect x="300" y="276" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="276" width="7" height="108" rx="3" fill="#4a5568"/>
  <text x="324" y="308" font-size="18" font-weight="700" fill="#291c0e">UHF inlays &amp; labels</text>
  <text x="324" y="336" font-size="14" fill="#5c5c5c">Impinj M730 · NXP UCODE 9 · Monza R6</text>
  <text x="324" y="364" font-size="14" font-weight="700" fill="#2c5454">860-960 MHz UHF (EPC Gen2v2)</text>

  <!-- lane 3: NFC tags and stickers -->
  <rect x="300" y="402" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="402" width="7" height="108" rx="3" fill="#3d6b6b"/>
  <text x="324" y="434" font-size="18" font-weight="700" fill="#291c0e">NFC tags &amp; stickers</text>
  <text x="324" y="462" font-size="14" fill="#5c5c5c">NTAG 213 · NTAG 424 DNA · ICODE SLIX2</text>
  <text x="324" y="490" font-size="14" font-weight="700" fill="#2c5454">13.56 MHz HF (NFC Forum)</text>

  <!-- lane 4: event wristbands -->
  <rect x="300" y="528" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="528" width="7" height="108" rx="3" fill="#6d5a3a"/>
  <text x="324" y="560" font-size="18" font-weight="700" fill="#291c0e">Event &amp; access wristbands</text>
  <text x="324" y="588" font-size="14" fill="#5c5c5c">MIFARE Ultralight · NTAG 213 · UCODE 9</text>
  <text x="324" y="616" font-size="14" font-weight="700" fill="#2c5454">13.56 MHz &amp; UHF</text>

  <!-- shipment card -->
  <rect x="946" y="306" width="214" height="174" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="1053" y="344" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">ONE SHIPMENT</text>
  <text x="1053" y="378" text-anchor="middle" font-size="14" fill="#291c0e">Encoded to spec</text>
  <text x="1053" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">100% read-verified</text>
  <text x="1053" y="430" text-anchor="middle" font-size="14" fill="#291c0e">Full document pack</text>
  <text x="1053" y="458" text-anchor="middle" font-size="13" fill="#5c5c5c">Straight to your dock</text>
</svg>
