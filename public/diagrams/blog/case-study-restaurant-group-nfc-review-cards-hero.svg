<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="hTitle hDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="hTitle">NFC tap-to-review cards lifted a restaurant group's Google reviews 320%</title>
  <desc id="hDesc">A three-stage flow. Stage one, the ask: a server-apron card and a host-stand easel, each carrying a tap-to-review prompt. Stage two, the tap: a guest's phone taps the NTAG 215 card and lands straight on Google's review form. Stage three, the review: a five-star Google review posts in one tap. A footer strip carries the three headline results across six locations in ninety days — weekly review volume up 320%, average star rating from 4.2 to 4.6, and cost per review falling from $4.20 on the old email program to $0.18 on the tap card.</desc>
  <defs>
    <radialGradient id="hBg" cx="50%" cy="22%" r="88%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="hDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#291c0e"/>
      <stop offset="100%" stop-color="#6c5127"/>
    </linearGradient>
    <marker id="hArrow" markerWidth="10" markerHeight="10" refX="2.5" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#c39a5f"/>
    </marker>
    <path id="hStar" d="M0,-10 L2.94,-4.05 L9.51,-3.09 L4.76,1.55 L5.88,8.09 L0,5 L-5.88,8.09 L-4.76,1.55 L-9.51,-3.09 L-2.94,-4.05 Z"/>
  </defs>

  <rect width="1200" height="675" fill="url(#hBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <!-- Eyebrow + tagline -->
  <text x="600" y="62" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="3" fill="#6d5a3a">CASE STUDY · NFC TAP-TO-REVIEW CARDS</text>
  <text x="600" y="92" text-anchor="middle" font-size="16.5" fill="#4f4f4f">How a six-location group turned tableside goodwill into Google reviews — one tap at a time</text>

  <!-- ===== Stage 1: the ask ===== -->
  <g>
    <rect x="58" y="132" width="288" height="300" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="202" y="164" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1.5" fill="#6d5a3a">THE ASK</text>
    <!-- apron card -->
    <g transform="translate(94,196)">
      <rect x="0" y="0" width="116" height="150" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
      <path d="M40 28 a16 16 0 0 1 0 30 M40 20 a24 24 0 0 1 0 46 M40 12 a32 32 0 0 1 0 62" fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round"/>
      <text x="58" y="104" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#291c0e">TAP TO REVIEW</text>
      <use href="#hStar" transform="translate(24,126) scale(0.7)" fill="#c39a5f"/>
      <use href="#hStar" transform="translate(41,126) scale(0.7)" fill="#c39a5f"/>
      <use href="#hStar" transform="translate(58,126) scale(0.7)" fill="#c39a5f"/>
      <use href="#hStar" transform="translate(75,126) scale(0.7)" fill="#c39a5f"/>
      <use href="#hStar" transform="translate(92,126) scale(0.7)" fill="#c39a5f"/>
      <rect x="46" y="-10" width="24" height="12" rx="4" fill="#6c5127"/>
    </g>
    <!-- host easel -->
    <g transform="translate(228,206)">
      <rect x="0" y="0" width="86" height="112" rx="9" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
      <path d="M30 24 a12 12 0 0 1 0 22 M30 18 a18 18 0 0 1 0 34" fill="none" stroke="#1fcefb" stroke-width="2.6" stroke-linecap="round"/>
      <rect x="18" y="66" width="50" height="8" rx="4" fill="#efe0bf"/>
      <path d="M43 112 l-20 26 h40 z" fill="#e4c98f"/>
    </g>
    <text x="202" y="366" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Apron card + host easel</text>
    <text x="202" y="390" text-anchor="middle" font-size="13" fill="#6d5a3a">worn during service · at every</text>
    <text x="202" y="408" text-anchor="middle" font-size="13" fill="#6d5a3a">host stand, all six locations</text>
  </g>

  <line x1="352" y1="282" x2="404" y2="282" stroke="#c39a5f" stroke-width="3" marker-end="url(#hArrow)"/>

  <!-- ===== Stage 2: the tap ===== -->
  <g>
    <rect x="418" y="132" width="288" height="300" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <text x="562" y="164" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1.5" fill="#6d5a3a">THE TAP</text>
    <!-- phone -->
    <g transform="translate(512,192)">
      <rect x="0" y="0" width="100" height="182" rx="16" fill="#291c0e"/>
      <rect x="7" y="20" width="86" height="150" rx="6" fill="#ffffff"/>
      <rect x="40" y="8" width="20" height="5" rx="2.5" fill="#6c5127"/>
      <use href="#hStar" transform="translate(50,58) scale(1.7)" fill="#c39a5f"/>
      <text x="50" y="96" text-anchor="middle" font-size="11.5" font-weight="700" fill="#291c0e">Rate us</text>
      <g fill="#e4c98f">
        <use href="#hStar" transform="translate(24,120) scale(0.72)"/>
        <use href="#hStar" transform="translate(41,120) scale(0.72)"/>
        <use href="#hStar" transform="translate(58,120) scale(0.72)"/>
        <use href="#hStar" transform="translate(75,120) scale(0.72)"/>
        <use href="#hStar" transform="translate(92,120) scale(0.72)"/>
      </g>
      <rect x="20" y="140" width="60" height="16" rx="8" fill="#1fcefb"/>
    </g>
    <!-- tap waves -->
    <path d="M474 250 a20 20 0 0 0 0 -40 M462 258 a30 30 0 0 0 0 -56 M450 266 a40 40 0 0 0 0 -72" fill="none" stroke="#1fcefb" stroke-width="3.4" stroke-linecap="round"/>
    <text x="562" y="404" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">One tap → Google's form</text>
  </g>

  <line x1="712" y1="282" x2="764" y2="282" stroke="#c39a5f" stroke-width="3" marker-end="url(#hArrow)"/>

  <!-- ===== Stage 3: the review ===== -->
  <g>
    <rect x="778" y="132" width="364" height="300" rx="16" fill="#eaf9fe" stroke="#1fcefb" stroke-width="2.5"/>
    <text x="960" y="164" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1.5" fill="#177a92">THE REVIEW</text>
    <g fill="#d4a755">
      <use href="#hStar" transform="translate(842,214) scale(2.1)"/>
      <use href="#hStar" transform="translate(892,214) scale(2.1)"/>
      <use href="#hStar" transform="translate(942,214) scale(2.1)"/>
      <use href="#hStar" transform="translate(992,214) scale(2.1)"/>
      <use href="#hStar" transform="translate(1042,214) scale(2.1)"/>
    </g>
    <rect x="826" y="258" width="268" height="12" rx="6" fill="#cfeefb"/>
    <rect x="826" y="284" width="230" height="12" rx="6" fill="#cfeefb"/>
    <rect x="826" y="310" width="180" height="12" rx="6" fill="#cfeefb"/>
    <text x="960" y="372" text-anchor="middle" font-size="16" font-weight="800" fill="#0d3f4d">Posted publicly to Google</text>
    <text x="960" y="398" text-anchor="middle" font-size="13.5" fill="#177a92">every guest, every intent — no gating</text>
  </g>

  <!-- ===== Footer stat strip ===== -->
  <rect x="58" y="470" width="1084" height="156" rx="18" fill="url(#hDark)"/>
  <g text-anchor="middle">
    <text x="240" y="536" font-size="46" font-weight="800" fill="#ffffff">+320%</text>
    <text x="240" y="568" font-size="14.5" fill="#e7d8b8">weekly review volume</text>
    <text x="240" y="590" font-size="13" fill="#c9b58a">6 locations · 90 days</text>

    <text x="600" y="536" font-size="46" font-weight="800" fill="#ffffff">4.2 <tspan fill="#8fdcf3">→</tspan> 4.6</text>
    <text x="600" y="568" font-size="14.5" fill="#e7d8b8">average Google star rating ★</text>
    <text x="600" y="590" font-size="13" fill="#c9b58a">870 → 3,640 total reviews</text>

    <text x="960" y="536" font-size="46" font-weight="800" fill="#ffffff">$0.18</text>
    <text x="960" y="568" font-size="14.5" fill="#e7d8b8">cost per review, fully loaded</text>
    <text x="960" y="590" font-size="13" fill="#c9b58a">down from $4.20 on email</text>

    <line x1="420" y1="500" x2="420" y2="596" stroke="#8a6f3e" stroke-width="1.5"/>
    <line x1="780" y1="500" x2="780" y2="596" stroke="#8a6f3e" stroke-width="1.5"/>
  </g>
</svg>
