<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Gate sizing benchmarks: read rate, per-lane throughput, and lanes for a 25,000-person festival</title>
<desc id="d">Design targets for event gates. A read-rate banner sets the target above 99.7 percent reliability at peak ingress; below 99 percent, visible tap-twice delays begin, and below 95 percent the gate experience falls apart. Per-lane throughput compares an HF tap lane at 15 to 20 attendees per minute against a UHF walk-through portal at 30 to 50 per minute, which needs zone-tuning to avoid over-reads. A sizing band works a worked example: a 25,000-attendee festival arriving in a 90-minute window is about 280 taps per minute, needing 14 to 18 HF tap lanes or 6 to 10 UHF portals.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SIZING BENCHMARKS · READ RATE AND LANES</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Two numbers decide the gate: how fast each lane clears, and how reliably it reads.</text>

<!-- read-rate banner -->
<rect x="64" y="110" width="1072" height="80" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="104" y="165" font-size="42" font-weight="800" fill="#234a4a">&gt;99.7%</text>
<text x="300" y="150" font-size="18" font-weight="800" fill="#291c0e">read reliability at peak ingress</text>
<text x="300" y="176" font-size="14" fill="#5c5c5c">below 99% → visible tap-twice delays begin</text>
<rect x="852" y="126" width="252" height="48" rx="12" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.6"/>
<text x="978" y="155" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">below 95% → gate falls apart</text>

<!-- per-lane throughput -->
<text x="64" y="230" font-size="13" font-weight="800" letter-spacing="1" fill="#6d5a3a">PER-LANE THROUGHPUT</text>
<text x="104" y="271" font-size="16" font-weight="800" fill="#291c0e">HF tap lane</text>
<rect x="300" y="252" width="600" height="30" rx="8" fill="#efe9dd" stroke="#e0d8c6" stroke-width="1"/>
<rect x="300" y="252" width="180" height="30" rx="8" fill="#cfe0e0"/>
<rect x="480" y="252" width="60" height="30" fill="#3d6b6b"/>
<text x="558" y="273" font-size="15" font-weight="800" fill="#2c5454">15–20 / min</text>
<text x="104" y="322" font-size="16" font-weight="800" fill="#291c0e">UHF portal</text>
<rect x="300" y="303" width="600" height="30" rx="8" fill="#efe9dd" stroke="#e0d8c6" stroke-width="1"/>
<rect x="300" y="303" width="360" height="30" rx="8" fill="#ecdcbf"/>
<rect x="660" y="303" width="240" height="30" fill="#c39a5f"/>
<text x="912" y="324" font-size="15" font-weight="800" fill="#6d5a3a">30–50 / min</text>
<text x="300" y="354" font-size="12.5" fill="#5c5c5c">UHF needs zone-tuning to avoid over-reads</text>
<text x="300" y="376" font-size="12.5" fill="#8a8172">0</text>
<text x="600" y="376" text-anchor="middle" font-size="12.5" fill="#8a8172">25</text>
<text x="900" y="376" text-anchor="middle" font-size="12.5" fill="#8a8172">50 attendees / min</text>

<!-- sizing band -->
<rect x="64" y="406" width="1072" height="150" rx="16" fill="url(#dark)"/>
<text x="100" y="448" font-size="16" font-weight="800" letter-spacing="1" fill="#d4a755">SIZE FOR PEAK, NOT AVERAGE</text>
<text x="100" y="484" font-size="19" fill="#f4efe4">25,000 attendees · 90-minute arrival window ≈ 280 taps / minute</text>
<rect x="100" y="504" width="248" height="44" rx="12" fill="#eef5f5"/>
<text x="224" y="532" text-anchor="middle" font-size="16" font-weight="800" fill="#234a4a">14–18 HF tap lanes</text>
<text x="368" y="532" text-anchor="middle" font-size="15" font-weight="700" fill="#f4efe4">or</text>
<rect x="392" y="504" width="240" height="44" rx="12" fill="#f7edd6"/>
<text x="512" y="532" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">6–10 UHF portals</text>

<text x="600" y="592" text-anchor="middle" font-size="15" fill="#5c5c5c">Copy the read-rate target from the majors; size the lanes from your own arrival curve.</text>
</svg>
