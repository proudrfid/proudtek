<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="depTitle depDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="depTitle">Deployment across 16 surgical spaces with 16 door portals</title>
  <desc id="depDesc">A map of 16 surgical spaces — 14 operating rooms and 2 trauma bays — each fitted with a door-exit RFID portal, 16 in total. An end-of-case handheld wand sweep adds about 90 seconds per case. The program rolled out in 9 months, trained 100% of OR nurses and surgical techs over 6 weeks, cost $410K all-in capex, and adds $8.40 per case in tagged sponges.</desc>
  <defs>
    <radialGradient id="depBg" cx="50%" cy="18%" r="95%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#depBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">16 SURGICAL SPACES · 16 DOOR PORTALS · ONE 90-SECOND SWEEP</text>

  <text x="70" y="126" font-size="15" font-weight="800" letter-spacing="1.1" fill="#6d5a3a">THE FLOOR</text>
  <text x="740" y="126" font-size="15" font-weight="800" letter-spacing="1.1" fill="#6d5a3a">DEPLOYMENT AT A GLANCE</text>

