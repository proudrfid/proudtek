<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID pallet runner tag — mounting positions on plastic and wood pallets</title>
<desc id="d">Two panels. Left, a molded plastic pallet in side view: the tag module, 35 by 15 by 4 millimetres, sits in a sealed cavity inside the middle runner foot, placed there by one of two routes — Route A insert-molded at the injection molding machine, Route B press-fit into a machined cavity and ultrasonically welded shut as the retrofit path. The module occupies a non-load-bearing zone, so ISO 8611 static, dynamic and racking ratings are unchanged, and it reads 1 to 3 metres through HDPE, polypropylene or composite runner material while surviving 80 degree caustic wash and 1,000 kilogram stacking. Right, a wood stringer pallet in side view: a UHF transponder on a steel nail shaft is driven 15 to 50 millimetres into the stringer end-grain, reads 2 to 3 metres at a dock portal, installs in under 2 seconds with a standard hammer and is rated 100 to 150 trip cycles. A red dashed zone on the stringer face marks where surface-mounted labels ride the forklift strike zone and are destroyed within 10 to 30 trip cycles. Footer: match the attachment to the pallet construction — the dock portal reads both the same way.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RUNNER-EMBEDDED PALLET TAG — MOUNTING MAP</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Molded pocket or hammered nail — the pallet decides</text>

<!-- ── LEFT PANEL: plastic pallet ── -->
<rect x="52" y="130" width="536" height="452" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="320" y="164" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">PLASTIC PALLET — MOLDED POCKET</text>

<!-- plastic pallet side view -->
<rect x="100" y="196" width="400" height="24" rx="4" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<rect x="100" y="220" width="62" height="52" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<rect x="269" y="220" width="62" height="52" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<rect x="438" y="220" width="62" height="52" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<rect x="100" y="272" width="400" height="16" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<!-- cavity + module in middle foot -->
<rect x="279" y="246" width="42" height="21" rx="3" fill="none" stroke="#6d5a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="284" y="251" width="32" height="11" rx="2" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>
<rect x="296" y="253" width="7" height="7" rx="1" fill="#291c0e"/>
<!-- leader to caption -->
<path d="M 300 267 v 32" stroke="#6d5a3a" stroke-width="1.4"/>

<text x="300" y="316" text-anchor="middle" font-size="13" fill="#291c0e">Tag module 35 × 15 × 4 mm, sealed flush</text>
<text x="300" y="334" text-anchor="middle" font-size="13" fill="#4f4f4f">in a non-load-bearing cavity in the runner</text>
<text x="300" y="360" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f6f3a">ISO 8611 load ratings unchanged</text>

<!-- route chips -->
<rect x="78" y="382" width="236" height="58" rx="10" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
<text x="196" y="406" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">ROUTE A — INSERT-MOLDED</text>
<text x="196" y="426" text-anchor="middle" font-size="12" fill="#4f4f4f">placed at the molding machine</text>
<rect x="326" y="382" width="236" height="58" rx="10" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
<text x="444" y="406" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">ROUTE B — PRESS-FIT + WELD</text>
<text x="444" y="426" text-anchor="middle" font-size="12" fill="#4f4f4f">retrofit into a machined cavity</text>

<text x="320" y="482" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Reads 1–3 m through HDPE / PP / composite</text>
<text x="320" y="506" text-anchor="middle" font-size="12.5" fill="#4f4f4f">survives 80 °C caustic wash + 1,000 kg stacking</text>

<!-- ── RIGHT PANEL: wood pallet ── -->
<rect x="612" y="130" width="536" height="452" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="880" y="164" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">WOOD PALLET — HAMMER-IN NAIL</text>

<!-- wood pallet side view: deck boards -->
<rect x="660" y="196" width="76" height="14" rx="2" fill="#fdf8ee" stroke="#4a5568" stroke-width="1.8"/>
<rect x="744" y="196" width="76" height="14" rx="2" fill="#fdf8ee" stroke="#4a5568" stroke-width="1.8"/>
<rect x="828" y="196" width="76" height="14" rx="2" fill="#fdf8ee" stroke="#4a5568" stroke-width="1.8"/>
<rect x="912" y="196" width="76" height="14" rx="2" fill="#fdf8ee" stroke="#4a5568" stroke-width="1.8"/>
<rect x="996" y="196" width="76" height="14" rx="2" fill="#fdf8ee" stroke="#4a5568" stroke-width="1.8"/>
<!-- stringer with two forklift notches -->
<path d="M 660 214 L 1072 214 L 1072 258 L 982 258 L 982 242 L 912 242 L 912 258 L 820 258 L 820 242 L 750 242 L 750 258 L 660 258 Z" fill="#fdf8ee" stroke="#4a5568" stroke-width="2" stroke-linejoin="round"/>
<path d="M 700 226 h 340" stroke="#e4c98f" stroke-width="1.2"/>
<path d="M 690 234 h 300" stroke="#e4c98f" stroke-width="1.2"/>
<!-- bottom boards -->
<rect x="660" y="258" width="110" height="12" rx="2" fill="#fdf8ee" stroke="#4a5568" stroke-width="1.8"/>
<rect x="810" y="258" width="110" height="12" rx="2" fill="#fdf8ee" stroke="#4a5568" stroke-width="1.8"/>
<rect x="962" y="258" width="110" height="12" rx="2" fill="#fdf8ee" stroke="#4a5568" stroke-width="1.8"/>
<!-- nail tag into stringer end-grain -->
<rect x="643" y="233" width="52" height="6" rx="2" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.4"/>
<circle cx="638" cy="236" r="8" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.6"/>
<path d="M 638 246 L 638 278 L 730 291" fill="none" stroke="#6d5a3a" stroke-width="1.4"/>
<!-- red strike zone on stringer face -->
<rect x="840" y="218" width="132" height="36" rx="6" fill="none" stroke="#8b2d2d" stroke-width="2" stroke-dasharray="7 5"/>

<text x="880" y="300" text-anchor="middle" font-size="13" fill="#291c0e">UHF transponder on a steel nail shaft,</text>
<text x="880" y="318" text-anchor="middle" font-size="13" fill="#4f4f4f">driven 15–50 mm into the stringer end-grain</text>
<text x="880" y="352" text-anchor="middle" font-size="12.5" fill="#8b2d2d">surface labels ride this strike zone —</text>
<text x="880" y="370" text-anchor="middle" font-size="12.5" fill="#8b2d2d">destroyed within 10–30 trip cycles</text>

<text x="880" y="410" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Reads 2–3 m at a dock-door portal</text>
<text x="880" y="434" text-anchor="middle" font-size="12.5" fill="#4f4f4f">installs in under 2 s with a standard hammer</text>
<text x="880" y="454" text-anchor="middle" font-size="12.5" fill="#4f4f4f">rated 100–150 trip cycles in pooling service</text>

<text x="880" y="490" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f6f3a">Same GS1 encoding as the molded module</text>
<text x="880" y="512" text-anchor="middle" font-size="12.5" fill="#4f4f4f">full spec on the RFID nail tag page</text>

<!-- footer -->
<text x="600" y="622" text-anchor="middle" font-size="14" fill="#4f4f4f">Match the attachment to the construction — the dock portal reads both the same way</text>
</svg>
