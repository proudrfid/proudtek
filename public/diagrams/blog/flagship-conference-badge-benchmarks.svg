<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How five flagship events run RFID badges — attendee scale and platform stack</title>
<desc id="d">Five benchmark rows. CES in Las Vegas, about 115K attendees, Cvent OnArrival with dual-chip PVC and Impinj room readers, sub-three-second check-in. NRF Big Show in New York, about 40K, NFC plus UHF dual-chip with Tappit and Cvent, syncing HubSpot, Salesforce and Marketo. Mobile World Congress in Barcelona, about 100K, Bizzabo and Klik smart-badge with NFC tap-to-exchange. IBC in Amsterdam, about 50K, Cvent plus Connect and GO plus Intellitix feeding CME and CPE credit. SXSW in Austin, about 280K, Aventri and Stova with wristband plus badge dual-issue.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FLAGSHIP DEPLOYMENTS, BENCHMARKED</text>
<text x="600" y="86" text-anchor="middle" font-size="15" fill="#4f4f4f">How the biggest shows run badges — the bar your 500–5,000 attendee event aims at.</text>
<!-- row 1 CES -->
<rect x="60" y="150" width="1080" height="84" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="60" y="150" width="6" height="84" rx="3" fill="#3d6b6b"/>
