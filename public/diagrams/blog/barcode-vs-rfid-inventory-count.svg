<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Barcode versus UHF RFID inventory counting compared across five metrics</title>
<desc id="d">A five-row comparison. Count time per store is 30 to 50 hours by barcode versus 2 to 4 hours by RFID. Count frequency is 2 to 4 times a year by barcode versus weekly to daily by RFID. Scan rate is 20 to 30 items per minute per associate by barcode versus over 200 per minute by RFID. Record accuracy is 65 to 75 percent by barcode versus 95 to 99 percent by RFID. Read method is one item at a time by barcode versus bulk with no line of sight by RFID.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SAME COUNT, DIFFERENT PHYSICS</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Line-of-sight, one item at a time — versus bulk reads that finish before lunch.</text>

<!-- column backgrounds -->
<rect x="64" y="150" width="372" height="374" rx="14" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="764" y="150" width="372" height="374" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.6"/>

<!-- headers -->
<text x="250" y="180" text-anchor="middle" font-size="17" font-weight="800" fill="#8b2d2d">BARCODE</text>
<text x="600" y="180" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8a7a55">METRIC</text>
<text x="950" y="180" text-anchor="middle" font-size="17" font-weight="800" fill="#1f6f3a">UHF RFID</text>
<line x1="90" y1="196" x2="1110" y2="196" stroke="#ece3d3" stroke-width="1.4"/>

<!-- row 1 -->
<text x="250" y="242" text-anchor="middle" font-size="19" font-weight="800" fill="#8b2d2d">30–50 hrs</text>
<text x="600" y="238" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">count time / store</text>
<text x="950" y="242" text-anchor="middle" font-size="19" font-weight="800" fill="#1f6f3a">2–4 hrs</text>
<line x1="90" y1="262" x2="1110" y2="262" stroke="#f0e8d8" stroke-width="1.2"/>

<!-- row 2 -->
<text x="250" y="308" text-anchor="middle" font-size="19" font-weight="800" fill="#8b2d2d">2–4× / year</text>
<text x="600" y="304" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">count frequency</text>
<text x="950" y="308" text-anchor="middle" font-size="19" font-weight="800" fill="#1f6f3a">weekly – daily</text>
<line x1="90" y1="328" x2="1110" y2="328" stroke="#f0e8d8" stroke-width="1.2"/>

<!-- row 3 -->
<text x="250" y="374" text-anchor="middle" font-size="19" font-weight="800" fill="#8b2d2d">20–30 / min</text>
<text x="600" y="370" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">scan rate / associate</text>
<text x="950" y="374" text-anchor="middle" font-size="19" font-weight="800" fill="#1f6f3a">200+ / min</text>
<line x1="90" y1="394" x2="1110" y2="394" stroke="#f0e8d8" stroke-width="1.2"/>

<!-- row 4 accuracy (emphasis) -->
<text x="250" y="440" text-anchor="middle" font-size="22" font-weight="800" fill="#8b2d2d">65–75%</text>
<text x="600" y="436" text-anchor="middle" font-size="13.5" font-weight="800" fill="#291c0e">record accuracy</text>
<text x="950" y="440" text-anchor="middle" font-size="22" font-weight="800" fill="#1f6f3a">95–99%</text>
<line x1="90" y1="460" x2="1110" y2="460" stroke="#f0e8d8" stroke-width="1.2"/>

<!-- row 5 -->
<text x="250" y="506" text-anchor="middle" font-size="16" font-weight="700" fill="#a85a5a">one at a time</text>
<text x="600" y="502" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">read method</text>
<text x="950" y="500" text-anchor="middle" font-size="15.5" font-weight="700" fill="#26543a">bulk, no</text>
<text x="950" y="518" text-anchor="middle" font-size="15.5" font-weight="700" fill="#26543a">line-of-sight</text>

<text x="600" y="566" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">The count that took a quarter now takes an afternoon.</text>
<text x="600" y="598" text-anchor="middle" font-size="14" fill="#5c5c5c">Barcode labels also fail folded, creased or obscured — which is to say, on any normal day in an apparel display.</text>
</svg>
