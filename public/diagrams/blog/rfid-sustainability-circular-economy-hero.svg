<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID closing the circular-economy loop across a product's life</title>
<desc id="d">A closed-loop circuit. The top row is the forward path — raw material, manufacture, consumer use. The right side drops down to the return path along the bottom — collect and return, sort and recycle, remanufacture — which flows back up on the left to raw material, closing the loop. At the centre, an RFID chip carries the item's verifiable data at every stage, and RFID reads at collection and sorting turn end-of-life guesswork into a routing decision.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CLOSING THE LOOP</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="37" font-weight="700" fill="#291c0e">One tag carries the item all the way around</text>
<text x="600" y="136" text-anchor="middle" font-size="16.5" fill="#4f4f4f">Make, use, recover, remake — RFID is the data thread that survives every stage.</text>

<!-- forward-path arrows (top, neutral) -->
<g stroke="#8a94a3" stroke-width="2.6" fill="#8a94a3">
<line x1="290" y1="216" x2="518" y2="216"/><polygon points="518,210 528,216 518,222"/>
<line x1="680" y1="216" x2="908" y2="216"/><polygon points="908,210 918,216 908,222"/>
</g>
<!-- return-path arrows (right, bottom, left — forest) -->
<g stroke="#2d6a4f" stroke-width="2.8" fill="#2d6a4f">
<line x1="990" y1="250" x2="990" y2="440"/><polygon points="984,440 990,450 996,440"/>
<line x1="910" y1="476" x2="682" y2="476"/><polygon points="682,470 672,476 682,482"/>
<line x1="518" y1="476" x2="290" y2="476"/><polygon points="290,470 280,476 290,482"/>
<line x1="210" y1="440" x2="210" y2="252"/><polygon points="204,252 210,242 216,252"/>
</g>

<!-- TOP ROW (forward path) -->
<rect x="132" y="184" width="156" height="64" rx="12" fill="#f4f6f4" stroke="#8a94a3" stroke-width="1.6"/>
<text x="210" y="214" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4658">Raw material</text>
<text x="210" y="233" text-anchor="middle" font-size="12" fill="#5c5c5c">virgin or recycled</text>
<rect x="522" y="184" width="156" height="64" rx="12" fill="#f4f6f4" stroke="#8a94a3" stroke-width="1.6"/>
<text x="600" y="214" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4658">Manufacture</text>
<text x="600" y="233" text-anchor="middle" font-size="12" fill="#5c5c5c">tag applied</text>
<rect x="912" y="184" width="156" height="64" rx="12" fill="#f4f6f4" stroke="#8a94a3" stroke-width="1.6"/>
<text x="990" y="214" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4658">Consumer use</text>
<text x="990" y="233" text-anchor="middle" font-size="12" fill="#5c5c5c">years of wear</text>

<!-- BOTTOM ROW (return path) -->
<rect x="912" y="444" width="156" height="64" rx="12" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.8"/>
<text x="990" y="474" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1b4332">Collect / return</text>
<text x="990" y="493" text-anchor="middle" font-size="12" fill="#3f7d55">take-back read</text>
<rect x="522" y="444" width="156" height="64" rx="12" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.8"/>
<text x="600" y="474" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1b4332">Sort &amp; recycle</text>
<text x="600" y="493" text-anchor="middle" font-size="12" fill="#3f7d55">material routing</text>
<rect x="132" y="444" width="156" height="64" rx="12" fill="#eef5f0" stroke="#2d6a4f" stroke-width="1.8"/>
<text x="210" y="474" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1b4332">Remanufacture</text>
<text x="210" y="493" text-anchor="middle" font-size="12" fill="#3f7d55">back into stock</text>

<!-- read pills under collect + sort -->
<rect x="946" y="520" width="88" height="24" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="990" y="536" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">RFID read</text>
<rect x="556" y="520" width="88" height="24" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="600" y="536" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">RFID read</text>

<!-- centre chip + label -->
<rect x="576" y="300" width="48" height="38" rx="6" fill="#1b4332"/>
<line x1="576" y1="311" x2="566" y2="311" stroke="#1b4332" stroke-width="2.4"/>
<line x1="576" y1="327" x2="566" y2="327" stroke="#1b4332" stroke-width="2.4"/>
<line x1="624" y1="311" x2="634" y2="311" stroke="#1b4332" stroke-width="2.4"/>
<line x1="624" y1="327" x2="634" y2="327" stroke="#1b4332" stroke-width="2.4"/>
<circle cx="600" cy="319" r="7" fill="none" stroke="#eef5f0" stroke-width="2"/>
<text x="600" y="366" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.4" fill="#1b4332">RFID CLOSES THE LOOP</text>
<text x="600" y="388" text-anchor="middle" font-size="13.5" fill="#4f4f4f">verifiable per-item data at every stage</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">A read at collection and sorting turns end-of-life guesswork into a routing decision.</text>
</svg>
