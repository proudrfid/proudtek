<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Cutaway anatomy of a coconut-shell NFC bead</title>
<desc id="d">A cross-section of a coconut-shell bead. The outer carved shell forms a thick ring around an interior cavity filled with food-grade epoxy. At the centre sits a standard 10 millimetre NFC inlay — an antenna coil around a small chip. A waxed-cotton or hemp cord passes through the bead. The shell changes the appearance only; the read range through it is 2 to 5 centimetres, identical to a plastic band.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INSIDE THE BEAD</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">The shell changes how it looks, not how it reads.</text>

<!-- cord (behind bead) -->
<rect x="150" y="248" width="560" height="22" rx="11" fill="#4a5568"/>

<!-- bead cross-section -->
<circle cx="430" cy="378" r="160" fill="#6d5a3a"/>
<circle cx="430" cy="378" r="126" fill="#f4e7cf"/>
<circle cx="430" cy="378" r="104" fill="none" stroke="#3d6b6b" stroke-width="1.6" stroke-dasharray="6 5"/>
<circle cx="430" cy="378" r="92" fill="none" stroke="#3d6b6b" stroke-width="6"/>
<circle cx="430" cy="378" r="78" fill="none" stroke="#3d6b6b" stroke-width="6"/>
<circle cx="430" cy="378" r="64" fill="none" stroke="#3d6b6b" stroke-width="6"/>
<rect x="413" y="361" width="34" height="34" rx="5" fill="#291c0e"/>
<text x="430" y="383" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">IC</text>

<!-- callout leaders -->
<line x1="770" y1="206" x2="660" y2="259" stroke="#b9ad97" stroke-width="1.4"/>
<line x1="770" y1="300" x2="552" y2="308" stroke="#b9ad97" stroke-width="1.4"/>
<line x1="770" y1="390" x2="508" y2="360" stroke="#b9ad97" stroke-width="1.4"/>
<line x1="770" y1="478" x2="516" y2="452" stroke="#b9ad97" stroke-width="1.4"/>

<circle cx="770" cy="206" r="6" fill="#4a5568"/>
<text x="788" y="211" font-size="15" font-weight="700" fill="#291c0e">Waxed-cotton / hemp cord</text>
<circle cx="770" cy="300" r="6" fill="#6d5a3a"/>
<text x="788" y="305" font-size="15" font-weight="700" fill="#291c0e">Carved coconut shell</text>
<circle cx="770" cy="390" r="6" fill="#3d6b6b"/>
<text x="788" y="395" font-size="15" font-weight="700" fill="#291c0e">10 mm NFC inlay: antenna + chip</text>
<circle cx="770" cy="478" r="6" fill="#c39a5f"/>
<text x="788" y="483" font-size="15" font-weight="700" fill="#291c0e">Food-grade epoxy fill</text>

<!-- read-range note -->
<rect x="190" y="566" width="480" height="44" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="430" y="593" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">Read range through the shell: 2-5 cm &#8212; same as a plastic band.</text>
</svg>
