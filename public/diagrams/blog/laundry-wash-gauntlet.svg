<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">One wash cycle is a three-stage gauntlet — rate the tag for all of it</title>
<desc id="d">Three stages every cycle: industrial wash at 60-85 degrees Celsius with alkaline detergent and chlorine bleach; tunnel drying with mechanical stress up to 180 degrees; and the flatwork ironer pressing flat linen at 160-180 degrees under high compression. PPS tags from leading makers are rated 200-plus cycles at 75 degrees with standard chemistry — but wash-only ratings flatter the tag, so demand endurance data for the full wash-dry-press sequence and pilot 100-200 tags through 20 complete cycles first.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EVERY CYCLE IS AN ASSAULT COURSE</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Rate the tag for the whole gauntlet, not the gentlest leg</text>

<line x1="170" y1="170" x2="1030" y2="170" stroke="#e4c98f" stroke-width="2.5"/>
<g text-anchor="middle">
<circle cx="230" cy="170" r="26" fill="#3d6b6b"/>
<text x="230" y="178" font-size="18" font-weight="800" fill="#ffffff">1</text>
<rect x="90" y="218" width="280" height="230" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="230" y="254" font-size="16" font-weight="800" fill="#2c5454">INDUSTRIAL WASH</text>
<circle cx="230" cy="316" r="34" fill="#ffffff" stroke="#2c5454" stroke-width="2.5"/>
<path d="M 206 316 q 12 -10 24 0 t 24 0" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<text x="230" y="386" font-size="15" font-weight="800" fill="#291c0e">60–85 °C</text>
<text x="230" y="412" font-size="12.5" fill="#4f4f4f">alkaline detergent</text>
<text x="230" y="434" font-size="12.5" fill="#4f4f4f">+ chlorine bleach</text>
</g>
<g text-anchor="middle">
<circle cx="600" cy="170" r="26" fill="#4a5568"/>
<text x="600" y="178" font-size="18" font-weight="800" fill="#ffffff">2</text>
<rect x="460" y="218" width="280" height="230" rx="14" fill="#eef1f5" stroke="#4a5568" stroke-width="1.5"/>
<text x="600" y="254" font-size="16" font-weight="800" fill="#4a5568">TUNNEL DRYER</text>
<circle cx="600" cy="316" r="34" fill="#ffffff" stroke="#4a5568" stroke-width="2.5"/>
<path d="M 588 298 q 6 8 0 16 t 0 16 M 606 298 q 6 8 0 16 t 0 16" fill="none" stroke="#4a5568" stroke-width="2.5"/>
<text x="600" y="386" font-size="15" font-weight="800" fill="#291c0e">up to 180 °C</text>
<text x="600" y="412" font-size="12.5" fill="#4f4f4f">heat + mechanical stress</text>
<text x="600" y="434" font-size="12.5" fill="#4f4f4f">the tumbling is not optional</text>
</g>
<g text-anchor="middle">
<circle cx="970" cy="170" r="26" fill="#8b2d2d"/>
<text x="970" y="178" font-size="18" font-weight="800" fill="#ffffff">3</text>
<rect x="830" y="218" width="280" height="230" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="970" y="254" font-size="16" font-weight="800" fill="#8b2d2d">FLATWORK IRONER</text>
<rect x="906" y="292" width="128" height="18" rx="9" fill="#8b2d2d"/>
<rect x="906" y="322" width="128" height="10" rx="5" fill="#e6dfd2"/>
<text x="970" y="386" font-size="15" font-weight="800" fill="#291c0e">160–180 °C</text>
<text x="970" y="412" font-size="12.5" fill="#4f4f4f">direct heat + high compression</text>
<text x="970" y="434" font-size="12.5" fill="#4f4f4f">sheets and tablecloths take this hit</text>
</g>

<rect x="150" y="490" width="900 " height="100" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="528" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="19" font-weight="700" fill="#291c0e">Wash-only ratings flatter the tag — demand the full wash-dry-press number.</text>
<text x="600" y="560" text-anchor="middle" font-size="13" fill="#4f4f4f">Benchmark: leading PPS tags rate 200+ cycles at 75 °C · pilot 100–200 tags through 20 full cycles before production</text>
<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#5c5c5c">A tag that survives the wash but dies at the press was never a laundry tag — just an optimist.</text>
</svg>
