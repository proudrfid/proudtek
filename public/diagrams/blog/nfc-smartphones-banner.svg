<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How NFC tags talk to smartphones — one tap, 13.56 MHz, no battery</title>
<desc id="d">An editorial banner. On the left, a smartphone acts as the active reader, generating a 13.56 MHz magnetic field shown as concentric arcs. On the right, a passive NFC tag — an antenna coil around a small chip — harvests power from that field and needs no battery, giving a 10+ year life. Two labeled flows run between them: the phone's field powers the chip (10–30 mW), and the tag answers by load modulation, carrying data back at 106 kbit/s over a range of 0–10 cm.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="phone" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#33240f"/><stop offset="100%" stop-color="#291c0e"/></linearGradient>
<radialGradient id="screen" cx="50%" cy="38%" r="75%"><stop offset="0%" stop-color="#1fcefb"/><stop offset="60%" stop-color="#2a91c4"/><stop offset="100%" stop-color="#15384a"/></radialGradient>
<radialGradient id="tagfill" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#f7edd6"/><stop offset="100%" stop-color="#f0e2c2"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

<text x="60" y="70" font-size="15" font-weight="800" letter-spacing="3" fill="#c39a5f">NEAR FIELD COMMUNICATION &#183; 13.56 MHz</text>
<text x="60" y="112" font-size="34" font-weight="800" fill="#291c0e" font-family="Lora, Georgia, serif">One tap. No battery. A little physics.</text>

<!-- ============ concentric RF field (emitted by phone) ============ -->
<g fill="none" stroke-linecap="round">
<path d="M470 250 A150 150 0 0 1 470 490" stroke="#c39a5f" stroke-width="5" opacity="0.85"/>
<path d="M470 220 A200 200 0 0 1 470 520" stroke="#c39a5f" stroke-width="4.5" opacity="0.6"/>
<path d="M470 192 A250 250 0 0 1 470 548" stroke="#3d6b6b" stroke-width="4" opacity="0.42"/>
<path d="M470 166 A300 300 0 0 1 470 574" stroke="#3d6b6b" stroke-width="3.5" opacity="0.26"/>
</g>

<!-- ============ smartphone (active reader) ============ -->
<g>
<rect x="250" y="214" width="180" height="332" rx="30" fill="url(#phone)" stroke="#c39a5f" stroke-width="2.5"/>
<rect x="268" y="238" width="144" height="284" rx="16" fill="url(#screen)"/>
<circle cx="340" cy="228" r="4" fill="#6d5a3a"/>
<!-- tap ripple on screen -->
<g fill="none" stroke="#ffffff">
<circle cx="340" cy="372" r="20" stroke-width="3" opacity="0.9"/>
<circle cx="340" cy="372" r="36" stroke-width="2.5" opacity="0.55"/>
<circle cx="340" cy="372" r="52" stroke-width="2" opacity="0.3"/>
</g>
<rect x="292" y="300" width="96" height="22" rx="11" fill="#ffffff" opacity="0.92"/>
<text x="340" y="316" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15384a">https://&#8230;</text>
</g>
<text x="340" y="586" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">SMARTPHONE</text>
<text x="340" y="608" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4f4f4f">active reader &#183; generates the field</text>

<!-- ============ NFC tag (passive) ============ -->
<g>
<circle cx="900" cy="372" r="96" fill="url(#tagfill)" stroke="#c39a5f" stroke-width="2"/>
<g fill="none" stroke="#6d5a3a" stroke-width="4" opacity="0.9">
<circle cx="900" cy="372" r="80"/>
<circle cx="900" cy="372" r="66"/>
<circle cx="900" cy="372" r="52"/>
</g>
<rect x="878" y="350" width="44" height="44" rx="6" fill="#291c0e"/>
<text x="900" y="378" text-anchor="middle" font-size="13" font-weight="800" fill="#d4a755">IC</text>
</g>
<text x="900" y="586" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">NFC TAG</text>
<text x="900" y="608" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4f4f4f">passive &#183; no battery &#183; 10+ year life</text>

<!-- ============ two labeled flows ============ -->
<g>
<rect x="486" y="250" width="336" height="34" rx="17" fill="#faf3e4" stroke="#c39a5f" stroke-width="1.4"/>
<text x="512" y="272" font-size="14.5" font-weight="700" fill="#6d5a3a">&#9312; field powers the chip &#183; 10&#8211;30 mW</text>
<path d="M792 267 h20" stroke="#c39a5f" stroke-width="2.4" fill="none"/><path d="M808 261 l10 6 -10 6" fill="#c39a5f"/>
</g>
<g>
<rect x="486" y="462" width="336" height="34" rx="17" fill="#e9f1f1" stroke="#3d6b6b" stroke-width="1.4"/>
<text x="560" y="484" font-size="14.5" font-weight="700" fill="#234a4a">load modulation &#183; data back &#183; 106 kbit/s &#9313;</text>
<path d="M516 479 h-20" stroke="#3d6b6b" stroke-width="2.4" fill="none"/><path d="M500 473 l-10 6 10 6" fill="#3d6b6b"/>
</g>

<line x1="60" y1="640" x2="1140" y2="640" stroke="#efe7d8" stroke-width="1.5"/>
<text x="600" y="662" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5c5c">Range 0&#8211;10 cm (typical 1&#8211;5 cm) &#183; the phone lends the tag power for the length of the tap, then takes its data back.</text>
</svg>
