<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">UHF RAIN RFID in 2026 — a reader portal counts a whole cart at once</title>
<desc id="d">Hero illustration for the 2026 RAIN RFID trends report. A shopping cart loaded with tagged cartons rolls through a teal RAIN UHF reader portal; radio arcs from antennas on both pillars reach the tags, and a speech bubble reports the whole cart counted at once with no line of sight required. Beneath the scene, four stat cards carry the year's headline numbers: tags below $0.03 at very high volume, a $15.6B 2026 market per IDTechEx, 15-20% annual tag-demand growth, and 5B+ Impinj M800 chips shipped by end of 2025.</desc>
