<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five hotel keycard chips compared on memory, encryption, cost and best fit</title>
<desc id="d">A comparison of five chips. MIFARE Classic 1K: 1 KB, Crypto-1, $0.30 to $0.60 per card, best for the default estate. MIFARE Classic 4K: 4 KB, Crypto-1, $0.40 to $0.70, best for loyalty or multi-property data. MIFARE DESFire EV2: 2 to 8 KB, AES-128, $0.70 to $1.20, best for anti-clone security. MIFARE DESFire EV3: 2 to 8 KB, AES-128 with EAL5+, $0.80 to $1.50, best for premium and mobile key. MIFARE Ultralight: 48 bytes, no encryption (Ultralight C adds 3DES), $0.20 to $0.40, best for budget disposable cards.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOTEL KEYCARD CHIPS · SIDE BY SIDE</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">Cost and security climb together; universal lock fit falls away.</text>

<text x="92" y="126" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">CHIP</text>
<text x="416" y="126" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">MEMORY</text>
<text x="556" y="126" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">ENCRYPTION</text>
<text x="792" y="126" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">COST / CARD</text>
<text x="936" y="126" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">BEST FOR</text>

<!-- row 1 Classic 1K -->
<rect x="64" y="140" width="1072" height="60" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<rect x="64" y="140" width="9" height="60" rx="4" fill="#3d6b6b"/>
<text x="92" y="176" font-size="15" font-weight="800" fill="#291c0e">MIFARE Classic 1K</text>
<text x="416" y="176" font-size="13" fill="#333333">1 KB</text>
<text x="556" y="176" font-size="13" fill="#333333">Crypto-1</text>
<text x="792" y="176" font-size="13" font-weight="700" fill="#2c5454">$0.30-0.60</text>
<text x="936" y="176" font-size="13" fill="#333333">default / most hotels</text>

<!-- row 2 Classic 4K -->
<rect x="64" y="208" width="1072" height="60" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<rect x="64" y="208" width="9" height="60" rx="4" fill="#3d6b6b"/>
<text x="92" y="244" font-size="15" font-weight="800" fill="#291c0e">MIFARE Classic 4K</text>
<text x="416" y="244" font-size="13" fill="#333333">4 KB</text>
<text x="556" y="244" font-size="13" fill="#333333">Crypto-1</text>
<text x="792" y="244" font-size="13" font-weight="700" fill="#2c5454">$0.40-0.70</text>
<text x="936" y="244" font-size="13" fill="#333333">loyalty / multi-property data</text>

<!-- row 3 DESFire EV2 -->
<rect x="64" y="276" width="1072" height="60" rx="10" fill="#e4f0f0" stroke="#bcdcdc" stroke-width="1.3"/>
<rect x="64" y="276" width="9" height="60" rx="4" fill="#234a4a"/>
<text x="92" y="312" font-size="15" font-weight="800" fill="#291c0e">MIFARE DESFire EV2</text>
<text x="416" y="312" font-size="13" fill="#333333">2-8 KB</text>
<text x="556" y="312" font-size="13" fill="#333333">AES-128</text>
<text x="792" y="312" font-size="13" font-weight="700" fill="#234a4a">$0.70-1.20</text>
<text x="936" y="312" font-size="13" fill="#333333">anti-clone security</text>

<!-- row 4 DESFire EV3 (premium highlight) -->
<rect x="64" y="344" width="1072" height="60" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.3"/>
<rect x="64" y="344" width="9" height="60" rx="4" fill="#c39a5f"/>
<text x="92" y="380" font-size="15" font-weight="800" fill="#291c0e">MIFARE DESFire EV3</text>
<text x="416" y="380" font-size="13" fill="#333333">2-8 KB</text>
<text x="556" y="380" font-size="13" font-weight="700" fill="#8a6d34">AES-128 · EAL5+</text>
<text x="792" y="380" font-size="13" font-weight="700" fill="#8a6d34">$0.80-1.50</text>
<text x="936" y="380" font-size="13" fill="#333333">premium / mobile key</text>

<!-- row 5 Ultralight -->
<rect x="64" y="412" width="1072" height="60" rx="10" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.3"/>
<rect x="64" y="412" width="9" height="60" rx="4" fill="#4a5568"/>
<text x="92" y="448" font-size="15" font-weight="800" fill="#291c0e">MIFARE Ultralight</text>
<text x="416" y="448" font-size="13" fill="#333333">48 B</text>
<text x="556" y="448" font-size="13" fill="#333333">none (UL C: 3DES)</text>
<text x="792" y="448" font-size="13" font-weight="700" fill="#4a5568">$0.20-0.40</text>
<text x="936" y="448" font-size="13" fill="#333333">budget / disposable</text>

<text x="600" y="516" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Most hotels stop at Classic 1K for the estate and DESFire EV3 where security or multi-app earns the premium.</text>
</svg>
