<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Why legacy access cards clone so easily</title>
<desc id="d">Two root causes sit above a four-step clone flow. Root cause one: 125 kHz proximity cards broadcast their ID number in plaintext with no encryption. Root cause two: MIFARE Classic's Crypto-1 cipher was publicly broken in 2008, so free tools dump every sector. The flow: a legacy card, then a sub-$50 reader that captures the ID and keys, then a blank card written with the same data, producing a perfect clone that reads identically in the access log.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY LEGACY CARDS CLONE · NO SECRET TO STEAL</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">125 kHz broadcasts its ID in the clear; MIFARE Classic's cipher fell in 2008.</text>

<!-- root causes -->
<rect x="64" y="112" width="524" height="92" rx="12" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.8"/>
<text x="86" y="146" font-size="16" font-weight="800" fill="#8b2d2d">125 kHz proximity</text>
<text x="86" y="172" font-size="13.5" fill="#7a4242">ID sent in plaintext — no encryption at all.</text>
<text x="86" y="191" font-size="13.5" fill="#7a4242">Any receiver captures it; any blank replays it.</text>
<rect x="612" y="112" width="524" height="92" rx="12" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.8"/>
<text x="634" y="146" font-size="16" font-weight="800" fill="#8b2d2d">MIFARE Classic</text>
<text x="634" y="172" font-size="13.5" fill="#7a4242">Crypto-1 cipher publicly broken in 2008.</text>
<text x="634" y="191" font-size="13.5" fill="#7a4242">Free tools dump every sector key.</text>

<!-- clone flow -->
<rect x="64" y="256" width="250" height="150" rx="12" fill="#eef1f5" stroke="#4a5568" stroke-width="2"/>
<rect x="129" y="292" width="120" height="70" rx="9" fill="#ffffff" stroke="#4a5568" stroke-width="2.5"/><rect x="141" y="304" width="24" height="17" rx="3" fill="#d9c48c"/>
<text x="189" y="388" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Legacy card</text>

<rect x="344" y="256" width="250" height="150" rx="12" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
<rect x="434" y="290" width="70" height="60" rx="8" fill="#ffffff" stroke="#6d5a3a" stroke-width="2.5"/><line x1="469" y1="290" x2="469" y2="280" stroke="#6d5a3a" stroke-width="2"/><text x="469" y="326" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">$50</text>
<text x="469" y="388" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Reader captures</text>

<rect x="624" y="256" width="250" height="150" rx="12" fill="#eef1f5" stroke="#4a5568" stroke-width="2"/>
<rect x="689" y="292" width="120" height="70" rx="9" fill="#ffffff" stroke="#4a5568" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="749" y="388" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Blank card written</text>

<rect x="904" y="256" width="250" height="150" rx="12" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2.5"/>
<rect x="969" y="292" width="120" height="70" rx="9" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5"/><rect x="981" y="304" width="24" height="17" rx="3" fill="#d9c48c"/>
<text x="1029" y="388" text-anchor="middle" font-size="15" font-weight="800" fill="#8b2d2d">Perfect clone</text>

<path d="M320 323 l16 10 l-16 10 z" fill="#c39a5f"/>
<path d="M600 323 l16 10 l-16 10 z" fill="#c39a5f"/>
<path d="M880 323 l16 10 l-16 10 z" fill="#c39a5f"/>

<text x="600" y="452" text-anchor="middle" font-size="15" fill="#5c5c5c">No math to break, just a signal to copy — the only skill is standing close enough.</text>
</svg>
