<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="dppHeroTitle dppHeroDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="dppHeroTitle">The EU apparel Digital Product Passport, on one tag</title>
  <desc id="dppHeroDesc">A garment hang-tag carrying an NFC chip plus a QR code — machine-readable and human-readable — taps through to a Digital Product Passport that holds five mandatory data blocks: material composition, manufacturing trace, repair and care, recycling and end-of-life, and compliance and certifications. A footer timeline marks the road to mandatory textile DPPs: 2024 ESPR enters force, 2026 pilots and standards, 2027 textile delegated act, 2028 first-wave mandatory. One tag carries whole-life data, aligned to CIRPASS and GS1.</desc>

  <defs>
    <radialGradient id="dppGlow" cx="50%" cy="24%" r="82%">
      <stop offset="0%" stop-color="#f9eed6"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="dppSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#3a4656"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#dppGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="60" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="3" fill="#b0894c">EU ESPR · TEXTILE &amp; APPAREL</text>
  <text x="600" y="92" text-anchor="middle" font-size="27" font-weight="800" fill="#291c0e">The Digital Product Passport, on one tag</text>

  <!-- ===================== LEFT: apparel hang-tag ===================== -->
  <!-- string -->
  <path d="M245 186 C 205 150, 165 138, 132 132" fill="none" stroke="#c8b688" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="135" y="170" width="220" height="322" rx="20" fill="#fffdf8" stroke="#d9c39a" stroke-width="2.5"/>
  <circle cx="245" cy="196" r="12" fill="#f4efe4" stroke="#d9c39a" stroke-width="2"/>
  <text x="245" y="234" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#b0894c">PROUD TEK</text>
  <text x="245" y="254" text-anchor="middle" font-size="14" font-weight="800" fill="#291c0e">APPAREL DPP TAG</text>
  <line x1="165" y1="266" x2="325" y2="266" stroke="#eadfca" stroke-width="2"/>

  <!-- NFC chip + waves -->
  <g>
    <rect x="196" y="286" width="44" height="34" rx="6" fill="url(#dppSteel)"/>
    <rect x="205" y="294" width="26" height="5" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="205" y="303" width="26" height="5" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="205" y="312" width="26" height="4" rx="2" fill="#ffffff" opacity="0.7"/>
    <path d="M250 290 a20 20 0 0 1 0 26" fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round"/>
    <path d="M260 283 a30 30 0 0 1 0 40" fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <path d="M270 276 a40 40 0 0 1 0 54" fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <text x="218" y="342" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#3a4656">NFC</text>
  </g>

  <!-- QR block -->
  <g fill="#291c0e">
    <rect x="278" y="284" width="54" height="54" rx="4" fill="#ffffff" stroke="#d9c39a" stroke-width="1.5"/>
    <!-- finder patterns -->
    <rect x="283" y="289" width="14" height="14" rx="1"/>
    <rect x="286" y="292" width="8" height="8" rx="1" fill="#ffffff"/>
    <rect x="288" y="294" width="4" height="4"/>
    <rect x="313" y="289" width="14" height="14" rx="1"/>
    <rect x="316" y="292" width="8" height="8" rx="1" fill="#ffffff"/>
    <rect x="318" y="294" width="4" height="4"/>
    <rect x="283" y="319" width="14" height="14" rx="1"/>
    <rect x="286" y="322" width="8" height="8" rx="1" fill="#ffffff"/>
    <rect x="288" y="324" width="4" height="4"/>
    <!-- modules -->
    <rect x="303" y="290" width="4" height="4"/>
    <rect x="303" y="298" width="4" height="4"/>
    <rect x="303" y="311" width="4" height="4"/>
    <rect x="313" y="311" width="4" height="4"/>
    <rect x="321" y="311" width="4" height="4"/>
    <rect x="303" y="320" width="4" height="4"/>
    <rect x="311" y="325" width="4" height="4"/>
    <rect x="319" y="319" width="4" height="4"/>
    <rect x="325" y="325" width="4" height="4"/>
    <text x="305" y="352" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#3a4656">QR</text>
  </g>

  <line x1="165" y1="372" x2="325" y2="372" stroke="#eadfca" stroke-width="2"/>
  <text x="245" y="422" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">NFC + QR</text>
  <text x="245" y="444" text-anchor="middle" font-size="11.5" fill="#6d5a3a">machine + human readable</text>
  <text x="245" y="466" text-anchor="middle" font-size="11.5" fill="#6d5a3a">persistent for the whole product life</text>

  <!-- ===================== MIDDLE: tap connector ===================== -->
  <text x="497" y="276" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#b0894c">TAP / SCAN</text>
  <line x1="360" y1="330" x2="470" y2="330" stroke="#c8b688" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
  <rect x="472" y="286" width="52" height="92" rx="11" fill="#ffffff" stroke="#4a5568" stroke-width="2.5"/>
  <rect x="482" y="300" width="32" height="56" rx="3" fill="#eef2f6"/>
  <path d="M498 312 a11 11 0 0 1 0 16" fill="none" stroke="#1fcefb" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M505 307 a18 18 0 0 1 0 26" fill="none" stroke="#1fcefb" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="498" cy="367" r="3" fill="#4a5568"/>
  <line x1="526" y1="330" x2="628" y2="330" stroke="#c8b688" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
  <path d="M626 323 l12 7 l-12 7 z" fill="#b0894c"/>

  <!-- ===================== RIGHT: passport data card ===================== -->
  <rect x="636" y="150" width="470" height="362" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <path d="M636 170 a20 20 0 0 1 20 -20 h430 a20 20 0 0 1 20 20 v38 h-470 z" fill="url(#dppSteel)"/>
  <text x="871" y="184" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#ffffff">DIGITAL PRODUCT PASSPORT</text>
  <text x="871" y="200" text-anchor="middle" font-size="10.5" letter-spacing="0.5" fill="#c9d2df">five mandatory data blocks for textiles</text>

  <!-- rows -->
  <g>
    <circle cx="676" cy="248" r="16" fill="#2d6a4f"/><text x="676" y="253" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
    <text x="708" y="244" font-size="15" font-weight="700" fill="#291c0e">Material composition</text>
    <text x="708" y="262" font-size="11.5" fill="#6d5a3a">fibre % by weight · recycled content · REACH</text>
    <line x1="662" y1="278" x2="1080" y2="278" stroke="#f0eae0" stroke-width="1.5"/>

    <circle cx="676" cy="304" r="16" fill="#4a5568"/><text x="676" y="309" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
    <text x="708" y="300" font-size="15" font-weight="700" fill="#291c0e">Manufacturing trace</text>
    <text x="708" y="318" font-size="11.5" fill="#6d5a3a">country &amp; facility per tier — spin to pack</text>
    <line x1="662" y1="334" x2="1080" y2="334" stroke="#f0eae0" stroke-width="1.5"/>

    <circle cx="676" cy="360" r="16" fill="#c39a5f"/><text x="676" y="365" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
    <text x="708" y="356" font-size="15" font-weight="700" fill="#291c0e">Repair &amp; care</text>
    <text x="708" y="374" font-size="11.5" fill="#6d5a3a">care symbols · repair partners · service life</text>
    <line x1="662" y1="390" x2="1080" y2="390" stroke="#f0eae0" stroke-width="1.5"/>

    <circle cx="676" cy="416" r="16" fill="#3d6b6b"/><text x="676" y="421" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
    <text x="708" y="412" font-size="15" font-weight="700" fill="#291c0e">Recycling &amp; end-of-life</text>
    <text x="708" y="430" font-size="11.5" fill="#6d5a3a">take-back · recycling route · hazard flags</text>
    <line x1="662" y1="446" x2="1080" y2="446" stroke="#f0eae0" stroke-width="1.5"/>

    <circle cx="676" cy="472" r="16" fill="#6c5127"/><text x="676" y="477" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">5</text>
    <text x="708" y="468" font-size="15" font-weight="700" fill="#291c0e">Compliance &amp; certs</text>
    <text x="708" y="486" font-size="11.5" fill="#6d5a3a">OEKO-TEX · GRS · GOTS · verifiable links</text>
  </g>

  <!-- ===================== FOOTER: road-to-mandatory timeline ===================== -->
  <path d="M20 556 h1160 v77 a22 22 0 0 1 -22 22 h-1116 a22 22 0 0 1 -22 -22 z" fill="url(#dppSteel)"/>
  <line x1="150" y1="600" x2="840" y2="600" stroke="#6b7688" stroke-width="2.5"/>
  <g text-anchor="middle">
    <circle cx="150" cy="600" r="7" fill="#1fcefb"/>
    <text x="150" y="588" font-size="14" font-weight="800" fill="#ffffff">2024</text>
    <text x="150" y="626" font-size="10.5" fill="#c9d2df">ESPR in force</text>

    <circle cx="380" cy="600" r="7" fill="#1fcefb"/>
    <text x="380" y="588" font-size="14" font-weight="800" fill="#ffffff">2026</text>
    <text x="380" y="626" font-size="10.5" fill="#c9d2df">pilots + standards</text>

    <circle cx="610" cy="600" r="7" fill="#1fcefb"/>
    <text x="610" y="588" font-size="14" font-weight="800" fill="#ffffff">2027</text>
    <text x="610" y="626" font-size="10.5" fill="#c9d2df">textile delegated act</text>

    <circle cx="840" cy="600" r="9" fill="#f4d06f"/>
    <text x="840" y="588" font-size="14" font-weight="800" fill="#ffffff">2028</text>
    <text x="840" y="626" font-size="10.5" fill="#f4d06f">DPP mandatory</text>
  </g>
  <line x1="930" y1="576" x2="930" y2="636" stroke="#5a6577" stroke-width="1.5"/>
  <text x="1055" y="596" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">One tag. Whole-life data.</text>
  <text x="1055" y="618" text-anchor="middle" font-size="11.5" fill="#f4d06f">CIRPASS / GS1 aligned</text>
</svg>
