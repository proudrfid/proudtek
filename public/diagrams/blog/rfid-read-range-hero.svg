<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Short RFID read range is rarely the tag — it's the mounting, aim and power</title>
<desc id="d">On the left, the commonly blamed cause: the defective tag, marked with a cross, which is almost never the real reason. An arrow points to the right, where the real causes group into three buckets: mounting and environment (metal and liquid), aim and orientation (antenna polarization), and power and cabling (reader transmit power and coax loss).</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">READ RANGE TOO SHORT? · IT'S RARELY THE TAG</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Before you RMA an inlay, walk the read zone.</text>

<!-- LEFT · the blame -->
<rect x="64" y="150" width="290" height="372" rx="14" fill="#f7ecec" stroke="#e0b9b9" stroke-width="1.8"/>
<rect x="64" y="150" width="290" height="8" rx="4" fill="#8b2d2d"/>
<text x="209" y="192" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">BLAMED FIRST</text>
<rect x="149" y="228" width="120" height="150" rx="10" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.2"/>
<line x1="209" y1="228" x2="209" y2="378" stroke="#e0b9b9" stroke-width="1.4"/>
<circle cx="193" cy="303" r="6" fill="#8b2d2d"/>
<line x1="163" y1="252" x2="255" y2="354" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round"/>
<line x1="255" y1="252" x2="163" y2="354" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round"/>
<text x="209" y="418" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">"The defective tag"</text>
<text x="209" y="444" text-anchor="middle" font-size="13.5" fill="#5c5c5c">almost never the cause</text>

<!-- RIGHT · where to actually look -->
<rect x="440" y="150" width="696" height="372" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="440" y="150" width="696" height="8" rx="4" fill="#3d6b6b"/>
<text x="788" y="192" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.5" fill="#2c5454">WHERE TO ACTUALLY LOOK</text>
<rect x="470" y="220" width="636" height="80" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="490" y="252" font-size="16" font-weight="800" fill="#291c0e">Mounting &amp; environment</text>
<text x="490" y="278" font-size="13.5" fill="#5c5c5c">metal proximity and liquid absorption detune and soak up RF</text>
<rect x="470" y="312" width="636" height="80" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="490" y="344" font-size="16" font-weight="800" fill="#291c0e">Aim &amp; orientation</text>
<text x="490" y="370" font-size="13.5" fill="#5c5c5c">a tag perpendicular to the reader's polarization falls in a null</text>
<rect x="470" y="404" width="636" height="80" rx="12" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="490" y="436" font-size="16" font-weight="800" fill="#291c0e">Power &amp; cabling</text>
<text x="490" y="462" font-size="13.5" fill="#5c5c5c">a reader left at the polite factory power, or long lossy coax</text>

<line x1="362" y1="336" x2="410" y2="336" stroke="#291c0e" stroke-width="3"/><polygon points="410,328 430,336 410,344" fill="#291c0e"/>

<text x="600" y="562" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Read range is about what you mounted it on, how you aimed it, and how much power you allowed.</text>
</svg>
