<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Second-source qualification path — five gates from RFQ to bulk call-off</title>
  <desc id="d">Five-step flow for qualifying a second hotel key card supplier on an Assa Abloy estate. Step 1, Audit: pull the lock generation and encoder software version from the Assa Abloy software. Step 2, Match: MIFARE Classic 1K/4K or DESFire EV2/EV3 keying, confirmed against the estate. Step 3, Sample — highlighted as the deciding gate: validate stock on your own encoder; site keys never leave operator IT. Step 4, Pilot: a small batch encoded at the front desk while OEM stock stays on the shelf. Step 5, Scale: bulk with scheduled call-off, blank stock in 2-3 business days, custom-printed in 5-7. Footer note: chip and body are standards-based (ISO/IEC 14443-A, ISO/IEC 7810), so qualification is a workflow test, not a lab project.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 Z" fill="#c39a5f"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SECOND-SOURCE QUALIFICATION &#183; SAMPLE TO BULK</text>
  <text x="600" y="102" text-anchor="middle" font-size="34" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">Five gates from RFQ to bulk call-off</text>

  <!-- Step 1: Audit -->
  <rect x="72" y="160" width="188" height="280" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="166" cy="210" r="22" fill="#3d6b6b"/>
  <text x="166" y="217" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
  <text x="166" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Audit</text>
  <text x="166" y="298" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Lock generation +</text>
  <text x="166" y="316" text-anchor="middle" font-size="12.5" fill="#4f4f4f">encoder software</text>
  <text x="166" y="334" text-anchor="middle" font-size="12.5" fill="#4f4f4f">version, from your</text>
  <text x="166" y="352" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Assa Abloy software</text>
  <line x1="264" y1="300" x2="284" y2="300" stroke="#c39a5f" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 2: Match -->
  <rect x="288" y="160" width="188" height="280" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="382" cy="210" r="22" fill="#3d6b6b"/>
  <text x="382" y="217" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
  <text x="382" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Match</text>
  <text x="382" y="298" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Classic 1K / 4K or</text>
  <text x="382" y="316" text-anchor="middle" font-size="12.5" fill="#4f4f4f">DESFire EV2 / EV3</text>
  <text x="382" y="334" text-anchor="middle" font-size="12.5" fill="#4f4f4f">keying, confirmed</text>
  <text x="382" y="352" text-anchor="middle" font-size="12.5" fill="#4f4f4f">against the estate</text>
  <line x1="480" y1="300" x2="500" y2="300" stroke="#c39a5f" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 3: Sample (the deciding gate) -->
  <rect x="504" y="160" width="188" height="280" rx="16" fill="#fdf8ef" stroke="#c39a5f" stroke-width="2.5"/>
  <circle cx="598" cy="210" r="22" fill="#c39a5f"/>
  <text x="598" y="217" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
  <text x="598" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Sample</text>
  <text x="598" y="298" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Validate stock on</text>
  <text x="598" y="316" text-anchor="middle" font-size="12.5" fill="#4f4f4f">your own encoder;</text>
  <text x="598" y="334" text-anchor="middle" font-size="12.5" fill="#4f4f4f">site keys never</text>
  <text x="598" y="352" text-anchor="middle" font-size="12.5" fill="#4f4f4f">leave operator IT</text>
  <rect x="523" y="386" width="150" height="28" rx="14" fill="#f8ead0" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="598" y="405" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE DECIDING GATE</text>
  <line x1="696" y1="300" x2="716" y2="300" stroke="#c39a5f" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 4: Pilot -->
  <rect x="720" y="160" width="188" height="280" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="814" cy="210" r="22" fill="#3d6b6b"/>
  <text x="814" y="217" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
  <text x="814" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Pilot</text>
  <text x="814" y="298" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Small batch encoded</text>
  <text x="814" y="316" text-anchor="middle" font-size="12.5" fill="#4f4f4f">at the front desk;</text>
  <text x="814" y="334" text-anchor="middle" font-size="12.5" fill="#4f4f4f">OEM stock stays on</text>
  <text x="814" y="352" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the shelf meanwhile</text>
  <line x1="912" y1="300" x2="932" y2="300" stroke="#c39a5f" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 5: Scale -->
  <rect x="936" y="160" width="188" height="280" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="1030" cy="210" r="22" fill="#3d6b6b"/>
  <text x="1030" y="217" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
  <text x="1030" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Scale</text>
  <text x="1030" y="298" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Bulk + scheduled</text>
  <text x="1030" y="316" text-anchor="middle" font-size="12.5" fill="#4f4f4f">call-off &#8212; blank</text>
  <text x="1030" y="334" text-anchor="middle" font-size="12.5" fill="#4f4f4f">2-3 days, printed</text>
  <text x="1030" y="352" text-anchor="middle" font-size="12.5" fill="#4f4f4f">5-7 business days</text>

  <!-- footer strip -->
  <rect x="80" y="500" width="1040" height="96" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="600" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#234a4a">Chip and card body are standards-based &#8212; ISO/IEC 14443-A air interface, ISO/IEC 7810 ID-1 body.</text>
  <text x="600" y="568" text-anchor="middle" font-size="13" fill="#2c5454">Qualification is a workflow test on your own encoder, not a lab project.</text>

  <text x="600" y="637" text-anchor="middle" font-size="13" fill="#5c5c5c">Every claim on this path is validated by the sample round &#8212; the matrix advises, the encoder decides.</text>
</svg>
