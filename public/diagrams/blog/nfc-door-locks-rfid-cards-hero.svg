<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">An NFC door lock and an RFID card run a cryptographic conversation, not a name check</title>
<desc id="d">A card on the left and a wall-mounted NFC door lock on the right exchange energy and data across a 13.56 MHz field. Below, two outcomes are contrasted. A secure lock runs an AES-128 challenge and response in which the lock and the card each prove a shared key that never crosses the air. A UID-only lock merely checks a serial number that any cheap NFC tool can copy, because a UID is a name tag, not a password.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ACCESS CONTROL · NFC DOOR LOCKS</text>
<text x="600" y="104" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="38" font-weight="700" fill="#291c0e">A tap is a conversation, not a name check</text>
<text x="600" y="140" text-anchor="middle" font-size="16" fill="#4f4f4f">A secure NFC lock runs an AES-128 challenge–response; a weak one just reads the card's UID.</text>

<!-- card -->
<rect x="150" y="212" width="212" height="134" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="182" y="250" width="52" height="40" rx="5" fill="#d4a755"/>
<rect x="182" y="304" width="140" height="9" rx="4" fill="#a9cccc"/>
<text x="256" y="378" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">RFID CARD</text>
<text x="256" y="399" text-anchor="middle" font-size="12.5" fill="#5c5c5c">carries encrypted data</text>

<!-- reader / lock -->
<rect x="836" y="196" width="150" height="182" rx="16" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="860" y="222" width="102" height="70" rx="7" fill="#eef5f5" stroke="#2c5454" stroke-width="1.6"/>
<circle cx="911" cy="257" r="17" fill="none" stroke="#2c5454" stroke-width="2.4"/>
<circle cx="911" cy="257" r="7" fill="#3d6b6b"/>
<rect x="884" y="312" width="54" height="20" rx="6" fill="#1f6f3a"/>
<text x="911" y="392" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">NFC DOOR LOCK</text>

<!-- field between -->
<text x="600" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">13.56 MHz field</text>
<line x1="372" y1="279" x2="824" y2="279" stroke="#3d6b6b" stroke-width="2.4" stroke-dasharray="7 7"/>
<polygon points="372,279 388,272 388,286" fill="#3d6b6b"/>
<polygon points="824,279 808,272 808,286" fill="#3d6b6b"/>
<path d="M 604 258 A 24 24 0 0 1 604 302" fill="none" stroke="#c39a5f" stroke-width="2.4"/>
<path d="M 620 250 A 34 34 0 0 1 620 310" fill="none" stroke="#c39a5f" stroke-width="2.4"/>
<path d="M 636 242 A 44 44 0 0 1 636 318" fill="none" stroke="#e4c98f" stroke-width="2.4"/>

<!-- secure panel -->
<rect x="120" y="452" width="480" height="168" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<rect x="120" y="452" width="480" height="8" rx="4" fill="#1f6f3a"/>
<circle cx="150" cy="500" r="14" fill="#1f6f3a"/>
<path d="M 143 500 L 148 506 L 158 494" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="176" y="505" font-size="17" font-weight="800" fill="#1f6f3a">SECURE LOCK</text>
<text x="148" y="546" font-size="13.5" fill="#333333">Runs an AES-128 challenge–response: the lock and</text>
<text x="148" y="570" font-size="13.5" fill="#333333">card each prove a shared key — it never crosses the air.</text>
<text x="148" y="600" font-size="12.5" fill="#2c5454">MIFARE DESFire EV2/EV3 · diversified keys</text>

<!-- insecure panel -->
<rect x="620" y="452" width="460" height="168" rx="14" fill="#f7ecec" stroke="#d8a9a9" stroke-width="2"/>
<rect x="620" y="452" width="460" height="8" rx="4" fill="#8b2d2d"/>
<circle cx="650" cy="500" r="14" fill="#8b2d2d"/>
<path d="M 644 494 L 656 506 M 656 494 L 644 506" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
<text x="676" y="505" font-size="17" font-weight="800" fill="#8b2d2d">UID-ONLY LOCK</text>
<text x="648" y="546" font-size="13.5" fill="#333333">Checks a serial number any cheap NFC tool can copy.</text>
<text x="648" y="570" font-size="13.5" fill="#333333">A UID is a name tag, not a password.</text>
<text x="648" y="600" font-size="12.5" fill="#8b2d2d">MIFARE Classic UID checks · cloneable</text>
</svg>
