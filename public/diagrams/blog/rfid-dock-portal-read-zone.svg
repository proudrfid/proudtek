<text x="318" y="216" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1" fill="#3d6b6b">READ ZONE</text>
<!-- antennas (2 per post, facing the gap) -->
<rect x="168" y="240" width="16" height="58" rx="3" fill="#4a5568"/>
<rect x="168" y="352" width="16" height="58" rx="3" fill="#4a5568"/>
<rect x="452" y="240" width="16" height="58" rx="3" fill="#4a5568"/>
<rect x="452" y="352" width="16" height="58" rx="3" fill="#4a5568"/>
<line x1="188" y1="252" x2="206" y2="252" stroke="#9ac0c0" stroke-width="2"/>
<line x1="188" y1="386" x2="206" y2="386" stroke="#9ac0c0" stroke-width="2"/>
<line x1="448" y1="252" x2="430" y2="252" stroke="#9ac0c0" stroke-width="2"/>
<line x1="448" y1="386" x2="430" y2="386" stroke="#9ac0c0" stroke-width="2"/>
<!-- pallet with tag dots -->
<rect x="278" y="300" width="94" height="74" rx="4" fill="#e7eaef" stroke="#9aa3ad" stroke-width="1.8"/>
<circle cx="298" cy="320" r="4.5" fill="#2c5454"/>
