<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID as a UDI data carrier — one read returns DI plus PI, no line of sight</title>
<desc id="d">An RFID inlay with a coil antenna and chip, encoded in GS1 element string format so the Device Identifier and Production Identifier return in a single read, broadcasts to a handheld reader that shows a successful UDI read. There is no line of sight requirement — the tag reads through packaging or a surgical drape. Side notes: HF suits close-range surgical instruments and implants, UHF suits capital equipment and bulk inventory, and dual marking is required — a printed human-readable UDI must accompany the tag. A persistence bar underneath: the UDI must stay readable for the device's full useful life, through sterilization, wash cycles and environmental wear.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
