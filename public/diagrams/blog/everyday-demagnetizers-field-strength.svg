<text x="96" y="358" font-size="12.5" fill="#5c5c5c">kids' magnetic tiles, promo menu magnets</text>
<rect x="560" y="332" width="20" height="20" rx="3" fill="#6d5a3a"/>
<rect x="586" y="332" width="20" height="20" rx="3" fill="#6d5a3a"/>
