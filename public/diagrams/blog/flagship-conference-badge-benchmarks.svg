<rect x="60" y="244" width="6" height="84" rx="3" fill="#3d6b6b"/>
<text x="92" y="278" text-anchor="start" font-size="17" font-weight="800" fill="#291c0e">NRF Big Show</text>
<text x="92" y="304" text-anchor="start" font-size="13" fill="#5c5c5c">Retail's Big Show · New York</text>
<text x="512" y="284" text-anchor="middle" font-size="24" font-weight="800" fill="#2c5454">~40K</text>
<text x="512" y="307" text-anchor="middle" font-size="12" fill="#8a8272">attendees</text>
