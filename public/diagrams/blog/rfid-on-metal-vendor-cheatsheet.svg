<rect x="439" y="182" width="226" height="26" rx="13" fill="#eaf3ed" stroke="#1f6f3a" stroke-width="1.4"/>
<text x="552" y="199" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">$1.00–$3.20 / tag · MOQ 5K–50K</text>
<text x="439" y="234" font-size="13" font-weight="600" fill="#291c0e">Mercury · Cargo Trak · Container Trak</text>
<text x="439" y="256" font-size="13" font-weight="600" fill="#291c0e">Slim Trak · Pico Plate</text>
<text x="439" y="284" font-size="12.5" fill="#4f4f4f">IP67/IP68 polycarbonate &amp; PPS shells</text>
<text x="439" y="306" font-size="12.5" fill="#4f4f4f">sweet spot: medical, containers, IT</text>

<rect x="792" y="130" width="356" height="212" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="812" y="166" font-size="17" font-weight="800" fill="#291c0e">Omni-ID</text>
<text x="1128" y="166" text-anchor="end" font-size="12.5" fill="#6d5a3a">Acuity Brands</text>
