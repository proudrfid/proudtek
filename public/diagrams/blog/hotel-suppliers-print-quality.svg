<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="pqTitle pqDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="pqTitle">Print and material: what to check</title>
  <desc id="pqDesc">Four print-quality checks around a hotel key card: evaluate printed samples under lobby lighting, check registration on double-sided prints, compare gloss, matte, soft-touch and spot-UV finishes, and run a damp-cloth rub test for ink adhesion. A swatch row shows the four finish options.</desc>

  <defs>
    <radialGradient id="pqBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="pqCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3d6b6b"/><stop offset="100%" stop-color="#2c5454"/></linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#pqBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="64" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="2" fill="#6d5a3a">PRINT &amp; MATERIAL: WHAT TO CHECK</text>
  <text x="600" y="94" text-anchor="middle" font-size="16" fill="#4f4f4f">The card is the first thing a guest holds — and the first read on your brand</text>

  <!-- Card glyph -->
  <g>
    <rect x="86" y="150" width="360" height="228" rx="18" fill="url(#pqCard)" stroke="#c39a5f" stroke-width="2.5"/>
    <rect x="110" y="176" width="150" height="26" rx="6" fill="#f4efe4" opacity="0.92"/>
    <rect x="110" y="214" width="220" height="10" rx="5" fill="#ffffff" opacity="0.55"/>
    <rect x="110" y="232" width="180" height="10" rx="5" fill="#ffffff" opacity="0.4"/>
    <rect x="360" y="300" width="56" height="44" rx="7" fill="#d4a755"/>
    <g fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round">
      <path d="M150 300 a11 11 0 0 1 0 26"/><path d="M162 292 a22 22 0 0 1 0 42"/>
    </g>
    <!-- magnifier over registration corner -->
    <circle cx="404" cy="188" r="30" fill="none" stroke="#291c0e" stroke-width="4"/>
    <line x1="424" y1="208" x2="446" y2="230" stroke="#291c0e" stroke-width="6" stroke-linecap="round"/>
    <path d="M392 188 h24 M404 176 v24" stroke="#8b2d2d" stroke-width="2.5"/>
    <text x="266" y="410" text-anchor="middle" font-size="13.5" fill="#6d5a3a">Print with your actual artwork — then inspect it</text>
  </g>

  <!-- 4 checks -->
  <g>
    <rect x="500" y="150" width="634" height="52" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="530" cy="176" r="14" fill="#1f6f3a"/><path d="M523 176 l5 5 l9 -11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="556" y="172" font-size="15.5" font-weight="800" fill="#291c0e">Samples under lobby lighting</text>
    <text x="556" y="191" font-size="12.5" fill="#4f4f4f">LED vs fluorescent shift color on PVC vs PET</text>

    <rect x="500" y="212" width="634" height="52" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="530" cy="238" r="14" fill="#1f6f3a"/><path d="M523 238 l5 5 l9 -11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="556" y="234" font-size="15.5" font-weight="800" fill="#291c0e">Registration on double-sided prints</text>
    <text x="556" y="253" font-size="12.5" fill="#4f4f4f">Misaligned back-panel text is the tell of a cheap line</text>

    <rect x="500" y="274" width="634" height="52" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="530" cy="300" r="14" fill="#1f6f3a"/><path d="M523 300 l5 5 l9 -11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="556" y="296" font-size="15.5" font-weight="800" fill="#291c0e">Finish options change perceived quality</text>
    <text x="556" y="315" font-size="12.5" fill="#4f4f4f">gloss · matte · soft-touch · spot-UV</text>

    <rect x="500" y="336" width="634" height="52" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="530" cy="362" r="14" fill="#8b2d2d"/><text x="530" y="367" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">!</text>
    <text x="556" y="358" font-size="15.5" font-weight="800" fill="#291c0e">Damp-cloth rub test for ink adhesion</text>
    <text x="556" y="377" font-size="12.5" fill="#4f4f4f">Poor adhesion = artwork worn off within weeks</text>
  </g>

  <!-- finish swatches -->
  <text x="600" y="440" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#6d5a3a">FOUR FINISHES, FOUR FEELS</text>
  <g>
    <rect x="150" y="458" width="210" height="86" rx="12" fill="#e9e2d4" stroke="#c39a5f" stroke-width="2"/><rect x="170" y="476" width="170" height="30" rx="6" fill="#ffffff"/><text x="255" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Gloss</text>
    <rect x="378" y="458" width="210" height="86" rx="12" fill="#ded7c9" stroke="#c39a5f" stroke-width="2"/><rect x="398" y="476" width="170" height="30" rx="6" fill="#e7e2d8"/><text x="483" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Matte</text>
    <rect x="606" y="458" width="210" height="86" rx="12" fill="#d8cfbe" stroke="#c39a5f" stroke-width="2"/><rect x="626" y="476" width="170" height="30" rx="6" fill="#cfc6b5"/><text x="711" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Soft-touch</text>
    <rect x="834" y="458" width="210" height="86" rx="12" fill="#e4dccb" stroke="#c39a5f" stroke-width="2"/><rect x="854" y="476" width="170" height="30" rx="6" fill="#f0e6c8"/><rect x="960" y="476" width="30" height="30" rx="4" fill="#d4a755"/><text x="939" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">Spot-UV</text>
  </g>

  <text x="600" y="596" text-anchor="middle" font-size="16.5" fill="#6d5a3a">A logo that surrenders to a damp cloth will not survive weeks in a guest's pocket.</text>
</svg>
