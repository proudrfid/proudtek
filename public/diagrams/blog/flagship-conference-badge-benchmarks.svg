<text x="92" y="210" text-anchor="start" font-size="13" fill="#5c5c5c">Consumer Electronics Show · Las Vegas</text>
<text x="512" y="190" text-anchor="middle" font-size="24" font-weight="800" fill="#2c5454">~115K</text>
<text x="512" y="213" text-anchor="middle" font-size="12" fill="#8a8272">attendees</text>
<line x1="612" y1="168" x2="612" y2="216" stroke="#ece5d6" stroke-width="1.5"/>
<text x="636" y="184" text-anchor="start" font-size="14" font-weight="600" fill="#291c0e">Cvent OnArrival · dual-chip PVC</text>
<text x="636" y="210" text-anchor="start" font-size="13" fill="#5c5c5c">Impinj room readers · sub-3-second</text>
<!-- row 2 NRF -->
