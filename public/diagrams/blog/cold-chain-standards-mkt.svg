<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Four standards, one logger dataset, and the mean kinetic temperature line</title>
<desc id="d">Across the top, four standards badges: WHO PQS category E006, CDC VFC, USP chapter 1079, and EU GDP 2013 slash C 343 slash 01. Below, a temperature chart shows the plus two to plus eight degrees Celsius safe band. A logged teal trace stays mostly in the band, with one excursion above plus eight degrees drawn in red. A gold dashed line marks the mean kinetic temperature, which stays inside the band despite the short excursion. The takeaway: continuous logger data feeds the MKT calculation so a short warm blip need not condemn the batch, and the logger produces the documentation each standard expects.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE DATASET · FOUR AUDITS</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">The standards want paperwork — the logger produces it</text>

<g font-size="14" font-weight="700" text-anchor="middle">
<rect x="96" y="138" width="196" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="194" y="160" fill="#2c5454">WHO PQS · E006</text>
<rect x="316" y="138" width="150" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="391" y="160" fill="#2c5454">CDC VFC</text>
<rect x="490" y="138" width="180" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="580" y="160" fill="#2c5454">USP &lt;1079&gt;</text>
<rect x="694" y="138" width="300" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="844" y="160" fill="#2c5454">EU GDP 2013/C 343/01</text>
</g>

<rect x="110" y="300" width="980" height="80" fill="#eef5f5"/>
<line x1="110" y1="300" x2="1090" y2="300" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="5 6"/>
<line x1="110" y1="380" x2="1090" y2="380" stroke="#3d6b6b" stroke-width="1.5" stroke-dasharray="5 6"/>
<text x="98" y="305" text-anchor="end" font-size="13.5" fill="#2c5454">+8°C</text>
<text x="98" y="385" text-anchor="end" font-size="13.5" fill="#2c5454">+2°C</text>

<line x1="470" y1="256" x2="470" y2="392" stroke="#d4a755" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="575" y1="256" x2="575" y2="392" stroke="#d4a755" stroke-width="1.5" stroke-dasharray="4 5"/>

<line x1="110" y1="345" x2="1090" y2="345" stroke="#c39a5f" stroke-width="2.5" stroke-dasharray="9 5"/>
<text x="1096" y="349" font-size="13.5" font-weight="700" fill="#6d5a3a">MKT</text>

<polyline points="120,352 200,348 280,354 360,348 430,352 470,308 505,272 540,272 575,308 615,352 700,348 780,354 860,348 940,352 1020,349 1088,351" fill="none" stroke="#3d6b6b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="452,320 470,308 505,272 540,272 575,308 592,320" fill="none" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="522" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">one excursion — flagged</text>

<text x="600" y="432" text-anchor="middle" font-size="14.5" fill="#291c0e">Continuous logger data feeds the mean kinetic temperature (MKT) calculation.</text>
<text x="600" y="458" text-anchor="middle" font-size="13" fill="#4f4f4f">MKT stays in range here, so a short warm blip need not condemn the batch.</text>

<g font-size="13">
<rect x="330" y="494" width="18" height="4" rx="2" fill="#3d6b6b"/>
<text x="356" y="502" fill="#4f4f4f">logged trace</text>
<rect x="480" y="494" width="18" height="4" rx="2" fill="#8b2d2d"/>
<text x="506" y="502" fill="#4f4f4f">excursion</text>
<rect x="622" y="494" width="18" height="4" rx="2" fill="#c39a5f"/>
<text x="648" y="502" fill="#4f4f4f">mean kinetic temperature</text>
</g>

<text x="600" y="560" text-anchor="middle" font-size="13.5" fill="#5c5c5c">RFID loggers don't replace the standards — they produce the documentation each one expects on demand.</text>
</svg>
