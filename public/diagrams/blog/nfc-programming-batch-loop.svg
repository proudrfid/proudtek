<rect x="318" y="268" width="138" height="10" rx="5" fill="#7fa3a3"/>
<rect x="318" y="290" width="96" height="10" rx="5" fill="#a3bfbf"/>
<text x="318" y="336" font-size="12.5" fill="#b7cccc">read row N → write tag</text>
<text x="318" y="358" font-size="12.5" fill="#b7cccc">→ verify → log → beep</text>
