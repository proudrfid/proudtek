<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="rcTitle rcDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="rcTitle">Weekly Google review volume climbing from 20 to 84 a week</title>
  <desc id="rcDesc">A line chart of weekly Google review volume across all six locations over 90 days. It starts at a baseline of about 20 reviews a week, crosses the 3x target of roughly 60 a week around day 60 when all four KPIs cleared their targets, and reaches 84 a week by day 90 — a 320% increase. Alongside the volume climb, the average star rating rose from 4.2 to 4.6 and the cumulative 90-day review count went from 870 to 3,640. A footnote: 11% of reviews now mention a server by name, up from under 1% before.</desc>
  <defs>
    <radialGradient id="rcBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="rcArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1fcefb" stop-opacity="0.28"/><stop offset="100%" stop-color="#1fcefb" stop-opacity="0.02"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#rcBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="1.2" fill="#6d5a3a">REVIEW VOLUME: 20 → 84 A WEEK (+320%)</text>

  <!-- gridlines + y labels -->
  <g stroke="#efe6d5" stroke-width="1">
    <line x1="150" y1="150" x2="1100" y2="150"/>
    <line x1="150" y1="218" x2="1100" y2="218"/>
    <line x1="150" y1="286" x2="1100" y2="286"/>
    <line x1="150" y1="354" x2="1100" y2="354"/>
    <line x1="150" y1="422" x2="1100" y2="422"/>
  </g>
  <g font-size="13" fill="#6d5a3a" text-anchor="end">
    <text x="136" y="155">100</text>
    <text x="136" y="223">80</text>
    <text x="136" y="291">60</text>
    <text x="136" y="359">40</text>
    <text x="136" y="427">20</text>
    <text x="136" y="495">0</text>
  </g>
  <text x="70" y="330" text-anchor="middle" font-size="13" fill="#8a7550" transform="rotate(-90 70 330)">reviews / week</text>

  <!-- 3x target line -->
  <line x1="150" y1="286" x2="1100" y2="286" stroke="#b8873f" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="1094" y="278" text-anchor="end" font-size="13" font-weight="700" fill="#b8873f">3× target ≈ 60/wk</text>

  <!-- axes -->
  <line x1="150" y1="150" x2="150" y2="490" stroke="#d9cbb0" stroke-width="1.5"/>
  <line x1="150" y1="490" x2="1100" y2="490" stroke="#d9cbb0" stroke-width="1.5"/>

  <!-- area + climb line -->
  <polygon points="150,422 336,391 522,344 708,283 894,238 1080,204 1080,490 150,490" fill="url(#rcArea)"/>
  <polyline points="150,422 336,391 522,344 708,283 894,238 1080,204" fill="none" stroke="#177a92" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- markers -->
  <circle cx="150" cy="422" r="7" fill="#c39a5f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="708" cy="283" r="9" fill="#1fcefb" stroke="#ffffff" stroke-width="3"/>
  <circle cx="1080" cy="204" r="8" fill="#1fcefb" stroke="#ffffff" stroke-width="3"/>

  <!-- baseline callout -->
  <text x="162" y="414" font-size="16" font-weight="800" fill="#291c0e">~20/wk</text>
  <text x="162" y="437" font-size="12.5" fill="#6d5a3a">baseline</text>

  <!-- day 60 callout -->
  <text x="708" y="255" text-anchor="middle" font-size="12.5" font-weight="700" fill="#177a92">day 60</text>
  <text x="708" y="238" text-anchor="middle" font-size="12" fill="#6d5a3a">all 4 KPIs cleared</text>

  <!-- day 90 callout box -->
  <rect x="882" y="120" width="212" height="46" rx="12" fill="#eaf9fe" stroke="#1fcefb" stroke-width="2"/>
  <text x="988" y="149" text-anchor="middle" font-size="17" font-weight="800" fill="#177a92">84/wk by day 90</text>
  <line x1="1020" y1="166" x2="1078" y2="196" stroke="#1fcefb" stroke-width="2"/>

  <!-- x labels -->
  <g font-size="13.5" fill="#6d5a3a" text-anchor="middle">
    <text x="150" y="512">Baseline</text>
    <text x="336" y="512">Wk 2</text>
    <text x="522" y="512">Wk 4</text>
    <text x="708" y="512">Day 60</text>
    <text x="894" y="512">Wk 10</text>
    <text x="1080" y="512">Day 90</text>
  </g>

  <!-- side stat chips -->
  <rect x="150" y="536" width="300" height="44" rx="12" fill="#e9f1ea"/>
  <text x="172" y="564" font-size="17" font-weight="800" fill="#1f6f3a">4.2 → 4.6 ★</text>
  <text x="300" y="564" font-size="13.5" fill="#3c5c46">average rating</text>
  <rect x="470" y="536" width="330" height="44" rx="12" fill="#fbf8f2" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="492" y="564" font-size="17" font-weight="800" fill="#291c0e">870 → 3,640</text>
  <text x="640" y="564" font-size="13.5" fill="#6d5a3a">cumulative, 90 days</text>
  <rect x="820" y="536" width="280" height="44" rx="12" fill="#eaf9fe"/>
  <text x="842" y="564" font-size="17" font-weight="800" fill="#177a92">11%</text>
  <text x="892" y="564" font-size="13.5" fill="#0d3f4d">now name a server (was &lt;1%)</text>

  <text x="600" y="612" text-anchor="middle" font-size="14.5" fill="#6d5a3a">Nobody changed the recipes. They changed who got asked — and the happy majority finally showed up in the rating.</text>
</svg>
