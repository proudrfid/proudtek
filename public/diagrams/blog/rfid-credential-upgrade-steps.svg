<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Upgrading from clonable to clone-proof cards in five steps</title>
<desc id="d">A five-step upgrade flow. Step one, Audit: map the card technology in use on site. Step two, Select: pick an AES-128 credential. Step three, Reflash: firmware-update the existing readers. Step four, Reissue: distribute new encrypted cards. Step five, Revoke: disable legacy card types in the access-control software. A closing note explains that many HID, STid and ASSA ABLOY readers move to DESFire EV3 by firmware alone, and that revoking the legacy types is the step that actually closes the door on cloned old cards.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE UPGRADE PATH</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Well-trodden and mostly firmware — the budget meeting is the harder part.</text>

<!-- step 1 -->
<rect x="40" y="210" width="192" height="148" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="136" cy="248" r="17" fill="#3d6b6b"/>
<text x="136" y="254" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
<text x="136" y="300" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Audit</text>
<text x="136" y="324" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Map the card</text>
<text x="136" y="342" text-anchor="middle" font-size="12.5" fill="#5c5c5c">tech in use</text>
<line x1="236" y1="284" x2="264" y2="284" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="264,278 272,284 264,290" fill="#3d6b6b"/>
<!-- step 2 -->
<rect x="272" y="210" width="192" height="148" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="368" cy="248" r="17" fill="#3d6b6b"/>
<text x="368" y="254" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
<text x="368" y="300" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Select</text>
<text x="368" y="324" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Pick an AES-128</text>
<text x="368" y="342" text-anchor="middle" font-size="12.5" fill="#5c5c5c">credential</text>
<line x1="468" y1="284" x2="496" y2="284" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="496,278 504,284 496,290" fill="#3d6b6b"/>
<!-- step 3 -->
<rect x="504" y="210" width="192" height="148" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="600" cy="248" r="17" fill="#3d6b6b"/>
<text x="600" y="254" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
<text x="600" y="300" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Reflash</text>
<text x="600" y="324" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Firmware-update</text>
<text x="600" y="342" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the readers</text>
<line x1="700" y1="284" x2="728" y2="284" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="728,278 736,284 728,290" fill="#3d6b6b"/>
<!-- step 4 -->
<rect x="736" y="210" width="192" height="148" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<circle cx="832" cy="248" r="17" fill="#3d6b6b"/>
<text x="832" y="254" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4</text>
<text x="832" y="300" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Reissue</text>
<text x="832" y="324" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Distribute new</text>
<text x="832" y="342" text-anchor="middle" font-size="12.5" fill="#5c5c5c">encrypted cards</text>
<line x1="928" y1="284" x2="956" y2="284" stroke="#3d6b6b" stroke-width="2.5"/>
<polygon points="956,278 964,284 956,290" fill="#3d6b6b"/>
<!-- step 5 -->
<rect x="968" y="210" width="192" height="148" rx="12" fill="#e8f2ea" stroke="#bcdcc7" stroke-width="1.6"/>
<circle cx="1064" cy="248" r="17" fill="#1f6f3a"/>
<text x="1064" y="254" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">5</text>
<text x="1064" y="300" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Revoke</text>
<text x="1064" y="324" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Disable legacy</text>
<text x="1064" y="342" text-anchor="middle" font-size="12.5" fill="#5c5c5c">types in software</text>

<!-- note -->
<rect x="40" y="404" width="1120" height="150" rx="12" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<text x="72" y="444" font-size="15" font-weight="800" fill="#2c5454">Mostly firmware, not forklifts</text>
<text x="72" y="474" font-size="13.5" fill="#333333">Many HID, STid and ASSA ABLOY readers move to DESFire EV3 by firmware update alone — no hardware swap, which is what</text>
<text x="72" y="500" font-size="13.5" fill="#333333">keeps the upgrade affordable. The step that actually closes the door is the last one: until the legacy card types are</text>
<text x="72" y="526" font-size="13.5" fill="#333333">disabled in software, a cloned old card keeps working no matter how good the new credentials are.</text>
</svg>
