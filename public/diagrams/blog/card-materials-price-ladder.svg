<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">2026 per-card price ranges by material and chip, FOB China factory</title>
<desc id="d">Range chart of 2026 reference prices per card, chip included, at 5K to 10K MOQ unless noted. FSC paper with NTAG 213: 10 to 22 cents. PVC with NTAG 213: 18 to 32 cents. Recycled PVC with NTAG 215: 25 to 45 cents. PET with MIFARE DESFire EV3 4K: 95 cents to 1 dollar 65. FSC wood veneer with NTAG 424 DNA: 1 dollar 50 to 3 dollars 50 at 1K to 5K MOQ. Footnotes: US and EU aggregators add 20 to 40 percent, and much of the spread is the chip, not the plastic — a DESFire or NTAG 424 DNA costs multiples of a basic NTAG 213.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">2026 REFERENCE PRICES · FOB CHINA FACTORY</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">What each material actually costs</text>

<line x1="300" y1="150" x2="300" y2="572" stroke="#e6dfd2" stroke-width="1.5"/>
<line x1="522" y1="150" x2="522" y2="572" stroke="#e6dfd2" stroke-width="1.5"/>
<line x1="744" y1="150" x2="744" y2="572" stroke="#e6dfd2" stroke-width="1.5"/>
<line x1="966" y1="150" x2="966" y2="572" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="300" y="594" text-anchor="middle" font-size="12.5" fill="#5c5c5c">$0</text>
<text x="522" y="594" text-anchor="middle" font-size="12.5" fill="#5c5c5c">$1</text>
<text x="744" y="594" text-anchor="middle" font-size="12.5" fill="#5c5c5c">$2</text>
<text x="966" y="594" text-anchor="middle" font-size="12.5" fill="#5c5c5c">$3</text>

<text x="286" y="188" text-anchor="end" font-size="14" font-weight="600" fill="#291c0e">FSC paper + NTAG 213</text>
<rect x="322" y="170" width="27" height="26" rx="13" fill="#7d7060"/>
<text x="363" y="188" font-size="13.5" font-weight="700" fill="#7d7060">$0.10–$0.22</text>

<text x="286" y="272" text-anchor="end" font-size="14" font-weight="600" fill="#291c0e">PVC + NTAG 213</text>
<rect x="340" y="254" width="31" height="26" rx="13" fill="#3d6b6b"/>
<text x="385" y="272" font-size="13.5" font-weight="700" fill="#3d6b6b">$0.18–$0.32</text>

<text x="286" y="356" text-anchor="end" font-size="14" font-weight="600" fill="#291c0e">Recycled PVC + NTAG 215</text>
<rect x="356" y="338" width="44" height="26" rx="13" fill="#6b9494"/>
<text x="414" y="356" font-size="13.5" font-weight="700" fill="#527c7c">$0.25–$0.45</text>

<text x="286" y="440" text-anchor="end" font-size="14" font-weight="600" fill="#291c0e">PET + DESFire EV3 4K</text>
<rect x="511" y="422" width="155" height="26" rx="13" fill="#4a5568"/>
<text x="680" y="440" font-size="13.5" font-weight="700" fill="#4a5568">$0.95–$1.65</text>

<text x="286" y="524" text-anchor="end" font-size="14" font-weight="600" fill="#291c0e">FSC wood + NTAG 424 DNA</text>
<rect x="633" y="506" width="444" height="26" rx="13" fill="#7a5636"/>
<text x="1065" y="524" text-anchor="end" font-size="13.5" font-weight="700" fill="#ffffff">$1.50–$3.50</text>
<text x="633" y="552" font-size="12.5" fill="#5c5c5c">(1K–5K MOQ — premium brand-protection tier)</text>

<text x="600" y="620" text-anchor="middle" font-size="13" fill="#5c5c5c">5K–10K MOQ unless noted · chip included · US/EU aggregators add 20–40%</text>
<text x="600" y="644" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Much of the spread is the chip, not the plastic — a DESFire or NTAG 424 DNA costs multiples of a basic NTAG 213.</text>
