<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Branded NFC card platforms versus white-label custom wood</title>
<desc id="d">A comparison table. TAPiTAG: 73 dollars per card, no minimum order with in-house design, best for solo and small teams, platform-owned data. V1CE: 40 to 80 dollars, multi-link platform with lead capture, analytics and tree-planting, best for individuals, platform data. Mobilo: platform tier pricing, CRM integrations with Salesforce and HubSpot plus team governance, best for sales teams, platform data. Popl: from 4.99 dollars for PVC scaling up, app editor and broad CRM, best for creators and small teams, platform data. White-label custom wood, the recommended enterprise option: 5 to 15 dollars at a minimum order of 200, points to your own subdomain with no per-seat fees on FSC-certified wood, best for enterprises, with full data ownership.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PLATFORM CARD vs WHITE-LABEL WOOD</text>
<text x="600" y="78" text-anchor="middle" font-size="16" fill="#4f4f4f">Branded platforms bundle software; white-label gives you the card and the data.</text>

<!-- header -->
<rect x="64" y="100" width="1072" height="36" rx="8" fill="#f3ede0"/>
<text x="80" y="124" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">VENDOR</text>
<text x="264" y="124" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">PRICE / CARD</text>
<text x="410" y="124" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">MODEL</text>
<text x="726" y="124" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">BEST FOR</text>
<text x="946" y="124" font-size="12" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">DATA</text>
<line x1="250" y1="100" x2="250" y2="520" stroke="#efe9dc" stroke-width="1.3"/>
<line x1="400" y1="100" x2="400" y2="520" stroke="#efe9dc" stroke-width="1.3"/>
<line x1="716" y1="100" x2="716" y2="520" stroke="#efe9dc" stroke-width="1.3"/>
<line x1="936" y1="100" x2="936" y2="520" stroke="#efe9dc" stroke-width="1.3"/>

<!-- TAPiTAG -->
<text x="80" y="172" font-size="15" font-weight="800" fill="#291c0e">TAPiTAG</text>
<text x="264" y="172" font-size="14" font-weight="700" fill="#2c5454">$73</text>
<text x="410" y="166" font-size="12.5" fill="#3a2f20">No MOQ, in-house design,</text>
<text x="410" y="184" font-size="12.5" fill="#3a2f20">single-card customization</text>
<text x="726" y="172" font-size="12.5" fill="#3a2f20">Solo &amp; small teams</text>
<text x="946" y="172" font-size="12.5" fill="#6b6b6b">Platform</text>
<line x1="64" y1="192" x2="1136" y2="192" stroke="#efe9dc" stroke-width="1.2"/>

<!-- V1CE -->
<text x="80" y="228" font-size="15" font-weight="800" fill="#291c0e">V1CE</text>
<text x="264" y="228" font-size="14" font-weight="700" fill="#2c5454">$40–80</text>
<text x="410" y="222" font-size="12.5" fill="#3a2f20">Multi-link, lead capture,</text>
<text x="410" y="240" font-size="12.5" fill="#3a2f20">analytics · tree-planting</text>
<text x="726" y="228" font-size="12.5" fill="#3a2f20">Individuals</text>
<text x="946" y="228" font-size="12.5" fill="#6b6b6b">Platform</text>
<line x1="64" y1="248" x2="1136" y2="248" stroke="#efe9dc" stroke-width="1.2"/>

<!-- Mobilo -->
<text x="80" y="284" font-size="15" font-weight="800" fill="#291c0e">Mobilo</text>
<text x="264" y="284" font-size="12.5" font-weight="700" fill="#8a8a8a">platform tier</text>
<text x="410" y="278" font-size="12.5" fill="#3a2f20">CRM: Salesforce, HubSpot;</text>
<text x="410" y="296" font-size="12.5" fill="#3a2f20">team governance</text>
<text x="726" y="284" font-size="12.5" fill="#3a2f20">Sales teams</text>
<text x="946" y="284" font-size="12.5" fill="#6b6b6b">Platform</text>
<line x1="64" y1="304" x2="1136" y2="304" stroke="#efe9dc" stroke-width="1.2"/>

<!-- Popl -->
<text x="80" y="340" font-size="15" font-weight="800" fill="#291c0e">Popl</text>
<text x="264" y="340" font-size="14" font-weight="700" fill="#2c5454">from $4.99*</text>
<text x="410" y="334" font-size="12.5" fill="#3a2f20">App editor, broad CRM</text>
<text x="410" y="352" font-size="12.5" fill="#3a2f20">integrations</text>
<text x="726" y="340" font-size="12.5" fill="#3a2f20">Creators, small teams</text>
<text x="946" y="340" font-size="12.5" fill="#6b6b6b">Platform</text>
<line x1="64" y1="360" x2="1136" y2="360" stroke="#efe9dc" stroke-width="1.2"/>

<!-- White-label (highlight) -->
<rect x="64" y="360" width="1072" height="80" rx="10" fill="#e9f2ec" stroke="#94bfa5" stroke-width="1.8"/>
<line x1="250" y1="360" x2="250" y2="440" stroke="#cfe3dd" stroke-width="1.3"/>
<line x1="400" y1="360" x2="400" y2="440" stroke="#cfe3dd" stroke-width="1.3"/>
<line x1="716" y1="360" x2="716" y2="440" stroke="#cfe3dd" stroke-width="1.3"/>
<line x1="936" y1="360" x2="936" y2="440" stroke="#cfe3dd" stroke-width="1.3"/>
<text x="80" y="392" font-size="15" font-weight="800" fill="#1b4332">White-label wood</text>
<rect x="80" y="404" width="120" height="22" rx="11" fill="#2d6a4f"/>
<text x="140" y="420" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">RECOMMENDED</text>
<text x="264" y="392" font-size="14" font-weight="800" fill="#1b4332">$5–15</text>
<text x="264" y="412" font-size="12" fill="#3a5a49">@ MOQ 200</text>
<text x="410" y="392" font-size="12.5" fill="#26402f">Your subdomain, no per-seat</text>
<text x="410" y="410" font-size="12.5" fill="#26402f">fees · FSC bamboo/hardwood</text>
<text x="726" y="396" font-size="12.5" font-weight="700" fill="#1b4332">Enterprises</text>
<text x="946" y="396" font-size="13" font-weight="800" fill="#1b4332">FULL — yours</text>

<text x="80" y="470" font-size="12" fill="#8a8a8a">* Popl's $4.99 is the PVC entry price; wood and metal scale higher.</text>
<rect x="64" y="486" width="1072" height="54" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.8"/>
<text x="600" y="510" text-anchor="middle" font-size="14.5" font-weight="800" fill="#8a6a2f">For 100+ cards, white-label custom wood typically lands 50–70% lower 3-year TCO —</text>
<text x="600" y="530" text-anchor="middle" font-size="13.5" fill="#6d5a3a">full data ownership, no per-seat fees, no vendor-sunset risk.</text>

<text x="600" y="576" text-anchor="middle" font-size="13.5" fill="#4f4f4f">For 1–25 cards, a branded platform wins on time-to-value; at scale, white-label wins on cost and control.</text>
</svg>
