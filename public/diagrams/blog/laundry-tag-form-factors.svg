<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">PPS button, silicone strip, textile label — match the tag to the fabric</title>
<desc id="d">Three form factors. PPS: a rigid 16-22 millimetre button, heat-sealed, sewn or riveted, up to 200 degrees Celsius and 200-plus cycles, excellent against acids and bleach — best for uniforms, workwear and scrubs. Silicone: a flexible 45 by 15 by 3 millimetre strip in medical-grade encapsulation, 180 degrees, 150-200 cycles — preferred for towels, robes and patient gowns. Textile: a sew-in woven label, 50 by 15 by 0.8 millimetres, 60-90 degrees, 50-100 cycles — for lightweight garments where a rigid tag would be felt.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MATCH THE TAG TO THE FABRIC</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Three bodies for the same chip — built for different lives</text>

<rect x="52" y="130" width="356" height="440" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="230" y="170" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">PPS BUTTON</text>
<circle cx="230" cy="250" r="46" fill="#ffffff" stroke="#c39a5f" stroke-width="3"/>
<circle cx="230" cy="250" r="30" fill="none" stroke="#c39a5f" stroke-width="1.8"/>
<circle cx="230" cy="250" r="6" fill="#c39a5f"/>
<text x="230" y="330" text-anchor="middle" font-size="12.5" fill="#4f4f4f">rigid disc · 16–22 mm diameter</text>
<text x="230" y="366" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">200 °C · 200+ cycles</text>
<text x="230" y="394" text-anchor="middle" font-size="12.5" fill="#4f4f4f">heat-seal · sew-in · rivet</text>
<text x="230" y="418" text-anchor="middle" font-size="12.5" fill="#4f4f4f">shrugs off acids and bleach</text>
<rect x="102" y="448" width="256" height="40" rx="20" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="230" y="473" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">uniforms · workwear · scrubs</text>
<text x="230" y="530" text-anchor="middle" font-size="12.5" fill="#4f4f4f">$0.15–0.30 at MOQ 10K</text>

<rect x="422" y="130" width="356" height="440" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="600" y="170" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">SILICONE STRIP</text>
<rect x="500" y="222" width="200" height="56" rx="26" fill="#ffffff" stroke="#3d6b6b" stroke-width="3"/>
<rect x="524" y="240" width="152" height="20" rx="10" fill="#eef5f5"/>
<circle cx="600" cy="250" r="6" fill="#2c5454"/>
<text x="600" y="330" text-anchor="middle" font-size="12.5" fill="#4f4f4f">flexible · 45 × 15 × 3 mm</text>
<text x="600" y="366" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">180 °C · 150–200 cycles</text>
<text x="600" y="394" text-anchor="middle" font-size="12.5" fill="#4f4f4f">sew-in or heat-press</text>
<text x="600" y="418" text-anchor="middle" font-size="12.5" fill="#4f4f4f">bends with the fabric, kind to skin</text>
<rect x="472" y="448" width="256" height="40" rx="20" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="600" y="473" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">towels · robes · patient gowns</text>
<text x="600" y="530" text-anchor="middle" font-size="12.5" fill="#4f4f4f">$0.20–0.40 at MOQ 10K</text>

<rect x="792" y="130" width="356" height="440" rx="14" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="970" y="170" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">TEXTILE LABEL</text>
<rect x="862" y="228" width="216" height="44" rx="4" fill="#ffffff" stroke="#c39a5f" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M 874 250 h 192" stroke="#e4c98f" stroke-width="1.5"/>
<circle cx="970" cy="250" r="5" fill="#c39a5f"/>
<text x="970" y="330" text-anchor="middle" font-size="12.5" fill="#4f4f4f">sew-in like a care label · 50 × 15 × 0.8 mm</text>
<text x="970" y="366" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">60–90 °C · 50–100 cycles</text>
<text x="970" y="394" text-anchor="middle" font-size="12.5" fill="#4f4f4f">thinnest and most flexible</text>
<text x="970" y="418" text-anchor="middle" font-size="12.5" fill="#4f4f4f">invisible to the wearer</text>
<rect x="842" y="448" width="256" height="40" rx="20" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="970" y="473" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d5a3a">lightweight garments · fine linens</text>
<text x="970" y="530" text-anchor="middle" font-size="12.5" fill="#4f4f4f">$0.10–0.20 at MOQ 10K</text>

<text x="600" y="626" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Mixing types in one laundry is normal — the software doesn't care, and the fabrics will thank you.</text>
</svg>
