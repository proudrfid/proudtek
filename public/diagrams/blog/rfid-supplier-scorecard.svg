<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A five-dimension scorecard for evaluating RFID supplier RFP responses</title>
<desc id="d">Five evaluation dimensions to weigh instead of price alone. Price at your own volume tier: find the outliers. Total landed cost including freight, customs and a 25 to 30 percent tariff differential. Capacity-to-need ratio: 2 to 5 times headroom flexes, but a plant at 90 percent or more capacity will deprioritise you. Reference quality: three references that pass a phone screen. Certification-to-claim: cross-check at the issuer because 5 to 15 percent of certificates are fake or expired.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EVALUATING RESPONSES · SCORE ON FIVE</text>
<text x="600" y="99" text-anchor="middle" font-size="34" font-family="Lora, Georgia, serif" font-weight="700" fill="#291c0e">Score the response, not just the price</text>
<text x="600" y="131" text-anchor="middle" font-size="16" fill="#4f4f4f">A 5% price win vanishes with one QC miss or one slipped shipment — weigh all five.</text>
<text x="112" y="182" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#5c5c5c">DIMENSION</text>
<text x="360" y="182" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#5c5c5c">WHAT TO CHECK</text>
<text x="1007" y="182" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#5c5c5c">TARGET / FLAG</text>
<rect x="90" y="196" width="1020" height="58" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="90" y="196" width="8" height="58" rx="4" fill="#3d6b6b"/>
<text x="114" y="231" font-size="15" font-weight="700" fill="#291c0e">Price at your tier</text>
<text x="360" y="231" font-size="13" fill="#4f4f4f">Plot every bid at YOUR volume — not the supplier's preferred tier.</text>
<rect x="915" y="210" width="184" height="30" rx="15" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/><text x="1007" y="230" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5454">find the outliers</text>
<rect x="90" y="266" width="1020" height="58" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="90" y="266" width="8" height="58" rx="4" fill="#4a5568"/>
<text x="114" y="301" font-size="15" font-weight="700" fill="#291c0e">Total landed cost</text>
<text x="360" y="301" font-size="13" fill="#4f4f4f">Add freight, customs and a 25-30% tariff differential before comparing.</text>
<rect x="915" y="280" width="184" height="30" rx="15" fill="#eef1f4" stroke="#c7cfd9" stroke-width="1.2"/><text x="1007" y="300" text-anchor="middle" font-size="12.5" font-weight="800" fill="#4a5568">all-in cost</text>
<rect x="90" y="336" width="1020" height="58" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="90" y="336" width="8" height="58" rx="4" fill="#c39a5f"/>
<text x="114" y="371" font-size="15" font-weight="700" fill="#291c0e">Capacity-to-need</text>
<text x="360" y="371" font-size="13" fill="#4f4f4f">2-5× headroom flexes; a plant already at 90%+ deprioritizes you.</text>
<rect x="915" y="350" width="184" height="30" rx="15" fill="#fbeeee" stroke="#e9c9c9" stroke-width="1.2"/><text x="1007" y="370" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8b2d2d">90%+ = risk</text>
<rect x="90" y="406" width="1020" height="58" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="90" y="406" width="8" height="58" rx="4" fill="#2d6a4f"/>
<text x="114" y="441" font-size="15" font-weight="700" fill="#291c0e">Reference quality</text>
<text x="360" y="441" font-size="13" fill="#4f4f4f">Three that pass a phone-screen beat thirty unnamed logos.</text>
<rect x="915" y="420" width="184" height="30" rx="15" fill="#eaf3ec" stroke="#c5ddc9" stroke-width="1.2"/><text x="1007" y="440" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2d6a4f">3 phone calls</text>
<rect x="90" y="476" width="1020" height="58" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<rect x="90" y="476" width="8" height="58" rx="4" fill="#8b2d2d"/>
<text x="114" y="511" font-size="15" font-weight="700" fill="#291c0e">Cert-to-claim</text>
<text x="360" y="511" font-size="13" fill="#4f4f4f">Cross-check at the issuer's own site before you shortlist.</text>
<rect x="915" y="490" width="184" height="30" rx="15" fill="#fbeeee" stroke="#e9c9c9" stroke-width="1.2"/><text x="1007" y="510" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8b2d2d">5-15% fake</text>
<text x="600" y="588" text-anchor="middle" font-size="13.5" fill="#4f4f4f">The cheapest bid is rarely the best — one quality-control failure erases a 5% price edge.</text>
</svg>
