<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="anaTitle anaDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="anaTitle">How a smart shelf sees the floor</title>
  <desc id="anaDesc">Left: a shelving cross-section. A low-power UHF reader mounted under the shelf, powered over store ethernet (PoE), scans upward through the shelf material to read an EPC Gen2 inlay on every item; quiet zones use a single antenna and busy zones a multi-antenna mesh. Right: every scan captures four event types — item placed, item removed, item moved between shelves, and prolonged dwell without a sale, which flags a merchandising issue. Bottom: shelf events flow from shelf reader to store gateway to cloud platform to the staff app and ERP or POS, with 30 to 90 seconds of latency.</desc>
  <defs>
    <radialGradient id="anaBg" cx="50%" cy="22%" r="88%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="anaDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#291c0e"/>
      <stop offset="100%" stop-color="#6c5127"/>
    </linearGradient>
    <marker id="anaArrow" markerWidth="10" markerHeight="10" refX="3" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#d4a755"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#anaBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="2.5" fill="#6d5a3a">HOW A SMART SHELF SEES THE FLOOR</text>
  <text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">UHF readers under the shelf count every item in near-real-time</text>

  <!-- ===================== Left panel: shelf cross-section ===================== -->
  <rect x="56" y="112" width="604" height="366" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <!-- posts -->
  <rect x="150" y="158" width="14" height="286" rx="4" fill="#c39a5f"/>
  <rect x="392" y="158" width="14" height="286" rx="4" fill="#c39a5f"/>
  <!-- shelves -->
  <rect x="150" y="236" width="256" height="12" rx="4" fill="#c39a5f"/>
  <rect x="150" y="330" width="256" height="12" rx="4" fill="#c39a5f"/>
  <!-- top items -->
  <rect x="172" y="204" width="56" height="30" rx="6" fill="#ffffff" stroke="#291c0e" stroke-width="3"/>
  <rect x="246" y="204" width="56" height="30" rx="6" fill="#efe0bf" stroke="#291c0e" stroke-width="3"/>
  <rect x="320" y="204" width="56" height="30" rx="6" fill="#ffffff" stroke="#291c0e" stroke-width="3"/>
  <circle cx="200" cy="219" r="4" fill="#1fcefb"/><circle cx="274" cy="219" r="4" fill="#1fcefb"/><circle cx="348" cy="219" r="4" fill="#1fcefb"/>
  <!-- bottom items -->
  <rect x="172" y="298" width="56" height="30" rx="6" fill="#efe0bf" stroke="#291c0e" stroke-width="3"/>
  <rect x="246" y="298" width="56" height="30" rx="6" fill="#ffffff" stroke="#291c0e" stroke-width="3"/>
  <rect x="320" y="298" width="56" height="30" rx="6" fill="#efe0bf" stroke="#291c0e" stroke-width="3"/>
  <circle cx="200" cy="313" r="4" fill="#1fcefb"/><circle cx="274" cy="313" r="4" fill="#1fcefb"/><circle cx="348" cy="313" r="4" fill="#1fcefb"/>
  <!-- reader under top shelf + upward arcs -->
  <g fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M256 254 a22 22 0 0 1 44 0"/>
    <path d="M242 254 a38 38 0 0 1 72 0"/>
  </g>
  <rect x="232" y="256" width="92" height="34" rx="8" fill="#eaf9fe" stroke="#1fcefb" stroke-width="2.5"/>
  <text x="278" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#177a92">UHF reader</text>
  <!-- callouts -->
  <g>
    <circle cx="444" cy="212" r="12" fill="#c39a5f"/><text x="444" y="217" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text>
    <text x="464" y="210" font-size="14.5" font-weight="700" fill="#291c0e">Under-shelf UHF reader</text>
    <text x="464" y="230" font-size="13.5" fill="#6d5a3a">PoE over store ethernet</text>
    <circle cx="444" cy="288" r="12" fill="#c39a5f"/><text x="444" y="293" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text>
    <text x="464" y="286" font-size="14.5" font-weight="700" fill="#291c0e">Antenna scans upward</text>
    <text x="464" y="306" font-size="13.5" fill="#6d5a3a">through the shelf material</text>
    <circle cx="444" cy="364" r="12" fill="#c39a5f"/><text x="444" y="369" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text>
    <text x="464" y="362" font-size="14.5" font-weight="700" fill="#291c0e">Zoned antenna coverage</text>
    <text x="464" y="382" font-size="13.5" fill="#6d5a3a">single quiet · mesh busy</text>
  </g>

  <!-- ===================== Right panel: event types ===================== -->
  <rect x="684" y="112" width="460" height="366" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="914" y="150" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1" fill="#6d5a3a">EVERY SCAN CAPTURES</text>
  <!-- row: placed -->
  <g>
    <circle cx="732" cy="196" r="18" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2.5"/>
    <path d="M732 205 l0 -16 M725 196 l7 -7 l7 7" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="766" y="192" font-size="16" font-weight="700" fill="#291c0e">Item placed</text>
    <text x="766" y="212" font-size="13.5" fill="#6d5a3a">stock added to shelf</text>
  </g>
  <!-- row: removed -->
  <g>
    <circle cx="732" cy="260" r="18" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2.5"/>
    <path d="M732 251 l0 16 M725 260 l7 7 l7 -7" fill="none" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="766" y="256" font-size="16" font-weight="700" fill="#291c0e">Item removed</text>
    <text x="766" y="276" font-size="13.5" fill="#6d5a3a">picked up or sold</text>
  </g>
  <!-- row: moved -->
  <g>
    <circle cx="732" cy="324" r="18" fill="#eaf9fe" stroke="#1fcefb" stroke-width="2.5"/>
    <path d="M724 318 h16 l-4 -4 M740 330 h-16 l4 4" fill="none" stroke="#177a92" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="766" y="320" font-size="16" font-weight="700" fill="#291c0e">Item moved</text>
    <text x="766" y="340" font-size="13.5" fill="#6d5a3a">between shelves</text>
  </g>
  <!-- row: dwell -->
  <g>
    <circle cx="732" cy="388" r="18" fill="#fbf1dc" stroke="#c39a5f" stroke-width="2.5"/>
    <circle cx="732" cy="388" r="9" fill="none" stroke="#6d5a3a" stroke-width="2.5"/>
    <path d="M732 388 l0 -6 M732 388 l5 3" fill="none" stroke="#6d5a3a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="766" y="384" font-size="16" font-weight="700" fill="#291c0e">Prolonged dwell</text>
    <text x="766" y="404" font-size="13.5" fill="#6d5a3a">no sale — merchandising flag</text>
  </g>

  <!-- ===================== Bottom band: data flow ===================== -->
  <rect x="56" y="500" width="1088" height="96" rx="16" fill="url(#anaDark)"/>
  <g text-anchor="middle" fill="#f4efe4" font-size="15" font-weight="700">
    <text x="176" y="554">shelf reader</text>
    <text x="446" y="554">store gateway</text>
    <text x="716" y="554">cloud platform</text>
    <text x="1006" y="554">staff app + ERP/POS</text>
  </g>
  <g stroke="#d4a755" stroke-width="3" stroke-linecap="round">
    <line x1="262" y1="548" x2="352" y2="548" marker-end="url(#anaArrow)"/>
    <line x1="536" y1="548" x2="626" y2="548" marker-end="url(#anaArrow)"/>
    <line x1="806" y1="548" x2="896" y2="548" marker-end="url(#anaArrow)"/>
  </g>
  <rect x="791" y="506" width="120" height="26" rx="13" fill="#3d2f18" stroke="#d4a755" stroke-width="1.2"/>
  <text x="851" y="524" text-anchor="middle" font-size="13.5" font-weight="800" fill="#d4a755">30–90 sec latency</text>
</svg>
