<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Pick-to-light ROI cascade from seconds saved to capex payback</title>
<desc id="d">Five cards run left to right, joined by operators. Card one: 15 to 25 seconds saved per pick. Times card two: 200 to 400 picks per shift, per picker. Equals card three: 50 to 100 minutes freed per picker each shift. Times twenty pickers gives card four: 16 to 33 reclaimed labor-hours per shift. That leads to card five, highlighted green: payback on the LED-tag capex in 4 to 9 months in well-utilized zones.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE SAVED SECOND, TO PAYBACK</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Follow 15-25 seconds per pick all the way down to capex payback.</text>

<!-- Card 1 -->
<rect x="70" y="210" width="196" height="212" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="70" y="210" width="196" height="8" rx="4" fill="#3d6b6b"/>
<text x="168" y="300" text-anchor="middle" font-size="34" font-weight="800" fill="#2c5454">15-25</text>
<text x="168" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#33595a">seconds</text>
<line x1="104" y1="352" x2="232" y2="352" stroke="#eee6d7" stroke-width="1.6"/>
<text x="168" y="382" text-anchor="middle" font-size="13.5" fill="#5c5c5c">saved per pick</text>

<!-- Card 2 -->
<rect x="286" y="210" width="196" height="212" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="286" y="210" width="196" height="8" rx="4" fill="#3d6b6b"/>
<text x="384" y="300" text-anchor="middle" font-size="34" font-weight="800" fill="#2c5454">200-400</text>
<text x="384" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#33595a">picks / shift</text>
<line x1="320" y1="352" x2="448" y2="352" stroke="#eee6d7" stroke-width="1.6"/>
<text x="384" y="382" text-anchor="middle" font-size="13.5" fill="#5c5c5c">per picker</text>

<!-- Card 3 -->
<rect x="502" y="210" width="196" height="212" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="502" y="210" width="196" height="8" rx="4" fill="#3d6b6b"/>
<text x="600" y="300" text-anchor="middle" font-size="34" font-weight="800" fill="#2c5454">50-100</text>
<text x="600" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#33595a">minutes</text>
<line x1="536" y1="352" x2="664" y2="352" stroke="#eee6d7" stroke-width="1.6"/>
<text x="600" y="382" text-anchor="middle" font-size="13.5" fill="#5c5c5c">freed per picker</text>

<!-- Card 4 -->
<rect x="718" y="210" width="196" height="212" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="718" y="210" width="196" height="8" rx="4" fill="#3d6b6b"/>
<text x="816" y="300" text-anchor="middle" font-size="34" font-weight="800" fill="#2c5454">16-33</text>
<text x="816" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#33595a">labor-hours</text>
<line x1="752" y1="352" x2="880" y2="352" stroke="#eee6d7" stroke-width="1.6"/>
<text x="816" y="382" text-anchor="middle" font-size="13.5" fill="#5c5c5c">per shift</text>

<!-- Card 5 (payback) -->
<rect x="934" y="210" width="196" height="212" rx="14" fill="#eef7f0" stroke="#1f6f3a" stroke-width="2.4"/>
<rect x="934" y="210" width="196" height="8" rx="4" fill="#1f6f3a"/>
<text x="1032" y="300" text-anchor="middle" font-size="34" font-weight="800" fill="#1f6f3a">4-9</text>
<text x="1032" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6f3a">months</text>
<line x1="968" y1="352" x2="1096" y2="352" stroke="#c7e6d3" stroke-width="1.6"/>
<text x="1032" y="382" text-anchor="middle" font-size="13.5" fill="#33595a">to payback</text>

<!-- operators -->
<text x="276" y="322" text-anchor="middle" font-size="26" font-weight="800" fill="#a07d43">×</text>
<text x="492" y="320" text-anchor="middle" font-size="24" font-weight="800" fill="#a07d43">=</text>
<text x="708" y="316" text-anchor="middle" font-size="18" font-weight="800" fill="#a07d43">× 20</text>
<text x="708" y="336" text-anchor="middle" font-size="12" fill="#a07d43">pickers</text>
<polygon points="916,308 934,316 916,324" fill="#1f6f3a"/>
<line x1="900" y1="316" x2="918" y2="316" stroke="#1f6f3a" stroke-width="3"/>

<text x="600" y="500" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Enough to absorb the LED-tag capex inside 4-9 months in well-utilized zones.</text>
<text x="600" y="540" text-anchor="middle" font-size="14" fill="#5c5c5c">Every number here is anchored to the workflow table and vendor data in the article — not a pilot-day best case.</text>
</svg>
