<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Choosing the NFC tag for a DPP: chip by security need, form factor by environment</title>
<desc id="d">Left, a decision: does the product need anti-counterfeit authentication? If no, NTAG 213/215/216 works as a simple URL carrier with no on-tag crypto. If yes, NTAG 424 DNA provides per-tap SUN authentication verifiable by the cloud. A red note warns that skipping crypto in a regulated category invites counterfeit passports. Right, form factor by environment: textiles need sewn-in or laundry tags that survive 60 degrees Celsius-plus washing and solvents; electronics and batteries use under-label or in-packaging placement; and the carrier must stay readable for the product's lifetime per ESPR Article 9.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CHOOSING THE NFC TAG FOR A DPP</text>
<text x="600" y="104" text-anchor="middle" font-size="33" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">Chip by security need, form factor by environment</text>

<rect x="64" y="168" width="470" height="60" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="299" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">Need anti-counterfeit authentication?</text>
<line x1="250" y1="228" x2="176" y2="266" stroke="#b9a68e" stroke-width="2.2"/>
<line x1="348" y1="228" x2="421" y2="266" stroke="#b9a68e" stroke-width="2.2"/>
<text x="150" y="256" font-size="13" font-weight="800" fill="#8b7a54">NO</text>
<text x="432" y="256" font-size="13" font-weight="800" fill="#2d6a4f">YES</text>

<rect x="64" y="270" width="225" height="150" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="176" y="318" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">NTAG 213/215/216</text>
<text x="176" y="346" text-anchor="middle" font-size="14" fill="#4f4f4f">Simple URL carrier</text>
<text x="176" y="368" text-anchor="middle" font-size="13" fill="#5c5c5c">no on-tag crypto</text>
<text x="176" y="396" text-anchor="middle" font-size="13" fill="#5c5c5c">for low-risk categories</text>

<rect x="309" y="270" width="225" height="150" rx="12" fill="#edf3ee" stroke="#cfe0d6" stroke-width="1.6"/>
<text x="421" y="318" text-anchor="middle" font-size="17" font-weight="800" fill="#2d6a4f">NTAG 424 DNA</text>
<text x="421" y="346" text-anchor="middle" font-size="14" fill="#4f4f4f">Per-tap SUN auth</text>
<text x="421" y="368" text-anchor="middle" font-size="13" fill="#5c5c5c">verifiable by the cloud</text>
<text x="421" y="396" text-anchor="middle" font-size="13" fill="#5c5c5c">for regulated / premium</text>

<text x="64" y="462" font-size="13.5" fill="#8b2d2d">No crypto in a regulated category invites counterfeit passports.</text>

<rect x="576" y="168" width="560" height="300" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="600" y="204" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FORM FACTOR BY ENVIRONMENT</text>
<circle cx="614" cy="256" r="10" fill="#3d6b6b"/>
<text x="638" y="250" font-size="16" font-weight="700" fill="#291c0e">Textiles</text>
<text x="638" y="272" font-size="13.5" fill="#4f4f4f">Sewn-in / laundry tag — survives 60 °C+ wash &amp; solvents</text>
<circle cx="614" cy="330" r="10" fill="#2d6a4f"/>
<text x="638" y="324" font-size="16" font-weight="700" fill="#291c0e">Electronics &amp; batteries</text>
<text x="638" y="346" font-size="13.5" fill="#4f4f4f">Under-label or in-packaging — protected from handling</text>
<circle cx="614" cy="404" r="10" fill="#c39a5f"/>
<text x="638" y="398" font-size="16" font-weight="700" fill="#291c0e">Persistence rule</text>
<text x="638" y="420" font-size="13.5" fill="#4f4f4f">Readable for the product's lifetime (ESPR Article 9)</text>

<text x="600" y="524" text-anchor="middle" font-size="14" fill="#5c5c5c">Two chip tiers, matched to how much anti-counterfeit you actually need.</text>
</svg>
