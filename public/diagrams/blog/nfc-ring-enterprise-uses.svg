<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five enterprise jobs for a ring that's already on the hand</title>
<desc id="d">Five use-case cards: badge-free door access for gloved or occupied hands in clean rooms, labs and healthcare; handshake-and-tap contact sharing for sales teams at events; fast operator login at manufacturing workstations and terminals; VIP hotel and venue wearables combining room access, VIP entry and cashless payment; and branded merchandise rings with embedded digital experiences at $8-15 per NTAG213 unit.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE "ALREADY ON THE HAND" PAYS RENT</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Five enterprise jobs for one quiet ring</text>

<rect x="52" y="136" width="356" height="216" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="230" y="176" text-anchor="middle" font-size="15.5" font-weight="800" fill="#2c5454">Badge-free door access</text>
<text x="230" y="216" text-anchor="middle" font-size="12.5" fill="#4f4f4f">gloved hands, full hands, sterile hands —</text>
<text x="230" y="240" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the door opens anyway</text>
<text x="230" y="272" text-anchor="middle" font-size="12.5" fill="#4f4f4f">works with MIFARE / DESFire / NTAG</text>
<text x="230" y="296" text-anchor="middle" font-size="12.5" fill="#4f4f4f">13.56 MHz access systems</text>
<text x="230" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">clean rooms · labs · healthcare</text>

<rect x="422" y="136" width="356" height="216" rx="14" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="600" y="176" text-anchor="middle" font-size="15.5" font-weight="800" fill="#6d5a3a">Handshake-and-tap identity</text>
<text x="600" y="216" text-anchor="middle" font-size="12.5" fill="#4f4f4f">contact details shared in the same</text>
<text x="600" y="240" text-anchor="middle" font-size="12.5" fill="#4f4f4f">gesture as the greeting</text>
<text x="600" y="272" text-anchor="middle" font-size="12.5" fill="#4f4f4f">no card to run out of,</text>
<text x="600" y="296" text-anchor="middle" font-size="12.5" fill="#4f4f4f">no phone to fumble</text>
<text x="600" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">sales teams · executives · events</text>

<rect x="792" y="136" width="356" height="216" rx="14" fill="#eef1f5" stroke="#4a5568" stroke-width="1.5"/>
<text x="970" y="176" text-anchor="middle" font-size="15.5" font-weight="800" fill="#4a5568">Machine login</text>
<text x="970" y="216" text-anchor="middle" font-size="12.5" fill="#4f4f4f">operator authentication at</text>
<text x="970" y="240" text-anchor="middle" font-size="12.5" fill="#4f4f4f">workstations and equipment terminals</text>
<text x="970" y="272" text-anchor="middle" font-size="12.5" fill="#4f4f4f">forty logins a shift,</text>
<text x="970" y="296" text-anchor="middle" font-size="12.5" fill="#4f4f4f">zero password typing</text>
<text x="970" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">manufacturing · logistics</text>

<rect x="237" y="386" width="356" height="200" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="415" y="426" text-anchor="middle" font-size="15.5" font-weight="800" fill="#2c5454">VIP &amp; loyalty wearables</text>
<text x="415" y="464" text-anchor="middle" font-size="12.5" fill="#4f4f4f">room key + VIP entry + cashless payment,</text>
<text x="415" y="488" text-anchor="middle" font-size="12.5" fill="#4f4f4f">one premium ring per guest</text>
<text x="415" y="520" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the amenity guests keep — and remember</text>
<text x="415" y="556" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">hotels · resorts · event venues</text>

<rect x="607" y="386" width="356" height="200" rx="14" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<text x="785" y="426" text-anchor="middle" font-size="15.5" font-weight="800" fill="#6d5a3a">Brand merchandise</text>
<text x="785" y="464" text-anchor="middle" font-size="12.5" fill="#4f4f4f">a branded ring with an embedded</text>
<text x="785" y="488" text-anchor="middle" font-size="12.5" fill="#4f4f4f">digital experience on every tap</text>
<text x="785" y="520" text-anchor="middle" font-size="14" font-weight="800" fill="#291c0e">NTAG213 ring: $8–15 / unit</text>
<text x="785" y="556" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">tech brands · luxury promos</text>

<text x="600" y="634" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Common thread: the credential costs a pocket-search everywhere else — the ring skips the search.</text>
</svg>
