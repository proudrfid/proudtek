<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Volume decides the NFC programming toolchain</title>
<desc id="d">A spectrum bar runs from 1 tag to more than 10,000 tags with ticks at 1, 10, 100, 1,000 and 10,000-plus. Three cards sit beneath it: a phone app such as NFC Tools or NXP TagWriter for 1 to 10 tags at about thirty seconds each; an ACR122U desktop reader plus an SDK script for 10 to 1,000 tags with UID logging; and SDK-driven readers, conveyor-fed inline encoders or supplier encoding for 100 to 10,000-plus tags. A caption notes that one tag is a phone app and thirty seconds, while ten thousand is a script and several life choices.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3d6b6b"/><stop offset="100%" stop-color="#4a5568"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW MANY TAGS? · VOLUME DECIDES THE ENTIRE TOOLCHAIN</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">The more tags, the less your thumb is involved</text>

<rect x="140" y="182" width="920" height="14" rx="7" fill="url(#spec)"/>
<line x1="140" y1="172" x2="140" y2="206" stroke="#4f4f4f" stroke-width="2"/>
<line x1="370" y1="172" x2="370" y2="206" stroke="#4f4f4f" stroke-width="2"/>
<line x1="600" y1="172" x2="600" y2="206" stroke="#4f4f4f" stroke-width="2"/>
<line x1="830" y1="172" x2="830" y2="206" stroke="#4f4f4f" stroke-width="2"/>
<line x1="1060" y1="172" x2="1060" y2="206" stroke="#4f4f4f" stroke-width="2"/>
<text x="140" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">1</text>
<text x="370" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">10</text>
<text x="600" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">100</text>
<text x="830" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">1,000</text>
<text x="1060" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">10,000+</text>
<text x="255" y="152" text-anchor="middle" font-size="13" fill="#5c5c5c">"just a few"</text>
<text x="945" y="152" text-anchor="middle" font-size="13" fill="#5c5c5c">"send help — or a script"</text>

<rect x="88" y="290" width="300" height="220" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="238" y="326" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Phone app</text>
<rect x="218" y="344" width="40" height="68" rx="8" fill="#2c5454"/>
<rect x="223" y="350" width="30" height="48" rx="4" fill="#eef5f5"/>
<circle cx="238" cy="374" r="8" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="231" y="403" width="14" height="3" rx="1.5" fill="#eef5f5"/>
<text x="238" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">1 – 10 tags</text>
<text x="238" y="466" text-anchor="middle" font-size="12.5" fill="#4f4f4f">NFC Tools · NXP TagWriter</text>
<text x="238" y="490" text-anchor="middle" font-size="12" fill="#6d5a3a">about thirty seconds per tag</text>

<rect x="450" y="290" width="300" height="220" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="326" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Desktop reader + script</text>
<rect x="571" y="344" width="46" height="30" rx="6" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="581" y="351" width="26" height="16" rx="3" fill="none" stroke="#3d6b6b" stroke-width="1.5"/>
<rect x="552" y="378" width="96" height="34" rx="8" fill="#4a5568"/>
<rect x="564" y="387" width="46" height="16" rx="4" fill="#7fa3a3"/>
<circle cx="632" cy="395" r="6" fill="#1f6f3a"/>
<text x="600" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#3d6b6b">10 – 1,000 tags</text>
<text x="600" y="466" text-anchor="middle" font-size="12.5" fill="#4f4f4f">ACR122U + SDK · UID logging</text>
<text x="600" y="490" text-anchor="middle" font-size="12" fill="#6d5a3a">the script does the typing</text>

<rect x="812" y="290" width="300" height="220" rx="14" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.5"/>
<text x="962" y="326" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Inline / outsourced</text>
<rect x="877" y="384" width="170" height="10" rx="5" fill="#d3dae3"/>
<circle cx="892" cy="404" r="8" fill="none" stroke="#4a5568" stroke-width="2.5"/>
<circle cx="962" cy="404" r="8" fill="none" stroke="#4a5568" stroke-width="2.5"/>
<circle cx="1032" cy="404" r="8" fill="none" stroke="#4a5568" stroke-width="2.5"/>
<rect x="887" y="352" width="44" height="28" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<rect x="943" y="352" width="44" height="28" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<rect x="999" y="352" width="44" height="28" rx="6" fill="#ffffff" stroke="#d3dae3" stroke-width="2" stroke-dasharray="4 4"/>
<text x="962" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#4a5568">100 – 10,000+ tags</text>
<text x="962" y="466" text-anchor="middle" font-size="12.5" fill="#4f4f4f">reader SDKs · inline encoder · supplier</text>
<text x="962" y="490" text-anchor="middle" font-size="12" fill="#6d5a3a">factory and warehouse territory</text>

<text x="600" y="560" text-anchor="middle" font-size="14" fill="#4f4f4f">One tag is a phone app and thirty seconds. Ten thousand is a script and several life choices.</text>
<text x="600" y="590" text-anchor="middle" font-size="13" fill="#5c5c5c">Match the tool to the volume before the tags arrive — not after.</text>
</svg>
