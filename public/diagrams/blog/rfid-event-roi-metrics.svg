<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five metrics that prove RFID wristband ROI, captured before and after</title>
<desc id="d">Five key performance indicators for an RFID cashless deployment, each with its result and a note. Per-attendee average spend rises 20 to 30 percent. Transactions per attendee rise 1.5 to 2 times. Peak-vendor queue time falls to 10 to 15 seconds from 35 to 50 seconds, tripling vendor throughput. Refund and chargeback rate falls below 0.5 percent closed-loop from 1.5 to 3 percent open-loop. Marketing capture rises to 60 to 80 percent of attendees from 10 to 20 percent via app.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE FIVE METRICS THAT PROVE IT</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Capture these pre- and post-deployment, and the business case stops being a vibe.</text>
<text x="100" y="150" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a8a8a">METRIC</text>
<text x="585" y="150" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a8a8a">RESULT</text>
<text x="700" y="150" font-size="12" font-weight="800" letter-spacing="0.5" fill="#8a8a8a">WHAT IT MEANS</text>
<rect x="76" y="168" width="1048" height="60" rx="12" fill="#ffffff" stroke="#ece5d8" stroke-width="1.4"/>
<text x="100" y="206" font-size="15" font-weight="700" fill="#291c0e">Per-attendee average spend</text>
<rect x="500" y="183" width="170" height="30" rx="15" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="585" y="203" text-anchor="middle" font-size="16" font-weight="800" fill="#3d6b6b">+20–30%</text>
<text x="700" y="206" font-size="13" fill="#5c5c5c">Total cashless spend ÷ unique attendees, vs cash-and-card.</text>
<rect x="76" y="240" width="1048" height="60" rx="12" fill="#fbf8f1" stroke="#ece5d8" stroke-width="1.4"/>
<text x="100" y="278" font-size="15" font-weight="700" fill="#291c0e">Transactions per attendee</text>
<rect x="500" y="255" width="170" height="30" rx="15" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="585" y="275" text-anchor="middle" font-size="16" font-weight="800" fill="#3d6b6b">×1.5–2</text>
<text x="700" y="278" font-size="13" fill="#5c5c5c">Impulse buys turn frictionless once the band is preloaded.</text>
<rect x="76" y="312" width="1048" height="60" rx="12" fill="#ffffff" stroke="#ece5d8" stroke-width="1.4"/>
<text x="100" y="350" font-size="15" font-weight="700" fill="#291c0e">Peak-vendor queue time</text>
<rect x="500" y="327" width="170" height="30" rx="15" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="585" y="347" text-anchor="middle" font-size="16" font-weight="800" fill="#3d6b6b">10–15 sec</text>
<text x="700" y="350" font-size="13" fill="#5c5c5c">Down from 35–50 sec — 2–3× vendor throughput.</text>
<rect x="76" y="384" width="1048" height="60" rx="12" fill="#fbf8f1" stroke="#ece5d8" stroke-width="1.4"/>
<text x="100" y="422" font-size="15" font-weight="700" fill="#291c0e">Refund / chargeback rate</text>
<rect x="500" y="399" width="170" height="30" rx="15" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="585" y="419" text-anchor="middle" font-size="16" font-weight="800" fill="#1f6f3a">&lt;0.5%</text>
<text x="700" y="422" font-size="13" fill="#5c5c5c">Closed-loop, down from 1.5–3% open-loop.</text>
<rect x="76" y="456" width="1048" height="60" rx="12" fill="#ffffff" stroke="#ece5d8" stroke-width="1.4"/>
<text x="100" y="494" font-size="15" font-weight="700" fill="#291c0e">Post-event marketing capture</text>
<rect x="500" y="471" width="170" height="30" rx="15" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="585" y="491" text-anchor="middle" font-size="16" font-weight="800" fill="#3d6b6b">60–80%</text>
<text x="700" y="494" font-size="13" fill="#5c5c5c">Of attendees via top-up email, vs 10–20% from apps.</text>
<text x="600" y="560" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Five numbers, captured before and after — the difference between a case study and a claim.</text>
</svg>
