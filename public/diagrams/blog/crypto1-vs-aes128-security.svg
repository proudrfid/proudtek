<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">MIFARE Classic Crypto-1 versus DESFire AES-128 security architecture</title>
<desc id="d">Left, MIFARE Classic with Crypto-1: a 48-bit proprietary stream cipher with no mutual authentication, reverse-engineered in 2008, cloned in under 30 seconds with a $40 reader, and flagged non-compliant by audits — a known-broken cipher. Right, DESFire with AES-128: a 128-bit AES cipher with secure messaging, mutual authentication, random-number challenge-response, and per-card key diversification that meets current brand security mandates. Verdict: real-world hotel cloning stays rare, but audit-compliant increasingly means AES-128, not Crypto-1.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SECURITY ARCHITECTURE · CRYPTO-1 vs AES-128</text>

<!-- left panel · Classic Crypto-1 · risk -->
<rect x="64" y="120" width="500" height="392" rx="16" fill="#fbf2f0" stroke="#8b2d2d" stroke-width="1.6"/>
<text x="314" y="166" text-anchor="middle" font-size="20" font-weight="800" fill="#8b2d2d">MIFARE Classic · Crypto-1</text>
<text x="314" y="191" text-anchor="middle" font-size="13.5" fill="#5c5c5c">48-bit proprietary stream cipher</text>
<line x1="104" y1="212" x2="524" y2="212" stroke="#e8cfca" stroke-width="1.3"/>
<circle cx="126" cy="252" r="12" fill="#8b2d2d"/>
<text x="126" y="257" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">!</text>
<text x="152" y="257" font-size="15.5" fill="#333333">No mutual authentication</text>
<circle cx="126" cy="300" r="12" fill="#8b2d2d"/>
<text x="126" y="305" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">!</text>
<text x="152" y="305" font-size="15.5" fill="#333333">Reverse-engineered in 2008</text>
<circle cx="126" cy="348" r="12" fill="#8b2d2d"/>
<text x="126" y="353" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">!</text>
<text x="152" y="353" font-size="15.5" fill="#333333">Cloned in under 30 s · $40 reader</text>
<circle cx="126" cy="396" r="12" fill="#8b2d2d"/>
<text x="126" y="401" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">!</text>
<text x="152" y="401" font-size="15.5" fill="#333333">Audits flag it non-compliant</text>
<rect x="104" y="444" width="230" height="38" rx="19" fill="#f6e4e1" stroke="#8b2d2d" stroke-width="1.2"/>
<text x="219" y="469" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">KNOWN-BROKEN CIPHER</text>

<!-- right panel · DESFire AES-128 · secure -->
<rect x="636" y="120" width="500" height="392" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="886" y="166" text-anchor="middle" font-size="20" font-weight="800" fill="#2c5454">DESFire · AES-128</text>
<text x="886" y="191" text-anchor="middle" font-size="13.5" fill="#4f4f4f">128-bit AES + secure messaging</text>
<line x1="676" y1="212" x2="1096" y2="212" stroke="#d3e5e5" stroke-width="1.3"/>
<circle cx="698" cy="252" r="12" fill="#3d6b6b"/>
<path d="M 693 252 L 696.5 256 L 703 249" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="724" y="257" font-size="15.5" fill="#333333">Mutual authentication</text>
<circle cx="698" cy="300" r="12" fill="#3d6b6b"/>
<path d="M 693 300 L 696.5 304 L 703 297" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="724" y="305" font-size="15.5" fill="#333333">Random challenge-response</text>
<circle cx="698" cy="348" r="12" fill="#3d6b6b"/>
<path d="M 693 348 L 696.5 352 L 703 345" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="724" y="353" font-size="15.5" fill="#333333">Per-card key diversification</text>
<circle cx="698" cy="396" r="12" fill="#3d6b6b"/>
<path d="M 693 396 L 696.5 400 L 703 393" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="724" y="401" font-size="15.5" fill="#333333">Meets brand security mandates</text>
<rect x="676" y="444" width="240" height="38" rx="19" fill="#e2efef" stroke="#3d6b6b" stroke-width="1.2"/>
<text x="796" y="469" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#2c5454">MEETS CURRENT MANDATES</text>

<circle cx="600" cy="300" r="32" fill="#c39a5f"/>
<text x="600" y="309" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">vs</text>

<rect x="64" y="536" width="1072" height="92" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="573" text-anchor="middle" font-size="17.5" font-weight="800" fill="#291c0e">Real-world hotel cloning stays rare — but "audit-compliant" increasingly means AES-128, not Crypto-1.</text>
<text x="600" y="602" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The risk that moves procurement is the brand-standards checkbox, not the parking-lot attacker.</text>
</svg>
