<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">What you're storing vs. what the tag holds — payload sizes against tag capacities</title>
<desc id="d">Horizontal bar comparison on a rough byte scale. Payloads you might write: a simple URL runs 40 to 80 bytes; a vCard contact runs 200 to 400 bytes. Tag capacities: NTAG213 holds 144 bytes — plenty for a URL; MIFARE Classic 1K gives 752 usable bytes after the sector trailers; NTAG216 holds 888 bytes — roomy for a vCard; DESFire EV2 and EV3 reach 8 KB with separate files for access, transit, payment and loyalty on one card. Bars are log-ish and not to scale; the takeaway is the gap between payload and capacity. Caption: right-size the tank — don't gold-plate it, don't run it dry.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CAPACITY PLANNING — LEAVE HEADROOM, NOT REGRETS</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">What you're storing vs. what the tag holds</text>

<text x="84" y="152" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">PAYLOADS YOU MIGHT WRITE</text>
<text x="84" y="190" font-size="14" font-weight="600" fill="#291c0e">Simple URL</text>
<rect x="320" y="176" width="70" height="20" rx="8" fill="#d4a755"/>
<text x="404" y="191" font-size="13.5" font-weight="700" fill="#6d5a3a">40–80 B</text>
<text x="84" y="230" font-size="14" font-weight="600" fill="#291c0e">vCard contact</text>
<rect x="320" y="216" width="190" height="20" rx="8" fill="#d4a755"/>
<text x="524" y="231" font-size="13.5" font-weight="700" fill="#6d5a3a">200–400 B</text>

<line x1="84" y1="262" x2="1116" y2="262" stroke="#e6dfd2" stroke-width="2"/>

<text x="84" y="300" font-size="12.5" font-weight="800" letter-spacing="1" fill="#2c5454">TAG CAPACITIES</text>
<text x="84" y="338" font-size="14" font-weight="600" fill="#291c0e">NTAG213</text>
<rect x="320" y="324" width="110" height="22" rx="8" fill="#3d6b6b"/>
<text x="444" y="340" font-size="13.5" font-weight="700" fill="#234a4a">144 B — plenty for a URL</text>
<text x="84" y="386" font-size="14" font-weight="600" fill="#291c0e">MIFARE Classic 1K</text>
<rect x="320" y="372" width="300" height="22" rx="8" fill="#3d6b6b"/>
<text x="634" y="388" font-size="13.5" font-weight="700" fill="#234a4a">752 B usable (after the trailers)</text>
<text x="84" y="434" font-size="14" font-weight="600" fill="#291c0e">NTAG216</text>
<rect x="320" y="420" width="330" height="22" rx="8" fill="#3d6b6b"/>
<text x="664" y="436" font-size="13.5" font-weight="700" fill="#234a4a">888 B — roomy for a vCard</text>
<text x="84" y="482" font-size="14" font-weight="600" fill="#291c0e">DESFire EV2/EV3</text>
<rect x="320" y="468" width="640" height="22" rx="8" fill="#2c5454"/>
<text x="974" y="484" font-size="13.5" font-weight="700" fill="#234a4a">8 KB</text>
<text x="320" y="512" font-size="12.5" fill="#4f4f4f">one card, separate files: access control · transit · cashless payment · loyalty</text>

<text x="84" y="556" font-size="13" fill="#5c5c5c">Bars are log-ish, not to scale — the takeaway is the gap, not the geometry.</text>
<text x="600" y="612" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="21" font-weight="700" fill="#291c0e">Right-size the tank: don't gold-plate it, don't run it dry.</text>
</svg>
