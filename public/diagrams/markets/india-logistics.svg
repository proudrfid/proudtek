<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Shenzhen to India — freight lanes and landed cost</title>
  <desc id="d">Freight from Shenzhen to India: express air via DHL or FedEx reaches Mumbai, Delhi, Bangalore and Chennai in 5-7 business days; sea freight reaches Nhava Sheva, Chennai and Kolkata in 12-18 days for bulk orders. At import, because India has no free-trade agreement with China, Basic Customs Duty plus Integrated GST apply on HS 8523.52 smart cards, and RFID readers need WPC Equipment Type Approval before customs clearance while passive tags are exempt. Incoterms EXW, FOB or CIF, or DDP on request.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SHENZHEN &#8594; INDIA — LANES AND LANDED COST</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Air to the metros in 5-7 business days; BCD + IGST apply (no India-China FTA)</text>

  <!-- origin -->
  <rect x="70" y="200" width="180" height="90" rx="12" fill="#4a5568"/>
  <text x="160" y="238" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">SHENZHEN</text>
  <text x="160" y="262" text-anchor="middle" font-size="12.5" fill="#dfe4ea">one production line,</text>
  <text x="160" y="280" text-anchor="middle" font-size="12.5" fill="#dfe4ea">India-spec sheets</text>

  <!-- air lane -->
  <line x1="250" y1="222" x2="470" y2="222" stroke="#3d6b6b" stroke-width="3"/>
  <polygon points="470,222 456,216 456,228" fill="#3d6b6b"/>
  <text x="360" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#3d6b6b">Air &#183; DHL / FedEx &#183; 5-7 days</text>
  <!-- sea lane -->
  <line x1="250" y1="268" x2="470" y2="268" stroke="#8a6d3b" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="470,268 456,262 456,274" fill="#8a6d3b"/>
  <text x="360" y="290" text-anchor="middle" font-size="13" fill="#8a6d3b">Sea &#183; bulk &#183; 12-18 days</text>

  <!-- destinations -->
  <rect x="480" y="150" width="230" height="196" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="595" y="180" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">INDIA</text>
  <text x="595" y="208" text-anchor="middle" font-size="13.5" fill="#291c0e">Air — Mumbai, Delhi,</text>
  <text x="595" y="228" text-anchor="middle" font-size="13.5" fill="#291c0e">Bangalore, Chennai</text>
  <text x="595" y="258" text-anchor="middle" font-size="13.5" fill="#291c0e">Sea — Nhava Sheva,</text>
  <text x="595" y="278" text-anchor="middle" font-size="13.5" fill="#291c0e">Chennai, Kolkata</text>
  <text x="595" y="312" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Free sample kits ship first</text>

  <!-- landed cost -->
  <rect x="740" y="150" width="390" height="196" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="760" y="182" font-size="15" font-weight="800" letter-spacing="0.3" fill="#6d5a3a">AT IMPORT</text>
  <text x="760" y="212" font-size="14" fill="#291c0e">Duty — BCD applies (no India-China FTA)</text>
  <text x="760" y="240" font-size="14" fill="#291c0e">Tax — IGST at import; creditable on IEC</text>
  <text x="760" y="268" font-size="14" font-weight="700" fill="#8b2d2d">Readers — WPC ETA to clear customs</text>
  <text x="760" y="296" font-size="12.5" fill="#5c5c5c">HS 8523.52 "smart cards" classification;</text>
  <text x="760" y="314" font-size="12.5" fill="#5c5c5c">passive tags exempt; Incoterms EXW / FOB / DDP</text>

  <rect x="70" y="400" width="1060" height="86" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="92" y="430" font-size="15" font-weight="700" fill="#2c5454">Time zones work in your favour</text>
  <text x="92" y="453" font-size="13.5" fill="#3d6b6b">Shenzhen's workday overlaps the Indian afternoon, so an RFQ sent at close of business is usually quoted the next morning.</text>
  <text x="92" y="473" font-size="13.5" fill="#5c5c5c">No India-China FTA means BCD + IGST at the border — many buyers import on their own IEC to reclaim IGST as input credit.</text>

  <text x="600" y="536" text-anchor="middle" font-size="13" fill="#9aa4b2">Transit, duty and IGST figures vary by HS line and Union Budget; confirm the landed figure and Incoterm on your quote.</text>
</svg>
