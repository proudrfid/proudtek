<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="hybt hybd" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="hybt">Barcode versus RFID: what DSCSA requires and what makes it fast</title>
<desc id="hybd">DSCSA requires a 2D DataMatrix barcode carrying serial, lot, expiry and NDC on every saleable unit — the mandated system of record. RFID is optional: an overlay that speeds receiving 5 to 10 times, reads a whole pallet in seconds, and adds 4 to 10 cents per unit at scale. In the hybrid architecture the barcode is the source of truth and the RFID tag carries a serial pointer that resolves to the barcode data, with a labor-and-accuracy payback of 6 to 18 months.</desc>
