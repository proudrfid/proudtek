<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Anatomy of an NFC dry inlay</title>
  <desc id="d">An annotated anatomy of an NFC dry inlay. An NFC chip is flip-chip bonded onto a multi-turn planar loop antenna — a coil, not a UHF dipole — etched or wound onto a bare 50 µm PET web with no adhesive and no release liner. It is a sub-component, not a finished card, and it resonates at 13.56 MHz across the ISO/IEC 14443 and NFC Forum HF band.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANATOMY OF AN NFC DRY INLAY</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#5c5c5c">NFC chip · multi-turn loop antenna · 50 µm PET web</text>

  <!-- PET web -->
  <rect x="370" y="250" width="460" height="200" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>

  <!-- multi-turn loop antenna (concentric turns — a coil, not a dipole) -->
  <rect x="408" y="282" width="384" height="136" rx="12" fill="none" stroke="#3d6b6b" stroke-width="8"/>
  <rect x="422" y="296" width="356" height="108" rx="10" fill="none" stroke="#3d6b6b" stroke-width="6"/>
  <rect x="436" y="310" width="328" height="80" rx="8" fill="none" stroke="#3d6b6b" stroke-width="5"/>
  <rect x="450" y="324" width="300" height="52" rx="6" fill="none" stroke="#3d6b6b" stroke-width="4"/>

  <!-- NFC chip flip-chip bonded across the loop terminals -->
  <rect x="576" y="262" width="48" height="34" rx="5" fill="#e9edf1" stroke="#4a5568" stroke-width="2"/>
  <rect x="592" y="269" width="16" height="20" rx="2" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>

  <!-- chip callout (top) -->
  <text x="600" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#2c5454">NFC chip on the loop</text>
  <text x="600" y="192" text-anchor="middle" font-size="13.5" fill="#5c5c5c">flip-chip bonded with ACF</text>
  <line x1="600" y1="206" x2="600" y2="260" stroke="#4a5568" stroke-width="2"/>
  <circle cx="600" cy="260" r="4" fill="#4a5568"/>

  <!-- antenna callout (left) -->
  <text x="336" y="330" text-anchor="end" font-size="16" font-weight="700" fill="#2c5454">Multi-turn loop antenna</text>
  <text x="336" y="352" text-anchor="end" font-size="13" fill="#5c5c5c">a coil — not a UHF dipole</text>
  <text x="336" y="374" text-anchor="end" font-size="13" fill="#5c5c5c">etched or wound, many turns</text>
  <line x1="344" y1="350" x2="406" y2="350" stroke="#3d6b6b" stroke-width="2"/>
  <circle cx="406" cy="350" r="4" fill="#3d6b6b"/>

  <!-- PET callout (bottom) -->
  <line x1="600" y1="452" x2="600" y2="486" stroke="#c39a5f" stroke-width="2"/>
  <circle cx="600" cy="452" r="4" fill="#c39a5f"/>
  <text x="600" y="506" text-anchor="middle" font-size="16" font-weight="700" fill="#6d5a3a">50 µm PET web</text>
  <text x="600" y="528" text-anchor="middle" font-size="13" fill="#5c5c5c">the bare carrier film — no adhesive, no liner</text>

  <!-- band -->
  <rect x="300" y="556" width="600" height="76" rx="16" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="588" text-anchor="middle" font-size="16" font-weight="600" fill="#2c5454">Bare sub-component: NFC chip + loop antenna on PET</text>
  <text x="600" y="613" text-anchor="middle" font-size="15" fill="#3d6b6b">resonates at 13.56 MHz · ISO/IEC 14443 · NFC Forum</text>
</svg>
