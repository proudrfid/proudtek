<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five NFC wedding favor pitfalls, each paired with its fix</title>
<desc id="d">Two columns: a pitfall on the left in red, its fix on the right in teal. One, pre-locking the URL months early because Drive and gallery links rotate — fix, use a short link you can repoint after the day. Two, iPhone and Android tap differently and older iPhones need Control Center — fix, print a hold-here cue and a QR fallback. Three, weak-WiFi video-heavy links never finish loading — fix, pre-cache a lightweight static page of text and a few images. Four, foil and metal backings block the 13.56 MHz signal — fix, test three phones before ordering 200 units. Five, no record of the chip UID makes keepsake re-scans harder — fix, log each UID up front and reuse it for anniversary updates.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE FAILURES · FIVE FIXES</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">What breaks a favor tag — and the fix</text>

<text x="333" y="146" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1.5" fill="#8b2d2d">THE PITFALL</text>
<text x="877" y="146" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1.5" fill="#2d6a4f">THE FIX</text>

<rect x="80" y="164" width="506" height="72" rx="12" fill="#f7e6e6" stroke="#e0b8b8" stroke-width="1.5"/>
<circle cx="112" cy="200" r="15" fill="#8b2d2d"/>
<text x="112" y="206" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="140" y="194" font-size="14.5" font-weight="700" fill="#8b2d2d">Pre-locking the URL months early</text>
<text x="140" y="217" font-size="12.5" fill="#6b4a4a">Drive shares and gallery links rotate</text>
<path d="M 598 190 L 624 200 L 598 210 Z" fill="#c39a5f"/>
<rect x="634" y="164" width="486" height="72" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<path d="M 654 200 l 6 6 l 12 -13" fill="none" stroke="#2d6a4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="688" y="194" font-size="14.5" font-weight="700" fill="#234a4a">Use a short link you can repoint</text>
<text x="688" y="217" font-size="12.5" fill="#4f6b6b">bit.ly or your own domain, after the day</text>

<rect x="80" y="246" width="506" height="72" rx="12" fill="#f7e6e6" stroke="#e0b8b8" stroke-width="1.5"/>
<circle cx="112" cy="282" r="15" fill="#8b2d2d"/>
<text x="112" y="288" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="140" y="276" font-size="14.5" font-weight="700" fill="#8b2d2d">iPhone and Android tap differently</text>
<text x="140" y="299" font-size="12.5" fill="#6b4a4a">older iPhones need Control Center first</text>
<path d="M 598 272 L 624 282 L 598 292 Z" fill="#c39a5f"/>
<rect x="634" y="246" width="486" height="72" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<path d="M 654 282 l 6 6 l 12 -13" fill="none" stroke="#2d6a4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="688" y="276" font-size="14.5" font-weight="700" fill="#234a4a">Print a "hold here" cue + a QR fallback</text>
<text x="688" y="299" font-size="12.5" fill="#4f6b6b">covers guests who can't tap-to-read</text>

<rect x="80" y="328" width="506" height="72" rx="12" fill="#f7e6e6" stroke="#e0b8b8" stroke-width="1.5"/>
<circle cx="112" cy="364" r="15" fill="#8b2d2d"/>
<text x="112" y="370" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="140" y="358" font-size="14.5" font-weight="700" fill="#8b2d2d">Weak-WiFi, video-heavy links</text>
<text x="140" y="381" font-size="12.5" fill="#6b4a4a">the page never finishes loading</text>
<path d="M 598 354 L 624 364 L 598 374 Z" fill="#c39a5f"/>
<rect x="634" y="328" width="486" height="72" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<path d="M 654 364 l 6 6 l 12 -13" fill="none" stroke="#2d6a4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="688" y="358" font-size="14.5" font-weight="700" fill="#234a4a">Pre-cache a lightweight static page</text>
<text x="688" y="381" font-size="12.5" fill="#4f6b6b">text and a few images, not video</text>

<rect x="80" y="410" width="506" height="72" rx="12" fill="#f7e6e6" stroke="#e0b8b8" stroke-width="1.5"/>
<circle cx="112" cy="446" r="15" fill="#8b2d2d"/>
<text x="112" y="452" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="140" y="440" font-size="14.5" font-weight="700" fill="#8b2d2d">Foil &amp; metal backings</text>
<text x="140" y="463" font-size="12.5" fill="#6b4a4a">block the 13.56 MHz signal</text>
<path d="M 598 436 L 624 446 L 598 456 Z" fill="#c39a5f"/>
<rect x="634" y="410" width="486" height="72" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<path d="M 654 446 l 6 6 l 12 -13" fill="none" stroke="#2d6a4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="688" y="440" font-size="14.5" font-weight="700" fill="#234a4a">Test three phones before 200 units</text>
<text x="688" y="463" font-size="12.5" fill="#4f6b6b">swap the material if any tag fails</text>

<rect x="80" y="492" width="506" height="72" rx="12" fill="#f7e6e6" stroke="#e0b8b8" stroke-width="1.5"/>
<circle cx="112" cy="528" r="15" fill="#8b2d2d"/>
<text x="112" y="534" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
<text x="140" y="522" font-size="14.5" font-weight="700" fill="#8b2d2d">No record of the chip UID</text>
<text x="140" y="545" font-size="12.5" fill="#6b4a4a">keepsake re-scans get harder later</text>
<path d="M 598 518 L 624 528 L 598 538 Z" fill="#c39a5f"/>
<rect x="634" y="492" width="486" height="72" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<path d="M 654 528 l 6 6 l 12 -13" fill="none" stroke="#2d6a4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="688" y="522" font-size="14.5" font-weight="700" fill="#234a4a">Log each UID up front</text>
<text x="688" y="545" font-size="12.5" fill="#4f6b6b">reuse it for anniversary updates</text>

<text x="600" y="606" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Every one is caught by a five-minute test with three phones before you order in bulk.</text>
</svg>
