<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="siTrayTitle siTrayDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="siTrayTitle">Intraoperative RFID shows 30 to 50 percent of a tray goes unused, opening the door to right-sizing</title>
  <desc id="siTrayDesc">Intraoperative RFID studies find 30 to 50 percent of instruments in a typical surgical tray are never used in a given case. Right-sizing tray contents cuts reprocessing volume by 15 to 30 percent, lifts tray-build accuracy from a manual 85 to 92 percent up to 99 percent or more, and reclaims sterile-processing capacity.</desc>

  <defs>
    <radialGradient id="siTrayBg" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f1ece0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#siTrayBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="60" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="0.3" fill="#291c0e">The tray is bigger than the operation needs</text>
  <text x="600" y="89" text-anchor="middle" font-size="15" fill="#3d6b6b">Intraoperative RFID (PMC8827029) measures what actually gets touched — and it is less than you'd think</text>

  <!-- left panel: the stat + grid -->
  <rect x="62" y="118" width="520" height="418" rx="16" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <text x="322" y="182" text-anchor="middle" font-size="52" font-weight="800" fill="#8b2d2d">30–50%</text>
  <text x="322" y="212" text-anchor="middle" font-size="14" fill="#4f4f4f">of a typical tray is never touched in a given case</text>

  <!-- dot grid: teal = used, faded = unused -->
  <g>
    <circle cx="110" cy="262" r="15" fill="#3d6b6b"/><circle cx="160" cy="262" r="15" fill="#e0d8c8" stroke="#c4b99f" stroke-width="1.5"/><circle cx="210" cy="262" r="15" fill="#3d6b6b"/><circle cx="260" cy="262" r="15" fill="#3d6b6b"/><circle cx="310" cy="262" r="15" fill="#e0d8c8" stroke="#c4b99f" stroke-width="1.5"/><circle cx="360" cy="262" r="15" fill="#3d6b6b"/><circle cx="410" cy="262" r="15" fill="#3d6b6b"/><circle cx="460" cy="262" r="15" fill="#e0d8c8" stroke="#c4b99f" stroke-width="1.5"/>
    <circle cx="110" cy="310" r="15" fill="#e0d8c8" stroke="#c4b99f" stroke-width="1.5"/><circle cx="160" cy="310" r="15" fill="#3d6b6b"/><circle cx="210" cy="310" r="15" fill="#3d6b6b"/><circle cx="260" cy="310" r="15" fill="#e0d8c8" stroke="#c4b99f" stroke-width="1.5"/><circle cx="310" cy="310" r="15" fill="#3d6b6b"/><circle cx="360" cy="310" r="15" fill="#3d6b6b"/><circle cx="410" cy="310" r="15" fill="#e0d8c8" stroke="#c4b99f" stroke-width="1.5"/><circle cx="460" cy="310" r="15" fill="#3d6b6b"/>
    <circle cx="110" cy="358" r="15" fill="#3d6b6b"/><circle cx="160" cy="358" r="15" fill="#3d6b6b"/><circle cx="210" cy="358" r="15" fill="#e0d8c8" stroke="#c4b99f" stroke-width="1.5"/><circle cx="260" cy="358" r="15" fill="#3d6b6b"/><circle cx="310" cy="358" r="15" fill="#3d6b6b"/><circle cx="360" cy="358" r="15" fill="#e0d8c8" stroke="#c4b99f" stroke-width="1.5"/><circle cx="410" cy="358" r="15" fill="#3d6b6b"/><circle cx="460" cy="358" r="15" fill="#e0d8c8" stroke="#c4b99f" stroke-width="1.5"/>
    <circle cx="110" cy="406" r="15" fill="#e0d8c8" stroke="#c4b99f" stroke-width="1.5"/><circle cx="160" cy="406" r="15" fill="#e0d8c8" stroke="#c4b99f" stroke-width="1.5"/><circle cx="210" cy="406" r="15" fill="#3d6b6b"/><circle cx="260" cy="406" r="15" fill="#3d6b6b"/><circle cx="310" cy="406" r="15" fill="#e0d8c8" stroke="#c4b99f" stroke-width="1.5"/><circle cx="360" cy="406" r="15" fill="#3d6b6b"/><circle cx="410" cy="406" r="15" fill="#3d6b6b"/><circle cx="460" cy="406" r="15" fill="#e0d8c8" stroke="#c4b99f" stroke-width="1.5"/>
  </g>
  <circle cx="120" cy="466" r="9" fill="#3d6b6b"/>
  <text x="136" y="471" font-size="12.5" fill="#4f4f4f">used this case</text>
  <circle cx="270" cy="466" r="9" fill="#e0d8c8" stroke="#c4b99f" stroke-width="1.5"/>
  <text x="286" y="471" font-size="12.5" fill="#4f4f4f">never touched → still reprocessed</text>
  <text x="322" y="510" text-anchor="middle" font-size="12" fill="#7a7060">Documented at academic medical centers running RFID at instrument level</text>

  <!-- right: outcomes -->
  <rect x="602" y="118" width="536" height="126" rx="14" fill="#e9f1f0" stroke="#bcd3d3" stroke-width="2"/>
  <text x="628" y="176" font-size="30" font-weight="800" fill="#2c5454">↓ 15–30%</text>
  <text x="628" y="206" font-size="16" font-weight="800" fill="#291c0e">reprocessing volume</text>
  <text x="628" y="228" font-size="12.5" fill="#4f6b6b">fewer instruments cleaned, packed and sterilised per case</text>

  <rect x="602" y="258" width="536" height="126" rx="14" fill="#e9f1f0" stroke="#bcd3d3" stroke-width="2"/>
  <text x="628" y="316" font-size="30" font-weight="800" fill="#2c5454">85–92% → 99%+</text>
  <text x="628" y="346" font-size="16" font-weight="800" fill="#291c0e">tray-build accuracy</text>
  <text x="628" y="368" font-size="12.5" fill="#4f6b6b">the most directly auditable metric Joint Commission can review</text>

  <rect x="602" y="398" width="536" height="126" rx="14" fill="#e9f1f0" stroke="#bcd3d3" stroke-width="2"/>
  <text x="628" y="456" font-size="30" font-weight="800" fill="#2c5454">Reclaimed</text>
  <text x="628" y="486" font-size="16" font-weight="800" fill="#291c0e">SPD capacity</text>
  <text x="628" y="508" font-size="12.5" fill="#4f6b6b">sterile-processing hours and shelf space freed for the cases that need them</text>

  <!-- footer takeaway -->
  <rect x="70" y="548" width="1060" height="88" rx="14" fill="#2a1d0f"/>
  <text x="100" y="586" font-size="15.5" font-weight="700" fill="#f0c98a">The quiet win:</text>
  <text x="234" y="586" font-size="15" fill="#f3ecdd">once you can see what actually gets used, the tray stops being a guess and becomes a decision.</text>
  <text x="234" y="610" font-size="15" fill="#f3ecdd">Every instrument you don't pack is one you don't wash, sterilise, store, or replace.</text>
</svg>
