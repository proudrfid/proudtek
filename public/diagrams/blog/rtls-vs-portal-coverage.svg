<rect x="780" y="326" width="220" height="34" rx="17" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="890" y="348" text-anchor="middle" font-size="14" font-weight="800" fill="#2c5454">location to 2 ft / 0.6 m</text>
