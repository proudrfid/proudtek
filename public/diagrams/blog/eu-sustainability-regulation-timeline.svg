<circle cx="347" cy="400" r="9" fill="#6d5a3a" stroke="#ffffff" stroke-width="2"/>
<circle cx="493" cy="400" r="9" fill="#3d6b6b" stroke="#ffffff" stroke-width="2"/>
<circle cx="787" cy="400" r="9" fill="#2d6a4f" stroke="#ffffff" stroke-width="2"/>
<circle cx="1060" cy="400" r="9" fill="#1b4332" stroke="#ffffff" stroke-width="2"/>

<!-- Year ticks -->
<line x1="200" y1="400" x2="200" y2="414" stroke="#cbb89a" stroke-width="1.6"/>
<line x1="493" y1="408" x2="493" y2="414" stroke="#cbb89a" stroke-width="1.6"/>
<line x1="787" y1="408" x2="787" y2="414" stroke="#cbb89a" stroke-width="1.6"/>
<line x1="1080" y1="400" x2="1080" y2="414" stroke="#cbb89a" stroke-width="1.6"/>
<text x="200" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#8a7a5c">2024</text>
<text x="493" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#8a7a5c">2025</text>
<text x="787" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#8a7a5c">2026</text>
<text x="1080" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#8a7a5c">2027</text>

<line x1="180" y1="486" x2="1020" y2="486" stroke="#efe7d6" stroke-width="1.4"/>
<text x="600" y="522" text-anchor="middle" font-size="15" fill="#4f4f4f">'Eco-friendly' stops being a marketing word and becomes a documented, chip-carried claim.</text>
</svg>
