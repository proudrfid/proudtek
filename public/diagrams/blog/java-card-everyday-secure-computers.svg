<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Four everyday objects that are secretly complete secure computers</title>
<desc id="d">Four panels show a SIM card running the USIM applet, a bank card running an EMV payment applet, a transit pass running a Calypso or CIPURSE applet, and an e-passport running an ICAO MRTD applet. Each object hides a hardened microcontroller running its own tiny, deeply distrustful operating system — and none of them has ever been rebooted by its owner.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EXHIBIT A · COMPUTERS YOU DIDN'T KNOW YOU OWNED</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Different plastic, same secret: a tiny, paranoid OS</text>

<!-- panel 1: SIM -->
<rect x="62" y="150" width="250" height="340" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="62" y="150" width="250" height="6" rx="3" fill="#c39a5f"/>
<path d="M 147 200 H 213 L 237 224 V 330 Q 237 340 227 340 H 147 Q 137 340 137 330 V 210 Q 137 200 147 200 Z" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
<rect x="157" y="244" width="60" height="50" rx="8" fill="#d4a755" stroke="#6d5a3a" stroke-width="1.5"/>
<line x1="157" y1="261" x2="217" y2="261" stroke="#6d5a3a" stroke-width="1.8"/>
<line x1="157" y1="278" x2="217" y2="278" stroke="#6d5a3a" stroke-width="1.8"/>
<line x1="187" y1="244" x2="187" y2="294" stroke="#6d5a3a" stroke-width="1.8"/>
<text x="187" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">SIM / eSIM</text>
<text x="187" y="448" text-anchor="middle" font-size="13" fill="#4f4f4f">runs the USIM applet</text>

<!-- panel 2: bank card -->
<rect x="332" y="150" width="250" height="340" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="332" y="150" width="250" height="6" rx="3" fill="#3d6b6b"/>
<rect x="362" y="225" width="190" height="118" rx="12" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
<rect x="384" y="253" width="42" height="34" rx="6" fill="#d4a755" stroke="#6d5a3a" stroke-width="1.5"/>
<line x1="384" y1="266" x2="426" y2="266" stroke="#6d5a3a" stroke-width="1.6"/>
<line x1="405" y1="253" x2="405" y2="287" stroke="#6d5a3a" stroke-width="1.6"/>
<path d="M 496 258 a 18 18 0 0 1 0 36" fill="none" stroke="#eef5f5" stroke-width="3" opacity="0.9"/>
<path d="M 510 248 a 30 30 0 0 1 0 56" fill="none" stroke="#eef5f5" stroke-width="2.5" opacity="0.55"/>
<rect x="384" y="310" width="92" height="9" rx="4" fill="#ffffff" opacity="0.45"/>
<text x="457" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">Bank card</text>
<text x="457" y="448" text-anchor="middle" font-size="13" fill="#4f4f4f">EMV payment applet</text>

<!-- panel 3: transit pass -->
<rect x="602" y="150" width="250" height="340" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="602" y="150" width="250" height="6" rx="3" fill="#4a5568"/>
<rect x="632" y="225" width="190" height="118" rx="12" fill="#4a5568" stroke="#39424f" stroke-width="1.5"/>
<rect x="654" y="245" width="64" height="64" rx="10" fill="#eef1f5"/>
<text x="686" y="288" text-anchor="middle" font-size="26" font-weight="800" fill="#4a5568">M</text>
<path d="M 762 258 a 18 18 0 0 1 0 36" fill="none" stroke="#eef1f5" stroke-width="3" opacity="0.9"/>
<path d="M 776 248 a 30 30 0 0 1 0 56" fill="none" stroke="#eef1f5" stroke-width="2.5" opacity="0.55"/>
<text x="727" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">Transit pass</text>
<text x="727" y="448" text-anchor="middle" font-size="13" fill="#4f4f4f">Calypso / CIPURSE applet</text>

<!-- panel 4: e-passport -->
<rect x="872" y="150" width="250" height="340" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="872" y="150" width="250" height="6" rx="3" fill="#2d6a4f"/>
<rect x="927" y="205" width="140" height="160" rx="10" fill="#2d6a4f" stroke="#1b4332" stroke-width="1.5"/>
<rect x="927" y="205" width="14" height="160" rx="7" fill="#1b4332"/>
<text x="1002" y="240" text-anchor="middle" font-size="12" letter-spacing="2" fill="#e4c98f">PASSPORT</text>
<circle cx="1002" cy="278" r="20" fill="none" stroke="#d4a755" stroke-width="2.5"/>
<circle cx="1002" cy="278" r="6" fill="#d4a755"/>
<rect x="970" y="316" width="64" height="30" rx="5" fill="none" stroke="#d4a755" stroke-width="2.5"/>
<circle cx="1002" cy="331" r="8" fill="none" stroke="#d4a755" stroke-width="2.5"/>
<line x1="1002" y1="316" x2="1002" y2="346" stroke="#d4a755" stroke-width="2.5"/>
<text x="997" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">e-Passport</text>
<text x="997" y="448" text-anchor="middle" font-size="13" fill="#4f4f4f">ICAO MRTD applet</text>

<text x="600" y="560" text-anchor="middle" font-size="14" fill="#4f4f4f">Four form factors, one pattern: a hardened microcontroller running its own tiny, deeply distrustful operating system.</text>
<text x="600" y="594" text-anchor="middle" font-size="13.5" fill="#5c5c5c">None of them has ever been rebooted. All of them assume you're the intruder.</text>
</svg>
