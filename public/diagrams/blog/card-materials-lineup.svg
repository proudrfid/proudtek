<text x="830" y="567" font-size="13.5" fill="#8b2d2d">A glass of water</text>

<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Durability numbers live in the table further down — this is the personality read.</text>
