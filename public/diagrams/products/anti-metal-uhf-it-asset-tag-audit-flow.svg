<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">From tag read to audit evidence — EPCIS 2.0 into the CMDB</title>
  <desc id="d">Four-step flow. Step 1: a 42U rack carrying six anti-metal SKUs, each encoded with a GS1 GIAI-96. Step 2: a portal or handheld read covers the rack in under 60 seconds. Step 3: each read lands as an EPCIS 2.0 ObjectEvent with CBV 2.0 bizSteps receiving, commissioning, installing, decommissioning and repairing. Step 4: the event updates the CMDB configuration-item record keyed by the GIAI-96 in ServiceNow, BMC Helix, Ivanti, Device42, Lansweeper or Snipe-IT. The result band lists the audit evidence maintained continuously: PCI DSS 12.5.1, SOX 404, NIST SP 800-53 CM-8, CMMC 3.4.1 and NERC CIP-010, with a CMDB inventory-match rate above 98 percent versus the 70 percent barcode baseline.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d6b6b"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FROM READ EVENT TO AUDIT EVIDENCE</text>
  <text x="600" y="90" text-anchor="middle" font-size="16" fill="#5c5c5c">every tag read becomes a CMDB fact an auditor can sample</text>

  <!-- step 1: tagged rack -->
  <rect x="70" y="140" width="240" height="230" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <circle cx="190" cy="170" r="13" fill="#c39a5f"/>
  <text x="190" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="190" y="207" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2c5454">Tagged rack</text>
  <rect x="155" y="220" width="70" height="78" rx="4" fill="#f4f6f8" stroke="#4a5568" stroke-width="2"/>
  <line x1="155" y1="246" x2="225" y2="246" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="155" y1="272" x2="225" y2="272" stroke="#4a5568" stroke-width="1.5"/>
  <circle cx="168" cy="233" r="4" fill="#c39a5f"/><circle cx="212" cy="233" r="4" fill="#c39a5f"/>
  <circle cx="168" cy="259" r="4" fill="#c39a5f"/><circle cx="212" cy="259" r="4" fill="#c39a5f"/>
  <circle cx="168" cy="285" r="4" fill="#c39a5f"/><circle cx="212" cy="285" r="4" fill="#c39a5f"/>
  <text x="190" y="322" text-anchor="middle" font-size="12.5" fill="#5c5c5c">six SKUs on one rack</text>
  <text x="190" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">GS1 GIAI-96 encoded</text>

  <!-- step 2: read -->
  <rect x="340" y="140" width="240" height="230" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <circle cx="460" cy="170" r="13" fill="#c39a5f"/>
  <text x="460" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="460" y="207" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2c5454">Portal / handheld read</text>
  <rect x="415" y="235" width="34" height="60" rx="8" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <path d="M 462 250 a 18 18 0 0 1 0 30" fill="none" stroke="#3d6b6b" stroke-width="3"/>
  <path d="M 474 241 a 30 30 0 0 1 0 48" fill="none" stroke="#3d6b6b" stroke-width="3"/>
  <path d="M 486 232 a 42 42 0 0 1 0 66" fill="none" stroke="#3d6b6b" stroke-width="3"/>
  <text x="460" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">42U rack in &lt; 60 s</text>
  <text x="460" y="344" text-anchor="middle" font-size="12.5" fill="#5c5c5c">no line-of-sight scanning</text>

  <!-- step 3: EPCIS event -->
  <rect x="610" y="140" width="240" height="230" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <circle cx="730" cy="170" r="13" fill="#c39a5f"/>
  <text x="730" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="730" y="207" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2c5454">EPCIS 2.0 ObjectEvent</text>
  <rect x="697" y="222" width="66" height="62" rx="6" fill="#f4f6f8" stroke="#4a5568" stroke-width="2"/>
  <line x1="709" y1="240" x2="751" y2="240" stroke="#4a5568" stroke-width="2"/>
  <line x1="709" y1="254" x2="751" y2="254" stroke="#4a5568" stroke-width="2"/>
  <line x1="709" y1="268" x2="737" y2="268" stroke="#4a5568" stroke-width="2"/>
  <text x="730" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">CBV 2.0 bizSteps</text>
  <text x="730" y="328" text-anchor="middle" font-size="12.5" fill="#5c5c5c">receiving · commissioning</text>
  <text x="730" y="346" text-anchor="middle" font-size="12.5" fill="#5c5c5c">installing · decommissioning</text>
  <text x="730" y="364" text-anchor="middle" font-size="12.5" fill="#5c5c5c">repairing</text>

  <!-- step 4: CMDB -->
  <rect x="880" y="140" width="240" height="230" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
  <circle cx="1000" cy="170" r="13" fill="#c39a5f"/>
  <text x="1000" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="1000" y="207" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2c5454">CMDB CI record</text>
  <ellipse cx="1000" cy="232" rx="34" ry="11" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <path d="M 966 232 v 40 a 34 11 0 0 0 68 0 v -40" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="1000" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">keyed by GIAI-96</text>
  <text x="1000" y="328" text-anchor="middle" font-size="12.5" fill="#5c5c5c">ServiceNow · BMC Helix</text>
  <text x="1000" y="346" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Ivanti · Device42</text>
  <text x="1000" y="364" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Lansweeper · Snipe-IT</text>

  <!-- arrows -->
  <line x1="312" y1="255" x2="334" y2="255" stroke="#3d6b6b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="582" y1="255" x2="604" y2="255" stroke="#3d6b6b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="852" y1="255" x2="874" y2="255" stroke="#3d6b6b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="600" y1="378" x2="600" y2="460" stroke="#3d6b6b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- evidence band -->
  <rect x="70" y="470" width="1050" height="120" rx="16" fill="#e7f0eb" stroke="#9fc3b0" stroke-width="1.5"/>
  <text x="595" y="505" text-anchor="middle" font-size="16" font-weight="700" fill="#1b4332">Continuous audit evidence — sampled, not reconstructed</text>
  <text x="595" y="532" text-anchor="middle" font-size="14.5" fill="#2d6a4f">PCI DSS 12.5.1 · SOX 404 · NIST SP 800-53 CM-8 · CMMC 3.4.1 · NERC CIP-010</text>
  <text x="595" y="558" text-anchor="middle" font-size="13.5" fill="#4f4f4f">&gt; 98 % CMDB inventory-match vs the 70 % barcode baseline</text>
</svg>
