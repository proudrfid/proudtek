<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A shopper taps an NFC tag and the phone opens the product's Digital Product Passport</title>
<desc id="d">Left, a shopper's phone taps an NFC tag on a product. Middle, the tag hands off a GS1 Digital Link URL along an arrow labelled resolvable URL. Right, a Digital Product Passport panel lists five lifecycle data blocks: origin and manufacture, material composition, repair and care, recycling and end-of-life, and compliance and certificates. The tag carries only the link; the cloud carries the record.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EU DIGITAL PRODUCT PASSPORT · POWERED BY NFC</text>
<text x="600" y="106" text-anchor="middle" font-size="37" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">One tap, the product's whole story</text>

<text x="300" y="170" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#c39a5f">1 · TAP</text>
<text x="527" y="170" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#c39a5f">2 · RESOLVE</text>
<text x="884" y="170" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#2d6a4f">3 · READ</text>

<rect x="178" y="200" width="104" height="192" rx="16" fill="#2c5454" stroke="#234a4a" stroke-width="2"/>
<rect x="190" y="218" width="80" height="140" rx="6" fill="#eef5f5"/>
<text x="230" y="294" text-anchor="middle" font-size="13" fill="#2c5454">tap</text>
<circle cx="230" cy="374" r="6" fill="#6b8a8a"/>
<path d="M 296 288 A 18 18 0 0 1 296 324" fill="none" stroke="#3d6b6b" stroke-width="2.4"/>
<path d="M 304 280 A 26 26 0 0 1 304 332" fill="none" stroke="#3d6b6b" stroke-width="2.4"/>
<path d="M 312 272 A 34 34 0 0 1 312 340" fill="none" stroke="#3d6b6b" stroke-width="2.4"/>
<rect x="336" y="274" width="78" height="60" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
<text x="375" y="310" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">NFC</text>
<text x="300" y="428" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Shopper taps the product</text>

<rect x="452" y="252" width="150" height="46" rx="9" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="527" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#234a4a">GS1 Digital Link</text>
<line x1="446" y1="330" x2="606" y2="330" stroke="#b9a68e" stroke-width="3"/>
<polygon points="606,323 620,330 606,337" fill="#b9a68e"/>
<text x="527" y="360" text-anchor="middle" font-size="13" fill="#6d5a3a">resolvable URL</text>

<rect x="636" y="188" width="496" height="330" rx="18" fill="#ffffff" stroke="#e4c98f" stroke-width="2"/>
<text x="660" y="224" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2d6a4f">DIGITAL PRODUCT PASSPORT</text>
<line x1="660" y1="240" x2="1108" y2="240" stroke="#ece3d0" stroke-width="1.6"/>
<circle cx="676" cy="275" r="9" fill="#2d6a4f"/><text x="702" y="281" font-size="16" fill="#291c0e">Origin &amp; manufacture</text>
<circle cx="676" cy="321" r="9" fill="#3d6b6b"/><text x="702" y="327" font-size="16" fill="#291c0e">Material composition</text>
<circle cx="676" cy="367" r="9" fill="#2d6a4f"/><text x="702" y="373" font-size="16" fill="#291c0e">Repair &amp; care</text>
<circle cx="676" cy="413" r="9" fill="#3d6b6b"/><text x="702" y="419" font-size="16" fill="#291c0e">Recycling &amp; end-of-life</text>
<circle cx="676" cy="459" r="9" fill="#2d6a4f"/><text x="702" y="465" font-size="16" fill="#291c0e">Compliance &amp; certificates</text>

<text x="600" y="562" text-anchor="middle" font-size="14.5" fill="#5c5c5c">The NFC tag carries the link; the cloud carries the record — origin to end-of-life.</text>
</svg>
