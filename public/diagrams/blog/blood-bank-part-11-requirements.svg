<text x="146" y="304">Every function tested</text><text x="146" y="324">and documented</text><text x="146" y="344">before go-live —</text><text x="146" y="364">per FDA CSV guidance.</text>
<text x="373" y="304">Every create, edit</text><text x="373" y="324">and delete logged</text><text x="373" y="344">with user, timestamp</text><text x="373" y="364">and reason.</text>
<text x="600" y="304">Unique to the user,</text><text x="600" y="324">traceable and</text><text x="600" y="344">repudiation-proof —</text><text x="600" y="364">password + biometric.</text>
<text x="827" y="304">Role-based: techs</text><text x="827" y="324">read, supervisors</text><text x="827" y="344">edit, few approve</text><text x="827" y="364">the final record.</text>
<text x="1054" y="304">At least 10 years</text><text x="1054" y="324">per FDA and AABB,</text><text x="1054" y="344">with restorable</text><text x="1054" y="364">archived history.</text>
