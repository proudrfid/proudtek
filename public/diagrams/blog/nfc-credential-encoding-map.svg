<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">What credential encoding writes onto an RFID key card, and how the sequence counter invalidates an old card</title>
<desc id="d">On the left, a card memory map lists the fields encoding writes onto the card: room or door group, arrival date, departure date, access-level flags such as pool, gym and parking, and a sequence counter. On the right, the re-encoding rule: issuing a replacement card raises the counter from N to N plus one, and the lock then rejects any card presenting a lower sequence number, so the previous card stops working automatically.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CREDENTIAL ENCODING · WHAT'S ON THE CARD</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">Encoding writes the cardholder's rights onto the card — and a counter quietly retires the old one.</text>

<!-- LEFT: memory map -->
<text x="96" y="140" font-size="14" font-weight="800" letter-spacing="0.6" fill="#6d5a3a">CARD MEMORY MAP</text>
<rect x="96" y="156" width="470" height="60" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<rect x="96" y="156" width="9" height="60" rx="4" fill="#3d6b6b"/>
<text x="124" y="182" font-size="14.5" font-weight="700" fill="#291c0e">Room / door group</text>
<text x="124" y="203" font-size="12.5" fill="#5c5c5c">which openings this card may unlock</text>

<rect x="96" y="224" width="470" height="60" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<rect x="96" y="224" width="9" height="60" rx="4" fill="#3d6b6b"/>
<text x="124" y="250" font-size="14.5" font-weight="700" fill="#291c0e">Arrival date</text>
<text x="124" y="271" font-size="12.5" fill="#5c5c5c">when access begins</text>

<rect x="96" y="292" width="470" height="60" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<rect x="96" y="292" width="9" height="60" rx="4" fill="#3d6b6b"/>
<text x="124" y="318" font-size="14.5" font-weight="700" fill="#291c0e">Departure date</text>
<text x="124" y="339" font-size="12.5" fill="#5c5c5c">when access expires</text>

<rect x="96" y="360" width="470" height="60" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<rect x="96" y="360" width="9" height="60" rx="4" fill="#c39a5f"/>
<text x="124" y="386" font-size="14.5" font-weight="700" fill="#291c0e">Access-level flags</text>
<text x="124" y="407" font-size="12.5" fill="#5c5c5c">pool · gym · parking · common areas</text>

<rect x="96" y="428" width="470" height="60" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="96" y="428" width="9" height="60" rx="4" fill="#2c5454"/>
<text x="124" y="454" font-size="14.5" font-weight="700" fill="#291c0e">Sequence counter</text>
<text x="124" y="475" font-size="12.5" fill="#5c5c5c">rises each time a card is re-encoded</text>

<!-- RIGHT: sequence rule -->
<text x="636" y="140" font-size="14" font-weight="800" letter-spacing="0.6" fill="#6d5a3a">RE-ENCODE = INSTANT INVALIDATION</text>

<rect x="636" y="168" width="210" height="120" rx="12" fill="#f7ecec" stroke="#d8a9a9" stroke-width="1.8"/>
<rect x="660" y="196" width="40" height="30" rx="4" fill="#c9b3b3"/>
<text x="741" y="212" text-anchor="middle" font-size="14" font-weight="800" fill="#8b2d2d">OLD CARD</text>
<text x="741" y="250" text-anchor="middle" font-size="13" fill="#5c5c5c">counter = N</text>
<text x="741" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#8b2d2d">now rejected</text>

<rect x="918" y="168" width="210" height="120" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/>
<rect x="942" y="196" width="40" height="30" rx="4" fill="#a9cfb5"/>
<text x="1023" y="212" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">NEW CARD</text>
<text x="1023" y="250" text-anchor="middle" font-size="13" fill="#5c5c5c">counter = N+1</text>
<text x="1023" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">now valid</text>

<line x1="846" y1="228" x2="912" y2="228" stroke="#291c0e" stroke-width="2.6"/>
<polygon points="912,228 896,221 896,235" fill="#291c0e"/>
<text x="879" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#4f4f4f">re-issue</text>

<rect x="636" y="320" width="492" height="168" rx="12" fill="#faf7f0" stroke="#eadfce" stroke-width="1.6"/>
<text x="660" y="356" font-size="14.5" font-weight="800" fill="#2c5454">The rule the lock enforces</text>
<text x="660" y="390" font-size="13.5" fill="#333333">The lock remembers the highest sequence number it</text>
<text x="660" y="412" font-size="13.5" fill="#333333">has seen. Present a lower one and it's refused — so the</text>
<text x="660" y="434" font-size="13.5" fill="#333333">moment a guest taps their new card, the old card dies.</text>
<text x="660" y="466" font-size="12.5" font-style="italic" fill="#5c5c5c">No blacklist push required for the room-change case.</text>

<text x="600" y="556" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Encoding happens at the front desk or a kiosk over a USB NFC reader — the card leaves carrying its own rulebook.</text>
</svg>
