<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five NFC memory-sizing mistakes paired with the fix for each</title>
<desc id="d">A two-column map with five rows. Buying NTAG216 just in case, where 888 bytes costs 2 to 3 times NTAG213's 144 bytes, is fixed by speccing 215 or 216 only when the payload exceeds 130 characters. Forgetting NDEF overhead, where each record adds 4 to 12 bytes of header, is fixed by running a real encoding test. Confusing total EEPROM with user memory, where NTAG213 is 180 bytes total but 144 usable, is fixed by sizing with the user-memory number. Ignoring the originality signature is fixed by choosing NTAG 424 DNA with 416 bytes and SUN tamper-evidence for brand protection. Underestimating payload growth is fixed by speccing one tier above today's minimum for multi-year programs.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE MEMORY-SIZING MISTAKES — AND THE FIX</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">The over-spec and mid-deployment scope-change traps procurement teams hit.</text>

<text x="92" y="118" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#a85a5a">THE MISTAKE</text>
<text x="672" y="118" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#3a6a4a">THE FIX</text>

<!-- row 1 -->
<rect x="64" y="130" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="130" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="162" font-size="15.5" font-weight="800" fill="#291c0e">Buying NTAG216 &apos;just in case&apos;</text>
<text x="92" y="185" font-size="12.5" fill="#7a5555">888 B costs 2–3× NTAG213&apos;s 144 B.</text>
<polyline points="576,163 594,171 576,179" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="130" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="170" r="12" fill="#1f6f3a"/><polyline points="634,170 638,175 646,164" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="176" font-size="14" font-weight="700" fill="#26543a">Spec 215/216 only if the payload really exceeds 130 chars.</text>

<!-- row 2 -->
<rect x="64" y="220" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="220" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="252" font-size="15.5" font-weight="800" fill="#291c0e">Forgetting NDEF overhead</text>
<text x="92" y="275" font-size="12.5" fill="#7a5555">Each record adds 4–12 B of header.</text>
<polyline points="576,253 594,261 576,269" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="220" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="260" r="12" fill="#1f6f3a"/><polyline points="634,260 638,265 646,254" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="266" font-size="14" font-weight="700" fill="#26543a">Run a real encoding test before trusting the math.</text>

<!-- row 3 -->
<rect x="64" y="310" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="310" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="342" font-size="15.5" font-weight="800" fill="#291c0e">Total vs user memory</text>
<text x="92" y="365" font-size="12.5" fill="#7a5555">NTAG213 is 180 B EEPROM but 144 B usable.</text>
<polyline points="576,343 594,351 576,359" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="310" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="350" r="12" fill="#1f6f3a"/><polyline points="634,350 638,355 646,344" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="356" font-size="14" font-weight="700" fill="#26543a">Always size with the user-memory number.</text>

<!-- row 4 -->
<rect x="64" y="400" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="400" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="432" font-size="15.5" font-weight="800" fill="#291c0e">Ignoring the originality signature</text>
<text x="92" y="455" font-size="12.5" fill="#7a5555">Large unsecured memory ≠ brand protection.</text>
<polyline points="576,433 594,441 576,449" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="400" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="440" r="12" fill="#1f6f3a"/><polyline points="634,440 638,445 646,434" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="446" font-size="14" font-weight="700" fill="#26543a">NTAG 424 DNA (416 B) adds SUN tamper-evidence.</text>

<!-- row 5 -->
<rect x="64" y="490" width="500" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="490" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="92" y="522" font-size="15.5" font-weight="800" fill="#291c0e">Underestimating payload growth</text>
<text x="92" y="545" font-size="12.5" fill="#7a5555">A year-2 second NDEF record blows the budget.</text>
<polyline points="576,523 594,531 576,539" fill="none" stroke="#b0895a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="612" y="490" width="524" height="80" rx="11" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<circle cx="640" cy="530" r="12" fill="#1f6f3a"/><polyline points="634,530 638,535 646,524" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="536" font-size="14" font-weight="700" fill="#26543a">Spec one tier above today&apos;s minimum for multi-year.</text>

<text x="600" y="612" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Over-spec wastes budget; under-spec forces a re-tag. Size once, from the real payload.</text>
</svg>
