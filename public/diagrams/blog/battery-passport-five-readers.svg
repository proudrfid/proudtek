<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="readerst readersd" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="readerst">One battery, five readers</title>
  <desc id="readersd">One battery record serves five audiences who never meet. Manufacturing trace — producer, plant, batch and chemistry with hazard flags — is checked by auditors. Performance and durability — capacity, cycle life, temperature range and thermal-runaway protection — is read by fleet operators. Carbon footprint — GWP per kWh via certified life-cycle assessment, no offsets — is for regulators. Recycled content — the share of cobalt, lithium, lead and nickel from recycled sources — matters to recyclers. End-of-life status — state-of-health, second-life suitability and recycling pathway — is used by second-life operators. Each needs a different slice of the same record.</desc>
  <defs><radialGradient id="readersbg" cx="50%" cy="16%" r="95%"><stop offset="0%" stop-color="#f8f0df"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#readersbg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="24" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="57" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="1.3" fill="#6d5a3a">One battery, five readers who never meet</text>
  <rect x="75" y="128" width="196" height="330" rx="18" fill="#fdf8ef" stroke="#c39a5f" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="75" y="128" width="196" height="8" rx="4" fill="#c39a5f"/>
  <circle cx="173.0" cy="175" r="27" fill="#c39a5f"/>
  <polygon points="159.0,171 169.0,163 189.0,163 179.0,171" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/><rect x="159.0" y="171" width="20" height="18" fill="none" stroke="#fff" stroke-width="2.6"/><line x1="179.0" y1="189" x2="179.0" y2="171" stroke="#fff" stroke-width="2.6"/><line x1="179.0" y1="171" x2="189.0" y2="163" stroke="#fff" stroke-width="2.6"/>
  <text x="173.0" y="228.0" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Manufacturing</text>
  <text x="173.0" y="252.0" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">trace</text>
  <rect x="93.0" y="260" width="160.0" height="40" rx="20" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="173.0" y="287.0" text-anchor="middle" font-size="17" font-weight="800" fill="#c39a5f">Auditors</text>
  <text x="173.0" y="326.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">Producer, plant,</text>
  <text x="173.0" y="348.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">batch, chemistry,</text>
  <text x="173.0" y="370.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">hazard flags.</text>
  <rect x="289" y="128" width="196" height="330" rx="18" fill="#f1f3f6" stroke="#4a5568" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="289" y="128" width="196" height="8" rx="4" fill="#4a5568"/>
  <circle cx="387.0" cy="175" r="27" fill="#4a5568"/>
  <path d="M371.0 182 A18 18 0 0 1 403.0 182" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><line x1="387.0" y1="182" x2="396.0" y2="168" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="387.0" cy="182" r="3.2" fill="#fff"/>
  <text x="387.0" y="228.0" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Performance</text>
  <text x="387.0" y="252.0" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">&amp; durability</text>
  <rect x="307.0" y="260" width="160.0" height="40" rx="20" fill="#e2e6ec" stroke="#4a5568" stroke-width="1.5"/>
  <text x="387.0" y="287.0" text-anchor="middle" font-size="17" font-weight="800" fill="#4a5568">Fleet ops</text>
  <text x="387.0" y="326.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">Capacity, cycle life,</text>
  <text x="387.0" y="348.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">temp range, thermal-</text>
  <text x="387.0" y="370.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">runaway guard.</text>
  <rect x="502" y="128" width="196" height="330" rx="18" fill="#f0f6f2" stroke="#2d6a4f" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="502" y="128" width="196" height="8" rx="4" fill="#2d6a4f"/>
  <circle cx="600.0" cy="175" r="27" fill="#2d6a4f"/>
  <path d="M589.0 188 C585.0 169 603.0 160 614.0 163 C611.0 181 598.0 189 589.0 188 Z" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"/><path d="M593.0 185 C599.0 177 605.0 171 611.0 166" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="600.0" y="228.0" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Carbon</text>
  <text x="600.0" y="252.0" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">footprint</text>
  <rect x="520.0" y="260" width="160.0" height="40" rx="20" fill="#dcebe1" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="600.0" y="287.0" text-anchor="middle" font-size="17" font-weight="800" fill="#2d6a4f">Regulators</text>
  <text x="600.0" y="326.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">GWP per kWh,</text>
  <text x="600.0" y="348.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">certified LCA,</text>
  <text x="600.0" y="370.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">no offsets.</text>
  <rect x="715" y="128" width="196" height="330" rx="18" fill="#eef5f5" stroke="#3d6b6b" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="715" y="128" width="196" height="8" rx="4" fill="#3d6b6b"/>
  <circle cx="813.0" cy="175" r="27" fill="#3d6b6b"/>
  <path d="M800.0 172 A15 15 0 1 1 806.0 188" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><polygon points="795.0,169 807.0,169 801.0,179" fill="#fff"/>
  <text x="813.0" y="228.0" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Recycled</text>
  <text x="813.0" y="252.0" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">content</text>
  <rect x="733.0" y="260" width="160.0" height="40" rx="20" fill="#d8e8e8" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="813.0" y="287.0" text-anchor="middle" font-size="17" font-weight="800" fill="#3d6b6b">Recyclers</text>
  <text x="813.0" y="326.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">Share of cobalt,</text>
  <text x="813.0" y="348.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">lithium, lead, nickel</text>
  <text x="813.0" y="370.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">from recycling.</text>
  <rect x="929" y="128" width="196" height="330" rx="18" fill="#fbeeee" stroke="#8b2d2d" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="929" y="128" width="196" height="8" rx="4" fill="#8b2d2d"/>
  <circle cx="1027.0" cy="175" r="27" fill="#8b2d2d"/>
  <rect x="1007.0" y="164" width="34" height="22" rx="4" fill="none" stroke="#fff" stroke-width="3"/><rect x="1041.0" y="171" width="5" height="8" rx="2" fill="#fff"/><path d="M1011.0 175 L1019.0 175 L1023.0 168 L1028.0 182 L1032.0 175 L1039.0 175" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1027.0" y="228.0" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">End-of-life</text>
  <text x="1027.0" y="252.0" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">status</text>
  <rect x="947.0" y="260" width="160.0" height="40" rx="20" fill="#f0d9d9" stroke="#8b2d2d" stroke-width="1.5"/>
  <text x="1027.0" y="287.0" text-anchor="middle" font-size="17" font-weight="800" fill="#8b2d2d">Second-life</text>
  <text x="1027.0" y="326.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">State-of-health,</text>
  <text x="1027.0" y="348.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">reuse fit, recycling</text>
  <text x="1027.0" y="370.0" text-anchor="middle" font-size="14" font-weight="400" fill="#4f4f4f">pathway.</text>
  <text x="600.0" y="590.0" text-anchor="middle" font-size="16.5" font-weight="700" fill="#6d5a3a">Each reader needs a different slice of the truth — and none of them gets to phone the others.</text>
  <text x="600.0" y="614.0" text-anchor="middle" font-size="16.5" font-weight="400" fill="#6d5a3a">One record has to serve all five, for a decade or more.</text>
</svg>
