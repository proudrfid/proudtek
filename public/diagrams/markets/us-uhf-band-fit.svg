<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ubTitle ubDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ubTitle">The US UHF RFID band is 902-928 MHz — EU-tuned inlays underperform in US portals</title>
  <desc id="ubDesc">Frequency map from 860 to 930 megahertz. The United States band under FCC Part 15.247 spans 902 to 928 megahertz with frequency hopping across at least 50 channels at 1 watt conducted power, 4 watts EIRP with a 6 dBi antenna. The European Union lower band under ETSI EN 302 208 is a much narrower sliver at 865 to 868 megahertz with 2 watts ERP across four high-power channels. Below the map, two outcome cards: a US-tuned inlay in a US portal delivers full rated read range, while an EU-tuned inlay in a US portal has its antenna resonance below the band, giving shorter and flakier reads. Footnote: ETSI also defines a 915 to 921 megahertz upper band at 4 watts ERP with limited rollout, and passive tags are tuned rather than FCC-certified — the reader carries the FCC ID.</desc>
  <defs>
    <radialGradient id="ubBg" cx="50%" cy="18%" r="92%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#ubBg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="58" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="1.1" fill="#6d5a3a">GET THE BAND RIGHT — US UHF IS 902–928 MHz</text>
  <text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">FCC Part 15.247 · frequency hopping across 50+ channels · 1 W conducted / 4 W EIRP</text>

  <!-- EU lower band label -->
  <text x="226" y="286" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.8" fill="#234a4a">EU LOWER BAND</text>
  <text x="226" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">865–868 MHz · 2 W ERP</text>
  <text x="226" y="332" text-anchor="middle" font-size="12.5" fill="#4f4f4f">four 200 kHz channels</text>

  <!-- US band block -->
  <rect x="692" y="250" width="342" height="180" rx="10" fill="#4a5568"/>
  <text x="863" y="300" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1" fill="#ffffff">UNITED STATES</text>
  <text x="863" y="334" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">902–928 MHz</text>
  <text x="863" y="362" text-anchor="middle" font-size="13.5" fill="#d5dbe4">FCC Part 15.247 · 50+ hop channels</text>

  <!-- EU lower band block (narrow sliver, the visual point) -->
  <rect x="206" y="346" width="40" height="84" rx="6" fill="#3d6b6b"/>
  <line x1="226" y1="338" x2="226" y2="346" stroke="#3d6b6b" stroke-width="1.5"/>

  <!-- frequency axis -->
  <line x1="120" y1="430" x2="1080" y2="430" stroke="#291c0e" stroke-width="2"/>
  <line x1="140" y1="430" x2="140" y2="438" stroke="#291c0e" stroke-width="2"/>
  <line x1="271" y1="430" x2="271" y2="438" stroke="#291c0e" stroke-width="2"/>
  <line x1="403" y1="430" x2="403" y2="438" stroke="#291c0e" stroke-width="2"/>
  <line x1="534" y1="430" x2="534" y2="438" stroke="#291c0e" stroke-width="2"/>
  <line x1="666" y1="430" x2="666" y2="438" stroke="#291c0e" stroke-width="2"/>
  <line x1="797" y1="430" x2="797" y2="438" stroke="#291c0e" stroke-width="2"/>
  <line x1="929" y1="430" x2="929" y2="438" stroke="#291c0e" stroke-width="2"/>
  <line x1="1060" y1="430" x2="1060" y2="438" stroke="#291c0e" stroke-width="2"/>
  <text x="140" y="458" text-anchor="middle" font-size="13" fill="#5c5c5c">860</text>
  <text x="271" y="458" text-anchor="middle" font-size="13" fill="#5c5c5c">870</text>
  <text x="403" y="458" text-anchor="middle" font-size="13" fill="#5c5c5c">880</text>
  <text x="534" y="458" text-anchor="middle" font-size="13" fill="#5c5c5c">890</text>
  <text x="666" y="458" text-anchor="middle" font-size="13" fill="#5c5c5c">900</text>
  <text x="797" y="458" text-anchor="middle" font-size="13" fill="#5c5c5c">910</text>
  <text x="929" y="458" text-anchor="middle" font-size="13" fill="#5c5c5c">920</text>
  <text x="1060" y="458" text-anchor="middle" font-size="13" fill="#5c5c5c">930</text>
  <text x="1104" y="458" text-anchor="start" font-size="12.5" fill="#8a949c">MHz</text>

  <text x="600" y="490" text-anchor="middle" font-size="12.5" fill="#4f4f4f">ETSI also defines a 915–921 MHz upper band (4 W ERP, limited rollout) — don't confuse it with US tuning</text>

  <!-- outcome cards -->
  <rect x="64" y="512" width="524" height="118" rx="14" fill="#eaf5ec" stroke="#9cccae" stroke-width="2"/>
  <text x="88" y="548" font-size="16" font-weight="800" fill="#1f6f3a">US-tuned inlay in a US portal</text>
  <text x="88" y="578" font-size="14" fill="#291c0e">Antenna matched to 902–928 MHz.</text>
  <text x="88" y="602" font-size="14" fill="#291c0e">Full rated read range on FCC-band readers.</text>

  <rect x="612" y="512" width="524" height="118" rx="14" fill="#f5e6e6" stroke="#d9a3a3" stroke-width="2"/>
  <text x="636" y="548" font-size="16" font-weight="800" fill="#8b2d2d">EU-tuned inlay in a US portal</text>
  <text x="636" y="578" font-size="14" fill="#291c0e">Antenna resonance sits below the US band.</text>
  <text x="636" y="602" font-size="14" fill="#291c0e">Shorter, flakier reads — then a re-order.</text>

  <text x="600" y="650" text-anchor="middle" font-size="12.5" fill="#6d5a3a">Passive tags are tuned, not FCC-certified — the reader carries the FCC ID</text>
</svg>
