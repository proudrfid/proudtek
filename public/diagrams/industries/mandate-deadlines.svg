<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Regulatory and retailer mandates set hard deadlines</title>
<desc id="d">A timeline of RFID compliance deadlines — US DSCSA 2024, FSMA 204 January 2026, EU Battery passport 2027, EU Digital Product Passport 2027-2030 — plus ongoing retailer mandates like Walmart.</desc>
<defs><radialGradient id="bg" cx="50%" cy="28%" r="82%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="60" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2" fill="#6d5a3a">MANDATES SET THE CLOCK</text>
<circle cx="150" cy="360" r="34" fill="#1f4e79"/><g transform="translate(132.7,342.7) scale(0.72)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"><path d="M24 7a17 17 0 1 0 0.1 0Z"/><path d="M24 14v10l7 4"/></g>
<line x1="210" y1="360" x2="1090" y2="360" stroke="#c39a5f" stroke-width="4"/>
<path d="M1085 351 l18 9 -18 9Z" fill="#c39a5f"/>
<circle cx="320" cy="360" r="9" fill="#6d5a3a" stroke="#fff" stroke-width="3"/>
<text x="320" y="264" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">2024</text>
<text x="320" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79">US DSCSA</text>
<text x="320" y="312" text-anchor="middle" font-size="13.5" fill="#4f4f4f">pharma serialization</text>
<line x1="320" y1="360" x2="320" y2="278" stroke="#c39a5f" stroke-width="1.4" opacity="0.4"/>
<circle cx="520" cy="360" r="9" fill="#6d5a3a" stroke="#fff" stroke-width="3"/>
<text x="520" y="418" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">Jan 2026</text>
<text x="520" y="444" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79">FSMA 204</text>
<text x="520" y="466" text-anchor="middle" font-size="13.5" fill="#4f4f4f">food traceability</text>
<line x1="520" y1="360" x2="520" y2="388" stroke="#c39a5f" stroke-width="1.4" opacity="0.4"/>
<circle cx="720" cy="360" r="9" fill="#6d5a3a" stroke="#fff" stroke-width="3"/>
<text x="720" y="264" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">Feb 2027</text>
<text x="720" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79">EU Battery</text>
<text x="720" y="312" text-anchor="middle" font-size="13.5" fill="#4f4f4f">battery passport</text>
<line x1="720" y1="360" x2="720" y2="278" stroke="#c39a5f" stroke-width="1.4" opacity="0.4"/>
<circle cx="930" cy="360" r="9" fill="#6d5a3a" stroke="#fff" stroke-width="3"/>
<text x="930" y="418" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">2027–30</text>
<text x="930" y="444" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79">EU DPP</text>
<text x="930" y="466" text-anchor="middle" font-size="13.5" fill="#4f4f4f">textiles, electronics…</text>
<line x1="930" y1="360" x2="930" y2="388" stroke="#c39a5f" stroke-width="1.4" opacity="0.4"/>
<text x="150" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">+ Walmart</text>
<text x="150" y="448" text-anchor="middle" font-size="12.5" fill="#4f4f4f">ongoing</text>
<text x="600" y="632" text-anchor="middle" font-size="16" font-weight="600" fill="#4f4f4f">Meet the deadline before the penalty cut-over — then find the ROI inside it.</text>
