<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A mixed air-and-sea RFID shipping strategy</title>
<desc id="d">A mixed strategy splits each order: 10-20% air-shipped for the urgent fraction, 80-90% by sea for the bulk. A timeline shows the partial air shipment arriving on day 7 and the sea balance on day 35. Three supporting patterns: a quarterly sea container plus monthly air top-ups; a full container to a bonded destination warehouse pulled as needed; and express samples of 100 QC units air-shipped for $50-200 per large order. One row in red marks what to avoid: 100% air overpays, 100% sea is slow to demand spikes, and switching mid-shipment strands inventory.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MIX AIR AND SEA, PER ORDER</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Stop picking a side — the best programs run several of these at once.</text>

<!-- split bar -->
<rect x="80" y="124" width="156" height="54" rx="8" fill="#3d6b6b"/>
<rect x="240" y="124" width="880" height="54" rx="8" fill="#4a5568"/>
<text x="158" y="157" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">10-20%</text>
<text x="680" y="157" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">80-90%</text>
<text x="158" y="198" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">AIR · urgent</text>
<text x="680" y="198" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3f4657">SEA · bulk</text>

<!-- timeline -->
<line x1="120" y1="268" x2="1080" y2="268" stroke="#d9d2c4" stroke-width="2.5"/>
<circle cx="269" cy="268" r="9" fill="#3d6b6b"/>
<circle cx="866" cy="268" r="9" fill="#4a5568"/>
<text x="269" y="250" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2c5454">DAY 7</text>
<text x="269" y="292" text-anchor="middle" font-size="12.5" fill="#5c5c5c">partial arrives by air</text>
<text x="866" y="250" text-anchor="middle" font-size="13.5" font-weight="800" fill="#3f4657">DAY 35</text>
<text x="866" y="292" text-anchor="middle" font-size="12.5" fill="#5c5c5c">balance arrives by sea</text>

<!-- pattern rows -->
<rect x="80" y="330" width="1040" height="44" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="108" cy="352" r="5" fill="#3d6b6b"/>
<text x="128" y="357" font-size="14" fill="#291c0e">Quarterly sea container + monthly air top-ups for between-quarter demand spikes</text>

<rect x="80" y="384" width="1040" height="44" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="108" cy="406" r="5" fill="#3d6b6b"/>
<text x="128" y="411" font-size="14" fill="#291c0e">Full container → bonded warehouse in destination country, pull from stock as needed</text>

<rect x="80" y="438" width="1040" height="44" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="108" cy="460" r="5" fill="#3d6b6b"/>
<text x="128" y="465" font-size="14" fill="#291c0e">Express samples: $50-200 air-ships 100 QC units to validate each large order</text>

<!-- avoid -->
<rect x="80" y="500" width="1040" height="46" rx="10" fill="#fbf1f1" stroke="#e6c9c9" stroke-width="1.5"/>
<text x="108" y="522" font-size="13.5" font-weight="800" fill="#8b2d2d">AVOID</text>
<text x="108" y="539" font-size="12.5" fill="#7a2a2a">100% air (overpay) · 100% sea (slow to spikes) · switching mid-shipment (stranded inventory)</text>

<text x="600" y="588" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Partial by air in a week, the rest by sea in five — customers feel fast, you pay slow.</text>
</svg>
