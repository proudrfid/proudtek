<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="hlS4Title hlS4Desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="hlS4Title">The compliance stack a hospital linen audit trail must satisfy</title>
  <desc id="hlS4Desc">Five authorities that each expect documentation from a hospital linen program: Joint Commission Environment of Care and Infection Prevention standards; OSHA Bloodborne Pathogens Standard 29 CFR 1910.1030; CDC HICPAC guidelines setting a laundering minimum of at least 71 degrees Celsius or 160 Fahrenheit for at least 25 minutes; AAMI ST65 and ST79 for reusable surgical textiles; and TRSA Hygienically Clean Healthcare certification. Each row shows what the authority asks for and how the RFID record answers.</desc>

  <defs>
    <radialGradient id="s4Bg" cx="50%" cy="16%" r="95%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f0ebdf"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#s4Bg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="58" text-anchor="middle" font-size="25" font-weight="800" fill="#291c0e">The stack a linen audit trail must satisfy</text>
  <text x="600" y="88" text-anchor="middle" font-size="15.5" fill="#2d6a4f">One paper trail — several authorities, each entitled to ask to see it.</text>

  <!-- rows: y = 116, 214, 312, 410, 508 ; h 86 ; x 62..1138 -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

    <!-- Row 1 Joint Commission -->
    <rect x="62" y="116" width="1076" height="86" rx="14" fill="#eef4f6" stroke="#bcd4dd" stroke-width="2"/>
    <rect x="62" y="116" width="8" height="86" rx="4" fill="#1f4e79"/>
    <rect x="86" y="132" width="230" height="54" rx="10" fill="#1f4e79"/>
    <text x="201" y="156" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Joint Commission</text>
    <text x="201" y="176" text-anchor="middle" font-size="12.5" fill="#cfe0f0">EC + IC standards</text>
    <text x="338" y="152" font-size="14" fill="#33475b">Documented evidence: contaminated linen segregated,</text>
    <text x="338" y="172" font-size="14" fill="#33475b">transported and processed under hygienic control.</text>
    <rect x="854" y="140" width="266" height="38" rx="10" fill="#ffffff" stroke="#bcd4dd" stroke-width="1.5"/>
    <text x="987" y="164" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f4e79">→ per-item zone logs</text>

    <!-- Row 2 OSHA -->
    <rect x="62" y="214" width="1076" height="86" rx="14" fill="#f2f0ec" stroke="#cdc4b4" stroke-width="2"/>
    <rect x="62" y="214" width="8" height="86" rx="4" fill="#4a5568"/>
    <rect x="86" y="230" width="230" height="54" rx="10" fill="#4a5568"/>
    <text x="201" y="254" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">OSHA</text>
    <text x="201" y="274" text-anchor="middle" font-size="12" fill="#d9dee6">Bloodborne · 29 CFR 1910.1030</text>
    <text x="338" y="250" font-size="14" fill="#3a4351">Handling, transport and storage of contaminated linen,</text>
    <text x="338" y="270" font-size="14" fill="#3a4351">including PPE for the staff who touch it.</text>
    <rect x="854" y="238" width="266" height="38" rx="10" fill="#ffffff" stroke="#cdc4b4" stroke-width="1.5"/>
    <text x="987" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a5568">→ who handled it, when</text>

    <!-- Row 3 CDC HICPAC -->
    <rect x="62" y="312" width="1076" height="86" rx="14" fill="#f0f6f1" stroke="#a9c8b2" stroke-width="2"/>
    <rect x="62" y="312" width="8" height="86" rx="4" fill="#2d6a4f"/>
    <rect x="86" y="328" width="230" height="54" rx="10" fill="#2d6a4f"/>
    <text x="201" y="352" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">CDC HICPAC</text>
    <text x="201" y="372" text-anchor="middle" font-size="12.5" fill="#cfe6d6">environmental control</text>
    <text x="338" y="348" font-size="14" fill="#33503f">Minimum laundering: <tspan font-weight="700" fill="#1f6f3a">≥71°C / 160°F for ≥25 min</tspan>,</text>
    <text x="338" y="368" font-size="14" fill="#33503f">or a low-temperature wash with the right chemistry.</text>
    <rect x="854" y="336" width="266" height="38" rx="10" fill="#ffffff" stroke="#a9c8b2" stroke-width="1.5"/>
    <text x="987" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6f3a">→ wash-cycle records</text>

    <!-- Row 4 AAMI -->
    <rect x="62" y="410" width="1076" height="86" rx="14" fill="#eef3f3" stroke="#b6cccc" stroke-width="2"/>
    <rect x="62" y="410" width="8" height="86" rx="4" fill="#3d6b6b"/>
    <rect x="86" y="426" width="230" height="54" rx="10" fill="#3d6b6b"/>
    <text x="201" y="450" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">AAMI ST65 / ST79</text>
    <text x="201" y="470" text-anchor="middle" font-size="12.5" fill="#d3e5e5">surgical textiles</text>
    <text x="338" y="446" font-size="14" fill="#31514f">Reusable surgical drapes, gowns and wraps must retire</text>
    <text x="338" y="466" font-size="14" fill="#31514f">before fabric breakdown — a Joint Commission expectation.</text>
    <rect x="854" y="434" width="266" height="38" rx="10" fill="#ffffff" stroke="#b6cccc" stroke-width="1.5"/>
    <text x="987" y="458" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3d6b6b">→ per-item cycle counters</text>

    <!-- Row 5 TRSA -->
    <rect x="62" y="508" width="1076" height="86" rx="14" fill="#f6f0e6" stroke="#e2d3b4" stroke-width="2"/>
    <rect x="62" y="508" width="8" height="86" rx="4" fill="#8a6d33"/>
    <rect x="86" y="524" width="230" height="54" rx="10" fill="#8a6d33"/>
    <text x="201" y="548" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">TRSA Hygienically</text>
    <text x="201" y="568" text-anchor="middle" font-size="13" fill="#efe2c6">Clean Healthcare</text>
    <text x="338" y="544" font-size="14" fill="#5b4a2c">Many laundry partners (Cintas, Aramark, ImageFIRST)</text>
    <text x="338" y="564" font-size="14" fill="#5b4a2c">certify under it — traceability is a documented best practice.</text>
    <rect x="854" y="532" width="266" height="38" rx="10" fill="#ffffff" stroke="#e2d3b4" stroke-width="1.5"/>
    <text x="987" y="556" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a6d33">→ contamination traceability</text>
  </g>

  <text x="600" y="632" text-anchor="middle" font-size="13.5" fill="#6c5127">RFID's job isn't to change the rules — it's to have each one's paperwork ready before it's asked for.</text>
</svg>
