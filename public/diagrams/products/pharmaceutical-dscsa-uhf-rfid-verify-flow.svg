<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">DSCSA interoperable verification flow at the receipt portal</title>
  <desc id="d">A four-step DSCSA verification flow: the receipt portal reads each item's SGTIN at more than 2,000 items per minute; the warehouse management system submits the EPC to the manufacturer's EPCIS verification endpoint; the manufacturer responds within the 90-second SLA; a verified item is released, while a not-verified or suspect item is quarantined and enters a 24-hour investigation. A note records a 99.96% first-query verification rate, with the remaining 0.04% resolved within the SLA window.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DSCSA VERIFICATION AT THE RECEIPT PORTAL</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">UHF RAIN reads through the carton; each SGTIN is verified against the manufacturer's source</text>

  <rect x="70" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="170" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="187" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1 · READ</text>
  <text x="187" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Portal reads each</text>
  <text x="187" y="272" text-anchor="middle" font-size="14" fill="#291c0e">item's SGTIN</text>
  <text x="187" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">2,000+ items / minute,</text>
  <text x="187" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">through the carton</text>

  <rect x="345" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="345" y="170" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="462" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2 · QUERY</text>
  <text x="462" y="248" text-anchor="middle" font-size="14" fill="#291c0e">WMS submits the EPC</text>
  <text x="462" y="272" text-anchor="middle" font-size="14" fill="#291c0e">to the manufacturer</text>
  <text x="462" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">GS1 EPCIS lightweight</text>
  <text x="462" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">verification over HTTPS</text>

  <rect x="620" y="170" width="235" height="205" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="620" y="170" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="737" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3 · VERIFY</text>
  <text x="737" y="248" text-anchor="middle" font-size="14" fill="#291c0e">Manufacturer responds</text>
  <text x="737" y="272" text-anchor="middle" font-size="14" fill="#291c0e">within 90 seconds</text>
  <text x="737" y="308" text-anchor="middle" font-size="12.5" fill="#5c5c5c">VERIFIED / NOT_VERIFIED</text>
  <text x="737" y="326" text-anchor="middle" font-size="12.5" fill="#5c5c5c">/ SUSPECT</text>

  <rect x="895" y="170" width="235" height="205" rx="14" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <rect x="895" y="170" width="235" height="42" rx="14" fill="#1f6f3a"/>
  <text x="1012" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4 · RESULT</text>
  <text x="1012" y="250" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6f3a">VERIFIED</text>
  <text x="1012" y="290" text-anchor="middle" font-size="12.5" fill="#8b2d2d">Suspect → quarantine</text>
  <text x="1012" y="308" text-anchor="middle" font-size="12.5" fill="#8b2d2d">+ 24-hour investigation</text>

  <polygon points="308,272 336,272 336,266 350,275 336,284 336,278 308,278" fill="#4a5568"/>
  <polygon points="583,272 611,272 611,266 625,275 611,284 611,278 583,278" fill="#4a5568"/>
  <polygon points="858,272 886,272 886,266 900,275 886,284 886,278 858,278" fill="#4a5568"/>

  <rect x="70" y="424" width="1060" height="60" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="90" y="450" font-size="14.5" font-weight="700" fill="#2c5454">99.96% verified on first query</text>
  <text x="90" y="471" font-size="13" fill="#3d6b6b">The remaining 0.04% surface manufacturer-side data errors that are resolved within the 24-hour SLA window.</text>

  <text x="600" y="536" text-anchor="middle" font-size="13.5" fill="#5c5c5c">DSCSA permits barcode or RFID; the customer chose RFID because barcode cannot match the portal throughput.</text>
</svg>
