<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Bottle-neck closure construction — a cap-bridge antenna that breaks on opening</title>
  <desc id="d">Left: a sealed bottle neck and cap with the NFC antenna routed as an intact bridge trace spanning the cap and neck across the closure line — the chip answers and the SUN signature is valid, state sealed. Centre: the same neck opened, the bridge trace severed at the closure and marked VOID — the chip returns opened or stays silent and the first pour is detected. Right: the layer stack of the bridge — premium foil capsule, bridge antenna coil with the NTAG 424 DNA die at 13.56 MHz and AES-128 SUN, the break-line across the cap-neck gap, and tamper adhesive that leaves VOID on removal. A footnote states the bridge sits above the regulator duty stamp — HMRC DS5, EU 92/83/EEC, Russian EGAIS, US TTB strip-stamp — never covering it.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BOTTLE-NECK CLOSURE — A BRIDGE ANTENNA THAT BREAKS</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">The coil spans the cap and neck; the first pour snaps it, permanently</text>

  <!-- SEALED card -->
  <rect x="70" y="150" width="250" height="282" rx="14" fill="#ffffff" stroke="#9ec4a6" stroke-width="2"/>
  <rect x="70" y="150" width="250" height="40" rx="14" fill="#1f6f3a"/>
  <text x="195" y="177" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">SEALED</text>
  <rect x="120" y="204" width="70" height="34" rx="5" fill="#3d6b6b"/>
  <rect x="120" y="238" width="70" height="120" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <line x1="118" y1="238" x2="192" y2="238" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="147" y="212" width="16" height="140" rx="4" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>
  <rect x="138" y="298" width="34" height="22" rx="3" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
  <circle cx="258" cy="252" r="17" fill="#eef5ee" stroke="#1f6f3a" stroke-width="2"/>
  <path d="M250 252 l6 6 l10 -13" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="384" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Bridge trace intact</text>
  <text x="195" y="404" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Chip answers · SUN valid</text>
  <text x="195" y="423" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">state = SEALED</text>

  <!-- OPENED card -->
  <rect x="350" y="150" width="250" height="282" rx="14" fill="#ffffff" stroke="#e2b8b0" stroke-width="2"/>
  <rect x="350" y="150" width="250" height="40" rx="14" fill="#8b2d2d"/>
  <text x="475" y="177" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">OPENED</text>
  <rect x="400" y="196" width="70" height="34" rx="5" fill="#3d6b6b"/>
  <rect x="400" y="240" width="70" height="118" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <line x1="398" y1="238" x2="472" y2="238" stroke="#8b2d2d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="427" y="204" width="16" height="30" rx="3" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>
  <rect x="427" y="252" width="16" height="100" rx="3" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>
  <path d="M423 234 l20 8 l-18 6 l18 6" fill="none" stroke="#8b2d2d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="470" y="232" font-size="12" font-weight="800" fill="#8b2d2d">VOID</text>
  <text x="475" y="384" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Trace severed at closure</text>
  <text x="475" y="404" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Returns 'opened' or silent</text>
  <text x="475" y="423" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">first pour detected</text>

  <!-- layer stack -->
  <text x="880" y="176" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">THE BRIDGE, LAYER BY LAYER</text>
  <rect x="620" y="196" width="520" height="44" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="640" y="223" font-size="13.5" fill="#291c0e">Premium foil capsule — hides the inlay under the brand design</text>
  <rect x="620" y="248" width="520" height="56" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="640" y="272" font-size="13.5" fill="#291c0e">Bridge antenna coil + NTAG 424 DNA die</text>
  <text x="640" y="292" font-size="12" fill="#5c5c5c">13.56 MHz · AES-128 SUN · spans cap and neck</text>
  <rect x="620" y="312" width="520" height="44" rx="6" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <text x="640" y="339" font-size="13.5" fill="#291c0e">Break-line across the cap-neck gap — severs on opening</text>
  <rect x="620" y="364" width="520" height="44" rx="6" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="2"/>
  <text x="640" y="391" font-size="13.5" fill="#8b2d2d">Tamper adhesive — leaves VOID on removal</text>

  <!-- coexistence footnote -->
  <text x="600" y="474" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SITS ABOVE THE DUTY STAMP, NEVER OVER IT</text>
  <text x="600" y="500" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The bridge occupies the cap-neck closure, leaving the neck and main label clear for the regulator's tax stamp —</text>
  <text x="600" y="520" text-anchor="middle" font-size="13.5" fill="#5c5c5c">HMRC DS5, EU 92/83/EEC, Russian EGAIS, US TTB strip-stamp — fiscal control and cryptographic authenticity, stacked.</text>
</svg>
