<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five ski pass card specs and the failure each one prevents</title>
<desc id="d">Five spec choices on the left, each preventing a failure on the right. A read range under 30 centimetres prevents double-charges from nearby skiers. A cold-tolerant chip rated to minus 40 Celsius prevents a dead pass by mid-season at altitude. A reinforced lanyard hole prevents an antenna break after 30 to 50 days. A photo printed on the card prevents shared passes leaking revenue. A multi-resort chip family prevents a card that won't read across 30-plus resorts.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE SPECS, FIVE FAILURES AVOIDED</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Skiers forgive a whiteout. They never forgive a gate that won't read their pass.</text>

<text x="318" y="122" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">GET THIS SPEC RIGHT</text>
<text x="882" y="122" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">…AND AVOID THIS</text>

<rect x="64" y="140" width="508" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="628" y="140" width="508" height="70" rx="12" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.4"/>
<circle cx="100" cy="175" r="11" fill="#1f6f3a"/><polyline points="95,176 99,180 107,170" fill="none" stroke="#ffffff" stroke-width="2.6"/>
<text x="124" y="180" font-size="14.5" fill="#234a4a">Read range ≤ 30 cm</text>
<text x="664" y="180" font-size="14.5" fill="#8b2d2d">Double-charges from nearby skiers</text>
<line x1="581" y1="175" x2="599" y2="175" stroke="#291c0e" stroke-width="2.3"/><polygon points="599,169 609,175 599,181" fill="#291c0e"/>

<rect x="64" y="222" width="508" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="628" y="222" width="508" height="70" rx="12" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.4"/>
<circle cx="100" cy="257" r="11" fill="#1f6f3a"/><polyline points="95,258 99,262 107,252" fill="none" stroke="#ffffff" stroke-width="2.6"/>
<text x="124" y="262" font-size="14.5" fill="#234a4a">Cold-tolerant chip (-40 °C)</text>
<text x="664" y="262" font-size="14.5" fill="#8b2d2d">Dead pass by mid-season at altitude</text>
<line x1="581" y1="257" x2="599" y2="257" stroke="#291c0e" stroke-width="2.3"/><polygon points="599,251 609,257 599,263" fill="#291c0e"/>

<rect x="64" y="304" width="508" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="628" y="304" width="508" height="70" rx="12" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.4"/>
<circle cx="100" cy="339" r="11" fill="#1f6f3a"/><polyline points="95,340 99,344 107,334" fill="none" stroke="#ffffff" stroke-width="2.6"/>
<text x="124" y="344" font-size="14.5" fill="#234a4a">Reinforced lanyard hole</text>
<text x="664" y="344" font-size="14.5" fill="#8b2d2d">Antenna break after 30-50 days</text>
<line x1="581" y1="339" x2="599" y2="339" stroke="#291c0e" stroke-width="2.3"/><polygon points="599,333 609,339 599,345" fill="#291c0e"/>

<rect x="64" y="386" width="508" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="628" y="386" width="508" height="70" rx="12" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.4"/>
<circle cx="100" cy="421" r="11" fill="#1f6f3a"/><polyline points="95,422 99,426 107,416" fill="none" stroke="#ffffff" stroke-width="2.6"/>
<text x="124" y="426" font-size="14.5" fill="#234a4a">Photo printed on the card</text>
<text x="664" y="426" font-size="14.5" fill="#8b2d2d">Shared passes leak revenue</text>
<line x1="581" y1="421" x2="599" y2="421" stroke="#291c0e" stroke-width="2.3"/><polygon points="599,415 609,421 599,427" fill="#291c0e"/>

<rect x="64" y="468" width="508" height="70" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="628" y="468" width="508" height="70" rx="12" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.4"/>
<circle cx="100" cy="503" r="11" fill="#1f6f3a"/><polyline points="95,504 99,508 107,498" fill="none" stroke="#ffffff" stroke-width="2.6"/>
<text x="124" y="508" font-size="14.5" fill="#234a4a">Multi-resort chip family</text>
<text x="664" y="508" font-size="14.5" fill="#8b2d2d">Won't read across 30+ resorts</text>
<line x1="581" y1="503" x2="599" y2="503" stroke="#291c0e" stroke-width="2.3"/><polygon points="599,497 609,503 599,509" fill="#291c0e"/>

<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Every one is a spec you choose at order time — or a complaint you field all season.</text>
</svg>
