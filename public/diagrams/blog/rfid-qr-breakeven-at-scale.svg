<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID versus QR break-even and a fully-costed 10,000-attendee gate</title>
<desc id="d">Two parts. A break-even band shows QR usually winning under about 3,000 attendees, a crossover zone at 3,000 to 5,000 attendees for events with food and beverage sales, and RFID winning above roughly 5,000. Below, a fully-costed 10,000-attendee example: the QR-only gate costs about 7,000 to 12,000 dollars, the RFID-only gate about 15,000 to 57,000 dollars, but cashless revenue of 100,000 dollars (10,000 attendees times 50 dollars per cap times a 20 percent lift) leaves RFID netting roughly 80,000 to 95,000 dollars of incremental margin.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COST AT SCALE</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">"QR is free, RFID is expensive" — until cashless revenue enters the model.</text>

<!-- break-even bar -->
<text x="270" y="128" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#a07d43">QR WINS</text>
<text x="520" y="128" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BREAK-EVEN</text>
<text x="850" y="128" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#2c5454">RFID WINS</text>
<rect x="120" y="140" width="300" height="32" fill="#f7edd6"/>
<rect x="420" y="140" width="200" height="32" fill="#ead9ad"/>
<rect x="620" y="140" width="460" height="32" fill="#eef5f5"/>
<rect x="120" y="140" width="960" height="32" rx="8" fill="none" stroke="#d8ccb0" stroke-width="1.6"/>
<text x="270" y="194" text-anchor="middle" font-size="13" fill="#5c5c5c">under ~3,000 attendees</text>
<text x="520" y="194" text-anchor="middle" font-size="13.5" font-weight="800" fill="#291c0e">3,000-5,000</text>
<text x="850" y="194" text-anchor="middle" font-size="13" fill="#5c5c5c">above ~5,000 with food &amp; beverage</text>

<line x1="80" y1="224" x2="1120" y2="224" stroke="#ece5d6" stroke-width="1.4"/>
<text x="600" y="258" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#4a5568">THE 10,000-ATTENDEE GATE, FULLY COSTED</text>

<!-- Card 1: QR gate -->
<rect x="80" y="278" width="336" height="168" rx="14" fill="#fbf4e6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="248" y="314" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#a07d43">QR-ONLY GATE</text>
<text x="248" y="364" text-anchor="middle" font-size="32" font-weight="800" font-family="Lora, Georgia, serif" fill="#a07d43">$7K-12K</text>
<text x="248" y="398" text-anchor="middle" font-size="13" fill="#5c5c5c">credentials + ~20 scan lanes</text>
<text x="248" y="420" text-anchor="middle" font-size="13" fill="#5c5c5c">direct gate cost</text>

<!-- Card 2: RFID gate -->
<rect x="432" y="278" width="336" height="168" rx="14" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.6"/>
<text x="600" y="314" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#4a5568">RFID-ONLY GATE</text>
<text x="600" y="364" text-anchor="middle" font-size="32" font-weight="800" font-family="Lora, Georgia, serif" fill="#4a5568">$15K-57K</text>
<text x="600" y="398" text-anchor="middle" font-size="13" fill="#5c5c5c">wristbands + 8 tap lanes</text>
<text x="600" y="420" text-anchor="middle" font-size="13" fill="#5c5c5c">+ reader hardware</text>

<!-- Card 3: cashless flips it -->
<rect x="784" y="278" width="336" height="168" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2.4"/>
<text x="952" y="314" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">CASHLESS REVENUE</text>
<text x="952" y="362" text-anchor="middle" font-size="32" font-weight="800" font-family="Lora, Georgia, serif" fill="#1f6f3a">+$100K</text>
<text x="952" y="394" text-anchor="middle" font-size="12.5" fill="#5c5c5c">10,000 × $50 per-cap × 20% lift</text>
<text x="952" y="422" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">RFID nets +$80K-95K margin</text>

<text x="600" y="502" text-anchor="middle" font-size="15" fill="#291c0e">The credential price is a line item; the cashless revenue is the deciding one.</text>
<text x="600" y="556" text-anchor="middle" font-size="13" fill="#8a8a8a">Break-even and the 10,000-attendee figures are drawn from this article's cost-of-ownership section.</text>
</svg>
