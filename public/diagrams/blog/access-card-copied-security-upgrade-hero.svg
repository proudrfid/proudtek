<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A copied badge: legacy cards clone in seconds, encrypted cards refuse</title>
<desc id="d">Two panels. On the left, a legacy 125 kHz or MIFARE Classic card is copied by a sub-$50 device into a perfect clone, and both cards read as ACCEPTED, so the clone hides in the access logs. On the right, a MIFARE DESFire EV3 card using AES-128 mutual authentication runs a challenge-and-response with the reader, so a clone attempt is rejected because the keys never leave the card. A stat band notes a sub-$50 cloner, Crypto-1 publicly broken in 2008, AES-128 mutual authentication, and a 90-day cutover.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ACCESS CONTROL · WHEN A BADGE GETS COPIED</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">A legacy card clones in seconds; an encrypted one refuses to be copied.</text>

<!-- LEFT: legacy -->
<rect x="60" y="112" width="510" height="300" rx="18" fill="#fbf8f2" stroke="#8b2d2d" stroke-width="2.5"/>
<rect x="84" y="132" width="196" height="32" rx="16" fill="#8b2d2d"/>
<text x="182" y="154" text-anchor="middle" font-size="14.5" font-weight="800" letter-spacing="0.5" fill="#ffffff">LEGACY · CLONABLE</text>
<rect x="92" y="196" width="120" height="78" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2.5"/>
<rect x="104" y="210" width="24" height="17" rx="3" fill="#d9c48c"/>
<text x="152" y="294" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">125 kHz / Classic</text>
<line x1="214" y1="236" x2="232" y2="236" stroke="#8b2d2d" stroke-width="2.5"/><path d="M232 236 l-9 -5 v10 z" fill="#8b2d2d"/>
<line x1="264" y1="210" x2="264" y2="201" stroke="#8b2d2d" stroke-width="2"/>
<rect x="236" y="210" width="56" height="52" rx="8" fill="#f4e7e7" stroke="#8b2d2d" stroke-width="2"/>
<text x="264" y="243" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2d2d">$50</text>
<line x1="296" y1="236" x2="322" y2="236" stroke="#8b2d2d" stroke-width="2.5"/><path d="M322 236 l-9 -5 v10 z" fill="#8b2d2d"/>
<rect x="324" y="196" width="120" height="78" rx="10" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5"/>
<rect x="336" y="210" width="24" height="17" rx="3" fill="#d9c48c"/>
<text x="384" y="294" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">perfect clone</text>
<rect x="92" y="322" width="386" height="66" rx="12" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.6"/>
<text x="285" y="350" text-anchor="middle" font-size="14.5" font-weight="800" fill="#8b2d2d">Both cards read ACCEPTED</text>
<text x="285" y="372" text-anchor="middle" font-size="12.5" fill="#7a4242">the clone hides in your access logs</text>

<!-- RIGHT: encrypted -->
<rect x="630" y="112" width="510" height="300" rx="18" fill="#fbf8f2" stroke="#1f6f3a" stroke-width="2.5"/>
<rect x="654" y="132" width="290" height="32" rx="16" fill="#1f6f3a"/>
<text x="799" y="154" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.3" fill="#ffffff">ENCRYPTED · CLONE-RESISTANT</text>
<rect x="654" y="196" width="120" height="78" rx="10" fill="#ffffff" stroke="#1f6f3a" stroke-width="2.5"/>
<rect x="666" y="210" width="24" height="17" rx="3" fill="#d9c48c"/>
<text x="714" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">DESFire EV3 · AES-128</text>
<text x="816" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#177a92">mutual auth</text>
<line x1="780" y1="228" x2="850" y2="228" stroke="#1fcefb" stroke-width="3"/><path d="M850 228 l-9 -5 v10 z" fill="#1fcefb"/>
<line x1="852" y1="250" x2="782" y2="250" stroke="#1fcefb" stroke-width="3"/><path d="M782 250 l9 -5 v10 z" fill="#1fcefb"/>
<rect x="858" y="196" width="88" height="80" rx="12" fill="#ffffff" stroke="#291c0e" stroke-width="3"/>
<rect x="870" y="208" width="64" height="34" rx="4" fill="#eef5f5"/>
<circle cx="902" cy="258" r="6" fill="#1f6f3a"/>
<text x="902" y="294" text-anchor="middle" font-size="12.5" fill="#4f4f4f">reader</text>
<line x1="948" y1="236" x2="976" y2="236" stroke="#8b2d2d" stroke-width="2.5"/><path d="M976 236 l-9 -5 v10 z" fill="#8b2d2d"/>
<rect x="982" y="204" width="104" height="64" rx="9" fill="#ffffff" stroke="#8b2d2d" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="1034" cy="236" r="16" fill="#8b2d2d"/>
<path d="M1027 229 l14 14 M1041 229 l-14 14" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
<text x="1034" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#8b2d2d">clone blocked</text>
<rect x="654" y="322" width="432" height="66" rx="12" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="1.6"/>
<text x="870" y="350" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f6f3a">Clone rejected: keys never leave the card</text>
<text x="870" y="372" text-anchor="middle" font-size="12.5" fill="#3f6b4e">AES-128 mutual authentication</text>

<!-- stat band -->
<rect x="60" y="430" width="1080" height="152" rx="16" fill="url(#dark)"/>
<text x="195" y="500" text-anchor="middle" font-size="34" font-weight="800" fill="#d4a755">&lt; $50</text>
<text x="195" y="530" text-anchor="middle" font-size="14.5" fill="#f4efe4">clones a legacy card</text>
<text x="465" y="500" text-anchor="middle" font-size="34" font-weight="800" fill="#d4a755">2008</text>
<text x="465" y="530" text-anchor="middle" font-size="14.5" fill="#f4efe4">Crypto-1 publicly broken</text>
<text x="735" y="500" text-anchor="middle" font-size="34" font-weight="800" fill="#d4a755">AES-128</text>
<text x="735" y="530" text-anchor="middle" font-size="14.5" fill="#f4efe4">mutual authentication</text>
<text x="1005" y="500" text-anchor="middle" font-size="34" font-weight="800" fill="#d4a755">90 days</text>
<text x="1005" y="530" text-anchor="middle" font-size="14.5" fill="#f4efe4">to a clean cutover</text>
<line x1="330" y1="458" x2="330" y2="554" stroke="#c39a5f" stroke-width="1.5" opacity="0.45"/>
<line x1="600" y1="458" x2="600" y2="554" stroke="#c39a5f" stroke-width="1.5" opacity="0.45"/>
<line x1="870" y1="458" x2="870" y2="554" stroke="#c39a5f" stroke-width="1.5" opacity="0.45"/>

<text x="600" y="616" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Same tap, opposite outcome — the fix is cryptographic, not procedural.</text>
</svg>
