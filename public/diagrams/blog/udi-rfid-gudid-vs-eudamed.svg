<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">FDA GUDID vs EU EUDAMED — two UDI databases, two independent submissions</title>
<desc id="d">Side-by-side comparison. FDA GUDID for the United States under 21 CFR 830: roughly 57 attributes on file, issuing agencies GS1, HIBCC and ICCBBA, public look-up via AccessGUDID, no SRN because the labeler is captured in the record, submission via HL7 or the FDA portal. EU EUDAMED under MDR 2017/745 and IVDR 2017/746: roughly 111 attributes on file, an additional Basic UDI-DI product-family grouping, an SRN required before submitting, EMDN nomenclature with a GMDN crosswalk, and IFA added as an issuing entity for certain IVDs. Bottom note: submissions are independent — registering in GUDID does not populate EUDAMED, so multinational programs file both.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FDA UDI VS EU MDR UDI</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Two databases, two independent submissions</text>

<rect x="70" y="150" width="480" height="350" rx="16" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<rect x="70" y="150" width="480" height="64" rx="16" fill="#3d6b6b"/>
<rect x="70" y="188" width="480" height="26" fill="#3d6b6b"/>
<text x="100" y="182" font-size="17" font-weight="800" fill="#ffffff">FDA · GUDID</text>
<text x="100" y="204" font-size="12" fill="#cfe0e0">United States — 21 CFR 830</text>
<circle cx="104" cy="252" r="4" fill="#3d6b6b"/>
<text x="122" y="257" font-size="13.5" fill="#4f4f4f">~57 attributes on file</text>
<circle cx="104" cy="296" r="4" fill="#3d6b6b"/>
<text x="122" y="301" font-size="13.5" fill="#4f4f4f">agencies: GS1 · HIBCC · ICCBBA</text>
<circle cx="104" cy="340" r="4" fill="#3d6b6b"/>
<text x="122" y="345" font-size="13.5" fill="#4f4f4f">public look-up: AccessGUDID</text>
<circle cx="104" cy="384" r="4" fill="#3d6b6b"/>
<text x="122" y="389" font-size="13.5" fill="#4f4f4f">no SRN — labeler is in the record</text>
<circle cx="104" cy="428" r="4" fill="#3d6b6b"/>
<text x="122" y="433" font-size="13.5" fill="#4f4f4f">submission: HL7 or FDA portal</text>

<rect x="650" y="150" width="480" height="350" rx="16" fill="#ffffff" stroke="#d3dae3" stroke-width="1.5"/>
<rect x="650" y="150" width="480" height="64" rx="16" fill="#4a5568"/>
<rect x="650" y="188" width="480" height="26" fill="#4a5568"/>
<text x="680" y="182" font-size="17" font-weight="800" fill="#ffffff">EU MDR · EUDAMED</text>
<text x="680" y="204" font-size="12" fill="#d3dae3">European Union — MDR 2017/745 · IVDR 2017/746</text>
<circle cx="684" cy="252" r="4" fill="#4a5568"/>
<text x="702" y="257" font-size="13.5" fill="#4f4f4f">~111 attributes on file</text>
<circle cx="684" cy="296" r="4" fill="#4a5568"/>
<text x="702" y="301" font-size="13.5" fill="#4f4f4f">+ Basic UDI-DI product-family grouping</text>
<circle cx="684" cy="340" r="4" fill="#4a5568"/>
<text x="702" y="345" font-size="13.5" fill="#4f4f4f">SRN required before submitting</text>
<circle cx="684" cy="384" r="4" fill="#4a5568"/>
<text x="702" y="389" font-size="13.5" fill="#4f4f4f">nomenclature: EMDN (GMDN crosswalk)</text>
<circle cx="684" cy="428" r="4" fill="#4a5568"/>
<text x="702" y="433" font-size="13.5" fill="#4f4f4f">issuing entities add IFA for certain IVDs</text>

<circle cx="600" cy="325" r="32" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="333" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="20" font-weight="700" fill="#6d5a3a">vs</text>

<rect x="190" y="536" width="820" height="72" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="564" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d5a3a">Submissions are independent</text>
<text x="600" y="588" text-anchor="middle" font-size="12.5" fill="#4f4f4f">registering in GUDID does not populate EUDAMED — multinational programs file both</text>
</svg>
