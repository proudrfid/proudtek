<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">iPhone vs Android — what an NFC ring can actually do on each</title>
<desc id="d">Two platform panels. Android: full programmability — read, write and format tags, system actions and Tasker automation chains; antennas usually sit near the rear camera. iPhone: a controlled subset — Background Tag Reading from iPhone XS onward triggers Shortcuts, writing requires a user-initiated app, and the antenna lives at the very top edge, so recipients must tap there or they conclude the ring is broken. Payment verdict: Apple Pay stays locked to Apple hardware, so payment rings favour Android.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SAME RING · TWO PERSONALITIES</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Decide the deal-breakers before you order the rings</text>

<rect x="60" y="130" width="530" height="400" rx="16" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="325" y="172" text-anchor="middle" font-size="16" font-weight="800" fill="#1b4332">ANDROID · THE POWER USER</text>
<rect x="110" y="196" width="90" height="170" rx="14" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.5"/>
<circle cx="155" cy="238" r="12" fill="none" stroke="#2d6a4f" stroke-width="2"/>
<circle cx="155" cy="238" r="4" fill="#2d6a4f"/>
<text x="155" y="390" text-anchor="middle" font-size="12" fill="#4f4f4f">antenna: rear camera area</text>
<g font-size="13.5" fill="#291c0e">
<text x="230" y="226">✓  read / write / format any tag</text>
<text x="230" y="258">✓  system actions on tap:</text>
<text x="252" y="280">toggle Wi-Fi · switch profiles · launch apps</text>
<text x="230" y="312">✓  Tasker chains: tap at the station →</text>
<text x="252" y="334">transit app opens, "on my way" sends</text>
</g>
<rect x="110" y="430" width="430" height="70" rx="12" fill="#ffffff" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="325" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#1b4332">deepest integration · fewest surprises</text>
<text x="325" y="482" text-anchor="middle" font-size="12" fill="#4f4f4f">and the only real home for payment rings</text>

<rect x="610" y="130" width="530" height="400" rx="16" fill="#eef1f5" stroke="#4a5568" stroke-width="1.5"/>
<text x="875" y="172" text-anchor="middle" font-size="16" font-weight="800" fill="#4a5568">iPHONE · THE CURATED GUEST</text>
<rect x="660" y="196" width="90" height="170" rx="14" fill="#ffffff" stroke="#4a5568" stroke-width="2.5"/>
<rect x="676" y="204" width="58" height="14" rx="7" fill="#eef1f5" stroke="#4a5568" stroke-width="1.5"/>
<path d="M 705 190 v -14" stroke="#8b2d2d" stroke-width="2.5"/>
<path d="M 705 176 l -5 9 h 10 z" fill="#8b2d2d"/>
<text x="705" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#8b2d2d">antenna: very top edge — tap THERE</text>
<g font-size="13.5" fill="#291c0e">
<text x="780" y="226">✓  Background Tag Reading (XS and later):</text>
<text x="802" y="248">tap → Shortcut → playlist, HomeKit, call</text>
<text x="780" y="280">△  writing needs a user-initiated app —</text>
<text x="802" y="302">no silent writes, by design</text>
<text x="780" y="334">✓  Wallet keys arriving via iOS 18.1+</text>
</g>
<rect x="660" y="430" width="430" height="70" rx="12" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="875" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">controlled subset · train the top-edge tap</text>
<text x="875" y="482" text-anchor="middle" font-size="12" fill="#4f4f4f">or the ring gets blamed for the phone's anatomy</text>

<rect x="240" y="556" width="720" height="52" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="588" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Mixed fleet? Point the ring at one URL that detects the platform and serves the right deep link.</text>
<text x="600" y="638" text-anchor="middle" font-size="13" fill="#5c5c5c">Payment rings: EMV tokens expire every 3–7 years — plan replacement at token end-of-life.</text>
</svg>
