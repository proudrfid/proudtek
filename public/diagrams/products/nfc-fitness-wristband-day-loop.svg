<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">One band, four taps — the member's day in the club</title>
  <desc id="d">Member journey: door check-in tap, class-door attendance tap auto-filling the roster, locker tap on Foxtrot, Best, Ojmar or Digilock electronic locks, and juice-bar tap against the member folio or DESFire stored value.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Four taps, zero cards, no phone mid-workout</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">The band lives on the wrist through the whole visit — that is the entire point</text>
  <g transform="translate(70,160)" font-family="Helvetica, Arial, sans-serif" font-size="13">
    <rect x="0" y="0" width="500" height="140" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="38" font-family="Georgia, serif" font-size="16" fill="#2c5454">1 · Front door</text>
    <text x="24" y="70" fill="#2c5454">check-in tap — membership verified,</text>
    <text x="24" y="92" fill="#2c5454">capacity counted</text>
    <text x="24" y="120" fill="#6d5a3a">Mindbody / ABC / PerfectGym / Glofox roster</text>
    <rect x="550" y="0" width="500" height="140" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="574" y="38" font-family="Georgia, serif" font-size="16" fill="#291c0e">2 · Class door</text>
    <text x="574" y="70" fill="#2c5454">studio-door reader records every entry —</text>
    <text x="574" y="92" fill="#2c5454">roster auto-populates with attendance</text>
    <text x="574" y="120" fill="#6d5a3a">no-show data becomes schedule intelligence</text>
    <rect x="0" y="170" width="500" height="140" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="24" y="208" font-family="Georgia, serif" font-size="16" fill="#291c0e">3 · Locker</text>
    <text x="24" y="240" fill="#2c5454">band opens the electronic locker —</text>
    <text x="24" y="262" fill="#2c5454">Foxtrot · Best · Ojmar · Digilock</text>
    <text x="24" y="290" fill="#6d5a3a">no wrist coins, no lost keys</text>
    <rect x="550" y="170" width="500" height="140" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="574" y="208" font-family="Georgia, serif" font-size="16" fill="#2c5454">4 · Juice bar / pro shop</text>
    <text x="574" y="240" fill="#2c5454">tap to charge the member folio — or DESFire</text>
    <text x="574" y="262" fill="#2c5454">EV3 stored value for closed-loop spend</text>
    <text x="574" y="290" fill="#6d5a3a">the wallet stayed in the locker</text>
  </g>
</svg>
