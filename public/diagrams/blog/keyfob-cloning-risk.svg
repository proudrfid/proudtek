<path d="M 292 224 a 16 16 0 0 1 0 -26" fill="none" stroke="#8b2d2d" stroke-width="2"/>
<path d="M 282 232 a 26 26 0 0 1 0 -42" fill="none" stroke="#8b2d2d" stroke-width="2"/>

<text x="325" y="278" text-anchor="middle" font-size="13.5" font-weight="600" fill="#291c0e">The fob broadcasts its ID in the clear</text>
<text x="325" y="298" text-anchor="middle" font-size="12.5" fill="#4f4f4f">no authentication, no challenge</text>

