<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five NFC authentication tag placement formats, ordered by how hard they make tag transfer</title>
<desc id="d">Five packaging integration formats shown left to right along an axis of increasing difficulty to move the tag to a counterfeit. A woven label or hang tag sewn into apparel. Invisible lamination between packaging layers, readable through paper or thin plastic. A bottle-cap tamper loop for spirits, where breaking the seal is recorded. Tamper-evident placement where opening the package destroys the antenna or trips the TagTamper loop. And direct-to-product epoxy, encapsulated and bonded to the product surface.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE THE CHIP HIDES</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="29" font-weight="700" fill="#291c0e">Placement is a security decision before it is a design one</text>

<!-- axis -->
<line x1="80" y1="150" x2="1112" y2="150" stroke="#cbb48f" stroke-width="2"/>
<polygon points="1108,144 1122,150 1108,156" fill="#cbb48f"/>
<text x="1090" y="140" text-anchor="end" font-size="13.5" font-style="italic" fill="#6d5a3a">harder to move the tag to a fake</text>

<!-- card template: 5 cards -->
<!-- 1 woven -->
<rect x="78" y="176" width="196" height="330" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<path d="M176 214 l30 0 22 24 -22 24 -30 0 z" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<circle cx="196" cy="238" r="5" fill="#c39a5f"/>
<text x="176" y="298" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Woven label</text>
<text x="176" y="320" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">&amp; hang tag</text>
<text x="176" y="352" text-anchor="middle" font-size="13" fill="#5c5c5c">chip sewn into apparel</text>
<text x="176" y="372" text-anchor="middle" font-size="13" fill="#5c5c5c">care labels or hang tags</text>
<text x="176" y="470" text-anchor="middle" font-size="12.5" font-style="italic" fill="#6d5a3a">unpick to move</text>

<!-- 2 lamination -->
<rect x="290" y="176" width="196" height="330" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="342" y="216" width="92" height="12" rx="3" fill="#cfe0e0"/>
<rect x="342" y="232" width="92" height="12" rx="3" fill="#3d6b6b"/>
<rect x="342" y="248" width="92" height="12" rx="3" fill="#cfe0e0"/>
<text x="388" y="298" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Invisible</text>
<text x="388" y="320" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">lamination</text>
<text x="388" y="352" text-anchor="middle" font-size="13" fill="#5c5c5c">between packaging layers;</text>
<text x="388" y="372" text-anchor="middle" font-size="13" fill="#5c5c5c">reads through paper</text>
<text x="388" y="470" text-anchor="middle" font-size="12.5" font-style="italic" fill="#33595a">hidden, must delaminate</text>

<!-- 3 bottle cap -->
<rect x="502" y="176" width="196" height="330" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="584" y="210" width="32" height="30" rx="4" fill="#c39a5f"/>
<circle cx="600" cy="252" r="24" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<path d="M582 252 a18 8 0 0 0 36 0" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<text x="600" y="298" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Bottle-cap</text>
<text x="600" y="320" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">tamper loop</text>
<text x="600" y="352" text-anchor="middle" font-size="13" fill="#5c5c5c">breaking the seal is</text>
<text x="600" y="372" text-anchor="middle" font-size="13" fill="#5c5c5c">cryptographically recorded</text>
<text x="600" y="470" text-anchor="middle" font-size="12.5" font-style="italic" fill="#33595a">seal breaks on open</text>

<!-- 4 tamper-evident -->
<rect x="714" y="176" width="196" height="330" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="766" y="214" width="92" height="52" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<path d="M812 214 l-10 52" stroke="#8b2d2d" stroke-width="2.5" stroke-dasharray="4 4"/>
<rect x="798" y="230" width="28" height="20" rx="3" fill="#c39a5f"/>
<text x="812" y="298" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Tamper-</text>
<text x="812" y="320" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">evident</text>
<text x="812" y="352" text-anchor="middle" font-size="13" fill="#5c5c5c">opening destroys the</text>
<text x="812" y="372" text-anchor="middle" font-size="13" fill="#5c5c5c">antenna or trips the loop</text>
<text x="812" y="470" text-anchor="middle" font-size="12.5" font-style="italic" fill="#33595a">no quiet transfer</text>

<!-- 5 epoxy -->
<rect x="926" y="176" width="196" height="330" rx="14" fill="#eef2f4" stroke="#c9d3da" stroke-width="1.6"/>
<rect x="978" y="252" width="92" height="14" rx="3" fill="#4a5568"/>
<path d="M994 252 a30 30 0 0 1 60 0 z" fill="#c9d3da" stroke="#4a5568" stroke-width="2"/>
<rect x="1012" y="236" width="24" height="16" rx="3" fill="#c39a5f"/>
<text x="1024" y="298" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Direct-to-</text>
<text x="1024" y="320" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">product epoxy</text>
<text x="1024" y="352" text-anchor="middle" font-size="13" fill="#5c5c5c">encapsulated and bonded</text>
<text x="1024" y="372" text-anchor="middle" font-size="13" fill="#5c5c5c">to the product surface</text>
<text x="1024" y="470" text-anchor="middle" font-size="12.5" font-style="italic" fill="#3f4756">removal is destructive</text>

<text x="600" y="556" text-anchor="middle" font-size="15" fill="#4f4535">Every format aims at the same attack: stopping a genuine chip from being peeled off and re-applied to a counterfeit shell.</text>
<text x="600" y="586" text-anchor="middle" font-size="13.5" font-style="italic" fill="#6d5a3a">The tamper-evident and TagTamper variants exist precisely to make that transfer visible.</text>
</svg>
