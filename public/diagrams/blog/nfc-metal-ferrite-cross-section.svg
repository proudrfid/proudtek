<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Cross-section of a metal NFC card: how the ferrite layer lets it tap</title>
<desc id="d">An edge-on cross-section of a metal NFC card in four stacked layers from top to bottom: the metal face you see, a ferrite isolation layer, the NFC antenna coil, and the metal back. A phone taps from above. The ferrite layer routes the 13.56 MHz magnetic field around the metal rather than into it, so the antenna can reach the phone. A red note warns that bare metal with no ferrite detunes the antenna and yields no read.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="steelH" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e7eaef"/><stop offset="100%" stop-color="#c3cad3"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NFC THROUGH SOLID METAL</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">A ferrite layer gives the 13.56 MHz field a path around the metal, not into it.</text>

<!-- phone tapping from above -->
<rect x="372" y="104" width="156" height="38" rx="10" fill="#ffffff" stroke="#291c0e" stroke-width="2.5"/>
<text x="450" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#291c0e">phone antenna</text>
<path d="M 408 158 a 42 30 0 0 1 84 0" fill="none" stroke="#3d6b6b" stroke-width="2.4"/>
<path d="M 420 160 a 30 22 0 0 1 60 0" fill="none" stroke="#79a3a3" stroke-width="2.2"/>
<text x="556" y="160" font-size="12.5" font-weight="700" fill="#2c5454">13.56 MHz</text>

<!-- layer stack -->
<rect x="210" y="176" width="480" height="60" rx="8" fill="url(#steelH)" stroke="#9aa3ad" stroke-width="2"/>
<text x="450" y="213" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1" fill="#4a5568">METAL FACE</text>
<rect x="210" y="248" width="480" height="60" rx="8" fill="#f7edd6" stroke="#d9b45f" stroke-width="2.4"/>
<text x="450" y="285" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1" fill="#a07d43">FERRITE ISOLATION LAYER</text>
<rect x="210" y="320" width="480" height="60" rx="8" fill="#eef5f5" stroke="#8fb6b6" stroke-width="2"/>
<path d="M 250 350 h 22 v 10 h 22 v -10 h 22 v 10 h 22 v -10 h 18" fill="none" stroke="#2c5454" stroke-width="2.4"/>
<text x="450" y="356" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#2c5454">NFC ANTENNA COIL</text>
<path d="M 544 350 h 22 v 10 h 22 v -10 h 22 v 10 h 22 v -10 h 18" fill="none" stroke="#2c5454" stroke-width="2.4"/>
<rect x="210" y="392" width="480" height="60" rx="8" fill="url(#steelH)" stroke="#9aa3ad" stroke-width="2"/>
<text x="450" y="429" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1" fill="#4a5568">METAL BACK</text>

<!-- callouts -->
<line x1="690" y1="206" x2="724" y2="206" stroke="#c3b48f" stroke-width="2"/>
<circle cx="724" cy="206" r="3.4" fill="#a07d43"/>
<text x="736" y="201" font-size="14.5" font-weight="700" fill="#291c0e">The finish you see — PVD, brushed, anodized.</text>
<text x="736" y="221" font-size="13" fill="#6b6b6b">Would block the field on its own.</text>
<line x1="690" y1="278" x2="724" y2="278" stroke="#c3b48f" stroke-width="2"/>
<circle cx="724" cy="278" r="3.4" fill="#a07d43"/>
<text x="736" y="273" font-size="14.5" font-weight="700" fill="#a07d43">Routes the magnetic field around the metal,</text>
<text x="736" y="293" font-size="14.5" font-weight="700" fill="#a07d43">rather than into it.</text>
<line x1="690" y1="350" x2="724" y2="350" stroke="#9cc0c0" stroke-width="2"/>
<circle cx="724" cy="350" r="3.4" fill="#2c5454"/>
<text x="736" y="345" font-size="14.5" font-weight="700" fill="#291c0e">Radiates to the phone through the</text>
<text x="736" y="365" font-size="14.5" font-weight="700" fill="#291c0e">ferrite window.</text>
<line x1="690" y1="422" x2="724" y2="422" stroke="#b3bac4" stroke-width="2"/>
<circle cx="724" cy="422" r="3.4" fill="#4a5568"/>
<text x="736" y="417" font-size="14.5" font-weight="700" fill="#291c0e">Structural mass — the premium heft</text>
<text x="736" y="437" font-size="14.5" font-weight="700" fill="#291c0e">buyers feel in the hand.</text>

<!-- failure note (genuine risk state = red) -->
<rect x="210" y="486" width="480" height="46" rx="10" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.6"/>
<text x="450" y="514" text-anchor="middle" font-size="14" font-weight="700" fill="#8b2d2d">Bare metal, no ferrite = detuned antenna, no read.</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The ferrite isolation layer is the reason a solid-steel card taps at all.</text>
</svg>
