<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="acF4Title acF4Desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="acF4Title">The standards stack behind an autoclave-rated RFID claim</title>
  <desc id="acF4Desc">A stack of five reference standards. ISO 17664-1 and -2 cover reprocessing information — the cleaning, disinfection and sterilization steps the tag and its instrument must support. AAMI ST79 in the US and EN 285 in the EU cover steam-sterilizer performance and sterile-processing practice, with ST79 driving the 121 to 134°C cycles most US hospitals run. ISO 13485 is the medical-device manufacturing quality system. ISO 10993-5 and -10 cover biocompatibility, with cytotoxicity as the baseline and sensitisation or irritation for mucosal or in-vivo contact. ASTM F2503 covers MRI status, classifying a tag as MRI-conditional, safe or unsafe, because embedded RFID adds a ferromagnetic component.</desc>

  <defs>
    <radialGradient id="f4Bg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f1ece0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#f4Bg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="60" y="66" font-size="23" font-weight="800" letter-spacing="0.5" fill="#291c0e">The reference stack — one citation isn&apos;t enough</text>
  <text x="60" y="94" font-size="15.5" fill="#6d5a3a">Autoclavability is a regulatory claim. Expect a stack of standards, not a lone logo on a brochure.</text>

  <!-- Layer 1 : ISO 17664 -->
  <g>
    <rect x="58" y="122" width="1084" height="84" rx="12" fill="#eef4f4" stroke="#bcd4d4" stroke-width="1.5"/>
    <rect x="74" y="138" width="196" height="52" rx="9" fill="#3d6b6b"/>
    <text x="172" y="162" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">ISO 17664-1 / -2</text>
    <text x="172" y="182" text-anchor="middle" font-size="11.5" fill="#cfe0e0">reprocessing</text>
    <text x="292" y="158" font-size="16.5" font-weight="800" fill="#291c0e">Reprocessing information</text>
    <text x="292" y="184" font-size="13.5" fill="#4f4f4f">The cleaning, disinfection &amp; sterilization steps the tag and its instrument must support — disclose exactly what was tested.</text>
  </g>

  <!-- Layer 2 : AAMI ST79 / EN 285 -->
  <g>
    <rect x="58" y="214" width="1084" height="84" rx="12" fill="#eef0f3" stroke="#c3ccd6" stroke-width="1.5"/>
    <rect x="74" y="230" width="196" height="52" rx="9" fill="#4a5568"/>
    <text x="172" y="254" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">AAMI ST79 · EN 285</text>
    <text x="172" y="274" text-anchor="middle" font-size="11.5" fill="#d3d9e0">US · EU steam cycles</text>
    <text x="292" y="250" font-size="16.5" font-weight="800" fill="#291c0e">Steam-sterilizer performance &amp; SPD practice</text>
    <text x="292" y="276" font-size="13.5" fill="#4f4f4f">ST79 drives the 121–134°C cycles most US hospitals run; map published read-range data to your own equipment.</text>
  </g>

  <!-- Layer 3 : ISO 13485 -->
  <g>
    <rect x="58" y="306" width="1084" height="84" rx="12" fill="#f5efe2" stroke="#e0cfa4" stroke-width="1.5"/>
    <rect x="74" y="322" width="196" height="52" rx="9" fill="#c39a5f"/>
    <text x="172" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">ISO 13485</text>
    <text x="172" y="366" text-anchor="middle" font-size="11.5" fill="#f3e9d3">quality system</text>
    <text x="292" y="342" font-size="16.5" font-weight="800" fill="#291c0e">Manufacturing quality system</text>
    <text x="292" y="368" font-size="13.5" fill="#4f4f4f">Even unregulated tags should be built under an ISO 13485 quality system — hospital supplier qualification expects it.</text>
  </g>

  <!-- Layer 4 : ISO 10993 -->
  <g>
    <rect x="58" y="398" width="1084" height="84" rx="12" fill="#eef4ef" stroke="#b6d0be" stroke-width="1.5"/>
    <rect x="74" y="414" width="196" height="52" rx="9" fill="#2d6a4f"/>
    <text x="172" y="438" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">ISO 10993-5 / -10</text>
    <text x="172" y="458" text-anchor="middle" font-size="11.5" fill="#cfe3d6">biocompatibility</text>
    <text x="292" y="434" font-size="16.5" font-weight="800" fill="#291c0e">Biocompatibility</text>
    <text x="292" y="460" font-size="13.5" fill="#4f4f4f">Cytotoxicity (-5) is the baseline; sensitisation / irritation (-10) covers any direct in-vivo or mucosal contact.</text>
  </g>

  <!-- Layer 5 : ASTM F2503 -->
  <g>
    <rect x="58" y="490" width="1084" height="84" rx="12" fill="#efece7" stroke="#cbc2b4" stroke-width="1.5"/>
    <rect x="74" y="506" width="196" height="52" rx="9" fill="#291c0e"/>
    <text x="172" y="530" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">ASTM F2503</text>
    <text x="172" y="550" text-anchor="middle" font-size="11.5" fill="#e7d8b8">MRI status</text>
    <text x="292" y="526" font-size="16.5" font-weight="800" fill="#291c0e">MRI compatibility</text>
    <text x="292" y="552" font-size="13.5" fill="#4f4f4f">Classify MRI-conditional / -safe / -unsafe. Embedded RFID adds a ferromagnetic component — document it, don&apos;t assume.</text>
  </g>

  <text x="600" y="606" text-anchor="middle" font-size="13.5" font-style="italic" fill="#8a7a5f">If a vendor can only point to one of these, that&apos;s your answer.</text>
</svg>
