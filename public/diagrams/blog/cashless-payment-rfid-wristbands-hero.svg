<rect x="168" y="286" width="140" height="60" rx="30" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="220" y="302" width="36" height="28" rx="4" fill="#ffffff" stroke="#2c5454" stroke-width="2"/>
