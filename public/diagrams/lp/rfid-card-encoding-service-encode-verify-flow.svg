<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Proud Tek card encoding workflow: from a secured data file to a read-verified, locked card</title>
  <desc id="d">Five steps left to right. Step 1, receive data: an encoding spec, a CSV or ERP export, a key set sent PGP-encrypted, or a sample card to reverse-engineer. Step 2, scheme lock: byte order, sector map and lock behaviour confirmed in writing and locked on the production traveler. Step 3, first article: initial cards verified and tested on your reader or lock, approved before the run. Step 4, encode and lock: the full run encoded, sector and AES keys set, EPC or AUTH permalock applied where specified, keys diversified per card. Step 5, read-verify and deliver: 100% read-back verification with the encoding database shipped alongside. A base arrow shows the job moving from data received securely to card verified and shipped; nothing ships until every card reads back to spec.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ENCODE · LOCK · VERIFY</text>
  <text x="600" y="98" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">One documented path, data file to verified card</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">First-article approval catches a spec ambiguity at card one — not at card 40,000.</text>

  <!-- step 1 -->
  <rect x="48" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="143" cy="216" r="18" fill="#3d6b6b"/>
  <text x="143" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
  <text x="143" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Receive</text>
  <text x="143" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">data</text>
  <text x="143" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">spec · CSV / ERP</text>
  <text x="143" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">or a sample card</text>
  <rect x="63" y="404" width="160" height="34" rx="8" fill="#eef5f5"/>
  <text x="143" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">key set via PGP</text>

  <!-- step 2 -->
  <rect x="274" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="369" cy="216" r="18" fill="#4a5568"/>
  <text x="369" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
  <text x="369" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Scheme</text>
  <text x="369" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">lock</text>
  <text x="369" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">byte order, sector</text>
  <text x="369" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">map, lock behaviour</text>
  <rect x="289" y="404" width="160" height="34" rx="8" fill="#eef1f5"/>
  <text x="369" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">confirmed in writing</text>

  <!-- step 3 -->
  <rect x="500" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
  <circle cx="595" cy="216" r="18" fill="#c39a5f"/>
  <text x="595" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
  <text x="595" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">First</text>
  <text x="595" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">article</text>
  <text x="595" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">verified on your</text>
  <text x="595" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">reader or lock</text>
  <rect x="515" y="404" width="160" height="34" rx="8" fill="#f7edd6"/>
  <text x="595" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">approve before run</text>

  <!-- step 4 -->
  <rect x="726" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="821" cy="216" r="18" fill="#4a5568"/>
  <text x="821" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
  <text x="821" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Encode</text>
  <text x="821" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">&amp; lock</text>
  <text x="821" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">sector &amp; AES keys,</text>
  <text x="821" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">permalock as specced</text>
  <rect x="741" y="404" width="160" height="34" rx="8" fill="#eef1f5"/>
  <text x="821" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">keys diversified</text>

  <!-- step 5 -->
  <rect x="952" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="1047" cy="216" r="18" fill="#2c5454"/>
  <text x="1047" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
  <text x="1047" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Read-verify</text>
  <text x="1047" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">&amp; deliver</text>
  <text x="1047" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">100% read-back,</text>
  <text x="1047" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">database shipped</text>
  <rect x="967" y="404" width="160" height="34" rx="8" fill="#eef5f5"/>
  <text x="1047" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">verified · shipped</text>

  <!-- chevrons between steps -->
  <polygon points="250,315 262,325 250,335" fill="#c39a5f"/>
  <polygon points="476,315 488,325 476,335" fill="#c39a5f"/>
  <polygon points="702,315 714,325 702,335" fill="#c39a5f"/>
  <polygon points="928,315 940,325 928,335" fill="#c39a5f"/>

  <!-- progression base arrow -->
  <text x="100" y="548" font-size="13" font-weight="700" fill="#5c5c5c">Data received securely</text>
  <text x="1090" y="548" text-anchor="end" font-size="13" font-weight="700" fill="#5c5c5c">Card verified &amp; shipped</text>
  <line x1="100" y1="572" x2="1072" y2="572" stroke="#4a5568" stroke-width="3"/>
  <polygon points="1072,564 1090,572 1072,580" fill="#4a5568"/>
  <text x="600" y="614" text-anchor="middle" font-size="15" fill="#291c0e">Nothing ships until every card reads back to spec.</text>
</svg>
