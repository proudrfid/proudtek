<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five steps to make an NFC Christmas gift tag: choose, program, attach, label, test</title>
<desc id="d">A left-to-right flow of five steps. One, choose an NTAG213 sticker in white or clear. Two, program it by writing a URL with the NFC Tools app, which takes about ten seconds. Three, attach it by peeling and sticking it to the wrapping. Four, label it with a note such as Tap me with your phone. Five, test it by tapping it yourself before wrapping.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW TO MAKE ONE · FIVE STEPS</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">From blank sticker to under the tree</text>
<text x="600" y="132" text-anchor="middle" font-size="16" fill="#4f4f4f">About ten seconds of programming, and zero technical skill.</text>

<!-- step 1 CHOOSE -->
<rect x="70" y="250" width="176" height="240" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="70" y="250" width="176" height="8" rx="4" fill="#3d6b6b"/>
<text x="158" y="292" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#2c5454">1 · CHOOSE</text>
<rect x="132" y="316" width="52" height="52" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<rect x="148" y="332" width="20" height="20" rx="3" fill="none" stroke="#2c5454" stroke-width="2"/>
<text x="158" y="412" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Choose sticker</text>
<text x="158" y="440" text-anchor="middle" font-size="12.5" fill="#5c5c5c">NTAG213, white</text>
<text x="158" y="458" text-anchor="middle" font-size="12.5" fill="#5c5c5c">or clear</text>

<!-- step 2 PROGRAM -->
<rect x="285" y="250" width="176" height="240" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="285" y="250" width="176" height="8" rx="4" fill="#3d6b6b"/>
<text x="373" y="292" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#2c5454">2 · PROGRAM</text>
<rect x="355" y="312" width="36" height="58" rx="6" fill="#eef5f5" stroke="#234a4a" stroke-width="2"/>
<line x1="362" y1="330" x2="384" y2="330" stroke="#3d6b6b" stroke-width="2"/>
<line x1="362" y1="342" x2="384" y2="342" stroke="#a9cccc" stroke-width="2"/>
<text x="373" y="412" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Program</text>
<text x="373" y="440" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Write a URL with</text>
<text x="373" y="458" text-anchor="middle" font-size="12.5" fill="#5c5c5c">NFC Tools (~10s)</text>

<!-- step 3 ATTACH -->
<rect x="500" y="250" width="176" height="240" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="500" y="250" width="176" height="8" rx="4" fill="#3d6b6b"/>
<text x="588" y="292" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#2c5454">3 · ATTACH</text>
<rect x="562" y="326" width="52" height="42" rx="6" fill="#3d6b6b"/>
<rect x="556" y="316" width="64" height="14" rx="4" fill="#234a4a"/>
<rect x="582" y="316" width="12" height="52" fill="#d4a755"/>
<text x="588" y="412" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Attach</text>
<text x="588" y="440" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Peel and stick to</text>
<text x="588" y="458" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the wrapping</text>

<!-- step 4 LABEL -->
<rect x="715" y="250" width="176" height="240" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="715" y="250" width="176" height="8" rx="4" fill="#3d6b6b"/>
<text x="803" y="292" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#2c5454">4 · LABEL</text>
<rect x="769" y="318" width="68" height="46" rx="8" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
<text x="803" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">TAP ME</text>
<text x="803" y="412" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Label it</text>
<text x="803" y="440" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Add: Tap me</text>
<text x="803" y="458" text-anchor="middle" font-size="12.5" fill="#5c5c5c">with your phone!</text>

<!-- step 5 TEST -->
<rect x="930" y="250" width="176" height="240" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<rect x="930" y="250" width="176" height="8" rx="4" fill="#1f6f3a"/>
<text x="1018" y="292" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">5 · TEST</text>
<circle cx="1018" cy="342" r="26" fill="#ffffff" stroke="#1f6f3a" stroke-width="2.5"/>
<polyline points="1006,342 1015,352 1032,332" fill="none" stroke="#1f6f3a" stroke-width="3.5"/>
<text x="1018" y="412" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Test</text>
<text x="1018" y="440" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Tap it yourself</text>
<text x="1018" y="458" text-anchor="middle" font-size="12.5" fill="#5c5c5c">before wrapping</text>

<!-- arrows -->
<line x1="252" y1="370" x2="279" y2="370" stroke="#291c0e" stroke-width="3"/>
<polygon points="279,363 293,370 279,377" fill="#291c0e"/>
<line x1="467" y1="370" x2="494" y2="370" stroke="#291c0e" stroke-width="3"/>
<polygon points="494,363 508,370 494,377" fill="#291c0e"/>
<line x1="682" y1="370" x2="709" y2="370" stroke="#291c0e" stroke-width="3"/>
<polygon points="709,363 723,370 709,377" fill="#291c0e"/>
<line x1="897" y1="370" x2="924" y2="370" stroke="#291c0e" stroke-width="3"/>
<polygon points="924,363 938,370 924,377" fill="#291c0e"/>

<text x="600" y="566" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Step five is the one nobody regrets: a tag that fails on Christmas morning fails in front of an audience.</text>
</svg>
