<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Which chip belongs in a stored-value coin keyfob</title>
  <desc id="d">A three-tier decision diagram for coin-keyfob chips. Tier one: NTAG213 / NTAG216, a tap-to-URL token with no encryption, for loyalty taps only. Tier two: MIFARE Classic 1K, whose CRYPTO-1 cipher was publicly broken in 2008 and clones in seconds — not for new stored value. Tier three: MIFARE DESFire EV2 / EV3 with AES-128 mutual authentication and a Transaction MAC, the greenfield stored-value default. A footer notes the DESFire EV3 upcharge is about 0.25 dollars per coin.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHICH CHIP BELONGS IN A STORED-VALUE COIN</text>
  <text x="600" y="84" text-anchor="middle" font-size="15" fill="#5c5c5c">Three tiers: a tap token, a broken legacy chip, and the AES-128 default</text>

  <!-- Tier 1: NTAG (teal / tap token) -->
  <rect x="100" y="112" width="1000" height="120" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="100" y="112" width="12" height="120" rx="6" fill="#3d6b6b"/>
  <text x="140" y="152" font-size="23" font-weight="800" fill="#291c0e">NTAG213 / NTAG216</text>
  <text x="140" y="182" font-size="14.5" fill="#5c5c5c">Tap-to-URL or a basic ID — no encryption at the air interface.</text>
  <text x="140" y="208" font-size="14.5" fill="#5c5c5c">Cheapest silicon; carries no balance.</text>
  <rect x="838" y="140" width="234" height="64" rx="10" fill="#e7efef" stroke="#bcd2d2" stroke-width="1.5"/>
  <text x="955" y="169" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.4" fill="#2c5454">LOYALTY TAPS</text>
  <text x="955" y="190" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.4" fill="#2c5454">ONLY</text>

  <!-- Tier 2: MIFARE Classic (RED / risk) -->
  <rect x="100" y="252" width="1000" height="120" rx="14" fill="#ffffff" stroke="#e2b8b0" stroke-width="2"/>
  <rect x="100" y="252" width="12" height="120" rx="6" fill="#8b2d2d"/>
  <text x="140" y="292" font-size="23" font-weight="800" fill="#291c0e">MIFARE Classic 1K</text>
  <text x="140" y="322" font-size="14.5" fill="#5c5c5c">CRYPTO-1 cipher publicly broken in 2008 (Garcia et al.).</text>
  <text x="140" y="348" font-size="14.5" fill="#8b2d2d">Clones in seconds with off-the-shelf tools.</text>
  <rect x="838" y="280" width="234" height="64" rx="10" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="1.5"/>
  <text x="955" y="309" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.4" fill="#8b2d2d">NOT FOR NEW</text>
  <text x="955" y="330" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.4" fill="#8b2d2d">STORED VALUE</text>

  <!-- Tier 3: DESFire (gold / default) -->
  <rect x="100" y="392" width="1000" height="120" rx="14" fill="#ffffff" stroke="#e4c98f" stroke-width="2"/>
  <rect x="100" y="392" width="12" height="120" rx="6" fill="#6d5a3a"/>
  <text x="140" y="432" font-size="23" font-weight="800" fill="#291c0e">MIFARE DESFire EV2 / EV3</text>
  <text x="140" y="462" font-size="14.5" fill="#5c5c5c">AES-128 mutual auth + Transaction MAC (NXP AN12343).</text>
  <text x="140" y="488" font-size="14.5" fill="#5c5c5c">Counterfeit balance is computationally out of reach.</text>
  <rect x="838" y="420" width="234" height="64" rx="10" fill="#f1e6cd" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="955" y="449" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">GREENFIELD</text>
  <text x="955" y="470" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">DEFAULT</text>

  <!-- footer callout -->
  <rect x="100" y="536" width="1000" height="82" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="600" y="570" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">The upgrade math</text>
  <text x="600" y="596" text-anchor="middle" font-size="14" fill="#5c5c5c">The DESFire EV3 upcharge is about $0.25 per coin — recovered the first time a counterfeit coin is refused at the reader.</text>
</svg>
