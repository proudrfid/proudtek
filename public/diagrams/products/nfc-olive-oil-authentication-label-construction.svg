<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Bridge-antenna NTAG 424 DNA olive-oil label construction and tamper states</title>
  <desc id="d">Left: an olive-oil bottle neck close-up where a bridge label spans the cap and the neck, with a red break line at the cap-and-neck seam that severs the antenna trace when the cap turns. Centre: the label layer stack — a paper or PET face label that hides the inlay, an aluminium bridge antenna carrying the NTAG 424 DNA die at 13.56 MHz with AES-128 SUN, the break line across the cap-and-neck seam, and a permanent or tamper-evident adhesive. Bottom: three states — sealed with the trace intact reads genuine, opened with the trace broken reads opened, and a QR code printed alongside as a fallback for phones without NFC. A closing line notes the NTAG 424 DNA TagTamper variant signs the sealed or opened state.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">BRIDGE ANTENNA SPANS CAP AND NECK</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Opening the bottle severs the antenna trace — the tap reads OPENED and the refill is caught</text>

  <!-- bottle neck close-up -->
  <rect x="196" y="176" width="60" height="30" rx="5" fill="#6d5a3a"/>
  <rect x="204" y="206" width="44" height="52" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <path d="M188 258 L264 258 L286 330 L166 330 Z" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <rect x="188" y="190" width="76" height="86" rx="8" fill="#f7edd6" stroke="#c39a5f" stroke-width="2" opacity="0.92"/>
  <rect x="210" y="222" width="32" height="20" rx="3" fill="#3d6b6b"/>
  <line x1="188" y1="206" x2="264" y2="206" stroke="#8b2d2d" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="226" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">Bridge label bonds cap to neck</text>
  <text x="226" y="379" text-anchor="middle" font-size="12" fill="#8b2d2d">red seam = trace breaks on opening</text>

  <!-- layer stack -->
  <text x="640" y="150" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">THE LABEL STACK</text>
  <rect x="470" y="168" width="340" height="40" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="490" y="193" font-size="13.5" fill="#291c0e">Paper or PET face label — hides the inlay</text>
  <rect x="470" y="214" width="340" height="52" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="490" y="236" font-size="13.5" fill="#291c0e">Aluminium bridge antenna + chip die</text>
  <text x="490" y="255" font-size="12" fill="#5c5c5c">NTAG 424 DNA · 13.56 MHz · AES-128 SUN</text>
  <rect x="470" y="272" width="340" height="40" rx="6" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="2"/>
  <text x="490" y="297" font-size="13.5" fill="#8b2d2d">Break line across the cap / neck seam</text>
  <rect x="470" y="318" width="340" height="40" rx="6" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <text x="490" y="343" font-size="13.5" fill="#291c0e">Permanent / tamper-evident adhesive</text>

  <!-- state chips -->
  <text x="600" y="416" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT THE TAP READS</text>
  <rect x="150" y="436" width="290" height="88" rx="12" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <text x="170" y="466" font-size="16" font-weight="700" fill="#1f6f3a">SEALED</text>
  <text x="170" y="490" font-size="13" fill="#5c5c5c">Trace intact, cap unturned</text>
  <text x="170" y="510" font-size="13" fill="#1f6f3a">tap reads GENUINE</text>
  <rect x="455" y="436" width="290" height="88" rx="12" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="2"/>
  <text x="475" y="466" font-size="16" font-weight="700" fill="#8b2d2d">OPENED</text>
  <text x="475" y="490" font-size="13" fill="#5c5c5c">Trace severed at the seam</text>
  <text x="475" y="510" font-size="13" fill="#8b2d2d">tap reads OPENED</text>
  <rect x="760" y="436" width="290" height="88" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="780" y="466" font-size="16" font-weight="700" fill="#3d6b6b">QR FALLBACK</text>
  <text x="780" y="490" font-size="13" fill="#5c5c5c">Printed beside the label</text>
  <text x="780" y="510" font-size="13" fill="#3d6b6b">for phones without NFC</text>

  <text x="600" y="566" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The NTAG 424 DNA TagTamper variant signs the sealed or opened state, so the tap proves it cryptographically.</text>
</svg>
