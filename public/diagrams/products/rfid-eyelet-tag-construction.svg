<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Construction of an RFID eyelet tag — metal grommet through a sealed laminate</title>
  <desc id="d">Cross-section of an RFID eyelet tag: a reinforced metal grommet set through a stack of a UV-stabilised TPU top-ply, a printed PVC and TPU face laminate, a UHF 860-960 MHz or HF 13.56 MHz inlay with the antenna foil routed around the hole, a reinforced patch ring, and a canvas, leather or textile host. The grommet is Ø 5.0, 6.35 or 8.0 mm in brass, nickel-plated or 316L stainless with a 500-800 N pull-out per DIN 53351. Four mount methods are shown: sew-in, rivet or bolt-through, cable-tie, and lashing or hang.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANATOMY OF AN RFID EYELET TAG</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">A reinforced metal grommet set through the laminate and the host — the tag lives in the hole the lashing already used</text>

  <!-- cross-section stack -->
  <rect x="250" y="190" width="360" height="22" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <rect x="250" y="212" width="360" height="32" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <rect x="250" y="244" width="360" height="40" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <rect x="250" y="284" width="360" height="30" fill="#efe7d8" stroke="#d9cdb8" stroke-width="2"/>
  <rect x="250" y="314" width="360" height="46" fill="#dfe4ea" stroke="#b9c0cc" stroke-width="2"/>

  <!-- antenna foil routed around the hole -->
  <line x1="262" y1="264" x2="404" y2="264" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round"/>
  <line x1="456" y1="264" x2="598" y2="264" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round"/>

  <!-- set grommet -->
  <rect x="408" y="180" width="44" height="192" fill="#4a5568"/>
  <rect x="394" y="182" width="72" height="14" rx="3" fill="#4a5568"/>
  <rect x="394" y="358" width="72" height="14" rx="3" fill="#4a5568"/>
  <rect x="424" y="180" width="12" height="192" fill="#ffffff"/>

  <text x="430" y="388" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Layer stack + set grommet — cross-section, not to scale</text>

  <!-- legend -->
  <text x="666" y="176" font-size="15" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">THE LAYER STACK — OUTSIDE IN</text>

  <rect x="666" y="200" width="26" height="26" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <text x="704" y="213" font-size="14" font-weight="700" fill="#291c0e">UV-stabilised TPU top-ply</text>
  <text x="704" y="231" font-size="12.5" fill="#5c5c5c">-30 °C to +85 °C service</text>

  <rect x="666" y="246" width="26" height="26" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="704" y="259" font-size="14" font-weight="700" fill="#291c0e">Printed PVC + TPU face laminate</text>
  <text x="704" y="277" font-size="12.5" fill="#5c5c5c">RF-welded seam · IP67 (IEC 60529)</text>

  <rect x="666" y="292" width="26" height="26" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="704" y="305" font-size="14" font-weight="700" fill="#291c0e">UHF 860-960 MHz / HF 13.56 MHz inlay</text>
  <text x="704" y="323" font-size="12.5" fill="#5c5c5c">Antenna foil routed around the hole</text>

  <rect x="666" y="338" width="26" height="26" fill="#efe7d8" stroke="#d9cdb8" stroke-width="2"/>
  <text x="704" y="351" font-size="14" font-weight="700" fill="#291c0e">Reinforced patch ring</text>
  <text x="704" y="369" font-size="12.5" fill="#5c5c5c">Keeps the eyelet from tearing out</text>

  <rect x="666" y="384" width="26" height="26" fill="#dfe4ea" stroke="#b9c0cc" stroke-width="2"/>
  <text x="704" y="397" font-size="14" font-weight="700" fill="#291c0e">Canvas / leather / textile host</text>
  <text x="704" y="415" font-size="12.5" fill="#5c5c5c">Tag lives in the existing eyelet path</text>

  <rect x="666" y="430" width="26" height="26" fill="#4a5568"/>
  <text x="704" y="443" font-size="14" font-weight="700" fill="#291c0e">Metal eyelet Ø 5.0 / 6.35 / 8.0 mm</text>
  <text x="704" y="461" font-size="12.5" fill="#5c5c5c">500-800 N pull-out per DIN 53351</text>

  <!-- mount methods -->
  <text x="600" y="498" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FOUR WAYS TO MOUNT THE SAME EYELET</text>

  <rect x="70" y="514" width="250" height="94" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="514" width="6" height="94" rx="3" fill="#3d6b6b"/>
  <text x="92" y="546" font-size="16" font-weight="700" fill="#291c0e">Sew-in</text>
  <text x="92" y="570" font-size="12.5" fill="#5c5c5c">Thread through the eyelet</text>
  <text x="92" y="590" font-size="12.5" fill="#5c5c5c">linen · uniforms · hospitality</text>

  <rect x="340" y="514" width="250" height="94" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="340" y="514" width="6" height="94" rx="3" fill="#3d6b6b"/>
  <text x="362" y="546" font-size="16" font-weight="700" fill="#291c0e">Rivet / bolt-through</text>
  <text x="362" y="570" font-size="12.5" fill="#5c5c5c">Canvas tarps · heavy covers</text>
  <text x="362" y="590" font-size="12.5" fill="#5c5c5c">coated fabric · technical</text>

  <rect x="610" y="514" width="250" height="94" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="610" y="514" width="6" height="94" rx="3" fill="#3d6b6b"/>
  <text x="632" y="546" font-size="16" font-weight="700" fill="#291c0e">Cable-tie</text>
  <text x="632" y="570" font-size="12.5" fill="#5c5c5c">Zip-tie or carabiner</text>
  <text x="632" y="590" font-size="12.5" fill="#5c5c5c">marine sails · tool-roll bags</text>

  <rect x="880" y="514" width="250" height="94" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="880" y="514" width="6" height="94" rx="3" fill="#3d6b6b"/>
  <text x="902" y="546" font-size="16" font-weight="700" fill="#291c0e">Lashing / hang</text>
  <text x="902" y="570" font-size="12.5" fill="#5c5c5c">Hung from cord or hook</text>
  <text x="902" y="590" font-size="12.5" fill="#5c5c5c">canopies · leather goods</text>

  <text x="600" y="636" text-anchor="middle" font-size="13.5" fill="#5c5c5c">One grommet SKU anchors canvas, leather, technical fabric, tarp and coated-fabric hosts — no adhesive bond to fail.</text>
</svg>
