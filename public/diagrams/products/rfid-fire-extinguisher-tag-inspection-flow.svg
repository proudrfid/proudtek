<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Inspection-to-audit flow for an RFID fire-extinguisher tag</title>
  <desc id="d">A four-step flow: the platform auto-schedules the NFPA 10 section 7.2 monthly visual and section 7.3 annual maintenance per unit; the inspector taps the tag within 0-5 cm at 13.56 MHz with a GPS stamp and timestamped photo; a signed, timestamped record is written as an EPCIS 2.0 event with an optional NTAG424 DNA SUN CMAC AES-128 signature; and the AHJ or Joint Commission PDF or CSV audit export is produced on demand under EC.02.03.05. A banner notes that a missed monthly visual flips the unit to overdue and escalates to the facility Authority Having Jurisdiction. A footer notes the 6-year internal examination and 12-year hydrostatic test ride the same cadence engine.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FROM MONTHLY TAP TO AHJ AUDIT</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Each tap proves presence and writes the record a survey actually asks for</text>

  <rect x="70" y="168" width="235" height="210" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="70" y="168" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="187" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1 · SCHEDULE</text>
  <text x="187" y="250" text-anchor="middle" font-size="14" fill="#291c0e">Cadence auto-set</text>
  <text x="187" y="274" text-anchor="middle" font-size="14" fill="#291c0e">per unit</text>
  <text x="187" y="314" text-anchor="middle" font-size="12.5" fill="#5c5c5c">NFPA 10 §7.2 monthly</text>
  <text x="187" y="334" text-anchor="middle" font-size="12.5" fill="#5c5c5c">§7.3 annual maintenance</text>

  <rect x="345" y="168" width="235" height="210" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="345" y="168" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="462" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2 · TAP</text>
  <text x="462" y="250" text-anchor="middle" font-size="14" fill="#291c0e">Handset within 0-5 cm</text>
  <text x="462" y="274" text-anchor="middle" font-size="14" fill="#291c0e">+ GPS + photo</text>
  <text x="462" y="314" text-anchor="middle" font-size="12.5" fill="#5c5c5c">13.56 MHz proximity</text>
  <text x="462" y="334" text-anchor="middle" font-size="12.5" fill="#5c5c5c">proves §7.2.2 presence</text>

  <rect x="620" y="168" width="235" height="210" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <rect x="620" y="168" width="235" height="42" rx="14" fill="#4a5568"/>
  <text x="737" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3 · LOG</text>
  <text x="737" y="250" text-anchor="middle" font-size="14" fill="#291c0e">Signed, timestamped</text>
  <text x="737" y="274" text-anchor="middle" font-size="14" fill="#291c0e">record written</text>
  <text x="737" y="314" text-anchor="middle" font-size="12.5" fill="#5c5c5c">EPCIS 2.0 event ·</text>
  <text x="737" y="334" text-anchor="middle" font-size="12.5" fill="#5c5c5c">NTAG424 DNA AES-128</text>

  <rect x="895" y="168" width="235" height="210" rx="14" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <rect x="895" y="168" width="235" height="42" rx="14" fill="#1f6f3a"/>
  <text x="1012" y="196" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4 · AUDIT</text>
  <text x="1012" y="252" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6f3a">PDF / CSV EXPORT</text>
  <text x="1012" y="292" text-anchor="middle" font-size="12.5" fill="#5c5c5c">AHJ · EC.02.03.05</text>
  <text x="1012" y="312" text-anchor="middle" font-size="12.5" fill="#5c5c5c">on demand</text>

  <polygon points="308,270 336,270 336,264 350,273 336,282 336,276 308,276" fill="#4a5568"/>
  <polygon points="583,270 611,270 611,264 625,273 611,282 611,276 583,276" fill="#4a5568"/>
  <polygon points="858,270 886,270 886,264 900,273 886,282 886,276 858,276" fill="#4a5568"/>

  <rect x="70" y="416" width="1060" height="66" rx="12" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="1.5"/>
  <text x="90" y="444" font-size="15" font-weight="700" fill="#8b2d2d">Overdue escalates to the AHJ</text>
  <text x="90" y="466" font-size="13.5" fill="#8b2d2d">A missed §7.2 monthly visual flips the unit to overdue and escalates to the facility AHJ — the pencil-whipping finding surveyors cite.</text>

  <text x="600" y="536" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The 6-year §7.3.3 internal examination and 12-year §8 hydrostatic test ride the same cadence engine.</text>
</svg>
