<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Defensible sustainability claims versus vague ones for eco wristbands</title>
<desc id="d">Two columns. On the left, vague claims that invite a retraction: 'plastic-free', 'carbon-neutral' and 'ocean-positive', each unprovable at the band level. On the right, five defensible claims anchored to a number: grams of plastic avoided (8 to 12 grams of vinyl replaced by 4 to 6 grams of shell plus a 0.3 gram inlay); 60 to 80 percent souvenir retention versus under 10 percent for vinyl; compostable after chip removal; disclosed shell origin in Sri Lanka, the Philippines or Indonesia; and a 40 to 60 percent take-back rate as a measurable KPI.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT YOU CAN DEFENSIBLY CLAIM</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">Anchor every green claim to a measurable substitution, or one audit unwinds it.</text>

<!-- LEFT : vague -->
<rect x="80" y="112" width="470" height="410" rx="14" fill="#ffffff" stroke="#e3c4c4" stroke-width="1.8"/>
<rect x="80" y="112" width="470" height="8" rx="4" fill="#8b2d2d"/>
<text x="315" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#8b2d2d">VAGUE &#8212; ONE AUDIT FROM A RETRACTION</text>

<rect x="100" y="190" width="430" height="64" rx="10" fill="#f7ecec" stroke="#e3c4c4" stroke-width="1.2"/>
<circle cx="132" cy="222" r="11" fill="#8b2d2d"/>
<line x1="128" y1="218" x2="136" y2="226" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
<line x1="128" y1="226" x2="136" y2="218" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
<text x="158" y="216" font-size="15" font-weight="800" fill="#291c0e">&#8216;Plastic-free&#8217;</text>
<text x="158" y="238" font-size="12.5" fill="#8a5a5a">no proof at the band level</text>

<rect x="100" y="262" width="430" height="64" rx="10" fill="#f7ecec" stroke="#e3c4c4" stroke-width="1.2"/>
<circle cx="132" cy="294" r="11" fill="#8b2d2d"/>
<line x1="128" y1="290" x2="136" y2="298" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
<line x1="128" y1="298" x2="136" y2="290" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
<text x="158" y="288" font-size="15" font-weight="800" fill="#291c0e">&#8216;Carbon-neutral&#8217;</text>
<text x="158" y="310" font-size="12.5" fill="#8a5a5a">offsets rarely audited</text>

<rect x="100" y="334" width="430" height="64" rx="10" fill="#f7ecec" stroke="#e3c4c4" stroke-width="1.2"/>
<circle cx="132" cy="366" r="11" fill="#8b2d2d"/>
<line x1="128" y1="362" x2="136" y2="370" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
<line x1="128" y1="370" x2="136" y2="362" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
<text x="158" y="360" font-size="15" font-weight="800" fill="#291c0e">&#8216;Ocean-positive&#8217;</text>
<text x="158" y="382" font-size="12.5" fill="#8a5a5a">a slogan, not a metric</text>

<text x="315" y="446" text-anchor="middle" font-size="13" fill="#8b2d2d">Buyers and sponsors will ask for the receipts.</text>

<!-- RIGHT : defensible -->
<rect x="650" y="112" width="470" height="410" rx="14" fill="#ffffff" stroke="#cfe3d6" stroke-width="1.8"/>
<rect x="650" y="112" width="470" height="8" rx="4" fill="#2d6a4f"/>
<text x="885" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#2d6a4f">DEFENSIBLE &#8212; ANCHORED TO A NUMBER</text>

<rect x="666" y="174" width="438" height="50" rx="9" fill="#eef5f0" stroke="#d9ebe0" stroke-width="1.2"/>
<circle cx="692" cy="199" r="11" fill="#1f6f3a"/>
<path d="M687 199 L690.5 203 L697 195" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="716" y="194" font-size="14.5" font-weight="800" fill="#291c0e">Grams of plastic avoided</text>
<text x="716" y="214" font-size="12" fill="#5c5c5c">8-12 g vinyl &#8594; 4-6 g shell + 0.3 g inlay</text>

<rect x="666" y="238" width="438" height="50" rx="9" fill="#eef5f0" stroke="#d9ebe0" stroke-width="1.2"/>
<circle cx="692" cy="263" r="11" fill="#1f6f3a"/>
<path d="M687 263 L690.5 267 L697 259" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="716" y="258" font-size="14.5" font-weight="800" fill="#291c0e">60-80% souvenir retention</text>
<text x="716" y="278" font-size="12" fill="#5c5c5c">versus under 10% for vinyl</text>

<rect x="666" y="302" width="438" height="50" rx="9" fill="#eef5f0" stroke="#d9ebe0" stroke-width="1.2"/>
<circle cx="692" cy="327" r="11" fill="#1f6f3a"/>
<path d="M687 327 L690.5 331 L697 323" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="716" y="322" font-size="14.5" font-weight="800" fill="#291c0e">Compostable after chip removal</text>
<text x="716" y="342" font-size="12" fill="#5c5c5c">shell + cotton cord</text>

<rect x="666" y="366" width="438" height="50" rx="9" fill="#eef5f0" stroke="#d9ebe0" stroke-width="1.2"/>
<circle cx="692" cy="391" r="11" fill="#1f6f3a"/>
<path d="M687 391 L690.5 395 L697 387" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="716" y="386" font-size="14.5" font-weight="800" fill="#291c0e">Disclosed shell origin</text>
<text x="716" y="406" font-size="12" fill="#5c5c5c">Sri Lanka / Philippines / Indonesia</text>

<rect x="666" y="430" width="438" height="50" rx="9" fill="#fdf6e7" stroke="#e4c98f" stroke-width="1.4"/>
<circle cx="692" cy="455" r="11" fill="#1f6f3a"/>
<path d="M687 455 L690.5 459 L697 451" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="716" y="450" font-size="14.5" font-weight="800" fill="#291c0e">40-60% take-back rate</text>
<text x="716" y="470" font-size="12" fill="#8a6d34">a measurable post-event KPI</text>

<!-- bottom callout -->
<rect x="80" y="548" width="1040" height="64" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.6"/>
<text x="600" y="586" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6d34">The take-back rate is about the only green claim you can put on a sponsor slide without a lawyer flinching.</text>
</svg>
