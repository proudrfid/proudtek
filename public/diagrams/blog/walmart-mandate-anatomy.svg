<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="mat mad" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="mat">Anatomy of a Walmart RFID compliance notice</title>
  <desc id="mad">The three non-negotiable parts of a Walmart RFID compliance notice. One, the category list: four apparel categories in scope — tops, bottoms, dresses and intimates — across 1,840 active SKUs. Two, the read-rate threshold: at least 95 percent case-level reads at Walmart's regional distribution centre; below it is a fail. Three, the hard date: a 14-week supplier-compliance window, after which chargebacks begin. Miss any one and the chargebacks start.</desc>
  <defs><radialGradient id="mabg" cx="50%" cy="20%" r="92%"><stop offset="0%" stop-color="#f8f0df"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#mabg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="24" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="1.4" fill="#6d5a3a">ANATOMY OF A WALMART RFID COMPLIANCE NOTICE</text>
  <rect x="150" y="86" width="900" height="50" rx="12" fill="#faf4e8" stroke="#e4c98f" stroke-width="1.5"/>
  <circle cx="180" cy="111" r="7" fill="#8b2d2d"/>
  <text x="202" y="117" font-size="18" font-weight="700" fill="#291c0e">SUBJECT:  RFID Tagging Mandate — Supplier Action Required</text>
  <rect x="56" y="168" width="346" height="384" rx="18" fill="#fdf8ef" stroke="#c39a5f" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="56" y="168" width="346" height="8" rx="4" fill="#c39a5f"/>
  <circle cx="229.0" cy="240" r="40" fill="#c39a5f"/>
  <circle cx="210.0" cy="227" r="3.2" fill="#ffffff"/>
  <line x1="220.0" y1="227" x2="249.0" y2="227" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="210.0" cy="240" r="3.2" fill="#ffffff"/>
  <line x1="220.0" y1="240" x2="249.0" y2="240" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="210.0" cy="253" r="3.2" fill="#ffffff"/>
  <line x1="220.0" y1="253" x2="249.0" y2="253" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="229.0" y="322" font-size="25" font-weight="800" fill="#291c0e" text-anchor="middle">The category list</text>
  <rect x="139" y="344" width="180" height="48" rx="24" fill="#efe0bf" stroke="#c39a5f" stroke-width="1.5"/>
  <text x="229.0" y="376" text-anchor="middle" font-size="22" font-weight="800" fill="#291c0e">4 categories</text>
  <text x="229.0" y="438" font-size="17.5" font-weight="400" fill="#4f4f4f" text-anchor="middle">Tops, bottoms, dresses,</text>
  <text x="229.0" y="464" font-size="17.5" font-weight="400" fill="#4f4f4f" text-anchor="middle">intimates — 1,840 SKUs.</text>
  <rect x="427" y="168" width="346" height="384" rx="18" fill="#eef5f5" stroke="#3d6b6b" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="427" y="168" width="346" height="8" rx="4" fill="#3d6b6b"/>
  <circle cx="600.0" cy="240" r="40" fill="#3d6b6b"/>
  <circle cx="600.0" cy="240" r="21" fill="none" stroke="#ffffff" stroke-width="3.5"/>
  <circle cx="600.0" cy="240" r="11" fill="none" stroke="#ffffff" stroke-width="3.5"/>
  <circle cx="600.0" cy="240" r="3.5" fill="#ffffff"/>
  <text x="600.0" y="322" font-size="25" font-weight="800" fill="#291c0e" text-anchor="middle">The read-rate bar</text>
  <rect x="510" y="344" width="180" height="48" rx="24" fill="#e8f1f1" stroke="#3d6b6b" stroke-width="1.5"/>
  <text x="600.0" y="376" text-anchor="middle" font-size="22" font-weight="800" fill="#3d6b6b">≥ 95%</text>
  <text x="600.0" y="438" font-size="17.5" font-weight="400" fill="#4f4f4f" text-anchor="middle">Case-level reads at the</text>
  <text x="600.0" y="464" font-size="17.5" font-weight="400" fill="#4f4f4f" text-anchor="middle">RDC. Below it = fail.</text>
  <rect x="798" y="168" width="346" height="384" rx="18" fill="#fbeeee" stroke="#8b2d2d" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="798" y="168" width="346" height="8" rx="4" fill="#8b2d2d"/>
  <circle cx="971.0" cy="240" r="40" fill="#8b2d2d"/>
  <circle cx="971.0" cy="240" r="21" fill="none" stroke="#ffffff" stroke-width="3.5"/>
  <line x1="971.0" y1="240" x2="971.0" y2="227" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="971.0" y1="240" x2="982.0" y2="244" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <text x="971.0" y="322" font-size="25" font-weight="800" fill="#291c0e" text-anchor="middle">The hard date</text>
  <rect x="881" y="344" width="180" height="48" rx="24" fill="#f6e9e9" stroke="#8b2d2d" stroke-width="1.5"/>
  <text x="971.0" y="376" text-anchor="middle" font-size="22" font-weight="800" fill="#8b2d2d">14 weeks</text>
  <text x="971.0" y="438" font-size="17.5" font-weight="400" fill="#4f4f4f" text-anchor="middle">Supplier window. After it,</text>
  <text x="971.0" y="464" font-size="17.5" font-weight="400" fill="#4f4f4f" text-anchor="middle">the chargebacks begin.</text>
  <text x="600" y="600" text-anchor="middle" font-size="18" font-weight="700" fill="#6d5a3a">Three non-negotiables. Miss any one — ready or not — and the chargebacks start.</text>
</svg>
