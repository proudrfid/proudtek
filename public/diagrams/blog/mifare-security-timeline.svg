<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">MIFARE security timeline from the 2008 Crypto-1 break to the 2024 Fudan backdoor</title>
<desc id="d">A horizontal security timeline with six milestones alternating above and below a central axis. 2008, MIFARE Classic Crypto-1 reverse-engineered and marked broken in red. 2008, DESFire EV1 with 3DES and AES at EAL4+. MIFARE Plus at Security Level 3 with AES-128 mutual authentication at EAL4+. 2017, DESFire EV2 with AES and CMAC sessions at EAL5+. 2020, DESFire EV3 with AES plus SUN and SDM at EAL5+, marked current. 2024, the Fudan FM11RF08 hardware backdoor, marking the Classic clones broken in red. A footer notes the timeline is broken at both ends and the secure middle is DESFire EV2 and EV3 at EAL5+.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="16%" r="94%">
    <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
  </radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MIFARE SECURITY TIMELINE</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Broken at both ends, secure in the middle</text>
<text x="600" y="126" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Read a MIFARE credential as a position on this timeline — not as a feature list.</text>

<!-- axis -->
<line x1="110" y1="360" x2="1120" y2="360" stroke="#d8cfbf" stroke-width="3"/>

<!-- n1 above red -->
<line x1="172" y1="360" x2="172" y2="344" stroke="#8b2d2d" stroke-width="2"/>
<rect x="84" y="226" width="176" height="118" rx="12" fill="#fbeeee" stroke="#8b2d2d" stroke-width="1.7"/>
<text x="172" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">2008</text>
<text x="172" y="280" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Classic Crypto-1</text>
<text x="172" y="303" text-anchor="middle" font-size="12.5" fill="#5c5c5c">reverse-engineered</text>
<rect x="124" y="314" width="96" height="22" rx="11" fill="#8b2d2d"/>
<text x="172" y="329" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">BROKEN</text>
<circle cx="172" cy="360" r="9" fill="#8b2d2d" stroke="#ffffff" stroke-width="2"/>

<!-- n2 below teal -->
<line x1="356" y1="360" x2="356" y2="376" stroke="#3d6b6b" stroke-width="2"/>
<rect x="268" y="376" width="176" height="118" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="356" y="406" text-anchor="middle" font-size="13.5" font-weight="700" fill="#234a4a">2008</text>
<text x="356" y="432" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">DESFire EV1</text>
<text x="356" y="455" text-anchor="middle" font-size="12.5" fill="#5c5c5c">3DES / AES</text>
<text x="356" y="477" text-anchor="middle" font-size="12.5" fill="#5c5c5c">EAL4+</text>
<circle cx="356" cy="360" r="9" fill="#3d6b6b" stroke="#ffffff" stroke-width="2"/>

<!-- n3 above teal -->
<line x1="540" y1="360" x2="540" y2="344" stroke="#3d6b6b" stroke-width="2"/>
<rect x="452" y="226" width="176" height="118" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="540" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#234a4a">Plus SL3</text>
<text x="540" y="280" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">AES-128</text>
<text x="540" y="303" text-anchor="middle" font-size="12.5" fill="#5c5c5c">mutual auth</text>
<text x="540" y="325" text-anchor="middle" font-size="12.5" fill="#5c5c5c">EAL4+</text>
<circle cx="540" cy="360" r="9" fill="#3d6b6b" stroke="#ffffff" stroke-width="2"/>

<!-- n4 below green -->
<line x1="724" y1="360" x2="724" y2="376" stroke="#1f6f3a" stroke-width="2"/>
<rect x="636" y="376" width="176" height="118" rx="12" fill="#ffffff" stroke="#1f6f3a" stroke-width="1.6"/>
<text x="724" y="406" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6f3a">2017</text>
<text x="724" y="432" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">DESFire EV2</text>
<text x="724" y="455" text-anchor="middle" font-size="12.5" fill="#5c5c5c">AES + CMAC</text>
<text x="724" y="477" text-anchor="middle" font-size="12.5" fill="#5c5c5c">EAL5+</text>
<circle cx="724" cy="360" r="9" fill="#1f6f3a" stroke="#ffffff" stroke-width="2"/>

<!-- n5 above green -->
<line x1="908" y1="360" x2="908" y2="344" stroke="#1f6f3a" stroke-width="2"/>
<rect x="820" y="226" width="176" height="118" rx="12" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.7"/>
<text x="908" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f6f3a">2020</text>
<text x="908" y="280" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">DESFire EV3</text>
<text x="908" y="303" text-anchor="middle" font-size="12.5" fill="#5c5c5c">AES + SUN/SDM</text>
<text x="908" y="325" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">EAL5+ · current</text>
<circle cx="908" cy="360" r="9" fill="#1f6f3a" stroke="#ffffff" stroke-width="2"/>

<!-- n6 below red -->
<line x1="1088" y1="360" x2="1088" y2="376" stroke="#8b2d2d" stroke-width="2"/>
<rect x="1000" y="376" width="176" height="118" rx="12" fill="#fbeeee" stroke="#8b2d2d" stroke-width="1.7"/>
<text x="1088" y="406" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">2024</text>
<text x="1088" y="431" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Fudan FM11RF08</text>
<text x="1088" y="453" text-anchor="middle" font-size="12.5" fill="#5c5c5c">hardware backdoor</text>
<rect x="1024" y="463" width="128" height="22" rx="11" fill="#8b2d2d"/>
<text x="1088" y="478" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">CLONES BROKEN</text>
<circle cx="1088" cy="360" r="9" fill="#8b2d2d" stroke="#ffffff" stroke-width="2"/>

<text x="600" y="558" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Broken at both ends: the 2008 Crypto-1 break and the 2024 Fudan FM11RF08 backdoor.</text>
<text x="600" y="582" text-anchor="middle" font-size="14.5" fill="#5c5c5c">The secure middle — DESFire EV2 and EV3 at EAL5+ — is what to specify for new work.</text>
</svg>
