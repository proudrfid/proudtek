<text x="840" y="563" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="17" font-weight="700" fill="#291c0e">start counting every piece, automatically.</text>
<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Hotels, hospitals, uniform rental — tens of thousands of textiles a day, one read point at a time.</text>
