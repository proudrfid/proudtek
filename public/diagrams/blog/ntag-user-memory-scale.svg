<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NTAG user memory drawn to scale: 144 vs 504 vs 888 bytes</title>
<desc id="d">Horizontal bar chart with bars drawn to scale. NTAG213 has 144 bytes of user memory, roughly one short URL — the espresso of NFC. NTAG215 has 504 bytes, several records or a full vCard, and is the chip inside every amiibo. NTAG216 has 888 bytes, enough for configuration files and long text, where the tag becomes the hard drive. The full bar width equals 888 bytes; a footer notes NTAG216 holds about 6.2 times what NTAG213 does, which sounds huge until you remember a shortened link is about 40 bytes.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">USER MEMORY, DRAWN TO SCALE</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">The one spec where the triplets actually differ</text>
<text x="1120" y="136" text-anchor="end" font-size="12.5" fill="#5c5c5c">bar width is proportional to bytes · full width = 888 B</text>

<line x1="250" y1="152" x2="250" y2="520" stroke="#e6dfd2" stroke-width="2"/>
<text x="250" y="542" text-anchor="middle" font-size="12.5" fill="#5c5c5c">0 B</text>

<text x="230" y="200" text-anchor="end" font-family="Lora, Georgia, serif" font-size="24" font-weight="700" fill="#c39a5f">NTAG213</text>
<rect x="250" y="170" width="141" height="44" rx="10" fill="#c39a5f"/>
<text x="405" y="200" font-size="18" font-weight="700" fill="#6d5a3a">144 B</text>
<text x="250" y="242" font-size="13.5" fill="#4f4f4f">≈ one short URL. The espresso of NFC.</text>

<text x="230" y="330" text-anchor="end" font-family="Lora, Georgia, serif" font-size="24" font-weight="700" fill="#3d6b6b">NTAG215</text>
<rect x="250" y="300" width="494" height="44" rx="10" fill="#3d6b6b"/>
<text x="758" y="330" font-size="18" font-weight="700" fill="#2c5454">504 B</text>
<text x="250" y="372" font-size="13.5" fill="#4f4f4f">≈ several records or a full vCard. Also: every amiibo ever made.</text>

<text x="230" y="460" text-anchor="end" font-family="Lora, Georgia, serif" font-size="24" font-weight="700" fill="#4a5568">NTAG216</text>
<rect x="250" y="430" width="870" height="44" rx="10" fill="#4a5568"/>
<text x="1104" y="460" text-anchor="end" font-size="18" font-weight="700" fill="#ffffff">888 B</text>
<text x="250" y="502" font-size="13.5" fill="#4f4f4f">≈ config files and long text — the tag becomes the hard drive.</text>

<rect x="140" y="566" width="920" height="52" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="598" text-anchor="middle" font-size="14" font-weight="600" fill="#291c0e">NTAG216 holds ~6.2× what NTAG213 does — a lot, right up until you remember a shortened link is ~40 bytes.</text>
</svg>
