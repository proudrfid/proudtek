<text x="92" y="586" text-anchor="start" font-size="13" fill="#5c5c5c">Interactive · Film · Music · Austin</text>
<text x="512" y="566" text-anchor="middle" font-size="24" font-weight="800" fill="#2c5454">~280K</text>
<text x="512" y="589" text-anchor="middle" font-size="12" fill="#8a8272">attendees</text>
<line x1="612" y1="544" x2="612" y2="592" stroke="#ece5d6" stroke-width="1.5"/>
