<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">What upgrading hotel key cards from magstripe to RFID removes</title>
<desc id="d">A side-by-side comparison of magnetic-stripe versus RFID hotel key cards. The magnetic-stripe column keeps the top failure modes: it demagnetizes near phones and magnets, misreads through a worn card slot, and suffers partial writes on a rushed encode. The RFID column removes them: it is immune to demagnetization, is contactless with no slot to wear, and uses error-corrected chip encoding. Hotels that upgrade report 70 to 85 percent fewer front-desk re-encoding requests.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE DURABLE FIX · MAGSTRIPE TO RFID</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">What the upgrade quietly removes from your complaint log.</text>

<!-- left panel: magstripe -->
<rect x="88" y="118" width="468" height="396" rx="14" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.6"/>
<rect x="88" y="118" width="468" height="60" rx="14" fill="#4a5568"/>
<rect x="88" y="150" width="468" height="28" fill="#4a5568"/>
<text x="118" y="156" font-size="21" font-weight="800" fill="#ffffff">MAGNETIC STRIPE</text>
<text x="118" y="206" font-size="12.5" font-weight="800" letter-spacing="0.6" fill="#4a5568">KEEPS THE FAILURES</text>

<circle cx="130" cy="256" r="15" fill="#8b2d2d"/>
<text x="130" y="262" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">✕</text>
<text x="164" y="262" font-size="15.5" fill="#333333">Demagnetizes near phones &amp; magnets</text>

<circle cx="130" cy="320" r="15" fill="#8b2d2d"/>
<text x="130" y="326" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">✕</text>
<text x="164" y="326" font-size="15.5" fill="#333333">Misreads through a worn card slot</text>

<circle cx="130" cy="384" r="15" fill="#8b2d2d"/>
<text x="130" y="390" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">✕</text>
<text x="164" y="390" font-size="15.5" fill="#333333">Partial writes on a rushed encode</text>

<text x="130" y="466" font-size="14" fill="#5c5c5c">The stripe stores data as magnetism —</text>
<text x="130" y="488" font-size="14" fill="#5c5c5c">a nearby field is all it takes to erase it.</text>

<!-- right panel: rfid -->
<rect x="644" y="118" width="468" height="396" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="644" y="118" width="468" height="60" rx="14" fill="#3d6b6b"/>
<rect x="644" y="150" width="468" height="28" fill="#3d6b6b"/>
<text x="674" y="156" font-size="21" font-weight="800" fill="#ffffff">RFID</text>
<text x="674" y="206" font-size="12.5" font-weight="800" letter-spacing="0.6" fill="#2c5454">REMOVES THEM</text>

<circle cx="686" cy="256" r="15" fill="#1f6f3a"/>
<text x="686" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">✓</text>
<text x="720" y="262" font-size="15.5" fill="#333333">Immune to demagnetization</text>

<circle cx="686" cy="320" r="15" fill="#1f6f3a"/>
<text x="686" y="326" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">✓</text>
<text x="720" y="326" font-size="15.5" fill="#333333">Contactless — no slot to wear</text>

<circle cx="686" cy="384" r="15" fill="#1f6f3a"/>
<text x="686" y="390" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">✓</text>
<text x="720" y="390" font-size="15.5" fill="#333333">Error-corrected chip encoding</text>

<text x="720" y="466" font-size="14" fill="#5c5c5c">Data lives on a radio chip, so a</text>
<text x="720" y="488" font-size="14" fill="#5c5c5c">guest's phone can't wipe the credential.</text>

<!-- stat pill -->
<rect x="352" y="540" width="496" height="44" rx="22" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="568" text-anchor="middle" font-size="15.5" font-weight="800" fill="#8a6d34">70-85% fewer front-desk re-encoding requests</text>

<text x="600" y="616" text-anchor="middle" font-size="14.5" fill="#4f4f4f">RFID cannot be demagnetized — deleting the single biggest cause of "it worked this morning."</text>
</svg>
