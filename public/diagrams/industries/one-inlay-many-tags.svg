<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">One RFID inlay becomes many industry tags</title>
<desc id="d">A single wet-inlay roll, differentiated only by face stock and EPC memory layout, becomes an apparel hang tag, an aircraft part tag, a cosmetics NFC label or a library book tag.</desc>
