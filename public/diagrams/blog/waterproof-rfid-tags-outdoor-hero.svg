<text x="1027" y="286" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">EXTREME HEAT</text>
<text x="1027" y="322" text-anchor="middle" font-size="17" font-weight="800" fill="#8a6d34">SPECIALTY TAGS</text>
<text x="1027" y="356" text-anchor="middle" font-size="12" fill="#5c5c5c">paint ovens 250 °C ·</text>
<text x="1027" y="375" text-anchor="middle" font-size="12" fill="#5c5c5c">downhole 22,000 psi</text>

<!-- bottom seal strip -->
<rect x="64" y="440" width="1092" height="164" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="90" y="478" font-size="14" font-weight="800" letter-spacing="0.6" fill="#2c5454">THE IP RATING IS THE SPEC — THE ENCAPSULANT IS WHAT MAKES IT HOLD</text>
<rect x="90" y="498" width="336" height="86" rx="11" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="108" y="528" font-size="15" font-weight="800" fill="#291c0e">Silicone</text>
<text x="108" y="551" font-size="12.5" fill="#5c5c5c">−40 to +230 °C · flexible ·</text>
<text x="108" y="569" font-size="12.5" fill="#5c5c5c">acids, bases, solvents</text>
<rect x="442" y="498" width="336" height="86" rx="11" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="460" y="528" font-size="15" font-weight="800" fill="#291c0e">Epoxy</text>
<text x="460" y="551" font-size="12.5" fill="#5c5c5c">−40 to +150 °C · rigid ·</text>
<text x="460" y="569" font-size="12.5" fill="#5c5c5c">most industrial chemicals</text>
<rect x="794" y="498" width="336" height="86" rx="11" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.4"/>
<text x="812" y="528" font-size="15" font-weight="800" fill="#291c0e">Glass capsule</text>
<text x="812" y="551" font-size="12.5" fill="#5c5c5c">−40 to +250 °C · inert ·</text>
<text x="812" y="569" font-size="12.5" fill="#5c5c5c">fragile to impact</text>
</svg>
