<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">NTAG215 — 504 bytes, the exact Amiibo fit</title>
  <desc id="d">The Nintendo Amiibo data structure needs 540 bytes of total tag space, which exactly matches NTAG215 — NTAG213 is too small and NTAG216's extra memory changes the format. 504 bytes user memory across 126 pages of 4 bytes also carries roughly 492 URL characters after NDEF overhead.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">504 bytes — the Goldilocks tier</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Amiibo asks for exactly this much room — not less, not more</text>
  <g transform="translate(70,150)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="40" width="300" height="130" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="22" y="76" font-family="Georgia, serif" font-size="16" fill="#291c0e">NTAG213 — 144 B</text>
    <text x="22" y="104" font-size="13" fill="#8b2d2d">too small for the Amiibo</text>
    <text x="22" y="126" font-size="13" fill="#8b2d2d">data structure</text>
    <rect x="340" y="10" width="340" height="190" rx="12" fill="#eef2f0" stroke="#2c5454" stroke-width="3"/>
    <text x="364" y="48" font-family="Georgia, serif" font-size="17" fill="#2c5454">NTAG215 — 504 B user</text>
    <text x="364" y="78" font-size="13" fill="#2c5454">Amiibo structure = 540 B total tag</text>
    <text x="364" y="100" font-size="13" fill="#2c5454">space — an exact match</text>
    <text x="364" y="130" font-size="13" fill="#6d5a3a">126 pages x 4 bytes</text>
    <text x="364" y="156" font-size="13" fill="#6d5a3a">~492 URL chars after NDEF overhead</text>
    <text x="364" y="182" font-size="13" fill="#6d5a3a">game-card, figure + accessory builds</text>
    <rect x="720" y="40" width="300" height="130" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="742" y="76" font-family="Georgia, serif" font-size="16" fill="#291c0e">NTAG216 — 888 B</text>
    <text x="742" y="104" font-size="13" fill="#6d5a3a">more room than the format</text>
    <text x="742" y="126" font-size="13" fill="#6d5a3a">expects — not a drop-in</text>
  </g>
  <g transform="translate(70,420)">
    <rect x="0" y="0" width="1050" height="140" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="40" font-family="Georgia, serif" font-size="18" fill="#2c5454">Same tap manners as its siblings</text>
    <text x="24" y="72" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c5454">13.56 MHz · ISO/IEC 14443-3 Type A · NFC Forum Type 2 Tag — every modern phone reads it natively</text>
    <text x="24" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Ø18 mm face-up game-card embed · Ø22 mm small tap tag · Ø25 mm standard — white or transparent PET</text>
    <text x="24" y="126" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">MOQ 100 standard sizes · custom print from 500 · pre-encoded from 100</text>
  </g>
</svg>
