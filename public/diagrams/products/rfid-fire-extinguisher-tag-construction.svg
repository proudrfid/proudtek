<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Construction stack of an RFID fire-extinguisher inspection tag</title>
  <desc id="d">A cross-section stack showing how the fire-extinguisher tag is built, bottom to top: the steel extinguisher cylinder or hanger bracket, the mount layer (3M 468MP high-bond adhesive, a reinforced grommet and wire loop, or a valve-neck collar), a polyester substrate in 80 by 35 mm hang-tag or 70 by 25 mm cylinder-wrap size, an NFC HF inlay carrying NTAG213, NTAG215, NTAG216 or NTAG424 DNA at 13.56 MHz, a printed face with an ISO/IEC 18004 QR fallback, and a protective overlaminate. Below, four qualification chips: IP67 / IP68 to IEC 60529, minus 20 to plus 70 degrees C, UV to ISO 4892-2 and ASTM G154 for 1,000 h, and UL 94 V-0 flame resistance.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW THE FIRE-EXTINGUISHER TAG IS BUILT</text>
  <text x="600" y="84" text-anchor="middle" font-size="15" fill="#5c5c5c">A polyester tag, an NFC inlay, and an overlaminate rated for a parking-garage decade</text>

  <rect x="150" y="250" width="96" height="150" rx="16" fill="#4a5568" stroke="#3a4453" stroke-width="2"/>
  <rect x="186" y="214" width="24" height="42" fill="#5c6472"/>
  <rect x="168" y="198" width="70" height="20" rx="6" fill="#5c6472"/>
  <rect x="150" y="300" width="96" height="30" fill="#c39a5f"/>
  <text x="198" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">wrap tag</text>
  <text x="198" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">Cylinder-wrap or</text>
  <text x="198" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">hanger-bracket mount</text>

  <text x="710" y="128" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.4" fill="#3d6b6b">THE TAG STACK (bottom to top)</text>
  <rect x="430" y="350" width="560" height="38" rx="6" fill="#dfe4ea" stroke="#9aa4b2" stroke-width="2"/>
  <text x="450" y="374" font-size="13.5" fill="#291c0e">Steel extinguisher cylinder / hanger bracket — mount surface</text>
  <rect x="430" y="306" width="560" height="38" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="450" y="330" font-size="13.5" fill="#291c0e">Mount — 3M 468MP adhesive / grommet wire loop / valve collar</text>
  <rect x="430" y="262" width="560" height="38" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="450" y="286" font-size="13.5" fill="#2c5454">Polyester substrate — 80 × 35 mm hang tag / 70 × 25 mm wrap</text>
  <rect x="430" y="218" width="560" height="38" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="2"/>
  <text x="450" y="242" font-size="13.5" fill="#291c0e">NFC HF inlay — NTAG213 / 215 / 216 / 424 DNA @ 13.56 MHz</text>
  <rect x="430" y="174" width="560" height="38" rx="6" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="450" y="198" font-size="13.5" fill="#291c0e">Printed face + QR fallback — ISO/IEC 18004:2015</text>
  <rect x="430" y="138" width="560" height="30" rx="6" fill="#eef2f5" stroke="#c3ccd6" stroke-width="2"/>
  <text x="450" y="158" font-size="12.5" fill="#5c5c5c">Protective overlaminate — IP67 / IP68, UL 94 V-0</text>

  <text x="600" y="470" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">QUALIFIED FOR THE OUTDOOR MOUNT</text>
  <rect x="120" y="488" width="230" height="62" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="140" y="515" font-size="15" font-weight="700" fill="#291c0e">IP67 / IP68</text>
  <text x="140" y="535" font-size="12.5" fill="#5c5c5c">to IEC 60529</text>
  <rect x="366" y="488" width="220" height="62" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="386" y="515" font-size="15" font-weight="700" fill="#291c0e">-20 to +70 °C</text>
  <text x="386" y="535" font-size="12.5" fill="#5c5c5c">NFPA 10 §5.5 range</text>
  <rect x="602" y="488" width="246" height="62" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="622" y="515" font-size="15" font-weight="700" fill="#291c0e">UV 1,000 h</text>
  <text x="622" y="535" font-size="12.5" fill="#5c5c5c">ISO 4892-2 + ASTM G154</text>
  <rect x="864" y="488" width="216" height="62" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="884" y="515" font-size="15" font-weight="700" fill="#291c0e">UL 94 V-0</text>
  <text x="884" y="535" font-size="12.5" fill="#5c5c5c">flame resistance</text>

  <text x="600" y="598" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Five mount SKUs — hang tag, cylinder wrap, valve-neck collar, inside-cabinet disc, hose-reel square — one GS1 GIAI-96 record.</text>
</svg>
