<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="crTitle crDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="crTitle">Proud Tek corrections log — how a factual error becomes a public record</title>
  <desc id="crDesc">The life of a correction on proudtek.com: a reader flags a claim with the article URL, we review it against a primary source, we either correct it or explain in writing why not, a banner goes on the article for 90 days, and the entry is logged here permanently. Three standing commitments: the original wrong wording is kept visible, verified fixes are resolved within five business days, and no correction entry is ever deleted.</desc>

  <rect width="1200" height="675" fill="#f4efe4"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="66" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="2.5" fill="#6d5a3a">LOGGED · VISIBLE · PERMANENT</text>
  <text x="600" y="100" text-anchor="middle" font-size="19" fill="#4f4f4f">Every factual fix is published here — the original wording kept, never edited away.</text>

  <!-- Lifecycle pipeline -->
  <line x1="150" y1="210" x2="1050" y2="210" stroke="#e4c98f" stroke-width="6"/>

  <!-- 1 Flagged -->
  <circle cx="150" cy="210" r="42" fill="#291c0e"/>
  <text x="150" y="223" text-anchor="middle" font-size="30" font-weight="700" fill="#c39a5f">1</text>
  <text x="150" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">Flagged</text>
  <text x="150" y="312" text-anchor="middle" font-size="15" fill="#6b7280">reader sends URL + claim</text>
  <!-- 2 Reviewed -->
  <circle cx="375" cy="210" r="42" fill="#291c0e"/>
  <text x="375" y="223" text-anchor="middle" font-size="30" font-weight="700" fill="#c39a5f">2</text>
  <text x="375" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">Reviewed</text>
  <text x="375" y="312" text-anchor="middle" font-size="15" fill="#6b7280">against a primary source</text>
  <!-- 3 Resolved -->
  <circle cx="600" cy="210" r="42" fill="#291c0e"/>
  <text x="600" y="223" text-anchor="middle" font-size="30" font-weight="700" fill="#c39a5f">3</text>
  <text x="600" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">Resolved</text>
  <text x="600" y="312" text-anchor="middle" font-size="15" fill="#6b7280">corrected, or explained</text>
  <!-- 4 Banner -->
  <circle cx="825" cy="210" r="42" fill="#291c0e"/>
  <text x="825" y="223" text-anchor="middle" font-size="30" font-weight="700" fill="#c39a5f">4</text>
  <text x="825" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">Banner</text>
  <text x="825" y="312" text-anchor="middle" font-size="15" fill="#6b7280">90 days on the article</text>
  <!-- 5 Logged (highlight) -->
  <circle cx="1050" cy="210" r="48" fill="#1fcefb"/>
  <circle cx="1050" cy="210" r="48" fill="none" stroke="#0b90b3" stroke-width="2"/>
  <path d="M1032 210 l12 12 l22 -24" fill="none" stroke="#08313d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1050" y="294" text-anchor="middle" font-size="20" font-weight="700" fill="#291c0e">Logged here</text>
  <text x="1050" y="318" text-anchor="middle" font-size="15" fill="#6b7280">permanently</text>

  <text x="600" y="372" text-anchor="middle" font-size="16" fill="#6d5a3a">Typos and clarity edits that change no factual claim are made silently — only factual fixes reach this log.</text>

  <line x1="72" y1="404" x2="1128" y2="404" stroke="#ece5d8" stroke-width="2"/>

  <!-- Standing commitments -->
  <g>
    <rect x="72" y="430" width="336" height="118" rx="16" fill="#fbf7ef" stroke="#e4c98f" stroke-width="2"/>
    <text x="240" y="480" text-anchor="middle" font-size="24" font-weight="800" fill="#291c0e">Original kept</text>
    <text x="240" y="510" text-anchor="middle" font-size="16" fill="#6d5a3a">the wrong wording stays visible</text>
  </g>
  <g>
    <rect x="432" y="430" width="336" height="118" rx="16" fill="#fbf7ef" stroke="#e4c98f" stroke-width="2"/>
    <text x="600" y="480" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">≤ 5 business days</text>
    <text x="600" y="510" text-anchor="middle" font-size="16" fill="#6d5a3a">to a verified fix or a written reply</text>
  </g>
  <g>
    <rect x="792" y="430" width="336" height="118" rx="16" fill="#fbf7ef" stroke="#e4c98f" stroke-width="2"/>
    <text x="960" y="480" text-anchor="middle" font-size="24" font-weight="800" fill="#291c0e">Never deleted</text>
    <text x="960" y="510" text-anchor="middle" font-size="16" fill="#6d5a3a">a correction entry is permanent</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-size="18" fill="#6d5a3a">Anyone can request a correction at editors@proudtek.com — cite a primary source and we respond in writing.</text>
</svg>
