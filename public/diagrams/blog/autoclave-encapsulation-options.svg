<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="acF2Title acF2Desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="acF2Title">Which RFID encapsulations survive autoclaving</title>
  <desc id="acF2Desc">Four autoclave-rated build patterns, rising in durability and cost. Ceramic-package HF chips such as ICODE SLIX2 or MIFARE Ultralight C in 3 to 10 millimetre discs are rated 1000 to 3000 cycles. Glass-encapsulated transponders in a 2 by 12 millimetre capsule survive but have limited memory and read range. PEEK polymer capsules are rated to 250°C continuous and resist impact. Laser-welded titanium capsules are hermetic, rated 5000 plus cycles, and used on premium instruments worth over 1000 dollars. Avoid PVC-laminated inlays, paper-substrate tags, peel-and-stick labels, and generic rugged tags with no explicit autoclave validation.</desc>

  <defs>
    <radialGradient id="f2Bg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f1ece0"/>
    </radialGradient>
    <linearGradient id="f2Axis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a9c8b2"/>
      <stop offset="100%" stop-color="#1f6f3a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#f2Bg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="64" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="1" fill="#291c0e">What actually survives the steam</text>
  <text x="600" y="92" text-anchor="middle" font-size="15.5" fill="#2d6a4f">Four purpose-built encapsulations, rising in toughness and price — plus one list of heartbreak</text>

  <!-- 4 survivor cards : x = 58, 333, 608, 883 ; width 259 -->
  <g>
    <rect x="58" y="120" width="259" height="322" rx="14" fill="#f0f6f1" stroke="#a9c8b2" stroke-width="2"/>
    <rect x="58" y="120" width="259" height="8" rx="4" fill="#2d6a4f"/>
    <text x="187" y="158" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#2d6a4f">CERAMIC HF DISC</text>
    <circle cx="187" cy="212" r="34" fill="#ffffff" stroke="#1f6f3a" stroke-width="3"/>
    <circle cx="187" cy="212" r="21" fill="none" stroke="#2d6a4f" stroke-width="2.5"/>
    <circle cx="187" cy="212" r="8" fill="#2d6a4f"/>
    <text x="187" y="286" text-anchor="middle" font-size="12.5" fill="#3c5c46">ICODE SLIX2 ·</text>
    <text x="187" y="304" text-anchor="middle" font-size="12.5" fill="#3c5c46">MIFARE Ultralight C</text>
    <text x="187" y="322" text-anchor="middle" font-size="12.5" fill="#3c5c46">3–10mm disc</text>
    <text x="187" y="372" text-anchor="middle" font-size="27" font-weight="800" fill="#1f6f3a">1000–3000</text>
    <text x="187" y="394" text-anchor="middle" font-size="12.5" fill="#5c5c5c">cycles · the workhorse</text>
    <text x="187" y="424" text-anchor="middle" font-size="12.5" fill="#5c5c5c">sealed, steam-tight</text>
  </g>

  <g>
    <rect x="333" y="120" width="259" height="322" rx="14" fill="#f0f6f1" stroke="#a9c8b2" stroke-width="2"/>
    <rect x="333" y="120" width="259" height="8" rx="4" fill="#2d6a4f"/>
    <text x="462" y="158" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#2d6a4f">GLASS CAPSULE</text>
    <rect x="404" y="196" width="116" height="34" rx="17" fill="#ffffff" stroke="#1f6f3a" stroke-width="3"/>
    <circle cx="428" cy="213" r="6" fill="#2d6a4f"/>
    <rect x="446" y="207" width="52" height="12" rx="3" fill="#cfe0d4"/>
    <text x="462" y="286" text-anchor="middle" font-size="12.5" fill="#3c5c46">2×12mm glass</text>
    <text x="462" y="304" text-anchor="middle" font-size="12.5" fill="#3c5c46">(pet-microchip style)</text>
    <text x="462" y="372" text-anchor="middle" font-size="27" font-weight="800" fill="#1f6f3a">survives</text>
    <text x="462" y="394" text-anchor="middle" font-size="12.5" fill="#5c5c5c">limited memory &amp; range</text>
    <text x="462" y="424" text-anchor="middle" font-size="12.5" fill="#5c5c5c">best for low-data use</text>
  </g>

  <g>
    <rect x="608" y="120" width="259" height="322" rx="14" fill="#f0f6f1" stroke="#a9c8b2" stroke-width="2"/>
    <rect x="608" y="120" width="259" height="8" rx="4" fill="#2d6a4f"/>
    <text x="737" y="158" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#2d6a4f">PEEK CAPSULE</text>
    <path d="M690 196 q47 -16 94 0 q10 20 0 40 q-47 16 -94 0 q-10 -20 0 -40 z" fill="#ffffff" stroke="#1f6f3a" stroke-width="3"/>
    <text x="737" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#2d6a4f">PEEK</text>
    <text x="737" y="286" text-anchor="middle" font-size="12.5" fill="#3c5c46">high-perf polymer</text>
    <text x="737" y="304" text-anchor="middle" font-size="12.5" fill="#3c5c46">impact-resistant</text>
    <text x="737" y="372" text-anchor="middle" font-size="27" font-weight="800" fill="#1f6f3a">250°C</text>
    <text x="737" y="394" text-anchor="middle" font-size="12.5" fill="#5c5c5c">continuous rating</text>
    <text x="737" y="424" text-anchor="middle" font-size="12.5" fill="#5c5c5c">tough for handhelds</text>
  </g>

  <g>
    <rect x="883" y="120" width="259" height="322" rx="14" fill="#f4f0e6" stroke="#d9c188" stroke-width="2.5"/>
    <rect x="883" y="120" width="259" height="8" rx="4" fill="#c39a5f"/>
    <text x="1012" y="158" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#8a6d33">TITANIUM · LASER-WELDED</text>
    <path d="M1012 178 l34 20 v40 l-34 20 l-34 -20 v-40 z" fill="#ffffff" stroke="#8a6d33" stroke-width="3"/>
    <path d="M1012 200 l14 8 v16 l-14 8 l-14 -8 v-16 z" fill="#e9dcbd" stroke="#c39a5f" stroke-width="2"/>
    <text x="1012" y="286" text-anchor="middle" font-size="12.5" fill="#6d5a3a">hermetic metal seal</text>
    <text x="1012" y="304" text-anchor="middle" font-size="12.5" fill="#6d5a3a">drop &amp; impact proof</text>
    <text x="1012" y="372" text-anchor="middle" font-size="27" font-weight="800" fill="#8a6d33">5000+</text>
    <text x="1012" y="394" text-anchor="middle" font-size="12.5" fill="#5c5c5c">cycles · the premium pick</text>
    <text x="1012" y="424" text-anchor="middle" font-size="12.5" fill="#5c5c5c">for $1000+ instruments</text>
  </g>

  <!-- durability & cost axis -->
  <rect x="58" y="460" width="1084" height="6" rx="3" fill="url(#f2Axis)"/>
  <text x="60" y="484" font-size="12.5" fill="#5c5c5c">lower cost · fewer cycles</text>
  <text x="1140" y="484" text-anchor="end" font-size="12.5" fill="#1f6f3a">higher cost · more cycles →</text>

  <!-- AVOID bar -->
  <rect x="58" y="502" width="1084" height="126" rx="14" fill="#f7ecea" stroke="#dcb6b0" stroke-width="2"/>
  <circle cx="104" cy="565" r="26" fill="#ffffff" stroke="#8b2d2d" stroke-width="3"/>
  <line x1="88" y1="549" x2="120" y2="581" stroke="#8b2d2d" stroke-width="3.5"/>
  <line x1="88" y1="581" x2="120" y2="549" stroke="#8b2d2d" stroke-width="3.5"/>
  <text x="152" y="546" font-size="16.5" font-weight="800" fill="#8b2d2d">Avoid — no matter how &quot;rugged&quot; the datasheet sounds</text>
  <text x="152" y="576" font-size="14.5" fill="#734040">PVC-laminated inlays · paper-substrate tags · peel-and-stick labels</text>
  <text x="152" y="602" font-size="14.5" fill="#734040">· generic &quot;rugged&quot; tags with no explicit autoclave validation</text>
</svg>
