<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="siTagTitle siTagDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="siTagTitle">The gauntlet a surgical instrument tag must survive, and the build that meets it</title>
  <desc id="siTagDesc">A surgical instrument tag faces four stressors: 134°C autoclave steam, washer-disinfector chemicals plus ultrasonic, bone-cutting force, and a decade-plus lifespan. The build that survives is a passive HF chip at 13.56 MHz with 256-byte or larger memory, in a ceramic, PEEK, or laser-welded titanium capsule 1 to 3 mm across, embedded in the handle or riveted, rated for 1000 to 5000-plus cycles at roughly 3 to 25 dollars per instrument.</desc>

  <defs>
    <radialGradient id="siTagBg" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#f1ece0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#siTagBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="62" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="0.3" fill="#291c0e">The hardest job in the tag catalog</text>
  <text x="600" y="91" text-anchor="middle" font-size="15" fill="#3d6b6b">A warehouse tag lasts years without complaint. A surgical tag has to survive all of this — several times a week.</text>

  <!-- stressor cards -->
  <!-- 1 -->
  <rect x="70" y="132" width="250" height="152" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <rect x="70" y="132" width="250" height="8" rx="4" fill="#8b2d2d"/>
  <path d="M180 168 q-5 -8 0 -16 M195 168 q-5 -8 0 -16 M210 168 q-5 -8 0 -16" fill="none" stroke="#8b2d2d" stroke-width="2.2"/>
  <rect x="171" y="172" width="48" height="30" rx="6" fill="none" stroke="#8b2d2d" stroke-width="2.4"/>
  <circle cx="195" cy="187" r="7" fill="none" stroke="#8b2d2d" stroke-width="2.2"/>
  <text x="195" y="238" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">134°C steam</text>
  <text x="195" y="264" text-anchor="middle" font-size="12.5" fill="#4f4f4f">repeated autoclave cycles</text>

  <!-- 2 -->
  <rect x="340" y="132" width="250" height="152" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <rect x="340" y="132" width="250" height="8" rx="4" fill="#8b2d2d"/>
  <path d="M455 166 h20 l-4 26 a6 6 0 0 1 -6 5 h0 a6 6 0 0 1 -6 -5 z" fill="none" stroke="#8b2d2d" stroke-width="2.2"/>
  <path d="M451 178 h28" stroke="#8b2d2d" stroke-width="2.2"/>
  <path d="M462 205 q4 4 8 0" fill="none" stroke="#8b2d2d" stroke-width="2"/>
  <text x="465" y="238" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Chemical bath</text>
  <text x="465" y="264" text-anchor="middle" font-size="12.5" fill="#4f4f4f">washer-disinfector + ultrasonic</text>

  <!-- 3 -->
  <rect x="610" y="132" width="250" height="152" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <rect x="610" y="132" width="250" height="8" rx="4" fill="#8b2d2d"/>
  <path d="M738 164 l-16 24 h14 l-6 22 20 -28 h-14 z" fill="#8b2d2d"/>
  <text x="735" y="238" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Cutting force</text>
  <text x="735" y="264" text-anchor="middle" font-size="12.5" fill="#4f4f4f">bone-cutting shock &amp; torque</text>

  <!-- 4 -->
  <rect x="880" y="132" width="250" height="152" rx="14" fill="#fdfbf7" stroke="#e6dcc8" stroke-width="2"/>
  <rect x="880" y="132" width="250" height="8" rx="4" fill="#8b2d2d"/>
  <circle cx="1005" cy="186" r="22" fill="none" stroke="#8b2d2d" stroke-width="2.4"/>
  <path d="M1005 172 v15 l10 7" fill="none" stroke="#8b2d2d" stroke-width="2.4" stroke-linecap="round"/>
  <text x="1005" y="238" text-anchor="middle" font-size="19" font-weight="800" fill="#291c0e">Decade-plus life</text>
  <text x="1005" y="264" text-anchor="middle" font-size="12.5" fill="#4f4f4f">over and over, every week</text>

  <!-- connector -->
  <text x="600" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#4f4f4f">All four, repeatedly — so the tag has to be engineered for it from the first. Here is the build that is:</text>

  <!-- build panel -->
  <rect x="70" y="344" width="1060" height="192" rx="16" fill="#e9f1f0" stroke="#bcd3d3" stroke-width="2"/>
  <text x="100" y="384" font-size="18" font-weight="800" fill="#2c5454">The build that survives</text>

  <rect x="100" y="402" width="176" height="42" rx="21" fill="#ffffff" stroke="#cfe0df" stroke-width="1.5"/>
  <text x="188" y="429" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">HF · 13.56 MHz</text>
  <rect x="288" y="402" width="188" height="42" rx="21" fill="#ffffff" stroke="#cfe0df" stroke-width="1.5"/>
  <text x="382" y="429" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">256-byte+ memory</text>
  <rect x="488" y="402" width="252" height="42" rx="21" fill="#ffffff" stroke="#cfe0df" stroke-width="1.5"/>
  <text x="614" y="429" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">ceramic / PEEK / titanium</text>
  <rect x="752" y="402" width="182" height="42" rx="21" fill="#ffffff" stroke="#cfe0df" stroke-width="1.5"/>
  <text x="843" y="429" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">1–3 mm, handle-embed</text>
  <rect x="946" y="402" width="184" height="42" rx="21" fill="#ffffff" stroke="#cfe0df" stroke-width="1.5"/>
  <text x="1038" y="429" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5454">1000–5000+ cycles</text>

  <text x="600" y="482" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">≈ $3–25 per tagged instrument, amortised over a 5–10 year instrument life</text>
  <text x="600" y="510" text-anchor="middle" font-size="13" fill="#5a7573">HF is chosen for clean reads through metal trays and standardised scanning — ISO 14443 or 15693, validated per ISO 17665-1</text>

  <!-- footer takeaway -->
  <rect x="70" y="556" width="1060" height="80" rx="14" fill="#2a1d0f"/>
  <text x="100" y="592" font-size="15.5" font-weight="700" fill="#f0c98a">The reframe:</text>
  <text x="224" y="592" font-size="15" fill="#f3ecdd">no tag &quot;toughs out&quot; an autoclave. The ones that come through were built for it from the start —</text>
  <text x="224" y="616" font-size="15" fill="#f3ecdd">the real decision is which capsule, and whether you embed it in the handle or rivet it on.</text>
</svg>
