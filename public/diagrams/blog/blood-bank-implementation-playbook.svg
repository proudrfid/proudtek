<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five-step playbook for adding RFID to a blood bank alongside ISBT 128</title>
<desc id="d">Five sequential steps. Step one, keep the barcode: ISBT 128 stays the primary identifier — supplement it, never replace it, because it is regulator-mandated. Step two, add RFID at high-touch points only: phlebotomy, receiving, crossmatch and dispense, each with matched readers. Step three, validate: full IQ, OQ and PQ per 21 CFR Part 11, budgeting 8 to 16 weeks for a mid-sized bank. Step four, integrate the LIS: read events flow to Sunquest, Soft or Cerner Millennium, and the LIS owns the regulatory record. Step five, train and audit: a side-by-side rollout followed by a quarterly internal audit cycle. Caption: the LIS owns the record; RFID is the operational accelerator alongside it.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE STEPS · FROM AABB-ACCREDITED DEPLOYMENTS</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Adding RFID without unseating the barcode</text>

<line x1="180" y1="182" x2="1020" y2="182" stroke="#e4c98f" stroke-width="2.5"/>

<g text-anchor="middle">
<circle cx="180" cy="182" r="26" fill="#c39a5f"/><text x="180" y="190" font-size="20" font-weight="800" fill="#ffffff">1</text>
<rect x="80" y="230" width="200" height="200" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="180" y="262" font-size="15.5" font-weight="700" fill="#291c0e">Keep the barcode</text>
<text x="180" y="292" font-size="12.5" fill="#4f4f4f">ISBT 128 stays the</text>
<text x="180" y="312" font-size="12.5" fill="#4f4f4f">primary identifier —</text>
<text x="180" y="332" font-size="12.5" fill="#4f4f4f">supplement it, never</text>
<text x="180" y="352" font-size="12.5" fill="#4f4f4f">replace it.</text>
<text x="180" y="406" font-size="12" font-weight="700" fill="#6d5a3a">regulator-mandated</text>
</g>
<g text-anchor="middle">
<circle cx="390" cy="182" r="26" fill="#c39a5f"/><text x="390" y="190" font-size="20" font-weight="800" fill="#ffffff">2</text>
<rect x="290" y="230" width="200" height="200" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="390" y="262" font-size="15.5" font-weight="700" fill="#291c0e">Add RFID</text>
<text x="390" y="292" font-size="12.5" fill="#4f4f4f">Phlebotomy, receiving,</text>
<text x="390" y="312" font-size="12.5" fill="#4f4f4f">crossmatch, dispense —</text>
<text x="390" y="332" font-size="12.5" fill="#4f4f4f">matched readers at</text>
<text x="390" y="352" font-size="12.5" fill="#4f4f4f">each touch point.</text>
<text x="390" y="406" font-size="12" font-weight="700" fill="#6d5a3a">high-touch points only</text>
</g>
<g text-anchor="middle">
<circle cx="600" cy="182" r="26" fill="#c39a5f"/><text x="600" y="190" font-size="20" font-weight="800" fill="#ffffff">3</text>
<rect x="500" y="230" width="200" height="200" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="262" font-size="15.5" font-weight="700" fill="#291c0e">Validate</text>
<text x="600" y="292" font-size="12.5" fill="#4f4f4f">Full IQ / OQ / PQ per</text>
<text x="600" y="312" font-size="12.5" fill="#4f4f4f">21 CFR Part 11.</text>
<text x="600" y="332" font-size="12.5" fill="#4f4f4f">Budget 8-16 weeks for</text>
<text x="600" y="352" font-size="12.5" fill="#4f4f4f">a mid-sized bank.</text>
<text x="600" y="406" font-size="12" font-weight="700" fill="#6d5a3a">tedious, not skippable</text>
</g>
<g text-anchor="middle">
<circle cx="810" cy="182" r="26" fill="#c39a5f"/><text x="810" y="190" font-size="20" font-weight="800" fill="#ffffff">4</text>
<rect x="710" y="230" width="200" height="200" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="810" y="262" font-size="15.5" font-weight="700" fill="#291c0e">Integrate the LIS</text>
<text x="810" y="292" font-size="12.5" fill="#4f4f4f">Events flow to Sunquest,</text>
<text x="810" y="312" font-size="12.5" fill="#4f4f4f">Soft or Cerner</text>
<text x="810" y="332" font-size="12.5" fill="#4f4f4f">Millennium — the LIS</text>
<text x="810" y="352" font-size="12.5" fill="#4f4f4f">owns the record.</text>
<text x="810" y="406" font-size="12" font-weight="700" fill="#6d5a3a">RFID accelerates it</text>
</g>
<g text-anchor="middle">
<circle cx="1020" cy="182" r="26" fill="#2d6a4f"/><text x="1020" y="190" font-size="20" font-weight="800" fill="#ffffff">5</text>
<rect x="920" y="230" width="200" height="200" rx="12" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="1020" y="262" font-size="15.5" font-weight="700" fill="#1b4332">Train &amp; audit</text>
<text x="1020" y="292" font-size="12.5" fill="#4f4f4f">Side-by-side rollout,</text>
<text x="1020" y="312" font-size="12.5" fill="#4f4f4f">then a quarterly</text>
<text x="1020" y="332" font-size="12.5" fill="#4f4f4f">internal audit cycle</text>
<text x="1020" y="352" font-size="12.5" fill="#4f4f4f">to verify performance.</text>
<text x="1020" y="406" font-size="12" font-weight="700" fill="#1b4332">quarterly cycle</text>
</g>

<rect x="180" y="474" width="840" height="104" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="516" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="21" font-weight="700" fill="#291c0e">The LIS owns the regulatory record.</text>
<text x="600" y="548" text-anchor="middle" font-size="14" fill="#4f4f4f">RFID is the operational accelerator riding alongside it — never a replacement for it.</text>
</svg>
