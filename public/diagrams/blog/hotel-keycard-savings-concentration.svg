<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Where magstripe-to-RFID savings actually concentrate</title>
<desc id="d">Ranked list of where the money moves when a hotel switches from magstripe to RFID key cards. First, front-desk re-encode labor: at 200 rooms, 70 percent occupancy and 50,000 stays a year, a 20 percent re-encode rate at 2.5 minutes and $25 an hour costs $10,400 a year, and RFID's 1-2 percent rate recovers over 90 percent of it. Second, lock maintenance: service tickets fall 30-40 percent once slot readers are gone, recovering $3-5K a year at $80 a visit. Third, card consumable — smaller than you'd hope: per-card price doubles but volume drops 40-60 percent because RFID cards last 30-plus stays versus magstripe's 6-8, so net cost lands within 10-20 percent of baseline. Fourth, guest satisfaction: room-access NPS sub-scores improve 8-15 percent, correlating with 1-3 percent better repeat booking — real, but excluded from conservative ROI models.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHERE THE SAVINGS ACTUALLY LAND</text>
<text x="600" y="92" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="27" font-weight="700" fill="#291c0e">Mostly not in the line everyone checks first</text>

<rect x="90" y="124" width="1020" height="104" rx="12" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<circle cx="134" cy="176" r="18" fill="#2d6a4f"/>
<text x="134" y="182" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="170" y="164" font-size="15.5" font-weight="700" fill="#291c0e">Front-desk re-encode labor — the biggest single saving</text>
<text x="170" y="188" font-size="12.5" fill="#4f4f4f">200 rooms · 70% occupancy · 50,000 stays/yr</text>
<text x="170" y="208" font-size="12.5" fill="#4f4f4f">20% re-encode rate × 2.5 min × $25/hr</text>
<text x="1070" y="172" text-anchor="end" font-size="20" font-weight="800" fill="#1b4332">$10,400/yr</text>
<text x="1070" y="198" text-anchor="end" font-size="12.5" fill="#1f6f3a">RFID's 1-2% rate recovers 90%+</text>

<rect x="90" y="240" width="1020" height="104" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<circle cx="134" cy="292" r="18" fill="#3d6b6b"/>
<text x="134" y="298" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="170" y="280" font-size="15.5" font-weight="700" fill="#291c0e">Lock maintenance</text>
<text x="170" y="304" font-size="12.5" fill="#4f4f4f">service tickets down 30-40% once slot readers are gone · $80/visit</text>
<text x="1070" y="288" text-anchor="end" font-size="20" font-weight="800" fill="#2c5454">$3-5K/yr</text>
<text x="1070" y="314" text-anchor="end" font-size="12.5" fill="#4f4f4f">recovered</text>

<rect x="90" y="356" width="1020" height="104" rx="12" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<circle cx="134" cy="408" r="18" fill="#c39a5f"/>
<text x="134" y="414" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="170" y="396" font-size="15.5" font-weight="700" fill="#291c0e">Card consumable — smaller than you'd hope</text>
<text x="170" y="420" font-size="12.5" fill="#4f4f4f">per-card price doubles, volume drops 40-60%</text>
<text x="170" y="440" font-size="12.5" fill="#4f4f4f">RFID lasts 30+ stays vs magstripe's 6-8</text>
<text x="1070" y="404" text-anchor="end" font-size="20" font-weight="800" fill="#6d5a3a">within 10-20%</text>
<text x="1070" y="430" text-anchor="end" font-size="12.5" fill="#4f4f4f">of the magstripe baseline — sometimes lower</text>

<rect x="90" y="472" width="1020" height="104" rx="12" fill="#fdfbf7" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="7 5"/>
<circle cx="134" cy="524" r="18" fill="#4a5568"/>
<text x="134" y="530" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="170" y="512" font-size="15.5" font-weight="700" fill="#291c0e">Guest satisfaction → revenue</text>
<text x="170" y="536" font-size="12.5" fill="#4f4f4f">'room access' NPS sub-scores +8-15% → repeat-booking +1-3%</text>
<text x="170" y="556" font-size="12.5" fill="#4f4f4f">real, but conservative ROI models exclude it</text>
<text x="1070" y="520" text-anchor="end" font-size="20" font-weight="800" fill="#4a5568">+8-15%</text>
<text x="1070" y="546" text-anchor="end" font-size="12.5" fill="#4f4f4f">the upside the model leaves out</text>

<rect x="90" y="592" width="1020" height="44" rx="10" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="600" y="620" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="16" font-weight="700" fill="#291c0e">Price the stack, not the plastic — the per-card line is the decoy.</text>
</svg>
