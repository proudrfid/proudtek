<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID hardware cost components and their price ranges</title>
<desc id="d">Five RFID hardware line items with price ranges: RFID tags at 0.03 to over 5.00 dollars per tag depending on type; handheld readers at 1,500 to 3,500 dollars per unit; fixed readers at 800 to 2,000 dollars per unit; antennas and cables at 100 to 300 dollars per antenna; and RFID label printers or encoders at 3,000 to 10,000 dollars per unit. Only the tag cost scales with every item tagged.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID HARDWARE COST LADDER</text>
<text x="600" y="83" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Five line items — only the first one scales with every tagged item.</text>

<rect x="64" y="106" width="1072" height="96" rx="11" fill="#eef1f5" stroke="#c3ccd7" stroke-width="1.4"/>
<rect x="64" y="106" width="9" height="96" rx="4" fill="#4a5568"/>
<text x="102" y="142" font-size="16.5" font-weight="800" fill="#291c0e">RFID tags</text>
<text x="102" y="166" font-size="13" fill="#5c6470">the primary recurring cost — scales linearly with deployment</text>
<text x="102" y="188" font-size="12.5" fill="#7a828e">UHF $0.03-0.15 · NFC $0.05-0.40 · PVC $0.30-2.00 · industrial $0.50-5.00+</text>
<rect x="852" y="130" width="252" height="48" rx="24" fill="#e4e8ee" stroke="#b3bcc9" stroke-width="1.3"/>
<text x="978" y="160" text-anchor="middle" font-size="17" font-weight="800" fill="#3a4353">$0.03-5.00+ /tag</text>

<rect x="64" y="214" width="1072" height="70" rx="11" fill="#f7f5f0" stroke="#e0dccf" stroke-width="1.4"/>
<rect x="64" y="214" width="9" height="70" rx="4" fill="#3d6b6b"/>
<text x="102" y="245" font-size="16.5" font-weight="800" fill="#291c0e">Handheld readers</text>
<text x="102" y="268" font-size="12.5" fill="#5c6470">1 reader per 2-3 users · Bluetooth or Wi-Fi</text>
<rect x="852" y="228" width="252" height="42" rx="21" fill="#eef5f5" stroke="#a9cccc" stroke-width="1.3"/>
<text x="978" y="255" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">$1,500-3,500 /unit</text>

<rect x="64" y="296" width="1072" height="70" rx="11" fill="#f7f5f0" stroke="#e0dccf" stroke-width="1.4"/>
<rect x="64" y="296" width="9" height="70" rx="4" fill="#3d6b6b"/>
<text x="102" y="327" font-size="16.5" font-weight="800" fill="#291c0e">Fixed readers</text>
<text x="102" y="350" font-size="12.5" fill="#5c6470">portal / dock-door installs · 2-4 antennas per portal</text>
<rect x="852" y="310" width="252" height="42" rx="21" fill="#eef5f5" stroke="#a9cccc" stroke-width="1.3"/>
<text x="978" y="337" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">$800-2,000 /unit</text>

<rect x="64" y="378" width="1072" height="70" rx="11" fill="#f7f5f0" stroke="#e0dccf" stroke-width="1.4"/>
<rect x="64" y="378" width="9" height="70" rx="4" fill="#c39a5f"/>
<text x="102" y="409" font-size="16.5" font-weight="800" fill="#291c0e">Antennas + cables</text>
<text x="102" y="432" font-size="12.5" fill="#5c6470">RF cables, mounts, PoE — the line most often forgotten</text>
<rect x="852" y="392" width="252" height="42" rx="21" fill="#f7edd6" stroke="#e0c084" stroke-width="1.3"/>
<text x="978" y="419" text-anchor="middle" font-size="16" font-weight="800" fill="#8a6d34">$100-300 /antenna</text>

<rect x="64" y="460" width="1072" height="70" rx="11" fill="#f7f5f0" stroke="#e0dccf" stroke-width="1.4"/>
<rect x="64" y="460" width="9" height="70" rx="4" fill="#c39a5f"/>
<text x="102" y="491" font-size="16.5" font-weight="800" fill="#291c0e">Printers / encoders</text>
<text x="102" y="514" font-size="12.5" fill="#5c6470">only if encoding in-house instead of pre-encoded tags</text>
<rect x="852" y="474" width="252" height="42" rx="21" fill="#f7edd6" stroke="#e0c084" stroke-width="1.3"/>
<text x="978" y="501" text-anchor="middle" font-size="16" font-weight="800" fill="#8a6d34">$3,000-10,000 /unit</text>

<text x="600" y="576" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Readers and printers are mostly one-time; the tag line is the one that recurs forever.</text>
</svg>
