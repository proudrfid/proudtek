<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NFC tap-to-verify authentication for luxury resale</title>
<desc id="d">Hero illustration. A smartphone taps a luxury handbag with an NTAG 424 DNA chip sewn in at production. The phone screen shows a gold shield with a checkmark and the verdict AUTHENTIC, cryptographically verified. Verdict pills underneath read: 5-15 seconds per item, near-zero error, every tap logged.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f2dfb2"/><stop offset="100%" stop-color="#d4a755"/></linearGradient>
<linearGradient id="bagGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f9f1e2"/><stop offset="100%" stop-color="#efe0bf"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">LUXURY RESALE · TAP TO VERIFY</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="36" font-weight="700" fill="#291c0e">The trained eye retires — authentication becomes a tap</text>

<!-- sparkles -->
<path d="M150 175 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 Z" fill="#e4c98f"/>
<path d="M1075 195 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 Z" fill="#e9d3a2"/>
<path d="M1030 508 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 Z" fill="#edd9ae"/>
<path d="M185 462 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 Z" fill="#f0e0bd"/>

<!-- handbag -->
<ellipse cx="400" cy="516" rx="150" ry="10" fill="#ece5d8"/>
<path d="M 310 285 C 312 220 378 220 380 285" fill="none" stroke="#c39a5f" stroke-width="7" stroke-linecap="round"/>
<path d="M 420 285 C 422 220 488 220 490 285" fill="none" stroke="#c39a5f" stroke-width="7" stroke-linecap="round"/>
<path d="M 255 285 L 545 285 L 550 480 Q 551 505 525 505 L 275 505 Q 249 505 250 480 Z" fill="url(#bagGrad)" stroke="#c39a5f" stroke-width="3" stroke-linejoin="round"/>
<path d="M 245 285 L 555 285 L 540 360 Q 400 400 260 360 Z" fill="#efe0bf" stroke="#c39a5f" stroke-width="3" stroke-linejoin="round"/>
<rect x="384" y="345" width="32" height="44" rx="8" fill="#c39a5f" stroke="#6d5a3a" stroke-width="2"/>
<circle cx="400" cy="367" r="5" fill="#291c0e"/>
<!-- embedded chip -->
<rect x="486" y="438" width="36" height="26" rx="4" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="496" y="445" width="16" height="12" rx="2" fill="#3d6b6b"/>
<rect x="300" y="532" width="200" height="36" rx="18" fill="#ffffff" stroke="#e4c98f" stroke-width="1.5"/>
<text x="400" y="555" text-anchor="middle" font-size="14" font-weight="600" fill="#6d5a3a">NTAG 424 DNA inside</text>

<!-- NFC arcs -->
<path d="M 718.8 338.8 A 30 30 0 0 0 718.8 381.2" fill="none" stroke="#3d6b6b" stroke-width="4" stroke-linecap="round"/>
<path d="M 703.2 323.2 A 52 52 0 0 0 703.2 396.8" fill="none" stroke="#7ba3a3" stroke-width="3.2" stroke-linecap="round"/>
<path d="M 687.7 307.7 A 74 74 0 0 0 687.7 412.3" fill="none" stroke="#b0c9c9" stroke-width="2.6" stroke-linecap="round"/>

<!-- smartphone -->
<rect x="740" y="200" width="210" height="360" rx="30" fill="#291c0e" stroke="#c39a5f" stroke-width="3"/>
<rect x="756" y="222" width="178" height="316" rx="14" fill="#3b2c17"/>
<rect x="815" y="234" width="60" height="8" rx="4" fill="#6d5a3a"/>
<path d="M 845 270 L 897 289 L 897 345 Q 897 391 845 415 Q 793 391 793 345 L 793 289 Z" fill="url(#shieldGrad)"/>
<path d="M 820 340 L 838 359 L 872 314" fill="none" stroke="#291c0e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="845" y="455" text-anchor="middle" font-size="16.5" font-weight="700" letter-spacing="2" fill="#e4c98f">AUTHENTIC</text>
<text x="845" y="481" text-anchor="middle" font-size="13" fill="#cbb98f">Cryptographically verified</text>

<!-- verdict pills -->
<rect x="316" y="592" width="170" height="36" rx="18" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="401" y="615" text-anchor="middle" font-size="14" font-weight="600" fill="#6d5a3a">5–15 s per item</text>
<rect x="510" y="592" width="170" height="36" rx="18" fill="#ffffff" stroke="#1f6f3a" stroke-width="1.5"/>
<text x="595" y="615" text-anchor="middle" font-size="14" font-weight="600" fill="#1f6f3a">near-zero error</text>
<rect x="704" y="592" width="180" height="36" rx="18" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="794" y="615" text-anchor="middle" font-size="14" font-weight="600" fill="#2c5454">every tap logged</text>
</svg>
