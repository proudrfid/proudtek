<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The three domains of healthcare RFID: patient identification, asset tracking and compliance</title>
<desc id="d">Three columns. Patient identification uses HF 13.56 MHz wristbands, at least two identifiers at the bedside, and an MRN that links to the EHR with no protected health information stored on the chip. Asset tracking uses UHF and BLE real-time location, recovers 20 to 30 minutes per nurse per shift, and pays back in 12 to 24 months. Compliance spans HIPAA, FDA UDI and Joint Commission, requires IEC 60601-1-2 electromagnetic-compatibility testing, and produces audit-ready scan logs.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HEALTHCARE RFID · THREE DOMAINS</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">One technology family, three jobs — each with its own frequency, range and rulebook.</text>

<!-- col 1 · PATIENT ID (teal) -->
<rect x="64" y="118" width="336" height="474" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="64" y="118" width="336" height="8" rx="4" fill="#3d6b6b"/>
<text x="232" y="160" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#2c5454">PATIENT ID</text>
<text x="232" y="182" text-anchor="middle" font-size="12.5" fill="#5c5c5c">verify the right person</text>
<rect x="152" y="220" width="160" height="46" rx="23" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.4"/>
<rect x="214" y="231" width="36" height="24" rx="4" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<circle cx="88" cy="326" r="4" fill="#3d6b6b"/>
<text x="104" y="331" font-size="14.5" fill="#291c0e">HF 13.56 MHz wristbands</text>
<circle cx="88" cy="372" r="4" fill="#3d6b6b"/>
<text x="104" y="377" font-size="14.5" fill="#291c0e">Two identifiers at the bedside</text>
<circle cx="88" cy="418" r="4" fill="#3d6b6b"/>
<text x="104" y="423" font-size="14.5" fill="#291c0e">MRN links to EHR, no PHI on chip</text>
<rect x="88" y="500" width="288" height="40" rx="10" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="232" y="525" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">Short, controlled read range</text>

<!-- col 2 · ASSET TRACKING (steel) -->
<rect x="432" y="118" width="336" height="474" rx="14" fill="#eef0f4" stroke="#d4dae2" stroke-width="1.8"/>
<rect x="432" y="118" width="336" height="8" rx="4" fill="#4a5568"/>
<text x="600" y="160" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#3a4457">ASSET TRACKING</text>
<text x="600" y="182" text-anchor="middle" font-size="12.5" fill="#5c5c5c">find every mobile asset</text>
<rect x="556" y="222" width="88" height="44" rx="7" fill="#ffffff" stroke="#4a5568" stroke-width="2.2"/>
<circle cx="574" cy="276" r="10" fill="#ffffff" stroke="#4a5568" stroke-width="2.2"/>
<circle cx="626" cy="276" r="10" fill="#ffffff" stroke="#4a5568" stroke-width="2.2"/>
<circle cx="456" cy="326" r="4" fill="#4a5568"/>
<text x="472" y="331" font-size="14.5" fill="#291c0e">UHF + BLE real-time location</text>
<circle cx="456" cy="372" r="4" fill="#4a5568"/>
<text x="472" y="377" font-size="14.5" fill="#291c0e">20–30 min/nurse/shift saved</text>
<circle cx="456" cy="418" r="4" fill="#4a5568"/>
<text x="472" y="423" font-size="14.5" fill="#291c0e">12–24-month ROI payback</text>
<rect x="456" y="500" width="288" height="40" rx="10" fill="#ffffff" stroke="#d4dae2" stroke-width="1.3"/>
<text x="600" y="525" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4457">Zone, room and item level</text>

<!-- col 3 · COMPLIANCE (forest) -->
<rect x="800" y="118" width="336" height="474" rx="14" fill="#eaf3ec" stroke="#c4dccb" stroke-width="1.8"/>
<rect x="800" y="118" width="336" height="8" rx="4" fill="#2d6a4f"/>
<text x="968" y="160" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#1b4332">COMPLIANCE</text>
<text x="968" y="182" text-anchor="middle" font-size="12.5" fill="#5c5c5c">prove it to the auditor</text>
<rect x="936" y="216" width="64" height="52" rx="6" fill="#ffffff" stroke="#2d6a4f" stroke-width="2.2"/>
<polyline points="950,242 962,254 986,228" fill="none" stroke="#2d6a4f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="824" cy="326" r="4" fill="#2d6a4f"/>
<text x="840" y="331" font-size="14.5" fill="#291c0e">HIPAA · FDA UDI · Joint Comm.</text>
<circle cx="824" cy="372" r="4" fill="#2d6a4f"/>
<text x="840" y="377" font-size="14.5" fill="#291c0e">IEC 60601-1-2 EMC tested</text>
<circle cx="824" cy="418" r="4" fill="#2d6a4f"/>
<text x="840" y="423" font-size="14.5" fill="#291c0e">Audit-ready scan logs</text>
<rect x="824" y="500" width="288" height="40" rx="10" fill="#ffffff" stroke="#c4dccb" stroke-width="1.3"/>
<text x="968" y="525" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b4332">Map each control to a framework</text>

<text x="600" y="628" text-anchor="middle" font-size="13.5" fill="#6d6d6d">Most hospitals run all three on a hybrid stack — no single tag or frequency covers every use case.</text>
</svg>
