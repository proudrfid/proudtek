<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The worked ROI case: a 500-room hotel, 20,000 items a day</title>
<desc id="d">Three savings streams: linen loss falls from 12 percent to 3 percent, saving replacement of roughly 1,800 items a year; four sort stations stop manual counting, recovering about 8,700 labour hours a year; condition-based retirement at 150 wash cycles instead of a 12-month calendar extends garment life 20-30 percent. The investment: $4,000 of tags at 20 cents across 20,000 items plus $10,000-30,000 of readers, antennas and software. The result: payback in 6-12 months and 3-year ROI of 200-400 percent.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE WORKED EXAMPLE · 500-ROOM HOTEL · 20,000 ITEMS/DAY</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Three savings streams against one modest invoice</text>

<rect x="52" y="136" width="356" height="200" rx="14" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="230" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#1b4332">LINEN LOSS</text>
<text x="230" y="226" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">12% → 3%</text>
<text x="230" y="262" text-anchor="middle" font-size="13" fill="#4f4f4f">≈ 1,800 replacement items</text>
<text x="230" y="284" text-anchor="middle" font-size="13" fill="#4f4f4f">saved every year</text>
<text x="230" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">the headline saving</text>

<rect x="422" y="136" width="356" height="200" rx="14" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="600" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#1b4332">LABOUR</text>
<text x="600" y="226" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">≈ 8,700 h/yr</text>
<text x="600" y="262" text-anchor="middle" font-size="13" fill="#4f4f4f">four sort stations, 6 hours a day,</text>
<text x="600" y="284" text-anchor="middle" font-size="13" fill="#4f4f4f">no longer counting by hand</text>
<text x="600" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">recovered, not eliminated — redeployed</text>

<rect x="792" y="136" width="356" height="200" rx="14" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="970" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#1b4332">GARMENT LIFE</text>
<text x="970" y="226" text-anchor="middle" font-size="26" font-weight="800" fill="#291c0e">+20–30%</text>
<text x="970" y="262" text-anchor="middle" font-size="13" fill="#4f4f4f">retire at 150 wash cycles,</text>
<text x="970" y="284" text-anchor="middle" font-size="13" fill="#4f4f4f">not at a calendar birthday</text>
<text x="970" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6f3a">condition-based replacement</text>

<rect x="150" y="376" width="430" height="170" rx="14" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="365" y="412" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">THE INVOICE</text>
<text x="365" y="448" text-anchor="middle" font-size="14.5" fill="#291c0e">tags: 20,000 × $0.20 = $4,000</text>
<text x="365" y="478" text-anchor="middle" font-size="14.5" fill="#291c0e">readers · antennas · software:</text>
<text x="365" y="504" text-anchor="middle" font-size="14.5" fill="#291c0e">$10,000–30,000</text>
<text x="365" y="532" text-anchor="middle" font-size="12" fill="#4f4f4f">the tag is the cheap part</text>

<path d="M 594 460 h 60" stroke="#1f6f3a" stroke-width="3"/>
<path d="M 654 460 l -14 -8 v 16 z" fill="#1f6f3a"/>

<rect x="672" y="376" width="430" height="170" rx="14" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="2"/>
<text x="887" y="412" text-anchor="middle" font-size="15" font-weight="800" fill="#1b4332">THE VERDICT</text>
<text x="887" y="456" text-anchor="middle" font-size="24" font-weight="800" fill="#1b4332">payback 6–12 months</text>
<text x="887" y="494" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">3-year ROI: 200–400%</text>
<text x="887" y="526" text-anchor="middle" font-size="12" fill="#4f4f4f">typical range across reported programs</text>

<text x="600" y="606" text-anchor="middle" font-size="13.5" fill="#291c0e" font-weight="600">Swap in your own volumes — the shape of the answer rarely changes.</text>
<text x="600" y="634" text-anchor="middle" font-size="13" fill="#5c5c5c">The spreadsheet argument, finally winnable.</text>
</svg>
