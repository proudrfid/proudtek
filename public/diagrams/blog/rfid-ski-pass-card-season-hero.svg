<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Hands-free ski lift access in three steps, one card for the whole mountain</title>
<desc id="d">Three steps. One, the card stays zipped in a jacket pocket. Two, the UHF gate antenna reads it through the jacket at a 0.5 to 1.5 metre range. Three, the turnstile opens and the skier walks through hands-free. The same card also handles the lift gate over UHF and the locker, rental and cashless taps over HF or NFC.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HANDS-FREE LIFT ACCESS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Glove on, pass in the pocket, gate open — the same card runs the whole mountain.</text>

<rect x="90" y="140" width="300" height="250" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/><rect x="90" y="140" width="300" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="240" cy="190" r="18" fill="#3d6b6b"/><text x="240" y="197" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
<text x="240" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Card in the pocket</text>
<text x="240" y="272" text-anchor="middle" font-size="12.5" fill="#5c5c5c">UHF inlay, unique ID —</text>
<text x="240" y="291" text-anchor="middle" font-size="12.5" fill="#5c5c5c">stays zipped in the parka</text>
<rect x="126" y="320" width="228" height="32" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/><text x="240" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">no glove-off</text>

<rect x="450" y="140" width="300" height="250" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.8"/><rect x="450" y="140" width="300" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="600" cy="190" r="18" fill="#3d6b6b"/><text x="600" y="197" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
<text x="600" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Gate reads it</text>
<text x="600" y="272" text-anchor="middle" font-size="12.5" fill="#5c5c5c">UHF antenna reads</text>
<text x="600" y="291" text-anchor="middle" font-size="12.5" fill="#5c5c5c">right through the jacket</text>
<rect x="486" y="320" width="228" height="32" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.2"/><text x="600" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#2c5454">0.5-1.5 m range</text>

<rect x="810" y="140" width="300" height="250" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/><rect x="810" y="140" width="300" height="8" rx="4" fill="#c39a5f"/>
<circle cx="960" cy="190" r="18" fill="#c39a5f"/><text x="960" y="197" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
<text x="960" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Walk through</text>
<text x="960" y="272" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Turnstile opens —</text>
<text x="960" y="291" text-anchor="middle" font-size="12.5" fill="#5c5c5c">no tap, no stopping</text>
<rect x="846" y="320" width="228" height="32" rx="16" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/><text x="960" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#6d5a3a">hands-free</text>

<line x1="396" y1="265" x2="440" y2="265" stroke="#291c0e" stroke-width="2.5"/><polygon points="440,258 449,265 440,272" fill="#291c0e"/>
<line x1="756" y1="265" x2="800" y2="265" stroke="#291c0e" stroke-width="2.5"/><polygon points="800,258 809,265 800,272" fill="#291c0e"/>

<rect x="90" y="428" width="1020" height="104" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="458" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SAME CARD, THE REST OF THE MOUNTAIN</text>
<rect x="112" y="482" width="228" height="34" rx="17" fill="#ffffff" stroke="#e4c98f" stroke-width="1.2"/><text x="226" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">Lift gate · UHF</text>
<rect x="362" y="482" width="228" height="34" rx="17" fill="#ffffff" stroke="#e4c98f" stroke-width="1.2"/><text x="476" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">Locker · HF tap</text>
<rect x="612" y="482" width="228" height="34" rx="17" fill="#ffffff" stroke="#e4c98f" stroke-width="1.2"/><text x="726" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">Rental · HF tap</text>
<rect x="862" y="482" width="228" height="34" rx="17" fill="#ffffff" stroke="#e4c98f" stroke-width="1.2"/><text x="976" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">Cashless · HF tap</text>

<text x="600" y="576" text-anchor="middle" font-size="14.5" fill="#4f4f4f">One card in a pocket clears the gate; a quick tap does everything else on the hill.</text>
</svg>
