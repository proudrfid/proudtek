<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Clone resistance of five anti-counterfeit methods, and whether a consumer can verify with their own phone</title>
<desc id="d">Horizontal bars rank five methods by clone resistance. Holograms and static QR codes are near the low end with no cryptographic trust anchor. Serialised QR with a backend adds duplicate-scan detection but the serial is still copyable. UHF RFID with crypto is strong but consumers have no readers. NFC SUN with a per-tap rolling code is highest and is also verifiable by any consumer smartphone. A right-hand column marks whether each method can be verified with a phone the consumer already owns: no for holograms and UHF RFID, yes for the QR methods and NFC SUN.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CLONE RESISTANCE, COMPARED</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="27" font-weight="700" fill="#291c0e">Strong crypto is worth little if the consumer can't read it</text>

<!-- column headers -->
<text x="100" y="140" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">METHOD</text>
<text x="350" y="140" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">CLONE RESISTANCE →</text>
<text x="1092" y="140" text-anchor="end" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">VERIFY BY PHONE?</text>
<line x1="1006" y1="158" x2="1006" y2="470" stroke="#eadfce" stroke-width="1.5"/>

<!-- Row 1 Holograms -->
<text x="100" y="192" font-size="16" font-weight="700" fill="#291c0e">Holograms</text>
<rect x="350" y="176" width="640" height="26" rx="6" fill="#f2e6e0"/>
<rect x="350" y="176" width="102" height="26" rx="6" fill="#8b2d2d"/>
<text x="466" y="195" font-size="12.5" fill="#8b2d2d">visual deterrent only</text>
<text x="1092" y="195" text-anchor="end" font-size="14" font-weight="800" fill="#9a8a72">— look only</text>

<!-- Row 2 Static QR -->
<text x="100" y="252" font-size="16" font-weight="700" fill="#291c0e">Static QR</text>
<rect x="350" y="236" width="640" height="26" rx="6" fill="#f2e6e0"/>
<rect x="350" y="236" width="82" height="26" rx="6" fill="#8b2d2d"/>
<text x="446" y="255" font-size="12.5" fill="#8b2d2d">an image is trivial to copy</text>
<text x="1092" y="255" text-anchor="end" font-size="14" font-weight="800" fill="#1f6f3a">✓ yes</text>

<!-- Row 3 Serialised QR -->
<text x="100" y="312" font-size="16" font-weight="700" fill="#291c0e">Serialised QR</text>
<rect x="350" y="296" width="640" height="26" rx="6" fill="#f3ecdc"/>
<rect x="350" y="296" width="286" height="26" rx="6" fill="#c39a5f"/>
<text x="650" y="315" font-size="12.5" fill="#6d5a3a">flags duplicates; serial still copyable</text>
<text x="1092" y="315" text-anchor="end" font-size="14" font-weight="800" fill="#1f6f3a">✓ yes</text>

<!-- Row 4 UHF RFID crypto -->
<text x="100" y="372" font-size="16" font-weight="700" fill="#291c0e">UHF RFID crypto</text>
<rect x="350" y="356" width="640" height="26" rx="6" fill="#e7eaee"/>
<rect x="350" y="356" width="544" height="26" rx="6" fill="#4a5568"/>
<text x="362" y="374" font-size="12.5" fill="#ffffff">strong crypto — but no consumer readers</text>
<text x="1092" y="375" text-anchor="end" font-size="14" font-weight="800" fill="#8b2d2d">✗ no reader</text>

<!-- Row 5 NFC SUN -->
<text x="100" y="432" font-size="16" font-weight="700" fill="#291c0e">NFC SUN</text>
<text x="100" y="452" font-size="12.5" fill="#5c5c5c">rolling code</text>
<rect x="350" y="416" width="640" height="26" rx="6" fill="#e3f0e6"/>
<rect x="350" y="416" width="614" height="26" rx="6" fill="#3d6b6b"/>
<text x="360" y="435" font-size="12.5" font-weight="700" fill="#ffffff">per-tap rolling code · AES-128 key stays on chip</text>
<text x="1092" y="435" text-anchor="end" font-size="14" font-weight="800" fill="#1f6f3a">✓ yes</text>

<rect x="150" y="500" width="900" height="96" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="600" y="538" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Only NFC SUN sits in both winning columns</text>
<text x="600" y="568" text-anchor="middle" font-size="14.5" fill="#33595a">a per-tap rolling code paired with a reader every consumer already carries — the TT variant also flags substrate removal.</text>
</svg>
