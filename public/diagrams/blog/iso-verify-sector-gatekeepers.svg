<text x="98" y="196" font-size="13.5" fill="#4f4f4f">Automotive — Tier 1 supply</text>
<text x="98" y="224" font-size="12.5" fill="#5c5c5c">Toyota · VW · GM · Ford · Stellantis</text>
<text x="98" y="244" font-size="12.5" fill="#5c5c5c">PPAP + 8D corrective actions</text>
<rect x="98" y="272" width="110" height="28" rx="14" fill="#eef5f5" stroke="#cfe0e0"/>
<text x="153" y="291" text-anchor="middle" font-size="12.5" fill="#2c5454">12-18 months</text>
<rect x="220" y="272" width="95" height="28" rx="14" fill="#f7edd6" stroke="#e4c98f"/>
<text x="267.5" y="291" text-anchor="middle" font-size="12.5" fill="#6d5a3a">$15K-$50K</text>

