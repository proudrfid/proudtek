<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="bhTitle bhDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="bhTitle">Boutique hotel magstripe-to-RFID keycard case study</title>
  <desc id="bhDesc">A before-and-after comparison. Before, on magstripe: annual keycard cost 9,800 dollars a year, 14 percent of check-ins needing a re-encode, and 3,200 dollars a year in encoder repair invoices. After, on MIFARE Classic 1K RFID: annual keycard cost 5,780 dollars a year, a 0.8 percent re-encode rate, and zero dollars in encoder repairs. Between them, a 41 percent lower keycard cost across 78 rooms deployed in 11 weeks. Footer stats: annual keycard cost falls from 9,800 to 5,780 dollars, an 11-week deployment across 78 rooms with zero room-revenue downtime, and a guest room-access NPS up 14 points.</desc>

  <defs>
    <radialGradient id="bhBg" cx="50%" cy="24%" r="86%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="bhDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#291c0e"/>
      <stop offset="100%" stop-color="#6c5127"/>
    </linearGradient>
    <marker id="bhArrow" markerWidth="10" markerHeight="10" refX="3" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#c39a5f"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bhBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <!-- Eyebrow + tagline -->
  <text x="600" y="64" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="3" fill="#6d5a3a">BOUTIQUE HOTEL RFID KEYCARD CASE STUDY</text>
  <text x="600" y="94" text-anchor="middle" font-size="16.5" fill="#4f4f4f">The least glamorous upgrade in the building — and one of the most profitable</text>

  <!-- ===================== BEFORE card ===================== -->
  <rect x="60" y="122" width="452" height="300" rx="18" fill="#fbf8f2" stroke="#d9b98a" stroke-width="2"/>
  <rect x="84" y="146" width="132" height="34" rx="17" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
  <text x="150" y="169" text-anchor="middle" font-size="14.5" font-weight="700" letter-spacing="1.5" fill="#8b2d2d">BEFORE</text>
  <!-- magstripe card glyph -->
  <g>
    <rect x="360" y="142" width="128" height="82" rx="10" fill="#ffffff" stroke="#291c0e" stroke-width="3"/>
    <rect x="360" y="164" width="128" height="18" fill="#4a3b26"/>
  </g>
  <text x="84" y="214" font-size="23" font-weight="800" fill="#291c0e">Magstripe keycards</text>

  <circle cx="103" cy="256" r="6" fill="#8b2d2d"/>
  <text x="124" y="262" font-size="18" fill="#291c0e"><tspan font-weight="800">$9,800 / yr</tspan> annual keycard cost</text>
  <circle cx="103" cy="300" r="6" fill="#8b2d2d"/>
  <text x="124" y="306" font-size="18" fill="#291c0e"><tspan font-weight="800">14%</tspan> of check-ins need a re-encode</text>
  <circle cx="103" cy="344" r="6" fill="#8b2d2d"/>
  <text x="124" y="350" font-size="18" fill="#291c0e"><tspan font-weight="800">$3,200 / yr</tspan> encoder repair invoices</text>
  <text x="84" y="396" font-size="15" fill="#7a4242">demagnetizes · re-encodes · service calls</text>

  <!-- ===================== center transform ===================== -->
  <line x1="516" y1="272" x2="684" y2="272" stroke="#c39a5f" stroke-width="4" stroke-linecap="round" marker-end="url(#bhArrow)"/>
  <circle cx="600" cy="272" r="60" fill="url(#bhDark)"/>
  <text x="600" y="264" text-anchor="middle" font-size="34" font-weight="800" fill="#d4a755">−41%</text>
  <text x="600" y="290" text-anchor="middle" font-size="13.5" fill="#f4efe4">keycard cost</text>
  <text x="600" y="452" text-anchor="middle" font-size="16" font-weight="600" fill="#6d5a3a">78 rooms · 11 weeks · MIFARE Classic 1K · Salto AElement Fusion</text>

  <!-- ===================== AFTER card ===================== -->
  <rect x="688" y="122" width="452" height="300" rx="18" fill="#fbf8f2" stroke="#c39a5f" stroke-width="2.5"/>
  <rect x="712" y="146" width="120" height="34" rx="17" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="1.5"/>
  <text x="772" y="169" text-anchor="middle" font-size="14.5" font-weight="700" letter-spacing="1.5" fill="#1f6f3a">AFTER</text>
  <!-- rfid card glyph with waves -->
  <g>
    <rect x="988" y="142" width="128" height="82" rx="10" fill="#ffffff" stroke="#291c0e" stroke-width="3"/>
    <g fill="none" stroke="#1fcefb" stroke-width="3.5" stroke-linecap="round">
      <path d="M1035 172 a13 13 0 0 1 0 22"/>
      <path d="M1046 165 a24 24 0 0 1 0 36"/>
    </g>
    <circle cx="1024" cy="183" r="4.5" fill="#1fcefb"/>
  </g>
  <text x="712" y="214" font-size="23" font-weight="800" fill="#291c0e">RFID keycards</text>

  <path d="M708 251 l7 8 l14 -16" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="742" y="262" font-size="18" fill="#291c0e"><tspan font-weight="800">$5,780 / yr</tspan> annual keycard cost</text>
  <path d="M708 295 l7 8 l14 -16" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="742" y="306" font-size="18" fill="#291c0e"><tspan font-weight="800">0.8%</tspan> re-encode rate</text>
  <path d="M708 339 l7 8 l14 -16" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="742" y="350" font-size="18" fill="#291c0e"><tspan font-weight="800">$0</tspan> encoder repair invoices</text>
  <text x="712" y="396" font-size="15" fill="#3f6b4e">30+ stays per card · staff-swappable batteries</text>

  <!-- ===================== footer stat band ===================== -->
  <rect x="60" y="470" width="1080" height="128" rx="16" fill="url(#bhDark)"/>
  <g text-anchor="middle">
    <text x="240" y="524" font-size="32" font-weight="800" fill="#d4a755">$9,800 → $5,780</text>
    <text x="240" y="556" font-size="15" fill="#f4efe4">annual keycard cost (−41%)</text>
    <text x="600" y="524" font-size="32" font-weight="800" fill="#d4a755">78 rooms · 11 wk</text>
    <text x="600" y="556" font-size="15" fill="#f4efe4">zero room-revenue downtime</text>
    <text x="960" y="524" font-size="32" font-weight="800" fill="#d4a755">NPS +14</text>
    <text x="960" y="556" font-size="15" fill="#f4efe4">guest &#8220;room access&#8221; score</text>
  </g>
  <line x1="420" y1="500" x2="420" y2="568" stroke="#c39a5f" stroke-width="1.5" opacity="0.5"/>
  <line x1="780" y1="500" x2="780" y2="568" stroke="#c39a5f" stroke-width="1.5" opacity="0.5"/>

  <text x="600" y="632" text-anchor="middle" font-size="16" fill="#6d5a3a">Same guest experience, quietly upgraded — magstripe headaches out, tap-and-go in.</text>
</svg>
