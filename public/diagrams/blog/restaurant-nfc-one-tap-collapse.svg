<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="otTitle otDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="otTitle">NFC collapses the 4-6 step review path into a single tap</title>
  <desc id="otDesc">A before-and-after of the review path. The old way is 4 to 6 manual steps: open Google, search the business, scroll to reviews, tap write a review, write it, and submit. The NFC way is one tap that lands directly on Google's review form, already open. A footer carries the economics: $0.18 per review versus $4.20 on the old email program, a breakeven at 510 incremental reviews, and a Map Pack lift from 145 to 607 reviews per location over 90 days.</desc>
  <defs>
    <radialGradient id="otBg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="otDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
    <marker id="otArrow" markerWidth="12" markerHeight="12" refX="3" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1fcefb"/></marker>
    <path id="otStar" d="M0,-10 L2.94,-4.05 L9.51,-3.09 L4.76,1.55 L5.88,8.09 L0,5 L-5.88,8.09 L-4.76,1.55 L-9.51,-3.09 L-2.94,-4.05 Z"/>
  </defs>
  <rect width="1200" height="675" fill="url(#otBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#6d5a3a">SIX STEPS → ONE TAP</text>

  <!-- LEFT: the old way -->
  <rect x="56" y="92" width="486" height="386" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="299" y="124" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#8a7550">THE OLD WAY · 4–6 MANUAL STEPS</text>

  <g font-size="15" font-weight="600" fill="#291c0e">
    <g transform="translate(0,0)"><rect x="90" y="140" width="418" height="40" rx="10" fill="#ffffff" stroke="#e0cfa8" stroke-width="1.5"/><circle cx="116" cy="160" r="13" fill="#efe0bf"/><text x="116" y="165" text-anchor="middle" font-size="14" font-weight="800" fill="#8a7550">1</text><text x="142" y="165">Open Google</text></g>
    <g><rect x="99" y="188" width="400" height="40" rx="10" fill="#ffffff" stroke="#e0cfa8" stroke-width="1.5"/><circle cx="125" cy="208" r="13" fill="#efe0bf"/><text x="125" y="213" text-anchor="middle" font-size="14" font-weight="800" fill="#8a7550">2</text><text x="151" y="213">Search for the business</text></g>
    <g><rect x="108" y="236" width="382" height="40" rx="10" fill="#ffffff" stroke="#e0cfa8" stroke-width="1.5"/><circle cx="134" cy="256" r="13" fill="#efe0bf"/><text x="134" y="261" text-anchor="middle" font-size="14" font-weight="800" fill="#8a7550">3</text><text x="160" y="261">Scroll to the reviews</text></g>
    <g><rect x="117" y="284" width="364" height="40" rx="10" fill="#ffffff" stroke="#e0cfa8" stroke-width="1.5"/><circle cx="143" cy="304" r="13" fill="#efe0bf"/><text x="143" y="309" text-anchor="middle" font-size="14" font-weight="800" fill="#8a7550">4</text><text x="169" y="309">Tap "write a review"</text></g>
    <g><rect x="126" y="332" width="346" height="40" rx="10" fill="#ffffff" stroke="#e0cfa8" stroke-width="1.5"/><circle cx="152" cy="352" r="13" fill="#efe0bf"/><text x="152" y="357" text-anchor="middle" font-size="14" font-weight="800" fill="#8a7550">5</text><text x="178" y="357">Actually write it</text></g>
    <g><rect x="135" y="380" width="328" height="40" rx="10" fill="#ffffff" stroke="#e0cfa8" stroke-width="1.5"/><circle cx="161" cy="400" r="13" fill="#efe0bf"/><text x="161" y="405" text-anchor="middle" font-size="14" font-weight="800" fill="#8a7550">6</text><text x="187" y="405">Submit</text></g>
  </g>
  <text x="299" y="452" text-anchor="middle" font-size="13.5" font-style="italic" fill="#8a7550">every step is a place to drift off and never come back</text>

  <!-- center arrow -->
  <line x1="556" y1="285" x2="642" y2="285" stroke="#1fcefb" stroke-width="5" marker-end="url(#otArrow)"/>

  <!-- RIGHT: the NFC way -->
  <rect x="658" y="92" width="486" height="386" rx="16" fill="#eaf9fe" stroke="#1fcefb" stroke-width="2.5"/>
  <text x="901" y="124" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#177a92">THE NFC WAY · 1 TAP</text>

  <!-- card + tap -->
  <g transform="translate(724,168)">
    <rect x="0" y="0" width="150" height="96" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
    <path d="M52 30 a16 16 0 0 1 0 34 M52 22 a24 24 0 0 1 0 50" fill="none" stroke="#1fcefb" stroke-width="3.4" stroke-linecap="round"/>
    <text x="95" y="56" font-size="12" font-weight="800" fill="#291c0e">TAP TO</text>
    <text x="95" y="74" font-size="12" font-weight="800" fill="#291c0e">REVIEW</text>
  </g>
  <line x1="892" y1="216" x2="946" y2="216" stroke="#1fcefb" stroke-width="4" marker-end="url(#otArrow)"/>
  <!-- phone: form already open -->
  <g transform="translate(966,150)">
    <rect x="0" y="0" width="92" height="132" rx="14" fill="#291c0e"/>
    <rect x="6" y="16" width="80" height="100" rx="5" fill="#ffffff"/>
    <g fill="#d4a755"><use href="#otStar" transform="translate(21,42) scale(0.85)"/><use href="#otStar" transform="translate(38,42) scale(0.85)"/><use href="#otStar" transform="translate(55,42) scale(0.85)"/><use href="#otStar" transform="translate(72,42) scale(0.85)"/><use href="#otStar" transform="translate(46,58) scale(0.85)"/></g>
    <rect x="16" y="74" width="60" height="8" rx="4" fill="#cfeefb"/>
    <rect x="16" y="90" width="44" height="8" rx="4" fill="#cfeefb"/>
  </g>

  <text x="901" y="330" text-anchor="middle" font-size="66" font-weight="800" fill="#177a92">1 tap</text>
  <text x="901" y="366" text-anchor="middle" font-size="16" fill="#0d3f4d">lands on Google's review form —</text>
  <text x="901" y="388" text-anchor="middle" font-size="16" fill="#0d3f4d">already open, stars ready</text>
  <rect x="740" y="412" width="322" height="42" rx="12" fill="#ffffff" stroke="#1fcefb" stroke-width="1.5"/>
  <text x="901" y="439" text-anchor="middle" font-size="15" font-weight="700" fill="#177a92">no app to open, nothing to search for</text>

  <!-- Footer economics strip -->
  <rect x="56" y="500" width="1088" height="128" rx="16" fill="url(#otDark)"/>
  <g text-anchor="middle">
    <text x="238" y="552" font-size="38" font-weight="800" fill="#ffffff">$0.18</text>
    <text x="238" y="580" font-size="14" fill="#e7d8b8">per review · was $4.20 on email</text>

    <text x="600" y="552" font-size="38" font-weight="800" fill="#ffffff">510</text>
    <text x="600" y="580" font-size="14" fill="#e7d8b8">incremental reviews to breakeven</text>

    <text x="962" y="552" font-size="38" font-weight="800" fill="#ffffff">145 → 607</text>
    <text x="962" y="580" font-size="14" fill="#e7d8b8">reviews / location in 90 days</text>

    <line x1="420" y1="520" x2="420" y2="600" stroke="#8a6f3e" stroke-width="1.5"/>
    <line x1="782" y1="520" x2="782" y2="600" stroke="#8a6f3e" stroke-width="1.5"/>
  </g>
  <text x="600" y="618" text-anchor="middle" font-size="14.5" font-weight="700" font-style="italic" fill="#f0d9a8">Every step you remove is a review you keep. NFC removed five of them.</text>
</svg>
