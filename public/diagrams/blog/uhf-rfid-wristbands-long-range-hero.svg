<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">UHF versus HF RFID wristbands — long range versus high trust</title>
<desc id="d">Two panels compare the wristband radio bands. HF at 13.56 MHz is the tap-to-transact band: 1 to 10 cm tap interaction, mutual authentication with AES encryption, used for payment, access and identity — short range, high trust. UHF at 860 to 960 MHz reads the whole crowd hands-free: 1 to 10 m, basic password with limited crypto, used for tracking, counting and flow — long range, low trust. A footer notes that a dual-frequency band runs UHF for tracking and HF (DESFire) for payment; never UHF alone for money.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">UHF vs HF ON THE WRIST</text>
<text x="600" y="98" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Long range is the feature &#8212; and the catch</text>

<!-- LEFT · HF -->
<rect x="88" y="124" width="480" height="372" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<rect x="88" y="124" width="480" height="8" rx="4" fill="#3d6b6b"/>
<text x="328" y="168" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#2c5454">HF &#183; 13.56 MHz</text>
<text x="328" y="190" text-anchor="middle" font-size="12.5" fill="#5c5c5c">tap to transact</text>
<circle cx="128" cy="240" r="4" fill="#3d6b6b"/>
<text x="150" y="245" font-size="15" fill="#291c0e">1&#8211;10 cm &#183; tap interaction</text>
<circle cx="128" cy="292" r="4" fill="#3d6b6b"/>
<text x="150" y="297" font-size="15" fill="#291c0e">Mutual auth &#183; AES encryption</text>
<circle cx="128" cy="344" r="4" fill="#3d6b6b"/>
<text x="150" y="349" font-size="15" fill="#291c0e">Payment &#183; access &#183; identity</text>
<rect x="116" y="402" width="424" height="52" rx="10" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.3"/>
<text x="328" y="434" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">Short range, high trust</text>

<!-- RIGHT · UHF -->
<rect x="632" y="124" width="480" height="372" rx="14" fill="#eef0f4" stroke="#d4dae2" stroke-width="1.8"/>
<rect x="632" y="124" width="480" height="8" rx="4" fill="#4a5568"/>
<text x="872" y="168" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#3a4457">UHF &#183; 860&#8211;960 MHz</text>
<text x="872" y="190" text-anchor="middle" font-size="12.5" fill="#5c5c5c">read the whole crowd</text>
<circle cx="672" cy="240" r="4" fill="#4a5568"/>
<text x="694" y="245" font-size="15" fill="#291c0e">1&#8211;10 m &#183; hands-free</text>
<circle cx="672" cy="292" r="4" fill="#4a5568"/>
<text x="694" y="297" font-size="15" fill="#291c0e">Basic password &#183; limited crypto</text>
<circle cx="672" cy="344" r="4" fill="#4a5568"/>
<text x="694" y="349" font-size="15" fill="#291c0e">Tracking &#183; counting &#183; flow</text>
<rect x="660" y="402" width="424" height="52" rx="10" fill="#ffffff" stroke="#d4dae2" stroke-width="1.3"/>
<text x="872" y="434" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3a4457">Long range, low trust</text>

<rect x="88" y="516" width="1024" height="62" rx="12" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="542" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">DUAL-FREQUENCY = BOTH LAYERS ON ONE BAND</text>
<text x="600" y="564" text-anchor="middle" font-size="13.5" fill="#5c5c5c">UHF tracks the crowd; HF (DESFire) handles payment and access. Never UHF alone for money.</text>
</svg>
