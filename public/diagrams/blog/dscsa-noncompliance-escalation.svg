<text x="1020.0" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Counterfeit</text>
<text x="1020.0" y="472" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">liability</text>
<text x="1020.0" y="500" text-anchor="middle" font-size="12.6" font-weight="500" fill="#4f4f4f">Civil + criminal;</text>
<text x="1020.0" y="518" text-anchor="middle" font-size="12.6" font-weight="500" fill="#4f4f4f">insurance +20-40%.</text>
