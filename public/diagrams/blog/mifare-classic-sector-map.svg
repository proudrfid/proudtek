<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">MIFARE Classic 1K memory: sixteen sectors of four blocks</title>
<desc id="d">A memory map of MIFARE Classic. On the left, the anatomy of a single sector: four blocks of sixteen bytes each. Blocks 0 to 2 hold data; block 3 is the sector trailer, split into Key A, access bits and Key B, which gate read and write on that sector. On the right, the full 1K layout drawn as sixteen sectors, S0 to S15, each showing its four blocks with the trailer block marked in red. A note states the 4K variant extends the layout to forty sectors, the first thirty-two standard size and the last eight double size, reusing the same Crypto-1 access control.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="16%" r="94%">
    <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
  </radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MIFARE CLASSIC 1K MEMORY</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Sixteen sectors, four blocks each</text>
<text x="600" y="130" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Every Classic integration is built on this sector grid — and its Key A / Key B trailer.</text>

<!-- LEFT: one-sector anatomy -->
<rect x="64" y="176" width="496" height="386" rx="16" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="312" y="208" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE SECTOR = 4 BLOCKS</text>

<rect x="96" y="226" width="432" height="50" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="118" y="256" font-size="15" font-weight="700" fill="#291c0e">Block 0</text>
<text x="508" y="256" text-anchor="end" font-size="13" fill="#5c5c5c">16 bytes · data</text>

<rect x="96" y="286" width="432" height="50" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="118" y="316" font-size="15" font-weight="700" fill="#291c0e">Block 1</text>
<text x="508" y="316" text-anchor="end" font-size="13" fill="#5c5c5c">16 bytes · data</text>

<rect x="96" y="346" width="432" height="50" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="118" y="376" font-size="15" font-weight="700" fill="#291c0e">Block 2</text>
<text x="508" y="376" text-anchor="end" font-size="13" fill="#5c5c5c">16 bytes · data</text>

<rect x="96" y="406" width="432" height="100" rx="8" fill="#eef1f5" stroke="#4a5568" stroke-width="2"/>
<text x="118" y="430" font-size="15" font-weight="700" fill="#291c0e">Block 3 · Sector trailer</text>
<rect x="110" y="444" width="132" height="46" rx="6" fill="#fbeeee" stroke="#8b2d2d" stroke-width="1.4"/>
<text x="176" y="472" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">Key A</text>
<rect x="250" y="444" width="132" height="46" rx="6" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.4"/>
<text x="316" y="472" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d5a3a">Access bits</text>
<rect x="390" y="444" width="132" height="46" rx="6" fill="#fbeeee" stroke="#8b2d2d" stroke-width="1.4"/>
<text x="456" y="472" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">Key B</text>
<text x="312" y="534" text-anchor="middle" font-size="13" fill="#5c5c5c">Keys A and B gate read / write on every sector.</text>

<!-- RIGHT: full 1K map -->
<rect x="584" y="176" width="552" height="386" rx="16" fill="#fbfaf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="860" y="208" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">1K = 16 SECTORS × 4 BLOCKS</text>

