<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five cashless wristband deployment mistakes and the fix for each</title>
<desc id="d">Five mistakes and their remedies. One, no on-site top-up redundancy — fix with one kiosk per 500 attendees and cash acceptance. Two, POS hardware not stress-tested with production wristbands — fix with a vendor-night dry-run using 100 or more production bands. Three, the refund process buried in the small print — fix with a 24 to 48 hour window, no minimum, refunded to the original method. Four, mixing closed-loop and open-loop without clear UI separation — fix by draining pre-loaded credit first and showing the active source on the POS. Five, no anti-collusion controls on top-up stations — fix by reconciling cash against credits issued every four hours.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COMMON CASHLESS MISTAKES</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">The chip almost always works. The queue and the refund are what fail.</text>

<text x="92" y="124" font-size="13" font-weight="800" letter-spacing="1" fill="#8b2d2d">COMMON MISTAKE</text>
<text x="648" y="124" font-size="13" font-weight="800" letter-spacing="1" fill="#2c5454">THE FIX</text>

<!-- row 1 -->
<rect x="64" y="136" width="512" height="72" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="136" width="9" height="72" rx="4" fill="#8b2d2d"/>
<circle cx="100" cy="172" r="15" fill="#8b2d2d"/>
<text x="100" y="178" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="128" y="177" font-size="13.5" font-weight="700" fill="#291c0e">No on-site top-up redundancy</text>
<line x1="584" y1="172" x2="606" y2="172" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="606,167 616,172 606,177" fill="#291c0e"/>
<rect x="616" y="136" width="520" height="72" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="616" y="136" width="9" height="72" rx="4" fill="#3d6b6b"/>
<text x="648" y="177" font-size="13.5" font-weight="700" fill="#291c0e">1 kiosk / 500, with cash acceptance</text>

<!-- row 2 -->
<rect x="64" y="220" width="512" height="72" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="220" width="9" height="72" rx="4" fill="#8b2d2d"/>
<circle cx="100" cy="256" r="15" fill="#8b2d2d"/>
<text x="100" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="128" y="261" font-size="13.5" font-weight="700" fill="#291c0e">POS not tested with production bands</text>
<line x1="584" y1="256" x2="606" y2="256" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="606,251 616,256 606,261" fill="#291c0e"/>
<rect x="616" y="220" width="520" height="72" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="616" y="220" width="9" height="72" rx="4" fill="#3d6b6b"/>
<text x="648" y="261" font-size="13.5" font-weight="700" fill="#291c0e">Vendor-night dry-run, 100+ bands</text>

<!-- row 3 -->
<rect x="64" y="304" width="512" height="72" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="304" width="9" height="72" rx="4" fill="#8b2d2d"/>
<circle cx="100" cy="340" r="15" fill="#8b2d2d"/>
<text x="100" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="128" y="345" font-size="13.5" font-weight="700" fill="#291c0e">Refund buried in the small print</text>
<line x1="584" y1="340" x2="606" y2="340" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="606,335 616,340 606,345" fill="#291c0e"/>
<rect x="616" y="304" width="520" height="72" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="616" y="304" width="9" height="72" rx="4" fill="#3d6b6b"/>
<text x="648" y="345" font-size="13.5" font-weight="700" fill="#291c0e">24-48h window, no minimum, original method</text>

<!-- row 4 -->
<rect x="64" y="388" width="512" height="72" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="388" width="9" height="72" rx="4" fill="#8b2d2d"/>
<circle cx="100" cy="424" r="15" fill="#8b2d2d"/>
<text x="100" y="430" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="128" y="429" font-size="13.5" font-weight="700" fill="#291c0e">Closed + open loop, no clear UI</text>
<line x1="584" y1="424" x2="606" y2="424" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="606,419 616,424 606,429" fill="#291c0e"/>
<rect x="616" y="388" width="520" height="72" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="616" y="388" width="9" height="72" rx="4" fill="#3d6b6b"/>
<text x="648" y="429" font-size="13.5" font-weight="700" fill="#291c0e">Drain credit first; show source on POS</text>

<!-- row 5 -->
<rect x="64" y="472" width="512" height="72" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="472" width="9" height="72" rx="4" fill="#8b2d2d"/>
<circle cx="100" cy="508" r="15" fill="#8b2d2d"/>
<text x="100" y="514" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">5</text>
<text x="128" y="513" font-size="13.5" font-weight="700" fill="#291c0e">No anti-collusion on top-up cash</text>
<line x1="584" y1="508" x2="606" y2="508" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="606,503 616,508 606,513" fill="#291c0e"/>
<rect x="616" y="472" width="520" height="72" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="616" y="472" width="9" height="72" rx="4" fill="#3d6b6b"/>
<text x="648" y="513" font-size="13.5" font-weight="700" fill="#291c0e">Reconcile cash vs credits every 4 hours</text>

<text x="600" y="586" text-anchor="middle" font-size="14" fill="#5c5c5c">Every one of these is an operations failure, not a chip failure — and every one is preventable.</text>
</svg>
