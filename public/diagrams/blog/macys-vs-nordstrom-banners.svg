<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Macy's vs Nordstrom — one encoded tag, two rulebooks</title>
<desc id="d">Two department-store storefronts share a single encoded RFID tag SKU. The Macy's storefront, with a star on its roof, also covers Bloomingdale's; the Nordstrom storefront covers Nordstrom Rack, Nordstrom CA and Rack CA. Between them sits a dark chip labeled one tag SKU, connected to both stores by dashed lines, with a note that it still means at least two scorecards. Three pills below name the differences: tag origin — Nordstrom historically required third-party converter tags, in-house by review since 2022, while Macy's accepts in-house printing for listed inlays; converter lists — approved separately per banner, so verify yours is on both; and placement — footwear can sit inside the shoe box versus inside the shoe, so confirm per banner before encoding.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE 80% TWINS</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">One encoded tag, two rulebooks</text>

<g transform="translate(80,128)">
<rect x="0" y="40" width="300" height="150" rx="8" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<path d="M-12 40 L150 -6 L312 40 Z" fill="#c39a5f"/>
<path d="M150 6 l5 10 11 2 -8 8 2 11 -10 -5 -10 5 2 -11 -8 -8 11 -2 z" fill="#ffffff"/>
<rect x="30" y="75" width="60" height="85" fill="#f9f1e2" stroke="#e6dfd2"/>
<rect x="120" y="75" width="60" height="85" fill="#f9f1e2" stroke="#e6dfd2"/>
<rect x="210" y="75" width="60" height="85" fill="#f9f1e2" stroke="#e6dfd2"/>
<text x="150" y="225" text-anchor="middle" font-size="19" font-weight="800" letter-spacing="1.5" fill="#291c0e">MACY'S</text>
<text x="150" y="250" text-anchor="middle" font-size="13.5" fill="#4f4f4f">+ Bloomingdale's</text>
</g>

<g transform="translate(820,128)">
<rect x="0" y="40" width="300" height="150" rx="8" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<path d="M-12 40 L150 -6 L312 40 Z" fill="#4a5568"/>
<rect x="30" y="75" width="60" height="85" fill="#eef1f5" stroke="#e6dfd2"/>
<rect x="120" y="75" width="60" height="85" fill="#eef1f5" stroke="#e6dfd2"/>
<rect x="210" y="75" width="60" height="85" fill="#eef1f5" stroke="#e6dfd2"/>
<text x="150" y="225" text-anchor="middle" font-size="19" font-weight="800" letter-spacing="1.5" fill="#291c0e">NORDSTROM</text>
<text x="150" y="250" text-anchor="middle" font-size="13.5" fill="#4f4f4f">+ Rack · Nordstrom CA · Rack CA</text>
</g>

<line x1="392" y1="243" x2="520" y2="243" stroke="#234a4a" stroke-width="3" stroke-dasharray="4 7"/>
<line x1="680" y1="243" x2="808" y2="243" stroke="#234a4a" stroke-width="3" stroke-dasharray="4 7"/>
<g transform="translate(520,188)">
<rect x="0" y="0" width="160" height="110" rx="14" fill="#234a4a"/>
<text x="80" y="38" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="1" fill="#f8ead0">ONE</text>
<text x="80" y="64" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="1" fill="#f8ead0">TAG SKU</text>
<rect x="35" y="78" width="90" height="18" rx="6" fill="none" stroke="#8fbcbc" stroke-width="2"/>
<circle cx="80" cy="87" r="3" fill="#8fbcbc"/>
</g>
<text x="600" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#6d5a3a">…and at least two scorecards</text>

<rect x="56" y="392" width="338" height="150" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="225" y="428" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#6d5a3a">TAG ORIGIN</text>
<text x="225" y="458" text-anchor="middle" font-size="13" fill="#4f4f4f">Nordstrom: third-party converter</text>
<text x="225" y="480" text-anchor="middle" font-size="13" fill="#4f4f4f">(in-house by review since 2022);</text>
<text x="225" y="502" text-anchor="middle" font-size="13" fill="#4f4f4f">Macy's: in-house OK, listed inlay</text>

<rect x="431" y="392" width="338" height="150" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="428" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#6d5a3a">CONVERTER LISTS</text>
<text x="600" y="458" text-anchor="middle" font-size="13" fill="#4f4f4f">approved separately per banner —</text>
<text x="600" y="480" text-anchor="middle" font-size="13" fill="#4f4f4f">one blessing doesn't transfer;</text>
<text x="600" y="502" text-anchor="middle" font-size="13" fill="#4f4f4f">verify yours is on both</text>

<rect x="806" y="392" width="338" height="150" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="975" y="428" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1" fill="#6d5a3a">PLACEMENT</text>
<text x="975" y="458" text-anchor="middle" font-size="13" fill="#4f4f4f">footwear can differ — inside the</text>
<text x="975" y="480" text-anchor="middle" font-size="13" fill="#4f4f4f">shoe box vs inside the shoe;</text>
<text x="975" y="502" text-anchor="middle" font-size="13" fill="#4f4f4f">confirm per banner, then encode</text>

<text x="600" y="616" text-anchor="middle" font-size="15" font-weight="600" fill="#6d5a3a">The tag agrees with everyone; the rulebooks quibble.</text>
</svg>
