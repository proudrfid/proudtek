<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW 13.56 MHz RADIO SEES EACH MATERIAL</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Plastics are invisible — wet paper sulks</text>

