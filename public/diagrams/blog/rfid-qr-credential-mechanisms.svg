<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How RFID and QR credentials are read — radio versus optical</title>
<desc id="d">Two reading mechanisms shown side by side. On the left, RFID: a reader and a wristband chip exchange radio waves, needing no line of sight, working in any light, in 200 to 500 milliseconds per tap. On the right, QR: a phone camera optically images a printed code pattern, needing line of sight and light, taking 1 to 3 seconds per scan. Same job, two completely different physical methods.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TWO DIFFERENT MECHANISMS</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">RFID reads by radio; QR reads by camera — which is why they fail in different places.</text>

<line x1="600" y1="132" x2="600" y2="470" stroke="#ece5d6" stroke-width="1.6"/>

<!-- LEFT: RFID radio -->
<text x="320" y="152" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.6" fill="#2c5454">RFID · RADIO HANDSHAKE</text>
<rect x="120" y="250" width="96" height="116" rx="12" fill="#2c5454"/>
<text x="168" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">READER</text>
<path d="M250 280 Q274 308 250 336" fill="none" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round"/>
<path d="M278 270 Q312 308 278 346" fill="none" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round" opacity="0.72"/>
<path d="M306 262 Q350 308 306 354" fill="none" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
<rect x="398" y="272" width="122" height="72" rx="36" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<rect x="444" y="298" width="30" height="20" rx="4" fill="#2c5454"/>
<text x="459" y="366" text-anchor="middle" font-size="12.5" fill="#5c5c5c">WRISTBAND CHIP</text>
<text x="320" y="432" text-anchor="middle" font-size="15" fill="#291c0e">No line of sight needed</text>
<text x="320" y="458" text-anchor="middle" font-size="15" fill="#291c0e">Works in any light — rain or shine</text>
<text x="320" y="486" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">200-500 ms per tap</text>

<!-- RIGHT: QR optical -->
<text x="880" y="152" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.6" fill="#a07d43">QR · OPTICAL SCAN</text>
<rect x="700" y="246" width="84" height="150" rx="16" fill="#ffffff" stroke="#a07d43" stroke-width="2"/>
<circle cx="742" cy="270" r="7" fill="#a07d43"/>
<rect x="712" y="286" width="60" height="94" rx="4" fill="#f7edd6"/>
<text x="742" y="416" text-anchor="middle" font-size="12.5" fill="#5c5c5c">CAMERA</text>
<path d="M786 296 L944 284" stroke="#d4a755" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M786 344 L944 360" stroke="#d4a755" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="944" y="272" width="104" height="104" rx="6" fill="#ffffff" stroke="#a07d43" stroke-width="2"/>
<rect x="956" y="284" width="24" height="24" fill="none" stroke="#291c0e" stroke-width="4"/>
<rect x="1012" y="284" width="24" height="24" fill="none" stroke="#291c0e" stroke-width="4"/>
<rect x="956" y="340" width="24" height="24" fill="none" stroke="#291c0e" stroke-width="4"/>
<rect x="992" y="316" width="9" height="9" fill="#291c0e"/>
<rect x="1010" y="330" width="9" height="9" fill="#291c0e"/>
<rect x="1026" y="352" width="9" height="9" fill="#291c0e"/>
<rect x="996" y="352" width="9" height="9" fill="#291c0e"/>
<text x="996" y="392" text-anchor="middle" font-size="12.5" fill="#5c5c5c">PRINTED CODE</text>
<text x="880" y="432" text-anchor="middle" font-size="15" fill="#291c0e">Needs line of sight</text>
<text x="880" y="458" text-anchor="middle" font-size="15" fill="#291c0e">Struggles in glare or low light</text>
<text x="880" y="486" text-anchor="middle" font-size="16" font-weight="800" fill="#a07d43">1-3 s per scan</text>

<text x="600" y="600" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Same job — prove who you are at the gate — done two completely different ways.</text>
</svg>
