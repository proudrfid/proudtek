<title id="clkt">The 24-hour saleable-returns clock</title>
<desc id="clkd">A returned saleable unit lands on the distribution-center dock and a 24-hour verification clock starts. Verify the unit against the manufacturer&#x27;s record inside the window and it goes back into saleable stock. Miss the window and the very same carton must become quarantine or scrap.</desc>
