<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">First-order RFID MOQ by product class, 2026 (log scale)</title>
<desc id="d">Horizontal range bars on a log scale of units from 500 to 50,000. UHF wet inlay first-order MOQ runs 5,000 to 10,000, with repeats at 1,000 to 2,000. Custom-printed UHF label runs 10,000 to 50,000. Cards in MIFARE, DESFire and NTAG run 500 to 2,000 for stocked PVC. Custom silicone wristband runs 1,000 to 5,000. On-metal and industrial tags run 500 to 2,000 on stocked SKUs.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MOQ BENCHMARKS · BY PRODUCT CLASS · 2026</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">First-order MOQ, from current factory-direct and master-distributor quotations.</text>

<!-- gridlines -->
<line x1="300" y1="130" x2="300" y2="548" stroke="#efe9dc" stroke-width="1.4"/>
<line x1="419" y1="130" x2="419" y2="548" stroke="#efe9dc" stroke-width="1.4"/>
<line x1="695" y1="130" x2="695" y2="548" stroke="#efe9dc" stroke-width="1.4"/>
<line x1="814" y1="130" x2="814" y2="548" stroke="#efe9dc" stroke-width="1.4"/>
<line x1="1090" y1="130" x2="1090" y2="548" stroke="#efe9dc" stroke-width="1.4"/>

<!-- row 1 UHF wet inlay -->
<text x="64" y="180" font-size="15" font-weight="700" fill="#291c0e">UHF wet inlay</text>
<text x="64" y="200" font-size="12" fill="#8a8a8a">repeat 1K–2K</text>
<rect x="695" y="166" width="119" height="34" rx="6" fill="#3d6b6b"/>
<text x="754" y="188" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">5K–10K</text>

<!-- row 2 custom-printed UHF -->
<text x="64" y="262" font-size="15" font-weight="700" fill="#291c0e">Custom-printed UHF</text>
<text x="64" y="282" font-size="12" fill="#8a8a8a">+ plate &amp; encoding fees</text>
<rect x="814" y="248" width="276" height="34" rx="6" fill="#3d6b6b"/>
<text x="952" y="270" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">10K–50K</text>

<!-- row 3 cards -->
<text x="64" y="342" font-size="15" font-weight="700" fill="#291c0e">Cards (MIFARE/NTAG)</text>
<text x="64" y="362" font-size="12" fill="#8a8a8a">stocked PVC</text>
<rect x="300" y="328" width="238" height="34" rx="6" fill="#c39a5f"/>
<text x="419" y="350" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">500–2K</text>

<!-- row 4 wristband -->
<text x="64" y="422" font-size="15" font-weight="700" fill="#291c0e">Custom wristband</text>
<text x="64" y="442" font-size="12" fill="#8a8a8a">silicone (mould)</text>
<rect x="419" y="408" width="276" height="34" rx="6" fill="#2d6a4f"/>
<text x="557" y="430" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">1K–5K</text>

<!-- row 5 on-metal -->
<text x="64" y="502" font-size="15" font-weight="700" fill="#291c0e">On-metal / industrial</text>
<text x="64" y="522" font-size="12" fill="#8a8a8a">stocked SKUs</text>
<rect x="300" y="488" width="238" height="34" rx="6" fill="#4a5568"/>
<text x="419" y="510" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">500–2K</text>

<!-- axis labels -->
<text x="300" y="566" text-anchor="middle" font-size="12.5" fill="#5c5c5c">500</text>
<text x="419" y="566" text-anchor="middle" font-size="12.5" fill="#5c5c5c">1K</text>
<text x="695" y="566" text-anchor="middle" font-size="12.5" fill="#5c5c5c">5K</text>
<text x="814" y="566" text-anchor="middle" font-size="12.5" fill="#5c5c5c">10K</text>
<text x="1090" y="566" text-anchor="middle" font-size="12.5" fill="#5c5c5c">50K</text>
<text x="600" y="600" text-anchor="middle" font-size="13" fill="#8a8a8a">first-order MOQ — units, log scale (custom-tooled variants run higher)</text>
</svg>
