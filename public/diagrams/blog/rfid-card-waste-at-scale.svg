<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How one 5-gram keycard scales into a reportable ESG line item</title>
<desc id="d">A four-step escalation. One PVC keycard weighs about 5 grams. One hotel chain issues 5 million cards per year. That generates 25 tonnes of PVC waste per year. Which makes card material a reportable metric under Scope 3, Category 1 purchased goods. At scale, a throwaway card becomes an audited ESG line item, which is why procurement now counts the material.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY PROCUREMENT NOW COUNTS THE CARD</text>
<text x="600" y="100" text-anchor="middle" font-size="32" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">One keycard is trivial. A hotel year is 25 tonnes.</text>

<!-- Node 1 -->
<rect x="88" y="200" width="210" height="220" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<rect x="88" y="200" width="210" height="8" rx="4" fill="#4a5568"/>
<text x="193" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#4f4f4f">One PVC keycard</text>
<text x="193" y="322" text-anchor="middle" font-size="40" font-weight="800" fill="#291c0e" font-family="Lora, Georgia, serif">5 g</text>
<text x="193" y="366" text-anchor="middle" font-size="13.5" fill="#5c5c5c">per standard card</text>

<!-- Arrow 1 -->
<line x1="306" y1="310" x2="351" y2="310" stroke="#4a5568" stroke-width="3"/>
<polygon points="351,302 365,310 351,318" fill="#4a5568"/>

<!-- Node 2 -->
<rect x="359" y="200" width="210" height="220" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<rect x="359" y="200" width="210" height="8" rx="4" fill="#3d6b6b"/>
<text x="464" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#4f4f4f">One hotel chain</text>
<text x="464" y="322" text-anchor="middle" font-size="40" font-weight="800" fill="#291c0e" font-family="Lora, Georgia, serif">5 M</text>
<text x="464" y="366" text-anchor="middle" font-size="13.5" fill="#5c5c5c">cards / year</text>

<!-- Arrow 2 -->
<line x1="577" y1="310" x2="622" y2="310" stroke="#3d6b6b" stroke-width="3"/>
<polygon points="622,302 636,310 622,318" fill="#3d6b6b"/>

<!-- Node 3 -->
<rect x="630" y="200" width="210" height="220" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.8"/>
<rect x="630" y="200" width="210" height="8" rx="4" fill="#2d6a4f"/>
<text x="735" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#4f4f4f">PVC waste</text>
<text x="735" y="322" text-anchor="middle" font-size="40" font-weight="800" fill="#291c0e" font-family="Lora, Georgia, serif">25 t</text>
<text x="735" y="366" text-anchor="middle" font-size="13.5" fill="#5c5c5c">per year</text>

<!-- Arrow 3 -->
<line x1="848" y1="310" x2="893" y2="310" stroke="#2d6a4f" stroke-width="3"/>
<polygon points="893,302 907,310 893,318" fill="#2d6a4f"/>

<!-- Node 4 (highlighted) -->
<rect x="901" y="200" width="210" height="220" rx="14" fill="#e7f0ea" stroke="#2d6a4f" stroke-width="2.2"/>
<rect x="901" y="200" width="210" height="8" rx="4" fill="#1b4332"/>
<text x="1006" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#1b4332">Now reportable</text>
<text x="1006" y="312" text-anchor="middle" font-size="26" font-weight="800" fill="#1b4332" font-family="Lora, Georgia, serif">Scope 3</text>
<text x="1006" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#2d6a4f">Category 1</text>
<text x="1006" y="380" text-anchor="middle" font-size="12.5" fill="#5c5c5c">purchased goods</text>

<text x="600" y="520" text-anchor="middle" font-size="16" fill="#4f4f4f">At scale, a throwaway card becomes an ESG line item &#8212;</text>
<text x="600" y="548" text-anchor="middle" font-size="16" fill="#4f4f4f">which is why the material now shows up in the audit, not just the brochure.</text>
</svg>
