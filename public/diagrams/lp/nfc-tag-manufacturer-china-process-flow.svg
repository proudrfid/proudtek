<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">How a Proud Tek NFC tag is made: five stages from bare chip to encoded, read-tested unit, run on partner lines to our specification</title>
  <desc id="d">Five stages left to right, all to one Proud Tek specification with one QC sign-off. Stage 1, antenna: an aluminium or copper antenna etched or printed on a PET or paper web. Stage 2, chip bonding: an NXP wafer flip-chip bonded to the antenna to form the inlay. Stage 3, converting: wet and dry inlays laminated and die-cut to size on rolls. Stage 4, printing and finishing: full-colour artwork printed and laminated, epoxy and anti-metal tags molded into housings. Stage 5, encoding and QC: NDEF or NTAG 424 DNA SUN records written inline, then every unit 100% read-tested. A base arrow underneath runs from a bare wafer, in-house, to a shipped SKU under one QC sign-off.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INSIDE THE LINE — SHENZHEN SINCE 2008</text>
  <text x="600" y="98" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">From bare chip to encoded, read-tested tag</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">Five stages, one specification, one QC sign-off — on contracted partner lines.</text>

  <!-- stage 1 -->
  <rect x="48" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="143" cy="216" r="18" fill="#3d6b6b"/>
  <text x="143" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
  <text x="143" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Antenna</text>
  <text x="143" y="308" text-anchor="middle" font-size="13" fill="#5c5c5c">etched or printed</text>
  <text x="143" y="329" text-anchor="middle" font-size="13" fill="#5c5c5c">on PET or paper</text>
  <rect x="63" y="404" width="160" height="34" rx="8" fill="#eef5f5"/>
  <text x="143" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">aluminium / copper</text>

  <!-- stage 2 -->
  <rect x="274" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="369" cy="216" r="18" fill="#4a5568"/>
  <text x="369" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
  <text x="369" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Chip bonding</text>
  <text x="369" y="308" text-anchor="middle" font-size="13" fill="#5c5c5c">flip-chip to antenna,</text>
  <text x="369" y="329" text-anchor="middle" font-size="13" fill="#5c5c5c">forms the inlay</text>
  <rect x="289" y="404" width="160" height="34" rx="8" fill="#eef1f5"/>
  <text x="369" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">NXP silicon</text>

  <!-- stage 3 -->
  <rect x="500" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="595" cy="216" r="18" fill="#3d6b6b"/>
  <text x="595" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
  <text x="595" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Converting</text>
  <text x="595" y="308" text-anchor="middle" font-size="13" fill="#5c5c5c">wet &amp; dry inlays,</text>
  <text x="595" y="329" text-anchor="middle" font-size="13" fill="#5c5c5c">die-cut on rolls</text>
  <rect x="515" y="404" width="160" height="34" rx="8" fill="#eef5f5"/>
  <text x="595" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">reel-to-reel</text>

  <!-- stage 4 -->
  <rect x="726" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="821" cy="216" r="18" fill="#4a5568"/>
  <text x="821" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
  <text x="821" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Printing</text>
  <text x="821" y="308" text-anchor="middle" font-size="13" fill="#5c5c5c">artwork, lamination,</text>
  <text x="821" y="329" text-anchor="middle" font-size="13" fill="#5c5c5c">epoxy &amp; molding</text>
  <rect x="741" y="404" width="160" height="34" rx="8" fill="#eef1f5"/>
  <text x="821" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">offset / screen</text>

  <!-- stage 5 -->
  <rect x="952" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
  <circle cx="1047" cy="216" r="18" fill="#2c5454"/>
  <text x="1047" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
  <text x="1047" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Encoding &amp; QC</text>
  <text x="1047" y="308" text-anchor="middle" font-size="13" fill="#5c5c5c">NDEF / SUN written,</text>
  <text x="1047" y="329" text-anchor="middle" font-size="13" fill="#5c5c5c">then verified</text>
  <rect x="967" y="404" width="160" height="34" rx="8" fill="#f7edd6"/>
  <text x="1047" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">100% read-tested</text>

  <!-- chevrons between stages -->
  <polygon points="250,315 262,325 250,335" fill="#c39a5f"/>
  <polygon points="476,315 488,325 476,335" fill="#c39a5f"/>
  <polygon points="702,315 714,325 702,335" fill="#c39a5f"/>
  <polygon points="928,315 940,325 928,335" fill="#c39a5f"/>

  <!-- progression base arrow -->
  <text x="100" y="548" font-size="13" font-weight="700" fill="#5c5c5c">Bare wafer · to our spec</text>
  <text x="1090" y="548" text-anchor="end" font-size="13" font-weight="700" fill="#5c5c5c">Shipped SKU</text>
  <line x1="100" y1="572" x2="1072" y2="572" stroke="#4a5568" stroke-width="3"/>
  <polygon points="1072,564 1090,572 1072,580" fill="#4a5568"/>
  <text x="600" y="614" text-anchor="middle" font-size="15" fill="#291c0e">One production traveler, one documentation pack — every unit read-tested before dispatch.</text>
</svg>
