<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Bulk RFID card order flow: from a free sample to cards delivered at volume</title>
  <desc id="d">Five steps left to right. Step 1, free card samples: blanks plus a printed proof, 5-10 business days. Step 2, spec and quote: chip, artwork, encoding and quantity tiers confirmed in writing with an itemised MOQ ladder. Step 3, pilot and first article: a 100-piece pilot approved on your own reader — the decision gate. Step 4, volume run and QC: a 1,000 to 1,000,000-plus card run on 5-7 day production with 100 percent functional testing. Step 5, pack and deliver: air freight in 3-7 days or sea freight in 25-45 days, with scheduled call-off for blanket orders. A base arrow underneath shows the order moving from free sample to delivered at volume; nothing runs at volume until a first article is approved on your own reader.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SAMPLE TO DELIVERY AT VOLUME</text>
  <text x="600" y="98" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">Front-load the cheap steps, then run the volume</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">One approved first article stands between the pilot and a six-figure production run.</text>

  <!-- step 1 -->
  <rect x="48" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="143" cy="216" r="18" fill="#3d6b6b"/>
  <text x="143" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
  <text x="143" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Free card</text>
  <text x="143" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">samples</text>
  <text x="143" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">blanks plus a</text>
  <text x="143" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">printed proof</text>
  <rect x="63" y="404" width="160" height="34" rx="8" fill="#eef5f5"/>
  <text x="143" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">5-10 business days</text>

  <!-- step 2 -->
  <rect x="274" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="369" cy="216" r="18" fill="#4a5568"/>
  <text x="369" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
  <text x="369" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Spec &amp;</text>
  <text x="369" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">quote</text>
  <text x="369" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">chip, artwork,</text>
  <text x="369" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">encoding, tiers</text>
  <rect x="289" y="404" width="160" height="34" rx="8" fill="#eef1f5"/>
  <text x="369" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">itemised MOQ ladder</text>

  <!-- step 3 (decision gate) -->
  <rect x="500" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
  <circle cx="595" cy="216" r="18" fill="#c39a5f"/>
  <text x="595" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
  <text x="595" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Pilot &amp;</text>
  <text x="595" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">first article</text>
  <text x="595" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">100-piece pilot,</text>
  <text x="595" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">signed off</text>
  <rect x="515" y="404" width="160" height="34" rx="8" fill="#f7edd6"/>
  <text x="595" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#6d5a3a">approved on your reader</text>

  <!-- step 4 -->
  <rect x="726" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="821" cy="216" r="18" fill="#4a5568"/>
  <text x="821" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
  <text x="821" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Volume run</text>
  <text x="821" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">&amp; QC</text>
  <text x="821" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">1,000 to 1M+ cards,</text>
  <text x="821" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">5-7 day production</text>
  <rect x="741" y="404" width="160" height="34" rx="8" fill="#eef1f5"/>
  <text x="821" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">100% functional test</text>

  <!-- step 5 -->
  <rect x="952" y="180" width="190" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="1047" cy="216" r="18" fill="#2c5454"/>
  <text x="1047" y="223" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
  <text x="1047" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Pack &amp;</text>
  <text x="1047" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">deliver</text>
  <text x="1047" y="324" text-anchor="middle" font-size="13" fill="#5c5c5c">air 3-7 days or</text>
  <text x="1047" y="345" text-anchor="middle" font-size="13" fill="#5c5c5c">sea 25-45 days</text>
  <rect x="967" y="404" width="160" height="34" rx="8" fill="#eef5f5"/>
  <text x="1047" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">scheduled call-off</text>

  <!-- chevrons between steps -->
  <polygon points="250,315 262,325 250,335" fill="#c39a5f"/>
  <polygon points="476,315 488,325 476,335" fill="#c39a5f"/>
  <polygon points="702,315 714,325 702,335" fill="#c39a5f"/>
  <polygon points="928,315 940,325 928,335" fill="#c39a5f"/>

  <!-- progression base arrow -->
  <text x="100" y="548" font-size="13" font-weight="700" fill="#5c5c5c">Free sample</text>
  <text x="1090" y="548" text-anchor="end" font-size="13" font-weight="700" fill="#5c5c5c">Delivered at volume</text>
  <line x1="100" y1="572" x2="1072" y2="572" stroke="#4a5568" stroke-width="3"/>
  <polygon points="1072,564 1090,572 1072,580" fill="#4a5568"/>
  <text x="600" y="614" text-anchor="middle" font-size="15" fill="#291c0e">Nothing runs at volume until a first article is approved on your own reader.</text>
</svg>
