<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The accredited chain of trust versus the self-issued certificate</title>
<desc id="d">Two three-step chains. The accredited chain, which holds up in customs and commercial dispute, runs from the national accreditation body (UKAS, ANAB, CNAS) to the accredited certification body (TUV, SGS, BSI, DNV, Bureau Veritas) to your certificate with real legal weight. The self-issued chain, which holds up until someone asks a question, runs from a guy with a printer, with no independent audit, to a shiny certificate with an identical look and zero backing, to audit day — poof, gone. A footnote says anyone can print a certificate; accreditation is the part where someone with a reputation to lose stands behind it.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHO IS STANDING BEHIND THIS CERTIFICATE?</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">The chain of trust vs. a guy with a printer</text>

<text x="84" y="152" font-size="13.5" font-weight="800" letter-spacing="1.2" fill="#1f6f3a">ACCREDITED — HOLDS UP IN CUSTOMS AND COMMERCIAL DISPUTE</text>

<rect x="84" y="170" width="300" height="110" rx="14" fill="#eaf4ee" stroke="#9fc9ae" stroke-width="2"/>
<circle cx="234" cy="196" r="14" fill="#2d6a4f"/>
<path d="M 227 196 l 5 5 l 10 -11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="234" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">National accreditation body</text>
<text x="234" y="256" text-anchor="middle" font-size="12.5" fill="#4f4f4f">UKAS · ANAB · CNAS</text>

<line x1="384" y1="225" x2="438" y2="225" stroke="#2d6a4f" stroke-width="3"/>
<path d="M 448 225 l -11 -6 v 12 z" fill="#2d6a4f"/>

<rect x="448" y="170" width="300" height="110" rx="14" fill="#eaf4ee" stroke="#9fc9ae" stroke-width="2"/>
<circle cx="598" cy="196" r="14" fill="#2d6a4f"/>
<path d="M 591 196 l 5 5 l 10 -11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="598" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Accredited certification body</text>
<text x="598" y="256" text-anchor="middle" font-size="12.5" fill="#4f4f4f">TUV · SGS · BSI · DNV · Bureau Veritas</text>

<line x1="748" y1="225" x2="802" y2="225" stroke="#2d6a4f" stroke-width="3"/>
<path d="M 812 225 l -11 -6 v 12 z" fill="#2d6a4f"/>

<rect x="812" y="170" width="304" height="110" rx="14" fill="#2d6a4f"/>
<rect x="951" y="184" width="26" height="20" rx="3" fill="#ffffff"/>
<circle cx="970" cy="198" r="3.5" fill="#d4a755"/>
<text x="964" y="232" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">Your certificate</text>
<text x="964" y="256" text-anchor="middle" font-size="12.5" fill="#cfe5d8">real legal weight in customs</text>

<line x1="84" y1="322" x2="1116" y2="322" stroke="#e6dfd2" stroke-width="2"/>

<text x="84" y="368" font-size="13.5" font-weight="800" letter-spacing="1.2" fill="#8b2d2d">SELF-ISSUED — HOLDS UP UNTIL SOMEONE ASKS A QUESTION</text>

<rect x="84" y="386" width="300" height="110" rx="14" fill="#f7e3df" stroke="#d9a89e" stroke-width="2"/>
<rect x="225" y="396" width="18" height="12" fill="#ffffff" stroke="#d9a89e"/>
<rect x="218" y="406" width="32" height="16" rx="3" fill="#8b2d2d"/>
<text x="234" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">A guy + a printer</text>
<text x="234" y="472" text-anchor="middle" font-size="12.5" fill="#4f4f4f">no independent audit</text>

<line x1="384" y1="441" x2="438" y2="441" stroke="#8b2d2d" stroke-width="2.5" stroke-dasharray="6 5"/>
<path d="M 448 441 l -11 -6 v 12 z" fill="#8b2d2d"/>

<rect x="448" y="386" width="300" height="110" rx="14" fill="#f7e3df" stroke="#d9a89e" stroke-width="2"/>
<rect x="585" y="400" width="26" height="20" rx="3" fill="#ffffff" stroke="#d9a89e" stroke-width="1.5"/>
<text x="620" y="408" text-anchor="middle" font-size="12" fill="#d4a755">✦</text>
<text x="598" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">A shiny certificate</text>
<text x="598" y="472" text-anchor="middle" font-size="12.5" fill="#4f4f4f">identical look, zero backing</text>

<line x1="748" y1="441" x2="802" y2="441" stroke="#8b2d2d" stroke-width="2.5" stroke-dasharray="6 5"/>
<path d="M 812 441 l -11 -6 v 12 z" fill="#8b2d2d"/>

<rect x="812" y="386" width="304" height="110" rx="14" fill="#ffffff" stroke="#8b2d2d" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="956" y1="404" x2="972" y2="420" stroke="#8b2d2d" stroke-width="3.5" stroke-linecap="round"/>
<line x1="972" y1="404" x2="956" y2="420" stroke="#8b2d2d" stroke-width="3.5" stroke-linecap="round"/>
<text x="964" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#8b2d2d">Audit day</text>
<text x="964" y="472" text-anchor="middle" font-size="12.5" fill="#8b2d2d">poof — gone</text>

<text x="600" y="566" text-anchor="middle" font-size="15" fill="#4f4f4f">Anyone can print a certificate — accreditation is the part where someone with a reputation to lose stands behind it</text>
<text x="600" y="592" text-anchor="middle" font-size="13.5" fill="#5c5c5c">trace every certifying body back to UKAS, ANAB or CNAS before the certificate counts</text>
</svg>
