<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Where a hotel key-card entry breaks: card, reader, lock and bolt motor</title>
<desc id="d">A left-to-right signal chain of a hotel key-card entry — the card as the credential, the reader as antenna and slot, the lock as controller and SAM, and the bolt as motor and battery — with a failure panel under each stage. The card fails by demagnetization, bending or expired encoding; the reader by a dirty slot or worn antenna; the lock by a wrong room or expired time or a firmware fault; the bolt by a dead battery or stalled motor. Each failure interrupts the chain at one point, and the lock light tells you which.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOTEL KEY CARD · WHERE IT BREAKS</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="36" font-weight="700" fill="#291c0e">Read the symptom before you re-cut the card</text>
<text x="600" y="140" text-anchor="middle" font-size="16" fill="#4f4f4f">One entry, four stages — each failure interrupts the chain at exactly one of them.</text>

<!-- chain nodes -->
<rect x="92" y="190" width="200" height="120" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="92" y="190" width="8" height="120" rx="4" fill="#3d6b6b"/>
<text x="196" y="246" text-anchor="middle" font-size="22" font-weight="800" fill="#291c0e">CARD</text>
<text x="196" y="276" text-anchor="middle" font-size="13.5" fill="#5c5c5c">the credential</text>

<rect x="356" y="190" width="200" height="120" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="356" y="190" width="8" height="120" rx="4" fill="#3d6b6b"/>
<text x="460" y="246" text-anchor="middle" font-size="22" font-weight="800" fill="#291c0e">READER</text>
<text x="460" y="276" text-anchor="middle" font-size="13.5" fill="#5c5c5c">antenna + slot</text>

<rect x="620" y="190" width="200" height="120" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="620" y="190" width="8" height="120" rx="4" fill="#3d6b6b"/>
<text x="724" y="246" text-anchor="middle" font-size="22" font-weight="800" fill="#291c0e">LOCK</text>
<text x="724" y="276" text-anchor="middle" font-size="13.5" fill="#5c5c5c">controller + SAM</text>

<rect x="884" y="190" width="200" height="120" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="884" y="190" width="8" height="120" rx="4" fill="#3d6b6b"/>
<text x="988" y="246" text-anchor="middle" font-size="22" font-weight="800" fill="#291c0e">BOLT</text>
<text x="988" y="276" text-anchor="middle" font-size="13.5" fill="#5c5c5c">motor + battery</text>

<!-- arrows -->
<line x1="304" y1="250" x2="342" y2="250" stroke="#3d6b6b" stroke-width="3"/>
<polygon points="352,250 340,244 340,256" fill="#3d6b6b"/>
<line x1="568" y1="250" x2="606" y2="250" stroke="#3d6b6b" stroke-width="3"/>
<polygon points="616,250 604,244 604,256" fill="#3d6b6b"/>
<line x1="832" y1="250" x2="870" y2="250" stroke="#3d6b6b" stroke-width="3"/>
<polygon points="880,250 868,244 868,256" fill="#3d6b6b"/>

<!-- failure callouts -->
<rect x="92" y="350" width="200" height="214" rx="14" fill="#faf1f1" stroke="#ecdada" stroke-width="1.5"/>
<rect x="92" y="350" width="8" height="214" rx="4" fill="#8b2d2d"/>
<text x="118" y="384" font-size="12" font-weight="800" letter-spacing="0.6" fill="#8b2d2d">FAILS AS</text>
<circle cx="122" cy="413" r="3.5" fill="#8b2d2d"/>
<text x="136" y="418" font-size="14.5" fill="#333333">Demagnetized</text>
<circle cx="122" cy="443" r="3.5" fill="#8b2d2d"/>
<text x="136" y="448" font-size="14.5" fill="#333333">Bent or cracked</text>
<circle cx="122" cy="473" r="3.5" fill="#8b2d2d"/>
<text x="136" y="478" font-size="14.5" fill="#333333">Expired encoding</text>

<rect x="356" y="350" width="200" height="214" rx="14" fill="#faf1f1" stroke="#ecdada" stroke-width="1.5"/>
<rect x="356" y="350" width="8" height="214" rx="4" fill="#8b2d2d"/>
<text x="382" y="384" font-size="12" font-weight="800" letter-spacing="0.6" fill="#8b2d2d">FAILS AS</text>
<circle cx="386" cy="413" r="3.5" fill="#8b2d2d"/>
<text x="400" y="418" font-size="14.5" fill="#333333">Dirty card slot</text>
<circle cx="386" cy="443" r="3.5" fill="#8b2d2d"/>
<text x="400" y="448" font-size="14.5" fill="#333333">Worn antenna</text>

<rect x="620" y="350" width="200" height="214" rx="14" fill="#faf1f1" stroke="#ecdada" stroke-width="1.5"/>
<rect x="620" y="350" width="8" height="214" rx="4" fill="#8b2d2d"/>
<text x="646" y="384" font-size="12" font-weight="800" letter-spacing="0.6" fill="#8b2d2d">FAILS AS</text>
<circle cx="650" cy="413" r="3.5" fill="#8b2d2d"/>
<text x="664" y="418" font-size="14.5" fill="#333333">Wrong room / time</text>
<circle cx="650" cy="443" r="3.5" fill="#8b2d2d"/>
<text x="664" y="448" font-size="14.5" fill="#333333">Firmware fault</text>

<rect x="884" y="350" width="200" height="214" rx="14" fill="#faf1f1" stroke="#ecdada" stroke-width="1.5"/>
<rect x="884" y="350" width="8" height="214" rx="4" fill="#8b2d2d"/>
<text x="910" y="384" font-size="12" font-weight="800" letter-spacing="0.6" fill="#8b2d2d">FAILS AS</text>
<circle cx="914" cy="413" r="3.5" fill="#8b2d2d"/>
<text x="928" y="418" font-size="14.5" fill="#333333">Dead battery</text>
<circle cx="914" cy="443" r="3.5" fill="#8b2d2d"/>
<text x="928" y="448" font-size="14.5" fill="#333333">Stalled motor</text>

<text x="600" y="612" text-anchor="middle" font-size="15" fill="#4f4f4f">The lock light names the stage: solid red is the credential, green-with-no-click is the bolt, no light is the lock itself.</text>
</svg>
