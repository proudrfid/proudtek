<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="bcTitle bcDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="bcTitle">The business case — capex versus annual savings</title>
  <desc id="bcDesc">A payback comparison. One-time capex totals 22,317 dollars: 78 doors at 215 dollars per lock plus 42 dollars labor equals 20,067 dollars, plus a 1,400 dollar encoder and 850 dollars of Mews PMS integration. Savings per year total 18,220 dollars: 4,020 dollars of card consumable, 3,200 dollars of eliminated encoder repairs, and about 11,000 dollars of recovered front-desk labor. Simple payback is about 14.7 months. Three benchmarks framed the targets: a 15 to 25 percent magstripe re-encode rate, a 150 to 600 dollar per-door lock capex range, and a 60 to 80 percent drop in key-replacement requests.</desc>

  <defs>
    <radialGradient id="bcBg" cx="50%" cy="20%" r="88%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
    <linearGradient id="bcDark" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bcBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="64" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#6d5a3a">THE BUSINESS CASE</text>

  <!-- CAPEX panel -->
  <rect x="60" y="100" width="510" height="256" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="84" y="138" font-size="15.5" font-weight="700" letter-spacing="1.5" fill="#6d5a3a">ONE-TIME CAPEX</text>
  <text x="84" y="188" font-size="42" font-weight="800" fill="#291c0e">$22,317</text>
  <line x1="84" y1="208" x2="546" y2="208" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="84" y="240" font-size="17" fill="#4f4f4f">78 doors × $215 lock + $42 labor</text><text x="546" y="240" text-anchor="end" font-size="17" font-weight="800" fill="#291c0e">$20,067</text>
  <text x="84" y="282" font-size="17" fill="#4f4f4f">Encoder</text><text x="546" y="282" text-anchor="end" font-size="17" font-weight="800" fill="#291c0e">$1,400</text>
  <text x="84" y="324" font-size="17" fill="#4f4f4f">Mews PMS integration</text><text x="546" y="324" text-anchor="end" font-size="17" font-weight="800" fill="#291c0e">$850</text>

  <!-- SAVINGS panel -->
  <rect x="630" y="100" width="510" height="256" rx="16" fill="#fbf8f2" stroke="#c39a5f" stroke-width="2.5"/>
  <text x="654" y="138" font-size="15.5" font-weight="700" letter-spacing="1.5" fill="#1f6f3a">SAVINGS PER YEAR</text>
  <text x="654" y="188" font-size="42" font-weight="800" fill="#1f6f3a">$18,220<tspan font-size="22" fill="#3f6b4e"> / yr</tspan></text>
  <line x1="654" y1="208" x2="1116" y2="208" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="654" y="240" font-size="17" fill="#4f4f4f">Card consumable</text><text x="1116" y="240" text-anchor="end" font-size="17" font-weight="800" fill="#1f6f3a">$4,020</text>
  <text x="654" y="282" font-size="17" fill="#4f4f4f">Encoder repairs eliminated</text><text x="1116" y="282" text-anchor="end" font-size="17" font-weight="800" fill="#1f6f3a">$3,200</text>
  <text x="654" y="324" font-size="17" fill="#4f4f4f">Front-desk labor recovered</text><text x="1116" y="324" text-anchor="end" font-size="17" font-weight="800" fill="#1f6f3a">~$11,000</text>

  <!-- Payback band -->
  <rect x="60" y="376" width="1080" height="62" rx="16" fill="url(#bcDark)"/>
  <text x="90" y="415" font-size="22" font-weight="800" fill="#d4a755">Simple payback ≈ 14.7 months</text>
  <text x="1110" y="415" text-anchor="end" font-size="16" fill="#f4efe4">capex recovered in year two — savings compound after</text>

  <!-- Benchmark chips -->
  <text x="60" y="480" font-size="14.5" font-weight="700" letter-spacing="1.5" fill="#6d5a3a">BENCHMARKED AGAINST INDUSTRY DATA</text>
  <rect x="60" y="494" width="346" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="80" y="536" font-size="30" font-weight="800" fill="#291c0e">15–25%</text>
  <text x="80" y="560" font-size="14.5" fill="#4f4f4f">magstripe re-encode rate (AHLA 2024–25)</text>
  <rect x="427" y="494" width="346" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="447" y="536" font-size="30" font-weight="800" fill="#291c0e">$150–$600</text>
  <text x="447" y="560" font-size="14.5" fill="#4f4f4f">per-door RFID lock capex range</text>
  <rect x="794" y="494" width="346" height="80" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <text x="814" y="536" font-size="30" font-weight="800" fill="#291c0e">60–80%</text>
  <text x="814" y="560" font-size="14.5" fill="#4f4f4f">drop in key-replacement requests</text>

  <text x="600" y="616" text-anchor="middle" font-size="16.5" fill="#6d5a3a">Signed off by GM, FOM and Owner in week 3 — before a single lock shipped.</text>
</svg>
