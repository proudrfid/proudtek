<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">MIFARE DESFire file system: up to 28 isolated applications</title>
<desc id="d">A hierarchy diagram of the MIFARE DESFire file-system architecture. At the top sits the PICC master level, protected by AES-128 and a PICC master key. Below it, three application directories branch out — Application 1, 2 and 3 — each with its own AES-128 keys and access rights and each holding its own files, File 0, File 1 and File 2. A note states this continues up to 28 independent applications. A footer contrasts DESFire with Classic: where Classic shares one flat sector array, DESFire walls each app behind its own AES-128 keys, with mutual authentication and secure messaging on every access.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="16%" r="94%">
    <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
  </radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MIFARE DESFire FILE SYSTEM</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">One chip, up to 28 walled apps</text>
<text x="600" y="130" text-anchor="middle" font-size="15.5" fill="#4f4f4f">DESFire retires Classic's fixed sectors for an application directory — each app cryptographically isolated.</text>

<!-- root -->
<rect x="440" y="172" width="320" height="66" rx="12" fill="#eef7f0" stroke="#1f6f3a" stroke-width="1.8"/>
<text x="600" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#1b4332">PICC master level</text>
<text x="600" y="223" text-anchor="middle" font-size="13" fill="#2d6a4f">AES-128 · PICC master key</text>

<!-- bus connectors -->
<line x1="600" y1="238" x2="600" y2="266" stroke="#9cbcae" stroke-width="2.4"/>
<line x1="260" y1="266" x2="940" y2="266" stroke="#9cbcae" stroke-width="2.4"/>
<line x1="260" y1="266" x2="260" y2="294" stroke="#9cbcae" stroke-width="2.4"/><polygon points="254,290 260,300 266,290" fill="#9cbcae"/>
<line x1="600" y1="266" x2="600" y2="294" stroke="#9cbcae" stroke-width="2.4"/><polygon points="594,290 600,300 606,290" fill="#9cbcae"/>
<line x1="940" y1="266" x2="940" y2="294" stroke="#9cbcae" stroke-width="2.4"/><polygon points="934,290 940,300 946,290" fill="#9cbcae"/>

<!-- app 1 -->
<rect x="112" y="300" width="296" height="200" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="260" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Application 1</text>
<text x="260" y="352" text-anchor="middle" font-size="12.5" fill="#3d6b6b">AES-128 keys · own access rights</text>
<line x1="130" y1="364" x2="390" y2="364" stroke="#e6dfd2" stroke-width="1.4"/>
<rect x="130" y="376" width="260" height="32" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.2"/><text x="146" y="397" font-size="13" fill="#234a4a">File 0</text>
<rect x="130" y="414" width="260" height="32" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.2"/><text x="146" y="435" font-size="13" fill="#234a4a">File 1</text>
<rect x="130" y="452" width="260" height="32" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.2"/><text x="146" y="473" font-size="13" fill="#234a4a">File 2</text>

<!-- app 2 -->
<rect x="452" y="300" width="296" height="200" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="600" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Application 2</text>
<text x="600" y="352" text-anchor="middle" font-size="12.5" fill="#3d6b6b">AES-128 keys · own access rights</text>
<line x1="470" y1="364" x2="730" y2="364" stroke="#e6dfd2" stroke-width="1.4"/>
<rect x="470" y="376" width="260" height="32" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.2"/><text x="486" y="397" font-size="13" fill="#234a4a">File 0</text>
<rect x="470" y="414" width="260" height="32" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.2"/><text x="486" y="435" font-size="13" fill="#234a4a">File 1</text>
<rect x="470" y="452" width="260" height="32" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.2"/><text x="486" y="473" font-size="13" fill="#234a4a">File 2</text>

<!-- app 3 -->
<rect x="792" y="300" width="296" height="200" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="940" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#291c0e">Application 3</text>
<text x="940" y="352" text-anchor="middle" font-size="12.5" fill="#3d6b6b">AES-128 keys · own access rights</text>
<line x1="810" y1="364" x2="1070" y2="364" stroke="#e6dfd2" stroke-width="1.4"/>
<rect x="810" y="376" width="260" height="32" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.2"/><text x="826" y="397" font-size="13" fill="#234a4a">File 0</text>
<rect x="810" y="414" width="260" height="32" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.2"/><text x="826" y="435" font-size="13" fill="#234a4a">File 1</text>
<rect x="810" y="452" width="260" height="32" rx="6" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.2"/><text x="826" y="473" font-size="13" fill="#234a4a">File 2</text>

<text x="600" y="528" text-anchor="middle" font-size="14" font-weight="700" fill="#234a4a">…and so on — up to 28 independent applications, each with its own keys.</text>
<text x="600" y="560" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Where Classic shares one flat sector array, DESFire walls each app behind its own AES-128 keys —</text>
<text x="600" y="582" text-anchor="middle" font-size="14.5" fill="#5c5c5c">with mutual authentication and secure messaging on every access.</text>
</svg>
