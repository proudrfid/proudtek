<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The RFID signal chain from reader to tag, with the connector as the top failure point</title>
<desc id="d">A left-to-right anatomy of the RFID signal path. A reader box connects through a coaxial cable to an antenna, which radiates to a passive tag. Two connector points, one at the reader port and one at the antenna port, are marked in red as the single most common hardware cause of zero reads. A red callout explains that loose or hand-tight SMA or RP-TNC connectors should be torqued to the manufacturer's specification. A footer notes that reads follow the antenna, so moving a known-good antenna and cable to a live port shows where the fault lives.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE RF SIGNAL CHAIN</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Where a dead read usually lives</text>
<text x="600" y="134" text-anchor="middle" font-size="15.5" fill="#4f4f4f">Reader to cable to connector to antenna to tag — trace it in that order.</text>

<!-- cable -->
<line x1="262" y1="330" x2="470" y2="330" stroke="#4a5568" stroke-width="9"/>
<line x1="262" y1="330" x2="470" y2="330" stroke="#7a869a" stroke-width="3"/>
<text x="366" y="306" text-anchor="middle" font-size="13" fill="#5c5c5c">coaxial cable — breaks hide inside</text>

<!-- reader -->
<rect x="78" y="266" width="150" height="128" rx="12" fill="#f4f6f8" stroke="#4a5568" stroke-width="1.8"/>
<text x="153" y="316" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.3" fill="#3a4658">READER</text>
<rect x="116" y="342" width="22" height="16" rx="2" fill="#4a5568"/><rect x="168" y="342" width="22" height="16" rx="2" fill="#4a5568"/>
<text x="153" y="420" text-anchor="middle" font-size="12.5" fill="#5c5c5c">is the right port enabled?</text>

<!-- antenna -->
<rect x="520" y="266" width="150" height="128" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="595" y="316" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.3" fill="#234a4a">ANTENNA</text>
<rect x="583" y="338" width="24" height="22" rx="2" fill="#3d6b6b"/>
<text x="595" y="420" text-anchor="middle" font-size="12.5" fill="#5c5c5c">right one, right port</text>

<!-- waves -->
<path d="M694 312 A 20 20 0 0 1 694 348" fill="none" stroke="#2c5454" stroke-width="2.6"/>
<path d="M706 300 A 32 32 0 0 1 706 360" fill="none" stroke="#3d6b6b" stroke-width="2.4"/>
<path d="M718 288 A 44 44 0 0 1 718 372" fill="none" stroke="#3d6b6b" stroke-width="2.2"/>

<!-- tag -->
<rect x="862" y="288" width="168" height="84" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.8"/>
<rect x="880" y="308" width="46" height="46" rx="4" fill="none" stroke="#b98f4e" stroke-width="2"/>
<rect x="889" y="317" width="28" height="28" rx="2" fill="none" stroke="#b98f4e" stroke-width="1.4"/>
<rect x="916" y="324" width="13" height="13" fill="#2c5454"/>
<text x="978" y="336" text-anchor="middle" font-size="17" font-weight="800" fill="#3a4658">TAG</text>
<text x="946" y="420" text-anchor="middle" font-size="12.5" fill="#5c5c5c">known-good tag?</text>

<!-- connector watch-points (red) -->
<circle cx="250" cy="330" r="11" fill="#8b2d2d"/><circle cx="250" cy="330" r="4.4" fill="#ffffff"/>
<circle cx="492" cy="330" r="11" fill="#8b2d2d"/><circle cx="492" cy="330" r="4.4" fill="#ffffff"/>

<!-- callout lines from connectors to the callout box -->
<line x1="250" y1="342" x2="250" y2="452" stroke="#c58c8c" stroke-width="1.6" stroke-dasharray="4 4"/>
<line x1="492" y1="342" x2="470" y2="452" stroke="#c58c8c" stroke-width="1.6" stroke-dasharray="4 4"/>

<!-- red callout -->
<rect x="150" y="454" width="470" height="120" rx="14" fill="#fbeeee" stroke="#e3b8b8" stroke-width="1.6"/>
<text x="180" y="488" font-size="13" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">#1 HARDWARE CAUSE</text>
<text x="180" y="518" font-size="15.5" font-weight="700" fill="#291c0e">Loose or hand-tight SMA / RP-TNC connectors</text>
<text x="180" y="544" font-size="14" fill="#4f4f4f">Torque to the manufacturer's spec — hand-tight is</text>
<text x="180" y="562" font-size="14" fill="#4f4f4f">not enough, at either the reader or the antenna port.</text>

<!-- teal note on the right -->
<rect x="654" y="454" width="482" height="120" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<text x="684" y="488" font-size="13" font-weight="800" letter-spacing="0.5" fill="#234a4a">FAST ISOLATION</text>
<text x="684" y="518" font-size="15.5" font-weight="700" fill="#291c0e">Reads follow the antenna.</text>
<text x="684" y="544" font-size="14" fill="#4f4f4f">Move a known-good antenna and cable to a live port —</text>
<text x="684" y="562" font-size="14" fill="#4f4f4f">whichever side the reads follow is the healthy one.</text>

<text x="600" y="620" text-anchor="middle" font-size="14.5" fill="#5c5c5c">A coaxial cable that's been pinched, sharply bent, or rodent-chewed can break where nothing shows on the outside.</text>
</svg>
