<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Why RFID cuts retail shrinkage: shrinking the blind window from months to days</title>
<desc id="d">A before-and-after of loss detection. On the left, a barcode store: the blind window between counts is months, so loss is discovered at the annual count when the trail is cold. On the right, an RFID store: the blind window is 1 to 7 days, so loss is timestamped to a shift or a single transaction. A result band shows 50 to 80 percent shrinkage reduction with item-level RFID, count accuracy of 95 to 99 percent, and elimination of phantom stock that causes 25 to 40 percent of out-of-stock events.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID RETAIL SHRINKAGE REDUCTION</text>
<text x="600" y="94" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="33" font-weight="700" fill="#291c0e">The loss you can't see until you count</text>
<text x="600" y="124" text-anchor="middle" font-size="15.5" fill="#4f4f4f">RFID shrinks the blind window from months to days — and the shrinkage with it.</text>
<rect x="88" y="158" width="488" height="212" rx="14" fill="#ffffff" stroke="#c3c9d4" stroke-width="1.8"/>
<rect x="88" y="158" width="488" height="8" rx="4" fill="#4a5568"/>
<text x="332" y="202" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#4a5568">BARCODE STORE</text>
<text x="332" y="226" text-anchor="middle" font-size="13" fill="#8a8a8a">counts once a year</text>
<text x="332" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#5c5c5c">blind window</text>
<text x="332" y="300" text-anchor="middle" font-size="34" font-weight="800" fill="#8b2d2d">months</text>
<text x="332" y="342" text-anchor="middle" font-size="13" fill="#291c0e">Loss shows up at the annual count —</text>
<text x="332" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">by then the trail is cold</text>
<rect x="624" y="158" width="488" height="212" rx="14" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.8"/>
<rect x="624" y="158" width="488" height="8" rx="4" fill="#1f6f3a"/>
<text x="868" y="202" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#2c5454">RFID STORE</text>
<text x="868" y="226" text-anchor="middle" font-size="13" fill="#6a8a8a">counts continuously</text>
<text x="868" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#5c5c5c">blind window</text>
<text x="868" y="300" text-anchor="middle" font-size="34" font-weight="800" fill="#1f6f3a">1–7 days</text>
<text x="868" y="342" text-anchor="middle" font-size="13" fill="#291c0e">Loss timestamped to a shift</text>
<text x="868" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6f3a">or a single transaction</text>
<line x1="580" y1="264" x2="610" y2="264" stroke="#c39a5f" stroke-width="5"/>
<polygon points="620,264 606,256 606,272" fill="#c39a5f"/>
<rect x="88" y="398" width="1024" height="168" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/>
<text x="148" y="490" font-size="58" font-weight="800" fill="#1f6f3a">50–80%</text>
<text x="150" y="528" font-size="16" font-weight="700" fill="#291c0e">shrinkage reduction — item-level RFID</text>
<line x1="516" y1="422" x2="516" y2="542" stroke="#a9cfb5" stroke-width="2"/>
<text x="552" y="468" font-size="15.5" font-weight="700" fill="#291c0e">Count accuracy:  95–99%</text>
<text x="552" y="504" font-size="15.5" font-weight="700" fill="#291c0e">Detection:  months → 1–7 days</text>
<text x="552" y="540" font-size="15.5" font-weight="700" fill="#291c0e">Phantom stock (25–40% of OOS):  gone</text>
<text x="600" y="608" text-anchor="middle" font-size="14.5" fill="#4f4f4f">RFID rarely catches the thief in the act — it just refuses to let the loss stay invisible.</text>
</svg>
