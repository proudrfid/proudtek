<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">A 90-day post-breach remediation timeline</title>
<desc id="d">Five phases along a timeline. Days 0 to 7, contain and document: lock high-value zones, extend camera retention to 90 days, and export logs to a tamper-evident file. Days 7 to 30, design the target architecture: audit readers and firmware, pick the credential family, and get an itemized migration quote. Days 30 to 60, pilot one zone: convert one wing first in dual-credential mode for two weeks and validate enrollment. Days 60 to 90, roll out and sunset legacy: floor by floor, set a hard legacy-off date, and shred retired cards. Ongoing: run annual clone-attempt penetration tests and track vendor security advisories.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">90-DAY REMEDIATION · READERS AND CARDS TOGETHER</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Swap readers and credentials together, one zone at a time — never piecemeal.</text>

<line x1="120" y1="340" x2="1080" y2="340" stroke="#c39a5f" stroke-width="3"/>

<!-- node 1 above -->
<line x1="180" y1="340" x2="180" y2="300" stroke="#8b2d2d" stroke-width="2"/>
<circle cx="180" cy="340" r="13" fill="#8b2d2d"/>
<rect x="84" y="158" width="196" height="142" rx="11" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.8"/>
<text x="100" y="186" font-size="15" font-weight="800" fill="#8b2d2d">Days 0–7</text>
<text x="100" y="207" font-size="12.5" font-weight="700" fill="#291c0e">Contain + document</text>
<text x="100" y="234" font-size="12.5" fill="#4f4f4f">Lock high-value zones</text>
<text x="100" y="256" font-size="12.5" fill="#4f4f4f">90-day camera retention</text>
<text x="100" y="278" font-size="12.5" fill="#4f4f4f">Tamper-evident log export</text>

<!-- node 2 below -->
<line x1="400" y1="340" x2="400" y2="380" stroke="#c39a5f" stroke-width="2"/>
<circle cx="400" cy="340" r="13" fill="#c39a5f"/>
<rect x="304" y="380" width="196" height="142" rx="11" fill="#f7edd6" stroke="#c39a5f" stroke-width="1.8"/>
<text x="320" y="408" font-size="15" font-weight="800" fill="#6d5a3a">Days 7–30</text>
<text x="320" y="429" font-size="12.5" font-weight="700" fill="#291c0e">Design the target</text>
<text x="320" y="456" font-size="12.5" fill="#4f4f4f">Reader + firmware audit</text>
<text x="320" y="478" font-size="12.5" fill="#4f4f4f">Pick credential family</text>
<text x="320" y="500" font-size="12.5" fill="#4f4f4f">Itemized migration quote</text>

<!-- node 3 above -->
<line x1="620" y1="340" x2="620" y2="300" stroke="#3d6b6b" stroke-width="2"/>
<circle cx="620" cy="340" r="13" fill="#3d6b6b"/>
<rect x="524" y="158" width="196" height="142" rx="11" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<text x="540" y="186" font-size="15" font-weight="800" fill="#3d6b6b">Days 30–60</text>
<text x="540" y="207" font-size="12.5" font-weight="700" fill="#291c0e">Pilot one zone</text>
<text x="540" y="234" font-size="12.5" fill="#4f4f4f">Convert one wing first</text>
<text x="540" y="256" font-size="12.5" fill="#4f4f4f">Dual-credential, 2 weeks</text>
<text x="540" y="278" font-size="12.5" fill="#4f4f4f">Validate enrollment</text>

<!-- node 4 below -->
<line x1="840" y1="340" x2="840" y2="380" stroke="#1f6f3a" stroke-width="2"/>
<circle cx="840" cy="340" r="13" fill="#1f6f3a"/>
<rect x="744" y="380" width="196" height="142" rx="11" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="1.8"/>
<text x="760" y="408" font-size="15" font-weight="800" fill="#1f6f3a">Days 60–90</text>
<text x="760" y="429" font-size="12.5" font-weight="700" fill="#291c0e">Rollout + sunset</text>
<text x="760" y="456" font-size="12.5" fill="#4f4f4f">Floor by floor</text>
<text x="760" y="478" font-size="12.5" fill="#4f4f4f">Hard legacy-off date</text>
<text x="760" y="500" font-size="12.5" fill="#4f4f4f">Shred retired cards</text>

<!-- node 5 above -->
<line x1="1040" y1="340" x2="1040" y2="300" stroke="#4a5568" stroke-width="2"/>
<circle cx="1040" cy="340" r="13" fill="#4a5568"/>
<rect x="944" y="158" width="192" height="142" rx="11" fill="#eef1f5" stroke="#4a5568" stroke-width="1.8"/>
<text x="960" y="186" font-size="15" font-weight="800" fill="#4a5568">Ongoing</text>
<text x="960" y="207" font-size="12.5" font-weight="700" fill="#291c0e">Monitor + re-test</text>
<text x="960" y="234" font-size="12.5" fill="#4f4f4f">Annual clone-attempt test</text>
<text x="960" y="256" font-size="12.5" fill="#4f4f4f">Track vendor advisories</text>

<text x="600" y="600" text-anchor="middle" font-size="15" fill="#5c5c5c">A slow, partial response leaves the original hole open for months.</text>
</svg>
