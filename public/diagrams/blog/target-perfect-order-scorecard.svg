<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID read rate is one of four metrics inside Target's Perfect Order Program</title>
<desc id="d">Target's Perfect Order Program, expanded in May 2025, wraps RFID compliance inside a four-metric scorecard. ASN Availability requires an error-free EDI 856 on every purchase order. ASN Accuracy requires the ASN data to match Target's item data exactly. Physical Barcode Accuracy carries a 75-cent fee per non-compliant carton with a 100-dollar minimum threshold. RFID Read Rate is the scorecard suppliers already track — but it is only one metric of four. Fixing RFID alone leaves the other three, plus OTIF late-arrival fees, still billing against the shipment.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TARGET RFID · PERFECT ORDER PROGRAM</text>
<text x="600" y="100" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">RFID is one metric of four</text>
<text x="600" y="132" text-anchor="middle" font-size="16" fill="#4f4f4f">The Perfect Order scorecard wraps read rate inside ASN and barcode accuracy — added May 2025.</text>

<!-- container -->
<rect x="120" y="170" width="960" height="356" rx="16" fill="#faf7f0" stroke="#e4c98f" stroke-width="2"/>
<text x="150" y="206" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PERFECT ORDER PROGRAM</text>
<rect x="828" y="188" width="232" height="28" rx="14" fill="#ffffff" stroke="#e4c98f" stroke-width="1.3"/>
<text x="944" y="207" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EXPANDED MAY 2025</text>

<!-- Tile 1 -->
<rect x="150" y="240" width="440" height="118" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="174" y="284" font-size="17" font-weight="800" fill="#291c0e">ASN Availability</text>
<text x="174" y="314" font-size="13" fill="#4f4f4f">Error-free EDI 856 required on every PO.</text>

<!-- Tile 2 -->
<rect x="610" y="240" width="440" height="118" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="634" y="284" font-size="17" font-weight="800" fill="#291c0e">ASN Accuracy</text>
<text x="634" y="314" font-size="13" fill="#4f4f4f">ASN data must match Target's item data exactly.</text>

<!-- Tile 3 -->
<rect x="150" y="378" width="440" height="118" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="174" y="422" font-size="17" font-weight="800" fill="#291c0e">Physical Barcode Accuracy</text>
<text x="174" y="452" font-size="13" fill="#4f4f4f">$0.75 / non-compliant carton</text>
<text x="174" y="476" font-size="13" fill="#4f4f4f">$100 minimum threshold.</text>

<!-- Tile 4: RFID highlighted -->
<rect x="610" y="378" width="440" height="118" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="634" y="422" font-size="17" font-weight="800" fill="#234a4a">RFID Read Rate</text>
<text x="634" y="452" font-size="13" fill="#4f4f4f">The scorecard suppliers already track.</text>
<rect x="942" y="394" width="92" height="26" rx="13" fill="#3d6b6b"/>
<text x="988" y="411" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">1 OF 4</text>

<text x="600" y="562" text-anchor="middle" font-size="14" fill="#4f4f4f">Fix RFID alone and the other three still bill you — plus OTIF late-fees stack on top.</text>
</svg>
