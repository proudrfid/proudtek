<rect x="664" y="332" width="20" height="20" rx="3" fill="#e9e2d5"/>
<rect x="804" y="318" width="308" height="48" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<text x="958" y="347" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c5454">&gt;2000 Oe at contact</text>

<!-- row 4 EAS gate -->
<rect x="64" y="390" width="1072" height="72" rx="12" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.5"/>
<rect x="64" y="390" width="9" height="72" rx="4" fill="#8b2d2d"/>
<text x="96" y="421" font-size="15.5" font-weight="700" fill="#291c0e">Retail EAS deactivation gate</text>
<text x="96" y="442" font-size="12.5" fill="#5c5c5c">strong AC pulse at the store checkout</text>
<rect x="560" y="416" width="20" height="20" rx="3" fill="#8b2d2d"/>
<rect x="586" y="416" width="20" height="20" rx="3" fill="#8b2d2d"/>
<rect x="612" y="416" width="20" height="20" rx="3" fill="#8b2d2d"/>
<rect x="638" y="416" width="20" height="20" rx="3" fill="#8b2d2d"/>
<rect x="664" y="416" width="20" height="20" rx="3" fill="#8b2d2d"/>
<rect x="804" y="402" width="308" height="48" rx="10" fill="#ffffff" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="958" y="431" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8b2d2d">instant full erase</text>

<!-- row 5 MRI -->
<rect x="64" y="474" width="1072" height="72" rx="12" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.5"/>
<rect x="64" y="474" width="9" height="72" rx="4" fill="#8b2d2d"/>
<text x="96" y="505" font-size="15.5" font-weight="700" fill="#291c0e">MRI fringe field</text>
<text x="96" y="526" font-size="12.5" fill="#5c5c5c">medical-conference blocks, patient escorts</text>
<rect x="560" y="500" width="20" height="20" rx="3" fill="#8b2d2d"/>
<rect x="586" y="500" width="20" height="20" rx="3" fill="#8b2d2d"/>
<rect x="612" y="500" width="20" height="20" rx="3" fill="#8b2d2d"/>
