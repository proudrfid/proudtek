<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="myTitle myDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="myTitle">Five common NFC versus RFID myths, corrected</title>
  <desc id="myDesc">Five myths and their realities. One, the myth that NFC is brand-new: in reality it was created in 2002 by Sony, NXP and Nokia, older than the smartphone. Two, the myth that RFID reads you across a room: passive HF and NFC need 1 to 10 centimetres, and only UHF reaches 5 to 15 metres. Three, the myth that NFC is always more secure: security depends on the chip, not the band, and AES-128 beats a basic NTAG213. Four, the myth that NFC always needs an app: modern phones open NFC URLs natively. Five, the myth that NFC and RFID tags are interchangeable: an iPhone will not read UHF and a dock reader will not see NFC.</desc>
  <defs>
    <radialGradient id="myBg" cx="50%" cy="14%" r="94%"><stop offset="0%" stop-color="#f8f1e2"/><stop offset="100%" stop-color="#f3eee2"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#myBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="25" font-weight="800" letter-spacing="1.5" fill="#6d5a3a">FIVE NFC-vs-RFID MYTHS, POLITELY BUSTED</text>

  <!-- Row 1 -->
  <rect x="56" y="88" width="1088" height="94" rx="14" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="112" cy="135" r="30" fill="#8b2d2d"/><path d="M100 123 L124 147 M124 123 L100 147" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <text x="168" y="124" font-size="17.5" font-style="italic" fill="#8b2d2d">Myth: “NFC is brand-new technology.”</text>
  <text x="168" y="158" font-size="18" font-weight="700" fill="#291c0e">Reality: born in 2002 (Sony · NXP · Nokia) — it is older than the smartphone.</text>
  <rect x="960" y="114" width="150" height="42" rx="21" fill="#f3e3e3" stroke="#8b2d2d" stroke-width="1.5"/><text x="1035" y="141" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2d2d">BUSTED</text>

  <!-- Row 2 -->
  <rect x="56" y="192" width="1088" height="94" rx="14" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="112" cy="239" r="30" fill="#8b2d2d"/><path d="M100 227 L124 251 M124 227 L100 251" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <text x="168" y="228" font-size="17.5" font-style="italic" fill="#8b2d2d">Myth: “RFID can read you from across the room.”</text>
  <text x="168" y="262" font-size="18" font-weight="700" fill="#291c0e">Reality: passive HF/NFC needs 1–10 cm; only UHF reaches 5–15 m — with line of sight.</text>
  <rect x="960" y="218" width="150" height="42" rx="21" fill="#f3e3e3" stroke="#8b2d2d" stroke-width="1.5"/><text x="1035" y="245" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2d2d">BUSTED</text>

  <!-- Row 3 -->
  <rect x="56" y="296" width="1088" height="94" rx="14" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="112" cy="343" r="30" fill="#8b2d2d"/><path d="M100 331 L124 355 M124 331 L100 355" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <text x="168" y="332" font-size="17.5" font-style="italic" fill="#8b2d2d">Myth: “NFC is always more secure than UHF.”</text>
  <text x="168" y="366" font-size="18" font-weight="700" fill="#291c0e">Reality: security is the chip, not the band — AES-128 beats a basic NTAG213.</text>
  <rect x="960" y="322" width="150" height="42" rx="21" fill="#f3e3e3" stroke="#8b2d2d" stroke-width="1.5"/><text x="1035" y="349" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2d2d">BUSTED</text>

  <!-- Row 4 -->
  <rect x="56" y="400" width="1088" height="94" rx="14" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="112" cy="447" r="30" fill="#8b2d2d"/><path d="M100 435 L124 459 M124 435 L100 459" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <text x="168" y="436" font-size="17.5" font-style="italic" fill="#8b2d2d">Myth: “NFC always needs an app.”</text>
  <text x="168" y="470" font-size="18" font-weight="700" fill="#291c0e">Reality: modern phones (iOS 11+, Android 4+) open NFC URL tags natively — no app.</text>
  <rect x="960" y="426" width="150" height="42" rx="21" fill="#f3e3e3" stroke="#8b2d2d" stroke-width="1.5"/><text x="1035" y="453" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2d2d">BUSTED</text>

  <!-- Row 5 -->
  <rect x="56" y="504" width="1088" height="94" rx="14" fill="#fbf8f2" stroke="#e6dfd2" stroke-width="2"/>
  <circle cx="112" cy="551" r="30" fill="#8b2d2d"/><path d="M100 539 L124 563 M124 539 L100 563" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <text x="168" y="540" font-size="17.5" font-style="italic" fill="#8b2d2d">Myth: “NFC and RFID tags are interchangeable.”</text>
  <text x="168" y="574" font-size="18" font-weight="700" fill="#291c0e">Reality: an iPhone won't read UHF; a dock-door reader won't see NFC. Pick by job.</text>
  <rect x="960" y="530" width="150" height="42" rx="21" fill="#f3e3e3" stroke="#8b2d2d" stroke-width="1.5"/><text x="1035" y="557" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2d2d">BUSTED</text>
</svg>
