<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Magnetic-stripe versus RFID hotel key cards, side by side</title>
<desc id="d">A comparison of two hotel key-card technologies. On the left, the magnetic stripe: data on an iron-oxide strip read by a physical swipe, it demagnetises near phones and magnetic wallet clasps, front desks re-encode two or three replacement cards per stay, and lifespan is measured in weeks. On the right, RFID contactless: a chip and antenna tapped at 1 to 4 centimetres, immune to magnetic interference because data sits in silicon memory, mutual authentication makes cloning far harder than copying a magstripe track, and lifespan runs to years. Same PVC card, same pocket — only one survives a magnetic wallet clasp.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MAGSTRIPE VS RFID · WHY HOTELS SWITCHED</text>
<text x="600" y="102" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Two ways to store a room's secret</text>
<text x="600" y="138" text-anchor="middle" font-size="16" fill="#4f4f4f">One is a magnetic strip that forgets. The other is a chip that does not.</text>

<!-- Left panel: magstripe (failure state -> red) -->
<rect x="88" y="188" width="448" height="316" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="88" y="188" width="9" height="316" rx="4" fill="#8b2d2d"/>
<text x="122" y="228" font-size="19" font-weight="800" fill="#291c0e">Magnetic stripe</text>
<text x="122" y="251" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">THE OLD WAY</text>
<rect x="122" y="268" width="392" height="46" rx="7" fill="#faf3ef" stroke="#e6cfc7" stroke-width="1.3"/>
<rect x="122" y="281" width="392" height="20" fill="#3a2a20"/>
<text x="128" y="336" font-size="12.5" fill="#8a5a4a">iron-oxide data strip</text>
<circle cx="128" cy="366" r="4" fill="#8b2d2d"/>
<text x="142" y="371" font-size="14" fill="#333333">Physical swipe through a reader head</text>
<circle cx="128" cy="398" r="4" fill="#8b2d2d"/>
<text x="142" y="403" font-size="14" fill="#333333">Demagnetises near phones and magnets</text>
<circle cx="128" cy="430" r="4" fill="#8b2d2d"/>
<text x="142" y="435" font-size="14" fill="#333333">Re-encode 2–3 cards per guest stay</text>
<circle cx="128" cy="462" r="4" fill="#8b2d2d"/>
<text x="142" y="467" font-size="14" fill="#333333">Lifespan measured in weeks</text>

<!-- Right panel: RFID (good -> teal) -->
<rect x="664" y="188" width="448" height="316" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="664" y="188" width="9" height="316" rx="4" fill="#3d6b6b"/>
<text x="698" y="228" font-size="19" font-weight="800" fill="#291c0e">RFID contactless</text>
<text x="698" y="251" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#2c5454">THE HOTEL DEFAULT</text>
<rect x="698" y="268" width="392" height="46" rx="7" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.3"/>
<rect x="712" y="278" width="120" height="28" rx="6" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<rect x="724" y="285" width="96" height="14" rx="4" fill="none" stroke="#9dc0c0" stroke-width="1.6"/>
<path d="M 852 280 A 20 20 0 0 1 852 312" fill="none" stroke="#3d6b6b" stroke-width="2.4"/>
<path d="M 868 274 A 28 28 0 0 1 868 318" fill="none" stroke="#6a9a9a" stroke-width="2"/>
<text x="900" y="297" font-size="12.5" fill="#4a7a7a">chip + antenna, tap</text>
<circle cx="704" cy="366" r="4" fill="#3d6b6b"/>
<text x="718" y="371" font-size="14" fill="#333333">Tap at 1–4 cm, no moving contact</text>
<circle cx="704" cy="398" r="4" fill="#3d6b6b"/>
<text x="718" y="403" font-size="14" fill="#333333">Immune to magnetic interference</text>
<circle cx="704" cy="430" r="4" fill="#3d6b6b"/>
<text x="718" y="435" font-size="14" fill="#333333">Mutual authentication, hard to clone</text>
<circle cx="704" cy="462" r="4" fill="#3d6b6b"/>
<text x="718" y="467" font-size="14" fill="#333333">Lifespan measured in years</text>

<text x="600" y="556" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Same PVC card, same pocket.</text>
<text x="600" y="586" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Only one survives the trip through a wallet's magnetic clasp.</text>
</svg>
