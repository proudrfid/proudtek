<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Three NFC tag placements on a wine bottle: under capsule, behind back label, cork top</title>
<desc id="d">A wine bottle with three numbered placement options for an NFC tag. Option 1, under the aluminum capsule — the default for wine, totally invisible. Option 2, behind the back label — for spirits with longer-form back labels. Option 3, on the cork top — ultra-premium only, a flex, not a flaw. A physics note underneath says the aluminum capsule costs 6-10 dB of signal yet reads stay reliable, so field-test on real bottles. Caption: most drinkers never notice the tag.</desc>
