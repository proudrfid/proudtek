<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="s2t s2d" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
      <title id="s2t">The five inspection zones on an RFID factory floor, in material-flow order</title>
      <desc id="s2d">Five zones in sequence: raw-material storage (chip lots, climate control); inlay assembly line (chip-bonding, 200 to 1000 units per hour); the encoding station, which should sit physically segregated behind its own wall with access logs; the QC station (RF test gantry, 0.5 to 2 percent sample inspection); and the finished-goods warehouse (inventory mix and turnover).</desc>
      <defs><radialGradient id="bg2" cx="50%" cy="18%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
      <rect width="1200" height="675" fill="url(#bg2)"/>
      <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
      <text x="600" y="60" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="2.5" fill="#6d5a3a">WALK THE FLOOR IN FLOW ORDER</text>

      <!-- flow arrows in gaps -->
      <g fill="#c39a5f"><path d="M247 320 l22 0 0 -7 14 14 -14 14 0 -7 -22 0z"/><path d="M707 320 l22 0 0 -7 14 14 -14 14 0 -7 -22 0z"/><path d="M937 320 l22 0 0 -7 14 14 -14 14 0 -7 -22 0z"/></g>
      <!-- segregation wall before encoding (zone 3) -->
      <line x1="485" y1="130" x2="485" y2="512" stroke="#8b2d2d" stroke-width="2.5" stroke-dasharray="7 6"/>
      <text x="485" y="126" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1" fill="#8b2d2d">SECURED WALL</text>

      <!-- ZONE 1 raw material -->
      <g><rect x="40" y="150" width="200" height="340" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
        <circle cx="72" cy="186" r="17" fill="#6c5127"/><text x="72" y="192" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">1</text>
        <g transform="translate(140,240)"><rect x="-26" y="-8" width="24" height="24" rx="3" fill="#c39a5f"/><rect x="2" y="-8" width="24" height="24" rx="3" fill="#d4a755"/><rect x="-12" y="-30" width="24" height="24" rx="3" fill="#6c5127"/></g>
        <text x="140" y="322" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Raw-material</text>
        <text x="140" y="344" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">storage</text>
        <text x="140" y="382" text-anchor="middle" font-size="13" fill="#6d5a3a">chip lot numbers</text>
        <text x="140" y="402" text-anchor="middle" font-size="13" fill="#6d5a3a">match distributor</text>
        <text x="140" y="422" text-anchor="middle" font-size="13" fill="#6d5a3a">records; climate</text>
        <text x="140" y="442" text-anchor="middle" font-size="13" fill="#6d5a3a">control checked</text>
      </g>
      <!-- ZONE 2 inlay line -->
      <g><rect x="270" y="150" width="200" height="340" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
        <circle cx="302" cy="186" r="17" fill="#6c5127"/><text x="302" y="192" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">2</text>
        <g transform="translate(370,242)" fill="none" stroke="#6c5127" stroke-width="3.5"><circle cx="0" cy="0" r="16"/><path d="M0 -24 v8 M0 24 v-8 M-24 0 h8 M24 0 h-8 M-17 -17 l6 6 M17 17 l-6 -6 M17 -17 l-6 6 M-17 17 l6 -6"/><circle cx="0" cy="0" r="5" fill="#c39a5f" stroke="none"/></g>
        <text x="370" y="322" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Inlay</text>
        <text x="370" y="344" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">assembly line</text>
        <text x="370" y="382" text-anchor="middle" font-size="13" fill="#6d5a3a">chip-bonding,</text>
        <text x="370" y="402" text-anchor="middle" font-size="13" fill="#6d5a3a">antenna print,</text>
        <text x="370" y="422" text-anchor="middle" font-size="13" fill="#6d5a3a">lamination</text>
        <text x="370" y="444" text-anchor="middle" font-size="13" font-weight="700" fill="#177a92">200–1,000 UPH</text>
      </g>
      <!-- ZONE 3 encoding (segregated, highlighted) -->
      <g><rect x="500" y="150" width="200" height="340" rx="16" fill="#eaf9fe" stroke="#1fcefb" stroke-width="2.5"/>
        <circle cx="532" cy="186" r="17" fill="#127a92"/><text x="532" y="192" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">3</text>
        <rect x="592" y="170" width="92" height="26" rx="13" fill="#127a92"/><text x="638" y="188" text-anchor="middle" font-size="11" font-weight="700" letter-spacing=".5" fill="#fff">SEGREGATED</text>
        <g transform="translate(600,246)"><rect x="-18" y="-4" width="36" height="28" rx="4" fill="#127a92"/><path d="M-11 -4 v-8 a11 11 0 0 1 22 0 v8" fill="none" stroke="#127a92" stroke-width="4"/><circle cx="0" cy="9" r="4" fill="#fff"/></g>
        <text x="600" y="322" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Encoding</text>
        <text x="600" y="344" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">station</text>
        <text x="600" y="382" text-anchor="middle" font-size="13" fill="#0e5f73">physically separate</text>
        <text x="600" y="402" text-anchor="middle" font-size="13" fill="#0e5f73">from assembly;</text>
        <text x="600" y="422" text-anchor="middle" font-size="13" fill="#0e5f73">secured access logs;</text>
        <text x="600" y="442" text-anchor="middle" font-size="13" fill="#0e5f73">sample &amp; verify tags</text>
      </g>
      <!-- ZONE 4 QC -->
      <g><rect x="730" y="150" width="200" height="340" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
        <circle cx="762" cy="186" r="17" fill="#6c5127"/><text x="762" y="192" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">4</text>
        <g transform="translate(830,244)" fill="none" stroke="#2d6a4f" stroke-width="3.5"><path d="M-18 8 a18 18 0 1 1 36 0" /><line x1="0" y1="8" x2="12" y2="-6"/><circle cx="0" cy="8" r="3" fill="#2d6a4f" stroke="none"/></g>
        <text x="830" y="322" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">QC station</text>
        <text x="830" y="360" text-anchor="middle" font-size="13" fill="#6d5a3a">RF test gantry,</text>
        <text x="830" y="380" text-anchor="middle" font-size="13" fill="#6d5a3a">read-rate chamber</text>
        <text x="830" y="404" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6f3a">0.5–2% sample</text>
        <text x="830" y="426" text-anchor="middle" font-size="13" fill="#6d5a3a">(cheap floors skip</text>
        <text x="830" y="446" text-anchor="middle" font-size="13" fill="#6d5a3a">this and hope)</text>
      </g>
      <!-- ZONE 5 finished goods -->
      <g><rect x="960" y="150" width="200" height="340" rx="16" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
        <circle cx="992" cy="186" r="17" fill="#6c5127"/><text x="992" y="192" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">5</text>
        <g transform="translate(1060,238)"><rect x="-26" y="0" width="52" height="30" rx="3" fill="#c39a5f"/><rect x="-20" y="-14" width="18" height="18" rx="2" fill="#6c5127"/><rect x="2" y="-14" width="18" height="18" rx="2" fill="#d4a755"/></g>
        <text x="1060" y="322" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">Finished-goods</text>
        <text x="1060" y="344" text-anchor="middle" font-size="16.5" font-weight="800" fill="#291c0e">warehouse</text>
        <text x="1060" y="382" text-anchor="middle" font-size="13" fill="#6d5a3a">inventory mix &amp;</text>
        <text x="1060" y="402" text-anchor="middle" font-size="13" fill="#6d5a3a">turnover; aged</text>
        <text x="1060" y="422" text-anchor="middle" font-size="13" fill="#6d5a3a">stock = slow sales</text>
        <text x="1060" y="442" text-anchor="middle" font-size="13" fill="#6d5a3a">or rejects parked</text>
      </g>
      <text x="600" y="562" text-anchor="middle" font-size="15.5" fill="#6d5a3a">If the encoding station is mixed into open production, your serialised customer data is less a secret than a rumour.</text>
      <text x="600" y="600" text-anchor="middle" font-size="14" fill="#8a949c">Manual benches everywhere a modern line should be? The facility is small, aging, or borrowing capacity it doesn't have.</text>
    </svg>
