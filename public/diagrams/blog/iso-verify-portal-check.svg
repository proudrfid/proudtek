<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Portal lookup — a real certificate is searchable, a forgery is not</title>
<desc id="d">Two identical-looking certificates go through the same portal search. On the left, searching the certificate number returns a green result: record found — current, in scope, legal name matches the supplier. On the right, the visually identical certificate returns a red result: no record found, no third-party backing, walk away. Footnotes list the issuer portals — TUV Rheinland, SGS, BSI, DNV, Bureau Veritas — and the UKAS, ANAB and CNAS accreditation directories, noting that a certificate from a non-accredited body is worth nothing.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TRUST, THEN VERIFY · EVERY ISSUER RUNS A PUBLIC PORTAL</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">Search the number. Real certificates are found.</text>

<line x1="600" y1="132" x2="600" y2="540" stroke="#e6dfd2" stroke-width="2" stroke-dasharray="8 6"/>

<!-- left: real -->
<rect x="270" y="150" width="120" height="88" rx="8" fill="#ffffff" stroke="#2d6a4f" stroke-width="2"/>
<rect x="270" y="150" width="120" height="20" rx="8" fill="#2d6a4f"/>
<rect x="270" y="160" width="120" height="10" fill="#2d6a4f"/>
<rect x="284" y="180" width="70" height="6" rx="3" fill="#e3e0d8"/>
<rect x="284" y="193" width="90" height="5" rx="2.5" fill="#e3e0d8"/>
<rect x="284" y="204" width="80" height="5" rx="2.5" fill="#e3e0d8"/>
<circle cx="372" cy="222" r="9" fill="#d4a755"/>
<text x="330" y="262" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the certificate in the RFP</text>
<line x1="330" y1="274" x2="330" y2="296" stroke="#4f4f4f" stroke-width="2"/>
<path d="M 330 306 l -6 -10 h 12 z" fill="#4f4f4f"/>
<rect x="180" y="316" width="300" height="44" rx="22" fill="#ffffff" stroke="#cfe0e0" stroke-width="2"/>
<circle cx="209" cy="338" r="8" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<line x1="215" y1="344" x2="223" y2="352" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round"/>
<text x="236" y="343" font-size="13.5" fill="#4f4f4f">search the certificate number</text>
<line x1="330" y1="364" x2="330" y2="386" stroke="#4f4f4f" stroke-width="2"/>
<path d="M 330 396 l -6 -10 h 12 z" fill="#4f4f4f"/>
<rect x="160" y="404" width="340" height="110" rx="14" fill="#e8f4ec" stroke="#9fc9ae" stroke-width="2"/>
<circle cx="205" cy="459" r="20" fill="#1f6f3a"/>
<path d="M 195 459 l 7 7 l 15 -16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="240" y="444" font-size="15.5" font-weight="700" fill="#1f6f3a">Record found</text>
<text x="240" y="468" font-size="13" fill="#2c5454">current · in scope · legal name</text>
<text x="240" y="488" font-size="13" fill="#2c5454">matches the supplier</text>

<!-- right: fake -->
<rect x="810" y="150" width="120" height="88" rx="8" fill="#ffffff" stroke="#d9a89e" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="810" y="150" width="120" height="20" rx="8" fill="#2d6a4f"/>
<rect x="810" y="160" width="120" height="10" fill="#2d6a4f"/>
<rect x="824" y="180" width="70" height="6" rx="3" fill="#e3e0d8"/>
<rect x="824" y="193" width="90" height="5" rx="2.5" fill="#e3e0d8"/>
<rect x="824" y="204" width="80" height="5" rx="2.5" fill="#e3e0d8"/>
<circle cx="912" cy="222" r="9" fill="#d4a755"/>
<circle cx="930" cy="150" r="12" fill="#8b2d2d"/>
<text x="930" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">?</text>
<text x="870" y="262" text-anchor="middle" font-size="12.5" fill="#4f4f4f">an identical-looking certificate</text>
<line x1="870" y1="274" x2="870" y2="296" stroke="#4f4f4f" stroke-width="2"/>
<path d="M 870 306 l -6 -10 h 12 z" fill="#4f4f4f"/>
<rect x="720" y="316" width="300" height="44" rx="22" fill="#ffffff" stroke="#cfe0e0" stroke-width="2"/>
<circle cx="749" cy="338" r="8" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<line x1="755" y1="344" x2="763" y2="352" stroke="#3d6b6b" stroke-width="3" stroke-linecap="round"/>
<text x="776" y="343" font-size="13.5" fill="#4f4f4f">search the certificate number</text>
<line x1="870" y1="364" x2="870" y2="386" stroke="#4f4f4f" stroke-width="2"/>
<path d="M 870 396 l -6 -10 h 12 z" fill="#4f4f4f"/>
<rect x="700" y="404" width="340" height="110" rx="14" fill="#f7e3df" stroke="#d9a89e" stroke-width="2"/>
<circle cx="745" cy="459" r="20" fill="#8b2d2d"/>
<line x1="737" y1="451" x2="753" y2="467" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
<line x1="753" y1="451" x2="737" y2="467" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
<text x="780" y="444" font-size="15.5" font-weight="700" fill="#8b2d2d">No record found</text>
<text x="780" y="468" font-size="13" fill="#8b2d2d">no third-party backing</text>
<text x="780" y="488" font-size="13" font-weight="700" fill="#8b2d2d">walk away</text>

<text x="600" y="576" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Issuer portals: TUV Rheinland · SGS · BSI · DNV · Bureau Veritas — search by certificate number or company name</text>
<text x="600" y="602" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Accreditation directories: UKAS (UK) · ANAB (US) · CNAS (China) — a cert from a non-accredited body is worth nothing</text>
</svg>
