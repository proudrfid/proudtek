<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="heroTitle heroDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="heroTitle">Retained surgical sponge events fell from 2 to 0 after an RFID program</title>
  <desc id="heroDesc">A case-study scorecard. Retained surgical sponge (RSS) events dropped from 2 in the prior 12 months to 0 across the 18 months after go-live at a 380-bed Level II trauma center. Program vitals: 14 operating rooms plus 2 trauma bays equipped, a 9-month deployment, $410K all-in capex and about $8.40 per case, and 87% fewer Joint Commission count-documentation findings.</desc>
  <defs>
    <radialGradient id="heroBg" cx="50%" cy="18%" r="95%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#heroBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="1.5" fill="#6d5a3a">A REGIONAL HOSPITAL'S RSS SCORECARD</text>
  <line x1="600" y1="86" x2="600" y2="612" stroke="#efe6d5" stroke-width="2"/>

  <!-- LEFT: the 2 -> 0 story -->
  <text x="300" y="150" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.2" fill="#6d5a3a">RETAINED SURGICAL SPONGE (RSS) EVENTS</text>

  <text x="180" y="365" text-anchor="middle" font-size="165" font-weight="800" fill="#8b2d2d">2</text>
  <text x="180" y="410" text-anchor="middle" font-size="17" fill="#6d5a3a">in the prior</text>
  <text x="180" y="432" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">12 months</text>

  <!-- arrow -->
  <line x1="270" y1="315" x2="380" y2="315" stroke="#c39a5f" stroke-width="6" stroke-linecap="round"/>
  <path d="M380 315 l-20 -12 v24 z" fill="#c39a5f"/>

  <!-- RFID detection arcs behind the 0 -->
  <g fill="none" stroke="#1fcefb" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <path d="M553 268 a55 55 0 0 1 0 96"/>
    <path d="M573 250 a80 80 0 0 1 0 132"/>
  </g>
  <text x="470" y="365" text-anchor="middle" font-size="165" font-weight="800" fill="#1f6f3a">0</text>
  <text x="470" y="410" text-anchor="middle" font-size="17" fill="#6d5a3a">across the</text>
  <text x="470" y="432" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">18 months after go-live</text>

  <rect x="150" y="474" width="300" height="34" rx="17" fill="#e7f4ec" stroke="#1f6f3a" stroke-width="1.5"/>
  <text x="300" y="497" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6f3a">CMS "never event" — driven to zero</text>

  <!-- RIGHT: program vitals -->
  <rect x="676" y="132" width="452" height="392" rx="16" fill="#faf6ee" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="704" y="172" font-size="16" font-weight="800" letter-spacing="1.5" fill="#6d5a3a">PROGRAM VITALS</text>

  <g>
    <circle cx="714" cy="222" r="5" fill="#c39a5f"/>
    <text x="736" y="228" font-size="19" font-weight="600" fill="#291c0e">380-bed Level II trauma center</text>
    <circle cx="714" cy="278" r="5" fill="#c39a5f"/>
    <text x="736" y="284" font-size="19" font-weight="600" fill="#291c0e">14 ORs + 2 trauma bays equipped</text>
    <circle cx="714" cy="334" r="5" fill="#c39a5f"/>
    <text x="736" y="340" font-size="19" font-weight="600" fill="#291c0e">9-month deployment</text>
    <circle cx="714" cy="390" r="5" fill="#c39a5f"/>
    <text x="736" y="396" font-size="19" font-weight="600" fill="#291c0e">$410K all-in capex · +$8.40/case</text>
    <circle cx="714" cy="446" r="5" fill="#1fcefb"/>
    <text x="736" y="452" font-size="19" font-weight="600" fill="#177a92">87% fewer Joint Commission findings</text>
  </g>

  <text x="600" y="642" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Zero retained sponges across 18 months — down from two in the year before the program.</text>
</svg>
