<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Shenzhen to Brazil — freight lanes and the import-tax stack</title>
  <desc id="d">Freight from Shenzhen to Brazil: express air via DHL or FedEx reaches Guarulhos (Sao Paulo), Galeao (Rio de Janeiro) and Viracopos (Campinas) in 7-10 business days; sea freight serves bulk orders to Santos in 25-35 days. At import there is no China-Brazil free trade agreement, so the importer of record settles a cumulative tax stack — Import Duty (II) on the CIF value, then IPI, PIS/COFINS and state ICMS — via SISCOMEX under NCM 8523.52. Incoterms are EXW, FOB or CIF; DDP-to-door is uncommon.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SHENZHEN TO BRAZIL — LANES AND LANDED COST</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Air in 7-10 business days; no China-Brazil FTA — taxes settled by the importer of record</text>

  <!-- origin -->
  <rect x="70" y="200" width="180" height="90" rx="12" fill="#4a5568"/>
  <text x="160" y="238" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">SHENZHEN</text>
  <text x="160" y="262" text-anchor="middle" font-size="12.5" fill="#dfe4ea">one production line,</text>
  <text x="160" y="280" text-anchor="middle" font-size="12.5" fill="#dfe4ea">Brazil-spec sheets</text>

  <!-- air lane -->
  <line x1="250" y1="222" x2="470" y2="222" stroke="#3d6b6b" stroke-width="3"/>
  <polygon points="470,222 456,216 456,228" fill="#3d6b6b"/>
  <text x="360" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#3d6b6b">Air · DHL / FedEx · 7-10 days</text>
  <!-- sea lane -->
  <line x1="250" y1="268" x2="470" y2="268" stroke="#8a6d3b" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="470,268 456,262 456,274" fill="#8a6d3b"/>
  <text x="360" y="290" text-anchor="middle" font-size="13" fill="#8a6d3b">Sea · Santos · 25-35 days · bulk</text>

  <!-- destinations -->
  <rect x="480" y="150" width="230" height="196" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="595" y="180" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">BRAZIL</text>
  <text x="595" y="208" text-anchor="middle" font-size="13.5" fill="#291c0e">Guarulhos · Sao Paulo</text>
  <text x="595" y="230" text-anchor="middle" font-size="13.5" fill="#291c0e">Galeao · Rio de Janeiro</text>
  <text x="595" y="252" text-anchor="middle" font-size="13.5" fill="#291c0e">Viracopos · Campinas</text>
  <text x="595" y="288" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Free sample kits ship</text>
  <text x="595" y="306" text-anchor="middle" font-size="12.5" fill="#5c5c5c">to Brazilian addresses first</text>

  <!-- at import -->
  <rect x="740" y="150" width="390" height="196" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="760" y="180" font-size="15" font-weight="800" letter-spacing="0.3" fill="#6d5a3a">AT IMPORT — NO CHINA-BRAZIL FTA</text>
  <text x="760" y="208" font-size="13.5" fill="#291c0e">Cumulative stack on CIF: II, then IPI,</text>
  <text x="760" y="228" font-size="13.5" fill="#291c0e">PIS/COFINS and state ICMS</text>
  <text x="760" y="254" font-size="13.5" fill="#291c0e">NCM 8523.52 · filed via SISCOMEX (DI)</text>
  <text x="760" y="280" font-size="13.5" fill="#291c0e">Importer of record settles the taxes</text>
  <text x="760" y="306" font-size="12.5" fill="#5c5c5c">Incoterms EXW / FOB / CIF · rates vary</text>
  <text x="760" y="324" font-size="12.5" fill="#5c5c5c">by NCM and destination-state ICMS</text>

  <rect x="70" y="400" width="1060" height="86" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="92" y="430" font-size="15" font-weight="700" fill="#2c5454">Time zones work in your favour</text>
  <text x="92" y="453" font-size="13.5" fill="#3d6b6b">Shenzhen and Brazil are about half a day apart, so an RFQ sent at close of business is usually quoted by your next morning.</text>
  <text x="92" y="473" font-size="13.5" fill="#5c5c5c">There is no FTA to fold into a DDP price — your customs broker files the DI and settles duty and taxes at clearance.</text>

  <text x="600" y="536" text-anchor="middle" font-size="13" fill="#9aa4b2">Transit figures are indicative and tax rates vary by NCM and state; confirm lead time, Incoterm and landed cost on your quote.</text>
</svg>
