<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Dock-door portal read geometry for runner-embedded pallet tags</title>
<desc id="d">Front elevation of a dock-door RFID portal. Two uprights carry a 4-port reader with circularly polarized antennas: a mid pair at load height and a low pair aimed at runner height. A pallet with its tag module in the bottom runner foot — centimetres off the concrete — crosses the threshold at up to 10 kilometres per hour. Dashed read lobes show the low pair covering the floor plane where the tag rides; a red dashed strip on the floor marks the zone that case-height-only antenna arrays leave dark. A stats column lists the portal numbers: 60 to 120 pallets per hour per lane, 99.5 percent plus read rate at pool-lane speed, forklift speed up to 10 kilometres per hour through the door, and 1 to 3 metres read through HDPE, polypropylene or composite runner material. Footer: the air interface is GS1 EPC Gen2v2, ISO/IEC 18000-63 Type C; deep-stacked trailer positions read lower, so antennas are placed for the site handling configuration.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DOCK-DOOR PORTAL READ GEOMETRY</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">The tag crosses at ankle height — aim low</text>

<!-- ── SCENE: portal front elevation ── -->
<text x="410" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">4-port reader — circularly polarized antennas</text>

<!-- floor -->
<path d="M 70 540 H 810" stroke="#4a5568" stroke-width="2.5"/>

<!-- uprights -->
<rect x="120" y="170" width="24" height="370" rx="4" fill="#f1eee6" stroke="#4a5568" stroke-width="2"/>
<rect x="676" y="170" width="24" height="370" rx="4" fill="#f1eee6" stroke="#4a5568" stroke-width="2"/>

<!-- antennas: mid pair (load height) -->
<rect x="148" y="280" width="36" height="60" rx="6" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<rect x="636" y="280" width="36" height="60" rx="6" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
<!-- antennas: low pair (runner height) -->
<rect x="148" y="450" width="36" height="60" rx="6" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>
<rect x="636" y="450" width="36" height="60" rx="6" fill="#3d6b6b" stroke="#2c5454" stroke-width="2"/>

<!-- read lobes -->
<ellipse cx="410" cy="316" rx="215" ry="54" fill="none" stroke="#9fc0c0" stroke-width="1.8" stroke-dasharray="6 5"/>
<ellipse cx="410" cy="498" rx="222" ry="44" fill="none" stroke="#3d6b6b" stroke-width="2" stroke-dasharray="7 5"/>

<!-- load boxes -->
<rect x="322" y="398" width="176" height="68" rx="4" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<rect x="334" y="330" width="152" height="66" rx="4" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>

<!-- pallet -->
<rect x="310" y="468" width="200" height="14" rx="3" fill="#fdf8ee" stroke="#4a5568" stroke-width="2"/>
<rect x="310" y="482" width="34" height="28" rx="3" fill="#fdf8ee" stroke="#4a5568" stroke-width="2"/>
<rect x="393" y="482" width="34" height="28" rx="3" fill="#fdf8ee" stroke="#4a5568" stroke-width="2"/>
<rect x="476" y="482" width="34" height="28" rx="3" fill="#fdf8ee" stroke="#4a5568" stroke-width="2"/>
<rect x="310" y="510" width="200" height="12" rx="3" fill="#fdf8ee" stroke="#4a5568" stroke-width="2"/>
<!-- tag module in runner -->
<rect x="400" y="512" width="20" height="8" rx="2" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>

<!-- tag callout -->
<path d="M 404 522 L 300 585" stroke="#6d5a3a" stroke-width="1.4"/>
<text x="90" y="600" font-size="13" fill="#291c0e">tag rides in the runner — just off the concrete</text>

<!-- red blind strip -->
<rect x="545" y="474" width="80" height="60" rx="6" fill="none" stroke="#8b2d2d" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M 585 534 L 628 566" stroke="#8b2d2d" stroke-width="1.4"/>
<text x="640" y="580" text-anchor="middle" font-size="12.5" fill="#8b2d2d">case-height-only arrays</text>
<text x="640" y="598" text-anchor="middle" font-size="12.5" fill="#8b2d2d">leave this strip dark</text>

<!-- travel arrow -->
<path d="M 100 558 H 180" stroke="#4a5568" stroke-width="2.5"/>
<path d="M 180 558 l -12 -7 v 14 Z" fill="#4a5568"/>
<text x="200" y="563" font-size="12.5" fill="#4f4f4f">up to 10 km/h</text>

<!-- ── STATS COLUMN ── -->
<rect x="872" y="140" width="276" height="440" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="1010" y="172" text-anchor="middle" font-size="17" font-weight="800" fill="#6d5a3a">PORTAL NUMBERS</text>

<rect x="888" y="188" width="244" height="86" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="1010" y="228" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">60–120</text>
<text x="1010" y="254" text-anchor="middle" font-size="12.5" fill="#4f4f4f">pallets / hour / lane</text>

<rect x="888" y="282" width="244" height="86" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="1010" y="322" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">99.5 %+</text>
<text x="1010" y="348" text-anchor="middle" font-size="12.5" fill="#4f4f4f">read rate at pool-lane speed</text>

<rect x="888" y="376" width="244" height="86" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="1010" y="416" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">10 km/h</text>
<text x="1010" y="442" text-anchor="middle" font-size="12.5" fill="#4f4f4f">forklift speed through the door</text>

<rect x="888" y="470" width="244" height="86" rx="10" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="1010" y="510" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">1–3 m</text>
<text x="1010" y="536" text-anchor="middle" font-size="12.5" fill="#4f4f4f">through HDPE / PP / composite</text>

<!-- footer -->
<text x="600" y="620" text-anchor="middle" font-size="13" fill="#4f4f4f">Air interface: GS1 EPC Gen2v2 / ISO/IEC 18000-63 Type C</text>
<text x="600" y="640" text-anchor="middle" font-size="12.5" fill="#4f4f4f">deep-stacked trailer positions read lower — place antennas for your handling configuration</text>
</svg>
