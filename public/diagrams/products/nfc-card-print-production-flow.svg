<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Production flow for custom-printed NFC cards: three approval gates, then the factory sequence</title>
  <desc id="d">Two-band flow diagram. Top band, the buyer's three approval gates: gate 1 soft proof (PDF layout, copy and color intent), gate 2 hard proof (inkjet match print for Pantone-critical color), gate 3 pre-production sample (finished card approved before the volume run releases). An arrow labelled volume run released leads to the bottom band, the factory sequence on one line: preflight and plates, print (offset or UV digital), laminate and finish, punch and encode (ID-1 die cut plus chip data matched to manifest), then QC, pack and ship with match report and DDP or FOB terms. A footer shows lead times: offset runs of 500-10,000 cards ship 10-15 working days after sign-off; UV digital short runs ship in 7-10 working days; and a caution that changes after plate burn cost a rerun, not a revision.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6d5a3a"/>
    </marker>
    <marker id="arwT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d6b6b"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FROM ARTWORK SIGN-OFF TO LOADING DOCK</text>
  <text x="600" y="100" text-anchor="middle" font-size="34" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">Three gates, then the machines take over</text>

  <!-- Band 1: approval gates -->
  <text x="70" y="146" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">YOUR APPROVAL GATES — CHANGES COST NOTHING HERE</text>

  <rect x="70" y="162" width="330" height="88" rx="12" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="90" y="192" font-size="15.5" font-weight="700" fill="#291c0e">Gate 1 — Soft proof</text>
  <text x="90" y="214" font-size="13" fill="#4f4f4f">PDF layout proof: layout, copy</text>
  <text x="90" y="232" font-size="13" fill="#4f4f4f">and color intent signed off</text>
  <line x1="404" y1="206" x2="431" y2="206" stroke="#6d5a3a" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="435" y="162" width="330" height="88" rx="12" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="455" y="192" font-size="15.5" font-weight="700" fill="#291c0e">Gate 2 — Hard proof</text>
  <text x="455" y="214" font-size="13" fill="#4f4f4f">Inkjet match print approves</text>
  <text x="455" y="232" font-size="13" fill="#4f4f4f">Pantone-critical color</text>
  <line x1="769" y1="206" x2="796" y2="206" stroke="#6d5a3a" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="800" y="162" width="330" height="88" rx="12" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="820" y="192" font-size="15.5" font-weight="700" fill="#291c0e">Gate 3 — Pre-production sample</text>
  <text x="820" y="214" font-size="13" fill="#4f4f4f">A finished card off the real process,</text>
  <text x="820" y="232" font-size="13" fill="#4f4f4f">approved before volume release</text>

  <!-- Release arrow -->
  <line x1="600" y1="258" x2="600" y2="296" stroke="#3d6b6b" stroke-width="2.5" marker-end="url(#arwT)"/>
  <rect x="466" y="264" width="268" height="26" rx="13" fill="#3d6b6b"/>
  <text x="600" y="282" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">VOLUME RUN RELEASED</text>

  <!-- Band 2: factory sequence -->
  <text x="70" y="330" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#2c5454">PRODUCTION SEQUENCE — ONE SPEC, ONE QC SIGN-OFF</text>

  <rect x="70" y="346" width="196" height="108" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="86" y="376" font-size="15" font-weight="700" fill="#2c5454">1 · Preflight</text>
  <text x="86" y="398" font-size="12.5" fill="#4f4f4f">Artwork check, plate</text>
  <text x="86" y="416" font-size="12.5" fill="#4f4f4f">burn or digital RIP</text>
  <line x1="270" y1="400" x2="293" y2="400" stroke="#3d6b6b" stroke-width="2" marker-end="url(#arwT)"/>

  <rect x="297" y="346" width="196" height="108" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="313" y="376" font-size="15" font-weight="700" fill="#2c5454">2 · Print</text>
  <text x="313" y="398" font-size="12.5" fill="#4f4f4f">Sheet-fed offset or</text>
  <text x="313" y="416" font-size="12.5" fill="#4f4f4f">UV digital inkjet</text>
  <line x1="497" y1="400" x2="520" y2="400" stroke="#3d6b6b" stroke-width="2" marker-end="url(#arwT)"/>

  <rect x="524" y="346" width="196" height="108" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="540" y="376" font-size="15" font-weight="700" fill="#2c5454">3 · Laminate, finish</text>
  <text x="540" y="398" font-size="12.5" fill="#4f4f4f">Overlay, spot UV,</text>
  <text x="540" y="416" font-size="12.5" fill="#4f4f4f">foil, emboss</text>
  <line x1="724" y1="400" x2="747" y2="400" stroke="#3d6b6b" stroke-width="2" marker-end="url(#arwT)"/>

  <rect x="751" y="346" width="196" height="108" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="767" y="376" font-size="15" font-weight="700" fill="#2c5454">4 · Punch, encode</text>
  <text x="767" y="398" font-size="12.5" fill="#4f4f4f">ID-1 die cut; chip data</text>
  <text x="767" y="416" font-size="12.5" fill="#4f4f4f">matched to manifest</text>
  <line x1="951" y1="400" x2="974" y2="400" stroke="#3d6b6b" stroke-width="2" marker-end="url(#arwT)"/>

  <rect x="978" y="346" width="152" height="108" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="994" y="376" font-size="15" font-weight="700" fill="#2c5454">5 · QC, ship</text>
  <text x="994" y="398" font-size="12.5" fill="#4f4f4f">Match report,</text>
  <text x="994" y="416" font-size="12.5" fill="#4f4f4f">DDP / FOB</text>

  <!-- Footer: lead times + risk note -->
  <line x1="70" y1="490" x2="1130" y2="490" stroke="#e6dfd2" stroke-width="2"/>

  <rect x="70" y="514" width="330" height="104" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
  <text x="90" y="546" font-size="15" font-weight="700" fill="#2c5454">Offset, 500-10,000 cards</text>
  <text x="90" y="572" font-size="24" font-weight="800" fill="#291c0e">10-15 working days</text>
  <text x="90" y="598" font-size="12.5" fill="#4f4f4f">after artwork sign-off</text>

  <rect x="424" y="514" width="330" height="104" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
  <text x="444" y="546" font-size="15" font-weight="700" fill="#2c5454">UV digital short runs</text>
  <text x="444" y="572" font-size="24" font-weight="800" fill="#291c0e">7-10 working days</text>
  <text x="444" y="598" font-size="12.5" fill="#4f4f4f">variable data included</text>

  <rect x="778" y="514" width="352" height="104" rx="12" fill="#ffffff" stroke="#8b2d2d" stroke-width="2"/>
  <text x="798" y="546" font-size="15" font-weight="700" fill="#8b2d2d">After plate burn</text>
  <text x="798" y="572" font-size="14" fill="#4f4f4f">changes cost a rerun, not a revision —</text>
  <text x="798" y="592" font-size="14" fill="#4f4f4f">spend your edits at the gates</text>
</svg>
