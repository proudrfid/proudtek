<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Macy's RFID beyond inventory — one tag, five downstream jobs</title>
<desc id="d">A shield with a check mark emits radar sweeps, representing what Macy's RFID program does beyond inventory accuracy. Five rows list the downstream jobs: ORC defense with an audit trail from receipt to point of sale for rapid loss triage; size-intensive replenishment covering roughly 30% of annual sales led by denim, intimates and footwear; ship-from-store and BOPIS needing 95% or better store accuracy, with RFID cutting cancellations 30-50%; a markdown engine fed by live floor counts for shallower seasonal markdowns; and Bloomingdale's parallel program with more premium chips and a tighter placement audit. A warning pill notes near-zero placement tolerance on high-theft denim and handbags.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY MACY'S REALLY CARES</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">One tag, five downstream jobs</text>

<g transform="translate(150,180)">
<path d="M80 8 L152 32 V120 C152 184 116 224 80 244 C44 224 8 184 8 120 V32 Z" fill="#2d6a4f"/>
<path d="M48 116 l26 26 42 -58" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</g>
<g stroke="#3d6b6b" fill="none" stroke-linecap="round">
<path d="M 310 300 m 50 0 a 50 50 0 0 1 -50 50" stroke-width="3.5" opacity="0.55"/>
<path d="M 310 300 m 80 0 a 80 80 0 0 1 -80 80" stroke-width="3" opacity="0.35"/>
<path d="M 310 300 m 110 0 a 110 110 0 0 1 -110 110" stroke-width="2.5" opacity="0.2"/>
</g>

<rect x="60" y="470" width="340" height="60" rx="12" fill="#fbeeee" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="230" y="495" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b2d2d">High-theft categories — denim, handbags:</text>
<text x="230" y="516" text-anchor="middle" font-size="13.5" fill="#8b2d2d">near-zero placement tolerance</text>

<circle cx="470" cy="210" r="7" fill="#2d6a4f"/>
<text x="492" y="216" font-size="17" font-weight="700" fill="#291c0e">ORC defense</text>
<text x="492" y="241" font-size="14" fill="#4f4f4f">audit trail from receipt → POS for rapid loss triage</text>

<circle cx="470" cy="285" r="7" fill="#3d6b6b"/>
<text x="492" y="291" font-size="17" font-weight="700" fill="#291c0e">Size-intensive replenishment</text>
<text x="492" y="316" font-size="14" fill="#4f4f4f">~30% of annual sales — denim, intimates, footwear first</text>

<circle cx="470" cy="360" r="7" fill="#c39a5f"/>
<text x="492" y="366" font-size="17" font-weight="700" fill="#291c0e">Ship-from-store / BOPIS</text>
<text x="492" y="391" font-size="14" fill="#4f4f4f">95%+ store accuracy; RFID cuts cancellations 30-50%</text>

<circle cx="470" cy="435" r="7" fill="#4a5568"/>
<text x="492" y="441" font-size="17" font-weight="700" fill="#291c0e">Markdown engine</text>
<text x="492" y="466" font-size="14" fill="#4f4f4f">live floor counts mean shallower seasonal markdowns</text>

<circle cx="470" cy="510" r="7" fill="#2c5454"/>
<text x="492" y="516" font-size="17" font-weight="700" fill="#291c0e">Bloomingdale's parallel program</text>
<text x="492" y="541" font-size="14" fill="#4f4f4f">more premium chips, tighter placement audit</text>

<text x="600" y="622" text-anchor="middle" font-size="14" fill="#5c5c5c">Downstream uses set Macy's tolerance for read-rate degradation. It is low.</text>
</svg>
