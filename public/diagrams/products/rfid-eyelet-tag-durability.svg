<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Durability envelope of an RFID eyelet tag versus a sewn, heat-seal or adhesive tag</title>
  <desc id="d">A three-row comparison across service stressors. Industrial laundry: 200+ ISO 6330 wash cycles at 40-75 °C — the grommet eyelet loses under 0.5 percent per cycle while sewn patches fail at 3-6 percent per cycle and heat-seal bonds fail above 75 °C. UV outdoor: 500 h QUV top-ply holds by physical capture while adhesive sheds off DWR and canvas. Salt fog and marine: 720 h ISO 9227 validated on a 316L stainless or brass grommet edge while salt undercreep lifts an adhesive bond. Read range is unchanged because the inlay never leaves the host: UHF 1-3 m and an HF 0-40 mm tap.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SURVIVES WHERE A GLUED-ON TAG QUITS</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Physical grommet capture outlasts the wash, the sun and the salt that peel an adhesive or snap a thread</text>

  <text x="272" y="164" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.4" fill="#2c5454">RFID EYELET / GROMMET</text>
  <text x="927" y="164" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.4" fill="#8b2d2d">SEWN · HEAT-SEAL · ADHESIVE</text>

  <!-- Row 1 — industrial laundry -->
  <rect x="70" y="196" width="405" height="68" rx="12" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <polyline points="82,224 92,236 108,212" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="226" font-size="14" font-weight="700" fill="#1f6f3a">Grommet: under 0.5 % loss / cycle</text>
  <text x="118" y="246" font-size="12.5" fill="#5c5c5c">Physical capture — nothing to peel</text>
  <rect x="495" y="196" width="210" height="68" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="600" y="226" text-anchor="middle" font-size="14" font-weight="800" fill="#4a5568">INDUSTRIAL LAUNDRY</text>
  <text x="600" y="246" text-anchor="middle" font-size="12.5" fill="#5c5c5c">200+ ISO 6330 · 40-75 °C</text>
  <rect x="725" y="196" width="405" height="68" rx="12" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="2"/>
  <line x1="740" y1="214" x2="760" y2="238" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round"/>
  <line x1="760" y1="214" x2="740" y2="238" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round"/>
  <text x="772" y="226" font-size="14" font-weight="700" fill="#8b2d2d">Sewn 3-6 % / cycle</text>
  <text x="772" y="246" font-size="12.5" fill="#5c5c5c">Heat-seal fails above 75 °C wash</text>

  <!-- Row 2 — UV outdoor -->
  <rect x="70" y="300" width="405" height="68" rx="12" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <polyline points="82,328 92,340 108,316" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="330" font-size="14" font-weight="700" fill="#1f6f3a">Grommet capture holds</text>
  <text x="118" y="350" font-size="12.5" fill="#5c5c5c">No bond to age in the sun</text>
  <rect x="495" y="300" width="210" height="68" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="600" y="330" text-anchor="middle" font-size="14" font-weight="800" fill="#4a5568">UV / OUTDOOR</text>
  <text x="600" y="350" text-anchor="middle" font-size="12.5" fill="#5c5c5c">500 h QUV top-ply</text>
  <rect x="725" y="300" width="405" height="68" rx="12" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="2"/>
  <line x1="740" y1="318" x2="760" y2="342" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round"/>
  <line x1="760" y1="318" x2="740" y2="342" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round"/>
  <text x="772" y="330" font-size="14" font-weight="700" fill="#8b2d2d">Glue sheds off the fabric</text>
  <text x="772" y="350" font-size="12.5" fill="#5c5c5c">DWR / canvas low surface energy</text>

  <!-- Row 3 — salt fog / marine -->
  <rect x="70" y="404" width="405" height="68" rx="12" fill="#eef5ee" stroke="#9ec4a6" stroke-width="2"/>
  <polyline points="82,432 92,444 108,420" fill="none" stroke="#1f6f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="434" font-size="14" font-weight="700" fill="#1f6f3a">316L / brass eyelet edge</text>
  <text x="118" y="454" font-size="12.5" fill="#5c5c5c">Corrosion-validated set edge</text>
  <rect x="495" y="404" width="210" height="68" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="600" y="434" text-anchor="middle" font-size="14" font-weight="800" fill="#4a5568">SALT FOG / MARINE</text>
  <text x="600" y="454" text-anchor="middle" font-size="12.5" fill="#5c5c5c">720 h ISO 9227</text>
  <rect x="725" y="404" width="405" height="68" rx="12" fill="#f7e7e2" stroke="#e2b8b0" stroke-width="2"/>
  <line x1="740" y1="422" x2="760" y2="446" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round"/>
  <line x1="760" y1="422" x2="740" y2="446" stroke="#8b2d2d" stroke-width="4" stroke-linecap="round"/>
  <text x="772" y="434" font-size="14" font-weight="700" fill="#8b2d2d">Salt undercreep lifts glue</text>
  <text x="772" y="454" font-size="12.5" fill="#5c5c5c">Moisture wicks under the bond</text>

  <!-- banner -->
  <rect x="70" y="502" width="1060" height="56" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="90" y="526" font-size="14" font-weight="700" fill="#2c5454">Same inlay, same read range — UHF 1-3 m on canvas / leather, HF 0-40 mm tap</text>
  <text x="90" y="546" font-size="12.5" fill="#3d6b6b">because the grommet never lets the tag leave the host it is measuring.</text>

  <text x="600" y="590" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Ratings: 200+ ISO 6330 wash · 500 h QUV · 720 h ISO 9227 salt-fog · 500-800 N grommet pull-out (DIN 53351).</text>
</svg>
