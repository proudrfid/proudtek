<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five-step flow to set up a white-label RFID program</title>
<desc id="d">A left-to-right flow of five numbered steps. Step one, negotiate the MOQ and price tiers, with a 1K to 10K first order and prices locked up to 100K. Step two, send brand assets as vector AI, EPS or SVG files with Pantone codes and dimensions. Step three, approve a sample run of 50 to 200 first-article samples, checking print alignment and color. Step four, run a factory quality-control inspection through SGS, Bureau Veritas or AsiaInspection on the first 1 to 5 percent of production for 200 to 800 dollars. Step five, set up logistics and customs, with the factory handling export and the buyer pre-clearing HS code 8543.70.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">FIVE STEPS TO A CLEAN LAUNCH</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">A repeatable order of operations — skip one and you usually pay for it later.</text>

<!-- step boxes -->
<rect x="40" y="150" width="196" height="266" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="274" y="150" width="196" height="266" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="508" y="150" width="196" height="266" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="742" y="150" width="196" height="266" rx="14" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="976" y="150" width="196" height="266" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/>

<!-- badges -->
<circle cx="138" cy="192" r="19" fill="#3d6b6b"/><text x="138" y="198" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
<circle cx="372" cy="192" r="19" fill="#3d6b6b"/><text x="372" y="198" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
<circle cx="606" cy="192" r="19" fill="#3d6b6b"/><text x="606" y="198" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
<circle cx="840" cy="192" r="19" fill="#3d6b6b"/><text x="840" y="198" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">4</text>
<circle cx="1074" cy="192" r="19" fill="#1f6f3a"/><text x="1074" y="198" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">5</text>

<!-- step 1 -->
<text x="138" y="248" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Negotiate MOQ</text>
<text x="138" y="268" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">&amp; price tiers</text>
<text x="138" y="300" text-anchor="middle" font-size="12.5" fill="#4f4f4f">1K–10K first order;</text>
<text x="138" y="320" text-anchor="middle" font-size="12.5" fill="#4f4f4f">lock price tiers</text>
<text x="138" y="340" text-anchor="middle" font-size="12.5" fill="#4f4f4f">up to 100K</text>

<!-- step 2 -->
<text x="372" y="248" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Send brand</text>
<text x="372" y="268" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">assets</text>
<text x="372" y="300" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Vector AI/EPS/SVG,</text>
<text x="372" y="320" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Pantone codes,</text>
<text x="372" y="340" text-anchor="middle" font-size="12.5" fill="#4f4f4f">dims &amp; material</text>

<!-- step 3 -->
<text x="606" y="248" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Approve</text>
<text x="606" y="268" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">sample run</text>
<text x="606" y="300" text-anchor="middle" font-size="12.5" fill="#4f4f4f">50–200 first-article</text>
<text x="606" y="320" text-anchor="middle" font-size="12.5" fill="#4f4f4f">samples; check</text>
<text x="606" y="340" text-anchor="middle" font-size="12.5" fill="#4f4f4f">print &amp; color</text>

<!-- step 4 -->
<text x="840" y="248" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">QC inspection</text>
<text x="840" y="268" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">at factory</text>
<text x="840" y="300" text-anchor="middle" font-size="12.5" fill="#4f4f4f">SGS / BV /</text>
<text x="840" y="320" text-anchor="middle" font-size="12.5" fill="#4f4f4f">AsiaInspection;</text>
<text x="840" y="340" text-anchor="middle" font-size="12.5" fill="#4f4f4f">first 1–5%; $200–800</text>

<!-- step 5 -->
<text x="1074" y="248" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">Logistics</text>
<text x="1074" y="268" text-anchor="middle" font-size="15" font-weight="800" fill="#291c0e">&amp; customs</text>
<text x="1074" y="300" text-anchor="middle" font-size="12.5" fill="#33595a">Factory exports;</text>
<text x="1074" y="320" text-anchor="middle" font-size="12.5" fill="#33595a">pre-clear product</text>
<text x="1074" y="340" text-anchor="middle" font-size="12.5" fill="#33595a">class HS 8543.70</text>

<!-- arrows -->
<polyline points="246,283 262,295 246,307" fill="none" stroke="#c39a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="480,283 496,295 480,307" fill="none" stroke="#c39a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="714,283 730,295 714,307" fill="none" stroke="#c39a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="948,283 964,295 948,307" fill="none" stroke="#c39a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

<!-- footer note -->
<rect x="64" y="470" width="1072" height="64" rx="13" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="92" y="500" font-size="15.5" font-weight="800" fill="#6d5a3a">Do them in order.</text>
<text x="92" y="521" font-size="13.5" fill="#7a6844">Distributors who skip a step waste 4–6 weeks on rework — usually after the full run has shipped.</text>

<text x="600" y="586" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Re-orders without design changes collapse the flow to steps 1 and 5.</text>
</svg>
