<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How a vulnerable access card is copied</title>
<desc id="d">Two card families and how each is duplicated. Top row, plaintext ID: a 125 kHz Prox card transmits a fixed ID, a handheld reader captures it in about one second, the ID is written to a blank tag, and the working clone is indistinguishable to the reader. Bottom row, broken cipher: a MIFARE Classic card uses Crypto-1, which was broken in 2008; a key-recovery tool such as mfoc or hardnested extracts the sector keys, the full card contents are dumped, and a byte-identical clone is produced.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">HOW A VULNERABLE CARD IS COPIED</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Two families, one root cause: the secret is either absent or already broken.</text>

<!-- Row A label -->
<text x="64" y="150" font-size="13" font-weight="800" letter-spacing="0.6" fill="#8b2d2d">PLAINTEXT ID · 125 kHz PROX</text>
<!-- Row A nodes -->
<rect x="64" y="164" width="220" height="86" rx="10" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="174" y="200" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Prox card</text>
<text x="174" y="222" text-anchor="middle" font-size="12.5" fill="#5c5c5c">fixed ID, no encryption</text>
<line x1="292" y1="207" x2="330" y2="207" stroke="#8b2d2d" stroke-width="2.5"/>
<polygon points="330,201 340,207 330,213" fill="#8b2d2d"/>
<rect x="348" y="164" width="220" height="86" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<text x="458" y="200" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Handheld reader</text>
<text x="458" y="222" text-anchor="middle" font-size="12.5" fill="#5c5c5c">captures ID in ~1 sec</text>
<line x1="576" y1="207" x2="614" y2="207" stroke="#8b2d2d" stroke-width="2.5"/>
<polygon points="614,201 624,207 614,213" fill="#8b2d2d"/>
<rect x="632" y="164" width="220" height="86" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<text x="742" y="200" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Blank tag written</text>
<text x="742" y="222" text-anchor="middle" font-size="12.5" fill="#5c5c5c">ID copied over</text>
<line x1="860" y1="207" x2="898" y2="207" stroke="#8b2d2d" stroke-width="2.5"/>
<polygon points="898,201 908,207 898,213" fill="#8b2d2d"/>
<rect x="916" y="164" width="220" height="86" rx="10" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="1026" y="200" text-anchor="middle" font-size="14.5" font-weight="800" fill="#8b2d2d">Working clone</text>
<text x="1026" y="222" text-anchor="middle" font-size="12.5" fill="#5c5c5c">reader sees original</text>

<line x1="64" y1="290" x2="1136" y2="290" stroke="#eadfce" stroke-width="1.5"/>

<!-- Row B label -->
<text x="64" y="336" font-size="13" font-weight="800" letter-spacing="0.6" fill="#8b2d2d">BROKEN CIPHER · MIFARE CLASSIC (2008)</text>
<!-- Row B nodes -->
<rect x="64" y="350" width="220" height="86" rx="10" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="174" y="386" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Classic card</text>
<text x="174" y="408" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Crypto-1 sector keys</text>
<line x1="292" y1="393" x2="330" y2="393" stroke="#8b2d2d" stroke-width="2.5"/>
<polygon points="330,387 340,393 330,399" fill="#8b2d2d"/>
<rect x="348" y="350" width="220" height="86" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<text x="458" y="386" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Key-recovery tool</text>
<text x="458" y="408" text-anchor="middle" font-size="12.5" fill="#5c5c5c">mfoc / hardnested</text>
<line x1="576" y1="393" x2="614" y2="393" stroke="#8b2d2d" stroke-width="2.5"/>
<polygon points="614,387 624,393 614,399" fill="#8b2d2d"/>
<rect x="632" y="350" width="220" height="86" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.4"/>
<text x="742" y="386" text-anchor="middle" font-size="14.5" font-weight="800" fill="#291c0e">Full card dump</text>
<text x="742" y="408" text-anchor="middle" font-size="12.5" fill="#5c5c5c">all sectors read</text>
<line x1="860" y1="393" x2="898" y2="393" stroke="#8b2d2d" stroke-width="2.5"/>
<polygon points="898,387 908,393 898,399" fill="#8b2d2d"/>
<rect x="916" y="350" width="220" height="86" rx="10" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<text x="1026" y="386" text-anchor="middle" font-size="14.5" font-weight="800" fill="#8b2d2d">Byte-identical clone</text>
<text x="1026" y="408" text-anchor="middle" font-size="12.5" fill="#5c5c5c">indistinguishable</text>

<rect x="64" y="482" width="1072" height="120" rx="12" fill="#faf7f0" stroke="#eadfce" stroke-width="1.3"/>
<text x="90" y="518" font-size="14.5" font-weight="800" fill="#2c5454">The tell that matters</text>
<text x="90" y="546" font-size="13.5" fill="#333333">Neither family holds a secret the clone has to prove — the ID is the whole credential, and the ID is copyable.</text>
<text x="90" y="572" font-size="13.5" fill="#333333">That is why upgrading the credential, not tightening the policy around it, is the only fix that removes the risk.</text>
</svg>
