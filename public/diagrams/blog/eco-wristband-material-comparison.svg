<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Eco-material wristband scorecard: coconut shell versus the alternatives</title>
<desc id="d">A comparison matrix of six wristband substrates across four criteria: biodegradable, unit cost, premium feel and durability. Coconut shell is biodegradable, mid cost, top premium feel and high durability. Wood (FSC pine) is biodegradable, lowest cost, mid premium feel, high durability. RPET woven fabric is not compostable, low cost, mid premium, high durability. Bamboo fibre is biodegradable, low cost, mid premium, mid durability. Hemp or cotton cord is biodegradable, mid cost, mid premium, low durability. 'Biodegradable' Tyvek is not compostable, low cost, low premium, mid durability. More filled dots mean stronger.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="50" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ECO-MATERIAL SCORECARD</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">How coconut shell stacks up against the other biodegradable options.</text>

<!-- coconut highlight band -->
<rect x="64" y="180" width="1072" height="52" rx="10" fill="#fbf4e6" stroke="#e4c98f" stroke-width="1.4"/>

<!-- header -->
<text x="92" y="150" font-size="14" font-weight="800" fill="#291c0e">Material</text>
<text x="470" y="150" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4f4f4f">Biodegradable</text>
<text x="650" y="150" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4f4f4f">Unit cost</text>
<text x="830" y="150" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4f4f4f">Premium feel</text>
<text x="1010" y="150" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4f4f4f">Durability</text>
<line x1="64" y1="166" x2="1136" y2="166" stroke="#e6dfd2" stroke-width="1.5"/>

<!-- row 1 : Coconut shell (highlight) -->
<text x="92" y="211" font-size="14.5" font-weight="800" fill="#291c0e">Coconut shell</text>
<circle cx="470" cy="206" r="12" fill="#1f6f3a"/>
<path d="M465 206 L468.5 210 L475 202" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="632" cy="206" r="5.5" fill="#2d6a4f"/><circle cx="650" cy="206" r="5.5" fill="#2d6a4f"/><circle cx="668" cy="206" r="5.5" fill="#d8d2c4"/>
<circle cx="812" cy="206" r="5.5" fill="#2d6a4f"/><circle cx="830" cy="206" r="5.5" fill="#2d6a4f"/><circle cx="848" cy="206" r="5.5" fill="#2d6a4f"/>
<circle cx="992" cy="206" r="5.5" fill="#2d6a4f"/><circle cx="1010" cy="206" r="5.5" fill="#2d6a4f"/><circle cx="1028" cy="206" r="5.5" fill="#2d6a4f"/>

<!-- row 2 : Wood -->
<text x="92" y="268" font-size="14" font-weight="600" fill="#333333">Wood (FSC pine)</text>
<circle cx="470" cy="263" r="12" fill="#1f6f3a"/>
<path d="M465 263 L468.5 267 L475 259" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="632" cy="263" r="5.5" fill="#2d6a4f"/><circle cx="650" cy="263" r="5.5" fill="#2d6a4f"/><circle cx="668" cy="263" r="5.5" fill="#2d6a4f"/>
<circle cx="812" cy="263" r="5.5" fill="#2d6a4f"/><circle cx="830" cy="263" r="5.5" fill="#2d6a4f"/><circle cx="848" cy="263" r="5.5" fill="#d8d2c4"/>
<circle cx="992" cy="263" r="5.5" fill="#2d6a4f"/><circle cx="1010" cy="263" r="5.5" fill="#2d6a4f"/><circle cx="1028" cy="263" r="5.5" fill="#2d6a4f"/>

<!-- row 3 : RPET -->
<text x="92" y="325" font-size="14" font-weight="600" fill="#333333">RPET woven fabric</text>
<circle cx="470" cy="320" r="12" fill="#8b2d2d"/>
<line x1="465" y1="315" x2="475" y2="325" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
<line x1="465" y1="325" x2="475" y2="315" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="632" cy="320" r="5.5" fill="#2d6a4f"/><circle cx="650" cy="320" r="5.5" fill="#2d6a4f"/><circle cx="668" cy="320" r="5.5" fill="#2d6a4f"/>
<circle cx="812" cy="320" r="5.5" fill="#2d6a4f"/><circle cx="830" cy="320" r="5.5" fill="#2d6a4f"/><circle cx="848" cy="320" r="5.5" fill="#d8d2c4"/>
<circle cx="992" cy="320" r="5.5" fill="#2d6a4f"/><circle cx="1010" cy="320" r="5.5" fill="#2d6a4f"/><circle cx="1028" cy="320" r="5.5" fill="#2d6a4f"/>

<!-- row 4 : Bamboo -->
<text x="92" y="382" font-size="14" font-weight="600" fill="#333333">Bamboo fibre</text>
<circle cx="470" cy="377" r="12" fill="#1f6f3a"/>
<path d="M465 377 L468.5 381 L475 373" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="632" cy="377" r="5.5" fill="#2d6a4f"/><circle cx="650" cy="377" r="5.5" fill="#2d6a4f"/><circle cx="668" cy="377" r="5.5" fill="#2d6a4f"/>
<circle cx="812" cy="377" r="5.5" fill="#2d6a4f"/><circle cx="830" cy="377" r="5.5" fill="#2d6a4f"/><circle cx="848" cy="377" r="5.5" fill="#d8d2c4"/>
<circle cx="992" cy="377" r="5.5" fill="#2d6a4f"/><circle cx="1010" cy="377" r="5.5" fill="#2d6a4f"/><circle cx="1028" cy="377" r="5.5" fill="#d8d2c4"/>

<!-- row 5 : Hemp / cotton -->
<text x="92" y="439" font-size="14" font-weight="600" fill="#333333">Hemp / cotton cord</text>
<circle cx="470" cy="434" r="12" fill="#1f6f3a"/>
<path d="M465 434 L468.5 438 L475 430" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="632" cy="434" r="5.5" fill="#2d6a4f"/><circle cx="650" cy="434" r="5.5" fill="#2d6a4f"/><circle cx="668" cy="434" r="5.5" fill="#d8d2c4"/>
<circle cx="812" cy="434" r="5.5" fill="#2d6a4f"/><circle cx="830" cy="434" r="5.5" fill="#2d6a4f"/><circle cx="848" cy="434" r="5.5" fill="#d8d2c4"/>
<circle cx="992" cy="434" r="5.5" fill="#2d6a4f"/><circle cx="1010" cy="434" r="5.5" fill="#d8d2c4"/><circle cx="1028" cy="434" r="5.5" fill="#d8d2c4"/>

<!-- row 6 : Tyvek -->
<text x="92" y="496" font-size="14" font-weight="600" fill="#333333">&#8216;Biodegradable&#8217; Tyvek</text>
<circle cx="470" cy="491" r="12" fill="#8b2d2d"/>
<line x1="465" y1="486" x2="475" y2="496" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
<line x1="465" y1="496" x2="475" y2="486" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="632" cy="491" r="5.5" fill="#2d6a4f"/><circle cx="650" cy="491" r="5.5" fill="#2d6a4f"/><circle cx="668" cy="491" r="5.5" fill="#2d6a4f"/>
<circle cx="812" cy="491" r="5.5" fill="#2d6a4f"/><circle cx="830" cy="491" r="5.5" fill="#d8d2c4"/><circle cx="848" cy="491" r="5.5" fill="#d8d2c4"/>
<circle cx="992" cy="491" r="5.5" fill="#2d6a4f"/><circle cx="1010" cy="491" r="5.5" fill="#2d6a4f"/><circle cx="1028" cy="491" r="5.5" fill="#d8d2c4"/>

<line x1="64" y1="234" x2="1136" y2="234" stroke="#efe9dd" stroke-width="1"/>
<line x1="64" y1="291" x2="1136" y2="291" stroke="#efe9dd" stroke-width="1"/>
<line x1="64" y1="348" x2="1136" y2="348" stroke="#efe9dd" stroke-width="1"/>
<line x1="64" y1="405" x2="1136" y2="405" stroke="#efe9dd" stroke-width="1"/>
<line x1="64" y1="462" x2="1136" y2="462" stroke="#efe9dd" stroke-width="1"/>

<!-- legend -->
<circle cx="150" cy="556" r="10" fill="#1f6f3a"/>
<path d="M145.5 556 L149 560 L155 552" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="168" y="561" font-size="13" fill="#5c5c5c">biodegradable</text>
<circle cx="330" cy="556" r="10" fill="#8b2d2d"/>
<line x1="326" y1="552" x2="334" y2="560" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
<line x1="326" y1="560" x2="334" y2="552" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
<text x="348" y="561" font-size="13" fill="#5c5c5c">not compostable</text>
<circle cx="540" cy="556" r="5.5" fill="#2d6a4f"/><circle cx="558" cy="556" r="5.5" fill="#2d6a4f"/><circle cx="576" cy="556" r="5.5" fill="#2d6a4f"/>
<text x="594" y="561" font-size="13" fill="#5c5c5c">more dots = stronger</text>
<text x="600" y="600" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Coconut shell trades a small cost premium for the most premium natural feel; wood wins on cost, bamboo on lead time.</text>
</svg>
