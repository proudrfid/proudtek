<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The three RFID sponge-counting checkpoints in every case</title>
<desc id="d">Three checkpoints run in order: count in by scanning the sterile tray to set a baseline, scan during the procedure before each closure step, and a final scan over the patient before closure. If all tags are accounted for the count is confirmed; if any tag still reads inside, the team locates and removes the sponge before closing. The passive tag reads through six to fifteen centimetres of tissue and blood, so the final scan does not depend on line of sight.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THREE CHECKPOINTS, EVERY CASE</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">The tag reads through tissue and blood, so the final scan sees what the eye cannot.</text>

<!-- STEP 1 -->
<rect x="96" y="140" width="330" height="210" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="96" y="140" width="330" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="261" cy="184" r="19" fill="#eef5f5" stroke="#2c5454" stroke-width="1.8"/>
<text x="261" y="190" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">1</text>
<text x="261" y="238" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Count in</text>
<text x="261" y="270" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Scan the sterile tray</text>
<text x="261" y="290" text-anchor="middle" font-size="12.5" fill="#5c5c5c">to set the baseline count</text>
<text x="261" y="310" text-anchor="middle" font-size="12.5" fill="#5c5c5c">before the procedure.</text>

<!-- STEP 2 -->
<rect x="456" y="140" width="330" height="210" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="456" y="140" width="330" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="621" cy="184" r="19" fill="#eef5f5" stroke="#2c5454" stroke-width="1.8"/>
<text x="621" y="190" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">2</text>
<text x="621" y="238" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Scan during</text>
<text x="621" y="270" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Re-scan before each</text>
<text x="621" y="290" text-anchor="middle" font-size="12.5" fill="#5c5c5c">closure step as sponges</text>
<text x="621" y="310" text-anchor="middle" font-size="12.5" fill="#5c5c5c">come and go.</text>

<!-- STEP 3 -->
<rect x="816" y="140" width="330" height="210" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="816" y="140" width="330" height="8" rx="4" fill="#3d6b6b"/>
<circle cx="981" cy="184" r="19" fill="#eef5f5" stroke="#2c5454" stroke-width="1.8"/>
<text x="981" y="190" text-anchor="middle" font-size="17" font-weight="800" fill="#2c5454">3</text>
<text x="981" y="238" text-anchor="middle" font-size="15.5" font-weight="800" fill="#291c0e">Final scan</text>
<text x="981" y="270" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Pass the reader over</text>
<text x="981" y="290" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the patient before the</text>
<text x="981" y="310" text-anchor="middle" font-size="12.5" fill="#5c5c5c">surgeon closes.</text>

<!-- arrows -->
<line x1="426" y1="245" x2="450" y2="245" stroke="#291c0e" stroke-width="2.6"/>
<polygon points="450,239 464,245 450,251" fill="#291c0e"/>
<line x1="786" y1="245" x2="810" y2="245" stroke="#291c0e" stroke-width="2.6"/>
<polygon points="810,239 824,245 810,251" fill="#291c0e"/>

<!-- outcomes -->
<rect x="96" y="392" width="500" height="72" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/>
<path d="M 128 428 L 137 437 L 154 417" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="176" y="423" font-size="14.5" font-weight="800" fill="#1f6f3a">All tags accounted for</text>
<text x="176" y="446" font-size="12.5" fill="#33595a">Count confirmed — proceed to close.</text>

<rect x="636" y="392" width="510" height="72" rx="12" fill="#f7e7e7" stroke="#c98b8b" stroke-width="1.8"/>
<rect x="668" y="414" width="26" height="26" rx="5" fill="#f2d9d9" stroke="#8b2d2d" stroke-width="2"/>
<text x="712" y="423" font-size="14.5" font-weight="800" fill="#8b2d2d">A tag still reads inside</text>
<text x="712" y="446" font-size="12.5" fill="#5c5c5c">Locate and remove before closing.</text>

<!-- tissue note -->
<rect x="230" y="500" width="740" height="70" rx="12" fill="#f7f4ec" stroke="#e6dfd2" stroke-width="1.6"/>
<text x="600" y="532" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">The passive tag reads through 6-15 cm of tissue and blood.</text>
<text x="600" y="554" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Detection does not depend on line of sight — a dark, buried sponge still answers the scan.</text>
</svg>
