<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">What fits in NTAG213's 144 bytes — and when to step up</title>
  <desc id="d">144 bytes of user memory across 36 pages of 4 bytes leaves room for roughly a 132-137 character URL after NDEF overhead. Ladder shows the step-up: NTAG215 at 504 bytes for longer URLs, Wi-Fi share or Amiibo, NTAG216 at 888 bytes for vCards and multi-record payloads.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">144 bytes — exactly one good link</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Entry-tier memory sized for the URL-tap job it was born for</text>
  <g transform="translate(70,150)">
    <rect x="0" y="0" width="560" height="180" rx="14" fill="#ffffff" stroke="#3d6b6b" stroke-width="2.5"/>
    <text x="26" y="40" font-family="Georgia, serif" font-size="18" fill="#2c5454">User memory: 144 bytes</text>
    <text x="26" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">36 pages x 4 bytes</text>
    <rect x="26" y="84" width="508" height="34" rx="6" fill="#eef2f0" stroke="#3d6b6b"/>
    <text x="40" y="106" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c5454">https://your-brand.com/campaign/… (~132-137 chars after NDEF overhead)</text>
    <text x="26" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Google-review taps, marketing campaigns, table stands — one URL, zero app</text>
  </g>
  <g transform="translate(70,390)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="60" width="320" height="90" rx="10" fill="#eef2f0" stroke="#2c5454" stroke-width="2.5"/>
    <text x="20" y="96" font-family="Georgia, serif" font-size="16" fill="#2c5454">NTAG213 — 144 B</text>
    <text x="20" y="122" font-size="13" fill="#2c5454">the URL-sticker default</text>
    <rect x="360" y="30" width="320" height="90" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="380" y="66" font-family="Georgia, serif" font-size="16" fill="#291c0e">NTAG215 — 504 B</text>
    <text x="380" y="92" font-size="13" fill="#6d5a3a">URL &gt;132 chars · Wi-Fi share · Amiibo</text>
    <rect x="720" y="0" width="320" height="90" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="740" y="36" font-family="Georgia, serif" font-size="16" fill="#291c0e">NTAG216 — 888 B</text>
    <text x="740" y="62" font-size="13" fill="#6d5a3a">full vCard · multi-record payloads</text>
  </g>
</svg>
