<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="roiTitle roiDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="roiTitle">Four channels of ROI from luxury NFC anti-counterfeit programs</title>
  <desc id="roiDesc">A two-by-two grid of outcomes from anonymized 2024 to 2026 deployments at four European luxury groups. Counterfeit reduction: a 15 to 30 percent drop in detected fakes at customs and online within 18 to 24 months. Resale premium: NFC-verified items resell 8 to 15 percent higher than visually-authenticated equivalents. Consumer data: 25 to 40 percent of authenticated buyers register an email at first tap. Operational efficiency: repair intake falls from 8 to 12 minutes to 30 to 60 seconds, saving two to three full-time staff per flagship boutique.</desc>
  <defs>
    <radialGradient id="roiBg" cx="50%" cy="22%" r="86%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#roiBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="66" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#6d5a3a">FOUR WAYS NFC PAYS BACK</text>

  <!-- TL: counterfeit reduction -->
  <rect x="56" y="102" width="524" height="230" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="80" y="126" width="150" height="34" rx="17" fill="#efe0bf"/><text x="155" y="149" text-anchor="middle" font-size="14.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">FEWER FAKES</text>
  <text x="318" y="220" text-anchor="middle" font-size="58" font-weight="800" fill="#291c0e">−15–30%</text>
  <text x="318" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="#291c0e">detected counterfeits</text>
  <text x="318" y="294" text-anchor="middle" font-size="16.5" fill="#4f4f4f">at customs &amp; online platforms, 18–24 mo</text>

  <!-- TR: resale premium -->
  <rect x="620" y="102" width="524" height="230" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="644" y="126" width="150" height="34" rx="17" fill="#efe0bf"/><text x="719" y="149" text-anchor="middle" font-size="14.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">RESALE LIFT</text>
  <text x="882" y="220" text-anchor="middle" font-size="58" font-weight="800" fill="#291c0e">+8–15%</text>
  <text x="882" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="#291c0e">resale price premium</text>
  <text x="882" y="294" text-anchor="middle" font-size="16.5" fill="#4f4f4f">vs visually-authenticated equivalents</text>

  <!-- BL: consumer data -->
  <rect x="56" y="352" width="524" height="230" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="80" y="376" width="150" height="34" rx="17" fill="#eaf9fe"/><text x="155" y="399" text-anchor="middle" font-size="14.5" font-weight="700" letter-spacing="1" fill="#177a92">CRM CAPTURE</text>
  <text x="318" y="470" text-anchor="middle" font-size="58" font-weight="800" fill="#291c0e">25–40%</text>
  <text x="318" y="512" text-anchor="middle" font-size="22" font-weight="700" fill="#291c0e">register email at first tap</text>
  <text x="318" y="544" text-anchor="middle" font-size="16.5" fill="#4f4f4f">a touchpoint wholesale &amp; resale otherwise lose</text>

  <!-- BR: repair efficiency -->
  <rect x="620" y="352" width="524" height="230" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
  <rect x="644" y="376" width="150" height="34" rx="17" fill="#eaf5ec"/><text x="719" y="399" text-anchor="middle" font-size="14.5" font-weight="700" letter-spacing="1" fill="#1f6f3a">FASTER OPS</text>
  <text x="882" y="466" text-anchor="middle" font-size="40" font-weight="800" fill="#291c0e">8–12 min → 30–60 s</text>
  <text x="882" y="512" text-anchor="middle" font-size="22" font-weight="700" fill="#291c0e">repair &amp; warranty intake</text>
  <text x="882" y="544" text-anchor="middle" font-size="16.5" fill="#4f4f4f">saves 2–3 FTE per flagship boutique</text>

  <text x="600" y="622" text-anchor="middle" font-size="16" fill="#6d5a3a">Source: anonymized 2024–2026 deployments at four European luxury groups.</text>
</svg>
