<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Cashless RFID wristbands: load credit, tap to pay, and per-attendee spend rises 15-30%</title>
<desc id="d">The cashless wristband model in three steps. One, load: the attendee adds credit online, at a kiosk, or via cash-to-credit. Two, tap: they pay at any vendor in under two seconds. Three, the lift: per-attendee spend rises 15 to 30 percent, because people spend more when spending stops feeling like spending, and the operator settles vendors after the event.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="58" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">EVENT TECHNOLOGY · CASHLESS RFID</text>
<text x="600" y="104" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#291c0e">The tap that quietly lifts the spend</text>
<text x="600" y="140" text-anchor="middle" font-size="16" fill="#4f4f4f">Load credit, tap a wrist in under two seconds — per-attendee spend rises 15-30%.</text>

