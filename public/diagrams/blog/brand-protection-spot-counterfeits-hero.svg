<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="bpTitle bpDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="bpTitle">Spot the counterfeit — the chip checks what the eye cannot</title>
  <desc id="bpDesc">Two products look identical. On the left, a genuine item carries a secure NFC chip; a phone tap triggers a fresh cryptographic signature and the backend returns AUTHENTIC. On the right, a visually identical counterfeit only carries a cloned UID, cannot reproduce the signature, and the backend returns REJECTED. Footer stats: counterfeit goods cost brands over 500 billion dollars a year; detection runs across four checkpoints — factory, customs, retail and consumer; and a cloned chip fails on the very first tap.</desc>

  <defs>
    <radialGradient id="bpBg" cx="50%" cy="24%" r="86%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="bpDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#291c0e"/>
      <stop offset="100%" stop-color="#6c5127"/>
    </linearGradient>
    <g id="bpBag">
      <path d="M-28 -2 q28 -46 56 0" fill="none" stroke="#c39a5f" stroke-width="8" stroke-linecap="round"/>
      <path d="M-52 0 h104 a12 12 0 0 1 12 12 l6 76 a14 14 0 0 1 -14 16 h-112 a14 14 0 0 1 -14 -16 l6 -76 a12 12 0 0 1 12 -12 Z" fill="#ffffff" stroke="#291c0e" stroke-width="3.5"/>
      <path d="M-52 0 h104 a12 12 0 0 1 12 12 l2 20 h-144 l2 -20 a12 12 0 0 1 12 -12 Z" fill="#efe0bf" stroke="#291c0e" stroke-width="3.5"/>
      <rect x="-23" y="44" width="46" height="34" rx="7" fill="#eaf9fe" stroke="#1fcefb" stroke-width="2.5"/>
      <g fill="none" stroke="#1fcefb" stroke-width="2.3" stroke-linecap="round">
        <path d="M3 55 a7 7 0 0 1 0 12"/>
        <path d="M10 51 a13 13 0 0 1 0 20"/>
      </g>
      <circle cx="-9" cy="61" r="3" fill="#1fcefb"/>
    </g>
  </defs>

  <rect width="1200" height="675" fill="url(#bpBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <!-- Eyebrow + tagline -->
  <text x="600" y="64" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="3" fill="#6d5a3a">BRAND PROTECTION · SPOT THE COUNTERFEIT</text>
  <text x="600" y="95" text-anchor="middle" font-size="17" fill="#4f4f4f">Counterfeiters copy everything you can see. The chip checks the one thing they can't.</text>

  <!-- ===================== GENUINE card ===================== -->
  <rect x="60" y="118" width="510" height="330" rx="18" fill="#fbf8f2" stroke="#1f6f3a" stroke-width="2.5"/>
  <rect x="84" y="138" width="140" height="34" rx="17" fill="#1f6f3a"/>
  <text x="154" y="161" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1.5" fill="#ffffff">GENUINE</text>
  <use href="#bpBag" transform="translate(210,196)"/>
  <!-- phone tapping -->
  <rect x="392" y="196" width="80" height="150" rx="15" fill="#ffffff" stroke="#291c0e" stroke-width="4"/>
  <rect x="403" y="211" width="58" height="104" rx="6" fill="#f7f0e2"/>
  <circle cx="432" cy="332" r="6" fill="#291c0e"/>
  <g fill="none" stroke="#1fcefb" stroke-width="3.6" stroke-linecap="round">
    <path d="M372 244 a30 30 0 0 0 0 58"/>
    <path d="M356 230 a48 48 0 0 0 0 86"/>
    <path d="M340 218 a66 66 0 0 0 0 110"/>
  </g>
  <circle cx="384" cy="273" r="4.5" fill="#1fcefb"/>
  <!-- verdict -->
  <rect x="98" y="382" width="394" height="50" rx="14" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2.5"/>
  <circle cx="132" cy="407" r="19" fill="#1f6f3a"/>
  <path d="M123 407 l6 7 l13 -15" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="164" y="402" font-size="22" font-weight="800" fill="#1f6f3a">AUTHENTIC</text>
  <text x="164" y="423" font-size="14" fill="#3f6b4e">genuine chip · valid signature</text>

  <!-- ===================== COUNTERFEIT card ===================== -->
  <rect x="630" y="118" width="510" height="330" rx="18" fill="#fbf8f2" stroke="#8b2d2d" stroke-width="2.5"/>
  <rect x="654" y="138" width="164" height="34" rx="17" fill="#8b2d2d"/>
  <text x="736" y="161" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1.5" fill="#ffffff">COUNTERFEIT</text>
  <use href="#bpBag" transform="translate(780,196)"/>
  <!-- phone tapping -->
  <rect x="962" y="196" width="80" height="150" rx="15" fill="#ffffff" stroke="#291c0e" stroke-width="4"/>
  <rect x="973" y="211" width="58" height="104" rx="6" fill="#f7f0e2"/>
  <circle cx="1002" cy="332" r="6" fill="#291c0e"/>
  <g fill="none" stroke="#1fcefb" stroke-width="3.6" stroke-linecap="round">
    <path d="M942 244 a30 30 0 0 0 0 58"/>
    <path d="M926 230 a48 48 0 0 0 0 86"/>
    <path d="M910 218 a66 66 0 0 0 0 110"/>
  </g>
  <circle cx="954" cy="273" r="4.5" fill="#1fcefb"/>
  <!-- verdict -->
  <rect x="668" y="382" width="394" height="50" rx="14" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2.5"/>
  <circle cx="702" cy="407" r="19" fill="#8b2d2d"/>
  <path d="M694 399 l16 16 M710 399 l-16 16" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <text x="734" y="402" font-size="22" font-weight="800" fill="#8b2d2d">REJECTED</text>
  <text x="734" y="423" font-size="14" fill="#7a4242">cloned UID · no valid signature</text>

  <!-- ===================== Footer stat band ===================== -->
  <rect x="60" y="470" width="1080" height="128" rx="16" fill="url(#bpDark)"/>
  <g text-anchor="middle">
    <text x="243" y="524" font-size="34" font-weight="800" fill="#d4a755">$500B+</text>
    <text x="243" y="556" font-size="15.5" fill="#f4efe4">counterfeit goods, every year</text>
    <text x="600" y="524" font-size="34" font-weight="800" fill="#d4a755">4 checkpoints</text>
    <text x="600" y="556" font-size="15.5" fill="#f4efe4">factory · customs · retail · consumer</text>
    <text x="957" y="524" font-size="34" font-weight="800" fill="#d4a755">1st tap</text>
    <text x="957" y="556" font-size="15.5" fill="#f4efe4">a cloned chip fails immediately</text>
  </g>
  <line x1="423" y1="500" x2="423" y2="568" stroke="#c39a5f" stroke-width="1.5" opacity="0.5"/>
  <line x1="777" y1="500" x2="777" y2="568" stroke="#c39a5f" stroke-width="1.5" opacity="0.5"/>

  <!-- Legend -->
  <rect x="500" y="616" width="200" height="30" rx="15" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.5"/>
  <circle cx="524" cy="631" r="4" fill="#1fcefb"/>
  <path d="M534 631 a7 7 0 0 1 12 0" fill="none" stroke="#1fcefb" stroke-width="2.5" stroke-linecap="round"/>
  <text x="560" y="636" font-size="12.5" font-weight="600" fill="#177a92">NFC / RFID tap-to-verify</text>
</svg>
