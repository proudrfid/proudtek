<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How a tap-to-review NFC card works, in four stages</title>
<desc id="d">Four stages left to right. Stage one, tap: the phone creates a 13.56 megahertz field. Stage two, power: the passive NTAG213 or NTAG215 chip in the card wakes up with no battery. Stage three, record: the chip returns its NDEF URI record. Stage four, open: the Google review form opens in the browser. A footer notes there is no app, no QR and no manual search.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ANATOMY OF A TAP-TO-REVIEW CARD</text>
<text x="600" y="92" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">One tap, no app, no battery</text>

<!-- box 1 : TAP -->
<rect x="76" y="150" width="236" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="166" y="182" width="56" height="92" rx="12" fill="#234a4a"/><rect x="173" y="190" width="42" height="68" rx="3" fill="#eef5f5"/><circle cx="194" cy="266" r="3.4" fill="#eef5f5"/>
<path d="M236 196 a30 30 0 0 1 0 44 M245 186 a44 44 0 0 1 0 64" fill="none" stroke="#c39a5f" stroke-width="2.4" stroke-linecap="round"/>
<text x="194" y="330" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">1 · TAP</text>
<text x="194" y="360" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Phone creates a</text>
<text x="194" y="380" text-anchor="middle" font-size="13.5" fill="#4f4f4f">13.56 MHz field</text>

<path d="M320 300 l20 0 m-8 -7 l8 7 -8 7" fill="none" stroke="#c39a5f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

<!-- box 2 : POWER -->
<rect x="340" y="150" width="236" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="410" y="200" width="96" height="66" rx="8" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.6"/>
<rect x="420" y="210" width="76" height="46" rx="6" fill="none" stroke="#3d6b6b" stroke-width="1.6"/>
<rect x="429" y="218" width="58" height="30" rx="4" fill="none" stroke="#3d6b6b" stroke-width="1.3"/>
<rect x="482" y="224" width="18" height="18" rx="3" fill="#c39a5f"/>
<text x="458" y="330" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">2 · POWER</text>
<text x="458" y="360" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Passive NTAG213/215 chip</text>
<text x="458" y="380" text-anchor="middle" font-size="13.5" fill="#4f4f4f">wakes up — no battery</text>

<path d="M584 300 l20 0 m-8 -7 l8 7 -8 7" fill="none" stroke="#c39a5f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

<!-- box 3 : RECORD -->
<rect x="604" y="150" width="236" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="688" y="188" width="68" height="88" rx="8" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<line x1="700" y1="210" x2="744" y2="210" stroke="#6d5a3a" stroke-width="2"/>
<line x1="700" y1="226" x2="744" y2="226" stroke="#6d5a3a" stroke-width="2"/>
<line x1="700" y1="242" x2="730" y2="242" stroke="#6d5a3a" stroke-width="2"/>
<rect x="690" y="251" width="48" height="19" rx="4" fill="#6d5a3a"/><text x="714" y="265" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">NDEF</text>
<text x="722" y="330" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">3 · RECORD</text>
<text x="722" y="360" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Chip returns its</text>
<text x="722" y="380" text-anchor="middle" font-size="13.5" fill="#4f4f4f">NDEF URI record</text>

<path d="M848 300 l20 0 m-8 -7 l8 7 -8 7" fill="none" stroke="#c39a5f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

<!-- box 4 : OPEN -->
<rect x="868" y="150" width="236" height="300" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.6"/>
<rect x="940" y="192" width="92" height="80" rx="8" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/>
<rect x="940" y="192" width="92" height="18" rx="8" fill="#3d6b6b"/><rect x="940" y="202" width="92" height="8" fill="#3d6b6b"/>
<text x="986" y="240" text-anchor="middle" font-size="17" fill="#d4a755">★★★★★</text>
<text x="986" y="262" text-anchor="middle" font-size="12" font-weight="800" fill="#3d6b6b">Write a review</text>
<text x="986" y="330" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">4 · OPEN</text>
<text x="986" y="360" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Google review form</text>
<text x="986" y="380" text-anchor="middle" font-size="13.5" fill="#4f4f4f">opens in the browser</text>

<rect x="388" y="492" width="424" height="52" rx="26" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="600" y="524" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">No app  ·  no QR  ·  no manual search</text>
<text x="600" y="590" text-anchor="middle" font-size="14.5" fill="#5c5c5c">Power is harvested from the phone's field, so the card needs no battery and no maintenance.</text>
</svg>
