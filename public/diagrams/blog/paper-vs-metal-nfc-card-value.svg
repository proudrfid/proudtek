<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Paper card versus metal NFC card: same handshake, different afterlife</title>
<desc id="d">A side-by-side comparison. The paper or PVC card weighs 4 grams, is pocketed and often binned within days, loses 60 to 80 percent of its contacts to manual entry, and must be reprinted on every title or office change. The metal NFC card weighs 15 to 20 grams, is kept and shown around, saves the contact in one tap with no typing, and updates its details digitally with no reprint.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<linearGradient id="steel2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e7eaef"/><stop offset="100%" stop-color="#c3cad3"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHY METAL WINS THE FIRST TOUCH</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Same handshake across the table — very different afterlife.</text>

<!-- PAPER panel -->
<rect x="80" y="120" width="470" height="446" rx="16" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="80" y="120" width="470" height="8" rx="4" fill="#4a5568"/>
<text x="315" y="166" text-anchor="middle" font-size="19" font-weight="800" letter-spacing="0.5" fill="#4a5568">PAPER / PVC CARD</text>
<rect x="250" y="188" width="130" height="80" rx="7" fill="#f3f1ec" stroke="#cbc4b6" stroke-width="2"/>
<line x1="270" y1="214" x2="360" y2="214" stroke="#cbc4b6" stroke-width="3"/>
<line x1="270" y1="232" x2="340" y2="232" stroke="#d8d2c6" stroke-width="3"/>
<line x1="270" y1="248" x2="352" y2="248" stroke="#d8d2c6" stroke-width="3"/>
<circle cx="120" cy="322" r="6" fill="#8a94a2"/>
<text x="140" y="316" font-size="15.5" font-weight="700" fill="#291c0e">4 g — light enough to pocket and forget</text>
<text x="140" y="338" font-size="13" fill="#6b6b6b">a bin visits by Friday</text>
<circle cx="120" cy="392" r="6" fill="#8a94a2"/>
<text x="140" y="386" font-size="15.5" font-weight="700" fill="#291c0e">60-80% of contacts never recorded</text>
<text x="140" y="408" font-size="13" fill="#6b6b6b">manual entry, mistyped or skipped</text>
<circle cx="120" cy="462" r="6" fill="#8a94a2"/>
<text x="140" y="456" font-size="15.5" font-weight="700" fill="#291c0e">Reprint on every title or office change</text>
<text x="140" y="478" font-size="13" fill="#6b6b6b">a recurring line item</text>

<!-- METAL panel -->
<rect x="650" y="120" width="470" height="446" rx="16" fill="#ffffff" stroke="#a9cfb5" stroke-width="2"/>
<rect x="650" y="120" width="470" height="8" rx="4" fill="#3d6b6b"/>
<text x="885" y="166" text-anchor="middle" font-size="19" font-weight="800" letter-spacing="0.5" fill="#2c5454">METAL NFC CARD</text>
<rect x="820" y="188" width="130" height="80" rx="9" fill="url(#steel2)" stroke="#9aa3ad" stroke-width="2"/>
<rect x="905" y="200" width="34" height="26" rx="5" fill="none" stroke="#c39a5f" stroke-width="2"/>
<rect x="911" y="206" width="22" height="14" rx="3" fill="none" stroke="#c39a5f" stroke-width="2"/>
<text x="852" y="244" font-size="16" font-weight="800" letter-spacing="0.5" fill="#4a5568">STEEL</text>
<polyline points="686,316 693,323 705,309" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="720" y="316" font-size="15.5" font-weight="700" fill="#291c0e">15-20 g — weighed, kept, shown around</text>
<text x="720" y="338" font-size="13" fill="#4f6a6a">it earns a spot on the desk</text>
<polyline points="686,386 693,393 705,379" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="720" y="386" font-size="15.5" font-weight="700" fill="#291c0e">One tap saves the contact — no typing</text>
<text x="720" y="408" font-size="13" fill="#4f6a6a">no transcription to mangle</text>
<polyline points="686,456 693,463 705,449" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="720" y="456" font-size="15.5" font-weight="700" fill="#291c0e">Change details later; the card stays</text>
<text x="720" y="478" font-size="13" fill="#4f6a6a">update the profile, not the metal</text>

<text x="600" y="606" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The paper card is a recurring cost line; the metal card is a reusable channel.</text>
</svg>
