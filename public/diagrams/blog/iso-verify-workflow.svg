<text x="600" y="510" text-anchor="middle" font-size="13.5" fill="#2c5454">catches the 5-15% of certificates that are fake, expired or issued by a non-accredited body</text>

<text x="600" y="580" text-anchor="middle" font-size="13.5" fill="#5c5c5c">run it on every supplier — even the one your best contact swears by</text>
