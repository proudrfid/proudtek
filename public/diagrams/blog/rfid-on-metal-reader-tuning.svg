<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Three reader fixes for metal rooms: circular polarization, moderate power, angled antennas</title>
<desc id="d">Three panels of installation advice. Panel one, go circular not linear: a circularly polarized antenna sends interleaved waves and reads three tags at wildly different orientations, each with a green check. Panel two, ease off the power: a gauge shows the needle in a green sweet spot well short of maximum, because more power means more reflections — start medium and stop when it stops helping. Panel three, mind your angles: a beam aimed straight at a metal wall bounces straight back, while an antenna tilted down reads a tag on the floor cleanly. Below: the fourth quiet fix is zone isolation — directional patterns and reader filters stop shelving aisles from cross-reading.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
<pattern id="steel" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#eef1f5"/><path d="M -1 1 L 1 -1 M 0 12 L 12 0 M 11 13 L 13 11" stroke="#d3dae3" stroke-width="3"/></pattern>
<marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#3d6b6b"/></marker>
<marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8b2d2d"/></marker>
<marker id="arrRl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#bf8b8b"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TUNE THE ROOM, NOT JUST THE TAG</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Three quiet fixes that beat raw power</text>

<rect x="46" y="130" width="350" height="390" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="422" y="130" width="350" height="390" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="798" y="130" width="350" height="390" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>

<text x="221" y="166" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">Go circular, not linear</text>
<circle cx="86" cy="300" r="10" fill="#291c0e"/>
<path d="M 96 300 q 14 -24 28 0 t 28 0 t 28 0 t 28 0" fill="none" stroke="#3d6b6b" stroke-width="2.5" stroke-linecap="round"/>
<path d="M 96 300 q 14 24 28 0 t 28 0 t 28 0 t 28 0" fill="none" stroke="#9eb5b5" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="322,261 330,238 278,219 270,242" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<polygon points="340,294 326,274 280,306 294,326" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<polygon points="296,390 319,384 304,330 281,336" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<path d="M 344 232 l 6 6 l 11 -12" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 352 296 l 6 6 l 11 -12" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 330 362 l 6 6 l 11 -12" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="221" y="464" text-anchor="middle" font-size="12.5" fill="#4f4f4f">circular polarization reads every</text>
<text x="221" y="482" text-anchor="middle" font-size="12.5" fill="#4f4f4f">orientation the room throws at it</text>

<text x="597" y="166" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">Ease off the power</text>
<path d="M 509 336 A 88 88 0 0 1 685 336" fill="none" stroke="#e6dfd2" stroke-width="14" stroke-linecap="round"/>
<path d="M 509 336 A 88 88 0 0 1 620 251" fill="none" stroke="#1f6f3a" stroke-width="14" stroke-linecap="round"/>
<path d="M 677 299 A 88 88 0 0 1 685 336" fill="none" stroke="#8b2d2d" stroke-width="14" stroke-linecap="round"/>
<line x1="597" y1="336" x2="540" y2="269" stroke="#291c0e" stroke-width="4" stroke-linecap="round"/>
<circle cx="597" cy="336" r="7" fill="#291c0e"/>
<text x="502" y="368" text-anchor="middle" font-size="12.5" fill="#4f4f4f">low</text>
<text x="536" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6f3a">sweet spot</text>
<text x="680" y="368" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">MAX</text>
<text x="597" y="464" text-anchor="middle" font-size="12.5" fill="#4f4f4f">more power = more reflections —</text>
<text x="597" y="482" text-anchor="middle" font-size="12.5" fill="#4f4f4f">start medium, stop when it stops helping</text>

<text x="973" y="166" text-anchor="middle" font-size="16" font-weight="800" fill="#2c5454">Mind your angles</text>
<rect x="1104" y="180" width="18" height="260" fill="url(#steel)" stroke="#4a5568" stroke-width="1.8"/>
<line x1="812" y1="440" x2="1134" y2="440" stroke="#d3dae3" stroke-width="2"/>
<rect x="822" y="216" width="56" height="28" rx="7" fill="#291c0e"/>
<line x1="882" y1="230" x2="1096" y2="230" stroke="#8b2d2d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrR)"/>
<line x1="1096" y1="238" x2="904" y2="320" stroke="#bf8b8b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrRl)"/>
<text x="985" y="212" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">straight in = straight back</text>
<rect x="822" y="330" width="56" height="28" rx="7" fill="#291c0e"/>
<line x1="880" y1="352" x2="1040" y2="428" stroke="#3d6b6b" stroke-width="3" marker-end="url(#arrB)"/>
<rect x="1022" y="422" width="56" height="16" rx="3" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<text x="856" y="410" font-size="12.5" font-weight="700" fill="#1f6f3a">tilt = clean read</text>
<text x="973" y="464" text-anchor="middle" font-size="12.5" fill="#4f4f4f">aim antennas past big metal</text>
<text x="973" y="482" text-anchor="middle" font-size="12.5" fill="#4f4f4f">surfaces, not into them</text>

<text x="600" y="560" text-anchor="middle" font-size="14.5" font-weight="600" fill="#291c0e">There is a fourth quiet fix: zone isolation.</text>
<text x="600" y="588" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Directional patterns and reader filters stop shelving aisles from cross-reading — good fences make good inventory counts.</text>
</svg>
