<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Four NFC write-protection states, from wide open to welded shut</title>
<desc id="d">Four cards, each with a padlock. None: an open padlock — anyone with a phone can rewrite the tag, internal testing only. Password, on NTAG21x: a closed green padlock with a 32-bit password — authorized staff can still update it; recommended for B2B. Permanent, using OTP lock bits: a closed dark padlock — content fixed forever, no command undoes it. Dynamic lock bits: a half-and-half padlock — some memory pages frozen, others writable, good for a fixed URL with editable metadata. A banner advises: password-protect, don't permanently lock — forever is a long time to regret a typo.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WRITE PROTECTION · FROM WIDE OPEN TO WELDED SHUT</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Four lock states — only one keeps your options open</text>

<rect x="70" y="150" width="250" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="195" y="190" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">None</text>
<path d="M 173 252 v -16 a 22 22 0 0 1 44 0 v 4" fill="none" stroke="#8b2d2d" stroke-width="6" stroke-linecap="round"/>
<rect x="163" y="252" width="64" height="48" rx="8" fill="#8b2d2d"/>
<circle cx="195" cy="272" r="5" fill="#ffffff"/>
<text x="195" y="340" text-anchor="middle" font-size="12.5" fill="#4f4f4f">anyone with an NFC phone</text>
<text x="195" y="362" text-anchor="middle" font-size="12.5" fill="#4f4f4f">can rewrite it, forever</text>
<rect x="108" y="386" width="174" height="30" rx="15" fill="#f3e3e3" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="195" y="406" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">internal testing only</text>

<rect x="350" y="150" width="250" height="290" rx="14" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="2"/>
<text x="475" y="190" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1b4332">Password (NTAG21x)</text>
<path d="M 453 252 v -16 a 22 22 0 0 1 44 0 v 16" fill="none" stroke="#1f6f3a" stroke-width="6" stroke-linecap="round"/>
<rect x="443" y="252" width="64" height="48" rx="8" fill="#1f6f3a"/>
<text x="475" y="283" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">••••</text>
<text x="475" y="340" text-anchor="middle" font-size="12.5" fill="#4f4f4f">32-bit password gates writes —</text>
<text x="475" y="362" text-anchor="middle" font-size="12.5" fill="#4f4f4f">authorized staff still update</text>
<rect x="382" y="386" width="186" height="30" rx="15" fill="#1f6f3a"/>
<text x="475" y="406" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">recommended for B2B</text>

<rect x="630" y="150" width="250" height="290" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="755" y="190" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Permanent (OTP)</text>
<path d="M 733 252 v -16 a 22 22 0 0 1 44 0 v 16" fill="none" stroke="#4a5568" stroke-width="6" stroke-linecap="round"/>
<rect x="723" y="252" width="64" height="48" rx="8" fill="#4a5568"/>
<text x="755" y="282" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">OTP</text>
<text x="755" y="340" text-anchor="middle" font-size="12.5" fill="#4f4f4f">lock bits fix the content</text>
<text x="755" y="362" text-anchor="middle" font-size="12.5" fill="#4f4f4f">forever — no command undoes it</text>
<rect x="672" y="386" width="166" height="30" rx="15" fill="#eef1f5" stroke="#4a5568" stroke-width="1.5"/>
<text x="755" y="406" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a5568">no take-backs, ever</text>

<rect x="910" y="150" width="250" height="290" rx="14" fill="#ffffff" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="1035" y="190" text-anchor="middle" font-size="16.5" font-weight="700" fill="#291c0e">Dynamic lock bits</text>
<path d="M 1013 252 v -16 a 22 22 0 0 1 44 0 v 16" fill="none" stroke="#3d6b6b" stroke-width="6" stroke-linecap="round"/>
<rect x="1003" y="252" width="64" height="48" rx="8" fill="#3d6b6b"/>
<rect x="1037" y="256" width="26" height="40" rx="6" fill="#b7cccc"/>
<text x="1035" y="340" text-anchor="middle" font-size="12.5" fill="#4f4f4f">freeze some memory pages,</text>
<text x="1035" y="362" text-anchor="middle" font-size="12.5" fill="#4f4f4f">leave the rest writable</text>
<rect x="925" y="386" width="220" height="30" rx="15" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="1035" y="406" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">fixed URL, editable metadata</text>

<rect x="240" y="490" width="720" height="100" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="530" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="21" font-weight="700" fill="#291c0e">Password-protect. Don't permanently lock.</text>
<text x="600" y="562" text-anchor="middle" font-size="14" fill="#4f4f4f">"Forever" is a long time to regret a typo — keep the campaign-refresh option alive.</text>

<text x="600" y="630" text-anchor="middle" font-size="13" fill="#5c5c5c">OTP = one-time programmable. The name is the warning.</text>
</svg>
