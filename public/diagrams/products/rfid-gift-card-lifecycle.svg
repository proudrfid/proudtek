<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID gift-card lifecycle — four steps from print run to tap-to-redeem, with a reload loop</title>
<desc id="d">A four-step left-to-right flow. Step one, print and encode: offset or UV digital print, UID plus an NDEF balance URL written to the chip, then scratch-PIN and packaging. Step two, on the rack: cards ship deactivated with zero balance loaded, so stock stolen from the display is worthless until sold. Step three, activate at POS: the cashier scans the barcode and reveals the PIN, the processor loads the balance, and the card flips live. Step four, tap to redeem: the recipient taps in under one second, the UID drives a balance lookup, with a sub-500-millisecond processor round-trip. A dashed reload loop returns from step four to the POS — top up at the point of sale, online, or in a wallet pass for a repeat visit. A bottom band notes breakage: 6 to 12 percent of loaded value is never redeemed and books as revenue under ASC 606 and IFRS 15, the structural margin of the programme, while the US CARD Act bars expiry inside 5 years.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID GIFT-CARD LIFECYCLE</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Four moves, and the chip never changes</text>

<!-- STEP 1 -->
<rect x="56" y="150" width="232" height="250" rx="14" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.8"/>
<circle cx="172" cy="196" r="21" fill="#6d5a3a"/>
<text x="172" y="203" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
<text x="172" y="252" text-anchor="middle" font-size="15.5" font-weight="800" fill="#6d5a3a">PRINT &amp; ENCODE</text>
<text x="172" y="292" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Offset / UV digital print</text>
<text x="172" y="320" text-anchor="middle" font-size="12.5" fill="#4f4f4f">UID + NDEF balance URL</text>
<text x="172" y="348" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Scratch-PIN + packaging</text>

<!-- STEP 2 -->
<rect x="341" y="150" width="232" height="250" rx="14" fill="#eef1f4" stroke="#4a5568" stroke-width="1.8"/>
<circle cx="457" cy="196" r="21" fill="#4a5568"/>
<text x="457" y="203" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
<text x="457" y="252" text-anchor="middle" font-size="15.5" font-weight="800" fill="#4a5568">ON THE RACK</text>
<text x="457" y="292" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Ships deactivated</text>
<text x="457" y="320" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Zero balance loaded</text>
<text x="457" y="348" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Worthless until sold</text>

<!-- STEP 3 -->
<rect x="626" y="150" width="232" height="250" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.8"/>
<circle cx="742" cy="196" r="21" fill="#3d6b6b"/>
<text x="742" y="203" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
<text x="742" y="252" text-anchor="middle" font-size="15.5" font-weight="800" fill="#2c5454">ACTIVATE AT POS</text>
<text x="742" y="292" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Scan barcode, reveal PIN</text>
<text x="742" y="320" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Processor loads balance</text>
<text x="742" y="348" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Card flips live</text>

<!-- STEP 4 -->
<rect x="911" y="150" width="232" height="250" rx="14" fill="#eef5f5" stroke="#2c5454" stroke-width="2"/>
<circle cx="1027" cy="196" r="21" fill="#2c5454"/>
<text x="1027" y="203" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">4</text>
<text x="1027" y="252" text-anchor="middle" font-size="15.5" font-weight="800" fill="#2c5454">TAP TO REDEEM</text>
<text x="1027" y="292" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Tap in under 1 second</text>
<text x="1027" y="320" text-anchor="middle" font-size="12.5" fill="#4f4f4f">UID → balance lookup</text>
<text x="1027" y="348" text-anchor="middle" font-size="12.5" fill="#4f4f4f">&lt; 500 ms round-trip</text>

<!-- arrows between steps -->
<path d="M 300 275 H 328 l -4 -7 m 4 7 l -4 7" fill="none" stroke="#6d5a3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 585 275 H 613 l -4 -7 m 4 7 l -4 7" fill="none" stroke="#4a5568" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 870 275 H 898 l -4 -7 m 4 7 l -4 7" fill="none" stroke="#3d6b6b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

<!-- reload loop: from step 4 back toward POS -->
<path d="M 1027 400 V 436 H 742 V 400" fill="none" stroke="#3d6b6b" stroke-width="2.4" stroke-dasharray="7 5"/>
<path d="M 742 400 l -6 12 h 12 z" fill="#3d6b6b"/>
<rect x="612" y="452" width="376" height="34" rx="9" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.4"/>
<text x="800" y="474" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c5454">RELOAD — POS, online or in-wallet top-up → repeat visit</text>

<!-- bottom band: breakage economics -->
<rect x="56" y="516" width="1087" height="112" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<rect x="80" y="540" width="128" height="64" rx="10" fill="#6d5a3a"/>
<text x="144" y="568" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">BREAKAGE</text>
<text x="144" y="590" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">6–12 %</text>
<text x="238" y="562" font-size="14" font-weight="700" fill="#291c0e">6–12 % of loaded value is never redeemed — booked as revenue under ASC 606 / IFRS 15.</text>
<text x="238" y="588" font-size="13" fill="#4f4f4f">The structural margin of the programme. In the US, the CARD Act bars expiry inside 5 years.</text>
</svg>
