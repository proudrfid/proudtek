<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID wristbands versus QR code tickets for events, side by side</title>
<desc id="d">A side-by-side of two event credentials. The RFID wristband taps in 200 to 500 milliseconds, clears 15 to 20 attendees per minute per lane, supports cashless payment and zone tracking, and costs 0.50 to 3.00 dollars per band. The QR code ticket scans in 1 to 3 seconds, clears 5 to 8 attendees per minute per lane, does gate access only, and costs 0 to 0.10 dollars per code. Break-even sits around 3,000 to 5,000 attendees with food and beverage sales, and many large events run a hybrid split.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID vs QR CODES FOR EVENTS</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Speed and revenue on one side; cost and simplicity on the other.</text>

<!-- RFID panel -->
<rect x="80" y="120" width="505" height="380" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.8"/>
<text x="332" y="162" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.6" fill="#2c5454">RFID WRISTBAND</text>
<line x1="120" y1="180" x2="544" y2="180" stroke="#d7e6e6" stroke-width="1.4"/>
<text x="332" y="224" text-anchor="middle" font-size="30" font-weight="800" font-family="Lora, Georgia, serif" fill="#2c5454">200-500 ms</text>
<text x="332" y="248" text-anchor="middle" font-size="13.5" fill="#5c5c5c">per tap</text>
<text x="332" y="298" text-anchor="middle" font-size="30" font-weight="800" font-family="Lora, Georgia, serif" fill="#2c5454">15-20 / min</text>
<text x="332" y="322" text-anchor="middle" font-size="13.5" fill="#5c5c5c">attendees per gate lane</text>
<text x="332" y="372" text-anchor="middle" font-size="18" font-weight="700" fill="#291c0e">Cashless pay + zone tracking</text>
<text x="332" y="438" text-anchor="middle" font-size="30" font-weight="800" font-family="Lora, Georgia, serif" fill="#2c5454">$0.50-3.00</text>
<text x="332" y="462" text-anchor="middle" font-size="13.5" fill="#5c5c5c">per wristband</text>

<!-- QR panel -->
<rect x="615" y="120" width="505" height="380" rx="16" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.8"/>
<text x="867" y="162" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.6" fill="#a07d43">QR CODE TICKET</text>
<line x1="655" y1="180" x2="1079" y2="180" stroke="#ecdcb4" stroke-width="1.4"/>
<text x="867" y="224" text-anchor="middle" font-size="30" font-weight="800" font-family="Lora, Georgia, serif" fill="#a07d43">1-3 s</text>
<text x="867" y="248" text-anchor="middle" font-size="13.5" fill="#5c5c5c">per scan</text>
<text x="867" y="298" text-anchor="middle" font-size="30" font-weight="800" font-family="Lora, Georgia, serif" fill="#a07d43">5-8 / min</text>
<text x="867" y="322" text-anchor="middle" font-size="13.5" fill="#5c5c5c">attendees per gate lane</text>
<text x="867" y="372" text-anchor="middle" font-size="18" font-weight="700" fill="#291c0e">Gate access only</text>
<text x="867" y="438" text-anchor="middle" font-size="30" font-weight="800" font-family="Lora, Georgia, serif" fill="#a07d43">$0-0.10</text>
<text x="867" y="462" text-anchor="middle" font-size="13.5" fill="#5c5c5c">per code</text>

<!-- VS badge -->
<circle cx="600" cy="300" r="34" fill="#ffffff" stroke="#c39a5f" stroke-width="2.4"/>
<text x="600" y="308" text-anchor="middle" font-size="20" font-weight="800" fill="#6d5a3a">VS</text>

<!-- break-even ribbon -->
<rect x="80" y="524" width="1040" height="64" rx="20" fill="#eef1f5" stroke="#d3d9e2" stroke-width="1.6"/>
<text x="600" y="551" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">Break-even near 3,000-5,000 attendees with food &amp; beverage sales.</text>
<text x="600" y="573" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Below it, QR usually wins; above it, RFID's revenue funds the cost — many events run a hybrid split.</text>

<text x="600" y="626" text-anchor="middle" font-size="13.5" fill="#8a8a8a">Scan speeds, throughput and credential prices per this article's comparison table.</text>
</svg>
