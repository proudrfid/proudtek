<text x="566" y="430" font-size="13" font-weight="700" fill="#2d6a4f">0%</text>
<text x="832" y="430" font-size="13" font-weight="700" fill="#2d6a4f">0%</text>
<text x="966" y="430" font-size="12.5" fill="#8a8172">—</text>
<rect x="76" y="470" width="14" height="14" rx="3" fill="#8b2d2d"/>
<text x="98" y="482" font-size="12.5" fill="#5c5c5c">§301 = Section 301 List 3 surcharge, China origin only — Mexico and Vietnam origin avoid it.</text>
<text x="600" y="602" text-anchor="middle" font-size="13.5" fill="#4f4f4f">Pre-clear with a binding ruling (US CBP CROSS, EU BTI) before the first shipment.</text>
