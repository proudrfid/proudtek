<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Shenzhen to Japan — freight lanes and landed cost</title>
  <desc id="d">Freight from Shenzhen to Japan: express air via DHL or FedEx reaches Tokyo, Osaka and Nagoya in 3-5 business days; sea freight serves bulk orders. At import, RFID proximity cards and tags enter at 0% duty under HS 8523.52 (smart cards are covered by the WTO Information Technology Agreement), and the 10% Japan Consumption Tax applies on the customs value plus duty. The reader carries the Giteki mark while passive tags are exempt. DDP is available so the landed cost is quoted up front.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SHENZHEN &#8594; JAPAN — LANES AND LANDED COST</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Air in 3-5 business days; 0% import duty; 10% consumption tax</text>

  <!-- origin -->
  <rect x="70" y="200" width="180" height="90" rx="12" fill="#4a5568"/>
  <text x="160" y="238" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">SHENZHEN</text>
  <text x="160" y="262" text-anchor="middle" font-size="12.5" fill="#dfe4ea">one production line,</text>
  <text x="160" y="280" text-anchor="middle" font-size="12.5" fill="#dfe4ea">JP-spec sheets</text>

  <!-- air lane -->
  <line x1="250" y1="222" x2="470" y2="222" stroke="#3d6b6b" stroke-width="3"/>
  <polygon points="470,222 456,216 456,228" fill="#3d6b6b"/>
  <text x="360" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#3d6b6b">Air &#183; DHL / FedEx &#183; 3-5 days</text>
  <!-- sea lane -->
  <line x1="250" y1="268" x2="470" y2="268" stroke="#8a6d3b" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="470,268 456,262 456,274" fill="#8a6d3b"/>
  <text x="360" y="290" text-anchor="middle" font-size="13" fill="#8a6d3b">Sea &#183; bulk programmes</text>

  <!-- destinations -->
  <rect x="480" y="150" width="230" height="196" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="595" y="182" text-anchor="middle" font-size="15" font-weight="800" fill="#2c5454">JAPAN</text>
  <text x="595" y="214" text-anchor="middle" font-size="14" fill="#291c0e">Tokyo &#183; Osaka</text>
  <text x="595" y="238" text-anchor="middle" font-size="14" fill="#291c0e">Nagoya</text>
  <text x="595" y="278" text-anchor="middle" font-size="12.5" fill="#5c5c5c">Free sample kits ship</text>
  <text x="595" y="296" text-anchor="middle" font-size="12.5" fill="#5c5c5c">to Japanese addresses first</text>

  <!-- landed cost -->
  <rect x="740" y="150" width="390" height="196" rx="12" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="760" y="182" font-size="15" font-weight="800" letter-spacing="0.3" fill="#6d5a3a">AT IMPORT</text>
  <text x="760" y="214" font-size="14" fill="#291c0e">Duty — 0% on HS 8523.52 (proximity tags)</text>
  <text x="760" y="242" font-size="14" fill="#291c0e">Consumption tax — 10% at import</text>
  <text x="760" y="270" font-size="14" fill="#291c0e">Incoterms — EXW, FOB, or DDP up front</text>
  <text x="760" y="298" font-size="12.5" fill="#5c5c5c">Smart cards are WTO ITA-covered — duty-free;</text>
  <text x="760" y="316" font-size="12.5" fill="#5c5c5c">the reader carries the Giteki mark, tags exempt</text>

  <rect x="70" y="400" width="1060" height="86" rx="12" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="92" y="430" font-size="15" font-weight="700" fill="#2c5454">Time zones work in your favour</text>
  <text x="92" y="453" font-size="13.5" fill="#3d6b6b">Shenzhen's workday nearly overlaps Japan's, so an RFQ sent at close of business is usually quoted the same or next morning.</text>
  <text x="92" y="473" font-size="13.5" fill="#5c5c5c">DDP means the price includes freight, the 10% consumption tax and clearance — no surprise line items at the border.</text>

  <text x="600" y="536" text-anchor="middle" font-size="13" fill="#9aa4b2">Transit and duty figures are indicative; confirm exact lead time and Incoterm on your quote.</text>
</svg>
