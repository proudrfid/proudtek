<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Multi-season reuse loop — 100,000+ write cycles of silicon patience</title>
  <desc id="d">Reuse cycle: issue, wear through pool chlorine and daily knocks under IP68, return, sanitise, re-encode and reissue next season — MIFARE and NTAG silicon is rated for 100,000+ EEPROM write cycles per NXP data sheets, so the band retires on cosmetics, not electronics.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Retires on scuffs, never on silicon</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">100,000+ EEPROM write cycles — the chip outlives every season pass you issue it</text>
  <g transform="translate(140,170)" font-family="Helvetica, Arial, sans-serif" font-size="14">
    <rect x="0" y="0" width="220" height="90" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="38" font-family="Georgia, serif" font-size="16" fill="#2c5454">Issue</text>
    <text x="24" y="66" font-size="13" fill="#6d5a3a">encode member ID, hand over</text>
    <rect x="330" y="0" width="220" height="90" rx="12" fill="#eef2f0" stroke="#2c5454" stroke-width="2.5"/>
    <text x="354" y="38" font-family="Georgia, serif" font-size="16" fill="#2c5454">Wear all season</text>
    <text x="354" y="66" font-size="13" fill="#2c5454">IP68 · pool chlorine tolerant</text>
    <rect x="660" y="0" width="220" height="90" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="684" y="38" font-family="Georgia, serif" font-size="16" fill="#2c5454">Return + sanitise</text>
    <text x="684" y="66" font-size="13" fill="#6d5a3a">wash-down, visual check</text>
    <rect x="330" y="180" width="220" height="90" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="354" y="218" font-family="Georgia, serif" font-size="16" fill="#291c0e">Re-encode + reissue</text>
    <text x="354" y="246" font-size="13" fill="#6d5a3a">next member, next season</text>
    <path d="M 225 45 L 323 45" stroke="#6d5a3a" stroke-width="2.5" marker-end="url(#aa)"/>
    <path d="M 555 45 L 653 45" stroke="#6d5a3a" stroke-width="2.5" marker-end="url(#aa)"/>
    <path d="M 770 95 C 760 160 620 210 557 222" stroke="#6d5a3a" stroke-width="2.5" fill="none" marker-end="url(#aa)"/>
    <path d="M 325 222 C 240 210 120 160 108 98" stroke="#6d5a3a" stroke-width="2.5" fill="none" marker-end="url(#aa)"/>
    <defs><marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d5a3a"/></marker></defs>
  </g>
  <text x="70" y="580" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Pantone-matched colour runs through the silicone — it survives wear cycles even with surface scuffs</text>
</svg>
