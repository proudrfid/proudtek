<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The four EPC Gen2 memory banks — Reserved, EPC, TID and User</title>
<desc id="d">Four labeled columns, one per EPC Gen2 memory bank. Bank 0, Reserved, in steel: the kill password and access password, 32 bits each — the keys to the building, never left at default. Bank 1, EPC, in teal with a barcode motif: the Electronic Product Code, 96 bits typical and extendable to 496 bits, beginning at word 2 after the CRC and PC word — the identity everyone actually reads. Bank 2, TID, in gold: the chip ID and model, 64-bit and sometimes 96, read-only and locked at the foundry — the anti-clone fingerprint. Bank 3, User, on cream: optional scratch space of 0 to 512 bits depending on the chip, sometimes zero bytes — check the datasheet before you design around it.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">UHF EPC GEN2 — FOUR BANKS, FOUR TENANTS</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">One very small building, four very different tenants</text>

<!-- BANK 0 -->
<rect x="70" y="130" width="250" height="420" rx="16" fill="#4a5568"/>
<text x="195" y="168" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#d3dae3">BANK 0</text>
<text x="195" y="198" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">Reserved</text>
<path d="M 183 240 v -9 a 12 12 0 0 1 24 0 v 9" fill="none" stroke="#eef1f5" stroke-width="3.5"/>
<rect x="175" y="240" width="40" height="28" rx="5" fill="#eef1f5"/>
<rect x="92" y="292" width="206" height="46" rx="8" fill="#5c6675" stroke="#6d7889"/>
<text x="195" y="312" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Kill password</text>
<text x="195" y="330" text-anchor="middle" font-size="12.5" fill="#d3dae3">32 bits</text>
<rect x="92" y="350" width="206" height="46" rx="8" fill="#5c6675" stroke="#6d7889"/>
<text x="195" y="370" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Access password</text>
<text x="195" y="388" text-anchor="middle" font-size="12.5" fill="#d3dae3">32 bits</text>
<text x="195" y="480" text-anchor="middle" font-size="12.5" fill="#d3dae3">The keys to the building —</text>
<text x="195" y="500" text-anchor="middle" font-size="12.5" fill="#d3dae3">never leave them at default.</text>

<!-- BANK 1 -->
<rect x="340" y="130" width="250" height="420" rx="16" fill="#3d6b6b"/>
<text x="465" y="168" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#cfe0e0">BANK 1</text>
<text x="465" y="198" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">EPC</text>
<g fill="#ffffff">
<rect x="392" y="224" width="6" height="40"/><rect x="404" y="224" width="3" height="40"/><rect x="412" y="224" width="8" height="40"/><rect x="425" y="224" width="4" height="40"/><rect x="435" y="224" width="9" height="40"/><rect x="449" y="224" width="3" height="40"/><rect x="457" y="224" width="6" height="40"/><rect x="468" y="224" width="4" height="40"/><rect x="478" y="224" width="9" height="40"/><rect x="492" y="224" width="3" height="40"/><rect x="501" y="224" width="7" height="40"/><rect x="513" y="224" width="5" height="40"/><rect x="523" y="224" width="9" height="40"/><rect x="537" y="224" width="4" height="40"/>
</g>
<text x="465" y="288" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d8eaea">Electronic Product Code</text>
<rect x="362" y="306" width="206" height="56" rx="8" fill="#2c5454"/>
<text x="465" y="330" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">96 bits typical</text>
<text x="465" y="350" text-anchor="middle" font-size="12.5" fill="#cfe0e0">extendable to 496 bits</text>
<text x="465" y="388" text-anchor="middle" font-size="12.5" fill="#cfe0e0">begins at word 2, after CRC + PC</text>
<text x="465" y="480" text-anchor="middle" font-size="12.5" fill="#cfe0e0">The identity everyone</text>
<text x="465" y="500" text-anchor="middle" font-size="12.5" fill="#cfe0e0">actually reads.</text>

<!-- BANK 2 -->
<rect x="610" y="130" width="250" height="420" rx="16" fill="#c39a5f"/>
<text x="735" y="168" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#52401f">BANK 2</text>
<text x="735" y="198" text-anchor="middle" font-size="21" font-weight="800" fill="#291c0e">TID</text>
<circle cx="735" cy="244" r="20" fill="none" stroke="#52401f" stroke-width="2.5"/>
<circle cx="735" cy="244" r="12" fill="none" stroke="#52401f" stroke-width="2"/>
<circle cx="735" cy="244" r="4" fill="#52401f"/>
<rect x="632" y="292" width="206" height="56" rx="8" fill="#f7edd6" stroke="#e4c98f"/>
<text x="735" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Chip ID + model</text>
<text x="735" y="336" text-anchor="middle" font-size="12.5" fill="#52401f">64-bit (sometimes 96)</text>
<rect x="632" y="360" width="206" height="40" rx="8" fill="#52401f"/>
<text x="735" y="385" text-anchor="middle" font-size="13" font-weight="800" fill="#f7edd6">READ-ONLY · locked</text>
<text x="735" y="480" text-anchor="middle" font-size="12.5" fill="#52401f">Burned in at the foundry.</text>
<text x="735" y="500" text-anchor="middle" font-size="12.5" fill="#52401f">Your anti-clone fingerprint.</text>

<!-- BANK 3 -->
<rect x="880" y="130" width="250" height="420" rx="16" fill="#faf6ec" stroke="#e3d8c4" stroke-width="1.5"/>
<text x="1005" y="168" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">BANK 3</text>
<text x="1005" y="198" text-anchor="middle" font-size="21" font-weight="800" fill="#291c0e">User</text>
<rect x="985" y="222" width="40" height="46" rx="5" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
<line x1="993" y1="236" x2="1017" y2="236" stroke="#e4c98f" stroke-width="2"/>
<line x1="993" y1="246" x2="1017" y2="246" stroke="#e4c98f" stroke-width="2"/>
<line x1="993" y1="256" x2="1009" y2="256" stroke="#e4c98f" stroke-width="2"/>
<rect x="902" y="292" width="206" height="56" rx="8" fill="#ffffff" stroke="#e3d8c4"/>
<text x="1005" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">Optional scratch space</text>
<text x="1005" y="336" text-anchor="middle" font-size="12.5" fill="#4f4f4f">0–512 bits (chip-dependent)</text>
<rect x="902" y="360" width="206" height="40" rx="8" fill="#6d5a3a"/>
<text x="1005" y="385" text-anchor="middle" font-size="13" font-weight="800" fill="#f7edd6">sometimes: zero bytes</text>
<text x="1005" y="480" text-anchor="middle" font-size="12.5" fill="#4f4f4f">Check the datasheet before</text>
<text x="1005" y="500" text-anchor="middle" font-size="12.5" fill="#4f4f4f">you design around it.</text>

<text x="600" y="596" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="20" font-weight="700" fill="#291c0e">Reserved holds the keys, EPC is the name badge, TID is the birth certificate — and User may not exist.</text>
<text x="600" y="628" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Each bank locks separately — set real passwords in Bank 0 before tags leave the building.</text>
</svg>
