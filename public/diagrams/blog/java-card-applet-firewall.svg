<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The applet firewall — three applets on one chip, each sealed in its own vault</title>
<desc id="d">One secure element drawn as a single chip holds three vaults: an Access vault with a PKI applet, a Payment vault with an EMV applet, and a Door vault with a DESFire applet. Hatched gold firewall walls separate them. A red dashed arrow from the Access vault is stopped at the wall with a denied cross — one applet cannot read another's data. A green arrow passes through a small sanctioned door in the second wall with a check mark — a shareable interface both sides agreed to open. Caption: good fences make good multi-application neighbours.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE CHIP · THREE TENANTS · ZERO TRUST</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">The applet firewall keeps every tenant in its vault</text>

<!-- the chip -->
<rect x="72" y="140" width="1056" height="360" rx="18" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
<text x="96" y="174" text-anchor="start" font-size="12.5" font-weight="700" letter-spacing="1" fill="#6d5a3a">ONE SECURE ELEMENT</text>
<text x="1104" y="174" text-anchor="end" font-size="12.5" fill="#6d5a3a">hatched walls = applet firewall</text>

<!-- firewall wall 1 -->
<rect x="417" y="214" width="24" height="228" rx="5" fill="#d4a755" stroke="#6d5a3a" stroke-width="1"/>
<line x1="417" y1="238" x2="441" y2="214" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="417" y1="262" x2="441" y2="238" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="417" y1="286" x2="441" y2="262" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="417" y1="310" x2="441" y2="286" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="417" y1="334" x2="441" y2="310" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="417" y1="358" x2="441" y2="334" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="417" y1="382" x2="441" y2="358" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="417" y1="406" x2="441" y2="382" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="417" y1="430" x2="441" y2="406" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="417" y1="442" x2="441" y2="418" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<!-- firewall wall 2 -->
<rect x="760" y="214" width="24" height="228" rx="5" fill="#d4a755" stroke="#6d5a3a" stroke-width="1"/>
<line x1="760" y1="238" x2="784" y2="214" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="760" y1="262" x2="784" y2="238" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="760" y1="286" x2="784" y2="262" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="760" y1="310" x2="784" y2="286" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="760" y1="334" x2="784" y2="310" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="760" y1="358" x2="784" y2="334" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="760" y1="382" x2="784" y2="358" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="760" y1="406" x2="784" y2="382" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="760" y1="430" x2="784" y2="406" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>
<line x1="760" y1="442" x2="784" y2="418" stroke="#6d5a3a" stroke-width="3" opacity="0.55"/>

<!-- vault 1: Access -->
<rect x="112" y="220" width="290" height="210" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="136" y="244" width="52" height="52" rx="10" fill="#c39a5f"/>
<circle cx="154" cy="262" r="6.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
<path d="M 159 267 L 173 281 M 167 275 l 5 -5 M 172 280 l 5 -5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
<text x="204" y="266" text-anchor="start" font-size="17" font-weight="700" fill="#291c0e">Access</text>
<text x="204" y="290" text-anchor="start" font-size="13" fill="#4f4f4f">PKI applet</text>
<line x1="136" y1="318" x2="378" y2="318" stroke="#f0ead9" stroke-width="1.5"/>
<text x="257" y="346" text-anchor="middle" font-size="12.5" fill="#6d5a3a">private keys · private data</text>
<line x1="300" y1="386" x2="410" y2="386" stroke="#8b2d2d" stroke-width="2.5" stroke-dasharray="7 5"/>
<circle cx="429" cy="386" r="13" fill="#ffffff" stroke="#8b2d2d" stroke-width="2.5"/>
<path d="M 423 380 l 12 12 M 435 380 l -12 12" stroke="#8b2d2d" stroke-width="2.5" stroke-linecap="round"/>
<text x="340" y="472" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b2d2d">direct read — denied</text>

<!-- vault 2: Payment -->
<rect x="455" y="220" width="290" height="210" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="479" y="244" width="52" height="52" rx="10" fill="#3d6b6b"/>
<rect x="491" y="261" width="28" height="19" rx="3" fill="none" stroke="#ffffff" stroke-width="2.2"/>
<line x1="491" y1="268" x2="519" y2="268" stroke="#ffffff" stroke-width="2.2"/>
<text x="547" y="266" text-anchor="start" font-size="17" font-weight="700" fill="#291c0e">Payment</text>
<text x="547" y="290" text-anchor="start" font-size="13" fill="#4f4f4f">EMV applet</text>
<line x1="479" y1="318" x2="721" y2="318" stroke="#f0ead9" stroke-width="1.5"/>
<text x="600" y="346" text-anchor="middle" font-size="12.5" fill="#6d5a3a">private keys · private data</text>

<!-- vault 3: Door -->
<rect x="798" y="220" width="290" height="210" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="1.5"/>
<rect x="822" y="244" width="52" height="52" rx="10" fill="#4a5568"/>
<rect x="838" y="254" width="20" height="32" rx="2" fill="none" stroke="#ffffff" stroke-width="2.2"/>
<circle cx="853" cy="271" r="2" fill="#ffffff"/>
<text x="890" y="266" text-anchor="start" font-size="17" font-weight="700" fill="#291c0e">Door</text>
<text x="890" y="290" text-anchor="start" font-size="13" fill="#4f4f4f">DESFire applet</text>
<line x1="822" y1="318" x2="1064" y2="318" stroke="#f0ead9" stroke-width="1.5"/>
<text x="943" y="346" text-anchor="middle" font-size="12.5" fill="#6d5a3a">private keys · private data</text>

<!-- sanctioned shareable-interface door through wall 2 -->
<line x1="700" y1="386" x2="754" y2="386" stroke="#1f6f3a" stroke-width="2.5"/>
<rect x="758" y="372" width="28" height="28" rx="5" fill="#ffffff" stroke="#1f6f3a" stroke-width="2"/>
<path d="M 766 386 l 5 5 l 9 -10" fill="none" stroke="#1f6f3a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="790" y1="386" x2="828" y2="386" stroke="#1f6f3a" stroke-width="2.5"/>
<path d="M 828 380 l 11 6 l -11 6 z" fill="#1f6f3a"/>
<text x="772" y="472" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f6f3a">shareable interface — allowed</text>

<text x="600" y="548" text-anchor="middle" font-size="13.5" fill="#4f4f4f">One applet cannot read another's data — sharing happens only through an interface both sides agreed to open.</text>
<text x="600" y="584" text-anchor="middle" font-size="14" fill="#5c5c5c">Good fences make good multi-application neighbours.</text>
</svg>
