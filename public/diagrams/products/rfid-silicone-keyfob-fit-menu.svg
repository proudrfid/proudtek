<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Silicone fob fit menu — shapes, Shore hardness and two-shot colour</title>
  <desc id="d">Stock shapes: round 35 mm, oval 45 by 30 mm, rectangle 40 by 25 mm, with custom shapes from MOQ 1,000. Shore A hardness tunes 40-70 with the default 60 plus or minus 5 matching silicone wristband feel. Single or dual-colour two-shot moulding in any PMS with pad-print, silkscreen or laser marking.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Pick a shape, a squish, a colour</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Three stock moulds ship fast — custom geometry opens at 1,000 pieces</text>
  <g transform="translate(80,150)" font-family="Helvetica, Arial, sans-serif">
    <circle cx="110" cy="105" r="72" fill="#eef2f0" stroke="#2c5454" stroke-width="3"/>
    <circle cx="110" cy="42" r="9" fill="none" stroke="#2c5454" stroke-width="3"/>
    <text x="74" y="212" font-size="14" fill="#291c0e">Round Ø 35 mm</text>
    <ellipse cx="360" cy="105" rx="88" ry="60" fill="#ffffff" stroke="#3d6b6b" stroke-width="3"/>
    <circle cx="360" cy="50" r="9" fill="none" stroke="#3d6b6b" stroke-width="3"/>
    <text x="308" y="212" font-size="14" fill="#291c0e">Oval 45 × 30 mm</text>
    <rect x="530" y="55" width="130" height="95" rx="16" fill="#ffffff" stroke="#3d6b6b" stroke-width="3"/>
    <circle cx="595" cy="48" r="9" fill="none" stroke="#3d6b6b" stroke-width="3"/>
    <text x="522" y="212" font-size="14" fill="#291c0e">Rect 40 × 25 mm</text>
    <rect x="740" y="40" width="150" height="130" rx="18" fill="none" stroke="#c39a5f" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="756" y="110" font-size="13" fill="#6d5a3a">your shape here</text>
    <text x="742" y="212" font-size="14" fill="#291c0e">Custom @ MOQ 1,000</text>
  </g>
  <g transform="translate(80,420)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="490" height="130" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="2"/>
    <text x="24" y="38" font-family="Georgia, serif" font-size="17" fill="#2c5454">Shore A 40-70, tunable</text>
    <rect x="24" y="56" width="440" height="14" rx="7" fill="#eef2f0" stroke="#3d6b6b"/>
    <circle cx="290" cy="63" r="12" fill="#2c5454"/>
    <text x="24" y="102" font-size="13" fill="#6d5a3a">default Shore A 60 ± 5 — matches silicone-wristband feel</text>
    <rect x="540" y="0" width="490" height="130" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="564" y="38" font-family="Georgia, serif" font-size="17" fill="#291c0e">Any PMS, one or two shots</text>
    <text x="564" y="70" font-size="13" fill="#2c5454">dual-colour two-shot moulding · pad-print · silkscreen · laser mark</text>
    <text x="564" y="102" font-size="13" fill="#6d5a3a">13.56 MHz HF inside: MIFARE, DESFire EV3, NTAG 213/215/216</text>
  </g>
</svg>
