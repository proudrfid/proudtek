<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="scTitle scDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="scTitle">Manufacturer-direct versus trading-company sourcing</title>
  <desc id="scDesc">The trading-company route adds one or two middlemen and 15 to 30 percent markup with no engineering escalation; sourcing directly from Proud Tek keeps the margin and routes engineering to the team that specified and signed off the SKU.</desc>

  <rect width="1200" height="675" fill="#f8f6f1"/>
  <rect x="24" y="24" width="1152" height="627" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <!-- ============ Lane A: trading-company route ============ -->
  <text x="72" y="118" font-size="22" font-weight="700" letter-spacing="1.5" fill="#8a949c">TRADING-COMPANY ROUTE</text>

  <!-- Factory -->
  <rect x="72" y="150" width="230" height="96" rx="14" fill="#eef1f4" stroke="#c7cfd8" stroke-width="2"/>
  <text x="187" y="196" text-anchor="middle" font-size="26" font-weight="600" fill="#4a5568">Manufacturer</text>
  <text x="187" y="222" text-anchor="middle" font-size="18" fill="#7a8690">makes the inlay</text>

  <!-- arrow 1 -->
  <line x1="312" y1="198" x2="392" y2="198" stroke="#b6bfc9" stroke-width="4"/>
  <path d="M392 198 l-16 -9 v18 z" fill="#b6bfc9"/>

  <!-- Trading company -->
  <rect x="402" y="150" width="320" height="96" rx="14" fill="#eef1f4" stroke="#c7cfd8" stroke-width="2"/>
  <text x="562" y="192" text-anchor="middle" font-size="26" font-weight="600" fill="#4a5568">Trading company</text>
  <text x="562" y="222" text-anchor="middle" font-size="19" font-weight="700" fill="#8b2d2d">+15–30% markup</text>

  <!-- arrow 2 -->
  <line x1="732" y1="198" x2="812" y2="198" stroke="#b6bfc9" stroke-width="4"/>
  <path d="M812 198 l-16 -9 v18 z" fill="#b6bfc9"/>

  <!-- You (A) -->
  <rect x="822" y="150" width="230" height="96" rx="14" fill="#eef1f4" stroke="#c7cfd8" stroke-width="2"/>
  <text x="937" y="205" text-anchor="middle" font-size="26" font-weight="600" fill="#4a5568">You</text>

  <text x="72" y="286" font-size="19" fill="#7a8690">No direct engineering escalation  ·  compliance docs charged extra  ·  lead time follows their queue</text>

  <!-- divider -->
  <line x1="72" y1="332" x2="1128" y2="332" stroke="#ece5d8" stroke-width="2"/>

  <!-- ============ Lane B: Proud Tek direct ============ -->
  <rect x="48" y="360" width="1104" height="250" rx="18" fill="#fbf7ef" stroke="#e4c98f" stroke-width="2.5"/>

  <text x="72" y="410" font-size="22" font-weight="700" letter-spacing="1.5" fill="#6d5a3a">PROUD TEK — MANUFACTURER DIRECT</text>

  <!-- Proud Tek factory -->
  <rect x="72" y="442" width="380" height="120" rx="14" fill="#291c0e"/>
  <text x="262" y="486" text-anchor="middle" font-size="26" font-weight="700" fill="#f4efe7">Proud Tek</text>
  <text x="262" y="514" text-anchor="middle" font-size="18" fill="#c39a5f">inlay · lamination · encode · 100% QC</text>

  <!-- long arrow with accent -->
  <line x1="466" y1="502" x2="812" y2="502" stroke="#1fcefb" stroke-width="5"/>
  <path d="M812 502 l-18 -10 v20 z" fill="#1fcefb"/>
  <text x="639" y="480" text-anchor="middle" font-size="18" font-weight="600" fill="#3a4a52">manufacturer price direct</text>

  <!-- You (B) -->
  <rect x="822" y="442" width="258" height="120" rx="14" fill="#ffffff" stroke="#c39a5f" stroke-width="2.5"/>
  <text x="951" y="497" text-anchor="middle" font-size="26" font-weight="700" fill="#291c0e">You</text>

  <text x="72" y="592" font-size="19" fill="#6d5a3a">Engineering routed to the team that built the SKU  ·  ISO 9001  ·  compliance documentation included</text>
</svg>
