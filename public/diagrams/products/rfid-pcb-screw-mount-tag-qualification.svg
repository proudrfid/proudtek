<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Shock and vibration qualification of a screw-mount PCB RFID tag</title>
  <desc id="d">A qualification panel showing the mechanical and environmental envelope a screw-mount PCB RFID tag survives: an IEC 60068-2-6 sinusoidal vibration profile at 5 g RMS, 5-500 Hz, 2 h per axis; a MIL-STD-810G Method 516.6 shock pulse at 40 g, 11 ms half-sine plus Method 514.6 vibration; and four qualification cards — NEBS GR-63-CORE Level 3 office-vibration and earthquake, JEDEC JESD22-A101 ageing at 85 degrees C and 85 percent RH, a minus 40 to plus 85 degrees C service window with an IP65 face and conformal coating, and a 10-25 year service life with read-range drift under 1 dB.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">QUALIFIED FOR THE SHAKE-AND-SHOCK ENVELOPE</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#5c5c5c">Screw retention survives the vibration and shock profiles that fatigue an adhesive bond</text>

  <!-- vibration panel -->
  <rect x="70" y="118" width="520" height="214" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="90" y="150" font-size="15" font-weight="800" letter-spacing="0.3" fill="#3d6b6b">VIBRATION — IEC 60068-2-6</text>
  <line x1="100" y1="245" x2="560" y2="245" stroke="#c3ccd6" stroke-width="1.5"/>
  <path d="M100,245 q22.5,-34 45,0 t45,0 t45,0 t45,0 t45,0 t45,0 t45,0 t45,0 t45,0 t45,0" fill="none" stroke="#3d6b6b" stroke-width="3"/>
  <text x="90" y="300" font-size="13.5" font-weight="700" fill="#291c0e">5 g RMS · 5-500 Hz · 2 h per axis</text>
  <text x="90" y="320" font-size="12.5" fill="#5c5c5c">sinusoidal sweep, plant + rolling-stock profile</text>

  <!-- shock panel -->
  <rect x="610" y="118" width="520" height="214" rx="14" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <text x="630" y="150" font-size="15" font-weight="800" letter-spacing="0.3" fill="#6d5a3a">SHOCK — MIL-STD-810G 516.6</text>
  <line x1="640" y1="285" x2="1100" y2="285" stroke="#c3ccd6" stroke-width="1.5"/>
  <path d="M650,285 L740,285 q40,-110 80,0 L1090,285" fill="none" stroke="#c39a5f" stroke-width="3"/>
  <text x="630" y="308" font-size="13.5" font-weight="700" fill="#291c0e">40 g · 11 ms half-sine · + 514.6 vibration</text>

  <!-- qualification cards -->
  <text x="600" y="372" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">QUALIFIED ACROSS THE ESTATE</text>
  <rect x="70" y="392" width="250" height="118" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <path d="M280,414 l7,8 l14,-18" fill="none" stroke="#1f6f3a" stroke-width="3"/>
  <text x="90" y="432" font-size="15" font-weight="700" fill="#291c0e">NEBS GR-63-CORE</text>
  <text x="90" y="458" font-size="12.5" fill="#5c5c5c">Level 3 office-vibration</text>
  <text x="90" y="478" font-size="12.5" fill="#5c5c5c">+ earthquake profile</text>
  <rect x="340" y="392" width="250" height="118" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <path d="M550,414 l7,8 l14,-18" fill="none" stroke="#1f6f3a" stroke-width="3"/>
  <text x="360" y="432" font-size="15" font-weight="700" fill="#291c0e">JEDEC JESD22-A101</text>
  <text x="360" y="458" font-size="12.5" fill="#5c5c5c">85 °C / 85 % RH ageing</text>
  <text x="360" y="478" font-size="12.5" fill="#5c5c5c">humidity + thermal cycle</text>
  <rect x="610" y="392" width="250" height="118" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <path d="M820,414 l7,8 l14,-18" fill="none" stroke="#1f6f3a" stroke-width="3"/>
  <text x="630" y="432" font-size="15" font-weight="700" fill="#291c0e">-40 °C to +85 °C</text>
  <text x="630" y="458" font-size="12.5" fill="#5c5c5c">IP65 face + conformal</text>
  <text x="630" y="478" font-size="12.5" fill="#5c5c5c">coating for outdoor use</text>
  <rect x="880" y="392" width="250" height="118" rx="12" fill="#ffffff" stroke="#cdd7d7" stroke-width="2"/>
  <path d="M1090,414 l7,8 l14,-18" fill="none" stroke="#1f6f3a" stroke-width="3"/>
  <text x="900" y="432" font-size="15" font-weight="700" fill="#291c0e">10-25 yr service life</text>
  <text x="900" y="458" font-size="12.5" fill="#5c5c5c">no adhesive life to track</text>
  <text x="900" y="478" font-size="12.5" fill="#5c5c5c">read-range drift &lt; 1 dB</text>

  <text x="600" y="558" text-anchor="middle" font-size="13.5" fill="#291c0e">One SKU spans data-centre / telco NEBS, rolling-stock MIL-STD-810G and outdoor-industrial.</text>
  <text x="600" y="582" text-anchor="middle" font-size="13" fill="#5c5c5c">All environments where adhesive-backed tags are explicitly prohibited.</text>
</svg>
