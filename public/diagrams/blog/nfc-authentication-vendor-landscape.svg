<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The NFC authentication supply chain in five layers a procurement team evaluates</title>
<desc id="d">Five stacked layers. Chip suppliers: NXP, Infineon, STMicroelectronics. Inlay and converter vendors: Avery Dennison Smartrac, Identiv, SATO, Beontag. SaaS authentication platforms: Authena, Arianee, EON, Scantrust, Kezzler. A shared trust anchor: the Aura Blockchain Consortium. And an open do-it-yourself stack built on the NXP TapLinx SDK with your own HSM and backend. The closing note: specify the chip family in the RFP, because asking for an NFC tag invites a swap to lower-security parts.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE VENDOR LANDSCAPE</text>
<text x="600" y="92" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="27" font-weight="700" fill="#291c0e">Five layers to price out before you write the RFP</text>

<!-- Row 1 -->
<rect x="78" y="118" width="1044" height="58" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="108" cy="147" r="14" fill="#3d6b6b"/><text x="108" y="152" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
<text x="132" y="152" font-size="15.5" font-weight="800" fill="#291c0e">Chip suppliers</text>
<rect x="352" y="130" width="78" height="34" rx="17" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/><text x="391" y="152" text-anchor="middle" font-size="13.5" fill="#2c5454">NXP</text>
<rect x="444" y="130" width="112" height="34" rx="17" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/><text x="500" y="152" text-anchor="middle" font-size="13.5" fill="#2c5454">Infineon</text>
<rect x="570" y="130" width="210" height="34" rx="17" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/><text x="675" y="152" text-anchor="middle" font-size="13.5" fill="#2c5454">STMicroelectronics</text>

<!-- Row 2 -->
<rect x="78" y="184" width="1044" height="58" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<circle cx="108" cy="213" r="14" fill="#c39a5f"/><text x="108" y="218" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
<text x="132" y="212" font-size="15.5" font-weight="800" fill="#291c0e">Inlay &amp; converters</text>
<rect x="352" y="196" width="252" height="34" rx="17" fill="#ffffff" stroke="#c39a5f" stroke-width="1.6"/><text x="478" y="218" text-anchor="middle" font-size="13.5" fill="#6d5a3a">Avery Dennison Smartrac</text>
<rect x="618" y="196" width="98" height="34" rx="17" fill="#ffffff" stroke="#c39a5f" stroke-width="1.6"/><text x="667" y="218" text-anchor="middle" font-size="13.5" fill="#6d5a3a">Identiv</text>
<rect x="730" y="196" width="82" height="34" rx="17" fill="#ffffff" stroke="#c39a5f" stroke-width="1.6"/><text x="771" y="218" text-anchor="middle" font-size="13.5" fill="#6d5a3a">SATO</text>
<rect x="826" y="196" width="106" height="34" rx="17" fill="#ffffff" stroke="#c39a5f" stroke-width="1.6"/><text x="879" y="218" text-anchor="middle" font-size="13.5" fill="#6d5a3a">Beontag</text>

<!-- Row 3 -->
<rect x="78" y="250" width="1044" height="58" rx="10" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<circle cx="108" cy="279" r="14" fill="#3d6b6b"/><text x="108" y="284" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
<text x="132" y="284" font-size="15.5" font-weight="800" fill="#291c0e">SaaS platforms</text>
<rect x="352" y="262" width="104" height="34" rx="17" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/><text x="404" y="284" text-anchor="middle" font-size="13.5" fill="#2c5454">Authena</text>
<rect x="470" y="262" width="104" height="34" rx="17" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/><text x="522" y="284" text-anchor="middle" font-size="13.5" fill="#2c5454">Arianee</text>
<rect x="588" y="262" width="72" height="34" rx="17" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/><text x="624" y="284" text-anchor="middle" font-size="13.5" fill="#2c5454">EON</text>
<rect x="674" y="262" width="120" height="34" rx="17" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/><text x="734" y="284" text-anchor="middle" font-size="13.5" fill="#2c5454">Scantrust</text>
<rect x="808" y="262" width="104" height="34" rx="17" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.6"/><text x="860" y="284" text-anchor="middle" font-size="13.5" fill="#2c5454">Kezzler</text>

<!-- Row 4 -->
<rect x="78" y="316" width="1044" height="58" rx="10" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.4"/>
<circle cx="108" cy="345" r="14" fill="#c39a5f"/><text x="108" y="350" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
<text x="132" y="350" font-size="15.5" font-weight="800" fill="#291c0e">Shared trust anchor</text>
<rect x="352" y="328" width="304" height="34" rx="17" fill="#291c0e"/><text x="504" y="350" text-anchor="middle" font-size="13.5" fill="#e4ce9e">Aura Blockchain Consortium</text>
<text x="674" y="350" font-size="13" font-style="italic" fill="#6d5a3a">licensable to non-member brands</text>

<!-- Row 5 -->
<rect x="78" y="382" width="1044" height="58" rx="10" fill="#eef2f4" stroke="#c9d3da" stroke-width="1.4"/>
<circle cx="108" cy="411" r="14" fill="#4a5568"/><text x="108" y="416" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">5</text>
<text x="132" y="416" font-size="15.5" font-weight="800" fill="#291c0e">Open / DIY stack</text>
<rect x="352" y="394" width="196" height="34" rx="17" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/><text x="450" y="416" text-anchor="middle" font-size="13.5" fill="#3f4756">NXP TapLinx SDK</text>
<rect x="562" y="394" width="232" height="34" rx="17" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/><text x="678" y="416" text-anchor="middle" font-size="13.5" fill="#3f4756">+ your own HSM &amp; backend</text>

<rect x="78" y="470" width="1044" height="118" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.6"/>
<text x="600" y="508" text-anchor="middle" font-size="16" font-weight="800" fill="#291c0e">Specify the chip family in the RFP</text>
<text x="600" y="538" text-anchor="middle" font-size="14.5" fill="#4f4535">Asking for "an NFC tag" invites a quiet swap to lower-security parts. Name the chip and the SUN requirement.</text>
<text x="600" y="566" text-anchor="middle" font-size="13.5" font-style="italic" fill="#6d5a3a">SaaS amortises better below roughly a million units a year; DIY only pays off with a mature security team.</text>
</svg>
