<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">MIFARE Classic 1K card anatomy — CR80 laminate layers and the 13.56 MHz antenna loop</title>
  <desc id="d">Exploded view of a CR80 card: printed PVC overlay, inlay layer carrying the chip and a planar antenna loop, and the PVC core. Callouts note ISO/IEC 14443 Type A at 13.56 MHz with 106 kbit/s and Type A cascade level 1 anticollision.</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#f8f6f1"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="30" fill="#291c0e">Inside a Classic 1K card — CR80, three working layers</text>
  <text x="60" y="94" font-family="Georgia, serif" font-size="16" fill="#6d5a3a">Same envelope as every hotel and gym card in the drawer — the work happens in the inlay</text>
  <g transform="translate(120,140)">
    <rect x="40" y="0" width="520" height="86" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="60" y="36" font-family="Georgia, serif" font-size="19" fill="#291c0e">Printed overlay (PVC)</text>
    <text x="60" y="62" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">Artwork, numbering, magstripe or signature panel options</text>
    <rect x="20" y="122" width="560" height="150" rx="10" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2.5"/>
    <text x="44" y="152" font-family="Georgia, serif" font-size="19" fill="#2c5454">Inlay — chip + antenna loop</text>
    <rect x="60" y="170" width="430" height="76" rx="8" fill="none" stroke="#3d6b6b" stroke-width="3"/>
    <rect x="74" y="182" width="402" height="52" rx="6" fill="none" stroke="#3d6b6b" stroke-width="2"/>
    <rect x="88" y="194" width="374" height="28" rx="4" fill="none" stroke="#3d6b6b" stroke-width="1.5"/>
    <rect x="452" y="196" width="26" height="24" rx="3" fill="#c39a5f" stroke="#6d5a3a" stroke-width="1.5"/>
    <text x="470" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2c5454">chip</text>
    <rect x="40" y="308" width="520" height="86" rx="10" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="60" y="344" font-family="Georgia, serif" font-size="19" fill="#291c0e">Core + back overlay (PVC)</text>
    <text x="60" y="370" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">RoHS 3 + REACH Annex XVII compliant PVC substrates</text>
  </g>
  <g transform="translate(740,150)">
    <rect x="0" y="0" width="380" height="330" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="2"/>
    <text x="28" y="44" font-family="Georgia, serif" font-size="20" fill="#291c0e">What the loop speaks</text>
    <text x="28" y="86" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2c5454">ISO/IEC 14443-1/-2/-3 Type A</text>
    <text x="28" y="114" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2c5454">Carrier: 13.56 MHz</text>
    <text x="28" y="142" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2c5454">Bit-rate: 106 kbit/s</text>
    <text x="28" y="170" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2c5454">Anticollision: Type A cascade level 1</text>
    <text x="28" y="216" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">Passive — powered by the reader field,</text>
    <text x="28" y="238" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">no battery in the laminate</text>
    <text x="28" y="284" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">Every MIFARE-capable reader of the last</text>
    <text x="28" y="306" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d5a3a">two decades reads it natively</text>
  </g>
  <text x="60" y="620" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6d5a3a">Planar HF loop — a few wide turns laminated flat in the inlay; the gold block is the die bond</text>
</svg>
