<text x="886" y="482" text-anchor="middle" font-size="13" fill="#4f4f4f">each app cryptographically isolated · per-file permissions</text>

<rect x="64" y="552" width="1072" height="76" rx="14" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="585" text-anchor="middle" font-size="17.5" font-weight="800" fill="#291c0e">Classic fits one or two apps; DESFire is the only practical choice for a multi-application key card.</text>
<text x="600" y="611" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Loyalty, payment or parking on the room key all live in their own locked drawer on DESFire.</text>
