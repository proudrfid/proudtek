<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Seven RFID card materials, one laminator — from PVC to paper</title>
<desc id="d">Seven substrate sheets are stacked as a lineup on the left — PVC the people's plastic, PET the sensible one, PETG the finishing-school PET, PC the bank vault, ABS the gym rat, wood veneer the artisan and paper the sprinter. An arrow feeds them into a finished CR80 card with antenna coil and chip on the right, captioned: identical in the sample pack, very different in a back pocket.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE FIELD GUIDE TO CARD SUBSTRATES</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" fill="#291c0e">RFID card materials, from PVC to paper</text>

<rect x="64" y="150" width="112" height="44" rx="9" fill="#3d6b6b"/>
<rect x="176" y="150" width="358" height="44" rx="9" fill="#eef5f5"/>
<text x="120" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">PVC</text>
<text x="196" y="178" font-size="14" font-weight="600" fill="#3d6b6b">the people's plastic</text>

<rect x="64" y="208" width="112" height="44" rx="9" fill="#4a5568"/>
<rect x="176" y="208" width="358" height="44" rx="9" fill="#eef1f5"/>
<text x="120" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">PET</text>
<text x="196" y="236" font-size="14" font-weight="600" fill="#4a5568">the sensible one</text>

<rect x="64" y="266" width="112" height="44" rx="9" fill="#2d6a4f"/>
<rect x="176" y="266" width="358" height="44" rx="9" fill="#eaf5ec"/>
<text x="120" y="294" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">PETG</text>
<text x="196" y="294" font-size="14" font-weight="600" fill="#2d6a4f">PET, finishing-school edition</text>

<rect x="64" y="324" width="112" height="44" rx="9" fill="#234a4a"/>
<rect x="176" y="324" width="358" height="44" rx="9" fill="#e8efef"/>
<text x="120" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">PC</text>
<text x="196" y="352" font-size="14" font-weight="600" fill="#234a4a">the bank vault — passports live here</text>

<rect x="64" y="382" width="112" height="44" rx="9" fill="#a97f43"/>
<rect x="176" y="382" width="358" height="44" rx="9" fill="#f9f1e2"/>
<text x="120" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">ABS</text>
<text x="196" y="410" font-size="14" font-weight="600" fill="#a97f43">the gym rat — 80 °C, no complaints</text>

<rect x="64" y="440" width="112" height="44" rx="9" fill="#7a5636"/>
<rect x="176" y="440" width="358" height="44" rx="9" fill="#f3ece2"/>
<text x="120" y="468" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">WOOD</text>
<text x="196" y="468" font-size="14" font-weight="600" fill="#7a5636">the artisan — allergic to heat</text>

<rect x="64" y="498" width="112" height="44" rx="9" fill="#7d7060"/>
<rect x="176" y="498" width="358" height="44" rx="9" fill="#f1eee9"/>
<text x="120" y="526" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">PAPER</text>
<text x="196" y="526" font-size="14" font-weight="600" fill="#7d7060">the sprinter — brilliant once</text>

<line x1="560" y1="346" x2="628" y2="346" stroke="#c39a5f" stroke-width="5" stroke-linecap="round"/>
<path d="M 628 334 L 652 346 L 628 358 Z" fill="#c39a5f"/>

<text x="890" y="192" text-anchor="middle" font-size="13.5" fill="#5c5c5c">one hot laminator later…</text>
<rect x="660" y="204" width="460" height="290" rx="24" fill="#ffffff" stroke="#c39a5f" stroke-width="3"/>
<rect x="684" y="228" width="412" height="242" rx="16" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="708" y="250" width="364" height="198" rx="12" fill="none" stroke="#6b9494" stroke-width="2.5"/>
<rect x="732" y="272" width="316" height="154" rx="9" fill="none" stroke="#b7cccc" stroke-width="2.5"/>
<rect x="986" y="322" width="58" height="46" rx="6" fill="#d4a755"/>
<rect x="994" y="330" width="42" height="30" rx="3" fill="#c98a2a"/>
<text x="890" y="524" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.5" fill="#6d5a3a">FINISHED CARD · CR80 · 0.76 mm</text>

<text x="890" y="560" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Identical in the sample pack.</text>
<text x="890" y="588" text-anchor="middle" font-size="15.5" font-weight="600" fill="#2c5454">Very different in a back pocket.</text>

<text x="600" y="640" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Seven substrates walk into a laminator — who survives, who thrives, and who quietly dissolves.</text>
</svg>
