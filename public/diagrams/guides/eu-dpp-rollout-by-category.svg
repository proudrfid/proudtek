  <text x="600" y="646" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d5a3a">2027 is the battery passport date — not a universal DPP deadline. Other categories arrive as their ESPR (EU 2024/1781) delegated act lands.</text>
