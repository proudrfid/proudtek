<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">What one GIAI-96 record binds to a structural anchor bolt</title>
  <desc id="d">A laser-welded 316L RFID tag on the head of a structural anchor bolt is bound to one GS1 GIAI-96 record, shown as a record card carrying the fastener specification per ASTM F3125, F3148, F1554 and A354, the mill heat per ASTM A6 and A29, the rotational-capacity lot per ASTM F3125 section 9, the pre-tension method by Turn-of-Nut, DTI or TC, the ACI 355.2 and 355.4 anchorage qualification, and the installation date with the re-tension record for position TX-Tower-F01-BOLT-247. Every touch publishes as an EPCIS 2.0 ObjectEvent into Bentley SYNCHRO, iTwin, AASHTOWare Bridge BrM and GE Digital APM; Tier-1 programmes add an NTAG424 DNA SUN CMAC AES-128 per-tap signature.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE ANCHOR · ONE GIAI-96 RECORD</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#5c5c5c">Encoded per GS1 Tag Data Standard 2.0 §7.1 — carried for the life of the structure</text>

  <!-- left: bolt scene -->
  <text x="90" y="200" font-size="16" font-weight="700" fill="#6d5a3a">Laser-welded 316L tag</text>
  <text x="90" y="224" font-size="12.5" fill="#5c5c5c">on the bolt-head face</text>
  <line x1="170" y1="236" x2="234" y2="314" stroke="#c39a5f" stroke-width="2"/>
  <circle cx="236" cy="316" r="4" fill="#c39a5f"/>

  <rect x="90" y="380" width="360" height="36" fill="#4a5568" rx="3"/>
  <rect x="90" y="416" width="360" height="124" fill="#eee7d8"/>
  <circle cx="130" cy="460" r="3" fill="#d9d0bd"/>
  <circle cx="180" cy="505" r="4" fill="#d9d0bd"/>
  <circle cx="350" cy="470" r="3" fill="#d9d0bd"/>
  <circle cx="410" cy="515" r="4" fill="#d9d0bd"/>
  <circle cx="230" cy="522" r="3" fill="#d9d0bd"/>
  <rect x="250" y="380" width="36" height="120" fill="#6d5a3a"/>
  <rect x="222" y="368" width="92" height="12" rx="3" fill="#d4a755"/>
  <polygon points="232,368 304,368 316,324 220,324" fill="#6d5a3a"/>
  <rect x="240" y="312" width="56" height="12" rx="6" fill="#c39a5f" stroke="#291c0e" stroke-width="1.5"/>
  <path d="M 306 302 A 26 26 0 0 1 322 318" fill="none" stroke="#3d6b6b" stroke-width="2.5"/>
  <path d="M 318 288 A 44 44 0 0 1 344 314" fill="none" stroke="#3d6b6b" stroke-width="2.5" opacity="0.55"/>
  <text x="270" y="562" text-anchor="middle" font-size="12.5" fill="#5c5c5c">ASTM F3125 / F3148 / F1554 / A354 fastener</text>

  <!-- binding line tag -> record card -->
  <line x1="298" y1="318" x2="520" y2="240" stroke="#c39a5f" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- right: record card -->
  <rect x="520" y="130" width="600" height="330" rx="16" fill="#f7edd6" stroke="#e4c98f" stroke-width="2"/>
  <text x="548" y="170" font-size="17" font-weight="800" fill="#291c0e">GIAI-96 · TX-Tower-F01-BOLT-247</text>
  <line x1="548" y1="184" x2="1092" y2="184" stroke="#e4c98f" stroke-width="2"/>
  <circle cx="556" cy="212" r="4" fill="#c39a5f"/>
  <text x="572" y="217" font-size="14.5" fill="#291c0e">Fastener spec — ASTM F3125 / F3148 / F1554 / A354</text>
  <circle cx="556" cy="248" r="4" fill="#c39a5f"/>
  <text x="572" y="253" font-size="14.5" fill="#291c0e">Mill heat — per ASTM A6 / A29</text>
  <circle cx="556" cy="284" r="4" fill="#c39a5f"/>
  <text x="572" y="289" font-size="14.5" fill="#291c0e">Rotational-capacity lot — ASTM F3125 §9</text>
  <circle cx="556" cy="320" r="4" fill="#c39a5f"/>
  <text x="572" y="325" font-size="14.5" fill="#291c0e">Pre-tension method — Turn-of-Nut / DTI / TC</text>
  <circle cx="556" cy="356" r="4" fill="#c39a5f"/>
  <text x="572" y="361" font-size="14.5" fill="#291c0e">Anchorage qualification — ACI 355.2 / 355.4</text>
  <circle cx="556" cy="392" r="4" fill="#c39a5f"/>
  <text x="572" y="397" font-size="14.5" fill="#291c0e">Installation date · re-tension record</text>
  <text x="548" y="438" font-size="12.5" fill="#5c5c5c">Tier-1: NTAG424 DNA SUN CMAC AES-128 per-tap signature</text>

  <!-- flow to platforms -->
  <line x1="820" y1="468" x2="820" y2="554" stroke="#3d6b6b" stroke-width="2.5"/>
  <polygon points="820,564 813,550 827,550" fill="#3d6b6b"/>
  <rect x="180" y="572" width="840" height="44" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="600" y="600" text-anchor="middle" font-size="14.5" font-weight="600" fill="#2c5454">EPCIS 2.0 ObjectEvents → Bentley SYNCHRO / iTwin · AASHTOWare Bridge BrM · GE Digital APM</text>
</svg>
