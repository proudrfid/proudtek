<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Entry RFID system cost vs the manual counting it replaces</title>
<desc id="d">Left: the three line items of an entry system — handheld UHF reader $800-1,500, one thousand UHF labels at $0.05-0.15 each with reusable hard tags at $0.50-2.00, and cloud software $50-150 a month — totalling $1,500-3,000 deployed, plus $50-150 per additional thousand tags. Right: the cost it attacks — five hours a week of manual counting at $20 an hour is $5,200 a year, which RFID cuts by 70-80 percent.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT YOU BUY vs WHAT YOU STOP PAYING</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">$1,500–3,000 once, against $5,200 every year</text>

<rect x="60" y="130" width="620" height="460" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="370" y="168" text-anchor="middle" font-size="16" font-weight="800" fill="#6d5a3a">THE SHOPPING LIST</text>

<rect x="100" y="192" width="540" height="86" rx="12" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="124" y="228" font-size="16" font-weight="700" fill="#291c0e">Handheld UHF reader</text>
<text x="124" y="254" font-size="13" fill="#4f4f4f">Zebra · Chainway — Bluetooth to phone or tablet</text>
<text x="616" y="240" text-anchor="end" font-size="18" font-weight="800" fill="#6d5a3a">$800–1,500</text>

<rect x="100" y="292" width="540" height="86" rx="12" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="124" y="328" font-size="16" font-weight="700" fill="#291c0e">Tags — 1,000 UHF labels</text>
<text x="124" y="354" font-size="13" fill="#4f4f4f">$0.05–0.15 each · rugged reusable $0.50–2.00</text>
<text x="616" y="340" text-anchor="end" font-size="18" font-weight="800" fill="#2c5454">$50–150</text>

<rect x="100" y="392" width="540" height="86" rx="12" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="124" y="428" font-size="16" font-weight="700" fill="#291c0e">Cloud software</text>
<text x="124" y="454" font-size="13" fill="#4f4f4f">free tiers exist · open-source if you're handy</text>
<text x="616" y="440" text-anchor="end" font-size="18" font-weight="800" fill="#4a5568">$50–150 / mo</text>

<line x1="100" y1="504" x2="640" y2="504" stroke="#291c0e" stroke-width="2"/>
<text x="124" y="540" font-size="17" font-weight="800" fill="#291c0e">Deployed, all-in</text>
<text x="616" y="540" text-anchor="end" font-size="20" font-weight="800" fill="#1f6f3a">$1,500–3,000</text>
<text x="124" y="566" font-size="12.5" fill="#5c5c5c">refills: $50–150 per extra 1,000 tags</text>

<rect x="720" y="130" width="420" height="460" rx="16" fill="#fdfbf7" stroke="#e6dfd2" stroke-width="1.5"/>
<text x="930" y="168" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2d2d">THE BILL YOU ALREADY PAY</text>
<rect x="790" y="210" width="120" height="240" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="1.5"/>
<text x="850" y="196" text-anchor="middle" font-size="13" fill="#4f4f4f">manual counting</text>
<text x="850" y="336" text-anchor="middle" font-size="19" font-weight="800" fill="#8b2d2d">$5,200</text>
<text x="850" y="360" text-anchor="middle" font-size="12.5" fill="#8b2d2d">per year</text>
<text x="850" y="480" text-anchor="middle" font-size="12.5" fill="#4f4f4f">5 h/week × $20/h</text>

<path d="M 926 330 h 74" stroke="#1f6f3a" stroke-width="2.5"/>
<path d="M 1000 330 l -12 -6 v 12 z" fill="#1f6f3a"/>
<rect x="1006" y="270" width="104" height="120" fill="#eaf5ec" stroke="#2d6a4f" stroke-width="1.5"/>
<text x="1058" y="252" text-anchor="middle" font-size="13" fill="#4f4f4f">with RFID</text>
<text x="1058" y="326" text-anchor="middle" font-size="15" font-weight="800" fill="#1b4332">−70–80%</text>
<text x="1058" y="350" text-anchor="middle" font-size="12" fill="#1b4332">of that labor</text>
<text x="930" y="540" text-anchor="middle" font-size="13.5" fill="#291c0e" font-weight="600">The reader pays for itself before the year does.</text>

<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Less "can we afford RFID?" — more "can we afford to keep paying a person to count what a radio could count?"</text>
</svg>
