<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Bolt tag anatomy — antenna embedded in a hex bolt head</title>
<desc id="d">Hex bolt head shown face-on and in side cutaway with an embedded planar antenna patch, thread range, structural material grades and autotune behaviour.</desc>
<rect width="1200" height="675" fill="#f8f6f1"/>
<text x="60" y="64" font-family="Georgia, serif" font-size="34" fill="#291c0e">A hex head with an antenna inside</text>
<text x="60" y="98" font-family="Verdana, sans-serif" font-size="16" fill="#6d5a3a">Standard ASME B18.2.1 geometry outside — PIFA / slot / patch antenna potted inside the head</text>
<path d="M330 190 L410 236 L410 328 L330 374 L250 328 L250 236 Z" fill="#ffffff" stroke="#291c0e" stroke-width="4"/>
<circle cx="330" cy="282" r="52" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2.5"/>
<circle cx="330" cy="282" r="30" fill="none" stroke="#3d6b6b" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="330" cy="282" r="7" fill="#2c5454"/>
<text x="330" y="420" font-family="Verdana, sans-serif" font-size="13" fill="#2c5454" text-anchor="middle">face-on: patch antenna under the head surface</text>
<g stroke="#291c0e" stroke-width="3" fill="#ffffff">
<rect x="252" y="470" width="156" height="46" rx="8"/>
<rect x="296" y="516" width="68" height="110" rx="4"/>
</g>
<ellipse cx="330" cy="492" rx="58" ry="14" fill="#eef2f0" stroke="#3d6b6b" stroke-width="2"/>
<g stroke="#6d5a3a" stroke-width="2">
<line x1="296" y1="540" x2="364" y2="540"/>
<line x1="296" y1="565" x2="364" y2="565"/>
<line x1="296" y1="590" x2="364" y2="590"/>
</g>
<text x="330" y="656" font-family="Verdana, sans-serif" font-size="13" fill="#6d5a3a" text-anchor="middle">side cutaway: M8-M16 metric + UNC imperial, length 15-100 mm</text>
<g font-family="Verdana, sans-serif" font-size="14" fill="#291c0e">
<rect x="580" y="150" width="540" height="62" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="600" y="176" font-size="15">Bolt first, tag second</text>
<text x="600" y="197" font-size="12.5" fill="#6d5a3a">A325 / A490 / F3125 structural, A193 B7 / B8M, 316L / 304 / 17-4PH stainless</text>
<rect x="580" y="228" width="540" height="62" rx="8" fill="#ffffff" stroke="#c39a5f" stroke-width="1.5"/>
<text x="600" y="254" font-size="15">Property classes the joint already demands</text>
<text x="600" y="275" font-size="12.5" fill="#6d5a3a">ISO 898-1 class 8.8 / 10.9 / 12.9 · SAE J429 grade 2 / 5 / 8 · preload per RCSC + PCC-1</text>
<rect x="580" y="306" width="540" height="62" rx="8" fill="#eef2f0" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="600" y="332" font-size="15">Autotune rides out the detuning</text>
<text x="600" y="353" font-size="12.5" fill="#2c5454">Impinj M750 / M770 / M775 re-match the antenna as steel shifts the tuning point</text>
<rect x="580" y="384" width="540" height="62" rx="8" fill="#eef2f0" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="600" y="410" font-size="15">2-4 m read on steel structure</text>
<text x="600" y="431" font-size="12.5" fill="#2c5454">UHF Gen2 v2.1 · plus NTAG 424 DNA option for inspector smartphone tap-verify</text>
</g>
<rect x="580" y="470" width="540" height="120" rx="10" fill="#ffffff" stroke="#6d5a3a" stroke-width="1.5"/>
<text x="604" y="500" font-family="Georgia, serif" font-size="17" fill="#291c0e">Six SKUs, one habit:</text>
<text x="604" y="526" font-family="Verdana, sans-serif" font-size="13" fill="#6d5a3a">hex M8 x 20 · structural M12 x 35 · heavy hex M16 x 50 tension-control</text>
<text x="604" y="548" font-family="Verdana, sans-serif" font-size="13" fill="#6d5a3a">stud-bolt A193 B7 / B8M flange · 316L marine M10 x 25 · socket-head M8 x 16</text>
<text x="604" y="576" font-family="Verdana, sans-serif" font-size="13" fill="#2c5454">the ID lives where the load lives — in the joint itself</text>
</svg>
