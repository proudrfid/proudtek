<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Event ticket formats ranked by how easily they can be duplicated</title>
<desc id="d">Four ticket formats compared on how a counterfeiter duplicates them and how many copies are possible. A paper ticket is photocopied or reprinted — unlimited copies. A barcode or PDF is scanned and the code re-rendered — unlimited copies. A QR code or screenshot is simply forwarded as an image — unlimited copies. An RFID chip UID is bound to hardware and validated at the gate against a whitelist — one usable identity. The optical formats all fail the same way because the credential is a visible pattern anyone can copy.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">TICKET FORMATS · HOW EASILY THEY CLONE</text>
<text x="600" y="88" text-anchor="middle" font-size="16" fill="#4f4f4f">Optical formats copy without limit. A bound chip UID does not.</text>

<text x="96" y="132" font-size="13" font-weight="800" letter-spacing="1" fill="#6d5a3a">FORMAT</text>
<text x="452" y="132" font-size="13" font-weight="800" letter-spacing="1" fill="#6d5a3a">HOW IT'S DUPLICATED</text>
<text x="1004" y="132" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1" fill="#6d5a3a">COPIES</text>

<!-- row 1 -->
<rect x="64" y="148" width="1072" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="148" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="96" y="196" font-size="17" font-weight="800" fill="#291c0e">Paper ticket</text>
<text x="452" y="194" font-size="14" fill="#333333">Photocopy or reprint the stub</text>
<text x="1004" y="205" text-anchor="middle" font-size="30" font-weight="800" fill="#8b2d2d">&#8734;</text>

<!-- row 2 -->
<rect x="64" y="240" width="1072" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="240" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="96" y="288" font-size="17" font-weight="800" fill="#291c0e">Barcode / PDF</text>
<text x="452" y="286" font-size="14" fill="#333333">Scan the code and re-render it</text>
<text x="1004" y="297" text-anchor="middle" font-size="30" font-weight="800" fill="#8b2d2d">&#8734;</text>

<!-- row 3 -->
<rect x="64" y="332" width="1072" height="80" rx="11" fill="#f8ecec" stroke="#e6c9c9" stroke-width="1.4"/>
<rect x="64" y="332" width="9" height="80" rx="4" fill="#8b2d2d"/>
<text x="96" y="380" font-size="17" font-weight="800" fill="#291c0e">QR / screenshot</text>
<text x="452" y="378" font-size="14" fill="#333333">Forward the image to anyone</text>
<text x="1004" y="389" text-anchor="middle" font-size="30" font-weight="800" fill="#8b2d2d">&#8734;</text>

<!-- row 4 -->
<rect x="64" y="424" width="1072" height="80" rx="11" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.4"/>
<rect x="64" y="424" width="9" height="80" rx="4" fill="#3d6b6b"/>
<text x="96" y="463" font-size="17" font-weight="800" fill="#291c0e">RFID chip UID</text>
<text x="96" y="487" font-size="12.5" font-weight="700" fill="#2c5454">bound to hardware</text>
<text x="452" y="470" font-size="14" fill="#333333">Validated at the gate against a whitelist —</text>
<text x="452" y="490" font-size="14" fill="#333333">no visible pattern to copy</text>
<text x="1004" y="481" text-anchor="middle" font-size="30" font-weight="800" fill="#1f6f3a">1</text>

<text x="600" y="556" text-anchor="middle" font-size="14.5" fill="#5c5c5c">The fix is not a prettier ticket. It is moving from an optical pattern anyone can copy to a UID the gate checks against a list.</text>
</svg>
