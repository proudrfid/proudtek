<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="dsTitle dsDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="dsTitle">Department-store RFID: smart shelf plus EAS on one tag</title>
  <desc id="dsDesc">A three-stage system. Stage one: a smart shelf with a low-power UHF reader beneath it reads an EPC Gen2 inlay on every folded item, producing a real-time per-SKU count. Stage two: shelf events flow to a store gateway and cloud inventory platform and on to the staff app in 30 to 90 seconds. Stage three: an EAS gate at the exit reads each tag's chip UID, so an unsold item raises a data-rich alert while a sold item passes silently. Footer: stores running both report a 30 to 50 percent shrinkage reduction, a 3 to 5 percent revenue lift, and a typical 12 to 24 month payback.</desc>
  <defs>
    <radialGradient id="dsBg" cx="50%" cy="24%" r="86%">
      <stop offset="0%" stop-color="#f8ead0"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="dsDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#291c0e"/>
      <stop offset="100%" stop-color="#6c5127"/>
    </linearGradient>
    <marker id="dsArrow" markerWidth="10" markerHeight="10" refX="3" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#c39a5f"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#dsBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="64" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="3" fill="#6d5a3a">DEPARTMENT STORE RFID · SMART SHELF + EAS</text>
  <text x="600" y="95" text-anchor="middle" font-size="17" fill="#4f4f4f">One tag, two jobs: keep the shelf honest and watch the exit</text>

  <!-- ===================== Stage 1: smart shelf ===================== -->
  <g>
    <rect x="60" y="126" width="330" height="300" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="90" cy="126" r="19" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/><text x="90" y="133" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
    <rect x="120" y="176" width="60" height="34" rx="6" fill="#ffffff" stroke="#291c0e" stroke-width="3"/>
    <rect x="196" y="176" width="60" height="34" rx="6" fill="#efe0bf" stroke="#291c0e" stroke-width="3"/>
    <rect x="272" y="176" width="60" height="34" rx="6" fill="#ffffff" stroke="#291c0e" stroke-width="3"/>
    <circle cx="150" cy="193" r="4" fill="#1fcefb"/>
    <circle cx="226" cy="193" r="4" fill="#1fcefb"/>
    <circle cx="302" cy="193" r="4" fill="#1fcefb"/>
    <rect x="104" y="214" width="244" height="12" rx="4" fill="#c39a5f"/>
    <g fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <path d="M206 248 a26 26 0 0 1 40 0"/>
      <path d="M192 248 a44 44 0 0 1 68 0"/>
    </g>
    <rect x="180" y="250" width="92" height="40" rx="8" fill="#eaf9fe" stroke="#1fcefb" stroke-width="2.5"/>
    <text x="226" y="275" text-anchor="middle" font-size="13.5" font-weight="700" fill="#177a92">UHF reader</text>
    <text x="225" y="330" text-anchor="middle" font-size="18" font-weight="800" fill="#291c0e">Smart shelf</text>
    <text x="225" y="357" text-anchor="middle" font-size="14.5" fill="#6d5a3a">EPC Gen2 inlay on every item</text>
    <text x="225" y="380" text-anchor="middle" font-size="14.5" fill="#6d5a3a">real-time per-SKU count</text>
  </g>

  <line x1="396" y1="276" x2="440" y2="276" stroke="#c39a5f" stroke-width="4" stroke-linecap="round" marker-end="url(#dsArrow)"/>

  <!-- ===================== Stage 2: store brain / cloud ===================== -->
  <g>
    <rect x="446" y="126" width="308" height="300" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="476" cy="126" r="19" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/><text x="476" y="133" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
    <rect x="560" y="180" width="80" height="24" rx="6" fill="#ffffff" stroke="#291c0e" stroke-width="3"/>
    <rect x="560" y="210" width="80" height="24" rx="6" fill="#ffffff" stroke="#291c0e" stroke-width="3"/>
    <circle cx="573" cy="192" r="3.6" fill="#1fcefb"/>
    <circle cx="573" cy="222" r="3.6" fill="#1fcefb"/>
    <text x="600" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">cloud inventory platform</text>
    <text x="600" y="312" text-anchor="middle" font-size="14.5" fill="#6d5a3a">shelf → gateway → cloud → app</text>
    <rect x="510" y="330" width="180" height="34" rx="17" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.5"/>
    <text x="600" y="352" text-anchor="middle" font-size="14.5" font-weight="700" fill="#177a92">30–90 sec to dashboard</text>
    <text x="600" y="398" text-anchor="middle" font-size="14.5" fill="#6d5a3a">ERP / POS integrated</text>
  </g>

  <line x1="760" y1="276" x2="804" y2="276" stroke="#c39a5f" stroke-width="4" stroke-linecap="round" marker-end="url(#dsArrow)"/>

  <!-- ===================== Stage 3: EAS gate ===================== -->
  <g>
    <rect x="810" y="126" width="330" height="300" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <circle cx="840" cy="126" r="19" fill="#c39a5f" stroke="#ffffff" stroke-width="3"/><text x="840" y="133" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">3</text>
    <rect x="905" y="168" width="26" height="150" rx="8" fill="#ffffff" stroke="#291c0e" stroke-width="3.5"/>
    <rect x="1019" y="168" width="26" height="150" rx="8" fill="#ffffff" stroke="#291c0e" stroke-width="3.5"/>
    <rect x="957" y="226" width="40" height="30" rx="6" fill="#efe0bf" stroke="#291c0e" stroke-width="3"/>
    <circle cx="977" cy="241" r="4.5" fill="#1fcefb"/>
    <g fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round">
      <path d="M936 224 a26 26 0 0 1 0 34"/>
      <path d="M950 216 a42 42 0 0 1 0 50"/>
    </g>
    <text x="975" y="300" text-anchor="middle" font-size="17" font-weight="800" fill="#291c0e">EAS gate reads the exit</text>
    <text x="975" y="350" text-anchor="middle" font-size="14.5" fill="#1f6f3a">unsold item → data-rich alert</text>
    <text x="975" y="374" text-anchor="middle" font-size="14.5" fill="#6d5a3a">sold item → passes silently</text>
  </g>

  <!-- ===================== Footer stat band ===================== -->
  <rect x="60" y="470" width="1080" height="128" rx="16" fill="url(#dsDark)"/>
  <g text-anchor="middle">
    <text x="243" y="524" font-size="34" font-weight="800" fill="#d4a755">30–50%</text>
    <text x="243" y="556" font-size="15.5" fill="#f4efe4">shrinkage reduction</text>
    <text x="600" y="524" font-size="34" font-weight="800" fill="#d4a755">3–5%</text>
    <text x="600" y="556" font-size="15.5" fill="#f4efe4">revenue lift</text>
    <text x="957" y="524" font-size="34" font-weight="800" fill="#d4a755">12–24 mo</text>
    <text x="957" y="556" font-size="15.5" fill="#f4efe4">typical payback</text>
  </g>
  <line x1="423" y1="500" x2="423" y2="568" stroke="#c39a5f" stroke-width="1.5" opacity="0.5"/>
  <line x1="777" y1="500" x2="777" y2="568" stroke="#c39a5f" stroke-width="1.5" opacity="0.5"/>
</svg>
