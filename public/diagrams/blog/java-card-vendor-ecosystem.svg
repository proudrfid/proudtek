<text x="1014" y="394" text-anchor="middle" font-size="12.5" fill="#4f4f4f">25-year retention</text>
<rect x="914" y="420" width="200" height="30" rx="15" fill="#f9f1e2" stroke="#e4c98f"/>
<text x="1014" y="440" text-anchor="middle" font-size="12" fill="#6d5a3a">one supplier, IC + OS</text>

<!-- base: the shared standard -->
<rect x="64" y="506" width="1072" height="54" rx="12" fill="#c39a5f"/>
<text x="600" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">Java Card + GlobalPlatform — the shared standard every pillar stands on</text>

<text x="600" y="608" text-anchor="middle" font-size="13.5" fill="#5c5c5c">The shared base is what lets an applet move between vendors without a rewrite — rare and wonderful in hardware security.</text>
</svg>
