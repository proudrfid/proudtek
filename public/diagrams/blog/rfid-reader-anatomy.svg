<rect x="134" y="256" width="232" height="68" rx="10" fill="#f9f1e2" stroke="#c39a5f" stroke-width="1.5"/>
<circle cx="352" cy="268" r="12" fill="#c39a5f"/>
<text x="352" y="273" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text>
<text x="250" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#6d5a3a">RF transceiver</text>
<text x="250" y="311" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the voice</text>

<rect x="134" y="340" width="232" height="68" rx="10" fill="#eef5f5" stroke="#3d6b6b" stroke-width="1.5"/>
<circle cx="352" cy="352" r="12" fill="#3d6b6b"/>
<text x="352" y="357" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text>
<text x="250" y="374" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">Control processor</text>
<text x="250" y="395" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the brain</text>

<rect x="134" y="424" width="232" height="68" rx="10" fill="#eef1f5" stroke="#4a5568" stroke-width="1.5"/>
<circle cx="352" cy="436" r="12" fill="#4a5568"/>
<text x="352" y="441" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text>
<text x="250" y="458" text-anchor="middle" font-size="15" font-weight="700" fill="#4a5568">Host interface</text>
<text x="250" y="479" text-anchor="middle" font-size="12.5" fill="#4f4f4f">the tail</text>

<rect x="230" y="526" width="40" height="20" rx="4" fill="#4a5568"/>
<rect x="238" y="546" width="24" height="10" rx="2" fill="#e6dfd2"/>
<text x="250" y="586" text-anchor="middle" font-size="13.5" fill="#4f4f4f">same organs in the puck, the handheld, the portal</text>

<g text-anchor="start">
<circle cx="496" cy="170" r="15" fill="#c39a5f"/>
<text x="496" y="175" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
<text x="524" y="176" font-size="17" font-weight="700" fill="#291c0e">Antenna — the ears</text>
<text x="524" y="202" font-size="14" fill="#4f4f4f">Turns electricity into radio waves and back again.</text>
<text x="524" y="223" font-size="14" fill="#4f4f4f">Bigger, better-tuned ears = longer read range.</text>

<circle cx="496" cy="290" r="15" fill="#c39a5f"/>
<text x="496" y="295" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
<text x="524" y="296" font-size="17" font-weight="700" fill="#291c0e">RF transceiver — the voice</text>
<text x="524" y="322" font-size="14" fill="#4f4f4f">Generates the carrier, modulates the outbound commands,</text>
<text x="524" y="343" font-size="14" fill="#4f4f4f">then decodes the tag's whispered backscatter reply.</text>

<circle cx="496" cy="400" r="15" fill="#3d6b6b"/>
<text x="496" y="405" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
<text x="524" y="406" font-size="17" font-weight="700" fill="#291c0e">Control processor — the brain</text>
<text x="524" y="432" font-size="14" fill="#4f4f4f">Runs the rulebook — ISO 14443, ISO 15693, ISO 18000-6C —</text>
<text x="524" y="453" font-size="14" fill="#4f4f4f">referees anti-collision, handles the secure-chip crypto.</text>

<circle cx="496" cy="510" r="15" fill="#4a5568"/>
<text x="496" y="515" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
<text x="524" y="516" font-size="17" font-weight="700" fill="#291c0e">Host interface — the tail</text>
<text x="524" y="542" font-size="14" fill="#4f4f4f">USB, Bluetooth or Ethernet — the plug that makes</text>
<text x="524" y="563" font-size="14" fill="#4f4f4f">the read actually go somewhere useful.</text>
</g>

<text x="600" y="630" text-anchor="middle" font-size="13.5" fill="#5c5c5c">Reader sensitivity — the faintest reply it can still decode — sets real-world range more than anything printed on the box.</text>
</svg>
