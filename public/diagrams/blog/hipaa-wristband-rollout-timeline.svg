<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="roT roD" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <title id="roT">The five-step RFID patient-wristband rollout</title>
      <desc id="roD">A five-step timeline. Step 1: choose chip and form factor — a thermally-sensitive Tyvek band with an embedded NTAG 424 DNA chip that survives a 5 to 7 day stay and carries a printable identifier. Step 2: integrate with the EHR and admission workflow — Epic, Cerner and Meditech all support wristband-printer integration; the band is created at admission and encoded with an opaque ID linked to the MRN. Step 3: deploy bedside handheld or tablet-mounted scanners, standardizing on one device family. Step 4: define go-live use cases — medication administration (BCMA), lab specimen labeling, blood transfusion and surgical verification — rolling out one at a time. Step 5: train clinical staff 2 to 4 hours per role, running a 30 to 90 day side-by-side phase before retiring legacy barcode bands.</desc>
      <defs>
        <radialGradient id="roBg" cx="50%" cy="16%" r="92%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
        <linearGradient id="roDark" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#291c0e"/><stop offset="100%" stop-color="#6c5127"/></linearGradient>
      </defs>
      <rect width="1200" height="675" fill="url(#roBg)"/>
      <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
      <text x="600" y="58" text-anchor="middle" font-size="20.5" font-weight="800" letter-spacing="1.4" fill="#6d5a3a">FIVE STEPS · ROLL OUT ONE USE CASE AT A TIME</text>
      <!-- axis -->
      <line x1="160" y1="208" x2="1040" y2="208" stroke="#c39a5f" stroke-width="5"/>
      <g text-anchor="middle" font-weight="800" fill="#291c0e" font-size="14.5">
        <text x="160" y="176">STEP 1</text><text x="380" y="176">STEP 2</text><text x="600" y="176">STEP 3</text><text x="820" y="176">STEP 4</text><text x="1040" y="176" fill="#177a92">STEP 5</text>
      </g>
      <circle cx="160" cy="208" r="14" fill="#c39a5f" stroke="#fff" stroke-width="3"/>
      <circle cx="380" cy="208" r="14" fill="#c39a5f" stroke="#fff" stroke-width="3"/>
      <circle cx="600" cy="208" r="14" fill="#c39a5f" stroke="#fff" stroke-width="3"/>
      <circle cx="820" cy="208" r="14" fill="#c39a5f" stroke="#fff" stroke-width="3"/>
      <circle cx="1040" cy="208" r="17" fill="#1fcefb" stroke="#fff" stroke-width="4"/>
      <!-- cards -->
      <g text-anchor="middle">
        <rect x="60" y="250" width="200" height="300" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
        <text x="160" y="292" font-size="17.5" font-weight="800" fill="#291c0e">Choose the chip</text>
        <text x="160" y="330" font-size="14" fill="#4f4f4f">Tyvek band +</text>
        <text x="160" y="350" font-size="14.5" font-weight="700" fill="#291c0e">NTAG 424 DNA</text>
        <text x="160" y="386" font-size="14" fill="#4f4f4f">survives a 5-7</text>
        <text x="160" y="406" font-size="14" fill="#4f4f4f">day inpatient stay</text>
        <text x="160" y="442" font-size="14" fill="#4f4f4f">printable ID on</text>
        <text x="160" y="462" font-size="14" fill="#4f4f4f">the band surface</text>

        <rect x="280" y="250" width="200" height="300" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
        <text x="380" y="292" font-size="17.5" font-weight="800" fill="#291c0e">Integrate the EHR</text>
        <text x="380" y="330" font-size="14.5" font-weight="700" fill="#291c0e">Epic · Cerner</text>
        <text x="380" y="350" font-size="14.5" font-weight="700" fill="#291c0e">· Meditech</text>
        <text x="380" y="386" font-size="14" fill="#4f4f4f">band created at</text>
        <text x="380" y="406" font-size="14" fill="#4f4f4f">admission, encoded</text>
        <text x="380" y="442" font-size="14" fill="#4f4f4f">opaque ID linked</text>
        <text x="380" y="462" font-size="14" fill="#4f4f4f">to the MRN</text>

        <rect x="500" y="250" width="200" height="300" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
        <text x="600" y="292" font-size="17.5" font-weight="800" fill="#291c0e">Deploy scanners</text>
        <text x="600" y="330" font-size="14" fill="#4f4f4f">handheld or tablet-</text>
        <text x="600" y="350" font-size="14" fill="#4f4f4f">mounted RFID readers</text>
        <text x="600" y="386" font-size="14" fill="#4f4f4f">in the nurse workflow</text>
        <text x="600" y="428" font-size="14.5" font-weight="700" fill="#291c0e">one device family,</text>
        <text x="600" y="448" font-size="14" fill="#4f4f4f">simpler training</text>

        <rect x="720" y="250" width="200" height="300" rx="14" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
        <text x="820" y="292" font-size="17.5" font-weight="800" fill="#291c0e">Pick go-live cases</text>
        <text x="820" y="328" font-size="14" fill="#4f4f4f">medication (BCMA),</text>
        <text x="820" y="348" font-size="14" fill="#4f4f4f">lab specimen labels,</text>
        <text x="820" y="368" font-size="14" fill="#4f4f4f">transfusion &amp;</text>
        <text x="820" y="388" font-size="14" fill="#4f4f4f">surgical ID checks</text>
        <text x="820" y="430" font-size="14.5" font-weight="700" fill="#291c0e">one at a time</text>

        <rect x="940" y="250" width="200" height="300" rx="14" fill="#fbf8f2" stroke="#1fcefb" stroke-width="2.5"/>
        <text x="1040" y="292" font-size="17.5" font-weight="800" fill="#291c0e">Train &amp; go live</text>
        <text x="1040" y="330" font-size="14.5" font-weight="700" fill="#291c0e">2-4 hrs per role</text>
        <text x="1040" y="368" font-size="14" fill="#4f4f4f">30-90 day</text>
        <text x="1040" y="388" font-size="14" fill="#4f4f4f">side-by-side phase</text>
        <text x="1040" y="430" font-size="14" fill="#4f4f4f">then retire the</text>
        <text x="1040" y="450" font-size="14" fill="#4f4f4f">legacy barcode band</text>
      </g>
      <rect x="60" y="576" width="1080" height="58" rx="14" fill="url(#roDark)"/>
      <text x="88" y="612" font-size="15.5" fill="#ffffff">The tag rides on a person, not a pallet — which is exactly why you don't flip every use case on at once.</text>
    </svg>
