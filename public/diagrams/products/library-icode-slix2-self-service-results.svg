<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Year-two measured results for the ICODE SLIX2 library self-service deployment</title>
  <desc id="d">Self-service check-out share reached 78 percent of all circulations, up from 23 percent on the legacy chip. Alongside it, 12 FTE were redeployed from the circulation desk to programming, mis-shelved items per quarter fell 41 percent, the security-gate false-alarm rate fell 67 percent, and patron NPS rose 14 percent across the 24-month rollout. Every figure is the customer's own measured result.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE YEAR-TWO SCOREBOARD — MEASURED, NOT MODELLED</text>
  <text x="600" y="80" text-anchor="middle" font-size="15" fill="#5c5c5c">Self-service check-out share, and the operational metrics that moved with it</text>

  <text x="64" y="118" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SELF-SERVICE CHECK-OUT SHARE OF ALL CIRCULATIONS</text>

  <!-- faint gridlines -->
  <line x1="740" y1="134" x2="740" y2="296" stroke="#efe7d8" stroke-width="1.5"/>
  <line x1="1140" y1="134" x2="1140" y2="296" stroke="#efe7d8" stroke-width="1.5"/>

  <!-- legacy bar 23% -->
  <text x="64" y="162" font-size="14.5" font-weight="700" fill="#291c0e">Legacy chip</text>
  <text x="64" y="184" font-size="12.5" fill="#5c5c5c">assisted check-out only</text>
  <rect x="340" y="140" width="184" height="56" rx="6" fill="#cdbfa4" stroke="#b3a888" stroke-width="1.5"/>
  <text x="540" y="175" font-size="16" font-weight="700" fill="#291c0e">23%</text>

  <!-- ICODE bar 78% -->
  <text x="64" y="246" font-size="14.5" font-weight="700" fill="#291c0e">ICODE SLIX2</text>
  <text x="64" y="268" font-size="12.5" fill="#5c5c5c">self-service check-out</text>
  <rect x="340" y="224" width="624" height="56" rx="6" fill="#3d6b6b"/>
  <text x="946" y="259" text-anchor="end" font-size="16" font-weight="700" fill="#ffffff">78%</text>

  <!-- axis (baseline only; the two bars carry their own values) -->
  <line x1="340" y1="296" x2="1140" y2="296" stroke="#e6dfd2" stroke-width="2"/>
  <text x="340" y="315" font-size="12" fill="#9a927f">share of all circulations</text>
  <text x="1140" y="315" text-anchor="end" font-size="12" fill="#9a927f">all circulations</text>

  <!-- stat chips -->
  <rect x="48" y="354" width="258" height="120" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="177" y="406" text-anchor="middle" font-size="32" font-weight="800" fill="#2c5454">12 FTE</text>
  <text x="177" y="436" text-anchor="middle" font-size="12.5" fill="#5c5c5c">redeployed from the desk</text>
  <text x="177" y="456" text-anchor="middle" font-size="12.5" fill="#5c5c5c">to community programming</text>

  <rect x="330" y="354" width="258" height="120" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="459" y="406" text-anchor="middle" font-size="32" font-weight="800" fill="#2c5454">-41%</text>
  <text x="459" y="436" text-anchor="middle" font-size="12.5" fill="#5c5c5c">mis-shelved items</text>
  <text x="459" y="456" text-anchor="middle" font-size="12.5" fill="#5c5c5c">per quarter</text>

  <rect x="612" y="354" width="258" height="120" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="741" y="406" text-anchor="middle" font-size="32" font-weight="800" fill="#2c5454">-67%</text>
  <text x="741" y="436" text-anchor="middle" font-size="12.5" fill="#5c5c5c">security-gate</text>
  <text x="741" y="456" text-anchor="middle" font-size="12.5" fill="#5c5c5c">false-alarm rate</text>

  <rect x="894" y="354" width="258" height="120" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="1023" y="406" text-anchor="middle" font-size="32" font-weight="800" fill="#2c5454">14%</text>
  <text x="1023" y="436" text-anchor="middle" font-size="12.5" fill="#5c5c5c">rise in patron NPS</text>
  <text x="1023" y="456" text-anchor="middle" font-size="12.5" fill="#5c5c5c">over the rollout</text>

  <!-- bottom callout -->
  <rect x="48" y="496" width="1104" height="116" rx="14" fill="#eef5f5" stroke="#bcd3d3" stroke-width="1.5"/>
  <text x="72" y="528" font-size="15" font-weight="700" fill="#2c5454">Every figure is the library's own measured result at year two.</text>
  <text x="72" y="556" font-size="13.5" fill="#3d6b6b">Self-service reached 78% of circulations, up from 23% on the legacy chip; patron NPS rose 14%</text>
  <text x="72" y="584" font-size="13.5" fill="#3d6b6b">across the 24-month rollout as staff moved from the circulation desk to the public floor.</text>
</svg>
