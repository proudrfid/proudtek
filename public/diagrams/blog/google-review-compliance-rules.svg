<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Google review compliance: what's allowed versus what gets your listing flagged</title>
<desc id="d">Two columns. Allowed: ask every guest for honest feedback, remove friction with an NFC tap, and respond to reviews within 48 hours. Prohibited: review gating that routes only happy guests, incentives such as discounts or free items, and fake or solicited reviews from non-customers. The penalty for prohibited practices is review removal or listing suspension.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">COMPLIANCE · ALLOWED vs FLAGGED</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">NFC tap-to-review is fully compliant — done the right way.</text>
<rect x="88" y="116" width="480" height="442" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.8"/>
<rect x="88" y="116" width="480" height="8" rx="4" fill="#1f6f3a"/>
<text x="328" y="156" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">ALLOWED</text>
<text x="328" y="178" text-anchor="middle" font-size="12.5" fill="#5c5c5c">do all of this, freely</text>
<circle cx="128" cy="232" r="15" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.5"/>
<polyline points="121,232 126,238 136,225" fill="none" stroke="#1f6f3a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="154" y="237" text-anchor="start" font-size="14.5" fill="#291c0e">Ask every guest for honest feedback</text>
<circle cx="128" cy="296" r="15" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.5"/>
<polyline points="121,296 126,302 136,289" fill="none" stroke="#1f6f3a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="154" y="301" text-anchor="start" font-size="14.5" fill="#291c0e">Remove friction with an NFC tap</text>
<circle cx="128" cy="360" r="15" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.5"/>
<polyline points="121,360 126,366 136,353" fill="none" stroke="#1f6f3a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="154" y="365" text-anchor="start" font-size="14.5" fill="#291c0e">Respond to reviews within 48 hours</text>
<rect x="116" y="426" width="424" height="44" rx="10" fill="#ffffff" stroke="#a9cfb5" stroke-width="1.3"/>
<text x="328" y="453" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6f3a">Every tap lands on your public review form.</text>
<rect x="632" y="116" width="480" height="442" rx="14" fill="#f7ecec" stroke="#e0b9b9" stroke-width="1.8"/>
<rect x="632" y="116" width="480" height="8" rx="4" fill="#8b2d2d"/>
<text x="872" y="156" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="0.5" fill="#8b2d2d">PROHIBITED</text>
<text x="872" y="178" text-anchor="middle" font-size="12.5" fill="#5c5c5c">any of these can flag your listing</text>
<circle cx="672" cy="232" r="15" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.5"/>
<line x1="665" y1="225" x2="679" y2="239" stroke="#8b2d2d" stroke-width="3.2" stroke-linecap="round"/><line x1="665" y1="239" x2="679" y2="225" stroke="#8b2d2d" stroke-width="3.2" stroke-linecap="round"/>
<text x="698" y="237" text-anchor="start" font-size="14.5" fill="#291c0e">Review gating (only happy guests)</text>
<circle cx="672" cy="296" r="15" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.5"/>
<line x1="665" y1="289" x2="679" y2="303" stroke="#8b2d2d" stroke-width="3.2" stroke-linecap="round"/><line x1="665" y1="303" x2="679" y2="289" stroke="#8b2d2d" stroke-width="3.2" stroke-linecap="round"/>
<text x="698" y="301" text-anchor="start" font-size="14.5" fill="#291c0e">Incentives — discounts, freebies, points</text>
<circle cx="672" cy="360" r="15" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.5"/>
<line x1="665" y1="353" x2="679" y2="367" stroke="#8b2d2d" stroke-width="3.2" stroke-linecap="round"/><line x1="665" y1="367" x2="679" y2="353" stroke="#8b2d2d" stroke-width="3.2" stroke-linecap="round"/>
<text x="698" y="365" text-anchor="start" font-size="14.5" fill="#291c0e">Fake or solicited reviews</text>
<rect x="660" y="426" width="424" height="44" rx="10" fill="#ffffff" stroke="#e0b9b9" stroke-width="1.3"/>
<text x="872" y="453" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">Penalty: review removal or suspension.</text>
<text x="600" y="596" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Every tap must land on the same public review form — for every guest, happy or not.</text>
</svg>
