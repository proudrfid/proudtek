<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">RFID flag tag mounting scenarios: pipe, gas cylinder, beam and rebar bundle</title>
  <desc id="d">Four mounting scenarios for the RFID flag tag, drawn as a two-by-two grid. Top left: line pipe from 20 to 150 millimetres outside diameter mounted through the cable-tie slot with no drilling and no surface prep. Top right: large pipe and gas cylinders from 150 to 300 millimetres outside diameter mounted with a stainless band clamp in the collar zone. Bottom left: structural and rack beams carrying the flag on a weld stud for permanent mill identification or a magnet base for rework and inspection bays. Bottom right: rebar bundles tied through the bundle, carrying heat, grade and bar size from the fabrication shop to the pour. Footer: the flag face stands proud of the steel and reads from both sides at 3 to 5 metre portals, so aisle direction does not matter.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID FLAG TAG — MOUNTING SCENARIOS</text>
  <text x="600" y="94" text-anchor="middle" font-size="34" font-weight="700" font-family="Lora, Georgia, serif" fill="#291c0e">One flag, four hosts — tie, clamp, stud or magnet</text>

  <!-- ══ cell A: line pipe ══ -->
  <rect x="64" y="122" width="520" height="222" rx="14" fill="#faf6ec" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="88" y="152" font-size="14" font-weight="800" letter-spacing="0.3" fill="#4a5568">LINE PIPE — CABLE-TIE SLOT</text>
  <text x="88" y="173" font-size="12.5" fill="#6d5a3a">pipes 20 – 150 mm OD</text>
  <rect x="168" y="192" width="40" height="36" rx="5" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
  <rect x="184" y="205" width="8" height="8" fill="#ffffff"/>
  <rect x="184" y="228" width="8" height="24" rx="2" fill="#d4a755"/>
  <rect x="172" y="252" width="32" height="10" rx="3" fill="#4a5568"/>
  <circle cx="188" cy="297" r="34" fill="#e8ebf0" stroke="#4a5568" stroke-width="2.5"/>
  <circle cx="188" cy="297" r="41" fill="none" stroke="#6d5a3a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="300" y="240" font-size="12.5" fill="#291c0e">zip a tie through the moulded slot —</text>
  <text x="300" y="258" font-size="12.5" fill="#291c0e">seconds per spool at receiving</text>
  <text x="300" y="286" font-size="12.5" fill="#4f4f4f">no drilling · no adhesive · no surface prep</text>
  <text x="300" y="304" font-size="12.5" fill="#4f4f4f">works on oily, galvanized or painted pipe</text>

  <!-- ══ cell B: large pipe / gas cylinder ══ -->
  <rect x="616" y="122" width="520" height="222" rx="14" fill="#faf6ec" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="640" y="152" font-size="14" font-weight="800" letter-spacing="0.3" fill="#4a5568">LARGE PIPE / GAS CYLINDER — BAND CLAMP</text>
  <text x="640" y="173" font-size="12.5" fill="#6d5a3a">pipes and shells 150 – 300 mm OD</text>
  <rect x="728" y="192" width="40" height="36" rx="5" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
  <rect x="744" y="205" width="8" height="8" fill="#ffffff"/>
  <rect x="744" y="228" width="8" height="24" rx="2" fill="#d4a755"/>
  <rect x="732" y="252" width="32" height="10" rx="3" fill="#4a5568"/>
  <circle cx="748" cy="300" r="36" fill="#e8ebf0" stroke="#4a5568" stroke-width="2.5"/>
  <circle cx="748" cy="300" r="42" fill="none" stroke="#9aa3b0" stroke-width="5"/>
  <text x="856" y="240" font-size="12.5" fill="#291c0e">stainless band clamp rides the shell —</text>
  <text x="856" y="258" font-size="12.5" fill="#291c0e">collar zone keeps cylinder valves clear</text>
  <text x="856" y="286" font-size="12.5" fill="#4f4f4f">survives rolling, restacking, crane slings</text>
  <text x="856" y="304" font-size="12.5" fill="#4f4f4f">clamp tension independent of coatings</text>

  <!-- ══ cell C: structural / rack beam ══ -->
  <rect x="64" y="358" width="520" height="222" rx="14" fill="#faf6ec" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="88" y="388" font-size="14" font-weight="800" letter-spacing="0.3" fill="#4a5568">STRUCTURAL / RACK BEAM — STUD OR MAGNET</text>
  <text x="88" y="409" font-size="12.5" fill="#6d5a3a">I-beams, channels, angles, rack uprights</text>
  <rect x="118" y="442" width="100" height="12" rx="2" fill="#4a5568"/>
  <rect x="160" y="454" width="16" height="58" fill="#4a5568"/>
  <rect x="118" y="512" width="100" height="12" rx="2" fill="#4a5568"/>
  <rect x="176" y="472" width="12" height="22" rx="2" fill="#6d5a3a"/>
  <rect x="188" y="479" width="26" height="8" rx="2" fill="#d4a755"/>
  <rect x="214" y="456" width="38" height="54" rx="5" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
  <rect x="229" y="479" width="8" height="8" fill="#ffffff"/>
  <text x="300" y="470" font-size="12.5" fill="#291c0e">weld stud — permanent on-mill identity</text>
  <text x="300" y="488" font-size="12.5" fill="#291c0e">magnet base — rework and inspection bays</text>
  <text x="300" y="516" font-size="12.5" fill="#4f4f4f">rack-beam flags double as location marks</text>
  <text x="300" y="534" font-size="12.5" fill="#4f4f4f">for forklift readers passing the aisle</text>

  <!-- ══ cell D: rebar bundle ══ -->
  <rect x="616" y="358" width="520" height="222" rx="14" fill="#faf6ec" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="640" y="388" font-size="14" font-weight="800" letter-spacing="0.3" fill="#4a5568">REBAR BUNDLE — TIE THROUGH THE BUNDLE</text>
  <text x="640" y="409" font-size="12.5" fill="#6d5a3a">bundle identity from fab shop to pour</text>
  <rect x="728" y="424" width="40" height="34" rx="5" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
  <rect x="744" y="436" width="8" height="8" fill="#ffffff"/>
  <rect x="744" y="458" width="8" height="20" rx="2" fill="#d4a755"/>
  <rect x="732" y="478" width="32" height="10" rx="3" fill="#4a5568"/>
  <g fill="#e8ebf0" stroke="#4a5568" stroke-width="2">
    <circle cx="748" cy="506" r="11"/>
    <circle cx="735" cy="527" r="11"/><circle cx="761" cy="527" r="11"/>
    <circle cx="722" cy="548" r="11"/><circle cx="748" cy="548" r="11"/><circle cx="774" cy="548" r="11"/>
  </g>
  <ellipse cx="748" cy="524" rx="46" ry="42" fill="none" stroke="#6d5a3a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="856" y="470" font-size="12.5" fill="#291c0e">heat, grade and bar size stay attached to</text>
  <text x="856" y="488" font-size="12.5" fill="#291c0e">the physical bundle, not to a paper tag</text>
  <text x="856" y="516" font-size="12.5" fill="#4f4f4f">after casting, identity hands off to</text>
  <text x="856" y="534" font-size="12.5" fill="#4f4f4f">cast-in concrete embed tags</text>

  <!-- footer -->
  <line x1="64" y1="600" x2="1136" y2="600" stroke="#e6dfd2" stroke-width="1.5"/>
  <text x="600" y="632" text-anchor="middle" font-size="14.5" fill="#2c5454">The flag face stands proud of the steel and reads from both sides at 3–5 m portals — aisle direction doesn't matter.</text>
</svg>
