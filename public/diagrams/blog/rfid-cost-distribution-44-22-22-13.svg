<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The 44/22/22/13 RFID cost distribution rule</title>
<desc id="d">A stacked bar showing the typical enterprise RFID cost distribution: hardware 44 percent, integration 22 percent, supply-chain application changes 22 percent, and data storage and analysis 13 percent. A note explains that recurring tag spend sits outside this rule and must be tracked separately, and that at smaller scale hardware drops to 20 to 35 percent while integration and software rise.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE 44 / 22 / 22 / 13 RULE</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Typical enterprise cost split — a sanity check, not a quote.</text>

<rect x="100" y="150" width="436" height="104" fill="#4a5568"/>
<rect x="536" y="150" width="218" height="104" fill="#3d6b6b"/>
<rect x="754" y="150" width="218" height="104" fill="#c39a5f"/>
<rect x="972" y="150" width="128" height="104" fill="#2d6a4f"/>
<rect x="100" y="150" width="1000" height="104" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
<text x="318" y="196" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Hardware</text>
<text x="318" y="228" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">44%</text>
<text x="645" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Integration</text>
<text x="645" y="228" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">22%</text>
<text x="863" y="190" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">Supply-chain</text>
<text x="863" y="208" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">apps</text>
<text x="863" y="236" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">22%</text>
<text x="1036" y="196" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">Data</text>
<text x="1036" y="228" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">13%</text>

<rect x="100" y="298" width="1000" height="66" rx="12" fill="#f7edd6" stroke="#e0c084" stroke-width="1.6"/>
<text x="130" y="330" font-size="15.5" font-weight="800" fill="#8a6d34">+ TAG SPEND</text>
<text x="278" y="326" font-size="13.5" fill="#5c5145">sits OUTSIDE this rule — track it separately as recurring opex.</text>
<text x="278" y="348" font-size="13.5" fill="#5c5145">It can dominate retail-compliance programs shipping millions of units.</text>

<rect x="100" y="384" width="1000" height="66" rx="12" fill="#eef1f5" stroke="#b3bcc9" stroke-width="1.6"/>
<text x="130" y="416" font-size="15.5" font-weight="800" fill="#4a5568">AT SMB SCALE</text>
<text x="292" y="412" font-size="13.5" fill="#4f5560">hardware drops to 20-35% as a share; integration and software rise.</text>
<text x="292" y="434" font-size="13.5" fill="#4f5560">Use the rule as a sanity check, then adjust for your deployment size.</text>

<text x="600" y="520" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">The rule catches a lopsided vendor quote — it does not replace one.</text>
<text x="600" y="556" text-anchor="middle" font-size="14" fill="#5c5c5c">Derived from enterprise deployments; the real mix shifts with scale and integration depth.</text>
</svg>
