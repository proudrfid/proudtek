<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-labelledby="t d"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Proud Tek wristband material menu: one program resolved into six constructions and one encoded shipment</title>
  <desc id="d">A left-to-right map. On the left, a card labelled YOUR PROGRAM (days worn, water exposure, reuse, budget). In the centre, four material lanes: silicone (MIFARE, DESFire, NTAG 213, T5577 at 13.56 MHz and 125 kHz; IP68, reusable, 200 pcs); woven fabric (NTAG 213, MIFARE Ultralight, UCODE 9; 1-7 day branded, water-resistant, 200 pcs); Tyvek and paper (NTAG 213, ICODE SLIX2, UHF inlay; single-use tamper-evident, 100 pcs stock); and PVC snap and nylon (MIFARE Classic, NTAG 213; durable adjustable, snap or buckle). All converge on the right into ONE SHIPMENT: encoded to spec, 100% read-verified, full document pack, timed before load-in.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="16%" r="94%">
      <stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">PICK THE BAND BY WEAR PROFILE</text>
  <text x="600" y="99" text-anchor="middle" font-size="30" font-weight="700" fill="#291c0e" font-family="Lora, Georgia, serif">One program, six materials, one shipment</text>
  <text x="600" y="126" text-anchor="middle" font-size="14" fill="#5c5c5c">Every construction runs to a published air-interface standard.</text>

  <!-- connectors: program to lanes -->
  <path d="M258,393 L300,204" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,393 L300,330" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,393 L300,456" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <path d="M258,393 L300,582" stroke="#c39a5f" stroke-width="2" fill="none"/>
  <!-- connectors: lanes to shipment -->
  <path d="M900,204 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,330 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,456 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>
  <path d="M900,582 L946,393" stroke="#3d6b6b" stroke-width="2" fill="none"/>

  <!-- program card -->
  <rect x="48" y="318" width="210" height="150" rx="14" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
  <text x="153" y="360" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">YOUR</text>
  <text x="153" y="383" text-anchor="middle" font-size="17" font-weight="700" fill="#291c0e">PROGRAM</text>
  <text x="153" y="416" text-anchor="middle" font-size="13" fill="#5c5c5c">days worn, water,</text>
  <text x="153" y="436" text-anchor="middle" font-size="13" fill="#5c5c5c">reuse, budget</text>

  <!-- lane 1: silicone -->
  <rect x="300" y="150" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="150" width="7" height="108" rx="3" fill="#c39a5f"/>
  <text x="324" y="182" font-size="18" font-weight="700" fill="#291c0e">Silicone</text>
  <text x="324" y="210" font-size="14" fill="#5c5c5c">MIFARE · DESFire · NTAG 213 · T5577</text>
  <text x="324" y="238" font-size="14" font-weight="700" fill="#2c5454">13.56 MHz &amp; 125 kHz · IP68 reusable · 200 pcs</text>

  <!-- lane 2: woven fabric -->
  <rect x="300" y="276" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="276" width="7" height="108" rx="3" fill="#4a5568"/>
  <text x="324" y="308" font-size="18" font-weight="700" fill="#291c0e">Woven fabric</text>
  <text x="324" y="336" font-size="14" fill="#5c5c5c">NTAG 213 · MIFARE Ultralight · UCODE 9</text>
  <text x="324" y="364" font-size="14" font-weight="700" fill="#2c5454">1-7 day branded · water-resistant · 200 pcs</text>

  <!-- lane 3: Tyvek and paper -->
  <rect x="300" y="402" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="402" width="7" height="108" rx="3" fill="#3d6b6b"/>
  <text x="324" y="434" font-size="18" font-weight="700" fill="#291c0e">Tyvek &amp; paper</text>
  <text x="324" y="462" font-size="14" fill="#5c5c5c">NTAG 213 · ICODE SLIX2 · UHF inlay</text>
  <text x="324" y="490" font-size="14" font-weight="700" fill="#2c5454">Single-use tamper-evident · 100 pcs stock</text>

  <!-- lane 4: PVC snap and nylon -->
  <rect x="300" y="528" width="600" height="108" rx="12" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="300" y="528" width="7" height="108" rx="3" fill="#6d5a3a"/>
  <text x="324" y="560" font-size="18" font-weight="700" fill="#291c0e">PVC snap &amp; nylon</text>
  <text x="324" y="588" font-size="14" fill="#5c5c5c">MIFARE Classic · NTAG 213</text>
  <text x="324" y="616" font-size="14" font-weight="700" fill="#2c5454">Durable adjustable · snap or buckle</text>

  <!-- shipment card -->
  <rect x="946" y="306" width="214" height="174" rx="14" fill="#f7edd6" stroke="#c39a5f" stroke-width="2"/>
  <text x="1053" y="344" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.4" fill="#6d5a3a">ONE SHIPMENT</text>
  <text x="1053" y="378" text-anchor="middle" font-size="14" fill="#291c0e">Encoded to spec</text>
  <text x="1053" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">100% read-verified</text>
  <text x="1053" y="430" text-anchor="middle" font-size="14" fill="#291c0e">Full document pack</text>
  <text x="1053" y="458" text-anchor="middle" font-size="13" fill="#5c5c5c">Timed before load-in</text>
</svg>
