<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="s4Title s4Desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="s4Title">Where EU FMD and US DSCSA diverge in 2026</title>
  <desc id="s4Desc">Five theme cards. Aggregation: parent-child data is de-facto in US receiving but voluntary in EU law, not legally mandated on either side. Verification model: US is transactional via the VRS, EU is point-of-dispense, with a roughly 3 percent EU alert rate, about 1 in 33 scans. Tamper evidence: required on every EU pack, voluntary under DSCSA, aligning with 21 CFR 211.132. Connectivity: US peer-to-peer EPCIS versus an EU central hub of 30-plus NMVOs; in 2018 only about 106 of 2,000-plus manufacturers were connected and onboarding still takes 6 to 12 months. Northern Ireland and member-state staggers: the Windsor Framework keeps FMD in Northern Ireland and Italy is staggered to 2027.</desc>
  <defs>
    <radialGradient id="s4Bg" cx="50%" cy="20%" r="90%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#s4Bg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <text x="600" y="56" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="2" fill="#6d5a3a">WHERE THEY DIVERGE IN 2026</text>
  <text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Five places EU FMD and US DSCSA still pull apart</text>

  <!-- Card 1: Aggregation (gold) -->
  <rect x="56" y="112" width="208" height="430" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="68" y="124" width="184" height="54" rx="10" fill="#c39a5f"/>
  <text x="160" y="157" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Aggregation</text>
  <text x="80" y="210" font-size="13.5" fill="#4f4f4f">Parent-child case &amp;</text>
  <text x="80" y="230" font-size="13.5" fill="#4f4f4f">pallet data. De-facto</text>
  <text x="80" y="250" font-size="13.5" fill="#4f4f4f">in US receiving;</text>
  <text x="80" y="270" font-size="13.5" fill="#4f4f4f">voluntary in EU law</text>
  <text x="80" y="290" font-size="13.5" fill="#4f4f4f">(Del. Reg. 2016/161).</text>
  <rect x="68" y="320" width="184" height="184" rx="10" fill="#faf3e6" stroke="#e4c98f" stroke-width="1.5"/>
  <text x="84" y="346" font-size="10.5" font-weight="800" letter-spacing="1.5" fill="#a9803f">KEY FACT</text>
  <text x="84" y="374" font-size="14" font-weight="800" fill="#6d5a3a">Not legally</text>
  <text x="84" y="394" font-size="14" font-weight="800" fill="#6d5a3a">mandated on</text>
  <text x="84" y="414" font-size="14" font-weight="800" fill="#6d5a3a">either side</text>

  <!-- Card 2: Verification model (teal) -->
  <rect x="276" y="112" width="208" height="430" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="288" y="124" width="184" height="54" rx="10" fill="#3d6b6b"/>
  <text x="380" y="148" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Verification</text>
  <text x="380" y="168" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">model</text>
  <text x="300" y="210" font-size="13.5" fill="#4f4f4f">US: transactional —</text>
  <text x="300" y="230" font-size="13.5" fill="#4f4f4f">at every return &amp;</text>
  <text x="300" y="250" font-size="13.5" fill="#4f4f4f">investigation (VRS).</text>
  <text x="300" y="270" font-size="13.5" fill="#4f4f4f">EU: point-of-dispense</text>
  <text x="300" y="290" font-size="13.5" fill="#4f4f4f">scan (NMVS).</text>
  <rect x="288" y="320" width="184" height="184" rx="10" fill="#eef5f5" stroke="#b8d4d4" stroke-width="1.5"/>
  <text x="304" y="346" font-size="10.5" font-weight="800" letter-spacing="1.5" fill="#2c5454">KEY FACT</text>
  <text x="304" y="374" font-size="14" font-weight="800" fill="#2c5454">~3% EU alerts</text>
  <text x="304" y="394" font-size="14" font-weight="800" fill="#2c5454">≈ 1 in 33 scans</text>
  <text x="304" y="414" font-size="13" fill="#3d6b6b">(EMVO reporting)</text>

  <!-- Card 3: Tamper evidence (forest) -->
  <rect x="496" y="112" width="208" height="430" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="508" y="124" width="184" height="54" rx="10" fill="#2d6a4f"/>
  <text x="600" y="148" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Tamper</text>
  <text x="600" y="168" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">evidence</text>
  <text x="520" y="210" font-size="13.5" fill="#4f4f4f">Overt anti-tamper on</text>
  <text x="520" y="230" font-size="13.5" fill="#4f4f4f">every EU pack. Not</text>
  <text x="520" y="250" font-size="13.5" fill="#4f4f4f">required by DSCSA —</text>
  <text x="520" y="270" font-size="13.5" fill="#4f4f4f">many US makers add</text>
  <text x="520" y="290" font-size="13.5" fill="#4f4f4f">it anyway.</text>
  <rect x="508" y="320" width="184" height="184" rx="10" fill="#eaf3ee" stroke="#bcd9c9" stroke-width="1.5"/>
  <text x="524" y="346" font-size="10.5" font-weight="800" letter-spacing="1.5" fill="#1f6f3a">KEY FACT</text>
  <text x="524" y="374" font-size="14" font-weight="800" fill="#1b5e34">Aligns with</text>
  <text x="524" y="394" font-size="14" font-weight="800" fill="#1b5e34">21 CFR 211.132</text>
  <text x="524" y="414" font-size="13" fill="#2d6a4f">(over-the-counter)</text>

  <!-- Card 4: Connectivity (navy) -->
  <rect x="716" y="112" width="208" height="430" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="728" y="124" width="184" height="54" rx="10" fill="#1f4e79"/>
  <text x="820" y="157" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Connectivity</text>
  <text x="740" y="210" font-size="13.5" fill="#4f4f4f">US peer-to-peer EPCIS</text>
  <text x="740" y="230" font-size="13.5" fill="#4f4f4f">(AS2 transport). EU</text>
  <text x="740" y="250" font-size="13.5" fill="#4f4f4f">central hub → 30+</text>
  <text x="740" y="270" font-size="13.5" fill="#4f4f4f">NMVOs; register per</text>
  <text x="740" y="290" font-size="13.5" fill="#4f4f4f">country.</text>
  <rect x="728" y="320" width="184" height="184" rx="10" fill="#eaf1f8" stroke="#b6cbe0" stroke-width="1.5"/>
  <text x="744" y="346" font-size="10.5" font-weight="800" letter-spacing="1.5" fill="#1f4e79">KEY FACT</text>
  <text x="744" y="374" font-size="14" font-weight="800" fill="#163a5c">2018: ~106 of</text>
  <text x="744" y="394" font-size="14" font-weight="800" fill="#163a5c">2,000+ connected</text>
  <text x="744" y="414" font-size="13" fill="#1f4e79">6–12 mo onboarding</text>

  <!-- Card 5: NI & staggers (steel) -->
  <rect x="936" y="112" width="208" height="430" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <rect x="948" y="124" width="184" height="54" rx="10" fill="#4a5568"/>
  <text x="1040" y="157" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">NI &amp; staggers</text>
  <text x="960" y="210" font-size="13.5" fill="#4f4f4f">Windsor Framework</text>
  <text x="960" y="230" font-size="13.5" fill="#4f4f4f">keeps FMD safety</text>
  <text x="960" y="250" font-size="13.5" fill="#4f4f4f">features for Northern</text>
  <text x="960" y="270" font-size="13.5" fill="#4f4f4f">Ireland via a UK-NI</text>
  <text x="960" y="290" font-size="13.5" fill="#4f4f4f">hub.</text>
  <rect x="948" y="320" width="184" height="184" rx="10" fill="#eef0f3" stroke="#cdd3da" stroke-width="1.5"/>
  <text x="964" y="346" font-size="10.5" font-weight="800" letter-spacing="1.5" fill="#3a4a52">KEY FACT</text>
  <text x="964" y="374" font-size="14" font-weight="800" fill="#3a4a52">Italy staggered</text>
  <text x="964" y="394" font-size="14" font-weight="800" fill="#3a4a52">to 2027;</text>
  <text x="964" y="414" font-size="13" fill="#55687a">Greece incremental</text>

  <text x="600" y="586" text-anchor="middle" font-size="14.5" fill="#6d5a3a">Post-2025 the two regimes are stable — but they diverge in exactly five places.</text>
</svg>
