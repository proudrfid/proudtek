<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="heroTitle heroDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="heroTitle">EM4100 vs T5577 — the 125 kHz LF chip showdown</title>
  <desc id="heroDesc">Two 125 kHz low-frequency RFID chips side by side. EM4100 (steel card, padlock) is read-only: a 40-bit unique ID burned into a 64-bit frame at the factory, immutable. T5577 (teal card, pencil) is rewritable: a 330-bit EEPROM that can be re-encoded 100,000+ times and emulate EM4100, HID Prox, Indala and AWID. Both are identical at the 125 kHz antenna and work on every commodity LF reader; only the memory model differs. EM4100 is the format that gets cloned, T5577 the blank it is cloned onto.</desc>

  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#f9ecd2"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </radialGradient>
    <linearGradient id="heroSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#55677a"/>
      <stop offset="100%" stop-color="#3e4c5c"/>
    </linearGradient>
    <linearGradient id="heroTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d6b6b"/>
      <stop offset="100%" stop-color="#2c5454"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="675" fill="url(#heroGlow)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>

  <!-- Eyebrow + deck -->
  <text x="600" y="70" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="3" fill="#6d5a3a">125 kHz LF CHIP SHOWDOWN</text>
  <text x="600" y="103" text-anchor="middle" font-size="17" fill="#4a5568">Same radio. Same reader. Wildly different memory.</text>

  <!-- ===================== EM4100 CARD (read-only) ===================== -->
  <g>
    <rect x="88" y="150" width="446" height="356" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <path d="M88 168 a18 18 0 0 1 18 -18 h410 a18 18 0 0 1 18 18 v40 h-446 z" fill="url(#heroSteel)"/>
    <text x="311" y="187" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="1">EM4100</text>
    <text x="311" y="230" text-anchor="middle" font-size="13.5" fill="#6d5a3a">EM Microelectronic · the classic read-only ID</text>

    <!-- padlock (locked) -->
    <g transform="translate(291,250)">
      <rect x="0" y="18" width="42" height="32" rx="6" fill="#4a5568"/>
      <path d="M7 18 v-8 a14 14 0 0 1 28 0 v8" fill="none" stroke="#4a5568" stroke-width="5"/>
      <circle cx="21" cy="32" r="4.5" fill="#f9ecd2"/>
      <rect x="19" y="34" width="4" height="9" rx="2" fill="#f9ecd2"/>
    </g>

    <!-- READ-ONLY pill -->
    <rect x="231" y="312" width="160" height="28" rx="14" fill="#eef1f4" stroke="#9fb0c0" stroke-width="1.5"/>
    <text x="311" y="331" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#3e4c5c">READ-ONLY</text>

    <!-- stat rows -->
    <g font-size="13.5">
      <rect x="112" y="352" width="398" height="30" rx="8" fill="#ffffff" stroke="#efe6d5" stroke-width="1.5"/>
      <text x="126" y="372" font-size="11" font-weight="700" letter-spacing="0.6" fill="#8a7a5a">MEMORY</text>
      <text x="496" y="372" text-anchor="end" font-weight="700" fill="#291c0e">64-bit frame · 40-bit UID</text>
      <rect x="112" y="388" width="398" height="30" rx="8" fill="#ffffff" stroke="#efe6d5" stroke-width="1.5"/>
      <text x="126" y="408" font-size="11" font-weight="700" letter-spacing="0.6" fill="#8a7a5a">REWRITE</text>
      <text x="496" y="408" text-anchor="end" font-weight="700" fill="#8b2d2d">No — burned in for life</text>
    </g>
    <text x="311" y="446" text-anchor="middle" font-size="13" fill="#6d5a3a">Its ID ships pre-baked. What you see is what you get —</text>
    <text x="311" y="465" text-anchor="middle" font-size="13" fill="#6d5a3a">forever.</text>
    <text x="311" y="491" text-anchor="middle" font-size="11.5" fill="#9a8f7a">FOB Shenzhen $0.08–0.15 / card @ 50k</text>
  </g>

  <!-- ===================== T5577 CARD (rewritable) ===================== -->
  <g>
    <rect x="666" y="150" width="446" height="356" rx="18" fill="#fbf8f2" stroke="#e4c98f" stroke-width="2"/>
    <path d="M666 168 a18 18 0 0 1 18 -18 h410 a18 18 0 0 1 18 18 v40 h-446 z" fill="url(#heroTeal)"/>
    <text x="889" y="187" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="1">T5577</text>
    <text x="889" y="230" text-anchor="middle" font-size="13.5" fill="#6d5a3a">Atmel / Microchip · the rewritable chameleon</text>

    <!-- pencil (rewrite) -->
    <g transform="translate(868,248)">
      <rect x="4" y="30" width="34" height="10" rx="2" fill="#eef4f4" stroke="#3d6b6b" stroke-width="2"/>
      <path d="M6 6 l14 0 l18 18 l-14 14 l-18 -18 z" fill="#3d6b6b" transform="rotate(0)"/>
      <path d="M40 8 l6 6 -22 22 -6 -6 z" fill="#3d6b6b"/>
      <path d="M18 30 l6 6 -8 3 z" fill="#291c0e"/>
    </g>

    <!-- REWRITABLE pill -->
    <rect x="809" y="312" width="160" height="28" rx="14" fill="#eef4f4" stroke="#7fb0b0" stroke-width="1.5"/>
    <text x="889" y="331" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#2c5454">REWRITABLE</text>

    <g font-size="13.5">
      <rect x="690" y="352" width="398" height="30" rx="8" fill="#ffffff" stroke="#efe6d5" stroke-width="1.5"/>
      <text x="704" y="372" font-size="11" font-weight="700" letter-spacing="0.6" fill="#8a7a5a">MEMORY</text>
      <text x="1074" y="372" text-anchor="end" font-weight="700" fill="#291c0e">330-bit EEPROM · configurable</text>
      <rect x="690" y="388" width="398" height="30" rx="8" fill="#ffffff" stroke="#efe6d5" stroke-width="1.5"/>
      <text x="704" y="408" font-size="11" font-weight="700" letter-spacing="0.6" fill="#8a7a5a">REWRITE</text>
      <text x="1074" y="408" text-anchor="end" font-weight="700" fill="#1f6f3a">Yes — 100,000+ cycles</text>
    </g>
    <text x="889" y="446" text-anchor="middle" font-size="13" fill="#6d5a3a">Speaks EM4100, HID Prox, Indala, AWID —</text>
    <text x="889" y="465" text-anchor="middle" font-size="13" fill="#6d5a3a">one blank, many disguises.</text>
    <text x="889" y="491" text-anchor="middle" font-size="11.5" fill="#9a8f7a">FOB Shenzhen $0.12–0.22 / card @ 50k</text>
  </g>

  <!-- ===================== CENTER VS MEDALLION + RADIO ===================== -->
  <g>
    <!-- radio arcs (shared 125 kHz) -->
    <g fill="none" stroke="#1fcefb" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <path d="M556 300 a26 26 0 0 0 0 76"/>
      <path d="M540 288 a44 44 0 0 0 0 100"/>
      <path d="M644 300 a26 26 0 0 1 0 76"/>
      <path d="M660 288 a44 44 0 0 1 0 100"/>
    </g>
    <circle cx="600" cy="338" r="40" fill="#291c0e"/>
    <circle cx="600" cy="338" r="40" fill="none" stroke="#c39a5f" stroke-width="2.5"/>
    <text x="600" y="347" text-anchor="middle" font-size="26" font-weight="800" fill="#f9ecd2">VS</text>
  </g>

  <!-- clone-direction ribbon -->
  <g>
    <rect x="360" y="533" width="480" height="34" rx="17" fill="#fbf3e6" stroke="#e4c98f" stroke-width="1.5"/>
    <text x="600" y="555" text-anchor="middle" font-size="13.5" fill="#6d5a3a">the format that gets copied  →  the blank it gets copied onto</text>
  </g>

  <!-- Bottom caption + legend -->
  <text x="600" y="600" text-anchor="middle" font-size="15.5" fill="#4a5568">Identical at the antenna — 125 kHz ASK/Manchester, 5–15 cm, any commodity LF reader. The memory model is the whole story.</text>
  <g>
    <rect x="470" y="620" width="260" height="30" rx="15" fill="#eaf9fe" stroke="#8fdcf3" stroke-width="1.5"/>
    <circle cx="494" cy="635" r="3.5" fill="#1fcefb"/>
    <path d="M503 635 a8 8 0 0 1 13 0" fill="none" stroke="#1fcefb" stroke-width="2.4" stroke-linecap="round"/>
    <text x="600" y="640" text-anchor="middle" font-size="12.5" font-weight="600" fill="#177a92">125 kHz · ASK / Manchester — both fluent</text>
  </g>
</svg>
