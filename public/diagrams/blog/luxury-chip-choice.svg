<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ccTitle ccDesc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="ccTitle">Which NFC chips work for luxury authentication: use cryptographic, avoid static</title>
  <desc id="ccDesc">Two groups of chips. Use, with cryptographic authentication: NTAG 424 DNA from NXP, the de facto standard with SUN/CMAC mutual authentication at 0.30 to 1.00 dollar per chip; and MIFARE DESFire EV3 with AES-128 mutual authentication for the highest security at two to three times the cost. Avoid, being static or weak: plain NTAG 213, 215 and 216, which have only a 32-bit password that is brute-forceable in seconds; and generic tap-to-verify chips that hold only a static UID any NFC writer can clone.</desc>
  <defs>
    <radialGradient id="ccBg" cx="50%" cy="22%" r="86%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#ccBg)"/>
  <rect x="20" y="20" width="1160" height="635" rx="22" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="2" fill="#6d5a3a">PICK CRYPTOGRAPHIC, NOT STATIC</text>

  <!-- USE group -->
  <text x="72" y="102" font-size="17" font-weight="800" letter-spacing="1.5" fill="#1f6f3a">✓ USE — CRYPTOGRAPHIC AUTHENTICATION</text>
  <!-- card A -->
  <rect x="56" y="116" width="1088" height="100" rx="14" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2.5"/>
  <circle cx="116" cy="166" r="30" fill="#1f6f3a"/><path d="M104 166 l8 9 l16 -18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="158" font-size="26" font-weight="800" fill="#291c0e">NTAG 424 DNA <tspan font-size="18" font-weight="600" fill="#4f4f4f">(NXP)</tspan></text>
  <text x="170" y="190" font-size="17.5" fill="#3f6b4e">SUN / CMAC mutual auth · new signature every tap · de facto standard</text>
  <rect x="922" y="146" width="194" height="44" rx="22" fill="#ffffff" stroke="#1f6f3a" stroke-width="1.5"/><text x="1019" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#1f6f3a">$0.30–1.00</text>
  <!-- card B -->
  <rect x="56" y="228" width="1088" height="100" rx="14" fill="#eaf5ec" stroke="#1f6f3a" stroke-width="2.5"/>
  <circle cx="116" cy="278" r="30" fill="#1f6f3a"/><path d="M104 278 l8 9 l16 -18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="270" font-size="26" font-weight="800" fill="#291c0e">MIFARE DESFire EV3</text>
  <text x="170" y="302" font-size="17.5" fill="#3f6b4e">AES-128 mutual auth · used by some Hermès / Cartier programs</text>
  <rect x="922" y="258" width="194" height="44" rx="22" fill="#ffffff" stroke="#1f6f3a" stroke-width="1.5"/><text x="1019" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#1f6f3a">2–3× cost</text>

  <!-- AVOID group -->
  <text x="72" y="372" font-size="17" font-weight="800" letter-spacing="1.5" fill="#8b2d2d">✗ AVOID — STATIC OR WEAK</text>
  <!-- card C -->
  <rect x="56" y="386" width="1088" height="100" rx="14" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2.5"/>
  <circle cx="116" cy="436" r="30" fill="#8b2d2d"/><path d="M107 427 l18 18 M125 427 l-18 18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <text x="170" y="428" font-size="26" font-weight="800" fill="#291c0e">Plain NTAG 213 / 215 / 216</text>
  <text x="170" y="460" font-size="17.5" fill="#7a4242">Only a 32-bit password — brute-forceable in seconds. Fine for marketing, not proof.</text>
  <rect x="922" y="416" width="194" height="44" rx="22" fill="#ffffff" stroke="#8b2d2d" stroke-width="1.5"/><text x="1019" y="444" text-anchor="middle" font-size="18" font-weight="700" fill="#8b2d2d">marketing only</text>
  <!-- card D -->
  <rect x="56" y="498" width="1088" height="100" rx="14" fill="#f6ebeb" stroke="#8b2d2d" stroke-width="2.5"/>
  <circle cx="116" cy="548" r="30" fill="#8b2d2d"/><path d="M107 539 l18 18 M125 539 l-18 18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <text x="170" y="540" font-size="26" font-weight="800" fill="#291c0e">Generic “tap-to-verify”</text>
  <text x="170" y="572" font-size="17.5" fill="#7a4242">Static UID with no cryptographic backing — clonable by any NFC writer.</text>
  <rect x="922" y="528" width="194" height="44" rx="22" fill="#ffffff" stroke="#8b2d2d" stroke-width="1.5"/><text x="1019" y="556" text-anchor="middle" font-size="18" font-weight="700" fill="#8b2d2d">no crypto</text>

  <text x="600" y="632" text-anchor="middle" font-size="16" fill="#6d5a3a">A cryptographic signature changes on every tap; a cloned static UID fails on the first backend check.</text>
</svg>
