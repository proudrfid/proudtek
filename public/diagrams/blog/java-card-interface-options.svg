<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Contact, contactless and dual-interface Java Cards, side by side</title>
<desc id="d">Three panels. Contact: a card slides into an ISO 7816 reader slot — the reliable workhorse, up to 921 kbps at T=1, where personalization and key injection happen. Contactless: a card radiates over a 13.56 MHz ISO 14443 field at 106–848 kbps — the sprinter at the gate for sub-second transit and door taps. Dual-interface: one card with both a gold contact chip and an antenna — one secure element answers on both interfaces, so an applet loaded over the pins is instantly available over the air.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">ONE CREDENTIAL · THREE WAYS TO SAY HELLO</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Contact, contactless — or the card that does both</text>

<!-- panel 1: contact -->
<rect x="46" y="140" width="340" height="430" rx="16" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="216" y="196" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#c39a5f">Contact</text>
<rect x="156" y="218" width="120" height="32" rx="16" fill="#ffffff" stroke="#e4c98f"/>
<text x="216" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#6d5a3a">ISO 7816</text>
<path d="M 216 246 v 0" fill="none"/>
<line x1="216" y1="252" x2="216" y2="266" stroke="#6d5a3a" stroke-width="2.5"/>
<path d="M 209 259 l 7 10 l 7 -10" fill="none" stroke="#6d5a3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="146" y="278" width="140" height="90" rx="10" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
<rect x="164" y="300" width="36" height="28" rx="5" fill="#d4a755" stroke="#6d5a3a" stroke-width="1.2"/>
<line x1="164" y1="311" x2="200" y2="311" stroke="#6d5a3a" stroke-width="1.4"/>
<line x1="182" y1="300" x2="182" y2="328" stroke="#6d5a3a" stroke-width="1.4"/>
<rect x="116" y="360" width="200" height="58" rx="10" fill="#efe8d8" stroke="#d8cdb4" stroke-width="1.5"/>
<rect x="136" y="352" width="160" height="9" rx="4" fill="#cbbf9f"/>
<text x="216" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">The reliable workhorse</text>
<path d="M 116 477 l 4.5 4.5 l 9 -10" fill="none" stroke="#1f6f3a" stroke-width="2.5" stroke-linecap="round"/>
<text x="223" y="482" text-anchor="middle" font-size="13.5" fill="#1f6f3a">up to 921 kbps at T=1</text>
<text x="216" y="508" text-anchor="middle" font-size="13" fill="#4f4f4f">personalization &amp; key injection</text>
<text x="216" y="532" text-anchor="middle" font-size="13" fill="#4f4f4f">happen over the pins</text>

<!-- panel 2: contactless -->
<rect x="430" y="140" width="340" height="430" rx="16" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.5"/>
<text x="600" y="196" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#3d6b6b">Contactless</text>
<rect x="535" y="218" width="130" height="32" rx="16" fill="#ffffff" stroke="#cfe0e0"/>
<text x="600" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5454">ISO 14443</text>
<rect x="505" y="290" width="150" height="94" rx="10" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
<rect x="519" y="304" width="122" height="66" rx="8" fill="none" stroke="#d4a755" stroke-width="2" opacity="0.9"/>
<rect x="527" y="312" width="106" height="50" rx="6" fill="none" stroke="#d4a755" stroke-width="1.2" opacity="0.5"/>
<rect x="566" y="330" width="18" height="14" rx="2" fill="#d4a755"/>
<path d="M 668 300 a 26 26 0 0 1 0 54" fill="none" stroke="#3d6b6b" stroke-width="3" opacity="0.9"/>
<path d="M 684 288 a 42 42 0 0 1 0 78" fill="none" stroke="#3d6b6b" stroke-width="2.5" opacity="0.55"/>
<path d="M 700 276 a 58 58 0 0 1 0 102" fill="none" stroke="#3d6b6b" stroke-width="2" opacity="0.32"/>
<text x="600" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">The sprinter at the gate</text>
<path d="M 486 477 l 4.5 4.5 l 9 -10" fill="none" stroke="#1f6f3a" stroke-width="2.5" stroke-linecap="round"/>
<text x="607" y="482" text-anchor="middle" font-size="13.5" fill="#1f6f3a">13.56 MHz · 106–848 kbps</text>
<text x="600" y="508" text-anchor="middle" font-size="13" fill="#4f4f4f">sub-second taps for transit</text>
<text x="600" y="532" text-anchor="middle" font-size="13" fill="#4f4f4f">gates and access doors</text>

<!-- panel 3: dual-interface -->
<rect x="814" y="140" width="340" height="430" rx="16" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.5"/>
<text x="984" y="196" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#4a5568">Dual-interface</text>
<rect x="899" y="218" width="170" height="32" rx="16" fill="#ffffff" stroke="#d3dae3"/>
<text x="984" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#4a5568">ISO 7816 + 14443</text>
<rect x="884" y="282" width="200" height="124" rx="12" fill="#3d6b6b" stroke="#2c5454" stroke-width="1.5"/>
<rect x="906" y="312" width="44" height="36" rx="6" fill="#d4a755" stroke="#6d5a3a" stroke-width="1.2"/>
<line x1="906" y1="325" x2="950" y2="325" stroke="#6d5a3a" stroke-width="1.5"/>
<line x1="928" y1="312" x2="928" y2="348" stroke="#6d5a3a" stroke-width="1.5"/>
<path d="M 1020 306 a 20 20 0 0 1 0 40" fill="none" stroke="#eef5f5" stroke-width="3" opacity="0.9"/>
<path d="M 1034 296 a 32 32 0 0 1 0 60" fill="none" stroke="#eef5f5" stroke-width="2.5" opacity="0.6"/>
<text x="984" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#291c0e">One brain, two mouths</text>
<path d="M 872 477 l 4.5 4.5 l 9 -10" fill="none" stroke="#1f6f3a" stroke-width="2.5" stroke-linecap="round"/>
<text x="991" y="482" text-anchor="middle" font-size="13.5" fill="#1f6f3a">load once — tap or insert</text>
<text x="984" y="508" text-anchor="middle" font-size="13" fill="#4f4f4f">one secure element answers</text>
<text x="984" y="532" text-anchor="middle" font-size="13" fill="#4f4f4f">on both interfaces</text>

<text x="600" y="618" text-anchor="middle" font-size="13.5" fill="#5c5c5c">An applet installed over the pins is instantly available over the air — same secure element, no cloning, no second card.</text>
</svg>
