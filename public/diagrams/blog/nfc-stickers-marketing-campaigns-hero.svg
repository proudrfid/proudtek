<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">NFC stickers for marketing: one tap turns any surface into a channel</title>
<desc id="d">The NFC sticker campaign model in three steps. One, the sticker sits on a poster, pack, or shelf-edge. Two, a phone tap is detected in 200 milliseconds, with no app and no camera. Three, the URL opens and the interaction converts at 2 to 3 times the rate of a QR code on the same display. All for 8 to 25 US cents per sticker, with the destination URL swappable server-side.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="58" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">NFC MARKETING · PHYSICAL-TO-DIGITAL</text>
<text x="600" y="106" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#291c0e">One tap turns a surface into a channel</text>
<text x="600" y="142" text-anchor="middle" font-size="16" fill="#4f4f4f">Hold a phone to the sticker and the URL opens in 200 ms — no app, no camera.</text>

<!-- Panel A: STICKER -->
<rect x="88" y="200" width="300" height="252" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="88" y="200" width="300" height="8" rx="4" fill="#3d6b6b"/>
<text x="238" y="244" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">1 · THE STICKER</text>
<rect x="190" y="276" width="96" height="96" rx="12" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2.5"/>
<rect x="204" y="290" width="68" height="68" rx="9" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<rect x="216" y="302" width="44" height="44" rx="7" fill="none" stroke="#3d6b6b" stroke-width="2"/>
<rect x="230" y="316" width="16" height="16" rx="3" fill="#c39a5f"/>
<text x="238" y="408" text-anchor="middle" font-size="13" fill="#5c5c5c">poster · pack · shelf-edge</text>

<!-- Panel B: TAP -->
<rect x="450" y="200" width="300" height="252" rx="14" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<rect x="450" y="200" width="300" height="8" rx="4" fill="#3d6b6b"/>
<text x="600" y="244" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">2 · THE TAP</text>
<rect x="548" y="284" width="56" height="84" rx="9" fill="#ffffff" stroke="#2c5454" stroke-width="2.5"/>
<rect x="558" y="296" width="36" height="52" rx="3" fill="#eef5f5"/>
<path d="M 624 300 A 30 30 0 0 1 624 352" fill="none" stroke="#3d6b6b" stroke-width="2.6"/>
<path d="M 640 290 A 44 44 0 0 1 640 362" fill="none" stroke="#a9cccc" stroke-width="2.6"/>
<text x="600" y="408" text-anchor="middle" font-size="13" fill="#5c5c5c">detected in 200 ms</text>

<!-- Panel C: PAYOFF -->
<rect x="812" y="200" width="300" height="252" rx="14" fill="#eef7f0" stroke="#a9cfb5" stroke-width="2"/>
<rect x="812" y="200" width="300" height="8" rx="4" fill="#1f6f3a"/>
<text x="962" y="244" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">3 · IT CONVERTS</text>
<text x="962" y="332" text-anchor="middle" font-size="62" font-weight="800" fill="#1f6f3a">2-3x</text>
<text x="962" y="372" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">the tap-through of a QR code</text>
<text x="962" y="398" text-anchor="middle" font-size="13" fill="#5c5c5c">on the same display</text>

<!-- arrows -->
<line x1="392" y1="326" x2="442" y2="326" stroke="#291c0e" stroke-width="3"/>
<polygon points="442,319 458,326 442,333" fill="#291c0e"/>
<line x1="754" y1="326" x2="804" y2="326" stroke="#291c0e" stroke-width="3"/>
<polygon points="804,319 820,326 804,333" fill="#291c0e"/>

<text x="600" y="512" text-anchor="middle" font-size="15.5" font-weight="700" fill="#291c0e">All for $0.08-$0.25 per sticker — and the destination URL is swappable server-side.</text>
<text x="600" y="556" text-anchor="middle" font-size="14" fill="#5c5c5c">No battery, no connectivity, no reprinting when the campaign changes.</text>
</svg>
