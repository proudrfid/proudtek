<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">What actually damages an RFID card versus the harmless things people fear</title>
<desc id="d">Two columns. The left column, what actually damages a card: sustained heat above about 70 degrees Celsius, repeated bending that fatigues the bond wire, punctures and hole-punching that cut the antenna, and industrial solvents such as acetone and MEK that dissolve the PVC. The right column, harmless myths: smartphone and MagSafe magnets, fridge and cabinet magnets, contact with another RFID card, EAS retail security gates, and airport security X-ray. The worst a strong magnet does is briefly detune the antenna, reducing read range until it is removed.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">DAMAGE VS URBAN LEGEND</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">The boring physical stuff kills cards. The scary magnets do not.</text>

<!-- LEFT: actually damages -->
<rect x="60" y="116" width="524" height="500" rx="16" fill="#fdfaf9" stroke="#e6dfd2" stroke-width="2"/>
<rect x="60" y="116" width="524" height="46" rx="16" fill="#8b2d2d"/>
<rect x="60" y="146" width="524" height="16" fill="#8b2d2d"/>
<text x="322" y="146" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#ffffff">ACTUALLY DAMAGES</text>

<g transform="translate(104,214)"><line x1="-9" y1="-9" x2="9" y2="9" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/><line x1="-9" y1="9" x2="9" y2="-9" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/></g>
<text x="140" y="206" font-size="15.5" font-weight="800" fill="#291c0e">Sustained heat</text>
<text x="140" y="228" font-size="12.5" fill="#5c5c5c">PVC warps around 70 °C; a summer dashboard hits 75-80 °C.</text>

<g transform="translate(104,284)"><line x1="-9" y1="-9" x2="9" y2="9" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/><line x1="-9" y1="9" x2="9" y2="-9" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/></g>
<text x="140" y="276" font-size="15.5" font-weight="800" fill="#291c0e">Repeated bending</text>
<text x="140" y="298" font-size="12.5" fill="#5c5c5c">The chip-to-antenna bond wire fatigues and snaps.</text>

<g transform="translate(104,354)"><line x1="-9" y1="-9" x2="9" y2="9" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/><line x1="-9" y1="9" x2="9" y2="-9" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/></g>
<text x="140" y="346" font-size="15.5" font-weight="800" fill="#291c0e">Punctures &amp; hole-punches</text>
<text x="140" y="368" font-size="12.5" fill="#5c5c5c">A punch through the module cuts the antenna trace.</text>

<g transform="translate(104,424)"><line x1="-9" y1="-9" x2="9" y2="9" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/><line x1="-9" y1="9" x2="9" y2="-9" stroke="#8b2d2d" stroke-width="3" stroke-linecap="round"/></g>
<text x="140" y="416" font-size="15.5" font-weight="800" fill="#291c0e">Industrial solvents</text>
<text x="140" y="438" font-size="12.5" fill="#5c5c5c">Acetone, MEK and brake cleaner dissolve the PVC body.</text>

<rect x="92" y="486" width="460" height="98" rx="12" fill="#f7e7e7" stroke="#c98b8b" stroke-width="1.4"/>
<text x="322" y="518" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">All four are mechanical or chemical.</text>
<text x="322" y="542" text-anchor="middle" font-size="12.5" fill="#5c5c5c">For outdoor or industrial use, specify epoxy or</text>
<text x="322" y="562" text-anchor="middle" font-size="12.5" fill="#5c5c5c">anti-vandal tokens rated to 200 °C+.</text>

<!-- RIGHT: harmless -->
<rect x="616" y="116" width="524" height="500" rx="16" fill="#fafdfb" stroke="#e6dfd2" stroke-width="2"/>
<rect x="616" y="116" width="524" height="46" rx="16" fill="#1f6f3a"/>
<rect x="616" y="146" width="524" height="16" fill="#1f6f3a"/>
<text x="878" y="146" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="0.5" fill="#ffffff">HARMLESS MYTHS</text>

<g transform="translate(660,199)"><path d="M -8 0 L -2 6 L 9 -7" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="696" y="204" font-size="15" font-weight="700" fill="#291c0e">Smartphone &amp; MagSafe magnets</text>

<g transform="translate(660,255)"><path d="M -8 0 L -2 6 L 9 -7" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="696" y="260" font-size="15" font-weight="700" fill="#291c0e">Fridge &amp; cabinet magnets</text>

<g transform="translate(660,311)"><path d="M -8 0 L -2 6 L 9 -7" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="696" y="316" font-size="15" font-weight="700" fill="#291c0e">Contact with another RFID card</text>

<g transform="translate(660,367)"><path d="M -8 0 L -2 6 L 9 -7" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="696" y="372" font-size="15" font-weight="700" fill="#291c0e">EAS retail security gates</text>

<g transform="translate(660,423)"><path d="M -8 0 L -2 6 L 9 -7" fill="none" stroke="#1f6f3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="696" y="428" font-size="15" font-weight="700" fill="#291c0e">Airport security X-ray</text>

<rect x="648" y="486" width="460" height="98" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.4"/>
<text x="878" y="518" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6f3a">The worst a magnet can do:</text>
<text x="878" y="542" text-anchor="middle" font-size="12.5" fill="#5c5c5c">briefly detune the antenna, so read range dips —</text>
<text x="878" y="562" text-anchor="middle" font-size="12.5" fill="#5c5c5c">then recovers the moment it is removed.</text>
</svg>
