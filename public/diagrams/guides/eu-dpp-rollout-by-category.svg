<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="dppr-t dppr-d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="dppr-t">EU DPP rollout by product category, 2026 to 2030</title>
  <desc id="dppr-d">EU Digital Product Passport rollout by product category from 2026 to 2030, driven by ESPR (Regulation (EU) 2024/1781) delegated acts. Iron and steel: delegated act 2026. Batteries and EV: battery passport mandatory 18 February 2027 under the Battery Regulation. Textiles, aluminium and tyres: 2027. Consumer electronics repairability: 2027. Construction products: expected 2027-2028. Furniture: 2028. Mattresses: 2029. Toys: 2029-2030 after a 30-month transition. 2027 is the battery passport date, not a universal DPP deadline.</desc>
  <defs><radialGradient id="dpprbg" cx="50%" cy="16%" r="95%"><stop offset="0%" stop-color="#f8f0df"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
