<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The four-line CFO-grade ROI model for RFID inventory counting</title>
<desc id="d">A ledger with four lines that net to an annual benefit. Line 1, direct labour savings: 236 hours per year saved, worth $5,900-$10,600. Line 2, accuracy revenue lift: plus 20 points, discounted 50% in year 1, worth $100K-$200K. Line 3, shrink reduction: 1 point of $5M revenue, worth $50K. Line 4, subtracted capex and opex: $50K-$200K spread over 5-7 years plus tags at $0.05-$0.15 and SaaS at $3K-$25K. A sensitivity footer runs base, realistic at 60-70%, and stress at 40-50%, with payback under 12 or 30 months clearing most CFO hurdles.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE CFO-GRADE ROI MODEL</text>
<text x="600" y="80" text-anchor="middle" font-size="16" fill="#4f4f4f">Four lines finance actually accepts — labour, accuracy, shrink, minus capex.</text>

<!-- LINE 1 -->
<circle cx="108" cy="132" r="17" fill="#eef7f0" stroke="#1f6f3a" stroke-width="2"/>
<text x="108" y="139" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6f3a">+</text>
<text x="140" y="128" font-size="15.5" font-weight="800" fill="#291c0e">Direct labour savings</text>
<text x="140" y="149" font-size="12.5" fill="#5c5c5c">236 hrs/yr saved (288 manual → 52 RFID)</text>
<rect x="724" y="110" width="406" height="44" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<text x="927" y="138" text-anchor="middle" font-size="16" font-weight="800" fill="#1f6f3a">$5,900-$10,600 / yr</text>

<!-- LINE 2 -->
<circle cx="108" cy="196" r="17" fill="#eef7f0" stroke="#1f6f3a" stroke-width="2"/>
<text x="108" y="203" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6f3a">+</text>
<text x="140" y="192" font-size="15.5" font-weight="800" fill="#291c0e">Accuracy revenue lift</text>
<text x="140" y="213" font-size="12.5" fill="#5c5c5c">+20 pts on $5M revenue; discount 50% in yr 1</text>
<rect x="724" y="174" width="406" height="44" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<text x="927" y="202" text-anchor="middle" font-size="16" font-weight="800" fill="#1f6f3a">$100K-$200K / yr</text>

<!-- LINE 3 -->
<circle cx="108" cy="260" r="17" fill="#eef7f0" stroke="#1f6f3a" stroke-width="2"/>
<text x="108" y="267" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6f3a">+</text>
<text x="140" y="256" font-size="15.5" font-weight="800" fill="#291c0e">Shrink reduction</text>
<text x="140" y="277" font-size="12.5" fill="#5c5c5c">1 point of $5M revenue recovered as margin</text>
<rect x="724" y="238" width="406" height="44" rx="12" fill="#eef7f0" stroke="#a9cfb5" stroke-width="1.5"/>
<text x="927" y="266" text-anchor="middle" font-size="16" font-weight="800" fill="#1f6f3a">$50K / yr</text>

<!-- LINE 4 -->
<circle cx="108" cy="324" r="17" fill="#f7ecec" stroke="#8b2d2d" stroke-width="2"/>
<text x="108" y="331" text-anchor="middle" font-size="22" font-weight="800" fill="#8b2d2d">&#8722;</text>
<text x="140" y="320" font-size="15.5" font-weight="800" fill="#291c0e">Capex + recurring opex</text>
<text x="140" y="341" font-size="12.5" fill="#5c5c5c">tags $0.05-$0.15/unit · SaaS $3K-$25K/yr</text>
<rect x="724" y="302" width="406" height="44" rx="12" fill="#f7ecec" stroke="#e2c3c3" stroke-width="1.5"/>
<text x="927" y="330" text-anchor="middle" font-size="16" font-weight="800" fill="#8b2d2d">$50K-$200K over 5-7 yr</text>

<!-- NET band -->
<rect x="70" y="372" width="1060" height="54" rx="14" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.8"/>
<text x="600" y="405" text-anchor="middle" font-size="16.5" font-weight="800" fill="#a07d43">= NET ANNUAL BENEFIT PER SITE — the three gains, minus capex and opex, at steady state</text>

<!-- sensitivity footer -->
<rect x="70" y="448" width="1060" height="92" rx="14" fill="#eef1f5" stroke="#d5dbe3" stroke-width="1.5"/>
<text x="600" y="482" text-anchor="middle" font-size="14.5" font-weight="800" letter-spacing="0.3" fill="#3a4453">SENSITIVITY — base · realistic 60-70% of vendor · stress 40-50%</text>
<text x="600" y="510" text-anchor="middle" font-size="14" fill="#4f4f4f">Payback under 12 months (base) or under 30 months (stress) clears most CFO hurdles.</text>
<text x="600" y="530" text-anchor="middle" font-size="13" fill="#5c5c5c">Base case over 24 months? Shrink the pilot to a higher-impact SKU subset instead.</text>

<text x="600" y="580" text-anchor="middle" font-size="14.5" font-weight="700" fill="#291c0e">Vendor calculators overestimate 2-3x — this model prices in ramp, mixed tagging and exceptions.</text>
</svg>
