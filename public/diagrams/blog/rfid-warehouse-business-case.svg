<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The barcode-to-RFID warehouse business case, before and after</title>
<desc id="d">Four before-and-after metrics. Inventory accuracy rises from a barcode-typical 70 to 85 percent to 95 to 99 percent. Re-labeling labor of about 180 hours a year is reclaimed. Shipping errors costing 50 to 300 dollars each are avoided. Cycle-count speed goes from a 1x baseline to 3 to 5 times faster with bulk scanning. Below, the Auburn RFID Lab Project Zipper study found legacy UPC order audits failed on 69 percent of orders versus under 0.01 percent for EPC/RFID.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">THE BUSINESS CASE · BEFORE &#8594; AFTER</text>
<text x="600" y="82" text-anchor="middle" font-size="16" fill="#4f4f4f">What the peeling label was quietly costing you.</text>

<text x="90" y="120" font-size="12.5" font-weight="800" letter-spacing="1" fill="#6d5a3a">METRIC</text>
<text x="631" y="120" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#8b2d2d">BARCODE</text>
<text x="867" y="120" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="1" fill="#1f6f3a">RFID</text>

<!-- row 1 -->
<rect x="64" y="130" width="1072" height="58" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<text x="90" y="166" font-size="15" font-weight="700" fill="#291c0e">Inventory accuracy</text>
<rect x="556" y="139" width="150" height="40" rx="20" fill="#f4eaea" stroke="#e0c4c4" stroke-width="1.3"/>
<text x="631" y="165" text-anchor="middle" font-size="14" font-weight="800" fill="#8b2d2d">70-85%</text>
<line x1="716" y1="159" x2="758" y2="159" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="758,153 770,159 758,165" fill="#291c0e"/>
<rect x="772" y="139" width="190" height="40" rx="20" fill="#e7f2ea" stroke="#a9cfb5" stroke-width="1.3"/>
<text x="867" y="165" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">95-99%</text>

<!-- row 2 -->
<rect x="64" y="198" width="1072" height="58" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<text x="90" y="234" font-size="15" font-weight="700" fill="#291c0e">Re-labeling labor</text>
<rect x="556" y="207" width="150" height="40" rx="20" fill="#f4eaea" stroke="#e0c4c4" stroke-width="1.3"/>
<text x="631" y="233" text-anchor="middle" font-size="14" font-weight="800" fill="#8b2d2d">180 hrs/yr</text>
<line x1="716" y1="227" x2="758" y2="227" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="758,221 770,227 758,233" fill="#291c0e"/>
<rect x="772" y="207" width="190" height="40" rx="20" fill="#e7f2ea" stroke="#a9cfb5" stroke-width="1.3"/>
<text x="867" y="233" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">reclaimed</text>

<!-- row 3 -->
<rect x="64" y="266" width="1072" height="58" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<text x="90" y="302" font-size="15" font-weight="700" fill="#291c0e">Shipping error cost</text>
<rect x="556" y="275" width="150" height="40" rx="20" fill="#f4eaea" stroke="#e0c4c4" stroke-width="1.3"/>
<text x="631" y="301" text-anchor="middle" font-size="14" font-weight="800" fill="#8b2d2d">$50-300 each</text>
<line x1="716" y1="295" x2="758" y2="295" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="758,289 770,295 758,301" fill="#291c0e"/>
<rect x="772" y="275" width="190" height="40" rx="20" fill="#e7f2ea" stroke="#a9cfb5" stroke-width="1.3"/>
<text x="867" y="301" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">avoided</text>

<!-- row 4 -->
<rect x="64" y="334" width="1072" height="58" rx="10" fill="#faf7f0" stroke="#eadfce" stroke-width="1.2"/>
<text x="90" y="370" font-size="15" font-weight="700" fill="#291c0e">Cycle-count speed</text>
<rect x="556" y="343" width="150" height="40" rx="20" fill="#f4eaea" stroke="#e0c4c4" stroke-width="1.3"/>
<text x="631" y="369" text-anchor="middle" font-size="14" font-weight="800" fill="#8b2d2d">1x baseline</text>
<line x1="716" y1="363" x2="758" y2="363" stroke="#291c0e" stroke-width="2.5"/>
<polygon points="758,357 770,363 758,369" fill="#291c0e"/>
<rect x="772" y="343" width="190" height="40" rx="20" fill="#e7f2ea" stroke="#a9cfb5" stroke-width="1.3"/>
<text x="867" y="369" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6f3a">3-5x faster</text>

<!-- Auburn callout -->
<rect x="100" y="410" width="1000" height="112" rx="12" fill="#f7f3ea" stroke="#e4d8bf" stroke-width="1.5"/>
<text x="600" y="438" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#6d5a3a">AUBURN RFID LAB · PROJECT ZIPPER (8 BRANDS + 5 RETAILERS, 10 MONTHS)</text>
<line x1="600" y1="452" x2="600" y2="506" stroke="#e4d8bf" stroke-width="1.5"/>
<text x="340" y="486" text-anchor="middle" font-size="30" font-weight="800" fill="#8b2d2d">69%</text>
<text x="340" y="508" text-anchor="middle" font-size="12.5" fill="#5c5c5c">of legacy UPC orders failed audit</text>
<text x="860" y="486" text-anchor="middle" font-size="27" font-weight="800" fill="#1f6f3a">under 0.01%</text>
<text x="860" y="508" text-anchor="middle" font-size="12.5" fill="#5c5c5c">failure with EPC / RFID</text>

<text x="600" y="556" text-anchor="middle" font-size="14.5" fill="#5c5c5c">The tag price is the small number. The costs it removes are the big ones.</text>
</svg>
