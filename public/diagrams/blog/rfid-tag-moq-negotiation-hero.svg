<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The posted RFID MOQ is a starting point: four levers unlock sub-MOQ factory pricing</title>
<desc id="d">A left-to-right concept. On the left, the posted MOQ, typically 5K to 50K units, framed as the factory's opening position rather than a locked door. In the middle, four buyer levers: a blanket order, multi-SKU bundling, paying tooling separately, and converting a sample run. On the right, the outcome: factory pricing at 30 to 70 percent of the posted MOQ.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">MOQ STRATEGY · A STARTING POINT, NOT A WALL</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">The posted minimum is the factory's opening position — most of it is negotiable.</text>

<!-- LEFT · posted MOQ -->
<rect x="64" y="150" width="300" height="372" rx="14" fill="#eef0f4" stroke="#d4dae2" stroke-width="1.8"/>
<rect x="64" y="150" width="300" height="8" rx="4" fill="#4a5568"/>
<text x="214" y="192" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.5" fill="#3a4457">POSTED MOQ</text>
<text x="214" y="214" text-anchor="middle" font-size="12.5" fill="#5c5c5c">the factory's opening ask</text>
<rect x="150" y="250" width="128" height="150" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="2.2"/>
<line x1="214" y1="250" x2="214" y2="400" stroke="#d4dae2" stroke-width="1.6"/>
<circle cx="198" cy="326" r="6" fill="#4a5568"/>
<text x="214" y="446" text-anchor="middle" font-size="26" font-weight="800" fill="#3a4457">5K–50K</text>
<text x="214" y="474" text-anchor="middle" font-size="13" fill="#5c5c5c">units, typical</text>

<!-- MIDDLE · levers -->
<text x="600" y="150" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">YOUR LEVERS</text>
<rect x="432" y="168" width="336" height="58" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="600" y="203" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">Blanket order · monthly draws</text>
<rect x="432" y="238" width="336" height="58" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="600" y="273" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">Multi-SKU bundling</text>
<rect x="432" y="308" width="336" height="58" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="600" y="343" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">Pay tooling separately</text>
<rect x="432" y="378" width="336" height="58" rx="12" fill="#eef5f5" stroke="#cfe0e0" stroke-width="1.6"/>
<text x="600" y="413" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5454">Convert a sample run</text>
<text x="600" y="470" text-anchor="middle" font-size="13" fill="#5c5c5c">Each lever dissolves one real cost driver.</text>

<!-- RIGHT · outcome -->
<rect x="804" y="150" width="332" height="372" rx="14" fill="#eaf3ec" stroke="#c4dccb" stroke-width="1.8"/>
<rect x="804" y="150" width="332" height="8" rx="4" fill="#2d6a4f"/>
<text x="970" y="192" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.5" fill="#1b4332">FACTORY PRICING</text>
<text x="970" y="214" text-anchor="middle" font-size="12.5" fill="#5c5c5c">at sub-MOQ volume</text>
<text x="970" y="352" text-anchor="middle" font-size="60" font-weight="800" fill="#2c5454">30–70%</text>
<text x="970" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#1b4332">of the posted MOQ</text>
<rect x="838" y="430" width="264" height="40" rx="10" fill="#ffffff" stroke="#c4dccb" stroke-width="1.3"/>
<text x="970" y="455" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1b4332">at a fair, negotiated premium</text>

<!-- arrows -->
<line x1="372" y1="336" x2="424" y2="336" stroke="#291c0e" stroke-width="3"/><polygon points="424,328 442,336 424,344" fill="#291c0e"/>
<line x1="776" y1="336" x2="796" y2="336" stroke="#291c0e" stroke-width="3"/><polygon points="796,328 814,336 796,344" fill="#291c0e"/>

<text x="600" y="560" text-anchor="middle" font-size="14.5" fill="#4f4f4f">"We can't do that" usually means "we haven't priced it yet."</text>
</svg>
