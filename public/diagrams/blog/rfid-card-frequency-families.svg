<text x="133" y="304" font-size="13.5" fill="#4f4f4f">Range</text>
<text x="397" y="304" text-anchor="end" font-size="14" font-weight="700" fill="#291c0e">5-15 cm</text>
<text x="133" y="340" font-size="13.5" fill="#4f4f4f">Phone tap</text>
<text x="397" y="340" text-anchor="end" font-size="14" font-weight="700" fill="#4f4f4f">no</text>
<text x="133" y="376" font-size="13.5" fill="#4f4f4f">Chip cost</text>
<text x="397" y="376" text-anchor="end" font-size="14" font-weight="700" fill="#291c0e">$0.05-$0.15</text>
<text x="133" y="428" font-size="12.5" fill="#4f4f4f">HID Prox · EM4100 · T5577</text>

<text x="468" y="304" font-size="13.5" fill="#4f4f4f">Range</text>
<text x="732" y="304" text-anchor="end" font-size="14" font-weight="700" fill="#291c0e">tap distance</text>
<text x="468" y="340" font-size="13.5" fill="#4f4f4f">Phone tap</text>
<text x="732" y="340" text-anchor="end" font-size="14" font-weight="700" fill="#1f6f3a">every phone</text>
<text x="468" y="376" font-size="13.5" fill="#4f4f4f">Chip cost</text>
<text x="732" y="376" text-anchor="end" font-size="14" font-weight="700" fill="#291c0e">$0.05-$1.40</text>
<text x="468" y="428" font-size="12.5" fill="#4f4f4f">NTAG · MIFARE · DESFire</text>

<text x="803" y="304" font-size="13.5" fill="#4f4f4f">Range</text>
<text x="1067" y="304" text-anchor="end" font-size="14" font-weight="700" fill="#291c0e">3-12 m</text>
<text x="803" y="340" font-size="13.5" fill="#4f4f4f">Phone tap</text>
<text x="1067" y="340" text-anchor="end" font-size="14" font-weight="700" fill="#6d5a3a">sled only</text>
<text x="803" y="376" font-size="13.5" fill="#4f4f4f">Chip cost</text>
<text x="1067" y="376" text-anchor="end" font-size="14" font-weight="700" fill="#291c0e">$0.012-$0.020</text>
<text x="803" y="428" font-size="12.5" fill="#4f4f4f">UCODE 9 · Impinj M730/M770</text>

<rect x="137" y="470" width="256" height="36" rx="18" fill="#ffffff" stroke="#c99a9a" stroke-width="1.5"/>
<text x="265" y="493" text-anchor="middle" font-size="13" font-weight="700" fill="#8b2d2d">no encryption — clones trivially</text>
<rect x="472" y="470" width="256" height="36" rx="18" fill="#ffffff" stroke="#3d6b6b" stroke-width="1.5"/>
<text x="600" y="493" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5454">the default smart-card band</text>
<rect x="807" y="470" width="256" height="36" rx="18" fill="#ffffff" stroke="#d3dae3" stroke-width="1.5"/>
<text x="935" y="493" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">long range, dirt cheap</text>

<text x="600" y="608" text-anchor="middle" font-size="14" font-weight="600" fill="#291c0e">Your phone only ever speaks to the middle one — that's why an HF hotel key taps but a UHF parking tag doesn't.</text>
</svg>
