<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Five independent inventory-accuracy benchmarks, manual/legacy versus RFID</title>
<desc id="d">A three-column table comparing manual or legacy figures with RFID results across five published studies. Auburn Project Zipper order-audit inaccuracy: 69% legacy versus under 0.01% with EPC/RFID. GS1 US retail inventory accuracy: 63% versus about 95%. Industry distribution centers per rfidtaghy: 65-85% versus 99.7-99.95%. Hospital equipment count per CPCON: two weeks with 30 staff versus two days with three technicians. Apparel 3PL Southern Fried Cotton chargebacks and carton accuracy: baseline versus 98% fewer chargebacks and 99.5% carton accuracy. The 32-point swing sits behind the Walmart, Target, Macy's and Nordstrom mandates.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="52" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">INDEPENDENT ACCURACY BENCHMARKS</text>
<text x="600" y="84" text-anchor="middle" font-size="16" fill="#4f4f4f">Five published studies, not vendor decks — numbers that survive an audit committee.</text>

<text x="100" y="140" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">SOURCE</text>
<text x="690" y="140" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#4a5568">MANUAL / LEGACY</text>
<text x="980" y="140" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.5" fill="#1f6f3a">WITH RFID / EPC</text>

<rect x="64" y="156" width="1072" height="64" rx="10" fill="#f7f6f3" stroke="#ece7db" stroke-width="1.2"/>
<text x="100" y="184" font-size="14.5" font-weight="700" fill="#291c0e">Auburn — Project Zipper</text>
<text x="100" y="205" font-size="12" fill="#5c5c5c">order-audit inaccuracy</text>
<text x="690" y="196" text-anchor="middle" font-size="17" font-weight="800" fill="#4a5568">69%</text>
<text x="980" y="196" text-anchor="middle" font-size="17" font-weight="800" fill="#1f6f3a">&lt;0.01%</text>

<rect x="64" y="228" width="1072" height="64" rx="10" fill="#fbfaf7" stroke="#ece7db" stroke-width="1.2"/>
<text x="100" y="256" font-size="14.5" font-weight="700" fill="#291c0e">GS1 US baseline</text>
<text x="100" y="277" font-size="12" fill="#5c5c5c">retail inventory accuracy</text>
<text x="690" y="268" text-anchor="middle" font-size="17" font-weight="800" fill="#4a5568">63%</text>
<text x="980" y="268" text-anchor="middle" font-size="17" font-weight="800" fill="#1f6f3a">~95%</text>

<rect x="64" y="300" width="1072" height="64" rx="10" fill="#f7f6f3" stroke="#ece7db" stroke-width="1.2"/>
<text x="100" y="328" font-size="14.5" font-weight="700" fill="#291c0e">Industry DCs — rfidtaghy</text>
<text x="100" y="349" font-size="12" fill="#5c5c5c">inventory accuracy</text>
<text x="690" y="340" text-anchor="middle" font-size="17" font-weight="800" fill="#4a5568">65-85%</text>
<text x="980" y="340" text-anchor="middle" font-size="17" font-weight="800" fill="#1f6f3a">99.7-99.95%</text>

<rect x="64" y="372" width="1072" height="64" rx="10" fill="#fbfaf7" stroke="#ece7db" stroke-width="1.2"/>
<text x="100" y="400" font-size="14.5" font-weight="700" fill="#291c0e">Hospital equipment — CPCON</text>
<text x="100" y="421" font-size="12" fill="#5c5c5c">count time &amp; staff</text>
<text x="690" y="412" text-anchor="middle" font-size="16" font-weight="800" fill="#4a5568">2 wks · 30 staff</text>
<text x="980" y="412" text-anchor="middle" font-size="16" font-weight="800" fill="#1f6f3a">2 days · 3 techs</text>

<rect x="64" y="444" width="1072" height="64" rx="10" fill="#f7f6f3" stroke="#ece7db" stroke-width="1.2"/>
<text x="100" y="472" font-size="14.5" font-weight="700" fill="#291c0e">Apparel 3PL — Southern Fried Cotton</text>
<text x="100" y="493" font-size="12" fill="#5c5c5c">chargebacks / carton accuracy</text>
<text x="690" y="484" text-anchor="middle" font-size="15" font-weight="700" fill="#8a7a5a">baseline</text>
<text x="980" y="484" text-anchor="middle" font-size="16" font-weight="800" fill="#1f6f3a">−98% · 99.5%</text>

<line x1="548" y1="156" x2="548" y2="508" stroke="#ece7db" stroke-width="1.2"/>
<line x1="838" y1="156" x2="838" y2="508" stroke="#ece7db" stroke-width="1.2"/>

<text x="600" y="558" text-anchor="middle" font-size="14.5" fill="#4f4f4f">The 32-point swing behind the Walmart, Target, Macy's and Nordstrom mandates.</text>
</svg>
