<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">How LF at 125 kHz couples through metal, water and tissue</title>
<desc id="d">Near-field coupling diagram. A reader coil on the left links to a key-fob tag on the right through magnetic loop rings. A ruler underneath shows the working range of 0 to 10 centimetres. Verdict pills report: excellent through water, tissue and soil; barely fazed by metal; 1-10 kbit/s is slow but enough; the trade-off is one tag at a time. Caption: pet microchips work because LF sails through living tissue.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">LF · 125 kHz · NEAR-FIELD COUPLING</text>
<text x="600" y="98" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" fill="#291c0e">Magnetic loops: tiny range, zero drama around metal and water</text>

<rect x="130" y="200" width="200" height="180" rx="14" fill="#f9f1e2" stroke="#c39a5f" stroke-width="2.5"/>
<circle cx="230" cy="290" r="52" fill="none" stroke="#c39a5f" stroke-width="3"/>
<circle cx="230" cy="290" r="34" fill="none" stroke="#c39a5f" stroke-width="2.5" opacity="0.7"/>
<circle cx="230" cy="290" r="16" fill="none" stroke="#c39a5f" stroke-width="2" opacity="0.5"/>
<text x="230" y="412" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Reader coil</text>
<text x="230" y="434" text-anchor="middle" font-size="13" fill="#4f4f4f">powers the tag by induction</text>

<ellipse cx="475" cy="290" rx="90" ry="46" fill="none" stroke="#3d6b6b" stroke-width="2.5" opacity="0.8"/>
<ellipse cx="560" cy="290" rx="130" ry="66" fill="none" stroke="#3d6b6b" stroke-width="2" opacity="0.5"/>
<ellipse cx="645" cy="290" rx="170" ry="86" fill="none" stroke="#3d6b6b" stroke-width="1.5" opacity="0.3"/>
<text x="560" y="180" text-anchor="middle" font-size="13.5" fill="#2c5454">magnetic field loops — the tag lives inside them, or nothing happens</text>

<rect x="790" y="238" width="120" height="84" rx="18" fill="#ffffff" stroke="#2c5454" stroke-width="2.5"/>
<circle cx="830" cy="280" r="22" fill="none" stroke="#c39a5f" stroke-width="2.5"/>
<circle cx="830" cy="280" r="9" fill="#c39a5f"/>
<circle cx="884" cy="280" r="7" fill="none" stroke="#4f4f4f" stroke-width="2"/>
<text x="850" y="352" text-anchor="middle" font-size="15.5" font-weight="600" fill="#291c0e">Fob / ear tag / pet chip</text>
<text x="850" y="374" text-anchor="middle" font-size="13" fill="#4f4f4f">EM4100 · T5577 · HID Prox</text>

<line x1="130" y1="470" x2="910" y2="470" stroke="#4f4f4f" stroke-width="1.5"/>
<line x1="130" y1="462" x2="130" y2="478" stroke="#4f4f4f" stroke-width="1.5"/>
<line x1="520" y1="464" x2="520" y2="476" stroke="#4f4f4f" stroke-width="1.5"/>
<line x1="910" y1="462" x2="910" y2="478" stroke="#4f4f4f" stroke-width="1.5"/>
<text x="130" y="498" text-anchor="middle" font-size="13.5" fill="#4f4f4f">0 cm</text>
<text x="520" y="498" text-anchor="middle" font-size="13.5" fill="#4f4f4f">5 cm</text>
<text x="910" y="498" text-anchor="middle" font-size="13.5" fill="#4f4f4f">10 cm</text>
<text x="1030" y="474" font-size="14.5" font-weight="700" fill="#6d5a3a">whole working range</text>

<g font-size="14" font-weight="600">
<rect x="120" y="530" width="230" height="36" rx="18" fill="#eaf5ec" stroke="#2d6a4f"/>
<text x="235" y="553" text-anchor="middle" fill="#1b4332">✓ water · tissue · soil</text>
<rect x="370" y="530" width="230" height="36" rx="18" fill="#eaf5ec" stroke="#2d6a4f"/>
<text x="485" y="553" text-anchor="middle" fill="#1b4332">✓ barely fazed by metal</text>
<rect x="620" y="530" width="250" height="36" rx="18" fill="#f9f1e2" stroke="#c39a5f"/>
<text x="745" y="553" text-anchor="middle" fill="#6d5a3a">1–10 kbit/s · slow but enough</text>
<rect x="890" y="530" width="220" height="36" rx="18" fill="#f6ebeb" stroke="#8b2d2d"/>
<text x="1000" y="553" text-anchor="middle" fill="#8b2d2d">✗ one tag at a time</text>
</g>
<text x="600" y="620" text-anchor="middle" font-size="14" fill="#5c5c5c">Best cocktail-party fact: your cat's rice-grain chip works because LF sails through living tissue like it isn't there.</text>
</svg>
