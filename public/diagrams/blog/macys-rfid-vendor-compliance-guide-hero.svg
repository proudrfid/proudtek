<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">Macy's RFID vendor compliance — the dock handshake</title>
<desc id="d">An RFID-tagged garment approaches a receiving-DC scanner gate. A hang tag on the shirt carries an RFID inlay; radio arcs travel from the tag toward the gate carrying three data pills — EPC verified, SGTIN-96 encoding and the 95% read-rate target. Past the gate, a rotated APPROVED stamp: pass the read-rate handshake at the dock and the shipment keeps moving.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
