<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">The RFID shrinkage business case in three proof points</title>
<desc id="d">Three panels. Inventory accuracy rises from 85 to 90 percent on barcode-only to 95 to 99 percent with RFID. Shrinkage falls 50 to 75 percent under item-level verification. Payback typically lands in 6 to 18 months once annual shrinkage exposure tops 500 thousand dollars.</desc>
<defs><radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="56" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">WHAT THE DATA SAYS</text>
<text x="600" y="86" text-anchor="middle" font-size="16" fill="#4f4f4f">Accuracy up, shrinkage down, payback inside eighteen months.</text>
<rect x="76" y="168" width="336" height="300" rx="14" fill="#ffffff" stroke="#d3dae3" stroke-width="1.8"/><rect x="76" y="168" width="336" height="8" rx="4" fill="#4a5568"/>
<text x="244" y="208" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4453">Inventory accuracy</text>
<text x="100" y="262" text-anchor="start" font-size="12.5" font-weight="700" fill="#291c0e">Barcode only</text>
<rect x="100" y="270" width="150" height="26" rx="6" fill="#9aa6b5"/>
<text x="240" y="288" text-anchor="end" font-size="13" font-weight="800" fill="#ffffff">85-90%</text>
<text x="100" y="332" text-anchor="start" font-size="12.5" font-weight="700" fill="#291c0e">RFID-enabled</text>
<rect x="100" y="340" width="236" height="26" rx="6" fill="#1f6f3a"/>
<text x="326" y="358" text-anchor="end" font-size="13" font-weight="800" fill="#ffffff">95-99%</text>
<text x="244" y="410" text-anchor="middle" font-size="12.5" fill="#5c5c5c">continuous read coverage</text>
<rect x="432" y="168" width="336" height="300" rx="14" fill="#ffffff" stroke="#d3dae3" stroke-width="1.8"/><rect x="432" y="168" width="336" height="8" rx="4" fill="#4a5568"/>
<text x="600" y="208" text-anchor="middle" font-size="15" font-weight="800" fill="#3a4453">Shrinkage reduction</text>
<text x="600" y="300" text-anchor="middle" font-size="46" font-weight="800" fill="#3a4453">50-75%</text>
<text x="600" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#291c0e">at item-level verification</text>
<rect x="475.0" y="378" width="250" height="32" rx="16.0" fill="#eef1f5" stroke="#d3dae3" stroke-width="1.2"/><text x="600" y="398.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#3a4453">receiving + put-away + ship</text>
<rect x="788" y="168" width="336" height="300" rx="14" fill="#fffdf7" stroke="#e4c98f" stroke-width="1.8"/><rect x="788" y="168" width="336" height="8" rx="4" fill="#c39a5f"/>
<text x="956" y="208" text-anchor="middle" font-size="15" font-weight="800" fill="#6d5a3a">Typical payback</text>
<text x="956" y="296" text-anchor="middle" font-size="44" font-weight="800" fill="#3a4453">6-18 mo</text>
<text x="956" y="340" text-anchor="middle" font-size="13.5" font-weight="700" fill="#291c0e">when annual shrink tops $500K</text>
<rect x="826.0" y="374" width="260" height="32" rx="16.0" fill="#f7edd6" stroke="#e4c98f" stroke-width="1.2"/><text x="956" y="394.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d5a3a">mandate tag makes it faster</text>
<text x="600" y="516" text-anchor="middle" font-size="14.5" fill="#4f4f4f">Anchor the case to benchmarks, not vendor decks — that's what clears the CFO.</text>
</svg>
