<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title id="t">RFID warehouse labor savings — where the hours leak and what RFID returns</title>
<desc id="d">Left: where warehouse labor hours leak under manual workflows — receiving takes 15-30 minutes per pallet case by case, searching consumes 20-40% of worker hours, cycle counts tie up 2-5 FTEs, and pick errors cost $10-50 per incident to resolve. Right: what RFID returns — receiving drops to 3-5 seconds per pallet with 60-80% fewer receiving hours, picking accuracy rises from 97-98% to 99.5-99.9%, cycle counting shrinks to 0.5-1 FTE for exceptions only, and ship errors are cut 80-95% at the pack station. The compounding effect: total warehouse labor costs down 25-40%.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="16%" r="94%"><stop offset="0%" stop-color="#f8ead0"/><stop offset="100%" stop-color="#f4efe4"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="16" y="16" width="1168" height="643" rx="20" fill="#ffffff" stroke="#e6dfd2" stroke-width="2"/>
<text x="600" y="54" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.5" fill="#6d5a3a">RFID WAREHOUSE LABOR SAVINGS — WHERE THE HOURS GO</text>
<text x="600" y="96" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#291c0e">Attack the minutes, not the headcount</text>

<rect x="60" y="126" width="510" height="384" rx="16" fill="#f4f5f7" stroke="#4a5568" stroke-width="2"/>
<text x="315" y="162" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#4a5568">WHERE THE HOURS LEAK — MANUAL WORKFLOW</text>

<rect x="88" y="188" width="10" height="10" fill="#4a5568"/>
<text x="112" y="198" font-size="15" font-weight="700" fill="#291c0e">Receiving</text>
<text x="112" y="219" font-size="13" fill="#4f4f4f">15-30 minutes per pallet, scanned case by case</text>

<rect x="88" y="266" width="10" height="10" fill="#4a5568"/>
<text x="112" y="276" font-size="15" font-weight="700" fill="#291c0e">Searching</text>
<text x="112" y="297" font-size="13" fill="#4f4f4f">20-40% of worker hours spent hunting inventory</text>

<rect x="88" y="344" width="10" height="10" fill="#4a5568"/>
<text x="112" y="354" font-size="15" font-weight="700" fill="#291c0e">Cycle counts</text>
<text x="112" y="375" font-size="13" fill="#4f4f4f">2-5 FTEs dedicated to periodic manual counts</text>

<rect x="88" y="422" width="10" height="10" fill="#4a5568"/>
<text x="112" y="432" font-size="15" font-weight="700" fill="#291c0e">Pick errors</text>
<text x="112" y="453" font-size="13" fill="#4f4f4f">$10-50 to resolve each mis-pick incident</text>

<circle cx="600" cy="318" r="24" fill="#c39a5f"/>
<polygon points="590,318 606,318 606,311 618,318 606,325 606,318" fill="#ffffff"/>

<rect x="630" y="126" width="510" height="384" rx="16" fill="#eef5f5" stroke="#3d6b6b" stroke-width="2"/>
<text x="885" y="162" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="0.5" fill="#2c5454">WHAT RFID RETURNS</text>

<circle cx="663" cy="193" r="6" fill="#3d6b6b"/>
<text x="682" y="198" font-size="15" font-weight="700" fill="#291c0e">Receiving</text>
<text x="682" y="219" font-size="13" fill="#2c5454">3-5 seconds per pallet — 60-80% fewer hours</text>

<circle cx="663" cy="271" r="6" fill="#3d6b6b"/>
<text x="682" y="276" font-size="15" font-weight="700" fill="#291c0e">Picking accuracy</text>
<text x="682" y="297" font-size="13" fill="#2c5454">from 97-98% up to 99.5-99.9%, tag-verified</text>

<circle cx="663" cy="349" r="6" fill="#3d6b6b"/>
<text x="682" y="354" font-size="15" font-weight="700" fill="#291c0e">Cycle counts</text>
<text x="682" y="375" font-size="13" fill="#2c5454">0.5-1 FTE, exception investigation only</text>

<circle cx="663" cy="427" r="6" fill="#3d6b6b"/>
<text x="682" y="432" font-size="15" font-weight="700" fill="#291c0e">Ship errors</text>
<text x="682" y="453" font-size="13" fill="#2c5454">cut 80-95% by verification at the pack station</text>

<rect x="60" y="532" width="1080" height="76" rx="12" fill="#f9f1e2" stroke="#e4c98f" stroke-width="1.5"/>
<text x="600" y="563" text-anchor="middle" font-size="20" font-weight="800" fill="#291c0e">The compounding effect: 25-40% lower total warehouse labor costs</text>
<text x="600" y="589" text-anchor="middle" font-size="13.5" fill="#4f4f4f">faster receiving + accurate picking + continuous counting + recovered search time</text>

<text x="600" y="638" text-anchor="middle" font-size="13.5" fill="#5c5c5c">One facility, five processes, the same shift — the minutes come back before the headcount conversation starts.</text>
</svg>
