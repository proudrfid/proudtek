<rect x="60" y="428" width="6" height="82" rx="3" fill="#2c5454"/>
<text x="92" y="464" text-anchor="start" font-size="17" font-weight="800" fill="#291c0e">NFC + UHF dual-chip</text>
<text x="92" y="490" text-anchor="start" font-size="13.5" fill="#5c5c5c">Tap interactions + passive flow analytics on one badge</text>
<rect x="736" y="453" width="168" height="32" rx="16" fill="#e8f0ee" stroke="#bcd2cc" stroke-width="1.2"/>
